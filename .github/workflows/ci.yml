name: ci

on:
  workflow_call:
    inputs:
      go:
        type: boolean
        required: true
      web:
        type: boolean
        required: true
      py:
        type: boolean
        required: true
      warehouse:
        type: boolean
        required: true
      agents:
        type: boolean
        required: false
        default: false
      connect:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Cut Actions volume: a new push to a PR cancels that PR's superseded run;
# runs on main are never cancelled.
# Prefix with ci-: in a reusable workflow github.workflow is the *caller* name
# (`gate`), so `${{ github.workflow }}-${{ github.ref }}` matches gate.yml's
# `gate-${{ github.ref }}` group on push and the called workflow fails to start.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-prep:
    if: inputs.go
    name: go (vet)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'
          cache-dependency-path: '**/go.sum'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1
        with:
          version: 1.21.4
      - run: opa test --timeout 120s policies/authz
      - run: make vet
      - run: node --test data/cube/cube.test.js

  go-test:
    if: inputs.go
    name: go (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard:
          - pricing-store
          - identity
          - inventory-store
          - ledger-store
          - org-store
          - engineering-store
          - rest-0
          - rest-1
          - rest-2
    services:
      postgres:
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_PASSWORD: postgres
          # Queries must not depend on this locale: order text columns with collate "C".
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PASSAGE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      PASSAGE_TEST_APP_DATABASE_URL: postgres://passage_app:passage_app@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'
          cache-dependency-path: '**/go.sum'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1
        if: matrix.shard == 'identity'
        with:
          version: 1.21.4
      - run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f .github/postgres-test-setup.sql
      - run: bash deploy/ci/go-test-shard.sh ${{ matrix.shard }}

  go:
    if: always() && inputs.go
    needs: [go-prep, go-test]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every Go shard succeeded
        env:
          PREP: ${{ needs.go-prep.result }}
          TESTS: ${{ needs.go-test.result }}
        run: |
          [ "$PREP" = "success" ] || { echo "go-prep: $PREP"; exit 1; }
          [ "$TESTS" = "success" ] || { echo "go-test: $TESTS"; exit 1; }

  keycloak:
    if: inputs.go
    runs-on: ubuntu-24.04
    env:
      PASSAGE_TEST_KEYCLOAK_URL: http://localhost:8080
      PASSAGE_TEST_KEYCLOAK_ADMIN: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'
          cache-dependency-path: '**/go.sum'
      - run: |
          password="Kc-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "PASSAGE_TEST_KEYCLOAK_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - run: >-
          docker run -d --name keycloak -p 8080:8080
          -e KC_BOOTSTRAP_ADMIN_USERNAME="$PASSAGE_TEST_KEYCLOAK_ADMIN"
          -e KC_BOOTSTRAP_ADMIN_PASSWORD="$PASSAGE_TEST_KEYCLOAK_ADMIN_PASSWORD"
          -e KC_HOSTNAME_STRICT=false
          -v "$PWD/deploy/keycloak/realm-passage.json:/opt/keycloak/data/import/realm-passage.json:ro"
          quay.io/keycloak/keycloak:26.0.8 start-dev --import-realm
      - run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/realms/passage/.well-known/openid-configuration >/dev/null && exit 0
            sleep 3
          done
          docker logs keycloak
          exit 1
      - run: go test -count=1 -run 'Keycloak' -v ./...
        working-directory: services/identity
      - if: failure()
        run: docker logs keycloak

  lint:
    if: inputs.go
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # excluded until clean: services/close engineering fx migration org party payables tax,
        # tools/connectors.
        module: [platform/go, services/audit, services/batch, services/identity, services/metadata, services/numbering, services/platform-health, services/product, services/receiving, tools/importexport, tools/rlscheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'
          cache-dependency-path: '**/go.sum'
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}

  web:
    if: inputs.web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx vitest --run
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  warehouse-mobile:
    if: inputs.warehouse
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/warehouse-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/warehouse-mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Wave 47: agent runtime, MCP gateway and the eval harness (gate thresholds,
  # metrics, authorization and audit contract tests). `npm run eval` is not a
  # step: it gates the deterministic baselines, which fail the thresholds by
  # design until an agent predictor exists (evals/README.md).
  agents:
    name: agents (${{ matrix.package }})
    if: inputs.agents
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [services/agents-ts, services/mcp-ts, evals]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  py:
    name: py (${{ matrix.package }}, ortools=${{ matrix.ortools }})
    if: inputs.py
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: configurator-py
            ortools: true
            extras: test,ortools
          - package: configurator-py
            ortools: false
            extras: test
          - package: scheduler-py
            ortools: true
            extras: dev
          - package: dispatch-py
            ortools: false
            extras: dev
          - package: routing-py
            ortools: true
            extras: dev
    defaults:
      run:
        working-directory: services/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/${{ matrix.package }}/pyproject.toml
      - run: pip install -e '.[${{ matrix.extras }}]'
      - run: python -m pytest -q
        env:
          CONFIGURATOR_REQUIRE_ORTOOLS: ${{ matrix.package == 'configurator-py' && matrix.ortools && '1' || '' }}
          SCHEDULER_REQUIRE_ORTOOLS: ${{ matrix.package == 'scheduler-py' && matrix.ortools && '1' || '' }}

  charts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
      - run: helm lint services/platform-health/charts/hello-ledger services/receiving/charts/receiving services/fx/charts/fx services/org/charts/org services/identity/charts/identity
      - run: bash services/receiving/charts/receiving/test-env.sh
      - run: bash services/identity/charts/identity/test-networkpolicy.sh

  deploy-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: make -C deploy test-stage-release
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'
          cache: false
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - run: pip install pyyaml==6.0.2 && PATH="$(go env GOPATH)/bin:$PATH" make -C deploy test-gateway
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
      - run: make -C deploy test-argocd
      - name: Install Kyverno CLI
        env:
          KYVERNO_VERSION: 1.19.2
          KYVERNO_SHA256: 357eaf1df8bc24ddd5a73979fadeaae6a032e8710f11af264229756e4956bf4a
        run: |
          curl -fsSLo kyverno-cli.tar.gz "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  kyverno-cli.tar.gz" | sha256sum --check --strict
          sudo tar -xzf kyverno-cli.tar.gz -C /usr/local/bin kyverno
      - run: make -C deploy test-policies

  image:
    if: inputs.go && github.event_name != 'pull_request'
    needs: [go, lint, charts]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hello-ledger" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: services/platform-health/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          severity-cutoff: critical
          fail-build: true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign and attest the image digest
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE_REF"

  # passage-cloudevents-enricher SMT (deploy/kafka-connect/enricher): unit tests plus the chain test that
  # runs Debezium's EventRouter with the deploy/kafka/connect.yaml settings. The runner's default JDK is 17.
  enricher:
    if: inputs.connect
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: java -version && mvn -B -ntp verify
        working-directory: deploy/kafka-connect/enricher

  # Kafka Connect image deploy/kafka/connect.yaml runs (Strimzi Kafka 4.0.0 + Debezium Postgres + the enricher).
  # Pull requests only build it; main pushes the tag connect.yaml pins plus the commit sha, then signs it.
  connect-image:
    if: inputs.connect
    needs: [enricher]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/passage-connect"
          tag=$(sed -n 's|^  image: ghcr.io/benjaminsrussell/passage-connect:\(.*\)$|\1|p' deploy/kafka/connect.yaml)
          [ -n "$tag" ] || { echo "no passage-connect image tag in deploy/kafka/connect.yaml"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tags=$name:$tag,$name:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: deploy/kafka-connect
          file: deploy/kafka-connect/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.image.outputs.tags }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: env.PUSH == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - if: env.PUSH == 'true'
        name: Sign and attest the image digest
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE_REF"
