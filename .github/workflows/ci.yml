name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/shell/package-lock.json
      - name: Install delivery CLIs
        run: bash scripts/install-dev-tools.sh
      - name: Lint, test, chart, cluster module, negative gate
        run: make ci

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install supply-chain CLIs
        run: bash scripts/install-dev-tools.sh
      - name: Block an unsigned image, then admit a signed one
        run: bash scripts/supply-chain-negative.sh
