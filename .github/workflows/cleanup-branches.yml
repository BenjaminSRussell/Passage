name: cleanup-branches

# Manual only: deletes remote branches whose last commit is older than a cutoff
# date. Never deletes the default branch or a branch with an open pull request.
# Run it first with dry-run on (the default) and check the list in the run
# summary, then run it again with dry-run off.
on:
  workflow_dispatch:
    inputs:
      before:
        description: Delete branches whose last commit is before this date (YYYY-MM-DD, UTC)
        required: true
        type: string
      dry-run:
        description: Only list the branches that would be deleted
        required: true
        type: boolean
        default: true

concurrency:
  group: cleanup-branches
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Delete branches last committed before the cutoff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ inputs.before }}
          DRY_RUN: ${{ inputs.dry-run }}
          TZ: UTC
        run: |
          set -euo pipefail
          if ! [[ "$BEFORE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "before must be a date like 2026-11-10, got: $BEFORE"
            exit 1
          fi
          open_prs=$(gh pr list -R "$REPO" --state open --limit 1000 --json headRefName --jq '.[].headRefName')
          : > stale.txt
          : > kept.txt
          while read -r date name; do
            if [ "$name" = HEAD ] || [ "$name" = "$DEFAULT_BRANCH" ]; then
              continue
            fi
            if [[ ! "$date" < "$BEFORE" ]]; then
              continue
            fi
            if grep -qxF -- "$name" <<<"$open_prs"; then
              echo "$name (open pull request)" >> kept.txt
              continue
            fi
            echo "$name" >> stale.txt
          done < <(git for-each-ref --format='%(committerdate:format-local:%Y-%m-%d) %(refname:lstrip=3)' refs/remotes/origin)

          count=$(wc -l < stale.txt)
          {
            echo "### $count branches last committed before $BEFORE"
            if [ "$DRY_RUN" = true ]; then
              echo "Dry run: nothing was deleted. Run again with dry-run off to delete them."
            fi
            if [ -s kept.txt ]; then
              echo
              echo "Kept, older but with an open pull request:"
              sed 's/^/- /' kept.txt
            fi
            echo
            sed 's/^/- /' stale.txt
          } >> "$GITHUB_STEP_SUMMARY"
          cat stale.txt

          if [ "$DRY_RUN" = true ] || [ "$count" -eq 0 ]; then
            exit 0
          fi
          xargs -r -n 50 git push origin --delete < stale.txt
