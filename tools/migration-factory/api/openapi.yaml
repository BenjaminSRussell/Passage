  /api/v1/cutover/plans/{id}/go-no-go:
    get:
      operationId: getGoNoGoReadiness
      summary: The go/no-go checklist of a cutover plan evaluated now, with the decisions recorded so far
      description: |
        Evaluates the 14 phase-exit checklist items (PRD 9.49.1). `packs_reconciled` is met when,
        for every pack and every entity of the plan (entities are legacy company codes, matched to
        the run's source company), the latest pack run of that company is RECONCILED and was started
        at or after the legacy transaction freeze (T-0 minus 6 hours); earlier runs are dry runs or
        rehearsals and do not count. `parallel_run_signed_off` is met when the month before T-0 (UTC)
        has a parallel run and every parallel run of that month (one per legacy system) is
        SIGNED_OFF. An open_items run whose load into receivables is not RECONCILED (STAGED, LOADING, PARTIAL, FAILED,
        UNRECONCILED or MISMATCH) keeps `packs_reconciled` open even when the run is RECONCILED, and no waiver excuses
        it; a run started without a `load` object has no load to wait for, and the met item's detail names it (not loaded into receivables). The other twelve items are attested by the approvers: they show as the pending GO
        approval confirmed them (`pendingGo`), or UNCONFIRMED when there is none. `systemReady` is
        true when both items the factory evaluates are met and the plan is not rolled back. Reads only.
      x-passage-duty: migration.cutover.manage
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The checklist, the items not met, and the decisions in the order recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    post:
      operationId: recordGoNoGoDecision
      summary: Record a go/no-go decision, or approve a GO, on a cutover plan as the calling user
      description: |
        Approvers are the authenticated callers, never names in the request (CUT-1605). A NO_GO is
        recorded at once with the caller as its approver; it needs a reason. A GO needs two
        different migration.cutover.manage holders: the first caller's GO is stored as their approval (202, with
        `pendingGo`), and a second, different caller's GO approves the same attestations (send none,
        or the same ones) and records the decision with both as approvers (201). The first approver
        cannot approve again (MIG-0004, CUT-1605); a NO_GO recorded in between voids a pending
        approval. Service principals cannot decide.

        The checklist is evaluated in the transaction that stores the request, so a GO rests on the
        pack runs and the parallel runs as they are at that moment. A pack that is staged in the factory
        and not posted to its ledger keeps `packs_reconciled` open unless the GO carries a `waivers`
        entry for it with a reason (CUT-1608); both approvers approve the same waivers, they are kept on
        the decision and written in its event. `attestations` confirm the
        attested items, each with a reference to its evidence (CUT-1606 when missing). A GO, and a
        GO approval, are refused with CUT-1607 while any item is not met; a GO is recorded once per
        plan (a later decision is MIG-0004). Nothing can be decided on a rolled-back plan (MIG-0004).
        A decision is stored with its checklist and writes dev.passage.cutover.decision.recorded.v1;
        a decision or an approval moves the plan's version. `version` works as on step completion.
      x-passage-duty: migration.cutover.manage
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision:
                  type: string
                  enum: [GO, NO_GO]
                reason:
                  type: string
                  maxLength: 2000
                  description: Required for NO_GO.
                attestations:
                  type: array
                  description: Confirmations of the attested checklist items. The second approver of a GO sends none or the first approver's.
                  maxItems: 14
                  items:
                    type: object
                    required: [code, confirmed]
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: An attested checklist item code, for example opening_tb_signed.
                      confirmed:
                        type: boolean
                      reference:
                        type: string
                        maxLength: 500
                        description: Where the evidence is kept (a document link or ticket); required when confirmed.
                waivers:
                  type: array
                  description: |
                    Waivers of packs that are staged in the factory and not posted to their ledger (onhand,
                    gl_balances, project_wip, bank_balances, open_orders, and open_items when a run holds payables lines; see
                    `stagedPacks` on the GET), each with a reason
                    (CUT-1608). Without a waiver such a pack keeps `packs_reconciled` open; a waiver never
                    excuses a run that is not RECONCILED or was started before the legacy freeze. The second
                    approver of a GO sends none or the first approver's. A NO_GO carries no waivers: any sent
                    are ignored, and a NO_GO voids a pending approval together with its waivers.
                  maxItems: 9
                  items:
                    $ref: "#/components/schemas/Waiver"
                version:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: A decision was recorded (a NO_GO, or a GO by its second approver), with its checklist, and the plan after it.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                type: object
                required: [decision, plan]
                properties:
                  decision:
                    $ref: "#/components/schemas/Decision"
                  plan:
                    $ref: "#/components/schemas/Plan"
        "202":
          description: The caller's approval of a GO was stored; the GO is recorded when a second, different migration.cutover.manage holder approves it.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                type: object
                required: [pendingGo, plan]
                properties:
                  pendingGo:
                    $ref: "#/components/schemas/GoApproval"
                  plan:
                    $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/cutover/plans/{id}/rollback:
    post:
      operationId: rollbackCutoverPlan
      summary: Approve the rollback; a second, different migration.cutover.manage's approval executes it and exports the postings since T-0 for re-keying (FR-49.9, CUT-1603)
      description: |
        Approvers are the authenticated callers, never names in the body: the request has no
        `approvers` field and one that sends it is refused (400). The first migration.cutover.manage's request
        stores an approval and answers 202 with the plan and `pendingRollback`; it moves the plan's
        version and writes no event. A second, different migration.cutover.manage's request executes the rollback
        with both of them as `approvers` (the first approver first). The same user twice is MIG-0004
        (CUT-1603); a service principal, or a call made with a service token, is refused (MIG-0001,
        CUT-1605); and the two steps are serialized under the plan row lock. An approval belongs to the
        go/no-go decision round it was given in: a decision recorded after it (GO or NO_GO) voids it, and
        the next request is a new first approval. Step progress does not void it, and it does not expire. `postings` are used by the request that executes
        the rollback and are validated at the first approval too, so send them on both. Runs once per plan (a second rollback is MIG-0004). `postings` are the Passage postings
        made since go-live; lines dated before T-0 are counted as excluded, every line must be for
        an entity of the plan, and each journal (entity, document, currency) must balance. One bad
        posting rejects the request (MIG-0001) and leaves the plan as it was. The accepted lines are
        stored with the plan and served by GET .../rekeying/{file}. In the same transaction the
        loaded and reconciled pack runs of the plan's legacy companies and packs move to ROLLED_BACK
        (BR-49.1; they are no longer loaded into a target or released), and every coexistence flag of
        the plan's legacy companies that Passage masters goes back to LEGACY (FR-49.7), each writing
        dev.passage.migration.coexistence.changed.v1. Writes dev.passage.cutover.plan.rolledback.v1
        with the line counts, the rolled-back run count and the flags handed back, on which the
        integration hub resumes the coexistence adapters (AC-49.7). With `ledgers` and a configured
        ledger the executing request then posts the compensating journals as POST
        .../rollback/compensations does; a failure there leaves the rollback in place and is reported
        in `rollbackOutcome.compensationProblem`. `version` works as on step completion. The body may
        be up to 16 MiB.
      x-passage-duty: migration.cutover.manage
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                postings:
                  type: array
                  description: Passage postings since T-0 to export for re-keying. Empty or absent when nothing was posted.
                  items:
                    $ref: "#/components/schemas/RekeyPosting"
                version:
                  type: integer
                  minimum: 1
                ledgers:
                  type: array
                  description: The ledger each entity's compensating journals are posted in, pinned as on POST .../rollback/compensations; used by the executing request. Each legal entity must be in the caller's scope.
                  items:
                    $ref: "#/components/schemas/EntityLedger"
      responses:
        "200":
          description: The plan with rolledBack true and the re-keying counts.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "202":
          description: The first approval is stored and waits for a second, different migration.cutover.manage; the plan carries `pendingRollback` and is not rolled back.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/cutover/plans/{id}/rekeying/{file}:
    get:
      operationId: getRekeyingFile
      summary: One re-keying file of a rolled-back plan as CSV (FR-49.9, 9.49.15)
      description: |
        `journals.csv` has the columns entity, document_ref, line, posted_at, account, dimensions,
        currency, debit, credit, text; `documents.csv` has entity, document_ref, line, posted_at,
        account, dimensions, currency, amount, text. Lines are ordered by entity, posting time and
        document. Amounts have 6 decimal places; times are RFC 3339 UTC. A plan that has not been
        rolled back has no files (MIG-0004).
      x-passage-duty: migration.cutover.manage
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: file
          in: path
          required: true
          schema:
            type: string
            enum: [journals.csv, documents.csv]
      responses:
        "200":
          description: The CSV file, with its header row.
          content:
            text/csv:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/cutover/plans/{id}/export/{file}:
    get:
      operationId: getCutoverExport
      summary: One export of a cutover plan as CSV (9.49.15)
      description: |
        The files a cutover manager keeps with the cutover record. `runbook.csv` has the steps (seq,
        planned_start, offset_min, step, owner, planned_min, go_no_go, pack, status, started_at,
        started_by, completed_at, completed_by, actual_min, elapsed_min, tone); `rollback-plan.csv` the
        generated rollback steps (seq, planned_start, offset_min, step, owner, planned_min,
        decision_point); `go-no-go.csv` the checklist as evaluated now (code, title, source, status,
        detail, references), with attested items as the pending GO approval confirmed them;
        `decisions.csv` the decision history (seq, decision, decided_by, decided_at, approvers, reason,
        plan_version, open_items, waivers); `reconciliation.csv` the control totals of the latest run of
        every pack and entity of the plan (pack, company, run_id, run_status, started_at, total, key,
        source, target, delta, tolerance, status), a pack and entity with no run as one row with status
        NO_RUN; it carries control totals, so it also needs migration.factory.view (403 otherwise). Times are RFC
        3339 UTC and amounts have 6 decimals. Cells are quoted per RFC 4180, and a text cell that starts
        with =, +, -, @, a tab or a carriage return is prefixed with an apostrophe so a spreadsheet does not
        read it as a formula. The PDF records of 9.49.15 need e-signature (wave 48) and are not served.
      x-passage-duty: migration.cutover.manage
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: file
          in: path
          required: true
          schema:
            type: string
            enum: [runbook.csv, rollback-plan.csv, go-no-go.csv, decisions.csv, reconciliation.csv]
      responses:
        "200":
          description: The CSV file, with its header row.
          content:
            text/csv:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/parallel-runs/replay:
    post:
      operationId: replayParallelRun
      summary: Replay a legacy period through the ledger and diff the trial balances (FR-49.5, D4)
      description: |
        Posts the legacy period's journal documents, in their original sequence (posting date, then
        seq), through the general ledger's posting API into the rehearsal ledger `ledgerId` of
        `legalEntityId` (which must own it, MIG-1531), each under a fixed idempotency key. It then
        reads the ledger's period balance of every account the documents or `legacyTrialBalance`
        name and stores the diff against the legacy trial balance (the documents' own when none is
        given) as a parallel run in REVIEW, idempotent by (period, system). Each legacy TB tuple
        carries the number of documents that posted to its account, so the ledger's rounding of
        every line to the currency's minor unit is EXPECTED under RND-001 up to 0.01 per document
        (BR-49.7). A document the ledger
        refuses is listed in `rejected` and shows as TB variances; any other ledger failure is 502
        MIG-1533 and the replay can be repeated. Without a configured ledger the answer is 503 MIG-1530.
        Subledger documents (49-4): `subledger` carries the period's AR, AP, INV and FA documents (an
        invoice, credit note, payment, inventory movement or asset transaction with its signed effect
        on the balance of its `key`: the party for AR and AP, `item@site` for INV, the asset for FA).
        They are posted area by area, in the same posting-date-then-seq order, through the subledger
        port of the area, each under a fixed idempotency key; the period movement of every key is
        read back and diffed against the legacy side (`legacySubledger` when given, else the
        documents' own sums) as the INV, AP, AR and FA tuples of the same parallel run, with the
        same per-document RND-001 tolerance. A document the subledger refuses is in `rejected`
        (with its `area`) and shows as a variance. Documents of an area no port posts are 503
        MIG-1534 before anything is posted; a subledger that fails mid-replay is 502 MIG-1535 and
        the replay can be repeated. A replay of subledger documents alone (no `documents`) needs
        neither the ledger nor `ledgerId`.
      x-passage-duty: migration.factory.run
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period, sourceSystem, legalEntityId, revenue]
              properties:
                period: {type: string, pattern: "^[0-9]{4}-[0-9]{2}$"}
                sourceSystem: {type: string, enum: [AX2012, D365FO, SAPECC, S4HANA]}
                legalEntityId: {type: string, format: uuid}
                ledgerId: {type: string}
                revenue: {type: string}
                explainedMaxPct: {type: string}
                documents:
                  type: array
                  items:
                    type: object
                    required: [seq, documentId, postingDate, currency, lines]
                    properties:
                      seq: {type: integer, minimum: 1}
                      documentId: {type: string}
                      postingDate: {type: string, format: date}
                      currency: {type: string}
                      lines:
                        type: array
                        items:
                          type: object
                          required: [account, amount]
                          properties:
                            account: {type: string}
                            amount: {type: string, description: "Debit positive, credit negative."}
                            text: {type: string}
                legacyTrialBalance:
                  type: array
                  items:
                    type: object
                    required: [account, currency, amount]
                    properties:
                      account: {type: string}
                      currency: {type: string}
                      amount: {type: string}
                subledger:
                  type: array
                  items:
                    type: object
                    required: [seq, documentId, area, kind, postingDate, key, currency, amount]
                    properties:
                      seq: {type: integer, minimum: 1}
                      documentId: {type: string}
                      area: {type: string, enum: [AR, AP, INV, FA]}
                      kind:
                        type: string
                        enum: [INVOICE, CREDIT_NOTE, PAYMENT, ADJUSTMENT, RECEIPT, ISSUE, TRANSFER, ACQUISITION, DEPRECIATION, DISPOSAL]
                        description: "AR and AP: INVOICE, CREDIT_NOTE, PAYMENT, ADJUSTMENT. INV: RECEIPT, ISSUE, TRANSFER, ADJUSTMENT. FA: ACQUISITION, DEPRECIATION, DISPOSAL, ADJUSTMENT."
                      postingDate: {type: string, format: date}
                      key: {type: string, description: "Party (AR, AP), item@site (INV) or asset (FA); no '|'."}
                      currency: {type: string}
                      amount: {type: string, description: "Signed effect on the balance: an invoice, receipt or acquisition is positive, a credit note, payment, issue, depreciation or disposal negative."}
                legacySubledger:
                  type: array
                  items:
                    type: object
                    required: [area, key, currency, amount]
                    properties:
                      area: {type: string, enum: [AR, AP, INV, FA]}
                      key: {type: string}
                      currency: {type: string}
                      amount: {type: string, description: "The legacy ledger's net movement of the key in the period."}
      responses:
        "201":
          description: The stored parallel run with its variances, the number of documents posted and the rejected ones.
          content:
            application/json:
              schema:
                type: object
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/coexistence:
    get:
      operationId: listCoexistence
      summary: The entity-by-entity cutover flags of a legacy company (FR-49.7, D6)
      description: Every entity kind with its mode; a kind never set is LEGACY at version 0.
      x-passage-duty: migration.factory.view
      parameters:
        - {name: sourceSystem, in: query, required: true, schema: {type: string, enum: [AX2012, D365FO, SAPECC, S4HANA]}}
        - {name: sourceCompany, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: The flags.
          content:
            application/json:
              schema:
                type: object
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/coexistence/{system}/{company}/{entity}:
    put:
      operationId: setCoexistence
      summary: Cut an entity kind over to Passage, or flip it back to the legacy system (BR-49.10)
      description: |
        PASSAGE records the cutover time; from then the coexistence adapter's legacy changes of the
        kind made at or after it are refused (MIG-1510). LEGACY (a rollback) clears it. The write is
        against `expectedVersion` (MIG-0006); setting the current mode is MIG-0004.
      x-passage-duty: migration.cutover.manage
      parameters:
        - {name: system, in: path, required: true, schema: {type: string, enum: [AX2012, D365FO, SAPECC, S4HANA]}}
        - {name: company, in: path, required: true, schema: {type: string}}
        - {name: entity, in: path, required: true, schema: {type: string, enum: [customer, vendor, product, open_items, open_orders, onhand, gl_journal, fixed_asset, worker]}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, expectedVersion]
              properties:
                mode: {type: string, enum: [LEGACY, PASSAGE]}
                expectedVersion: {type: integer, minimum: 0}
      responses:
        "200":
          description: The flag after the change.
          content:
            application/json:
              schema:
                type: object
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/cutover/plans/{id}/rollback/compensations:
    post:
      operationId: postRollbackCompensations
      summary: Post the compensating journals of a rolled-back plan (FR-49.9, D9)
      description: |
        One compensating entry per re-keying journal (entity, document, currency), its lines on the
        opposite side, derived from the stored re-keying lines and dated the rollback day. `ledgers`
        pins an entity's ledger on first use after the ledger service confirms the legal entity owns
        it (MIG-1531); another ledger later is 409 MIG-1532. A failing journal backs off (1 minute
        doubling to 1 hour) and is parked after a rejection or 5 attempts; `retryParked` queues the
        parked ones again. Each journal is posted once under a fixed idempotency key. The plan must be
        rolled back (MIG-0004).
      x-passage-duty: migration.cutover.manage
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ledgers:
                  type: array
                  items:
                    $ref: "#/components/schemas/EntityLedger"
                retryParked: {type: boolean}
      responses:
        "200":
          description: The compensations with their reconciliation against the re-keying journals.
          content:
            application/json:
              schema:
                type: object
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    get:
      operationId: getRollbackCompensations
      summary: The compensating journals of a rolled-back plan and their reconciliation
      x-passage-duty: migration.cutover.manage
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The compensations, pinned ledgers and per (entity, account, currency) reconciliation.
          content:
            application/json:
              schema:
                type: object
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    After:
      name: after
      in: query
      description: Id of the last item of the previous page.
      schema:
        type: string
        format: uuid
  headers:
    IdempotentReplayed:
      description: "true when the response is the stored outcome of a repeated Idempotency-Key."
      schema:
        type: string
        enum: ["true"]
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
    RunStatus:
      type: string
      enum: [EXTRACTED, VALIDATED, LOADED, RECONCILED, FAILED, ROLLED_BACK]
    Record:
      type: object
      required: [legacyId, party, account, currency, amount]
      additionalProperties: false
      properties:
        legacyId:
          type: string
        party:
          type: string
        account:
          type: string
          description: Control account; blank is a DOMAIN failure.
        currency:
          type: string
          description: ISO 4217 code; an unknown code is a DOMAIN failure.
        amount:
          type: string
          description: Decimal string in transaction currency. Never a float.
    ExtractRecord:
      type: object
      required: [legacyId, party, account, currency, amount]
      additionalProperties: false
      description: |
        A Record plus, for a run with a `load` object, the fields of the receivables row. `amount` is the open
        amount with its sign (a credit is negative); the side follows the sign and the row sends magnitudes.
      properties:
        legacyId:
          type: string
        party:
          type: string
        account:
          type: string
          description: Control account; blank is a DOMAIN failure.
        currency:
          type: string
          description: ISO 4217 code; an unknown code is a DOMAIN failure.
        amount:
          type: string
          description: Decimal string in transaction currency. Never a float.
        ledger:
          type: string
          enum: [AR, AP]
          description: Default AR. An AP record is NOT_AVAILABLE unless the load names `payables`, then it is staged for the payables opening-batch load.
        vendorId:
          type: string
          format: uuid
          description: Passage vendor id of an AP record. Defaults to load.payables.vendorIds[party], then to the party when that is a UUID; a record with none is rejected MIG-REF-UNRESOLVED.
        documentNumber:
          type: string
          description: Defaults to the legacy id.
        customerId:
          type: string
          format: uuid
          description: Passage customer id. Defaults to load.customerIds[party], then to the party when that is a UUID; a record with none is rejected MIG-REF-UNRESOLVED.
        kind:
          type: string
          enum: [INVOICE, CREDIT_NOTE, PAYMENT, ADJUSTMENT]
          description: Defaults to INVOICE for a debit and CREDIT_NOTE for a credit.
        documentDate:
          type: string
          format: date
          description: Required with a load object (MIG-LOAD-FIELD-REQUIRED).
        dueDate:
          type: string
          format: date
          description: Required with a load object.
        originalAmount:
          type: string
          description: Magnitude; defaults to the open amount. A part-paid legacy invoice sends the larger original.
        cashDiscountDate:
          type: string
          format: date
        cashDiscountAmount:
          type: string
    LoadRequest:
      type: object
      required: [target, legalEntityId]
      additionalProperties: false
      description: Stages the accepted records for loading into the target service. Nothing is sent until POST /migration/runs/{id}/load.
      properties:
        target:
          type: string
          enum: [receivables]
        legalEntityId:
          type: string
          format: uuid
          description: Legal entity the open items belong to; must be inside the caller's scope.
        importSource:
          type: string
          maxLength: 40
          description: The legacy-system label receivables keys the items under with the legacy id. Defaults to the lower-cased source system and company, for example ax2012.usmf.
        customerIds:
          type: object
          description: Legacy party id to Passage customer id.
          additionalProperties:
            type: string
            format: uuid
        payables:
          type: object
          additionalProperties: false
          description: |
            Stages the run's AP records (ledger AP) for the payables opening-batch load, POST /migration/runs/{id}/load-payables.
            Without it AP records are NOT_AVAILABLE. An AP amount carries the ledger sign (owed to the vendor is a credit,
            negative); a positive AP amount (a vendor debit balance) is rejected MIG-LOAD-AP-DEBIT-BALANCE, an amount with a
            fraction of a minor unit MIG-LOAD-AP-PRECISION.
          properties:
            vendorIds:
              type: object
              description: Legacy vendor id to Passage vendor id. A record may carry `vendorId` instead; a vendor that is itself a UUID needs no entry.
              additionalProperties:
                type: string
                format: uuid
    PackRunRequest:
      type: object
      required: [sourceSystem, sourceCompany, cutoffTs, freezeTs, parties, records]
      additionalProperties: false
      properties:
        sourceSystem:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        sourceCompany:
          type: string
          minLength: 1
          description: DataAreaId (AX) or BUKRS (SAP).
        cutoffTs:
          type: string
          format: date-time
          description: Must not be after freezeTs (MIG-1501).
        freezeTs:
          type: string
          format: date-time
        quarantineMaxPct:
          type: string
          description: Decimal percent from 0 to 10; defaults to 1.0 (migration.quarantine_max_pct).
        parties:
          type: array
          description: Vendor and customer ids in master data (referential rule).
          items:
            type: string
        records:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExtractRecord"
        load:
          $ref: "#/components/schemas/LoadRequest"
    GLBalance:
      type: object
      required: [legacyId, account, currency, balance]
      additionalProperties: false
      properties:
        legacyId:
          type: string
        account:
          type: string
          description: Main account; one missing from accounts is a REFERENTIAL failure.
        dimensions:
          type: string
          description: The legacy dimension combination as one display value; blank for none.
        currency:
          type: string
          description: ISO 4217 code; an unknown code is a DOMAIN failure.
        balance:
          type: string
          description: Signed decimal string at the cutoff, debit positive and credit negative, at most 6 decimal places. Never a float.
    GLRunRequest:
      type: object
      required: [sourceSystem, sourceCompany, cutoffTs, freezeTs, accounts, records]
      additionalProperties: false
      properties:
        sourceSystem:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        sourceCompany:
          type: string
          minLength: 1
          description: DataAreaId (AX) or BUKRS (SAP).
        cutoffTs:
          type: string
          format: date-time
          description: Must not be after freezeTs (MIG-1501).
        freezeTs:
          type: string
          format: date-time
        quarantineMaxPct:
          type: string
          description: Decimal percent from 0 to 10; defaults to 1.0 (migration.quarantine_max_pct).
        accounts:
          type: array
          minItems: 1
          description: The chart of accounts the balances are checked against (referential rule).
          items:
            type: string
        openItemsRunId:
          type: string
          format: uuid
          description: A LOADED or RECONCILED open_items run of the same system and company whose control accounts must equal the GL balances (BR-49.2).
        records:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GLBalance"
    OnhandLine:
      type: object
      required: [legacyId, item, site, warehouse, unit, currency, quantity, value]
      additionalProperties: false
      properties:
        legacyId:
          type: string
          description: The legacy row id (AX InventSum RecId, SAP material and storage key); unique in the extract and in legacy_xref.
        item:
          type: string
          description: Item number; one missing from items is a REFERENTIAL failure.
        site:
          type: string
        warehouse:
          type: string
        location:
          type: string
          description: Bin or location; blank for none.
        batch:
          type: string
          description: Batch number; blank when the item is not batch tracked.
        serial:
          type: string
          description: Serial number; blank when not serial tracked. A serial line holds quantity 1.
        unit:
          type: string
          description: Inventory unit of measure of the quantity.
        currency:
          type: string
          description: ISO 4217 code of the value; an unknown code is a DOMAIN failure.
        quantity:
          type: string
          description: Decimal string greater than zero, at most 6 decimal places. Never a float.
        value:
          type: string
          description: Total value of the quantity at legacy cost (BR-49.3), a decimal string not below zero, at most 6 decimal places.
    OnhandRunRequest:
      type: object
      required: [sourceSystem, sourceCompany, cutoffTs, freezeTs, items, records]
      additionalProperties: false
      properties:
        sourceSystem:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        sourceCompany:
          type: string
          minLength: 1
          description: DataAreaId (AX) or company code (SAP).
        cutoffTs:
          type: string
          format: date-time
          description: Must not be after freezeTs (MIG-1501).
        freezeTs:
          type: string
          format: date-time
        quarantineMaxPct:
          type: string
          description: Decimal percent from 0 to 10; defaults to 1.0 (migration.quarantine_max_pct).
        items:
          type: array
          minItems: 1
          description: The item master the lines are checked against (referential rule).
          items:
            type: string
        glRunId:
          type: string
          format: uuid
          description: A LOADED or RECONCILED gl_balances run of the same system and company whose inventory account must equal the loaded value (BR-49.3). Goes with inventoryAccount.
        inventoryAccount:
          type: string
          description: The inventory GL account compared with the loaded on-hand value, per currency. Goes with glRunId.
        records:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OnhandLine"
    BankBalance:
      type: object
      required: [legacyId, bankAccount, currency, balance]
      additionalProperties: false
      properties:
        legacyId:
          type: string
          description: The legacy row id (AX BankAccountTable RecId, SAP house bank and account id); unique in the extract and in legacy_xref.
        bankAccount:
          type: string
          description: Bank account id; one missing from bankAccounts is a REFERENTIAL failure, and an account appears once per extract.
        currency:
          type: string
          description: ISO 4217 code of the account; an unknown code is a DOMAIN failure.
        balance:
          type: string
          description: Signed book balance at the cutoff (an overdrawn account is negative), a decimal string in whole minor units of the currency (2 decimal places for USD, 0 for JPY); a finer value is a DOMAIN failure. Never a float.
    StagedRunRequest:
      type: object
      required: [sourceSystem, sourceCompany, cutoffTs, freezeTs, master, records]
      additionalProperties: false
      properties:
        sourceSystem: {type: string, enum: [AX2012, D365FO, SAPECC, S4HANA]}
        sourceCompany: {type: string, minLength: 1}
        cutoffTs: {type: string, format: date-time}
        freezeTs: {type: string, format: date-time}
        quarantineMaxPct: {type: string}
        master:
          type: array
          minItems: 1
          items: {type: string}
        records:
          type: array
          minItems: 1
          items:
            type: object
            required: [legacyId, currency]
            description: |
              wip_prod reads productionOrder, item, material, labor, overhead; fixed_assets reads asset, book,
              method (SL or DB), usefulLifeMonths, remainingLifeMonths, acquisitionCost, accumulatedDepreciation,
              salvageValue, nextDepreciation; payroll_ytd reads worker, taxYear, gross, tax, deductions, net.
              Amounts are decimal strings; a blank amount is zero.
            additionalProperties: true
    BankRunRequest:
      type: object
      required: [sourceSystem, sourceCompany, cutoffTs, freezeTs, bankAccounts, records]
      additionalProperties: false
      properties:
        sourceSystem:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        sourceCompany:
          type: string
          minLength: 1
          description: DataAreaId (AX) or company code (SAP).
        cutoffTs:
          type: string
          format: date-time
          description: Must not be after freezeTs (MIG-1501).
        freezeTs:
          type: string
          format: date-time
        quarantineMaxPct:
          type: string
          description: Decimal percent from 0 to 10; defaults to 1.0 (migration.quarantine_max_pct).
        bankAccounts:
          type: array
          minItems: 1
          description: The bank account master the lines are checked against (referential rule).
          items:
            type: string
        records:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BankBalance"
    OpenOrderLine:
      type: object
      required: [legacyId, orderType, orderNumber, lineNumber, item, party, unit, currency, orderedQty, deliveredQty, unitPrice]
      additionalProperties: false
      properties:
        legacyId:
          type: string
          description: The legacy row id (AX SalesLine or PurchLine RecId, SAP VBAP or EKPO key), unique per order type in the extract and in legacy_xref, where a line is held under source table open_orders.sales or open_orders.purchase (the two legacy tables number their rows independently).
        orderType:
          type: string
          enum: [SALES, PURCHASE]
          description: A sales order line not fully shipped or a purchase order line not fully received; any other value is a DOMAIN failure.
        orderNumber:
          type: string
          description: The order number; with the order type and line number it is the natural key, once per extract and per company (a sales and a purchase order with the same number are two orders).
        lineNumber:
          type: string
          description: The line number within the order.
        item:
          type: string
          description: Item id; one missing from items is a REFERENTIAL failure.
        party:
          type: string
          description: Customer of a sales order or vendor of a purchase order; one missing from customers or vendors is a REFERENTIAL failure.
        unit:
          type: string
          description: Unit of measure of the quantities.
        currency:
          type: string
          description: ISO 4217 code of the unit price; an unknown code is a DOMAIN failure.
        orderedQty:
          type: string
          description: Quantity on the order, a decimal string with at most six decimals; positive.
        deliveredQty:
          type: string
          description: Quantity already shipped or received; zero or more and below orderedQty, else the line is not open (DOMAIN failure).
        unitPrice:
          type: string
          description: Price per unit, a decimal string with at most six decimals; zero or more. Never a float.
        deliveryDate:
          type: string
          format: date
          description: Confirmed or requested delivery date of the open quantity, optional.
    OpenOrdersRunRequest:
      type: object
      required: [sourceSystem, sourceCompany, cutoffTs, freezeTs, items, records]
      additionalProperties: false
      properties:
        sourceSystem:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        sourceCompany:
          type: string
          minLength: 1
          description: DataAreaId (AX) or company code (SAP).
        cutoffTs:
          type: string
          format: date-time
          description: Must not be after freezeTs (MIG-1501).
        freezeTs:
          type: string
          format: date-time
        quarantineMaxPct:
          type: string
          description: Decimal percent from 0 to 10; defaults to 1.0 (migration.quarantine_max_pct).
        items:
          type: array
          minItems: 1
          description: The item master the lines are checked against (referential rule).
          items:
            type: string
        customers:
          type: array
          description: The customer master; required when a line is a sales order line.
          items:
            type: string
        vendors:
          type: array
          description: The vendor master; required when a line is a purchase order line.
          items:
            type: string
        records:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OpenOrderLine"
    ControlTotal:
      type: object
      required: [name, key, source, target, delta, tolerance, status]
      properties:
        name:
          type: string
          enum: [open_items.amount, open_items.amount_by_account, open_items.count, gl_balances.balance, gl_balances.nonzero_count,
            gl_balances.trial_balance, gl_balances.control_account, onhand.quantity, onhand.value, onhand.value_entity, onhand.inventory_account, bank_balances.balance, bank_balances.balance_entity, bank_balances.count, open_orders.open_quantity, open_orders.open_value, open_orders.line_count, open_orders.order_count, project_wip.cost, project_wip.sales, project_wip.wip_cost, project_wip.wip_sales,
            target.receivables.item_count, target.receivables.debit_open, target.receivables.credit_open, target.receivables.net_open,
            target.payables.item_count, target.payables.total_minor]
        key:
          type: object
          additionalProperties:
            type: string
        source:
          type: string
          description: Legacy value, decimal string with 6 places.
        target:
          type: string
          description: Value held in Passage, decimal string with 6 places.
        delta:
          type: string
          description: target - source.
        tolerance:
          type: string
        toleranceReason:
          type: string
        status:
          type: string
          enum: [MATCH, WITHIN_TOLERANCE, MISMATCH]
    Quarantined:
      type: object
      required: [seq, legacyId, rule, reason, status, amount]
      properties:
        seq:
          type: integer
          description: Addresses the record within its run (release path parameter).
        legacyId:
          type: string
        rule:
          type: string
          enum: [REFERENTIAL, DOMAIN, UNIQUENESS]
        reason:
          type: string
        status:
          type: string
          enum: [OPEN, RELEASED]
        party:
          type: string
        account:
          type: string
        dimensions:
          type: string
          description: Dimension combination of a quarantined gl_balances balance.
        ledger:
          type: string
          enum: [AP]
          description: Set for a quarantined open item that is a payable; absent for a receivable. A legacy id is unique per side.
        currency:
          type: string
        amount:
          type: string
          description: Decimal string as extracted (cost amount for a project line, balance for a GL balance).
        released:
          $ref: "#/components/schemas/Record"
        releasedBy:
          type: string
        releasedAt:
          type: string
          format: date-time
    Tolerance:
      type: object
      required: [pack, total, amount, reason, version, updatedBy, updatedAt]
      properties:
        pack:
          type: string
        total:
          type: string
          description: Control total name, or `*` for the pack default.
        amount:
          type: string
          description: Decimal string.
        reason:
          type: string
        version:
          type: integer
          minimum: 1
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    PackRun:
      type: object
      required: [runId, pack, sourceSystem, sourceCompany, cutoffTs, inputHash, status, recordsIn, recordsLoaded, recordsQuarantined, alreadyPresent, version, createdAt]
      properties:
        runId:
          type: string
          format: uuid
        pack:
          type: string
        sourceSystem:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        sourceCompany:
          type: string
        cutoffTs:
          type: string
          format: date-time
        inputHash:
          type: string
          description: sha256 hex of the sorted (legacy id, amount) pairs of the extract; for gl_balances each legacy id carries its account, dimensions and currency.
        status:
          $ref: "#/components/schemas/RunStatus"
        recordsIn:
          type: integer
        recordsLoaded:
          type: integer
        recordsQuarantined:
          type: integer
        alreadyPresent:
          type: integer
          description: Accepted records legacy_xref already held, so not loaded again.
        message:
          type: string
          description: MIG-1505 text when a re-run loaded nothing new.
        openItemsRunId:
          type: string
          format: uuid
          description: The open_items run a gl_balances run reconciled its control accounts with (BR-49.2).
        glRunId:
          type: string
          format: uuid
          description: The gl_balances run an onhand run reconciled its inventory account with (BR-49.3).
        version:
          type: integer
          minimum: 1
          description: Bumped by every release; a release with a stale version is MIG-0006.
        createdAt:
          type: string
          format: date-time
    PackRunDetail:
      allOf:
        - $ref: "#/components/schemas/PackRun"
        - type: object
          required: [controlTotals, quarantined]
          properties:
            controlTotals:
              type: array
              items:
                $ref: "#/components/schemas/ControlTotal"
            quarantined:
              type: array
              items:
                $ref: "#/components/schemas/Quarantined"
            mismatchMessages:
              type: array
              description: MIG-1506 text for every gl_balances.control_account total that is MISMATCH, and MIG-1502 text for an onhand.inventory_account total that is MISMATCH.
              items:
                type: string
            targetLoad:
              $ref: "#/components/schemas/TargetLoad"
    TargetRowStatus:
      type: string
      enum: [PENDING, LOADED, UNCHANGED, SKIPPED, REJECTED, NOT_AVAILABLE]
      description: |
        PENDING is still to send; LOADED the target created or updated it; UNCHANGED the target held it already;
        SKIPPED equals what the target accepted before, so it was not sent; REJECTED carries the code (the target's
        AR-OPENING-* or the factory's MIG-LOAD-FIELD-REQUIRED / MIG-REF-UNRESOLVED / MIG-TARGET-REFUSED);
        NOT_AVAILABLE is open AP (MIG-TARGET-NOT-AVAILABLE).
    OpeningJournals:
      type: object
      required: [runId, journals]
      properties:
        runId: {type: string, format: uuid}
        journals:
          type: array
          items:
            type: object
            required: [currency, legalEntityId, ledgerId, postingDate, lineCount, debit, credit, entryId, alreadyPosted]
            properties:
              currency: {type: string}
              legalEntityId: {type: string, format: uuid}
              ledgerId: {type: string}
              postingDate: {type: string, format: date}
              lineCount: {type: integer}
              debit: {type: string, description: Decimal total of the debit lines.}
              credit: {type: string, description: Decimal total of the credit lines; equal to debit.}
              entryId: {type: string, description: The journal entry the ledger booked.}
              alreadyPosted: {type: boolean, description: True when an earlier call posted it; nothing was sent now.}
              postedAt: {type: string, format: date-time}
    PayablesLoad:
      type: object
      required: [runId, target, legalEntityId, importSource, status, clean, staged, loaded, unchanged, skipped, rejected, pending, attempts, version]
      properties:
        runId: {type: string, format: uuid}
        target: {type: string, enum: [payables]}
        legalEntityId: {type: string, format: uuid}
        importSource: {type: string}
        status:
          type: string
          enum: [STAGED, LOADING, PARTIAL, UNRECONCILED, MISMATCH, RECONCILED, FAILED]
          description: Like the receivables load; MISMATCH when the batches payables holds differ from what the factory sent.
        clean: {type: boolean, description: RECONCILED with no row pending or rejected.}
        staged: {type: integer}
        loaded: {type: integer, description: Rows in batches payables stored now.}
        unchanged: {type: integer, description: Rows in batches payables already held.}
        skipped: {type: integer, description: Rows equal to what payables accepted earlier, not sent.}
        rejected: {type: integer}
        pending: {type: integer}
        attempts: {type: integer}
        lastError: {type: string}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        version: {type: integer}
    PayablesLoadDetail:
      allOf:
        - $ref: "#/components/schemas/PayablesLoad"
        - type: object
          required: [reconciliation, rejects]
          properties:
            reconciliation:
              type: array
              items:
                $ref: "#/components/schemas/ControlTotal"
            rejects:
              type: array
              items:
                $ref: "#/components/schemas/TargetRow"
    TargetLoad:
      type: object
      required: [runId, target, legalEntityId, importSource, status, clean, staged, created, updated, unchanged, skipped, rejected, notAvailable, pending, attempts, version]
      properties:
        runId:
          type: string
          format: uuid
        target:
          type: string
          enum: [receivables]
        legalEntityId:
          type: string
          format: uuid
        importSource:
          type: string
        status:
          type: string
          enum: [STAGED, LOADING, PARTIAL, UNRECONCILED, MISMATCH, RECONCILED, FAILED]
          description: |
            STAGED nothing sent yet; LOADING a pass is running; PARTIAL rows are still pending because the target
            did not answer; UNRECONCILED every row was sent but the target's totals could not be read; MISMATCH the
            target's totals differ from what the factory sent; RECONCILED they match; FAILED the target refused the
            factory's service token.
        clean:
          type: boolean
          description: RECONCILED with no row pending, rejected or unavailable.
        staged:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        skipped:
          type: integer
        rejected:
          type: integer
        notAvailable:
          type: integer
        pending:
          type: integer
        attempts:
          type: integer
        lastError:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        version:
          type: integer
    TargetRow:
      type: object
      required: [seq, legacyId, ledger, status]
      properties:
        seq:
          type: integer
        legacyId:
          type: string
        ledger:
          type: string
          enum: [AR, AP]
        status:
          $ref: "#/components/schemas/TargetRowStatus"
        outcome:
          type: string
          description: The target's outcome for the row (CREATED, UPDATED, UNCHANGED, REJECTED).
        openItemId:
          type: string
          format: uuid
        code:
          type: string
        detail:
          type: string
        side:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          type: string
          description: Open amount (magnitude).
        currency:
          type: string
        customerId:
          type: string
          format: uuid
    TargetLoadDetail:
      allOf:
        - $ref: "#/components/schemas/TargetLoad"
        - type: object
          required: [reconciliation, rejects]
          properties:
            reconciliation:
              type: array
              items:
                $ref: "#/components/schemas/ControlTotal"
            rejects:
              type: array
              items:
                $ref: "#/components/schemas/TargetRow"
    ReleaseRequest:
      type: object
      additionalProperties: false
      properties:
        party:
          type: string
          description: Corrected party of an open_items record or customer or vendor of an open_orders line; blank keeps the extracted one.
        account:
          type: string
          description: Corrected control account; blank keeps the extracted one.
        bankAccount:
          type: string
          description: Corrected bank account of a bank_balances line; blank keeps the extracted one.
        item:
          type: string
          description: Corrected item of an onhand or open_orders line; blank keeps the extracted one.
        site:
          type: string
          description: Corrected site of an onhand line; blank keeps the extracted one.
        warehouse:
          type: string
          description: Corrected warehouse of an onhand line; blank keeps the extracted one.
        location:
          type: string
          description: Corrected location of an onhand line; blank keeps the extracted one.
        batch:
          type: string
          description: Corrected batch of an onhand line; blank keeps the extracted one.
        unit:
          type: string
          description: Corrected unit of measure of an onhand or open_orders line; blank keeps the extracted one.
        deliveryDate:
          type: string
          format: date
          description: Corrected delivery date of an open_orders line (ISO date); blank keeps the extracted one.
        customers:
          type: array
          description: Customer ids added since an open_orders run, checked with the run's snapshot; another pack refuses them (MIG-0001).
          items:
            type: string
        vendors:
          type: array
          description: Vendor ids added since an open_orders run, checked with the run's snapshot; another pack refuses them (MIG-0001).
          items:
            type: string
        parties:
          type: array
          description: >-
            Master-data ids added since the run, checked with the run's snapshot: parties for
            open_items, bank accounts for bank_balances, items for onhand and open_orders.
          items:
            type: string
        version:
          type: integer
          minimum: 1
    OpeningLine:
      type: object
      required: [legacyId, category, transactionDate, costAmount, salesAmount, currency, billingStatus]
      additionalProperties: false
      properties:
        legacyId:
          type: string
          description: Unique across the extract; ProjTrans* RecId or the CO line id.
        category:
          $ref: "#/components/schemas/Category"
        transactionDate:
          type: string
          format: date
          description: Not after cutoffTs (DOMAIN otherwise).
        qty:
          type: string
        costAmount:
          type: string
        salesAmount:
          type: string
        currency:
          type: string
        workerId:
          type: string
        activityId:
          type: string
        dimensions:
          type: object
          additionalProperties:
            type: string
        billingStatus:
          type: string
          enum: [CHARGEABLE_UNBILLED, BILLED, NON_CHARGEABLE]
          description: ON_ACCOUNT lines are BILLED; NON_CHARGEABLE lines carry no WIP sales (DOMAIN otherwise).
        wipCost:
          type: string
        wipSales:
          type: string
    Category:
      type: string
      enum: [HOUR, EXPENSE, ITEM, FEE, ON_ACCOUNT]
    LegacyCategoryTotal:
      type: object
      required: [category]
      additionalProperties: false
      properties:
        category:
          $ref: "#/components/schemas/Category"
        cost:
          type: string
        sales:
          type: string
        wipCost:
          type: string
        wipSales:
          type: string
    ProjectRunRequest:
      type: object
      required: [sourceSystem, sourceCompany, cutoffTs, freezeTs, projects]
      additionalProperties: false
      properties:
        sourceSystem:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        sourceCompany:
          type: string
          minLength: 1
        cutoffTs:
          type: string
          format: date-time
        freezeTs:
          type: string
          format: date-time
        quarantineMaxPct:
          type: string
        projects:
          type: array
          minItems: 1
          items:
            type: object
            required: [projectId, legacyTotals, lines]
            additionalProperties: false
            properties:
              projectId:
                type: string
                minLength: 1
              legacyTotals:
                type: array
                description: The legacy ProjTrans*/COSP-COSS and RA totals per category, at most one per category.
                items:
                  $ref: "#/components/schemas/LegacyCategoryTotal"
              lines:
                type: array
                items:
                  $ref: "#/components/schemas/OpeningLine"
    ProjectOpening:
      type: object
      required: [runId, projectId, status, totals, lineCount, lines]
      properties:
        runId:
          type: string
          format: uuid
        projectId:
          type: string
        status:
          type: string
          enum: [RECONCILED, OPENING_MISMATCH]
        totals:
          type: array
          items:
            $ref: "#/components/schemas/ControlTotal"
        lineCount:
          type: integer
        lines:
          type: array
          description: |
            Each line is an OpeningLine (qty, wipCost and wipSales always present, amounts as
            decimal strings with 6 places) plus beginningBalance, which is always true.
          items:
            type: object
            required: [legacyId, category, transactionDate, qty, costAmount, salesAmount, currency, billingStatus, wipCost, wipSales, beginningBalance]
            properties:
              legacyId:
                type: string
              category:
                $ref: "#/components/schemas/Category"
              transactionDate:
                type: string
                format: date
              qty:
                type: string
              costAmount:
                type: string
              salesAmount:
                type: string
              currency:
                type: string
              workerId:
                type: string
              activityId:
                type: string
              dimensions:
                type: object
                additionalProperties:
                  type: string
              billingStatus:
                type: string
                enum: [CHARGEABLE_UNBILLED, BILLED, NON_CHARGEABLE]
              wipCost:
                type: string
              wipSales:
                type: string
              beginningBalance:
                const: true
    Xref:
      type: object
      required: [xrefId, system, company, table, legacyId, passageEntity, passageId, runId, createdAt, targetConfirmed]
      properties:
        xrefId:
          type: string
          format: uuid
        system:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        company:
          type: string
        table:
          type: string
        legacyId:
          type: string
        passageEntity:
          type: string
          enum: [open_item, project_opening_line]
        passageId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        targetConfirmed:
          type: boolean
          description: True once passageId is the id the target service assigned; until then it is the factory's own.
    ParallelState:
      type: string
      enum: [REPLAYING, DIFFING, REVIEW, SIGNED_OFF]
    Tuple:
      type: object
      required: [area, key, amount]
      additionalProperties: false
      properties:
        area:
          type: string
          enum: [TB, INV, AP, AR, FA]
        key:
          type: string
          minLength: 1
          description: The canonical tuple key, for example entity|account|dimensions|currency|period.
        amount:
          type: string
        documents:
          type: integer
          minimum: 0
          description: How many legacy documents the tuple sums. RND-001 allows 0.01 per document (BR-49.7), so a tuple of n documents is EXPECTED up to n x 0.01; absent or 0 counts as one document. When both sides give a count the larger one applies.
    ParallelRunRequest:
      type: object
      required: [period, sourceSystem, documentsReplayed, revenue]
      additionalProperties: false
      properties:
        period:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        sourceSystem:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        documentsReplayed:
          type: integer
          minimum: 0
        revenue:
          type: string
          description: Period revenue, the base of the explained-amount limit.
        explainedMaxPct:
          type: string
          description: Percent of revenue from 0 to 1; defaults to 0.1 (migration.parallel.explained_max_pct_revenue).
        legacy:
          type: array
          items:
            $ref: "#/components/schemas/Tuple"
        passage:
          type: array
          items:
            $ref: "#/components/schemas/Tuple"
    Variance:
      type: object
      required: [varianceId, area, key, legacy, passage, delta, class]
      properties:
        varianceId:
          type: string
          format: uuid
        area:
          type: string
          enum: [TB, INV, AP, AR, FA]
        key:
          type: string
        legacy:
          type: string
        passage:
          type: string
        delta:
          type: string
          description: passage - legacy.
        documents:
          type: integer
          minimum: 0
          description: The document count the per-document rule RND-001 scaled its tolerance by; absent when neither side gave one. A replay counts, per account, the legacy documents that posted to it.
        class:
          type: string
          enum: [EXPECTED, EXPLAINED, UNEXPLAINED]
        ruleId:
          type: string
        reason:
          type: string
        explainedBy:
          type: string
        explainedAt:
          type: string
          format: date-time
    ParallelRun:
      type: object
      required: [parallelRunId, period, sourceSystem, documentsReplayed, revenue, explainedMaxPct, inputHash, state, unexplainedCount, unexplainedAmount, explainedAmount, expectedByRule, canSignOff, version, createdAt]
      properties:
        parallelRunId:
          type: string
          format: uuid
        period:
          type: string
        sourceSystem:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        documentsReplayed:
          type: integer
        revenue:
          type: string
        explainedMaxPct:
          type: string
        inputHash:
          type: string
        state:
          $ref: "#/components/schemas/ParallelState"
        unexplainedCount:
          type: integer
        unexplainedAmount:
          type: string
        explainedAmount:
          type: string
        expectedByRule:
          type: object
          description: Variance count per rule id.
          additionalProperties:
            type: integer
        canSignOff:
          type: boolean
          description: The FR-49.5 exit criterion holds now.
        signOffBlocker:
          type: string
          description: Why the run cannot be signed off yet (MIG-1509 or the explained-amount limit).
        startedBy:
          type: string
        signedOffBy:
          type: string
        signedOffAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        variances:
          type: array
          description: Present on start, get and commands; absent in the list.
          items:
            $ref: "#/components/schemas/Variance"
    GenerateRequest:
      type: object
      required: [t0, packs, entities]
      additionalProperties: false
      properties:
        t0:
          type: string
          format: date-time
          description: cutover.t0, 00:00 of cutover day.
        packs:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [open_items, gl_balances, onhand, open_orders, wip_prod, fixed_assets, project_wip, payroll_ytd, bank_balances]
        entities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        abortOffsetHours:
          type: integer
          minimum: 12
          maximum: 72
          default: 36
        rehearsalDurationsMin:
          type: object
          description: Step name to the duration measured in the last rehearsal, in minutes.
          additionalProperties:
            type: integer
            minimum: 0
        rehearsalPlanId:
          type: string
          format: uuid
          description: |
            An earlier plan of the tenant (a rehearsal) whose measured step durations (done steps with a
            recorded duration) become this plan's planned durations (FR-49.6). Entries in
            `rehearsalDurationsMin` override them. 422 when that plan has no measured duration, 404 when it
            does not exist.
        expandByEntity:
          type: boolean
          default: false
          description: |
            Generate the per-entity runbook (D5a, the `fx-cutover-plan` shape). The plan-wide pack load
            steps are replaced by, for each legal entity, a freeze, an extract, a load and a reconcile step
            per pack, an entity reconciliation, a controller sign-off and a hypercare check: 15 plan-wide
            steps, plus 2 per entity and pack, plus 5 per entity (3 entities and 9 packs give 84). At most
            50 entities (MIG-0001 above). None of the per-entity steps is a go/no-go step, but each waits
            for its own entity's earlier steps (CUT-1609 on start and complete): the extract for the freeze,
            each pack load for the freeze and the extract, a pack reconcile for that load, the entity
            reconciliation for every pack reconcile, the sign-off for the entity reconciliation and the
            hypercare check for the sign-off. The plan-wide go/no-go steps wait for every entity's sign-off.
    Step:
      type: object
      required: [seq, offsetMin, name, owner, plannedDurationMin, actualDurationMin, status, goNoGo]
      properties:
        seq:
          type: integer
        offsetMin:
          type: integer
          description: Minutes from T-0.
        name:
          type: string
        owner:
          type: string
        plannedDurationMin:
          type: integer
        actualDurationMin:
          type: integer
        status:
          type: string
          enum: [PENDING, DONE]
        goNoGo:
          type: boolean
        pack:
          type: string
        entity:
          type: string
          description: The legal entity a per-entity step covers (a plan generated with expandByEntity); absent for plan-wide steps.
        completedBy:
          type: string
        completedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          description: Set once the step is started; the runbook timer runs from it (FR-49.6).
        startedBy:
          type: string
        elapsedMin:
          type: integer
          minimum: 0
          description: |
            Elapsed minutes at the time of the response: from the start for a running step, the
            recorded duration for a done step. Absent for a step not started.
        tone:
          type: string
          enum: [ok, amber, red]
          description: Elapsed against planned, amber at 110 % and red at 125 % (9.49.6). Absent with elapsedMin.
        overrunWarning:
          type: string
          description: CUT-1602 text for a running step at or above the amber percentage.
    RollbackStep:
      type: object
      required: [seq, offsetMin, name, owner, plannedDurationMin, decisionPoint]
      properties:
        seq:
          type: integer
          minimum: 1
        offsetMin:
          type: integer
          description: Minutes from T-0. The first step is at the abort deadline; each later step starts when the one before is planned to end.
        name:
          type: string
        owner:
          type: string
        plannedDurationMin:
          type: integer
          minimum: 1
        decisionPoint:
          type: boolean
          description: True for the first step, the rollback decision at the abort deadline (BR-49.9).
    CatalogEntry:
      type: object
      required: [pack, sourceSystems, controlTotals, available]
      properties:
        pack:
          type: string
          enum: [open_items, gl_balances, onhand, open_orders, wip_prod, fixed_assets, project_wip, payroll_ytd, bank_balances]
        sourceSystems:
          type: array
          items:
            type: string
            enum: [AX2012, D365FO, SAPECC, S4HANA]
        controlTotals:
          type: string
          description: The FR-49.2 control totals the pack compares.
        available:
          type: boolean
          description: A run can be started for this pack in this release.
    ChecklistItem:
      type: object
      required: [code, title, source, status, references]
      properties:
        code:
          type: string
        title:
          type: string
        source:
          type: string
          enum: [system, attested]
          description: system items are evaluated from the factory's own data; attested items are confirmed by the approvers.
        status:
          type: string
          enum: [MET, OPEN, UNCONFIRMED]
        detail:
          type: string
        references:
          type: array
          description: Run ids (pack runs or parallel runs) the item rests on.
          items:
            type: string
    GoApproval:
      type: object
      description: A migration.cutover.manage's approval of a GO, waiting for a second, different approver (CUT-1605).
      required: [round, approver, attestations, waivers, planVersion, approvedAt]
      properties:
        round:
          type: integer
          minimum: 1
          description: The seq the decision takes when it is recorded; a decision recorded in between voids the approval.
        approver:
          type: string
          description: The authenticated user who approved.
        attestations:
          type: array
          description: The confirmed attested items with their evidence references; the second approver approves these.
          items:
            type: object
            required: [code, confirmed]
            properties:
              code:
                type: string
              confirmed:
                type: boolean
              reference:
                type: string
        waivers:
          type: array
          description: The staged-but-unposted packs the first approver waived; the second approver approves these.
          items:
            $ref: "#/components/schemas/Waiver"
        planVersion:
          type: integer
          minimum: 2
        approvedAt:
          type: string
          format: date-time
    Waiver:
      type: object
      description: Acceptance of one pack that is staged in the factory and not posted to its target ledger, attested by both approvers of a GO (CUT-1608).
      required: [pack, reason]
      additionalProperties: false
      properties:
        pack:
          type: string
          description: Pack code of a pack in the plan, for example onhand.
        reason:
          type: string
          maxLength: 500
          description: Why the plan may go live without the rows posted, for example that they were posted manually in the target.
    DecisionSummary:
      type: object
      required: [seq, decision, approvers, decidedAt]
      properties:
        seq:
          type: integer
          minimum: 1
        decision:
          type: string
          enum: [GO, NO_GO]
        approvers:
          type: array
          description: Authenticated users who approved, in order; two for a GO, the recording user for a NO_GO.
          items:
            type: string
        reason:
          type: string
        decidedBy:
          type: string
          description: The user who recorded the decision (the last approver).
        decidedAt:
          type: string
          format: date-time
    Decision:
      allOf:
        - $ref: "#/components/schemas/DecisionSummary"
        - type: object
          required: [planVersion, checklist, waivers]
          properties:
            waivers:
              type: array
              description: The packs waived by both approvers when the decision was taken; empty when none.
              items:
                $ref: "#/components/schemas/Waiver"
            planVersion:
              type: integer
              minimum: 2
              description: The plan's version after the decision.
            checklist:
              type: array
              description: The checklist as evaluated when the decision was taken.
              items:
                $ref: "#/components/schemas/ChecklistItem"
    Readiness:
      type: object
      required: [planId, version, rolledBack, systemReady, items, openItems, decisions, stagedPacks]
      properties:
        stagedPacks:
          type: array
          description: Packs of the plan that are staged in the factory and not posted to their ledger; each can be waived by both approvers of a GO (CUT-1608).
          items:
            type: object
            required: [pack, reason]
            properties:
              pack:
                type: string
              reason:
                type: string
                description: Why the pack is not posted.
        planId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        rolledBack:
          type: boolean
        systemReady:
          type: boolean
          description: Both items the factory evaluates are met and the plan is not rolled back.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        openItems:
          type: array
          description: Codes of the items not MET.
          items:
            type: string
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
        pendingGo:
          $ref: "#/components/schemas/GoApproval"
    Plan:
      type: object
      required: [planId, t0, packs, entities, abortOffsetMin, rolledBack, approvers, version, createdAt, stepsDone, stepsTotal, openGoNoGo, abortDue]
      properties:
        pendingRollback:
          type: object
          description: The first approval of a rollback in the current go/no-go decision round, waiting for a second, different migration.cutover.manage (CUT-1603). Absent when none, once rolled back, or when a decision recorded after it voided it.
          required: [approver, approvedAt]
          properties:
            approver:
              type: string
            approvedAt:
              type: string
              format: date-time
        planId:
          type: string
          format: uuid
        t0:
          type: string
          format: date-time
        packs:
          type: array
          items:
            type: string
        entities:
          type: array
          items:
            type: string
        abortOffsetMin:
          type: integer
        rolledBack:
          type: boolean
        approvers:
          type: array
          description: The two or more distinct rollback approvers, once rolled back.
          items:
            type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        stepsDone:
          type: integer
        stepsTotal:
          type: integer
        rehearsalPlanId:
          type: string
          format: uuid
          description: The rehearsal plan whose measured durations this plan was generated from; absent when none.
        rehearsalCarried:
          type: integer
          minimum: 0
          description: Number of steps whose planned duration came from a rehearsal, from `rehearsalPlanId` or the request.
        openGoNoGo:
          type: array
          description: Names of go/no-go steps not yet done.
          items:
            type: string
        abortDue:
          type: boolean
          description: The abort deadline has passed with go/no-go items open (BR-49.9).
        abortWarning:
          type: string
          description: CUT-1604 text in the hour before the deadline.
        decision:
          description: The latest go/no-go decision; absent until one is recorded.
          $ref: "#/components/schemas/DecisionSummary"
        rekeying:
          type: object
          description: Present once the plan is rolled back. The lines exported for re-keying (FR-49.9).
          required: [journalLines, documentLines, excluded]
          properties:
            journalLines:
              type: integer
              minimum: 0
            documentLines:
              type: integer
              minimum: 0
            excluded:
              type: integer
              minimum: 0
              description: Postings given with the rollback that were dated before T-0 and left out.
        rollbackOutcome:
          type: object
          description: Present once the plan is rolled back. What the rollback did besides the re-keying export.
          required: [packRunsRolledBack, coexistenceResumed]
          properties:
            packRunsRolledBack:
              type: integer
              minimum: 0
              description: Pack runs of the plan's legacy companies and packs moved from LOADED or RECONCILED to ROLLED_BACK (BR-49.1).
            coexistenceResumed:
              type: integer
              minimum: 0
              description: Coexistence flags handed back to LEGACY (FR-49.7).
            coexistence:
              type: array
              description: The flags handed back; on the executing request's response only.
              items:
                type: object
            compensations:
              type: object
              description: The compensating-journal run the executing request made with `ledgers`, shaped as the POST .../rollback/compensations response.
            compensationProblem:
              type: string
              description: Why the executing request posted no compensations although `ledgers` were given (the ledger is not configured, a ledger is foreign or pinned, the ledger failed); the rollback stands and POST .../rollback/compensations takes over.
        steps:
          type: array
          description: Present on generate, get and commands; absent in the list.
          items:
            $ref: "#/components/schemas/Step"
        rollbackSteps:
          type: array
          description: The generated rollback plan (FR-49.9), sent with the steps.
          items:
            $ref: "#/components/schemas/RollbackStep"
    EntityLedger:
      type: object
      required: [entity, legalEntityId, ledgerId]
      additionalProperties: false
      properties:
        entity: {type: string}
        legalEntityId: {type: string, format: uuid}
        ledgerId: {type: string}
    RekeyPosting:
      type: object
      required: [kind, entity, documentRef, postedAt, account, currency, amount]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [JOURNAL, DOCUMENT]
        entity:
          type: string
          description: A legal entity of the plan.
        documentRef:
          type: string
        postedAt:
          type: string
          format: date-time
        account:
          type: string
        dimensions:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        amount:
          type: string
          description: Signed decimal, at most 6 places; debit positive, credit negative.
        text:
          type: string
