openapi: 3.1.0
info:
  title: Passage Migration Factory API
  version: 0.6.0
  description: |
    Slices 1 to 7 of wave 49 (PSG-49): the pack catalog, open_items and project_wip pack runs
    with control totals, quarantine release and the legacy cross-reference lookup, the
    parallel-run review, project opening balances, and the cutover runbook with timed steps, the
    generated rollback plan and the rollback re-keying export, and (slice 6) the load of an open_items
    run into the receivables service with its reconciliation, and (slice 7) the go/no-go decision of a cutover plan with its
    checklist. Source of truth for the handlers in
    internal/api. State is stored in Postgres under row-level security per tenant.

    Commands accept an optional `Idempotency-Key` header (at most 200 characters). A repeated
    key with the same request returns the stored outcome with `Idempotent-Replayed: true`; the
    same key with a different request is rejected with MIG-0007. Errors are RFC 9457 problem
    details (application/problem+json) with a stable `code`; see README.md.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
security:
  - bearerAuth: []
paths:
  /api/v1/migration/packs:
    get:
      operationId: listPackCatalog
      summary: The nine transactional packs (FR-49.1) for the migration factory workspace
      description: |
        Every pack covers AX2012, D365FO, SAPECC and S4HANA. `available` is true for the packs a
        run can be started for in this release (open_items and project_wip); the others return
        MIG-0005 from startPackRun. Reads no tenant data.
      x-passage-duty: MigrationView
      responses:
        "200":
          description: The catalog in FR-49.1 order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogEntry"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/packs/{pack}/runs:
    post:
      operationId: startPackRun
      summary: Validate, load and reconcile a pack extract (open_items, gl_balances or project_wip)
      description: |
        open_items takes a PackRunRequest, gl_balances a GLRunRequest and project_wip a
        ProjectRunRequest (FR-49.12: opening lines per project and category, reconciled per
        project to the legacy category totals; a project that does not reconcile is
        OPENING_MISMATCH and opening lines never post to the GL). Other packs return MIG-0005.
        gl_balances (FR-49.1, FR-49.2) refuses an extract whose debits differ from its credits in
        any currency, and one that names an account, dimension combination and currency the
        company already holds under another legacy id; it loads each balance as an opening
        balance and compares the balance per (company, account, dimensions, currency), the count
        of non-zero combinations and the trial balance per currency. With openItemsRunId it also
        compares the open items per control account with the migrated GL balance of that account
        (BR-49.2, gl_balances.control_account, MIG-1506 in mismatchMessages).
        Records failing the referential, domain or uniqueness rules are quarantined (FR-49.11);
        the run is rejected with MIG-1504 when they exceed quarantineMaxPct. Accepted records
        that legacy_xref already holds by (system, company, table, id) are not loaded again
        (FR-49.10). Every run is stored, with its input hash, and writes
        dev.passage.migration.pack.reconciled.v1. Status is RECONCILED only when no control
        total is MISMATCH. The body is limited to 16 MiB. An open_items run with a `load` object
        stages its accepted records for POST /migration/runs/{id}/load; its import source may not
        be one another legacy (system, company) already loads under (409 MIG-1526).
      x-passage-duty: MigrationRun
      parameters:
        - name: pack
          in: path
          required: true
          schema:
            type: string
            enum: [open_items, gl_balances, onhand, open_orders, wip_prod, fixed_assets, project_wip, payroll_ytd, bank_balances]
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PackRunRequest"
                - $ref: "#/components/schemas/GLRunRequest"
                - $ref: "#/components/schemas/ProjectRunRequest"
      responses:
        "201":
          description: The stored run (or the stored outcome of a repeated key).
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRunDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs:
    get:
      operationId: listPackRuns
      summary: Pack runs, newest first (inquiry "Pack runs", 9.49.14)
      x-passage-duty: MigrationView
      parameters:
        - name: pack
          in: query
          schema:
            type: string
            enum: [open_items, gl_balances, onhand, open_orders, wip_prod, fixed_assets, project_wip, payroll_ytd, bank_balances]
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RunStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: One page of runs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PackRun"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs/{id}:
    get:
      operationId: getPackRun
      summary: A pack run with its control totals and quarantined records
      x-passage-duty: MigrationView
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRunDetail"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs/{id}/control-totals:
    get:
      operationId: getControlTotals
      summary: Control totals and status for a pack run
      x-passage-duty: MigrationView
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Totals for the run.
          content:
            application/json:
              schema:
                type: object
                required: [runId, status, controlTotals]
                properties:
                  runId:
                    type: string
                    format: uuid
                  status:
                    $ref: "#/components/schemas/RunStatus"
                  controlTotals:
                    type: array
                    items:
                      $ref: "#/components/schemas/ControlTotal"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs/{id}/load:
    post:
      operationId: loadPackRunTarget
      summary: Load the open items of a run into receivables and reconcile the target's totals
      description: |
        Sends the run's pending rows (those the run staged because it was started with a `load`
        object) to receivables, POST /v1/receivables/open-items:batch, at most 1000 per request and
        non-atomic, as the service `migration-factory` acting as the `migration-loader` principal.
        Each request carries an Idempotency-Key derived from the run and its rows, so the same rows
        are the same request on every try; a 5xx, a 429 or a timeout is retried with backoff and,
        when the attempts are used up, the remaining rows stay pending and the load is PARTIAL
        (call again to resume). An answer that does not describe the batch also leaves its rows
        pending; a refusal of the whole request (a 4xx that is not a row result) stops the load as
        FAILED with 502 MIG-1524 and the rows stay pending. Receivables answers per row: CREATED, UPDATED and UNCHANGED rows
        are stored with the open-item id the target assigned, which also replaces the factory's
        provisional id in legacy_xref (once); a REJECTED row is recorded with the target's own
        code (AR-OPENING-INVALID, -DUPLICATE-KEY, -IDENTITY, -DOCUMENT-EXISTS, -SETTLED,
        -IN-COLLECTION). Rows equal to what the target already accepted under the same import
        source are not sent again, so a rerun of an unchanged snapshot sends nothing; a row the
        target stored whose answer was lost is sent again and answered UNCHANGED. Open AP rows
        (`ledger` AP) are NOT_AVAILABLE: payables has no opening-item API yet. When no row is
        pending, the target's totals (GET /v1/receivables/open-item-imports) are compared with
        what the factory sent, per currency: item count, debit, credit and net open. Both sides
        cover the whole import source in the legal entity, over every run that loaded into it
        (receivables totals the open amounts it holds now, so reconcile at the freeze). A
        difference is MISMATCH, never passed silently; totals that cannot be read, or not
        completely (receivables lists 500 or more import groups), are UNRECONCILED. The lines are
        control totals of the run named `target.receivables.*`. One load runs at a time per import
        source and legal entity (409 MIG-1522), and a run older than one already loaded under them
        is refused (409 MIG-1525). Without RECEIVABLES_URL and a service signing key the answer is
        503 MIG-1520; a refused service token is 502 MIG-1521.
        Writes dev.passage.migration.pack.loaded.v1.
      x-passage-duty: MigrationRun
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The pass ended; `status` says whether the target's totals match, rows are still pending, or the totals could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetLoad"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs/{id}/target-load:
    get:
      operationId: getTargetLoad
      summary: Load status, reconciliation lines and first rejects of a run's target load
      description: |
        `reconciliation` holds the run's `target.receivables.*` control totals (factory side as
        source, receivables as target). `rejects` lists up to 50 REJECTED rows and 50 NOT_AVAILABLE
        rows; page all rows with GET /migration/runs/{id}/target-rows. 409 MIG-1523 when the run
        was started without a load object.
      x-passage-duty: MigrationView
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The load.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetLoadDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs/{id}/target-rows:
    get:
      operationId: listTargetRows
      summary: Staged rows of a run's target load, by sequence
      x-passage-duty: MigrationView
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TargetRowStatus"
        - name: after
          in: query
          description: Sequence number of the last row of the previous page.
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of rows.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TargetRow"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs/{id}/quarantine/{rec}/release:
    post:
      operationId: releaseQuarantined
      summary: Correct and release a quarantined open item (FR-49.11)
      description: |
        Applies the party and account correction, re-runs the open-items suite against the run's
        master-data snapshot plus `parties`, and loads the record into legacy_xref. The run's
        counts, control totals and version change under its row lock; a corrected account moves
        the record's legacy amount to the corrected account's subtotal. When no total is
        MISMATCH any more the run moves to RECONCILED and writes
        dev.passage.migration.pack.reconciled.v1. Releasing a released record returns the run
        with Idempotent-Replayed (idempotent by record). Only LOADED open_items runs take a
        release (MIG-0004 otherwise, MIG-0005 for other packs).
      x-passage-duty: MigrationRun
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: rec
          in: path
          required: true
          description: The quarantined record's seq within the run.
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseRequest"
      responses:
        "200":
          description: The run after the release.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRunDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs/{id}/projects/{project}/opening:
    get:
      operationId: getProjectOpening
      summary: A project's opening lines and totals per category (FR-49.12, BR-49.12)
      description: |
        Lines are every opening line Passage holds for the project in the run's (system,
        company), ordered by legacy id and paged with limit and after (a legacy id). Totals are
        the run's reconciliation of the project; status is OPENING_MISMATCH while any differs.
      x-passage-duty: MigrationView
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: project
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - name: after
          in: query
          description: Legacy id of the last line of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: The project's opening balances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOpening"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/xref:
    get:
      operationId: lookupXref
      summary: Resolve a legacy id to its Passage record, or a Passage record to its legacy ids (FR-49.3)
      description: |
        Either system, table and id (company optional), or passageEntity and passageId. Any
        authenticated caller; the tenant comes from the principal. No match is 200 with no items.
      x-passage-duty: any authenticated
      parameters:
        - name: system
          in: query
          schema:
            type: string
            enum: [AX2012, D365FO, SAPECC, S4HANA]
        - name: company
          in: query
          schema:
            type: string
        - name: table
          in: query
          description: legacy_xref source_table, for example open_items or project_wip.
          schema:
            type: string
        - name: id
          in: query
          description: The legacy id.
          schema:
            type: string
        - name: passageEntity
          in: query
          schema:
            type: string
        - name: passageId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Matching cross-references, at most 200.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Xref"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/parallel-runs:
    post:
      operationId: startParallelRun
      summary: Diff a replayed period against the legacy period (FR-49.5)
      description: |
        Outer-joins the legacy and Passage tuples on (area, key) and classifies each difference
        EXPECTED (rule RND-001, at most 0.01) or UNEXPLAINED, stores the run in REVIEW with its
        variances and writes dev.passage.migration.parallelrun.diffed.v1. Idempotent by
        (period, sourceSystem): the same input returns the stored run with Idempotent-Replayed,
        other input for a stored period is MIG-0009. The body is limited to 16 MiB.
      x-passage-duty: MigrationRun
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParallelRunRequest"
      responses:
        "201":
          description: The stored run with its variances.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParallelRun"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listParallelRuns
      summary: Parallel runs, newest first, without variances
      x-passage-duty: MigrationView
      parameters:
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/ParallelState"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: One page of runs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ParallelRun"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/parallel-runs/{id}:
    get:
      operationId: getParallelRun
      summary: A parallel run with its variances (parallel-run variance report, 9.49.14)
      x-passage-duty: MigrationView
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParallelRun"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/parallel-runs/{id}/variances/{v}/explain:
    post:
      operationId: explainVariance
      summary: Attach a reason to an UNEXPLAINED variance, which becomes EXPLAINED
      description: |
        The reviewer must not be the user who started the run (MIG-001, 403 MIG-0008).
        Explaining again with the same reason returns the run with Idempotent-Replayed
        (idempotent by variance); another reason, or an EXPECTED variance, is MIG-0004.
      x-passage-duty: MigrationReview
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: v
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
                version:
                  type: integer
                  minimum: 1
                  description: The run version the reviewer saw; a stale one is MIG-0006.
      responses:
        "200":
          description: The run after the explanation.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParallelRun"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/parallel-runs/{id}/sign-off:
    post:
      operationId: signOffParallelRun
      summary: Sign off a parallel run as the calling reviewer (FR-49.5 step 6)
      description: |
        Refused with MIG-1509 while any variance is unexplained, and when the explained amount
        exceeds explainedMaxPct percent of revenue. The reviewer must not be the user who
        started the run (MIG-001, 403 MIG-0008).
      x-passage-duty: MigrationReview
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: The signed-off run.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParallelRun"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/cutover/plans/generate:
    post:
      operationId: generateCutoverPlan
      summary: Generate and store the timed runbook from the timeline baseline (FR-49.6)
      x-passage-duty: CutoverManager
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "201":
          description: The generated plan at version 1.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/cutover/plans:
    get:
      operationId: listCutoverPlans
      summary: Cutover plans, newest first, with step counts (inquiry "Cutover runbook status")
      x-passage-duty: CutoverManager
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: One page of plans, without their steps.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/cutover/plans/{id}:
    get:
      operationId: getCutoverPlan
      summary: A cutover plan with its steps and the BR-49.9 abort state at the time of the response
      x-passage-duty: CutoverManager
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/cutover/plans/{id}/steps/{seq}/start:
    post:
      operationId: startCutoverStep
      summary: Start a runbook step so the runbook times it against its planned duration (FR-49.6)
      description: |
        Records the start time and the user. A step starts once (MIG-0001 on a second start or a
        done step) and obeys the go/no-go sequencing of completion (CUT-1601). A rolled-back
        plan's steps cannot be started (MIG-0004). When `version` is given and the plan has moved
        on, the request is rejected with MIG-0006. No event is written; completion writes
        dev.passage.cutover.step.completed.v1.
      x-passage-duty: CutoverStepOwner
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: seq
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version:
                  type: integer
                  minimum: 1
                  description: The plan version the client read (optimistic check).
      responses:
        "200":
          description: The plan after the step started.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/cutover/plans/{id}/steps/{seq}/complete:
    post:
      operationId: completeCutoverStep
      summary: Mark a runbook step done. Rejects out-of-sequence go/no-go steps (CUT-1601).
      description: |
        Writes dev.passage.cutover.step.completed.v1. Without `actualDurationMin` the duration
        is measured in whole minutes from the step's start; a step that was never started needs
        it (MIG-0001). When `version` is given and the plan has moved on, the request is
        rejected with MIG-0006. A rolled-back plan's steps cannot be completed (MIG-0004).
      x-passage-duty: CutoverStepOwner
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: seq
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                actualDurationMin:
                  type: integer
                  minimum: 0
                  description: Minutes the step took. Optional for a started step.
                version:
                  type: integer
                  minimum: 1
                  description: The plan version the client read (optimistic check).
      responses:
        "200":
          description: The plan after the step completed.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/cutover/plans/{id}/go-no-go:
    get:
      operationId: getGoNoGoReadiness
      summary: The go/no-go checklist of a cutover plan evaluated now, with the decisions recorded so far
      description: |
        Evaluates the 14 phase-exit checklist items (PRD 9.49.1). `packs_reconciled` is met when,
        for every pack and every entity of the plan (entities are legacy company codes, matched to
        the run's source company), the latest pack run of that company is RECONCILED and was started
        at or after the legacy transaction freeze (T-0 minus 6 hours); earlier runs are dry runs or
        rehearsals and do not count. `parallel_run_signed_off` is met when the month before T-0 (UTC)
        has a parallel run and every parallel run of that month (one per legacy system) is
        SIGNED_OFF. The other twelve items are attested by the approvers: they show as the pending GO
        approval confirmed them (`pendingGo`), or UNCONFIRMED when there is none. `systemReady` is
        true when both items the factory evaluates are met and the plan is not rolled back. Reads only.
      x-passage-duty: CutoverManager
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The checklist, the items not met, and the decisions in the order recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    post:
      operationId: recordGoNoGoDecision
      summary: Record a go/no-go decision, or approve a GO, on a cutover plan as the calling user
      description: |
        Approvers are the authenticated callers, never names in the request (CUT-1605). A NO_GO is
        recorded at once with the caller as its approver; it needs a reason. A GO needs two
        different CutoverManagers: the first caller's GO is stored as their approval (202, with
        `pendingGo`), and a second, different caller's GO approves the same attestations (send none,
        or the same ones) and records the decision with both as approvers (201). The first approver
        cannot approve again (MIG-0004, CUT-1605); a NO_GO recorded in between voids a pending
        approval. Service principals cannot decide.

        The checklist is evaluated in the transaction that stores the request, so a GO rests on the
        pack runs and the parallel runs as they are at that moment. `attestations` confirm the
        attested items, each with a reference to its evidence (CUT-1606 when missing). A GO, and a
        GO approval, are refused with CUT-1607 while any item is not met; a GO is recorded once per
        plan (a later decision is MIG-0004). Nothing can be decided on a rolled-back plan (MIG-0004).
        A decision is stored with its checklist and writes dev.passage.cutover.decision.recorded.v1;
        a decision or an approval moves the plan's version. `version` works as on step completion.
      x-passage-duty: CutoverManager
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision:
                  type: string
                  enum: [GO, NO_GO]
                reason:
                  type: string
                  maxLength: 2000
                  description: Required for NO_GO.
                attestations:
                  type: array
                  description: Confirmations of the attested checklist items. The second approver of a GO sends none or the first approver's.
                  maxItems: 14
                  items:
                    type: object
                    required: [code, confirmed]
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        description: An attested checklist item code, for example opening_tb_signed.
                      confirmed:
                        type: boolean
                      reference:
                        type: string
                        maxLength: 500
                        description: Where the evidence is kept (a document link or ticket); required when confirmed.
                version:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: A decision was recorded (a NO_GO, or a GO by its second approver), with its checklist, and the plan after it.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                type: object
                required: [decision, plan]
                properties:
                  decision:
                    $ref: "#/components/schemas/Decision"
                  plan:
                    $ref: "#/components/schemas/Plan"
        "202":
          description: The caller's approval of a GO was stored; the GO is recorded when a second, different CutoverManager approves it.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                type: object
                required: [pendingGo, plan]
                properties:
                  pendingGo:
                    $ref: "#/components/schemas/GoApproval"
                  plan:
                    $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/cutover/plans/{id}/rollback:
    post:
      operationId: rollbackCutoverPlan
      summary: Execute the rollback and export the postings since T-0 for re-keying (FR-49.9). Needs two distinct approvers (CUT-1603).
      description: |
        Runs once per plan (a second rollback is MIG-0004). `postings` are the Passage postings
        made since go-live; lines dated before T-0 are counted as excluded, every line must be for
        an entity of the plan, and each journal (entity, document, currency) must balance. One bad
        posting rejects the request (MIG-0001) and leaves the plan as it was. The accepted lines are
        stored with the plan and served by GET .../rekeying/{file}. Writes
        dev.passage.cutover.plan.rolledback.v1 with the line counts. `version` works as on step
        completion. The body may be up to 16 MiB.
      x-passage-duty: CutoverManager
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvers]
              additionalProperties: false
              properties:
                approvers:
                  type: array
                  minItems: 2
                  items:
                    type: string
                postings:
                  type: array
                  description: Passage postings since T-0 to export for re-keying. Empty or absent when nothing was posted.
                  items:
                    $ref: "#/components/schemas/RekeyPosting"
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: The plan with rolledBack true and the re-keying counts.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/cutover/plans/{id}/rekeying/{file}:
    get:
      operationId: getRekeyingFile
      summary: One re-keying file of a rolled-back plan as CSV (FR-49.9, 9.49.15)
      description: |
        `journals.csv` has the columns entity, document_ref, line, posted_at, account, dimensions,
        currency, debit, credit, text; `documents.csv` has entity, document_ref, line, posted_at,
        account, dimensions, currency, amount, text. Lines are ordered by entity, posting time and
        document. Amounts have 6 decimal places; times are RFC 3339 UTC. A plan that has not been
        rolled back has no files (MIG-0004).
      x-passage-duty: CutoverManager
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: file
          in: path
          required: true
          schema:
            type: string
            enum: [journals.csv, documents.csv]
      responses:
        "200":
          description: The CSV file, with its header row.
          content:
            text/csv:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    After:
      name: after
      in: query
      description: Id of the last item of the previous page.
      schema:
        type: string
        format: uuid
  headers:
    IdempotentReplayed:
      description: "true when the response is the stored outcome of a repeated Idempotency-Key."
      schema:
        type: string
        enum: ["true"]
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
    RunStatus:
      type: string
      enum: [EXTRACTED, VALIDATED, LOADED, RECONCILED, FAILED, ROLLED_BACK]
    Record:
      type: object
      required: [legacyId, party, account, currency, amount]
      additionalProperties: false
      properties:
        legacyId:
          type: string
        party:
          type: string
        account:
          type: string
          description: Control account; blank is a DOMAIN failure.
        currency:
          type: string
          description: ISO 4217 code; an unknown code is a DOMAIN failure.
        amount:
          type: string
          description: Decimal string in transaction currency. Never a float.
    ExtractRecord:
      type: object
      required: [legacyId, party, account, currency, amount]
      additionalProperties: false
      description: |
        A Record plus, for a run with a `load` object, the fields of the receivables row. `amount` is the open
        amount with its sign (a credit is negative); the side follows the sign and the row sends magnitudes.
      properties:
        legacyId:
          type: string
        party:
          type: string
        account:
          type: string
          description: Control account; blank is a DOMAIN failure.
        currency:
          type: string
          description: ISO 4217 code; an unknown code is a DOMAIN failure.
        amount:
          type: string
          description: Decimal string in transaction currency. Never a float.
        ledger:
          type: string
          enum: [AR, AP]
          description: Default AR. An AP record is NOT_AVAILABLE at the target (payables has no opening-item API yet).
        documentNumber:
          type: string
          description: Defaults to the legacy id.
        customerId:
          type: string
          format: uuid
          description: Passage customer id. Defaults to load.customerIds[party], then to the party when that is a UUID; a record with none is rejected MIG-REF-UNRESOLVED.
        kind:
          type: string
          enum: [INVOICE, CREDIT_NOTE, PAYMENT, ADJUSTMENT]
          description: Defaults to INVOICE for a debit and CREDIT_NOTE for a credit.
        documentDate:
          type: string
          format: date
          description: Required with a load object (MIG-LOAD-FIELD-REQUIRED).
        dueDate:
          type: string
          format: date
          description: Required with a load object.
        originalAmount:
          type: string
          description: Magnitude; defaults to the open amount. A part-paid legacy invoice sends the larger original.
        cashDiscountDate:
          type: string
          format: date
        cashDiscountAmount:
          type: string
    LoadRequest:
      type: object
      required: [target, legalEntityId]
      additionalProperties: false
      description: Stages the accepted records for loading into the target service. Nothing is sent until POST /migration/runs/{id}/load.
      properties:
        target:
          type: string
          enum: [receivables]
        legalEntityId:
          type: string
          format: uuid
          description: Legal entity the open items belong to; must be inside the caller's scope.
        importSource:
          type: string
          maxLength: 40
          description: The legacy-system label receivables keys the items under with the legacy id. Defaults to the lower-cased source system and company, for example ax2012.usmf.
        customerIds:
          type: object
          description: Legacy party id to Passage customer id.
          additionalProperties:
            type: string
            format: uuid
    PackRunRequest:
      type: object
      required: [sourceSystem, sourceCompany, cutoffTs, freezeTs, parties, records]
      additionalProperties: false
      properties:
        sourceSystem:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        sourceCompany:
          type: string
          minLength: 1
          description: DataAreaId (AX) or BUKRS (SAP).
        cutoffTs:
          type: string
          format: date-time
          description: Must not be after freezeTs (MIG-1501).
        freezeTs:
          type: string
          format: date-time
        quarantineMaxPct:
          type: string
          description: Decimal percent from 0 to 10; defaults to 1.0 (migration.quarantine_max_pct).
        parties:
          type: array
          description: Vendor and customer ids in master data (referential rule).
          items:
            type: string
        records:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExtractRecord"
        load:
          $ref: "#/components/schemas/LoadRequest"
    GLBalance:
      type: object
      required: [legacyId, account, currency, balance]
      additionalProperties: false
      properties:
        legacyId:
          type: string
        account:
          type: string
          description: Main account; one missing from accounts is a REFERENTIAL failure.
        dimensions:
          type: string
          description: The legacy dimension combination as one display value; blank for none.
        currency:
          type: string
          description: ISO 4217 code; an unknown code is a DOMAIN failure.
        balance:
          type: string
          description: Signed decimal string at the cutoff, debit positive and credit negative, at most 6 decimal places. Never a float.
    GLRunRequest:
      type: object
      required: [sourceSystem, sourceCompany, cutoffTs, freezeTs, accounts, records]
      additionalProperties: false
      properties:
        sourceSystem:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        sourceCompany:
          type: string
          minLength: 1
          description: DataAreaId (AX) or BUKRS (SAP).
        cutoffTs:
          type: string
          format: date-time
          description: Must not be after freezeTs (MIG-1501).
        freezeTs:
          type: string
          format: date-time
        quarantineMaxPct:
          type: string
          description: Decimal percent from 0 to 10; defaults to 1.0 (migration.quarantine_max_pct).
        accounts:
          type: array
          minItems: 1
          description: The chart of accounts the balances are checked against (referential rule).
          items:
            type: string
        openItemsRunId:
          type: string
          format: uuid
          description: A LOADED or RECONCILED open_items run of the same system and company whose control accounts must equal the GL balances (BR-49.2).
        records:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GLBalance"
    ControlTotal:
      type: object
      required: [name, key, source, target, delta, tolerance, status]
      properties:
        name:
          type: string
          enum: [open_items.amount, open_items.amount_by_account, open_items.count, gl_balances.balance, gl_balances.nonzero_count,
            gl_balances.trial_balance, gl_balances.control_account, project_wip.cost, project_wip.sales, project_wip.wip_cost, project_wip.wip_sales,
            target.receivables.item_count, target.receivables.debit_open, target.receivables.credit_open, target.receivables.net_open]
        key:
          type: object
          additionalProperties:
            type: string
        source:
          type: string
          description: Legacy value, decimal string with 6 places.
        target:
          type: string
          description: Value held in Passage, decimal string with 6 places.
        delta:
          type: string
          description: target - source.
        tolerance:
          type: string
        toleranceReason:
          type: string
        status:
          type: string
          enum: [MATCH, WITHIN_TOLERANCE, MISMATCH]
    Quarantined:
      type: object
      required: [seq, legacyId, rule, reason, status, amount]
      properties:
        seq:
          type: integer
          description: Addresses the record within its run (release path parameter).
        legacyId:
          type: string
        rule:
          type: string
          enum: [REFERENTIAL, DOMAIN, UNIQUENESS]
        reason:
          type: string
        status:
          type: string
          enum: [OPEN, RELEASED]
        party:
          type: string
        account:
          type: string
        dimensions:
          type: string
          description: Dimension combination of a quarantined gl_balances balance.
        currency:
          type: string
        amount:
          type: string
          description: Decimal string as extracted (cost amount for a project line, balance for a GL balance).
        released:
          $ref: "#/components/schemas/Record"
        releasedBy:
          type: string
        releasedAt:
          type: string
          format: date-time
    PackRun:
      type: object
      required: [runId, pack, sourceSystem, sourceCompany, cutoffTs, inputHash, status, recordsIn, recordsLoaded, recordsQuarantined, alreadyPresent, version, createdAt]
      properties:
        runId:
          type: string
          format: uuid
        pack:
          type: string
        sourceSystem:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        sourceCompany:
          type: string
        cutoffTs:
          type: string
          format: date-time
        inputHash:
          type: string
          description: sha256 hex of the sorted (legacy id, amount) pairs of the extract; for gl_balances each legacy id carries its account, dimensions and currency.
        status:
          $ref: "#/components/schemas/RunStatus"
        recordsIn:
          type: integer
        recordsLoaded:
          type: integer
        recordsQuarantined:
          type: integer
        alreadyPresent:
          type: integer
          description: Accepted records legacy_xref already held, so not loaded again.
        message:
          type: string
          description: MIG-1505 text when a re-run loaded nothing new.
        openItemsRunId:
          type: string
          format: uuid
          description: The open_items run a gl_balances run reconciled its control accounts with (BR-49.2).
        version:
          type: integer
          minimum: 1
          description: Bumped by every release; a release with a stale version is MIG-0006.
        createdAt:
          type: string
          format: date-time
    PackRunDetail:
      allOf:
        - $ref: "#/components/schemas/PackRun"
        - type: object
          required: [controlTotals, quarantined]
          properties:
            controlTotals:
              type: array
              items:
                $ref: "#/components/schemas/ControlTotal"
            quarantined:
              type: array
              items:
                $ref: "#/components/schemas/Quarantined"
            mismatchMessages:
              type: array
              description: MIG-1506 text for every gl_balances.control_account total that is MISMATCH.
              items:
                type: string
            targetLoad:
              $ref: "#/components/schemas/TargetLoad"
    TargetRowStatus:
      type: string
      enum: [PENDING, LOADED, UNCHANGED, SKIPPED, REJECTED, NOT_AVAILABLE]
      description: |
        PENDING is still to send; LOADED the target created or updated it; UNCHANGED the target held it already;
        SKIPPED equals what the target accepted before, so it was not sent; REJECTED carries the code (the target's
        AR-OPENING-* or the factory's MIG-LOAD-FIELD-REQUIRED / MIG-REF-UNRESOLVED / MIG-TARGET-REFUSED);
        NOT_AVAILABLE is open AP (MIG-TARGET-NOT-AVAILABLE).
    TargetLoad:
      type: object
      required: [runId, target, legalEntityId, importSource, status, clean, staged, created, updated, unchanged, skipped, rejected, notAvailable, pending, attempts, version]
      properties:
        runId:
          type: string
          format: uuid
        target:
          type: string
          enum: [receivables]
        legalEntityId:
          type: string
          format: uuid
        importSource:
          type: string
        status:
          type: string
          enum: [STAGED, LOADING, PARTIAL, UNRECONCILED, MISMATCH, RECONCILED, FAILED]
          description: |
            STAGED nothing sent yet; LOADING a pass is running; PARTIAL rows are still pending because the target
            did not answer; UNRECONCILED every row was sent but the target's totals could not be read; MISMATCH the
            target's totals differ from what the factory sent; RECONCILED they match; FAILED the target refused the
            factory's service token.
        clean:
          type: boolean
          description: RECONCILED with no row pending, rejected or unavailable.
        staged:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        skipped:
          type: integer
        rejected:
          type: integer
        notAvailable:
          type: integer
        pending:
          type: integer
        attempts:
          type: integer
        lastError:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        version:
          type: integer
    TargetRow:
      type: object
      required: [seq, legacyId, ledger, status]
      properties:
        seq:
          type: integer
        legacyId:
          type: string
        ledger:
          type: string
          enum: [AR, AP]
        status:
          $ref: "#/components/schemas/TargetRowStatus"
        outcome:
          type: string
          description: The target's outcome for the row (CREATED, UPDATED, UNCHANGED, REJECTED).
        openItemId:
          type: string
          format: uuid
        code:
          type: string
        detail:
          type: string
        side:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          type: string
          description: Open amount (magnitude).
        currency:
          type: string
        customerId:
          type: string
          format: uuid
    TargetLoadDetail:
      allOf:
        - $ref: "#/components/schemas/TargetLoad"
        - type: object
          required: [reconciliation, rejects]
          properties:
            reconciliation:
              type: array
              items:
                $ref: "#/components/schemas/ControlTotal"
            rejects:
              type: array
              items:
                $ref: "#/components/schemas/TargetRow"
    ReleaseRequest:
      type: object
      additionalProperties: false
      properties:
        party:
          type: string
          description: Corrected party; blank keeps the extracted one.
        account:
          type: string
          description: Corrected control account; blank keeps the extracted one.
        parties:
          type: array
          description: Party ids added to master data since the run, checked with the run's snapshot.
          items:
            type: string
        version:
          type: integer
          minimum: 1
    OpeningLine:
      type: object
      required: [legacyId, category, transactionDate, costAmount, salesAmount, currency, billingStatus]
      additionalProperties: false
      properties:
        legacyId:
          type: string
          description: Unique across the extract; ProjTrans* RecId or the CO line id.
        category:
          $ref: "#/components/schemas/Category"
        transactionDate:
          type: string
          format: date
          description: Not after cutoffTs (DOMAIN otherwise).
        qty:
          type: string
        costAmount:
          type: string
        salesAmount:
          type: string
        currency:
          type: string
        workerId:
          type: string
        activityId:
          type: string
        dimensions:
          type: object
          additionalProperties:
            type: string
        billingStatus:
          type: string
          enum: [CHARGEABLE_UNBILLED, BILLED, NON_CHARGEABLE]
          description: ON_ACCOUNT lines are BILLED; NON_CHARGEABLE lines carry no WIP sales (DOMAIN otherwise).
        wipCost:
          type: string
        wipSales:
          type: string
    Category:
      type: string
      enum: [HOUR, EXPENSE, ITEM, FEE, ON_ACCOUNT]
    LegacyCategoryTotal:
      type: object
      required: [category]
      additionalProperties: false
      properties:
        category:
          $ref: "#/components/schemas/Category"
        cost:
          type: string
        sales:
          type: string
        wipCost:
          type: string
        wipSales:
          type: string
    ProjectRunRequest:
      type: object
      required: [sourceSystem, sourceCompany, cutoffTs, freezeTs, projects]
      additionalProperties: false
      properties:
        sourceSystem:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        sourceCompany:
          type: string
          minLength: 1
        cutoffTs:
          type: string
          format: date-time
        freezeTs:
          type: string
          format: date-time
        quarantineMaxPct:
          type: string
        projects:
          type: array
          minItems: 1
          items:
            type: object
            required: [projectId, legacyTotals, lines]
            additionalProperties: false
            properties:
              projectId:
                type: string
                minLength: 1
              legacyTotals:
                type: array
                description: The legacy ProjTrans*/COSP-COSS and RA totals per category, at most one per category.
                items:
                  $ref: "#/components/schemas/LegacyCategoryTotal"
              lines:
                type: array
                items:
                  $ref: "#/components/schemas/OpeningLine"
    ProjectOpening:
      type: object
      required: [runId, projectId, status, totals, lineCount, lines]
      properties:
        runId:
          type: string
          format: uuid
        projectId:
          type: string
        status:
          type: string
          enum: [RECONCILED, OPENING_MISMATCH]
        totals:
          type: array
          items:
            $ref: "#/components/schemas/ControlTotal"
        lineCount:
          type: integer
        lines:
          type: array
          description: |
            Each line is an OpeningLine (qty, wipCost and wipSales always present, amounts as
            decimal strings with 6 places) plus beginningBalance, which is always true.
          items:
            type: object
            required: [legacyId, category, transactionDate, qty, costAmount, salesAmount, currency, billingStatus, wipCost, wipSales, beginningBalance]
            properties:
              legacyId:
                type: string
              category:
                $ref: "#/components/schemas/Category"
              transactionDate:
                type: string
                format: date
              qty:
                type: string
              costAmount:
                type: string
              salesAmount:
                type: string
              currency:
                type: string
              workerId:
                type: string
              activityId:
                type: string
              dimensions:
                type: object
                additionalProperties:
                  type: string
              billingStatus:
                type: string
                enum: [CHARGEABLE_UNBILLED, BILLED, NON_CHARGEABLE]
              wipCost:
                type: string
              wipSales:
                type: string
              beginningBalance:
                const: true
    Xref:
      type: object
      required: [xrefId, system, company, table, legacyId, passageEntity, passageId, runId, createdAt, targetConfirmed]
      properties:
        xrefId:
          type: string
          format: uuid
        system:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        company:
          type: string
        table:
          type: string
        legacyId:
          type: string
        passageEntity:
          type: string
          enum: [open_item, project_opening_line]
        passageId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        targetConfirmed:
          type: boolean
          description: True once passageId is the id the target service assigned; until then it is the factory's own.
    ParallelState:
      type: string
      enum: [REPLAYING, DIFFING, REVIEW, SIGNED_OFF]
    Tuple:
      type: object
      required: [area, key, amount]
      additionalProperties: false
      properties:
        area:
          type: string
          enum: [TB, INV, AP, AR, FA]
        key:
          type: string
          minLength: 1
          description: The canonical tuple key, for example entity|account|dimensions|currency|period.
        amount:
          type: string
    ParallelRunRequest:
      type: object
      required: [period, sourceSystem, documentsReplayed, revenue]
      additionalProperties: false
      properties:
        period:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        sourceSystem:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        documentsReplayed:
          type: integer
          minimum: 0
        revenue:
          type: string
          description: Period revenue, the base of the explained-amount limit.
        explainedMaxPct:
          type: string
          description: Percent of revenue from 0 to 1; defaults to 0.1 (migration.parallel.explained_max_pct_revenue).
        legacy:
          type: array
          items:
            $ref: "#/components/schemas/Tuple"
        passage:
          type: array
          items:
            $ref: "#/components/schemas/Tuple"
    Variance:
      type: object
      required: [varianceId, area, key, legacy, passage, delta, class]
      properties:
        varianceId:
          type: string
          format: uuid
        area:
          type: string
          enum: [TB, INV, AP, AR, FA]
        key:
          type: string
        legacy:
          type: string
        passage:
          type: string
        delta:
          type: string
          description: passage - legacy.
        class:
          type: string
          enum: [EXPECTED, EXPLAINED, UNEXPLAINED]
        ruleId:
          type: string
        reason:
          type: string
        explainedBy:
          type: string
        explainedAt:
          type: string
          format: date-time
    ParallelRun:
      type: object
      required: [parallelRunId, period, sourceSystem, documentsReplayed, revenue, explainedMaxPct, inputHash, state, unexplainedCount, unexplainedAmount, explainedAmount, expectedByRule, canSignOff, version, createdAt]
      properties:
        parallelRunId:
          type: string
          format: uuid
        period:
          type: string
        sourceSystem:
          type: string
          enum: [AX2012, D365FO, SAPECC, S4HANA]
        documentsReplayed:
          type: integer
        revenue:
          type: string
        explainedMaxPct:
          type: string
        inputHash:
          type: string
        state:
          $ref: "#/components/schemas/ParallelState"
        unexplainedCount:
          type: integer
        unexplainedAmount:
          type: string
        explainedAmount:
          type: string
        expectedByRule:
          type: object
          description: Variance count per rule id.
          additionalProperties:
            type: integer
        canSignOff:
          type: boolean
          description: The FR-49.5 exit criterion holds now.
        signOffBlocker:
          type: string
          description: Why the run cannot be signed off yet (MIG-1509 or the explained-amount limit).
        startedBy:
          type: string
        signedOffBy:
          type: string
        signedOffAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        variances:
          type: array
          description: Present on start, get and commands; absent in the list.
          items:
            $ref: "#/components/schemas/Variance"
    GenerateRequest:
      type: object
      required: [t0, packs, entities]
      additionalProperties: false
      properties:
        t0:
          type: string
          format: date-time
          description: cutover.t0, 00:00 of cutover day.
        packs:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [open_items, gl_balances, onhand, open_orders, wip_prod, fixed_assets, project_wip, payroll_ytd, bank_balances]
        entities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        abortOffsetHours:
          type: integer
          minimum: 12
          maximum: 72
          default: 36
        rehearsalDurationsMin:
          type: object
          description: Step name to the duration measured in the last rehearsal, in minutes.
          additionalProperties:
            type: integer
            minimum: 0
    Step:
      type: object
      required: [seq, offsetMin, name, owner, plannedDurationMin, actualDurationMin, status, goNoGo]
      properties:
        seq:
          type: integer
        offsetMin:
          type: integer
          description: Minutes from T-0.
        name:
          type: string
        owner:
          type: string
        plannedDurationMin:
          type: integer
        actualDurationMin:
          type: integer
        status:
          type: string
          enum: [PENDING, DONE]
        goNoGo:
          type: boolean
        pack:
          type: string
        completedBy:
          type: string
        completedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          description: Set once the step is started; the runbook timer runs from it (FR-49.6).
        startedBy:
          type: string
        elapsedMin:
          type: integer
          minimum: 0
          description: |
            Elapsed minutes at the time of the response: from the start for a running step, the
            recorded duration for a done step. Absent for a step not started.
        tone:
          type: string
          enum: [ok, amber, red]
          description: Elapsed against planned, amber at 110 % and red at 125 % (9.49.6). Absent with elapsedMin.
        overrunWarning:
          type: string
          description: CUT-1602 text for a running step at or above the amber percentage.
    RollbackStep:
      type: object
      required: [seq, offsetMin, name, owner, plannedDurationMin, decisionPoint]
      properties:
        seq:
          type: integer
          minimum: 1
        offsetMin:
          type: integer
          description: Minutes from T-0. The first step is at the abort deadline; each later step starts when the one before is planned to end.
        name:
          type: string
        owner:
          type: string
        plannedDurationMin:
          type: integer
          minimum: 1
        decisionPoint:
          type: boolean
          description: True for the first step, the rollback decision at the abort deadline (BR-49.9).
    CatalogEntry:
      type: object
      required: [pack, sourceSystems, controlTotals, available]
      properties:
        pack:
          type: string
          enum: [open_items, gl_balances, onhand, open_orders, wip_prod, fixed_assets, project_wip, payroll_ytd, bank_balances]
        sourceSystems:
          type: array
          items:
            type: string
            enum: [AX2012, D365FO, SAPECC, S4HANA]
        controlTotals:
          type: string
          description: The FR-49.2 control totals the pack compares.
        available:
          type: boolean
          description: A run can be started for this pack in this release.
    ChecklistItem:
      type: object
      required: [code, title, source, status, references]
      properties:
        code:
          type: string
        title:
          type: string
        source:
          type: string
          enum: [system, attested]
          description: system items are evaluated from the factory's own data; attested items are confirmed by the approvers.
        status:
          type: string
          enum: [MET, OPEN, UNCONFIRMED]
        detail:
          type: string
        references:
          type: array
          description: Run ids (pack runs or parallel runs) the item rests on.
          items:
            type: string
    GoApproval:
      type: object
      description: A CutoverManager's approval of a GO, waiting for a second, different approver (CUT-1605).
      required: [round, approver, attestations, planVersion, approvedAt]
      properties:
        round:
          type: integer
          minimum: 1
          description: The seq the decision takes when it is recorded; a decision recorded in between voids the approval.
        approver:
          type: string
          description: The authenticated user who approved.
        attestations:
          type: array
          description: The confirmed attested items with their evidence references; the second approver approves these.
          items:
            type: object
            required: [code, confirmed]
            properties:
              code:
                type: string
              confirmed:
                type: boolean
              reference:
                type: string
        planVersion:
          type: integer
          minimum: 2
        approvedAt:
          type: string
          format: date-time
    DecisionSummary:
      type: object
      required: [seq, decision, approvers, decidedAt]
      properties:
        seq:
          type: integer
          minimum: 1
        decision:
          type: string
          enum: [GO, NO_GO]
        approvers:
          type: array
          description: Authenticated users who approved, in order; two for a GO, the recording user for a NO_GO.
          items:
            type: string
        reason:
          type: string
        decidedBy:
          type: string
          description: The user who recorded the decision (the last approver).
        decidedAt:
          type: string
          format: date-time
    Decision:
      allOf:
        - $ref: "#/components/schemas/DecisionSummary"
        - type: object
          required: [planVersion, checklist]
          properties:
            planVersion:
              type: integer
              minimum: 2
              description: The plan's version after the decision.
            checklist:
              type: array
              description: The checklist as evaluated when the decision was taken.
              items:
                $ref: "#/components/schemas/ChecklistItem"
    Readiness:
      type: object
      required: [planId, version, rolledBack, systemReady, items, openItems, decisions]
      properties:
        planId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        rolledBack:
          type: boolean
        systemReady:
          type: boolean
          description: Both items the factory evaluates are met and the plan is not rolled back.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        openItems:
          type: array
          description: Codes of the items not MET.
          items:
            type: string
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
        pendingGo:
          $ref: "#/components/schemas/GoApproval"
    Plan:
      type: object
      required: [planId, t0, packs, entities, abortOffsetMin, rolledBack, approvers, version, createdAt, stepsDone, stepsTotal, openGoNoGo, abortDue]
      properties:
        planId:
          type: string
          format: uuid
        t0:
          type: string
          format: date-time
        packs:
          type: array
          items:
            type: string
        entities:
          type: array
          items:
            type: string
        abortOffsetMin:
          type: integer
        rolledBack:
          type: boolean
        approvers:
          type: array
          description: The two or more distinct rollback approvers, once rolled back.
          items:
            type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        stepsDone:
          type: integer
        stepsTotal:
          type: integer
        openGoNoGo:
          type: array
          description: Names of go/no-go steps not yet done.
          items:
            type: string
        abortDue:
          type: boolean
          description: The abort deadline has passed with go/no-go items open (BR-49.9).
        abortWarning:
          type: string
          description: CUT-1604 text in the hour before the deadline.
        decision:
          description: The latest go/no-go decision; absent until one is recorded.
          $ref: "#/components/schemas/DecisionSummary"
        rekeying:
          type: object
          description: Present once the plan is rolled back. The lines exported for re-keying (FR-49.9).
          required: [journalLines, documentLines, excluded]
          properties:
            journalLines:
              type: integer
              minimum: 0
            documentLines:
              type: integer
              minimum: 0
            excluded:
              type: integer
              minimum: 0
              description: Postings given with the rollback that were dated before T-0 and left out.
        steps:
          type: array
          description: Present on generate, get and commands; absent in the list.
          items:
            $ref: "#/components/schemas/Step"
        rollbackSteps:
          type: array
          description: The generated rollback plan (FR-49.9), sent with the steps.
          items:
            $ref: "#/components/schemas/RollbackStep"
    RekeyPosting:
      type: object
      required: [kind, entity, documentRef, postedAt, account, currency, amount]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [JOURNAL, DOCUMENT]
        entity:
          type: string
          description: A legal entity of the plan.
        documentRef:
          type: string
        postedAt:
          type: string
          format: date-time
        account:
          type: string
        dimensions:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        amount:
          type: string
          description: Signed decimal, at most 6 places; debit positive, credit negative.
        text:
          type: string
