openapi: 3.1.0
info:
  title: Passage Migration Factory API
  version: 0.7.0
  description: |
    Slices 1 to 7 of wave 49 (PSG-49): the pack catalog, open_items and project_wip pack runs
    with control totals, quarantine release and the legacy cross-reference lookup, the
    parallel-run review, project opening balances, and the cutover runbook with timed steps, the
    generated rollback plan and the rollback re-keying export, and (slice 6) the load of an open_items
    run into the receivables service with its reconciliation, and (slice 7) the go/no-go decision of a cutover plan with its
    checklist. Source of truth for the handlers in
    internal/api. State is stored in Postgres under row-level security per tenant.

    Commands accept an optional `Idempotency-Key` header (at most 200 characters). A repeated
    key with the same request returns the stored outcome with `Idempotent-Replayed: true`; the
    same key with a different request is rejected with MIG-0007. Errors are RFC 9457 problem
    details (application/problem+json) with a stable `code`; see README.md.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
security:
  - bearerAuth: []
paths:
  /api/v1/migration/packs:
    get:
      operationId: listPackCatalog
      summary: The nine transactional packs (FR-49.1) for the migration factory workspace
      description: |
        Every pack covers AX2012, D365FO, SAPECC and S4HANA. `available` is true for the packs a
        run can be started for in this release (open_items and project_wip); the others return
        MIG-0005 from startPackRun. Reads no tenant data.
      x-passage-duty: migration.factory.view
      responses:
        "200":
          description: The catalog in FR-49.1 order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogEntry"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/packs/{pack}/runs:
    post:
      operationId: startPackRun
      summary: Validate, load and reconcile a pack extract (open_items, gl_balances, onhand, open_orders, bank_balances or project_wip)
      description: |
        open_items takes a PackRunRequest, gl_balances a GLRunRequest, onhand an OnhandRunRequest
        open_orders an OpenOrdersRunRequest, bank_balances a BankRunRequest and project_wip a ProjectRunRequest (FR-49.12: opening lines per project and category, reconciled per
        project to the legacy category totals; a project that does not reconcile is
        OPENING_MISMATCH and opening lines never post to the GL). Other packs return MIG-0005.
        gl_balances (FR-49.1, FR-49.2) refuses an extract whose debits differ from its credits in
        any currency, and one that names an account, dimension combination and currency the
        company already holds under another legacy id; it loads each balance as an opening
        balance and compares the balance per (company, account, dimensions, currency), the count
        of non-zero combinations and the trial balance per currency. With openItemsRunId it also
        compares the open items per control account with the migrated GL balance of that account
        (BR-49.2, gl_balances.control_account, MIG-1506 in mismatchMessages).
        onhand (FR-49.1, FR-49.2, BR-49.3) validates each line (item in the item master, a site
        and warehouse, a positive quantity, a non-negative value at legacy cost, a serial of
        exactly one, once per item), refuses one that names an item and inventory dimension, or a
        serial of an item at any dimension, that the company already holds under another legacy
        id, loads each line as opening stock with its legacy
        reference and compares the quantity per item and dimension, the value per item and site,
        and the value per company and currency. With glRunId and inventoryAccount it also compares
        the migrated balance of that GL account with the loaded value (onhand.inventory_account,
        MIG-1502 in mismatchMessages). Nothing posts to the inventory ledger, so the cutover
        go/no-go keeps packs_reconciled open for a plan that includes onhand unless both approvers waive it.
        bank_balances (FR-49.1, FR-49.2) validates each line (bank account in the bank account master, once
        per extract, ISO 4217 currency, the balance signed and in whole minor units of the currency), refuses an account the company already holds
        under another legacy id, loads each as an opening balance with its legacy reference and compares the
        balance per (bank account, currency), per company and currency, and the account count. It is staged
        in the factory and not posted to treasury either.
        open_orders (FR-49.1, FR-49.2) validates each open order line (an order type of SALES or PURCHASE, the item in
        the item master, the party in the customer master of a sales order or the vendor master of a purchase order,
        each order line once, a unit, ISO 4217 currency, a positive ordered quantity, a delivered quantity below it, a
        price of zero or more, an ISO delivery date), quarantines a fully delivered line as not open, refuses an order
        line the company already holds under another legacy id, loads each as an opening order line with its legacy
        reference and compares the open quantity per (order type, item, unit), the open value per (order type,
        currency; open quantity at the unit price, to six decimals) and the line and order counts per order type.
        It is staged in the factory and not posted to sales or purchasing (H-S11-1), so the go/no-go keeps
        packs_reconciled open unless both approvers waive it. An open_items run holding payables lines
        (ledger AP) that payables cannot take yet (H-S8-3) is likewise staged for them and needs a waiver.
        The legacy id of an open item is unique per side: a receivable and a payable with the same id
        (AX CustTransOpen and VendTransOpen RecIds, SAP BSID and BSIK keys) are two items, held in legacy_xref
        under open_items.receivable and open_items.payable.
        wip_prod, fixed_assets and payroll_ytd take a StagedRunRequest whose `master` lists the items,
        depreciation books or workers the referential rule checks. They are staged in the factory
        (`staged_opening_line`) and not posted to production, fixed assets or payroll (D1a). A fixed
        asset whose next depreciation, recomputed from the loaded values (SL or DB), is more than 0.01
        off the legacy projection is quarantined with MIG-1507 (BR-49.6); a payroll year whose net is
        not gross - tax - deductions is quarantined (DOMAIN).
        Records failing the referential, domain or uniqueness rules are quarantined (FR-49.11);
        the run is rejected with MIG-1504 when they exceed quarantineMaxPct. Accepted records
        that legacy_xref already holds by (system, company, table, id) are not loaded again
        (FR-49.10). Every run is stored, with its input hash, and writes
        dev.passage.migration.pack.reconciled.v1. Status is RECONCILED only when no control
        total is MISMATCH. The body is limited to 16 MiB. An open_items run with a `load` object
        stages its accepted records for POST /migration/runs/{id}/load; its import source may not
        be one another legacy (system, company) already loads under (409 MIG-1526).
      x-passage-duty: migration.factory.run
      parameters:
        - name: pack
          in: path
          required: true
          schema:
            type: string
            enum: [open_items, gl_balances, onhand, open_orders, wip_prod, fixed_assets, project_wip, payroll_ytd, bank_balances]
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PackRunRequest"
                - $ref: "#/components/schemas/GLRunRequest"
                - $ref: "#/components/schemas/OnhandRunRequest"
                - $ref: "#/components/schemas/OpenOrdersRunRequest"
                - $ref: "#/components/schemas/BankRunRequest"
                - $ref: "#/components/schemas/ProjectRunRequest"
                - $ref: "#/components/schemas/StagedRunRequest"
      responses:
        "201":
          description: The stored run (or the stored outcome of a repeated key).
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRunDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/tolerances:
    get:
      operationId: listTolerances
      summary: Configured control-total tolerances (FR-49.2, migration.tolerance.<pack>)
      description: |
        The tolerances set for the tenant. A control total without a row compares at 0.00.
      x-passage-duty: migration.factory.view
      responses:
        "200":
          description: Every configured tolerance, ordered by pack and total.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tolerance"
        "403":
          $ref: "#/components/responses/Problem"
    put:
      operationId: putTolerance
      summary: Set the tolerance of a pack's control total (FR-49.2)
      description: |
        Sets the allowance for one money total of a pack (`total` such as `open_items.amount`), or
        for every money total of the pack that has none of its own (`total` is `*`). A money total
        is an amount in one currency, and the tolerance is the absolute delta allowed on each such
        total in its own currency; deltas are never added across currencies. Counts, quantities and
        the project_wip measures always compare at 0.00, so a tolerance for them, or for a pack
        without money totals, is 422 MIG-0001. A positive amount needs a reason. The amount applies
        to the pack runs started after the change: a delta inside it is WITHIN_TOLERANCE and does not
        hold the run back from RECONCILED. A run already started keeps the tolerance it reconciled
        with, also through quarantine releases. Pass the stored `version` to change an existing
        tolerance and omit it for a new one (409 MIG-0006 when stale or when another first
        configuration won). Writes dev.passage.migration.tolerance.configured.v1.
      x-passage-duty: migration.factory.review
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pack, total, amount]
              properties:
                pack:
                  type: string
                  enum: [open_items, gl_balances, onhand, open_orders, bank_balances]
                  description: A pack with money totals; the others are 422 MIG-0001.
                total:
                  type: string
                  enum:
                    - "*"
                    - open_items.amount
                    - open_items.amount_by_account
                    - gl_balances.balance
                    - gl_balances.trial_balance
                    - gl_balances.control_account
                    - onhand.value
                    - onhand.value_entity
                    - onhand.inventory_account
                    - open_orders.open_value
                    - bank_balances.balance
                    - bank_balances.balance_entity
                  description: A money total of the pack, or `*` for all of them.
                amount:
                  type: string
                  description: Decimal string, at least 0, at most 6 decimals, in the currency of each total it applies to. 0 returns the total to an exact comparison.
                reason:
                  type: string
                  description: Required when the amount is above 0.
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: The tolerance after the change.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tolerance"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs:
    get:
      operationId: listPackRuns
      summary: Pack runs, newest first (inquiry "Pack runs", 9.49.14)
      x-passage-duty: migration.factory.view
      parameters:
        - name: pack
          in: query
          schema:
            type: string
            enum: [open_items, gl_balances, onhand, open_orders, wip_prod, fixed_assets, project_wip, payroll_ytd, bank_balances]
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RunStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: One page of runs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PackRun"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs/{id}:
    get:
      operationId: getPackRun
      summary: A pack run with its control totals and quarantined records
      x-passage-duty: migration.factory.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRunDetail"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs/{id}/control-totals:
    get:
      operationId: getControlTotals
      summary: Control totals and status for a pack run
      x-passage-duty: migration.factory.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Totals for the run.
          content:
            application/json:
              schema:
                type: object
                required: [runId, status, controlTotals]
                properties:
                  runId:
                    type: string
                    format: uuid
                  status:
                    $ref: "#/components/schemas/RunStatus"
                  controlTotals:
                    type: array
                    items:
                      $ref: "#/components/schemas/ControlTotal"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs/{id}/load:
    post:
      operationId: loadPackRunTarget
      summary: Load the open items of a run into receivables and reconcile the target's totals
      description: |
        Sends the run's pending rows (those the run staged because it was started with a `load`
        object) to receivables, POST /v1/receivables/open-items:batch, at most 1000 per request and
        non-atomic, as the service `migration-factory` acting as the `migration-loader` principal.
        Each request carries an Idempotency-Key derived from the run and its rows, so the same rows
        are the same request on every try; a 5xx, a 429 or a timeout is retried with backoff and,
        when the attempts are used up, the remaining rows stay pending and the load is PARTIAL
        (call again to resume). An answer that does not describe the batch also leaves its rows
        pending; a refusal of the whole request (a 4xx that is not a row result) stops the load as
        FAILED with 502 MIG-1524 and the rows stay pending. Receivables answers per row: CREATED, UPDATED and UNCHANGED rows
        are stored with the open-item id the target assigned, which also replaces the factory's
        provisional id in legacy_xref (once); a REJECTED row is recorded with the target's own
        code (AR-OPENING-INVALID, -DUPLICATE-KEY, -IDENTITY, -DOCUMENT-EXISTS, -SETTLED,
        -IN-COLLECTION). Rows equal to what the target already accepted under the same import
        source are not sent again, so a rerun of an unchanged snapshot sends nothing; a row the
        target stored whose answer was lost is sent again and answered UNCHANGED. Open AP rows
        (`ledger` AP) are NOT_AVAILABLE: payables has no opening-item API yet. When no row is
        pending, the target's totals (GET /v1/receivables/open-item-imports) are compared with
        what the factory sent, per currency: item count, debit, credit and net open. Both sides
        cover the whole import source in the legal entity, over every run that loaded into it
        (receivables totals the open amounts it holds now, so reconcile at the freeze). A
        difference is MISMATCH, never passed silently; totals that cannot be read, or not
        completely (receivables lists 500 or more import groups), are UNRECONCILED. The lines are
        control totals of the run named `target.receivables.*`. One load runs at a time per import
        source and legal entity (409 MIG-1522), and a run older than one already loaded under them
        is refused (409 MIG-1525). Without RECEIVABLES_URL and a service signing key the answer is
        503 MIG-1520; a refused service token is 502 MIG-1521.
        Writes dev.passage.migration.pack.loaded.v1.
      x-passage-duty: migration.factory.run
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The pass ended; `status` says whether the target's totals match, rows are still pending, or the totals could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetLoad"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs/{id}/opening-journal:
    post:
      operationId: postOpeningJournal
      summary: Post the migrated GL balances of a gl_balances run to the general ledger as the opening journal
      description: |
        Posts the loaded `gl_opening_balance` rows of the run's legacy company to the ledger `ledgerId` of
        the legal entity `legalEntityId` through the general ledger's ordinary posting API
        (POST /v1/ledger/journal-entries, so the ledger's period, account and audit checks apply), as the
        service `migration-factory`: one balanced journal per currency, dated `postingDate`, with one line
        per account and dimension combination (debit for a positive balance, credit for a negative one).
        The run must be gl_balances and LOADED or RECONCILED. The journal is refused whole, and nothing is
        posted in any currency, when a currency's debits differ from its credits (for example because
        balances were quarantined): the 422 MIG-1540 detail names each currency with its debits, credits and
        difference. A balance with more decimals than its currency's minor unit is refused, never rounded.
        The post is idempotent: the key of each journal is fixed by company, legal entity and currency, a
        currency already posted with the same lines, ledger and date is returned as `alreadyPosted` and
        sent again to no one (also from a re-run of the same import), and the same balances for another
        ledger or date, or changed since, are refused with 409 MIG-0004 (correct by reversing in the
        ledger). A refusal by the ledger (closed period, unknown account) is 422 MIG-1541 with the ledger's
        code; journals of other currencies posted before it stay posted and the call can be repeated. An
        unreachable ledger is 502 MIG-1533, an unconfigured one 503 MIG-1530, a ledger the legal entity
        does not own 422 MIG-1531. Once every currency of the company is posted, the go/no-go checklist
        counts the gl_balances pack as posted.
      x-passage-duty: migration.factory.run
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, ledgerId, postingDate]
              properties:
                legalEntityId: {type: string, format: uuid, description: A legal entity in the caller's scope.}
                ledgerId: {type: string}
                postingDate: {type: string, format: date}
      responses:
        "200":
          description: The opening journals of the legal entity, one per currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpeningJournals"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    get:
      operationId: getOpeningJournal
      summary: The opening journals posted for the legacy company of a gl_balances run
      description: Lists what was posted, per legal entity and currency, in the legal entities the caller may see.
      x-passage-duty: migration.factory.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The posted journals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpeningJournals"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs/{id}/load-payables:
    post:
      operationId: loadPackRunPayables
      summary: Load the open AP lines of a run into payables as opening batches and reconcile the batches
      description: |
        For a run started with `load.payables`: sends its pending AP rows (`ledger` AP) to payables,
        POST /v1/payables/opening-batches, in batches of at most 1000 rows, as the service
        `migration-factory`. Payables takes a batch all or nothing with a control total per currency
        (the factory sends the totals of the rows in the batch) and amounts in whole minor units. The
        batch key is derived from the import source and the rows (`mf-ap-<importSource>-<hash>`), so
        the same rows are the same request on every try and payables answers a repeat as a replay.
        A refusal that names rows (422 AP-OPB-001, AP-OPB-004: unknown vendor, bad date, reference
        already held by another batch) stores those rows as REJECTED with payables' reason and sends
        the rest of the batch again at once. A 5xx, a 429 or a timeout is retried with backoff and
        then leaves the rows pending (PARTIAL; call again to resume). A refusal of the whole request
        (control totals that do not add up, a changed batch under an old key) stops the load as
        FAILED with 502 MIG-1552 and the rows stay pending; a refused service token is 502 MIG-1551.
        Rows equal to what payables already accepted under the import source are SKIPPED, so a rerun
        of an unchanged snapshot sends nothing. Once no row is pending, the batches payables holds
        for the legal entity (GET /v1/payables/opening-batches, every page) are summed for the
        factory's batch keys of the import source and compared with what the factory sent: item
        count, and the total per currency in minor units. A difference is MISMATCH; totals that
        cannot be read are UNRECONCILED. The lines are control totals of the run named
        `target.payables.*`. While AP lines are not loaded and reconciled the run stays staged in the
        go/no-go (`payables_staged`); a RECONCILED load with no rejected row clears it. Without
        PAYABLES_URL and a service signing key the answer is 503 MIG-1550. One load runs at a time per
        import source and legal entity (409 MIG-1522); a run older than one already loaded is refused
        (409 MIG-1525); a run without `load.payables` is 409 MIG-1553.
        Writes dev.passage.migration.pack.loaded.v1 with target `payables`.
      x-passage-duty: migration.factory.run
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The AP load after this pass.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayablesLoad"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs/{id}/payables-load:
    get:
      operationId: getPayablesLoad
      summary: Status, reconciliation lines and first rejects of a run's payables load
      description: |
        `reconciliation` holds the run's `target.payables.*` control totals (factory side as source,
        payables as target). `rejects` lists up to 50 REJECTED AP rows. 409 MIG-1553 when the run was
        started without `load.payables`.
      x-passage-duty: migration.factory.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The AP load.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayablesLoadDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/migration/runs/{id}/target-load:
    get:
      operationId: getTargetLoad
      summary: Load status, reconciliation lines and first rejects of a run's target load
      description: |
        `reconciliation` holds the run's `target.receivables.*` control totals (factory side as
        source, receivables as target). `rejects` lists up to 50 REJECTED rows and 50 NOT_AVAILABLE
        rows; page all rows with GET /migration/runs/{id}/target-rows. 409 MIG-1523 when the run
        was started without a load object.
      x-passage-duty: migration.factory.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The load.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetLoadDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
