    post:
      operationId: releaseQuarantined
      summary: Correct and release a quarantined open item, bank balance, on-hand or open order line (FR-49.11)
      description: |
        Applies the correction, re-runs the pack's suite against the run's master-data snapshot
        plus `parties`, and loads the record into legacy_xref. open_items takes `party` and
        `account`; bank_balances takes `bankAccount`; onhand takes `item`, `site`, `warehouse`,
        `location`, `batch` and `unit`; open_orders takes `item`, `party`, `unit` and `deliveryDate`
        (a field of another pack is MIG-0001). Amounts, quantities, prices, currencies, order and
        line numbers, legacy ids and serials are the legacy truth and change only by re-extract.
        The run's counts, control totals and version change under its row lock; a corrected key
        moves the record's legacy figures to the corrected key's subtotal, and a bank or stock
        line or an order line also loads its opening row (no posting to treasury, the inventory ledger,
        sales or purchasing); a released order line adds one to the order count only when the loaded
        side holds no other line of its order. When no
        total is MISMATCH any more the run moves to RECONCILED and writes
        dev.passage.migration.pack.reconciled.v1. Releasing a released record returns the run
        with Idempotent-Replayed (idempotent by record). Only LOADED open_items, bank_balances,
        onhand and open_orders runs take a release (MIG-0004 otherwise, MIG-0005 for other packs);
        a line quarantined before its whole line was kept (bank_balances and onhand before
        migration 0017, open_orders before migration 0018) is MIG-0004 and is re-extracted.
      x-passage-duty: migration.factory.run
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: rec
          in: path
          required: true
          description: The quarantined record's seq within the run.
