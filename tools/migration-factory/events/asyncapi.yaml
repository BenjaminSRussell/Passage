asyncapi: 3.0.0
info:
  title: Passage Migration Factory events
  version: 0.4.0
  description: |
    Events the migration factory writes to its transactional outbox (PRD 9.49.5), in the same
    transaction as the state change. Debezium relays them to Kafka topic
    passage.<context>.<entity>, keyed by aggregate id. Each message is a CloudEvents 1.0
    structured envelope; `data` carries the payload below. Source: passage/migration-factory.
    The constants live in internal/events.
defaultContentType: application/cloudevents+json
channels:
  migrationPack:
    address: passage.migration.pack
    messages:
      packReconciled:
        $ref: "#/components/messages/PackReconciled"
      packLoaded:
        $ref: "#/components/messages/PackLoaded"
  migrationParallelRun:
    address: passage.migration.parallelrun
    messages:
      parallelRunDiffed:
        $ref: "#/components/messages/ParallelRunDiffed"
  cutoverStep:
    address: passage.cutover.step
    messages:
      stepCompleted:
        $ref: "#/components/messages/CutoverStepCompleted"
  cutoverPlan:
    address: passage.cutover.plan
    messages:
      planRolledBack:
        $ref: "#/components/messages/CutoverPlanRolledBack"
  cutoverDecision:
    address: passage.cutover.decision
    messages:
      decisionRecorded:
        $ref: "#/components/messages/CutoverDecisionRecorded"
operations:
  publishPackReconciled:
    action: send
    channel:
      $ref: "#/channels/migrationPack"
    messages:
      - $ref: "#/channels/migrationPack/messages/packReconciled"
  publishPackLoaded:
    action: send
    channel:
      $ref: "#/channels/migrationPack"
    messages:
      - $ref: "#/channels/migrationPack/messages/packLoaded"
  publishParallelRunDiffed:
    action: send
    channel:
      $ref: "#/channels/migrationParallelRun"
    messages:
      - $ref: "#/channels/migrationParallelRun/messages/parallelRunDiffed"
  publishStepCompleted:
    action: send
    channel:
      $ref: "#/channels/cutoverStep"
    messages:
      - $ref: "#/channels/cutoverStep/messages/stepCompleted"
  publishPlanRolledBack:
    action: send
    channel:
      $ref: "#/channels/cutoverPlan"
    messages:
      - $ref: "#/channels/cutoverPlan/messages/planRolledBack"
  publishDecisionRecorded:
    action: send
    channel:
      $ref: "#/channels/cutoverDecision"
    messages:
      - $ref: "#/channels/cutoverDecision/messages/decisionRecorded"
components:
  messages:
    PackReconciled:
      name: dev.passage.migration.pack.reconciled.v1
      title: Pack run reconciled
      summary: A pack run computed its control totals. Written for every run, whether or not it reached RECONCILED, and again when releasing a quarantined record brings a LOADED run to RECONCILED.
      payload:
        $ref: "#/components/schemas/PackReconciledEnvelope"
    PackLoaded:
      name: dev.passage.migration.pack.loaded.v1
      title: Pack run loaded into its target
      summary: A pass of the load of a pack run into the target service (receivables for open_items) finished. Written after the rows were sent and the target's totals were compared, and again by every later pass; status says whether the target's totals equal what the factory sent.
      payload:
        $ref: "#/components/schemas/PackLoadedEnvelope"
    ParallelRunDiffed:
      name: dev.passage.migration.parallelrun.diffed.v1
      title: Parallel run diffed
      summary: A parallel run outer-joined the legacy and Passage tuples and classified the variances (FR-49.5); it is in REVIEW.
      payload:
        $ref: "#/components/schemas/ParallelRunDiffedEnvelope"
    CutoverStepCompleted:
      name: dev.passage.cutover.step.completed.v1
      title: Cutover step completed
      summary: A runbook step was marked done.
      payload:
        $ref: "#/components/schemas/CutoverStepCompletedEnvelope"
    CutoverPlanRolledBack:
      name: dev.passage.cutover.plan.rolledback.v1
      title: Cutover plan rolled back
      summary: A cutover plan's rollback was executed with two distinct approvers (FR-49.9). Coexistence adapters resume legacy write access on it.
      payload:
        $ref: "#/components/schemas/CutoverPlanRolledBackEnvelope"
    CutoverDecisionRecorded:
      name: dev.passage.cutover.decision.recorded.v1
      title: Cutover go/no-go decision recorded
      summary: A GO or NO_GO decision was recorded on a cutover plan with its approvers and the checklist items that were not met (none for a GO). Audit and platform-ops consume it.
      payload:
        $ref: "#/components/schemas/CutoverDecisionRecordedEnvelope"
  schemas:
    Envelope:
      type: object
      required: [specversion, id, source, type, time, datacontenttype, data, tenantid]
      properties:
        specversion:
          const: "1.0"
        id:
          type: string
        source:
          const: passage/migration-factory
        type:
          type: string
        subject:
          type: string
          description: The aggregate id (run id, parallel run id or plan id).
        time:
          type: string
          format: date-time
        datacontenttype:
          const: application/json
        tenantid:
          type: string
          format: uuid
        actor:
          type: string
    PackReconciledEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            type:
              const: dev.passage.migration.pack.reconciled.v1
            data:
              type: object
              required: [run_id, pack, source_system, source_company, status, totals_match, totals_mismatch, quarantined, records_loaded]
              properties:
                run_id:
                  type: string
                  format: uuid
                pack:
                  type: string
                source_system:
                  type: string
                  enum: [AX2012, D365FO, SAPECC, S4HANA]
                source_company:
                  type: string
                status:
                  type: string
                  enum: [LOADED, RECONCILED]
                totals_match:
                  type: integer
                totals_mismatch:
                  type: integer
                quarantined:
                  type: integer
                records_loaded:
                  type: integer
    PackLoadedEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            type:
              const: dev.passage.migration.pack.loaded.v1
            data:
              type: object
              required: [run_id, pack, target, import_source, legal_entity_id, status, created, updated, unchanged, skipped, rejected, not_available, pending, totals_match, totals_mismatch]
              properties:
                run_id:
                  type: string
                  format: uuid
                pack:
                  type: string
                target:
                  type: string
                  enum: [receivables]
                import_source:
                  type: string
                  description: The importSource the rows are keyed under at the target.
                legal_entity_id:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum: [PARTIAL, UNRECONCILED, MISMATCH, RECONCILED, FAILED]
                created:
                  type: integer
                updated:
                  type: integer
                unchanged:
                  type: integer
                skipped:
                  type: integer
                  description: Rows equal to what the target already accepted, not sent again.
                rejected:
                  type: integer
                not_available:
                  type: integer
                  description: Open AP rows, which payables cannot take yet.
                pending:
                  type: integer
                totals_match:
                  type: integer
                totals_mismatch:
                  type: integer
    ParallelRunDiffedEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            type:
              const: dev.passage.migration.parallelrun.diffed.v1
            data:
              type: object
              required: [parallel_run_id, period, source_system, variance_count, unexplained_count, unexplained_amount]
              properties:
                parallel_run_id:
                  type: string
                  format: uuid
                period:
                  type: string
                  pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
                source_system:
                  type: string
                  enum: [AX2012, D365FO, SAPECC, S4HANA]
                variance_count:
                  type: integer
                unexplained_count:
                  type: integer
                unexplained_amount:
                  type: string
                  description: Decimal string, sum of absolute deltas of the unexplained variances.
    CutoverStepCompletedEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            type:
              const: dev.passage.cutover.step.completed.v1
            data:
              type: object
              required: [plan_id, step_id, name, actual_duration_min, status, completed_by]
              properties:
                plan_id:
                  type: string
                  format: uuid
                step_id:
                  type: integer
                  description: The step's sequence number in the plan.
                name:
                  type: string
                actual_duration_min:
                  type: integer
                status:
                  type: string
                  enum: [DONE]
                completed_by:
                  type: string
    CutoverPlanRolledBackEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            type:
              const: dev.passage.cutover.plan.rolledback.v1
            data:
              type: object
              required: [plan_id, approvers, executed_by, rekey_journal_lines, rekey_document_lines]
              properties:
                plan_id:
                  type: string
                  format: uuid
                approvers:
                  type: array
                  minItems: 2
                  items:
                    type: string
                executed_by:
                  type: string
                rekey_journal_lines:
                  type: integer
                  minimum: 0
                  description: Journal lines posted since T-0 exported for re-keying (FR-49.9).
                rekey_document_lines:
                  type: integer
                  minimum: 0
                  description: Document lines posted since T-0 exported for re-keying. The files are served at /api/v1/cutover/plans/{id}/rekeying/{file}.
    CutoverDecisionRecordedEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            type:
              const: dev.passage.cutover.decision.recorded.v1
            data:
              type: object
              required: [plan_id, decision, approvers, reason, open_items, waivers, decided_by, timestamp]
              properties:
                plan_id:
                  type: string
                  format: uuid
                decision:
                  type: string
                  enum: [GO, NO_GO]
                approvers:
                  type: array
                  minItems: 1
                  description: Authenticated users who approved, in order. A GO has two distinct approvers (the first approver and the user who recorded it); a NO_GO has the user who recorded it.
                  items:
                    type: string
                reason:
                  type: string
                  description: Why, required for NO_GO; empty for a GO that gave none.
                open_items:
                  type: array
                  description: Codes of the checklist items not met when the decision was taken; empty for a GO.
                  items:
                    type: string
                waivers:
                  type: array
                  description: Packs that are staged in the factory and not posted to their ledger which both approvers accepted for this decision, each with the reason. Empty when none.
                  items:
                    type: object
                    required: [pack, reason]
                    properties:
                      pack:
                        type: string
                        description: Pack code, for example onhand or gl_balances.
                      reason:
                        type: string
                        description: Why the pack may go live without being posted.
                decided_by:
                  type: string
                  description: The user who recorded the decision; always one of the approvers.
                timestamp:
                  type: string
                  format: date-time
