image:
  repository: ghcr.io/benjaminsrussell/passage-migration-factory
  tag: "0.1.0"
  # Pin by digest in Argo CD overlays (deployment-cicd); the tag is a dev default.
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8080

admin:
  port: 9090

# Secret holding DATABASE_URL for the passage_app role (no BYPASSRLS). Required: the service
# exits at start without it.
database:
  secretName: passage-migration-factory-db
  secretKey: DATABASE_URL

# Where the open_items pack is loaded (integration track S8). Leave both empty and the service starts, and the
# load step answers 503 MIG-1520. receivables.url is the receivables service base address; signing.secretName names
# a Secret holding the base64 32-byte Ed25519 seed the factory signs its service tokens with (the receivables
# service must hold the matching public key for the service "migration-factory").
receivables:
  url: ""
# payables.url is the payables service base address the AP lines of an open_items run are loaded into
# (POST /v1/payables/opening-batches); empty and the AP load answers 503 MIG-1550. It uses the same signing key.
payables:
  url: ""
signing:
  secretName: ""
  secretKey: PASSAGE_SERVICE_SIGNING_KEY

# Apply migrations at start. Turn off where a migration job runs them as the owner role.
migrateOnStart: false

env:
  PASSAGE_ENV: dev
  SERVICE_NAME: migration-factory
  HISTORY_YEARS: "7"
  MASK_PII: "true"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /healthz
  readiness:
    path: /readyz

serviceMonitor:
  enabled: false
  interval: 30s
