apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-migration-factory
  labels:
    app.kubernetes.io/name: passage-migration-factory
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: passage-migration-factory
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: admin
      port: {{ .Values.admin.port }}
      targetPort: admin
