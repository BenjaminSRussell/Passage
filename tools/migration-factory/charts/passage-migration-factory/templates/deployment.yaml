apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-migration-factory
  labels:
    app.kubernetes.io/name: passage-migration-factory
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: passage-migration-factory
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: passage-migration-factory
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: migration-factory
          {{- if .Values.image.digest }}
          image: "{{ (include "passage.imageRepository" $) }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ (include "passage.imageRepository" $) }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: admin
              containerPort: {{ .Values.admin.port }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: HTTP_ADDR
              value: ":{{ .Values.service.port }}"
            - name: ADMIN_ADDR
              value: ":{{ .Values.admin.port }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            {{- if .Values.receivables.url }}
            - name: RECEIVABLES_URL
              value: {{ .Values.receivables.url | quote }}
            {{- end }}
            {{- if .Values.payables.url }}
            - name: PAYABLES_URL
              value: {{ .Values.payables.url | quote }}
            {{- end }}
            {{- if .Values.signing.secretName }}
            - name: PASSAGE_SERVICE_NAME
              value: migration-factory
            - name: PASSAGE_SERVICE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.signing.secretName }}
                  key: {{ .Values.signing.secretKey }}
            {{- end }}
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
