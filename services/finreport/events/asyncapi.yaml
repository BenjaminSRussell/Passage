asyncapi: 3.0.0
info:
  title: Passage Financial Reporting events
  version: 1.0.0
  description: Events published by the reporting service (PSG-15 slice 1). Written to the outbox in the same transaction as the change.
defaultContentType: application/cloudevents+json
channels:
  statementGenerated:
    address: passage.reporting.statement
    messages:
      statementGenerated:
        $ref: '#/components/messages/StatementGenerated'
  definitionPublished:
    address: passage.reporting.definition
    messages:
      definitionPublished:
        $ref: '#/components/messages/DefinitionPublished'
  hierarchyUnassigned:
    address: passage.reporting.hierarchy
    messages:
      hierarchyUnassigned:
        $ref: '#/components/messages/HierarchyUnassigned'
  balanceVerified:
    address: passage.reporting.balance
    messages:
      balanceVerified:
        $ref: '#/components/messages/BalanceVerified'
operations:
  publishBalanceVerified:
    action: send
    channel:
      $ref: '#/channels/balanceVerified'
    summary: The read model of a ledger was compared with the ledger trial balance (FR-15.1); written to the outbox in the transaction that stores the check
    messages:
      - $ref: '#/channels/balanceVerified/messages/balanceVerified'
  publishHierarchyUnassigned:
    action: send
    channel:
      $ref: '#/channels/hierarchyUnassigned'
    summary: A member of a published non-strict hierarchy matched no leaf (FR-15.13, BR-15.13); one event per member, written to the outbox in the publish transaction
    messages:
      - $ref: '#/channels/hierarchyUnassigned/messages/hierarchyUnassigned'
  publishStatementGenerated:
    action: send
    channel:
      $ref: '#/channels/statementGenerated'
    summary: A statement run completed (FR-15.6)
    messages:
      - $ref: '#/channels/statementGenerated/messages/statementGenerated'
  publishDefinitionPublished:
    action: send
    channel:
      $ref: '#/channels/definitionPublished'
    summary: A definition version was published (BR-15.8)
    messages:
      - $ref: '#/channels/definitionPublished/messages/definitionPublished'
components:
  messages:
    StatementGenerated:
      name: dev.passage.reporting.statement.generated.v1
      title: Statement generated
      summary: A statement run completed and its cells and result hash were stored.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [run_id, definition_code, definition_version, ledger_id, period, currency_type, hwm_by_ledger, result_hash, outputs, parameters]
        properties:
          run_id: {type: string, format: uuid}
          definition_code: {type: string}
          definition_version: {type: integer}
          ledger_id: {type: string, format: uuid}
          period: {type: string, example: '2026-03'}
          currency_type: {type: string, enum: [acct, rpt, txn]}
          hwm_by_ledger:
            type: object
            additionalProperties: {type: integer}
          result_hash: {type: string, description: SHA-256 hex over cells}
          outputs:
            type: array
            items:
              type: object
              properties:
                format: {type: string}
                uri: {type: string}
                size: {type: integer}
          parameters:
            type: object
            description: Run parameters; always period, and hierarchy as CODE@version when the rows of the run are the nodes of a hierarchy
            additionalProperties: {type: string}
    DefinitionPublished:
      name: dev.passage.reporting.definition.published.v1
      title: Definition published
      summary: A report definition version was published.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [code, version, actor, diff_summary]
        properties:
          code: {type: string}
          version: {type: integer}
          actor: {type: string, description: User id of the publisher}
          diff_summary: {type: string}
    HierarchyUnassigned:
      name: dev.passage.reporting.hierarchy.unassigned.v1
      title: Hierarchy member unassigned
      summary: A published non-strict hierarchy left a member without a node.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [code, version, member_id, member_kind, owner_user_id, actor]
        properties:
          code: {type: string, description: Hierarchy code}
          version: {type: integer, description: Published hierarchy version}
          member_id: {type: string}
          member_kind: {type: string, enum: [main_account_category, main_account, dimension_value]}
          owner_user_id: {type: string, description: Hierarchy owner to notify}
          actor: {type: string, description: User id of the publisher}
    BalanceVerified:
      name: dev.passage.reporting.balance.verified.v1
      title: Balance verified
      summary: A balance verification stored its result; subscribers alert on status differs. Account amounts are not in the event.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [verification_id, ledger_id, status, hwm_before, hwm_after, entries_pending, accounts_compared, diff_count, actor]
        properties:
          verification_id: {type: string, format: uuid}
          ledger_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid, description: Legal entity that owns the ledger's reporting data (also the legalentityid extension); absent for a legacy ledger}
          status: {type: string, enum: [matched, differs, inconclusive], description: inconclusive when the read model's mark moved during the check or entries waited ahead of it}
          hwm_before: {type: integer, format: int64}
          hwm_after: {type: integer, format: int64}
          entries_pending: {type: integer, description: Most entries seen waiting ahead of the mark}
          accounts_compared: {type: integer}
          diff_count: {type: integer, description: Accounts whose net differs between the read model and the ledger}
          actor: {type: string, description: User id that ran the check}
