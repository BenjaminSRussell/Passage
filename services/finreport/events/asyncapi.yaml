asyncapi: 3.0.0
info:
  title: Passage Financial Reporting events
  version: 1.0.0
  description: Events published by the reporting service (PSG-15 slice 1). Written to the outbox in the same transaction as the change.
defaultContentType: application/cloudevents+json
channels:
  statementGenerated:
    address: passage.reporting.statement
    messages:
      statementGenerated:
        $ref: '#/components/messages/StatementGenerated'
      statementFailed:
        $ref: '#/components/messages/StatementFailed'
  definitionPublished:
    address: passage.reporting.definition
    messages:
      definitionPublished:
        $ref: '#/components/messages/DefinitionPublished'
  hierarchyUnassigned:
    address: passage.reporting.hierarchy
    messages:
      hierarchyUnassigned:
        $ref: '#/components/messages/HierarchyUnassigned'
  balanceVerified:
    address: passage.reporting.balance
    messages:
      balanceVerified:
        $ref: '#/components/messages/BalanceVerified'
  lagExceeded:
    address: passage.reporting.lag
    messages:
      lagExceeded:
        $ref: '#/components/messages/LagExceeded'
  distributionSent:
    address: passage.reporting.distribution
    messages:
      distributionSent:
        $ref: '#/components/messages/DistributionSent'
  legalHold:
    address: passage.reporting.legalhold
    messages:
      legalHoldPlaced:
        $ref: '#/components/messages/LegalHoldPlaced'
      legalHoldReleased:
        $ref: '#/components/messages/LegalHoldReleased'
  shareLink:
    address: passage.reporting.sharelink
    messages:
      shareLinkCreated:
        $ref: '#/components/messages/ShareLinkCreated'
      shareLinkRevoked:
        $ref: '#/components/messages/ShareLinkRevoked'
  librarySwept:
    address: passage.reporting.library
    messages:
      librarySwept:
        $ref: '#/components/messages/LibrarySwept'
  runsSwept:
    address: passage.reporting.runs
    messages:
      runsSwept:
        $ref: '#/components/messages/RunsSwept'
operations:
  publishStatementFailed:
    action: send
    channel:
      $ref: '#/channels/statementGenerated'
    summary: A scheduled firing ended without a statement (FR-15.8); one event per failed firing, written to the outbox in the transaction that records the firing
    messages:
      - $ref: '#/channels/statementGenerated/messages/statementFailed'
  publishDistributionSent:
    action: send
    channel:
      $ref: '#/channels/distributionSent'
    summary: A rendered output of a scheduled run was stored in the report library and handed to distribution (FR-15.8); one event per output, written to the outbox in the transaction that records the firing
    messages:
      - $ref: '#/channels/distributionSent/messages/distributionSent'
  publishBalanceVerified:
    action: send
    channel:
      $ref: '#/channels/balanceVerified'
    summary: The read model of a ledger was compared with the ledger trial balance (FR-15.1); written to the outbox in the transaction that stores the check
    messages:
      - $ref: '#/channels/balanceVerified/messages/balanceVerified'
  publishLagExceeded:
    action: send
    channel:
      $ref: '#/channels/lagExceeded'
    summary: The read model of a ledger stayed behind the lag gate for the alert window (FR-15.1); one event per episode, written to the outbox by the lag-check job
    messages:
      - $ref: '#/channels/lagExceeded/messages/lagExceeded'
  publishHierarchyUnassigned:
    action: send
    channel:
      $ref: '#/channels/hierarchyUnassigned'
    summary: A member of a published non-strict hierarchy matched no leaf (FR-15.13, BR-15.13); one event per member, written to the outbox in the publish transaction
    messages:
      - $ref: '#/channels/hierarchyUnassigned/messages/hierarchyUnassigned'
  publishStatementGenerated:
    action: send
    channel:
      $ref: '#/channels/statementGenerated'
    summary: A statement run completed (FR-15.6)
    messages:
      - $ref: '#/channels/statementGenerated/messages/statementGenerated'
  publishDefinitionPublished:
    action: send
    channel:
      $ref: '#/channels/definitionPublished'
    summary: A definition version was published (BR-15.8)
    messages:
      - $ref: '#/channels/definitionPublished/messages/definitionPublished'
  publishLegalHoldPlaced:
    action: send
    channel:
      $ref: '#/channels/legalHold'
    summary: The report library of a legal entity was put under legal hold (FR-15.8); written to the outbox in the transaction that stores the hold
    messages:
      - $ref: '#/channels/legalHold/messages/legalHoldPlaced'
  publishLegalHoldReleased:
    action: send
    channel:
      $ref: '#/channels/legalHold'
    summary: A legal hold on the report library of a legal entity was released (FR-15.8); written to the outbox in the transaction that releases it
    messages:
      - $ref: '#/channels/legalHold/messages/legalHoldReleased'
  publishShareLinkCreated:
    action: send
    channel:
      $ref: '#/channels/shareLink'
    summary: A share link to a report library file was created (FR-15.8); written to the outbox in the transaction that stores the link
    messages:
      - $ref: '#/channels/shareLink/messages/shareLinkCreated'
  publishShareLinkRevoked:
    action: send
    channel:
      $ref: '#/channels/shareLink'
    summary: A share link to a report library file was revoked (FR-15.8); written to the outbox in the transaction that revokes it
    messages:
      - $ref: '#/channels/shareLink/messages/shareLinkRevoked'
  publishLibrarySwept:
    action: send
    channel:
      $ref: '#/channels/librarySwept'
    summary: The retention sweep deleted past-retention report library files of a legal entity, or a legal hold kept them (FR-15.8); one event per entity pass that deleted or held anything
    messages:
      - $ref: '#/channels/librarySwept/messages/librarySwept'
  publishRunsSwept:
    action: send
    channel:
      $ref: '#/channels/runsSwept'
    summary: The retention sweep deleted ad-hoc statement runs older than the retention days for a legal entity, or a legal hold kept them (FR-15.8); one event per entity pass that deleted or held anything
    messages:
      - $ref: '#/channels/runsSwept/messages/runsSwept'
components:
  messages:
    StatementGenerated:
      name: dev.passage.reporting.statement.generated.v1
      title: Statement generated
      summary: A statement run completed and its cells and result hash were stored.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [run_id, definition_code, definition_version, ledger_id, period, currency_type, hwm_by_ledger, result_hash, outputs, parameters]
        properties:
          run_id: {type: string, format: uuid}
          definition_code: {type: string}
          definition_version: {type: integer}
          ledger_id: {type: string, format: uuid}
          period: {type: string, example: '2026-03'}
          currency_type: {type: string, enum: [acct, rpt, txn]}
          hwm_by_ledger:
            type: object
            additionalProperties: {type: integer}
          result_hash: {type: string, description: SHA-256 hex over cells}
          outputs:
            type: array
            items:
              type: object
              properties:
                format: {type: string}
                uri: {type: string}
                size: {type: integer}
          parameters:
            type: object
            description: Run parameters; always period, hierarchy as CODE@version when the rows of the run are the nodes of a hierarchy, and tree as CODE@revision with treeUnit when the run is limited to a unit of a reporting tree; ledgers (comma separated ledger ids in column order) when the run is consolidated by entity
            additionalProperties: {type: string}
    DefinitionPublished:
      name: dev.passage.reporting.definition.published.v1
      title: Definition published
      summary: A report definition version was published.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [code, version, actor, diff_summary]
        properties:
          code: {type: string}
          version: {type: integer}
          actor: {type: string, description: User id of the publisher}
          diff_summary: {type: string}
    HierarchyUnassigned:
      name: dev.passage.reporting.hierarchy.unassigned.v1
      title: Hierarchy member unassigned
      summary: A published non-strict hierarchy left a member without a node.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [code, version, member_id, member_kind, owner_user_id, actor]
        properties:
          code: {type: string, description: Hierarchy code}
          version: {type: integer, description: Published hierarchy version}
          member_id: {type: string}
          member_kind: {type: string, enum: [main_account_category, main_account, dimension_value]}
          owner_user_id: {type: string, description: Hierarchy owner to notify}
          actor: {type: string, description: User id of the publisher}
    BalanceVerified:
      name: dev.passage.reporting.balance.verified.v1
      title: Balance verified
      summary: A balance verification stored its result; subscribers alert on status differs. Account amounts are not in the event.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [verification_id, ledger_id, status, hwm_before, hwm_after, entries_pending, accounts_compared, diff_count, actor]
        properties:
          verification_id: {type: string, format: uuid}
          ledger_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid, description: Legal entity that owns the ledger's reporting data (also the legalentityid extension); absent for a legacy ledger}
          status: {type: string, enum: [matched, differs, inconclusive], description: inconclusive when the read model's mark moved during the check or entries waited ahead of it}
          hwm_before: {type: integer, format: int64}
          hwm_after: {type: integer, format: int64}
          entries_pending: {type: integer, description: Most entries seen waiting ahead of the mark}
          accounts_compared: {type: integer}
          diff_count: {type: integer, description: Accounts whose net differs between the read model and the ledger}
          actor: {type: string, description: User id that ran the check}
    LagExceeded:
      name: dev.passage.reporting.lag.exceeded.v1
      title: Read-model lag exceeded
      summary: The reporting read model of a ledger has been behind the journal by more than the lag gate for the alert window.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [ledger_id, lag_seconds, hwm_ledger, hwm_reporting]
        properties:
          ledger_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid, description: Legal entity that owns the ledger's reporting data (also the legalentityid extension); absent for a legacy ledger}
          lag_seconds: {type: integer, description: 'Age in seconds of the oldest journal entry waiting for an earlier one (a lower bound: entries the consumer has not received do not count)'}
          hwm_ledger: {type: integer, description: Highest posting sequence the reporting service has seen for the ledger}
          hwm_reporting: {type: integer, description: Highest posting sequence the read model has applied}
    StatementFailed:
      name: dev.passage.reporting.statement.failed.v1
      title: Statement failed
      summary: A scheduled firing could not produce its statement after its retry; ops and the schedule owner are notified.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [schedule_code, definition_code, ledger_id, period, fire_time, stage, code, error, attempts]
        properties:
          schedule_code: {type: string}
          definition_code: {type: string}
          ledger_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid, description: Legal entity that owns the ledger's reporting data (also the legalentityid extension); absent when the ledger is unknown}
          period: {type: string, example: '2026-03', description: Fiscal period the firing was for}
          fire_time: {type: string, format: date-time, description: The cron time that fired}
          run_id: {type: string, format: uuid, description: The run, when it was created before the failure}
          stage: {type: string, enum: [period, run, render, store], description: Where the firing stopped}
          code: {type: string, description: Problem code of the last attempt, for example REPORT-0004 for a stale read model}
          error: {type: string}
          attempts: {type: integer, description: Attempts made, at most 2}
    DistributionSent:
      name: dev.passage.reporting.distribution.sent.v1
      title: Distribution sent
      summary: A rendered output of a scheduled run is in the report library and was handed to distribution; the notification service sends the email. Recipients are hashed.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [schedule_code, run_id, library_id, ledger_id, definition_code, period, format, size, sha256, delivery, recipient_count, recipients_sha256]
        properties:
          schedule_code: {type: string, description: The notification service resolves the recipients from the schedule}
          run_id: {type: string, format: uuid}
          library_id: {type: string, format: uuid, description: Report library entry holding the file}
          ledger_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid, description: Legal entity that owns the ledger's reporting data (also the legalentityid extension); absent for a legacy ledger}
          definition_code: {type: string}
          period: {type: string, example: '2026-03'}
          format: {type: string, enum: [csv, html, xlsx]}
          size: {type: integer, format: int64, description: File size in bytes}
          sha256: {type: string, description: SHA-256 hex of the file}
          delivery: {type: string, enum: [attachment, link], description: attachment when the file fits the schedule's attachment limit, else the email carries a library link}
          recipient_count: {type: integer}
          recipients_sha256: {type: string, description: SHA-256 hex over the sorted recipient addresses, joined by a newline}
    LegalHoldPlaced:
      name: dev.passage.reporting.legalhold.placed.v1
      title: Legal hold placed
      summary: The report library of a legal entity is under legal hold; the retention sweep deletes none of its files until the hold is released.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [hold_id, legal_entity_id, reason, actor]
        properties:
          hold_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid, description: Legal entity whose library is held (also the legalentityid extension)}
          reason: {type: string}
          actor: {type: string, description: User who placed the hold}
    LegalHoldReleased:
      name: dev.passage.reporting.legalhold.released.v1
      title: Legal hold released
      summary: A legal hold on the report library of a legal entity was released; the retention sweep deletes its past-retention files again.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [hold_id, legal_entity_id, reason, actor]
        properties:
          hold_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid, description: Legal entity whose library was held (also the legalentityid extension)}
          reason: {type: string, description: The reason the hold was placed with}
          actor: {type: string, description: User who released the hold}
          note: {type: string, description: Release note}
    ShareLinkCreated:
      name: dev.passage.reporting.sharelink.created.v1
      title: Share link created
      summary: A bearer link to a report library file was created; anyone holding it can download the file until it expires or is revoked. The secret is not in the event.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [link_id, library_id, expires_at, actor]
        properties:
          link_id: {type: string, format: uuid}
          library_id: {type: string, format: uuid, description: The report library file the link opens}
          legal_entity_id: {type: string, format: uuid, description: Legal entity of the file (also the legalentityid extension); absent when it has none}
          expires_at: {type: string, format: date-time}
          actor: {type: string, description: User who created the link}
    ShareLinkRevoked:
      name: dev.passage.reporting.sharelink.revoked.v1
      title: Share link revoked
      summary: A share link to a report library file was revoked and no longer opens the file.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [link_id, library_id, expires_at, actor]
        properties:
          link_id: {type: string, format: uuid}
          library_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid, description: Legal entity of the file (also the legalentityid extension); absent when it has none}
          expires_at: {type: string, format: date-time, description: When the link would have expired}
          actor: {type: string, description: User who revoked the link}
    LibrarySwept:
      name: dev.passage.reporting.library.swept.v1
      title: Library swept
      summary: The retention sweep deleted the report library files of a legal entity that were past their retention date, or a legal hold kept files that were past it.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [sweep_id, legal_entity_id, cutoff, deleted_count, deleted_bytes, held_count, actor]
        properties:
          sweep_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid, description: Legal entity swept (also the legalentityid extension)}
          cutoff: {type: string, format: date-time, description: Files with a retention date at or before this time were eligible}
          deleted_count: {type: integer}
          deleted_bytes: {type: integer, format: int64}
          held_count: {type: integer, description: Past-retention files a legal hold kept}
          hold_id: {type: string, format: uuid, description: The active hold that kept them}
          actor: {type: string, description: The system actor of the sweep}
    RunsSwept:
      name: dev.passage.reporting.runs.swept.v1
      title: Ad-hoc runs swept
      summary: The retention sweep deleted the ad-hoc statement runs of a legal entity that were older than the retention days, with their cells, or a legal hold kept runs that were past it.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [sweep_id, legal_entity_id, cutoff, retention_days, deleted_runs, deleted_cells, held_runs, actor]
        properties:
          sweep_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid, description: Legal entity swept (also the legalentityid extension)}
          cutoff: {type: string, format: date-time, description: Ad-hoc runs that started before this time were eligible}
          retention_days: {type: integer, description: The ad-hoc retention in days the pass applied}
          deleted_runs: {type: integer}
          deleted_cells: {type: integer, format: int64}
          held_runs: {type: integer, description: Past-retention runs a legal hold kept}
          hold_id: {type: string, format: uuid, description: The active hold that kept them}
          actor: {type: string, description: The system actor of the sweep}
