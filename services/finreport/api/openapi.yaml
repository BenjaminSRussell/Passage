openapi: 3.1.0
info:
  title: Passage Financial Reporting API
  version: 1.0.0
  description: Report definitions, standard statements, derived hierarchies, statement runs and drill-down, CSV, HTML and XLSX outputs and distribution schedules (PSG-15, wave 15 slices 1-4).
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
security:
  - bearerAuth: []
paths:
  /v1/reporting/definitions:
    get:
      operationId: listDefinitions
      summary: One summary per definition code (designer list)
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: Definition summaries ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/DefinitionSummary'}
  /v1/reporting/definitions/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      operationId: getDefinition
      summary: Read a definition (draft, latest published, or an exact version)
      x-passage-duty: reporting.statement.view
      parameters:
        - name: version
          in: query
          required: false
          schema:
            type: string
            description: draft, latest (default) or a positive published version number
      responses:
        '200':
          description: The definition
          headers:
            ETag:
              description: Draft revision (drafts only)
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Definition'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: putDraft
      summary: Create or replace the draft of a definition (idempotent)
      x-passage-duty: reporting.definition.maintain
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Required when a draft exists; the ETag last read. Missing gives 428, stale gives 412 conflict_version.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Definition'}
      responses:
        '200':
          description: Saved draft
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Definition'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/reporting/definitions/{code}/export:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      operationId: exportDefinition
      summary: Export the latest published version as schema-versioned JSON (FR-15.11)
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: Definition JSON
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Definition'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/definitions/import:
    post:
      operationId: importDefinition
      summary: Import an exported definition as a draft (FR-15.11)
      x-passage-duty: reporting.definition.maintain
      description: >-
        A code that already has a draft or a published version is refused with
        REPORT-0011 unless overwrite=true. An optional Idempotency-Key replays
        the stored result (200); the same key with a different request is
        refused with idempotency_key_reuse.
      parameters:
        - name: overwrite
          in: query
          required: false
          schema: {type: boolean, default: false}
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Definition'}
      responses:
        '201':
          description: Imported draft
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Definition'}
        '200':
          description: Replay of an earlier import with the same Idempotency-Key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Definition'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/reporting/definitions/{code}:publish:
    parameters:
      - $ref: '#/components/parameters/Code'
    post:
      operationId: publishDefinition
      summary: Publish the draft as the next immutable version (BR-15.8)
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: Published definition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Definition'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/reporting/definitions/{code}:validate:
    parameters:
      - $ref: '#/components/parameters/Code'
    post:
      operationId: validateDefinition
      summary: Validate a definition's shape, expressions and references (stateless)
      x-passage-duty: reporting.definition.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Definition'}
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                required: [valid, issues]
                properties:
                  valid: {type: boolean}
                  issues:
                    type: array
                    items: {$ref: '#/components/schemas/Issue'}
  /v1/reporting/runs:
    get:
      operationId: listRuns
      summary: Report library - newest runs first
      x-passage-duty: reporting.statement.view
      parameters:
        - name: definition
          in: query
          required: false
          description: Only runs of this definition code
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 200}
      responses:
        '200':
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Run'}
        '400': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createRun
      summary: Run a published definition over the reporting read model (FR-15.6)
      x-passage-duty: reporting.statement.run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunRequest'}
      responses:
        '201':
          description: Completed run
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '200':
          description: Replay - the run stored for this Idempotency-Key and the same request
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: REPORT-0004 REPORT_STALE - the read model of the ledger is further behind than reporting.max_lag_seconds; repeat with allowStale true to accept a stale result. Also idempotency_key_in_flight - the same key is being processed; retry
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/reporting/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRun
      summary: Read a run
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/runs/{id}/definition:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRunDefinition
      summary: The definition a run was evaluated with
      description: >-
        The published definition version of an ordinary run. For a run over a hierarchy
        (POST /runs with hierarchy) the expanded definition that was evaluated: one row per
        hierarchy node, an Unassigned row and a grand total. It never changes after the run.
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: The definition with its rows and columns
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Definition'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/runs/{id}/tree:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRunTree
      summary: The reporting tree a run was limited to, as it was when the run was made
      description: >-
        For a run made with tree (POST /runs): the tree at the revision the run recorded, limited
        to the run's unit and the units below it (the whole tree for a whole-tree run), the run's
        unit and the tree's current revision, so a client can show the units behind a stored run
        after the tree changed. A statement viewer sees only the units the run covered; reading
        whole trees stays with reporting.definition.maintain. 404 REPORT-0037 when the run was
        not limited to a tree, or when that revision was not kept (a revision replaced before
        revisions were stored).
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: The tree at the run's revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunTree'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/runs/{id}/cells:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: listCells
      summary: All cells of a run
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: Cells in evaluation order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Cell'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/runs/{id}/cells/{row}/{column}/balances:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: row
        in: path
        required: true
        schema: {type: string}
      - name: column
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: drillBalances
      summary: Drill level 1 - balance keys whose sum equals the cell value (BR-15.4)
      description: >-
        Computed cells (calculation rows and CALC columns) answer computed=true
        with no keys; drill into the cells they reference. A key sum that
        differs from the cell value is an invariant failure (500 REPORT-0099)
        and is never served.
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: Balance keys and their sum
          content:
            application/json:
              schema:
                type: object
                required: [runId, row, column, value, blank, computed, sumOfKeys, keys]
                properties:
                  runId: {type: string, format: uuid}
                  row: {type: string}
                  column: {type: string}
                  value: {$ref: '#/components/schemas/Decimal'}
                  blank: {type: boolean}
                  computed: {type: boolean}
                  sumOfKeys: {$ref: '#/components/schemas/Decimal'}
                  keys:
                    type: array
                    items: {$ref: '#/components/schemas/BalanceKey'}
        '404': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /v1/reporting/runs/{id}/cells/{row}/{column}/lines:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: row
        in: path
        required: true
        schema: {type: string}
      - name: column
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: drillLines
      summary: Drill level 2 - journal lines behind a cell or one of its balance keys (FR-15.7, BR-15.4)
      description: >-
        Lines of the cell's balances at the run's high-water mark, closing
        entries left out for income statements and cash flows, ordered by
        (postingDate, postingSequence, lineNumber, key) and keyset paged.
        amount is the line as the cell shows it (credit keys show -net). Every
        page carries sumOfLines (this page), cumulativeSum (through this page;
        on the final page it equals linesTotal) and the reconciliation of all
        the lines against the balance keys: reconciled is false, with the
        difference, when the read model is missing lines - never hidden.
        Computed cells answer computed=true with no lines.
      x-passage-duty: ledger.journal.read
      parameters:
        - name: key
          in: query
          required: false
          description: Position of one balance key in the drill level 1 list; omitted means the whole cell
          schema: {type: integer, minimum: 0}
        - name: cursor
          in: query
          required: false
          description: nextCursor of the previous page
          schema: {type: string}
        - name: limit
          in: query
          required: false
          description: Lines per page, 1 to 1000; default REPORTING_PAGE_SIZE (500)
          schema: {type: integer, minimum: 1, maximum: 1000}
      responses:
        '200':
          description: One page of lines with page and running sums and the reconciliation
          content:
            application/json:
              schema:
                type: object
                required: [runId, row, column, key, blank, computed, value, hwm, limit, items, sumOfLines, cumulativeSum, nextCursor,
                  linesTotal, difference, unreconciledKeys, reconciled]
                properties:
                  runId: {type: string, format: uuid}
                  row: {type: string}
                  column: {type: string}
                  key: {type: [integer, 'null'], description: The selected balance key, null for the whole cell}
                  blank: {type: boolean}
                  computed: {type: boolean}
                  value: {$ref: '#/components/schemas/Decimal'}
                  hwm: {type: integer, format: int64, description: "Posting sequence the run reflects; later lines are not listed. For a consolidated run, the mark of the column's ledger, or 0 on a consolidated column, whose lines each follow their own ledger's mark (the run's hwmByLedger)"}
                  limit: {type: integer}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/DrillLine'}
                  sumOfLines: {$ref: '#/components/schemas/Decimal'}
                  cumulativeSum: {$ref: '#/components/schemas/Decimal'}
                  nextCursor: {type: [string, 'null']}
                  linesTotal: {$ref: '#/components/schemas/Decimal'}
                  difference: {$ref: '#/components/schemas/Decimal'}
                  unreconciledKeys: {type: integer}
                  reconciled: {type: boolean}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/runs/{id}/outputs/{format}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: format
        in: path
        required: true
        schema: {type: string, enum: [csv, pdf, xlsx, html]}
    get:
      operationId: getRunOutput
      summary: The run rendered as a file (FR-15.6)
      description: >-
        Rendered from the stored cells and the definition version of the run, so
        the same run always gives the same bytes. Every format carries the same
        content: a header (statement, definition version, ledger, period,
        currency type), the grid (exact six-place amounts, "n/a" for a missing
        prior-year period) and the "as of" footer (posting sequence per ledger,
        result hash, generated at and by, run id). csv prefixes text a
        spreadsheet would read as a formula with an apostrophe; html is one
        self-contained document without scripts; xlsx is a workbook with one
        sheet, Statement, with amounts as numbers and text as inline strings.
        pdf is not rendered yet and answers 404 COM-0404.
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition:
              description: attachment; filename="<definition code>-<run id>.<format>"
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
            text/html:
              schema: {type: string}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/Problem'}
        '500':
          description: REPORT-0016, the renderer failed for this format; other formats are unaffected
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/reporting/balance-verifications:
    get:
      operationId: listBalanceVerifications
      summary: Balance verifications against the ledger, newest first (FR-15.1)
      x-passage-duty: reporting.audit.view
      parameters:
        - name: ledgerId
          in: query
          required: false
          description: Only checks of this ledger
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 200}
      responses:
        '200':
          description: Stored checks, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/BalanceVerificationSummary'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503':
          description: Balance verification is not configured (REPORT-0036); LEDGER_URL or the service signing key is missing
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    post:
      operationId: createBalanceVerification
      summary: Compare the read model of a ledger with the ledger trial balance (FR-15.1)
      description: >-
        Reads the net per account of the read model (accounting currency, every period) and the ledger's trial
        balance (GET /v1/ledger/balances, acting as the service for the ledger's legal entity), and stores the
        comparison. A difference is a result (status differs), not an error. If the read model's high-water mark
        moved while the ledger was read, or entries of the ledger wait ahead of the mark, the status is
        inconclusive: repeat the check. Writes balance.verified.v1 to the outbox in the same transaction.
        The ledger sees only the finreport service's duty, so the caller must also hold the ledger duty
        ledger.balance.read (403 AUTH-0003 otherwise).
      x-passage-duty: reporting.balance.verify
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ledgerId]
              additionalProperties: false
              properties:
                ledgerId: {type: string, format: uuid}
                legalEntityId: {type: string, format: uuid, description: Optional assertion; must equal the legal entity that owns the ledger}
      responses:
        '201':
          description: Stored check
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BalanceVerification'}
        '200':
          description: Replay - the check stored for this Idempotency-Key and the same request
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BalanceVerification'}
        '400': {$ref: '#/components/responses/Problem'}
        '403':
          description: AUTH-0003 - the caller lacks reporting.balance.verify or ledger.balance.read
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404':
          description: REPORT-0031 - the caller sees no read-model rows of the ledger
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: Invalid body, idempotency_key_reuse, REPORT-0032 (legal entity mismatch) or REPORT-0036 (the ledger does not know the ledger)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '502':
          description: REPORT-0036 - the ledger did not answer, refused (401, 403, 429, 5xx) or answered something that is not the ledger's trial balance; nothing is stored, retry with the same Idempotency-Key
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503':
          description: REPORT-0036 - balance verification is not configured (no LEDGER_URL or signing key) or finreport cannot sign a ledger request for this ledger (service grant not seeded, or no single owning legal entity)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/reporting/balance-verifications/{id}:
    get:
      operationId: getBalanceVerification
      summary: One stored balance verification with its differing accounts
      description: >-
        The differing accounts carry ledger balances; a caller without ledger.balance.read gets them withheld
        (diffs empty, diffsWithheld true).
      x-passage-duty: reporting.audit.view
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The check
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BalanceVerification'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: REPORT-0035 - the check does not exist or is outside the caller's legal-entity scope
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503':
          description: Balance verification is not configured (REPORT-0036)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/reporting/lag:
    get:
      operationId: getLag
      summary: Read-model high-water mark per ledger (FR-15.1)
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: Lag rows and the lag gate in force
          content:
            application/json:
              schema:
                type: object
                required: [items, maxLagSeconds]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/LagRow'}
                  maxLagSeconds: {type: integer, description: The lag gate (reporting.max_lag_seconds); a row with a larger lagSeconds is stale}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/reporting/definitions/{code}:retire:
    parameters:
      - $ref: '#/components/parameters/Code'
    post:
      operationId: retireDefinition
      summary: Retire every published version (BR-15.8). Runs can no longer use the code; its versions and past runs stay readable and an open draft is kept. Repeating the call on a retired code succeeds with retiredVersions 0.
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: Retired
          content:
            application/json:
              schema:
                type: object
                required: [code, status, retiredVersions]
                properties:
                  code: {type: string}
                  status: {type: string, enum: [retired]}
                  retiredVersions: {type: integer, description: published versions retired by this call}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/standard-definitions:
    get:
      operationId: listStandardDefinitions
      summary: The statutory definitions the service ships (TB-STD, BS-STD, PL-STD, PL-FUNC; FR-15.5, FR-15.14)
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: Shipped definitions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/StandardDefinition'}
  /v1/reporting/standard-definitions:install:
    post:
      operationId: installStandardDefinitions
      summary: Publish, as version 1 and in one transaction, every shipped definition whose code the tenant does not use yet. Codes with any draft, published or retired version are skipped, so repeating the call is safe.
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: Per-code result
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/InstallResult'}
  /v1/reporting/hierarchies:
    get:
      operationId: listHierarchies
      summary: One summary per derived hierarchy code (FR-15.13)
      description: >-
        Maintainers see every code, drafts included. A caller with reporting.statement.run
        and without reporting.definition.maintain (a statement runner picking the rows of a
        run, FR-15.4) sees only codes with a published version, and hasDraft is always false.
      x-passage-duty: reporting.definition.maintain or reporting.statement.run
      responses:
        '200':
          description: Hierarchy summaries ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/HierarchySummary'}
  /v1/reporting/hierarchies/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      operationId: getHierarchy
      summary: Read a derived hierarchy (draft, latest published or an exact version) (FR-15.13)
      x-passage-duty: reporting.definition.maintain
      parameters:
        - name: version
          in: query
          required: false
          schema: {type: string, description: draft, latest (default) or a positive version}
      responses:
        '200':
          description: The hierarchy
          headers:
            ETag:
              description: Draft revision (drafts only)
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Hierarchy'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: putHierarchy
      summary: Create or replace the draft hierarchy (idempotent). The body is the JSON a GET returns, so this is also the import path. Omitted strict defaults to true for account and category hierarchies.
      x-passage-duty: reporting.definition.maintain
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Required when a draft exists; the ETag last read. Missing gives 428, stale gives 412 conflict_version.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Hierarchy'}
      responses:
        '200':
          description: Saved draft
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Hierarchy'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/reporting/hierarchies/{code}:publish:
    parameters:
      - $ref: '#/components/parameters/Code'
    post:
      operationId: publishHierarchy
      summary: Publish the draft as the next version and materialize its membership over the supplied members. Refuses overlapping members (REPORT-0014) and, for strict hierarchies, unassigned members (REPORT-0013); a non-strict publish emits hierarchy.unassigned.v1 per unassigned member.
      x-passage-duty: reporting.definition.maintain
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                members:
                  type: array
                  items: {$ref: '#/components/schemas/Member'}
      responses:
        '200':
          description: Published hierarchy and its membership
          content:
            application/json:
              schema:
                type: object
                properties:
                  hierarchy: {$ref: '#/components/schemas/Hierarchy'}
                  membership: {$ref: '#/components/schemas/Membership'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/reporting/hierarchies/{code}/members:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      operationId: getHierarchyMembers
      summary: Materialized membership of a published version (latest by default)
      x-passage-duty: reporting.definition.maintain
      parameters:
        - name: version
          in: query
          required: false
          schema: {type: string, description: latest (default) or a positive published version}
      responses:
        '200':
          description: Membership of the version
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Membership'
                  - type: object
                    required: [version]
                    properties:
                      version: {type: integer}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/schedules:
    get:
      operationId: listSchedules
      summary: Distribution schedules ordered by code (FR-15.8)
      x-passage-duty: reporting.statement.schedule
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Schedule'}
  /v1/reporting/schedules/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      operationId: getSchedule
      summary: Read a distribution schedule
      x-passage-duty: reporting.statement.schedule
      responses:
        '200':
          description: The schedule
          headers:
            ETag:
              description: Schedule revision, echoed in If-Match to replace it
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: putSchedule
      summary: Create or replace a distribution schedule (idempotent)
      description: >-
        The definition must have a published version (REPORT-0001). Field
        errors answer 422 REPORT-0018. Omitted attachmentLimitMb defaults to
        20 and currencyType to acct; recipients are lower-cased. nextRunAt and
        updatedBy are read-only and ignored when sent.
      x-passage-duty: reporting.statement.schedule
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Required when the schedule exists; the ETag last read. Missing gives 428, stale gives 412 conflict_version.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Schedule'}
      responses:
        '200':
          description: Saved schedule
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/reporting/row-sets:
    get:
      operationId: listRowSets
      summary: RowSets ordered by code (FR-15.2)
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: RowSets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/RowSet'}
  /v1/reporting/row-sets/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      operationId: getRowSet
      summary: Read a row set
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: The row set
          headers:
            ETag:
              description: RowSet revision, echoed in If-Match to replace it
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RowSet'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: putRowSet
      summary: Create or replace a row set (idempotent)
      description: >-
        The rows follow the row rules of a definition: at most 2,000, unique codes, totals over known rows, no cycles. Field errors answer 422 REPORT-0038 for the code and name and
        REPORT-0002 for expressions and references. updatedBy is read-only and
        ignored when sent.
      x-passage-duty: reporting.definition.maintain
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Required when the row set exists; the ETag last read. Missing gives 428, stale gives 412 conflict_version. Without If-Match the PUT only creates; when two requests create the same code at once, one succeeds and the other answers 409 conflict_version.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RowSet'}
      responses:
        '200':
          description: Saved row set
          headers:
            ETag:
              description: New revision
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RowSet'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/reporting/trees:
    get:
      operationId: listTrees
      summary: Reporting trees ordered by code (FR-15.4)
      description: >-
        Maintainers and statement runners (the run form picks a tree and a unit from this list,
        which carries every tree's units) list trees; reading one tree and changing it take
        reporting.definition.maintain.
      x-passage-duty: reporting.definition.maintain or reporting.statement.run
      responses:
        '200':
          description: Trees
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Tree'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/reporting/trees/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      operationId: getTree
      summary: Read a reporting tree
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: The tree
          headers:
            ETag:
              description: Tree revision, echoed in If-Match to replace it
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tree'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: putTree
      summary: Create or replace a reporting tree (idempotent)
      description: >-
        A tree groups the values of one dimension attribute into reporting units with parents
        for roll-up (FR-15.4). At most 500 units nested up to 10 levels; unit codes are unique;
        every parent exists; a unit without child units lists at least one value; a dimension
        value belongs to at most one unit, so a roll-up never counts it twice. Field errors
        answer 422 REPORT-0039. updatedBy is read-only and ignored when sent. A statement run
        names a tree and a unit (POST /runs with tree).
      x-passage-duty: reporting.definition.maintain
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Required when the tree exists; the ETag last read. Missing gives 428, stale gives 412 conflict_version. Without If-Match the PUT only creates; when two requests create the same code at once, one succeeds and the other answers 409 conflict_version.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Tree'}
      responses:
        '200':
          description: Saved tree
          headers:
            ETag:
              description: New revision
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tree'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/reporting/trees/{code}/revisions:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      operationId: listTreeRevisions
      summary: Stored revisions of a reporting tree
      description: >-
        Every save of a tree keeps the revision it produced, newest first, so that a run made on
        an older revision can still show its units (GET /runs/{id}/tree). Trees saved before
        revisions were kept have only their then-current revision.
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: The revisions, newest first, without their bodies
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/TreeRevision'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/trees/{code}/revisions/{revision}:
    parameters:
      - $ref: '#/components/parameters/Code'
      - name: revision
        in: path
        required: true
        description: Tree revision number, from 1
        schema: {type: integer, minimum: 1}
    get:
      operationId: getTreeRevision
      summary: Read a reporting tree as it was at one revision
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: The tree at that revision
          headers:
            ETag:
              description: The revision read
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tree'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/column-sets:
    get:
      operationId: listColumnSets
      summary: ColumnSets ordered by code (FR-15.3)
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: ColumnSets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ColumnSet'}
  /v1/reporting/column-sets/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      operationId: getColumnSet
      summary: Read a column set
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: The column set
          headers:
            ETag:
              description: ColumnSet revision, echoed in If-Match to replace it
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ColumnSet'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: putColumnSet
      summary: Create or replace a column set (idempotent)
      description: >-
        The columns follow the column rules of a definition: at most 60, supported period expressions, CALC columns over known columns, no cycles. Field errors answer 422 REPORT-0038 for the code and name and
        REPORT-0002 for expressions and references. updatedBy is read-only and
        ignored when sent.
      x-passage-duty: reporting.definition.maintain
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Required when the column set exists; the ETag last read. Missing gives 428, stale gives 412 conflict_version. Without If-Match the PUT only creates; when two requests create the same code at once, one succeeds and the other answers 409 conflict_version.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ColumnSet'}
      responses:
        '200':
          description: Saved column set
          headers:
            ETag:
              description: New revision
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ColumnSet'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/reporting/column-set-templates:
    get:
      operationId: listColumnSetTemplates
      summary: Comparative column sets the service ships (FR-15.3)
      description: >-
        Period against prior year, year to date against prior year to date,
        period against prior period, and all of them, each with variance and
        variance percent CALC columns (current minus comparative, and that over
        the comparative times 100, on displayed values: blank when the
        comparative is zero, sign reversed when it is below zero). Save one under a tenant code with
        PUT /column-sets/{code} to edit it, or name it as the columnSet of
        a compose request.
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: Templates ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ColumnSet'}
  /v1/reporting/definitions:compose:
    post:
      operationId: composeDefinition
      summary: Build a definition draft body from a row set and a column set
      description: >-
        Copies the rows of the row set and the columns of the column set (a
        stored one, else a shipped template of that code) into a draft body and
        validates it. Nothing is stored: save the body with PUT /definitions/{code}.
        An unknown set answers 404 REPORT-0037, an invalid result 422.
      x-passage-duty: reporting.definition.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, rowSet, columnSet]
              properties:
                code: {type: string}
                name: {type: string}
                kind: {type: string, enum: [trial_balance, balance_sheet, income_statement, cash_flow, custom], description: Defaults to custom}
                includeAdjustmentPeriods: {type: boolean}
                rowSet: {type: string, description: Code of a stored row set}
                columnSet: {type: string, description: Code of a stored column set or of a shipped template}
      responses:
        '200':
          description: The draft body, version 0
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Definition'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/reporting/audit-trail:
    get:
      operationId: listAuditTrail
      summary: Audit trail report (FR-15.10)
      description: >-
        Who posted, approved, reversed, reopened or overrode what, and who ran,
        published, retired or scheduled reporting objects, oldest first and
        keyset paged by (occurredAt, id). The range is always narrowed: name a
        period, or both from and to at most 366 days apart; otherwise 400
        COM-0002. Ledger kinds come from other services' events (later slice);
        reporting kinds are written with the change they record.
      x-passage-duty: reporting.audit.view
      parameters:
        - $ref: '#/components/parameters/AuditLedger'
        - $ref: '#/components/parameters/AuditPeriod'
        - $ref: '#/components/parameters/AuditKind'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - name: cursor
          in: query
          required: false
          description: nextCursor of the previous page
          schema: {type: string}
        - name: limit
          in: query
          required: false
          description: Entries per page, 1 to 1000; default 100
          schema: {type: integer, minimum: 1, maximum: 1000}
      responses:
        '200':
          description: One page of audit entries
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, nextCursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEntry'}
                  limit: {type: integer}
                  nextCursor: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/reporting/audit-trail:export:
    get:
      operationId: exportAuditTrail
      summary: Audit trail as a CSV file with its SHA-256 (FR-15.10)
      description: >-
        Every entry matching the filter (same rules as the list), oldest first,
        as CSV with the columns occurred_at, kind, ledger_id, period, actor_id,
        object_ref, details (JSON, sorted keys), trace_id. Text a spreadsheet
        would read as a formula is prefixed with an apostrophe. The export is
        recorded in the trail (kind audit_exported, with the filter, entry
        count and digest) under the export id. More than 50,000 matching
        entries is refused with 422 REPORT-0030 rather than cut short. PDF is a
        later slice.
      x-passage-duty: reporting.audit.view
      parameters:
        - $ref: '#/components/parameters/AuditLedger'
        - $ref: '#/components/parameters/AuditPeriod'
        - $ref: '#/components/parameters/AuditKind'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          description: The CSV file
          headers:
            Content-Disposition:
              description: attachment; filename="audit-trail-<export id>.csv"
              schema: {type: string}
            X-Passage-Export-Id:
              description: Id of the audit_exported entry that records this export
              schema: {type: string, format: uuid}
            X-Passage-Export-Sha256:
              description: Hex SHA-256 of the response body
              schema: {type: string, pattern: '^[0-9a-f]{64}$'}
            X-Passage-Export-Entries:
              description: Number of entries in the file
              schema: {type: integer}
          content:
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/reporting/schedule-firings:
    get:
      operationId: listScheduleFirings
      summary: Firings of the distribution schedules, newest first (FR-15.8)
      description: >-
        One row per firing of a schedule for one ledger, written when the
        statement-schedules job ends it: completed with the run it made, or
        failed with the problem code and detail of its last attempt (one retry
        is made). With latest=true it is the "last run" of the Schedules
        screen. A firing is recorded once per schedule, ledger and cron time.
      x-passage-duty: reporting.statement.schedule
      parameters:
        - name: schedule
          in: query
          required: false
          description: Only the firings of this schedule code
          schema: {type: string}
        - name: latest
          in: query
          required: false
          description: true keeps only the newest firing of each schedule and ledger (the last run of every schedule however many older firings there are)
          schema: {type: boolean, default: false}
        - name: limit
          in: query
          required: false
          description: Firings returned, 1 to 200; default 200
          schema: {type: integer, minimum: 1, maximum: 200}
      responses:
        '200':
          description: The firings, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ScheduleFiring'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/reporting/library:
    get:
      operationId: listLibrary
      summary: Report library of stored statement files (FR-15.8)
      description: >-
        The output files of scheduled runs (csv, html, xlsx), newest first and
        keyset paged by (createdAt, id), filtered by definition, entity (ledger),
        period, schedule and format. Each entry lists the file's SHA-256 and the
        date until which it is retained. The files are not in the list; download
        one from its content link. Visibility follows the caller's legal-entity
        scope.
      x-passage-duty: reporting.statement.view
      parameters:
        - {name: definition, in: query, required: false, description: Definition code, schema: {type: string}}
        - {name: ledger, in: query, required: false, description: Ledger id, schema: {type: string, format: uuid}}
        - {name: schedule, in: query, required: false, description: Schedule code that produced the file, schema: {type: string}}
        - {name: format, in: query, required: false, description: File format, schema: {type: string, enum: [csv, html, xlsx, pdf]}}
        - {name: period, in: query, required: false, description: 'Fiscal period as YYYY-PP', schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$', example: '2026-03'}}
        - name: cursor
          in: query
          required: false
          description: nextCursor of the previous page
          schema: {type: string}
        - name: limit
          in: query
          required: false
          description: Entries per page, 1 to 200; default 50
          schema: {type: integer, minimum: 1, maximum: 200}
      responses:
        '200':
          description: One page of library entries
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, nextCursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/LibraryEntry'}
                  limit: {type: integer}
                  nextCursor: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/reporting/library/{id}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      operationId: getLibraryEntry
      summary: One report library entry (FR-15.8)
      description: The metadata of a stored file, with its SHA-256 and retention date.
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: The library entry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: REPORT-0043 - no such entry, or it is outside the caller's legal-entity scope
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/reporting/library/{id}/content:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      operationId: getLibraryContent
      summary: Download a stored statement file (FR-15.8)
      description: >-
        Exactly the bytes that were distributed. The SHA-256 of the body is in
        the ETag and in X-Passage-Content-Sha256, so a download can be checked
        against the entry.
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition:
              description: attachment with the stored file name
              schema: {type: string}
            ETag:
              description: The SHA-256 of the body in quotes
              schema: {type: string}
            X-Passage-Content-Sha256:
              description: Hex SHA-256 of the response body
              schema: {type: string, pattern: '^[0-9a-f]{64}$'}
          content:
            text/csv:
              schema: {type: string}
            text/html:
              schema: {type: string}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: REPORT-0043 - no such entry, or it is outside the caller's legal-entity scope
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/reporting/library/{id}/share-links:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      operationId: listShareLinks
      summary: Share links of a stored statement file (FR-15.8)
      description: >-
        The links made to the file, newest first, with their status (active, expired or revoked), expiry and
        download count. The secret of a link is never listed; it is shown once, when the link is created.
      x-passage-duty: reporting.library.share
      responses:
        '200':
          description: The share links of the file
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ShareLink'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: REPORT-0043 - no such entry, or it is outside the caller's legal-entity scope
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    post:
      operationId: createShareLink
      summary: Share a stored statement file with a link that expires (FR-15.8)
      description: >-
        Makes a bearer link to the file. Anyone who holds the link can download the file until it expires or is
        revoked, with no Passage sign-in, so hand it only to the people who should see the statement. The
        link works for expiresInDays (1 to 90; the default is REPORTING_SHARE_LINK_EXPIRY_DAYS, 14), or until
        the file's retention date when that is sooner. The response carries the secret token and the download
        path once; only a hash of the secret is stored. A repeated request with the same Idempotency-Key
        returns the stored link with 200 and without the token. The link, an audit trail entry and
        sharelink.created.v1 are written in one transaction.
      x-passage-duty: reporting.library.share
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expiresInDays: {type: integer, minimum: 1, maximum: 90, description: Lifetime of the link in days; the configured default when absent}
      responses:
        '201':
          description: The link was created; token and path are in this response only
          headers:
            ETag:
              description: Revision of the link; send it in If-Match to revoke it
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareLink'}
        '200':
          description: Replay - the link stored for this Idempotency-Key and the same request, without its token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareLink'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: REPORT-0043 - no such entry, or it is outside the caller's legal-entity scope
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: REPORT-0053 (the file is past its retention date) or idempotency_key_in_flight
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: Invalid body, REPORT-0052 (expiresInDays outside 1 to 90) or idempotency_key_reuse
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/reporting/share-links/{id}:revoke:
    parameters:
      - $ref: '#/components/parameters/ShareLinkId'
    post:
      operationId: revokeShareLink
      summary: Revoke a share link (FR-15.8)
      description: >-
        Ends the link at once; a download with it answers 410 from then on. If-Match carries the revision read
        (428 when missing, 412 conflict_version when stale). The revocation, an audit trail entry and
        sharelink.revoked.v1 are written in one transaction.
      x-passage-duty: reporting.library.share
      parameters:
        - {name: If-Match, in: header, required: true, description: Revision of the link as read (the ETag), schema: {type: string}}
      responses:
        '200':
          description: The revoked link
          headers:
            ETag:
              description: New revision of the link
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareLink'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: REPORT-0050 - no such link, or it is outside the caller's legal-entity scope
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: REPORT-0054 - the link was revoked already
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '412':
          description: conflict_version - the link changed since it was read
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '428':
          description: precondition_required - If-Match is missing
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/reporting/shared/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The secret token of a share link, as returned once when the link was created
        schema: {type: string}
    get:
      operationId: getSharedFile
      summary: Download a file through a share link (FR-15.8)
      description: >-
        Public: no Passage sign-in. The token is the only credential; the gateway route for this path must not
        require a JWT. Serves exactly the stored file, with its SHA-256 in the ETag and in
        X-Passage-Content-Sha256, and counts the download on the link. Answers are never cached, framed or
        run as a page (Cache-Control no-store, Content-Disposition attachment, a sandbox Content-Security-Policy,
        X-Frame-Options DENY, nosniff, Referrer-Policy no-referrer). The token is never logged: the access log
        and problem instance carry /v1/reporting/shared/{token}. A token that names no link answers 404
        REPORT-0050; a link that expired or was revoked answers 410 REPORT-0051.
      x-passage-duty: public
      security: []
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition:
              description: attachment with the stored file name
              schema: {type: string}
            ETag:
              description: The SHA-256 of the body in quotes
              schema: {type: string}
            X-Passage-Content-Sha256:
              description: Hex SHA-256 of the response body
              schema: {type: string, pattern: '^[0-9a-f]{64}$'}
            Cache-Control:
              description: private, no-store
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
            text/html:
              schema: {type: string}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '404':
          description: REPORT-0050 - the token names no link
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '410':
          description: REPORT-0051 - the link expired or was revoked
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/reporting/legal-holds:
    get:
      operationId: listLegalHolds
      summary: Legal holds on the report library, newest first (FR-15.8)
      description: >-
        The holds placed on the report library of a legal entity, in force or released, newest first, for the
        legal entities in the caller's scope. While a hold is in force the retention sweep deletes none of
        the entity's files.
      x-passage-duty: reporting.statement.view
      parameters:
        - {name: active, in: query, required: false, description: 'true keeps the holds still in force', schema: {type: boolean}}
      responses:
        '200':
          description: The legal holds
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/LegalHold'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: placeLegalHold
      summary: Put the report library of a legal entity under legal hold (FR-15.8)
      description: >-
        Suspends the retention sweep for the legal entity: no file of its report library is deleted, past its
        retention date or not, until the hold is released. One hold can be in force per entity (409
        REPORT-0045). The hold, an audit trail entry and legalhold.placed.v1 are written in one transaction.
        A repeated request with the same Idempotency-Key returns the stored hold.
      x-passage-duty: reporting.library.hold
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, reason]
              additionalProperties: false
              properties:
                legalEntityId: {type: string, format: uuid, description: Legal entity whose library is held; must be in the caller's scope}
                reason: {type: string, minLength: 1, maxLength: 500, description: Why the hold is placed (matter, case or audit reference)}
      responses:
        '201':
          description: The hold was placed
          headers:
            Location:
              schema: {type: string}
            ETag:
              description: Revision of the hold; send it in If-Match to release it
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegalHold'}
        '200':
          description: Replay - the hold stored for this Idempotency-Key and the same request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegalHold'}
        '400': {$ref: '#/components/responses/Problem'}
        '403':
          description: AUTH-0003 (missing reporting.library.hold) or REPORT-0048 (the legal entity is outside the caller's scope)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: REPORT-0045 - the legal entity is already under legal hold, or idempotency_key_in_flight
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: Invalid body, REPORT-0049 (reason empty or longer than 500 characters) or idempotency_key_reuse
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/reporting/legal-holds/{id}:
    parameters:
      - $ref: '#/components/parameters/LegalHoldId'
    get:
      operationId: getLegalHold
      summary: One legal hold (FR-15.8)
      description: A hold on the report library of a legal entity, with its revision in the ETag.
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: The legal hold
          headers:
            ETag:
              description: Revision of the hold
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegalHold'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: REPORT-0047 - no such hold, or it is outside the caller's legal-entity scope
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/reporting/legal-holds/{id}:release:
    parameters:
      - $ref: '#/components/parameters/LegalHoldId'
    post:
      operationId: releaseLegalHold
      summary: Release a legal hold (FR-15.8)
      description: >-
        Ends the hold; the retention sweep deletes the entity's past-retention files again at its next pass.
        If-Match carries the revision read (428 when missing, 412 conflict_version when stale). The release,
        an audit trail entry and legalhold.released.v1 are written in one transaction.
      x-passage-duty: reporting.library.hold
      parameters:
        - {name: If-Match, in: header, required: true, description: Revision of the hold as read (the ETag), schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: {type: string, maxLength: 500, description: Release note}
      responses:
        '200':
          description: The released hold
          headers:
            ETag:
              description: New revision of the hold
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegalHold'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: REPORT-0047 - no such hold, or it is outside the caller's legal-entity scope
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: REPORT-0046 - the hold was released already
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '412':
          description: conflict_version - the hold changed since it was read
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: REPORT-0049 - the note is longer than 500 characters
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '428':
          description: precondition_required - If-Match is missing
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/reporting/library-sweeps:
    get:
      operationId: listLibrarySweeps
      summary: Passes of the library retention sweep, newest first (FR-15.8)
      description: >-
        One row per legal entity pass of the weekly sweep that deleted files past their retention date or
        found some kept by a legal hold: how many files and bytes were deleted, how many a hold kept. Passes
        that found nothing past retention are not recorded. Visibility follows the caller's legal-entity scope.
      x-passage-duty: reporting.statement.view
      parameters:
        - name: limit
          in: query
          required: false
          description: Passes to return, 1 to 200; default 200
          schema: {type: integer, minimum: 1, maximum: 200}
      responses:
        '200':
          description: The sweep passes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/LibrarySweep'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/reporting/run-sweeps:
    get:
      operationId: listRunSweeps
      summary: Passes of the ad-hoc run retention sweep, newest first (FR-15.8)
      description: >-
        One row per legal entity pass of the weekly sweep that deleted ad-hoc statement runs older than the
        retention days (REPORTING_RETENTION_ADHOC_DAYS, default 90), with their cells, or found some kept by a
        legal hold. An ad-hoc run is one that no schedule firing and no library file refers to; scheduled runs
        are not deleted by this sweep. Passes that found nothing past retention are not recorded. Visibility
        follows the caller's legal-entity scope.
      x-passage-duty: reporting.statement.view
      parameters:
        - name: limit
          in: query
          required: false
          description: Passes to return, 1 to 200; default 200
          schema: {type: integer, minimum: 1, maximum: 200}
      responses:
        '200':
          description: The run sweep passes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/RunSweep'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    LegalHoldId:
      name: id
      in: path
      required: true
      description: Legal hold id
      schema: {type: string, format: uuid}
    ShareLinkId:
      name: id
      in: path
      required: true
      description: Share link id
      schema: {type: string, format: uuid}
    LibraryId:
      name: id
      in: path
      required: true
      description: Report library entry id
      schema: {type: string, format: uuid}
    AuditLedger:
      name: ledger
      in: query
      required: false
      description: Ledger id
      schema: {type: string, format: uuid}
    AuditPeriod:
      name: period
      in: query
      required: false
      description: Fiscal year and period number, such as 2026-03 (2026-00 is the opening period)
      schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2,3}$'}
    AuditKind:
      name: kind
      in: query
      required: false
      schema: {$ref: '#/components/schemas/AuditKind'}
    AuditActor:
      name: actor
      in: query
      required: false
      description: User id of the actor
      schema: {type: string}
    AuditFrom:
      name: from
      in: query
      required: false
      description: Inclusive start, RFC 3339
      schema: {type: string, format: date-time}
    AuditTo:
      name: to
      in: query
      required: false
      description: Exclusive end, RFC 3339; at most 366 days after from
      schema: {type: string, format: date-time}
    Code:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9-]{1,29}$'
    RunId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 255}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Decimal:
      type: string
      description: Decimal string, never a float
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri, example: 'https://passage.dev/problems/REPORT-0001'}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        traceId: {type: string}
    Issue:
      type: object
      required: [field, code, detail]
      properties:
        field: {type: string}
        code: {type: string}
        detail: {type: string}
    DefinitionSummary:
      type: object
      required: [code, name, kind, status, latestVersion, hasDraft, updatedAt]
      properties:
        code: {type: string}
        name: {type: string}
        kind: {type: string, enum: [trial_balance, balance_sheet, income_statement, cash_flow, custom]}
        status: {type: string, enum: [draft, published, retired], description: published when a version can run, retired when every version was retired, draft otherwise}
        latestVersion: {type: integer, description: newest published version, 0 when none}
        hasDraft: {type: boolean}
        updatedAt: {type: string, format: date-time}
    Definition:
      type: object
      required: [code, name, kind, rows, columns]
      properties:
        schemaVersion: {type: string, enum: ['1']}
        code: {type: string, pattern: '^[A-Z][A-Z0-9-]{1,29}$'}
        name: {type: string, maxLength: 120}
        version: {type: integer, description: 0 for drafts}
        status: {type: string, enum: [draft, published, retired]}
        kind: {type: string, enum: [trial_balance, balance_sheet, income_statement, cash_flow, custom]}
        includeAdjustmentPeriods: {type: boolean}
        rows:
          type: array
          maxItems: 2000
          items: {$ref: '#/components/schemas/Row'}
        columns:
          type: array
          maxItems: 60
          items: {$ref: '#/components/schemas/Column'}
    Row:
      type: object
      required: [code, kind, label, normalBalance]
      properties:
        code: {type: string}
        kind: {type: string, enum: [header, account_range, dimension_filter, total, calculation]}
        label: {type: string}
        accountFrom: {type: string}
        accountTo: {type: string}
        accounts:
          type: array
          maxItems: 20000
          items: {type: string}
          description: An explicit account list for account_range rows, instead of or together with the range (hierarchy runs write it)
        dimensionFilter:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        references: {type: array, items: {type: string}}
        expression: {type: string, description: 'Calculation over row codes; prefix raw: to use stored net instead of displayed values (BR-15.3)'}
        normalBalance: {type: string, enum: [debit, credit]}
        cashFlowTag: {type: string, enum: ['', operating_adjustment, working_capital, investing, financing, cash]}
        format:
          type: object
          properties:
            bold: {type: boolean}
            indent: {type: integer}
            printZero: {type: boolean}
            pageBreak: {type: boolean}
    Column:
      type: object
      required: [code, label, periodExpr]
      properties:
        code: {type: string}
        label: {type: string}
        periodExpr: {type: string, pattern: '^(P|P-[0-9]+|YTD|PY|PYTD|Q|FY|CALC)$'}
        currencyType: {type: string, enum: [acct, rpt, txn], description: Omitted means the run's currency type}
        calcExpression: {type: string}
        balanceSide:
          type: string
          enum: [debit, credit]
          description: >-
            Trial balance split. debit keeps only accounts whose net over the column is a debit
            balance (shown as the net); credit only those with a credit balance (shown positive).
            An account is on one side as a whole, so a cell still drills to exactly its balances.
            The side is decided per cell, over the balances the row and the column read. An account
            netting to zero is on neither side. Omitted shows every account. Not allowed on CALC
            columns or on cash flow definitions (422 COM-0001).
        dimensionFilter:
          type: object
          description: >-
            Limits the column to balances whose dimension values match, in the shape of a row's
            dimensionFilter ({attribute: [values or "*"]}): "*" matches every balance, also one without
            a value for the attribute, and "" matches only a balance without a value.
            A row picks up a balance only when its own filter and the column's both match, so
            one definition can show a column per cost center. Not allowed on CALC columns or on
            columns of a cash_flow definition (422 COM-0001).
          additionalProperties:
            type: array
            maxItems: 200
            items: {type: string}
    RowSet:
      type: object
      required: [code, name, rows]
      properties:
        code: {type: string, pattern: '^[A-Z][A-Z0-9-]{1,29}$'}
        name: {type: string, minLength: 1, maxLength: 120}
        rows:
          type: array
          maxItems: 2000
          items: {$ref: '#/components/schemas/Row'}
        updatedBy: {type: string, readOnly: true}
    ColumnSet:
      type: object
      required: [code, name, columns]
      properties:
        code: {type: string, pattern: '^[A-Z][A-Z0-9-]{1,29}$'}
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 500}
        columns:
          type: array
          maxItems: 60
          items: {$ref: '#/components/schemas/Column'}
        updatedBy: {type: string, readOnly: true}
    RunRequest:
      type: object
      required: [definition, currencyType, period, calendar]
      properties:
        definition: {type: string}
        definitionVersion: {type: integer, minimum: 0, description: 0 or omitted means the latest published version}
        ledgerId: {type: string, format: uuid, description: Required unless consolidation is given; with consolidation it must be the first consolidation ledger or be left out}
        legalEntityId: {type: string, format: uuid, description: "Assertion only: the run is owned by the legal entity of the ledger's reporting rows. A different value is refused with 422 REPORT-0032."}
        currencyType: {type: string, enum: [acct, rpt, txn]}
        period: {$ref: '#/components/schemas/Period'}
        calendar:
          type: array
          description: The ledger's fiscal periods, used to place balances in columns. Replaced by the ledger calendar in a later slice.
          items: {$ref: '#/components/schemas/Period'}
        includeAdjustmentPeriods: {type: boolean, description: Counts adjustment periods in P-n, YTD, Q and FY even when the definition does not}
        hierarchy: {$ref: '#/components/schemas/HierarchyRun'}
        tree: {$ref: '#/components/schemas/TreeRun'}
        consolidation: {$ref: '#/components/schemas/ConsolidationRun'}
        allowStale: {type: boolean, default: false, description: "Accepts a read model behind reporting.max_lag_seconds. The run completes with a REPORT-0004 warning in checks instead of being refused with 409 REPORT-0004."}
    HierarchyRun:
      type: object
      required: [code]
      description: >-
        Takes the rows of the run from a published main account or dimension value hierarchy.
        The definition keeps supplying the columns and the kind (a cash flow cannot be used,
        REPORT-0033). One row per node with members in the ledger, depth first; parents total
        their children; members no node claims go to an Unassigned row (REPORT-0034 warning);
        a Total row closes the statement. Members that match no stored membership are placed by
        the rules on their key; two matching leaves fail the run with REPORT-0014.
      properties:
        code: {type: string, description: Hierarchy code}
        version: {type: integer, minimum: 0, description: 0 or omitted means the latest published version}
        normalBalance: {type: string, enum: [debit, credit], description: How amounts are presented; debit when omitted}
        accountFrom: {type: string, description: Dimension hierarchies only; with accountTo, limits the rows to this account range}
        accountTo: {type: string}
    TreeRevision:
      type: object
      required: [revision, updatedBy, createdAt]
      properties:
        revision: {type: integer, minimum: 1}
        updatedBy: {type: string}
        createdAt: {type: string, format: date-time}
    RunTree:
      type: object
      required: [code, unit, revision, currentRevision, tree]
      properties:
        code: {type: string, description: Tree code}
        unit: {type: string, description: The run's unit; empty for the whole tree}
        revision: {type: integer, minimum: 1, description: Tree revision the run used}
        currentRevision: {type: integer, minimum: 1, description: Tree revision now; larger than revision when the tree changed after the run}
        tree: {$ref: '#/components/schemas/Tree'}
    Tree:
      type: object
      required: [code, name, attribute, units]
      properties:
        code: {type: string, pattern: '^[A-Z][A-Z0-9-]{1,29}$'}
        name: {type: string, minLength: 1, maxLength: 120}
        attribute: {type: string, description: The dimension attribute the units group, such as profit_center}
        units:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/TreeUnit'}
        updatedBy: {type: string, readOnly: true}
    TreeUnit:
      type: object
      required: [code, name]
      properties:
        code: {type: string, pattern: '^[A-Z0-9][A-Z0-9_.-]{0,29}$'}
        name: {type: string, minLength: 1, maxLength: 120}
        parent: {type: string, description: Code of the parent unit; omitted for a top-level unit}
        values:
          type: array
          maxItems: 200
          description: Values of the tree's dimension attribute that belong to this unit itself; the unit also covers the values of every unit below it
          items: {type: string, minLength: 1, maxLength: 60}
    ConsolidationRun:
      type: object
      required: [ledgers]
      description: >-
        Runs the definition consolidated by entity (FR-15.5). Every column of the definition
        becomes one column for the sum of all the ledgers (the column's own code, label suffixed
        "- Consolidated") followed by one column per ledger (code CODE_E1, CODE_E2 in the order
        given, label suffixed with the ledger's label). Ledger amounts are added as stored: there
        is no currency translation, so every column must read the reporting currency type rpt,
        and no intercompany elimination. A CALC column is expanded too: the consolidated column
        calculates over the consolidated columns, each entity column over that entity's columns.
        A cash flow definition, a tree and a hierarchy are refused, as are fewer than 2 or more
        than 12 ledgers, more than 60 columns after the expansion, or a definition column whose
        code equals an expanded entity column code (422 REPORT-0042). Every ledger is read under
        the caller's legal-entity scope; a ledger the caller cannot see is 404 REPORT-0031, never
        left out. The run is visible only to callers whose scope covers every entity of its
        ledgers. Level 1 balance keys name the ledger; the journal lines of a cell are read per
        key from that key's ledger at that ledger's high-water mark in the run.
      properties:
        ledgers:
          type: array
          minItems: 2
          maxItems: 12
          items:
            type: object
            required: [ledgerId]
            properties:
              ledgerId: {type: string, format: uuid}
              label: {type: string, maxLength: 40, description: Column suffix naming the entity; the first 8 characters of the ledger id when empty}
    TreeRun:
      type: object
      required: [code]
      description: >-
        Limits the run to the balances whose dimension attribute value belongs to a unit of a
        reporting tree, rolled up over the units below it (FR-15.4). One run per unit gives one
        report per unit; the run of a parent unit is the roll-up of its children. Without
        unit the run covers the whole tree and carries a REPORT-0041 warning when the ledger
        has balances for values the tree does not list or without a value. The rows and
        columns come from the definition; a cash flow definition cannot be limited to a unit
        (REPORT-0040), nor can an unknown tree or unit.
      properties:
        code: {type: string, description: Tree code}
        unit: {type: string, description: Unit code; omitted or empty means the whole tree}
    Period:
      type: object
      required: [year, no, quarter]
      properties:
        year: {type: integer, minimum: 1}
        no: {type: integer, minimum: 0, description: 0 is the opening period that carries brought-forward balances}
        quarter: {type: integer, minimum: 1, maximum: 4}
        adjustment: {type: boolean}
    Run:
      type: object
      properties:
        id: {type: string, format: uuid}
        definitionCode: {type: string}
        definitionVersion: {type: integer}
        ledgerId: {type: string, format: uuid}
        currencyType: {type: string}
        periodYear: {type: integer}
        periodNo: {type: integer}
        status: {type: string, enum: [queued, running, completed, failed]}
        hwmByLedger:
          type: object
          additionalProperties: {type: integer}
        resultHash: {type: string, description: SHA-256 hex over cells}
        hierarchy:
          type: object
          description: Present when the rows of the run are the nodes of a hierarchy
          properties:
            code: {type: string}
            version: {type: integer}
        consolidation:
          type: array
          description: Present when the run is consolidated by entity; the ledgers in column order (ledgerId is the first)
          items:
            type: object
            properties:
              ledgerId: {type: string, format: uuid}
              label: {type: string}
        tree:
          type: object
          description: Present when the run is limited to a unit of a reporting tree
          properties:
            code: {type: string}
            unit: {type: string, description: Empty for the whole tree}
            revision: {type: integer, description: Tree revision the run used}
        cellCount: {type: integer}
        requestedBy: {type: string}
        startedAt: {type: string, format: date-time}
        durationMs: {type: integer}
        checks:
          type: array
          description: Warnings recorded with the run, such as REPORT-0015 for PL-FUNC lines without a functional area (FR-15.14). A cash flow that does not reconcile fails the run with 422 REPORT-0008 or REPORT-0009 instead (BR-15.5).
          items: {$ref: '#/components/schemas/RunCheck'}
    RunCheck:
      type: object
      required: [code, severity, detail]
      properties:
        code: {type: string}
        severity: {type: string, enum: [warning]}
        detail: {type: string}
    Schedule:
      type: object
      required: [name, definition, cron, timezone, ledgerIds, formats, recipients, enabled]
      properties:
        code: {type: string, pattern: '^[A-Z][A-Z0-9-]{1,29}$', description: defaults to the path code}
        name: {type: string, minLength: 1, maxLength: 120}
        definition: {type: string, description: code of a definition with a published version; runs use the latest published version}
        cron: {type: string, description: 'five fields: minute hour day-of-month month day-of-week; *, n, a-b, lists and steps', example: '0 23 * * *'}
        timezone: {type: string, description: IANA time zone the cron is evaluated in, example: UTC}
        ledgerIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: uuid}
        currencyType: {type: string, enum: [txn, acct, rpt], default: acct}
        formats:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [pdf, xlsx, csv, html]}
        recipients:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: email}
        attachmentLimitMb: {type: integer, minimum: 1, maximum: 25, default: 20, description: larger outputs are sent as a link (FR-15.8)}
        enabled: {type: boolean}
        fiscalYearStartMonth: {type: integer, minimum: 1, maximum: 12, default: 1, description: 'Month the fiscal year starts. A firing runs for the calendar month before its fire time in the schedule time zone, placed in a calendar of monthly periods 1 to 12 (plus opening period 0) numbered by the calendar year in which the fiscal year ends; the ledger calendar of wave 14 replaces this'}
        updatedBy: {type: string, readOnly: true}
        nextRunAt: {type: string, format: date-time, readOnly: true, description: next firing in the schedule time zone; absent when disabled}
    ScheduleFiring:
      type: object
      required: [id, scheduleCode, ledgerId, fireTime, periodYear, periodNo, status, attempts, startedAt, finishedAt]
      properties:
        id: {type: string, format: uuid}
        scheduleCode: {type: string}
        ledgerId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid, description: Legal entity that owns the ledger; absent when the ledger is unknown}
        fireTime: {type: string, format: date-time, description: The cron time that fired}
        periodYear: {type: integer}
        periodNo: {type: integer}
        status: {type: string, enum: [completed, failed]}
        attempts: {type: integer, minimum: 1, maximum: 2}
        runId: {type: string, format: uuid, description: The statement run, when one was made}
        errorCode: {type: string, description: Problem code of the last attempt of a failed firing, for example REPORT-0004 for a stale read model}
        errorDetail: {type: string}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
    LibraryEntry:
      type: object
      required: [id, runId, scheduleCode, definitionCode, definitionVersion, ledgerId, periodYear, periodNo, currencyType, format, fileName, contentType, sizeBytes, sha256, retainUntil, createdAt]
      properties:
        id: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        scheduleCode: {type: string}
        definitionCode: {type: string}
        definitionVersion: {type: integer}
        ledgerId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid, description: Legal entity that owns the ledger; absent for a legacy ledger}
        periodYear: {type: integer}
        periodNo: {type: integer}
        currencyType: {type: string, enum: [txn, acct, rpt]}
        format: {type: string, enum: [csv, html, xlsx, pdf]}
        fileName: {type: string}
        contentType: {type: string}
        sizeBytes: {type: integer, format: int64}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        retainUntil: {type: string, format: date-time, description: The file is kept at least until then (REPORTING_RETENTION_CLOSED_YEARS)}
        createdAt: {type: string, format: date-time}
        onHold: {type: boolean, description: The entry's legal entity is under legal hold, so the file is kept past retainUntil}
    LegalHold:
      type: object
      required: [id, legalEntityId, reason, placedBy, placedAt, active, revision]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        reason: {type: string}
        placedBy: {type: string}
        placedAt: {type: string, format: date-time}
        active: {type: boolean, description: true while the hold is in force}
        releasedBy: {type: string}
        releasedAt: {type: string, format: date-time}
        releaseNote: {type: string}
        revision: {type: integer, description: Echoed in If-Match to release}
    LibrarySweep:
      type: object
      required: [id, legalEntityId, sweptAt, cutoff, deletedCount, deletedBytes, heldCount, actor]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        sweptAt: {type: string, format: date-time}
        cutoff: {type: string, format: date-time, description: Files retained until this time or earlier were eligible}
        deletedCount: {type: integer}
        deletedBytes: {type: integer, format: int64}
        heldCount: {type: integer, description: Past-retention files a legal hold kept}
        holdId: {type: string, format: uuid}
        actor: {type: string}
    RunSweep:
      type: object
      required: [id, legalEntityId, sweptAt, cutoff, retentionDays, deletedRuns, deletedCells, heldRuns, actor]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        sweptAt: {type: string, format: date-time}
        cutoff: {type: string, format: date-time, description: Ad-hoc runs that started before this time were eligible}
        retentionDays: {type: integer, description: The ad-hoc retention in days the pass applied}
        deletedRuns: {type: integer}
        deletedCells: {type: integer, format: int64}
        heldRuns: {type: integer, description: Past-retention runs a legal hold kept}
        holdId: {type: string, format: uuid}
        actor: {type: string}
    Cell:
      type: object
      properties:
        row: {type: string}
        column: {type: string}
        value: {$ref: '#/components/schemas/Decimal'}
        blank: {type: boolean}
        computed: {type: boolean, description: Calculation row or CALC column; no balance keys}
        note: {type: string, description: REPORT-0010 when a prior-year period is missing (BR-15.9)}
        keyCount: {type: integer}
    BalanceKey:
      type: object
      properties:
        ledgerId: {type: string}
        period: {type: string}
        account: {type: string}
        combination: {type: string}
        currencyType: {type: string}
        amount: {$ref: '#/components/schemas/Decimal'}
    DrillLine:
      type: object
      required: [key, ledgerId, postingDate, postingSequence, lineNumber, voucher, period, account, combination, currencyType, debit, credit, amount, closingEntry]
      properties:
        key: {type: integer, description: Position of the line's balance key in the drill level 1 list}
        ledgerId: {type: string, format: uuid, description: Ledger of the line; the lines of a consolidated column span the run's ledgers}
        postingDate: {type: string, format: date}
        postingSequence: {type: integer, format: int64}
        lineNumber: {type: integer}
        voucher: {type: string}
        period: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$'}
        account: {type: string}
        combination: {type: string}
        currencyType: {type: string, enum: [acct, rpt, txn]}
        debit: {$ref: '#/components/schemas/Decimal'}
        credit: {$ref: '#/components/schemas/Decimal'}
        amount: {$ref: '#/components/schemas/Decimal'}
        closingEntry: {type: boolean}
        sourceUri: {type: string, description: Passage route (/...) or http(s) URL of the source document}
        traceId: {type: string}
        traceUrl: {type: string, description: Trace viewer link when REPORTING_TRACE_URL is set}
    BalanceVerificationSummary:
      type: object
      required: [id, ledgerId, status, hwmBefore, hwmAfter, entriesPending, accountsCompared, diffCount, requestedBy, verifiedAt]
      properties:
        id: {type: string, format: uuid}
        ledgerId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        status:
          type: string
          enum: [matched, differs, inconclusive]
          description: >-
            matched - every account equal at a steady mark with nothing waiting; differs - at least one account
            differs at a steady mark with nothing waiting (this can still be an entry the consumer has not received);
            inconclusive - the read model's mark moved during the check, or entries waited ahead of it
        hwmBefore: {type: integer, format: int64, description: Read model high-water mark when the read model was read}
        hwmAfter: {type: integer, format: int64, description: Read model high-water mark after the ledger answered}
        entriesPending: {type: integer, description: Most entries seen waiting ahead of the mark before or after the ledger call}
        accountsCompared: {type: integer}
        diffCount: {type: integer, description: Accounts that differ (diffs holds at most 500)}
        requestedBy: {type: string}
        verifiedAt: {type: string, format: date-time}
    BalanceVerification:
      allOf:
        - $ref: '#/components/schemas/BalanceVerificationSummary'
        - type: object
          required: [diffs]
          properties:
            diffs:
              type: array
              description: The first 500 differing accounts by account; empty when diffsWithheld
              items:
                type: object
                required: [account, readModel, ledger, difference]
                properties:
                  account: {type: string}
                  readModel: {type: string, description: 'Net (debit minus credit) in the read model, six places'}
                  ledger: {type: string, description: 'Net in the ledger trial balance, six places'}
                  difference: {type: string, description: readModel minus ledger}
            diffsWithheld: {type: boolean, description: True when the caller lacks ledger.balance.read and the ledger amounts are not served}
    LagRow:
      type: object
      properties:
        ledgerId: {type: string, format: uuid}
        postingSequence: {type: integer, format: int64}
        updatedAt: {type: string, format: date-time}
        entriesApplied: {type: integer, format: int64, description: Journal entries the ledger consumer has applied for this ledger}
        entriesPending: {type: integer, format: int64, description: Journal entries that arrived ahead of the high-water mark and wait for an earlier entry; a count that stays above zero means an entry is missing}
        lagSeconds: {type: integer, format: int64, description: 'Age in seconds of the oldest entry waiting for an earlier one; 0 when none waits. A lower bound: entries the consumer has not received (consumer stopped or behind, an event lost with nothing after it) do not count'}
        hwmLedger: {type: integer, format: int64, description: Highest posting sequence seen for the ledger, applied or waiting}
    StandardDefinition:
      type: object
      required: [code, name, kind, rows, columns]
      properties:
        code: {type: string}
        name: {type: string}
        kind: {type: string}
        rows: {type: integer}
        columns: {type: integer}
    InstallResult:
      type: object
      required: [code, action]
      properties:
        code: {type: string}
        action: {type: string, enum: [installed, skipped]}
        version: {type: integer, description: published version, when installed}
        reason: {type: string, description: why the code was skipped}
    HierarchySummary:
      type: object
      required: [code, name, subject, strict, latestVersion, hasDraft, assignedCount, unassignedCount, updatedAt]
      properties:
        code: {type: string}
        name: {type: string}
        subject: {type: string, enum: [main_account_category, main_account, dimension_value]}
        strict: {type: boolean}
        latestVersion: {type: integer, description: 0 when never published}
        hasDraft: {type: boolean}
        assignedCount: {type: integer, description: members assigned in the latest published version}
        unassignedCount: {type: integer}
        updatedAt: {type: string, format: date-time}
    Hierarchy:
      type: object
      required: [code, name, subject, strict, nodes]
      properties:
        schemaVersion: {type: string, enum: ['1']}
        code: {type: string, pattern: '^[A-Z][A-Z0-9-]{1,29}$'}
        name: {type: string, maxLength: 120}
        version: {type: integer, description: 0 for drafts}
        status: {type: string, enum: [draft, published, retired]}
        subject: {type: string, enum: [main_account_category, main_account, dimension_value]}
        dimensionAttribute: {type: string, description: required only for dimension_value}
        strict: {type: boolean}
        effectiveFrom: {type: string, format: date}
        ownerUserId: {type: string, description: notified about unassigned members; defaults to the user who first saves the draft}
        nodes:
          type: array
          maxItems: 20000
          items: {$ref: '#/components/schemas/HierarchyNode'}
    HierarchyNode:
      type: object
      required: [code, label]
      properties:
        code: {type: string}
        label: {type: string}
        parent: {type: string, description: parent node code; empty for roots}
        rules:
          type: array
          description: membership rules, leaves only; a leaf matches a member when any rule matches
          items:
            type: object
            properties:
              attribute: {type: string, description: member attribute to test; empty tests the member key}
              from: {type: string, description: inclusive range start (text comparison)}
              to: {type: string}
              values: {type: array, items: {type: string}, description: exact values; a trailing * is a prefix wildcard}
    Member:
      type: object
      required: [id, key]
      properties:
        id: {type: string}
        key: {type: string, description: account number, category id or dimension value}
        attributes:
          type: object
          additionalProperties: {type: string}
    Membership:
      type: object
      required: [assigned, unassigned]
      properties:
        assigned:
          type: object
          description: member id to leaf node code
          additionalProperties: {type: string}
        unassigned:
          type: array
          items: {type: string}

    ShareLink:
      type: object
      required: [id, libraryId, status, createdBy, createdAt, expiresAt, downloadCount, revision]
      properties:
        id: {type: string, format: uuid}
        libraryId: {type: string, format: uuid, description: The report library file the link opens}
        legalEntityId: {type: string, format: uuid, description: Legal entity of the file; absent when it has none}
        status: {type: string, enum: [active, expired, revoked], description: Derived from the expiry and the revocation}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, description: When the link stops working; never later than the file's retention date}
        revokedBy: {type: string}
        revokedAt: {type: string, format: date-time}
        downloadCount: {type: integer, description: Downloads served through the link}
        lastDownloadedAt: {type: string, format: date-time}
        revision: {type: integer, description: Echoed in If-Match to revoke the link}
        token: {type: string, description: The secret token; present only in the response that creates the link}
        path:  {type: string, description: 'Download path with the token (/v1/reporting/shared/{token}); present only in the response that creates the link'}
    AuditKind:
      type: string
      description: >-
        Ledger kinds (PRD AuditTrailEntry) then the reporting service's own kinds.
      enum: [posted, replayed, reversed, batch_submitted, batch_approved, batch_rejected, period_changed, reopen_approved,
        rate_override, tax_fallback, allocation_run, year_end_run, rebuild,
        statement_run, definition_published, definition_retired, hierarchy_published, schedule_saved, audit_exported, legal_hold_placed, legal_hold_released, library_swept, runs_swept, share_link_created, share_link_revoked]
    AuditEntry:
      type: object
      required: [id, occurredAt, kind, actorId, objectRef, details]
      properties:
        id: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        ledgerId: {type: string, format: uuid, description: Absent for changes to reporting objects}
        period: {type: string, description: Fiscal year and period number, such as 2026-03}
        kind: {$ref: '#/components/schemas/AuditKind'}
        actorId: {type: string}
        objectRef: {type: string, description: 'What the entry concerns, such as run:<id>, definition:BS-STD@2 or period:2026-03'}
        details: {type: object, additionalProperties: true}
        traceId: {type: string}
        traceUrl: {type: string, format: uri, description: Trace viewer link (REPORTING_TRACE_URL); absent when not configured}
