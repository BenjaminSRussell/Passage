openapi: 3.1.0
info:
  title: Passage Financial Reporting API
  version: 1.0.0
  description: Report definitions, standard statements, derived hierarchies, statement runs and drill-down, CSV, HTML and XLSX outputs and distribution schedules (PSG-15, wave 15 slices 1-4).
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
security:
  - bearerAuth: []
paths:
  /v1/reporting/definitions:
    get:
      operationId: listDefinitions
      summary: One summary per definition code (designer list)
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: Definition summaries ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/DefinitionSummary'}
  /v1/reporting/definitions/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      operationId: getDefinition
      summary: Read a definition (draft, latest published, or an exact version)
      x-passage-duty: reporting.statement.view
      parameters:
        - name: version
          in: query
          required: false
          schema:
            type: string
            description: draft, latest (default) or a positive published version number
      responses:
        '200':
          description: The definition
          headers:
            ETag:
              description: Draft revision (drafts only)
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Definition'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: putDraft
      summary: Create or replace the draft of a definition (idempotent)
      x-passage-duty: reporting.definition.maintain
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Required when a draft exists; the ETag last read. Missing gives 428, stale gives 412 conflict_version.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Definition'}
      responses:
        '200':
          description: Saved draft
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Definition'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/reporting/definitions/{code}/export:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      operationId: exportDefinition
      summary: Export the latest published version as schema-versioned JSON (FR-15.11)
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: Definition JSON
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Definition'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/definitions/import:
    post:
      operationId: importDefinition
      summary: Import an exported definition as a draft (FR-15.11)
      x-passage-duty: reporting.definition.maintain
      description: >-
        A code that already has a draft or a published version is refused with
        REPORT-0011 unless overwrite=true. An optional Idempotency-Key replays
        the stored result (200); the same key with a different request is
        refused with idempotency_key_reuse.
      parameters:
        - name: overwrite
          in: query
          required: false
          schema: {type: boolean, default: false}
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Definition'}
      responses:
        '201':
          description: Imported draft
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Definition'}
        '200':
          description: Replay of an earlier import with the same Idempotency-Key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Definition'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/reporting/definitions/{code}:publish:
    parameters:
      - $ref: '#/components/parameters/Code'
    post:
      operationId: publishDefinition
      summary: Publish the draft as the next immutable version (BR-15.8)
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: Published definition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Definition'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/reporting/definitions/{code}:validate:
    parameters:
      - $ref: '#/components/parameters/Code'
    post:
      operationId: validateDefinition
      summary: Validate a definition's shape, expressions and references (stateless)
      x-passage-duty: reporting.definition.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Definition'}
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                required: [valid, issues]
                properties:
                  valid: {type: boolean}
                  issues:
                    type: array
                    items: {$ref: '#/components/schemas/Issue'}
  /v1/reporting/runs:
    get:
      operationId: listRuns
      summary: Report library - newest runs first
      x-passage-duty: reporting.statement.view
      parameters:
        - name: definition
          in: query
          required: false
          description: Only runs of this definition code
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 200}
      responses:
        '200':
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Run'}
        '400': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createRun
      summary: Run a published definition over the reporting read model (FR-15.6)
      x-passage-duty: reporting.statement.run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunRequest'}
      responses:
        '201':
          description: Completed run
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '200':
          description: Replay - the run stored for this Idempotency-Key and the same request
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409':
          description: idempotency_key_in_flight - the same key is being processed; retry
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/reporting/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRun
      summary: Read a run
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/runs/{id}/definition:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRunDefinition
      summary: The definition a run was evaluated with
      description: >-
        The published definition version of an ordinary run. For a run over a hierarchy
        (POST /runs with hierarchy) the expanded definition that was evaluated: one row per
        hierarchy node, an Unassigned row and a grand total. It never changes after the run.
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: The definition with its rows and columns
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Definition'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/runs/{id}/cells:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: listCells
      summary: All cells of a run
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: Cells in evaluation order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Cell'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/runs/{id}/cells/{row}/{column}/balances:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: row
        in: path
        required: true
        schema: {type: string}
      - name: column
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: drillBalances
      summary: Drill level 1 - balance keys whose sum equals the cell value (BR-15.4)
      description: >-
        Computed cells (calculation rows and CALC columns) answer computed=true
        with no keys; drill into the cells they reference. A key sum that
        differs from the cell value is an invariant failure (500 REPORT-0099)
        and is never served.
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: Balance keys and their sum
          content:
            application/json:
              schema:
                type: object
                required: [runId, row, column, value, blank, computed, sumOfKeys, keys]
                properties:
                  runId: {type: string, format: uuid}
                  row: {type: string}
                  column: {type: string}
                  value: {$ref: '#/components/schemas/Decimal'}
                  blank: {type: boolean}
                  computed: {type: boolean}
                  sumOfKeys: {$ref: '#/components/schemas/Decimal'}
                  keys:
                    type: array
                    items: {$ref: '#/components/schemas/BalanceKey'}
        '404': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /v1/reporting/runs/{id}/cells/{row}/{column}/lines:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: row
        in: path
        required: true
        schema: {type: string}
      - name: column
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: drillLines
      summary: Drill level 2 - journal lines behind a cell or one of its balance keys (FR-15.7, BR-15.4)
      description: >-
        Lines of the cell's balances at the run's high-water mark, closing
        entries left out for income statements and cash flows, ordered by
        (postingDate, postingSequence, lineNumber, key) and keyset paged.
        amount is the line as the cell shows it (credit keys show -net). Every
        page carries sumOfLines (this page), cumulativeSum (through this page;
        on the final page it equals linesTotal) and the reconciliation of all
        the lines against the balance keys: reconciled is false, with the
        difference, when the read model is missing lines - never hidden.
        Computed cells answer computed=true with no lines.
      x-passage-duty: ledger.journal.read
      parameters:
        - name: key
          in: query
          required: false
          description: Position of one balance key in the drill level 1 list; omitted means the whole cell
          schema: {type: integer, minimum: 0}
        - name: cursor
          in: query
          required: false
          description: nextCursor of the previous page
          schema: {type: string}
        - name: limit
          in: query
          required: false
          description: Lines per page, 1 to 1000; default REPORTING_PAGE_SIZE (500)
          schema: {type: integer, minimum: 1, maximum: 1000}
      responses:
        '200':
          description: One page of lines with page and running sums and the reconciliation
          content:
            application/json:
              schema:
                type: object
                required: [runId, row, column, key, blank, computed, value, hwm, limit, items, sumOfLines, cumulativeSum, nextCursor,
                  linesTotal, difference, unreconciledKeys, reconciled]
                properties:
                  runId: {type: string, format: uuid}
                  row: {type: string}
                  column: {type: string}
                  key: {type: [integer, 'null'], description: The selected balance key, null for the whole cell}
                  blank: {type: boolean}
                  computed: {type: boolean}
                  value: {$ref: '#/components/schemas/Decimal'}
                  hwm: {type: integer, format: int64, description: Posting sequence the run reflects; later lines are not listed}
                  limit: {type: integer}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/DrillLine'}
                  sumOfLines: {$ref: '#/components/schemas/Decimal'}
                  cumulativeSum: {$ref: '#/components/schemas/Decimal'}
                  nextCursor: {type: [string, 'null']}
                  linesTotal: {$ref: '#/components/schemas/Decimal'}
                  difference: {$ref: '#/components/schemas/Decimal'}
                  unreconciledKeys: {type: integer}
                  reconciled: {type: boolean}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/runs/{id}/outputs/{format}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: format
        in: path
        required: true
        schema: {type: string, enum: [csv, pdf, xlsx, html]}
    get:
      operationId: getRunOutput
      summary: The run rendered as a file (FR-15.6)
      description: >-
        Rendered from the stored cells and the definition version of the run, so
        the same run always gives the same bytes. Every format carries the same
        content: a header (statement, definition version, ledger, period,
        currency type), the grid (exact six-place amounts, "n/a" for a missing
        prior-year period) and the "as of" footer (posting sequence per ledger,
        result hash, generated at and by, run id). csv prefixes text a
        spreadsheet would read as a formula with an apostrophe; html is one
        self-contained document without scripts; xlsx is a workbook with one
        sheet, Statement, with amounts as numbers and text as inline strings.
        pdf is not rendered yet and answers 404 COM-0404.
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition:
              description: attachment; filename="<definition code>-<run id>.<format>"
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
            text/html:
              schema: {type: string}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/Problem'}
        '500':
          description: REPORT-0016, the renderer failed for this format; other formats are unaffected
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/reporting/lag:
    get:
      operationId: getLag
      summary: Read-model high-water mark per ledger (FR-15.1)
      x-passage-duty: reporting.statement.view
      responses:
        '200':
          description: Lag rows
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/LagRow'}
  /v1/reporting/definitions/{code}:retire:
    parameters:
      - $ref: '#/components/parameters/Code'
    post:
      operationId: retireDefinition
      summary: Retire every published version (BR-15.8). Runs can no longer use the code; its versions and past runs stay readable and an open draft is kept. Repeating the call on a retired code succeeds with retiredVersions 0.
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: Retired
          content:
            application/json:
              schema:
                type: object
                required: [code, status, retiredVersions]
                properties:
                  code: {type: string}
                  status: {type: string, enum: [retired]}
                  retiredVersions: {type: integer, description: published versions retired by this call}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/standard-definitions:
    get:
      operationId: listStandardDefinitions
      summary: The statutory definitions the service ships (TB-STD, BS-STD, PL-STD, PL-FUNC; FR-15.5, FR-15.14)
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: Shipped definitions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/StandardDefinition'}
  /v1/reporting/standard-definitions:install:
    post:
      operationId: installStandardDefinitions
      summary: Publish, as version 1 and in one transaction, every shipped definition whose code the tenant does not use yet. Codes with any draft, published or retired version are skipped, so repeating the call is safe.
      x-passage-duty: reporting.definition.maintain
      responses:
        '200':
          description: Per-code result
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/InstallResult'}
  /v1/reporting/hierarchies:
    get:
      operationId: listHierarchies
      summary: One summary per derived hierarchy code (FR-15.13)
      description: >-
        Maintainers see every code, drafts included. A caller with reporting.statement.run
        and without reporting.definition.maintain (a statement runner picking the rows of a
        run, FR-15.4) sees only codes with a published version, and hasDraft is always false.
      x-passage-duty: reporting.definition.maintain or reporting.statement.run
      responses:
        '200':
          description: Hierarchy summaries ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/HierarchySummary'}
  /v1/reporting/hierarchies/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      operationId: getHierarchy
      summary: Read a derived hierarchy (draft, latest published or an exact version) (FR-15.13)
      x-passage-duty: reporting.definition.maintain
      parameters:
        - name: version
          in: query
          required: false
          schema: {type: string, description: draft, latest (default) or a positive version}
      responses:
        '200':
          description: The hierarchy
          headers:
            ETag:
              description: Draft revision (drafts only)
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Hierarchy'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: putHierarchy
      summary: Create or replace the draft hierarchy (idempotent). The body is the JSON a GET returns, so this is also the import path. Omitted strict defaults to true for account and category hierarchies.
      x-passage-duty: reporting.definition.maintain
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Required when a draft exists; the ETag last read. Missing gives 428, stale gives 412 conflict_version.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Hierarchy'}
      responses:
        '200':
          description: Saved draft
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Hierarchy'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/reporting/hierarchies/{code}:publish:
    parameters:
      - $ref: '#/components/parameters/Code'
    post:
      operationId: publishHierarchy
      summary: Publish the draft as the next version and materialize its membership over the supplied members. Refuses overlapping members (REPORT-0014) and, for strict hierarchies, unassigned members (REPORT-0013); a non-strict publish emits hierarchy.unassigned.v1 per unassigned member.
      x-passage-duty: reporting.definition.maintain
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                members:
                  type: array
                  items: {$ref: '#/components/schemas/Member'}
      responses:
        '200':
          description: Published hierarchy and its membership
          content:
            application/json:
              schema:
                type: object
                properties:
                  hierarchy: {$ref: '#/components/schemas/Hierarchy'}
                  membership: {$ref: '#/components/schemas/Membership'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/reporting/hierarchies/{code}/members:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      operationId: getHierarchyMembers
      summary: Materialized membership of a published version (latest by default)
      x-passage-duty: reporting.definition.maintain
      parameters:
        - name: version
          in: query
          required: false
          schema: {type: string, description: latest (default) or a positive published version}
      responses:
        '200':
          description: Membership of the version
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Membership'
                  - type: object
                    required: [version]
                    properties:
                      version: {type: integer}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reporting/schedules:
    get:
      operationId: listSchedules
      summary: Distribution schedules ordered by code (FR-15.8)
      x-passage-duty: reporting.statement.schedule
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Schedule'}
  /v1/reporting/schedules/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      operationId: getSchedule
      summary: Read a distribution schedule
      x-passage-duty: reporting.statement.schedule
      responses:
        '200':
          description: The schedule
          headers:
            ETag:
              description: Schedule revision, echoed in If-Match to replace it
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: putSchedule
      summary: Create or replace a distribution schedule (idempotent)
      description: >-
        The definition must have a published version (REPORT-0001). Field
        errors answer 422 REPORT-0018. Omitted attachmentLimitMb defaults to
        20 and currencyType to acct; recipients are lower-cased. nextRunAt and
        updatedBy are read-only and ignored when sent.
      x-passage-duty: reporting.statement.schedule
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Required when the schedule exists; the ETag last read. Missing gives 428, stale gives 412 conflict_version.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Schedule'}
      responses:
        '200':
          description: Saved schedule
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/reporting/audit-trail:
    get:
      operationId: listAuditTrail
      summary: Audit trail report (FR-15.10)
      description: >-
        Who posted, approved, reversed, reopened or overrode what, and who ran,
        published, retired or scheduled reporting objects, oldest first and
        keyset paged by (occurredAt, id). The range is always narrowed: name a
        period, or both from and to at most 366 days apart; otherwise 400
        COM-0002. Ledger kinds come from other services' events (later slice);
        reporting kinds are written with the change they record.
      x-passage-duty: reporting.audit.view
      parameters:
        - $ref: '#/components/parameters/AuditLedger'
        - $ref: '#/components/parameters/AuditPeriod'
        - $ref: '#/components/parameters/AuditKind'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - name: cursor
          in: query
          required: false
          description: nextCursor of the previous page
          schema: {type: string}
        - name: limit
          in: query
          required: false
          description: Entries per page, 1 to 1000; default 100
          schema: {type: integer, minimum: 1, maximum: 1000}
      responses:
        '200':
          description: One page of audit entries
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, nextCursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEntry'}
                  limit: {type: integer}
                  nextCursor: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/reporting/audit-trail:export:
    get:
      operationId: exportAuditTrail
      summary: Audit trail as a CSV file with its SHA-256 (FR-15.10)
      description: >-
        Every entry matching the filter (same rules as the list), oldest first,
        as CSV with the columns occurred_at, kind, ledger_id, period, actor_id,
        object_ref, details (JSON, sorted keys), trace_id. Text a spreadsheet
        would read as a formula is prefixed with an apostrophe. The export is
        recorded in the trail (kind audit_exported, with the filter, entry
        count and digest) under the export id. More than 50,000 matching
        entries is refused with 422 REPORT-0030 rather than cut short. PDF is a
        later slice.
      x-passage-duty: reporting.audit.view
      parameters:
        - $ref: '#/components/parameters/AuditLedger'
        - $ref: '#/components/parameters/AuditPeriod'
        - $ref: '#/components/parameters/AuditKind'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          description: The CSV file
          headers:
            Content-Disposition:
              description: attachment; filename="audit-trail-<export id>.csv"
              schema: {type: string}
            X-Passage-Export-Id:
              description: Id of the audit_exported entry that records this export
              schema: {type: string, format: uuid}
            X-Passage-Export-Sha256:
              description: Hex SHA-256 of the response body
              schema: {type: string, pattern: '^[0-9a-f]{64}$'}
            X-Passage-Export-Entries:
              description: Number of entries in the file
              schema: {type: integer}
          content:
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AuditLedger:
      name: ledger
      in: query
      required: false
      description: Ledger id
      schema: {type: string, format: uuid}
    AuditPeriod:
      name: period
      in: query
      required: false
      description: Fiscal year and period number, such as 2026-03 (2026-00 is the opening period)
      schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2,3}$'}
    AuditKind:
      name: kind
      in: query
      required: false
      schema: {$ref: '#/components/schemas/AuditKind'}
    AuditActor:
      name: actor
      in: query
      required: false
      description: User id of the actor
      schema: {type: string}
    AuditFrom:
      name: from
      in: query
      required: false
      description: Inclusive start, RFC 3339
      schema: {type: string, format: date-time}
    AuditTo:
      name: to
      in: query
      required: false
      description: Exclusive end, RFC 3339; at most 366 days after from
      schema: {type: string, format: date-time}
    Code:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9-]{1,29}$'
    RunId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 255}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Decimal:
      type: string
      description: Decimal string, never a float
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri, example: 'https://passage.dev/problems/REPORT-0001'}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        traceId: {type: string}
    Issue:
      type: object
      required: [field, code, detail]
      properties:
        field: {type: string}
        code: {type: string}
        detail: {type: string}
    DefinitionSummary:
      type: object
      required: [code, name, kind, status, latestVersion, hasDraft, updatedAt]
      properties:
        code: {type: string}
        name: {type: string}
        kind: {type: string, enum: [trial_balance, balance_sheet, income_statement, cash_flow, custom]}
        status: {type: string, enum: [draft, published, retired], description: published when a version can run, retired when every version was retired, draft otherwise}
        latestVersion: {type: integer, description: newest published version, 0 when none}
        hasDraft: {type: boolean}
        updatedAt: {type: string, format: date-time}
    Definition:
      type: object
      required: [code, name, kind, rows, columns]
      properties:
        schemaVersion: {type: string, enum: ['1']}
        code: {type: string, pattern: '^[A-Z][A-Z0-9-]{1,29}$'}
        name: {type: string, maxLength: 120}
        version: {type: integer, description: 0 for drafts}
        status: {type: string, enum: [draft, published, retired]}
        kind: {type: string, enum: [trial_balance, balance_sheet, income_statement, cash_flow, custom]}
        includeAdjustmentPeriods: {type: boolean}
        rows:
          type: array
          maxItems: 2000
          items: {$ref: '#/components/schemas/Row'}
        columns:
          type: array
          maxItems: 60
          items: {$ref: '#/components/schemas/Column'}
    Row:
      type: object
      required: [code, kind, label, normalBalance]
      properties:
        code: {type: string}
        kind: {type: string, enum: [header, account_range, dimension_filter, total, calculation]}
        label: {type: string}
        accountFrom: {type: string}
        accountTo: {type: string}
        accounts:
          type: array
          maxItems: 20000
          items: {type: string}
          description: An explicit account list for account_range rows, instead of or together with the range (hierarchy runs write it)
        dimensionFilter:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        references: {type: array, items: {type: string}}
        expression: {type: string, description: 'Calculation over row codes; prefix raw: to use stored net instead of displayed values (BR-15.3)'}
        normalBalance: {type: string, enum: [debit, credit]}
        cashFlowTag: {type: string, enum: ['', operating_adjustment, working_capital, investing, financing, cash]}
        format:
          type: object
          properties:
            bold: {type: boolean}
            indent: {type: integer}
            printZero: {type: boolean}
            pageBreak: {type: boolean}
    Column:
      type: object
      required: [code, label, periodExpr]
      properties:
        code: {type: string}
        label: {type: string}
        periodExpr: {type: string, pattern: '^(P|P-[0-9]+|YTD|PY|PYTD|Q|FY|CALC)$'}
        currencyType: {type: string, enum: [acct, rpt, txn], description: Omitted means the run's currency type}
        calcExpression: {type: string}
    RunRequest:
      type: object
      required: [definition, ledgerId, currencyType, period, calendar]
      properties:
        definition: {type: string}
        definitionVersion: {type: integer, minimum: 0, description: 0 or omitted means the latest published version}
        ledgerId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid, description: "Assertion only: the run is owned by the legal entity of the ledger's reporting rows. A different value is refused with 422 REPORT-0032."}
        currencyType: {type: string, enum: [acct, rpt, txn]}
        period: {$ref: '#/components/schemas/Period'}
        calendar:
          type: array
          description: The ledger's fiscal periods, used to place balances in columns. Replaced by the ledger calendar in a later slice.
          items: {$ref: '#/components/schemas/Period'}
        includeAdjustmentPeriods: {type: boolean, description: Counts adjustment periods in P-n, YTD, Q and FY even when the definition does not}
        hierarchy: {$ref: '#/components/schemas/HierarchyRun'}
    HierarchyRun:
      type: object
      required: [code]
      description: >-
        Takes the rows of the run from a published main account or dimension value hierarchy.
        The definition keeps supplying the columns and the kind (a cash flow cannot be used,
        REPORT-0033). One row per node with members in the ledger, depth first; parents total
        their children; members no node claims go to an Unassigned row (REPORT-0034 warning);
        a Total row closes the statement. Members that match no stored membership are placed by
        the rules on their key; two matching leaves fail the run with REPORT-0014.
      properties:
        code: {type: string, description: Hierarchy code}
        version: {type: integer, minimum: 0, description: 0 or omitted means the latest published version}
        normalBalance: {type: string, enum: [debit, credit], description: How amounts are presented; debit when omitted}
        accountFrom: {type: string, description: Dimension hierarchies only; with accountTo, limits the rows to this account range}
        accountTo: {type: string}
    Period:
      type: object
      required: [year, no, quarter]
      properties:
        year: {type: integer, minimum: 1}
        no: {type: integer, minimum: 0, description: 0 is the opening period that carries brought-forward balances}
        quarter: {type: integer, minimum: 1, maximum: 4}
        adjustment: {type: boolean}
    Run:
      type: object
      properties:
        id: {type: string, format: uuid}
        definitionCode: {type: string}
        definitionVersion: {type: integer}
        ledgerId: {type: string, format: uuid}
        currencyType: {type: string}
        periodYear: {type: integer}
        periodNo: {type: integer}
        status: {type: string, enum: [queued, running, completed, failed]}
        hwmByLedger:
          type: object
          additionalProperties: {type: integer}
        resultHash: {type: string, description: SHA-256 hex over cells}
        hierarchy:
          type: object
          description: Present when the rows of the run are the nodes of a hierarchy
          properties:
            code: {type: string}
            version: {type: integer}
        cellCount: {type: integer}
        requestedBy: {type: string}
        startedAt: {type: string, format: date-time}
        durationMs: {type: integer}
        checks:
          type: array
          description: Warnings recorded with the run, such as REPORT-0015 for PL-FUNC lines without a functional area (FR-15.14). A cash flow that does not reconcile fails the run with 422 REPORT-0008 or REPORT-0009 instead (BR-15.5).
          items: {$ref: '#/components/schemas/RunCheck'}
    RunCheck:
      type: object
      required: [code, severity, detail]
      properties:
        code: {type: string}
        severity: {type: string, enum: [warning]}
        detail: {type: string}
    Schedule:
      type: object
      required: [name, definition, cron, timezone, ledgerIds, formats, recipients, enabled]
      properties:
        code: {type: string, pattern: '^[A-Z][A-Z0-9-]{1,29}$', description: defaults to the path code}
        name: {type: string, minLength: 1, maxLength: 120}
        definition: {type: string, description: code of a definition with a published version; runs use the latest published version}
        cron: {type: string, description: 'five fields: minute hour day-of-month month day-of-week; *, n, a-b, lists and steps', example: '0 23 * * *'}
        timezone: {type: string, description: IANA time zone the cron is evaluated in, example: UTC}
        ledgerIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: uuid}
        currencyType: {type: string, enum: [txn, acct, rpt], default: acct}
        formats:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [pdf, xlsx, csv, html]}
        recipients:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: email}
        attachmentLimitMb: {type: integer, minimum: 1, maximum: 25, default: 20, description: larger outputs are sent as a link (FR-15.8)}
        enabled: {type: boolean}
        updatedBy: {type: string, readOnly: true}
        nextRunAt: {type: string, format: date-time, readOnly: true, description: next firing in the schedule time zone; absent when disabled}
    Cell:
      type: object
      properties:
        row: {type: string}
        column: {type: string}
        value: {$ref: '#/components/schemas/Decimal'}
        blank: {type: boolean}
        computed: {type: boolean, description: Calculation row or CALC column; no balance keys}
        note: {type: string, description: REPORT-0010 when a prior-year period is missing (BR-15.9)}
        keyCount: {type: integer}
    BalanceKey:
      type: object
      properties:
        ledgerId: {type: string}
        period: {type: string}
        account: {type: string}
        combination: {type: string}
        currencyType: {type: string}
        amount: {$ref: '#/components/schemas/Decimal'}
    DrillLine:
      type: object
      required: [key, postingDate, postingSequence, lineNumber, voucher, period, account, combination, currencyType, debit, credit, amount, closingEntry]
      properties:
        key: {type: integer, description: Position of the line's balance key in the drill level 1 list}
        postingDate: {type: string, format: date}
        postingSequence: {type: integer, format: int64}
        lineNumber: {type: integer}
        voucher: {type: string}
        period: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$'}
        account: {type: string}
        combination: {type: string}
        currencyType: {type: string, enum: [acct, rpt, txn]}
        debit: {$ref: '#/components/schemas/Decimal'}
        credit: {$ref: '#/components/schemas/Decimal'}
        amount: {$ref: '#/components/schemas/Decimal'}
        closingEntry: {type: boolean}
        sourceUri: {type: string, description: Passage route (/...) or http(s) URL of the source document}
        traceId: {type: string}
        traceUrl: {type: string, description: Trace viewer link when REPORTING_TRACE_URL is set}
    LagRow:
      type: object
      properties:
        ledgerId: {type: string, format: uuid}
        postingSequence: {type: integer, format: int64}
        updatedAt: {type: string, format: date-time}
    StandardDefinition:
      type: object
      required: [code, name, kind, rows, columns]
      properties:
        code: {type: string}
        name: {type: string}
        kind: {type: string}
        rows: {type: integer}
        columns: {type: integer}
    InstallResult:
      type: object
      required: [code, action]
      properties:
        code: {type: string}
        action: {type: string, enum: [installed, skipped]}
        version: {type: integer, description: published version, when installed}
        reason: {type: string, description: why the code was skipped}
    HierarchySummary:
      type: object
      required: [code, name, subject, strict, latestVersion, hasDraft, assignedCount, unassignedCount, updatedAt]
      properties:
        code: {type: string}
        name: {type: string}
        subject: {type: string, enum: [main_account_category, main_account, dimension_value]}
        strict: {type: boolean}
        latestVersion: {type: integer, description: 0 when never published}
        hasDraft: {type: boolean}
        assignedCount: {type: integer, description: members assigned in the latest published version}
        unassignedCount: {type: integer}
        updatedAt: {type: string, format: date-time}
    Hierarchy:
      type: object
      required: [code, name, subject, strict, nodes]
      properties:
        schemaVersion: {type: string, enum: ['1']}
        code: {type: string, pattern: '^[A-Z][A-Z0-9-]{1,29}$'}
        name: {type: string, maxLength: 120}
        version: {type: integer, description: 0 for drafts}
        status: {type: string, enum: [draft, published, retired]}
        subject: {type: string, enum: [main_account_category, main_account, dimension_value]}
        dimensionAttribute: {type: string, description: required only for dimension_value}
        strict: {type: boolean}
        effectiveFrom: {type: string, format: date}
        ownerUserId: {type: string, description: notified about unassigned members; defaults to the user who first saves the draft}
        nodes:
          type: array
          maxItems: 20000
          items: {$ref: '#/components/schemas/HierarchyNode'}
    HierarchyNode:
      type: object
      required: [code, label]
      properties:
        code: {type: string}
        label: {type: string}
        parent: {type: string, description: parent node code; empty for roots}
        rules:
          type: array
          description: membership rules, leaves only; a leaf matches a member when any rule matches
          items:
            type: object
            properties:
              attribute: {type: string, description: member attribute to test; empty tests the member key}
              from: {type: string, description: inclusive range start (text comparison)}
              to: {type: string}
              values: {type: array, items: {type: string}, description: exact values; a trailing * is a prefix wildcard}
    Member:
      type: object
      required: [id, key]
      properties:
        id: {type: string}
        key: {type: string, description: account number, category id or dimension value}
        attributes:
          type: object
          additionalProperties: {type: string}
    Membership:
      type: object
      required: [assigned, unassigned]
      properties:
        assigned:
          type: object
          description: member id to leaf node code
          additionalProperties: {type: string}
        unassigned:
          type: array
          items: {type: string}

    AuditKind:
      type: string
      description: >-
        Ledger kinds (PRD AuditTrailEntry) then the reporting service's own kinds.
      enum: [posted, replayed, reversed, batch_submitted, batch_approved, batch_rejected, period_changed, reopen_approved,
        rate_override, tax_fallback, allocation_run, year_end_run, rebuild,
        statement_run, definition_published, definition_retired, hierarchy_published, schedule_saved, audit_exported]
    AuditEntry:
      type: object
      required: [id, occurredAt, kind, actorId, objectRef, details]
      properties:
        id: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        ledgerId: {type: string, format: uuid, description: Absent for changes to reporting objects}
        period: {type: string, description: Fiscal year and period number, such as 2026-03}
        kind: {$ref: '#/components/schemas/AuditKind'}
        actorId: {type: string}
        objectRef: {type: string, description: 'What the entry concerns, such as run:<id>, definition:BS-STD@2 or period:2026-03'}
        details: {type: object, additionalProperties: true}
        traceId: {type: string}
        traceUrl: {type: string, format: uri, description: Trace viewer link (REPORTING_TRACE_URL); absent when not configured}
