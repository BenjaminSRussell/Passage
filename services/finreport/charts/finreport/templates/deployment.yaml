apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: finreport
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: finreport
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finreport
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finreport
          image: {{ if .Values.image.digest }}{{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}{{ else }}{{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default "latest") | quote }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            - name: REPORTING_MAX_LAG_S
              value: {{ .Values.reporting.maxLagSeconds | quote }}
            - name: REPORTING_CELL_KEY_LIMIT
              value: {{ .Values.reporting.cellKeyLimit | quote }}
            - name: REPORTING_PAGE_SIZE
              value: {{ .Values.reporting.pageSize | quote }}
            - name: REPORTING_RETENTION_CLOSED_YEARS
              value: {{ .Values.reporting.retentionClosedYears | quote }}
            - name: REPORTING_RETENTION_ADHOC_DAYS
              value: {{ .Values.reporting.retentionAdhocDays | quote }}
            - name: REPORTING_EMAIL_ATTACHMENT_LIMIT_MB
              value: {{ .Values.reporting.attachmentLimitMb | quote }}
            - name: REPORTING_SHARE_LINK_EXPIRY_DAYS
              value: {{ .Values.reporting.shareLinkExpiryDays | quote }}
            - name: REPORTING_PDF_CONCURRENCY_PER_POD
              value: {{ .Values.reporting.pdfConcurrencyPerPod | quote }}
            - name: REPORTING_OPA_CACHE_SECONDS
              value: {{ .Values.reporting.opaCacheSeconds | quote }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
