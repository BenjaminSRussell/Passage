{{- if .Values.statementSchedules.enabled }}
{{- if not .Values.statementSchedules.tenantIds }}
{{- fail "statementSchedules.tenantIds must list at least one tenant UUID when statementSchedules.enabled is true" }}
{{- end }}
# FR-15.8 statement schedules: `finreport fire-schedules` runs the distribution
# schedules that came due, stores the files in the report library and writes
# dev.passage.reporting.distribution.sent.v1 per file (statement.failed.v1 for a
# failed firing). It runs in process against the database (no route, no service
# call, no signing key).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-statement-schedules
  labels:
    app.kubernetes.io/name: finreport
    app.kubernetes.io/component: statement-schedules
spec:
  schedule: {{ .Values.statementSchedules.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 280
      template:
        metadata:
          labels:
            app.kubernetes.io/name: finreport
            app.kubernetes.io/component: statement-schedules
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: finreport-statement-schedules
              image: {{ if .Values.image.digest }}{{ printf "%s@%s" (include "passage.imageRepository" $) .Values.image.digest | quote }}{{ else }}{{ printf "%s:%s" (include "passage.imageRepository" $) (.Values.image.tag | default "latest") | quote }}{{ end }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - fire-schedules
                {{- range .Values.statementSchedules.tenantIds }}
                - {{ . | quote }}
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                {{- include "passage.cloudEnv" $ | nindent 16 }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.databaseSecret }}
                      key: DATABASE_URL
                - name: REPORTING_MAX_LAG_S
                  value: {{ .Values.reporting.maxLagSeconds | quote }}
                - name: REPORTING_RETENTION_CLOSED_YEARS
                  value: {{ .Values.reporting.retentionClosedYears | quote }}
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
{{- end }}
