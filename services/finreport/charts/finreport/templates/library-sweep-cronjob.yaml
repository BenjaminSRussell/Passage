{{- if .Values.librarySweep.enabled }}
{{- if not .Values.librarySweep.tenantIds }}
{{- fail "librarySweep.tenantIds must list at least one tenant UUID when librarySweep.enabled is true" }}
{{- end }}
# FR-15.8 library retention (PRD job `library-retention-sweep`): `finreport
# sweep-library` deletes the report library files past their retention date,
# entity by entity, except for entities under legal hold, and writes
# dev.passage.reporting.library.swept.v1 per entity pass. It runs in process
# against the database (no route, no service call, no signing key).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-library-sweep
  labels:
    app.kubernetes.io/name: finreport
    app.kubernetes.io/component: library-sweep
spec:
  schedule: {{ .Values.librarySweep.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: finreport
            app.kubernetes.io/component: library-sweep
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: finreport-library-sweep
              image: {{ if .Values.image.digest }}{{ printf "%s@%s" (include "passage.imageRepository" $) .Values.image.digest | quote }}{{ else }}{{ printf "%s:%s" (include "passage.imageRepository" $) (.Values.image.tag | default "latest") | quote }}{{ end }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - sweep-library
                {{- range .Values.librarySweep.tenantIds }}
                - {{ . | quote }}
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                {{- include "passage.cloudEnv" $ | nindent 16 }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.databaseSecret }}
                      key: DATABASE_URL
                - name: REPORTING_RETENTION_ADHOC_DAYS
                  value: {{ .Values.reporting.retentionAdhocDays | quote }}
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
{{- end }}
