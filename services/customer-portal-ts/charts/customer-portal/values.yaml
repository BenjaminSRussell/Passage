image: { repository: ghcr.io/benjaminsrussell/passage-customer-portal, digest: "", tag: "", pullPolicy: IfNotPresent }
# One replica: sessions and the rate limiter are in memory (NOT-IMPLEMENTED.md). A second replica would not know the first one's sessions.
replicaCount: 1
oidc:
  # The Keycloak realm URL, e.g. https://keycloak.<env>.passage.dev/realms/passage. Required.
  issuer: ""
  clientId: passage-portal-customer
  # The redirect URI registered on the client: https://customer.<env>.passage.dev/bff/callback
  redirectUri: ""
  # Secret holding the client secret under the key "client-secret". Created outside Git.
  clientSecretName: customer-portal-oidc
# The origin the app is served from, e.g. https://customer.<env>.passage.dev. Required.
appOrigin: ""
# Owning services, as in-cluster URLs.
upstreams:
  receivables: http://receivables.receivables.svc:8080
  billing: http://billing.billing.svc:8080
  sales: http://sales.sales.svc:8080
# Secret holding this service's Ed25519 seed under the key "signing-key". Its public key is added to
# PASSAGE_SERVICE_PUBLIC_KEYS of receivables, billing and sales as customer-portal=...
serviceSigningSecretName: customer-portal-signing
resources:
  requests: { cpu: 25m, memory: 96Mi }
  limits: { cpu: 500m, memory: 256Mi }
networkPolicy:
  enabled: true
  dnsNamespace: kube-system
  # The edge (Envoy) namespace, the only caller.
  edgeNamespace: envoy-gateway-system
  upstreamNamespaces: [receivables, billing, sales]
  # Keycloak is reached on 443.
  identityProviderCidr: 0.0.0.0/0
