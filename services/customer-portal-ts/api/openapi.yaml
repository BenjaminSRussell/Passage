openapi: 3.1.0
info:
  title: Passage customer portal BFF
  version: 0.1.0
  description: >-
    The session and proxy API of apps/customer-portal. Every /api/v1 route needs the session cookie. The routes are reads, plus the
    two writes a customer makes for itself: POST /api/v1/orders and POST /api/v1/returns (CSRF token, same-origin request and an
    Idempotency-Key of 8 to 80 characters). The customer comes from the session, never from the request: a customer, customerId or
    legalEntityId parameter is not forwarded, a write body that names one is refused, and the owning services ignore it. A contact
    may act for a bill-to or ship-to account of its customer group by naming it in X-Customer; the BFF signs it only when party lists
    it for the contact. Each /api/v1 route is one call to an owning service (table in src/routes.ts) and returns that service's
    answer, with 401 from a service turned into 502.
paths:
  /bff/login: { get: { summary: Start the OIDC sign-in (302 to the identity provider), responses: { '302': { description: Redirect } } } }
  /bff/callback: { get: { summary: Finish the sign-in and set the session cookie, parameters: [ { name: code, in: query, schema: { type: string } }, { name: state, in: query, schema: { type: string } } ], responses: { '302': { description: Signed in }, '400': { description: Unknown or expired sign-in }, '403': { description: Not a customer account } } } }
  /bff/me: { get: { summary: The signed-in contact and the CSRF token, responses: { '200': { description: OK }, '401': { description: No session } } } }
  /bff/logout: { post: { summary: End the session and answer the Keycloak end-session URL to send the browser to, responses: { '200': { description: 'Signed out; logoutUrl ends the single sign-on session' }, '403': { description: CSRF } } } }
  /api/v1/invoices: { get: { summary: The customer's posted invoices and credit notes, x-upstream: billing GET /v1/billing/customer-portal/invoices, responses: { '200': { description: OK } } } }
  /api/v1/invoices/{id}: { get: { summary: One invoice with its lines, responses: { '200': { description: OK }, '404': { description: Not found or not the customer's } } } }
  /api/v1/invoices/{id}/pdf: { get: { summary: 'One invoice as a PDF, rendered by print from the same read', responses: { '200': { description: The PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }, '404': { description: Not found or not the customer's }, '502': { description: The document could not be rendered (CUS-BFF-409) } } } }
  /api/v1/open-items: { get: { summary: The customer's open items, x-upstream: receivables GET /v1/receivables/customer-portal/open-items, responses: { '200': { description: OK } } } }
  /api/v1/open-items/{id}: { get: { summary: One open item, responses: { '200': { description: OK }, '404': { description: Not found or not the customer's } } } }
  /api/v1/payments: { get: { summary: The customer's payments, responses: { '200': { description: OK } } } }
  /api/v1/statement: { get: { summary: The customer's account statement (asOf), responses: { '200': { description: OK } } } }
  /api/v1/statement/pdf: { get: { summary: 'The statement as a PDF (asOf), rendered by print from the same read', responses: { '200': { description: The PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }, '400': { description: asOf is not a date }, '502': { description: The document could not be rendered (CUS-BFF-409) } } } }
  /api/v1/orders: { get: { summary: The customer's orders, x-upstream: sales GET /v1/sales/customer-portal/orders, responses: { '200': { description: OK } } }, post: { summary: Place an order from the customer's own order history (price, unit, site and warehouse are the last order's), x-upstream: sales POST /v1/sales/customer-portal/orders, responses: { '201': { description: Placed }, '200': { description: A repeat of the Idempotency-Key }, '400': { description: Invalid, or the body names a customer }, '403': { description: Not one of the contact's accounts }, '422': { description: A product never bought } } } }
  /api/v1/orders/{id}: { get: { summary: One order with its lines, responses: { '200': { description: OK }, '404': { description: Not found or not the customer's } } } }
  /api/v1/returns: { get: { summary: The customer's return orders, responses: { '200': { description: OK } } }, post: { summary: Request a return of one of the customer's posted invoices, x-upstream: sales POST /v1/sales/customer-portal/returns, responses: { '201': { description: Requested }, '200': { description: A repeat of the Idempotency-Key }, '400': { description: Invalid }, '422': { description: Not one of the customer's invoices, or a product never bought } } } }
  /api/v1/returns/{id}: { get: { summary: One return order, responses: { '200': { description: OK }, '404': { description: Not found or not the customer's } } } }
  /api/v1/products: { get: { summary: The products the customer can reorder, with the price paid last, x-upstream: sales GET /v1/sales/customer-portal/products, responses: { '200': { description: OK } } } }
  /api/v1/accounts: { get: { summary: The contact's customer and its bill-to and ship-to accounts of the same customer group, x-upstream: party GET /v1/party/customer-portal/accounts, responses: { '200': { description: OK } } } }
  /api/v1/companies: { get: { summary: The contact's legal entities with their customer-facing names (name is null when identity cannot answer), x-upstream: identity GET /v1/identity/customer-portal/legal-entity, responses: { '200': { description: OK } } } }
