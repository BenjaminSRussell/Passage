image: { repository: ghcr.io/benjaminsrussell/product, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: product-db
migrateOnStart: false
replicaCount: 2
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 1, memory: 1Gi }
serviceMonitor: { enabled: false }
configuratorURL: ""
orgBaseURL: "http://org:8080"
serviceIdentity:
  # Secret with key signing-key: product's Ed25519 seed, used to sign the org
  # lookups it makes for service callers (the migration loader).
  signingKeySecret: ""
  keyId: ""
  publicKeys: ""
