{{- if .Values.networkPolicy.enabled }}
# Ingress: only the calling services (fulfillment, transport); there is no edge route, people reach carriers
# through those services. Egress: DNS only. The sandbox carrier calls nothing; a real adapter adds its
# carrier's API endpoints here when it is built.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: carrier-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: carrier-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.callers }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace | quote }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
