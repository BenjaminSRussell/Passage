[project]
name = "scheduler-opt"
version = "0.1.0"
description = "CP-SAT optimization service for Passage finite scheduling (wave 23)"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.10",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler_opt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
