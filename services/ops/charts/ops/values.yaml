image: { repository: ghcr.io/benjaminsrussell/ops, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: ops-db
migrateOnStart: false
# The region this release runs in and the pair it manages ("name=ROLE,..."; read once, when the ops database has no regions).
region: { name: "", registered: "" }
# PRD 9.50.5: a failover to a passive region lagging more than this needs acceptDataLoss and a second approver.
failoverMaxLagSeconds: 300
# A lag reading older than this is unknown (about three reporting intervals): a stopped reporter blocks a failover instead of
# leaving the last number in place. 0 turns the check off. With lagReporter.enabled a region that never reported is unknown too.
lagStaleSeconds: 90
# Game-day targets (PRD 9.50.5): the scorecard of a failover is measured against them.
rtoTargetMinutes: 60
rpoTargetSeconds: 300
# Base64 Ed25519 public key of Passage commercial operations; tenant licences are installed only when signed with its key (LIC-1804).
licensePublicKey: ""
# Part 3. The SLO report and the hourly SLO check read Prometheus (empty: GET /v1/ops/slo answers 503 OPS-1725).
prometheusUrl: ""
slo:
  availabilityTarget: "0.999"
  latencyP95Ms: 2000
  # Per-service p95 targets in milliseconds, by Prometheus scrape job: { ledger: 500 }
  latencyP95ByService: {}
# USD unit rates of the tenant cost statements (docs/ops/cost-model.md), as decimal strings; empty refuses to record (COST-1904):
# { cpu_core_hours: "0.04", memory_gb_hours: "0.005", storage_gb: "0.10", kafka_gb: "0.02", lakehouse_gb: "0.023", ai_tokens: "0.000002", overhead: "0.12" }
costRates: {}
# How often the licence check and the SLO check run.
checkInterval: 1h
# The platform operator's tenant (identity's IDENTITY_OPERATOR_TENANT_ID). The ops routes serve this tenant only; the
# service refuses to start without it.
operatorTenantId: ""
replicaCount: 2
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor: { enabled: false }

serviceIdentity:
  publicKeys: ""

# The lag reporter (passage-ops lag-report): reads the real replication state of this region's Postgres and reports it to the
# ops API every interval. Run it where the standby is (mode standby, region = this region) or next to the primary (mode primary,
# region = the standby's name). A failed measurement reports unknownLagSeconds, so a broken reporter blocks a failover.
lagReporter:
  enabled: false
  mode: standby
  region: ""
  intervalSeconds: 30
  unknownLagSeconds: 86400
  # Gateway (or ops service) URL the reports go to, and the secret holding OPS_TOKEN and OPS_LAG_DATABASE_URL.
  apiUrl: ""
  secret: ops-lag-reporter
  applicationName: "%"
# Where every service of this release's cluster reads the region role from (global.regionFenceUrl in the service charts):
# the ops /healthz/region of this region, for example http://ops.<namespace>.svc/healthz/region.
