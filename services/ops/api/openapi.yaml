openapi: 3.1.0
info:
  title: ops
  version: 0.1.0
  description: >
    Ops control plane, parts 1 and 2 (PSG-50, FR-50.5): the active/passive region topology, a guarded failover that fences the old
    primary and promotes the target, the capacity model, and the region health check DNS reads. The failover records the plan
    and the state change; the infrastructure steps are carried out by runners that read the plan.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/ops/regions:
    get:
      operationId: listRegions
      summary: List the regions with their role and replication lag
      x-passage-duty: ops.region.view
      responses:
        '200':
          description: Regions by name, and the lag limit a failover enforces.
          content: { application/json: { schema: { $ref: '#/components/schemas/RegionList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/regions/{name}/lag:
    put:
      operationId: reportRegionLag
      summary: Record a region's replication lag
      x-passage-duty: ops.region.report
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LagReport' } } }
      responses:
        '200':
          description: The region with its new lag.
          content: { application/json: { schema: { $ref: '#/components/schemas/Region' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/failover:
    post:
      operationId: startFailover
      summary: Fail over to a passive region
      description: >
        Fences the current primary and promotes the target in one transaction (BR-50.1: never two PRIMARY). A target whose lag
        exceeds the limit is refused (OPS-1701) unless acceptDataLoss is set. Then nothing is applied: the call answers 202 with a
        failover request that a second operator, other than the caller, approves with their own call
        (POST /v1/ops/failover-requests/{id}:approve, OPS-1702). The body names no approver.
        The Idempotency-Key is the failover event id: a retry returns the first outcome (200, or 202 with the same request) and
        changes nothing. Every ops route serves the platform operator tenant only (OPS-1715).
      x-passage-duty: ops.failover.execute
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FailoverRequest' } } }
      responses:
        '201':
          description: Failover applied; the plan lists the ordered infrastructure steps.
          content: { application/json: { schema: { $ref: '#/components/schemas/Failover' } } }
        '200':
          description: The event id was already recorded; the first outcome.
          content: { application/json: { schema: { $ref: '#/components/schemas/Failover' } } }
        '202':
          description: The failover accepts data loss and waits for a second operator's approval; nothing changed yet.
          content: { application/json: { schema: { $ref: '#/components/schemas/FailoverRequestAccepted' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/failover-requests/{id}:
    get:
      operationId: getFailoverRequest
      summary: Read a failover request that waits for, or received, its second approval
      x-passage-duty: ops.region.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The request.
          content: { application/json: { schema: { $ref: '#/components/schemas/FailoverApproval' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/failover-requests/{id}:approve:
    post:
      operationId: approveFailoverRequest
      summary: Approve a failover request as the second operator
      description: >
        The approver is the verified caller and must not be the requester (403 OPS-1702). The plan is made again under the region
        locks, so it reflects the topology and lag at approval time. A request older than 5 minutes (the two-person window) is refused (OPS-1714).
        Approving an approved request returns the applied failover with 200 and changes nothing.
      x-passage-duty: ops.failover.execute
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: Failover applied with the caller as approver.
          content: { application/json: { schema: { $ref: '#/components/schemas/Failover' } } }
        '200':
          description: The request was already approved; the applied failover.
          content: { application/json: { schema: { $ref: '#/components/schemas/Failover' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/regions/{name}:rejoin:
    post:
      operationId: rejoinRegion
      summary: Return a fenced region to passive
      description: A FENCED region becomes PASSIVE only after its re-sync was verified (BR-50.1, OPS-1711).
      x-passage-duty: ops.failover.execute
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RejoinRequest' } } }
      responses:
        '200':
          description: The region, now PASSIVE.
          content: { application/json: { schema: { $ref: '#/components/schemas/Region' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/capacity/estimate:
    get:
      operationId: estimateCapacity
      summary: Capacity estimate for workload inputs
      description: >
        The model of docs/ops/capacity-model.md. Every parameter defaults to the 10k-user reference tenant. A rate parameter
        prices the matching part in both regions plus 12% overhead; costPriced names the parts priced.
      x-passage-duty: ops.region.view
      parameters:
        - { name: users, in: query, schema: { type: integer, minimum: 1 } }
        - { name: thinkTimeS, in: query, schema: { type: integer, minimum: 1 } }
        - { name: journalLinesPerHour, in: query, schema: { type: integer, minimum: 1 } }
        - { name: journalTargetLinesPerS, in: query, schema: { type: integer, minimum: 1 } }
        - { name: orderLinesPerHour, in: query, schema: { type: integer, minimum: 1 } }
        - { name: scanners, in: query, schema: { type: integer, minimum: 1 } }
        - { name: scanIntervalS, in: query, schema: { type: integer, minimum: 1 } }
        - { name: ledgerGbPerYear, in: query, schema: { type: integer, minimum: 1 } }
        - { name: ordersGbPerYear, in: query, schema: { type: integer, minimum: 1 } }
        - { name: scansGbPerYear, in: query, schema: { type: integer, minimum: 1 } }
        - { name: years, in: query, schema: { type: integer, minimum: 1 } }
        - { name: peakKafkaMsgsPerS, in: query, schema: { type: integer, minimum: 1 } }
        - { name: consumerParallelism, in: query, schema: { type: integer, minimum: 1 } }
        - { name: nodeUsdMonth, in: query, schema: { type: string }, description: Provider rate per node per month, USD. }
        - { name: pgGibUsdMonth, in: query, schema: { type: string }, description: Provider rate per GiB-month of Postgres volume, USD. }
        - { name: brokerUsdMonth, in: query, schema: { type: string }, description: Provider rate per Kafka broker per month, USD. }
      responses:
        '200':
          description: Pods, nodes, Postgres storage, Kafka brokers and, with rates, the monthly cost.
          content: { application/json: { schema: { $ref: '#/components/schemas/CapacityEstimate' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/failovers/{eventId}:
    get:
      operationId: getFailover
      summary: Read a failover with the steps recorded so far
      description: complete is true when every step of the plan is DONE. A runner that crashed resumes at the first step not DONE.
      x-passage-duty: ops.region.view
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The failover, its recorded steps and whether it is complete.
          content: { application/json: { schema: { $ref: '#/components/schemas/FailoverDetail' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/failovers/{eventId}/steps/{action}:
    put:
      operationId: recordFailoverStep
      summary: Record the result of one failover step
      description: >
        The runner (passage-ops failover) reports each step as it finishes. The reporter is the verified caller. A step recorded DONE
        is kept; a FAILED step is replaced by a later result, which is how a retry shows its success.
      x-passage-duty: ops.failover.execute
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [fence-old-primary, promote-cnpg, switch-mirrormaker, activate-temporal, flip-dns, verify-ledger-hash-chain] } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StepReport' } } }
      responses:
        '200':
          description: The failover with its steps after this report.
          content: { application/json: { schema: { $ref: '#/components/schemas/FailoverDetail' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/break-glass:
    post:
      operationId: openBreakGlass
      summary: Open a break-glass window for ops.failover.execute
      description: >
        A named operator opens a time-boxed window for themselves (15 to 120 minutes, default 60) with a reason code and a ticket. While it
        lasts the failover, rejoin, approve and step routes accept them without the ops.failover.execute duty; each use is logged. One window
        at a time per operator (OPS-1717). Another operator reviews it after it ends.
      x-passage-duty: ops.breakglass.request
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BreakGlassRequest' } } }
      responses:
        '201':
          description: The open window.
          content: { application/json: { schema: { $ref: '#/components/schemas/BreakGlass' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listBreakGlass
      summary: List break-glass windows, newest first
      x-passage-duty: ops.region.view
      parameters:
        - { name: unreviewed, in: query, required: false, schema: { type: boolean } }
      responses:
        '200':
          description: Windows with the number of requests each authorised.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BreakGlass' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/break-glass/{id}:revoke:
    post:
      operationId: revokeBreakGlass
      summary: End a break-glass window early
      description: Only the operator who opened the window can revoke it (OPS-1720).
      x-passage-duty: ops.breakglass.request
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The window, now revoked.
          content: { application/json: { schema: { $ref: '#/components/schemas/BreakGlass' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/break-glass/{id}:review:
    post:
      operationId: reviewBreakGlass
      summary: Review a break-glass window after it ended
      description: >
        APPROVED or FLAGGED (a flag needs a note). The reviewer is the verified caller and not the operator who used the window; a window is
        reviewed once and only after it ended or was revoked (OPS-1718). The review is due 3 days after the window ends; the
        ops_break_glass_review_overdue metric counts the late ones.
      x-passage-duty: ops.breakglass.review
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BreakGlassReview' } } }
      responses:
        '200':
          description: The reviewed window.
          content: { application/json: { schema: { $ref: '#/components/schemas/BreakGlass' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/failovers/{eventId}/scorecard:
    get:
      operationId: getFailoverScorecard
      summary: Measure a failover against the RTO and RPO targets
      description: >
        RTO runs from the start of the fence step to the end of the DNS flip; RPO is the replication lag at the fence (AC-50.3, the
        same measures as deploy/multi-region/gameday/score.py). The targets are RTO_TARGET_MIN (60) and RPO_TARGET_S (300). passed needs
        every step DONE, both targets met, the ledger hash chain verified and no data loss accepted.
      x-passage-duty: ops.region.view
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The scorecard.
          content: { application/json: { schema: { $ref: '#/components/schemas/Scorecard' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/tenants/{id}/license:
    put:
      operationId: installTenantLicense
      summary: Install a signed tenant licence
      description: >
        payload is the base64 of the licence JSON exactly as signed offline by Passage commercial operations; signature is the base64
        Ed25519 signature over those bytes (LIC-1804 when it does not verify, or no key is configured). If-Match carries the installed version,
        0 when none is installed (412 LIC-1806 when it changed). The licence must name this tenant (LIC-1805).
      x-passage-duty: ops.license.install
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LicenseInstall' } } }
      responses:
        '200':
          description: The installed licence with its state today. The ETag is the new version.
          content: { application/json: { schema: { $ref: '#/components/schemas/LicenseView' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: getTenantLicense
      summary: Read a tenant licence and its state
      description: >
        VALID, GRACE or EXPIRED by the rules of BR-50.8 (grace 30 days by default, 0 to 60). activeFull is the caller's count of active full users;
        without it the tenant's last reported count (PUT .../license/usage) applies, and without that only the date rules apply. Admin sign-in and data
        export are never blocked.
      x-passage-duty: ops.region.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: activeFull, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: The licence, its version, state and catalogue messages.
          content: { application/json: { schema: { $ref: '#/components/schemas/LicenseView' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/tenants/{id}/license/usage:
    put:
      operationId: reportTenantLicenseUsage
      summary: Report a tenant's active user counts
      description: >
        The user-count reporter sends each tenant's active full, operational and self-service users, hourly. The hourly licence check
        evaluates every licence with the last full-user count and writes dev.passage.ops.license.changed.v1 when the state moves.
      x-passage-duty: ops.license.report
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LicenseUsageReport' } } }
      responses:
        '200':
          description: The stored counts with the last checked state.
          content: { application/json: { schema: { $ref: '#/components/schemas/LicenseUsage' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/licenses:
    get:
      operationId: listTenantLicenses
      summary: List every tenant licence with its state
      description: Each installed licence with its state today, evaluated with the tenant's last reported full users, and those counts.
      x-passage-duty: ops.region.view
      responses:
        '200':
          description: The licences.
          content: { application/json: { schema: { $ref: '#/components/schemas/LicenseList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/slo:
    get:
      operationId: getSloReport
      summary: SLO report per service
      description: >
        Availability (share of requests that were not 5xx) and p95 latency per service over the window, read from Prometheus
        (http_requests_total and http_request_duration_seconds, one scrape job per service), against the targets SLO_AVAILABILITY_TARGET
        (0.999) and SLO_LATENCY_P95_MS (2000, per service in SLO_LATENCY_P95_BY). breachedSince comes from the hourly SLO check, which writes
        dev.passage.ops.slo.breached.v1 once per breach. 503 OPS-1725 when PROMETHEUS_URL is not set or Prometheus does not answer.
      x-passage-duty: ops.region.view
      parameters:
        - { name: window, in: query, required: false, schema: { type: string, enum: ['1h', '6h', '24h', '7d', '30d'], default: '24h' } }
      responses:
        '200':
          description: One line per service.
          content: { application/json: { schema: { $ref: '#/components/schemas/SloReport' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/tenants:
    get:
      operationId: listTenantProvisions
      summary: List tenant provisions
      description: The provisions, newest first (at most 500), each with its status and whether it runs past the 15-minute target.
      x-passage-duty: ops.region.view
      responses:
        '200':
          description: The provisions.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProvisionList' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: provisionTenant
      summary: Provision a tenant
      description: >
        Checks the residency first (OPS-1705: the region must be deployed and inside the residency, by platform/go/residency), then records
        the provision with its plan (realm, databases, kafka-acls, lakehouse, license). The provisioning runner executes each step and
        reports it; the last DONE step writes dev.passage.ops.tenant.provisioned.v1. Idempotency-Key is required: a replay with the same
        request answers 200 with the first record, a different request or a tenant that already has a provision answers 409 OPS-1723.
      x-passage-duty: ops.tenant.provision
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProvisionRequest' } } }
      responses:
        '201':
          description: The provision was recorded.
          content: { application/json: { schema: { $ref: '#/components/schemas/Provision' } } }
        '200':
          description: A replay of the same request; the first record.
          content: { application/json: { schema: { $ref: '#/components/schemas/Provision' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/tenants/{id}:
    get:
      operationId: getTenantProvision
      summary: Read a tenant provision with its steps
      x-passage-duty: ops.region.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The provision and the steps reported so far.
          content: { application/json: { schema: { $ref: '#/components/schemas/Provision' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/tenants/{id}/provision-steps/{action}:
    put:
      operationId: recordTenantProvisionStep
      summary: Report one provisioning step
      description: >
        DONE is kept; FAILED marks the provision FAILED until a retry of that step is DONE. The license step is DONE only once the tenant's
        signed licence is installed (OPS-1724). When the last step turns DONE the provision is PROVISIONED and the event is written in the same
        transaction.
      x-passage-duty: ops.tenant.provision
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [realm, databases, kafka-acls, lakehouse, license] } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProvisionStepReport' } } }
      responses:
        '200':
          description: The provision after the step.
          content: { application/json: { schema: { $ref: '#/components/schemas/Provision' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/tenants/{id}/costs/{month}:
    put:
      operationId: recordTenantCost
      summary: Record a tenant's metered month
      description: >
        The monthly metering job sends the six metered quantities (decimal strings), the ECB month-average rate (USD per EUR) and the
        Prometheus query version; the statement is computed by the rules of docs/ops/cost-model.md (one rounding to cents, EUR from the
        unrounded total) and stored. A second call restates the month. 503 COST-1904 without OPS_COST_RATES; 422 COST-1902 for invalid input.
      x-passage-duty: ops.cost.record
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: month, in: path, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CostRecordRequest' } } }
      responses:
        '200':
          description: The stored statement.
          content: { application/json: { schema: { $ref: '#/components/schemas/CostStatement' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: getTenantCost
      summary: Read a tenant's cost statement
      description: JSON, or the CSV statement with format=csv (or Accept text/csv). 404 COST-1903 when the month is not recorded.
      x-passage-duty: ops.region.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: month, in: path, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv] } }
      responses:
        '200':
          description: The statement.
          content:
            application/json: { schema: { $ref: '#/components/schemas/CostStatement' } }
            text/csv: { schema: { type: string } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ops/costs:
    get:
      operationId: listTenantCosts
      summary: List every tenant's cost statement for a month
      description: The statements and the cluster total in USD, the figure reconciled with the provider invoice (AC-50.7).
      x-passage-duty: ops.region.view
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: The statements of the month.
          content: { application/json: { schema: { $ref: '#/components/schemas/CostList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /healthz/region:
    get:
      operationId: regionHealth
      summary: Region health for DNS checks
      description: >
        200 only while the region this replica runs in is PRIMARY; 503 with Retry-After 30 and the role otherwise. When the role cannot be read (database
        unreadable, region not registered) the 503 is a problem with no role, so a consumer never mistakes it for a role: the services' fence keeps its last state.
      x-passage-duty: public
      responses:
        '200':
          description: This region is PRIMARY.
          content: { application/json: { schema: { $ref: '#/components/schemas/RegionHealth' } } }
        '503':
          description: This region is not PRIMARY (a RegionHealth body), or its role cannot be read (a problem body with no role).
          headers: { Retry-After: { schema: { type: integer } } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/RegionHealth' } }
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
  /healthz:
    get:
      operationId: liveness
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
components:
  schemas:
    Region:
      type: object
      required: [name, role, lagSeconds, version]
      properties:
        name: { type: string }
        role: { type: string, enum: [PRIMARY, PASSIVE, FENCED] }
        lagSeconds: { type: integer, minimum: 0 }
        lagStale: { type: boolean, description: "True when no lag report arrived within OPS_LAG_STALE_S (or none ever, with OPS_REQUIRE_LAG_REPORTS); lagSeconds is then 1073741824 (unknown)." }
        version: { type: integer }
    RegionList:
      type: object
      required: [items, maxLagSeconds]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Region' } }
        maxLagSeconds: { type: integer }
    LagReport:
      type: object
      additionalProperties: false
      required: [lagSeconds]
      properties:
        lagSeconds: { type: integer, minimum: 0 }
    FailoverRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: { type: string, description: The PASSIVE region to promote. }
        acceptDataLoss: { type: boolean, default: false }
    FailoverApproval:
      type: object
      required: [id, eventId, to, lagSeconds, requestedBy, status, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string }
        to: { type: string }
        lagSeconds: { type: integer }
        requestedBy: { type: string }
        status: { type: string, enum: [PENDING, APPROVED] }
        approvedBy: { type: string }
        approvedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    FailoverRequestAccepted:
      type: object
      required: [request]
      properties:
        request: { $ref: '#/components/schemas/FailoverApproval' }
    RejoinRequest:
      type: object
      additionalProperties: false
      properties:
        resyncVerified: { type: boolean, default: false }
    FailoverStep:
      type: object
      required: [order, action, region]
      properties:
        order: { type: integer }
        action: { type: string, enum: [fence-old-primary, promote-cnpg, switch-mirrormaker, activate-temporal, flip-dns, verify-ledger-hash-chain] }
        region: { type: string }
    FailoverPlan:
      type: object
      required: [from, to, acceptDataLoss, lagSeconds, steps]
      properties:
        from: { type: string }
        to: { type: string }
        acceptDataLoss: { type: boolean }
        lagSeconds: { type: integer }
        steps: { type: array, items: { $ref: '#/components/schemas/FailoverStep' } }
    Failover:
      type: object
      required: [eventId, plan, requestedBy, createdAt]
      properties:
        eventId: { type: string }
        plan: { $ref: '#/components/schemas/FailoverPlan' }
        requestedBy: { type: string }
        approvedBy: { type: string }
        createdAt: { type: string, format: date-time }
    RecordedStep:
      type: object
      required: [order, action, region, status, startedAt, finishedAt, reportedBy]
      properties:
        order: { type: integer }
        action: { type: string }
        region: { type: string }
        status: { type: string, enum: [DONE, FAILED] }
        detail: { type: string }
        forced: { type: boolean }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        reportedBy: { type: string }
    FailoverDetail:
      allOf:
        - { $ref: '#/components/schemas/Failover' }
        - type: object
          required: [steps, complete]
          properties:
            steps: { type: array, items: { $ref: '#/components/schemas/RecordedStep' } }
            complete: { type: boolean }
    StepReport:
      type: object
      additionalProperties: false
      required: [order, region, status, startedAt, finishedAt]
      properties:
        order: { type: integer, minimum: 1 }
        region: { type: string }
        status: { type: string, enum: [DONE, FAILED] }
        detail: { type: string, maxLength: 2000 }
        forced: { type: boolean, description: "Only for a DONE fence-old-primary step: the old region could not be reached and an operator recorded the fence anyway. Needs a failover a second operator approved (OPS-1702) and a detail with the reason." }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    BreakGlassRequest:
      type: object
      additionalProperties: false
      required: [reasonCode, ticketRef]
      properties:
        reasonCode: { type: string, enum: [INCIDENT_RESPONSE, PRODUCTION_OUTAGE, REGION_LOSS, APPROVER_UNAVAILABLE, AUDIT_EVIDENCE_REQUEST] }
        ticketRef: { type: string, maxLength: 128 }
        minutes: { type: integer, minimum: 15, maximum: 120, default: 60 }
    BreakGlassReview:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { type: string, enum: [APPROVED, FLAGGED] }
        note: { type: string, maxLength: 2000 }
    BreakGlass:
      type: object
      required: [id, userId, reasonCode, ticketRef, grantedAt, expiresAt, reviewDueAt, uses]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        reasonCode: { type: string }
        ticketRef: { type: string }
        grantedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        reviewDueAt: { type: string, format: date-time }
        reviewedBy: { type: string }
        reviewedAt: { type: string, format: date-time }
        reviewOutcome: { type: string, enum: [APPROVED, FLAGGED] }
        reviewNote: { type: string }
        uses: { type: integer }
    Scorecard:
      type: object
      required: [complete, rtoTargetSeconds, rtoMet, rpoSeconds, rpoTargetSeconds, rpoMet, dataLossAccepted, ledgerHashChainVerified, fenceForced, passed, failures]
      properties:
        complete: { type: boolean }
        rtoSeconds: { type: number }
        rtoTargetSeconds: { type: integer }
        rtoMet: { type: boolean }
        rpoSeconds: { type: integer }
        rpoTargetSeconds: { type: integer }
        rpoMet: { type: boolean }
        dataLossAccepted: { type: boolean }
        ledgerHashChainVerified: { type: boolean }
        fenceForced: { type: boolean }
        passed: { type: boolean }
        failures: { type: array, items: { type: string } }
    LicenseInstall:
      type: object
      additionalProperties: false
      required: [payload, signature]
      properties:
        payload: { type: string, format: byte, description: Base64 of the licence JSON exactly as signed. }
        signature: { type: string, format: byte, description: Base64 Ed25519 signature over the payload bytes. }
    LicenseTerms:
      type: object
      required: [tenantId, issuedAt, expiresAt, fullUsers, operationalUsers, selfserviceUsers]
      properties:
        tenantId: { type: string, format: uuid }
        issuedAt: { type: string, format: date }
        expiresAt: { type: string, format: date }
        fullUsers: { type: integer, minimum: 0 }
        operationalUsers: { type: integer, minimum: 0 }
        selfserviceUsers: { type: integer, minimum: 0 }
        graceDays: { type: integer, minimum: 0, maximum: 60 }
    LicenseView:
      type: object
      required: [license, version, installedBy, installedAt, status, messages]
      properties:
        license: { $ref: '#/components/schemas/LicenseTerms' }
        version: { type: integer }
        installedBy: { type: string }
        installedAt: { type: string, format: date-time }
        status:
          type: object
          required: [state, daysToExpiry, loginAllowed, adminLoginAllowed, exportAllowed, banner, codes]
          properties:
            state: { type: string, enum: [VALID, GRACE, EXPIRED] }
            daysToExpiry: { type: integer }
            loginAllowed: { type: boolean }
            adminLoginAllowed: { type: boolean }
            exportAllowed: { type: boolean }
            banner: { type: boolean }
            codes: { type: array, items: { type: string } }
        messages: { type: array, items: { type: string } }
    RegionHealth:
      type: object
      required: [region, role]
      properties:
        region: { type: string }
        role: { type: string, enum: [PRIMARY, PASSIVE, FENCED] }
    CapacityEstimate:
      type: object
      required: [modelVersion, derived, pods, nodes, postgres, kafka]
      properties:
        modelVersion: { type: string }
        derived: { type: object, additionalProperties: { type: number } }
        pods: { type: object, additionalProperties: { type: integer } }
        nodes: { type: object, additionalProperties: { type: integer } }
        postgres: { type: object, additionalProperties: { type: integer } }
        kafka: { type: object, additionalProperties: { type: integer } }
        costUsdMonth: { type: string, description: Rounded half up to the cent (BR-50.10). }
        costPriced: { type: array, items: { type: string, enum: [kafka, nodes, postgres] } }
    Problem:
      type: object
      required: [type, title, status]
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string }, code: { type: string }, traceId: { type: string }, errors: { type: object, additionalProperties: { type: string } } }
    LicenseUsageReport:
      type: object
      required: [activeFull, activeOperational, activeSelfservice]
      properties:
        activeFull: { type: integer, minimum: 0 }
        activeOperational: { type: integer, minimum: 0 }
        activeSelfservice: { type: integer, minimum: 0 }
    LicenseUsage:
      type: object
      properties:
        activeFull: { type: integer }
        activeOperational: { type: integer }
        activeSelfservice: { type: integer }
        countedAt: { type: string, format: date-time }
        reportedBy: { type: string }
        lastState: { type: string, enum: [VALID, GRACE, EXPIRED] }
        checkedAt: { type: string, format: date-time }
    LicenseList:
      type: object
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/LicenseView'
              - type: object
                properties:
                  usage: { $ref: '#/components/schemas/LicenseUsage' }
    SloLine:
      type: object
      properties:
        service: { type: string, description: The Prometheus scrape job of the service. }
        requests: { type: number }
        availability: { type: number, nullable: true }
        availabilityTarget: { type: number }
        latencyP95Ms: { type: number, nullable: true }
        latencyTargetMs: { type: number }
        errorBudgetRemaining: { type: number, nullable: true, description: 1 is untouched, 0 spent, negative overspent. }
        availabilityBreached: { type: boolean }
        latencyBreached: { type: boolean }
        breached: { type: boolean }
        breachedSince: { type: string, format: date-time }
        noTraffic: { type: boolean }
    SloReport:
      type: object
      properties:
        window: { type: string }
        generatedAt: { type: string, format: date-time }
        breached: { type: integer }
        services: { type: array, items: { $ref: '#/components/schemas/SloLine' } }
    ProvisionRequest:
      type: object
      required: [tenantId, name, residency, region]
      properties:
        tenantId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        residency: { type: string, description: 'A code of platform/go/residency (EU, UK, US, GLOBAL).' }
        region: { type: string }
        tier: { type: string, enum: [PROD, DEV, TEST, UAT], default: PROD }
    ProvisionStepReport:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [DONE, FAILED] }
        detail: { type: string, maxLength: 2000 }
    Provision:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        name: { type: string }
        residency: { type: string }
        region: { type: string }
        tier: { type: string }
        status: { type: string, enum: [PROVISIONING, PROVISIONED, FAILED] }
        plan: { type: array, items: { type: string } }
        steps:
          type: array
          items:
            type: object
            properties:
              order: { type: integer }
              action: { type: string }
              status: { type: string, enum: [DONE, FAILED] }
              detail: { type: string }
              reportedBy: { type: string }
              recordedAt: { type: string, format: date-time }
        requestedBy: { type: string }
        createdAt: { type: string, format: date-time }
        provisionedAt: { type: string, format: date-time }
        overdue: { type: boolean }
    ProvisionList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Provision' } }
    CostRecordRequest:
      type: object
      required: [quantities, usdPerEur, modelVersion]
      properties:
        quantities:
          type: object
          description: cpu_core_hours, memory_gb_hours, storage_gb, kafka_gb, lakehouse_gb and ai_tokens as decimal strings, all required.
          additionalProperties: { type: string }
        usdPerEur: { type: string, description: ECB month-average rate, USD per 1 EUR. }
        modelVersion: { type: string }
    CostStatement:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        month: { type: string }
        quantities: { type: object, additionalProperties: { type: string } }
        lines: { type: object, additionalProperties: { type: string } }
        costUsd: { type: string }
        costEur: { type: string }
        usdPerEur: { type: string }
        fxSource: { type: string }
        overhead: { type: string }
        modelVersion: { type: string }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
    CostList:
      type: object
      properties:
        month: { type: string }
        clusterCostUsd: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/CostStatement' } }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
