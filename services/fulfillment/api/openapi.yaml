                materialCode: { type: string, pattern: '^[A-Za-z0-9_.-]{1,32}$' }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                ratePerKg: { $ref: "#/components/schemas/Decimal" }
                validFrom: { type: string, format: date }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeRate" }
        "400": { description: "FUL-0050 validation, FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { description: idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/packaging-report:
    get:
      operationId: packagingReport
      summary: Packaging weight and fee per material for a country and month, net of reversals (section 5.28.14)
      x-passage-duty: PackagingFeeMaintain
      parameters:
        - { name: countryCode, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Report rows
          content:
            application/json:
              schema:
                type: object
                required: [countryCode, period, legalEntityId, items]
                properties:
                  countryCode: { type: string }
                  period: { type: string }
                  legalEntityId: { type: [string, "null"], format: uuid }
                  items:
                    type: array
                    items:
                      type: object
                      required: [materialCode, weightKg, feeAmount, currency]
                      properties:
                        materialCode: { type: string }
                        weightKg: { $ref: "#/components/schemas/Decimal" }
                        feeAmount: { $ref: "#/components/schemas/Decimal" }
                        currency: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/delivered-not-invoiced:
    get:
      operationId: deliveredNotInvoiced
      summary: Delivered-not-invoiced report, the open GL 1405 balance per currency and its packing slips (FR-28.12, section 5.28.14)
      description: >-
        A slip counts while its Dr 1405 is not reversed by a cancellation dated on or before asOf and it is not INVOICED.
        Slips posted with cogsAtShipment carry no 1405 line and never appear. totals cover all lineCount slips;
        lines holds at most limit of them, oldest posting date first.
      x-passage-duty: WarehouseView
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, description: "Report date (YYYY-MM-DD, UTC); default today.", schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: object
                required: [legalEntityId, customerId, asOf, account, totals, lineCount, lines]
                properties:
                  legalEntityId: { type: string, format: uuid }
                  customerId: { type: [string, "null"], format: uuid }
                  asOf: { type: string, format: date }
                  account: { type: string, example: "1405" }
                  totals:
                    type: array
                    items:
                      type: object
                      required: [currency, count, amount]
                      properties:
                        currency: { type: string }
                        count: { type: integer }
                        amount: { $ref: "#/components/schemas/Decimal" }
                  lineCount: { type: integer }
                  lines:
                    type: array
                    items:
                      type: object
                      required: [packingSlipId, packingSlipNumber, shipmentId, orderId, customerId, currency, postingDate, amount, daysOutstanding]
                      properties:
                        packingSlipId: { type: string, format: uuid }
                        packingSlipNumber: { type: string }
                        shipmentId: { type: string, format: uuid }
                        orderId: { type: string, format: uuid }
                        customerId: { type: string, format: uuid }
                        currency: { type: string }
                        postingDate: { type: string, format: date-time }
                        amount: { $ref: "#/components/schemas/Decimal" }
                        daysOutstanding: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/sscc-register:
    get:
      operationId: ssccRegister
      summary: SSCC register, every issued SSCC with its container and shipment (BR-28.5, section 5.28.14)
      description: >-
        Ordered by SSCC. noReuseUntil is the issue date plus sscc_no_reuse_months (12); SSCCs are unique per
        tenant, so an issued SSCC is never issued again. Page with limit and the nextCursor of the previous page.
      x-passage-duty: WarehouseView
      parameters:
        - { name: companyPrefix, in: query, description: "GS1 company prefix (6 to 12 digits) after the extension digit.", schema: { type: string, pattern: "^[0-9]{6,12}$" } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, description: "First issue date (YYYY-MM-DD, UTC), inclusive.", schema: { type: string, format: date } }
        - { name: to, in: query, description: "Last issue date (YYYY-MM-DD, UTC), inclusive; not before from.", schema: { type: string, format: date } }
        - { name: cursor, in: query, description: "nextCursor of the previous page.", schema: { type: string, pattern: "^[0-9]{18}$" } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: One page of the register
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [sscc, containerId, containerType, status, shipmentId, shipmentNumber, orderId, customerId, packingSlipId, issuedAt, noReuseUntil]
                      properties:
                        sscc: { type: string, pattern: "^[0-9]{18}$" }
                        containerId: { type: string, format: uuid }
                        containerType: { type: string }
                        status: { type: string, enum: [OPEN, CLOSED, SHIPPED, UNPACKED] }
                        shipmentId: { type: string, format: uuid }
                        shipmentNumber: { type: string }
                        orderId: { type: string, format: uuid }
                        customerId: { type: string, format: uuid }
                        packingSlipId: { type: [string, "null"], format: uuid, description: "The slip the container shipped on; null until it ships." }
                        issuedAt: { type: string, format: date-time }
                        noReuseUntil: { type: string, format: date }
                  nextCursor: { type: string, pattern: "^[0-9]{18}$", description: "Present when another page exists." }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/backorders:
    get:
      operationId: listBackorders
      summary: Short picks and backorders (FR-28.2, AC-28.4, section 5.28.14)
      description: >-
        Shipment lines a pick confirmed below their planned quantity, newest short pick first. The
        remainder (qtyPlanned - qtyPicked) is open until a re-pick reaches the planned quantity, the remainder is
        closed (qtyClosed, FR-28.8) or the shipment is cancelled. status=open (default) lists open backorders only; status=all also lists closed ones. from
        and to bound the date of the line's first short pick. Page with limit and the nextCursor of the previous
        page.
      x-passage-duty: WarehouseView
      parameters:
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [open, all], default: open } }
        - { name: from, in: query, description: "First short-pick date (YYYY-MM-DD, UTC), inclusive.", schema: { type: string, format: date } }
        - { name: to, in: query, description: "Last short-pick date (YYYY-MM-DD, UTC), inclusive; not before from.", schema: { type: string, format: date } }
        - { name: cursor, in: query, description: "nextCursor of the previous page (a shipment line id).", schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: One page of the report
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [shipmentLineId, shipmentId, shipmentNumber, status, warehouseId, orderId, customerId, orderLineId, productId, unit, qtyPlanned, qtyPicked, qtyShipped, qtyClosed, qtyRemainder, open, shortPickedAt]
                      properties:
                        shipmentLineId: { type: string, format: uuid }
                        shipmentId: { type: string, format: uuid }
                        shipmentNumber: { type: string }
                        status: { $ref: "#/components/schemas/ShipmentStatus" }
                        warehouseId: { type: string, format: uuid }
                        orderId: { type: string, format: uuid }
                        customerId: { type: string, format: uuid }
                        orderLineId: { type: string, format: uuid }
                        productId: { type: string, format: uuid }
                        unit: { type: string }
                        qtyPlanned: { $ref: "#/components/schemas/Decimal" }
                        qtyPicked: { $ref: "#/components/schemas/Decimal" }
                        qtyShipped: { $ref: "#/components/schemas/Decimal" }
                        qtyClosed: { $ref: "#/components/schemas/Decimal", description: "Planned quantity given up when the remainder was closed (FR-28.8); qtyPlanned is then what shipped." }
                        qtyRemainder: { $ref: "#/components/schemas/Decimal" }
                        open: { type: boolean, description: "A remainder is left and the shipment is not cancelled." }
                        shortPickedAt: { type: string, format: date-time, description: "The line's first short pick." }
                  nextCursor: { type: string, format: uuid, description: "Present when another page exists." }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/returnable-packaging:
    get:
      operationId: listReturnableBalances
      summary: Returnable packaging balances per customer and container type (FR-28.16)
      x-passage-duty: WarehouseView
      parameters:
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReturnableBalance" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/returnable-packaging/aging:
    get:
      operationId: returnablePackagingAging
      summary: Returnable packaging aging, days outstanding and charge due (FR-28.16, section 5.28.14)
      description: >-
        Every balance above zero, aged first in, first out as of today (UTC): returns are taken against the
        oldest shipments, so oldestOutstandingDate is the posting date of the oldest packing slip whose
        containers the customer still holds. chargeDue is set once daysOutstanding exceeds chargeDays
        (rtp_charge_days, default 90); wave 30 charges those. count and chargeDueCount cover every matching
        balance; items holds at most limit of them, oldest first.
      x-passage-duty: WarehouseView
      parameters:
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: chargeDays, in: query, schema: { type: integer, minimum: 30, maximum: 365, default: 90 } }
        - { name: chargeDue, in: query, description: "true lists only balances whose charge is due.", schema: { type: boolean, default: false } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: The aged balances
          content:
            application/json:
              schema:
                type: object
                required: [asOf, chargeDays, count, chargeDueCount, items]
                properties:
                  asOf: { type: string, format: date }
                  chargeDays: { type: integer }
                  count: { type: integer }
                  chargeDueCount: { type: integer }
                  items:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/ReturnableBalance" }
                        - type: object
                          required: [oldestOutstandingDate, daysOutstanding, chargeDue]
                          properties:
                            oldestOutstandingDate: { type: [string, "null"], format: date, description: "Null when no shipped container of the balance is visible." }
                            daysOutstanding: { type: integer }
                            chargeDue: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/returnable-packaging:return:
    post:
      operationId: returnPackaging
      summary: Record a standalone return receipt of returnable containers (BR-28.13)
      x-passage-duty: WarehouseReceive
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, containerType, qty]
              additionalProperties: false
              properties:
                customerId: { type: string, format: uuid }
                containerType: { type: string }
                qty: { type: string, pattern: '^[0-9]{1,9}$', description: "Whole number of containers returned, 1 or more." }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnableBalance" }
        "400": { description: "FUL-0050 validation, FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { description: "FUL-0015 the return exceeds the customer's balance, idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}:cancel:
    post:
      operationId: cancelShipment
      summary: Cancel a shipment before anything ships (BR-28.6)
      description: >
        Allowed from OPEN, RELEASED, PICKING, PICKED or PACKED while nothing has
        shipped and the shipment holds no container. The order lines can be released
        again; inventory releases their reservations from shipment.cancelled.
      x-passage-duty: WarehouseRelease
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Shipment CANCELLED; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0020, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "FUL-0021 already cancelled, shipped quantity, or containers packed", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}:close-remainder:
    post:
      operationId: closeShipmentRemainder
      summary: Close the open remainder of a partially shipped shipment (FR-28.8)
      description: >
        CANCEL_REMAINDER: allowed while the shipment is PARTIALLY_SHIPPED, or its
        remainder is being picked (PICKING, PICKED), after at least one slip has
        shipped and with nothing packed waiting to ship. Every line shrinks to the
        quantity that shipped (qtyClosed records what was given up), the backorder
        closes and the shipment becomes SHIPPED. shipment.closed tells inventory
        which reservation and which picked-but-unpacked stock to release.
      x-passage-duty: WarehouseRelease
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Shipment SHIPPED with its remainder closed; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0020, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "FUL-0021 no open remainder, nothing shipped yet, or packed quantity waiting to ship", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}/containers/{cid}:unpack:
    post:
      operationId: unpackContainer
      summary: Take a CLOSED container apart before it ships
      description: >
        Allowed while the shipment is PICKING, PICKED or PACKED and the container is
        CLOSED (not on a posted slip). The container's packed quantities return to the
        unpacked pool; a PACKED shipment goes back to PICKED so it can be repacked or,
        once it holds no container, cancelled. The SSCC stays issued and is never
        reused (BR-28.5). Publishes container.unpacked.
      x-passage-duty: WarehousePack
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Shipment without the container; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0020 shipment, FUL-0054 container not on the shipment (or already unpacked)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "FUL-0021 shipment status does not allow unpacking, or the container already shipped", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/waves:preview:
    post:
      operationId: previewWaves
      summary: Picking workbench preview of the grouped waves (FR-28.13, BR-28.14)
      description: >
        Read-only: plans waves from the RELEASED shipments that match the filter,
        grouped by the key, each of at most maxLines lines and maxOrders orders,
        never splitting a shipment or mixing legal entities. No Idempotency-Key.
      x-passage-duty: WarehouseRelease
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkbenchRequest" }
      responses:
        "200":
          description: Planned waves
          content:
            application/json:
              schema:
                type: object
                required: [warehouseId, groupBy, waveCount, lineCount, message, waves]
                properties:
                  warehouseId: { type: string, format: uuid }
                  groupBy: { type: string }
                  waveCount: { type: integer }
                  lineCount: { type: integer }
                  message: { type: string }
                  waves:
                    type: array
                    items: { $ref: "#/components/schemas/WavePlan" }
        "400": { description: "FUL-0050 validation, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { description: "FUL-0034 one shipment has more lines than maxLines", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/waves:
    get:
      operationId: listWaves
      summary: Pick waves, newest first
      x-passage-duty: WarehouseView
      parameters:
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Waves
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WaveSummary" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createWaves
      summary: Create the previewed waves in one action (FR-28.13)
      description: >
        Plans again from the current RELEASED shipments, records each wave with its
        shipments and lines (WV- numbers), moves the shipments to PICKING and writes
        one wave.created per wave, in one transaction. message carries FUL-0016.
      x-passage-duty: WarehouseRelease
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkbenchRequest" }
      responses:
        "201":
          description: Waves created
          content:
            application/json:
              schema:
                type: object
                required: [warehouseId, groupBy, waveCount, lineCount, message, waves]
                properties:
                  warehouseId: { type: string, format: uuid }
                  groupBy: { type: string }
                  waveCount: { type: integer }
                  lineCount: { type: integer }
                  message: { type: string, example: "FUL-0016: Workbench created 3 waves from 60 lines" }
                  waves:
                    type: array
                    items: { $ref: "#/components/schemas/Wave" }
        "400": { description: "FUL-0050 validation, FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { description: "FUL-0053 a shipment left RELEASED or a line is already in a wave; preview again", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0034 one shipment has more lines than maxLines, idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/waves/{id}:
    get:
      operationId: getWave
      summary: One pick wave with its shipments and their current status
      x-passage-duty: WarehouseView
      parameters:
        - { $ref: "#/components/parameters/WaveId" }
      responses:
        "200":
          description: Wave
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wave" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0052, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}/tracking:
    get:
      operationId: listTracking
      summary: Tracking events of a shipment, newest first (FR-28.10)
      x-passage-duty: WarehouseView
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
      responses:
        "200":
          description: Tracking events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TrackingEvent" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0020, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    post:
      operationId: recordTracking
      summary: Record a carrier tracking event (FR-28.10, BR-28.9 manual tracking)
      description: >
        Called by carrier-gateway after it verified the provider webhook, or by a
        shipping clerk entering tracking by hand. The provider event key is the
        idempotency key (no Idempotency-Key header): a redelivery answers 200 with
        created false and publishes nothing. A DELIVERED event moves a SHIPPED
        shipment to DELIVERED.
      x-passage-duty: WarehouseShip
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, eventKey, trackingNumber, status, eventTime]
              properties:
                provider: { type: string, pattern: '^[a-z0-9-]{2,32}$' }
                eventKey: { type: string, maxLength: 128 }
                trackingNumber: { type: string, maxLength: 64 }
                status: { type: string, enum: [QUOTED, LABELLED, MANIFESTED, IN_TRANSIT, DELIVERED, EXCEPTION] }
                description: { type: string, maxLength: 500 }
                eventTime: { type: string, format: date-time }
      responses:
        "201":
          description: Event recorded and tracking.updated published
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/TrackingEvent" }
                  - { type: object, properties: { created: { type: boolean, const: true } } }
        "200":
          description: The provider event was already recorded; the stored event is returned
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/TrackingEvent" }
                  - { type: object, properties: { created: { type: boolean, const: false } } }
        "400": { description: "FUL-0050 validation, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0020, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}/containers/{cid}/label:
    get:
      operationId: containerLabel
      summary: GS1-128 SSCC label of a container as ZPL (FR-28.3, BR-28.5)
      description: >
        The barcode encodes AI (00) and the SSCC after FNC1; the SSCC check digit is
        verified first. PDF labels and the GTIN, batch, quantity and ship-to fields of
        section 5.28.15 are a later slice.
      x-passage-duty: WarehouseView
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: ZPL label program
          content:
            application/zpl:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0020 shipment, FUL-0054 container not on the shipment", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0007 the stored SSCC failed its check digit", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
