openapi: 3.1.0
info:
  title: Passage Fulfillment API
  version: 1.0.0
  description: >
    Wave 28 slices 1 to 11 (the wave picker, assign and close are slice 11). Release, pick, pack and packing-slip posting;
    container types, packing rules and auto-pack; packaging materials, country
    fee rates, the statistical packaging fee and the packaging report;
    returnable transport packaging balances; partial shipments, shipment
    cancellation, the picking workbench and pick waves, carrier tracking
    events, the ASN on post, the GS1-128 container label (ZPL), the
    delivered-not-invoiced report, the SSCC register, the short picks and
    backorders report and returnable packaging aging. Carrier
    rate/label/manifest and drop-ship are later slices (see NOT-IMPLEMENTED.md).
    Errors are RFC 9457 problem details with a stable code.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Version from the ETag of the last read (shipment, or wave on the wave commands), e.g. "3".
      schema: { type: string }
    ShipmentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PackingSlipId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DropShipId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ManifestId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LegalEntityId:
      name: legalEntityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WaveId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details (application/problem+json).
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: "https://passage.dev/problems/FUL-0051" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    Decimal:
      type: string
      description: Decimal as a string; quantities and costs keep at most 6 decimals.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    ShipmentStatus:
      type: string
      description: >
        BR-28.6. PARTIALLY_SHIPPED: a slip posted while a planned remainder is left;
        the remainder is re-picked from there and the shipment becomes SHIPPED when
        every line has shipped its planned quantity (FR-28.8). DELIVERED is set by a
        DELIVERED tracking event on a SHIPPED shipment.
      enum: [OPEN, RELEASED, PICKING, PICKED, PACKED, PARTIALLY_SHIPPED, SHIPPED, DELIVERED, CANCELLED]
    ShipmentSummary:
      type: object
      required: [id, shipmentNumber, status, version, lineCount]
      properties:
        id: { type: string, format: uuid }
        shipmentNumber: { type: string, example: "SH-0000001" }
        legalEntityId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ShipmentStatus" }
        plannedShipDate: { type: string, format: date-time }
        actualShipDate: { type: [string, "null"], format: date-time }
        carrierCode: { type: [string, "null"] }
        version: { type: integer, minimum: 1 }
        lineCount: { type: integer }
    PackingSlipSummary:
      type: object
      required: [id, packingSlipNumber, shipmentId, status, postingDate, currency, totalCost]
      properties:
        id: { type: string, format: uuid }
        packingSlipNumber: { type: string, example: "PS-0000001" }
        shipmentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, POSTED, CANCELLED, INVOICED] }
        postingDate: { type: string, format: date-time }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        totalCost: { $ref: "#/components/schemas/Decimal" }
        reversalOfId: { type: [string, "null"], format: uuid }
    JournalEntry:
      type: object
      description: Signed journal line; debits positive, credits negative (BR-28.1).
      required: [account, amount, currency, orderLineId]
      properties:
        account: { type: string, example: "1405" }
        amount: { $ref: "#/components/schemas/Decimal" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        orderLineId: { type: string, format: uuid }
    Shipment:
      type: object
      required: [id, shipmentNumber, status, version, lines, containers]
      properties:
        id: { type: string, format: uuid }
        shipmentNumber: { type: string, example: "SH-0000001" }
        legalEntityId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ShipmentStatus" }
        plannedShipDate: { type: string, format: date-time }
        actualShipDate: { type: [string, "null"], format: date-time, description: "Set when the first packing slip posts; cleared when the last shipped slip is cancelled." }
        carrierCode: { type: [string, "null"], description: "The order's carrier, given at release (FR-28.13)." }
        orderType: { type: string, enum: [ORDER, JOURNAL, SUBSCRIPTION, RETURNED], description: "The sales order type at release (order.confirmed order_type). A JOURNAL order never ships: release skips it and a shipment that carries the type refuses pick, pack and post (FUL-0065)." }
        priority: { type: integer, minimum: 1, maximum: 9, description: "The order priority at release, 1 first; 5 when none was given." }
        version: { type: integer, minimum: 1 }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ShipmentLine" }
        containers:
          type: array
          items: { $ref: "#/components/schemas/Container" }
        backorderOfId: { type: [string, "null"], format: uuid, description: "The shipment this one took its quantity from (a backorder shipment)." }
        backorderId: { type: [string, "null"], format: uuid, description: "The backorder shipment that took over this shipment's closed remainder." }
    ShortPickAction:
      type: string
      enum: [KEEP_OPEN, CANCEL_REMAINDER, REMAINDER_BACKORDER]
      description: >
        What happens to the open remainder once a slip has shipped part of a shipment
        (FR-28.8): KEEP_OPEN re-picks it on the shipment, CANCEL_REMAINDER
        closes it, REMAINDER_BACKORDER (default) moves it to a new backorder shipment.
    WarehouseSetting:
      type: object
      required: [warehouseId, legalEntityId, shortPickAction, version]
      properties:
        warehouseId: { type: string, format: uuid }
        legalEntityId: { type: [string, "null"], format: uuid, description: "The legal entity the warehouse belongs to: the saved one, else the one of its short pick setting or its shipments; null when none is known." }
        shortPickAction: { $ref: "#/components/schemas/ShortPickAction" }
        version: { type: integer, minimum: 0, description: "0 when no setting is saved." }
        updatedAt: { type: [string, "null"], format: date-time }
    Exception:
      type: object
      required: [id, legalEntityId, kind, status, orderId, orderLineId, shipmentId, packingSlipId, qty, keptQty, detail, version, createdAt, resolvedAt, resolvedBy, resolutionNote]
      description: >
        A case fulfillment cannot fix alone, on the warehouse supervisor's list. It is raised
        when sales cancels the remainder of an order (order.remaindercancelled.v1) and a packing
        slip was posted beyond what the order line keeps, or packed quantity is left beyond it.
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        kind:
          type: string
          enum: [SLIP_POSTED_BEYOND_KEPT, PACKED_BEYOND_KEPT, DROPSHIP_CONFIRMED_BEYOND_KEPT]
          description: "DROPSHIP_CONFIRMED_BEYOND_KEPT: the vendor shipped more than the order line keeps before the cancellation arrived; arrange a vendor return or a new order (the booked cost is not reversed). SLIP_POSTED_BEYOND_KEPT: the goods left before the cancellation arrived; return them (wave 30) or raise a new order. PACKED_BEYOND_KEPT: packed and not posted; the post is refused (FUL-0066), unpack (which cuts the quantity above the kept one) and put the goods back."
        status: { type: string, enum: [OPEN, RESOLVED] }
        orderId: { type: string, format: uuid }
        orderLineId: { type: string, format: uuid }
        shipmentId: { type: [string, "null"], format: uuid }
        packingSlipId: { type: [string, "null"], format: uuid, description: "The latest posted slip of the order line for SLIP_POSTED_BEYOND_KEPT." }
        qty: { type: string, description: "The quantity beyond what the order line keeps." }
        keptQty: { type: string, description: "The quantity the order line keeps." }
        detail: { type: string }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }
        resolvedBy: { type: [string, "null"] }
        resolutionNote: { type: [string, "null"] }
    ReleaseRule:
      type: object
      required: [warehouseId, legalEntityId, horizonDays, requireFullAtp, waveMaxLines, waveMaxOrders, version]
      description: >
        The release and wave parameters of one warehouse (section 5.28.13). A warehouse
        without a saved rule reads the defaults at version 0: the service configuration
        for horizonDays and requireFullAtp (RELEASE_HORIZON_DAYS and
        RELEASE_REQUIRES_FULL_ATP, 2 days and full ATP unless configured), 200 lines and
        50 orders; these are the values a release run and the workbench apply to it.
      properties:
        warehouseId: { type: string, format: uuid }
        legalEntityId: { type: [string, "null"], format: uuid, description: "The legal entity the warehouse belongs to: the saved one, else the one of its short pick setting or its shipments; null when none is known." }
        horizonDays: { type: integer, minimum: 0, maximum: 30, description: "release_horizon_days: a line confirmed for a later date than today plus this is not released." }
        requireFullAtp: { type: boolean, description: "release_requires_full_atp: a line short of ATP is not released when true." }
        waveMaxLines: { type: integer, minimum: 1, maximum: 2000, description: "wave_max_lines: the picking workbench default when a call names no maxLines." }
        waveMaxOrders: { type: integer, minimum: 1, maximum: 500, description: "wave_max_orders: the picking workbench default when a call names no maxOrders." }
        version: { type: integer, minimum: 0, description: "0 when no rule is saved." }
        updatedAt: { type: [string, "null"], format: date-time }
    OperationRule:
      type: object
      required: [warehouseId, legalEntityId, postingDateSource, timeZone, autoPackEnabled, workbenchGroupKeyDefault, version]
      description: >
        The posting and packing parameters of one warehouse (section 5.28.13). A warehouse
        without a saved rule reads the defaults at version 0: MANUAL posting dates in UTC
        (what every post did before the rule existed, a deviation from the PRD's
        SHIP_TIMESTAMP default until a rule is saved), auto-pack on and CUSTOMER grouping.
      properties:
        warehouseId: { type: string, format: uuid }
        legalEntityId: { type: [string, "null"], format: uuid, description: "The legal entity the warehouse belongs to: the saved one, else the one of its other settings or its shipments; null when none is known." }
        postingDateSource: { type: string, enum: [SHIP_TIMESTAMP, TODAY, MANUAL], description: "posting_date_source: how a packing slip post gets its posting date (BR-28.3)." }
        timeZone: { type: string, description: "IANA time zone of the warehouse; SHIP_TIMESTAMP and TODAY take the day of the post in it." }
        autoPackEnabled: { type: boolean, description: "auto_pack_enabled: false refuses :auto-pack for the warehouse (FUL-0075); manual packing stays." }
        workbenchGroupKeyDefault: { type: string, enum: [CUSTOMER, CARRIER, ZONE, PRODUCT], description: "workbench_group_key_default: the picking workbench grouping when a call names no groupBy." }
        version: { type: integer, minimum: 0, description: "0 when no rule is saved." }
        updatedAt: { type: [string, "null"], format: date-time }
    DeliveryTolerance:
      type: object
      required: [id, productId, customerId, overdeliveryPct, version, updatedAt]
      description: >
        The over-delivery tolerance of one scope (BR-28.7, overdelivery_pct of section 5.27):
        the percentage of the planned quantity a pick may exceed. A pick takes the most specific
        saved scope: product and customer, then product, then customer, then the general one
        (neither named); none saved means 0.
      properties:
        id: { type: string, format: uuid }
        productId: { type: [string, "null"], format: uuid, description: "Null for every product." }
        customerId: { type: [string, "null"], format: uuid, description: "Null for every customer." }
        overdeliveryPct: { $ref: "#/components/schemas/Decimal", description: "0 to 100 with at most 4 decimals." }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    LegalEntitySetting:
      type: object
      required: [legalEntityId, cogsAtShipment, asnEnabled, version]
      properties:
        legalEntityId: { type: string, format: uuid }
        cogsAtShipment: { type: boolean, description: "The legal entity's COGS posting policy (BR-28.1): every packing slip books Dr 5000 (cost of goods sold) instead of Dr 1405 (delivered not invoiced). A post cannot override it." }
        asnEnabled: { type: boolean, description: "A post that does not name asnEnabled publishes the advance ship notice." }
        gs1CompanyPrefix: { type: [string, "null"], pattern: '^[0-9]{6,12}$', description: "The legal entity's GS1 company prefix (BR-28.5); its containers' SSCCs are issued under it. Null takes the process default." }
        ssccExtensionDigit: { type: [integer, "null"], minimum: 0, maximum: 9, description: "The SSCC extension digit; null takes the process default." }
        packagingFeeBillable: { type: boolean, description: "Packing slips posted from now on tell billing to charge their packaging fee lines (BR-28.12)." }
        rtpTrackingEnabled: { type: boolean, description: "Packing slips posted from now on raise the customers' returnable packaging balances (BR-28.13). True when none is saved, which is what every slip did before the setting; the PRD default is false." }
        rtpChargeDays: { type: integer, minimum: 30, maximum: 365, description: "Days after which an outstanding returnable balance of this legal entity is chargeable (FR-28.16); 90 when none is saved." }
        version: { type: integer, minimum: 0, description: "0 when no setting is saved (flags false, GS1 prefix and extension digit null)." }
        updatedAt: { type: [string, "null"], format: date-time }
    ManifestParcel:
      type: object
      required: [shipmentId, shipmentNumber, orderId, trackingNumber, active]
      description: One labelled parcel (a shipment and a carrier tracking number) on a carrier manifest. Active is false once the manifest is cancelled.
      properties:
        shipmentId: { type: string, format: uuid }
        shipmentNumber: { type: string }
        orderId: { type: string, format: uuid }
        trackingNumber: { type: string }
        active: { type: boolean }
    Manifest:
      type: object
      required: [id, manifestNumber, status, legalEntityId, warehouseId, carrier, pickupDate, parcelCount, shipmentCount, parcels, version, createdAt]
      description: >
        A carrier manifest (FR-28.6): the end-of-day close-out of the labelled parcels one carrier
        collects from one warehouse, so the carrier takes exactly what the warehouse hands over.
        CLOSED until cancelled; cancelling frees its parcels for the next manifest.
      properties:
        id: { type: string, format: uuid }
        manifestNumber: { type: string, description: "MF- number, gap-free per legal entity." }
        status: { type: string, enum: [CLOSED, CANCELLED] }
        legalEntityId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        carrier: { type: string, pattern: "^[a-z0-9-]{2,32}$", description: "Carrier code, as on the label's tracking event." }
        pickupDate: { type: string, format: date }
        providerManifestId: { type: [string, "null"], description: "The carrier's own manifest reference when the caller has one." }
        parcelCount: { type: integer, minimum: 1 }
        shipmentCount: { type: integer, minimum: 1 }
        parcels:
          type: array
          description: "The parcels on the manifest. Returned by the read and the close, empty in the list."
          items: { $ref: "#/components/schemas/ManifestParcel" }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
    ManifestCandidate:
      type: object
      required: [shipmentId, shipmentNumber, legalEntityId, warehouseId, orderId, shipmentStatus, carrier, trackingNumber, labelledAt, ready]
      description: >
        A labelled parcel that is on no active manifest. Ready is true when its shipment has shipped
        (a packing slip posted), so it goes on the next manifest; a parcel that is not ready waits
        for its packing slip and is left out.
      properties:
        shipmentId: { type: string, format: uuid }
        shipmentNumber: { type: string }
        legalEntityId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        shipmentStatus: { type: string }
        carrier: { type: string }
        trackingNumber: { type: string }
        labelledAt: { type: string, format: date-time }
        ready: { type: boolean }
    DropShip:
      type: object
      required: [id, dropShipNumber, status, legalEntityId, orderId, orderLineId, customerId, productId, unit, qty, qtyConfirmed, qtyClosed, qtyOpen, vendorId, purchaseOrderId, purchaseOrderLineId, unitCost, currency, journal, version]
      description: >
        A sales order line fulfilled by a vendor straight to the customer, linked to its purchase
        order line (FR-28.7). OPEN until the vendor confirms; PARTIALLY_CONFIRMED while the vendor
        has shipped part of the quantity and some is still open; CONFIRMED once all of it is
        confirmed or closed; CANCELLED books nothing. Each vendor confirmation books its own
        journal at the purchase order cost.
      properties:
        id: { type: string, format: uuid }
        dropShipNumber: { type: string, description: "DS- number, gap-free per legal entity." }
        status: { type: string, enum: [OPEN, PARTIALLY_CONFIRMED, CONFIRMED, CANCELLED] }
        legalEntityId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderLineId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        unit: { type: string }
        qty: { type: string, description: "Ordered quantity, decimal string." }
        qtyConfirmed: { type: string, description: "Quantity the vendor has shipped and confirmed so far." }
        qtyClosed: { type: string, description: "Quantity closed without shipping: by close-remainder, or when sales cancelled the remainder of the order (an OPEN or PARTIALLY_CONFIRMED drop-ship then stays in its status with less open)." }
        qtyOpen: { type: string, description: "Quantity the vendor still has to ship or close: qty less qtyConfirmed less qtyClosed; 0 once CONFIRMED or CANCELLED." }
        vendorId: { type: string, format: uuid }
        purchaseOrderId: { type: string, format: uuid }
        purchaseOrderLineId: { type: string, format: uuid }
        unitCost: { type: string, description: "Purchase order cost per unit, decimal string." }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        vendorShipmentRef: { type: [string, "null"], description: "The vendor's shipment or tracking reference of the latest confirmation." }
        shippedOn: { type: [string, "null"], format: date, description: "Ship date of the latest confirmation." }
        postingDate: { type: [string, "null"], format: date, description: "The day the latest confirmation was booked; null until confirmed." }
        journal:
          type: array
          description: "Dr 5000 / Cr 2110 at the purchase order cost of every confirmation so far (debits positive, credits negative); empty before the first."
          items: { $ref: "#/components/schemas/DropShipJournalEntry" }
        confirmations:
          type: array
          description: "The vendor's shipments in order with the journal each booked. Returned by the read, empty in the list."
          items:
            type: object
            required: [seq, qty, shippedOn, postingDate, journal, createdAt]
            properties:
              seq: { type: integer, minimum: 1 }
              qty: { type: string, description: "Quantity of this vendor shipment." }
              vendorShipmentRef: { type: [string, "null"] }
              shippedOn: { type: string, format: date-time }
              postingDate: { type: string, format: date-time }
              journal: { type: array, items: { $ref: "#/components/schemas/DropShipJournalEntry" } }
              createdAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    DropShipJournalEntry:
      type: object
      required: [account, amount, currency, orderLineId]
      description: A journal line of a drop-ship confirmation; debits are positive, credits negative.
      properties: { account: { type: string }, amount: { type: string }, currency: { type: string }, orderLineId: { type: string, format: uuid } }
    ShipmentLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderLineId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        unit: { type: string }
        qtyPlanned: { $ref: "#/components/schemas/Decimal" }
        qtyPicked: { $ref: "#/components/schemas/Decimal" }
        qtyPacked: { $ref: "#/components/schemas/Decimal" }
        qtyShipped: { $ref: "#/components/schemas/Decimal" }
        qtyClosed: { $ref: "#/components/schemas/Decimal", description: "Planned quantity given up when the remainder was closed (FR-28.8); the line then plans what shipped." }
        pickConfirmed: { type: boolean }
        zone: { type: [string, "null"], description: "Pick zone, given at release (FR-28.13)." }
        shortPickReason: { type: [string, "null"], enum: [OUT_OF_STOCK, DAMAGED, NOT_FOUND, QUALITY_HOLD, OTHER, null], description: "Reason given for the latest short pick, if any." }
        trackingRequired: { type: boolean, description: "The product carries a batch or serial tracking dimension (BR-28.10); the slip cannot post until the quantity it ships is covered by tracking entries (FUL-0006)." }
        overTolerancePct: { $ref: "#/components/schemas/Decimal", description: "Over-delivery tolerance in percent of the planned quantity in force when the pick was last confirmed (BR-28.7); qtyPicked may exceed qtyPlanned by up to that much. 0 when none applies." }
        partial: { type: boolean, description: "Released for less than the order line quantity because ATP was short (release_requires_full_atp false); a later release run releases the open remainder." }
        tracking:
          type: array
          description: Batch, serial and location entries captured at pick, oldest first.
          items: { $ref: "#/components/schemas/TrackingEntry" }
    TrackingEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        batchNo: { type: [string, "null"] }
        serialNo: { type: [string, "null"], description: "A serial entry is one unit; the serial is unique per product while its shipment is live." }
        locationCode: { type: [string, "null"] }
        qty: { $ref: "#/components/schemas/Decimal" }
        packingSlipId: { type: [string, "null"], format: uuid, description: "The packing slip the quantity shipped on; null until it ships." }
    Container:
      type: object
      properties:
        id: { type: string, format: uuid }
        containerType: { type: string }
        sscc: { type: string, pattern: '^[0-9]{18}$', description: "SSCC-18 with a valid GS1 mod-10 check digit." }
        status: { type: string, enum: [OPEN, CLOSED, SHIPPED] }
        parentContainerId: { type: [string, "null"], format: uuid, description: "The pallet this carton sits on; null for a top-level container." }
        childContainerIds: { type: array, items: { type: string, format: uuid }, description: "The cartons on this pallet; empty for a carton. A pallet holds no lines of its own." }
        tareKg: { $ref: "#/components/schemas/Decimal" }
        grossKg: { $ref: "#/components/schemas/Decimal", description: "Tare plus the packed units at the unit weights given to auto-pack; the tare alone for a manual pack." }
        returnable: { type: boolean, description: "Copied from the container type when packed; returnable containers count toward the customer's balance on post." }
        packagingMaterial: { type: [string, "null"] }
        packingSlipId: { type: [string, "null"], format: uuid, description: "The packing slip the container shipped with; null while CLOSED." }
        lines:
          type: array
          items:
            type: object
            properties:
              shipmentLineId: { type: string, format: uuid }
              qty: { $ref: "#/components/schemas/Decimal" }
    PackingSlip:
      type: object
      properties:
        id: { type: string, format: uuid }
        packingSlipNumber: { type: string, example: "PS-0000001" }
        shipmentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, POSTED, CANCELLED, INVOICED] }
        postingDate: { type: string, format: date-time }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        totalCost: { $ref: "#/components/schemas/Decimal" }
        reversalOfId: { type: [string, "null"], format: uuid, description: "Set on a reversing slip; names the slip it cancels." }
        packagingFeeBillable: { type: boolean, description: "The legal entity's packaging_fee_billable when the slip posted (BR-28.12); a reversing slip repeats the original's." }
        rtpTracked: { type: boolean, description: "The legal entity's rtp_tracking_enabled when the slip posted: false means it raised no returnable balance and cancelling it lowers none; a reversing slip repeats the original's." }
        lines:
          type: array
          description: On a reversing slip quantities and costs are negative.
          items:
            type: object
            properties:
              orderLineId: { type: string, format: uuid }
              shipmentLineId: { type: string, format: uuid }
              qty: { $ref: "#/components/schemas/Decimal" }
              costAmount: { $ref: "#/components/schemas/Decimal" }
              costSnapshotId: { type: string }
              weight: { $ref: "#/components/schemas/Decimal", description: "Catch-weight lines only (#480): the shipped weight costAmount is taken on; qty stays the cases." }
        journal:
          type: array
          items: { $ref: "#/components/schemas/JournalEntry" }
        packagingFees:
          type: array
          description: Statistical packaging fee lines (BR-28.12); not journal lines. Negative on a reversing slip.
          items: { $ref: "#/components/schemas/PackagingFeeLine" }
        remainderAction: { type: string, enum: [CANCEL_REMAINDER, REMAINDER_BACKORDER], description: "On the post response only: the warehouse's short pick action closed or moved the shipment's open remainder." }
        backorderShipmentId: { type: string, format: uuid, description: "On the post response only, with REMAINDER_BACKORDER: the new shipment." }
    PackagingFeeLine:
      type: object
      required: [countryCode, period, materialCode, weightKg, ratePerKg, feeAmount, currency]
      properties:
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        period: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        materialCode: { type: string }
        weightKg: { $ref: "#/components/schemas/Decimal" }
        ratePerKg: { $ref: "#/components/schemas/Decimal" }
        feeAmount: { $ref: "#/components/schemas/Decimal", description: "Weight × rate, rounded half-even to the currency's minor unit." }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    ContainerType:
      type: object
      required: [code, tareKg, returnable, packagingMaterial]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
        tareKg: { $ref: "#/components/schemas/Decimal" }
        returnable: { type: boolean }
        packagingMaterial: { type: [string, "null"], pattern: '^[A-Za-z0-9_.-]{1,32}$' }
    PackingRule:
      type: object
      required: [id, productId, customerId, containerType, qtyPerContainer, maxWeightKg]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        customerId: { type: [string, "null"], format: uuid, description: "Null is the product's general rule; a customer rule wins over it." }
        containerType: { type: string }
        qtyPerContainer: { $ref: "#/components/schemas/Decimal" }
        maxWeightKg: { $ref: "#/components/schemas/Decimal" }
    ProductPackaging:
      type: object
      required: [productId, materialCode, weightPerUnitKg]
      properties:
        productId: { type: string, format: uuid }
        materialCode: { type: string, pattern: '^[A-Za-z0-9_.-]{1,32}$' }
        weightPerUnitKg: { $ref: "#/components/schemas/Decimal" }
    FeeRate:
      type: object
      required: [countryCode, materialCode, currency, ratePerKg, validFrom]
      properties:
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        materialCode: { type: string, pattern: '^[A-Za-z0-9_.-]{1,32}$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        ratePerKg: { $ref: "#/components/schemas/Decimal" }
        validFrom: { type: string, format: date }
    ReturnableBalance:
      type: object
      required: [customerId, containerType, balance, lastShippedAt, lastReturnedAt]
      properties:
        customerId: { type: string, format: uuid }
        containerType: { type: string }
        balance: { $ref: "#/components/schemas/Decimal" }
        lastShippedAt: { type: [string, "null"], format: date-time }
        lastReturnedAt: { type: [string, "null"], format: date-time }
    ReturnableMovementKind:
      type: string
      enum: [SHIPPED, SHIPMENT_CANCELLED, RETURNED, ADJUSTED]
    ReturnableMovement:
      type: object
      required: [id, customerId, containerType, kind, qty, balanceAfter, reference, reason, actor, createdAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        containerType: { type: string }
        kind: { $ref: "#/components/schemas/ReturnableMovementKind" }
        qty: { $ref: "#/components/schemas/Decimal" }
        balanceAfter: { $ref: "#/components/schemas/Decimal" }
        reference: { type: [string, "null"], description: "Packing slip id of SHIPPED and SHIPMENT_CANCELLED, or the caller's own reference." }
        reason: { type: [string, "null"] }
        actor: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    WaveShipment:
      type: object
      required: [id, shipmentNumber, orderId, customerId, status, plannedShipDate, lineCount]
      properties:
        id: { type: string, format: uuid }
        shipmentNumber: { type: string }
        orderId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ShipmentStatus" }
        carrierCode: { type: [string, "null"] }
        plannedShipDate: { type: string, format: date-time }
        lineCount: { type: integer, description: Lines of the shipment in the wave. }
    WavePlan:
      type: object
      required: [groupKey, legalEntityId, lineCount, orderCount, shipments]
      properties:
        groupKey: { type: string, description: "Value of the group key; UNASSIGNED when the shipments have none." }
        legalEntityId: { type: string, format: uuid }
        lineCount: { type: integer }
        orderCount: { type: integer }
        shipments:
          type: array
          items: { $ref: "#/components/schemas/WaveShipment" }
    WaveSummary:
      type: object
      required: [id, waveNumber, legalEntityId, warehouseId, groupBy, groupKey, status, lineCount, orderCount, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        waveNumber: { type: string, example: "WV-0000001" }
        legalEntityId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        groupBy: { type: string, enum: [CUSTOMER, CARRIER, ZONE, PRODUCT] }
        groupKey: { type: string }
        status: { type: string, enum: [OPEN, CLOSED] }
        lineCount: { type: integer }
        orderCount: { type: integer }
        createdAt: { type: string, format: date-time }
        version: { type: integer, description: Wave version for If-Match on assign and close; also the ETag. }
        picker: { type: [string, "null"], description: The picker the wave is assigned to; null until assigned. }
        assignedAt: { type: [string, "null"], format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
    Wave:
      allOf:
        - { $ref: "#/components/schemas/WaveSummary" }
        - type: object
          required: [shipments]
          properties:
            shipments:
              type: array
              items: { $ref: "#/components/schemas/WaveShipment" }
            lines:
              type: array
              description: The wave's shipment lines with their pick state; returned by the wave detail.
              items:
                type: object
                required: [shipmentLineId, shipmentId, shipmentNumber, productId, unit, qtyPlanned, qtyPicked, pickConfirmed]
                properties:
                  shipmentLineId: { type: string, format: uuid }
                  shipmentId: { type: string, format: uuid }
                  shipmentNumber: { type: string }
                  productId: { type: string, format: uuid }
                  unit: { type: string }
                  zone: { type: [string, "null"] }
                  qtyPlanned: { $ref: "#/components/schemas/Decimal" }
                  qtyPicked: { $ref: "#/components/schemas/Decimal" }
                  pickConfirmed: { type: boolean }
                  shortPickReason: { type: [string, "null"], enum: [OUT_OF_STOCK, DAMAGED, NOT_FOUND, QUALITY_HOLD, OTHER, null] }
    WorkbenchRequest:
      type: object
      required: [warehouseId]
      additionalProperties: false
      description: Filter of RELEASED shipments, group key and wave limits (FR-28.13). Empty filters match all.
      properties:
        warehouseId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        carrier: { type: string, pattern: '^[A-Za-z0-9_.-]{1,32}$' }
        zone: { type: string, pattern: '^[A-Za-z0-9_.-]{1,32}$', description: Shipments with a line in this pick zone. }
        shipFrom: { type: string, format: date }
        shipTo: { type: string, format: date }
        groupBy: { type: string, enum: [CUSTOMER, CARRIER, ZONE, PRODUCT], default: CUSTOMER }
        maxLines: { type: integer, minimum: 1, maximum: 2000, default: 200, description: WAVE_MAX_LINES }
        maxOrders: { type: integer, minimum: 1, maximum: 500, default: 50, description: WAVE_MAX_ORDERS }
    CarrierAddress:
      type: object
      required: [street1, city, postalCode, country]
      properties:
        name: { type: string, maxLength: 60 }
        street1: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 60 }
        postalCode: { type: string, maxLength: 16 }
        state: { type: string, maxLength: 3 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
    CarrierShipment:
      type: object
      required: [shipFrom, shipTo, parcels]
      properties:
        shipFrom: { $ref: "#/components/schemas/CarrierAddress" }
        shipTo: { $ref: "#/components/schemas/CarrierAddress" }
        parcels:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [weightKg, lengthCm, widthCm, heightCm]
            properties:
              weightKg: { type: string, description: "decimal, at most 3 places, above 0, at most 1000" }
              lengthCm: { type: string, description: "decimal, at most 1 place, above 0, at most 300" }
              widthCm: { type: string }
              heightCm: { type: string }
    CarrierRate:
      type: object
      properties:
        carrier: { type: string }
        service: { type: string }
        amount: { type: string }
        currency: { type: string }
        transitDays: { type: integer }
        billableWeightKg: { type: string }
    CarrierLabel:
      type: object
      properties:
        carrier: { type: string }
        service: { type: string }
        trackingNumber: { type: string }
        amount: { type: string }
        currency: { type: string }
        format: { type: string, enum: [ZPL] }
        document: { type: string, format: byte, description: the label, base64 }
        createdAt: { type: string, format: date-time }
        created: { type: boolean }
        trackingEvent: { $ref: "#/components/schemas/TrackingEvent" }
    TrackingEvent:
      type: object
      required: [provider, eventKey, trackingNumber, status, description, eventTime]
      properties:
        provider: { type: string, pattern: '^[a-z0-9-]{2,32}$', example: easypost }
        eventKey: { type: string, maxLength: 128, description: "The provider's event id; one event per shipment, provider and key." }
        trackingNumber: { type: string, maxLength: 64 }
        status: { type: string, enum: [QUOTED, LABELLED, MANIFESTED, IN_TRANSIT, DELIVERED, EXCEPTION] }
        description: { type: string, maxLength: 500 }
        eventTime: { type: string, format: date-time }
  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
paths:
  /v1/fulfillment/releases:run:
    post:
      operationId: runRelease
      summary: Run release rules for a warehouse (FR-28.1)
      description: >
        Applies the release rules to the confirmed order lines the caller offers and creates one
        shipment per order, warehouse and ship date, higher priority orders first. A line is skipped
        with its reason when it is held, beyond the horizon, short of ATP, of a JOURNAL order
        (never ships), already released or drop-shipped. With requireFullAtp false a line above its
        atpQty is released for the ATP it has and flagged partial; a later run releases the rest.
        A line whose remainder sales cancelled (order.remaindercancelled) is released only up to the
        quantity it keeps beyond its live shipments and drop-ship, not flagged partial for the cut, and
        skipped as order_remainder_cancelled when nothing of it is left to release.
      x-passage-duty: fulfillment.warehouse.release
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, lines]
              additionalProperties: false
              properties:
                warehouseId: { type: string, format: uuid }
                horizonDays: { type: integer, minimum: 0, maximum: 30 }
                requireFullAtp: { type: boolean }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [orderId, orderLineId, customerId, legalEntityId, productId, unit, qty, confirmedShipDate]
                    properties:
                      orderId: { type: string, format: uuid }
                      orderLineId: { type: string, format: uuid }
                      customerId: { type: string, format: uuid }
                      legalEntityId: { type: string, format: uuid }
                      productId: { type: string, format: uuid }
                      unit: { type: string, maxLength: 8 }
                      qty: { $ref: "#/components/schemas/Decimal" }
                      confirmedShipDate: { type: string, format: date }
                      atpOk: { type: boolean }
                      held: { type: boolean }
                      carrierCode: { type: string, pattern: '^[A-Za-z0-9_.-]{1,32}$', description: "The order's carrier; every line of one order names the same one." }
                      zone: { type: string, pattern: '^[A-Za-z0-9_.-]{1,32}$', description: The line's pick zone. }
                      trackingRequired: { type: boolean, description: "The product is batch or serial tracked (BR-28.10)." }
                      orderType: { type: string, enum: [ORDER, JOURNAL, SUBSCRIPTION, RETURNED], description: "order_type of order.confirmed; ORDER when left out. A JOURNAL order never ships, so its lines are skipped (journal_order). Every line of one order names the same type. The type fulfillment stored from sales' order.confirmed.v1 replaces this value, except that JOURNAL from either side wins." }
                      priority: { type: integer, minimum: 1, maximum: 9, description: "The order priority, 1 first; 5 when left out. Shipments of higher priority orders are created first. Every line of one order names the same one." }
                      atpQty: { $ref: "#/components/schemas/Decimal", description: "Quantity available to promise now, 0 or more. When requireFullAtp is false (request or warehouse rule) and it is below qty, the line is released for atpQty, flagged partial, and a later run releases what is still open; with requireFullAtp true a line above its atpQty is skipped as atp_short. Without atpQty only atpOk decides." }
      responses:
        "201":
          description: Shipments created (one per order, warehouse and ship date) and lines skipped
          content:
            application/json:
              schema:
                type: object
                properties:
                  shipments:
                    type: array
                    items: { $ref: "#/components/schemas/Shipment" }
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        orderLineId: { type: string, format: uuid }
                        reason: { type: string, enum: [held, beyond_horizon, atp_short, non_positive_qty, already_released, drop_ship, journal_order, order_remainder_cancelled] }
        "400": { description: "FUL-0050 validation (also a repeated orderLineId, or lines of one order with different customers, legal entities or carriers), FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { description: "idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments:
    get:
      operationId: listShipments
      summary: Shipments list / delivery monitor, newest first
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ShipmentStatus" } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: orderId, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Shipments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ShipmentSummary" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/packing-slips:
    get:
      operationId: listPackingSlips
      summary: Packing slip journal, newest first
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: shipmentId, in: query, schema: { type: string, format: uuid } }
        - { name: orderId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, POSTED, CANCELLED, INVOICED] } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Packing slips
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PackingSlipSummary" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/packing-slips/{id}:
    get:
      operationId: getPackingSlip
      summary: Read a packing slip with its lines and journal
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { $ref: "#/components/parameters/PackingSlipId" }
      responses:
        "200":
          description: Packing slip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackingSlip" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0040, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}:
    get:
      operationId: getShipment
      summary: Read a shipment (ETag carries the version)
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
      responses:
        "200":
          description: Shipment
          headers:
            ETag: { schema: { type: string }, description: 'Quoted shipment version, e.g. "3"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/shipments/{id}:confirm-pick:
    post:
      operationId: confirmPick
      summary: Confirm picked quantities; short picks release the remainder (FR-28.2)
      x-passage-duty: fulfillment.warehouse.pick
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [picks]
              additionalProperties: false
              properties:
                picks:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [shipmentLineId, picked]
                    properties:
                      shipmentLineId: { type: string, format: uuid }
                      picked: { $ref: "#/components/schemas/Decimal" }
                      reason: { type: string, enum: [OUT_OF_STOCK, DAMAGED, NOT_FOUND, QUALITY_HOLD, OTHER], description: "Why the line was picked short; only valid when picked is below plan." }
      responses:
        "200":
          description: Updated shipment
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0020 shipment or FUL-0041 line not found", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: FUL-0021 invalid move, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0001 status, FUL-0065 a JOURNAL order, FUL-0004 over-pick (no tolerance applies), FUL-0005 above the planned quantity plus the over-delivery tolerance, FUL-0066 above plan beyond the quantity the order line keeps after sales cancelled the remainder, FUL-0030 negative, FUL-0035 below the captured batch and serial entries, idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}/containers:
    post:
      operationId: packContainer
      summary: Pack lines into a container with an SSCC (FR-28.3)
      x-passage-duty: fulfillment.warehouse.pack
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [containerType, lines]
              additionalProperties: false
              properties:
                containerType: { type: string, maxLength: 64 }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [shipmentLineId, qty]
                    properties:
                      shipmentLineId: { type: string, format: uuid }
                      qty: { $ref: "#/components/schemas/Decimal" }
      responses:
        "201":
          description: Container closed with SSCC and the updated shipment
          content:
            application/json:
              schema:
                type: object
                properties:
                  container: { $ref: "#/components/schemas/Container" }
                  shipment: { $ref: "#/components/schemas/Shipment" }
          headers:
            ETag: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0020 shipment or FUL-0041 line not found", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0001 status, FUL-0065 a JOURNAL order, FUL-0023 over-pack, FUL-0050 the serial references of the GS1 company prefix are used up, FUL-0007 the SSCC was issued before (nested prefixes), idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}:post-packing-slip:
    post:
      operationId: postPackingSlip
      summary: Post the packing slip; journal per BR-28.1 and packingslip.posted in one transaction (FR-28.4)
      description: >
        Posts every packed, not yet shipped quantity of a PACKED shipment and marks the
        closed containers SHIPPED with this slip. The shipment becomes SHIPPED, or
        PARTIALLY_SHIPPED while a planned remainder is left (FR-28.8). The inventory
        issue and the ledger posting are made by their owners from the
        packingslip.posted event (see NOT-IMPLEMENTED.md). With asnEnabled the
        asn.issued event lists the containers of this slip (FR-28.9). The posting date
        follows the warehouse's operation rule (BR-28.3): MANUAL takes postingDate,
        SHIP_TIMESTAMP the day of the post in the warehouse time zone, TODAY the same day
        unless postingDate names another. The operation rule applies only when it was
        saved under the shipment's legal entity; otherwise the post is MANUAL.
      x-passage-duty: fulfillment.packing-slip.post
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, costs]
              additionalProperties: false
              properties:
                postingDate: { type: string, format: date, description: "Required when the warehouse's posting_date_source is MANUAL (the default of a warehouse with no operation rule). For TODAY it is optional and overrides the day of the post in the warehouse time zone. For SHIP_TIMESTAMP omit it: the service derives the date from the post (BR-28.3); a date that differs from the derived one is refused with FUL-0074." }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                cogsAtShipment: { type: boolean, description: "Dr 5000 instead of Dr 1405. This is the legal entity's cogs_at_shipment policy (false when none is saved): omit it, or name the same value; another value is refused with FUL-0059." }
                countryCode: { type: string, pattern: '^[A-Z]{2}$', description: "Ship-to country whose packaging fee rates apply (FR-28.14). Omit to post no packaging fee." }
                asnEnabled: { type: boolean, description: "Publish dev.passage.fulfillment.asn.issued.v1 for this slip (FR-28.9). Omit to take the legal entity setting (false when none is saved)." }
                costs:
                  type: array
                  items:
                    type: object
                    required: [shipmentLineId, unitCost, costSnapshotId]
                    properties:
                      shipmentLineId: { type: string, format: uuid }
                      unitCost: { $ref: "#/components/schemas/Decimal" }
                      costSnapshotId: { type: string, maxLength: 128 }
                      weight: { type: string, description: "Catch-weight lines only (FR-24.7, #480): the shipped weight in the product's inventory weight unit, a positive decimal with at most 6 decimals. unitCost is then per weight unit and the line costs weight x unitCost (the inventory quantity is the weight; qty stays the cases)." }
      responses:
        "201":
          description: Packing slip POSTED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackingSlip" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0020, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0001 not PACKED or the order has an active hold (sales orderhold.applied.v1 without its release), FUL-0065 a JOURNAL order (the shipment's type or the type stored from sales' order.confirmed.v1), FUL-0066 the post would ship more of an order line than sales kept when it cancelled the remainder (order.remaindercancelled.v1), FUL-0006 a tracking-required line's open batch and serial entries do not cover exactly the quantity it ships, FUL-0014 packaging fee rate missing for a shipped material, FUL-0042 cost missing, FUL-0044 nothing to ship, FUL-0059 cogsAtShipment contradicts the legal entity's cogs_at_shipment policy, FUL-0074 postingDate contradicts the warehouse's posting_date_source, idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/packing-slips/{id}:cancel:
    post:
      operationId: cancelPackingSlip
      summary: Reverse a packing slip with mirror inventory and journal entries (FR-28.5)
      x-passage-duty: fulfillment.packing-slip.post
      parameters:
        - { $ref: "#/components/parameters/PackingSlipId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201":
          description: Reversing packing slip (reversalOfId names the cancelled slip)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackingSlip" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0040, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "FUL-0010 invoiced, FUL-0043 not posted or a reversal, FUL-0021 shipment cannot return to PACKED (for example while its remainder is being picked)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0015 the customer already returned the slip's returnable containers, idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/container-types:
    get:
      operationId: listContainerTypes
      summary: Container types by code (FR-28.14, FR-28.15)
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ContainerType" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: saveContainerType
      summary: Create or replace a container type; packed containers keep the values they were packed with
      x-passage-duty: fulfillment.packing-rule.maintain
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, tareKg]
              additionalProperties: false
              properties:
                code: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
                tareKg: { $ref: "#/components/schemas/Decimal" }
                returnable: { type: boolean, default: false }
                packagingMaterial: { type: [string, "null"], pattern: '^[A-Za-z0-9_.-]{1,32}$' }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerType" }
        "400": { description: "FUL-0050 validation, FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { description: idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/packing-rules:
    get:
      operationId: listPackingRules
      summary: Packing rules, general rule of a product first (FR-28.15)
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PackingRule" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: savePackingRule
      summary: Create the rule of a product and customer scope, or replace it (keeps its id)
      x-passage-duty: fulfillment.packing-rule.maintain
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, containerType, qtyPerContainer, maxWeightKg]
              additionalProperties: false
              properties:
                productId: { type: string, format: uuid }
                customerId: { type: [string, "null"], format: uuid, description: "Omit, null or empty for the product's general rule." }
                containerType: { type: string, description: "Code of an existing container type." }
                qtyPerContainer: { $ref: "#/components/schemas/Decimal" }
                maxWeightKg: { $ref: "#/components/schemas/Decimal" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackingRule" }
        "400": { description: "FUL-0050 validation, FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { description: "FUL-0050 containerType is not a known container type, idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/product-packaging:
    get:
      operationId: listProductPackaging
      summary: Packaging material weight per product unit (FR-28.14)
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProductPackaging" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: saveProductPackaging
      summary: Set the weight of a packaging material per unit of a product (0 stops it counting)
      x-passage-duty: fulfillment.packing-rule.maintain
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, materialCode, weightPerUnitKg]
              additionalProperties: false
              properties:
                productId: { type: string, format: uuid }
                materialCode: { type: string, pattern: '^[A-Za-z0-9_.-]{1,32}$' }
                weightPerUnitKg: { $ref: "#/components/schemas/Decimal" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPackaging" }
        "400": { description: "FUL-0050 validation, FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { description: idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}:auto-pack:
    post:
      operationId: autoPack
      summary: Auto-pack picked lines into containers by packing rule (FR-28.15, BR-28.11)
      description: >
        Fills containers line by line, most specific rule first, and closes a container
        when its quantity per container or max weight is reached. Each container gets an
        SSCC. Lines without a rule stay unpacked with a FUL-0012 warning. When nothing is
        packed the shipment and its version are unchanged. A warehouse whose operation rule
        turned auto_pack_enabled off refuses it with FUL-0075.
      x-passage-duty: fulfillment.warehouse.pack
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                unitWeights:
                  type: object
                  description: Unit weight in kg per shipment line id; a line without one is limited by quantity only.
                  additionalProperties: { $ref: "#/components/schemas/Decimal" }
      responses:
        "201":
          description: Containers created, the updated shipment and the lines left unpacked
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [shipment, containers, unpackedLineIds, warnings]
                properties:
                  shipment: { $ref: "#/components/schemas/Shipment" }
                  containers:
                    type: array
                    items: { $ref: "#/components/schemas/Container" }
                  unpackedLineIds:
                    type: array
                    items: { type: string, format: uuid }
                  warnings:
                    type: array
                    items:
                      type: object
                      required: [code, shipmentLineId, productId, message]
                      properties:
                        code: { type: string, example: FUL-0012 }
                        shipmentLineId: { type: string, format: uuid }
                        productId: { type: string, format: uuid }
                        message: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0020 shipment not found, FUL-0041 a unit weight names a line not on the shipment", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0075 auto-pack is turned off for the warehouse, FUL-0001 status, FUL-0065 a JOURNAL order, FUL-0013 one unit exceeds the rule's max weight, FUL-0050 the serial references of the GS1 company prefix are used up, FUL-0007 the SSCC was issued before (nested prefixes), idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/packaging-fee-rates:
    get:
      operationId: listFeeRates
      summary: Packaging fee rates per country and material, newest first (FR-28.14)
      x-passage-duty: fulfillment.packaging-fee.maintain
      parameters:
        - { name: countryCode, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FeeRate" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: saveFeeRate
      summary: Create or replace the fee rate of a country and material valid from a date
      x-passage-duty: fulfillment.packaging-fee.maintain
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countryCode, materialCode, currency, ratePerKg, validFrom]
              additionalProperties: false
              properties:
                countryCode: { type: string, pattern: '^[A-Z]{2}$' }
                materialCode: { type: string, pattern: '^[A-Za-z0-9_.-]{1,32}$' }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                ratePerKg: { $ref: "#/components/schemas/Decimal" }
                validFrom: { type: string, format: date }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeRate" }
        "400": { description: "FUL-0050 validation, FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { description: idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/packaging-report:
    get:
      operationId: packagingReport
      summary: Packaging weight and fee per material for a country and month, net of reversals (section 5.28.14)
      x-passage-duty: fulfillment.packaging-fee.maintain
      parameters:
        - { name: countryCode, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Report rows
          content:
            application/json:
              schema:
                type: object
                required: [countryCode, period, legalEntityId, items]
                properties:
                  countryCode: { type: string }
                  period: { type: string }
                  legalEntityId: { type: [string, "null"], format: uuid }
                  items:
                    type: array
                    items:
                      type: object
                      required: [materialCode, weightKg, feeAmount, currency]
                      properties:
                        materialCode: { type: string }
                        weightKg: { $ref: "#/components/schemas/Decimal" }
                        feeAmount: { $ref: "#/components/schemas/Decimal" }
                        currency: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/delivered-not-invoiced:
    get:
      operationId: deliveredNotInvoiced
      summary: Delivered-not-invoiced report, the open GL 1405 balance per currency and its packing slips (FR-28.12, section 5.28.14)
      description: >-
        A slip counts while its Dr 1405 is not reversed by a cancellation dated on or before asOf and it is not INVOICED.
        Slips posted with cogsAtShipment carry no 1405 line and never appear. totals cover all lineCount slips;
        lines holds at most limit of them, oldest posting date first.
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, description: "Report date (YYYY-MM-DD, UTC); default today.", schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: object
                required: [legalEntityId, customerId, asOf, account, totals, lineCount, lines]
                properties:
                  legalEntityId: { type: string, format: uuid }
                  customerId: { type: [string, "null"], format: uuid }
                  asOf: { type: string, format: date }
                  account: { type: string, example: "1405" }
                  totals:
                    type: array
                    items:
                      type: object
                      required: [currency, count, amount]
                      properties:
                        currency: { type: string }
                        count: { type: integer }
                        amount: { $ref: "#/components/schemas/Decimal" }
                  lineCount: { type: integer }
                  lines:
                    type: array
                    items:
                      type: object
                      required: [packingSlipId, packingSlipNumber, shipmentId, orderId, customerId, currency, postingDate, amount, daysOutstanding]
                      properties:
                        packingSlipId: { type: string, format: uuid }
                        packingSlipNumber: { type: string }
                        shipmentId: { type: string, format: uuid }
                        orderId: { type: string, format: uuid }
                        customerId: { type: string, format: uuid }
                        currency: { type: string }
                        postingDate: { type: string, format: date-time }
                        amount: { $ref: "#/components/schemas/Decimal" }
                        daysOutstanding: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/sscc-register:
    get:
      operationId: ssccRegister
      summary: SSCC register, every issued SSCC with its container and shipment (BR-28.5, section 5.28.14)
      description: >-
        Ordered by SSCC. noReuseUntil is the issue date plus sscc_no_reuse_months (12); SSCCs are unique per
        tenant, so an issued SSCC is never issued again. Page with limit and the nextCursor of the previous page.
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: companyPrefix, in: query, description: "GS1 company prefix (6 to 12 digits) after the extension digit.", schema: { type: string, pattern: "^[0-9]{6,12}$" } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, description: "First issue date (YYYY-MM-DD, UTC), inclusive.", schema: { type: string, format: date } }
        - { name: to, in: query, description: "Last issue date (YYYY-MM-DD, UTC), inclusive; not before from.", schema: { type: string, format: date } }
        - { name: cursor, in: query, description: "nextCursor of the previous page.", schema: { type: string, pattern: "^[0-9]{18}$" } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: One page of the register
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [sscc, containerId, containerType, status, shipmentId, shipmentNumber, orderId, customerId, packingSlipId, issuedAt, noReuseUntil]
                      properties:
                        sscc: { type: string, pattern: "^[0-9]{18}$" }
                        containerId: { type: string, format: uuid }
                        containerType: { type: string }
                        status: { type: string, enum: [OPEN, CLOSED, SHIPPED, UNPACKED] }
                        shipmentId: { type: string, format: uuid }
                        shipmentNumber: { type: string }
                        orderId: { type: string, format: uuid }
                        customerId: { type: string, format: uuid }
                        packingSlipId: { type: [string, "null"], format: uuid, description: "The slip the container shipped on; null until it ships." }
                        issuedAt: { type: string, format: date-time }
                        noReuseUntil: { type: string, format: date }
                  nextCursor: { type: string, pattern: "^[0-9]{18}$", description: "Present when another page exists." }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/backorders:
    get:
      operationId: listBackorders
      summary: Short picks and backorders (FR-28.2, AC-28.4, section 5.28.14)
      description: >-
        Shipment lines a pick confirmed below their planned quantity, newest short pick first. The
        remainder (qtyPlanned - qtyPicked) is open until a re-pick reaches the planned quantity, the remainder is
        closed (qtyClosed, FR-28.8) or the shipment is cancelled. status=open (default) lists open backorders only; status=all also lists closed ones. from
        and to bound the date of the line's first short pick. Page with limit and the nextCursor of the previous
        page.
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [open, all], default: open } }
        - { name: from, in: query, description: "First short-pick date (YYYY-MM-DD, UTC), inclusive.", schema: { type: string, format: date } }
        - { name: to, in: query, description: "Last short-pick date (YYYY-MM-DD, UTC), inclusive; not before from.", schema: { type: string, format: date } }
        - { name: cursor, in: query, description: "nextCursor of the previous page (a shipment line id).", schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: One page of the report
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [shipmentLineId, shipmentId, shipmentNumber, status, warehouseId, orderId, customerId, orderLineId, productId, unit, qtyPlanned, qtyPicked, qtyShipped, qtyClosed, qtyRemainder, open, shortPickedAt]
                      properties:
                        shipmentLineId: { type: string, format: uuid }
                        shipmentId: { type: string, format: uuid }
                        shipmentNumber: { type: string }
                        status: { $ref: "#/components/schemas/ShipmentStatus" }
                        warehouseId: { type: string, format: uuid }
                        orderId: { type: string, format: uuid }
                        customerId: { type: string, format: uuid }
                        orderLineId: { type: string, format: uuid }
                        productId: { type: string, format: uuid }
                        unit: { type: string }
                        qtyPlanned: { $ref: "#/components/schemas/Decimal" }
                        qtyPicked: { $ref: "#/components/schemas/Decimal" }
                        qtyShipped: { $ref: "#/components/schemas/Decimal" }
                        qtyClosed: { $ref: "#/components/schemas/Decimal", description: "Planned quantity given up when the remainder was closed (FR-28.8); qtyPlanned is then what shipped." }
                        qtyRemainder: { $ref: "#/components/schemas/Decimal" }
                        open: { type: boolean, description: "A remainder is left and the shipment is not cancelled." }
                        shortPickedAt: { type: string, format: date-time, description: "The line's first short pick." }
                        reason: { type: [string, "null"], enum: [OUT_OF_STOCK, DAMAGED, NOT_FOUND, QUALITY_HOLD, OTHER, null], description: "Reason given for the latest short pick, if any." }
                  nextCursor: { type: string, format: uuid, description: "Present when another page exists." }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/returnable-packaging:
    get:
      operationId: listReturnableBalances
      summary: Returnable packaging balances per customer and container type (FR-28.16)
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReturnableBalance" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/returnable-packaging/aging:
    get:
      operationId: returnablePackagingAging
      summary: Returnable packaging aging, days outstanding and charge due (FR-28.16, section 5.28.14)
      description: >-
        Every balance above zero, aged first in, first out as of today (UTC): returns are taken against the
        oldest shipments, so oldestOutstandingDate is the posting date of the oldest packing slip whose
        containers the customer still holds. Each held shipment is judged against the rtp_charge_days of
        its own legal entity (90 when none is saved): chargeDue is set once any of them is older than its
        entity's days, so a long setting of one entity never hides another entity's overdue containers;
        wave 30 charges those. The chargeDays query replaces every entity's value. Slips of an entity with
        rtp_tracking_enabled false never raised the balance and do not age it; turning tracking off leaves
        the balances its earlier slips raised in place, still aging. The balance is per customer and
        container type for the whole tenant; a caller scoped to some legal entities ages it only from the
        slips of those entities. count and chargeDueCount cover every matching balance; items holds at
        most limit of them, oldest first.
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: chargeDays, in: query, description: "Replaces the rtp_charge_days of every legal entity; left out, each balance uses its entity's value.", schema: { type: integer, minimum: 30, maximum: 365 } }
        - { name: chargeDue, in: query, description: "true lists only balances whose charge is due.", schema: { type: boolean, default: false } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: The aged balances
          content:
            application/json:
              schema:
                type: object
                required: [asOf, chargeDays, count, chargeDueCount, items]
                properties:
                  asOf: { type: string, format: date }
                  chargeDays: { type: integer, description: "The chargeDays asked for, else the default 90; the threshold applied to each balance is its own chargeDays." }
                  count: { type: integer }
                  chargeDueCount: { type: integer }
                  items:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/ReturnableBalance" }
                        - type: object
                          required: [oldestOutstandingDate, daysOutstanding, chargeDays, chargeDue]
                          properties:
                            oldestOutstandingDate: { type: [string, "null"], format: date, description: "Null when no shipped container of the balance is visible." }
                            daysOutstanding: { type: integer }
                            chargeDays: { type: integer, minimum: 30, maximum: 365, description: "The threshold applied: the chargeDays query, else rtp_charge_days of the legal entity of the oldest overdue held shipment, else of the oldest held one." }
                            chargeDue: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/returnable-packaging/movements:
    get:
      operationId: listReturnableMovements
      summary: Movements behind the returnable packaging balances, newest first (FR-28.16)
      description: >-
        Every change of a balance: containers that left on a packing slip (SHIPPED), came back when the slip
        was cancelled (SHIPMENT_CANCELLED), a return receipt (RETURNED) and a manual correction (ADJUSTED).
        qty is signed and balanceAfter is the balance the change left. Balances that existed before the
        history was kept have no earlier rows.
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: containerType, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/ReturnableMovementKind" } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReturnableMovement" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/returnable-packaging:adjust:
    post:
      operationId: adjustReturnable
      summary: Correct a returnable packaging balance by hand (FR-28.16)
      description: >-
        An opening balance, a count at the customer or a pallet lost in transit. delta is a signed, non-zero
        whole number of containers; reason is required and the movement keeps who made it. Needs
        fulfillment.returnable-packaging.maintain (fulfillment.warehouse.receive is its segregation-of-duties conflict, not a second
        duty). The container type must be a returnable one. A correction that would take the balance below
        zero is refused.
      x-passage-duty: fulfillment.returnable-packaging.maintain
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, containerType, delta, reason]
              additionalProperties: false
              properties:
                customerId: { type: string, format: uuid }
                containerType: { type: string }
                delta: { type: string, pattern: '^-?[1-9][0-9]{0,8}$', description: "Signed whole number of containers, not zero." }
                reason: { type: string, minLength: 3, maxLength: 200 }
                reference: { type: string, maxLength: 100, description: "Optional reference such as a count sheet." }
      responses:
        "201":
          description: The movement that was written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnableMovement" }
        "400": { description: "FUL-0050 validation, FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "The caller lacks fulfillment.returnable-packaging.maintain", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0015 the balance would become negative, FUL-0069 the container type is unknown or not returnable, idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/returnable-packaging:return:
    post:
      operationId: returnPackaging
      summary: Record a standalone return receipt of returnable containers (BR-28.13)
      x-passage-duty: fulfillment.warehouse.receive
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, containerType, qty]
              additionalProperties: false
              properties:
                customerId: { type: string, format: uuid }
                containerType: { type: string }
                qty: { type: string, pattern: '^[0-9]{1,9}$', description: "Whole number of containers returned, 1 or more." }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnableBalance" }
        "400": { description: "FUL-0050 validation, FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { description: "FUL-0015 the return exceeds the customer's balance, idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}:cancel:
    post:
      operationId: cancelShipment
      summary: Cancel a shipment before anything ships (BR-28.6)
      description: >
        Allowed from OPEN, RELEASED, PICKING, PICKED or PACKED while nothing has
        shipped and the shipment holds no container. The order lines can be released
        again; inventory releases their reservations from shipment.cancelled.
      x-passage-duty: fulfillment.warehouse.release
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Shipment CANCELLED; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0020, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "FUL-0021 already cancelled, shipped quantity, or containers packed", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}:close-remainder:
    post:
      operationId: closeShipmentRemainder
      summary: Close the open remainder of a partially shipped shipment (FR-28.8)
      description: >
        CANCEL_REMAINDER: allowed while the shipment is PARTIALLY_SHIPPED, or its
        remainder is being picked (PICKING, PICKED), after at least one slip has
        shipped and with nothing packed waiting to ship. Every line shrinks to the
        quantity that shipped (qtyClosed records what was given up), the backorder
        closes and the shipment becomes SHIPPED. shipment.closed tells inventory
        which reservation and which picked-but-unpacked stock to release.
        Batch and serial entries that never shipped are dropped, freeing their serials.
      x-passage-duty: fulfillment.warehouse.release
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Shipment SHIPPED with its remainder closed; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0020, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "FUL-0021 no open remainder, nothing shipped yet, or packed quantity waiting to ship", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}:backorder-remainder:
    post:
      operationId: backorderShipmentRemainder
      summary: Move the open remainder of a partially shipped shipment to a new backorder shipment (FR-28.8)
      description: >
        The same rules as closing the remainder (PARTIALLY_SHIPPED, or its remainder
        being picked, after at least one slip has shipped and with nothing packed
        waiting to ship). Every line shrinks to the quantity that shipped, the
        shipment becomes SHIPPED, and the quantity given up moves to a new RELEASED
        shipment of the same order, customer, warehouse and carrier, planned for
        plannedShipDate (today when absent). The new shipment points back through
        backorderOfId and the original through backorderId. shipment.closed names the
        new shipment (backorder_shipment_id) so sales keeps the order lines open, and
        shipment.released announces the new one. The body may be an empty object.
      x-passage-duty: fulfillment.warehouse.release
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                plannedShipDate: { type: string, format: date, description: "Planned ship date of the backorder shipment; today when absent." }
      responses:
        "200":
          description: The original shipment (SHIPPED, ETag carries its new version) and the backorder shipment
          content:
            application/json:
              schema:
                type: object
                required: [shipment, backorder]
                properties:
                  shipment: { $ref: "#/components/schemas/Shipment" }
                  backorder: { $ref: "#/components/schemas/Shipment" }
        "400": { description: "FUL-0050 validation (plannedShipDate), FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0020, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "FUL-0021 no open remainder, nothing shipped yet, or packed quantity waiting to ship", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/warehouse-settings:
    get:
      operationId: listWarehouseSettings
      summary: Short pick action per warehouse (FR-28.8)
      description: >
        Every warehouse the caller sees shipments or a saved setting for (both are
        scoped by legal entity). A warehouse without a saved setting reads REMAINDER_BACKORDER
        (the default) at version 0.
      x-passage-duty: fulfillment.warehouse.view
      responses:
        "200":
          description: Warehouse settings, ordered by warehouse
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WarehouseSetting" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/warehouse-settings/{warehouseId}:
    get:
      operationId: getWarehouseSetting
      summary: Read the short pick action of one warehouse
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { $ref: "#/components/parameters/WarehouseId" }
      responses:
        "200":
          description: The setting; ETag carries its version (0 when none is saved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarehouseSetting" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: saveWarehouseSetting
      summary: Set the short pick action of a warehouse (FR-28.8)
      description: >
        KEEP_OPEN leaves a partially shipped shipment open for a re-pick.
        CANCEL_REMAINDER closes the open remainder and REMAINDER_BACKORDER (default) moves it to a new
        shipment, both as soon as a packing slip leaves a remainder open; a shipment
        that cannot close (a line is packed and waiting to ship) is left as it is.
        The response of the post names the action taken. If-Match carries the version
        read, 0 when none is saved. legalEntityId is the legal entity the warehouse
        belongs to; the setting is scoped by it, and a legal entity other than the
        saved one or the one of the warehouse's release rule or its shipments is
        refused (FUL-0057). Publishes warehousesetting.changed.
      x-passage-duty: fulfillment.warehouse.release
      parameters:
        - { $ref: "#/components/parameters/WarehouseId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shortPickAction, legalEntityId]
              properties:
                shortPickAction: { $ref: "#/components/schemas/ShortPickAction" }
                legalEntityId: { type: string, format: uuid, description: "The legal entity the warehouse belongs to." }
      responses:
        "200":
          description: The saved setting; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarehouseSetting" }
        "400": { description: "FUL-0050 validation (If-Match, shortPickAction, legalEntityId), FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0057 the warehouse belongs to another legal entity, or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/exceptions:
    get:
      operationId: listExceptions
      summary: Warehouse exceptions to handle
      description: >
        The supervisor's list: cases raised when sales cancelled the remainder of an order
        (order.remaindercancelled.v1) and fulfillment could not undo what had already been
        packed or posted. Open ones first, newest first.
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [OPEN, RESOLVED] }, description: Only exceptions in this status. }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Exceptions, open first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Exception" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/exceptions/{id}:
    get:
      operationId: getException
      summary: Read one warehouse exception
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The exception; ETag carries its version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exception" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0067 exception not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/exceptions/{id}:resolve:
    post:
      operationId: resolveException
      summary: Resolve a warehouse exception with a note
      description: >
        The supervisor records what was done (a return through wave 30, a new order, the goods
        unpacked). If-Match carries the version read. Publishes exception.resolved.
      x-passage-duty: fulfillment.warehouse.release
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: The resolved exception; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exception" }
        "400": { description: "FUL-0050 validation (If-Match, note), FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0067 exception not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: FUL-0068 the exception is already resolved, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/release-rules:
    get:
      operationId: listReleaseRules
      summary: Release and wave parameters per warehouse (FR-28.1, FR-28.13)
      description: >
        Every warehouse the caller sees shipments, a short pick setting or a saved rule
        for (all scoped by legal entity). A warehouse without a saved rule reads the
        defaults at version 0.
      x-passage-duty: fulfillment.warehouse.view
      responses:
        "200":
          description: Release rules, ordered by warehouse
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReleaseRule" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/release-rules/{warehouseId}:
    get:
      operationId: getReleaseRule
      summary: Read the release rule of one warehouse
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { $ref: "#/components/parameters/WarehouseId" }
      responses:
        "200":
          description: The rule; ETag carries its version (0 when none is saved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseRule" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: saveReleaseRule
      summary: Set the release and wave parameters of a warehouse (FR-28.1, FR-28.13)
      description: >
        A release run that names no horizonDays or requireFullAtp takes the saved rule
        (a value in the request wins), and a picking workbench call that names no maxLines
        or maxOrders takes waveMaxLines and waveMaxOrders. If-Match carries the version
        read, 0 when none is saved; of two first saves at the same moment one is
        written and the other gets 412. legalEntityId is the legal entity the warehouse
        belongs to; a legal entity other than the one of the saved rule, the warehouse's
        short pick setting or its shipments, or outside the caller's scope, is refused
        (FUL-0057). Publishes warehousereleaserule.changed with the values replaced.
      x-passage-duty: fulfillment.warehouse.release
      parameters:
        - { $ref: "#/components/parameters/WarehouseId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legalEntityId, horizonDays, requireFullAtp, waveMaxLines, waveMaxOrders]
              properties:
                legalEntityId: { type: string, format: uuid, description: "The legal entity the warehouse belongs to." }
                horizonDays: { type: integer, minimum: 0, maximum: 30 }
                requireFullAtp: { type: boolean }
                waveMaxLines: { type: integer, minimum: 1, maximum: 2000 }
                waveMaxOrders: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: The saved rule; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseRule" }
        "400": { description: "FUL-0050 validation (If-Match, legalEntityId, horizonDays, requireFullAtp, waveMaxLines, waveMaxOrders), FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0057 the warehouse belongs to another legal entity, or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/operation-rules:
    get:
      operationId: listOperationRules
      summary: Posting and packing parameters per warehouse (BR-28.3, FR-28.15, FR-28.13)
      description: >
        Every warehouse the caller sees shipments, a short pick setting, a release rule or a
        saved operation rule for (all scoped by legal entity). A warehouse without a saved
        rule reads the defaults at version 0.
      x-passage-duty: fulfillment.warehouse.view
      responses:
        "200":
          description: Operation rules, ordered by warehouse
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OperationRule" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/operation-rules/{warehouseId}:
    get:
      operationId: getOperationRule
      summary: Read the operation rule of one warehouse
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { $ref: "#/components/parameters/WarehouseId" }
      responses:
        "200":
          description: The rule; ETag carries its version (0 when none is saved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationRule" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: saveOperationRule
      summary: Set the posting and packing parameters of a warehouse (BR-28.3, FR-28.15, FR-28.13)
      description: >
        postingDateSource decides how a packing slip post gets its posting date: MANUAL
        takes the postingDate of the request, SHIP_TIMESTAMP the day of the post in
        timeZone (a request date that differs is FUL-0074), TODAY defaults to that same
        day and a request date overrides it. timeZone must be an IANA name.
        autoPackEnabled false refuses :auto-pack for the warehouse (FUL-0075).
        workbenchGroupKeyDefault is the grouping of a workbench call that names no
        groupBy. If-Match carries the version read, 0 when none is saved; of two first
        saves at the same moment one is written and the other gets 412. legalEntityId is
        the legal entity the warehouse belongs to; another one than the warehouse's, or
        one outside the caller's scope, is refused (FUL-0057). Publishes
        warehouseoperationrule.changed with the values replaced.
      x-passage-duty: fulfillment.warehouse.release
      parameters:
        - { $ref: "#/components/parameters/WarehouseId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legalEntityId, postingDateSource, autoPackEnabled, workbenchGroupKeyDefault]
              properties:
                legalEntityId: { type: string, format: uuid, description: "The legal entity the warehouse belongs to." }
                postingDateSource: { type: string, enum: [SHIP_TIMESTAMP, TODAY, MANUAL] }
                timeZone: { type: string, description: "IANA time zone name; UTC when omitted." }
                autoPackEnabled: { type: boolean }
                workbenchGroupKeyDefault: { type: string, enum: [CUSTOMER, CARRIER, ZONE, PRODUCT] }
      responses:
        "200":
          description: The saved rule; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationRule" }
        "400": { description: "FUL-0050 validation (If-Match, legalEntityId, postingDateSource, timeZone, autoPackEnabled, workbenchGroupKeyDefault), FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0057 the warehouse belongs to another legal entity, or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/delivery-tolerances:
    get:
      operationId: listDeliveryTolerances
      summary: Over-delivery tolerances per product and customer (BR-28.7)
      description: >
        The saved over-delivery tolerances, the most specific scopes first, optionally of one
        product or one customer.
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: productId, in: query, required: false, schema: { type: string, format: uuid }, description: "Only the tolerances saved for this product." }
        - { name: customerId, in: query, required: false, schema: { type: string, format: uuid }, description: "Only the tolerances saved for this customer." }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 }, description: "Most rows returned." }
      responses:
        "200":
          description: Delivery tolerances
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DeliveryTolerance" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: saveDeliveryTolerance
      summary: Set the over-delivery tolerance of a product and customer scope (BR-28.7)
      description: >
        Creates or replaces the tolerance of the scope named by productId and customerId (either
        or both may be left out; both left out is the general tolerance). If-Match carries the
        version read, 0 when the scope has none; of two first saves at the same moment one is
        written and the other gets 412. A confirm-pick above the planned quantity is accepted up
        to planned plus this percentage; above it is refused with FUL-0005, and with no tolerance
        it is FUL-0004. Publishes deliverytolerance.changed with the value replaced.
      x-passage-duty: fulfillment.packing-rule.maintain
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [overdeliveryPct]
              properties:
                productId: { type: [string, "null"], format: uuid }
                customerId: { type: [string, "null"], format: uuid }
                overdeliveryPct: { $ref: "#/components/schemas/Decimal", description: "0 to 100, at most 4 decimals." }
      responses:
        "200":
          description: The saved tolerance; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryTolerance" }
          headers:
            ETag: { schema: { type: string } }
        "400": { description: "FUL-0050 validation (If-Match, productId, customerId, overdeliveryPct), FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/legal-entity-settings:
    get:
      operationId: listLegalEntitySettings
      summary: Posting settings per legal entity (section 5.28.13)
      description: >
        Every legal entity the caller sees shipments or a saved setting for (both are
        scoped by legal entity). A legal entity without a saved setting reads
        cogsAtShipment and asnEnabled false at version 0.
      x-passage-duty: fulfillment.warehouse.view
      responses:
        "200":
          description: Legal entity settings, ordered by legal entity
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LegalEntitySetting" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/legal-entity-settings/{legalEntityId}:
    get:
      operationId: getLegalEntitySetting
      summary: Read the posting settings of one legal entity
      description: A legal entity without a saved setting (or outside the caller's scope) reads both flags false at version 0.
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { $ref: "#/components/parameters/LegalEntityId" }
      responses:
        "200":
          description: The setting; ETag carries its version (0 when none is saved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalEntitySetting" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: saveLegalEntitySetting
      summary: Set the packing slip posting defaults of a legal entity
      description: >
        cogsAtShipment is the legal entity's COGS posting policy (BR-28.1): every
        post-packing-slip takes it and a post naming the other value is refused
        (FUL-0059). Changing it is an accounting policy change and needs the
        ledger.setup.write duty as well (403 AUTH-0003 without it); a save that keeps
        it needs only fulfillment.warehouse.release. asnEnabled is the default of a post that does
        not name asnEnabled. Both flags are required. gs1CompanyPrefix (6 to 12 digits)
        and ssccExtensionDigit (0 to 9) set the SSCCs of the legal entity's containers
        from the next container on; SSCCs already issued keep their prefix. null returns
        either to the process default. A prefix that nests with the process prefix or
        another legal entity's (one is the start of the other) is refused (422 FUL-0050):
        the two would issue the same SSCCs. packagingFeeBillable is stored on each slip
        posted afterwards for billing (BR-28.12). rtpTrackingEnabled false stops the slips
        posted afterwards from raising the customers' returnable balances (each slip
        remembers, so cancelling one mirrors its post); rtpChargeDays (30 to 365) is the
        age after which a balance of the entity is chargeable in the aging report. The
        last four are optional: left out, the saved value stays. If-Match carries the version
        read, 0 when none is saved. A legal entity outside the caller's legal-entity
        scope is refused (FUL-0058). Publishes legalentitysetting.changed.
      x-passage-duty: fulfillment.warehouse.release
      parameters:
        - { $ref: "#/components/parameters/LegalEntityId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cogsAtShipment, asnEnabled]
              properties:
                cogsAtShipment: { type: boolean }
                asnEnabled: { type: boolean }
                gs1CompanyPrefix: { type: [string, "null"], pattern: '^[0-9]{6,12}$', description: "Left out keeps the saved prefix; null takes the process default." }
                ssccExtensionDigit: { type: [integer, "null"], minimum: 0, maximum: 9, description: "Left out keeps the saved digit; null takes the process default." }
                packagingFeeBillable: { type: boolean, description: "Left out keeps the saved value (false when none is saved)." }
                rtpTrackingEnabled: { type: boolean, description: "Left out keeps the saved value (true when none is saved)." }
                rtpChargeDays: { type: integer, minimum: 30, maximum: 365, description: "Left out keeps the saved value (90 when none is saved)." }
      responses:
        "200":
          description: The saved setting; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalEntitySetting" }
        "400": { description: "FUL-0050 validation (If-Match, cogsAtShipment, asnEnabled, gs1CompanyPrefix, ssccExtensionDigit, rtpTrackingEnabled, rtpChargeDays), FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "AUTH-0003 fulfillment.warehouse.release missing, or cogsAtShipment changed without ledger.setup.write", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0058 the legal entity is outside your scope, FUL-0050 the gs1CompanyPrefix nests with one in use, or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}/containers/{cid}:unpack:
    post:
      operationId: unpackContainer
      summary: Take a CLOSED container apart before it ships
      description: >
        Allowed while the shipment is PICKING, PICKED or PACKED and the container is
        CLOSED (not on a posted slip). The container's packed quantities return to the
        unpacked pool; a PACKED shipment goes back to PICKED so it can be repacked or,
        once it holds no container, cancelled. The SSCC stays issued and is never
        reused (BR-28.5). Publishes container.unpacked. When sales cancelled the remainder of
        an order line (order.remaindercancelled.v1) while it was packed, the unpacked quantity
        above what the line keeps is cut from the plan and shipment.closed (reason
        order_remainder_cancelled) is published, so the kept quantity can be repacked and posted.
      x-passage-duty: fulfillment.warehouse.pack
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Shipment without the container; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0020 shipment, FUL-0054 container not on the shipment (or already unpacked)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "FUL-0021 shipment status does not allow unpacking, or the container already shipped", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}:nest-containers:
    post:
      operationId: nestContainers
      summary: Put CLOSED cartons on a new pallet with its own SSCC
      description: >
        Allowed while the shipment is PICKED or PACKED. Every carton must be CLOSED,
        not already on a pallet and not a pallet itself (FUL-0056); a pallet holds one
        level. The pallet takes tare, returnable flag and packaging material from the
        container type when it is a known one and weighs its tare plus its cartons.
        It holds no lines, so packed quantities do not change; the shipment version
        moves. The pallet and its cartons ship on the next packing slip and a
        returnable pallet raises the customer's returnable balance. Publishes
        container.nested.
      x-passage-duty: fulfillment.warehouse.pack
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [containerType, containerIds]
              additionalProperties: false
              properties:
                containerType: { type: string, maxLength: 64 }
                containerIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: The pallet and the updated shipment; ETag carries the new version
          content:
            application/json:
              schema:
                type: object
                properties:
                  container: { $ref: "#/components/schemas/Container" }
                  shipment: { $ref: "#/components/schemas/Shipment" }
          headers:
            ETag: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0020 shipment, FUL-0054 container not on the shipment", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "FUL-0021 shipment status does not allow nesting", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0056 a carton is not CLOSED, is on a pallet or is a pallet, FUL-0050 the serial references of the GS1 company prefix are used up, FUL-0007 the SSCC was issued before (nested prefixes), idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}/containers/{cid}:unnest:
    post:
      operationId: unnestContainer
      summary: Dissolve a pallet before it ships
      description: >
        Allowed while the shipment is PICKED or PACKED and the pallet is CLOSED. The
        cartons become top-level containers again and stay packed; the pallet SSCC stays
        issued and is never reused (BR-28.5). A carton on a pallet cannot be unpacked
        until the pallet is dissolved. Publishes container.unnested.
      x-passage-duty: fulfillment.warehouse.pack
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Shipment without the pallet; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
          headers:
            ETag: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0020 shipment, FUL-0054 container not on the shipment", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "FUL-0021 shipment status does not allow it, or the pallet already shipped", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0056 the container is not a pallet; or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}/lines/{lid}:capture-tracking:
    post:
      operationId: captureLineTracking
      summary: Capture batch, serial and location for a picked shipment line (BR-28.10)
      description: >
        Replaces the line's entries that have not shipped yet; an empty list clears
        them. Each entry names a batch or a serial number (a serial is one unit, and
        unique per product while its shipment is live, FUL-0036) and optionally the
        pick location. Entries, shipped and new together, cannot exceed the picked
        quantity (FUL-0035). Allowed while the shipment is PICKING, PICKED, PACKED
        or PARTIALLY_SHIPPED. A line released with trackingRequired posts only when
        its entries cover the quantity the slip ships (FUL-0006). Publishes pick.tracked.
      x-passage-duty: fulfillment.warehouse.pick
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { name: lid, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              additionalProperties: false
              properties:
                entries:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [qty]
                    additionalProperties: false
                    properties:
                      batchNo: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_./-]{0,63}$' }
                      serialNo: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_./-]{0,63}$' }
                      locationCode: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_./-]{0,63}$' }
                      qty: { $ref: "#/components/schemas/Decimal" }
      responses:
        "200":
          description: The shipment with the line's tracking entries; ETag carries the new version
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0020 shipment, FUL-0041 line not on the shipment", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "FUL-0036 serial already assigned to another line of the product", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0001 shipment status does not allow capture, FUL-0065 a JOURNAL order, FUL-0035 entries exceed the picked quantity, FUL-0050 malformed entry, idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: precondition_required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/waves:preview:
    post:
      operationId: previewWaves
      summary: Picking workbench preview of the grouped waves (FR-28.13, BR-28.14)
      description: >
        Read-only: plans waves from the RELEASED shipments that match the filter,
        grouped by the key, each of at most maxLines lines and maxOrders orders,
        never splitting a shipment or mixing legal entities. No Idempotency-Key.
      x-passage-duty: fulfillment.warehouse.release
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkbenchRequest" }
      responses:
        "200":
          description: Planned waves
          content:
            application/json:
              schema:
                type: object
                required: [warehouseId, groupBy, waveCount, lineCount, message, waves]
                properties:
                  warehouseId: { type: string, format: uuid }
                  groupBy: { type: string }
                  waveCount: { type: integer }
                  lineCount: { type: integer }
                  message: { type: string }
                  waves:
                    type: array
                    items: { $ref: "#/components/schemas/WavePlan" }
        "400": { description: "FUL-0050 validation, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { description: "FUL-0034 one shipment has more lines than maxLines", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/waves:
    get:
      operationId: listWaves
      summary: Pick waves, newest first
      description: Optionally filtered by warehouse, status, picker, or only the waves nobody is assigned to.
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, CLOSED] } }
        - { name: picker, in: query, description: Waves assigned to this picker., schema: { type: string, maxLength: 64 } }
        - { name: unassigned, in: query, description: "true lists only waves with no picker; not combinable with picker.", schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Waves
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WaveSummary" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createWaves
      summary: Create the previewed waves in one action (FR-28.13)
      description: >
        Plans again from the current RELEASED shipments, records each wave with its
        shipments and lines (WV- numbers), moves the shipments to PICKING and writes
        one wave.created per wave, in one transaction. message carries FUL-0016.
      x-passage-duty: fulfillment.warehouse.release
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkbenchRequest" }
      responses:
        "201":
          description: Waves created
          content:
            application/json:
              schema:
                type: object
                required: [warehouseId, groupBy, waveCount, lineCount, message, waves]
                properties:
                  warehouseId: { type: string, format: uuid }
                  groupBy: { type: string }
                  waveCount: { type: integer }
                  lineCount: { type: integer }
                  message: { type: string, example: "FUL-0016: Workbench created 3 waves from 60 lines" }
                  waves:
                    type: array
                    items: { $ref: "#/components/schemas/Wave" }
        "400": { description: "FUL-0050 validation, FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { description: "FUL-0053 a shipment left RELEASED or a line is already in a wave; preview again", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0034 one shipment has more lines than maxLines, idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/waves/{id}:
    get:
      operationId: getWave
      summary: One pick wave with its shipments and their current status
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { $ref: "#/components/parameters/WaveId" }
      responses:
        "200":
          description: Wave; the ETag carries the wave version for If-Match on assign and close
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wave" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0052, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/waves/{id}:confirm-pick:
    post:
      operationId: confirmWavePick
      summary: Confirm the picks of a whole wave in one command (FR-28.13)
      description: >
        Confirms the listed picks across the shipments of the wave in one transaction and
        writes one pick.confirmed per shipment, carrying the wave id. With pickRest, every other
        line of the wave that is not yet confirmed is picked in full; shipments of the wave that
        no longer pick (picked, packed, cancelled) are left alone. A listed line must belong to
        the wave, and a listed line on a shipment that no longer picks fails the whole command.
      x-passage-duty: fulfillment.warehouse.pick
      parameters:
        - { $ref: "#/components/parameters/WaveId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pickRest: { type: boolean, description: "Pick every other unconfirmed line of the wave in full." }
                picks:
                  type: array
                  items:
                    type: object
                    required: [shipmentLineId, picked]
                    properties:
                      shipmentLineId: { type: string, format: uuid }
                      picked: { $ref: "#/components/schemas/Decimal" }
                      reason: { type: string, enum: [OUT_OF_STOCK, DAMAGED, NOT_FOUND, QUALITY_HOLD, OTHER], description: "Why the line was picked short; only valid when picked is below plan." }
      responses:
        "200":
          description: The shipments that took picks, with their new status and version
          content:
            application/json:
              schema:
                type: object
                required: [waveId, linesConfirmed, shortLines, shipments]
                properties:
                  waveId: { type: string, format: uuid }
                  linesConfirmed: { type: integer }
                  shortLines: { type: integer, description: "Lines picked below plan." }
                  shipments:
                    type: array
                    items:
                      type: object
                      required: [id, shipmentNumber, status, version, linesConfirmed]
                      properties:
                        id: { type: string, format: uuid }
                        shipmentNumber: { type: string }
                        status: { $ref: "#/components/schemas/ShipmentStatus" }
                        version: { type: integer }
                        linesConfirmed: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0052 wave or FUL-0041 line not in the wave", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: conflict_version, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0001 wave CLOSED or shipment status, FUL-0065 a JOURNAL order, FUL-0004 over-pick (no tolerance applies), FUL-0005 above the planned quantity plus the over-delivery tolerance, FUL-0066 above plan beyond the quantity the order line keeps after sales cancelled the remainder, FUL-0030 negative, FUL-0035 below the captured batch and serial entries, FUL-0050 nothing left to pick or reason on a full pick, idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/waves/{id}:assign:
    post:
      operationId: assignWave
      summary: Give a wave to a picker or hand it to another one (FR-28.13)
      description: >
        Sets the picker of an OPEN wave; assigning again reassigns it. Needs the wave version in
        If-Match. Writes wave.assigned with the previous picker. A CLOSED wave, or the picker the
        wave already has, is refused.
      x-passage-duty: fulfillment.warehouse.release
      parameters:
        - { $ref: "#/components/parameters/WaveId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [picker]
              additionalProperties: false
              properties:
                picker: { type: string, minLength: 1, maxLength: 64, description: The picker's user name or badge; no control characters. }
      responses:
        "200":
          description: The wave with its new picker; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wave" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0052 wave not found", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: "conflict_version", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0001 wave is CLOSED, FUL-0050 already assigned to that picker, idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: "precondition_required", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/waves/{id}:close:
    post:
      operationId: closeWave
      summary: Close a wave once every line is picked (FR-28.13)
      description: >
        Closes an OPEN wave when each of its lines is pick-confirmed or sits on a cancelled
        shipment; a line still to pick answers FUL-0055. Needs the wave version in If-Match.
        Writes wave.closed with the number of lines picked short.
      x-passage-duty: fulfillment.warehouse.release
      parameters:
        - { $ref: "#/components/parameters/WaveId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: The CLOSED wave; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wave" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0052 wave not found", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: "conflict_version", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0001 wave already CLOSED, FUL-0055 a line is still to pick, idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: "precondition_required", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}/tracking:
    get:
      operationId: listTracking
      summary: Tracking events of a shipment, newest first (FR-28.10)
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
      responses:
        "200":
          description: Tracking events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TrackingEvent" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0020, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    post:
      operationId: recordTracking
      summary: Record a carrier tracking event (FR-28.10, BR-28.9 manual tracking)
      description: >
        Called by carrier-gateway after it verified the provider webhook, or by a
        shipping clerk entering tracking by hand. The provider event key is the
        idempotency key (no Idempotency-Key header): a redelivery answers 200 with
        created false and publishes nothing. A DELIVERED event moves a SHIPPED
        shipment to DELIVERED.
      x-passage-duty: fulfillment.warehouse.ship
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, eventKey, trackingNumber, status, eventTime]
              properties:
                provider: { type: string, pattern: '^[a-z0-9-]{2,32}$' }
                eventKey: { type: string, maxLength: 128 }
                trackingNumber: { type: string, maxLength: 64 }
                status: { type: string, enum: [QUOTED, LABELLED, MANIFESTED, IN_TRANSIT, DELIVERED, EXCEPTION] }
                description: { type: string, maxLength: 500 }
                eventTime: { type: string, format: date-time }
      responses:
        "201":
          description: Event recorded and tracking.updated published
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/TrackingEvent" }
                  - { type: object, properties: { created: { type: boolean, const: true } } }
        "200":
          description: The provider event was already recorded; the stored event is returned
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/TrackingEvent" }
                  - { type: object, properties: { created: { type: boolean, const: false } } }
        "400": { description: "FUL-0050 validation, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0020, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}:carrier-rates:
    post:
      operationId: carrierRates
      summary: Rate-shop the shipment's parcels through carrier-gateway (wave 28 D3, #482)
      description: >
        Calls carrier-gateway POST /v1/carrier/rates with a service token (duty
        carrier.rate.quote) for the shipment's legal entity. Rates are cheapest
        first; a carrier that failed is listed in failures. Read-only.
      x-passage-duty: fulfillment.warehouse.ship
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/CarrierShipment" }
                - type: object
                  properties:
                    carriers: { type: array, maxItems: 20, items: { type: string } }
                    services: { type: array, maxItems: 20, items: { type: string } }
      responses:
        "200":
          description: Rates and per-carrier failures
          content:
            application/json:
              schema:
                type: object
                required: [items, failures]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CarrierRate" } }
                  failures:
                    type: array
                    items: { type: object, properties: { carrier: { type: string }, code: { type: string }, message: { type: string } } }
        "400": { description: "FUL-0050 validation (carrier-gateway's field errors), COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0020, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: FUL-0073 the shipment is cancelled, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: FUL-0071 carrier-gateway refused (unknown carrier or service, destination not served), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "502": { description: FUL-0072 carrier-gateway refused the service token or the call, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "503": { description: FUL-0070 carrier-gateway is not configured, FUL-0072 it is unavailable (retry), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}:carrier-label:
    post:
      operationId: carrierLabel
      summary: Buy the shipment's carrier label through carrier-gateway and record it as LABELLED (#482)
      description: >
        The Idempotency-Key names the label (carrier-gateway receives the shipment
        id, a colon and the key): a retry returns the same label with 200 and
        buys nothing. The carrier defaults to the shipment's carrier code and the
        reference to its shipment number. The label is recorded as a LABELLED
        tracking event (event key "label:" + tracking number), which publishes
        tracking.updated once.
      x-passage-duty: fulfillment.warehouse.ship
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: '^[\x21-\x7e]{1,64}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/CarrierShipment" }
                - type: object
                  required: [service]
                  properties:
                    carrier: { type: string, pattern: '^[a-z0-9-]{2,32}$' }
                    service: { type: string, maxLength: 32 }
                    reference: { type: string, maxLength: 60 }
      responses:
        "201":
          description: Label bought and recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/CarrierLabel" } } }
        "200":
          description: The label this key already bought
          content: { application/json: { schema: { $ref: "#/components/schemas/CarrierLabel" } } }
        "400": { description: "FUL-0050 validation, FUL-0051 Idempotency-Key missing, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: FUL-0020, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: FUL-0073 the shipment is cancelled, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0071 carrier-gateway refused (CGW-0422: the key was used for a different label)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "502": { description: FUL-0072, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "503": { description: FUL-0070, FUL-0072, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}:carrier-track:
    post:
      operationId: carrierTrack
      summary: Pull the carrier's tracking through carrier-gateway and record new events (#482)
      description: >
        Without a tracking number the shipment's newest tracked number (of the
        named carrier, if given) is used. Each carrier event is recorded once per
        provider event key (recorded counts the new ones); DELIVERED moves a
        SHIPPED shipment to DELIVERED. Events with a status fulfillment does not
        know are skipped.
      x-passage-duty: fulfillment.warehouse.ship
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                carrier: { type: string, pattern: '^[a-z0-9-]{2,32}$' }
                trackingNumber: { type: string, maxLength: 64 }
      responses:
        "200":
          description: The carrier's tracking, as recorded
          content:
            application/json:
              schema:
                type: object
                required: [carrier, trackingNumber, status, recorded, events]
                properties:
                  carrier: { type: string }
                  trackingNumber: { type: string }
                  status: { type: string }
                  recorded: { type: integer, minimum: 0 }
                  events: { type: array, items: { $ref: "#/components/schemas/TrackingEvent" } }
        "400": { description: "FUL-0050 validation, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0020, or FUL-0071 the carrier does not know the tracking number", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: FUL-0073 cancelled, or no tracking number yet, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "502": { description: FUL-0072, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "503": { description: FUL-0070, FUL-0072, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/shipments/{id}/containers/{cid}/label:
    get:
      operationId: containerLabel
      summary: GS1-128 SSCC label of a container as ZPL (FR-28.3, BR-28.5)
      description: >
        The barcode encodes AI (00) and the SSCC after FNC1; the SSCC check digit is
        verified first. PDF labels and the GTIN, batch, quantity and ship-to fields of
        section 5.28.15 are a later slice.
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { $ref: "#/components/parameters/ShipmentId" }
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: ZPL label program
          content:
            application/zpl:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0020 shipment, FUL-0054 container not on the shipment", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0007 the stored SSCC failed its check digit", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/drop-ships:
    post:
      operationId: createDropShip
      summary: Create a drop-ship for an order line (FR-28.7)
      description: >
        Records that a vendor ships an order line straight to the customer, against a purchase
        order line (wave 17) at the purchase order cost. The drop-ship is OPEN and books nothing.
        An order line has at most one active drop-ship (FUL-0061) and ships either from stock or
        from the vendor: a line on a warehouse shipment that is not cancelled is refused (FUL-0062),
        and a release run skips a line with an active drop-ship (drop_ship). Publishes dropship.created.
      x-passage-duty: fulfillment.warehouse.release
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legalEntityId, orderId, orderLineId, customerId, productId, unit, qty, vendorId, purchaseOrderId, purchaseOrderLineId, unitCost, currency]
              properties:
                legalEntityId: { type: string, format: uuid }
                orderId: { type: string, format: uuid }
                orderLineId: { type: string, format: uuid }
                customerId: { type: string, format: uuid }
                productId: { type: string, format: uuid }
                unit: { type: string, pattern: "^[A-Za-z0-9]{1,8}$" }
                qty: { type: string, description: "Positive decimal with at most 6 decimals." }
                vendorId: { type: string, format: uuid }
                purchaseOrderId: { type: string, format: uuid }
                purchaseOrderLineId: { type: string, format: uuid }
                unitCost: { type: string, description: "Purchase order cost per unit, a positive decimal with at most 6 decimals." }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
                orderType: { type: string, enum: [ORDER, JOURNAL, SUBSCRIPTION, RETURNED], description: "order_type of order.confirmed; a JOURNAL order never ships and is refused (FUL-0065). The type stored from sales' order.confirmed.v1 replaces this value, except that JOURNAL from either side wins." }
      responses:
        "201":
          description: The OPEN drop-ship; ETag carries its version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DropShip" }
        "400": { description: "FUL-0050 validation, FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { description: "FUL-0061 the order line already has an active drop-ship; FUL-0062 the order line is on a warehouse shipment", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0058 legal entity outside your scope, FUL-0065 a JOURNAL order, FUL-0066 qty above the quantity the order line keeps after sales cancelled the remainder of the order, or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    get:
      operationId: listDropShips
      summary: List drop-ships
      description: Drop-ships newest first, filtered by status, order and vendor; scoped by legal entity.
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, PARTIALLY_CONFIRMED, CONFIRMED, CANCELLED] } }
        - { name: orderId, in: query, schema: { type: string, format: uuid } }
        - { name: vendorId, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Drop-ships, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DropShip" } }
        "400": { description: "FUL-0050 invalid filter", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/drop-ships/{id}:
    get:
      operationId: getDropShip
      summary: Read one drop-ship
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { $ref: "#/components/parameters/DropShipId" }
      responses:
        "200":
          description: The drop-ship with its journal; ETag carries its version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DropShip" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0060 drop-ship not found", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/drop-ships/{id}:confirm:
    post:
      operationId: confirmDropShip
      summary: Record the vendor's ship confirmation (FR-28.7, AC-28.5)
      description: >
        The vendor shipped the line, all of it or one part of it. It books Dr 5000 cost of goods
        sold / Cr 2110 goods received not invoiced at the purchase order cost for qty (everything
        still open when qty is left out), with no inventory transaction (BR-28.1). The drop-ship is
        PARTIALLY_CONFIRMED while quantity is open and CONFIRMED when none is. The cost is booked on
        postingDate, else on shippedOn. Publishes dropship.confirmed with the journal of this
        confirmation. Only an OPEN or PARTIALLY_CONFIRMED drop-ship can be confirmed (FUL-0001); a
        qty above the open quantity is refused (FUL-0063) and so is a vendorShipmentRef already
        booked on the drop-ship (FUL-0064). A booked confirmation is final: a drop-ship with a
        confirmation cannot be cancelled, close its remainder instead. Section 5.28.5 names the
        purchasing confirmation duty (PurchasingConfirm), seeded as procurement.purchase-order.confirm.
      x-passage-duty: procurement.purchase-order.confirm
      parameters:
        - { $ref: "#/components/parameters/DropShipId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shippedOn]
              properties:
                shippedOn: { type: string, format: date, description: "The day the vendor shipped; not in the future." }
                qty: { type: string, description: "Quantity of this vendor shipment, positive with at most 6 decimals and not above the open quantity; everything still open when left out." }
                vendorShipmentRef: { type: string, maxLength: 64, description: "The vendor's shipment or tracking reference." }
                postingDate: { type: string, format: date, description: "The day the cost is booked; defaults to shippedOn." }
      responses:
        "200":
          description: The PARTIALLY_CONFIRMED or CONFIRMED drop-ship with its journal; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DropShip" }
        "400": { description: "FUL-0050 validation, FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0060 drop-ship not found", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: "conflict_version", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "FUL-0064 the vendor shipment reference is already booked on the drop-ship", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0001 the drop-ship is not OPEN or PARTIALLY_CONFIRMED; FUL-0063 qty above the open quantity; FUL-0066 the confirmed total would exceed the quantity the order line keeps after sales cancelled the remainder of the order; or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: "precondition_required", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/drop-ships/{id}:cancel:
    post:
      operationId: cancelDropShip
      summary: Cancel an OPEN drop-ship (FR-28.7)
      description: >
        Cancels a drop-ship the vendor has not confirmed; nothing was booked, and the order line can
        be drop-shipped again. A drop-ship with a vendor confirmation is booked and cannot be
        cancelled (FUL-0001); close the remainder of a PARTIALLY_CONFIRMED one instead. Publishes
        dropship.cancelled.
      x-passage-duty: fulfillment.warehouse.release
      parameters:
        - { $ref: "#/components/parameters/DropShipId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: The CANCELLED drop-ship; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DropShip" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0060 drop-ship not found", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: "conflict_version", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0001 the drop-ship is not OPEN, or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: "precondition_required", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/drop-ships/{id}:close-remainder:
    post:
      operationId: closeDropShipRemainder
      summary: Close the open remainder of a partly shipped drop-ship (FR-28.7)
      description: >
        The vendor shipped part of the quantity and will not ship the rest. The open quantity moves to
        qtyClosed, the drop-ship is CONFIRMED and nothing is booked for the closed quantity (the
        confirmations already booked stand). Only a PARTIALLY_CONFIRMED drop-ship has a remainder
        (FUL-0001); an OPEN one is cancelled instead. Publishes dropship.closed, which sales may use
        to cancel the order line remainder.
      x-passage-duty: fulfillment.warehouse.release
      parameters:
        - { $ref: "#/components/parameters/DropShipId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: The CONFIRMED drop-ship with qtyClosed set; ETag carries the new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DropShip" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0060 drop-ship not found", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: "conflict_version", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0001 the drop-ship is not PARTIALLY_CONFIRMED, or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: "precondition_required", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/manifest-candidates:
    get:
      operationId: listManifestCandidates
      summary: List the labelled parcels that are on no manifest (FR-28.6)
      description: >
        The parcels a carrier pickup is still missing: every label bought in the last 30 days for a
        shipment (a LABELLED tracking event; the same tracking number reported twice is one parcel)
        that is on no active manifest, oldest first, scoped by legal entity. A parcel the carrier has
        already scanned (IN_TRANSIT or DELIVERED) or of a CANCELLED or DELIVERED shipment is left out.
        Ready parcels (their shipment is SHIPPED or PARTIALLY_SHIPPED) go on the next manifest; the
        others wait for their packing slip, which is the exception to chase after the warehouse's cutoff.
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: carrier, in: query, schema: { type: string, pattern: "^[a-z0-9-]{2,32}$" } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Unmanifested parcels, oldest label first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ManifestCandidate" } }
        "400": { description: "FUL-0050 invalid filter", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/manifests:
    post:
      operationId: closeManifest
      summary: Close a carrier manifest for a warehouse (FR-28.6)
      description: >
        Hands every ready parcel of the carrier in the warehouse and legal entity to a new CLOSED
        manifest with a gap-free MF- number: the end-of-day close-out. Parcels whose shipment has
        not shipped stay unmanifested. A parcel is on one active manifest at a time, and a concurrent
        close for the same warehouse and carrier waits for this one. FUL-0076 when no parcel is
        ready. The manifest is a record in this service; no call is made to the carrier, and
        providerManifestId stores the carrier's own reference when the caller has one. Publishes
        manifest.closed.
      x-passage-duty: fulfillment.warehouse.ship
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [warehouseId, legalEntityId, carrier, pickupDate]
              properties:
                warehouseId: { type: string, format: uuid }
                legalEntityId: { type: string, format: uuid }
                carrier: { type: string, pattern: "^[a-z0-9-]{2,32}$" }
                pickupDate: { type: string, format: date, description: "Within 7 days of today." }
                providerManifestId: { type: string, maxLength: 128 }
      responses:
        "201":
          description: The CLOSED manifest with its parcels; ETag carries its version
          headers:
            ETag: { schema: { type: string }, description: The manifest version. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manifest" }
        "400": { description: "FUL-0050 validation, FUL-0051 Idempotency-Key, COM-0001 malformed body", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { description: "FUL-0079 a parcel went on another manifest at the same time; reload and close again", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0076 no shipped parcel of the carrier is waiting in the warehouse, FUL-0058 legal entity outside your scope, or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    get:
      operationId: listManifests
      summary: List carrier manifests
      description: Manifests, newest pickup date first, filtered by warehouse, carrier, status and pickup date range; scoped by legal entity. Parcels are not listed; read one manifest for them.
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: carrier, in: query, schema: { type: string, pattern: "^[a-z0-9-]{2,32}$" } }
        - { name: status, in: query, schema: { type: string, enum: [CLOSED, CANCELLED] } }
        - { name: pickupFrom, in: query, schema: { type: string, format: date } }
        - { name: pickupTo, in: query, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Manifests, newest pickup first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Manifest" } }
        "400": { description: "FUL-0050 invalid filter", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/fulfillment/manifests/{id}:
    get:
      operationId: getManifest
      summary: Read one carrier manifest
      description: One manifest with every parcel on it, active or withdrawn by a cancel.
      x-passage-duty: fulfillment.warehouse.view
      parameters:
        - { $ref: "#/components/parameters/ManifestId" }
      responses:
        "200":
          description: The manifest with its parcels; ETag carries its version
          headers:
            ETag: { schema: { type: string }, description: The manifest version. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manifest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0077 manifest not found", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/fulfillment/manifests/{id}:cancel:
    post:
      operationId: cancelManifest
      summary: Cancel a CLOSED carrier manifest (FR-28.6)
      description: >
        Withdraws a manifest closed by mistake (wrong day or carrier). Its parcels are unmanifested
        again, so the next close takes them. Only a CLOSED manifest can be cancelled (FUL-0001), and
        not once the carrier has collected from it: a parcel on it scanned IN_TRANSIT or DELIVERED, or
        its shipment DELIVERED (FUL-0078). Publishes manifest.cancelled.
      x-passage-duty: fulfillment.warehouse.ship
      parameters:
        - { $ref: "#/components/parameters/ManifestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: The CANCELLED manifest; ETag carries the new version
          headers:
            ETag: { schema: { type: string }, description: The manifest version. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manifest" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { description: "FUL-0077 manifest not found", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: "conflict_version", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "FUL-0001 the manifest is already cancelled, FUL-0078 the carrier has collected a parcel on it, or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: "precondition_required", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
