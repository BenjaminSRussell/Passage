image:
  repository: ghcr.io/benjaminsrussell/passage/fulfillment
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 8080

# Secret holding DATABASE_URL (and DATABASE_MIGRATOR_URL when migrations run in-process).
database:
  secretName: fulfillment-db
  secretKey: DATABASE_URL

config:
  gs1CompanyPrefix: ""          # 6 to 12 digits, required (BR-28.5)
  ssccExtensionDigit: "0"
  releaseHorizonDays: "2"       # RELEASE_HORIZON_DAYS (FR-28.1)
  releaseRequiresFullAtp: "true"
  migrateOnStart: "false"       # dev only; stage and prod run the Argo PreSync migration Job

# Inventory holds on packing-slip post (wave 33 AC2). Empty skips the check.
inventoryUrl: ""

# carrier-gateway (#482) for rate shopping, labels and tracking pulls. Empty answers the carrier routes 503 FUL-0070.
# Needs serviceIdentity.signingKeySecret; carrier-gateway must list fulfillment's public key.
carrierGatewayUrl: ""

# Sales (#496): each posted packing slip is reported to POST /v1/sales/orders/{id}:record-progress
# by a reporter in every API replica (leased, so each report is sent by one replica at a time).
# Empty queues the reports (PENDING) without sending them; they go out once this is set.
# Needs serviceIdentity.signingKeySecret; sales must list fulfillment's public key.
salesUrl: ""
salesReportInterval: "30s"      # SALES_REPORT_INTERVAL, how often due reports are looked for

# Callers (edi reads shipments) present a signed service token verified against these
# keys, formatted name=base64-public-key and comma separated. signingKeySecret is
# required with inventoryUrl, carrierGatewayUrl or salesUrl (fulfillment signs those calls).
serviceIdentity:
  publicKeys: ""
  signingKeySecret: ""
  keyId: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10

serviceMonitor:
  enabled: false
  interval: 30s

# The sales order consumer (slice 19). It exits at start until
# service:fulfillment-order is seeded in the service principal table.
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: fulfillment-order
    username: fulfillment-consumer
    secret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
