components:
  messages:
    OrderHoldApplied:
      x-passage-type: dev.passage.sales.orderhold.applied.v1
      contentType: application/cloudevents+json
      summary: Sales applied a hold to an order (consumed)
      description: Published by sales (w27); fulfillment marks the hold active. Only `order_id`, `hold_id`, `hold_type` and `version` are read.
      payload:
        $ref: "#/components/schemas/OrderHoldData"
    OrderHoldReleased:
      x-passage-type: dev.passage.sales.orderhold.released.v1
      contentType: application/cloudevents+json
      summary: Sales released an order hold (consumed)
      description: Published by sales (w27); fulfillment marks the hold inactive. Same payload as the applied event.
      payload:
        $ref: "#/components/schemas/OrderHoldData"
    OrderConfirmed:
      x-passage-type: dev.passage.sales.order.confirmed.v1
      contentType: application/cloudevents+json
      summary: Sales confirmed an order (consumed)
      description: Published by sales (w27); fulfillment stores the order type per sales order. Only `order_id`, `order_type` and `version` are read; the per-line `atp_qty` sales adds in a later slice is optional and not stored yet.
      payload:
        $ref: "#/components/schemas/OrderConfirmedData"
    OrderRemainderCancelled:
      x-passage-type: dev.passage.sales.order.remaindercancelled.v1
      contentType: application/cloudevents+json
      summary: Sales cancelled the remainder of a partly shipped order (consumed)
      description: Published by sales (w27 slice 23). Fulfillment reads `order_id`, `legal_entity_id`, `version` and per line `line_id` and `kept_qty`, ordered by the sales order `version`.
      payload:
        $ref: "#/components/schemas/OrderRemainderCancelledData"
    ShipmentReleased:
      name: dev.passage.fulfillment.shipment.released.v1
      title: Shipment released
      summary: >
        An order was released to the warehouse as a shipment (FR-28.1). Inventory
        reserves and picking starts from it. A backorder shipment (short pick action
        REMAINDER_BACKORDER) names the shipment it took the remainder from in
        backorder_of: its lines are not a new release of the order lines.
      contentType: application/json
      payload:
        type: object
        required: [shipment_id, shipment_number, order_id, warehouse, lines]
        properties:
          shipment_id: { type: string, format: uuid }
          shipment_number: { type: string }
          order_id: { type: string, format: uuid }
          warehouse: { type: string, format: uuid }
          backorder_of: { type: string, format: uuid, description: "Set on a backorder shipment: the shipment whose closed remainder it took over (shipment.closed with backorder_shipment_id)." }
          lines:
            type: array
            items:
              type: object
              properties:
                order_line_id: { type: string, format: uuid }
                qty: { type: string }
    PickConfirmed:
      name: dev.passage.fulfillment.pick.confirmed.v1
      summary: Picks confirmed on a shipment; backordered is the short-picked remainder whose reservation inventory releases (FR-28.2).
      contentType: application/json
      payload:
        type: object
        required: [shipment_id, lines]
        properties:
          shipment_id: { type: string, format: uuid }
          wave_id: { type: string, format: uuid, description: "The wave whose confirmation picked the lines (FR-28.13); absent for a single-shipment pick." }
          lines:
            type: array
            items:
              type: object
              properties:
                order_line_id: { type: string, format: uuid }
                qty: { type: string }
                backordered: { type: string }
                over_picked: { type: string, description: "Quantity picked above the planned one, allowed by the over-delivery tolerance (BR-28.7); present only for such a pick, when backordered is 0." }
                short_reason: { type: string, enum: [OUT_OF_STOCK, DAMAGED, NOT_FOUND, QUALITY_HOLD, OTHER], description: "Reason of the short pick, present when one was given." }
    PackingSlipPosted:
      name: dev.passage.fulfillment.packingslip.posted.v1
      summary: >
        A packing slip posted. Inventory issues the line quantities; the ledger posts
        the journal with Idempotency-Key = packing_slip_id (BR-28.1, BR-28.4).
      contentType: application/json
      payload:
        type: object
        required: [packing_slip_id, packing_slip_number, shipment_id, order_id, customer_id, posting_date, currency, total_cost, lines, journal, packaging_fees, returnables]
        properties:
          packing_slip_id: { type: string, format: uuid }
          packing_slip_number: { type: string, example: "PS-0000001" }
          shipment_id: { type: string, format: uuid }
          order_id: { type: string, format: uuid }
          packaging_fee_billable: { type: boolean, description: "The legal entity packaging_fee_billable when the slip posted; billing (wave 29) charges the packaging_fees when true (BR-28.12)." }
          customer_id: { type: string, format: uuid }
          posting_date: { type: string, format: date }
          currency: { type: string }
          total_cost: { type: string }
          lines:
            type: array
            items: { $ref: "#/components/schemas/SlipLine" }
          journal:
            type: array
            items: { $ref: "#/components/schemas/JournalEntry" }
          packaging_fees:
            type: array
            description: Statistical packaging fee lines (BR-28.12); not part of the journal.
            items: { $ref: "#/components/schemas/PackagingFee" }
          returnables:
            type: array
            description: Returnable containers added to the customer's balance (BR-28.13).
            items: { $ref: "#/components/schemas/ReturnableMove" }
    PackingSlipCancelled:
      name: dev.passage.fulfillment.packingslip.cancelled.v1
      summary: >
        A posted, uninvoiced packing slip was cancelled. reversal_id names the reversing
        slip; its lines carry negative quantities and costs and its journal mirrors the
        original with negative amounts (FR-28.5). The inventory postings consumer books
        the exact mirror of each delivery line it booked for the slip (#480).
      contentType: application/json
      payload:
        type: object
        required: [packing_slip_id, reversal_id, shipment_id, order_id, posting_date, currency, lines, journal, packaging_fees, returnables]
        properties:
          packing_slip_id: { type: string, format: uuid, description: The cancelled slip. }
          packing_slip_number: { type: string, example: "PS-0000001", description: "The cancelled slip's number, the source reference its delivery was reported to sales under; inventory finds the delivery it booked by it (#480)." }
          reversal_id: { type: string, format: uuid, description: The reversing slip. }
          shipment_id: { type: string, format: uuid }
          order_id: { type: string, format: uuid }
          legal_entity_id: { type: string, format: uuid, description: "The shipment's legal entity (#480)." }
          posting_date: { type: string, format: date }
          currency: { type: string }
          lines:
            type: array
            items: { $ref: "#/components/schemas/SlipLine" }
          journal:
            type: array
            items: { $ref: "#/components/schemas/JournalEntry" }
          packaging_fees:
            type: array
            description: The original slip's packaging fee lines with negative weight and fee.
            items: { $ref: "#/components/schemas/PackagingFee" }
          returnables:
            type: array
            description: Returnable containers taken back off the customer's balance (negative qty).
            items: { $ref: "#/components/schemas/ReturnableMove" }
    ShipmentCancelled:
      name: dev.passage.fulfillment.shipment.cancelled.v1
      summary: >
        A shipment was cancelled before anything shipped and while it held no
        container (BR-28.6). Inventory releases the lines' reservations; the
        order lines can be released again.
      contentType: application/json
      payload:
        type: object
        required: [shipment_id, shipment_number, order_id, warehouse, lines]
        properties:
          shipment_id: { type: string, format: uuid }
          shipment_number: { type: string }
          order_id: { type: string, format: uuid }
          warehouse: { type: string, format: uuid }
          lines:
            type: array
            items:
              type: object
              properties:
                order_line_id: { type: string, format: uuid }
                qty: { type: string, description: The planned quantity that no longer ships. }
    ShipmentClosed:
      name: dev.passage.fulfillment.shipment.closed.v1
      title: Shipment remainder closed
      summary: >
        The open remainder of a partially shipped shipment was closed (FR-28.8: by
        hand, or by the short pick action CANCEL_REMAINDER or REMAINDER_BACKORDER
        when a packing slip posts). Inventory releases the reservation still held
        for the closed quantity (the backordered part of a short pick was already
        released on pick.confirmed, so it is not released twice) and returns picked
        stock that was never packed; sales cancels the remainder, or keeps the order
        lines open when backorder_shipment_id names the shipment that took it over.
      contentType: application/json
      payload:
        type: object
        required: [shipment_id, shipment_number, order_id, warehouse, lines]
        properties:
          shipment_id: { type: string, format: uuid }
          shipment_number: { type: string }
          order_id: { type: string, format: uuid }
          warehouse: { type: string, format: uuid }
          backorder_shipment_id: { type: string, format: uuid, description: "Set when the remainder moved to a new shipment (short pick action REMAINDER_BACKORDER): sales keeps the order lines open." }
          reason: { type: string, enum: [order_remainder_cancelled], description: "Set when sales cancelled the remainder of the order (order.remaindercancelled.v1) and fulfillment cut the shipment back; sales already knows and must not cancel again. Absent when the warehouse closed the remainder." }
          lines:
            type: array
            items:
              type: object
              required: [order_line_id, qty, picked_unpacked]
              properties:
                order_line_id: { type: string, format: uuid }
                qty: { type: string, description: The planned quantity that will not ship. }
                picked_unpacked: { type: string, description: The part of qty that was picked but never packed and goes back to stock. }
    WarehouseSettingChanged:
      name: dev.passage.fulfillment.warehousesetting.changed.v1
      title: Warehouse short pick action changed
      summary: >
        The short pick action of a warehouse was saved (FR-28.8): KEEP_OPEN,
        CANCEL_REMAINDER or REMAINDER_BACKORDER.
      contentType: application/json
      payload:
        type: object
        required: [warehouse, legal_entity_id, short_pick_action, previous_short_pick_action, version]
        properties:
          warehouse: { type: string, format: uuid }
          legal_entity_id: { type: string, format: uuid }
          short_pick_action: { type: string, enum: [KEEP_OPEN, CANCEL_REMAINDER, REMAINDER_BACKORDER] }
          previous_short_pick_action: { type: string, enum: [KEEP_OPEN, CANCEL_REMAINDER, REMAINDER_BACKORDER] }
          version: { type: integer, minimum: 1 }
    ExceptionRaised:
      name: dev.passage.fulfillment.exception.raised.v1
      title: Warehouse exception raised
      summary: >
        Fulfillment recorded a case the warehouse supervisor must handle: a packing slip
        posted beyond the quantity sales kept when it cancelled the remainder of the order
        (SLIP_POSTED_BEYOND_KEPT), packed quantity beyond it (PACKED_BEYOND_KEPT), or a vendor confirmation of a drop-ship beyond it (DROPSHIP_CONFIRMED_BEYOND_KEPT).
      contentType: application/json
      payload:
        type: object
        required: [exception_id, kind, order_id, order_line_id, qty, kept_qty, detail]
        properties:
          exception_id: { type: string, format: uuid }
          kind: { type: string, enum: [SLIP_POSTED_BEYOND_KEPT, PACKED_BEYOND_KEPT, DROPSHIP_CONFIRMED_BEYOND_KEPT] }
          order_id: { type: string, format: uuid }
          order_line_id: { type: string, format: uuid }
          shipment_id: { type: string, format: uuid }
          packing_slip_id: { type: string, format: uuid, description: "The latest posted slip of the order line, set for SLIP_POSTED_BEYOND_KEPT." }
          qty: { type: string, description: The quantity beyond what the order line keeps. }
          kept_qty: { type: string }
          detail: { type: string }
    ExceptionResolved:
      name: dev.passage.fulfillment.exception.resolved.v1
      title: Warehouse exception resolved
      summary: A warehouse supervisor closed an exception with a note.
      contentType: application/json
      payload:
        type: object
        required: [exception_id, kind, order_id, order_line_id, note, resolved_by]
        properties:
          exception_id: { type: string, format: uuid }
          kind: { type: string, enum: [SLIP_POSTED_BEYOND_KEPT, PACKED_BEYOND_KEPT, DROPSHIP_CONFIRMED_BEYOND_KEPT] }
          order_id: { type: string, format: uuid }
          order_line_id: { type: string, format: uuid }
          note: { type: string }
          resolved_by: { type: string }
    ReturnablePackagingReturned:
      name: dev.passage.fulfillment.returnablepackaging.returned.v1
      title: Returnable packaging returned
      summary: A customer's return receipt lowered a returnable packaging balance (BR-28.13).
      contentType: application/json
      payload:
        type: object
        required: [movement_id, customer_id, container_type, kind, qty, balance_after]
        properties:
          movement_id: { type: string, format: uuid }
          customer_id: { type: string, format: uuid }
          container_type: { type: string }
          kind: { type: string, enum: [RETURNED] }
          qty: { type: string, description: "Signed whole number of containers; negative lowers the balance." }
          balance_after: { type: string }
          reference: { type: string, description: "The caller's own reference; omitted when none." }
          reason: { type: string, description: "Why the balance was corrected; omitted on a return receipt." }
    ReturnablePackagingAdjusted:
      name: dev.passage.fulfillment.returnablepackaging.adjusted.v1
      title: Returnable packaging balance adjusted
      summary: A logistics admin corrected a returnable packaging balance by hand, with a reason (FR-28.16).
      contentType: application/json
      payload:
        type: object
        required: [movement_id, customer_id, container_type, kind, qty, balance_after]
        properties:
          movement_id: { type: string, format: uuid }
          customer_id: { type: string, format: uuid }
          container_type: { type: string }
          kind: { type: string, enum: [ADJUSTED] }
          qty: { type: string, description: "Signed whole number of containers; negative lowers the balance." }
          balance_after: { type: string }
          reference: { type: string, description: "The caller's own reference; omitted when none." }
          reason: { type: string, description: "Why the balance was corrected; omitted on a return receipt." }
    WarehouseReleaseRuleChanged:
      name: dev.passage.fulfillment.warehousereleaserule.changed.v1
      title: Warehouse release rule changed
      summary: >
        The release and wave parameters of a warehouse were saved (section 5.28.13):
        release_horizon_days, release_requires_full_atp, wave_max_lines and wave_max_orders,
        with the values they replace.
      contentType: application/json
      payload:
        type: object
        required: [warehouse, legal_entity_id, release_horizon_days, release_requires_full_atp, wave_max_lines, wave_max_orders, previous_release_horizon_days, previous_release_requires_full_atp, previous_wave_max_lines, previous_wave_max_orders, version]
        properties:
          warehouse: { type: string, format: uuid }
          legal_entity_id: { type: string, format: uuid }
          release_horizon_days: { type: integer, minimum: 0, maximum: 30 }
          release_requires_full_atp: { type: boolean }
          wave_max_lines: { type: integer, minimum: 1, maximum: 2000 }
          wave_max_orders: { type: integer, minimum: 1, maximum: 500 }
          previous_release_horizon_days: { type: integer, minimum: 0, maximum: 30 }
          previous_release_requires_full_atp: { type: boolean }
          previous_wave_max_lines: { type: integer, minimum: 1, maximum: 2000 }
          previous_wave_max_orders: { type: integer, minimum: 1, maximum: 500 }
          version: { type: integer, minimum: 1 }
    ManifestClosed:
      name: dev.passage.fulfillment.manifest.closed.v1
      title: Carrier manifest closed
      summary: >
        The end-of-day manifest of a carrier at a warehouse was closed (FR-28.6): the labelled
        parcels, each a shipment and a tracking number, that the carrier collects on pickup_date.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ManifestPayload"
    ManifestCancelled:
      name: dev.passage.fulfillment.manifest.cancelled.v1
      title: Carrier manifest cancelled
      summary: A CLOSED carrier manifest was withdrawn; its parcels are unmanifested again and the next manifest takes them. Same payload as manifest.closed with status CANCELLED.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ManifestPayload"
    WarehouseOperationRuleChanged:
      name: dev.passage.fulfillment.warehouseoperationrule.changed.v1
      title: Warehouse operation rule changed
      summary: >
        The posting and packing parameters of a warehouse were saved (section 5.28.13):
        posting_date_source, the warehouse time zone, auto_pack_enabled and
        workbench_group_key_default, with the values they replace.
      contentType: application/json
      payload:
        type: object
        required: [warehouse, legal_entity_id, posting_date_source, time_zone, auto_pack_enabled, workbench_group_key_default, previous_posting_date_source, previous_time_zone, previous_auto_pack_enabled, previous_workbench_group_key_default, version]
        properties:
          warehouse: { type: string, format: uuid }
          legal_entity_id: { type: string, format: uuid }
          posting_date_source: { type: string, enum: [SHIP_TIMESTAMP, TODAY, MANUAL] }
          time_zone: { type: string }
          auto_pack_enabled: { type: boolean }
          workbench_group_key_default: { type: string, enum: [CUSTOMER, CARRIER, ZONE, PRODUCT] }
          previous_posting_date_source: { type: string, enum: [SHIP_TIMESTAMP, TODAY, MANUAL] }
          previous_time_zone: { type: string }
          previous_auto_pack_enabled: { type: boolean }
          previous_workbench_group_key_default: { type: string, enum: [CUSTOMER, CARRIER, ZONE, PRODUCT] }
          version: { type: integer, minimum: 1 }
    DeliveryToleranceChanged:
      name: dev.passage.fulfillment.deliverytolerance.changed.v1
      title: Delivery tolerance changed
      summary: >
        The over-delivery tolerance of a product and customer scope was saved (BR-28.7): the
        percentage of the planned quantity a pick may exceed, with the value it replaces (absent
        for a new scope). A scope that names no product or no customer applies to every one.
      contentType: application/json
      payload:
        type: object
        required: [tolerance_id, overdelivery_pct, version]
        properties:
          tolerance_id: { type: string, format: uuid }
          product_id: { type: string, format: uuid, description: "Absent when the tolerance applies to every product." }
          customer_id: { type: string, format: uuid, description: "Absent when the tolerance applies to every customer." }
          overdelivery_pct: { type: string, description: "0 to 100, at most 4 decimals." }
          previous_overdelivery_pct: { type: string, description: "The value replaced; absent for a new scope." }
          version: { type: integer, minimum: 1 }
    LegalEntitySettingChanged:
      name: dev.passage.fulfillment.legalentitysetting.changed.v1
      title: Legal entity posting settings changed
      summary: >
        The packing slip posting settings of a legal entity were saved: cogs_at_shipment,
        the COGS posting policy every packing slip of the legal entity follows (Dr 5000
        instead of Dr 1405, BR-28.1), and asn_enabled (publish the ASN with a post that
        does not say). Billing (wave 29) reads each slip's own journal, not this policy,
        to decide what to reverse at invoice.
      contentType: application/json
      payload:
        type: object
        required: [legal_entity_id, cogs_at_shipment, asn_enabled, previous_cogs_at_shipment, previous_asn_enabled, version]
        properties:
          legal_entity_id: { type: string, format: uuid }
          cogs_at_shipment: { type: boolean }
          asn_enabled: { type: boolean }
          previous_cogs_at_shipment: { type: boolean }
          previous_asn_enabled: { type: boolean }
          gs1_company_prefix: { type: string, description: "The legal entity's GS1 company prefix; absent when the process default is in force." }
          previous_gs1_company_prefix: { type: string, description: "The prefix replaced; absent when there was none." }
          sscc_extension_digit: { type: integer, minimum: 0, maximum: 9, description: "The legal entity's SSCC extension digit; absent when the process default is in force." }
          previous_sscc_extension_digit: { type: integer, minimum: 0, maximum: 9, description: "The extension digit replaced; absent when there was none." }
          packaging_fee_billable: { type: boolean }
          previous_packaging_fee_billable: { type: boolean }
          rtp_tracking_enabled: { type: boolean, description: "Packing slips of the legal entity raise the customers' returnable packaging balances (BR-28.13)." }
          previous_rtp_tracking_enabled: { type: boolean }
          rtp_charge_days: { type: integer, minimum: 30, maximum: 365, description: "Days after which an outstanding returnable balance of the legal entity is chargeable (FR-28.16)." }
          previous_rtp_charge_days: { type: integer, minimum: 30, maximum: 365 }
          version: { type: integer, minimum: 1 }
    DropShipCreated:
      name: dev.passage.fulfillment.dropship.created.v1
      title: Drop-ship created
      summary: >
        A drop-ship was created for an order line against a purchase order line (FR-28.7). Purchasing
        may watch it to expect the vendor's shipment; nothing is booked yet.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/DropShipPayload"
    DropShipConfirmed:
      name: dev.passage.fulfillment.dropship.confirmed.v1
      title: Drop-ship confirmed by the vendor
      summary: >
        The vendor shipped the drop-ship line, all of it or one part of it (AC-28.5). Published once
        per vendor shipment: a whole confirmation sends one event with confirmation_seq 1,
        confirmed_qty equal to qty, status CONFIRMED and the whole-line journal, exactly as before
        partial confirmations existed; a vendor that ships in parts sends one event per shipment
        (status PARTIALLY_CONFIRMED until the quantity is all confirmed or closed, then CONFIRMED).
        Consumers act on confirmed_qty and this event's journal, never on qty (the ordered
        quantity), and de-duplicate on drop_ship_id plus confirmation_seq; qty_confirmed is the
        running total. The journal is Dr 5000 / Cr 2110 at the purchase order cost for
        confirmed_qty (the cost of the confirmed total rounded once, less what earlier confirmations
        booked, so the parts add up to the whole-line amount), for the ledger to post with
        Idempotency-Key = drop_ship_id plus confirmation_seq; there is no inventory transaction. No
        packingslip.posted is published for a drop-ship line, so this event is how sales (wave 27)
        learns that order_line_id shipped confirmed_qty (it marks that much shipped) and how billing
        (wave 29) learns it can invoice confirmed_qty.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/DropShipPayload"
    DropShipCancelled:
      name: dev.passage.fulfillment.dropship.cancelled.v1
      title: Drop-ship cancelled
      summary: An OPEN drop-ship was cancelled before the vendor confirmed (by hand, or with reason order_remainder_cancelled when sales cancelled the remainder and the line keeps nothing); nothing was booked.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/DropShipPayload"
    DropShipClosed:
      name: dev.passage.fulfillment.dropship.closed.v1
      title: Drop-ship remainder closed
      summary: >
        The vendor shipped part of the drop-ship and will not ship the rest. qty_closed is the
        quantity that never shipped, the status is CONFIRMED, and the journal is empty (nothing is
        booked for the closed quantity). Sales may cancel the order line remainder from it, unless reason is order_remainder_cancelled (sales cancelled it first; the status then stays OPEN or PARTIALLY_CONFIRMED when quantity is still open).
      contentType: application/json
      payload:
        $ref: "#/components/schemas/DropShipPayload"
    PickTracked:
      name: dev.passage.fulfillment.pick.tracked.v1
      title: Pick tracking captured
      summary: >
        The batch, serial and location entries of a shipment line were captured or
        replaced at pick (BR-28.10). Entries is the full set not yet shipped on the line.
      contentType: application/json
      payload:
        type: object
        required: [shipment_id, shipment_number, warehouse, line]
        properties:
          shipment_id: { type: string, format: uuid }
          shipment_number: { type: string }
          warehouse: { type: string, format: uuid }
          line:
            type: object
            required: [order_line_id, product_id, entries]
            properties:
              order_line_id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              entries:
                type: array
                items: { $ref: "#/components/schemas/TrackingEntry" }
    ContainerNested:
      name: dev.passage.fulfillment.container.nested.v1
      title: Cartons put on a pallet
      summary: >
        CLOSED cartons of a shipment were put on a new pallet (nested container). The
        pallet has its own SSCC and holds no lines; the cartons keep their SSCCs and
        lines. The pallet and its cartons ship together on the next packing slip.
      contentType: application/json
      payload:
        type: object
        required: [shipment_id, shipment_number, container_id, sscc, container_type, child_ssccs]
        properties:
          shipment_id: { type: string, format: uuid }
          shipment_number: { type: string }
          container_id: { type: string, format: uuid }
          sscc: { type: string, pattern: "^[0-9]{18}$", description: The SSCC of the pallet. }
          container_type: { type: string }
          child_ssccs:
            type: array
            description: The SSCCs of the cartons on the pallet.
            items: { type: string, pattern: "^[0-9]{18}$" }
    ContainerUnnested:
      name: dev.passage.fulfillment.container.unnested.v1
      title: Pallet dissolved
      summary: >
        A pallet was dissolved before it shipped. The cartons are top-level containers
        again; the pallet SSCC stays issued and is never reused.
      contentType: application/json
      payload:
        type: object
        required: [shipment_id, shipment_number, container_id, sscc, container_type, child_ssccs]
        properties:
          shipment_id: { type: string, format: uuid }
          shipment_number: { type: string }
          container_id: { type: string, format: uuid }
          sscc: { type: string, pattern: "^[0-9]{18}$", description: The SSCC of the pallet. }
          container_type: { type: string }
          child_ssccs:
            type: array
            description: The SSCCs of the cartons on the pallet.
            items: { type: string, pattern: "^[0-9]{18}$" }
    ContainerUnpacked:
      name: dev.passage.fulfillment.container.unpacked.v1
      title: Container unpacked
      summary: >
        A CLOSED container was taken apart before it shipped. Its SSCC stays issued
        and is never reused; the line quantities return to the unpacked pool of the
        shipment, which goes back to PICKED when it had been PACKED.
      contentType: application/json
      payload:
        type: object
        required: [shipment_id, shipment_number, container_id, sscc, lines]
        properties:
          shipment_id: { type: string, format: uuid }
          shipment_number: { type: string }
          container_id: { type: string, format: uuid }
          sscc: { type: string, description: The 18-digit SSCC of the unpacked container. }
          lines:
            type: array
            items:
              type: object
              required: [order_line_id, qty]
              properties:
                order_line_id: { type: string, format: uuid }
                qty: { type: string, description: The quantity that was in the container. }
    WaveCreated:
      name: dev.passage.fulfillment.wave.created.v1
      summary: >
        The picking workbench created a pick wave (FR-28.13); its shipments moved
        to PICKING in the same transaction. Lines of one shipment are in one wave
        (BR-28.14).
      contentType: application/json
      payload:
        type: object
        required: [wave_id, wave_number, legal_entity_id, warehouse, group_by, group_key, shipment_ids, line_count, order_count]
        properties:
          wave_id: { type: string, format: uuid }
          wave_number: { type: string, example: "WV-0000001" }
          legal_entity_id: { type: string, format: uuid }
          warehouse: { type: string, format: uuid }
          group_by: { type: string, enum: [CUSTOMER, CARRIER, ZONE, PRODUCT] }
          group_key: { type: string, description: The group value; UNASSIGNED when the shipments have none. }
          shipment_ids:
            type: array
            items: { type: string, format: uuid }
          line_count: { type: integer }
          order_count: { type: integer }
    WaveAssigned:
      name: dev.passage.fulfillment.wave.assigned.v1
      summary: >
        A supervisor gave a pick wave to a picker or handed it to another one
        (FR-28.13). previous_picker is absent on the first assignment.
      contentType: application/json
      payload:
        type: object
        required: [wave_id, wave_number, legal_entity_id, warehouse, picker]
        properties:
          wave_id: { type: string, format: uuid }
          wave_number: { type: string, example: "WV-0000001" }
          legal_entity_id: { type: string, format: uuid }
          warehouse: { type: string, format: uuid }
          picker: { type: string }
          previous_picker: { type: string }
    WaveClosed:
      name: dev.passage.fulfillment.wave.closed.v1
      summary: >
        A pick wave was closed: every line is picked, or sits on a cancelled
        shipment. short_lines counts the lines picked below plan.
      contentType: application/json
      payload:
        type: object
        required: [wave_id, wave_number, legal_entity_id, warehouse, shipment_ids, line_count, short_lines]
        properties:
          wave_id: { type: string, format: uuid }
          wave_number: { type: string, example: "WV-0000001" }
          legal_entity_id: { type: string, format: uuid }
          warehouse: { type: string, format: uuid }
          picker: { type: string, description: Absent when the wave was never assigned. }
          shipment_ids:
            type: array
            items: { type: string, format: uuid }
          line_count: { type: integer }
          short_lines: { type: integer }
    ASNIssued:
      name: dev.passage.fulfillment.asn.issued.v1
      summary: >
        Advance ship notice of a posted packing slip (FR-28.9), published when the
        post asks for it (asnEnabled). It lists the containers that left with that
        slip, with their SSCCs and order-line quantities, for the wave 35 EDI mapper.
      contentType: application/json
      payload:
        type: object
        required: [shipment_id, shipment_number, order_id, packing_slip_id, packing_slip_number, carrier, containers]
        properties:
          shipment_id: { type: string, format: uuid }
          shipment_number: { type: string }
          order_id: { type: string, format: uuid }
          packing_slip_id: { type: string, format: uuid }
          packing_slip_number: { type: string }
          carrier: { type: string, description: The shipment's carrier code; empty when none was given. }
          containers:
            type: array
            items:
              type: object
              required: [sscc, container_type, lines]
              properties:
                sscc: { type: string, pattern: "^[0-9]{18}$" }
                container_type: { type: string }
                parent_sscc: { type: string, pattern: "^[0-9]{18}$", description: The SSCC of the pallet the container sits on; absent for a top-level container. }
                lines:
                  type: array
                  items:
                    type: object
                    properties:
                      order_line_id: { type: string, format: uuid }
                      qty: { type: string }
    TrackingUpdated:
      name: dev.passage.fulfillment.tracking.updated.v1
      summary: >
        A new carrier tracking event for a shipment (FR-28.10), from carrier-gateway
        or entered by hand. A redelivered provider event publishes nothing. The
        portal and sales show it.
      contentType: application/json
      payload:
        type: object
        required: [shipment_id, order_id, provider, tracking_number, event_key, status, description, event_time]
        properties:
          shipment_id: { type: string, format: uuid }
          order_id: { type: string, format: uuid }
          provider: { type: string, example: easypost }
          tracking_number: { type: string }
          event_key: { type: string, description: The provider's event id. }
          status: { type: string, enum: [QUOTED, LABELLED, MANIFESTED, IN_TRANSIT, DELIVERED, EXCEPTION] }
          description: { type: string }
          event_time: { type: string, format: date-time }
  schemas:
    OrderRemainderCancelledData:
      type: object
      description: The part of sales' payload fulfillment reads.
      required: [order_id, legal_entity_id, version, lines]
      properties:
        order_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        version:
          type: integer
          minimum: 1
          description: The sales order version; an older event never overwrites a newer one for the same order line.
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [line_id, kept_qty]
            properties:
              line_id: { type: string, format: uuid, description: The sales order line (the shipment line's order_line_id). }
              kept_qty: { type: string, description: "Decimal quantity the order line keeps, 0 or more." }
    OrderHoldData:
      type: object
      description: The part of sales' payload fulfillment reads.
      required: [order_id, hold_id, hold_type, version]
      properties:
        order_id: { type: string, format: uuid }
        hold_id: { type: string, format: uuid }
        hold_type: { type: string, description: The sales hold type, for example CREDIT. }
        version:
          type: integer
          minimum: 1
          description: The sales order version; an older event never overwrites a newer one.
    OrderConfirmedData:
      type: object
      description: The part of sales' payload fulfillment reads.
      required: [order_id, order_type, version]
      properties:
        order_id: { type: string, format: uuid }
        order_type:
          type: string
          enum: [ORDER, JOURNAL, SUBSCRIPTION, RETURNED]
          description: A JOURNAL order never ships (BR-27.7).
        version:
          type: integer
          minimum: 1
          description: The sales order version; an older event never overwrites a newer one.
    ManifestPayload:
      type: object
      required: [manifest_id, manifest_number, status, legal_entity_id, warehouse, carrier, pickup_date, parcel_count, shipment_count, parcels]
      properties:
        manifest_id: { type: string, format: uuid }
        manifest_number: { type: string, description: "MF- number, gap-free per legal entity." }
        status: { type: string, enum: [CLOSED, CANCELLED] }
        legal_entity_id: { type: string, format: uuid }
        warehouse: { type: string, format: uuid }
        carrier: { type: string }
        pickup_date: { type: string, format: date }
        provider_manifest_id: { type: string, description: "The carrier's own manifest reference, when the caller gave one." }
        parcel_count: { type: integer, minimum: 1 }
        shipment_count: { type: integer, minimum: 1 }
        parcels:
          type: array
          items:
            type: object
            required: [shipment_id, shipment_number, order_id, tracking_number]
            properties:
              shipment_id: { type: string, format: uuid }
              shipment_number: { type: string }
              order_id: { type: string, format: uuid }
              tracking_number: { type: string }
    DropShipPayload:
      type: object
      required: [drop_ship_id, drop_ship_number, status, legal_entity_id, order_id, order_line_id, customer_id, product_id, unit, qty, vendor_id, purchase_order_id, purchase_order_line_id, unit_cost, currency, qty_confirmed, qty_closed, journal]
      properties:
        drop_ship_id: { type: string, format: uuid }
        drop_ship_number: { type: string, example: "DS-0000001" }
        status: { type: string, enum: [OPEN, PARTIALLY_CONFIRMED, CONFIRMED, CANCELLED] }
        legal_entity_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        order_line_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        unit: { type: string }
        qty: { type: string, description: "The ordered quantity of the drop-ship; not the quantity of a confirmation (confirmed_qty)." }
        vendor_id: { type: string, format: uuid }
        purchase_order_id: { type: string, format: uuid }
        purchase_order_line_id: { type: string, format: uuid }
        unit_cost: { type: string }
        currency: { type: string }
        vendor_shipment_ref: { type: string }
        shipped_on: { type: string, format: date }
        posting_date: { type: string, format: date }
        qty_confirmed: { type: string, description: "Quantity confirmed by the vendor so far, including this event." }
        qty_closed: { type: string, description: "Quantity closed without shipping, set by dropship.closed." }
        confirmation_seq: { type: integer, minimum: 1, description: "The number of this vendor confirmation on the drop-ship (1, 2, ...), always set in dropship.confirmed and absent from the other events; with drop_ship_id it identifies the confirmation." }
        confirmed_qty: { type: string, description: "The quantity of this vendor shipment, always set in dropship.confirmed (equal to qty for a whole confirmation) and absent from the other events." }
        journal:
          type: array
          description: The journal of this confirmation in dropship.confirmed; empty in every other event.
          items: { $ref: "#/components/schemas/JournalEntry" }
        reason: { type: string, enum: [order_remainder_cancelled], description: "Set in dropship.closed and dropship.cancelled when sales cancelled the remainder of the order and fulfillment followed it; sales already knows and must not cancel again." }
    SlipLine:
      type: object
      required: [order_line_id, qty, cost_amount, cost_snapshot_id]
      properties:
        order_line_id: { type: string, format: uuid }
        qty: { type: string }
        cost_amount: { type: string }
        cost_snapshot_id: { type: string }
        weight: { type: string, description: "catch-weight lines only (#480): the shipped weight cost_amount is taken on (negated on a reversal); qty stays the cases" }
        product_id: { type: string, format: uuid, description: Set on a posted slip line. }
        tracking:
          type: array
          description: Batches and serials shipping on this line (BR-28.10); absent for an untracked line and for a reversal.
          items: { $ref: "#/components/schemas/TrackingEntry" }
    TrackingEntry:
      type: object
      required: [qty]
      properties:
        batch_no: { type: string }
        serial_no: { type: string }
        location_code: { type: string }
        qty: { type: string }
    JournalEntry:
      type: object
      description: Signed amount; debits positive, credits negative.
      required: [account, amount, currency, order_line_id]
      properties:
        account: { type: string, example: "1405" }
        amount: { type: string }
        currency: { type: string }
        order_line_id: { type: string, format: uuid }
    PackagingFee:
      type: object
      required: [country_code, material_code, weight_kg, rate_per_kg, fee_amount, currency]
      properties:
        country_code: { type: string, example: DE }
        material_code: { type: string, example: CARDBOARD }
        weight_kg: { type: string }
        rate_per_kg: { type: string }
        fee_amount: { type: string, description: Rounded half-even to the currency's minor unit. }
        currency: { type: string }
    ReturnableMove:
      type: object
      required: [container_type, qty]
      properties:
        container_type: { type: string, example: PALLET }
        qty: { type: string, description: Signed change of the balance. }
