asyncapi: 3.0.0
info:
  title: Passage Fulfillment events
  version: 1.0.0
  description: >
    Events published by the fulfillment service through the transactional outbox
    (Debezium outbox event router to Kafka). Types follow
    dev.passage.<context>.<entity>.<verb>.v<n>; the packing-slip entity is
    "packingslip" and the PRD's shipment.tracking-updated is tracking.updated,
    because the kernel allows one lowercase segment per name part.
    Source /passage/fulfillment/fulfillment. Schema evolution is additive only.
defaultContentType: application/cloudevents+json
channels:
  shipmentReleased:
    address: passage.fulfillment.shipment
    messages:
      shipmentReleased:
        $ref: "#/components/messages/ShipmentReleased"
  pickConfirmed:
    address: passage.fulfillment.pick
    messages:
      pickConfirmed:
        $ref: "#/components/messages/PickConfirmed"
  packingSlipPosted:
    address: passage.fulfillment.packingslip
    messages:
      packingSlipPosted:
        $ref: "#/components/messages/PackingSlipPosted"
  packingSlipCancelled:
    address: passage.fulfillment.packingslip
    messages:
      packingSlipCancelled:
        $ref: "#/components/messages/PackingSlipCancelled"
  shipmentCancelled:
    address: passage.fulfillment.shipment
    messages:
      shipmentCancelled:
        $ref: "#/components/messages/ShipmentCancelled"
  shipmentClosed:
    address: passage.fulfillment.shipment
    messages:
      shipmentClosed:
        $ref: "#/components/messages/ShipmentClosed"
  warehouseSettingChanged:
    address: passage.fulfillment.warehousesetting
    messages:
      warehouseSettingChanged:
        $ref: "#/components/messages/WarehouseSettingChanged"
  exceptionRaised:
    address: passage.fulfillment.exception
    messages:
      exceptionRaised:
        $ref: "#/components/messages/ExceptionRaised"
  exceptionResolved:
    address: passage.fulfillment.exception
    messages:
      exceptionResolved:
        $ref: "#/components/messages/ExceptionResolved"
  returnablePackagingReturned:
    address: passage.fulfillment.returnablepackaging
    messages:
      returnablePackagingReturned:
        $ref: "#/components/messages/ReturnablePackagingReturned"
  returnablePackagingAdjusted:
    address: passage.fulfillment.returnablepackaging
    messages:
      returnablePackagingAdjusted:
        $ref: "#/components/messages/ReturnablePackagingAdjusted"
  warehouseReleaseRuleChanged:
    address: passage.fulfillment.warehousereleaserule
    messages:
      warehouseReleaseRuleChanged:
        $ref: "#/components/messages/WarehouseReleaseRuleChanged"
  warehouseOperationRuleChanged:
    address: passage.fulfillment.warehouseoperationrule
    messages:
      warehouseOperationRuleChanged:
        $ref: "#/components/messages/WarehouseOperationRuleChanged"
  manifestClosed:
    address: passage.fulfillment.manifest
    messages:
      manifestClosed:
        $ref: "#/components/messages/ManifestClosed"
  manifestCancelled:
    address: passage.fulfillment.manifest
    messages:
      manifestCancelled:
        $ref: "#/components/messages/ManifestCancelled"
  deliveryToleranceChanged:
    address: passage.fulfillment.deliverytolerance
    messages:
      deliveryToleranceChanged:
        $ref: "#/components/messages/DeliveryToleranceChanged"
  legalEntitySettingChanged:
    address: passage.fulfillment.legalentitysetting
    messages:
      legalEntitySettingChanged:
        $ref: "#/components/messages/LegalEntitySettingChanged"
  dropShipCreated:
    address: passage.fulfillment.dropship
    messages:
      dropShipCreated:
        $ref: "#/components/messages/DropShipCreated"
  dropShipConfirmed:
    address: passage.fulfillment.dropship
    messages:
      dropShipConfirmed:
        $ref: "#/components/messages/DropShipConfirmed"
  dropShipCancelled:
    address: passage.fulfillment.dropship
    messages:
      dropShipCancelled:
        $ref: "#/components/messages/DropShipCancelled"
  dropShipClosed:
    address: passage.fulfillment.dropship
    messages:
      dropShipClosed:
        $ref: "#/components/messages/DropShipClosed"
  pickTracked:
    address: passage.fulfillment.pick
    messages:
      pickTracked:
        $ref: "#/components/messages/PickTracked"
  containerUnpacked:
    address: passage.fulfillment.container
    messages:
      containerUnpacked:
        $ref: "#/components/messages/ContainerUnpacked"
  containerNested:
    address: passage.fulfillment.container
    messages:
      containerNested:
        $ref: "#/components/messages/ContainerNested"
  containerUnnested:
    address: passage.fulfillment.container
    messages:
      containerUnnested:
        $ref: "#/components/messages/ContainerUnnested"
  waveCreated:
    address: passage.fulfillment.wave
    messages:
      waveCreated:
        $ref: "#/components/messages/WaveCreated"
  waveAssigned:
    address: passage.fulfillment.wave
    messages:
      waveAssigned:
        $ref: "#/components/messages/WaveAssigned"
  waveClosed:
    address: passage.fulfillment.wave
    messages:
      waveClosed:
        $ref: "#/components/messages/WaveClosed"
  asnIssued:
    address: passage.fulfillment.asn
    messages:
      asnIssued:
        $ref: "#/components/messages/ASNIssued"
  trackingUpdated:
    address: passage.fulfillment.tracking
    messages:
      trackingUpdated:
        $ref: "#/components/messages/TrackingUpdated"
  salesOrder:
    address: passage.sales.order
    description: |
      Sales' confirmed orders (w27), consumed by the `fulfillment-order` consumer (service principal
      `service:fulfillment-order`, duty `fulfillment.order.sync`). Fulfillment keeps the order type per
      sales order; release and drop-ship creation use it in place of a caller-supplied `orderType` (JOURNAL
      from either side wins) and the packing slip post refuses a stored JOURNAL order (FUL-0065), so a
      JOURNAL order never ships. An event without `order_type` is dead-lettered. The consumer keeps the highest sales order `version` and refuses
      (dead-letters) an event whose CloudEvents `source` is not `sales`.
      The same topic carries order.remaindercancelled.v1 (w27 slice 23): per line the consumer stores the kept
      quantity, cuts the quantity not yet packed (shipment lines shrink, picked stock above the new plan returns,
      a shipment with nothing left is cancelled; shipment.closed with reason `order_remainder_cancelled` or
      shipment.cancelled tell inventory to release the reservations), refuses a packing slip post of more than
      the kept quantity (FUL-0066), and raises an exception for the warehouse supervisor when a slip was already
      posted beyond it or packed quantity is left over.
    messages:
      orderConfirmed:
        $ref: "#/components/messages/OrderConfirmed"
      orderRemainderCancelled:
        $ref: "#/components/messages/OrderRemainderCancelled"
  salesOrderHold:
    address: passage.sales.orderhold
    description: |
      Sales' order holds (w27), consumed by the same `fulfillment-order` consumer. An active hold
      (applied, not yet released) stops the packing slip post (FUL-0001) and release skips the order's
      lines as `held`. The consumer keeps the highest sales order `version` per hold and refuses
      (dead-letters) an event whose CloudEvents `source` is not `sales`.
    messages:
      orderHoldApplied:
        $ref: "#/components/messages/OrderHoldApplied"
      orderHoldReleased:
        $ref: "#/components/messages/OrderHoldReleased"
operations:
  receiveOrderHoldApplied:
    action: receive
    channel: { $ref: "#/channels/salesOrderHold" }
    messages:
      - $ref: "#/channels/salesOrderHold/messages/orderHoldApplied"
  receiveOrderHoldReleased:
    action: receive
    channel: { $ref: "#/channels/salesOrderHold" }
    messages:
      - $ref: "#/channels/salesOrderHold/messages/orderHoldReleased"
  receiveOrderRemainderCancelled:
    action: receive
    channel: { $ref: "#/channels/salesOrder" }
    messages:
      - $ref: "#/channels/salesOrder/messages/orderRemainderCancelled"
  receiveOrderConfirmed:
    action: receive
    channel: { $ref: "#/channels/salesOrder" }
    messages:
      - $ref: "#/channels/salesOrder/messages/orderConfirmed"
  publishShipmentReleased:
    action: send
    channel: { $ref: "#/channels/shipmentReleased" }
    messages:
