  publishPackingSlipPosted:
    action: send
    channel: { $ref: "#/channels/packingSlipPosted" }
    messages:
      - $ref: "#/channels/packingSlipPosted/messages/packingSlipPosted"
  publishPackingSlipCancelled:
    action: send
    channel: { $ref: "#/channels/packingSlipCancelled" }
    messages:
      - $ref: "#/channels/packingSlipCancelled/messages/packingSlipCancelled"
  publishShipmentCancelled:
    action: send
    channel: { $ref: "#/channels/shipmentCancelled" }
    messages:
      - $ref: "#/channels/shipmentCancelled/messages/shipmentCancelled"
  publishShipmentClosed:
    action: send
    channel: { $ref: "#/channels/shipmentClosed" }
    messages:
      - $ref: "#/channels/shipmentClosed/messages/shipmentClosed"
  publishWarehouseSettingChanged:
    action: send
    channel: { $ref: "#/channels/warehouseSettingChanged" }
    messages:
      - $ref: "#/channels/warehouseSettingChanged/messages/warehouseSettingChanged"
  publishExceptionRaised:
    action: send
    channel: { $ref: "#/channels/exceptionRaised" }
    messages:
      - $ref: "#/channels/exceptionRaised/messages/exceptionRaised"
  publishExceptionResolved:
    action: send
    channel: { $ref: "#/channels/exceptionResolved" }
    messages:
      - $ref: "#/channels/exceptionResolved/messages/exceptionResolved"
  publishReturnablePackagingReturned:
    action: send
    channel: { $ref: "#/channels/returnablePackagingReturned" }
    messages:
      - $ref: "#/channels/returnablePackagingReturned/messages/returnablePackagingReturned"
  publishReturnablePackagingAdjusted:
    action: send
    channel: { $ref: "#/channels/returnablePackagingAdjusted" }
    messages:
      - $ref: "#/channels/returnablePackagingAdjusted/messages/returnablePackagingAdjusted"
  publishWarehouseReleaseRuleChanged:
    action: send
    channel: { $ref: "#/channels/warehouseReleaseRuleChanged" }
    messages:
