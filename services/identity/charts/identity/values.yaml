image:
  repository: ghcr.io/benjaminsrussell/identity
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: identity-db
migrateOnStart: false
operatorTenantId: ""
scim:
  issuerBase: ""
  audience: passage-api
  opaUrl: ""
bundle:
  enabled: false
  secret: identity-bundle
  keyId: identity-policy
  port: 8443
networkPolicy:
  gatewayNamespaces: []
  opaNamespaces: []
  opaPodLabels: {}
replicaCount: 1
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
