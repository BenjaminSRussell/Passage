{{- if and .Values.keycloakDeprovision.enabled .Values.keycloakDeprovision.externalSecret.enabled }}
{{- $es := .Values.keycloakDeprovision.externalSecret }}
{{- $prefix := replace "{env}" (required "keycloakDeprovision.externalSecret.environment is required" $es.environment) $es.pathPrefix }}
{{- if not $es.realms }}
{{- fail "keycloakDeprovision.externalSecret.realms must list the tenant realms whose passage-identity-deprovision secret identity reads" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.keycloakDeprovision.secretName }}
  labels:
    app.kubernetes.io/name: identity
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.storeName }}
  target:
    name: {{ .Values.keycloakDeprovision.secretName }}
    creationPolicy: Owner
  data:
    {{- range $realm := $es.realms }}
    {{- if not (regexMatch "^[a-z0-9][a-z0-9-]{1,62}$" $realm) }}
    {{- fail (printf "keycloakDeprovision.externalSecret.realms entry %q is not a realm name" $realm) }}
    {{- end }}
    - secretKey: {{ $realm }}
      remoteRef:
        key: {{ $prefix }}/{{ $realm }}
        property: value
    {{- end }}
{{- end }}
