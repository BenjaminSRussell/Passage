apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: identity
spec:
  selector:
    app.kubernetes.io/name: identity
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- if .Values.bundle.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-bundle
  labels:
    app.kubernetes.io/name: identity
spec:
  selector:
    app.kubernetes.io/name: identity
  ports:
    - { name: bundle, port: {{ .Values.bundle.port }}, targetPort: bundle }
{{- end }}
