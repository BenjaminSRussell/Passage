apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: identity
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.gatewayNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
    {{- if .Values.bundle.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.opaPodLabels | nindent 14 }}
        {{- range .Values.networkPolicy.opaNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector:
            matchLabels:
              {{- toYaml $.Values.networkPolicy.opaPodLabels | nindent 14 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.bundle.port }} }
    {{- end }}
