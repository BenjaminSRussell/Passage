{{- if and .Values.keycloakDeprovision.enabled (not .Values.operatorTenantId) }}
{{- fail "keycloakDeprovision.enabled requires operatorTenantId" }}
{{- end }}
{{- $secretVolumes := or .Values.bundle.enabled .Values.keycloakDeprovision.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: identity
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
    spec:
      securityContext:
        runAsNonRoot: true
        {{- if $secretVolumes }}
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- if $secretVolumes }}
      volumes:
        {{- if .Values.bundle.enabled }}
        - name: bundle
          secret:
            secretName: {{ .Values.bundle.secret }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.keycloakDeprovision.enabled }}
        - name: keycloak
          secret:
            secretName: {{ .Values.keycloakDeprovision.secretName }}
            defaultMode: 0440
        {{- end }}
      {{- end }}
      containers:
        - name: identity
          image: {{ include "identity.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            {{- include "passage.cloudEnv" $ | nindent 12 }}
            {{- include "identity.env" . | nindent 12 }}
          {{- if $secretVolumes }}
          volumeMounts:
            {{- if .Values.bundle.enabled }}
            - { name: bundle, mountPath: /var/run/passage/bundle, readOnly: true }
            {{- end }}
            {{- if .Values.keycloakDeprovision.enabled }}
            - { name: keycloak, mountPath: /var/run/passage/keycloak, readOnly: true }
            {{- end }}
          {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            {{- if .Values.bundle.enabled }}
            - { name: bundle, containerPort: {{ .Values.bundle.port }} }
            {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
