openapi: 3.1.0
info:
  title: identity
  version: 0.1.0
  description: Identity service. This slice exposes tenant, legal-entity and role-assignment administration, the read-only user directory, role and duty catalogue, and effective-permission report.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/identity/users/{id}/effective-permissions:
    get:
      operationId: getUserEffectivePermissions
      x-passage-duty: identity.effective-permission.view
      description: >-
        Evaluates every route and method in the seeded duty catalogue for the user's active role
        assignments. The role of an assignment holds a duty name until the role catalogue exists;
        roles that are not seeded duties are listed in ignoredRoles and grant nothing. Tenant-wide
        assignments always apply; assignments for a legal entity apply when legalEntityId is given.
        Each decision equals the authorization policy's decision for the route's sample path.
        Duties are sourced from identity_role_assignments (role = duty name) until the role catalogue
        (issue #83) lands, whereas live authorization reads the JWT duties claim. A caller whose
        legal-entity scope is not all entities receives 403, because row-level security would hide
        tenant-wide and other-entity assignments and the report would be incomplete. Callers holding
        either identity.effective-permission.view or identity.user.maintain are accepted.
      security:
        - gatewayHeaders: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: legalEntityId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Effective permissions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectivePermissions' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/identity/users:
    get:
      operationId: listUsers
      x-passage-duty: identity.user.maintain
      description: >-
        Lists the caller's tenant's users by id, keyset-paged. Users belong to the tenant, so every caller holding
        identity.user.maintain sees all of them; legalEntityId narrows to users with an active role assignment for that
        legal entity that the caller's own legal-entity scope can see. q is a case-insensitive substring match on display
        name, email and IdP subject.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - { name: status, in: query, schema: { type: string, enum: [active, deprovisioned] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200': { description: A page of users., content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/identity/users/{id}:
    get:
      operationId: getUser
      summary: "Get a user"
      x-passage-duty: identity.user.maintain
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The user., content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/identity/users/{id}/keycloak-deprovisions:
    get:
      operationId: listKeycloakDeprovisions
      x-passage-duty: identity.user.maintain
      description: >-
        The Keycloak calls SCIM deprovisioning (active=false or DELETE) queued for the user, newest first. pending calls
        are retried with backoff; parked ones failed too often (or permanently) and wait for a retry; done ones disabled
        the Keycloak user and logged out its sessions, found no Keycloak user, or were superseded by a SCIM reactivation.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The user's Keycloak deprovisioning calls., content: { application/json: { schema: { $ref: '#/components/schemas/KeycloakDeprovisionList' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/identity/users/{id}/keycloak-deprovisions/{deprovisionId}:retry:
    post:
      operationId: retryKeycloakDeprovision
      x-passage-duty: identity.user.maintain
      description: >-
        Makes a parked or pending Keycloak deprovisioning call due now with its attempt count reset, after its cause is
        fixed. Needs a tenant administrator (tenant.administer, no legal-entity claim). A finished call returns 409
        IDN-KEYCLOAK-DEPROVISION-DONE. Audited and emitted as dev.passage.identity.keycloakdeprovision.retried.v1.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: deprovisionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The call, now pending., content: { application/json: { schema: { $ref: '#/components/schemas/KeycloakDeprovision' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/identity/customer-contacts:
    get:
      operationId: listCustomerContacts
      x-passage-duty: identity.customer-contact.maintain
      description: The customer portal contacts of the tenant, optionally for one customer or one status, ordered by contact id (page with after).
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [enabled, disabled] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: after, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: One page of contacts., content: { application/json: { schema: { $ref: '#/components/schemas/CustomerContactList' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      operationId: inviteCustomerContact
      x-passage-duty: identity.customer-contact.maintain
      description: >-
        Invites a person to the customer portal for one customer and the named legal entities (#30). Creates the user in the
        tenant's Keycloak realm with the role customer-user, the claims tenant_id, legal_entity_id (comma separated) and customer_id as
        attributes, and the required actions verify email, set a password and configure an authenticator (MFA enrolment), then asks
        Keycloak to email the link. A retry adopts the user an earlier attempt created. invitationSent is false when Keycloak could not
        send the email; :resend sends it again. The caller needs scope over every named legal entity. Identity does not read customers,
        so the customerId is taken as given. 409 IDN-CONTACT-EXISTS for an address already invited; 502 IDN-CONTACT-KEYCLOAK when
        Keycloak refused and nothing was stored; 503 IDN-CONTACT-KEYCLOAK-OFF when Keycloak administration is not configured. Audited
        and emitted as dev.passage.identity.customercontact.invited.v1 (ids only, never the address).
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, customerId, legalEntityIds]
              properties:
                email: { type: string, format: email }
                givenName: { type: string, maxLength: 100 }
                familyName: { type: string, maxLength: 100 }
                customerId: { type: string, format: uuid }
                legalEntityIds: { type: array, minItems: 1, maxItems: 20, items: { type: string, format: uuid } }
      responses:
        '201': { description: The contact., content: { application/json: { schema: { $ref: '#/components/schemas/CustomerContact' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/identity/customer-contacts/{id}:
    patch:
      operationId: remapCustomerContact
      x-passage-duty: identity.customer-contact.maintain
      description: >-
        Maps the contact to another customer and set of legal entities: the Keycloak attributes are rewritten and the contact's
        sessions end, so the next sign-in carries the new claims; the registry row follows. The caller needs scope over the new and the
        old legal entities. 409 IDN-CONTACT-DISABLED for a disabled contact. Audited and emitted as
        dev.passage.identity.customercontact.remapped.v1.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, legalEntityIds]
              properties:
                customerId: { type: string, format: uuid }
                legalEntityIds: { type: array, minItems: 1, maxItems: 20, items: { type: string, format: uuid } }
      responses:
        '200': { description: The contact with its new mapping., content: { application/json: { schema: { $ref: '#/components/schemas/CustomerContact' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/identity/customer-contacts/{id}:resend:
    post:
      operationId: resendCustomerContactInvitation
      x-passage-duty: identity.customer-contact.maintain
      description: Asks Keycloak to email the invitation link again (the link lasts seven days). 409 IDN-CONTACT-DISABLED for a disabled contact.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The contact with invitationSent true., content: { application/json: { schema: { $ref: '#/components/schemas/CustomerContact' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/identity/customer-contacts/{id}:disable:
    post:
      operationId: disableCustomerContact
      x-passage-duty: identity.customer-contact.maintain
      description: Disables the Keycloak account, ends its sessions and marks the contact disabled. Idempotent. Audited and emitted as dev.passage.identity.customercontact.disabled.v1.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The disabled contact., content: { application/json: { schema: { $ref: '#/components/schemas/CustomerContact' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/identity/customer-portal/legal-entity:
    get:
      operationId: customerPortalLegalEntity
      x-passage-duty: identity.customer-portal.read
      description: >-
        For the customer portal only (#30): the service-only duty, and the caller must be the customer-portal service token acting for a
        customer (a staff caller is 403). Answers the display name of the one legal entity of the token, for the portal's company
        selector; no id is taken from the request.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
      responses:
        '200':
          description: The legal entity of the token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  legalEntityId: { type: string, format: uuid }
                  displayName: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/authz/roles:
    get:
      operationId: listRoles
      x-passage-duty: identity.security-role.maintain
      description: Lists the role catalogue. Until roles are first-class a role is an assignable (not service-only) duty and its name is the duty name that role assignments hold. q is a case-insensitive substring filter on the name.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: All matching roles., content: { application/json: { schema: { $ref: '#/components/schemas/RoleList' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/authz/roles/{name}:
    get:
      operationId: getRole
      x-passage-duty: identity.security-role.maintain
      description: A role with the duties it holds and the routes each duty grants. A service-only duty is not a role (404 IDN-ROLE-NOT-FOUND).
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The role., content: { application/json: { schema: { $ref: '#/components/schemas/RoleDetail' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/authz/duties:
    get:
      operationId: listDuties
      x-passage-duty: identity.security-role.maintain
      description: Lists every seeded duty with its route count, sorted by name. q is a case-insensitive substring filter; serviceOnly narrows to service-only or person duties.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: serviceOnly, in: query, schema: { type: boolean } }
      responses:
        '200': { description: All matching duties., content: { application/json: { schema: { $ref: '#/components/schemas/DutyList' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/authz/duties/{name}:
    get:
      operationId: getDuty
      summary: "Get a duty"
      x-passage-duty: identity.security-role.maintain
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The duty and the routes it grants., content: { application/json: { schema: { $ref: '#/components/schemas/DutyDetail' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/tenants:
    post:
      operationId: createTenant
      x-passage-duty: identity.tenant.maintain
      description: Operator only. Provisions a tenant; the caller must hold identity.tenant.maintain and belong to the platform operator tenant. Audited and emitted as dev.passage.identity.tenant.created.v1.
      security: [{ gatewayHeaders: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/UserHeader' }, { $ref: '#/components/parameters/Duties' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenant' }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listTenants
      x-passage-duty: identity.tenant.maintain
      description: Operator only. Lists all tenants by id, keyset-paged.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200': { description: A page of tenants., content: { application/json: { schema: { $ref: '#/components/schemas/TenantPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{id}:
    get:
      operationId: getTenant
      x-passage-duty: identity.tenant.maintain
      description: Operator only.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The tenant., content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{id}/admins:
    post:
      operationId: grantTenantAdministrator
      x-passage-duty: identity.tenant.maintain
      description: Operator only. Grants the tenant-wide tenant.administer duty to an active user of an active tenant other than the operator tenant, and never to the caller. Audited in the target and operator tenants.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/UserHeader'
        - $ref: '#/components/parameters/Duties'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantTenantAdministrator' }
      responses:
        '201': { description: Granted., content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignment' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/legal-entities:
    post:
      operationId: createLegalEntity
      x-passage-duty: identity.legal-entity.maintain
      description: Creates a legal entity in the caller's tenant. Requires access to all legal entities. Audited and emitted as dev.passage.identity.legalentity.created.v1.
      security: [{ gatewayHeaders: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/UserHeader' }, { $ref: '#/components/parameters/Duties' }, { $ref: '#/components/parameters/LegalEntityHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLegalEntity' }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/LegalEntity' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listLegalEntities
      x-passage-duty: identity.legal-entity.maintain
      description: Lists the caller's tenant's legal entities that are inside the caller's legal-entity scope.
      security: [{ gatewayHeaders: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/Duties' }, { $ref: '#/components/parameters/LegalEntityHeader' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/After' }]
      responses:
        '200': { description: A page of legal entities., content: { application/json: { schema: { $ref: '#/components/schemas/LegalEntityPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/legal-entities/{id}:
    get:
      operationId: getLegalEntity
      summary: "Get a legal entity"
      x-passage-duty: identity.legal-entity.maintain
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The legal entity., content: { application/json: { schema: { $ref: '#/components/schemas/LegalEntity' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/tenant/features:
    get:
      operationId: getTenantFeatures
      x-passage-duty: identity.feature.view
      description: >-
        The feature catalog with the caller's tenant's on/off state, and the industry templates. A feature the tenant
        never changed is on. The service itself needs only an authenticated tenant; the duty applies at the gateway, and a service token carrying identity.feature.view (granted to processmfg) is accepted without a legal entity. 403 comes from the gateway or from a service token without that duty.
      security: [{ gatewayHeaders: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/UserHeader' }, { $ref: '#/components/parameters/Duties' }]
      responses:
        '200': { description: The catalog and the tenant's state., content: { application/json: { schema: { $ref: '#/components/schemas/TenantFeatures' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateTenantFeatures
      x-passage-duty: identity.feature.maintain
      description: >-
        Turns features on or off, or applies a template (its features on, every other feature off). Send either
        template or features. A feature cannot be turned on while one it depends on is off, nor off while another
        feature that is on depends on it (422 IDN-FEATURE-DEPENDENCY, with a plain-words message per feature in
        errors). Requires access to all legal entities and tenant.administer. A change is audited and emitted as
        dev.passage.identity.tenantfeatures.updated.v1; a request that changes nothing writes nothing.
      security: [{ gatewayHeaders: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/UserHeader' }, { $ref: '#/components/parameters/Duties' }, { $ref: '#/components/parameters/LegalEntityHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTenantFeatures' }
      responses:
        '200': { description: The catalog and the tenant's state after the change., content: { application/json: { schema: { $ref: '#/components/schemas/TenantFeatures' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/tenant/setup:
    get:
      operationId: getTenantSetup
      x-passage-duty: identity.setup.view
      description: >-
        The onboarding wizard steps in the order a company is set up, each todo, done or skipped, with who changed it and
        when. complete is true once every step is done or skipped.
      security: [{ gatewayHeaders: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/UserHeader' }, { $ref: '#/components/parameters/Duties' }]
      responses:
        '200': { description: The steps and their progress., content: { application/json: { schema: { $ref: '#/components/schemas/TenantSetup' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/tenant/setup/steps/{step}:
    put:
      operationId: updateTenantSetupStep
      x-passage-duty: identity.setup.maintain
      description: Marks one step todo, done or skipped. Requires access to all legal entities and tenant.administer. Audited and emitted as dev.passage.identity.tenantsetup.updated.v1. An unknown step is 404.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/UserHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - { name: step, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [todo, done, skipped] }
      responses:
        '200': { description: The steps after the change., content: { application/json: { schema: { $ref: '#/components/schemas/TenantSetup' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/tenant/workspace-config:
    get:
      operationId: getTenantWorkspaceConfig
      x-passage-duty: identity.setup.view
      description: The tenant's override of the shell's workspaces (areas, workspaces, hide), or null when the tenant uses the shipped workspaces. The shell merges and validates it.
      security: [{ gatewayHeaders: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/UserHeader' }, { $ref: '#/components/parameters/Duties' }]
      responses:
        '200': { description: The override., content: { application/json: { schema: { $ref: '#/components/schemas/TenantWorkspaceConfig' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateTenantWorkspaceConfig
      x-passage-duty: identity.setup.maintain
      description: Replaces the override; null goes back to the shipped workspaces. Only the keys areas, workspaces and hide are accepted. Requires access to all legal entities and tenant.administer. Audited.
      security: [{ gatewayHeaders: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/UserHeader' }, { $ref: '#/components/parameters/Duties' }, { $ref: '#/components/parameters/LegalEntityHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantWorkspaceConfig' }
      responses:
        '200': { description: The override now in force., content: { application/json: { schema: { $ref: '#/components/schemas/TenantWorkspaceConfig' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/authz/assignments:
    post:
      operationId: assignRole
      x-passage-duty: identity.security-role.maintain
      description: >-
        Assigns a role (a seeded duty name until the role catalogue exists) to a user, tenant-wide or for one
        legal entity, effective from validFrom (default now) until validTo (default open-ended). The database
        rejects an overlapping assignment of the same role for the same user and legal entity (409
        IDN-ASSIGNMENT-OVERLAP). A tenant-wide assignment needs a request without a legal-entity scope from a
        caller holding identity.security-role.maintain. validFrom more than five minutes in the past is refused, and a
        validTo that is not in the future is refused (a window that has already closed grants nothing). A caller cannot grant a role to themselves (403 IAM-0416), identity.tenant.maintain can only be granted
        in the operator tenant (403), and an inactive legal entity is refused (422 IDN-LEGAL-ENTITY-INACTIVE).
        Audited and emitted as dev.passage.identity.roleassignment.assigned.v1.
      security: [{ gatewayHeaders: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/UserHeader' }, { $ref: '#/components/parameters/Duties' }, { $ref: '#/components/parameters/LegalEntityHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRole' }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignment' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listRoleAssignments
      x-passage-duty: identity.security-role.maintain
      description: Lists assignments by user (userId), by role (role), or both; at least one of userId or role is required (400 otherwise). active=true keeps assignments in effect now.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - { name: userId, in: query, description: Required unless role is given., schema: { type: string, format: uuid } }
        - { name: role, in: query, description: Required unless userId is given., schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200': { description: A page of assignments., content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignmentPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/authz/assignments/{id}:
    get:
      operationId: getRoleAssignment
      summary: "Get a role assignment"
      x-passage-duty: identity.security-role.maintain
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The assignment., content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignment' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: revokeRoleAssignment
      x-passage-duty: identity.security-role.maintain
      description: Alias of POST .../end; the assignment is end-dated, never deleted. An optional body may carry validTo.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/UserHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndRoleAssignment' }
      responses:
        '200': { description: The ended assignment., content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignment' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/authz/assignments/{id}/end:
    post:
      operationId: endRoleAssignment
      x-passage-duty: identity.security-role.maintain
      description: >-
        End-dates an assignment at validTo (default now, or validFrom for a future-dated assignment, which cancels
        it: the empty range grants nothing). validTo may lag the server clock by up to five minutes, must not
        precede validFrom and must not extend an existing end date; ending at exactly the current end is a no-op
        with no audit row; an assignment that has already ended returns 409 IDN-ASSIGNMENT-ENDED. Audited and emitted as dev.passage.identity.roleassignment.ended.v1.
      security: [{ gatewayHeaders: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/UserHeader'
        - $ref: '#/components/parameters/Duties'
        - $ref: '#/components/parameters/LegalEntityHeader'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndRoleAssignment' }
      responses:
        '200': { description: The ended assignment., content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignment' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    gatewayHeaders:
      type: apiKey
      in: header
      name: X-Passage-Tenant
      description: Tenant, caller and duties are asserted by the gateway through X-Passage-* headers until JWT validation lands.
  parameters:
    TenantHeader:
      name: X-Passage-Tenant
      in: header
      required: true
      description: Tenant id set by the gateway until JWT validation lands (kernel tenant middleware).
      schema: { type: string, format: uuid }
    Duties:
      name: X-Passage-Duties
      in: header
      required: false
      description: Comma-separated duties of the caller; identity.effective-permission.view or identity.user.maintain is required.
      schema: { type: string }
    LegalEntityHeader:
      name: X-Passage-Legal-Entity
      in: header
      required: false
      description: Legal-entity scope of the caller. Only an explicit all-entity scope is accepted; an absent or narrower scope yields 403.
      schema: { type: string }
    UserHeader:
      name: X-Passage-User
      in: header
      required: true
      description: Authenticated caller recorded as the actor in the audit trail and events; mutations without it return 401.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    After:
      name: after
      in: query
      description: Cursor; the next value of the previous page.
      schema: { type: string, format: uuid }
  schemas:
    CustomerContact:
      type: object
      required: [contactId, email, customerId, legalEntityIds, status, invitationSent]
      properties:
        contactId: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        customerId: { type: string, format: uuid }
        legalEntityIds: { type: array, items: { type: string, format: uuid } }
        status: { type: string, enum: [enabled, disabled] }
        invitationSent: { type: boolean }
        invitedBy: { type: string }
        invitedAt: { type: string, format: date-time }
        lastInvitationSentAt: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    CustomerContactList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CustomerContact' } }
        next: { type: string }
    User:
      type: object
      required: [userId, idpSubject, displayName, status, createdAt]
      properties:
        userId: { type: string, format: uuid }
        idpSubject: { type: string }
        email: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [active, deprovisioned] }
        createdAt: { type: string, format: date-time }
    UserPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        next: { type: string, format: uuid }
    KeycloakDeprovision:
      type: object
      required: [deprovisionId, userId, reason, state, attempts, requestedBy, requestedAt]
      properties:
        deprovisionId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        reason: { type: string, enum: [scim_deactivated, scim_deleted] }
        state: { type: string, enum: [pending, parked, done] }
        outcome: { type: string, enum: [disabled, not_found, superseded] }
        attempts: { type: integer }
        lastError: { type: string, description: The last Keycloak failure (operation, status, error code); never a token or secret. }
        keycloakUserId: { type: string }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        parkedAt: { type: string, format: date-time }
    KeycloakDeprovisionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/KeycloakDeprovision' } }
    DutyPermission:
      type: object
      required: [resource, methods]
      properties:
        resource: { type: string }
        methods: { type: array, items: { type: string } }
    DutySummary:
      type: object
      required: [name, serviceOnly, permissionCount]
      properties:
        name: { type: string }
        serviceOnly: { type: boolean }
        permissionCount: { type: integer, description: Number of resource and method pairs the duty grants. }
    DutyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DutySummary' } }
    DutyDetail:
      type: object
      required: [name, serviceOnly, permissions]
      properties:
        name: { type: string }
        serviceOnly: { type: boolean }
        permissions: { type: array, items: { $ref: '#/components/schemas/DutyPermission' } }
    RoleSummary:
      type: object
      required: [name, duties]
      properties:
        name: { type: string }
        duties: { type: array, items: { type: string } }
    RoleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RoleSummary' } }
    RoleDetail:
      type: object
      required: [name, duties]
      properties:
        name: { type: string }
        duties: { type: array, items: { $ref: '#/components/schemas/DutyDetail' } }
    CreateTenant:
      type: object
      required: [realmName, displayName]
      properties:
        realmName: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        adminUserId: { type: string, format: uuid, description: Initial tenant.administer holder; given together with adminIdpSubject. }
        adminIdpSubject: { type: string, minLength: 1, maxLength: 255 }
    GrantTenantAdministrator:
      type: object
      required: [userId, reason]
      properties:
        userId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 500 }
    Tenant:
      type: object
      required: [tenantId, realmName, displayName, status, createdAt]
      properties:
        tenantId: { type: string, format: uuid }
        realmName: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [active, suspended, deprovisioned] }
        createdAt: { type: string, format: date-time }
    TenantPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Tenant' } }
        next: { type: string, format: uuid }
    CreateLegalEntity:
      type: object
      required: [code, displayName]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
    LegalEntity:
      type: object
      required: [legalEntityId, code, displayName, status, createdAt]
      properties:
        legalEntityId: { type: string, format: uuid }
        code: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
    LegalEntityPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LegalEntity' } }
        next: { type: string, format: uuid }
    TenantFeature:
      type: object
      required: [key, name, description, module, dependsOn, enabled]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        module: { type: string }
        dependsOn: { type: array, items: { type: string } }
        enabled: { type: boolean }
        changedBy: { type: string, description: Who last changed it; absent while the tenant never has. }
        changedAt: { type: string, format: date-time }
    FeatureTemplate:
      type: object
      required: [key, name, description, features]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        features: { type: array, items: { type: string }, description: The features the template turns on. }
    TenantFeatures:
      type: object
      required: [features, templates]
      properties:
        features: { type: array, items: { $ref: '#/components/schemas/TenantFeature' } }
        templates: { type: array, items: { $ref: '#/components/schemas/FeatureTemplate' } }
    TenantSetup:
      type: object
      required: [steps, total, finished, complete]
      properties:
        steps:
          type: array
          items:
            type: object
            required: [key, name, description, status]
            properties:
              key: { type: string }
              name: { type: string }
              description: { type: string }
              status: { type: string, enum: [todo, done, skipped] }
              changedBy: { type: string }
              changedAt: { type: string, format: date-time }
        total: { type: integer }
        finished: { type: integer }
        complete: { type: boolean }
    TenantWorkspaceConfig:
      type: object
      required: [config]
      properties:
        config: { type: object, nullable: true, description: 'areas, workspaces and hide, or null.' }
    UpdateTenantFeatures:
      type: object
      properties:
        template: { type: string, description: A template key; every feature it does not name is turned off. }
        features: { type: object, additionalProperties: { type: boolean }, description: Feature key to the state wanted. }
    AssignRole:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, description: Name of a seeded duty. }
        legalEntityId: { type: string, format: uuid, description: Omit for a tenant-wide assignment. }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        reason: { type: string, maxLength: 500, description: Optional justification; stored and audited. }
    EndRoleAssignment:
      type: object
      properties:
        validTo: { type: string, format: date-time }
    RoleAssignment:
      type: object
      required: [assignmentId, userId, role, validFrom, createdAt]
      properties:
        assignmentId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { type: string }
        legalEntityId: { type: string, format: uuid }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        reason: { type: string }
        grantedBy: { type: string, description: Caller who made the assignment. }
        createdAt: { type: string, format: date-time }
    RoleAssignmentPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
        next: { type: string, format: uuid }
    EffectivePermissions:
      type: object
      required: [userId, duties, ignoredRoles, permissions]
      properties:
        userId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        duties: { type: array, items: { type: string }, description: Active assignments that are seeded duties. }
        ignoredRoles: { type: array, items: { type: string }, description: Active assignments that are not seeded duties. }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    Permission:
      type: object
      required: [resource, method, allow]
      properties:
        resource: { type: string, description: 'Catalogue resource pattern; "*" matches one path segment and a trailing "{,/**}" matches the path and everything below it.' }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        allow: { type: boolean }
        duty: { type: string, description: Held duty that grants the route; present when allow is true. }
        dutyMissing: { type: string, description: Least-privileged duty that would grant the route; present when allow is false and a duty covers it. }
    Problem:
      type: object
      required: [type, title, status]
      properties:
