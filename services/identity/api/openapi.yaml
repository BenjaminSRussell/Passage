openapi: 3.1.0
info:
  title: identity
  version: 0.1.0
  description: Identity service. This slice exposes the read-only effective-permission report.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/identity/users/{id}/effective-permissions:
    get:
      operationId: getUserEffectivePermissions
      x-passage-duty: View effective permissions
      description: >-
        Evaluates every route and method in the seeded duty catalogue for the user's active role
        assignments. The role of an assignment holds a duty name until the role catalogue exists;
        roles that are not seeded duties are listed in ignoredRoles and grant nothing. Tenant-wide
        assignments always apply; assignments for a legal entity apply when legalEntityId is given.
        Each decision equals the authorization policy's decision for the route's sample path.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: legalEntityId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Effective permissions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectivePermissions' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
components:
  schemas:
    EffectivePermissions:
      type: object
      required: [userId, duties, ignoredRoles, permissions]
      properties:
        userId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        duties: { type: array, items: { type: string }, description: Active assignments that are seeded duties. }
        ignoredRoles: { type: array, items: { type: string }, description: Active assignments that are not seeded duties. }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    Permission:
      type: object
      required: [resource, method, allow]
      properties:
        resource: { type: string, description: 'Catalogue resource pattern; "*" matches one path segment and a trailing "{,/**}" matches the path and everything below it.' }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        allow: { type: boolean }
        duty: { type: string, description: Held duty that grants the route; present when allow is true. }
        dutyMissing: { type: string, description: Least-privileged duty that would grant the route; present when allow is false and a duty covers it. }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors: { type: object, additionalProperties: { type: string } }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
