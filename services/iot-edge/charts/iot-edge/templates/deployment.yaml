{{- if empty .Values.site }}
{{- fail "site is required: set --set site=<plant>" }}
{{- end }}
{{- if empty .Values.edgeId }}
{{- fail "edgeId is required: set --set edgeId=<edge>" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-iot-edge
  labels:
    app.kubernetes.io/name: iot-edge
    app.kubernetes.io/instance: {{ .Release.Name }}
    passage.dev/ring: {{ .Values.ring | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: iot-edge
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iot-edge
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: iot-edge
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PASSAGE_ENV
              value: {{ .Values.config.env | quote }}
            - name: SERVICE_NAME
              value: {{ .Values.config.serviceName | quote }}
            - name: EDGE_SITE
              value: {{ .Values.site | quote }}
            - name: EDGE_ID
              value: {{ .Values.edgeId | quote }}
            - name: EDGE_ADMIN_ADDR
              value: {{ .Values.config.adminAddr | quote }}
            - name: IOT_BUFFER_HOURS
              value: {{ .Values.config.bufferHours | quote }}
{{- if .Values.shopfloor.url }}
            - name: EDGE_SHOPFLOOR_URL
              value: {{ .Values.shopfloor.url | quote }}
            - name: EDGE_NODE_ID
              value: {{ required "shopfloor.nodeId is required with shopfloor.url" .Values.shopfloor.nodeId | quote }}
            - name: EDGE_SOURCE
              value: {{ .Values.shopfloor.source | quote }}
{{- if .Values.shopfloor.writer }}
            - name: EDGE_WRITER
              value: {{ .Values.shopfloor.writer | quote }}
            - name: EDGE_RECIPE_AUTO_COMPLETE
              value: {{ .Values.shopfloor.recipeAutoComplete | quote }}
{{- end }}
            - name: EDGE_SIM_MACHINES
              value: {{ .Values.shopfloor.simMachines | quote }}
            - name: IOT_BUFFER_CAPACITY
              value: {{ .Values.shopfloor.bufferCapacity | quote }}
            - name: EDGE_SEQ_STATE_FILE
              value: /var/lib/iot-edge/seq.json
{{- if .Values.shopfloor.enrollmentSecret }}
            - name: EDGE_CERT_DIR
              value: /var/lib/iot-edge/certs
            - name: EDGE_ENROLLMENT_TOKEN_FILE
              value: /var/run/passage/enroll/token
{{- end }}
{{- if .Values.shopfloor.serverCaSecret }}
            - name: EDGE_SERVER_CA_FILE
              value: /var/run/passage/server-ca/ca.crt
{{- end }}
{{- if .Values.shopfloor.tokenSecret }}
            - name: EDGE_TOKEN_FILE
              value: /var/run/passage/edge/token
{{- end }}
{{- end }}
{{- if .Values.shopfloor.url }}
{{- if .Values.shopfloor.bufferPersistent }}
            - name: EDGE_BUFFER_FILE
              value: /var/lib/iot-edge/buffer.log
{{- end }}
{{- if or (eq .Values.shopfloor.source "opcua") (contains "opcua" (.Values.shopfloor.writer | default "")) }}
            - name: EDGE_OPCUA_ENDPOINT
              value: {{ required "opcua.endpoint is required for source or writer opcua" .Values.opcua.endpoint | quote }}
            - name: EDGE_OPCUA_SECURITY_POLICY
              value: {{ .Values.opcua.securityPolicy | quote }}
            - name: EDGE_OPCUA_SECURITY_MODE
              value: {{ .Values.opcua.securityMode | quote }}
            - name: EDGE_OPCUA_INTERVAL_MS
              value: {{ .Values.opcua.intervalMs | quote }}
{{- if .Values.opcua.secret }}
            - name: EDGE_OPCUA_CERT_FILE
              value: /var/run/passage/opcua/client.crt
            - name: EDGE_OPCUA_KEY_FILE
              value: /var/run/passage/opcua/client.key
{{- if .Values.opcua.username }}
            - name: EDGE_OPCUA_USER
              value: {{ .Values.opcua.username | quote }}
            - name: EDGE_OPCUA_PASSWORD_FILE
              value: /var/run/passage/opcua/password
{{- end }}
{{- end }}
{{- end }}
{{- if or (eq .Values.shopfloor.source "mqtt") (contains "mqtt" (.Values.shopfloor.writer | default "")) }}
            - name: EDGE_MQTT_BROKER
              value: {{ required "mqtt.broker (host:port) is required for source or writer mqtt" .Values.mqtt.broker | quote }}
            - name: EDGE_MQTT_TLS
              value: {{ .Values.mqtt.tls | quote }}
{{- if .Values.mqtt.secret }}
            - name: EDGE_MQTT_USER
              value: {{ .Values.mqtt.username | quote }}
            - name: EDGE_MQTT_PASSWORD_FILE
              value: /var/run/passage/mqtt/password
            - name: EDGE_MQTT_CA_FILE
              value: /var/run/passage/mqtt/ca.crt
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.plc.addr }}
            - name: EDGE_PLC_ADDR
              value: {{ .Values.plc.addr | quote }}
            - name: EDGE_PLC_STATION
              value: {{ .Values.plc.station | quote }}
            - name: EDGE_WAREHOUSE_URL
              value: {{ required "plc.warehouseUrl is required with plc.addr" .Values.plc.warehouseUrl | quote }}
{{- end }}
          volumeMounts:
            - { name: state, mountPath: /var/lib/iot-edge }
{{- if .Values.shopfloor.tokenSecret }}
            - { name: token, mountPath: /var/run/passage/edge, readOnly: true }
{{- end }}
{{- if .Values.shopfloor.enrollmentSecret }}
            - { name: enroll, mountPath: /var/run/passage/enroll, readOnly: true }
{{- end }}
{{- if .Values.shopfloor.serverCaSecret }}
            - { name: server-ca, mountPath: /var/run/passage/server-ca, readOnly: true }
{{- end }}
{{- if .Values.opcua.secret }}
            - { name: opcua, mountPath: /var/run/passage/opcua, readOnly: true }
{{- end }}
{{- if .Values.mqtt.secret }}
            - { name: mqtt, mountPath: /var/run/passage/mqtt, readOnly: true }
{{- end }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: state
{{- if .Values.state.claimName }}
          persistentVolumeClaim:
            claimName: {{ .Values.state.claimName | quote }}
{{- else }}
          emptyDir: {}
{{- end }}
{{- if .Values.shopfloor.tokenSecret }}
        - name: token
          secret:
            secretName: {{ .Values.shopfloor.tokenSecret | quote }}
            items: [{ key: token, path: token }]
{{- end }}
{{- if .Values.shopfloor.enrollmentSecret }}
        - name: enroll
          secret:
            secretName: {{ .Values.shopfloor.enrollmentSecret | quote }}
            items: [{ key: token, path: token }]
{{- end }}
{{- if .Values.shopfloor.serverCaSecret }}
        - name: server-ca
          secret:
            secretName: {{ .Values.shopfloor.serverCaSecret | quote }}
            items: [{ key: ca.crt, path: ca.crt }]
{{- end }}
{{- if .Values.opcua.secret }}
        - name: opcua
          secret:
            secretName: {{ .Values.opcua.secret | quote }}
{{- end }}
{{- if .Values.mqtt.secret }}
        - name: mqtt
          secret:
            secretName: {{ .Values.mqtt.secret | quote }}
{{- end }}
