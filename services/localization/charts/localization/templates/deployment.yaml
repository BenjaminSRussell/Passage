apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-localization
  labels:
    app.kubernetes.io/name: {{ .Values.serviceName }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.serviceName }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.serviceName }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: localization
          {{- if .Values.image.digest }}
          image: "{{ (include "passage.imageRepository" $) }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ (include "passage.imageRepository" $) }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          env:
            {{- include "passage.cloudEnv" $ | nindent 12 }}
            - name: PASSAGE_ENV
              value: {{ .Values.config.passageEnv | quote }}
            - name: SERVICE_NAME
              value: {{ .Values.serviceName | quote }}
            - name: HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: ADMIN_ADDR
              value: {{ .Values.config.adminAddr | quote }}
            - name: COUNTRY_PACKS_DIR
              value: {{ .Values.config.countryPacksDir | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
