openapi: 3.1.0
info:
  title: Passage localization
  version: 0.1.0
  description: Country pack catalogue, install checks, tax-id and statutory fixture validation (PSG-48 slice 1).
servers:
  - url: https://api.passage.dev
paths:
  /v1/localization/packs:
    get:
      operationId: listPacks
      summary: "List the country packs"
      x-passage-duty: localization.admin
      responses:
        "200":
          description: Installed-capable country packs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Pack" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/localization/packs/{code}:
    get:
      operationId: getPack
      summary: "Get a country pack"
      x-passage-duty: localization.admin
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, enum: [US, UK, DE, FR, IN, MX, CA] } }
      responses:
        "200":
          description: The pack
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/localization/packs/{code}/install:check:
    post:
      operationId: checkPackInstall
      summary: "Check whether a country pack can be installed"
      x-passage-duty: localization.admin
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityCountry, primaryInstalled, calendarOpenPeriodsOk]
              properties:
                entityCountry: { type: string, minLength: 2, maxLength: 2 }
                primaryInstalled: { type: integer, minimum: 0 }
                calendarOpenPeriodsOk: { type: boolean }
      responses:
        "200":
          description: Pack is installable
          content:
            application/json:
              schema:
                type: object
                properties:
                  installable: { type: boolean }
                  pack: { type: string }
                  version: { type: string }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/localization/tax-ids:validate:
    post:
      operationId: validateTaxId
      summary: "Validate a tax identifier for a scheme"
      x-passage-duty: localization.admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheme, value]
              properties:
                scheme: { type: string, enum: [GB_VAT, DE_USTID, FR_VAT, IN_GSTIN, MX_RFC, CA_BN, US_EIN] }
                value: { type: string }
      responses:
        "200":
          description: Valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  scheme: { type: string }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/localization/in/tds:withhold:
    post:
      operationId: withholdIndiaTds
      x-passage-duty: localization.admin
      description: >-
        TDS for one payment to a resident deductee under sections 194C, 194J,
        194I, 194H and 194Q (FR-48.27). Crossing the annual threshold also
        deducts on the year's earlier credits that bore no TDS (ytdPaid -
        ytdTaxed). Without a PAN the rate is the highest of the section rate,
        twice that rate and 20% (5% for 194Q) under section 206AA. Thresholds
        and rates are FY 2025-26 values pending tax-counsel sign-off.
        Read-only calculation; nothing is posted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [section, amount]
              properties:
                section: { type: string, enum: [194C, 194J, 194I, 194H, 194Q] }
                payeeType: { type: string, enum: [INDIVIDUAL_HUF, COMPANY], description: required for 194C; COMPANY means any payee other than an individual or HUF }
                amount: { type: string, description: "INR, positive, at most 2 decimals", pattern: '^\d+(\.\d{1,2})?$' }
                ytdPaid: { type: string, description: "INR credited to the deductee under the section earlier this FY", pattern: '^\d+(\.\d{1,2})?$' }
                ytdTaxed: { type: string, description: "the part of ytdPaid that already bore TDS; not above ytdPaid", pattern: '^\d+(\.\d{1,2})?$' }
                panPresent: { type: boolean }
                lowerRatePct: { type: string, description: "rate from a section 197 certificate, 0..100; used only with a PAN and when below the section rate", pattern: '^\d+(\.\d+)?$' }
      responses:
        "200":
          description: Withholding decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithholdResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/localization/statutory/uk-mtd-vat:validate:
    post:
      operationId: validateUkMtdVat
      summary: "Validate a UK Making Tax Digital VAT return"
      x-passage-duty: localization.admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VatReturn" }
      responses:
        "200":
          description: Passes the MTD VAT rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  errors: { type: integer, enum: [0] }
        "422":
          description: Fails schema ERP-0801; errors maps field to detail
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  schemas:
    Pack:
      type: object
      properties:
        code: { type: string }
        version: { type: string, pattern: '^\d{4}\.\d+$' }
        name: { type: string }
        country: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        locale: { type: string }
        taxRegime: { type: string }
        fiscalYearStartMonth: { type: integer, minimum: 1, maximum: 12 }
        holidayRegion: { type: string }
        bankFormats: { type: array, items: { type: string } }
        taxIdScheme: { type: string }
        retentionMinYears: { type: object, additionalProperties: { type: integer } }
        documentLayouts: { type: array, items: { type: string } }
        statutoryReports: { type: array, items: { type: object } }
    WithholdResult:
      type: object
      required: [section, ratePct, taxableAmount, tdsAmount, currency, reason, returnForm, challanForm]
      properties:
        section: { type: string }
        ratePct: { type: string, description: decimal percent applied }
        taxableAmount: { type: string, description: decimal INR base }
        tdsAmount: { type: string, description: decimal INR, rounded to the paisa }
        currency: { type: string, enum: [INR] }
        reason: { type: string, enum: [BELOW_THRESHOLD, THRESHOLD_CROSSED, PAN_MISSING_206AA, LOWER_DEDUCTION_CERTIFICATE, EXCESS_OVER_THRESHOLD] }
        returnForm: { type: string, enum: ["26Q"] }
        challanForm: { type: string, enum: ["ITNS 281"] }
    VatReturn:
      description: >-
        HMRC VAT (MTD) API 1.0 submit-return body, boxes 1 to 9. Beyond the
        ranges below, totalVatDue must equal vatDueSales + vatDueAcquisitions and
        netVatDue must equal |totalVatDue - vatReclaimedCurrPeriod|.
      type: object
      additionalProperties: false
      required: [periodKey, vatDueSales, vatDueAcquisitions, totalVatDue, vatReclaimedCurrPeriod, netVatDue, totalValueSalesExVAT, totalValuePurchasesExVAT, totalValueGoodsSuppliedExVAT, totalAcquisitionsExVAT, finalised]
      properties:
        periodKey: { type: string, pattern: '^[0-9A-Za-z#]{4}$' }
        vatDueSales: { type: number, minimum: -9999999999999.99, maximum: 9999999999999.99, multipleOf: 0.01, description: box 1 }
        vatDueAcquisitions: { type: number, minimum: -9999999999999.99, maximum: 9999999999999.99, multipleOf: 0.01, description: box 2 }
        totalVatDue: { type: number, minimum: -9999999999999.99, maximum: 9999999999999.99, multipleOf: 0.01, description: box 3 }
        vatReclaimedCurrPeriod: { type: number, minimum: -9999999999999.99, maximum: 9999999999999.99, multipleOf: 0.01, description: box 4 }
        netVatDue: { type: number, minimum: 0, maximum: 99999999999.99, multipleOf: 0.01, description: box 5 }
        totalValueSalesExVAT: { type: integer, minimum: -9999999999999, maximum: 9999999999999, description: box 6, whole pounds }
        totalValuePurchasesExVAT: { type: integer, minimum: -9999999999999, maximum: 9999999999999, description: box 7, whole pounds }
        totalValueGoodsSuppliedExVAT: { type: integer, minimum: -9999999999999, maximum: 9999999999999, description: box 8, whole pounds }
        totalAcquisitionsExVAT: { type: integer, minimum: -9999999999999, maximum: 9999999999999, description: box 9, whole pounds }
        finalised: { type: boolean, const: true }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors: { type: object, additionalProperties: { type: string } }
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
