asyncapi: 3.0.0
info:
  title: Passage HR events
  version: 0.1.0
  description: |
    Events published by the HR service through the transactional outbox (same
    transaction as the state change). Payloads carry no P2/P3 values; the PII
    vault never leaves the service (8.42.5, FR-42.1).
defaultContentType: application/cloudevents+json
channels:
  workerCreated:
    address: passage.hr.worker
    messages:
      workerCreated:
        $ref: "#/components/messages/WorkerCreated"
  employmentChanged:
    address: passage.hr.employment
    messages:
      employmentChanged:
        $ref: "#/components/messages/EmploymentChanged"
  positionAssignmentChanged:
    address: passage.hr.positionassignment
    messages:
      positionAssignmentChanged:
        $ref: "#/components/messages/PositionAssignmentChanged"
  absenceApproved:
    address: passage.hr.absence
    messages:
      absenceApproved:
        $ref: "#/components/messages/AbsenceApproved"
  benefitEnrollmentChanged:
    address: passage.hr.benefitenrollment
    messages:
      benefitEnrollmentChanged:
        $ref: "#/components/messages/BenefitEnrollmentChanged"
operations:
  publishBenefitEnrollmentChanged:
    action: send
    channel:
      $ref: "#/channels/benefitEnrollmentChanged"
    messages:
      - $ref: "#/channels/benefitEnrollmentChanged/messages/benefitEnrollmentChanged"
  publishAbsenceApproved:
    action: send
    channel:
      $ref: "#/channels/absenceApproved"
    messages:
      - $ref: "#/channels/absenceApproved/messages/absenceApproved"
  publishWorkerCreated:
    action: send
    channel:
      $ref: "#/channels/workerCreated"
    messages:
      - $ref: "#/channels/workerCreated/messages/workerCreated"
  publishEmploymentChanged:
    action: send
    channel:
      $ref: "#/channels/employmentChanged"
    messages:
      - $ref: "#/channels/employmentChanged/messages/employmentChanged"
  publishPositionAssignmentChanged:
    action: send
    channel:
      $ref: "#/channels/positionAssignmentChanged"
    messages:
      - $ref: "#/channels/positionAssignmentChanged/messages/positionAssignmentChanged"
components:
  messages:
    WorkerCreated:
      name: dev.passage.hr.worker.created.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/WorkerCreatedData"
    EmploymentChanged:
      name: dev.passage.hr.employment.changed.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/EmploymentChangedData"
    PositionAssignmentChanged:
      name: dev.passage.hr.positionassignment.changed.v1
      description: |
        PRD name position.assignment.changed; the kernel event-type regex
        allows three segments after the namespace, so the entity collapses to
        positionassignment (same rule as org's teammembership.changed).
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/PositionAssignmentChangedData"
    AbsenceApproved:
      name: dev.passage.hr.absence.approved.v1
      description: |
        Written to the outbox in the same transaction as the approval that spends
        the balance (FR-42.7). Consumers - time (wave 25), projects
        (availability), payroll (paid-leave earnings). The PRD's hours is
        quantity plus unit until wave-8 work calendars can turn days into hours.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/AbsenceApprovedData"
    BenefitEnrollmentChanged:
      name: dev.passage.hr.benefitenrollment.changed.v1
      description: Published in the same transaction as an enrollment starts or ends (8.42.5). Payroll deductions consume it; dependents are never included.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/BenefitEnrollmentChangedData"
  schemas:
    BenefitEnrollmentChangedData:
      type: object
      description: |
        One enrollment starting or ending (BR-42.6). validity is
        [valid_from, valid_to) at UTC day starts; a TERMINATION end keeps
        coverage to the end of the termination month. Rates are decimal strings
        in the plan currency (never float); rate_basis says whether a rate is
        per pay period or monthly.
      required: [id, worker_id, plan_id, plan_code, option_code, action, valid_from, valid_to, end_reason,
        employee_rate, employer_rate, currency, rate_basis, pre_tax, payroll_deduction_code]
      properties:
        id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        plan_code:
          type: string
        option_code:
          type: string
        action:
          type: string
          enum: [START, END]
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: [string, "null"]
          format: date-time
        end_reason:
          type: [string, "null"]
          enum: [TERMINATION, LIFE_EVENT, PLAN_END, null]
        employee_rate:
          type: string
          pattern: '^\d+(\.\d+)?$'
        employer_rate:
          type: string
          pattern: '^\d+(\.\d+)?$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        rate_basis:
          type: string
          enum: [PER_PAY_PERIOD, MONTHLY]
        pre_tax:
          type: boolean
        payroll_deduction_code:
          type: [string, "null"]
    AbsenceApprovedData:
      type: object
      required: [id, worker_id, plan_id, unit, date_from, date_to, quantity]
      properties:
        id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        unit:
          type: string
          enum: [HOURS, DAYS]
        date_from:
          type: string
          format: date
          description: First day of the absence, inclusive.
        date_to:
          type: string
          format: date
          description: Last day of the absence, inclusive.
        quantity:
          type: string
          description: Decimal string with two places, in unit.
    WorkerCreatedData:
      type: object
      required: [id, personnel_number, worker_type, party_person_id]
      properties:
        id:
          type: string
          format: uuid
        personnel_number:
          type: string
        worker_type:
          type: string
          enum: [EMPLOYEE, CONTRACTOR]
        party_person_id:
          type: string
          format: uuid
    EmploymentChangedData:
      type: object
      required: [id, worker_id, legal_entity_id, employment_type, assignment_kind, action, valid_from, valid_to]
      properties:
        id:
          type: string
          format: uuid
          description: The employment id (8.0 employmentId).
        worker_id:
          type: string
          format: uuid
        legal_entity_id:
          type: string
          format: uuid
        employment_type:
          type: string
          enum: [FULL_TIME, PART_TIME, TEMP, CONTRACTOR]
        assignment_kind:
          type: string
          enum: [PRIMARY, CONCURRENT, GLOBAL_HOST]
        action:
          type: string
          enum: [HIRE]
          description: Only HIRE (a new employment) is emitted in slice 1; transfer, termination and the other personnel actions arrive with FR-42.5.
        valid_from:
          type: string
          format: date-time
          description: 8.0 effectiveFrom.
        valid_to:
          type: [string, "null"]
          format: date-time
          description: 8.0 effectiveTo, exclusive; null when open-ended.
    PositionAssignmentChangedData:
      type: object
      required: [id, worker_id, position_id, manager_position_id, fte_share, is_primary, valid_from, valid_to]
      properties:
        id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        position_id:
          type: string
          format: uuid
        manager_position_id:
          type: [string, "null"]
          format: uuid
          description: Reports-to position as-of valid_from (8.42.5 managerPositionId); null at the top of the hierarchy.
        fte_share:
          type: string
        is_primary:
          type: boolean
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: [string, "null"]
          format: date-time
