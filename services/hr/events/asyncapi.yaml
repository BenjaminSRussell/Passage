asyncapi: 3.0.0
info:
  title: Passage HR events
  version: 0.1.0
  description: |
    Events published by the HR service through the transactional outbox (same
    transaction as the state change). Payloads carry no P2/P3 values; the PII
    vault never leaves the service (8.42.5, FR-42.1).
defaultContentType: application/cloudevents+json
channels:
  workerSkillChanged:
    address: passage.hr.workerskill
    messages:
      workerSkillChanged:
        $ref: "#/components/messages/WorkerSkillChanged"
  certificationIssued:
    address: passage.hr.certification
    messages:
      certificationIssued:
        $ref: "#/components/messages/CertificationIssued"
  workerCreated:
    address: passage.hr.worker
    messages:
      workerCreated:
        $ref: "#/components/messages/WorkerCreated"
  employmentChanged:
    address: passage.hr.employment
    messages:
      employmentChanged:
        $ref: "#/components/messages/EmploymentChanged"
  positionAssignmentChanged:
    address: passage.hr.positionassignment
    messages:
      positionAssignmentChanged:
        $ref: "#/components/messages/PositionAssignmentChanged"
  absenceApproved:
    address: passage.hr.absence
    messages:
      absenceApproved:
        $ref: "#/components/messages/AbsenceApproved"
  benefitEnrollmentChanged:
    address: passage.hr.benefitenrollment
    messages:
      benefitEnrollmentChanged:
        $ref: "#/components/messages/BenefitEnrollmentChanged"
  courseCompleted:
    address: passage.hr.course
    messages:
      courseCompleted:
        $ref: "#/components/messages/CourseCompleted"
  compensationChanged:
    address: passage.hr.compensation
    messages:
      compensationChanged:
        $ref: "#/components/messages/CompensationChanged"
  compensationCycleApplied:
    address: passage.hr.compensationcycle
    messages:
      compensationCycleApplied:
        $ref: "#/components/messages/CompensationCycleApplied"
  requisitionChanged:
    address: passage.hr.requisition
    messages:
      requisitionChanged:
        $ref: "#/components/messages/RequisitionChanged"
  incidentChanged:
    address: passage.hr.incident
    messages:
      incidentChanged:
        $ref: "#/components/messages/IncidentChanged"
  loanedItemChanged:
    address: passage.hr.loaneditem
    messages:
      loanedItemChanged:
        $ref: "#/components/messages/LoanedItemChanged"
  checklistChanged:
    address: passage.hr.checklist
    messages:
      checklistChanged:
        $ref: "#/components/messages/ChecklistChanged"
  reviewChanged:
    address: passage.hr.review
    messages:
      reviewChanged:
        $ref: "#/components/messages/ReviewChanged"
operations:
  publishReviewChanged:
    action: send
    channel:
      $ref: "#/channels/reviewChanged"
    messages:
      - $ref: "#/channels/reviewChanged/messages/reviewChanged"
  publishIncidentChanged:
    action: send
    channel:
      $ref: "#/channels/incidentChanged"
    messages:
      - $ref: "#/channels/incidentChanged/messages/incidentChanged"
  publishLoanedItemChanged:
    action: send
    channel:
      $ref: "#/channels/loanedItemChanged"
    messages:
      - $ref: "#/channels/loanedItemChanged/messages/loanedItemChanged"
  publishChecklistChanged:
    action: send
    channel:
      $ref: "#/channels/checklistChanged"
    messages:
      - $ref: "#/channels/checklistChanged/messages/checklistChanged"
  publishWorkerSkillChanged:
    action: send
    channel:
      $ref: "#/channels/workerSkillChanged"
    messages:
      - $ref: "#/channels/workerSkillChanged/messages/workerSkillChanged"
  publishCertificationIssued:
    action: send
    channel:
      $ref: "#/channels/certificationIssued"
    messages:
      - $ref: "#/channels/certificationIssued/messages/certificationIssued"
  publishBenefitEnrollmentChanged:
    action: send
    channel:
      $ref: "#/channels/benefitEnrollmentChanged"
    messages:
      - $ref: "#/channels/benefitEnrollmentChanged/messages/benefitEnrollmentChanged"
  publishAbsenceApproved:
    action: send
    channel:
      $ref: "#/channels/absenceApproved"
    messages:
      - $ref: "#/channels/absenceApproved/messages/absenceApproved"
  publishWorkerCreated:
    action: send
    channel:
      $ref: "#/channels/workerCreated"
    messages:
      - $ref: "#/channels/workerCreated/messages/workerCreated"
  publishEmploymentChanged:
    action: send
    channel:
      $ref: "#/channels/employmentChanged"
    messages:
      - $ref: "#/channels/employmentChanged/messages/employmentChanged"
  publishPositionAssignmentChanged:
    action: send
    channel:
      $ref: "#/channels/positionAssignmentChanged"
    messages:
      - $ref: "#/channels/positionAssignmentChanged/messages/positionAssignmentChanged"
  publishCourseCompleted:
    action: send
    channel:
      $ref: "#/channels/courseCompleted"
    messages:
      - $ref: "#/channels/courseCompleted/messages/courseCompleted"
  publishCompensationChanged:
    action: send
    channel:
      $ref: "#/channels/compensationChanged"
    messages:
      - $ref: "#/channels/compensationChanged/messages/compensationChanged"
  publishCompensationCycleApplied:
    action: send
    channel:
      $ref: "#/channels/compensationCycleApplied"
    messages:
      - $ref: "#/channels/compensationCycleApplied/messages/compensationCycleApplied"
  publishRequisitionChanged:
    action: send
    channel:
      $ref: "#/channels/requisitionChanged"
    messages:
      - $ref: "#/channels/requisitionChanged/messages/requisitionChanged"
components:
  messages:
    CompensationChanged:
      name: dev.passage.hr.compensation.changed.v1
      description: A worker's fixed compensation row opened from valid_from; payroll consumes it. Confidential amounts travel to payroll only.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [id, worker_id, employment_id, plan_id, amount, currency, valid_from]
        properties:
          id: {type: string, format: uuid}
          worker_id: {type: string, format: uuid}
          employment_id: {type: string, format: uuid}
          plan_id: {type: string, format: uuid}
          amount: {type: string}
          currency: {type: string}
          valid_from: {type: string, format: date-time}
          valid_to: {type: [string, "null"], format: date-time}
    CompensationCycleApplied:
      name: dev.passage.hr.compensationcycle.applied.v1
      description: PRD name compensation.cycle.applied, collapsed to one entity segment like positionassignment.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [cycle_id, effective_date, action_ids]
        properties:
          cycle_id: {type: string, format: uuid}
          effective_date: {type: string, format: date}
          action_ids:
            type: array
            items: {type: string, format: uuid}
    RequisitionChanged:
      name: dev.passage.hr.requisition.changed.v1
      description: A job requisition was created or its status changed, including FILLED and back to OPEN as hires count against its headcount.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [id, position_id, headcount, status, filled]
        properties:
          id: {type: string, format: uuid}
          position_id: {type: string, format: uuid}
          headcount: {type: integer}
          status: {type: string, enum: [DRAFT, APPROVED, OPEN, FILLED, CANCELED]}
          filled: {type: integer}
    WorkerCreated:
      name: dev.passage.hr.worker.created.v1
      description: A worker record was created for a party person, with its personnel number and worker type. Carries no personal data.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/WorkerCreatedData"
    EmploymentChanged:
      name: dev.passage.hr.employment.changed.v1
      description: A worker's employment with a legal entity was opened or changed; action names the change and valid_from and valid_to bound it.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/EmploymentChangedData"
    PositionAssignmentChanged:
      name: dev.passage.hr.positionassignment.changed.v1
      description: |
        PRD name position.assignment.changed; the kernel event-type regex
        allows three segments after the namespace, so the entity collapses to
        positionassignment (same rule as org's teammembership.changed).
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/PositionAssignmentChangedData"
    AbsenceApproved:
      name: dev.passage.hr.absence.approved.v1
      description: |
        Written to the outbox in the same transaction as the approval that spends
        the balance (FR-42.7). Consumers - time (wave 25), projects
        (availability), payroll (paid-leave earnings). The PRD's hours is
        quantity plus unit until wave-8 work calendars can turn days into hours.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/AbsenceApprovedData"
    BenefitEnrollmentChanged:
      name: dev.passage.hr.benefitenrollment.changed.v1
      description: Published in the same transaction as an enrollment starts or ends (8.42.5). Payroll deductions consume it; dependents are never included.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/BenefitEnrollmentChangedData"
    WorkerSkillChanged:
      name: dev.passage.hr.workerskill.changed.v1
      description: Published in the same transaction as a worker's rating on a skill changes (FR-42.10). Wave-45 dispatch consumes it. Carries codes and ratings only.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/WorkerSkillChangedData"
    CertificationIssued:
      name: dev.passage.hr.certification.issued.v1
      description: Published in the same transaction as a certificate is recorded (BR-42.8). Validity is [issued_on, expires_on); expiry reminders (FR-42.20) and wave-45 dispatch read expires_on.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/CertificationIssuedData"
    CourseCompleted:
      name: dev.passage.hr.course.completed.v1
      description: Published in the same transaction as a registration is recorded ATTENDED with PASS and its skills and certificate are written (8.42.5, FR-42.14, BR-42.9). Wave-45 dispatch consumes the skills; notifications consume the certificate id. Codes, ratings and ids only; no worker names.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/CourseCompletedData"
    IncidentChanged:
      name: dev.passage.hr.incident.changed.v1
      description: Published in the same transaction as an incident is reported, moved to UNDER_REVIEW or CLOSED (FR-42.16, BR-42.11). Ids, codes and counts only; the worker's name and the sealed medical details never leave the service in an event.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/IncidentChangedData"
    LoanedItemChanged:
      name: dev.passage.hr.loaneditem.changed.v1
      description: Published in the same transaction as an item is issued, returned or recorded lost (FR-42.17). asset_id is the wave-44 asset when the item is one.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/LoanedItemChangedData"
    ChecklistChanged:
      name: dev.passage.hr.checklist.changed.v1
      description: Published in the same transaction as a checklist is started (its worker tasks are created) or completed (FR-42.19, BR-42.12).
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ChecklistChangedData"
    ReviewChanged:
      name: dev.passage.hr.review.changed.v1
      description: Published in the same transaction as a review is opened (draft), the worker submits the self-assessment (self_submitted) or the manager signs off (signed_off) (FR-42.11). Ids, period and status only; no review text.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ReviewChangedData"
  schemas:
    ReviewChangedData:
      type: object
      required: [id, worker_id, status, period_start, period_end]
      properties:
        id: {type: string, format: uuid}
        worker_id: {type: string, format: uuid}
        status: {type: string, enum: [draft, self_submitted, signed_off]}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date}
    IncidentChangedData:
      type: object
      description: worker_id, incident_type and outcome are omitted for a privacy case.
      required: [id, case_no, legal_entity_id, site_id, status, osha_recordable, occurred_at]
      properties:
        id: {type: string, format: uuid}
        case_no: {type: integer}
        worker_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        site_id: {type: string, format: uuid}
        incident_type: {type: string, enum: [INJURY, SKIN_DISORDER, RESPIRATORY, POISONING, HEARING_LOSS, OTHER_ILLNESS]}
        status: {type: string, enum: [REPORTED, UNDER_REVIEW, CLOSED]}
        outcome: {type: string, enum: [DEATH, DAYS_AWAY, RESTRICTED, OTHER_RECORDABLE, NONE]}
        osha_recordable: {type: boolean}
        occurred_at: {type: string, format: date-time}
    LoanedItemChangedData:
      type: object
      required: [id, worker_id, loan_type, asset_id, status, issued_on, due_on, closed_on]
      properties:
        id: {type: string, format: uuid}
        worker_id: {type: string, format: uuid}
        loan_type: {type: string}
        asset_id: {type: [string, "null"], format: uuid}
        status: {type: string, enum: [OUT, RETURNED, LOST]}
        issued_on: {type: string, format: date}
        due_on: {type: [string, "null"], format: date}
        closed_on: {type: [string, "null"], format: date}
    ChecklistChangedData:
      type: object
      required: [id, worker_id, kind, effective_date, status, task_count]
      properties:
        id: {type: string, format: uuid}
        worker_id: {type: string, format: uuid}
        kind: {type: string, enum: [ONBOARDING, OFFBOARDING, TRANSFER]}
        effective_date: {type: string, format: date}
        status: {type: string, enum: [OPEN, COMPLETED]}
        task_count: {type: integer}
    CourseCompletedData:
      type: object
      description: |
        skills lists every skill outcome of the course with the rating the
        worker holds after the completion, max(existing, course rating); a
        raised rating also publishes workerskill.changed and a new
        certificate certification.issued, in the same transaction.
        completed_on is the session end date. certification_id is null when
        the course issues no certificate.
      required: [registration_id, worker_id, course_id, session_id, completed_on, skills, certification_id]
      properties:
        registration_id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        completed_on:
          type: string
          format: date
        skills:
          type: array
          items:
            type: object
            required: [skill_id, skill_code, rating]
            properties:
              skill_id:
                type: string
                format: uuid
              skill_code:
                type: string
              rating:
                type: integer
                minimum: 1
                maximum: 10
        certification_id:
          type: [string, "null"]
          format: uuid
    WorkerSkillChangedData:
      type: object
      description: A rating recorded again with the same value publishes nothing.
      required: [worker_id, skill_id, skill_code, rating, previous_rating, assessed_on]
      properties:
        worker_id:
          type: string
          format: uuid
        skill_id:
          type: string
          format: uuid
        skill_code:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 10
        previous_rating:
          type: [integer, "null"]
          description: Null when the worker was not rated on the skill before.
        assessed_on:
          type: string
          format: date
    CertificationIssuedData:
      type: object
      required: [id, worker_id, code, issued_on, expires_on]
      properties:
        id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        code:
          type: string
        issued_on:
          type: string
          format: date
        expires_on:
          type: [string, "null"]
          format: date
    BenefitEnrollmentChangedData:
      type: object
      description: |
        One enrollment starting or ending (BR-42.6). validity is
        [valid_from, valid_to) at UTC day starts; a TERMINATION end keeps
        coverage to the end of the termination month. Rates are decimal strings
        in the plan currency (never float); rate_basis says whether a rate is
        per pay period or monthly.
      required: [id, worker_id, plan_id, plan_code, option_code, action, valid_from, valid_to, end_reason,
        employee_rate, employer_rate, currency, rate_basis, pre_tax, payroll_deduction_code]
      properties:
        id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        plan_code:
          type: string
        option_code:
          type: string
        action:
          type: string
          enum: [START, END]
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: [string, "null"]
          format: date-time
        end_reason:
          type: [string, "null"]
          enum: [TERMINATION, LIFE_EVENT, PLAN_END, null]
        employee_rate:
          type: string
          pattern: '^\d+(\.\d+)?$'
        employer_rate:
          type: string
          pattern: '^\d+(\.\d+)?$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        rate_basis:
          type: string
          enum: [PER_PAY_PERIOD, MONTHLY]
        pre_tax:
          type: boolean
        payroll_deduction_code:
          type: [string, "null"]
    AbsenceApprovedData:
      type: object
      required: [id, worker_id, plan_id, unit, date_from, date_to, quantity]
      properties:
        id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        unit:
          type: string
          enum: [HOURS, DAYS]
        date_from:
          type: string
          format: date
          description: First day of the absence, inclusive.
        date_to:
          type: string
          format: date
          description: Last day of the absence, inclusive.
        quantity:
          type: string
          description: Decimal string with two places, in unit.
    WorkerCreatedData:
      type: object
      required: [id, personnel_number, worker_type, party_person_id]
      properties:
        id:
          type: string
          format: uuid
        personnel_number:
          type: string
        worker_type:
          type: string
          enum: [EMPLOYEE, CONTRACTOR]
        party_person_id:
          type: string
          format: uuid
    EmploymentChangedData:
      type: object
      required: [id, worker_id, legal_entity_id, employment_type, assignment_kind, action, valid_from, valid_to]
      properties:
        id:
          type: string
          format: uuid
          description: The employment id (8.0 employmentId).
        worker_id:
          type: string
          format: uuid
        legal_entity_id:
          type: string
          format: uuid
        employment_type:
          type: string
          enum: [FULL_TIME, PART_TIME, TEMP, CONTRACTOR]
        assignment_kind:
          type: string
          enum: [PRIMARY, CONCURRENT, GLOBAL_HOST]
        action:
          type: string
          enum: [HIRE]
          description: Only HIRE (a new employment) is emitted in slice 1; transfer, termination and the other personnel actions arrive with FR-42.5.
        valid_from:
          type: string
          format: date-time
          description: 8.0 effectiveFrom.
        valid_to:
          type: [string, "null"]
          format: date-time
          description: 8.0 effectiveTo, exclusive; null when open-ended.
    PositionAssignmentChangedData:
      type: object
      required: [id, worker_id, position_id, manager_position_id, fte_share, is_primary, valid_from, valid_to]
      properties:
        id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        position_id:
          type: string
          format: uuid
        manager_position_id:
          type: [string, "null"]
          format: uuid
          description: Reports-to position as-of valid_from (8.42.5 managerPositionId); null at the top of the hierarchy.
        fte_share:
          type: string
        is_primary:
          type: boolean
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: [string, "null"]
          format: date-time
