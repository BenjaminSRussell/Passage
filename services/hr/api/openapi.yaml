openapi: 3.1.0
info:
  title: Passage HR API
  version: 0.1.0
  description: |
    Wave 42 slices 1 to 5 (PSG-42): workers, employments, positions and
    position assignments with effective dating, the as-of manager query, the
    audited PII vault, absence plans, accrual, year end and carry-over,
    balances and requests with approval, benefit plans with CEL
    eligibility, a workforce simulation, life events and enrollments, and
    skills: the catalog, worker ratings, certificates with expiry, position
    skill profiles, gap analysis and skill search, and courses: the catalog
    with skill outcomes and certificates, sessions with capacity and a
    waitlist, registrations with manager approval, and completion that writes
    skills and certificates. Personnel actions, performance and goals,
    questionnaires, incidents, recruiting and compensation cycles are later
    slices (see NOT-IMPLEMENTED.md).
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
security:
  - bearerAuth: []
paths:
  /readyz:
    get:
      operationId: readiness
      summary: Readiness (pings Postgres within 500 ms)
      x-passage-duty: none
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: Database unreachable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/workers:
    get:
      operationId: listWorkers
      summary: List workers by personnel number (no PII)
      x-passage-duty: HcmWorkerInquire
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive match on personnel number, legal name or preferred name.
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of workers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWorker
      summary: Create a worker and seal its PII into the vault
      x-passage-duty: HcmWorkerMaintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkerRequest"
      responses:
        "201":
          description: Worker created (or the stored response on idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/workers/{id}:
    get:
      operationId: getWorker
      summary: Get a worker with PII masked
      x-passage-duty: HcmWorkerInquire
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: Worker with masked PII; every call is audited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDetail"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/hr/workers/{id}/as-of:
    get:
      operationId: workerAsOf
      summary: Employments, primary position and manager as-of a date (FR-42.4, BR-42.1)
      x-passage-duty: HcmWorkerInquire
      parameters:
        - $ref: "#/components/parameters/WorkerId"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: As-of view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsOfView"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/hr/workers/{id}/pii:
    get:
      operationId: revealPII
      summary: Unmasked PII, audited with a reason (FR-42.1, AC-42.7)
      x-passage-duty: HcmPIIRead
      parameters:
        - $ref: "#/components/parameters/WorkerId"
        - name: reason
          in: query
          required: true
          description: At least 10 characters (tenant parameter PII reveal reason minimum length).
          schema:
            type: string
            minLength: 10
            maxLength: 500
      responses:
        "200":
          description: Unmasked PII; the audit row is written in the same transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PIIView"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/workers/{id}/employments:
    get:
      operationId: listEmployments
      summary: Every employment of a worker, oldest first, with status as-of now
      x-passage-duty: HcmWorkerInquire
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: Employments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentList"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createEmployment
      summary: Start an employment at a legal entity (FR-42.2, FR-42.23)
      x-passage-duty: HcmWorkerMaintain
      parameters:
        - $ref: "#/components/parameters/WorkerId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmploymentRequest"
      responses:
        "201":
          description: Employment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/positions:
    get:
      operationId: listPositions
      summary: List positions by position number
      x-passage-duty: HcmOrgInquire
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPosition
      summary: Create a position with an FTE (FR-42.3)
      x-passage-duty: HcmOrgMaintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePositionRequest"
      responses:
        "201":
          description: Position created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/positions/{id}:
    get:
      operationId: getPosition
      summary: A position with every assignment on it
      x-passage-duty: HcmOrgInquire
      parameters:
        - $ref: "#/components/parameters/PositionId"
      responses:
        "200":
          description: Position detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionDetail"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/hr/positions/{id}/assignments:
    post:
      operationId: createAssignment
      summary: Place a worker on a position; FTE and primary rules apply (FR-42.3)
      x-passage-duty: HcmActionMaintain
      parameters:
        - $ref: "#/components/parameters/PositionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionAssignment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/absence/plans:
    get:
      operationId: listAbsencePlans
      summary: List absence plans by code
      x-passage-duty: EssAbsence
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsencePlanList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAbsencePlan
      summary: Create an absence plan with its accrual rule (FR-42.6, BR-42.3)
      x-passage-duty: HcmAbsenceAdmin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAbsencePlanRequest"
      responses:
        "201":
          description: Plan created, or the stored plan on an idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsencePlan"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: HCM-ABS-PLAN-DUPLICATE (code taken) or idempotency_key_in_flight
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/absence/plans/{id}:
    get:
      operationId: getAbsencePlan
      summary: An absence plan with its latest accrual periods, year ends and carry-over expiries
      x-passage-duty: HcmAbsenceAdmin
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsencePlanDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/hr/absence/plans/{id}/year-end:
    post:
      operationId: closeAbsencePlanYear
      summary: Year end (BR-42.3) - carry each worker's balance into the next plan year up to carryOverMax, expire the rest
      description: |
        Runs once the plan year has ended (HCM-ABS-NOT-DUE before). Keyed per
        (plan, plan year, worker): a rerun closes only workers not yet closed.
        Accrual into the next plan year is refused (HCM-ABS-YEAR-OPEN) until
        the previous year is closed.
      x-passage-duty: HcmAbsenceAdmin
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanYearRequest"
      responses:
        "201":
          description: At least one worker closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseRun"
        "200":
          description: Nobody left to close
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseRun"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: HCM-ABS-PERIOD (not a plan-year start) or HCM-ABS-NOT-DUE
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/absence/plans/{id}/carry-over-expiry:
    post:
      operationId: expireAbsenceCarryOver
      summary: Expire unused carry-over of one plan year once carryOverExpiryMonths have passed (BR-42.3)
      x-passage-duty: HcmAbsenceAdmin
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanYearRequest"
      responses:
        "201":
          description: At least one worker's carry-over expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseRun"
        "200":
          description: Nobody left to expire
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseRun"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: HCM-ABS-PERIOD, HCM-ABS-NOT-DUE or HCM-ABS-NO-EXPIRY (plan keeps carry-over all year)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/absence/accrue:
    post:
      operationId: runAbsenceAccrual
      summary: Accrue one plan for one whole accrual period (BR-42.3)
      description: |
        The period must be one accrual period of the plan (a calendar month for
        MONTHLY, 14 days for BIWEEKLY, the plan year for ANNUAL; HCM-ABS-PERIOD
        otherwise) whose accrual day has come (HCM-ABS-NOT-DUE). Each worker
        with a PRIMARY employment in the period is accrued once per period (the
        PRD key per plan and period, kept per worker), so a retried call
        credits nobody twice and needs no Idempotency-Key. Employments are read
        under the caller's legal-entity scope; a later run with another scope
        credits the remaining workers.
      x-passage-duty: HcmAbsenceAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccrualRequest"
      responses:
        "201":
          description: At least one worker credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccrualRun"
        "200":
          description: Nobody left to credit (replayed is true when an earlier call did the work)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccrualRun"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: HCM-ABS-RUN-OVERLAP (another period of the plan covers these days), HCM-ABS-YEAR-OPEN or HCM-ABS-YEAR-CLOSED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: HCM-ABS-PERIOD or HCM-ABS-NOT-DUE
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/absence/requests:
    get:
      operationId: listAbsenceRequests
      summary: Absence requests by start date, oldest first (the approval queue)
      description: |
        A caller with only EssAbsence sees their own requests (the worker whose
        sign-in user they are). With MssApprove the caller sees their own and
        their direct reports' requests; HcmAbsenceAdmin sees the tenant's.
      x-passage-duty: EssAbsence
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [SUBMITTED, APPROVED, REJECTED, CANCELED]
        - name: workerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsenceRequestList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAbsenceRequest
      summary: Submit an absence request (FR-42.7, BR-42.4, BR-42.5)
      description: |
        Checked against the plan-year balance plus the negative allowance
        (HCM-ABS-002), an approved overlap (HCM-ABS-001), the span (at most one
        day, or 24 hours, per calendar day) and the plan year (HCM-ABS-YEAR-SPAN,
        and HCM-ABS-YEAR-CLOSED once the year has had its year end).
        An overlap with a submitted request only warns (HCM-ABS-003). A caller
        without HcmAbsenceAdmin requests only for their own worker
        (HCM-ABS-NOT-OWN).
      x-passage-duty: EssAbsence
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAbsenceRequest"
      responses:
        "201":
          description: Request submitted, with any non-blocking warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsenceRequestResult"
        "200":
          description: The stored request on an idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsenceRequestResult"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/absence/requests/{id}/decide:
    post:
      operationId: decideAbsenceRequest
      summary: Approve or reject a submitted request; approval spends the balance and publishes absence.approved
      description: |
        Approval rechecks the approved overlap and the balance, spends
        CARRY_OVER first, and writes dev.passage.hr.absence.approved.v1 in the
        same transaction. Replaying the decision a request already has returns
        it unchanged. An approver cannot decide their own request
        (HCM-ABS-SELF-APPROVAL, 403). A manager without HcmAbsenceAdmin can
        decide only a direct report's request; any other request is 404
        HCM-ABS-REQ-NOT-FOUND.
      x-passage-duty: MssApprove
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbsenceDecision"
      responses:
        "200":
          description: The request with its decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsenceRequest"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: HCM-ABS-YEAR-CLOSED (the request's plan year has had its year end)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: HCM-ABS-STATE, HCM-ABS-001 or HCM-ABS-002
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/absence/requests/{id}/cancel:
    post:
      operationId: cancelAbsenceRequest
      summary: Withdraw a submitted request (an approved one cannot be cancelled yet)
      x-passage-duty: EssAbsence
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The cancelled request (a replay returns it unchanged)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsenceRequest"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/workers/{id}/absence/balances:
    get:
      operationId: getAbsenceBalances
      summary: A worker's balances per plan for the plan year containing asOf
      description: |
        A caller with only EssAbsence reads their own worker (HCM-ABS-NOT-OWN
        otherwise). With MssApprove the caller reads their own and their
        direct reports' (any other worker is 404 HCM-WRK-NOT-FOUND);
        HcmAbsenceAdmin reads anyone's.
      x-passage-duty: EssAbsence
      parameters:
        - $ref: "#/components/parameters/WorkerId"
        - name: asOf
          in: query
          required: false
          description: Defaults to today (UTC).
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Balances (accrued, used, adjusted, expired, balance per bucket)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsenceBalances"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/hr/benefits/plans:
    get:
      operationId: listBenefitPlans
      summary: List benefit plans by code, each with its options
      x-passage-duty: EssBenefits
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitPlanList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createBenefitPlan
      summary: Create a benefit plan with its options, eligibility rule and open enrollment window (FR-42.8)
      description: |
        The eligibility rule is compiled before it is stored; a rule that does
        not parse is a 400 naming eligibilityRule. Rates take at most the
        currency's minor-unit places.
      x-passage-duty: HcmSetupAdmin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBenefitPlanRequest"
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitPlan"
        "200":
          description: The stored plan on an idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitPlan"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: HCM-BEN-PLAN-DUPLICATE (code taken) or idempotency_key_in_flight
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/benefits/plans/{id}:
    get:
      operationId: getBenefitPlan
      summary: A benefit plan with its options
      x-passage-duty: EssBenefits
      parameters:
        - $ref: "#/components/parameters/BenefitPlanId"
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitPlan"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/hr/benefits/plans/{id}/simulate:
    get:
      operationId: simulateBenefitEligibility
      summary: Evaluate the plan for every worker with a PRIMARY employment on asOf (BR-42.6, AC-42.5); writes nothing
      description: |
        The waiting period (from the hire date) and then the rule are applied
        exactly as enrollment applies them, one row per worker (a worker with
        PRIMARY employments in several legal entities is eligible when one of
        them is). A rule that reads a fact the worker lacks (fte without a
        position assignment, age, job.type) is not eligible and the reason
        says so. The read runs under the caller's legal-entity scope.
      x-passage-duty: HcmSetupAdmin
      parameters:
        - $ref: "#/components/parameters/BenefitPlanId"
        - name: asOf
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The eligibility of the workforce
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitSimulation"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/hr/benefits/life-events:
    post:
      operationId: recordLifeEvent
      summary: Record a life event, which opens a 30-day enrollment window from its date (8.42.5)
      description: |
        A caller without HcmWorkerMaintain records only their own worker's
        events (HCM-BEN-NOT-OWN otherwise).
      x-passage-duty: EssBenefits
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLifeEventRequest"
      responses:
        "201":
          description: Life event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifeEvent"
        "200":
          description: The stored event on an idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifeEvent"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/benefits/enrollments:
    post:
      operationId: createBenefitEnrollment
      summary: Enroll a worker in one option of a plan (FR-42.8, BR-42.6)
      description: |
        The effective date must fall in the plan's open enrollment window or
        within 30 days on or after the worker's life event (HCM-BEN-001); the
        worker must pass the waiting period and the rule as of that date
        (HCM-BEN-002, with the reason); the option must be the plan's
        (HCM-BEN-003); and the worker must not hold an enrollment in the plan
        that overlaps it (HCM-BEN-004, end it first). The
        benefitenrollment.changed event (START) is written in the same
        transaction. A caller without HcmWorkerMaintain enrolls only their own
        worker (HCM-BEN-NOT-OWN).
      x-passage-duty: EssBenefits
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBenefitEnrollmentRequest"
      responses:
        "201":
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitEnrollment"
        "200":
          description: The stored enrollment on an idempotent replay (no second event)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitEnrollment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: HCM-BEN-004 (overlapping enrollment) or idempotency_key_in_flight
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/benefits/enrollments/{id}/end:
    post:
      operationId: endBenefitEnrollment
      summary: End an enrollment after its last covered day (BR-42.6)
      description: |
        A TERMINATION keeps coverage to the end of the month of lastDay and
        marks a COBRA qualifying event on MEDICAL, DENTAL, VISION and FSA
        plans; other reasons end the day after lastDay. Ending again with the
        same values returns the enrollment unchanged; otherwise an ended
        enrollment is HCM-BEN-ENDED. The END event commits with the change.
      x-passage-duty: HcmWorkerMaintain
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndBenefitEnrollmentRequest"
      responses:
        "200":
          description: The ended enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitEnrollment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
