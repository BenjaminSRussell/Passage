    get:
      operationId: getWorkerBenefits
      summary: A worker's enrollments (oldest first) and life events (newest first)
      description: |
        A caller with only EssBenefits reads their own worker (HCM-BEN-NOT-OWN
        otherwise); HcmWorkerInquire or HcmWorkerMaintain read anyone's.
      x-passage-duty: EssBenefits
      parameters:
