  /v1/hr/skills/search:
    get:
      operationId: searchSkills
      summary: Skill mapping search (FR-42.18)
      description: |
        Workers with an employment on asOf (under the caller's legal-entity
        scope) who are rated at least the minimum on every skill and hold
        every certificate valid on asOf, by personnel number, at most 500
        (truncated is true when more matched). Give skills, certs or both. A
        skill code not in the catalog matches nobody. availableFrom is refused
        until availability exists (NOT-IMPLEMENTED.md).
      x-passage-duty: HcmOrgInquire
      parameters:
        - name: skills
          in: query
          required: false
          description: Comma-separated CODE or CODE:minRating terms, at most 20 (e.g. WELDING:3,PLC).
          schema:
            type: string
        - name: minRating
          in: query
          required: false
          description: Minimum for terms without their own; default 1.
          schema:
            type: integer
            minimum: 1
            maximum: 10
        - name: certs
          in: query
          required: false
          description: Comma-separated certificate codes, at most 20.
          schema:
            type: string
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200":
          description: Matching workers with each searched skill next to their rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillSearch"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/hr/workers/{id}/skills:
    get:
      operationId: listWorkerSkills
      summary: A worker's skill profile, one current rating per skill
      x-passage-duty: HcmWorkerInquire
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: The profile by skill code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerSkillList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: rateWorkerSkill
      summary: Record a worker's rating on a skill, replacing the earlier one (FR-42.10)
      description: |
        The rating must be on the skill's scale (HCM-SKL-RATING). An
        assessment dated before the stored one is HCM-SKL-STALE, so a late
        retry cannot overwrite a newer rating. The same rating and date again
        changes nothing and publishes no event, so a retry is safe without an
        Idempotency-Key. A changed rating publishes workerskill.changed.
      x-passage-duty: HcmWorkerMaintain
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateWorkerSkillRequest"
      responses:
        "200":
          description: The stored rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerSkill"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: HCM-WRK-NOT-FOUND or HCM-SKL-NOT-FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: HCM-SKL-STALE (a newer assessment is stored)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: HCM-SKL-RATING (rating outside the skill's scale)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
