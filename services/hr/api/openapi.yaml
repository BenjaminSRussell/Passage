        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkerSkill"
    IssueCertificationRequest:
      type: object
      additionalProperties: false
      required: [code, name, issuedOn]
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9_-]{0,19}$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        issuer:
          type: string
          maxLength: 120
        issuedOn:
          type: string
          format: date
          description: Not in the future.
        expiresOn:
          type: string
          format: date
          description: After issuedOn; not with validityMonths.
        validityMonths:
          type: integer
          minimum: 1
          maximum: 240
    Certification:
      type: object
      required: [id, workerId, code, name, issuedOn, valid]
      properties:
        id:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        issuer:
          type: string
        issuedOn:
          type: string
          format: date
        expiresOn:
          type: string
          format: date
          description: Exclusive; absent when the certificate never expires.
        valid:
          type: boolean
          description: Valid on the as-of date of the read (today for a create).
    CertificationList:
      type: object
      required: [asOf, items]
      properties:
        asOf:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: "#/components/schemas/Certification"
    ExpiringCertification:
      allOf:
        - $ref: "#/components/schemas/Certification"
        - type: object
          required: [personnelNumber, legalName, daysLeft]
          properties:
            personnelNumber:
              type: string
            legalName:
              type: string
            daysLeft:
              type: integer
    ExpiringCertificationList:
      type: object
      required: [asOf, withinDays, items]
      properties:
        asOf:
          type: string
          format: date
        withinDays:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExpiringCertification"
        nextCursor:
          type: string
    SkillRequirement:
      type: object
      required: [positionId, skillId, skillCode, skillName, scaleMax, minRating]
      properties:
        positionId:
          type: string
          format: uuid
        skillId:
          type: string
          format: uuid
        skillCode:
          type: string
        skillName:
          type: string
        scaleMax:
          type: integer
        minRating:
          type: integer
    SkillRequirementList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SkillRequirement"
    SetSkillRequirementRequest:
      type: object
      additionalProperties: false
      required: [skillCode, minRating]
      properties:
        skillCode:
          type: string
        minRating:
          type: integer
          minimum: 1
          maximum: 10
    SkillGapRow:
      type: object
      required: [skill, required, actual, delta]
      properties:
        skill:
          type: string
        required:
          type: integer
        actual:
          type: integer
          description: 0 when the worker is not rated on the skill.
        delta:
          type: integer
          description: actual - required; negative is a shortfall.
    SkillGap:
      type: object
      required: [workerId, positionId, met, comparison, gaps]
      properties:
        workerId:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        met:
          type: boolean
        comparison:
          type: array
          items:
            $ref: "#/components/schemas/SkillGapRow"
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/SkillGapRow"
    SkillMatch:
      type: object
      required: [workerId, personnelNumber, legalName, skills]
      properties:
        workerId:
          type: string
          format: uuid
        personnelNumber:
          type: string
        legalName:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillGapRow"
    SkillSearch:
      type: object
      required: [asOf, items, truncated]
      properties:
        asOf:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: "#/components/schemas/SkillMatch"
        truncated:
          type: boolean
