    BenefitOptionInput:
      type: object
      additionalProperties: false
      required: [code, coverageLevel, employeeRate, employerRate]
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,19}$"
          description: Stored upper-case; unique in the plan.
        coverageLevel:
          type: string
          minLength: 1
          maxLength: 40
        employeeRate:
          type: string
          description: Decimal string in the plan currency, never a float; at most its minor-unit places.
        employerRate:
          type: string
        rateBasis:
          type: string
          enum: [PER_PAY_PERIOD, MONTHLY]
          default: PER_PAY_PERIOD
    BenefitOption:
      type: object
