openapi: 3.1.0
info:
  title: Passage HR API
  version: 0.1.0
  description: |
    Wave 42 slices 1 to 4 (PSG-42): workers, employments, positions and
    position assignments with effective dating, the as-of manager query, the
    audited PII vault, absence plans, accrual, year end and carry-over,
    balances and requests with approval, benefit plans with CEL
    eligibility, a workforce simulation, life events and enrollments, and
    skills: the catalog, worker ratings, certificates with expiry, position
    skill profiles, gap analysis and skill search. Personnel actions,
    performance and goals, learning, questionnaires, incidents, recruiting
    and compensation cycles are later slices (see NOT-IMPLEMENTED.md).
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
security:
  - bearerAuth: []
paths:
  /readyz:
    get:
      operationId: readiness
      summary: Readiness (pings Postgres within 500 ms)
      x-passage-duty: none
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: Database unreachable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/workers:
    get:
      operationId: listWorkers
      summary: List workers by personnel number (no PII)
      x-passage-duty: HcmWorkerInquire
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive match on personnel number, legal name or preferred name.
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of workers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWorker
      summary: Create a worker and seal its PII into the vault
      x-passage-duty: HcmWorkerMaintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkerRequest"
      responses:
        "201":
          description: Worker created (or the stored response on idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/workers/{id}:
    get:
      operationId: getWorker
      summary: Get a worker with PII masked
      x-passage-duty: HcmWorkerInquire
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: Worker with masked PII; every call is audited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDetail"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/hr/workers/{id}/as-of:
    get:
      operationId: workerAsOf
      summary: Employments, primary position and manager as-of a date (FR-42.4, BR-42.1)
      x-passage-duty: HcmWorkerInquire
      parameters:
        - $ref: "#/components/parameters/WorkerId"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: As-of view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsOfView"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/hr/workers/{id}/pii:
    get:
      operationId: revealPII
      summary: Unmasked PII, audited with a reason (FR-42.1, AC-42.7)
      x-passage-duty: HcmPIIRead
      parameters:
        - $ref: "#/components/parameters/WorkerId"
        - name: reason
          in: query
          required: true
          description: At least 10 characters (tenant parameter PII reveal reason minimum length).
          schema:
            type: string
            minLength: 10
            maxLength: 500
      responses:
        "200":
          description: Unmasked PII; the audit row is written in the same transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PIIView"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/workers/{id}/employments:
    get:
      operationId: listEmployments
      summary: Every employment of a worker, oldest first, with status as-of now
      x-passage-duty: HcmWorkerInquire
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: Employments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentList"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createEmployment
      summary: Start an employment at a legal entity (FR-42.2, FR-42.23)
      x-passage-duty: HcmWorkerMaintain
      parameters:
        - $ref: "#/components/parameters/WorkerId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmploymentRequest"
      responses:
        "201":
          description: Employment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/positions:
    get:
      operationId: listPositions
      summary: List positions by position number
      x-passage-duty: HcmOrgInquire
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPosition
      summary: Create a position with an FTE (FR-42.3)
      x-passage-duty: HcmOrgMaintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePositionRequest"
      responses:
        "201":
          description: Position created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/positions/{id}:
    get:
      operationId: getPosition
      summary: A position with every assignment on it
      x-passage-duty: HcmOrgInquire
      parameters:
        - $ref: "#/components/parameters/PositionId"
      responses:
        "200":
          description: Position detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionDetail"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/hr/positions/{id}/assignments:
    post:
      operationId: createAssignment
      summary: Place a worker on a position; FTE and primary rules apply (FR-42.3)
      x-passage-duty: HcmActionMaintain
      parameters:
        - $ref: "#/components/parameters/PositionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionAssignment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/absence/plans:
    get:
      operationId: listAbsencePlans
      summary: List absence plans by code
      x-passage-duty: EssAbsence
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsencePlanList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAbsencePlan
      summary: Create an absence plan with its accrual rule (FR-42.6, BR-42.3)
      x-passage-duty: HcmAbsenceAdmin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAbsencePlanRequest"
      responses:
        "201":
          description: Plan created, or the stored plan on an idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsencePlan"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: HCM-ABS-PLAN-DUPLICATE (code taken) or idempotency_key_in_flight
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/absence/plans/{id}:
    get:
      operationId: getAbsencePlan
      summary: An absence plan with its latest accrual periods, year ends and carry-over expiries
      x-passage-duty: HcmAbsenceAdmin
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsencePlanDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/hr/absence/plans/{id}/year-end:
    post:
      operationId: closeAbsencePlanYear
      summary: Year end (BR-42.3) - carry each worker's balance into the next plan year up to carryOverMax, expire the rest
      description: |
        Runs once the plan year has ended (HCM-ABS-NOT-DUE before). Keyed per
        (plan, plan year, worker): a rerun closes only workers not yet closed.
        Accrual into the next plan year is refused (HCM-ABS-YEAR-OPEN) until
        the previous year is closed.
      x-passage-duty: HcmAbsenceAdmin
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanYearRequest"
      responses:
        "201":
          description: At least one worker closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseRun"
        "200":
          description: Nobody left to close
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseRun"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: HCM-ABS-PERIOD (not a plan-year start) or HCM-ABS-NOT-DUE
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/absence/plans/{id}/carry-over-expiry:
    post:
      operationId: expireAbsenceCarryOver
      summary: Expire unused carry-over of one plan year once carryOverExpiryMonths have passed (BR-42.3)
      x-passage-duty: HcmAbsenceAdmin
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanYearRequest"
      responses:
        "201":
          description: At least one worker's carry-over expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseRun"
        "200":
          description: Nobody left to expire
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseRun"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: HCM-ABS-PERIOD, HCM-ABS-NOT-DUE or HCM-ABS-NO-EXPIRY (plan keeps carry-over all year)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/absence/accrue:
    post:
      operationId: runAbsenceAccrual
      summary: Accrue one plan for one whole accrual period (BR-42.3)
      description: |
        The period must be one accrual period of the plan (a calendar month for
        MONTHLY, 14 days for BIWEEKLY, the plan year for ANNUAL; HCM-ABS-PERIOD
        otherwise) whose accrual day has come (HCM-ABS-NOT-DUE). Each worker
        with a PRIMARY employment in the period is accrued once per period (the
        PRD key per plan and period, kept per worker), so a retried call
        credits nobody twice and needs no Idempotency-Key. Employments are read
        under the caller's legal-entity scope; a later run with another scope
        credits the remaining workers.
      x-passage-duty: HcmAbsenceAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccrualRequest"
      responses:
        "201":
          description: At least one worker credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccrualRun"
        "200":
          description: Nobody left to credit (replayed is true when an earlier call did the work)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccrualRun"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: HCM-ABS-RUN-OVERLAP (another period of the plan covers these days), HCM-ABS-YEAR-OPEN or HCM-ABS-YEAR-CLOSED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: HCM-ABS-PERIOD or HCM-ABS-NOT-DUE
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/absence/requests:
    get:
      operationId: listAbsenceRequests
      summary: Absence requests by start date, oldest first (the approval queue)
      description: |
        A caller with only EssAbsence sees their own requests (the worker whose
        sign-in user they are). MssApprove or HcmAbsenceAdmin see the tenant's;
        narrowing a manager to their team is the OPA handoff.
      x-passage-duty: EssAbsence
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [SUBMITTED, APPROVED, REJECTED, CANCELED]
        - name: workerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsenceRequestList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAbsenceRequest
      summary: Submit an absence request (FR-42.7, BR-42.4, BR-42.5)
      description: |
        Checked against the plan-year balance plus the negative allowance
        (HCM-ABS-002), an approved overlap (HCM-ABS-001), the span (at most one
        day, or 24 hours, per calendar day) and the plan year (HCM-ABS-YEAR-SPAN,
        and HCM-ABS-YEAR-CLOSED once the year has had its year end).
        An overlap with a submitted request only warns (HCM-ABS-003). A caller
        without HcmAbsenceAdmin requests only for their own worker
        (HCM-ABS-NOT-OWN).
      x-passage-duty: EssAbsence
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAbsenceRequest"
      responses:
        "201":
          description: Request submitted, with any non-blocking warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsenceRequestResult"
        "200":
          description: The stored request on an idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsenceRequestResult"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/absence/requests/{id}/decide:
    post:
      operationId: decideAbsenceRequest
      summary: Approve or reject a submitted request; approval spends the balance and publishes absence.approved
      description: |
        Approval rechecks the approved overlap and the balance, spends
        CARRY_OVER first, and writes dev.passage.hr.absence.approved.v1 in the
        same transaction. Replaying the decision a request already has returns
        it unchanged. An approver cannot decide their own request
        (HCM-ABS-SELF-APPROVAL, 403).
      x-passage-duty: MssApprove
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbsenceDecision"
      responses:
        "200":
          description: The request with its decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsenceRequest"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: HCM-ABS-YEAR-CLOSED (the request's plan year has had its year end)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: HCM-ABS-STATE, HCM-ABS-001 or HCM-ABS-002
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/absence/requests/{id}/cancel:
    post:
      operationId: cancelAbsenceRequest
      summary: Withdraw a submitted request (an approved one cannot be cancelled yet)
      x-passage-duty: EssAbsence
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The cancelled request (a replay returns it unchanged)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsenceRequest"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/workers/{id}/absence/balances:
    get:
      operationId: getAbsenceBalances
      summary: A worker's balances per plan for the plan year containing asOf
      description: |
        A caller with only EssAbsence reads their own worker (HCM-ABS-NOT-OWN
        otherwise); MssApprove or HcmAbsenceAdmin read anyone's.
      x-passage-duty: EssAbsence
      parameters:
        - $ref: "#/components/parameters/WorkerId"
        - name: asOf
          in: query
          required: false
          description: Defaults to today (UTC).
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Balances (accrued, used, adjusted, expired, balance per bucket)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbsenceBalances"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/hr/benefits/plans:
    get:
      operationId: listBenefitPlans
      summary: List benefit plans by code, each with its options
      x-passage-duty: EssBenefits
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitPlanList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createBenefitPlan
      summary: Create a benefit plan with its options, eligibility rule and open enrollment window (FR-42.8)
      description: |
        The eligibility rule is compiled before it is stored; a rule that does
        not parse is a 400 naming eligibilityRule. Rates take at most the
        currency's minor-unit places.
      x-passage-duty: HcmSetupAdmin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBenefitPlanRequest"
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitPlan"
        "200":
          description: The stored plan on an idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitPlan"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: HCM-BEN-PLAN-DUPLICATE (code taken) or idempotency_key_in_flight
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/benefits/plans/{id}:
    get:
      operationId: getBenefitPlan
      summary: A benefit plan with its options
      x-passage-duty: EssBenefits
      parameters:
        - $ref: "#/components/parameters/BenefitPlanId"
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitPlan"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/hr/benefits/plans/{id}/simulate:
    get:
      operationId: simulateBenefitEligibility
      summary: Evaluate the plan for every worker with a PRIMARY employment on asOf (BR-42.6, AC-42.5); writes nothing
      description: |
        The waiting period (from the hire date) and then the rule are applied
        exactly as enrollment applies them, one row per worker (a worker with
        PRIMARY employments in several legal entities is eligible when one of
        them is). A rule that reads a fact the worker lacks (fte without a
        position assignment, age, job.type) is not eligible and the reason
        says so. The read runs under the caller's legal-entity scope.
      x-passage-duty: HcmSetupAdmin
      parameters:
        - $ref: "#/components/parameters/BenefitPlanId"
        - name: asOf
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The eligibility of the workforce
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitSimulation"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/hr/benefits/life-events:
    post:
      operationId: recordLifeEvent
      summary: Record a life event, which opens a 30-day enrollment window from its date (8.42.5)
      description: |
        A caller without HcmWorkerMaintain records only their own worker's
        events (HCM-BEN-NOT-OWN otherwise).
      x-passage-duty: EssBenefits
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLifeEventRequest"
      responses:
        "201":
          description: Life event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifeEvent"
        "200":
          description: The stored event on an idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifeEvent"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/benefits/enrollments:
    post:
      operationId: createBenefitEnrollment
      summary: Enroll a worker in one option of a plan (FR-42.8, BR-42.6)
      description: |
        The effective date must fall in the plan's open enrollment window or
        within 30 days on or after the worker's life event (HCM-BEN-001); the
        worker must pass the waiting period and the rule as of that date
        (HCM-BEN-002, with the reason); the option must be the plan's
        (HCM-BEN-003); and the worker must not hold an enrollment in the plan
        that overlaps it (HCM-BEN-004, end it first). The
        benefitenrollment.changed event (START) is written in the same
        transaction. A caller without HcmWorkerMaintain enrolls only their own
        worker (HCM-BEN-NOT-OWN).
      x-passage-duty: EssBenefits
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBenefitEnrollmentRequest"
      responses:
        "201":
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitEnrollment"
        "200":
          description: The stored enrollment on an idempotent replay (no second event)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitEnrollment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: HCM-BEN-004 (overlapping enrollment) or idempotency_key_in_flight
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/benefits/enrollments/{id}/end:
    post:
      operationId: endBenefitEnrollment
      summary: End an enrollment after its last covered day (BR-42.6)
      description: |
        A TERMINATION keeps coverage to the end of the month of lastDay and
        marks a COBRA qualifying event on MEDICAL, DENTAL, VISION and FSA
        plans; other reasons end the day after lastDay. Ending again with the
        same values returns the enrollment unchanged; otherwise an ended
        enrollment is HCM-BEN-ENDED. The END event commits with the change.
      x-passage-duty: HcmWorkerMaintain
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndBenefitEnrollmentRequest"
      responses:
        "200":
          description: The ended enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitEnrollment"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/workers/{id}/benefits:
    get:
      operationId: getWorkerBenefits
      summary: A worker's enrollments (oldest first) and life events (newest first)
      description: |
        A caller with only EssBenefits reads their own worker (HCM-BEN-NOT-OWN
        otherwise); HcmWorkerInquire or HcmWorkerMaintain read anyone's.
      x-passage-duty: EssBenefits
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: The worker's benefits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerBenefits"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/hr/skills:
    get:
      operationId: listSkills
      summary: List the skill catalog by code (FR-42.10)
      x-passage-duty: HcmWorkerInquire
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of skills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSkill
      summary: Add a skill to the catalog with its rating scale 1..scaleMax (FR-42.10)
      x-passage-duty: HcmSetupAdmin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSkillRequest"
      responses:
        "201":
          description: Skill created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "200":
          description: The stored skill on an idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: HCM-SKL-DUPLICATE (code taken) or idempotency_key_in_flight
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/skills/search:
    get:
      operationId: searchSkills
      summary: Skill mapping search (FR-42.18)
      description: |
        Workers with an employment on asOf (under the caller's legal-entity
        scope) who are rated at least the minimum on every skill and hold
        every certificate valid on asOf, by personnel number, at most 500
        (truncated is true when more matched). Give skills, certs or both. A
        skill code not in the catalog matches nobody. availableFrom is refused
        until availability exists (NOT-IMPLEMENTED.md).
      x-passage-duty: HcmOrgInquire
      parameters:
        - name: skills
          in: query
          required: false
          description: Comma-separated CODE or CODE:minRating terms, at most 20 (e.g. WELDING:3,PLC).
          schema:
            type: string
        - name: minRating
          in: query
          required: false
          description: Minimum for terms without their own; default 1.
          schema:
            type: integer
            minimum: 1
            maximum: 10
        - name: certs
          in: query
          required: false
          description: Comma-separated certificate codes, at most 20.
          schema:
            type: string
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200":
          description: Matching workers with each searched skill next to their rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillSearch"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/hr/workers/{id}/skills:
    get:
      operationId: listWorkerSkills
      summary: A worker's skill profile, one current rating per skill
      x-passage-duty: HcmWorkerInquire
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: The profile by skill code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerSkillList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: rateWorkerSkill
      summary: Record a worker's rating on a skill, replacing the earlier one (FR-42.10)
      description: |
        The rating must be on the skill's scale (HCM-SKL-RATING). An
        assessment dated before the stored one is HCM-SKL-STALE, so a late
        retry cannot overwrite a newer rating. The same rating and date again
        changes nothing and publishes no event, so a retry is safe without an
        Idempotency-Key. A changed rating publishes workerskill.changed.
      x-passage-duty: HcmWorkerMaintain
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateWorkerSkillRequest"
      responses:
        "200":
          description: The stored rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerSkill"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: HCM-WRK-NOT-FOUND or HCM-SKL-NOT-FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: HCM-SKL-STALE (a newer assessment is stored)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: HCM-SKL-RATING (rating outside the skill's scale)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/workers/{id}/certifications:
    get:
      operationId: listCertifications
      summary: A worker's certificates, newest first, with validity as-of a date (BR-42.8)
      x-passage-duty: HcmWorkerInquire
      parameters:
        - $ref: "#/components/parameters/WorkerId"
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200":
          description: The certificates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificationList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: issueCertification
      summary: Record a certificate a worker holds (BR-42.8)
      description: |
        Give expiresOn or validityMonths (expiry = issue date + months, on the
        month's last day when the day does not exist), or neither for a
        certificate that never expires. Validity is [issuedOn, expiresOn).
        Publishes certification.issued.
      x-passage-duty: HcmWorkerMaintain
      parameters:
        - $ref: "#/components/parameters/WorkerId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCertificationRequest"
      responses:
        "201":
          description: Certificate recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"
        "200":
          description: The stored certificate on an idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: HCM-CERT-DUPLICATE (same code and issue date for the worker) or idempotency_key_in_flight
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/hr/certifications/expiring:
    get:
      operationId: listExpiringCertifications
      summary: Certifications expiring (8.42.14, BR-42.8)
      description: |
        Certificates valid on asOf that expire within withinDays after it,
        soonest first. A certificate already renewed (a later one of the same
        code for the worker that is valid longer) is left out.
      x-passage-duty: HcmWorkerInquire
      parameters:
        - $ref: "#/components/parameters/AsOf"
        - name: withinDays
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 366
            default: 60
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of expiring certificates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpiringCertificationList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/hr/workers/{id}/skill-gap:
    get:
      operationId: skillGap
      summary: Gap between a position's skill profile and the worker's ratings (FR-42.18, AC-42.16)
      description: |
        comparison lists every requirement with the worker's rating (0 when
        not rated) and delta = actual - required; gaps lists only the rows
        with a negative delta.
      x-passage-duty: HcmOrgInquire
      parameters:
        - $ref: "#/components/parameters/WorkerId"
        - name: positionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillGap"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: HCM-WRK-NOT-FOUND or HCM-POS-NOT-FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/positions/{id}/skill-requirements:
    get:
      operationId: listSkillRequirements
      summary: A position's skill profile by skill code
      x-passage-duty: HcmOrgInquire
      parameters:
        - $ref: "#/components/parameters/PositionId"
      responses:
        "200":
          description: The requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillRequirementList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: setSkillRequirement
      summary: Set or replace the minimum rating a position needs in a skill (FR-42.18)
      description: Replaces an earlier minimum for the same skill, so a retry is safe without an Idempotency-Key.
      x-passage-duty: HcmOrgMaintain
      parameters:
        - $ref: "#/components/parameters/PositionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSkillRequirementRequest"
      responses:
        "200":
          description: The stored requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillRequirement"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: HCM-POS-NOT-FOUND or HCM-SKL-NOT-FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: HCM-SKL-RATING (minimum outside the skill's scale)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/positions/{id}/skill-requirements/{skillCode}:
    delete:
      operationId: removeSkillRequirement
      summary: Drop a skill from a position's profile
      x-passage-duty: HcmOrgMaintain
      parameters:
        - $ref: "#/components/parameters/PositionId"
        - name: skillCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: HCM-POS-NOT-FOUND or HCM-SKL-REQ-NOT-FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PositionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BenefitPlanId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnrollmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AsOf:
      name: asOf
      in: query
      required: false
      description: YYYY-MM-DD; default today (UTC).
      schema:
        type: string
        format: date
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Stored on the created row per tenant. A replay with the same body
        returns the stored row (201, no second event); the same key with a
        different body is 422 idempotency_key_reuse, and a concurrent request
        still holding the key is 409 idempotency_key_in_flight.
      schema:
        type: string
        maxLength: 255
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: nextCursor from the previous page.
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: Request failed validation (COM-0001); errors names each field
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: https://passage.dev/problems/HCM-POS-001
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        serviceCode:
          type: string
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
    CreateWorkerRequest:
      type: object
      additionalProperties: false
      required: [personnelNumber, workerType, partyPersonId, legalName, nationalId]
      properties:
        personnelNumber:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{0,19}$"
        workerType:
          type: string
          enum: [EMPLOYEE, CONTRACTOR]
        partyPersonId:
          type: string
          format: uuid
        legalName:
          type: string
          maxLength: 200
        preferredName:
          type: string
        userId:
          type: string
          format: uuid
        nationalId:
          type: string
          maxLength: 32
          description: Sealed with AES-256-GCM; never returned unmasked except through the audited reveal.
        bankAccount:
          type: string
          maxLength: 34
    Worker:
      type: object
      required: [id, personnelNumber, workerType, partyPersonId, legalName, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        personnelNumber:
          type: string
        workerType:
          type: string
          enum: [EMPLOYEE, CONTRACTOR]
        partyPersonId:
          type: string
          format: uuid
        legalName:
          type: string
        preferredName:
          type: string
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkerDetail:
      allOf:
        - $ref: "#/components/schemas/Worker"
        - type: object
          required: [pii]
          properties:
            pii:
              $ref: "#/components/schemas/PIIView"
    PIIView:
      type: object
      required: [nationalId, masked]
      properties:
        nationalId:
          type: string
          description: "Masked as ***-**-#### unless revealed."
        bankAccount:
          type: string
          description: "Masked as ****#### unless revealed."
        masked:
          type: boolean
    WorkerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Worker"
        nextCursor:
          type: string
    EmploymentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Employment"
    PositionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        nextCursor:
          type: string
    PositionDetail:
      allOf:
        - $ref: "#/components/schemas/Position"
        - type: object
          required: [assignments]
          properties:
            assignments:
              type: array
              items:
                $ref: "#/components/schemas/PositionAssignment"
    CreateEmploymentRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, employmentType, hireDate]
      properties:
        legalEntityId:
          type: string
          format: uuid
        employmentType:
          type: string
          enum: [FULL_TIME, PART_TIME, TEMP, CONTRACTOR]
        assignmentKind:
          type: string
          enum: [PRIMARY, CONCURRENT, GLOBAL_HOST]
          default: PRIMARY
        homeLegalEntityId:
          type: string
          format: uuid
          description: Required for GLOBAL_HOST and must differ from legalEntityId.
        plannedEndDate:
          type: string
          format: date
          description: Required for GLOBAL_HOST; not before hireDate.
        hireDate:
          type: string
          format: date
        terminationDate:
          type: string
          format: date
          description: Last day employed (inclusive); must not be before hireDate (HCM-EMP-002). validTo is the next day.
    Employment:
      type: object
      required: [id, workerId, legalEntityId, employmentType, assignmentKind, hireDate, validFrom, status]
      properties:
        id:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        legalEntityId:
          type: string
          format: uuid
        employmentType:
          type: string
        assignmentKind:
          type: string
          enum: [PRIMARY, CONCURRENT, GLOBAL_HOST]
        homeLegalEntityId:
          type: string
          format: uuid
        plannedEndDate:
          type: string
          format: date
        hireDate:
          type: string
          format: date
        terminationDate:
          type: string
          format: date
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
          description: Exclusive end of the range [validFrom, validTo).
        status:
          type: string
          enum: [PENDING, ACTIVE, TERMINATED]
          description: Derived from the range as-of the read (the as-of date, or now for lists). ON_LEAVE arrives with personnel actions.
    CreatePositionRequest:
      type: object
      additionalProperties: false
      required: [positionNumber, jobCode, departmentId, legalEntityId, validFrom]
      properties:
        positionNumber:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{0,19}$"
        jobCode:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9_-]{0,19}$"
        departmentId:
          type: string
          format: uuid
        legalEntityId:
          type: string
          format: uuid
        fte:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
          default: "1.00"
          description: Decimal string from 0.05 to 2.00 (never a float); 1.00 when omitted.
        allowOverfill:
          type: boolean
          default: false
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        reportsToPositionId:
          type: string
          format: uuid
          description: Must exist on validFrom (HCM-POS-PARENT-INVALID).
    Position:
      type: object
      required: [id, positionNumber, jobCode, departmentId, legalEntityId, fte, allowOverfill, validFrom]
      properties:
        id:
          type: string
          format: uuid
        positionNumber:
          type: string
        jobCode:
          type: string
        departmentId:
          type: string
          format: uuid
        legalEntityId:
          type: string
          format: uuid
        fte:
          type: string
        allowOverfill:
          type: boolean
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        reportsToPositionId:
          type: string
          format: uuid
    CreateAssignmentRequest:
      type: object
      additionalProperties: false
      required: [workerId, employmentId, fteShare, validFrom]
      properties:
        workerId:
          type: string
          format: uuid
        employmentId:
          type: string
          format: uuid
        fteShare:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        isPrimary:
          type: boolean
          default: false
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
    PositionAssignment:
      type: object
      required: [id, positionId, workerId, employmentId, fteShare, isPrimary, validFrom]
      properties:
        id:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        employmentId:
          type: string
          format: uuid
        fteShare:
          type: string
        isPrimary:
          type: boolean
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
    AsOfView:
      type: object
      required: [workerId, date, employments]
      properties:
        workerId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        employments:
          type: array
          items:
            $ref: "#/components/schemas/Employment"
        positionId:
          type: [string, "null"]
        positionNumber:
          type: [string, "null"]
        fteShare:
          type: [string, "null"]
        managerWorkerId:
          type: [string, "null"]
          description: Incumbent of the reports-to position as-of the date, walking up at most the configured depth; null when vacant (BR-42.1).
    CreateAbsencePlanRequest:
      type: object
      additionalProperties: false
      required: [code, unit, accrualRate, maxBalance]
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,19}$"
          description: Stored upper-case; unique per tenant.
        unit:
          type: string
          enum: [HOURS, DAYS]
        accrualFrequency:
          type: string
          enum: [MONTHLY, BIWEEKLY, ANNUAL, PER_HOUR_WORKED]
          default: MONTHLY
          description: PER_HOUR_WORKED plans can be defined but not accrued until wave-25 time registrations exist.
        accrualRate:
          type: string
          description: Decimal string, never a float; at most 4 places, below 10000.
        accrualDay:
          type: string
          enum: [LAST_DAY, FIRST_DAY, PAYDATE]
          default: LAST_DAY
        proration:
          type: string
          enum: [DAYS_IN_PERIOD, NONE]
          default: DAYS_IN_PERIOD
        maxBalance:
          type: string
          description: Decimal string; accrual above it is discarded (BR-42.3).
        carryOverMax:
          type: string
          default: "0"
        carryOverExpiryMonths:
          type: integer
          minimum: 0
          maximum: 36
          default: 3
          description: 0 keeps carry-over for the whole plan year.
        planYearStart:
          type: string
          pattern: "^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
          default: "01-01"
          description: MM-DD of a day every year has (02-29 is refused).
        negativeBalanceAllowed:
          type: boolean
          default: false
          description: Allows the balance down to -(accrualRate x 2) (BR-42.4).
        minServiceDays:
          type: integer
          minimum: 0
          maximum: 3650
          default: 0
    AbsencePlan:
      type: object
      required: [id, code, unit, accrualFrequency, accrualRate, accrualDay, proration, maxBalance, carryOverMax, carryOverExpiryMonths, planYearStart, negativeBalanceAllowed, minServiceDays, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        unit:
          type: string
          enum: [HOURS, DAYS]
        accrualFrequency:
          type: string
          enum: [MONTHLY, BIWEEKLY, ANNUAL, PER_HOUR_WORKED]
        accrualRate:
          type: string
        accrualDay:
          type: string
          enum: [LAST_DAY, FIRST_DAY, PAYDATE]
        proration:
          type: string
          enum: [DAYS_IN_PERIOD, NONE]
        maxBalance:
          type: string
        carryOverMax:
          type: string
        carryOverExpiryMonths:
          type: integer
        planYearStart:
          type: string
        negativeBalanceAllowed:
          type: boolean
        minServiceDays:
          type: integer
        createdAt:
          type: string
          format: date-time
    AbsencePlanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AbsencePlan"
        nextCursor:
          type: string
    AbsencePlanDetail:
      allOf:
        - $ref: "#/components/schemas/AbsencePlan"
        - type: object
          required: [periods, closes]
          properties:
            periods:
              type: array
              description: The latest 24 accrual periods, newest first.
              items:
                type: object
                required: [periodStart, periodEnd, workers, accrued, discarded]
                properties:
                  periodStart:
                    type: string
                    format: date
                  periodEnd:
                    type: string
                    format: date
                  workers:
                    type: integer
                  accrued:
                    type: string
                  discarded:
                    type: string
            closes:
              type: array
              description: The latest 24 year ends and carry-over expiries, newest first.
              items:
                type: object
                required: [planYearStart, kind, workers, carried, expired]
                properties:
                  planYearStart:
                    type: string
                    format: date
                  kind:
                    type: string
                    enum: [YEAR_END, CARRY_EXPIRY]
                  workers:
                    type: integer
                  carried:
                    type: string
                  expired:
                    type: string
    AccrualRequest:
      type: object
      additionalProperties: false
      required: [planId, periodStart, periodEnd]
      properties:
        planId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
          description: First day of the period, inclusive.
        periodEnd:
          type: string
          format: date
          description: Last day of the period, inclusive.
    AccrualRun:
      type: object
      required: [planId, periodStart, periodEnd, planYearStart, credited, alreadyAccrued, accrued, discarded, replayed]
      properties:
        planId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        planYearStart:
          type: string
          format: date
          description: The plan year the accrual was booked to.
        credited:
          type: integer
          description: Workers this call accrued.
        alreadyAccrued:
          type: integer
          description: Workers an earlier call for the same period had accrued.
        accrued:
          type: string
          description: Total kept by this call.
        discarded:
          type: string
          description: Total discarded at maxBalance by this call (BR-42.3).
        replayed:
          type: boolean
    PlanYearRequest:
      type: object
      additionalProperties: false
      required: [planYearStart]
      properties:
        planYearStart:
          type: string
          format: date
          description: First day of the plan year to close or expire.
    CloseRun:
      type: object
      required: [planId, planYearStart, kind, workers, alreadyClosed, carried, expired]
      properties:
        planId:
          type: string
          format: uuid
        planYearStart:
          type: string
          format: date
        kind:
          type: string
          enum: [YEAR_END, CARRY_EXPIRY]
        workers:
          type: integer
        alreadyClosed:
          type: integer
        carried:
          type: string
        expired:
          type: string
    CreateAbsenceRequest:
      type: object
      additionalProperties: false
      required: [workerId, planId, from, to, quantity]
      properties:
        workerId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Last day, inclusive; at most 366 days after from.
        quantity:
          type: string
          description: Positive decimal with at most 2 places, in the plan's unit.
        reason:
          type: string
          maxLength: 500
    AbsenceRequest:
      type: object
      required: [id, workerId, personnelNumber, workerName, planId, planCode, unit, from, to, quantity, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        personnelNumber:
          type: string
        workerName:
          type: string
          description: Preferred name, else legal name.
        planId:
          type: string
          format: uuid
        planCode:
          type: string
        unit:
          type: string
          enum: [HOURS, DAYS]
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        quantity:
          type: string
        status:
          type: string
          enum: [SUBMITTED, APPROVED, REJECTED, CANCELED]
        reason:
          type: string
        requestedBy:
          type: string
        decidedBy:
          type: string
