      operationId: getMyWorksheet
      summary: Read the signed-in manager's worksheet; only their direct reports' rows
      description: A row whose worker no longer reports to the caller is not returned.
      x-passage-duty: MssApprove
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: The caller's direct reports' rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Json"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: HCM-CMP-NOT-FOUND or HCM-ESS-001
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: HCM-ESS-002
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/me/compensation/cycles/{id}/worksheet/submit:
    post:
      operationId: submitMyWorksheet
      summary: Submit the signed-in manager's worksheet; blocked over budget (HCM-CMP-002) or outside guideline without justification (HCM-CMP-001)
      x-passage-duty: MssApprove
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: The caller's direct reports' rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Json"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: HCM-CMP-NOT-FOUND or HCM-ESS-001
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: state conflict, or HCM-ESS-002
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: business rule violation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PositionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BenefitPlanId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnrollmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AsOf:
      name: asOf
      in: query
      required: false
      description: YYYY-MM-DD; default today (UTC).
      schema:
        type: string
        format: date
    CourseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegistrationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Stored on the created row per tenant. A replay with the same body
        returns the stored row (201, no second event); the same key with a
        different body is 422 idempotency_key_reuse, and a concurrent request
        still holding the key is 409 idempotency_key_in_flight.
      schema:
        type: string
        maxLength: 255
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: nextCursor from the previous page.
      schema:
        type: string
    EntityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [REPORTED, UNDER_REVIEW, CLOSED]
    Year:
      name: year
      in: query
      required: true
      schema:
        type: integer
    SiteId:
      name: siteId
      in: query
      schema:
        type: string
        format: uuid
    DueBy:
      name: dueBy
      in: query
      schema:
        type: string
        format: date
    TemplateKind:
      name: kind
      in: query
      schema:
        type: string
        enum: [ONBOARDING, OFFBOARDING, TRANSFER]
    OwnerWorkerId:
      name: ownerWorkerId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    TaskStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [OPEN, DONE, SKIPPED]
    ResultsBy:
      name: by
      in: query
      schema:
        type: string
        enum: [department]
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: Request failed validation (COM-0001); errors names each field
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Json:
      type: object
      additionalProperties: true
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: https://passage.dev/problems/HCM-POS-001
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        serviceCode:
          type: string
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
    CreateWorkerRequest:
      type: object
      additionalProperties: false
      required: [personnelNumber, workerType, partyPersonId, legalName, nationalId]
      properties:
        personnelNumber:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{0,19}$"
        workerType:
          type: string
          enum: [EMPLOYEE, CONTRACTOR]
        partyPersonId:
          type: string
          format: uuid
        legalName:
          type: string
          maxLength: 200
        preferredName:
          type: string
        userId:
          type: string
          format: uuid
        nationalId:
          type: string
          maxLength: 32
          description: Sealed with AES-256-GCM; never returned unmasked except through the audited reveal.
        bankAccount:
          type: string
          maxLength: 34
    Worker:
      type: object
      required: [id, personnelNumber, workerType, partyPersonId, legalName, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        personnelNumber:
          type: string
        workerType:
          type: string
          enum: [EMPLOYEE, CONTRACTOR]
        partyPersonId:
          type: string
          format: uuid
        legalName:
          type: string
        preferredName:
          type: string
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MyProfile:
      allOf:
        - $ref: "#/components/schemas/WorkerDetail"
        - type: object
          required: [asOf]
          properties:
            asOf:
              $ref: "#/components/schemas/AsOfView"
    TeamWorker:
      type: object
      description: A direct report as a manager sees them; userId and partyPersonId are not exposed.
      required: [id, personnelNumber, workerType, legalName, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        personnelNumber:
          type: string
        workerType:
          type: string
          enum: [EMPLOYEE, CONTRACTOR]
        legalName:
          type: string
        preferredName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TeamWorkerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamWorker"
        nextCursor:
          type: string
    TeamMember:
      allOf:
        - $ref: "#/components/schemas/TeamWorker"
        - type: object
          required: [asOf]
          properties:
            asOf:
              $ref: "#/components/schemas/AsOfView"
    WorkerDetail:
      allOf:
        - $ref: "#/components/schemas/Worker"
        - type: object
          required: [pii]
          properties:
            pii:
              $ref: "#/components/schemas/PIIView"
    PIIView:
      type: object
      required: [nationalId, masked]
      properties:
        nationalId:
          type: string
          description: "Masked as ***-**-#### unless revealed."
        bankAccount:
          type: string
          description: "Masked as ****#### unless revealed."
        masked:
          type: boolean
    WorkerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Worker"
        nextCursor:
          type: string
    EmploymentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Employment"
    PositionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        nextCursor:
          type: string
    PositionDetail:
      allOf:
        - $ref: "#/components/schemas/Position"
        - type: object
          required: [assignments]
          properties:
            assignments:
              type: array
              items:
                $ref: "#/components/schemas/PositionAssignment"
    CreateEmploymentRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, employmentType, hireDate]
      properties:
        legalEntityId:
          type: string
          format: uuid
        employmentType:
          type: string
          enum: [FULL_TIME, PART_TIME, TEMP, CONTRACTOR]
        assignmentKind:
          type: string
          enum: [PRIMARY, CONCURRENT, GLOBAL_HOST]
          default: PRIMARY
        homeLegalEntityId:
          type: string
          format: uuid
          description: Required for GLOBAL_HOST and must differ from legalEntityId.
        plannedEndDate:
          type: string
          format: date
          description: Required for GLOBAL_HOST; not before hireDate.
        hireDate:
          type: string
          format: date
        terminationDate:
          type: string
          format: date
          description: Last day employed (inclusive); must not be before hireDate (HCM-EMP-002). validTo is the next day.
    Employment:
      type: object
      required: [id, workerId, legalEntityId, employmentType, assignmentKind, hireDate, validFrom, status]
      properties:
        id:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        legalEntityId:
          type: string
          format: uuid
        employmentType:
          type: string
        assignmentKind:
          type: string
          enum: [PRIMARY, CONCURRENT, GLOBAL_HOST]
        homeLegalEntityId:
          type: string
          format: uuid
        plannedEndDate:
          type: string
          format: date
        hireDate:
          type: string
          format: date
        terminationDate:
          type: string
          format: date
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
          description: Exclusive end of the range [validFrom, validTo).
        status:
          type: string
          enum: [PENDING, ACTIVE, TERMINATED]
          description: Derived from the range as-of the read (the as-of date, or now for lists). ON_LEAVE arrives with personnel actions.
    CreatePositionRequest:
      type: object
      additionalProperties: false
      required: [positionNumber, jobCode, departmentId, legalEntityId, validFrom]
      properties:
        positionNumber:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{0,19}$"
        jobCode:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9_-]{0,19}$"
        departmentId:
          type: string
          format: uuid
        legalEntityId:
          type: string
          format: uuid
        fte:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
          default: "1.00"
          description: Decimal string from 0.05 to 2.00 (never a float); 1.00 when omitted.
        allowOverfill:
          type: boolean
          default: false
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        reportsToPositionId:
          type: string
          format: uuid
          description: Must exist on validFrom (HCM-POS-PARENT-INVALID).
    Position:
      type: object
      required: [id, positionNumber, jobCode, departmentId, legalEntityId, fte, allowOverfill, validFrom]
      properties:
        id:
          type: string
          format: uuid
        positionNumber:
          type: string
        jobCode:
          type: string
        departmentId:
          type: string
          format: uuid
        legalEntityId:
          type: string
          format: uuid
        fte:
          type: string
        allowOverfill:
          type: boolean
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        reportsToPositionId:
          type: string
          format: uuid
    CreateAssignmentRequest:
      type: object
      additionalProperties: false
      required: [workerId, employmentId, fteShare, validFrom]
      properties:
        workerId:
          type: string
          format: uuid
        employmentId:
          type: string
          format: uuid
        fteShare:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        isPrimary:
          type: boolean
          default: false
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
    PositionAssignment:
      type: object
      required: [id, positionId, workerId, employmentId, fteShare, isPrimary, validFrom]
      properties:
        id:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        employmentId:
          type: string
          format: uuid
        fteShare:
          type: string
        isPrimary:
          type: boolean
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
    AsOfView:
      type: object
      required: [workerId, date, employments]
      properties:
        workerId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        employments:
          type: array
          items:
            $ref: "#/components/schemas/Employment"
        positionId:
          type: [string, "null"]
        positionNumber:
          type: [string, "null"]
        fteShare:
          type: [string, "null"]
        managerWorkerId:
          type: [string, "null"]
          description: Incumbent of the reports-to position as-of the date, walking up at most the configured depth; null when vacant (BR-42.1).
    CreateAbsencePlanRequest:
      type: object
      additionalProperties: false
      required: [code, unit, accrualRate, maxBalance]
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,19}$"
          description: Stored upper-case; unique per tenant.
        unit:
          type: string
          enum: [HOURS, DAYS]
        accrualFrequency:
          type: string
          enum: [MONTHLY, BIWEEKLY, ANNUAL, PER_HOUR_WORKED]
          default: MONTHLY
          description: PER_HOUR_WORKED plans can be defined but not accrued until wave-25 time registrations exist.
        accrualRate:
          type: string
          description: Decimal string, never a float; at most 4 places, below 10000.
        accrualDay:
          type: string
          enum: [LAST_DAY, FIRST_DAY, PAYDATE]
          default: LAST_DAY
        proration:
          type: string
          enum: [DAYS_IN_PERIOD, NONE]
          default: DAYS_IN_PERIOD
        maxBalance:
          type: string
          description: Decimal string; accrual above it is discarded (BR-42.3).
        carryOverMax:
          type: string
          default: "0"
        carryOverExpiryMonths:
          type: integer
          minimum: 0
          maximum: 36
          default: 3
          description: 0 keeps carry-over for the whole plan year.
        planYearStart:
          type: string
          pattern: "^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
          default: "01-01"
          description: MM-DD of a day every year has (02-29 is refused).
        negativeBalanceAllowed:
          type: boolean
          default: false
          description: Allows the balance down to -(accrualRate x 2) (BR-42.4).
        minServiceDays:
          type: integer
          minimum: 0
          maximum: 3650
          default: 0
    AbsencePlan:
      type: object
      required: [id, code, unit, accrualFrequency, accrualRate, accrualDay, proration, maxBalance, carryOverMax, carryOverExpiryMonths, planYearStart, negativeBalanceAllowed, minServiceDays, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        unit:
          type: string
          enum: [HOURS, DAYS]
        accrualFrequency:
          type: string
          enum: [MONTHLY, BIWEEKLY, ANNUAL, PER_HOUR_WORKED]
        accrualRate:
          type: string
        accrualDay:
          type: string
          enum: [LAST_DAY, FIRST_DAY, PAYDATE]
        proration:
          type: string
          enum: [DAYS_IN_PERIOD, NONE]
        maxBalance:
          type: string
        carryOverMax:
          type: string
        carryOverExpiryMonths:
          type: integer
        planYearStart:
          type: string
        negativeBalanceAllowed:
          type: boolean
        minServiceDays:
          type: integer
        createdAt:
          type: string
          format: date-time
    AbsencePlanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AbsencePlan"
        nextCursor:
          type: string
    AbsencePlanDetail:
      allOf:
        - $ref: "#/components/schemas/AbsencePlan"
        - type: object
          required: [periods, closes]
          properties:
            periods:
              type: array
              description: The latest 24 accrual periods, newest first.
              items:
                type: object
                required: [periodStart, periodEnd, workers, accrued, discarded]
                properties:
                  periodStart:
                    type: string
                    format: date
                  periodEnd:
                    type: string
                    format: date
                  workers:
                    type: integer
                  accrued:
                    type: string
                  discarded:
                    type: string
            closes:
              type: array
              description: The latest 24 year ends and carry-over expiries, newest first.
              items:
                type: object
                required: [planYearStart, kind, workers, carried, expired]
                properties:
                  planYearStart:
                    type: string
                    format: date
                  kind:
                    type: string
                    enum: [YEAR_END, CARRY_EXPIRY]
                  workers:
                    type: integer
                  carried:
                    type: string
                  expired:
                    type: string
    AccrualRequest:
      type: object
      additionalProperties: false
      required: [planId, periodStart, periodEnd]
      properties:
        planId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
          description: First day of the period, inclusive.
        periodEnd:
          type: string
          format: date
          description: Last day of the period, inclusive.
    AccrualRun:
      type: object
      required: [planId, periodStart, periodEnd, planYearStart, credited, alreadyAccrued, accrued, discarded, replayed]
      properties:
        planId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        planYearStart:
          type: string
          format: date
          description: The plan year the accrual was booked to.
        credited:
          type: integer
          description: Workers this call accrued.
        alreadyAccrued:
          type: integer
          description: Workers an earlier call for the same period had accrued.
        accrued:
          type: string
          description: Total kept by this call.
        discarded:
          type: string
          description: Total discarded at maxBalance by this call (BR-42.3).
        replayed:
          type: boolean
    PlanYearRequest:
      type: object
      additionalProperties: false
      required: [planYearStart]
      properties:
        planYearStart:
          type: string
          format: date
          description: First day of the plan year to close or expire.
    CloseRun:
      type: object
      required: [planId, planYearStart, kind, workers, alreadyClosed, carried, expired]
      properties:
        planId:
          type: string
          format: uuid
        planYearStart:
          type: string
          format: date
        kind:
          type: string
          enum: [YEAR_END, CARRY_EXPIRY]
        workers:
          type: integer
        alreadyClosed:
          type: integer
        carried:
          type: string
        expired:
          type: string
    CreateAbsenceRequest:
      type: object
      additionalProperties: false
      required: [workerId, planId, from, to, quantity]
      properties:
        workerId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Last day, inclusive; at most 366 days after from.
        quantity:
          type: string
          description: Positive decimal with at most 2 places, in the plan's unit.
        reason:
          type: string
          maxLength: 500
    AbsenceRequest:
      type: object
      required: [id, workerId, personnelNumber, workerName, planId, planCode, unit, from, to, quantity, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        personnelNumber:
          type: string
        workerName:
          type: string
          description: Preferred name, else legal name.
        planId:
          type: string
          format: uuid
        planCode:
          type: string
        unit:
          type: string
          enum: [HOURS, DAYS]
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        quantity:
          type: string
        status:
          type: string
          enum: [SUBMITTED, APPROVED, REJECTED, CANCELED]
        reason:
          type: string
        requestedBy:
          type: string
        decidedBy:
          type: string
          description: The approver, or the user who cancelled.
        decidedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    AbsenceRequestResult:
      allOf:
        - $ref: "#/components/schemas/AbsenceRequest"
        - type: object
          required: [warnings]
          properties:
            warnings:
              type: array
              description: Non-blocking warnings such as HCM-ABS-003.
              items:
                type: object
                required: [code, detail]
                properties:
                  code:
                    type: string
                  detail:
                    type: string
    AbsenceRequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AbsenceRequest"
        nextCursor:
          type: string
    AbsenceDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
    AbsenceBalances:
      type: object
      required: [workerId, asOf, balances]
      properties:
        workerId:
          type: string
          format: uuid
        asOf:
          type: string
          format: date
        balances:
          type: array
          items:
            type: object
            required: [planId, planCode, unit, planYearStart, carryOver, current, total]
            properties:
              planId:
                type: string
                format: uuid
              planCode:
                type: string
              unit:
                type: string
                enum: [HOURS, DAYS]
              planYearStart:
                type: string
                format: date
              carryOver:
                $ref: "#/components/schemas/BucketBalance"
              current:
                $ref: "#/components/schemas/BucketBalance"
              total:
                type: string
                description: Both buckets' balances together.
    BucketBalance:
      type: object
