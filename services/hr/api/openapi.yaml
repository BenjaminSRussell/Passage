            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/courses/sessions/{id}/registrations:
    get:
      operationId: listCourseRegistrations
      summary: The attendance list, in registration order (at most 500)
      x-passage-duty: HcmLearningAdmin
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Registrations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseRegistrationList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: HCM-CRS-SESSION-NOT-FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: registerForCourseSession
      summary: Register a worker, self or by a manager (BR-42.9)
      description: |
        One registration per worker and session: a worker already registered
        gets it back with 200. A course without manager approval takes a seat
        now (CONFIRMED, else WAITLISTED, else HCM-CRS-001); with approval it
        waits as REQUESTED with the HCM-CRS-002 warning. An employee with only
        EssLearning registers only themselves (HCM-CRS-NOT-OWN). Registration
        closes when the session ends.
      x-passage-duty: EssLearning
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterForCourseRequest"
      responses:
        "201":
          description: Registration placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseRegistrationResult"
        "200":
          description: The worker's existing registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseRegistrationResult"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          description: HCM-CRS-NOT-OWN
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: HCM-CRS-SESSION-NOT-FOUND or HCM-WRK-NOT-FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: HCM-CRS-STATE (the session has ended)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: HCM-CRS-001 (the session and its waitlist are full)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/courses/sessions/{id}/complete:
    post:
      operationId: completeCourseSession
      summary: Record attendance and results; a PASS writes skills and the certificate (FR-42.14, BR-42.9)
      description: |
        From the session start. Every line names a registered worker. A
        CONFIRMED registration takes ATTENDED (optionally PASS or FAIL with a
        score) or NO_SHOW; an ATTENDED one without a result may get its result
        later. The same outcome again changes nothing, so a retry is safe
        without an Idempotency-Key. A PASS raises each skill outcome to
        max(existing, course rating), issues the course certificate from the
        session end date for the course's validity months, and publishes
        course.completed in the same transaction. All lines apply or none.
      x-passage-duty: HcmLearningAdmin
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteCourseSessionRequest"
      responses:
        "200":
          description: Each line's registration and how many lines changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseCompletion"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: HCM-CRS-SESSION-NOT-FOUND or HCM-CRS-REG-NOT-FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: HCM-CRS-STATE (not started, not confirmed, or a different outcome already recorded)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/courses/registrations/{id}/approve:
    post:
      operationId: approveCourseRegistration
      summary: Approve a REQUESTED registration; it takes a seat or a waitlist place
      description: |
        A manager with only MssApprove approves registrations of their direct
        reports; any other registration answers the same 404 as one that does
        not exist. A caller who also holds HcmLearningAdmin approves tenant-wide.
        HCM-ESS-001 (404) when no worker is linked to the caller's sign-in,
        HCM-ESS-002 (409) when more than one is.
      x-passage-duty: MssApprove
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "200":
          description: Approved registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseRegistration"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          description: HCM-CRS-SELF-APPROVAL
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: HCM-CRS-REG-NOT-FOUND (also a registration outside the caller's team) or HCM-ESS-001
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: HCM-CRS-STATE (not awaiting approval) or HCM-ESS-002
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: HCM-CRS-001 (full)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/hr/courses/registrations/{id}/cancel:
    post:
      operationId: cancelCourseRegistration
      summary: Cancel or decline a registration; a freed seat goes to the oldest waitlisted
      description: |
        Canceling again returns the registration unchanged. A registration
        with a recorded outcome cannot be canceled. An employee with only
        EssLearning cancels only their own (HCM-CRS-NOT-OWN).
      x-passage-duty: EssLearning
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "200":
          description: Canceled registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseRegistration"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          description: HCM-CRS-NOT-OWN
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: HCM-CRS-REG-NOT-FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: HCM-CRS-STATE (outcome recorded)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
