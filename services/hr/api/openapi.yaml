        eligibilityRule:
          type: string
        enrollmentStart:
          type: string
          format: date
        enrollmentEnd:
          type: string
          format: date
        waitingDays:
          type: integer
        preTax:
          type: boolean
        payrollDeductionCode:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/BenefitOption"
        createdAt:
          type: string
          format: date-time
    BenefitPlanList:
      type: object
