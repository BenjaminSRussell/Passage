      required: [code, kind, name, tasks]
      properties:
        code: {type: string}
        kind: {type: string, enum: [ONBOARDING, OFFBOARDING, TRANSFER]}
        name: {type: string}
        tasks:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [code, title, ownerRole, dueOffsetDays]
            properties:
              code: {type: string, description: RETURN_LOANED_ITEMS is reserved}
              title: {type: string}
              ownerRole: {type: string, enum: [MANAGER, WORKER, HR_PARTNER, IT]}
              dueOffsetDays: {type: integer, minimum: -365, maximum: 365}
              instructions: {type: string}
              evidenceRequired: {type: boolean}
    ChecklistTemplate:
      type: object
      required: [id, code, kind, name, tasks]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        kind: {type: string}
        name: {type: string}
        tasks: {type: array, items: {type: object}}
    ChecklistTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistTemplate"
    StartChecklistRequest:
      type: object
      required: [templateId, effectiveDate]
      properties:
        templateId: {type: string, format: uuid}
        effectiveDate: {type: string, format: date}
        legalEntityId: {type: string, format: uuid, description: Required when the worker is employed in several legal entities on effectiveDate}
    WorkerTask:
      type: object
      required: [id, checklistId, workerId, taskCode, title, ownerRole, dueOn, status]
      properties:
        id: {type: string, format: uuid}
        checklistId: {type: string, format: uuid}
        workerId: {type: string, format: uuid}
        taskCode: {type: string}
        title: {type: string}
        ownerRole: {type: string}
        ownerWorkerId: {type: string, format: uuid, description: The MANAGER as-of the effective date (BR-42.1) or the worker; absent for HR_PARTNER and IT}
        dueOn: {type: string, format: date}
        evidenceRequired: {type: boolean}
        status: {type: string, enum: [OPEN, DONE, SKIPPED]}
        evidenceRef: {type: string}
    FinishTaskRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [DONE, SKIPPED]}
        evidenceRef: {type: string, maxLength: 500}
    WorkerTaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkerTask"
    Checklist:
      type: object
      required: [id, workerId, templateId, kind, effectiveDate, status, tasks]
      properties:
        id: {type: string, format: uuid}
        workerId: {type: string, format: uuid}
        templateId: {type: string, format: uuid}
        kind: {type: string}
        effectiveDate: {type: string, format: date}
        status: {type: string, enum: [OPEN, COMPLETED]}
        tasks: {type: array, items: {$ref: "#/components/schemas/WorkerTask"}}
    ChecklistList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Checklist"
    QuestionnaireRequest:
      type: object
      required: [code, name, questions]
      properties:
        code: {type: string}
        name: {type: string}
        anonymous: {type: boolean}
        questions:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [code, text, type]
            properties:
              code: {type: string}
              text: {type: string, maxLength: 500}
              type: {type: string, enum: [SINGLE, MULTI, SCALE, NUMERIC, TEXT, DATE]}
              options: {type: array, items: {type: object, required: [value, label], properties: {value: {type: string}, label: {type: string}, score: {type: string}}}}
              scaleMax: {type: integer, minimum: 2, maximum: 10}
              weight: {type: string, description: Decimal above 0, at most 100; default 1}
              mandatory: {type: boolean}
              resultGroup: {type: string}
    Questionnaire:
      type: object
      required: [id, code, name, anonymous, questions]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        anonymous: {type: boolean}
        questions: {type: array, items: {type: object}}
    QuestionnaireList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Questionnaire"
    ScheduleRequest:
      type: object
      required: [questionnaireId, opensAt, closesAt]
      properties:
        questionnaireId: {type: string, format: uuid}
        population: {type: string, description: "CEL over employment_type, fte, service_days, legal_entity; empty means every worker with a PRIMARY employment"}
        opensAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time}
    QuestionnaireSchedule:
      type: object
      required: [id, questionnaireId, population, opensAt, closesAt, invitedCount, status]
      properties:
        id: {type: string, format: uuid}
        questionnaireId: {type: string, format: uuid}
        population: {type: string}
        opensAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time}
        invitedCount: {type: integer}
        status: {type: string, enum: [PLANNED, OPEN, CLOSED]}
    ScheduleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuestionnaireSchedule"
    ScheduleView:
      allOf:
        - $ref: "#/components/schemas/QuestionnaireSchedule"
        - type: object
          properties:
            questionnaire: {$ref: "#/components/schemas/Questionnaire"}
    AnswerRequest:
      type: object
      required: [workerId, answers]
      properties:
        workerId: {type: string, format: uuid}
        answers: {type: object, description: "Question code to value: SINGLE a string, MULTI a list, SCALE a whole number, NUMERIC a JSON number, TEXT a string, DATE YYYY-MM-DD"}
    QuestionnaireResults:
      type: object
      required: [scheduleId, anonymous, invited, responded, responseRate, overall]
      properties:
        scheduleId: {type: string, format: uuid}
        anonymous: {type: boolean}
        invited: {type: integer}
        responded: {type: integer}
        responseRate: {type: string}
        overall: {type: object}
        groups: {type: array, items: {type: object}, description: Per department; present with by=department}
