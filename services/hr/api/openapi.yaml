        employeeRate:
          type: string
        employerRate:
          type: string
        rateBasis:
          type: string
          enum: [PER_PAY_PERIOD, MONTHLY]
    CreateBenefitPlanRequest:
      type: object
      additionalProperties: false
      required: [code, planType, currency, eligibilityRule, enrollmentStart, enrollmentEnd, options]
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,19}$"
          description: Stored upper-case; unique per tenant.
        planType:
          type: string
          enum: [MEDICAL, DENTAL, VISION, LIFE, RETIREMENT_401K, HSA, FSA, OTHER]
        providerPartyId:
          type: [string, "null"]
          format: uuid
          description: The provider's wave-7 party; not checked against the party service yet.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        eligibilityRule:
          type: string
          maxLength: 2000
          description: |
            CEL subset (BR-42.6) over employment_type, fte, service_days and
            legal_entity (age and job.type are not available yet): && || !
            == != < <= > >= in, list literals, numbers, quoted strings,
            true and false. Example: employment_type in ['FULL_TIME'] && service_days >= 30.
        enrollmentStart:
          type: string
          format: date
        enrollmentEnd:
          type: string
          format: date
          description: Inclusive; on or after enrollmentStart and within 366 days of it.
        waitingDays:
          type: integer
          minimum: 0
          maximum: 365
          default: 0
          description: Days from the hire date before the worker is eligible.
        preTax:
          type: boolean
          default: false
        payrollDeductionCode:
          type: [string, "null"]
          maxLength: 20
        options:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/BenefitOptionInput"
    BenefitPlan:
      type: object
      required: [id, code, planType, currency, eligibilityRule, enrollmentStart, enrollmentEnd, waitingDays, preTax, options, createdAt]
      properties:
