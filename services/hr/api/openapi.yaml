        id: {type: string, format: uuid}
        workerId: {type: string, format: uuid}
        loanType: {type: string}
        itemDescription: {type: string}
        assetId: {type: string, format: uuid}
        serial: {type: string}
        issuedOn: {type: string, format: date}
        dueOn: {type: string, format: date}
        closedOn: {type: string, format: date}
        status: {type: string, enum: [OUT, RETURNED, LOST]}
    LoanedItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LoanedItem"
    ChecklistTemplateRequest:
