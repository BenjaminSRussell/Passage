        certificate that never expires. Validity is [issuedOn, expiresOn).
        Publishes certification.issued.
      x-passage-duty: HcmWorkerMaintain
      parameters:
        - $ref: "#/components/parameters/WorkerId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCertificationRequest"
      responses:
        "201":
          description: Certificate recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"
        "200":
          description: The stored certificate on an idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: HCM-CERT-DUPLICATE (same code and issue date for the worker) or idempotency_key_in_flight
