          type: string
          format: uuid
        code:
          type: string
        planType:
          type: string
          enum: [MEDICAL, DENTAL, VISION, LIFE, RETIREMENT_401K, HSA, FSA, OTHER]
        providerPartyId:
          type: string
          format: uuid
        currency:
          type: string
        eligibilityRule:
          type: string
        enrollmentStart:
          type: string
          format: date
        enrollmentEnd:
          type: string
          format: date
        waitingDays:
          type: integer
        preTax:
          type: boolean
        payrollDeductionCode:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/BenefitOption"
        createdAt:
          type: string
          format: date-time
    BenefitPlanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BenefitPlan"
        nextCursor:
          type: string
    BenefitSimulation:
