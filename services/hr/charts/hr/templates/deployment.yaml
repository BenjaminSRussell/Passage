apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-passage-hr
  labels:
    app.kubernetes.io/name: passage-hr
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: passage-hr
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: passage-hr
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: hr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
          env:
            - name: SERVICE_NAME
              value: passage-hr
            - name: HTTP_ADDR
              value: ":{{ .Values.service.httpPort }}"
            - name: ADMIN_ADDR
              value: ":{{ .Values.service.adminPort }}"
            - name: HR_MANAGER_MAX_DEPTH
              value: {{ .Values.config.managerMaxDepth | quote }}
            - name: MIGRATE_ON_START
              value: {{ .Values.config.migrateOnStart | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.databaseUrlKey }}
            - name: HR_PII_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.piiKeyKey }}
                  optional: true
            - name: FIELDCRYPT_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.fieldcryptKeysKey }}
            - name: FIELDCRYPT_CURRENT_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.fieldcryptCurrentKeyIdKey }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
