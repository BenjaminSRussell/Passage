apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-passage-hr
  labels:
    app.kubernetes.io/name: passage-hr
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: passage-hr
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
