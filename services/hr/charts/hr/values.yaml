image:
  repository: ghcr.io/benjaminsrussell/passage-hr
  # Digest-pin in deploy/ (Argo CD sync); the tag is for local k3d use only.
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  httpPort: 8080
  adminPort: 9090

# DATABASE_URL, FIELDCRYPT_KEYS, FIELDCRYPT_CURRENT_KEY_ID and the legacy HR_PII_KEY (opens values
# written before fieldcrypt; optional) are read from this secret (Vault via External Secrets).
secret:
  name: passage-hr-secrets
  databaseUrlKey: DATABASE_URL
  piiKeyKey: HR_PII_KEY
  fieldcryptKeysKey: FIELDCRYPT_KEYS
  fieldcryptCurrentKeyIdKey: FIELDCRYPT_CURRENT_KEY_ID

config:
  managerMaxDepth: "10"
  migrateOnStart: "false"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceMonitor:
  enabled: false
  interval: 30s

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
