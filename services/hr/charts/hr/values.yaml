image:
  repository: ghcr.io/benjaminsrussell/passage-hr
  # Digest-pin in deploy/ (Argo CD sync); the tag is for local k3d use only.
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  httpPort: 8080
  adminPort: 9090

# DATABASE_URL, FIELDCRYPT_CURRENT_KEY_ID and the legacy HR_PII_KEY (opens values written before
# fieldcrypt; optional, remove it once `hr reseal-pii` reports rewritten=0 for every tenant) are read
# from this secret (Vault via External Secrets). Its FIELDCRYPT_KEYS entry is mounted as the file
# /var/run/passage/field-crypt/keys (FIELDCRYPT_KEYS_FILE), not passed in the environment.
secret:
  name: passage-hr-secrets
  databaseUrlKey: DATABASE_URL
  piiKeyKey: HR_PII_KEY
  fieldcryptKeysKey: FIELDCRYPT_KEYS
  fieldcryptCurrentKeyIdKey: FIELDCRYPT_CURRENT_KEY_ID

config:
  managerMaxDepth: "10"
  migrateOnStart: "false"
  # Comma-separated tenant UUIDs the in-process due personnel-action sweep (#263) runs for; empty disables it.
  actionSweepTenantIds: ""
  actionSweepInterval: "15m"

# CronJob running `hr reseal-pii <tenant-id>...` (#335). Idempotent: a tenant with nothing legacy logs rewritten=0.
# Tenants are listed because the app role cannot enumerate them. Off by default.
reseal:
  enabled: false
  schedule: "17 3 * * *"
  tenantIds: []

# Requisitions without a requisitionNumber take the next number of the REQ sequence from numbering (#266).
numberingUrl: ""
serviceIdentity:
  signingKeySecret: ""
  keyId: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceMonitor:
  enabled: false
  interval: 30s

podSecurityContext:
  runAsNonRoot: true
  # Lets the non-root user read the 0440 field-crypt key file.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
