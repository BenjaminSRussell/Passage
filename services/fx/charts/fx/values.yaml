image:
  repository: ghcr.io/benjaminsrussell/fx
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: fx-db
migrateOnStart: false
# Public keys of the services that call fx with a signed service token
# (caller[:kid]=base64 Ed25519 public key, comma separated; not secret). payables
# reads rates this way (#305).
serviceIdentity:
  publicKeys: ""
replicaCount: 1
import:
  tenantId: ""
  provider: ecb
  rateType: ""
  interval: 1h
  providerTimeoutSeconds: 10
  oxrSecret: ""
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
networkPolicy:
  enabled: true
  ingressFrom: []
  ingressNamespaces: []
  metricsFrom: [observability]
serviceMonitor:
  enabled: true
  interval: 30s
alerts:
  enabled: true
  labels: {}
  severity: page
  ecbStaleDays: 4
  oxrStaleDays: 2
