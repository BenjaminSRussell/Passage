apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: passage-fx
  labels:
    app.kubernetes.io/name: fx
spec:
  groups:
    - name: fx.providers
      rules:
        - alert: FxRateProviderDegraded
          expr: max by (provider, rate_type) (fx_provider_degraded) == 1
          for: 1m
          labels:
            severity: page
            service: fx
          annotations:
            summary: FX rate import from {{ $labels.provider }} failed for {{ $labels.rate_type }}
            description: The latest import ended in an outage after retries. The dev.passage.fx.provider.degraded.v1 event carries fallback=last_known when earlier rates keep being served, or fallback=none when no earlier import ever succeeded.
        - alert: FxRateImportStale
          expr: time() - min by (provider, rate_type) (fx_provider_last_success_timestamp_seconds) > 2 * 86400
          for: 1m
          labels:
            severity: page
            service: fx
          annotations:
            summary: No successful FX import from {{ $labels.provider }} for {{ $labels.rate_type }} in over 2 days
            description: The oldest last successful import is more than two days old, so served rates are stale.
