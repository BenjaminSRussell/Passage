{{- if .Values.glReconcile.enabled }}
{{- if not .Values.glReconcile.tenantIds }}
{{- fail "glReconcile.tenantIds must list at least one tenant UUID when glReconcile.enabled is true" }}
{{- end }}
{{- if not .Values.ledgerUrl }}
{{- fail "ledgerUrl is required when glReconcile.enabled is true" }}
{{- end }}
{{- if not .Values.serviceIdentity.signingKeySecret }}
{{- fail "serviceIdentity.signingKeySecret is required when glReconcile.enabled is true" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-cost-gl-reconcile
  labels:
    app.kubernetes.io/name: costacct-cost-gl-reconcile
spec:
  schedule: {{ .Values.glReconcile.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: costacct-cost-gl-reconcile
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          {{- include "costacct.identityVolume" . | nindent 10 }}
          containers:
            - name: cost-gl-reconcile
              image: {{ include "costacct.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - cost-gl-reconcile
                {{- range .Values.glReconcile.tenantIds }}
                - {{ . | quote }}
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.databaseSecret }}
                      key: DATABASE_URL
                {{- include "costacct.ledgerEnv" . | nindent 16 }}
              {{- include "costacct.identityMount" . | nindent 14 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
{{- end }}
