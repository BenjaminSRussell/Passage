openapi: 3.1.0
info:
  title: costacct
  version: 0.1.0
  description: >-
    Cost accounting (wave 38, slices 1 to 5). Cost objects and cost elements, mirroring of journal lines into primary
    cost entries, reciprocal allocation runs that solve and conserve cost (FR-38.7), cost object line items,
    top-down distribution (FR-38.19), internal order settlement (FR-38.9), statistical measures and template
    (driver-formula) allocation (FR-38.17), cost behavior rules (FR-38.16), the cost ledger reconciliation (FR-38.11)
    and cost object hierarchies with collection and distribution at a node (FR-38.18). Template formulas use a restricted grammar: numbers, + - * / (× ÷ − too),
    min(a, b), max(a, b), if(cond, a, b) with < <= > >= = !=, m.<measure code> (the receiver's measure value in the
    period) and b.<cost element code> (the receiver's Journal and Manual cost on that element in the period and the
    template currency).
    Every command requires Idempotency-Key; a replay returns the stored response, a reused key with a different body is 422.
    Error codes: CST-0001 (cost object not found), CST-0002 (period already allocated), CST-0003 (duplicate code),
    CST-0004 (no primary element for a main account), CST-0005 (allocation did not converge, CO-0611),
    CST-0006 (allocation totals differ, CO-0612), CST-0007 (secondary element not found), CST-0008 (invalid allocation input),
    CST-0009 (primary account range overlaps), CST-0010 (allocation run not found), CST-0011 (top-down run not found),
    CST-0012 (top-down amount exceeds what is booked on the source), CST-0013 (settled object is not an internal order),
    CO-0618 (settlement exceeds collected cost, BR-38.9), CO-0621 (formula error in a template line),
    CST-0015 (a template line is negative and the template does not allow it, BR-38.12), CST-0016 (statistical measure
    not found), CST-0017 (allocation template not found), CST-0018 (template version conflict), CST-0019 (template run
    not found), CST-0020 (behavior rule exists), CST-0021 (hierarchy not found), CST-0022 (hierarchy node not found),
    CST-0023 (node does not collect, or a collecting node in a Reporting hierarchy), CST-0024 (nothing to distribute),
    CST-0025 (cost object already in the hierarchy), CST-0026 (invalid distribution), CST-0027 (distribution run not
    found), CST-0028 (a correction would take the node below zero), COM-0001 (validation, 400),
    idempotency_key_reuse, idempotency_in_progress, AUTH-0001, AUTH-0003.
    Reads need controlling.view and return {"items": [...]} for lists (at most 500 rows).
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/controlling/cost-objects:
    get:
      operationId: listCostObjects
      x-passage-duty: controlling.view
      parameters:
        - { $ref: '#/components/parameters/LegalEntity' }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [CostCenter, InternalOrder, Product, Project] } }
      responses:
        '200':
          description: Cost objects by code.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/CostObject' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createCostObject
      x-passage-duty: controlling.maintain
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CostObject' } } }
      responses:
        '201':
          description: The stored cost object.
          content: { application/json: { schema: { $ref: '#/components/schemas/CostObject' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/cost-objects/{id}:
    get:
      operationId: getCostObject
      x-passage-duty: controlling.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One cost object.
          content: { application/json: { schema: { $ref: '#/components/schemas/CostObject' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/cost-elements:
    get:
      operationId: listCostElements
      x-passage-duty: controlling.view
      parameters:
        - { $ref: '#/components/parameters/LegalEntity' }
      responses:
        '200':
          description: Cost elements by code.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/CostElement' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createCostElement
      x-passage-duty: controlling.maintain
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CostElement' } } }
      responses:
        '201':
          description: The stored element. Primary elements carry a main account range that may not overlap another primary element.
          content: { application/json: { schema: { $ref: '#/components/schemas/CostElement' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/cost-behavior-rules:
    get:
      operationId: listCostBehaviorRules
      x-passage-duty: controlling.view
      parameters:
        - { $ref: '#/components/parameters/LegalEntity' }
        - { name: costElementId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Behavior rules by element, latest effective date first.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BehaviorRule' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createCostBehaviorRule
      x-passage-duty: controlling.maintain
      description: >-
        Classifies journal cost on one cost element as Fixed or Variable from a date (FR-38.16), for every cost object
        kind or one kind. Journal lines are classified when they are mirrored: a rule for the object's kind beats a rule
        for any kind, the latest effective date wins within a tier, then the element default applies, else
        Unclassified. Entries already in the ledger keep their class. The element must belong to the legal entity
        (CST-0007); a second rule for the same element, kind and date is CST-0020.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BehaviorRule' } } }
      responses:
        '201':
          description: The stored rule.
          content: { application/json: { schema: { $ref: '#/components/schemas/BehaviorRule' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/cost-entries:mirror:
    post:
      operationId: mirrorJournalLines
      x-passage-duty: controlling.maintain
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MirrorRequest' } } }
      responses:
        '200':
          description: >-
            Counts of mirrored and skipped lines. A journal line is mirrored at most once. Every cost object must belong
            to the legal entity (CST-0001).
          content: { application/json: { schema: { $ref: '#/components/schemas/MirrorResult' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/allocation-runs:
    get:
      operationId: listAllocationRuns
      x-passage-duty: controlling.view
      parameters:
        - { $ref: '#/components/parameters/LegalEntity' }
      responses:
        '200':
          description: Allocation runs, newest period first.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Run' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: runAllocation
      x-passage-duty: controlling.run
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RunRequest' } } }
      responses:
        '201':
          description: >-
            The completed run. The cost base of each center is its Journal-origin entries in the run currency. Every
            sender ends at exactly zero after the residual sweep, and totalIn (senders' cost) equals totalOut (cost
            taken by final receivers) to the cent. A run whose iterative solve stops at the iteration limit completes
            with converged false and the residual swept. A closed cycle is CST-0005. A sender with cost and zero basis
            keeps its cost and is reported in unallocated with a CO-0613 warning (BR-38.8). When the period already has
            a completed run, this request is a rerun (BR-38.7): in the same transaction the earlier run's Allocation
            entries are negated, it becomes Reversed and reversedRunId names it. Only one completed run exists per legal
            entity and period; a concurrent rerun that loses the race is CST-0002.
          content: { application/json: { schema: { $ref: '#/components/schemas/RunResponse' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/allocation-runs/{id}:
    get:
      operationId: getAllocationRun
      x-passage-duty: controlling.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: >-
            One stored run with its flows and postings. warnings carries CO-0613 per zero-basis sender and CO-0615 when
            journal cost for the run's objects, period and currency was mirrored after a completed run (rerun needed).
          content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/reconciliations:
    post:
      operationId: reconcileCostLedger
      x-passage-duty: controlling.view
      description: >-
        FR-38.11. Compares Σ primary (Journal-origin) cost entries per element with the general ledger's balances for the
        period, read by the service through the ledger API for the legal entity's configured ledger; the request cannot
        supply balances (an unknown field is a 400). 503 CST-0031 when no ledger is configured, 422 CST-0032 for a legal
        entity without a ledger, 502 CST-0030 when the ledger refuses or is down, 502 CST-0029 when it holds another
        currency than the one asked for. Read-only: it stores nothing, so it takes no Idempotency-Key.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReconcileRequest' } } }
      responses:
        '200':
          description: One line per primary element; reconciled is true when every difference is 0.00.
          content: { application/json: { schema: { $ref: '#/components/schemas/Reconciliation' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/cost-objects/{id}/entries:
    get:
      operationId: listCostObjectEntries
      x-passage-duty: controlling.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: Cost entries of the object for the period.
          content: { application/json: { schema: { $ref: '#/components/schemas/EntryList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/top-down-runs:
    get:
      operationId: listTopDownRuns
      x-passage-duty: controlling.view
      parameters:
        - { $ref: '#/components/parameters/LegalEntity' }
      responses:
        '200':
          description: Top-down runs, newest period first.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/TopDownRun' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: runTopDown
      x-passage-duty: controlling.run
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TopDownRequest' } } }
      responses:
        '201':
          description: >-
            The completed run. The source is credited with amount and each segment is debited its share on the same
            cost element, so the run nets to zero. Shares are proportional to basis and rounded to the currency's minor
            unit; the rounding residual goes to the largest basis (BR-38.13), so Σ shares = amount to the cent. Segments
            with a zero basis receive nothing and are listed in excluded. amount may not exceed what is booked on the
            source for the element and period (CST-0012). One completed run per source, element and period (CST-0002).
          content: { application/json: { schema: { $ref: '#/components/schemas/TopDownRun' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/top-down-runs/{id}:
    get:
      operationId: getTopDownRun
      x-passage-duty: controlling.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One top-down run with its shares.
          content: { application/json: { schema: { $ref: '#/components/schemas/TopDownRun' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/internal-orders/{id}:settle:
    post:
      operationId: settleInternalOrder
      x-passage-duty: controlling.run
      parameters:
        - { name: id, in: path, required: true, description: Internal order cost object id., schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettlementRequest' } } }
      responses:
        '201':
          description: >-
            The settlement. The order is credited and the receiver debited on the secondary element. Collected cost is
            the net of all the order's entries for the period and currency, so earlier settlements already reduce it;
            a settlement above it is CO-0618 (BR-38.9). Settlements may be partial and repeat until nothing is left.
          content: { application/json: { schema: { $ref: '#/components/schemas/Settlement' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/internal-orders/{id}/settlements:
    get:
      operationId: listSettlements
      x-passage-duty: controlling.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: query, required: false, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: Settlements of the order, newest first.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Settlement' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/statistical-measures:
    get:
      operationId: listStatisticalMeasures
      x-passage-duty: controlling.view
      parameters:
        - { $ref: '#/components/parameters/LegalEntity' }
      responses:
        '200':
          description: Measures by code.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/StatisticalMeasure' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createStatisticalMeasure
      x-passage-duty: controlling.maintain
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StatisticalMeasure' } } }
      responses:
        '201':
          description: The measure. The code is unique per legal entity (CST-0003); formulas reference it as m.<code>.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatisticalMeasure' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/statistical-measures/{id}/values:
    get:
      operationId: listStatisticalMeasureValues
      x-passage-duty: controlling.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: The measure's value per cost object in the period.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MeasureValue' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: loadStatisticalMeasureValues
      x-passage-duty: controlling.maintain
      description: Upserts one period's values per cost object (PRD 7.38.5). Every cost object must belong to the legal entity.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, period, values]
              additionalProperties: false
              properties:
                legalEntityId: { type: string, format: uuid }
                period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
                values:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [costObjectId, value]
                    additionalProperties: false
                    properties:
                      costObjectId: { type: string, format: uuid }
                      value: { type: string, description: Decimal string, zero or positive, at most 4 decimal places. }
      responses:
        '200':
          description: How many values were loaded.
          content:
            application/json:
              schema:
                type: object
                required: [measureId, period, loaded]
                properties:
                  measureId: { type: string, format: uuid }
                  period: { type: string }
                  loaded: { type: integer }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/allocation-templates:
    get:
      operationId: listAllocationTemplates
      x-passage-duty: controlling.view
      parameters:
        - { $ref: '#/components/parameters/LegalEntity' }
      responses:
        '200':
          description: Templates by code, current version.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AllocationTemplate' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: saveAllocationTemplate
      x-passage-duty: controlling.maintain
      description: >-
        Saves a template. A new code needs expectedVersion 0 and becomes version 1 (201); an existing code needs the
        version last read and becomes the next version (200), else CST-0018. Every formula is parsed and may reference
        only measures and cost elements of the legal entity (CO-0621). Line elements must be secondary (CST-0007).
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveTemplate' } } }
      responses:
        '201':
          description: Version 1 of a new template.
          content: { application/json: { schema: { $ref: '#/components/schemas/AllocationTemplate' } } }
        '200':
          description: The next version of an existing template.
          content: { application/json: { schema: { $ref: '#/components/schemas/AllocationTemplate' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/allocation-templates/{id}:
    get:
      operationId: getAllocationTemplate
      x-passage-duty: controlling.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The template at its current version.
          content: { application/json: { schema: { $ref: '#/components/schemas/AllocationTemplate' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/allocation-templates/{id}:dry-run:
    post:
      operationId: dryRunAllocationTemplate
      x-passage-duty: controlling.maintain
      description: Evaluates the template for a period and posts nothing, so it takes no Idempotency-Key (FR-38.17).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              additionalProperties: false
              properties:
                period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
      responses:
        '200':
          description: The amount per line, the total and any CO-0622 warnings.
          content: { application/json: { schema: { $ref: '#/components/schemas/DryRunResult' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/template-allocations/runs:
    get:
      operationId: listTemplateRuns
      x-passage-duty: controlling.view
      parameters:
        - { $ref: '#/components/parameters/LegalEntity' }
        - { name: templateId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Completed template runs, newest first.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/TemplateRun' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: runTemplateAllocation
      x-passage-duty: controlling.run
      description: >-
        Runs the template's current version for a period. Each line debits its receiver and credits the sender with the
        line amount on the line's secondary element (origin Allocation), so the run nets to zero. A negative line fails
        the run unless the template allows it (CST-0015, BR-38.12); a zero divisor gives 0 and a CO-0622 warning. One
        completed run per template and period (CST-0002). Emits allocation.completed with method Template and one
        costentry.created per entry.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId, period]
              additionalProperties: false
              properties:
                templateId: { type: string, format: uuid }
                period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
      responses:
        '201':
          description: The completed run.
          content: { application/json: { schema: { $ref: '#/components/schemas/TemplateRun' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/template-allocations/runs/{id}:
    get:
      operationId: getTemplateRun
      x-passage-duty: controlling.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One template run with its lines.
          content: { application/json: { schema: { $ref: '#/components/schemas/TemplateRun' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/cost-object-hierarchies:
    get:
      operationId: listHierarchies
      x-passage-duty: controlling.view
      parameters:
        - { $ref: '#/components/parameters/LegalEntity' }
      responses:
        '200':
          description: Cost object hierarchies by code, each with its node count.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Hierarchy' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createHierarchy
      x-passage-duty: controlling.maintain
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NewHierarchy' } } }
      responses:
        '201':
          description: >-
            The hierarchy (FR-38.18). Codes are unique per legal entity (CST-0003). Only a Collective hierarchy may have
            collecting nodes; a Reporting hierarchy only groups cost objects.
          content: { application/json: { schema: { $ref: '#/components/schemas/Hierarchy' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/cost-object-hierarchies/{id}:
    get:
      operationId: getHierarchy
      x-passage-duty: controlling.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One hierarchy with its nodes in creation order, so a parent precedes its children (CST-0021 when missing).
          content: { application/json: { schema: { $ref: '#/components/schemas/Hierarchy' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/cost-object-hierarchies/{id}/nodes:
    post:
      operationId: createHierarchyNode
      x-passage-duty: controlling.maintain
      parameters:
        - { name: id, in: path, required: true, description: Hierarchy id., schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NewHierarchyNode' } } }
      responses:
        '201':
          description: >-
            The node. The cost object belongs to the hierarchy's legal entity (CST-0001) and appears once per hierarchy
            (CST-0025); the parent is a node of the same hierarchy (CST-0022), so no cycle can form. A collecting node in a
            Reporting hierarchy is CST-0023.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyNode' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/cost-object-hierarchies/{id}/balances:
    get:
      operationId: listHierarchyBalances
      x-passage-duty: controlling.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: >-
            The non-zero balance each node holds in the period per cost element and currency: its collections plus what
            its parent distributed to it, less what it distributed itself.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/NodeBalance' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/hierarchy-nodes/{id}:collect:
    post:
      operationId: collectAtHierarchyNode
      x-passage-duty: controlling.run
      parameters:
        - { name: id, in: path, required: true, description: Hierarchy node id., schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CollectRequest' } } }
      responses:
        '201':
          description: >-
            A cost collected on a collecting node (FR-38.18; SAP KKP4): a Manual cost entry on the node's cost object,
            classified Fixed or Variable by the FR-38.16 rules. Only a collecting node collects (CST-0023). A negative
            amount corrects an earlier collection and may not take the node's balance below zero (CST-0028).
          content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/hierarchy-distributions:
    get:
      operationId: listHierarchyDistributions
      x-passage-duty: controlling.view
      parameters:
        - { $ref: '#/components/parameters/LegalEntity' }
        - { name: hierarchyId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Distribution runs, newest period first.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DistributionRun' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: runHierarchyDistribution
      x-passage-duty: controlling.run
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DistributionRequest' } } }
      responses:
        '201':
          description: >-
            The completed run (FR-38.18). Everything the node holds for the element, period and currency is split by the
            node's basis among the named children, which must be its direct children (CST-0026). ActualOutput and
            StandardCost split in proportion with the rounding residue to the largest basis; FixedPercent gives each
            child its percentage (Σ at most 100), truncated to the minor unit, with the residue to the largest
            percentage when they total 100. The node is credited and each child debited on the same element (origin
            HierarchyDistribution), so the run nets to zero. What is not distributed stays on the node and the run
            carries warning CO-0645; a later run may distribute it. A node that holds nothing is CST-0024.
            Publishes dev.passage.controlling.hierarchy.distributed.v1.
          content: { application/json: { schema: { $ref: '#/components/schemas/DistributionRun' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/controlling/hierarchy-distributions/{id}:
    get:
      operationId: getHierarchyDistribution
      x-passage-duty: controlling.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One distribution run with its shares (CST-0027 when missing).
          content: { application/json: { schema: { $ref: '#/components/schemas/DistributionRun' } } }
        default: { $ref: '#/components/responses/Problem' }
components:
  parameters:
    LegalEntity:
      name: legalEntityId
      in: query
      required: false
      schema: { type: string, format: uuid }
  schemas:
    CostObject:
      type: object
      required: [legalEntityId, kind, code, name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        legalEntityId: { type: string, format: uuid }
        kind: { type: string, enum: [CostCenter, InternalOrder, Product, Project] }
        code: { type: string, pattern: '^[A-Z0-9_-]{2,40}$' }
        name: { type: string, maxLength: 200 }
    CostElement:
      type: object
      required: [legalEntityId, kind, code, name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        legalEntityId: { type: string, format: uuid }
        kind: { type: string, enum: [Primary, Secondary] }
        code: { type: string, pattern: '^[A-Z0-9_-]{2,40}$' }
        name: { type: string, maxLength: 200 }
        mainAccountFrom: { type: string, maxLength: 40, description: Required for Primary elements. }
        mainAccountTo: { type: string, maxLength: 40, description: Required for Primary elements; inclusive. }
        defaultBehavior: { type: string, enum: [Fixed, Variable], description: 'Class of journal cost on this element when no behavior rule applies (FR-38.16). Absent means Unclassified.' }
    BehaviorRule:
      type: object
      additionalProperties: false
      required: [legalEntityId, costElementId, behavior, effectiveFrom]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        legalEntityId: { type: string, format: uuid }
        costElementId: { type: string, format: uuid }
        objectKind: { type: string, enum: [CostCenter, InternalOrder, Product, Project], description: Absent for every kind. }
        behavior: { type: string, enum: [Fixed, Variable] }
        effectiveFrom: { type: string, format: date, description: 'Applies to periods starting on or after this date.' }
        createdAt: { type: string, format: date-time, readOnly: true }
    Warning:
      type: object
      required: [code, detail]
      properties:
        code: { type: string, enum: [CO-0613, CO-0615, CO-0645] }
        detail: { type: string }
    MirrorRequest:
      type: object
      required: [legalEntityId, lines]
      properties:
        legalEntityId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: object
            required: [journalLineId, mainAccount, costObjectId, period, currency, amount]
            properties:
              journalLineId: { type: string, format: uuid }
              mainAccount: { type: string, maxLength: 40 }
              costObjectId: { type: string, format: uuid }
              period: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              amount: { type: string, description: Decimal with at most 4 places. }
    MirrorResult:
      type: object
      required: [mirrored, skipped]
      properties:
        mirrored: { type: integer }
        skipped: { type: integer, description: Lines already mirrored under the same journal line id. }
    RunRequest:
      type: object
      required: [legalEntityId, period, currency, secondaryElementId, costObjectIds, basis]
      properties:
        legalEntityId: { type: string, format: uuid }
        period: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        secondaryElementId: { type: string, format: uuid, description: Secondary element that carries the allocated cost. }
        costObjectIds: { type: array, minItems: 2, maxItems: 500, items: { type: string, format: uuid } }
        basis:
          type: array
          description: Square matrix; basis[j][i] is the basis of receiver i for sender j. The diagonal is ignored.
          items: { type: array, items: { type: string } }
    Flow:
      type: object
      required: [from, to, amount]
      properties:
        from: { type: string, format: uuid }
        to: { type: string, format: uuid }
        amount: { type: string }
    Posting:
      type: object
      required: [centerId, amount]
      properties:
        centerId: { type: string, format: uuid }
        amount: { type: string, description: Net secondary-element posting (received minus sent). }
    RunResponse:
      type: object
      required: [runId, period, result, warnings]
      properties:
        runId: { type: string, format: uuid }
        period: { type: string }
        reversedRunId: { type: string, format: uuid, description: The completed run this rerun reversed (BR-38.7). }
        warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }
        result:
          type: object
          required: [method, iterations, residual, converged, swept, totalIn, totalOut, flows, postings, unallocated]
          properties:
            method: { type: string, enum: [exact-lu, gauss-seidel] }
            iterations: { type: integer }
            residual: { type: string }
            converged: { type: boolean }
            swept: { type: string, description: Absolute amount moved by the residual sweep. }
            totalIn: { type: string }
            totalOut: { type: string }
            flows: { type: array, items: { $ref: '#/components/schemas/Flow' } }
            postings: { type: array, items: { $ref: '#/components/schemas/Posting' } }
            unallocated: { type: array, items: { type: string, format: uuid } }
    Run:
      type: object
      required: [id, legalEntityId, period, currency, secondaryElementId, method, iterations, residual, converged, swept, totalIn, totalOut, status, costObjectIds, flows, postings, unallocated, createdAt, warnings]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        period: { type: string }
        currency: { type: string }
        secondaryElementId: { type: string, format: uuid }
        method: { type: string, enum: [exact-lu, gauss-seidel] }
        iterations: { type: integer }
        residual: { type: string }
        converged: { type: boolean }
        swept: { type: string }
        totalIn: { type: string }
        totalOut: { type: string }
        status: { type: string, enum: [Completed, Reversed] }
        costObjectIds: { type: array, items: { type: string, format: uuid } }
        flows: { type: array, items: { $ref: '#/components/schemas/Flow' } }
        postings: { type: array, items: { $ref: '#/components/schemas/Posting' } }
        unallocated: { type: array, items: { type: string, format: uuid } }
        createdAt: { type: string, format: date-time }
        reversesRunId: { type: string, format: uuid, description: The run this rerun replaced. }
        reversedByRunId: { type: string, format: uuid, description: Set on a Reversed run; the rerun that replaced it. }
        warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }
    ReconcileRequest:
      type: object
      required: [legalEntityId, period, currency]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        period: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    Reconciliation:
      type: object
      required: [reconciled, lines, unmappedAccounts]
      properties:
        reconciled: { type: boolean }
        lines:
          type: array
          items:
            type: object
            required: [costElementId, journal, costLedger, difference]
            properties:
              costElementId: { type: string, format: uuid }
              journal: { type: string }
              costLedger: { type: string }
              difference: { type: string }
        unmappedAccounts:
          type: array
          items:
            type: object
            properties:
              mainAccount: { type: string }
              amount: { type: string }
    TopDownRequest:
      type: object
      required: [legalEntityId, period, currency, sourceCostObjectId, costElementId, amount, segments]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        referencePeriod: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', description: Period the basis was taken from; recorded on the run. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        sourceCostObjectId: { type: string, format: uuid, description: The aggregated object the amount is booked on. }
        costElementId: { type: string, format: uuid, description: The element distributed; primary or secondary. }
        amount: { type: string, description: Positive decimal with no more decimals than the currency's minor unit. }
        segments:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [costObjectId, basis]
            additionalProperties: false
            properties:
              costObjectId: { type: string, format: uuid }
              basis: { type: string, description: Non-negative reference basis, for example revenue of the reference period. }
    TopDownRun:
      type: object
      required: [id, legalEntityId, period, currency, sourceCostObjectId, costElementId, amount, shares, excluded, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        period: { type: string }
        referencePeriod: { type: string }
        currency: { type: string }
        sourceCostObjectId: { type: string, format: uuid }
        costElementId: { type: string, format: uuid }
        amount: { type: string }
        shares:
          type: array
          items:
            type: object
            required: [segmentId, basis, amount]
            properties:
              segmentId: { type: string, format: uuid }
              basis: { type: string }
              amount: { type: string }
        excluded: { type: array, items: { type: string, format: uuid }, description: Segments with a zero basis. }
        status: { type: string, enum: [Completed] }
        createdAt: { type: string, format: date-time }
    SettlementRequest:
      type: object
      required: [period, currency, receiverCostObjectId, secondaryElementId, amount]
      additionalProperties: false
      properties:
        period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        receiverCostObjectId: { type: string, format: uuid, description: Any cost object of the order's legal entity except the order. }
        secondaryElementId: { type: string, format: uuid, description: Settlement cost element; must be Secondary. }
        amount: { type: string, description: Positive decimal with no more decimals than the currency's minor unit. }
    Settlement:
      type: object
      required: [id, legalEntityId, orderId, period, currency, receiverCostObjectId, secondaryElementId, amount, collectedBefore, remaining, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        period: { type: string }
        currency: { type: string }
        receiverCostObjectId: { type: string, format: uuid }
        secondaryElementId: { type: string, format: uuid }
        amount: { type: string }
        collectedBefore: { type: string, description: Collected cost on the order just before this settlement. }
        remaining: { type: string, description: collectedBefore - amount. }
        createdAt: { type: string, format: date-time }
    EntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, costElementId, sourceId, period, currency, amount, behavior, origin]
            properties:
              id: { type: string, format: uuid }
              costElementId: { type: string, format: uuid }
              sourceId: { type: string, format: uuid, description: 'Journal line, allocation run, top-down run, settlement, template run or hierarchy distribution run; the entry itself for a collection.' }
              allocationRunId: { type: string, format: uuid }
              topDownRunId: { type: string, format: uuid }
              settlementId: { type: string, format: uuid }
              templateRunId: { type: string, format: uuid }
              hierarchyNodeId: { type: string, format: uuid, description: The hierarchy node that owns a collected or distributed entry. }
              hierarchyRunId: { type: string, format: uuid }
              period: { type: string }
              currency: { type: string }
              amount: { type: string }
              behavior: { type: string, enum: [Fixed, Variable, Unclassified] }
              origin: { type: string, enum: [Journal, Allocation, Activity, Statistical, Manual, HierarchyDistribution] }
    StatisticalMeasure:
      type: object
      required: [legalEntityId, code, name, unit]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        legalEntityId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,39}$' }
        name: { type: string, maxLength: 200 }
        unit: { type: string, maxLength: 20 }
    MeasureValue:
      type: object
      required: [costObjectId, value]
      properties:
        costObjectId: { type: string, format: uuid }
        value: { type: string }
        updatedAt: { type: string, format: date-time }
    TemplateLine:
      type: object
      required: [receiverCostObjectId, secondaryElementId, formula]
      additionalProperties: false
      properties:
        receiverCostObjectId: { type: string, format: uuid }
        secondaryElementId: { type: string, format: uuid }
        formula: { type: string, maxLength: 500, examples: ['25.00 × m.inspectionLots + 0.005 × b.MATERIAL'] }
    SaveTemplate:
      type: object
      required: [legalEntityId, code, name, currency, senderCostObjectId, lines]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9_-]{2,40}$' }
        name: { type: string, maxLength: 200 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        senderCostObjectId: { type: string, format: uuid }
        allowNegative: { type: boolean, default: false }
        expectedVersion: { type: integer, minimum: 0, default: 0, description: 0 for a new code, else the version last read. }
        lines: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/TemplateLine' } }
    AllocationTemplate:
      type: object
      required: [id, legalEntityId, code, name, currency, senderCostObjectId, allowNegative, lines, version, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        currency: { type: string }
        senderCostObjectId: { type: string, format: uuid }
        allowNegative: { type: boolean }
        lines: { type: array, items: { $ref: '#/components/schemas/TemplateLine' } }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    TemplateLineResult:
      type: object
      required: [receiverCostObjectId, secondaryElementId, amount, divByZero]
      properties:
        receiverCostObjectId: { type: string, format: uuid }
        secondaryElementId: { type: string, format: uuid }
        amount: { type: string, description: Rounded once to the currency minor unit. }
        divByZero: { type: boolean }
    DryRunResult:
      type: object
      required: [templateId, templateVersion, period, lines, totalIn, warnings]
      properties:
        templateId: { type: string, format: uuid }
        templateVersion: { type: integer }
        period: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/TemplateLineResult' } }
        totalIn: { type: string }
        warnings: { type: array, items: { type: string } }
    TemplateRun:
      type: object
      required: [id, legalEntityId, templateId, templateVersion, period, currency, senderCostObjectId, total, lines, warnings, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        templateVersion: { type: integer }
        period: { type: string }
        currency: { type: string }
        senderCostObjectId: { type: string, format: uuid }
        total: { type: string, description: Σ line amounts; the sender is credited the same total. }
        lines: { type: array, items: { $ref: '#/components/schemas/TemplateLineResult' } }
        warnings: { type: array, items: { type: string } }
        status: { type: string, enum: [Completed] }
        createdAt: { type: string, format: date-time }
    NewHierarchy:
      type: object
      required: [legalEntityId, code, name, type]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9_-]{2,40}$' }
        name: { type: string, maxLength: 200 }
        type: { type: string, enum: [Reporting, Collective] }
    Hierarchy:
      type: object
      required: [id, legalEntityId, code, name, type, nodeCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [Reporting, Collective] }
        nodeCount: { type: integer }
        createdAt: { type: string, format: date-time }
        nodes: { type: array, items: { $ref: '#/components/schemas/HierarchyNode' }, description: Present on a single read. }
    NewHierarchyNode:
      type: object
      required: [costObjectId]
      additionalProperties: false
      properties:
        parentNodeId: { type: string, format: uuid, description: Absent for a root node. }
        costObjectId: { type: string, format: uuid }
        collects: { type: boolean, default: false }
        distributionBasis: { type: string, enum: [ActualOutput, StandardCost, FixedPercent], description: Required when collects is true; absent otherwise. }
    HierarchyNode:
      type: object
      required: [id, hierarchyId, costObjectId, collects, createdAt]
      properties:
        id: { type: string, format: uuid }
        hierarchyId: { type: string, format: uuid }
        parentNodeId: { type: string, format: uuid }
        costObjectId: { type: string, format: uuid }
        collects: { type: boolean }
        distributionBasis: { type: string, enum: [ActualOutput, StandardCost, FixedPercent] }
        createdAt: { type: string, format: date-time }
    NodeBalance:
      type: object
      required: [nodeId, costElementId, currency, amount]
      properties:
        nodeId: { type: string, format: uuid }
        costElementId: { type: string, format: uuid }
        currency: { type: string }
        amount: { type: string }
    CollectRequest:
      type: object
      required: [period, currency, costElementId, amount]
      additionalProperties: false
      properties:
        period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        costElementId: { type: string, format: uuid, description: A cost element of the node's legal entity. }
        amount: { type: string, description: Non-zero decimal with no more decimals than the currency's minor unit; negative to correct. }
    Collection:
      type: object
      required: [entryId, nodeId, costObjectId, costElementId, period, currency, amount, behavior, balance]
      properties:
        entryId: { type: string, format: uuid }
        nodeId: { type: string, format: uuid }
        costObjectId: { type: string, format: uuid }
        costElementId: { type: string, format: uuid }
        period: { type: string }
        currency: { type: string }
        amount: { type: string }
        behavior: { type: string, enum: [Fixed, Variable, Unclassified] }
        balance: { type: string, description: What the node holds for the element, period and currency after this collection. }
    DistributionRequest:
      type: object
      required: [nodeId, period, currency, costElementId, children]
      additionalProperties: false
      properties:
        nodeId: { type: string, format: uuid, description: The collecting node. }
        period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        costElementId: { type: string, format: uuid }
        children:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [nodeId, basis]
            additionalProperties: false
            properties:
              nodeId: { type: string, format: uuid, description: A direct child of the node. }
              basis: { type: string, description: 'Non-negative: actual output quantity, output valued at standard cost, or a percentage 0-100 for FixedPercent.' }
    DistributionRun:
      type: object
      required: [id, legalEntityId, hierarchyId, nodeId, costElementId, period, currency, basis, amount, distributed, residual, shares, warnings, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        hierarchyId: { type: string, format: uuid }
        nodeId: { type: string, format: uuid }
        costElementId: { type: string, format: uuid }
        period: { type: string }
        currency: { type: string }
        basis: { type: string, enum: [ActualOutput, StandardCost, FixedPercent] }
        amount: { type: string, description: What the node held before the run. }
        distributed: { type: string }
        residual: { type: string, description: amount - distributed; stays on the node. }
        shares:
          type: array
          items:
            type: object
            required: [nodeId, costObjectId, basis, amount]
            properties:
              nodeId: { type: string, format: uuid }
              costObjectId: { type: string, format: uuid }
              basis: { type: string }
              amount: { type: string }
        warnings: { type: array, items: { $ref: '#/components/schemas/Warning' }, description: CO-0645 when residual is positive. }
        status: { type: string, enum: [Completed] }
        createdAt: { type: string, format: date-time }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              instance: { type: string }
              code: { type: string }
              traceId: { type: string }
