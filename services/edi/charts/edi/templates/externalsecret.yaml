{{- if .Values.transports.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "transports.secretName is required with transports.externalSecret.enabled" .Values.transports.secretName }}
  labels:
    app.kubernetes.io/name: edi
spec:
  refreshInterval: {{ .Values.transports.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.transports.externalSecret.storeName }}
  target:
    name: {{ .Values.transports.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ include "passage.secretKey" (dict "root" $ "key" (printf "%s" (required "transports.externalSecret.key is required with transports.externalSecret.enabled" .Values.transports.externalSecret.key))) }}
{{- end }}
