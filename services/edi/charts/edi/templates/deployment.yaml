apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: edi
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: edi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edi
    spec:
      securityContext:
        runAsNonRoot: true
        {{- if or .Values.serviceIdentity.signingKeySecret .Values.transports.secretName }}
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edi
          image: {{ include "edi.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            {{- include "passage.cloudEnv" $ | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            - name: EDI_DUP_WINDOW_DAYS
              value: {{ .Values.dupWindowDays | quote }}
            - name: EDI_ISA_QUALIFIER
              value: {{ .Values.isaSender.qualifier | quote }}
            - name: EDI_ISA_ID
              value: {{ .Values.isaSender.id | quote }}
            - name: EDI_EDIFACT_ID
              value: {{ .Values.edifactSender.id | quote }}
            - name: EDI_EDIFACT_QUALIFIER
              value: {{ .Values.edifactSender.qualifier | quote }}
            {{- if .Values.serviceIdentity.signingKeySecret }}
            - name: PASSAGE_SERVICE_NAME
              value: edi
            - name: PASSAGE_SERVICE_SIGNING_KEY_FILE
              value: /var/run/passage/service-identity/signing-key
            {{- if .Values.serviceIdentity.keyId }}
            - name: PASSAGE_SERVICE_KEY_ID
              value: {{ .Values.serviceIdentity.keyId | quote }}
            {{- end }}
            - name: EDI_FULFILLMENT_URL
              value: {{ required "sources.fulfillmentUrl is required with serviceIdentity.signingKeySecret" .Values.sources.fulfillmentUrl | quote }}
            - name: EDI_BILLING_URL
              value: {{ required "sources.billingUrl is required with serviceIdentity.signingKeySecret" .Values.sources.billingUrl | quote }}
            - name: EDI_SALES_URL
              value: {{ required "sources.salesUrl is required with serviceIdentity.signingKeySecret" .Values.sources.salesUrl | quote }}
            {{- end }}
            {{- if .Values.allowBodyOutbound }}
            - name: EDI_ALLOW_BODY_OUTBOUND
              value: "true"
            {{- end }}
            {{- if .Values.transports.secretName }}
            - name: EDI_SECRETS_DIR
              value: /var/run/passage/edi-secrets
            {{- end }}
            {{- if .Values.transports.workers }}
            - name: EDI_TRANSPORT_WORKERS
              value: "true"
            - name: EDI_TRANSPORT_INTERVAL_SECONDS
              value: {{ .Values.transports.intervalSeconds | quote }}
            - name: EDI_AS2_MDN_TIMEOUT_MINUTES
              value: {{ .Values.transports.mdnTimeoutMinutes | quote }}
            {{- end }}
            {{- if .Values.transports.as2.enabled }}
            - name: EDI_AS2_ADDR
              value: {{ printf ":%v" .Values.transports.as2.port | quote }}
            - name: EDI_AS2_RATE_PER_MINUTE
              value: {{ .Values.transports.as2.rateLimit.perMinute | quote }}
            - name: EDI_AS2_RATE_BURST
              value: {{ .Values.transports.as2.rateLimit.burst | quote }}
            {{- end }}
            {{- if .Values.transports.as2.publicUrl }}
            - name: EDI_AS2_PUBLIC_URL
              value: {{ .Values.transports.as2.publicUrl | quote }}
            {{- end }}
            {{- if .Values.transports.trust.rootsConfigMap }}
            - name: EDI_AS2_TRUST_ROOTS
              value: /etc/passage/edi-trust/roots/{{ .Values.transports.trust.rootsKey }}
            {{- end }}
            {{- if .Values.transports.trust.crlConfigMap }}
            - name: EDI_AS2_CRL_DIR
              value: /etc/passage/edi-trust/crl
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
            {{- if .Values.transports.as2.enabled }}
            - { name: as2, containerPort: {{ .Values.transports.as2.port }} }
            {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          {{- if or .Values.serviceIdentity.signingKeySecret .Values.transports.secretName .Values.transports.trust.rootsConfigMap }}
          volumeMounts:
            {{- if .Values.serviceIdentity.signingKeySecret }}
            - { name: service-identity, mountPath: /var/run/passage/service-identity, readOnly: true }
            {{- end }}
            {{- if .Values.transports.secretName }}
            - { name: edi-secrets, mountPath: /var/run/passage/edi-secrets, readOnly: true }
            {{- end }}
            {{- if .Values.transports.trust.rootsConfigMap }}
            - { name: edi-trust-roots, mountPath: /etc/passage/edi-trust/roots, readOnly: true }
            {{- end }}
            {{- if .Values.transports.trust.crlConfigMap }}
            - { name: edi-trust-crl, mountPath: /etc/passage/edi-trust/crl, readOnly: true }
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if and .Values.transports.trust.crlConfigMap (not .Values.transports.trust.rootsConfigMap) }}
      {{- fail "transports.trust.crlConfigMap needs transports.trust.rootsConfigMap" }}
      {{- end }}
      {{- if or .Values.serviceIdentity.signingKeySecret .Values.transports.secretName .Values.transports.trust.rootsConfigMap }}
      volumes:
        {{- if .Values.serviceIdentity.signingKeySecret }}
        - name: service-identity
          secret:
            secretName: {{ .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.transports.secretName }}
        - name: edi-secrets
          secret:
            secretName: {{ .Values.transports.secretName }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.transports.trust.rootsConfigMap }}
        - name: edi-trust-roots
          configMap:
            name: {{ .Values.transports.trust.rootsConfigMap }}
        {{- end }}
        {{- if .Values.transports.trust.crlConfigMap }}
        - name: edi-trust-crl
          configMap:
            name: {{ .Values.transports.trust.crlConfigMap }}
        {{- end }}
      {{- end }}
