image: { repository: ghcr.io/benjaminsrussell/edi, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: edi-db
migrateOnStart: false
replicaCount: 2
dupWindowDays: 30
# Our ISA06/GS02 identity on outbound 855/856/810 interchanges.
isaSender: { qualifier: ZZ, id: PASSAGE }
# Our UNB S002 identity on outbound EDIFACT (DESADV, INVOIC, ORDERS); the CONTRLs we send answer from the recipient the partner addressed.
edifactSender: { id: PASSAGE, qualifier: ZZZ }
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
serviceMonitor: { enabled: false, interval: 30s }
# Outbound 856 and 810 are read from their owning services under a signed service grant.
serviceIdentity: { signingKeySecret: "", keyId: "" }
# purchasingUrl and receivingUrl together switch on the cXML exchange (#35, 35-4): inbound confirmations confirm purchase orders and inbound
# ship notices become receiving ASNs, as service:edi-cxml. The purchasing and receiving charts must list edi's public key.
sources: { fulfillmentUrl: "", billingUrl: "", salesUrl: "", purchasingUrl: "", receivingUrl: "" }
# The outbound consumer (#35, 35-1, args [consume]): sends the 856, DESADV, 810 or INVOIC of fulfillment's asn.issued and billing's
# invoice.posted to the partners with auto-outbound sets. It exits at start unless service:edi-outbound is seeded in the service
# principal table, and needs serviceIdentity and the three source URLs like the API. Off by default, like the other consumers, until
# it is turned on per environment (the source services' outbox connectors create the topics). Its KafkaUser, ACLs and dead-letter
# topic are deploy/kafka/edi-consumer.yaml. The purchasing chart must also list edi's public key (serviceIdentity.publicKeys) for
# punchout requisitions.
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: edi-outbound
    username: edi-consumer
    dlqTopic: passage.edi.outbound.dlq
    secret: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
# Serves POST /partners/{id}/outbound with the document in the request body (the web Send EDI document screen and 855).
allowBodyOutbound: true
# Partner transports (#483). Secret material never goes to the database: a partner's transport names files in the
# Secret `secretName`, mounted read-only at /var/run/passage/edi-secrets (EDI_SECRETS_DIR). Each key of the Secret is
# one reference: an AS2 signing key (PEM private key followed by our certificate), an SFTP SSH private key (OpenSSH
# or PEM, unencrypted) or an SFTP password (one line). With externalSecret.enabled the chart creates that Secret
# from every property of the Vault path `externalSecret.key` through the ClusterSecretStore `externalSecret.storeName`.
transports:
  secretName: ""
  externalSecret: { enabled: false, storeName: passage, key: "", refreshInterval: 1h }
  # Run the delivery dispatcher and the SFTP poller in every replica (rows are leased, replicas never send one twice).
  # The dispatcher also posts the asynchronous MDNs the AS2 listener stores, so with as2.enabled some release must
  # run the workers.
  workers: false
  intervalSeconds: 15
  # How often the workers run the self-billing sweep (#35, 35-5): match the pending self-billed documents, open the unbilled disputes.
  selfBillSweepMinutes: 60
  # How long a delivery waits for its asynchronous MDN before it is sent again (FAILED after the last attempt).
  mdnTimeoutMinutes: 1440
  # Partner AS2 certificates are always pinned. With rootsConfigMap (key rootsKey: a PEM bundle of the CAs partners'
  # certificates must chain to, EDI_AS2_TRUST_ROOTS) they must also chain to one of them, through the intermediates
  # stored after the certificate; with crlConfigMap (EDI_AS2_CRL_DIR, every key one CRL: PEM in data, DER in
  # binaryData) every certificate of the chain needs a current CRL from its issuer that does not list it. Both fail
  # closed and are read again when the ConfigMap changes; whoever operates the trust keeps the CRLs current (the
  # service fetches nothing).
  trust: { rootsConfigMap: "", rootsKey: roots.pem, crlConfigMap: "" }
  # The AS2 listener partners post to, on its own port and Service (edi-as2). It takes no Passage token: it is
  # exposed by the AS2 edge (deploy/gateway/as2-*.yaml: Gateway passage-as2, outside the passage-api JWT
  # SecurityPolicy), and the caller is authenticated by its AS2 signature against the partner certificate.
  # publicUrl is that edge's https URL (https://as2.<env>.passage.dev). rateLimit is per AS2 endpoint, checked before
  # any other work (429 with Retry-After); perMinute 0 turns it off.
  as2:
    enabled: false
    port: 8081
    publicUrl: ""
    rateLimit: { perMinute: 120, burst: 60 }
# Ingress to the edi pods. The AS2 port admits only the Envoy proxies of Gateway passage-as2. apiFrom lists the peers
# admitted to the API (8080) and metrics (9090) ports; empty keeps those open inside the cluster as they were before
# this policy (restricting them is #82 item 2).
networkPolicy:
  enabled: true
  as2Gateway:
    namespaces: [envoy-gateway-system]
    podLabels:
      gateway.envoyproxy.io/owning-gateway-name: passage-as2
      gateway.envoyproxy.io/owning-gateway-namespace: hello-ledger
  apiFrom: []
