asyncapi: 3.0.0
info:
  title: Passage EDI events
  version: 0.1.0
  description: Events published by the edi service through the transactional outbox (CloudEvents 1.0).
defaultContentType: application/cloudevents+json
channels:
  messageReceived:
    address: passage.edi.message
    messages:
      messageReceived:
        $ref: '#/components/messages/MessageReceived'
  messageAcked:
    address: passage.edi.message
    messages:
      messageAcked:
        $ref: '#/components/messages/MessageAcked'
  messageFailed:
    address: passage.edi.message
    messages:
      messageFailed:
        $ref: '#/components/messages/MessageFailed'
  messageSent:
    address: passage.edi.message
    messages:
      messageSent:
        $ref: '#/components/messages/MessageSent'
  deliveryFailed:
    address: passage.edi.delivery
    messages:
      deliveryFailed:
        $ref: '#/components/messages/DeliveryFailed'
operations:
  publishMessageReceived:
    action: send
    channel: { $ref: '#/channels/messageReceived' }
    summary: One inbound transaction set has been recorded (FR-35.4)
  publishMessageAcked:
    action: send
    channel: { $ref: '#/channels/messageAcked' }
    summary: The partner's 997 answering one outbound transaction was matched (BR-35.5)
  publishMessageFailed:
    action: send
    channel: { $ref: '#/channels/messageFailed' }
    summary: An inbound transaction failed mapping, or a received 997 could not be read or matched; also after a reprocess that still fails with another error (FR-35.10)
  publishMessageSent:
    action: send
    channel: { $ref: '#/channels/messageSent' }
    summary: The partner's transport confirmed receipt of one outbound transaction (processed AS2 MDN or completed SFTP upload, FR-35.5)
  publishDeliveryFailed:
    action: send
    channel: { $ref: '#/channels/deliveryFailed' }
    summary: A transport delivery gave up and needs an operator (attempts used up, no asynchronous MDN within the wait, or the partner's transport is gone); a resend queues a new delivery
components:
  messages:
    MessageReceived:
      name: dev.passage.edi.message.received.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, tenantid, data]
        properties:
          type: { const: dev.passage.edi.message.received.v1 }
          source: { const: edi }
          id: { type: string, format: uuid }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: message id }
          data:
            type: object
            required: [message_id, interchange_id, partner_id, standard, transaction_set, control_number, st_control, status]
            properties:
              message_id: { type: string, format: uuid }
              interchange_id: { type: string, format: uuid }
              partner_id: { type: string, format: uuid }
              standard: { type: string, enum: [X12, EDIFACT, UBL, CXML] }
              transaction_set: { type: string }
              control_number: { type: string }
              st_control: { type: string }
              status: { type: string, enum: [RECEIVED, MAPPED, POSTED, FAILED, SENT, ACKED] }
              canonical_ref: { type: string }
    MessageAcked:
      name: dev.passage.edi.message.acked.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, tenantid, data]
        properties:
          type: { const: dev.passage.edi.message.acked.v1 }
          source: { const: edi }
          id: { type: string, format: uuid }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: outbound message id }
          data:
            type: object
            required: [message_id, interchange_id, partner_id, transaction_set, control_number, st_control, ack_status, ack_message_id]
            properties:
              message_id: { type: string, format: uuid, description: the outbound message acknowledged }
              interchange_id: { type: string, format: uuid, description: the outbound interchange }
              partner_id: { type: string, format: uuid }
              transaction_set: { type: string, enum: ['855', '856', '810'] }
              control_number: { type: string, description: ISA13 of the outbound interchange }
              st_control: { type: string }
              ack_status: { type: string, enum: [ACCEPTED, ACCEPTED_WITH_ERRORS, REJECTED] }
              ack_message_id: { type: string, format: uuid, description: the received 997 message }
    MessageFailed:
      name: dev.passage.edi.message.failed.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, tenantid, data]
        properties:
          type: { const: dev.passage.edi.message.failed.v1 }
          source: { const: edi }
          id: { type: string, format: uuid }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: message id }
          data:
            type: object
            required: [message_id, interchange_id, partner_id, transaction_set, control_number, st_control, error, reprocessed]
            properties:
              message_id: { type: string, format: uuid }
              interchange_id: { type: string, format: uuid, description: the inbound interchange }
              partner_id: { type: string, format: uuid }
              transaction_set: { type: string }
              control_number: { type: string, description: ISA13 of the inbound interchange }
              st_control: { type: string }
              error: { type: string, description: catalog code and detail of the failing rule }
              reprocessed: { type: boolean, description: true when a reprocess produced this failure }
    MessageSent:
      name: dev.passage.edi.message.sent.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, tenantid, data]
        properties:
          type: { const: dev.passage.edi.message.sent.v1 }
          source: { const: edi }
          id: { type: string, format: uuid }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: outbound message id }
          data:
            type: object
            required: [message_id, interchange_id, partner_id, transaction_set, control_number, st_control, transport, delivery_id, transport_message_id]
            properties:
              message_id: { type: string, format: uuid, description: the outbound message delivered }
              interchange_id: { type: string, format: uuid, description: the outbound interchange }
              partner_id: { type: string, format: uuid }
              transaction_set: { type: string }
              control_number: { type: string, description: ISA13 of the outbound interchange }
              st_control: { type: string }
              transport: { type: string, enum: [AS2, SFTP] }
              delivery_id: { type: string, format: uuid }
              transport_message_id: { type: string, description: The delivery message id (the AS2 Message-ID without angle brackets) }
    DeliveryFailed:
      name: dev.passage.edi.delivery.failed.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, tenantid, data]
        properties:
          type: { const: dev.passage.edi.delivery.failed.v1 }
          source: { const: edi }
          id: { type: string, format: uuid }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: delivery id }
          data:
            type: object
            required: [delivery_id, interchange_id, partner_id, payload_kind, transport, transport_message_id, attempts, mdn_timeouts, mdn_timeout, error]
            properties:
              delivery_id: { type: string, format: uuid }
              interchange_id: { type: string, format: uuid, description: the outbound interchange (DOCUMENT) or the inbound one whose 997 this is (ACK) }
              partner_id: { type: string, format: uuid }
              payload_kind: { type: string, enum: [DOCUMENT, ACK] }
              transport: { type: string, enum: [AS2, SFTP] }
              transport_message_id: { type: string, description: The delivery message id (the AS2 Message-ID without angle brackets) }
              attempts: { type: integer, minimum: 0, description: sends made }
              mdn_timeouts: { type: integer, minimum: 0, description: waits for an asynchronous MDN that ran out (EDI_AS2_MDN_TIMEOUT_MINUTES) }
              mdn_timeout: { type: boolean, description: true when the last wait for an asynchronous MDN ran out }
              error: { type: string, description: the last failure recorded on the delivery }
