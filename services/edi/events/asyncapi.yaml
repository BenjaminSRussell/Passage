asyncapi: 3.0.0
info:
  title: Passage EDI events
  version: 0.1.0
  description: Events published by the edi service through the transactional outbox (CloudEvents 1.0).
defaultContentType: application/cloudevents+json
channels:
  messageReceived:
    address: passage.edi.message
    messages:
      messageReceived:
        $ref: '#/components/messages/MessageReceived'
  messageAcked:
    address: passage.edi.message
    messages:
      messageAcked:
        $ref: '#/components/messages/MessageAcked'
  messageFailed:
    address: passage.edi.message
    messages:
      messageFailed:
        $ref: '#/components/messages/MessageFailed'
operations:
  publishMessageReceived:
    action: send
    channel: { $ref: '#/channels/messageReceived' }
    summary: One inbound transaction set has been recorded (FR-35.4)
  publishMessageAcked:
    action: send
    channel: { $ref: '#/channels/messageAcked' }
    summary: The partner's 997 answering one outbound transaction was matched (BR-35.5)
  publishMessageFailed:
    action: send
    channel: { $ref: '#/channels/messageFailed' }
    summary: An inbound transaction failed mapping, or a received 997 could not be read or matched; also after a reprocess that still fails with another error (FR-35.10)
components:
  messages:
    MessageReceived:
      name: dev.passage.edi.message.received.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, tenantid, data]
        properties:
          type: { const: dev.passage.edi.message.received.v1 }
          source: { const: edi }
          id: { type: string, format: uuid }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: message id }
          data:
            type: object
            required: [message_id, interchange_id, partner_id, standard, transaction_set, control_number, st_control, status]
            properties:
              message_id: { type: string, format: uuid }
              interchange_id: { type: string, format: uuid }
              partner_id: { type: string, format: uuid }
              standard: { type: string, enum: [X12, EDIFACT, UBL, CXML] }
              transaction_set: { type: string }
              control_number: { type: string }
              st_control: { type: string }
              status: { type: string, enum: [RECEIVED, MAPPED, POSTED, FAILED, SENT, ACKED] }
              canonical_ref: { type: string }
    MessageAcked:
      name: dev.passage.edi.message.acked.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, tenantid, data]
        properties:
          type: { const: dev.passage.edi.message.acked.v1 }
          source: { const: edi }
          id: { type: string, format: uuid }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: outbound message id }
          data:
            type: object
            required: [message_id, interchange_id, partner_id, transaction_set, control_number, st_control, ack_status, ack_message_id]
            properties:
              message_id: { type: string, format: uuid, description: the outbound message acknowledged }
              interchange_id: { type: string, format: uuid, description: the outbound interchange }
              partner_id: { type: string, format: uuid }
              transaction_set: { type: string, enum: ['855', '856', '810'] }
              control_number: { type: string, description: ISA13 of the outbound interchange }
              st_control: { type: string }
              ack_status: { type: string, enum: [ACCEPTED, ACCEPTED_WITH_ERRORS, REJECTED] }
              ack_message_id: { type: string, format: uuid, description: the received 997 message }
    MessageFailed:
      name: dev.passage.edi.message.failed.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, tenantid, data]
        properties:
          type: { const: dev.passage.edi.message.failed.v1 }
          source: { const: edi }
          id: { type: string, format: uuid }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: message id }
          data:
            type: object
            required: [message_id, interchange_id, partner_id, transaction_set, control_number, st_control, error, reprocessed]
            properties:
              message_id: { type: string, format: uuid }
              interchange_id: { type: string, format: uuid, description: the inbound interchange }
              partner_id: { type: string, format: uuid }
              transaction_set: { type: string }
              control_number: { type: string, description: ISA13 of the inbound interchange }
              st_control: { type: string }
              error: { type: string, description: catalog code and detail of the failing rule }
              reprocessed: { type: boolean, description: true when a reprocess produced this failure }
