openapi: 3.1.0
info:
  title: Passage EDI engine API
  version: 0.1.0
  description: Trading partner profiles, the map test harness, inbound X12 receipt with 997 matching, outbound 855/856/810 generation, the interchange list, the message monitor with reprocess and the partner SLA dashboard (PSG-35 slices 1 to 3); partner transports (AS2, SFTP) with outbound delivery, resend, and the AS2 listener partners call (#483).
servers:
  - url: https://api.{env}.passage.dev/v1
    variables:
      env: { default: dev }
paths:
  /edi/v1/partners:
    post:
      operationId: createPartner
      summary: Create a trading partner profile
      x-passage-duty: edi.admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerRequest' }
      responses:
        '200':
          description: Replay of an earlier request with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Partner' }
        '201':
          description: Partner created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Partner' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422':
          description: idempotency_key_reuse — the key was already used with a different request body
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      operationId: listPartners
      summary: List trading partners by name
      x-passage-duty: edi.admin
      parameters:
        - name: environment
          in: query
          required: false
          schema: { type: string, enum: [TEST, PROD] }
      responses:
        '200':
          description: Partners
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Partner' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /edi/v1/partners/{id}:
    get:
      operationId: getPartner
      summary: Read one trading partner
      x-passage-duty: edi.admin
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The partner; ETag carries its version
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Partner' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /edi/v1/partners/{id}/outbound:
    post:
      operationId: createOutbound
      summary: Generate an outbound 855, 856, 810, 820 or 214 for the partner
      description: >
        Builds the transaction from its canonical document (BR-35.2 856 S/O/P/I with SSCC-18,
        BR-35.3 810, 855 acknowledgment, 820 remittance whose items add up to the payment, 214
        shipment status), wraps it in an X12 00401 interchange from our identity
        (EDI_ISA_QUALIFIER/EDI_ISA_ID) to the partner with the next gap-free control number
        (ISA13 and GS06, BR-35.5) and records it with ackStatus PENDING until the partner's 997 is
        matched. The message stays MAPPED: AS2/SFTP transmission is not built yet. A document that
        breaks a mapping rule is 422 EDI-0007. Served only when EDI_ALLOW_BODY_OUTBOUND=true
        (tests and development); production generates from the owning services through
        outbound:from-source.
      x-passage-duty: edi.operate
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutboundRequest' }
      responses:
        '200':
          description: Replay of an earlier request with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboundResult' }
        '201':
          description: Outbound interchange recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboundResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: EDI-0008 — the partner is inactive
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: EDI-0007 — the document breaks a mapping rule; or idempotency_key_reuse
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /edi/v1/partners/{id}/trade-profile:
    put:
      operationId: putTradeProfile
      summary: Set the partner's trade profile (legal entity, customer, GLNs, default SCAC)
      description: >
        The profile ties the partner to one legal entity and one customer of the source
        services and supplies the party names and GLNs the ASN and invoice sources do not carry.
      x-passage-duty: edi.admin
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TradeProfile' }
      responses:
        '200':
          description: Profile saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeProfile' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /edi/v1/partners/{id}/transport:
    put:
      operationId: putTransport
      summary: Select the partner's transport (API, AS2 or SFTP) and its settings
      description: >
        The transport hangs off the partner's trade profile and is scoped to its legal entity: the
        caller must be scoped to that entity (another entity sees 404 on GET and 409 EDI-0012 on PUT).
        API (the default) transmits nothing. AS2 signs every message (sha-256, sha-384 or sha-512),
        may encrypt it to the partner certificate (aes128-cbc, aes192-cbc, aes256-cbc) and always
        requires a signed MDN, synchronous or asynchronous (async needs EDI_AS2_PUBLIC_URL); the
        partner's messages to the endpoint in as2Inbound must be signed with partnerCertificate, and
        encrypted when an encryption algorithm is set. SFTP uploads to outboundDir (as .part, then
        renamed) and, with inboundDir, polls it every pollIntervalSeconds. No secret is accepted:
        signingKeyRef (a PEM private key with our certificate) and credentialRef (an SSH private
        key, or a password) name files in the service's secret directory (EDI_SECRETS_DIR, filled
        by an ExternalSecret), and a reference that does not resolve to a usable secret is refused.
        The AS2 endpoint id is kept across updates.
      x-passage-duty: edi.admin
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerTransport' }
      responses:
        '200':
          description: Transport saved
          headers:
            ETag: { schema: { type: string }, description: Version of the transport }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportView' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: EDI-0012 — the partner has no trade profile in the caller's legal entities
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: EDI-0016 — no secret directory is configured
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      operationId: getTransport
      summary: Read the partner's transport, its AS2 inbound URL and whether its secrets resolve
      x-passage-duty: edi.admin
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The transport
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportView' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /edi/v1/partners/{id}/outbound:from-source:
    post:
      operationId: outboundFromSource
      summary: Generate the 856 from a fulfillment shipment or the 810 from a billing invoice
      description: >
        Reads the shipment (with its sales order for the customer PO) or the invoice from its owning
        service under a service grant limited to the read duties fulfillment.shipment.read,
        billing.invoice.read and sales.order.lookup, for the legal entity of the partner's trade
        profile. The document must belong to that legal entity and customer (422 EDI-0011) and be
        final (409 EDI-0013). Idempotent per source document: a repeat returns the recorded
        interchange (200) and allocates no control number. This is an explicit API call; the
        wms.load.shipped and invoice.posted consumers are not built.
      x-passage-duty: edi.operate
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceOutboundRequest' }
      responses:
        '200':
          description: The source document was already sent; the recorded interchange
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboundResult' }
        '201':
          description: Outbound interchange recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboundResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403':
          description: Missing duty, or EDI-0014 a source service refused the edi service grant for the partner's legal entity
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: EDI-0008 partner inactive, EDI-0012 no trade profile, EDI-0013 source not final
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: EDI-0011 wrong legal entity or customer, EDI-0007 mapping rule, or idempotency_key_reuse when the source changed after it was sent
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: EDI-0010 a source service could not be read
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: EDI-0010 source services are not configured
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /edi/v1/interchanges:
    get:
      operationId: listInterchanges
      summary: List interchanges, newest first
      x-passage-duty: edi.operate
      parameters:
        - name: partnerId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: ackStatus
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AckStatus' }
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [IN, OUT] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Interchanges
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/InterchangeSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /edi/v1/interchanges/{id}:
    get:
      operationId: getInterchange
      summary: Read one interchange with its messages and the 997 sent back
      description: >
        The raw payload is not returned here; it is served as the masked segment tree under
        /payload. Party names in the canonical documents are replaced by "***" unless the caller
        holds edi.pii.view (BR-35.12).
      x-passage-duty: edi.operate
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The interchange
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterchangeDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /edi/v1/interchanges/{id}/payload:
    get:
      operationId: getInterchangePayload
      summary: Raw payload as a segment tree for the monitor's raw viewer
      description: >
        The stored X12 text parsed into interchange (ISA), group (GS), transaction (ST) and segment
        nodes. Every element carries its X12 reference (for example N102) and, when known, its X12
        004010 dictionary name for hover. Trailers (SE, GE, IEA) are left out. Unless the caller holds
        edi.pii.view, the party name (N102), N2 names, every N3 and N4 element and the PER contact name
        and numbers are replaced by "***" and flagged masked (BR-35.12); entity codes, qualifiers and the
        GLN stay visible. The raw text itself is never returned. A stored payload that no longer parses
        is EDI-0003.
      x-passage-duty: edi.operate
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The segment tree
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayloadTree' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /edi/v1/interchanges:reprocess:
    post:
      operationId: bulkReprocessInterchanges
      summary: Reprocess the failed transactions of up to 200 inbound interchanges
      description: >
        Applies the rules of /interchanges/{id}:reprocess to each listed interchange in one
        transaction under one Idempotency-Key (PRD §6.35.6, bulk reprocess of at most 200 with a dry
        run). Ids must be distinct UUIDs. An unknown interchange (NOT_FOUND), an outbound one
        (NOT_INBOUND) or one whose stored payload no longer parses (UNREADABLE) is reported in its item
        and does not stop the others. Items come back in request order. With dryRun=true nothing is
        written and no Idempotency-Key is needed.
      x-passage-duty: edi.operate
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Required unless dryRun=true. A replay with the same ids in the same order returns the first result.
          schema: { type: string, maxLength: 255 }
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interchangeIds]
              additionalProperties: false
              properties:
                interchangeIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Outcome per requested interchange
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkReprocessResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422':
          description: idempotency_key_reuse
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /edi/v1/interchanges/{id}:reprocess:
    post:
      operationId: reprocessInterchange
      summary: Map the failed transactions of an inbound interchange again from its raw payload
      description: >
        Re-runs mapping for every FAILED transaction of an inbound interchange (received 997s are
        left alone). A transaction that now maps becomes MAPPED and dev.passage.edi.message.received.v1
        is published again with status MAPPED; one that still fails with another error is updated
        and dev.passage.edi.message.failed.v1 is published. Unchanged outcomes write nothing. The 997
        sent for the interchange and its ackStatus are never changed. With dryRun=true nothing is
        written and no Idempotency-Key is needed. An outbound interchange is EDI-0009 (it is resent,
        not reprocessed); a stored payload that no longer parses is EDI-0003.
      x-passage-duty: edi.operate
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: false
          description: Required unless dryRun=true. A replay returns the first result.
          schema: { type: string, maxLength: 255 }
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Outcome per previously failed transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReprocessResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422':
          description: EDI-0003 — the stored payload no longer parses; or idempotency_key_reuse
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /edi/v1/interchanges/{id}:resend:
    post:
      operationId: resendInterchange
      summary: Queue a new delivery of an outbound interchange whose last delivery failed or was rejected
      description: >
        The new delivery has its own AS2 Message-ID (and SFTP file name) and is sent by the
        dispatcher. Only an outbound interchange whose latest document delivery is FAILED or
        REJECTED, to a partner whose transport (AS2 or SFTP) the caller's legal entities cover, can
        be resent (409 EDI-0015 otherwise).
      x-passage-duty: edi.operate
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: Delivery queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: EDI-0015 — nothing to resend
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /as2/v1/{endpoint}:
    servers:
      - url: https://as2.{env}.passage.dev
        description: The AS2 listener (EDI_AS2_ADDR), reached by partners without a Passage token
        variables:
          env: { default: dev }
    post:
      operationId: as2Receive
      summary: Receive an AS2 message from the partner of this endpoint (RFC 4130)
      description: >
        Called by the trading partner's AS2 software, not by Passage users: there is no JWT and
        X-Passage-* headers are ignored. The endpoint id selects one partner transport (tenant,
        partner and legal entity come from it); the caller is authenticated by its CMS signature
        against the pinned partner certificate, AS2-From must be the partner's AS2 id and AS2-To
        ours. Nothing is parsed before the signature verifies (and the envelope decrypts when
        encryption is required). The X12 payload goes through the inbound pipeline of
        /edi/v1/inbound/x12, its ISA sender must be this partner, and the 997 is queued back over
        the partner's transport. The MDN (signed when asked) is returned in the response, or posted
        to Receipt-Delivery-Option when that URL is on the partner's configured AS2 host.
        Dispositions: processed; processed/warning: duplicate-document for a Message-ID or
        interchange recorded before; processed/error with authentication-failed,
        decryption-failed, integrity-check-failed, insufficient-message-security or
        unexpected-processing-error. Bodies above 8 MiB are 413.
      x-passage-duty: none (partner authenticated by its AS2 signature)
      security: []
      parameters:
        - name: endpoint
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/signed: { schema: { type: string, format: binary } }
          application/pkcs7-mime: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: The MDN (multipart/report, multipart/signed when signed); empty for an asynchronous MDN
        '400': { description: Message-ID missing }
        '403': { description: AS2-From or AS2-To do not match the endpoint }
        '404': { description: Unknown endpoint, not an AS2 transport, or the partner is inactive }
        '413': { description: Body above 8 MiB }
        '503': { description: Our keys or the partner certificate cannot be loaded }
  /as2/v1/{endpoint}/mdn:
    servers:
      - url: https://as2.{env}.passage.dev
        description: The AS2 listener (EDI_AS2_ADDR), reached by partners without a Passage token
        variables:
          env: { default: dev }
    post:
      operationId: as2AsyncMDN
      summary: Receive the asynchronous MDN for one of our AS2 deliveries
      description: >
        The MDN must be signed by the partner certificate, come from the partner's AS2 id to ours,
        answer a delivery of this partner that is AWAITING_MDN and carry the MIC we computed. A
        processed MDN marks the delivery DELIVERED and its messages SENT (with
        dev.passage.edi.message.sent.v1); an error disposition marks it REJECTED.
      x-passage-duty: none (partner authenticated by its AS2 signature)
      security: []
      parameters:
        - name: endpoint
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/signed: { schema: { type: string, format: binary } }
      responses:
        '200': { description: MDN applied }
        '400': { description: Not a signed MDN of the partner, or its MIC or Message-ID does not match }
        '403': { description: AS2-From or AS2-To do not match the endpoint }
        '404': { description: Unknown endpoint, or no delivery waits for this MDN }
        '413': { description: Body above 1 MiB }
  /edi/v1/messages:
    get:
      operationId: listMessages
      summary: Message monitor — every stored transaction, newest first
      description: >
        Filters combine. Pages are keyset pages: pass nextCursor back as cursor to continue; it is
        absent on the last page. Rows carry no canonical document and never the raw payload.
      x-passage-duty: edi.operate
      parameters:
        - name: partnerId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [IN, OUT] }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/MessageStatus' }
        - name: transactionSet
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9]{3}$' }
        - name: controlNumber
          in: query
          required: false
          description: ISA13 of the interchange; shorter values are zero-padded to nine digits
          schema: { type: string, pattern: '^[0-9]{1,9}$' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: One page of messages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MonitorMessage' }
                  nextCursor: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /edi/v1/messages/{id}:
    get:
      operationId: getMessage
      summary: Read one message with its envelope and canonical document
      description: >
        The raw payload is not returned (BR-35.12). Party names in the canonical document are
        replaced by "***" unless the caller holds edi.pii.view; piiMasked says which view was served.
      x-passage-duty: edi.operate
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The message
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MonitorMessage'
                  - type: object
                    required: [piiMasked]
                    properties:
                      canonical: { type: object, description: 'Canonical document by transaction set, as on InterchangeDetail' }
                      piiMasked: { type: boolean, description: true when party names were masked (no edi.pii.view) }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /edi/v1/partners/sla:
    get:
      operationId: partnerSla
      summary: Partner SLA dashboard — volume, failure rate and 997 latency per partner
      description: >
        Partners with traffic in the last `days` days, by name. Ack latency is measured on our
        outbound interchanges from recording to the matched partner 997; lateAcks were matched after
        the profile's ackSlaMinutes and overdueAcks are still waiting past it.
      x-passage-duty: edi.operate
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: One row per partner with traffic
          content:
            application/json:
              schema:
                type: object
                required: [days, items]
                properties:
                  days: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PartnerSla' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /edi/v1/maps:test:
    post:
      operationId: testMaps
      summary: Run the mapping over a sample interchange without persisting anything
      x-passage-duty: edi.admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raw]
              properties:
                raw: { type: string, description: Raw X12 interchange text }
      responses:
        '200':
          description: One entry per transaction set
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items: { $ref: '#/components/schemas/MapResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /edi/v1/inbound/x12:
    post:
      operationId: receiveX12
      summary: Receive one raw X12 interchange from a partner
      description: >
        Identifies the partner by ISA sender, rejects duplicate ISA13 values inside the
        duplicate window (EDI-0102), records every transaction and returns the 997 generated in the
        same transaction. Unknown senders are EDI-0101. A 997 group (GS01 FA) from the partner is
        matched by AK102 to the outbound interchange with that control number: answered messages
        become ACKED (AK5 A/E) or FAILED (AK5 R), the outbound interchange takes the AK9 status and
        dev.passage.edi.message.acked.v1 is published per answered message. The 997 itself is
        POSTED, or FAILED with EDI-0161 when it answers nothing; 997s are never acknowledged, so
        ack997 is absent for an interchange of 997s only.
      x-passage-duty: edi.operate
      parameters:
        - name: environment
          in: query
          required: false
          schema: { type: string, enum: [TEST, PROD], default: PROD }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        '201':
          description: Interchange recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiveResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /edi/v1/punchout/returns:parse:
    post:
      operationId: checkPunchoutReturn
      summary: Dry run of a returned punchout cart against BR-35.13
      description: >
        Parses a cXML PunchOutOrderMessage (format CXML, document) or an SAP OCI HOOK_URL form post
        (format OCI, fields) and reports the requisition lines that would be created. Lines with a
        missing part id, quantity, price, allowed currency or UoM are dropped with EDI-0133. A cart
        whose stated total differs from the line sum by more than 0.01 is rejected with EDI-0134.
        OCI fields follow SAP OCI 4.0/5.0 (VENDORMAT, DESCRIPTION, QUANTITY, UNIT, PRICE, PRICEUNIT,
        CURRENCY, LEADTIME, EXT_SCHEMA_TYPE and EXT_CATEGORY_ID for UNSPSC). A document that is not a
        PunchOutOrderMessage, or an OCI post without NEW_ITEM fields, is EDI-0003. Nothing is stored and
        no requisition is created (the wave-17 handoff).
      x-passage-duty: edi.requisition.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, supplier]
              properties:
                format: { type: string, enum: [CXML, OCI] }
                document: { type: string, description: 'cXML PunchOutOrderMessage, required for CXML' }
                fields:
                  type: object
                  additionalProperties: { type: string }
                  description: NEW_ITEM-FIELD[n] pairs from the OCI form post, required for OCI
                supplier:
                  type: object
                  properties:
                    currencies: { type: array, items: { type: string } }
                    tolerancePct: { type: string, description: Decimal 0..20; lines above reference price plus this are flagged }
                    uomMap: { type: object, additionalProperties: { type: string }, description: Supplier unit to UN/ECE Rec 20 code }
                    referencePrices: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: Lines that would be created, the issues and the cart total check
          content:
            application/json:
              schema:
                type: object
                required: [lines, issues, cartRejected, computedTotal]
                properties:
                  lines:
                    type: array
                    items:
                      type: object
                      required: [line, supplierPartId, description, quantity, unitCode, unitPrice, currency, unspsc, leadTimeDays, catalog, needsApproval]
                      properties:
                        line: { type: integer }
                        supplierPartId: { type: string }
                        description: { type: string }
                        quantity: { type: string, description: Decimal }
                        unitCode: { type: string, description: UN/ECE Recommendation 20 code }
                        unitPrice: { type: string, description: Decimal price per unit }
                        currency: { type: string }
                        unspsc: { type: string }
                        leadTimeDays: { type: integer }
                        catalog: { type: boolean, description: Always true; the line is catalog-sourced }
                        needsApproval: { type: boolean, description: Price above the reference price plus tolerance }
                  issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
                  cartRejected: { type: boolean }
                  computedTotal: { type: string }
                  statedTotal: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /edi/v1/self-billing:match:
    post:
      operationId: matchSelfBilling
      summary: Dry run of the self-billing match (BR-35.15) over supplied shipments and lines
      description: >
        Matches each self-billed line to the first unclaimed shipment with the same delivery note,
        PO line and item. Quantity or unit price beyond tolerance, or tax differing by more than 0.01
        from the VAT recomputed at the shipment's rate on the line as billed, is a DIFFERENCE
        (EDI-0136). A line without a shipment is UNMATCHED (EDI-0137). A shipment still unbilled
        waitDays after shipping is reported (EDI-0138). Out-of-range waitDays, negative tolerances,
        malformed numbers or dates and missing ids are EDI-0001. Nothing is posted.
      x-passage-duty: edi.self-billing.reconcile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                asOf: { type: string, format: date, description: Reconciliation date; defaults to today }
                waitDays: { type: integer, minimum: 1, maximum: 120, default: 30 }
                tolerance:
                  type: object
                  properties:
                    quantity: { type: string, default: '0' }
                    price: { type: string, default: '0.01' }
                shipments:
                  type: array
                  maxItems: 5000
                  items:
                    type: object
                    required: [id, deliveryNote, poLine, item, quantity, unitPrice, taxRatePct, shippedOn]
                    properties:
                      id: { type: string }
                      deliveryNote: { type: string }
                      poLine: { type: string }
                      item: { type: string }
                      quantity: { type: string }
                      unitPrice: { type: string }
                      taxRatePct: { type: string }
                      shippedOn: { type: string, format: date }
                lines:
                  type: array
                  maxItems: 5000
                  items:
                    type: object
                    required: [line, deliveryNote, poLine, item, quantity, unitPrice, tax]
                    properties:
                      line: { type: string }
                      deliveryNote: { type: string }
                      poLine: { type: string }
                      item: { type: string }
                      quantity: { type: string }
                      unitPrice: { type: string }
                      tax: { type: string, description: VAT amount the customer computed for the line }
      responses:
        '200':
          description: Outcome per line, shipments past the wait period and the issues raised
          content:
            application/json:
              schema:
                type: object
                required: [lines, unbilled, issues]
                properties:
                  lines:
                    type: array
                    items:
                      type: object
                      required: [line, outcome]
                      properties:
                        line: { type: string }
                        outcome: { type: string, enum: [MATCHED, DIFFERENCE, UNMATCHED] }
                        shipmentId: { type: string }
                        differences:
                          type: array
                          items:
                            type: object
                            required: [field, theirs, ours]
                            properties:
                              field: { type: string, enum: [quantity, unitPrice, tax] }
                              theirs: { type: string }
                              ours: { type: string }
                  unbilled: { type: array, items: { type: string }, description: Shipment ids past the wait period }
                  issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /edi/v1/peppol/invoices:build:
    post:
      operationId: buildPeppolInvoice
      summary: Build Peppol BIS Billing 3.0 UBL 2.1 for an invoice or credit note, without sending it
      description: >
        Checks the BR-35.4 required elements, the VAT category rules that need no schematron (rate 0
        for Z, E, AE, K, G and no rate for O, an exemption reason for E, AE, K, G and O, the supplier VAT
        identifier with every category but O, both VAT identifiers with AE and K, O alone and without
        VAT identifiers, the delivery date and country with K), the GLN (0088) and Norwegian
        organisation number (0192) check digits, the Peppol rules for a German supplier and customer
        (seller contact, city and post code, buyer reference) and the arithmetic rules, then returns
        the UBL XML. There is one VAT breakdown per category and rate; document allowances and charges
        lower or raise the taxable amount of their category and rate. A credit note carries the due
        date as PaymentMeans/PaymentDueDate. Blocking issues (EINV-0110, EINV-0111) come back with
        valid false and no XML. Nothing is stored; schematron validation and transmission through the
        access point are not part of this route.
      x-passage-duty: edi.einvoice.operate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, issueDate, dueDate, currency, supplier, customer, iban, lines]
              properties:
                creditNote: { type: boolean, default: false }
                id: { type: string }
                issueDate: { type: string, format: date }
                dueDate: { type: string, format: date }
                currency: { type: string, minLength: 3, maxLength: 3 }
                buyerReference: { type: string, description: BuyerReference or orderReference is required }
                orderReference: { type: string }
                supplier: { $ref: '#/components/schemas/UBLParty' }
                customer: { $ref: '#/components/schemas/UBLParty' }
                paymentMeansCode: { type: string, enum: ['30', '58'], default: '30' }
                iban: { type: string }
                prepaid: { type: string, description: Decimal amount already paid }
                exemptionReasons:
                  type: object
                  additionalProperties: { type: string }
                  description: TaxExemptionReason per VAT category code
                deliveryDate: { type: string, format: date, description: 'ActualDeliveryDate (BT-72); required with category K (BR-IC-11)' }
                deliveryCountry: { type: string, description: 'Deliver-to country (BT-80); required with category K (BR-IC-12)' }
                allowanceCharges:
                  type: array
                  maxItems: 5000
                  items:
                    type: object
                    required: [reason, amount, category, percent]
                    properties:
                      charge: { type: boolean, default: false, description: true for a charge, false for an allowance }
                      reason: { type: string }
                      amount: { type: string, description: Positive decimal }
                      category: { type: string, enum: [S, Z, E, AE, K, G, O, L, M] }
                      percent: { type: string }
                lines:
                  type: array
                  maxItems: 5000
                  items:
                    type: object
                    required: [id, name, unitCode, quantity, unitPrice, category, percent]
                    properties:
                      id: { type: string }
                      name: { type: string }
                      unitCode: { type: string, description: UN/ECE Recommendation 20 code }
                      quantity: { type: string }
                      unitPrice: { type: string }
                      category: { type: string, enum: [S, Z, E, AE, K, G, O, L, M] }
                      percent: { type: string }
      responses:
        '200':
          description: The UBL when valid is true, otherwise the blocking issues and an empty xml
          content:
            application/json:
              schema:
                type: object
                required: [xml, issues, valid]
                properties:
                  xml: { type: string }
                  issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
                  valid: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    AckStatus:
      type: string
      enum: [PENDING, ACCEPTED, ACCEPTED_WITH_ERRORS, REJECTED, TIMEOUT]
    MessageStatus:
      type: string
      enum: [RECEIVED, MAPPED, POSTED, FAILED, SENT, ACKED]
    MonitorMessage:
      type: object
      required: [id, interchangeId, partnerId, partnerName, direction, standard, controlNumber, ackStatus, transactionSet, stControl, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        interchangeId: { type: string, format: uuid }
        partnerId: { type: string, format: uuid }
        partnerName: { type: string }
        direction: { type: string, enum: [IN, OUT] }
        standard: { type: string, enum: [X12, EDIFACT, UBL, CXML] }
        controlNumber: { type: string, description: ISA13 of the interchange }
        ackStatus: { $ref: '#/components/schemas/AckStatus' }
        transactionSet: { type: string }
        stControl: { type: string }
        status: { $ref: '#/components/schemas/MessageStatus' }
        error: { type: string }
        createdAt: { type: string, format: date-time }
    ReprocessResult:
      type: object
      required: [interchangeId, dryRun, changed, messages]
      properties:
        interchangeId: { type: string, format: uuid }
        dryRun: { type: boolean }
        changed: { type: integer, description: transactions whose status or error changed }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ReprocessedMessage' }
    ReprocessedMessage:
      type: object
      required: [messageId, transactionSet, stControl, status, changed]
      properties:
        messageId: { type: string, format: uuid }
        transactionSet: { type: string }
        stControl: { type: string }
        previousError: { type: string }
        status: { type: string, enum: [MAPPED, FAILED] }
        error: { type: string }
        changed: { type: boolean }
    BulkReprocessResult:
      type: object
      required: [dryRun, requested, changed, items]
      properties:
        dryRun: { type: boolean }
        requested: { type: integer }
        changed: { type: integer, description: sum of the items' changed }
        items:
          type: array
          items:
            type: object
            required: [interchangeId, outcome, changed, messages]
            properties:
              interchangeId: { type: string, format: uuid }
              outcome: { type: string, enum: [REPROCESSED, NOT_FOUND, NOT_INBOUND, UNREADABLE] }
              error: { type: string }
              changed: { type: integer }
              messages:
                type: array
                description: As ReprocessResult.messages; empty unless the outcome is REPROCESSED
                items: { $ref: '#/components/schemas/ReprocessedMessage' }
    PayloadTree:
      type: object
      required: [interchangeId, direction, piiMasked, tree]
      properties:
        interchangeId: { type: string, format: uuid }
        direction: { type: string, enum: [IN, OUT] }
        piiMasked: { type: boolean, description: true when the caller lacks edi.pii.view }
        tree: { $ref: '#/components/schemas/SegmentNode' }
    SegmentNode:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [interchange, group, transaction, segment] }
        name: { type: string, description: 'Segment id: ISA, GS, ST or the body segment' }
        elements:
          type: array
          items:
            type: object
            required: [ref, value]
            properties:
              ref: { type: string, description: 'X12 reference, segment id plus position (N102)' }
              name: { type: string, description: X12 dictionary name; absent when not in the dictionary }
              value: { type: string }
              masked: { type: boolean }
        children:
          type: array
          items: { $ref: '#/components/schemas/SegmentNode' }
    PartnerSla:
      type: object
      required: [partnerId, partnerName, environment, ackSlaMinutes, messages, failed, failureRatePct, outbound, acked, lateAcks, overdueAcks]
      properties:
        partnerId: { type: string, format: uuid }
        partnerName: { type: string }
        environment: { type: string, enum: [TEST, PROD] }
        ackSlaMinutes: { type: integer }
        messages: { type: integer, description: transactions in both directions }
        failed: { type: integer }
        failureRatePct: { type: number, description: failed / messages x 100, two decimals }
        outbound: { type: integer, description: outbound interchanges recorded }
        acked: { type: integer, description: outbound interchanges with the partner 997 matched }
        p95AckMinutes: { type: number, description: 95th percentile 997 latency in minutes, one decimal; absent when nothing was acked }
        lateAcks: { type: integer }
        overdueAcks: { type: integer }
    UBLParty:
      type: object
      required: [name, endpointScheme, endpointId, countryCode]
      properties:
        name: { type: string }
        legalName: { type: string, description: PartyLegalEntity/RegistrationName; defaults to name }
        endpointScheme: { type: string, description: 'EAS code, e.g. 0088 (GLN)' }
        endpointId: { type: string }
        countryCode: { type: string, description: ISO 3166-1 alpha-2 }
        vatId: { type: string, description: 'Required with every VAT category except O; must be absent with O (BR-O-02)' }
        legalId: { type: string, description: 'PartyLegalEntity/CompanyID; a supplier needs it or vatId (BR-CO-26)' }
        streetName: { type: string }
        cityName: { type: string, description: Required for both parties when supplier and customer are in Germany (DE-R-003, DE-R-008) }
        postalZone: { type: string, description: Required for both parties when supplier and customer are in Germany (DE-R-004, DE-R-009) }
        contactName: { type: string, description: Seller contact; name, phone and email are required when supplier and customer are in Germany (DE-R-002) }
        contactPhone: { type: string }
        contactEmail: { type: string }
    Issue:
      type: object
      required: [code, detail, reject]
      properties:
        code: { type: string }
        detail: { type: string }
        reject: { type: boolean, description: true makes the 997 AK5 code R }
    InterchangeSummary:
      type: object
      required: [id, partnerId, partnerName, direction, standard, version, controlNumber, ackStatus, receivedAt, messageCount, failedCount]
      properties:
        id: { type: string, format: uuid }
        partnerId: { type: string, format: uuid }
        partnerName: { type: string }
        direction: { type: string, enum: [IN, OUT] }
        standard: { type: string, enum: [X12, EDIFACT, UBL, CXML] }
        version: { type: string }
        controlNumber: { type: string }
        ackStatus: { $ref: '#/components/schemas/AckStatus' }
        receivedAt: { type: string, format: date-time }
        messageCount: { type: integer }
        failedCount: { type: integer }
    InterchangeDetail:
      allOf:
        - $ref: '#/components/schemas/InterchangeSummary'
        - type: object
          required: [messages]
          properties:
            ack997: { type: string, description: Serialized X12 997 sent back to the partner }
            messages:
              type: array
              items:
                type: object
                required: [id, transactionSet, stControl, status]
                properties:
                  id: { type: string, format: uuid }
                  transactionSet: { type: string }
                  stControl: { type: string }
                  status: { type: string, enum: [RECEIVED, MAPPED, POSTED, FAILED, SENT, ACKED] }
                  canonical: { type: object, description: 'Canonical document: 850 Order, 997 FunctionalAck, outbound 855 Ack855, 856 ASN or 810 Invoice' }
                  error: { type: string }
            deliveries:
              type: array
              description: Deliveries of the interchange (DOCUMENT) or of its 997 (ACK) over the partner's transport, in the caller's legal entities
              items: { $ref: '#/components/schemas/Delivery' }
    PartnerRequest:
      type: object
      additionalProperties: false
      required: [name, isaQualifier, isaId, environment]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        isaQualifier: { type: string, pattern: '^[A-Z0-9]{2}$' }
        isaId: { type: string, pattern: '^[A-Za-z0-9]{1,15}$' }
        environment: { type: string, enum: [TEST, PROD] }
        ackSlaMinutes: { type: integer, minimum: 5, maximum: 1440, default: 60 }
    Partner:
      type: object
      required: [id, name, isaQualifier, isaId, environment, ackSlaMinutes, status, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isaQualifier: { type: string }
        isaId: { type: string }
        environment: { type: string, enum: [TEST, PROD] }
        ackSlaMinutes: { type: integer }
        status: { type: string, enum: [active, inactive] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    MapResult:
      type: object
      required: [transactionSet, stControl, status, issues]
      properties:
        transactionSet: { type: string }
        stControl: { type: string }
        status: { type: string, enum: [MAPPED, FAILED] }
        order: { type: object, description: Canonical order (850 only) }
        issues:
          type: array
          items: { $ref: '#/components/schemas/Issue' }
    ReceiveResponse:
      type: object
      required: [interchangeId, ackStatus, messages]
      properties:
        interchangeId: { type: string, format: uuid }
        ackStatus:
          type: string
          enum: [ACCEPTED, ACCEPTED_WITH_ERRORS, REJECTED]
          description: ACCEPTED_WITH_ERRORS also covers partial acceptance (AK9 P)
        messages:
          type: array
          items:
            type: object
            properties:
              messageId: { type: string, format: uuid }
              transactionSet: { type: string }
              stControl: { type: string }
              status: { type: string, enum: [MAPPED, FAILED, POSTED] }
              error: { type: string }
        ack997: { type: string, description: Serialized X12 997 functional acknowledgment; absent when only 997s were received }
    TradeProfile:
      type: object
      additionalProperties: false
      required: [legalEntityId, customerId, shipFrom, shipTo, billTo, remitTo, defaultScac]
      properties:
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        shipFrom: { $ref: '#/components/schemas/Location' }
        shipTo: { $ref: '#/components/schemas/Location' }
        billTo: { $ref: '#/components/schemas/Location' }
        remitTo: { $ref: '#/components/schemas/Location' }
        defaultScac: { type: string, pattern: '^[A-Z0-9]{2,4}$' }
    SourceOutboundRequest:
      type: object
      additionalProperties: false
      required: [transactionSet, sourceId]
      properties:
        transactionSet: { type: string, enum: ['856', '810'] }
        sourceId: { type: string, format: uuid, description: shipment id for 856, invoice id for 810 }
    OutboundRequest:
      type: object
      additionalProperties: false
      required: [transactionSet, document]
      properties:
        transactionSet: { type: string, enum: ['855', '856', '810', '820', '214'] }
        document:
          description: The canonical document for the set; unknown fields are refused. Decimals are strings.
          oneOf:
            - $ref: '#/components/schemas/Ack855'
            - $ref: '#/components/schemas/ASN'
            - $ref: '#/components/schemas/Invoice'
            - $ref: '#/components/schemas/Remittance'
            - $ref: '#/components/schemas/ShipmentStatus'
    OutboundResult:
      type: object
      required: [interchangeId, messageId, transactionSet, controlNumber, x12]
      properties:
        interchangeId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        transactionSet: { type: string, enum: ['855', '856', '810', '820', '214'] }
        controlNumber: { type: string, description: ISA13, nine digits }
        x12: { type: string, description: The serialized interchange }
        delivery:
          description: The queued delivery when the partner has an AS2 or SFTP transport in the caller's legal entities
          allOf: [{ $ref: '#/components/schemas/Delivery' }]
    Delivery:
      type: object
      required: [id, payloadKind, transport, messageId, status, attempts, createdAt]
      properties:
        id: { type: string, format: uuid }
        payloadKind: { type: string, enum: [DOCUMENT, ACK] }
        transport: { type: string, enum: [AS2, SFTP] }
        messageId: { type: string, description: AS2 Message-ID without angle brackets }
        status:
          type: string
          enum: [PENDING, AWAITING_MDN, DELIVERED, REJECTED, FAILED]
          description: >
            PENDING is due at nextAttemptAt (retries back off from one minute to an hour; FAILED after
            8 attempts); AWAITING_MDN waits for an asynchronous MDN; REJECTED means the partner's MDN
            reported an error (not retried; resend it).
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        mdnDisposition: { type: string }
        mdnSigned: { type: boolean }
        reference: { type: string, description: Original-Message-ID of the MDN, or the remote SFTP path }
        lastError: { type: string }
        sentAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    PartnerTransport:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [API, AS2, SFTP] }
        as2: { $ref: '#/components/schemas/AS2Settings' }
        sftp: { $ref: '#/components/schemas/SFTPSettings' }
    AS2Settings:
      type: object
      required: [partnerAs2Id, ourAs2Id, url, partnerCertificate, signingKeyRef]
      properties:
        partnerAs2Id: { type: string, pattern: '^[A-Za-z0-9._@:-]{1,128}$' }
        ourAs2Id: { type: string, pattern: '^[A-Za-z0-9._@:-]{1,128}$' }
        url: { type: string, format: uri, description: The partner's AS2 URL (https) }
        partnerCertificate: { type: string, description: 'One PEM certificate (RSA of 2048 bits or more, or ECDSA), valid now; RSA when encrypting' }
        signingKeyRef: { type: string, pattern: '^[a-z0-9]([a-z0-9._-]{0,61}[a-z0-9])?$', description: Name of the secret file holding our PEM private key and certificate }
        signingAlgorithm: { type: string, enum: [sha-256, sha-384, sha-512], default: sha-256 }
        encryptionAlgorithm: { type: string, enum: [none, aes128-cbc, aes192-cbc, aes256-cbc], default: none }
        mdnMode: { type: string, enum: [sync, async], default: sync }
    SFTPSettings:
      type: object
      required: [host, user, hostKeyFingerprint, authMethod, credentialRef, outboundDir]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
        user: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
        hostKeyFingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$', description: As ssh-keygen -lf prints it; the host key is pinned }
        authMethod: { type: string, enum: [key, password] }
        credentialRef: { type: string, pattern: '^[a-z0-9]([a-z0-9._-]{0,61}[a-z0-9])?$', description: Name of the secret file holding the SSH private key or the password }
        outboundDir: { type: string }
        inboundDir: { type: string, description: Polled when set }
        archiveDir: { type: string, default: processed, description: Subdirectory of inboundDir for handled files }
        failedDir: { type: string, default: failed, description: Subdirectory of inboundDir for parked files }
        pollIntervalSeconds: { type: integer, minimum: 60, maximum: 86400, default: 300 }
    TransportView:
      type: object
      required: [partnerId, legalEntityId, kind, version, updatedAt]
      properties:
        partnerId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        kind: { type: string, enum: [API, AS2, SFTP] }
        as2: { $ref: '#/components/schemas/AS2Settings' }
        sftp: { $ref: '#/components/schemas/SFTPSettings' }
        as2Inbound:
          type: object
          properties:
            endpointId: { type: string, format: uuid }
            url: { type: string, description: The AS2 URL to give the partner (with EDI_AS2_PUBLIC_URL) }
            mdnUrl: { type: string, description: Where the partner posts asynchronous MDNs }
            partnerCertificateSha256: { type: string }
            partnerCertificateNotAfter: { type: string, format: date-time }
        secrets:
          type: object
          description: Per reference field, whether the secret is ok, missing or malformed (never its content)
          additionalProperties:
            type: object
            properties:
              ref: { type: string }
              status: { type: string, enum: [ok, missing, malformed] }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    ItemRef:
      type: object
      additionalProperties: false
      required: [qualifier, value]
      properties:
        qualifier: { type: string, enum: [BP, VP, UP, EN] }
        value: { type: string, minLength: 1 }
    Location:
      type: object
      additionalProperties: false
      required: [name, gln]
      properties:
        name: { type: string }
        gln: { type: string, pattern: '^[0-9]{13}$' }
    Ack855:
      type: object
      additionalProperties: false
      required: [poNumber, poDate, ackDate, ackType]
      properties:
        poNumber: { type: string, description: BAK03 }
        poDate: { type: string, pattern: '^[0-9]{8}$', description: BAK04 CCYYMMDD }
        ackDate: { type: string, pattern: '^[0-9]{8}$', description: BAK09 CCYYMMDD }
        ackType: { type: string, enum: [AD, AC, RD, AK, RJ], description: 'BAK02; AD all lines IA, AC at least one IQ/IR, RD all IR, AK/RJ no lines' }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [lineNo, orderedQty, uom, status, ackQty]
            properties:
              lineNo: { type: string }
              orderedQty: { $ref: '#/components/schemas/Decimal' }
              uom: { type: string }
              status: { type: string, enum: [IA, IQ, IR] }
              ackQty: { $ref: '#/components/schemas/Decimal' }
    ASN:
      type: object
      additionalProperties: false
      required: [shipmentId, shipDate, shipTime, scac, grossWeight, weightUnit, shipFrom, shipTo, orders]
      properties:
        shipmentId: { type: string, minLength: 1, maxLength: 30, description: BSN02 }
        shipDate: { type: string, pattern: '^[0-9]{8}$' }
        shipTime: { type: string, pattern: '^[0-9]{4}$' }
        bol: { type: string, description: REF*BM }
        proNumber: { type: string, description: REF*CN }
        scac: { type: string, minLength: 2, maxLength: 4, description: TD503 }
        grossWeight: { $ref: '#/components/schemas/Decimal' }
        weightUnit: { type: string, enum: [LB, KG] }
        shipFrom: { $ref: '#/components/schemas/Location' }
        shipTo: { $ref: '#/components/schemas/Location' }
        orders:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [poNumber, poDate, packs]
            properties:
              poNumber: { type: string }
              poDate: { type: string, pattern: '^[0-9]{8}$' }
              packs:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [sscc, items]
                  properties:
                    sscc: { type: string, pattern: '^[0-9]{18}$', description: SSCC-18 with a valid GS1 check digit, unique in the notice }
                    items:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        additionalProperties: false
                        required: [lineNo, quantity, uom, itemRefs]
                        properties:
                          lineNo: { type: string }
                          quantity: { $ref: '#/components/schemas/Decimal' }
                          uom: { type: string }
                          itemRefs:
                            type: array
                            minItems: 1
                            items: { $ref: '#/components/schemas/ItemRef' }
    Remittance:
      type: object
      additionalProperties: false
      required: [traceNumber, paymentDate, method, amount, payer, payee, items]
      description: X12 820 payment order / remittance advice. amount (BPR02) must equal the sum of items[].paid.
      properties:
        traceNumber: { type: string, minLength: 1, maxLength: 50, description: TRN02 }
        paymentDate: { type: string, pattern: '^[0-9]{8}$', description: BPR16 }
        method: { type: string, enum: [ACH, CHK, FWT, BOP], description: BPR04 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        amount: { $ref: '#/components/schemas/Decimal' }
        payer: { $ref: '#/components/schemas/Location' }
        payee: { $ref: '#/components/schemas/Location' }
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [invoiceNumber, paid, invoiced, discount]
            properties:
              invoiceNumber: { type: string, minLength: 1, maxLength: 30 }
              invoiceDate: { type: string, pattern: '^[0-9]{8}$' }
              paid: { $ref: '#/components/schemas/Decimal' }
              invoiced: { $ref: '#/components/schemas/Decimal' }
              discount: { $ref: '#/components/schemas/Decimal' }
    ShipmentStatus:
      type: object
      additionalProperties: false
      required: [proNumber, shipmentId, scac, shipFrom, shipTo, events]
      description: X12 214 carrier shipment status, one LX/AT7 loop per event.
      properties:
        proNumber: { type: string, minLength: 1, maxLength: 30, description: B1001 }
        shipmentId: { type: string, minLength: 1, maxLength: 30, description: B1002 }
        scac: { type: string, pattern: '^[A-Z]{2,4}$' }
        bol: { type: string }
        poNumber: { type: string }
        shipFrom: { $ref: '#/components/schemas/Location' }
        shipTo: { $ref: '#/components/schemas/Location' }
        events:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [code, reason, date, time]
            properties:
              code: { type: string, pattern: '^[A-Z0-9]{2}$', description: AT701 status (AF, X6, X1, D1, ...) }
              reason: { type: string, pattern: '^[A-Z0-9]{2}$', description: AT702 reason (NS normal) }
              date: { type: string, pattern: '^[0-9]{8}$' }
              time: { type: string, pattern: '^[0-9]{4}$' }
              city: { type: string }
              state: { type: string }
              country: { type: string }
    Invoice:
      type: object
      additionalProperties: false
      required: [number, date, poNumber, poDate, terms, remitTo, billTo, shipTo, lines, total]
      description: total must equal the line extensions (each rounded to 2 decimals) plus taxes plus charges minus allowances.
      properties:
        number: { type: string, minLength: 1, maxLength: 22 }
        date: { type: string, pattern: '^[0-9]{8}$' }
        poNumber: { type: string }
        poDate: { type: string, pattern: '^[0-9]{8}$' }
        creditNote: { type: boolean, description: BIG07 CR instead of DI }
        shipDate: { type: string, pattern: '^[0-9]{8}$' }
        bol: { type: string }
        terms:
          type: object
          additionalProperties: false
          properties:
            code: { type: string, description: ITD01; empty omits ITD }
            discountPct: { $ref: '#/components/schemas/Decimal' }
            discountDays: { type: string }
            netDays: { type: string }
        remitTo: { $ref: '#/components/schemas/Location' }
        billTo: { $ref: '#/components/schemas/Location' }
        shipTo: { $ref: '#/components/schemas/Location' }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [lineNo, quantity, uom, unitPrice, itemRefs]
            properties:
              lineNo: { type: string }
              quantity: { $ref: '#/components/schemas/Decimal' }
              uom: { type: string }
              unitPrice: { $ref: '#/components/schemas/Decimal' }
              itemRefs:
                type: array
                minItems: 1
                items: { $ref: '#/components/schemas/ItemRef' }
        taxes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, amount, percent]
            properties:
              type: { type: string, enum: [ST, VA, GS] }
              amount: { $ref: '#/components/schemas/Decimal' }
              percent: { $ref: '#/components/schemas/Decimal' }
        charges:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [indicator, code, amount]
            properties:
              indicator: { type: string, enum: [C, A], description: C charge, A allowance }
              code: { type: string, minLength: 1, maxLength: 4, description: 'SAC02, e.g. D240 freight' }
              amount: { $ref: '#/components/schemas/Decimal' }
        total: { $ref: '#/components/schemas/Decimal' }
