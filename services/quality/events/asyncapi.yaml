asyncapi: 3.0.0
info:
  title: Passage Quality events
  version: 0.1.0
  description: |
    Events published by the quality service through the transactional outbox.
    Envelope: CloudEvents 1.0 (tenantid, correlationid, causationid, traceparent,
    actor, sequence, dataschema). Schema evolution is additive only.
defaultContentType: application/cloudevents+json
channels:
  qualityOrder:
    address: passage.quality.order
    messages:
      orderCreated:
        $ref: "#/components/messages/OrderCreated"
  qualityResult:
    address: passage.quality.result
    messages:
      resultRecorded:
        $ref: "#/components/messages/ResultRecorded"
  qualityUsageDecision:
    address: passage.quality.usagedecision
    messages:
      usageDecisionPosted:
        $ref: "#/components/messages/UsageDecisionPosted"
  qualityComplianceList:
    address: passage.quality.compliancelist
    messages:
      complianceListCreated:
        $ref: "#/components/messages/ComplianceListCreated"
  qualityComplianceResult:
    address: passage.quality.complianceresult
    messages:
      complianceResultRecorded:
        $ref: "#/components/messages/ComplianceResultRecorded"
  qualityStabilityStudy:
    address: passage.quality.stabilitystudy
    messages:
      stabilityStudyCreated:
        $ref: "#/components/messages/StabilityStudyCreated"
  qualityNonconformance:
    address: passage.quality.nonconformance
    messages:
      nonconformanceCreated:
        $ref: "#/components/messages/NonconformanceCreated"
  qualityCapa:
    address: passage.quality.capa
    messages:
      capaClosed:
        $ref: "#/components/messages/CAPAClosed"
operations:
  publishOrderCreated:
    action: send
    channel: { $ref: "#/channels/qualityOrder" }
    messages:
      - $ref: "#/channels/qualityOrder/messages/orderCreated"
  publishResultRecorded:
    action: send
    channel: { $ref: "#/channels/qualityResult" }
    messages:
      - $ref: "#/channels/qualityResult/messages/resultRecorded"
  publishUsageDecisionPosted:
    action: send
    channel: { $ref: "#/channels/qualityUsageDecision" }
    messages:
      - $ref: "#/channels/qualityUsageDecision/messages/usageDecisionPosted"
  publishComplianceListCreated:
    action: send
    channel: { $ref: "#/channels/qualityComplianceList" }
    messages:
      - $ref: "#/channels/qualityComplianceList/messages/complianceListCreated"
  publishComplianceResultRecorded:
    action: send
    channel: { $ref: "#/channels/qualityComplianceResult" }
    messages:
      - $ref: "#/channels/qualityComplianceResult/messages/complianceResultRecorded"
  publishStabilityStudyCreated:
    action: send
    channel: { $ref: "#/channels/qualityStabilityStudy" }
    messages:
      - $ref: "#/channels/qualityStabilityStudy/messages/stabilityStudyCreated"
  publishNonconformanceCreated:
    action: send
    channel: { $ref: "#/channels/qualityNonconformance" }
    messages:
      - $ref: "#/channels/qualityNonconformance/messages/nonconformanceCreated"
  publishCAPAClosed:
    action: send
    channel: { $ref: "#/channels/qualityCapa" }
    messages:
      - $ref: "#/channels/qualityCapa/messages/capaClosed"
components:
  messages:
    OrderCreated:
      name: dev.passage.quality.order.created.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/OrderCreatedData"
    ResultRecorded:
      name: dev.passage.quality.result.recorded.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ResultRecordedData"
    UsageDecisionPosted:
      name: dev.passage.quality.usagedecision.posted.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/UsageDecisionPostedData"
    ComplianceListCreated:
      name: dev.passage.quality.compliancelist.created.v1
      contentType: application/cloudevents+json
      summary: A new version of a compliance list; it supersedes the previous version (FR-33.13).
      payload:
        $ref: "#/components/schemas/ComplianceListCreatedData"
    ComplianceResultRecorded:
      name: dev.passage.quality.complianceresult.recorded.v1
      contentType: application/cloudevents+json
      summary: A new result version for an item, list version and region (BR-33.11); sales, shipping and purchasing block or warn on it.
      payload:
        $ref: "#/components/schemas/ComplianceResultRecordedData"
    StabilityStudyCreated:
      name: dev.passage.quality.stabilitystudy.created.v1
      contentType: application/cloudevents+json
      summary: A planned stability study with its pull schedule; the scheduling workflow starts from it (BR-33.14).
      payload:
        $ref: "#/components/schemas/StabilityStudyCreatedData"
    NonconformanceCreated:
      name: dev.passage.quality.nonconformance.created.v1
      contentType: application/cloudevents+json
      summary: A nonconformance raised through the API or by a usage decision that rejected quantity (FR-33.6, FR-33.7); the vendor scorecard counts it by severity.
      payload:
        $ref: "#/components/schemas/NonconformanceCreatedData"
    CAPAClosed:
      name: dev.passage.quality.capa.closed.v1
      contentType: application/cloudevents+json
      summary: The 8D correction of a nonconformance closed with an effective check (FR-33.8); the nonconformance is CLOSED.
      payload:
        $ref: "#/components/schemas/CAPAClosedData"
  schemas:
    OrderCreatedData:
      type: object
      required: [quality_order_id, trigger, source_ref, item_id, dims, lot_qty, sample_qty]
      properties:
        quality_order_id: { type: string, format: uuid }
        trigger: { type: string }
        source_ref:
          type: object
          properties:
            type: { type: string }
            id: { type: string, format: uuid }
            line: { type: string }
        item_id: { type: string, format: uuid }
        dims: { type: object, additionalProperties: { type: string } }
        lot_qty: { type: string, description: Decimal string }
        sample_qty: { type: string, description: Decimal string }
    ResultRecordedData:
      type: object
      required: [quality_order_id, results]
      properties:
        quality_order_id: { type: string, format: uuid }
        results:
          type: array
          items:
            type: object
            required: [test_id, sample_no, retest_no, passed]
            properties:
              test_id: { type: string, format: uuid }
              sample_no: { type: integer }
              retest_no: { type: integer }
              passed: { type: boolean }
    UsageDecisionPostedData:
      type: object
      required: [quality_order_id, decisions, accept_qty, reject_qty, deviation_qty, user]
      properties:
        quality_order_id: { type: string, format: uuid }
        decisions:
          type: array
          items: { type: string }
        accept_qty: { type: string }
        reject_qty: { type: string }
        deviation_qty: { type: string }
        user: { type: string }
        ncr_id: { type: string, format: uuid, description: The nonconformance raised for the rejected quantity, when there is one. }
    ComplianceListCreatedData:
      type: object
      required: [list_id, code, version, kind, block_mode, regions, cas_count]
      properties:
        list_id: { type: string, format: uuid }
        code: { type: string }
        version: { type: integer }
        kind: { type: string, enum: [RESTRICTED, REPORTING] }
        block_mode: { type: string, enum: [BLOCK, WARN] }
        regions: { type: array, items: { type: string } }
        cas_count: { type: integer }
    ComplianceResultRecordedData:
      type: object
      required: [item_id, list_code, list_version, region, version, composition_version, restricted, code, severity, hits]
      properties:
        item_id: { type: string, format: uuid }
        list_code: { type: string }
        list_version: { type: integer }
        region: { type: string }
        version: { type: integer }
        composition_version: { type: integer }
        restricted: { type: boolean }
        code: { type: string, description: "QM-0121, QM-0122 or empty when nothing is over its threshold" }
        severity: { type: string, description: "error, warning or empty" }
        hits:
          type: array
          items:
            type: object
            required: [cas, percent_ww, threshold_pct]
            properties:
              cas: { type: string }
              percent_ww: { type: string, description: Decimal string }
              threshold_pct: { type: string, description: Decimal string }
    StabilityStudyCreatedData:
      type: object
      required: [study_id, item_id, batch_id, condition, start_date, pulls]
      properties:
        study_id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        batch_id: { type: string }
        condition: { type: string }
        start_date: { type: string, format: date }
        pulls:
          type: array
          items:
            type: object
            required: [months, pull_date, order_date, test_group_id]
            properties:
              months: { type: integer }
              pull_date: { type: string, format: date }
              order_date: { type: string, format: date }
              test_group_id: { type: string, format: uuid }
    NonconformanceCreatedData:
      type: object
      required: [ncr_id, source, severity, problem_type, item_id, qty, uom]
      properties:
        ncr_id: { type: string, format: uuid }
        source: { type: string, enum: [CUSTOMER, VENDOR, INTERNAL, PRODUCTION, SERVICE] }
        severity: { type: string, enum: [MINOR, MAJOR, CRITICAL] }
        problem_type: { type: string }
        item_id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        qty: { type: string, description: Decimal string }
        uom: { type: string }
        quality_order_id: { type: string, format: uuid }
    CAPAClosedData:
      type: object
      required: [ncr_id, correction_id, effectiveness_result, reopened, closed_at]
      properties:
        ncr_id: { type: string, format: uuid }
        correction_id: { type: string, format: uuid }
        effectiveness_result: { type: string, enum: [EFFECTIVE] }
        reopened: { type: integer, description: Times a NOT_EFFECTIVE check sent the 8D back to D4. }
        closed_at: { type: string, format: date-time }
