openapi: 3.1.0
info:
  title: Passage Quality API
  version: 0.1.0
  description: |
    Quality management (PSG-33). Slice 1: test groups, instruments, quality
    associations, sampling (ANSI/ASQ Z1.4 Table I and II-A excerpt), quality
    orders, result recording and usage decisions. Slice 2: product compliance
    lists, item compositions and their evaluation, stability studies and SPC
    charts. Errors are RFC 9457 problem
    details (application/problem+json) with a stable `code`; see README.md.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env: { default: dev }
security:
  - bearerAuth: []
tags:
  - name: setup
  - name: orders
  - name: system
  - name: compliance
  - name: stability
  - name: spc
  - name: nonconformance
  - name: certificates
  - name: samples
paths:
  /readyz:
    get:
      tags: [system]
      operationId: readyz
      x-passage-duty: none
      summary: Readiness (own Postgres reachable within 500 ms)
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /v1/quality/sampling-plans:size:
    post:
      tags: [orders]
      operationId: sizeSample
      x-passage-duty: QM_VIEW
      summary: Compute the sample draw for a lot quantity and plan (no side effects)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SizeRequest" }
      responses:
        "200":
          description: Sample draw
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleDraw" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/quality/test-groups:
    get:
      tags: [setup]
      operationId: listTestGroups
      x-passage-duty: QM_VIEW
      summary: Test group versions, newest version of each code first
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TestGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [setup]
      operationId: createTestGroup
      x-passage-duty: QM_SETUP_MAINTAIN
      summary: Create a new immutable version of a test group
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestGroupRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestGroup" }
        "200":
          description: Idempotent replay of a completed request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/quality/test-groups/{id}:
    get:
      tags: [setup]
      operationId: getTestGroup
      x-passage-duty: QM_VIEW
      summary: Read one test group version
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Test group version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestGroup" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/quality/instruments:
    get:
      tags: [setup]
      operationId: listInstruments
      x-passage-duty: QM_VIEW
      summary: Instruments with their calibration status (BR-33.8), soonest due first
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Instrument" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [setup]
      operationId: createInstrument
      x-passage-duty: QM_SETUP_MAINTAIN
      summary: Register an instrument with a calibration interval (BR-33.8)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstrumentRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instrument" }
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instrument" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/quality/instruments/{id}:calibrate:
    post:
      tags: [setup]
      operationId: calibrateInstrument
      x-passage-duty: QM_SETUP_MAINTAIN
      summary: Record a calibration and move the due date on by the interval (BR-33.8)
      description: Idempotent by value; recording the same calibration time again changes nothing. A time in the future or before the recorded calibration is refused.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [calibratedAt]
              properties:
                calibratedAt: { type: string, format: date-time }
      responses:
        "200":
          description: Instrument with its new due date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instrument" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/quality/associations:
    get:
      tags: [setup]
      operationId: listAssociations
      x-passage-duty: QM_VIEW
      summary: Every quality association of the tenant, by sequence
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Association" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [setup]
      operationId: createAssociation
      x-passage-duty: QM_SETUP_MAINTAIN
      summary: Create a quality association (trigger to test group and sampling)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Association" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Association" }
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Association" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/quality/quality-orders:
    get:
      tags: [orders]
      operationId: listOrders
      x-passage-duty: QM_VIEW
      summary: Quality order worklist, newest first (section 6.33.14)
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: siteId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [orders]
      operationId: createOrder
      x-passage-duty: QM_ORDER_MAINTAIN
      summary: Create a quality order (manual, or from the best matching association)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "200":
          description: Idempotent replay
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/quality/quality-orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      x-passage-duty: QM_VIEW
      summary: Read a quality order with its test group, results, evaluation and decision
      parameters:
        - { $ref: "#/components/parameters/OrderId" }
      responses:
        "200":
          description: Order view
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderView" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/quality/quality-orders/{id}/results:
    post:
      tags: [orders]
      operationId: recordResults
      x-passage-duty: QM_RESULTS_RECORD
      summary: Record a batch of 1 to 1,000 results (variable or attribute)
      description: |
        A pending order (PENDING_DECISION) accepts only retests (retestNo above 0,
        each following the previous retest of the same test and sample); a closed
        order answers 409 QM-0109. A replayed Idempotency-Key answers 200 with the
        order as it is now and writes nothing.
      parameters:
        - { $ref: "#/components/parameters/OrderId" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResultsRequest" }
      responses:
        "201":
          description: Batch applied
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderView" }
        "200":
          description: Idempotent replay
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderView" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/quality/quality-orders/{id}:usage-decision:
    post:
      tags: [orders]
      operationId: postUsageDecision
      x-passage-duty: QM_USAGE_DECISION
      summary: Post a usage decision whose line quantities sum to the lot quantity
      parameters:
        - { $ref: "#/components/parameters/OrderId" }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionRequest" }
      responses:
        "201":
          description: Decision posted
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionResponse" }
        "200":
          description: Idempotent replay of the stored decision
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/quality/quality-orders/{id}/certificates:
    get:
      tags: [certificates]
      operationId: listCertificates
      x-passage-duty: QM_VIEW
      summary: List an order's certificate receipts and waivers with its gate status
      parameters:
        - { $ref: "#/components/parameters/OrderId" }
      responses:
        "200":
          description: Certificate records, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateList" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [certificates]
      operationId: recordCertificate
      x-passage-duty: QM_RESULTS_RECORD
      summary: Record an incoming vendor certificate (FR-33.15)
      description: |
        Values are checked against the order's test group (BR-33.13): a required test
        without a value, or any value outside its limits, makes the receipt
        RECEIVED_NOK and raises a MAJOR VENDOR nonconformance for the lot in the same
        transaction (problem type CERTIFICATE_NOK, nonconformance.created). A COC
        without values is a conformance statement and is in specification. A closed
        order answers 409 QM-0109, a cancelled one 409 QM-0115. A replayed
        Idempotency-Key answers 200 with the stored record; the key used on another
        order answers 422 idempotency_key_reuse.
      parameters:
        - { $ref: "#/components/parameters/OrderId" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateRequest" }
      responses:
        "201":
          description: Certificate recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateRecordView" }
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateRecordView" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/quality/quality-orders/{id}/certificates:waive:
    post:
      tags: [certificates]
      operationId: waiveCertificate
      x-passage-duty: QM_USAGE_DECISION
      summary: Waive the order's required certificate with a reason
      description: |
        The certificate status becomes WAIVED and an accepting decision is no longer
        gated (BR-33.13). An order that requires no certificate answers 409 QM-0180.
      parameters:
        - { $ref: "#/components/parameters/OrderId" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "201":
          description: Waiver recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateRecordView" }
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateRecordView" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/quality/samples:
    get:
      tags: [samples]
      operationId: listSamples
      x-passage-duty: QM_VIEW
      summary: List physical samples, newest first
      parameters:
        - { name: qualityOrderId, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          description: DUE_FOR_DISPOSAL lists samples whose retention expiry is today (UTC) or earlier (AC-33.18).
          schema: { $ref: "#/components/schemas/SampleStatus" }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Samples
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Sample" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [samples]
      operationId: registerSample
      x-passage-duty: QM_RESULTS_RECORD
      summary: Register a physical sample of a quality order (FR-33.20)
      description: |
        The sample takes the order's unit. A RESERVE (retention) sample needs the batch
        expiry; its retention expiry is that date plus retentionYears (default 1,
        21 CFR 211.170). A POOLED sample names PRIMARY samples of the same order
        (422 QM-0181). PRIMARY and RESERVE quantities together may not exceed the lot
        (422 QM-0182). A cancelled order answers 409 QM-0115.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleRequest" }
      responses:
        "201":
          description: Sample registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sample" }
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sample" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/quality/compliance-lists:
    get:
      tags: [compliance]
      operationId: listComplianceLists
      x-passage-duty: QM_VIEW
      summary: Compliance list versions by code, newest version first (FR-33.13)
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ComplianceList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [compliance]
      operationId: createComplianceList
      x-passage-duty: QM_COMPLIANCE_MAINTAIN
      summary: Create the next version of a regulated, restricted or reporting list (FR-33.13)
      description: The service numbers versions per code; the highest version is the one evaluated. Writes dev.passage.quality.compliancelist.created.v1.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplianceListRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceList" }
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/quality/items/{id}/composition:
    get:
      tags: [compliance]
      operationId: getComposition
      x-passage-duty: QM_VIEW
      summary: The item's current declared composition
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Current version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Composition" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [compliance]
      operationId: saveComposition
      x-passage-duty: QM_COMPLIANCE_MAINTAIN
      summary: Save a new version of the item's composition (substances by CAS number and BOM parts by mass fraction)
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompositionRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Composition" }
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Composition" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/quality/items/{id}:evaluate-compliance:
    post:
      tags: [compliance]
      operationId: evaluateCompliance
      x-passage-duty: QM_VIEW
      summary: Roll the composition up through its parts and evaluate it against every current list for a region (BR-33.11)
      description: |
        Idempotent by value, so no Idempotency-Key is needed. A result version is stored, and
        dev.passage.quality.complianceresult.recorded.v1 written, only when the outcome of an
        (item, list version, region) changes. Lists that do not name the region are left out.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region]
              properties:
                region: { type: string, pattern: "^[A-Z][A-Z0-9-]{1,9}$", example: EU }
      responses:
        "200":
          description: Evaluation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceEvaluation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/quality/stability-studies:
    get:
      tags: [stability]
      operationId: listStudies
      x-passage-duty: QM_VIEW
      summary: Stability studies, newest first
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/StudyStatus" } }
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Study" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [stability]
      operationId: createStudy
      x-passage-duty: QM_STABILITY_MAINTAIN
      summary: Plan a stability study and generate its pull schedule (FR-33.16, BR-33.14)
      description: Writes dev.passage.quality.stabilitystudy.created.v1, from which the scheduling workflow starts.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Study" }
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Study" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/quality/stability-studies/{id}:
    get:
      tags: [stability]
      operationId: getStudy
      x-passage-duty: QM_VIEW
      summary: One stability study with its pull points
      parameters:
        - $ref: "#/components/parameters/StudyId"
      responses:
        "200":
          description: Study
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Study" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/quality/spc:
    get:
      tags: [spc]
      operationId: getSpcChart
      x-passage-duty: QM_VIEW
      summary: SPC chart for one item and test from first-attempt results (FR-33.11)
      description: |
        Each quality order is one subgroup (variable test, X-bar/R) or one sample (attribute
        test, p chart, plus np when sample sizes are constant). Control limits come from the
        last 25 subgroups; Western Electric rules 1 to 4 are flagged. No results yet answers
        chart NONE.
      parameters:
        - { name: itemId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: testId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: orders, in: query, description: Newest quality orders to chart., schema: { type: integer, minimum: 2, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Chart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SPCResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/quality/nonconformances:
    get:
      tags: [nonconformance]
      operationId: listNonconformances
      x-passage-duty: QM_VIEW
      summary: Nonconformances, newest first (NCR and CAPA status inquiry)
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/NcrStatus" } }
        - { name: source, in: query, schema: { $ref: "#/components/schemas/NcrSource" } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/NcrSeverity" } }
        - { name: qualityOrderId, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List; the correction is not included.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Nonconformance" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [nonconformance]
      operationId: createNonconformance
      x-passage-duty: QM_NCR_MAINTAIN
      summary: Raise a nonconformance (FR-33.7)
      description: |
        Starts in NEW and writes dev.passage.quality.nonconformance.created.v1. With
        qualityOrderId the item, dims and unit default to the order's, the item must be the
        order's and qty at most its lot quantity; an NCR on a closed order amends its
        decision (BR-33.4). A usage decision that rejects quantity raises one itself.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NcrRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nonconformance" }
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nonconformance" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/quality/nonconformances/{id}:
    get:
      tags: [nonconformance]
      operationId: getNonconformance
      x-passage-duty: QM_VIEW
      summary: One nonconformance with its 8D correction
      parameters:
        - $ref: "#/components/parameters/NcrId"
      responses:
        "200":
          description: Nonconformance
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nonconformance" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/quality/nonconformances/{id}:approve:
    post:
      tags: [nonconformance]
      operationId: approveNonconformance
      x-passage-duty: QM_NCR_MAINTAIN
      summary: Approve a NEW nonconformance
      parameters:
        - $ref: "#/components/parameters/NcrId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nonconformance" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/quality/nonconformances/{id}:refuse:
    post:
      tags: [nonconformance]
      operationId: refuseNonconformance
      x-passage-duty: QM_NCR_MAINTAIN
      summary: Refuse a NEW nonconformance with a reason (final)
      parameters:
        - $ref: "#/components/parameters/NcrId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nonconformance" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/quality/nonconformances/{id}/corrections:
    post:
      tags: [nonconformance]
      operationId: startCorrection
      x-passage-duty: QM_CAPA_MAINTAIN
      summary: Start the 8D correction of an APPROVED nonconformance (FR-33.8)
      description: |
        Moves the NCR to IN_CORRECTION and opens D1. D3 containment is due two business days
        (Monday to Friday) after start and D5 corrective action 30 days after start (BR-33.9).
        A replayed Idempotency-Key answers 200 with the NCR as it is now.
      parameters:
        - $ref: "#/components/parameters/NcrId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectionRequest" }
      responses:
        "201":
          description: Started
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nonconformance" }
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nonconformance" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/quality/nonconformances/{id}:complete-step:
    post:
      tags: [nonconformance]
      operationId: completeCorrectionStep
      x-passage-duty: QM_CAPA_MAINTAIN
      summary: Complete the current 8D step, D1 to D7
      description: Steps complete in order (QM-0173 otherwise). Completing D7 starts the effectiveness timer.
      parameters:
        - $ref: "#/components/parameters/NcrId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepRequest" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nonconformance" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/quality/nonconformances/{id}:check-effectiveness:
    post:
      tags: [nonconformance]
      operationId: checkEffectiveness
      x-passage-duty: QM_CAPA_MAINTAIN
      summary: Record the effectiveness check once it is due
      description: |
        Allowed once effectivenessDueAt has passed (QM-0174), by a user other than the one who
        completed D7 (QM-0175). EFFECTIVE completes D8, closes the correction and the NCR and writes
        dev.passage.quality.capa.closed.v1; NOT_EFFECTIVE reopens the 8D at D4.
      parameters:
        - $ref: "#/components/parameters/NcrId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EffectivenessRequest" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nonconformance" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The resource's ETag from its last read.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: id
      in: path
      required: true
      description: Item (product) id.
      schema: { type: string, format: uuid }
    NcrId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StudyId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    ETag:
      description: Resource version, quoted.
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ready, unavailable] }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: "https://passage.dev/problems/QM-0104" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        serviceCode: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    Decimal:
      type: string
      description: Decimal string; never a JSON number.
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    Method:
      type: string
      enum: [FIXED, PERCENT, AQL]
    Severity:
      type: string
      enum: [NORMAL, TIGHTENED, REDUCED]
    SamplingPlan:
      type: object
      required: [method]
      properties:
        method: { $ref: "#/components/schemas/Method" }
        fixedQty: { $ref: "#/components/schemas/Decimal" }
        percent: { $ref: "#/components/schemas/Decimal" }
        aql: { $ref: "#/components/schemas/Decimal" }
        severity: { $ref: "#/components/schemas/Severity" }
        inspectionLevel: { type: string, enum: [II], description: Only level II is loaded in this slice. }
    SizeRequest:
      allOf:
        - $ref: "#/components/schemas/SamplingPlan"
        - type: object
          required: [lotQty]
          properties:
            lotQty: { $ref: "#/components/schemas/Decimal" }
    SampleDraw:
      type: object
      properties:
        codeLetter: { type: string }
        sampleQty: { $ref: "#/components/schemas/Decimal" }
        acceptNo: { type: integer }
        rejectNo: { type: integer }
        severity: { $ref: "#/components/schemas/Severity" }
        inspectionLevel: { type: string }
    TestLine:
      type: object
      required: [testId, name, kind]
      properties:
        testId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [VARIABLE, ATTRIBUTE] }
        required: { type: boolean }
        decimals: { type: integer, minimum: 0, maximum: 6 }
        min: { $ref: "#/components/schemas/Decimal" }
        max: { $ref: "#/components/schemas/Decimal" }
        passingOutcomeIds:
          type: array
          items: { type: string, format: uuid }
        destructive: { type: boolean }
    TestGroupRequest:
      type: object
      required: [code, tests]
      properties:
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,31}$" }
        tests:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/TestLine" }
    TestGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        version: { type: integer }
        tests:
          type: array
          items: { $ref: "#/components/schemas/TestLine" }
    InstrumentRequest:
      type: object
      required: [code, name, calibrationIntervalDays, lastCalibratedAt]
      properties:
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,31}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        calibrationIntervalDays: { type: integer, minimum: 1, maximum: 3650 }
        lastCalibratedAt: { type: string, format: date-time }
    Instrument:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        calibrationIntervalDays: { type: integer }
        lastCalibratedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time, description: "last + interval (BR-33.8)" }
        calibrationStatus:
          type: string
          enum: [IN_CALIBRATION, DUE_SOON, OVERDUE]
          description: DUE_SOON within 14 days of dueAt (QM-0103 horizon); results from an OVERDUE instrument are refused with QM-0102.
    Association:
      type: object
      required: [trigger, itemScope, partyScope, siteScope, testGroupId, samplingPlan]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        trigger:
          type: string
          enum: [PURCHASE_RECEIPT, PRODUCTION_RAF, SALES_PICK, TRANSFER_RECEIPT, QUARANTINE, SOURCE_INSPECTION]
        itemScope: { type: string, enum: [ITEM, ITEM_GROUP, ALL] }
        itemRef: { type: string, format: uuid }
        partyScope: { type: string, enum: [PARTY, ALL] }
        partyRef: { type: string, format: uuid }
        siteScope: { type: string, enum: [SITE, ALL] }
        siteRef: { type: string, format: uuid }
        sequence: { type: integer, description: Lowest wins on equal specificity (BR-33.3). }
        testGroupId: { type: string, format: uuid }
        samplingPlan: { $ref: "#/components/schemas/SamplingPlan" }
        certificateRequired: { $ref: "#/components/schemas/CertificateRequirement" }
    CertificateRequirement:
      type: string
      enum: [NONE, COA, COC, EN10204_31]
      default: NONE
      description: The vendor certificate an order demands before acceptance (FR-33.15, certificate_required_default).
    SourceRef:
      type: object
      required: [type, id]
      properties:
        type: { type: string, maxLength: 40 }
        id: { type: string, format: uuid }
        line: { type: string }
    OrderRequest:
      type: object
      required: [trigger, sourceRef, itemId, siteId, warehouseId, lotQty, uom]
      properties:
        trigger:
          type: string
          enum: [PURCHASE_RECEIPT, PRODUCTION_RAF, SALES_PICK, TRANSFER_RECEIPT, QUARANTINE, MANUAL, SOURCE_INSPECTION]
        sourceRef: { $ref: "#/components/schemas/SourceRef" }
        itemId: { type: string, format: uuid }
        itemGroupId: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        dims: { type: object, additionalProperties: { type: string } }
        lotQty: { $ref: "#/components/schemas/Decimal" }
        uom: { type: string, maxLength: 10 }
        testGroupId: { type: string, format: uuid, description: Required for MANUAL. }
        samplingPlan:
          allOf:
            - $ref: "#/components/schemas/SamplingPlan"
          description: Required for MANUAL; other triggers take the plan of the best matching association.
        certificateRequired:
          allOf:
            - $ref: "#/components/schemas/CertificateRequirement"
          description: MANUAL only; other triggers take the requirement of the best matching association.
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        trigger: { type: string }
        sourceRef: { $ref: "#/components/schemas/SourceRef" }
        itemId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        dims: { type: object, additionalProperties: { type: string } }
        lotQty: { $ref: "#/components/schemas/Decimal" }
        sampleQty: { $ref: "#/components/schemas/Decimal" }
        uom: { type: string }
        testGroupId: { type: string, format: uuid }
        testGroupVersion: { type: integer }
        samplingMethod: { $ref: "#/components/schemas/Method" }
        severity: { $ref: "#/components/schemas/Severity" }
        codeLetter: { type: string }
        acceptNo: { type: integer }
        rejectNo: { type: integer }
        status: { $ref: "#/components/schemas/OrderStatus" }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        certificateRequired: { $ref: "#/components/schemas/CertificateRequirement" }
    Result:
      type: object
      properties:
        testId: { type: string, format: uuid }
        sampleNo: { type: integer }
        retestNo: { type: integer }
        value: { $ref: "#/components/schemas/Decimal" }
        outcomeId: { type: string, format: uuid }
        passed: { type: boolean }
        instrumentId: { type: string, format: uuid }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
    OrderStatus:
      type: string
      enum: [CREATED, OPEN, RESULTS_IN_PROGRESS, PENDING_DECISION, CLOSED, CANCELLED]
    Evaluation:
      type: object
      description: Computed from the latest retest per test and sample (FR-33.4, BR-33.6).
      required: [defectiveSamples, passed, missingRequired]
      properties:
        defectiveSamples: { type: integer }
        passed: { type: boolean, description: "defectiveSamples <= acceptNo; meaningful once missingRequired is empty" }
        missingRequired:
          type: array
          items: { type: string, format: uuid }
    OrderView:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            testGroup: { $ref: "#/components/schemas/TestGroup" }
            results:
              type: array
              items: { $ref: "#/components/schemas/Result" }
            evaluation: { $ref: "#/components/schemas/Evaluation" }
            certificateStatus: { $ref: "#/components/schemas/CertificateStatus" }
            decision: { $ref: "#/components/schemas/Decision" }
    ResultInput:
      type: object
      required: [testId, sampleNo]
      properties:
        testId: { type: string, format: uuid }
        sampleNo: { type: integer, minimum: 1 }
        retestNo: { type: integer, minimum: 0, default: 0 }
        value: { $ref: "#/components/schemas/Decimal" }
        outcomeId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
    ResultsRequest:
      type: object
      required: [results]
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/ResultInput" }
    DecisionLine:
      type: object
      required: [decision, quantity]
      properties:
        decision:
          type: string
          enum: [ACCEPT, REJECT, ACCEPT_WITH_DEVIATION, REWORK, RETURN_TO_VENDOR, SCRAP]
        quantity: { $ref: "#/components/schemas/Decimal" }
        reason: { type: string, maxLength: 500, description: Required for ACCEPT_WITH_DEVIATION. }
    DecisionRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DecisionLine" }
    Decision:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        lines:
          type: array
          items: { $ref: "#/components/schemas/DecisionLine" }
        split:
          type: object
          properties:
            acceptQty: { $ref: "#/components/schemas/Decimal" }
            rejectQty: { $ref: "#/components/schemas/Decimal" }
            deviationQty: { $ref: "#/components/schemas/Decimal" }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
        nonconformanceId: { type: string, format: uuid, description: NCR raised for the rejected quantity (FR-33.6). }
    DecisionResponse:
      type: object
      properties:
        order: { $ref: "#/components/schemas/OrderView" }
        decision: { $ref: "#/components/schemas/Decision" }
    LimitLine:
      type: object
      required: [cas, thresholdPct]
      properties:
        cas: { type: string, pattern: "^\\d{2,7}-\\d{2}-\\d$", description: CAS number with a valid check digit., example: "117-81-7" }
        name: { type: string, maxLength: 120 }
        thresholdPct: { $ref: "#/components/schemas/Decimal", description: Percent w/w above 0 and at most 100; a concentration strictly above it is a hit. }
    ComplianceListRequest:
      type: object
      required: [code, kind, blockMode, regions, limits]
      properties:
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,31}$", example: REACH-SVHC }
        name: { type: string, maxLength: 120 }
        kind: { type: string, enum: [RESTRICTED, REPORTING] }
        blockMode: { type: string, enum: [BLOCK, WARN], description: Line behaviour on a restricted hit (compliance_block_mode). }
        regions:
          type: array
          minItems: 1
          maxItems: 60
          items: { type: string, pattern: "^[A-Z][A-Z0-9-]{1,9}$", example: EU }
        limits:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: "#/components/schemas/LimitLine" }
    ComplianceList:
      allOf:
        - $ref: "#/components/schemas/ComplianceListRequest"
        - type: object
          required: [id, version]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
    MassPart:
      type: object
      required: [itemId, massFraction]
      properties:
        itemId: { type: string, format: uuid }
        massFraction: { $ref: "#/components/schemas/Decimal", description: Above 0 and at most 1; the parts of an item sum to at most 1. }
    CompositionRequest:
      type: object
      description: At least one substance or part; at most 500 together.
      properties:
        direct:
          type: object
          description: Mass fraction w/w (0 to 1) per CAS number, declared on the item; the fractions sum to at most 1.
          additionalProperties: { $ref: "#/components/schemas/Decimal" }
        parts:
          type: array
          items: { $ref: "#/components/schemas/MassPart" }
    Composition:
      allOf:
        - $ref: "#/components/schemas/CompositionRequest"
        - type: object
          required: [itemId, version]
          properties:
            itemId: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
    Hit:
      type: object
      properties:
        cas: { type: string }
        name: { type: string }
        percentWw: { $ref: "#/components/schemas/Decimal" }
        thresholdPct: { $ref: "#/components/schemas/Decimal" }
    ComplianceResult:
      type: object
      properties:
        listCode: { type: string }
        listVersion: { type: integer }
        listKind: { type: string, enum: [RESTRICTED, REPORTING] }
        region: { type: string }
        applies: { type: boolean }
        restricted: { type: boolean }
        hits:
          type: array
          items: { $ref: "#/components/schemas/Hit" }
        code: { type: string, enum: [QM-0121, QM-0122], description: "QM-0121 reporting hit (warning) or QM-0122 restricted hit; absent when nothing is over its threshold." }
        severity: { type: string, enum: [warning, error] }
        version: { type: integer, description: Stored result version of this item, list version and region. }
    ComplianceEvaluation:
      type: object
      required: [itemId, region, compositionVersion, blocked, results, undeclaredItems]
      properties:
        itemId: { type: string, format: uuid }
        region: { type: string }
        compositionVersion: { type: integer }
        blocked: { type: boolean, description: True when a restricted list in BLOCK mode is hit. }
        results:
          type: array
          items: { $ref: "#/components/schemas/ComplianceResult" }
        undeclaredItems:
          type: array
          description: Parts in the BOM with no composition; they count as containing nothing.
          items: { type: string, format: uuid }
    StudyStatus:
      type: string
      enum: [PLANNED, ACTIVE, COMPLETED, TERMINATED]
    StudyRequest:
      type: object
      required: [itemId, batchId, protocol, condition, startDate, testGroupId, pullMonths]
      properties:
        itemId: { type: string, format: uuid }
        batchId: { type: string, minLength: 1, maxLength: 60 }
        protocol: { type: string, minLength: 1, maxLength: 120, example: "ICH Q1A(R2)" }
        condition: { type: string, minLength: 1, maxLength: 60, example: "25C/60RH" }
        startDate: { type: string, format: date, example: "2026-01-31" }
        testGroupId: { type: string, format: uuid, description: Test group of every pull point without its own. }
        pullMonths:
          type: array
          minItems: 1
          maxItems: 40
          description: Strictly ascending months from the start date.
          items: { type: integer, minimum: 0, maximum: 120 }
        pullTestGroups:
          type: object
          description: Test group per pull point, keyed by its month, overriding testGroupId.
          additionalProperties: { type: string, format: uuid }
        leadDays: { type: integer, minimum: 0, maximum: 30, default: 7, description: stability_lead_days }
        windowDays: { type: integer, minimum: 0, maximum: 14, default: 3, description: stability_pull_window_days }
    Pull:
      type: object
      properties:
        months: { type: integer }
        pullDate: { type: string, format: date-time, description: Start date plus the months, clamped to month end (BR-33.14). }
        orderDate: { type: string, format: date-time, description: The pull's quality order is due leadDays before the pull. }
        testGroupId: { type: string, format: uuid }
        status: { type: string, enum: [PLANNED, ORDERED, PULLED, MISSED] }
    Study:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/StudyStatus" }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        itemId: { type: string, format: uuid }
        batchId: { type: string }
        protocol: { type: string }
        condition: { type: string }
        startDate: { type: string, format: date-time }
        testGroupId: { type: string, format: uuid }
        pullMonths: { type: array, items: { type: integer } }
        pullTestGroups: { type: object, additionalProperties: { type: string, format: uuid } }
        leadDays: { type: integer }
        windowDays: { type: integer }
        pulls:
          type: array
          items: { $ref: "#/components/schemas/Pull" }
    SpcLimits:
      type: object
      properties:
        cl: { type: number }
        ucl: { type: number }
        lcl: { type: number }
    Violation:
      type: object
      properties:
        chart: { type: string, enum: [XBAR, R, P] }
        index: { type: integer, description: Zero-based point index. }
        rule: { type: integer, minimum: 1, maximum: 4, description: Western Electric rule. }
    SPCResult:
      type: object
      description: Chart statistics are numbers (not money); inputs are the stored decimal results.
      required: [chart, observations, orderIds, skippedSubgroups]
      properties:
        chart: { type: string, enum: [XBAR_R, P, NONE] }
        observations: { type: integer }
        orderIds: { type: array, description: Quality order behind each point., items: { type: string, format: uuid } }
        skippedSubgroups: { type: integer, description: Orders whose sample size differed from the modal size. }
        xbarR:
          type: object
          properties:
            subgroupSize: { type: integer, minimum: 2, maximum: 25 }
            xbar: { type: array, items: { type: number } }
            range: { type: array, items: { type: number } }
            xbarLimits: { $ref: "#/components/schemas/SpcLimits" }
            rLimits: { $ref: "#/components/schemas/SpcLimits" }
            sigma: { type: number }
            violations: { type: array, items: { $ref: "#/components/schemas/Violation" } }
        pChart:
          type: object
          properties:
            pBar: { type: number }
            sizes: { type: array, items: { type: integer } }
            points: { type: array, items: { type: number } }
            limits: { type: array, items: { $ref: "#/components/schemas/SpcLimits" } }
            violations: { type: array, items: { $ref: "#/components/schemas/Violation" } }
            np:
              type: object
              properties:
                subgroupSize: { type: integer }
                points: { type: array, items: { type: integer } }
                limits: { $ref: "#/components/schemas/SpcLimits" }
    NcrStatus:
      type: string
      enum: [NEW, APPROVED, REFUSED, IN_CORRECTION, CLOSED]
    NcrSource:
      type: string
      enum: [CUSTOMER, VENDOR, INTERNAL, PRODUCTION, SERVICE]
    NcrSeverity:
      type: string
      enum: [MINOR, MAJOR, CRITICAL]
    NcrRequest:
      type: object
      required: [source, qty, problemType, severity]
      properties:
        source: { $ref: "#/components/schemas/NcrSource" }
        itemId: { type: string, format: uuid, description: Required unless qualityOrderId is given. }
        dims: { type: object, additionalProperties: { type: string } }
        qty: { $ref: "#/components/schemas/Decimal" }
        uom: { type: string, minLength: 1, maxLength: 10, description: Required unless qualityOrderId is given. }
        problemType: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,31}$" }
        severity: { $ref: "#/components/schemas/NcrSeverity" }
        description: { type: string, maxLength: 2000 }
        qualityOrderId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        productionOrderId: { type: string, format: uuid }
        quarantineOrderId: { type: string, format: uuid }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    CorrectionRequest:
      type: object
      properties:
        effectivenessCheckDays: { type: integer, minimum: 30, maximum: 365, default: 90, description: effectiveness_check_days }
    StepRequest:
      type: object
      required: [step, notes]
      properties:
        step: { type: integer, minimum: 1, maximum: 7 }
        notes: { type: string, minLength: 1, maxLength: 2000 }
    EffectivenessRequest:
      type: object
      required: [result, note]
      properties:
        result: { type: string, enum: [EFFECTIVE, NOT_EFFECTIVE] }
        note: { type: string, minLength: 1, maxLength: 2000 }
    CorrectionStep:
      type: object
      properties:
        step: { type: integer, minimum: 1, maximum: 8 }
        name: { type: string }
        dueAt: { type: string, format: date-time }
        notes: { type: string }
        completedBy: { type: string }
        completedAt: { type: string, format: date-time }
    Correction:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, EFFECTIVENESS_PENDING, CLOSED] }
        currentStep: { type: integer, minimum: 1, maximum: 8 }
        steps:
          type: array
          minItems: 8
          maxItems: 8
          items: { $ref: "#/components/schemas/CorrectionStep" }
        startedBy: { type: string }
        startedAt: { type: string, format: date-time }
        effectivenessDays: { type: integer }
        effectivenessDueAt: { type: string, format: date-time }
        effectivenessResult: { type: string, enum: [EFFECTIVE, NOT_EFFECTIVE] }
        effectivenessNote: { type: string }
        effectivenessBy: { type: string }
        effectivenessAt: { type: string, format: date-time }
        reopened: { type: integer, description: Times a NOT_EFFECTIVE check sent the 8D back to D4. }
        closedAt: { type: string, format: date-time }
        overdueSteps: { type: array, description: Steps past their due date (computed on read)., items: { type: integer } }
        effectivenessCheckDue: { type: boolean, description: D7 is complete and the effectiveness period has elapsed (computed on read). }
    CertificateStatus:
      type: string
      enum: [NOT_REQUIRED, MISSING, RECEIVED_OK, RECEIVED_NOK, WAIVED]
      description: The gate of an accepting decision (BR-33.13); only RECEIVED_OK, WAIVED and NOT_REQUIRED let it pass.
    CertificateValue:
      type: object
      properties:
        value: { $ref: "#/components/schemas/Decimal" }
        outcome: { type: string, format: uuid }
    CertificateRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [COA, COC, EN10204_31] }
        documentRef: { type: string, maxLength: 200, description: Upload id, EDI attachment or supplier-portal document. }
        values:
          type: object
          description: Keyed by test id of the order's test group; value for a variable test, outcome for an attribute test.
          additionalProperties: { $ref: "#/components/schemas/CertificateValue" }
    CertificateRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        qualityOrderId: { type: string, format: uuid }
        type: { type: string, enum: [COA, COC, EN10204_31] }
        documentRef: { type: string }
        values: { type: object, additionalProperties: { $ref: "#/components/schemas/CertificateValue" } }
        inSpec: { type: boolean }
        deviations: { type: array, description: Tests the certificate does not meet., items: { type: string } }
        waiver: { type: boolean }
        reason: { type: string, description: Waiver reason. }
        nonconformanceId: { type: string, format: uuid, description: The VENDOR NCR an out-of-specification receipt raised. }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
    CertificateRecordView:
      allOf:
        - $ref: "#/components/schemas/CertificateRecord"
        - type: object
          properties:
            certificateStatus: { $ref: "#/components/schemas/CertificateStatus" }
    CertificateList:
      type: object
      required: [required, certificateStatus, items]
      properties:
        required: { $ref: "#/components/schemas/CertificateRequirement" }
        certificateStatus: { $ref: "#/components/schemas/CertificateStatus" }
        items: { type: array, items: { $ref: "#/components/schemas/CertificateRecord" } }
    SampleKind:
      type: string
      enum: [PRIMARY, POOLED, RESERVE]
    SampleStatus:
      type: string
      enum: [ACTIVE, DUE_FOR_DISPOSAL]
    SampleRequest:
      type: object
      required: [qualityOrderId, kind, quantity]
      properties:
        qualityOrderId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/SampleKind" }
        primaryIds: { type: array, maxItems: 50, items: { type: string, format: uuid }, description: POOLED only. }
        quantity: { $ref: "#/components/schemas/Decimal" }
        container: { type: string, maxLength: 60 }
        storageLocation: { type: string, maxLength: 60 }
        condition: { type: string, maxLength: 120 }
        batchExpiresOn: { type: string, format: date, description: Required for RESERVE. }
        retentionYears: { type: integer, minimum: 0, maximum: 10, default: 1 }
    Sample:
      type: object
      properties:
        id: { type: string, format: uuid }
        qualityOrderId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/SampleKind" }
        primaryIds: { type: array, items: { type: string, format: uuid } }
        quantity: { $ref: "#/components/schemas/Decimal" }
        uom: { type: string }
        container: { type: string }
        storageLocation: { type: string }
        condition: { type: string }
        batchExpiresOn: { type: string, format: date }
        retentionYears: { type: integer }
        retentionExpiresOn: { type: string, format: date }
        status: { $ref: "#/components/schemas/SampleStatus" }
        recordedBy: { type: string }
        createdAt: { type: string, format: date-time }
    Nonconformance:
      type: object
      properties:
        id: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/NcrSource" }
        itemId: { type: string, format: uuid }
        dims: { type: object, additionalProperties: { type: string } }
        qty: { $ref: "#/components/schemas/Decimal" }
        uom: { type: string }
        problemType: { type: string }
        severity: { $ref: "#/components/schemas/NcrSeverity" }
        description: { type: string }
        qualityOrderId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        productionOrderId: { type: string, format: uuid }
        quarantineOrderId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/NcrStatus" }
        statusReason: { type: string, description: Refusal reason. }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
        correction: { $ref: "#/components/schemas/Correction" }
