openapi: 3.1.0
info:
  title: Passage product costing (wave 39, slices 1-5)
  version: 0.5.0
  description: >
    Stateless costing computations. The caller supplies items, prices and
    actuals; the service returns rolled standards, mass-roll runs, variance
    decompositions, activation previews, mixed costs, component postings,
    sales order estimates and their versions, ad-hoc estimates from costing
    models, comparisons, standard reconciliations, the costing version
    lifecycle and the conversion checklist; those routes store nothing. From
    slice 5 the cost structure (cost components and cost groups) and the
    costing versions are stored per tenant under row-level security, with
    Idempotency-Key on every create, an optimistic version counter on every
    lifecycle action and an outbox event for every change.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env: { default: dev }
paths:
  /readyz:
    get:
      summary: Readiness (database ping when configured)
      operationId: ready
      x-passage-duty: none
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /v1/product-costing/calculations:
    post:
      summary: Roll one item and return its standard with the component split
      operationId: rollOne
      x-passage-duty: productcost.calculate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollOneRequest" }
      responses:
        "200":
          description: Rolled item. A failed item returns status Error with diagnostics, not a 4xx.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalculationResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/rolls:
    post:
      summary: Mass roll a set of items by topological level
      operationId: massRoll
      x-passage-duty: productcost.calculate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MassRollRequest" }
      responses:
        "200":
          description: Roll run with per-item diagnostics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RollRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/variances/compute:
    post:
      summary: Decompose the variance of an ended production order
      operationId: computeVariance
      x-passage-duty: productcost.variance.compute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Order" }
      responses:
        "200":
          description: Decomposition; total equals the sum of the four types
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decomposition" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/activations:preview:
    post:
      summary: Preview the on-hand revaluation of a standard cost activation
      operationId: previewActivation
      x-passage-duty: productcost.activate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivationPreviewRequest" }
      responses:
        "200":
          description: Revaluation preview with total
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationPreview" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/mixed-costs:
    post:
      summary: Cost an item mixed from procurement alternatives (FR-39.14)
      operationId: mixedCost
      x-passage-duty: productcost.calculate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MixedCostRequest" }
      responses:
        "200":
          description: Ratio-weighted cost with the weighted split. A failed alternative returns status Error, not a 4xx.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MixedRoll" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-0741: ratios do not total 100.00%" }
  /v1/product-costing/postings:cogs:
    post:
      summary: Book the cost of goods sold of an issue by cost component (FR-39.15)
      operationId: cogsPosting
      x-passage-duty: productcost.calculate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CogsPostingRequest" }
      responses:
        "200":
          description: Balanced journal preview; component debits sum to the total credit to Inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostingResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/postings:price-difference:
    post:
      summary: Book a purchase price variance by cost component (FR-39.7, FR-39.15)
      operationId: priceDifferencePosting
      x-passage-duty: productcost.calculate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceDifferencePostingRequest" }
      responses:
        "200":
          description: Balanced journal preview of the purchase price variance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostingResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/sales-order-estimates:
    post:
      summary: Cost a configured or make-to-order line and show its margin (FR-39.16)
      operationId: salesOrderEstimate
      x-passage-duty: productcost.calculate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesOrderEstimateRequest" }
      responses:
        "200":
          description: Estimate of type SalesOrder with cost, split, margin and margin percent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesEstimate" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/comparisons:
    post:
      summary: Compare a baseline run with a candidate run item by item (FR-39.10 what-if)
      operationId: compareRuns
      x-passage-duty: productcost.view
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComparisonRequest" }
      responses:
        "200":
          description: Rows by item with deltas and component deltas; errored items carry no delta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/reconciliations:
    post:
      summary: Reconcile inventory at standard to the GL per site (FR-39.11)
      operationId: reconcileStandard
      x-passage-duty: productcost.view
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconcileRequest" }
      responses:
        "200":
          description: Per-site reconciliation; differences counts sites with a non-zero difference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/versions:transition:
    post:
      operationId: transitionCostingVersion
      summary: Block, unblock or close a costing version (BR-39.2, FR-39.3); stateless, the caller supplies the current version
      x-passage-duty: productcost.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionRequest" }
      responses:
        "200":
          description: The version in its next state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-0711 simulation version Active, CST-0715 transition not allowed, CST-0716 fallback version" }
  /v1/product-costing/versions:activate:
    post:
      operationId: activateCostingVersion
      summary: Move an Open or Blocked version to Active (BR-39.2); segregated from productcost.maintain. Stateless; no revaluation is posted
      x-passage-duty: productcost.activate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionResponse" }
      responses:
        "200":
          description: The version, now Active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-0711 simulation versions cannot be activated, CST-0715 not Open or Blocked, CST-0716 fallback version" }
  /v1/product-costing/conversions:validate:
    post:
      operationId: validateStandardCostConversion
      summary: Validate a standard cost conversion and preview its revaluation (FR-39.12); nothing is posted
      x-passage-duty: productcost.activate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversionInput" }
      responses:
        "200":
          description: Validation outcome and revaluation preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversionReport" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/conversions:advance:
    post:
      operationId: advanceStandardCostConversion
      summary: Record the next checklist step as done by the calling user (FR-39.12); stateless, the caller supplies the checklist so far
      x-passage-duty: productcost.activate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversionAdvanceRequest" }
      responses:
        "200":
          description: The run with the step recorded, and the report the step was checked against
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversionAdvanceResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem", description: "No tenant, or no user on the principal" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-0731 inventory close missing (close, activate), CST-0735 blocked (validate, activate), CST-0736 step out of order or checklist complete" }
  /v1/product-costing/estimates:
    post:
      operationId: adHocEstimate
      summary: Ad-hoc estimate of a quote, internal order or project task from a costing model (FR-39.13)
      description: >
        Stateless: the caller sends the costing model, the characteristic values and
        the prices resolved from the selected costing version. Each line costs
        quantity × price; the costing sheet applies to the priced split. The
        PRD's Idempotency-Key arrives with stored estimates.
      x-passage-duty: productcost.calculate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdHocEstimateRequest" }
      responses:
        "200":
          description: Estimate lines, cost by component and total
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdHocEstimate" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-0764 invalid model, formula, characteristic value, or negative quantity or price; CST-0702 no price for a line; CST-0708 costing sheet reference" }
  /v1/product-costing/sales-order-estimates:refresh:
    post:
      operationId: refreshSalesOrderEstimate
      summary: Recompute a sales order line's estimate for its configuration and version it (FR-39.16, BR-39.14)
      description: >
        Stateless: the caller sends the versions it holds for the line. The same
        (lineId, configHash) returns the current version unchanged (changed false).
        A new configuration hash supersedes the Pending and Frozen versions,
        appends a Pending version and warns CST-0751.
      x-passage-duty: productcost.calculate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshEstimateRequest" }
      responses:
        "200":
          description: The current version after the refresh and the full history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshResult" }
        "400": { $ref: "#/components/responses/Problem", description: "Validation, including a version of another line, a duplicate version number or an unknown status" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/sales-order-estimates:freeze:
    post:
      operationId: freezeSalesOrderEstimate
      summary: Freeze the line's current estimate at confirmation (BR-39.14)
      description: Freezing a Frozen version returns it unchanged.
      x-passage-duty: productcost.calculate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreezeEstimateRequest" }
      responses:
        "200":
          description: The history with the confirmed version Frozen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FreezeEstimateResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-0763 no estimate to freeze, or the current estimate failed to roll" }
  /v1/product-costing/cost-components:
    get:
      operationId: listCostComponents
      summary: List the tenant's cost components (at most 20), ordered by code (FR-39.1)
      x-passage-duty: productcost.view
      responses:
        "200":
          description: Components
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CostComponent" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem", description: "CST-0799 no store configured" }
    post:
      operationId: createCostComponent
      summary: Create a cost component of the split (FR-39.1); publishes dev.passage.costing.costcomponent.created.v1
      x-passage-duty: productcost.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CostComponentInput" }
      responses:
        "201":
          description: Created, or replayed for a repeated Idempotency-Key
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostComponent" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem", description: "CST-0791 a component with this code exists" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-0790 the tenant holds 20 components; idempotency_key_reuse" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/cost-groups:
    get:
      operationId: listCostGroups
      summary: List the tenant's cost groups (at most 50) with the component each maps to (FR-39.1)
      x-passage-duty: productcost.view
      responses:
        "200":
          description: Cost groups
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CostGroup" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCostGroup
      summary: Create a cost group mapped to a cost component (FR-39.1); publishes dev.passage.costing.costgroup.created.v1
      x-passage-duty: productcost.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CostGroupInput" }
      responses:
        "201":
          description: Created, or replayed for a repeated Idempotency-Key
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem", description: "CST-0793 a cost group with this code exists" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-0792 the tenant holds 50 cost groups; CST-0794 unknown cost component; idempotency_key_reuse" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/versions:
    get:
      operationId: listCostingVersions
      summary: Page through the stored costing versions in the caller's legal-entity scope, in creation order (FR-39.3)
      x-passage-duty: productcost.view
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [Open, Blocked, Active, Closed] } }
        - { name: type, in: query, schema: { type: string, enum: [Standard, Planned, Simulation, Conversion] } }
        - { name: after, in: query, description: The next cursor of the previous page, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: One page of versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/StoredCostingVersion" } }
                  next: { type: string, format: uuid, description: Cursor of the next page; absent on the last page }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCostingVersion
      summary: Create an Open costing version (FR-39.3); publishes dev.passage.costing.version.created.v1
      x-passage-duty: productcost.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CostingVersionInput" }
      responses:
        "201":
          description: Created, or replayed for a repeated Idempotency-Key
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredCostingVersion" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem", description: "CST-0718 the legal entity is outside the caller's scope" }
        "409": { $ref: "#/components/responses/Problem", description: "CST-0713 the legal entity has a version with this code" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-0716 SpecifiedVersion fallback missing, unknown or of another legal entity; idempotency_key_reuse" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/versions/{id}:
    get:
      operationId: getCostingVersion
      summary: Read one stored costing version
      x-passage-duty: productcost.view
      parameters:
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredCostingVersion" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: "CST-0717 no such version in the caller's scope" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/versions/{id}/transition:
    post:
      operationId: transitionStoredCostingVersion
      summary: Block, unblock or close a stored version (BR-39.2) under its optimistic version; publishes dev.passage.costing.version.transitioned.v1
      x-passage-duty: productcost.maintain
      parameters:
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, version]
              additionalProperties: false
              properties:
                action: { type: string, enum: [block, unblock, close] }
                version: { type: integer, minimum: 1, description: The version counter the caller read }
      responses:
        "200":
          description: The version in its next state, its counter incremented
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredCostingVersion" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: "CST-0717" }
        "409": { $ref: "#/components/responses/Problem", description: "CST-0714 the version changed since it was read" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-0715 transition not allowed from the current status" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/versions/{id}/activate:
    post:
      operationId: activateStoredCostingVersion
      summary: Activate a stored Open or Blocked version (BR-39.2), segregated from productcost.maintain. Every version type except Simulation can be activated; a version that is not Standard, or has no stored calculations, only moves the status. A Standard version with stored calculations (and with dryRun or reversesActivationId) revalues every stored Legal-view position of the version against the inventory on-hand, posts the revaluation journal to the ledger accounts configured for the version's legal entity and activates (FR-39.6). The inventory site dimension must carry the productcost site id (a UUID)
      x-passage-duty: productcost.activate
      parameters:
        - $ref: "#/components/parameters/VersionId"
        - name: Idempotency-Key
          in: header
          required: false
          description: Required unless dryRun; replays the stored activation
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoredActivationRequest" }
      responses:
        "200":
          description: The version, now Active (bare request); or the preview (dryRun; for a version that is not Standard a status-only preview with no lines and total 0); or the version with its activation and journal entry id
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StoredCostingVersion"
                  - $ref: "#/components/schemas/StoredActivationResult"
                  - $ref: "#/components/schemas/StoredActivationDryRun"
        "400": { $ref: "#/components/responses/Problem", description: "Unknown fields are refused, including inventoryAccount and costChangeAccount: the ledger accounts are configuration, never request data" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: "CST-0717 version not found, CST-0723 reversal target not found" }
        "409": { $ref: "#/components/responses/Problem", description: "CST-0714 the version changed since it was read, CST-0710 a roll holds the version, CST-0723 the activation was already reversed, CST-0729 another version of the legal entity has a pending activation attempt (the detail names that version)" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-0711 simulation versions cannot be activated, CST-0715 not Open or Blocked, CST-0723 reversal target of another version, itself a reversal, or booked before a later non-reversed activation of the same positions, CST-0724 no posting accounts configured for the legal entity, CST-0725 a position holds stock but has no earlier standard, CST-0726 the inventory reports no on-hand for a position with an earlier standard, CST-0727 a version that is not Standard cannot revalue stock, CST-0728 too many items or positions for one activation, CST-0738 the user who rolled the version's pending calculations cannot activate them, CST-0730 a pending attempt is older than the ledger idempotency retention less 30 days and needs manual review before it is resent or cleared" }
        "502": { $ref: "#/components/responses/Problem", description: "CST-0721 the ledger did not accept the journal (nothing is activated), CST-0722 the on-hand could not be read" }
        "503": { $ref: "#/components/responses/Problem", description: "CST-0721 no ledger configured, CST-0722 no inventory service configured, or the store is unavailable" }
  /v1/product-costing/versions/{id}/roll:
    post:
      operationId: rollStoredCostingVersion
      summary: Roll items at one site and store the results as Pending calculations of an Open version (FR-39.4). The BOM and route versions (and their ids) are read from the engineering service for the date; the request cannot send item structures, BOMs, routes or costing sheets. Purchased item prices and operation rates have no stored source yet, so they are the request's two price inputs; the user who rolled cannot activate the version (CST-0738). Each roll adds 1 to the version counter, so an activation that read the version before it is refused (CST-0714). Rolled items supersede their earlier Pending rows; an item that fails to roll stores nothing and is listed in errors
      x-passage-duty: productcost.calculate
      parameters:
        - $ref: "#/components/parameters/VersionId"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [siteId]
              description: Name the items with itemIds (at most 200) or set selection to roll every stored BOM of the site; exactly one of the two
              properties:
                siteId: { type: string, format: uuid }
                selection: { type: string, enum: [allActive], description: "Roll every item with an active material BOM at the site on asOf, listed from the engineering service, so the request carries no item list (the 4 MiB body cap) - up to 50000 items; a larger site is refused (CST-0739)" }
                itemIds: { type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: { type: string, format: uuid }, description: The items to store; their components are rolled with them but not stored }
                asOf: { type: string, format: date, description: The date the active BOM and route are read for; defaults to today }
                prices: { type: object, additionalProperties: { type: string }, description: Unit price by item id for each purchased component (an item with no active BOM) }
                operationRates: { type: object, additionalProperties: { type: string }, description: Rate per hour by engineering operationId }
                options: { type: object, description: Same options as the mass roll }
      responses:
        "201":
          description: Counts of the items rolled and stored, the new version counter, the roller and the diagnostics of each item that failed (flagged Idempotent-Replayed on a replay)
          content:
            application/json:
              schema:
                type: object
                properties:
                  costingVersionId: { type: string, format: uuid }
                  version: { type: integer }
                  siteId: { type: string, format: uuid }
                  view: { type: string }
                  rolledBy: { type: string }
                  itemCount: { type: integer }
                  storedCount: { type: integer }
                  errorCount: { type: integer }
                  errors: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/Problem", description: "Unknown fields (items, bom, operations and sheets among them) are refused" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: "CST-0717 version not found" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-0709 the version is not Open or the site is outside its scope, CST-0702 a purchased component has no price or an operation no rate, CST-0739 an engineering BOM or route the roll cannot cost (alternative groups, constant scrap, malformed numbers, non-UUID components, too many items); the Idempotency-Key was used with a different request" }
        "502": { $ref: "#/components/responses/Problem", description: "CST-0737 engineering could not be read" }
        "503": { $ref: "#/components/responses/Problem", description: "CST-0737 no engineering service configured, or the store is unavailable" }
  /v1/product-costing/activations/{id}/revaluation-report:
    get:
      operationId: getActivationRevaluationReport
      summary: "The value report of a standard cost activation (AC-39.4). Each stored line (quantity, old and new standard, amount) is set beside the inventory on-hand read again from the inventory service for the posting date (a replay before today, the live projection for today), with the difference. tiedToJournal is true when the line amounts sum to the activation total and the booked journal debits and credits equal it; tiedToOnHand is true when every line quantity equals the on-hand (null, with null per-line on-hand fields, for a reversal: its lines carry reversed quantities and inventory is not called). Read-only; inventory is called with the inventory.read duty only"
      x-passage-duty: productcost.view
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The activation, its lines with on-hand and difference, the lines total and the two tie-out flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  activation: { type: object }
                  lines: { type: array, items: { type: object } }
                  linesTotal: { type: string }
                  tiedToJournal: { type: boolean }
                  tiedToOnHand: { type: boolean }
                  onHandAsOf: { type: string, format: date }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: "CST-0723 activation not found" }
        "502": { $ref: "#/components/responses/Problem", description: "CST-0722 the inventory on-hand could not be read" }
        "503": { $ref: "#/components/responses/Problem", description: "CST-0722 no inventory service configured, or the store is unavailable" }
  /v1/product-costing/activation-attempts:
    get:
      operationId: listActivationAttempts
      summary: The pending activation attempts (journals sent, or about to be, to the ledger and not yet recorded), oldest first, with needsOperator set on those past the ledger replay window (the ledger Idempotency-Key retention the attempt was created under, at most PRODUCTCOST_LEDGER_IDEMPOTENCY_TTL_DAYS, less 30 days). Such an attempt is never resent or cleared automatically (CST-0730)
      x-passage-duty: productcost.activation-attempt.resolve
      responses:
        "200":
          description: The attempts in the caller's legal-entity scope (at most 500)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationAttemptList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/versions/{id}/activation-attempt/resolve:
    post:
      operationId: resolveActivationAttempt
      summary: Record an operator's decision on an activation attempt past the ledger replay window (CST-0730). The operator has checked the ledger. posted (with the ledger entry id) records the activation around that entry without posting again; not-posted discards the attempt so the version can be activated afresh. Raises dev.passage.costing.activationattempt.resolved.v1
      x-passage-duty: productcost.activation-attempt.resolve
      parameters:
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveActivationAttemptRequest" }
      responses:
        "200":
          description: The decision; with the version, and for posted the recorded activation
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveActivationAttemptResult" }
        "400": { $ref: "#/components/responses/Problem", description: Validation failure, including a missing Idempotency-Key, an outcome other than posted or not-posted, a posted decision without a journalEntryId and a missing reason }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: "CST-0717 version not found, CST-0742 the version has no pending attempt" }
        "409": { $ref: "#/components/responses/Problem", description: "CST-0714 the version changed since it was read, CST-0743 the attempt is inside the ledger replay window; retry the activation instead" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-0738 the roller of the calculations cannot confirm their activation as posted, or the Idempotency-Key was already used with a different request" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/product-costing/posting-accounts/{legalEntityId}:
    get:
      operationId: getPostingAccounts
      summary: The ledger accounts a legal entity's activation journals post to
      x-passage-duty: productcost.view
      parameters:
        - $ref: "#/components/parameters/LegalEntityId"
      responses:
        "200":
          description: The configured accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostingAccounts" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem", description: "CST-0718 legal entity outside the caller's scope" }
        "404": { $ref: "#/components/responses/Problem", description: "CST-0724 none configured for the legal entity" }
        "503": { $ref: "#/components/responses/Problem" }
    put:
      operationId: putPostingAccounts
      summary: Set the ledger accounts a legal entity's activation journals post to (productcost.maintain); activation takes the accounts from here, never from its request
      x-passage-duty: productcost.maintain
      parameters:
        - $ref: "#/components/parameters/LegalEntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inventoryAccount, costChangeAccount]
              additionalProperties: false
              properties:
                inventoryAccount: { type: string, minLength: 1, maxLength: 64 }
                costChangeAccount: { type: string, minLength: 1, maxLength: 64, description: Must differ from inventoryAccount }
      responses:
        "200":
          description: The stored accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostingAccounts" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem", description: "CST-0718 legal entity outside the caller's scope" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Replays the stored response for 24 hours; reusing a key with a different request is 422 idempotency_key_reuse
      schema: { type: string, minLength: 1, maxLength: 200 }
    VersionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LegalEntityId:
      name: legalEntityId
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    IdempotentReplayed:
      description: "true when the response is the stored answer to an earlier request with this Idempotency-Key"
      schema: { type: string, enum: ["true"] }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    PostingAccounts:
      type: object
      required: [legalEntityId, inventoryAccount, costChangeAccount, updatedBy, updatedAt]
      properties:
        legalEntityId: { type: string, format: uuid }
        inventoryAccount: { type: string }
        costChangeAccount: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    StoredActivationRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        dryRun: { type: boolean }
        reversesActivationId: { type: string, format: uuid, description: Reverses this earlier activation of the version through the ledger reverse route; takes its lines, ledger, currency and accounts from it (lines, currency and ledgerId must be omitted) }
        ledgerId: { type: string, format: uuid, description: Required unless dryRun or a reversal }
        postingDate: { type: string, format: date, description: Defaults to today (UTC); before today the on-hand is read as of that date }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: Required unless a reversal }
        newStandardForOpenOrders: { type: boolean }
        lines: { description: "Refused (400): the positions are the version's stored calculations and cannot be listed in the request" }
    StoredActivationDryRun:
      type: object
      required: [dryRun, version, preview]
      properties:
        dryRun: { type: boolean, enum: [true] }
        version: { $ref: "#/components/schemas/StoredCostingVersion" }
        preview: { $ref: "#/components/schemas/ActivationPreview" }
    ActivationAttemptList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [costingVersionId, legalEntityId, activationId, total, currency, ambiguous, needsOperator, createdAt]
            properties:
              costingVersionId: { type: string, format: uuid }
              legalEntityId: { type: string, format: uuid }
              activationId: { type: string, format: uuid }
              reversesActivationId: { type: string, format: uuid }
              total: { type: string }
              currency: { type: string }
              ambiguous: { type: boolean, description: A send may have reached the ledger }
              needsOperator: { type: boolean, description: Past the ledger replay window; neither resent nor cleared automatically }
              createdAt: { type: string, format: date-time }
    ResolveActivationAttemptRequest:
      type: object
      additionalProperties: false
      required: [version, outcome, reason]
      properties:
        version: { type: integer, minimum: 1, description: The version counter as read }
        reversesActivationId: { type: string, format: uuid, description: Set to resolve the attempt of a reversal instead of the activation }
        outcome: { type: string, enum: [posted, not-posted] }
        journalEntryId: { type: string, format: uuid, description: The ledger entry the operator found; required for posted, empty for not-posted }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ResolveActivationAttemptResult:
      type: object
      required: [outcome, version]
      properties:
        outcome: { type: string, enum: [posted, not-posted] }
        version: { $ref: "#/components/schemas/StoredCostingVersion" }
        activation:
          type: object
          description: The recorded activation (posted only), same shape as the activation in StoredActivationResult
    StoredActivationResult:
      type: object
      required: [version, activation]
      properties:
        version: { $ref: "#/components/schemas/StoredCostingVersion" }
        activation:
          type: object
          properties:
            id: { type: string, format: uuid }
            costingVersionId: { type: string, format: uuid }
            legalEntityId: { type: string, format: uuid }
            reversesActivationId: { type: string, format: uuid }
            ledgerId: { type: string, format: uuid }
            postingDate: { type: string, format: date }
            currency: { type: string }
            itemCount: { type: integer }
            total: { type: string }
            journalEntryId: { type: string }
            inventoryAccount: { type: string, description: The account the journal booked, kept for the reversal }
            costChangeAccount: { type: string }
            journalLines:
              type: array
              items:
                type: object
                properties:
                  account: { type: string }
                  credit: { type: boolean }
                  amount: { type: string }
            newStandardForOpenOrders: { type: boolean }
            lines:
              type: array
              items:
                type: object
                properties:
                  itemId: { type: string, format: uuid }
                  siteId: { type: string, format: uuid }
                  qty: { type: string }
                  oldStd: { type: string }
                  newStd: { type: string }
                  amount: { type: string }
            activatedBy: { type: string }
            createdAt: { type: string, format: date-time }
    CostComponentInput:
      type: object
      required: [code, name, costGroupType]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9-]{0,19}$", examples: [DM, IND-MAT] }
        name: { type: string, minLength: 1, maxLength: 120 }
        costGroupType: { type: string, enum: [DirectMaterial, DirectManufacturing, Indirect, Undefined] }
        behaviour: { type: string, enum: [Fixed, Variable], default: Variable }
    CostComponent:
      allOf:
        - $ref: "#/components/schemas/CostComponentInput"
        - type: object
          required: [id, behaviour, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    CostGroupInput:
      type: object
      required: [code, name, type, componentId]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9-]{0,19}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [DirectMaterial, DirectManufacturing, Indirect, Undefined] }
        behaviour: { type: string, enum: [Fixed, Variable], default: Variable }
        componentId: { type: string, format: uuid, description: The cost component the group's costs are split into }
    CostGroup:
      allOf:
        - $ref: "#/components/schemas/CostGroupInput"
        - type: object
          required: [id, behaviour, componentCode, createdAt]
          properties:
            id: { type: string, format: uuid }
            componentCode: { type: string }
            createdAt: { type: string, format: date-time }
    CostingVersionInput:
      type: object
      required: [legalEntityId, code]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 30, description: Unique per legal entity }
        type: { type: string, enum: [Standard, Planned, Simulation, Conversion], default: Standard }
        fallback: { type: string, enum: [None, Active, SpecifiedVersion], default: Active }
        fallbackVersionId: { type: string, format: uuid, description: "Required with SpecifiedVersion: a version of the same legal entity" }
        siteIds: { type: array, maxItems: 500, uniqueItems: true, items: { type: string, format: uuid }, description: Empty means every site }
        effectiveFrom: { type: string, format: date-time }
    StoredCostingVersion:
      type: object
      required: [id, legalEntityId, code, type, status, fallback, siteIds, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string }
        type: { type: string, enum: [Standard, Planned, Simulation, Conversion] }
        status: { type: string, enum: [Open, Blocked, Active, Closed] }
        fallback: { type: string, enum: [None, Active, SpecifiedVersion] }
        fallbackVersionId: { type: string, format: uuid }
        siteIds: { type: array, items: { type: string, format: uuid } }
        effectiveFrom: { type: string, format: date-time }
        activatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1, description: Optimistic-concurrency counter; a lifecycle action names it }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          description: Validation message by request field path (for example items[0].bom[1].qty).
          additionalProperties: { type: string }
    Money:
      type: string
      description: Decimal string, never a float.
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    Split:
      type: object
      description: Amount by cost component code (DM, DL, IND-MAT, IND-LAB, SUB).
      additionalProperties: { $ref: "#/components/schemas/Money" }
    Diagnostic:
      type: object
      required: [code, severity, message]
      properties:
        code: { type: string, pattern: "^CST-07[0-9]{2}$" }
        severity: { type: string, enum: [error, warning] }
        message: { type: string }
        ref: { type: string }
    BOMLine:
      type: object
      required: [childId, qty]
      properties:
        childId: { type: string }
        qty: { $ref: "#/components/schemas/Money" }
        scrapPct: { $ref: "#/components/schemas/Money", description: "Percent, 0 to below 100; multiplies the quantity (BR-39.6)" }
        phantom: { type: boolean, description: "Phantom line (BR-39.3); the child must be Manufactured and is exploded in place in every mode" }
        makeToOrder: { type: boolean, description: "Make-to-order sub-assembly; exploded by the MakeToOrder mode. Not combinable with phantom" }
    Operation:
      type: object
      properties:
        setupHours: { $ref: "#/components/schemas/Money" }
        runHours: { $ref: "#/components/schemas/Money" }
        rate: { $ref: "#/components/schemas/Money" }
        lotSize: { $ref: "#/components/schemas/Money", description: "Overrides costingLot for this operation (BR-39.5)" }
        component: { type: string, description: "Cost component the operation charges; default DL" }
        scrapPct: { $ref: "#/components/schemas/Money", description: "Operation scrap in percent, 0 to below 100; compounds backward through the route and scales the BOM material by the first operation's factor (BR-39.6)" }
    SheetNode:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type: { type: string, enum: [Basis, Surcharge, Rate, Total], description: "Evaluated in sheet order. Basis and Total report subtotals and add no cost to the split (FR-39.2); an unknown type is 400" }
        component: { type: string, description: "Required for Surcharge and Rate; not allowed on Basis and Total" }
        basis: { type: array, items: { type: string }, description: "Cost components summed by a Basis node, or a Surcharge's basis when basisRef is not set" }
        basisRef: { type: string, description: "Surcharge: id of an earlier Basis or Total node used as its basis instead of basis" }
        refs: { type: array, items: { type: string }, description: "Total: ids of earlier Basis or Total nodes to add" }
        percentage: { $ref: "#/components/schemas/Money" }
        rate: { $ref: "#/components/schemas/Money" }
        rateUnit: { type: string, enum: [Hour, Unit], description: "Rate driver: routing hours per unit (run plus setup over the lot) or units; default Unit" }
        includeRolled: { type: boolean }
    Item:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string, enum: [Purchased, Manufactured] }
        price: { $ref: "#/components/schemas/Money" }
        activePrice: { $ref: "#/components/schemas/Money" }
        activeSplit: { $ref: "#/components/schemas/Split" }
        costingLot: { $ref: "#/components/schemas/Money", description: "Costing lot size; required when an operation has setup hours and no lotSize (BR-39.5)" }
        bom: { type: array, items: { $ref: "#/components/schemas/BOMLine" } }
        operations: { type: array, items: { $ref: "#/components/schemas/Operation" } }
        sheet: { type: array, items: { $ref: "#/components/schemas/SheetNode" } }
        intercompany: { type: boolean, description: "Purchased item bought from an intercompany partner (FR-39.17); only on Purchased items" }
        legalCost: { $ref: "#/components/schemas/Money", description: "Supplier entity's Legal-view unit cost, converted at the receipt's rate; the Group view rolls it instead of the intercompany price (BR-39.15). Without it the Group view uses the price and warns CST-0761. For a profitCenterSource item it is the supplying profit center's cost, the base of costPlusPct" }
        profitCenterSource: { type: boolean, description: "Purchased item supplied by another profit center of the same entity (FR-39.17); only on Purchased items, not with intercompany" }
        transferPrice: { $ref: "#/components/schemas/Money", description: "Transfer price for the profit-center pair; the ProfitCenter view rolls it" }
        costPlusPct: { $ref: "#/components/schemas/Money", description: "Cost-plus percent on legalCost, used by the ProfitCenter view when there is no transferPrice. With neither the item fails with CST-0762" }
    RollOptions:
      type: object
      properties:
        maxLevels: { type: integer, minimum: 1, maximum: 40, description: "Default 20 (COSTING_MAX_LEVELS)" }
        workers: { type: integer, minimum: 1, maximum: 32, description: "Default 4 (COSTING_ROLL_WORKERS)" }
        mode:
          type: string
          enum: [Multilevel, SingleLevel, MakeToOrder, ByLineType]
          description: >
            Multilevel rolls every child. SingleLevel takes every child at its active
            standard. MakeToOrder and ByLineType take purchased children at their
            version price; MakeToOrder rolls manufactured children on makeToOrder lines
            and ByLineType rolls none, the others taking their active standard. Phantom
            lines are exploded in place in every mode.
        fallbackToActive: { type: boolean }
        view: { type: string, enum: [Legal, Group, ProfitCenter], description: "Valuation view (FR-39.17); default Legal. Group rolls intercompany items at legalCost; ProfitCenter rolls profitCenterSource items at transferPrice or legalCost plus costPlusPct" }
    RollOneRequest:
      type: object
      required: [items, itemId]
      properties:
        items: { type: array, minItems: 1, maxItems: 50000, items: { $ref: "#/components/schemas/Item" } }
        itemId: { type: string }
        options: { $ref: "#/components/schemas/RollOptions" }
    MassRollRequest:
      type: object
      required: [items]
      properties:
        items: { type: array, minItems: 1, maxItems: 50000, items: { $ref: "#/components/schemas/Item" } }
        options: { $ref: "#/components/schemas/RollOptions" }
    Result:
      type: object
      properties:
        itemId: { type: string }
        status: { type: string, enum: [Pending, Error] }
        level: { type: integer }
        unitCost: { $ref: "#/components/schemas/Money" }
        own: { $ref: "#/components/schemas/Split" }
        rolled: { $ref: "#/components/schemas/Split" }
        subtotals:
          type: object
          description: Value of each Basis and Total sheet node by node id (FR-39.2)
          additionalProperties: { $ref: "#/components/schemas/Money" }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/Diagnostic" } }
    CalculationResponse:
      type: object
      properties:
        result: { $ref: "#/components/schemas/Result" }
        split: { $ref: "#/components/schemas/Split" }
    RollRun:
      type: object
      properties:
        itemCount: { type: integer }
        errorCount: { type: integer }
        durationMs: { type: integer }
        results: { type: array, items: { $ref: "#/components/schemas/Result" } }
    OrderLine:
      type: object
      required: [component]
      properties:
        component: { type: string }
        planned: { type: boolean }
        fixed: { type: boolean }
        plannedQty: { $ref: "#/components/schemas/Money" }
        stdUnitCost: { $ref: "#/components/schemas/Money" }
        estPerLot: { $ref: "#/components/schemas/Money" }
        actualQty: { $ref: "#/components/schemas/Money" }
        actualUnitCost: { $ref: "#/components/schemas/Money" }
    Order:
      type: object
      required: [plannedQty, rafQty, lines]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "Posting precision is its ISO 4217 minor unit; default two decimals" }
        plannedQty: { $ref: "#/components/schemas/Money" }
        rafQty: { $ref: "#/components/schemas/Money" }
        lines: { type: array, minItems: 1, items: { $ref: "#/components/schemas/OrderLine" } }
    Types:
      type: object
      properties:
        lotSize: { $ref: "#/components/schemas/Money" }
        quantity: { $ref: "#/components/schemas/Money" }
        price: { $ref: "#/components/schemas/Money" }
        substitution: { $ref: "#/components/schemas/Money" }
    Decomposition:
      type: object
      properties:
        total: { $ref: "#/components/schemas/Money" }
        types: { $ref: "#/components/schemas/Types" }
        byComponent:
          type: array
          items:
            type: object
            properties:
              component: { type: string }
              total: { $ref: "#/components/schemas/Money" }
              types: { $ref: "#/components/schemas/Types" }
        residual: { $ref: "#/components/schemas/Money" }
    ActivationPreviewRequest:
      type: object
      required: [lines]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "Posting precision is its ISO 4217 minor unit; default two decimals" }
        lines:
          type: array
          minItems: 1
          maxItems: 50000
          items:
            type: object
            required: [itemId, siteId, qty, oldStd, newStd]
            properties:
              itemId: { type: string }
              siteId: { type: string }
              qty: { $ref: "#/components/schemas/Money" }
              oldStd: { $ref: "#/components/schemas/Money" }
              newStd: { $ref: "#/components/schemas/Money" }
    ActivationPreview:
      type: object
      properties:
        currency: { type: string }
        total: { $ref: "#/components/schemas/Money" }
        lines:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string }
              siteId: { type: string }
              qty: { $ref: "#/components/schemas/Money" }
              oldStd: { $ref: "#/components/schemas/Money" }
              newStd: { $ref: "#/components/schemas/Money" }
              amount: { $ref: "#/components/schemas/Money" }
        journal:
          type: array
          items:
            type: object
            properties:
              account: { type: string }
              debit: { $ref: "#/components/schemas/Money" }
              credit: { $ref: "#/components/schemas/Money" }
    JournalLine:
      type: object
      required: [account]
      properties:
        account: { type: string }
        debit: { $ref: "#/components/schemas/Money" }
        credit: { $ref: "#/components/schemas/Money" }
    AltRef:
      type: object
      required: [source, percent, itemId]
      properties:
        source: { type: string, description: "Vendor, production version or source site" }
        percent: { $ref: "#/components/schemas/Money", description: "Mixing ratio in percent; 0 excludes the alternative from the roll (BR-39.12)" }
        itemId: { type: string, description: "Catalog item rolled for this alternative" }
    MixedCostRequest:
      type: object
      required: [items, itemId, alternatives]
      properties:
        items: { type: array, minItems: 1, maxItems: 50000, items: { $ref: "#/components/schemas/Item" } }
        itemId: { type: string }
        alternatives: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/AltRef" }, description: "Sources are unique; no alternative may be the mixed item itself" }
        options: { $ref: "#/components/schemas/RollOptions" }
    AltRoll:
      type: object
      properties:
        source: { type: string }
        percent: { $ref: "#/components/schemas/Money" }
        itemId: { type: string }
        status: { type: string, enum: [Pending, Error, Excluded] }
        unitCost: { $ref: "#/components/schemas/Money" }
        split: { $ref: "#/components/schemas/Split" }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/Diagnostic" } }
    MixedRoll:
      type: object
      properties:
        itemId: { type: string }
        status: { type: string, enum: [Pending, Error] }
        unitCost: { $ref: "#/components/schemas/Money" }
        split: { $ref: "#/components/schemas/Split" }
        alternatives: { type: array, items: { $ref: "#/components/schemas/AltRoll" } }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/Diagnostic" } }
    CogsPostingRequest:
      type: object
      required: [quantity, unitCost]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "Posting precision is its ISO 4217 minor unit; default two decimals" }
        quantity: { $ref: "#/components/schemas/Money" }
        unitCost: { $ref: "#/components/schemas/Split", description: "Unit standard by cost component" }
    PriceDifferencePostingRequest:
      type: object
      required: [quantity, receiptUnitCost, standard]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "Posting precision is its ISO 4217 minor unit; default two decimals" }
        quantity: { $ref: "#/components/schemas/Money" }
        receiptUnitCost: { $ref: "#/components/schemas/Money" }
        standard: { $ref: "#/components/schemas/Split", description: "Standard split of the purchased item" }
    PostingResponse:
      type: object
      properties:
        currency: { type: string }
        total: { $ref: "#/components/schemas/Money" }
        journal: { type: array, items: { $ref: "#/components/schemas/JournalLine" } }
    SalesOrderEstimateRequest:
      type: object
      required: [items, itemId, quantity, netAmount]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "Posting precision is its ISO 4217 minor unit; default two decimals" }
        items: { type: array, minItems: 1, maxItems: 50000, items: { $ref: "#/components/schemas/Item" } }
        itemId: { type: string }
        quantity: { $ref: "#/components/schemas/Money", description: "Order quantity; the root item's costing lot is set to it (BR-39.5)" }
        netAmount: { $ref: "#/components/schemas/Money", description: "Net line amount; must be positive" }
        options: { $ref: "#/components/schemas/RollOptions" }
    SalesEstimate:
      type: object
      properties:
        itemId: { type: string }
        calculationType: { type: string, enum: [SalesOrder] }
        status: { type: string, enum: [Pending, Error] }
        quantity: { $ref: "#/components/schemas/Money" }
        unitCost: { $ref: "#/components/schemas/Money" }
        cost: { $ref: "#/components/schemas/Money" }
        split: { $ref: "#/components/schemas/Split" }
        netAmount: { $ref: "#/components/schemas/Money" }
        margin: { $ref: "#/components/schemas/Money" }
        marginPct: { $ref: "#/components/schemas/Money" }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/Diagnostic" } }
    ComparisonSide:
      type: object
      required: [items]
      properties:
        items: { type: array, minItems: 1, maxItems: 50000, items: { $ref: "#/components/schemas/Item" } }
        options: { $ref: "#/components/schemas/RollOptions" }
    ComparisonRequest:
      type: object
      required: [baseline, candidate]
      properties:
        baseline: { $ref: "#/components/schemas/ComparisonSide" }
        candidate: { $ref: "#/components/schemas/ComparisonSide", description: "Overridden prices, rates or routes make this the what-if run" }
    ComparisonRow:
      type: object
      properties:
        itemId: { type: string }
        status: { type: string, enum: [Compared, BaselineOnly, CandidateOnly, Error] }
        baseline: { $ref: "#/components/schemas/Money" }
        candidate: { $ref: "#/components/schemas/Money" }
        delta: { $ref: "#/components/schemas/Money" }
        deltaPct: { $ref: "#/components/schemas/Money" }
        byComponent: { $ref: "#/components/schemas/Split", description: "Candidate minus baseline by component" }
    Comparison:
      type: object
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/ComparisonRow" } }
        totalDelta: { $ref: "#/components/schemas/Money" }
    StandardOnHand:
      type: object
      required: [siteId, itemId, qty, stdUnit]
      properties:
        siteId: { type: string }
        itemId: { type: string }
        qty: { $ref: "#/components/schemas/Money" }
        stdUnit: { $ref: "#/components/schemas/Money" }
    SiteBalance:
      type: object
      required: [siteId, amount]
      properties:
        siteId: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
    ReconcileRequest:
      type: object
      description: At least one on-hand line or GL balance.
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "Posting precision is its ISO 4217 minor unit; default two decimals" }
        onHand: { type: array, maxItems: 50000, items: { $ref: "#/components/schemas/StandardOnHand" } }
        glBalances: { type: array, maxItems: 50000, items: { $ref: "#/components/schemas/SiteBalance" } }
    SiteReconciliation:
      type: object
      properties:
        siteId: { type: string }
        lines: { type: integer }
        standardValue: { $ref: "#/components/schemas/Money" }
        glBalance: { $ref: "#/components/schemas/Money" }
        difference: { $ref: "#/components/schemas/Money", description: "Standard minus GL; zero when reconciled" }
        status: { type: string, enum: [Reconciled, Difference] }
    ReconcileResponse:
      type: object
      properties:
        currency: { type: string }
        sites: { type: array, items: { $ref: "#/components/schemas/SiteReconciliation" } }
        differences: { type: integer }
    Version:
      type: object
      required: [id, type, status, fallback]
      properties:
        id: { type: string }
        type: { type: string, enum: [Standard, Planned, Simulation, Conversion] }
        status: { type: string, enum: [Open, Blocked, Active, Closed] }
        fallback: { type: string, enum: [None, Active, SpecifiedVersion] }
        fallbackVersionId: { type: string, description: "Required with SpecifiedVersion and must differ from id; not allowed otherwise (CST-0716)" }
        siteIds: { type: array, items: { type: string } }
    TransitionRequest:
      type: object
      required: [version, action]
      properties:
        version: { $ref: "#/components/schemas/Version" }
        action: { type: string, enum: [block, unblock, close] }
    VersionResponse:
      type: object
      required: [version]
      properties:
        version: { $ref: "#/components/schemas/Version" }
    ConversionPosition:
      type: object
      required: [itemId, siteId]
      properties:
        itemId: { type: string }
        siteId: { type: string }
        onHand: { $ref: "#/components/schemas/Money", description: "Physical on-hand; negative is CST-0732" }
        standardUnit: { $ref: "#/components/schemas/Money", description: "Pending standard in the conversion version" }
        actualValue: { $ref: "#/components/schemas/Money", description: "On-hand value at the actual method after the inventory close" }
        inTransit: { type: integer, minimum: 0, description: "Open in-transit transfers (CST-0733)" }
        startedOrders: { type: integer, minimum: 0, description: "Production orders started but not ended (CST-0734)" }
    ConversionInput:
      type: object
      required: [conversionDate, positions]
      properties:
        conversionDate: { type: string, format: date }
        closeThrough: { type: string, format: date, description: "End date of the last completed inventory close; the close step and activation need the day before conversionDate (BR-39.11, CST-0731)" }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "Posting precision of the revaluation (BR-39.1); default two decimals" }
        blockers:
          type: array
          items: { type: string, enum: [NegativeOnHand, InTransit, StartedOrders] }
          description: "costing.conversionBlockers. Omitted means all three; a condition whose blocker is not listed is a warning"
        positions:
          type: array
          minItems: 1
          maxItems: 50000
          description: "One per item and site"
          items: { $ref: "#/components/schemas/ConversionPosition" }
    ConversionPreviewLine:
      type: object
      properties:
        itemId: { type: string }
        siteId: { type: string }
        onHand: { $ref: "#/components/schemas/Money" }
        actualValue: { $ref: "#/components/schemas/Money" }
        standardUnit: { $ref: "#/components/schemas/Money" }
        amount: { $ref: "#/components/schemas/Money", description: "onHand × standardUnit − actualValue, rounded to the currency's minor unit" }
    ConversionReport:
      type: object
      properties:
        currency: { type: string }
        blocked: { type: boolean, description: "An enabled blocker matched; validate and activate refuse (CST-0735)" }
        closeComplete: { type: boolean, description: "closeThrough is the day before the conversion date; close and activate need it (CST-0731)" }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/Diagnostic" } }
        lines: { type: array, items: { $ref: "#/components/schemas/ConversionPreviewLine" } }
        revaluation: { $ref: "#/components/schemas/Money", description: "Sum of the lines; positive debits Inventory and credits the cost change variance" }
        journal: { type: array, items: { $ref: "#/components/schemas/JournalLine" } }
    ChecklistStep:
      type: object
      required: [step, status, user, at]
      properties:
        step: { type: string, enum: [select, roll, validate, preview, close, activate] }
        status: { type: string, enum: [Done] }
        user: { type: string, description: "Principal that ran the step" }
        at: { type: string, format: date-time, description: "Server time of the step" }
    ConversionRun:
      type: object
      properties:
        status: { type: string, enum: [Draft, Validated, Closed, Activated], description: "Derived from the checklist; the value sent is ignored" }
        checklist: { type: array, description: "The steps done so far, in checklist order", items: { $ref: "#/components/schemas/ChecklistStep" } }
    ConversionAdvanceRequest:
      type: object
      required: [run, step, input]
      properties:
        run: { $ref: "#/components/schemas/ConversionRun" }
        step: { type: string, enum: [select, roll, validate, preview, close, activate] }
        input: { $ref: "#/components/schemas/ConversionInput" }
    ConversionAdvanceResponse:
      type: object
      properties:
        run: { $ref: "#/components/schemas/ConversionRun" }
        report: { $ref: "#/components/schemas/ConversionReport" }
    Characteristic:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$", description: "Name the formulas read" }
        unit: { type: string }
        default: { $ref: "#/components/schemas/Money" }
    ModelLine:
      type: object
      required: [type, ref, component, quantityFormula]
      properties:
        type: { type: string, enum: [Item, Activity, Subcontract, Overhead] }
        ref: { type: string, description: "Item, activity, subcontract service or overhead the line prices; the key into prices" }
        component: { type: string, description: "Cost component the line's amount goes to" }
        quantityFormula: { type: string, maxLength: 500, description: "Arithmetic over numbers and characteristic names with + - * /, parentheses and unary minus" }
        priceFormula: { type: string, maxLength: 500, description: "Unit price formula; when absent the price of ref comes from prices" }
    CostingModel:
      type: object
      required: [code, lines]
      properties:
        code: { type: string }
        characteristics: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/Characteristic" } }
        lines: { type: array, minItems: 1, maxItems: 500, items: { $ref: "#/components/schemas/ModelLine" } }
    Price:
      type: object
      required: [amount]
      properties:
        amount: { $ref: "#/components/schemas/Money" }
        source: { type: string, description: "Price source; Fallback (the active standard) warns CST-0703" }
    AdHocEstimateRequest:
      type: object
      required: [model, objectType, objectId]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "Posting precision is its ISO 4217 minor unit; default two decimals" }
        model: { $ref: "#/components/schemas/CostingModel" }
        objectType: { type: string, enum: [Quote, InternalOrder, ProjectTask] }
        objectId: { type: string }
        characteristics: { type: object, additionalProperties: { $ref: "#/components/schemas/Money" }, description: "Values by characteristic name; a missing value takes the default" }
        prices: { type: object, additionalProperties: { $ref: "#/components/schemas/Price" }, description: "Unit prices by line ref, resolved from the selected costing version" }
        sheet: { type: array, items: { $ref: "#/components/schemas/SheetNode" } }
        routingHours: { $ref: "#/components/schemas/Money", description: "Hours driving Rate nodes with rateUnit Hour" }
    EstimateLine:
      type: object
      properties:
        type: { type: string }
        ref: { type: string }
        component: { type: string }
        quantity: { $ref: "#/components/schemas/Money" }
        price: { $ref: "#/components/schemas/Money" }
        amount: { $ref: "#/components/schemas/Money" }
        source: { type: string, description: "Price source: the caller's, Fallback or Formula" }
    AdHocEstimate:
      type: object
      properties:
        modelCode: { type: string }
        objectType: { type: string, enum: [Quote, InternalOrder, ProjectTask] }
        objectId: { type: string }
        currency: { type: string }
        characteristics: { type: object, additionalProperties: { $ref: "#/components/schemas/Money" }, description: "Values used, defaults applied" }
        lines: { type: array, items: { $ref: "#/components/schemas/EstimateLine" } }
        split: { $ref: "#/components/schemas/Split", description: "Cost by component after the costing sheet, at the posting scale; sums to total" }
        total: { $ref: "#/components/schemas/Money" }
        subtotals: { type: object, additionalProperties: { $ref: "#/components/schemas/Money" }, description: "Basis and Total sheet node values by node id" }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/Diagnostic" } }
    EstimateVersion:
      type: object
      required: [lineId, version, configHash, status]
      properties:
        lineId: { type: string }
        version: { type: integer, minimum: 1 }
        configHash: { type: string }
        status: { type: string, enum: [Pending, Frozen, Superseded] }
        estimate: { $ref: "#/components/schemas/SalesEstimate" }
    RefreshEstimateRequest:
      allOf:
        - $ref: "#/components/schemas/SalesOrderEstimateRequest"
        - type: object
          required: [lineId, configHash]
          properties:
            lineId: { type: string }
            configHash: { type: string, description: "Hash of the line's configuration (wave 27 configurator output)" }
            versions: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/EstimateVersion" } }
    RefreshResult:
      type: object
      properties:
        current: { $ref: "#/components/schemas/EstimateVersion" }
        versions: { type: array, items: { $ref: "#/components/schemas/EstimateVersion" } }
        changed: { type: boolean }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/Diagnostic" }, description: "CST-0751 when a version was superseded" }
    FreezeEstimateRequest:
      type: object
      required: [lineId]
      properties:
        lineId: { type: string }
        versions: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/EstimateVersion" } }
    FreezeEstimateResponse:
      type: object
      properties:
        versions: { type: array, items: { $ref: "#/components/schemas/EstimateVersion" } }
        confirmed: { $ref: "#/components/schemas/EstimateVersion" }
