asyncapi: 3.0.0
info:
  title: Passage product costing events (wave 39, slices 1-5)
  version: 0.5.0
  description: |
    Events published by the costing service through the outbox, in the same
    transaction as the change. CloudEvents 1.0 envelope; type
    dev.passage.costing.<entity>.<verb>.v1; source productcost; subject and
    Kafka key are the aggregate id; actor is the calling user.
    Slice 5 publishes the cost structure and the costing version lifecycle.
    These four events are not in the PRD event table (section 7.39.5); they
    are added so inventory costing (wave 20), production (wave 21) and
    budgeting learn which split and which version apply. The six PRD events
    (calculation.completed, rollrun.completed, standardcost.activated,
    variance.posted, conversion.activated, salesorderestimate.completed) need
    stored calculations and are listed in NOT-IMPLEMENTED.md.
defaultContentType: application/cloudevents+json
channels:
  costComponentCreated:
    address: passage.costing.costcomponent
    messages:
      costComponentCreated:
        $ref: "#/components/messages/CostComponentCreated"
  costGroupCreated:
    address: passage.costing.costgroup
    messages:
      costGroupCreated:
        $ref: "#/components/messages/CostGroupCreated"
  versionCreated:
    address: passage.costing.version
    messages:
      versionCreated:
        $ref: "#/components/messages/VersionCreated"
  versionTransitioned:
    address: passage.costing.version
    messages:
      versionTransitioned:
        $ref: "#/components/messages/VersionTransitioned"
  standardCostActivated:
    address: passage.costing.standardcost
    messages:
      standardCostActivated:
        $ref: "#/components/messages/StandardCostActivated"
  postingAccountsChanged:
    address: passage.costing.postingaccounts
    messages:
      postingAccountsChanged:
        $ref: "#/components/messages/PostingAccountsChanged"
  activationAttemptResolved:
    address: passage.costing.activationattempt
    messages:
      activationAttemptResolved:
        $ref: "#/components/messages/ActivationAttemptResolved"
operations:
  publishActivationAttemptResolved:
    action: send
    summary: An operator resolved a standard cost activation attempt past the ledger replay window
    channel: { $ref: "#/channels/activationAttemptResolved" }
  publishPostingAccountsChanged:
    action: send
    summary: Announce new posting accounts for a legal entity
    channel: { $ref: "#/channels/postingAccountsChanged" }
  publishStandardCostActivated:
    action: send
    summary: Announce a recorded standard cost activation or reversal
    channel: { $ref: "#/channels/standardCostActivated" }
  publishCostComponentCreated:
    action: send
    summary: Announce a new cost component
    channel: { $ref: "#/channels/costComponentCreated" }
  publishCostGroupCreated:
    action: send
    summary: Announce a new cost group
    channel: { $ref: "#/channels/costGroupCreated" }
  publishVersionCreated:
    action: send
    summary: Announce a new costing version
    channel: { $ref: "#/channels/versionCreated" }
  publishVersionTransitioned:
    action: send
    summary: Announce a costing version status change
    channel: { $ref: "#/channels/versionTransitioned" }
components:
  messages:
    CostComponentCreated:
      name: dev.passage.costing.costcomponent.created.v1
      summary: A cost component (a bucket of the cost split) was created
      contentType: application/cloudevents+json
      payload: { $ref: "#/components/schemas/CostComponentCreatedData" }
    CostGroupCreated:
      name: dev.passage.costing.costgroup.created.v1
      summary: A cost group was created and mapped to a cost component
      contentType: application/cloudevents+json
      payload: { $ref: "#/components/schemas/CostGroupCreatedData" }
    VersionCreated:
      name: dev.passage.costing.version.created.v1
      summary: A costing version was created
      contentType: application/cloudevents+json
      payload: { $ref: "#/components/schemas/VersionCreatedData" }
    VersionTransitioned:
      name: dev.passage.costing.version.transitioned.v1
      summary: A costing version changed status (blocked, unblocked, closed or activated)
      contentType: application/cloudevents+json
      payload: { $ref: "#/components/schemas/VersionTransitionedData" }
    StandardCostActivated:
      name: dev.passage.costing.standardcost.activated.v1
      summary: A standard cost activation (or its reversal) was recorded, with the revaluation journal it posted
      contentType: application/cloudevents+json
      payload: { $ref: "#/components/schemas/StandardCostActivatedData" }
    PostingAccountsChanged:
      name: dev.passage.costing.postingaccounts.changed.v1
      summary: The ledger accounts that activations of a legal entity post to changed
      contentType: application/cloudevents+json
      payload: { $ref: "#/components/schemas/PostingAccountsChangedData" }
    ActivationAttemptResolved:
      name: dev.passage.costing.activationattempt.resolved.v1
      summary: An operator confirmed whether the ledger entry of an old activation attempt landed, and the attempt was recorded or discarded
      contentType: application/cloudevents+json
      payload: { $ref: "#/components/schemas/ActivationAttemptResolvedData" }
  schemas:
    ActivationAttemptResolvedData:
      type: object
      required: [costingVersionId, legalEntityId, activationId, outcome, reason, actor]
      properties:
        costingVersionId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        activationId: { type: string, format: uuid }
        reversesActivationId: { type: string, format: uuid }
        outcome: { type: string, enum: [posted, not-posted], description: "posted - the operator confirmed the ledger entry exists and the activation was recorded; not-posted - the operator confirmed nothing landed and discarded the attempt" }
        journalEntryId: { type: string, description: The ledger entry the operator confirmed; empty for not-posted }
        reason: { type: string }
        actor: { type: string }
    PostingAccountsChangedData:
      type: object
      required: [legalEntityId, inventoryAccount, costChangeAccount]
      properties:
        legalEntityId: { type: string, format: uuid }
        inventoryAccount: { type: string }
        costChangeAccount: { type: string }
        actor: { type: string }
    StandardCostActivatedData:
      type: object
      required: [activationId, costingVersionId, legalEntityId, itemCount, revaluationJournalId, totalRevaluation, currency, postingDate, newStandardForOpenOrders]
      properties:
        activationId: { type: string, format: uuid }
        costingVersionId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        reversesActivationId: { type: string, format: uuid, description: Set when this activation reverses an earlier one }
        itemCount: { type: integer, minimum: 1 }
        revaluationJournalId: { type: string, description: "Ledger journal entry id; empty when the revaluation total is zero and nothing was posted" }
        totalRevaluation: { type: string, description: Decimal in the currency's minor unit; negative is a loss }
        currency: { type: string }
        postingDate: { type: string, format: date }
        newStandardForOpenOrders: { type: boolean }
        actor: { type: string }
    CostComponentCreatedData:
      type: object
      required: [id, code, name, costGroupType, behaviour]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        costGroupType: { type: string, enum: [DirectMaterial, DirectManufacturing, Indirect, Undefined] }
        behaviour: { type: string, enum: [Fixed, Variable] }
    CostGroupCreatedData:
      type: object
      required: [id, code, name, type, behaviour, componentId, componentCode]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [DirectMaterial, DirectManufacturing, Indirect, Undefined] }
        behaviour: { type: string, enum: [Fixed, Variable] }
        componentId: { type: string, format: uuid }
        componentCode: { type: string }
    VersionCreatedData:
      type: object
      required: [id, legalEntityId, code, type, status, fallback, fallbackVersionId, siteIds, effectiveFrom]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string }
        type: { type: string, enum: [Standard, Planned, Simulation, Conversion] }
        status: { type: string, enum: [Open] }
        fallback: { type: string, enum: [None, Active, SpecifiedVersion] }
        fallbackVersionId: { type: [string, "null"], format: uuid }
        siteIds: { type: array, items: { type: string, format: uuid }, description: Empty means every site }
        effectiveFrom: { type: [string, "null"], format: date-time }
    VersionTransitionedData:
      type: object
      required: [id, legalEntityId, code, type, action, fromStatus, toStatus, version, activatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string }
        type: { type: string, enum: [Standard, Planned, Simulation, Conversion] }
        action: { type: string, enum: [block, unblock, activate, close] }
        fromStatus: { type: string, enum: [Open, Blocked, Active] }
        toStatus: { type: string, enum: [Open, Blocked, Active, Closed] }
        version: { type: integer, minimum: 2 }
        activatedAt: { type: [string, "null"], format: date-time }
        actor: { type: string }
