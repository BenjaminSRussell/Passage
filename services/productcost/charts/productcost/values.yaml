image:
  repository: ghcr.io/benjaminsrussell/productcost
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: productcost-db
migrateOnStart: false
replicaCount: 2
costing:
  maxLevels: 20
  rollWorkers: 4
