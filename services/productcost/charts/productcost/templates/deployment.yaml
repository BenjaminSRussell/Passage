apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: productcost
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: productcost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: productcost
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
{{- if .Values.serviceIdentity.signingKeySecret }}
      volumes:
        - name: service-identity
          secret:
            secretName: {{ .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
{{- end }}
      containers:
        - name: productcost
          image: {{ include "productcost.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            - name: COSTING_MAX_LEVELS
              value: {{ .Values.costing.maxLevels | quote }}
            - name: COSTING_ROLL_WORKERS
              value: {{ .Values.costing.rollWorkers | quote }}
            - name: PASSAGE_SERVICE_NAME
              value: productcost
            - { name: PRODUCTCOST_LEDGER_IDEMPOTENCY_TTL_DAYS, value: {{ .Values.ledgerIdempotencyTtlDays | quote }} }
{{- if .Values.ledgerUrl }}
            - { name: LEDGER_URL, value: {{ .Values.ledgerUrl | quote }} }
{{- end }}
{{- if .Values.inventoryUrl }}
            - { name: INVENTORY_URL, value: {{ .Values.inventoryUrl | quote }} }
{{- end }}
{{- if .Values.serviceIdentity.signingKeySecret }}
            - name: PASSAGE_SERVICE_SIGNING_KEY_FILE
              value: /var/run/passage/service-identity/signing-key
{{- if .Values.serviceIdentity.keyId }}
            - name: PASSAGE_SERVICE_KEY_ID
              value: {{ .Values.serviceIdentity.keyId | quote }}
{{- end }}
{{- end }}
{{- if .Values.serviceIdentity.signingKeySecret }}
          volumeMounts:
            - { name: service-identity, mountPath: /var/run/passage/service-identity, readOnly: true }
{{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
