asyncapi: 3.0.0
info:
  title: engineering
  version: 0.1.0
channels:
  passage.engineering.bomversion:
    address: passage.engineering.bomversion
    messages:
      activated: { $ref: '#/components/messages/bomVersionActivated' }
      expired: { $ref: '#/components/messages/bomVersionExpired' }
  passage.engineering.eco:
    address: passage.engineering.eco
    messages:
      submitted: { $ref: '#/components/messages/ecoSubmitted' }
      approved: { $ref: '#/components/messages/ecoApproved' }
      released: { $ref: '#/components/messages/ecoReleased' }
  passage.engineering.ecr:
    address: passage.engineering.ecr
    messages:
      submitted: { $ref: '#/components/messages/ecrSubmitted' }
      approved: { $ref: '#/components/messages/ecrApproved' }
      rejected: { $ref: '#/components/messages/ecrRejected' }
      cancelled: { $ref: '#/components/messages/ecrCancelled' }
  passage.engineering.routeversion:
    address: passage.engineering.routeversion
    messages:
      activated: { $ref: '#/components/messages/routeVersionActivated' }
  passage.engineering.resource:
    address: passage.engineering.resource
    messages:
      changed: { $ref: '#/components/messages/resourceChanged' }
  passage.engineering.calendar:
    address: passage.engineering.calendar
    messages:
      generated: { $ref: '#/components/messages/calendarGenerated' }
operations:
  onBomVersionActivated:
    action: send
    channel: { $ref: '#/channels/passage.engineering.bomversion' }
    messages: [{ $ref: '#/channels/passage.engineering.bomversion/messages/activated' }]
  onBomVersionExpired:
    action: send
    channel: { $ref: '#/channels/passage.engineering.bomversion' }
    messages: [{ $ref: '#/channels/passage.engineering.bomversion/messages/expired' }]
  onEcoSubmitted:
    action: send
    channel: { $ref: '#/channels/passage.engineering.eco' }
    messages: [{ $ref: '#/channels/passage.engineering.eco/messages/submitted' }]
  onEcoApproved:
    action: send
    channel: { $ref: '#/channels/passage.engineering.eco' }
    messages: [{ $ref: '#/channels/passage.engineering.eco/messages/approved' }]
  onEcoReleased:
    action: send
    channel: { $ref: '#/channels/passage.engineering.eco' }
    messages: [{ $ref: '#/channels/passage.engineering.eco/messages/released' }]
  onEcrSubmitted:
    action: send
    channel: { $ref: '#/channels/passage.engineering.ecr' }
    messages: [{ $ref: '#/channels/passage.engineering.ecr/messages/submitted' }]
  onEcrApproved:
    action: send
    channel: { $ref: '#/channels/passage.engineering.ecr' }
    messages: [{ $ref: '#/channels/passage.engineering.ecr/messages/approved' }]
  onEcrRejected:
    action: send
    channel: { $ref: '#/channels/passage.engineering.ecr' }
    messages: [{ $ref: '#/channels/passage.engineering.ecr/messages/rejected' }]
  onEcrCancelled:
    action: send
    channel: { $ref: '#/channels/passage.engineering.ecr' }
    messages: [{ $ref: '#/channels/passage.engineering.ecr/messages/cancelled' }]
  onRouteVersionActivated:
    action: send
    channel: { $ref: '#/channels/passage.engineering.routeversion' }
    messages: [{ $ref: '#/channels/passage.engineering.routeversion/messages/activated' }]
  onResourceChanged:
    action: send
    channel: { $ref: '#/channels/passage.engineering.resource' }
    messages: [{ $ref: '#/channels/passage.engineering.resource/messages/changed' }]
  onCalendarGenerated:
    action: send
    channel: { $ref: '#/channels/passage.engineering.calendar' }
    messages: [{ $ref: '#/channels/passage.engineering.calendar/messages/generated' }]
components:
  messages:
    bomVersionActivated:
      name: bomVersionActivated
      title: BOM version became active
      payload:
        type: object
        required: [bomVersionId, productId, effectiveFrom, lineCount]
        properties:
          bomVersionId: { type: string }
          productId: { type: string }
          siteId: { type: string }
          effectiveFrom: { type: string, format: date }
          effectiveTo: { type: string, format: date }
          lineCount: { type: integer }
          supersedesVersionId: { type: string }
          usage: { type: string, enum: [production, engineering, costing, maintenance, sales, universal], description: 'FR-9.19 BOM usage; absent on events written before slice 22, which were all production material BOMs.' }
          category: { type: string, enum: [material, document], description: FR-9.19 BOM category. }
      x-passage-type: dev.passage.engineering.bomversion.activated.v1
    bomVersionExpired:
      name: bomVersionExpired
      title: BOM version expired by an ECO
      payload:
        type: object
        required: [bomVersionId, effectiveTo, ecoId]
        properties:
          bomVersionId: { type: string }
          effectiveTo: { type: string, format: date }
          ecoId: { type: string }
      x-passage-type: dev.passage.engineering.bomversion.expired.v1
    ecoSubmitted:
      name: ecoSubmitted
      title: ECO submitted for approval
      payload: &ecoPayload
        type: object
        required: [ecoId, ecoNumber, affectedVersions]
        properties:
          ecoId: { type: string }
          ecoNumber: { type: string }
          affectedVersions: { type: array, items: { type: string } }
          releaseDate: { type: string, format: date }
          approverId: { type: string }
          ecrId: { type: string, description: The approved change request this ECO carries out; absent for an ECO raised directly. }
      x-passage-type: dev.passage.engineering.eco.submitted.v1
    ecoApproved:
      name: ecoApproved
      title: ECO approved
      payload: *ecoPayload
      x-passage-type: dev.passage.engineering.eco.approved.v1
    ecoReleased:
      name: ecoReleased
      title: ECO released to production
      payload: *ecoPayload
      x-passage-type: dev.passage.engineering.eco.released.v1
    ecrSubmitted:
      name: ecrSubmitted
      title: Engineering change request submitted
      payload: &ecrPayload
        type: object
        required: [ecrId, ecrNumber, title, priority, products, requestedBy]
        properties:
          ecrId: { type: string }
          ecrNumber: { type: string }
          title: { type: string }
          priority: { type: string, enum: [low, medium, high, critical] }
          products: { type: array, items: { type: string } }
          requestedBy: { type: string }
          decidedBy: { type: string, description: Set on the approved and rejected events (the reviewer) and on the cancelled event (the requester who withdrew it). }
      x-passage-type: dev.passage.engineering.ecr.submitted.v1
    ecrApproved:
      name: ecrApproved
      title: Engineering change request approved
      payload: *ecrPayload
      x-passage-type: dev.passage.engineering.ecr.approved.v1
    ecrRejected:
      name: ecrRejected
      title: Engineering change request rejected
      payload: *ecrPayload
      x-passage-type: dev.passage.engineering.ecr.rejected.v1
    ecrCancelled:
      name: ecrCancelled
      title: Engineering change request withdrawn
      summary: The requester withdrew a submitted or under-review request. A draft withdrawn before submission raises no event.
      payload: *ecrPayload
      x-passage-type: dev.passage.engineering.ecr.cancelled.v1
    routeVersionActivated:
      name: routeVersionActivated
      title: Route version became active
      payload:
        type: object
        required: [routeVersionId, productId, siteId, effectiveFrom]
        properties:
          routeVersionId: { type: string }
          productId: { type: string }
          siteId: { type: string }
          effectiveFrom: { type: string, format: date }
      x-passage-type: dev.passage.engineering.routeversion.activated.v1
    resourceChanged:
      name: resourceChanged
      title: Resource created, changed or deleted
      description: Emitted when a resource is created, when an edit changes at least one field, and when it is deleted. changedFields names the fields that differ; a delete carries the single value deleted.
      payload:
        type: object
        required: [resourceId, efficiencyPct, changedFields]
        properties:
          resourceId: { type: string }
          siteId: { type: string }
          calendarId: { type: string }
          efficiencyPct: { type: string }
          changedFields: { type: array, items: { type: string } }
      x-passage-type: dev.passage.engineering.resource.changed.v1
    calendarGenerated:
      name: calendarGenerated
      title: Calendar days generated for a range
      payload:
        type: object
        required: [calendarId, from, to, openDays]
        properties:
          calendarId: { type: string }
          from: { type: string, format: date }
          to: { type: string, format: date }
          openDays: { type: integer }
      x-passage-type: dev.passage.engineering.calendar.generated.v1
