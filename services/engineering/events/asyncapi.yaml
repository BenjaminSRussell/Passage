asyncapi: 3.0.0
info:
  title: engineering
  version: 0.1.0
channels:
  depot.engineering.bomversion:
    address: depot.engineering.bomversion
    messages:
      activated: { $ref: '#/components/messages/bomVersionActivated' }
      expired: { $ref: '#/components/messages/bomVersionExpired' }
  depot.engineering.eco:
    address: depot.engineering.eco
    messages:
      submitted: { $ref: '#/components/messages/ecoSubmitted' }
      approved: { $ref: '#/components/messages/ecoApproved' }
      released: { $ref: '#/components/messages/ecoReleased' }
  depot.engineering.ecr:
    address: depot.engineering.ecr
    messages:
      submitted: { $ref: '#/components/messages/ecrSubmitted' }
      approved: { $ref: '#/components/messages/ecrApproved' }
      rejected: { $ref: '#/components/messages/ecrRejected' }
      cancelled: { $ref: '#/components/messages/ecrCancelled' }
  depot.engineering.routeversion:
    address: depot.engineering.routeversion
    messages:
      activated: { $ref: '#/components/messages/routeVersionActivated' }
  depot.engineering.resource:
    address: depot.engineering.resource
    messages:
      changed: { $ref: '#/components/messages/resourceChanged' }
  depot.engineering.calendar:
    address: depot.engineering.calendar
    messages:
      generated: { $ref: '#/components/messages/calendarGenerated' }
  depot.engineering.releasesession:
    address: depot.engineering.releasesession
    messages:
      created: { $ref: '#/components/messages/releaseSessionCreated' }
  depot.engineering.releaseline:
    address: depot.engineering.releaseline
    messages:
      accepted: { $ref: '#/components/messages/releaseLineAccepted' }
  depot.engineering.releasedproduct:
    address: depot.engineering.releasedproduct
    messages:
      changed: { $ref: '#/components/messages/releasedProductChanged' }
  depot.engineering.document:
    address: depot.engineering.document
    messages:
      signed: { $ref: '#/components/messages/documentSigned' }
      released: { $ref: '#/components/messages/documentReleased' }
  depot.engineering.ebom:
    address: depot.engineering.ebom
    messages:
      imported: { $ref: '#/components/messages/ebomImported' }
operations:
  onBomVersionActivated:
    action: send
    channel: { $ref: '#/channels/depot.engineering.bomversion' }
    messages: [{ $ref: '#/channels/depot.engineering.bomversion/messages/activated' }]
  onBomVersionExpired:
    action: send
    channel: { $ref: '#/channels/depot.engineering.bomversion' }
    messages: [{ $ref: '#/channels/depot.engineering.bomversion/messages/expired' }]
  onEcoSubmitted:
    action: send
    channel: { $ref: '#/channels/depot.engineering.eco' }
    messages: [{ $ref: '#/channels/depot.engineering.eco/messages/submitted' }]
  onEcoApproved:
    action: send
    channel: { $ref: '#/channels/depot.engineering.eco' }
    messages: [{ $ref: '#/channels/depot.engineering.eco/messages/approved' }]
  onEcoReleased:
    action: send
    channel: { $ref: '#/channels/depot.engineering.eco' }
    messages: [{ $ref: '#/channels/depot.engineering.eco/messages/released' }]
  onEcrSubmitted:
    action: send
    channel: { $ref: '#/channels/depot.engineering.ecr' }
    messages: [{ $ref: '#/channels/depot.engineering.ecr/messages/submitted' }]
  onEcrApproved:
    action: send
    channel: { $ref: '#/channels/depot.engineering.ecr' }
    messages: [{ $ref: '#/channels/depot.engineering.ecr/messages/approved' }]
  onEcrRejected:
    action: send
    channel: { $ref: '#/channels/depot.engineering.ecr' }
    messages: [{ $ref: '#/channels/depot.engineering.ecr/messages/rejected' }]
  onEcrCancelled:
    action: send
    channel: { $ref: '#/channels/depot.engineering.ecr' }
    messages: [{ $ref: '#/channels/depot.engineering.ecr/messages/cancelled' }]
  onRouteVersionActivated:
    action: send
    channel: { $ref: '#/channels/depot.engineering.routeversion' }
    messages: [{ $ref: '#/channels/depot.engineering.routeversion/messages/activated' }]
  onResourceChanged:
    action: send
    channel: { $ref: '#/channels/depot.engineering.resource' }
    messages: [{ $ref: '#/channels/depot.engineering.resource/messages/changed' }]
  onCalendarGenerated:
    action: send
    channel: { $ref: '#/channels/depot.engineering.calendar' }
    messages: [{ $ref: '#/channels/depot.engineering.calendar/messages/generated' }]
  onReleaseSessionCreated:
    action: send
    channel: { $ref: '#/channels/depot.engineering.releasesession' }
    messages: [{ $ref: '#/channels/depot.engineering.releasesession/messages/created' }]
  onReleaseLineAccepted:
    action: send
    channel: { $ref: '#/channels/depot.engineering.releaseline' }
    messages: [{ $ref: '#/channels/depot.engineering.releaseline/messages/accepted' }]
  onReleasedProductChanged:
    action: send
    channel: { $ref: '#/channels/depot.engineering.releasedproduct' }
    messages: [{ $ref: '#/channels/depot.engineering.releasedproduct/messages/changed' }]
  onDocumentSigned:
    action: send
    channel: { $ref: '#/channels/depot.engineering.document' }
    messages: [{ $ref: '#/channels/depot.engineering.document/messages/signed' }]
  onDocumentReleased:
    action: send
    channel: { $ref: '#/channels/depot.engineering.document' }
    messages: [{ $ref: '#/channels/depot.engineering.document/messages/released' }]
  onEbomImported:
    action: send
    channel: { $ref: '#/channels/depot.engineering.ebom' }
    messages: [{ $ref: '#/channels/depot.engineering.ebom/messages/imported' }]
components:
  messages:
    bomVersionActivated:
      name: bomVersionActivated
      title: BOM version became active
      payload:
        type: object
        required: [bomVersionId, productId, effectiveFrom, lineCount]
        properties:
          bomVersionId: { type: string }
          productId: { type: string }
          siteId: { type: string }
          effectiveFrom: { type: string, format: date }
          effectiveTo: { type: string, format: date }
          lineCount: { type: integer }
          supersedesVersionId: { type: string }
          usage: { type: string, enum: [production, engineering, costing, maintenance, sales, universal], description: 'FR-9.19 BOM usage; absent on events written before slice 22, which were all production material BOMs.' }
          category: { type: string, enum: [material, document], description: FR-9.19 BOM category. }
      x-depot-type: dev.depot.engineering.bomversion.activated.v1
    bomVersionExpired:
      name: bomVersionExpired
      title: BOM version expired by an ECO
      payload:
        type: object
        required: [bomVersionId, effectiveTo, ecoId]
        properties:
          bomVersionId: { type: string }
          effectiveTo: { type: string, format: date }
          ecoId: { type: string }
      x-depot-type: dev.depot.engineering.bomversion.expired.v1
    ecoSubmitted:
      name: ecoSubmitted
      title: ECO submitted for approval
      payload: &ecoPayload
        type: object
        required: [ecoId, ecoNumber, affectedVersions]
        properties:
          ecoId: { type: string }
          ecoNumber: { type: string }
          affectedVersions: { type: array, items: { type: string } }
          releaseDate: { type: string, format: date }
          approverId: { type: string }
          ecrId: { type: string, description: The approved change request this ECO carries out; absent for an ECO raised directly. }
          legalEntityId: { type: string, description: Present on submitted only; omitted for a tenant-wide caller. }
      x-depot-type: dev.depot.engineering.eco.submitted.v1
    ecoApproved:
      name: ecoApproved
      title: ECO approved
      payload: *ecoPayload
      x-depot-type: dev.depot.engineering.eco.approved.v1
    ecoReleased:
      name: ecoReleased
      title: ECO released to production
      payload: *ecoPayload
      x-depot-type: dev.depot.engineering.eco.released.v1
    ecrSubmitted:
      name: ecrSubmitted
      title: Engineering change request submitted
      payload: &ecrPayload
        type: object
        required: [ecrId, ecrNumber, title, priority, products, requestedBy]
        properties:
          ecrId: { type: string }
          ecrNumber: { type: string }
          title: { type: string }
          priority: { type: string, enum: [low, medium, high, critical] }
          products: { type: array, items: { type: string } }
          requestedBy: { type: string }
          decidedBy: { type: string, description: Set on the approved and rejected events (the reviewer) and on the cancelled event (the requester who withdrew it). }
      x-depot-type: dev.depot.engineering.ecr.submitted.v1
    ecrApproved:
      name: ecrApproved
      title: Engineering change request approved
      payload: *ecrPayload
      x-depot-type: dev.depot.engineering.ecr.approved.v1
    ecrRejected:
      name: ecrRejected
      title: Engineering change request rejected
      payload: *ecrPayload
      x-depot-type: dev.depot.engineering.ecr.rejected.v1
    ecrCancelled:
      name: ecrCancelled
      title: Engineering change request withdrawn
      summary: The requester withdrew a submitted or under-review request. A draft withdrawn before submission raises no event.
      payload: *ecrPayload
      x-depot-type: dev.depot.engineering.ecr.cancelled.v1
    routeVersionActivated:
      name: routeVersionActivated
      title: Route version became active
      payload:
        type: object
        required: [routeVersionId, productId, siteId, effectiveFrom]
        properties:
          routeVersionId: { type: string }
          productId: { type: string }
          siteId: { type: string }
          effectiveFrom: { type: string, format: date }
      x-depot-type: dev.depot.engineering.routeversion.activated.v1
    resourceChanged:
      name: resourceChanged
      title: Resource created, changed or deleted
      description: Emitted when a resource is created, when an edit changes at least one field, and when it is deleted. changedFields names the fields that differ; a delete carries the single value deleted.
      payload:
        type: object
        required: [resourceId, efficiencyPct, changedFields]
        properties:
          resourceId: { type: string }
          siteId: { type: string }
          calendarId: { type: string }
          efficiencyPct: { type: string }
          changedFields: { type: array, items: { type: string } }
      x-depot-type: dev.depot.engineering.resource.changed.v1
    calendarGenerated:
      name: calendarGenerated
      title: Calendar days generated for a range
      payload:
        type: object
        required: [calendarId, from, to, openDays]
        properties:
          calendarId: { type: string }
          from: { type: string, format: date }
          to: { type: string, format: date }
          openDays: { type: integer }
      x-depot-type: dev.depot.engineering.calendar.generated.v1
    releaseSessionCreated:
      name: releaseSessionCreated
      title: Product-release session created
      payload:
        type: object
        required: [sessionId, number, source]
        properties:
          sessionId: { type: string }
          number: { type: string }
          source: { type: string }
      x-depot-type: dev.depot.engineering.releasesession.created.v1
    releaseLineAccepted:
      name: releaseLineAccepted
      title: Product-release line accepted
      payload:
        type: object
        required: [lineId, sessionId, legalEntityId, acceptedBy]
        properties:
          lineId: { type: string }
          sessionId: { type: string }
          legalEntityId: { type: string }
          acceptedBy: { type: string }
      x-depot-type: dev.depot.engineering.releaseline.accepted.v1
    releasedProductChanged:
      name: releasedProductChanged
      title: Released product readiness changed
      payload:
        type: object
        required: [releasedProductId, productId, legalEntityId, state]
        properties:
          releasedProductId: { type: string }
          productId: { type: string }
          legalEntityId: { type: string }
          state: { type: string }
      x-depot-type: dev.depot.engineering.releasedproduct.changed.v1
    documentSigned:
      name: documentSigned
      title: Document electronically signed
      payload:
        type: object
        required: [documentId, recordId, signerId, meaning, signedAt]
        properties:
          documentId: { type: string }
          recordId: { type: string }
          signerId: { type: string }
          meaning: { type: string }
          signedAt: { type: string, format: date-time }
      x-depot-type: dev.depot.engineering.document.signed.v1
    documentReleased:
      name: documentReleased
      title: Document released
      payload:
        type: object
        required: [documentId, number, version]
        properties:
          documentId: { type: string }
          number: { type: string }
          version: { type: string }
      x-depot-type: dev.depot.engineering.document.released.v1
    ebomImported:
      name: ebomImported
      title: Engineering BOM imported
      payload:
        type: object
        required: [importId, partNumber, revision, added, exceptions]
        properties:
          importId: { type: string }
          partNumber: { type: string }
          revision: { type: string }
          added: { type: integer }
          exceptions: { type: integer }
      x-depot-type: dev.depot.engineering.ebom.imported.v1
