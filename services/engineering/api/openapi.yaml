openapi: 3.1.0
info:
  title: engineering
  version: 0.1.0
  description: Engineering data service. Covers BOM versions, explosion, where-used, routing lead time, engineering change orders, and (slice 4) work calendars, resource groups, capabilities and resources, and (slice 6) read APIs for route versions, the active route version as of a date, and BOM version detail, and (slice 8) resource, resource group and capability lists and route version activation.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/engineering/bom-versions:
    post:
      operationId: createBomVersion
      summary: Create a BOM version
      x-passage-duty: engineering.bom.write
      x-passage-duty-alternatives: [engineering.import.write]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
      responses:
        '201':
          description: BOM version created as draft or active, or the original version on an Idempotency-Key replay. A caller holding only engineering.import.write (the migration loader) creates drafts; asking it for an active version is 403 AUTH-0003. A cycle is ENG-BOM-CYCLE and an overlapping active range is ENG-BOM-OVERLAP, and an inconsistent alternative group is 422 ENG-ALT-CONFLICT (BR-9.16).
          content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listBomVersions
      summary: List BOM versions
      x-passage-duty: engineering.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: productId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: siteId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, expired, superseded, cancelled] } }
        - { name: usage, in: query, description: Only versions of this BOM usage (FR-9.19)., schema: { type: string, enum: [production, engineering, costing, maintenance, sales, universal] } }
        - { name: category, in: query, description: Only versions of this BOM category (FR-9.19)., schema: { type: string, enum: [material, document] } }
        - { name: asOf, in: query, description: Only versions whose effective range covers this date., schema: { type: string, format: date } }
      responses:
        '200':
          description: One page of BOM version headers ordered by id. Pass nextCursor as cursor for the next page. A bad filter, limit or cursor is 400 COM-0001 with the offending fields in errors.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BomVersion' } }, nextCursor: { type: string } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/bom-versions/{id}:
    get:
      operationId: getBomVersion
      summary: Get a BOM version with its lines
      x-passage-duty: engineering.read
      x-passage-duty-alternatives: [engineering.import.read]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The BOM version with its lines in line-number order, the body create returns.
          content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateBomVersion
      summary: Save an edited draft BOM version
      x-passage-duty: engineering.bom.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
      responses:
        '200':
          description: The draft as saved (BR-9.3). The site, effectivity, quantity range and every line are replaced by the request, so a line left out is deleted; version is the loaded version plus 1. The product, status and id do not change and no event is emitted, as creating a draft emits none. The version field of the request is required and must be the value the editor loaded. Lines are identified by lineNo; a line without one is numbered by its position, as on create. An omitted usage or category keeps the stored one. An Idempotency-Key replay returns the draft as it is now.
          content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
        '400':
          description: COM-0001 with per-field errors, for a missing version, a status other than draft, a changed productId, an id that differs from the path, a missing or malformed date, bad lines, an unknown field, or an id that is not a UUID.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-BOM-VERSION-CONFLICT, another save came first (reload the draft and merge line by line); ENG-BOM-STATE, the version is not a draft; ENG-BOM-IN-ECO, an open ECO will release this draft; or the Idempotency-Key is in flight.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: ENG-BOM-CYCLE, a component would close a cycle as of the new date; ENG-ALT-CONFLICT, an alternative group is inconsistent (BR-9.16); or idempotency_key_reuse, the key was used for a different request.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/bom-versions/{id}:activate:
    post:
      operationId: activateBomVersion
      summary: Activate a draft BOM version
      x-passage-duty: engineering.bom.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The BOM version with its lines, now active. Activating an already active version returns it unchanged and emits no second bomversion.activated event.
          content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-BOM-STATE, the version is not a draft (it is expired, superseded or cancelled); or ENG-BOM-IN-ECO, an ECO that is not yet released, rejected or cancelled replaces an old version with this draft, so the ECO release activates it.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: ENG-BOM-ECO-REQUIRED, the product and site already have a version so the draft must be released through an ECO; ENG-BOM-OVERLAP, an active version overlaps its dates and quantities; or ENG-BOM-CYCLE, a component would create a cycle.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/bom-versions/{id}:cancel:
    post:
      operationId: cancelBomVersion
      summary: Cancel a draft BOM version
      x-passage-duty: engineering.bom.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The BOM version with its lines, now cancelled (BR-9.1 draft to cancelled). The row is kept and no event is emitted, as creating a draft emits none. Cancelling an already cancelled version returns it unchanged.
          content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-BOM-STATE, the version is not a draft; or ENG-BOM-IN-ECO, an ECO that is not yet released, rejected or cancelled replaces an old version with this draft.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/bom-versions/{id}:copy:
    post:
      operationId: copyBomVersion
      summary: Copy a BOM version into a new draft
      x-passage-duty: engineering.bom.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BomCopyRequest' } } }
      responses:
        '201':
          description: A new draft BOM version with the source's quantity range, the chosen lines (every line when lineNos is omitted), the source's product and site unless the request names others, the requested effectivity, and copiedFromVersionId set to the source (FR-9.12). The source may be in any status, including cancelled or expired, and is not changed. The copy goes through the create-time cycle check and emits no event, as creating a draft emits none; activating it or releasing it through an ECO is a separate call. An Idempotency-Key replay returns the draft created the first time.
          content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
        '400':
          description: COM-0001 with per-field errors, for a missing or malformed effectiveFrom or an effectiveTo before it, an empty lineNos or a line number the source does not have, a siteId over 64 characters, an unknown field, or an id that is not a UUID.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The Idempotency-Key is in flight.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: ENG-BOM-CYCLE, the copied lines would close a cycle as of the new date; ENG-ALT-CONFLICT, the copied lines leave an alternative group inconsistent; or idempotency_key_reuse, the key was used for a different source or dates.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/route-versions:
    get:
      operationId: listRouteVersions
      summary: List route versions
      x-passage-duty: engineering.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: productId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: siteId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, expired, cancelled] } }
        - { name: asOf, in: query, description: Only versions whose effective range covers this date., schema: { type: string, format: date } }
      responses:
        '200':
          description: One page of route version headers ordered by id, each with operationCount and no operations. Pass nextCursor as cursor for the next page. A bad filter, limit or cursor is 400 COM-0001.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/RouteVersionHeader' } }, nextCursor: { type: string } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createRouteVersion
      summary: Create a draft route version
      x-passage-duty: engineering.route.write
      x-passage-duty-alternatives: [engineering.import.write]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersionCreate' } } }
      responses:
        '201':
          description: Draft route version with its operations and requirements, or the original version on an Idempotency-Key replay. Omitting versionNo takes the next number for the product, site and route code. Activation is a separate call.
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400':
          description: COM-0001 with per-field errors, for a malformed or missing field or a value its column cannot hold (integers above 2147483647, hours from 10000000000, process or overlap quantity from 100000000000000 or with more than 6 decimals, efficiency from 1000, a requirement refId over 64 characters).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: ENG-DUPLICATE, the version number is already used for this product, site and route code, or the Idempotency-Key is in flight.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: A route rule failed, such as ENG-ROUTE-CYCLE, ENG-ROUTE-NEXT, ENG-ROUTE-OP-DUP, ENG-ROUTE-OPS-LIMIT, ENG-ROUTE-QTY, ENG-ROUTE-REQ-KIND or ENG-ROUTE-SECONDARY-NOPRIMARY (BR-9.7, a secondary operation with no primary joining the same next operation), or idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/route-versions:active:
    get:
      operationId: getActiveRouteVersion
      summary: Get the active route version as of a date
      x-passage-duty: engineering.read
      parameters:
        - { name: productId, in: query, required: true, schema: { type: string, maxLength: 64 } }
        - { name: siteId, in: query, required: true, schema: { type: string, maxLength: 64 } }
        - { name: asOf, in: query, description: Defaults to today (UTC)., schema: { type: string, format: date } }
      responses:
        '200':
          description: The single active route version covering asOf, with operations and requirements. Drafts and expired versions never match.
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/route-versions/{id}:
    get:
      operationId: getRouteVersion
      summary: Get a route version with its operations
      x-passage-duty: engineering.read
      x-passage-duty-alternatives: [engineering.import.read]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The route version with its operations and their requirements.
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateRouteVersion
      summary: Save an edited draft route version
      x-passage-duty: engineering.route.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersionEdit' } } }
      responses:
        '200':
          description: The draft as saved (BR-9.3). The effectivity and every operation with its requirements are replaced by the request, so an operation left out is deleted; version is the loaded version plus 1. The product, site, route code, version number, status and id do not change and no event is emitted, as creating a draft emits none. The version field of the request is required and must be the value the editor loaded. An Idempotency-Key replay returns the draft as it is now.
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } }
        '400':
          description: COM-0001 with per-field errors, for a missing version, a changed productId, siteId, routeCode or versionNo, a missing or malformed date, a value an operation column cannot hold, an unknown field, or an id that is not a UUID.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-ROUTE-VERSION-CONFLICT, another save came first (reload the draft and merge); ENG-ROUTE-STATE, the version is not a draft; or the Idempotency-Key is in flight.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: A route rule failed, such as ENG-ROUTE-CYCLE, ENG-ROUTE-NEXT, ENG-ROUTE-OP-DUP, ENG-ROUTE-OPS-LIMIT, ENG-ROUTE-QTY, ENG-ROUTE-REQ-KIND or ENG-ROUTE-SECONDARY-NOPRIMARY; or idempotency_key_reuse, the key was used for a different request.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/route-versions/{id}:activate:
    post:
      operationId: activateRouteVersion
      summary: Activate a route version
      x-passage-duty: engineering.route.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The route version, now active. Activating an already active version returns it unchanged and emits no second routeversion.activated event.
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-ROUTE-STATE, the version is not a draft, or ENG-ROUTE-OVERLAP, another active version of the same product and site overlaps its dates.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: ENG-ROUTE-UNSATISFIED, an operation requirement cannot be met by the resources of the site; a requirement naming a resource that no longer exists (deleted since the draft was written) says which resource.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/route-versions/{id}:cancel:
    post:
      operationId: cancelRouteVersion
      summary: Cancel a draft route version
      x-passage-duty: engineering.route.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The route version with its operations, now cancelled (BR-9.1 draft to cancelled). The row, operations and requirements are kept and no event is emitted, as creating a draft emits none. Cancelling an already cancelled version returns it unchanged.
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } }
        '400':
          description: COM-0001, the id is not a UUID.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-ROUTE-STATE, the version is not a draft.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/route-versions/{id}:copy:
    post:
      operationId: copyRouteVersion
      summary: Copy a route version into a new draft
      x-passage-duty: engineering.route.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RouteCopyRequest' } } }
      responses:
        '201':
          description: A new draft route version with the source's route code, operations and requirements, the source's product and site unless the request names others, the next version number for that product, site and route code, the requested effectivity, and copiedFromVersionId set to the source (FR-9.12). The source may be in any status, including cancelled or expired, and is not changed. No event is emitted; activation, which checks the requirements against the target site's resources, is a separate call. An Idempotency-Key replay returns the draft created the first time.
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } }
        '400':
          description: COM-0001 with per-field errors, for a missing or malformed effectiveFrom or an effectiveTo before it, a productId or siteId over 64 characters, an unknown field, or an id that is not a UUID.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-DUPLICATE, another copy took the version number first, or the Idempotency-Key is in flight.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: A route rule failed on the copied operations, or idempotency_key_reuse, the key was used for a different source or dates.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/boms:explode:
    post:
      operationId: explodeBom
      summary: Explode a BOM to its components
      x-passage-duty: engineering.read
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExplodeRequest' } } }
      responses:
        '200':
          description: 'Multi-level explosion of the requested usage (default production, falling back to a universal BOM) as of the requested date, with phantoms inlined and a flat component list. FR-9.20 contract: a line in an alternative group (a phantom one included, which keeps its node) carries its group and discontinuation data unresolved, is listed in alternatives, and neither it nor anything below it is summed into flat; flat holds only components outside every group, so a consumer that needs the full requirement resolves alternatives itself (planning, wave 22). BOMs with no group explode exactly as before.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Explosion' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/boms:where-used:
    get:
      operationId: whereUsedBom
      summary: List where a component is used
      x-passage-duty: engineering.read
      parameters:
        - { name: component, in: query, required: true, schema: { type: string } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - { name: levels, in: query, schema: { type: integer, minimum: 1, maximum: 25, default: 25 } }
      responses:
        '200':
          description: Products whose active BOM version uses the component, with their own parents nested.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/UsedBy' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/routes:lead-time:
    post:
      operationId: computeRouteLeadTime
      summary: Compute routing lead time
      x-passage-duty: engineering.read
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LeadTimeRequest' } } }
      responses:
        '200':
          description: Stateless lead time for the supplied operations. Sequential operations add, parallel branches take the longest.
          content: { application/json: { schema: { $ref: '#/components/schemas/LeadTime' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ecos:
    post:
      operationId: createEco
      summary: Create an engineering change order
      x-passage-duty: engineering.bom.write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Eco' } } }
      responses:
        '201':
          description: ECO created in the submitted state, or the original ECO on an Idempotency-Key replay.
          content: { application/json: { schema: { $ref: '#/components/schemas/Eco' } } }
        '403':
          description: AUTH-0003 without engineering.bom.write, or ENG-ECO-BACKDATE-DUTY when the release date is before today's UTC date (BR-9.10; the backdate duty is not built, so every past date is refused).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: ENG-BOM-VERSION-NOTFOUND, a replaced or replacing BOM version does not exist, or ENG-ECR-NOTFOUND, the named ecrId does not exist in the tenant.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: ENG-ECR-NOT-APPROVED, the named ECR is not approved; ENG-ECR-CONVERTED, it already has a live ECO; or ENG-DUPLICATE, the ECO number or Idempotency-Key is taken.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: ENG-ECO-HORIZON, the release date is more than 365 days after today's UTC date (BR-9.10), or ENG-ECR-PRODUCT, a replaced product is not listed on the named ECR.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listEcos
      summary: List engineering change orders
      x-passage-duty: engineering.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [draft, submitted, approved, scheduled, released, rejected, cancelled] } }
      responses:
        '200':
          description: One page of ECOs ordered by id, each with its replacements. Pass nextCursor as cursor for the next page. A bad state, limit or cursor is 400 COM-0001.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Eco' } }, nextCursor: { type: string } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ecos/{id}:
    get:
      operationId: getEco
      summary: Get an engineering change order
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The ECO with its state, release date, approver and the BOM version replacements.
          content: { application/json: { schema: { $ref: '#/components/schemas/Eco' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ecos/{id}/impact:
    get:
      operationId: getEcoImpact
      summary: Get the impact report of an engineering change order
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, description: 'Date the where-used is evaluated. Defaults to the ECO release date when it is in the future, otherwise today.', schema: { type: string, format: date } }
      responses:
        '200':
          description: Each replacement with its component line differences, and the distinct products affected as of the date, the replaced products and every product that uses them at any level, with sites and active version ids. Open production and planned order counts are 0 until waves 21 and 22 supply them.
          content: { application/json: { schema: { $ref: '#/components/schemas/EcoImpact' } } }
        '400':
          description: COM-0001, the id is not a UUID or asOf is not a YYYY-MM-DD date.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: ENG-ECO-NOTFOUND, no ECO with this id in the tenant.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: ENG-BOM-CYCLE or ENG-BOM-TOOLARGE, the stored structure cannot be walked.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ecos/{id}:release:
    post:
      operationId: releaseEco
      summary: Approve and release an engineering change order
      x-passage-duty: engineering.eco.approve or engineering.eco.workflow
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: ECO approved and released. Old versions expire the day before the release date and new versions become active in one transaction. A future release date schedules the ECO. Each replacement must keep the BOM usage and category (FR-9.19), so a costing draft cannot expire the production BOM; otherwise 422 ENG-ECO-DRYRUN. Releasing an already released ECO returns it unchanged with no side effects, so a retry under the same Idempotency-Key is safe. An approved ECO (see the decision routes) is released without asking the approval service. An unavailable approval service is 503 ENG-ECO-APPROVER-UNAVAILABLE and leaves a submitted ECO unchanged.
          content: { application/json: { schema: { $ref: '#/components/schemas/Eco' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ecos/{id}:approve:
    post:
      operationId: approveEco
      summary: Record the approval of a submitted engineering change order
      x-passage-duty: engineering.eco.workflow
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'The ECO is approved, decidedBy is the acting user (never its creator: 403 ENG-ECO-SELF-APPROVAL; no user: ENG-ECO-ACTOR-REQUIRED), and eco.approved is enqueued. No BOM version changes until the ECO is released. Repeating it on an approved ECO returns the ECO unchanged. Any other state is 409 ENG-ECO-STATE.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Eco' } } }
        '404':
          description: ENG-ECO-NOTFOUND, no ECO with this id in the tenant.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ecos/{id}:reject:
    post:
      operationId: rejectEco
      summary: Record the rejection of a submitted engineering change order
      x-passage-duty: engineering.eco.workflow
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'The ECO is rejected and decidedBy is the acting user. A rejected ECO is final. An optional JSON body {reason} (200 characters at most) is kept as decisionReason; the creator cannot reject: 403 ENG-ECO-SELF-APPROVAL. Repeating it on a rejected ECO returns the ECO unchanged. Any other state is 409 ENG-ECO-STATE.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Eco' } } }
        '404':
          description: ENG-ECO-NOTFOUND, no ECO with this id in the tenant.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ecos/{id}:cancel:
    post:
      operationId: cancelEco
