          description: Resource created with its capabilities, or the original resource on an Idempotency-Key replay. A vendor without vendorPartyId is 422 ENG-RES-VENDOR and a group on another site is 422 ENG-RES-SITE.
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/resources/{id}:
    get:
      operationId: getResource
      summary: Get a resource
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The resource with its capabilities and effectiveCalendarId, which is the resource's own calendar or else its group's.
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateResource
      summary: Save an edited resource
      x-passage-duty: engineering.resource.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
      responses:
        '200':
          description: The resource as saved. Name, type, group, calendar, efficiency, capacity, exclusivity, vendor and every capability are replaced by the request, so a capability left out is removed; version is the loaded version plus 1 and resource.changed names the fields that differ. A save that changes nothing writes nothing and emits no event. The code and site are the resource's identity; they may be omitted but not changed. The version field of the request is required and must be the value the editor loaded. An Idempotency-Key replay returns the resource as it is now.
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '400':
          description: COM-0001 with per-field errors, for a missing version, a changed code or siteId, a bad type, efficiency, capacity or capability, an unknown field, or an id that is not a UUID.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-RES-VERSION-CONFLICT, another save came first (reload the resource and merge); or the Idempotency-Key is in flight.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: ENG-RES-VENDOR, a vendor resource needs vendorPartyId and others must not carry one; ENG-RES-SITE, the group is at another site; or idempotency_key_reuse, the key was used for a different request.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteResource
      summary: Delete a resource
      x-passage-duty: engineering.resource.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 'The resource and its capabilities are deleted (BR-9.11) and resource.changed is emitted with the changed field deleted. Route versions that are not active keep naming the id; activating such a draft fails ENG-ROUTE-UNSATISFIED. A delete waits for an activation in flight that requires the resource and is then refused if it went active.' }
        '400':
          description: COM-0001, the id is not a UUID.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-RES-IN-USE, an active route version requires this resource directly; change the route first. Requirements by group, capability or type do not block.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
