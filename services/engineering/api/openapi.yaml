      operationId: getDocumentType
      summary: Get an engineering document type by code
      x-passage-duty: engineering.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: The document type.
          content: { application/json: { schema: { $ref: '#/components/schemas/DocumentType' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/documents:
    post:
      operationId: createDocument
      summary: Create an engineering document version
      x-passage-duty: engineering.bom.write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } }
      responses:
        '201':
          description: Document created in_work, or the original on an Idempotency-Key replay.
          content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listDocuments
      summary: List engineering documents
      x-passage-duty: engineering.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: number, in: query, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: One page of documents ordered by id.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Document' } }, nextCursor: { type: string } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/documents/{id}:
    get:
      operationId: getDocument
      summary: Get an engineering document version
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The document with its originals and links.
          content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/documents/{id}:transition:
    post:
      operationId: transitionDocument
      summary: Move a document along its status network
      x-passage-duty: engineering.bom.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [to], properties: { to: { type: string, enum: [in_work, in_review, released, obsolete, cancelled] } } } } }
      responses:
        '200':
          description: The document in the new status. A signature-required edge is 409 ENG-DOC-SIGNED; use :sign instead.
          content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/documents/{id}:sign:
    post:
      operationId: signDocument
      summary: Electronically sign a document (21 CFR Part 11)
      x-passage-duty: engineering.doc.sign
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Passage-Reauth-Assertion, in: header, required: false, schema: { type: string }, description: 'Step-up proof from re-authentication of the signer (21 CFR 11.200), bound to the document id and record hash. No step-up issuer is configured yet, so outside PASSAGE_ENV=dev every sign is refused with 503 ENG-DOC-REAUTH-UNAVAILABLE; the web form never asks the user to type it.' }
      requestBody:
        content: { application/json: { schema: { type: object, properties: { printedName: { type: string, maxLength: 200 }, method: { type: string, maxLength: 64, description: 'Requested re-authentication method, passed to the verifier as a hint. The signature records the method the verifier proved, never this value (dev-unverified under PASSAGE_ENV=dev).' }, to: { type: string } } } } }
      responses:
        '200':
          description: The signed document. Records meaning, timestamp, record id and the record hash (id, number, part, version, type and the sorted originals) in an append-only signature, and queues the audit change in the same transaction; a relay delivers it to the audit service with retry and backoff. A successor of a released change-controlled version stays in_review, signed, until its approved ECO releases it.
          content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } }
        '403':
          description: ENG-DOC-REAUTH, missing or mismatched re-authentication; ENG-DOC-SIGNER, the last editor cannot independently review their own document; ENG-DOC-SIGN-SCOPE, the signer has no legal-entity scope, so the audit record could not be delivered on their behalf.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: ENG-DOC-ECO-REQUIRED, a change-controlled successor needs an approved ECO that lists it; ENG-DOC-STATE, it is already signed and waits for its ECO, or the stored record no longer hashes to the value presented for signature.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: ENG-DOC-NOT-SIGNABLE, the requested move needs no signature (only transitions of the status network that carry one are signed); ENG-DOC-NO-ORIGINALS, a type signed on release needs at least one original.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '503':
          description: ENG-DOC-REAUTH-UNAVAILABLE, no re-authentication verifier is configured.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/documents/{id}/signatures:
    get:
      operationId: listSignatures
      summary: List Part 11 signatures on a document
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Append-only signature manifestations for this document.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DocumentSignature' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/documents/{id}/where-used:
    get:
      operationId: documentWhereUsed
      summary: Find every product, BOM and route that names this document
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Where-used rows for the document number.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DocumentWhereUsed' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/documents/{id}/structure:
    put:
      operationId: setDocumentStructure
      summary: Set a document's child documents
      x-passage-duty: engineering.bom.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [children], properties: { children: { type: array, items: { type: string, format: uuid } } } } } }
      responses:
        '200':
          description: The child list as stored. A cycle is 422 ENG-DOC-CYCLE.
          content: { application/json: { schema: { type: object, required: [children], properties: { children: { type: array, items: { type: string, format: uuid } } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ebom-imports:
    post:
      operationId: importEbom
      summary: Import an engineering BOM from CAD or PLM
      x-passage-duty: engineering.bom.write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EbomImport' } } }
      responses:
        '201':
          description: Import stored as a draft engineering BOM. Unknown part numbers become ENG-EBOM-PART-UNKNOWN exceptions (AC-9.17). A released revision is 409 ENG-EBOM-REVISION-RELEASED.
          content: { application/json: { schema: { $ref: '#/components/schemas/EbomImport' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listEbomImports
      summary: List eBOM imports
      x-passage-duty: engineering.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of eBOM imports ordered by id.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/EbomImport' } }, nextCursor: { type: string } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ebom-imports/{id}:
    get:
      operationId: getEbomImport
      summary: Get an eBOM import
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The import, its exceptions and the eBOM-versus-mBOM comparison.
          content: { application/json: { schema: { $ref: '#/components/schemas/EbomImport' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      summary: Liveness probe
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      summary: Readiness probe
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string }
  schemas:
    BomLine:
      type: object
      required: [componentProductId, quantity]
      properties:
        lineNo: { type: integer }
        componentProductId: { type: string, maxLength: 64 }
        quantity: { type: string, description: Positive decimal string }
        series: { type: string, description: Positive decimal string, default: '1' }
        lineType: { type: string, enum: [item, phantom, co_product, by_product], default: item }
        scrapConst: { type: string }
        scrapVarPct: { type: string, description: 0 to 100 }
        roundUp: { type: string, enum: ['', quantity] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        altGroup: { type: string, maxLength: 2, description: 'FR-9.20 alternative item group; every line of a group names the same strategy. A group has at least two lines (BR-9.16, 422 ENG-ALT-CONFLICT).' }
        altStrategy: { type: string, enum: [priority, usage_probability] }
        altPriority: { type: integer, minimum: 1, maximum: 99, description: Required with the priority strategy and unique in the group. }
        usageProbabilityPct: { type: string, description: 'Required with the usage_probability strategy; the group sums to exactly 100.' }
        discontinuationGroup: { type: string, maxLength: 2 }
        discontinueType: { type: string, enum: [single, simultaneous] }
        followUpGroup: { type: string, maxLength: 2, description: The group the follow-up component joins; the follow-up component may not already be a member of it (BR-9.16). }
        followUpComponentId: { type: string, maxLength: 64 }
        discontinueOn: { type: string, format: date }
    BomVersion:
      type: object
      additionalProperties: false
      required: [productId, effectiveFrom, lines]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, maxLength: 64 }
        siteId: { type: string }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        fromQty: { type: string }
        toQty: { type: string }
        status: { type: string, enum: [draft, active, expired, superseded, cancelled], default: draft }
        usage: { type: string, enum: [production, engineering, costing, maintenance, sales, universal], default: production, description: 'FR-9.19. Overlap and first-version rules apply within one usage and category; explosion resolves one usage and falls back to universal.' }
        category: { type: string, enum: [material, document], default: material, description: Equipment, functional location, sales order and project BOMs arrive with waves 44, 27 and 41. }
        lines: { type: array, minItems: 1, maxItems: 5000, items: { $ref: '#/components/schemas/BomLine' } }
        copiedFromVersionId: { type: string, format: uuid, readOnly: true, description: The version this one was copied from (FR-9.12 lineage); ignored on create. }
        version: { type: integer, minimum: 1, description: 'The optimistic-locking counter (BR-9.3): reads return it, create ignores it, and PUT requires the value the editor loaded.' }
    OperationRequirement:
      type: object
      properties: { kind: { type: string, enum: [resource, group, capability, type] }, refId: { type: string }, level: { type: integer, minimum: 0 }, quantity: { type: integer, minimum: 1 } }
    RouteVersionOperation:
      type: object
      properties:
        { no: { type: integer }, operationId: { type: string, maxLength: 20 }, nextNo: { type: integer }, linkType: { type: string, enum: [hard, soft] },
          priority: { type: string, enum: [primary, secondary1, secondary2, secondary3] }, setupH: { type: string }, runH: { type: string }, processQty: { type: string },
          queueBeforeH: { type: string }, queueAfterH: { type: string }, transitH: { type: string }, efficiencyPct: { type: string }, overlapQty: { type: string }, scrapPercent: { type: string },
          requirements: { type: array, items: { $ref: '#/components/schemas/OperationRequirement' } } }
    RouteVersionHeader:
      type: object
      required: [id, productId, siteId, routeCode, versionNo, effectiveFrom, status, operationCount]
      properties:
        { id: { type: string, format: uuid }, productId: { type: string }, siteId: { type: string }, routeCode: { type: string }, versionNo: { type: integer },
          effectiveFrom: { type: string, format: date }, effectiveTo: { type: string, format: date }, status: { type: string, enum: [draft, active, expired, cancelled] },
          operationCount: { type: integer }, version: { type: integer, minimum: 1, description: 'The optimistic-locking counter (BR-9.3): it starts at 1 and each edit, activation and cancellation adds 1.' }, copiedFromVersionId: { type: string, format: uuid, description: The version this one was copied from (FR-9.12 lineage). } }
    BomCopyRequest:
      type: object
      additionalProperties: false
      required: [effectiveFrom]
      properties:
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        productId: { type: string, maxLength: 64, description: The product of the copy; omitted keeps the source's. }
        siteId: { type: string, maxLength: 64, description: The site of the copy; omitted keeps the source's, an empty string makes it valid for every site. }
        lineNos: { type: array, minItems: 1, items: { type: integer }, description: The source line numbers to copy; omitted copies every line. }
    RouteCopyRequest:
      type: object
      additionalProperties: false
      required: [effectiveFrom]
      properties:
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        productId: { type: string, maxLength: 64, description: The product of the copy; omitted keeps the source's. }
        siteId: { type: string, maxLength: 64, description: The site of the copy; omitted keeps the source's. }
    RouteVersionCreate:
      type: object
      additionalProperties: false
      required: [productId, siteId, routeCode, effectiveFrom, operations]
      properties:
        productId: { type: string, maxLength: 64 }
        siteId: { type: string, maxLength: 64 }
        routeCode: { type: string, maxLength: 64 }
        versionNo: { type: integer, minimum: 1, maximum: 2147483647, description: Omit to take the next number for the product, site and route code. }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        operations: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/RouteVersionOperation' } }
    RouteVersionEdit:
      type: object
      additionalProperties: false
      required: [effectiveFrom, operations, version]
      properties:
        productId: { type: string, maxLength: 64, description: Optional; when sent it must equal the draft's product. }
        siteId: { type: string, maxLength: 64, description: Optional; when sent it must equal the draft's site. }
        routeCode: { type: string, maxLength: 64, description: Optional; when sent it must equal the draft's route code. }
        versionNo: { type: integer, minimum: 1, maximum: 2147483647, description: Optional; when sent it must equal the draft's number. }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        version: { type: integer, minimum: 1, description: The optimistic-locking counter the editor loaded (BR-9.3). }
        operations: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/RouteVersionOperation' } }
    RouteVersion:
      allOf:
        - { $ref: '#/components/schemas/RouteVersionHeader' }
        - { type: object, required: [operations], properties: { operations: { type: array, items: { $ref: '#/components/schemas/RouteVersionOperation' } } } }
    ExplodeRequest:
      type: object
      additionalProperties: false
      required: [productId]
      properties:
        productId: { type: string }
        siteId: { type: string }
        asOf: { type: string, format: date, description: Defaults to today }
        quantity: { type: string, description: Defaults to 1 }
        levels: { type: integer, minimum: 1, maximum: 25, default: 25 }
        usage: { type: string, enum: [production, engineering, costing, maintenance, sales, universal], description: Defaults to production; a universal BOM is the fallback. }
    Explosion:
      type: object
      required: [root, flat]
      properties:
        root: { $ref: '#/components/schemas/Node' }
        flat: { type: array, description: Leaf totals outside every alternative group; group members and their components are left out and listed in alternatives., items: { type: object, required: [productId, quantity], properties: { productId: { type: string }, quantity: { type: string } } } }
        alternatives: { type: array, description: 'Every line in an alternative group (leaf or sub-assembly), unresolved, in explosion order; planning chooses among them (wave 22). A sub-assembly member''s components are in the tree under its node.', items: { $ref: '#/components/schemas/AlternativeMember' } }
    AlternativeGroup:
      type: object
      required: [group, strategy]
      properties: { group: { type: string }, priority: { type: integer }, strategy: { type: string, enum: [priority, usage_probability] }, usageProbabilityPct: { type: string } }
    Discontinuation:
      type: object
      required: [type]
      properties: { group: { type: string }, type: { type: string, enum: [single, simultaneous] }, followUpGroup: { type: string }, followUpComponentId: { type: string }, discontinueOn: { type: string, format: date } }
    AlternativeMember:
      type: object
      required: [parentProductId, productId, lineNo, quantity, alternative]
      properties: { parentProductId: { type: string }, productId: { type: string }, lineNo: { type: integer }, quantity: { type: string }, alternative: { $ref: '#/components/schemas/AlternativeGroup' } }
    Node:
      type: object
      required: [productId, level, quantity]
      properties: { productId: { type: string }, lineNo: { type: integer }, level: { type: integer }, quantity: { type: string }, alternative: { $ref: '#/components/schemas/AlternativeGroup' }, discontinuation: { $ref: '#/components/schemas/Discontinuation' }, children: { type: array, items: { $ref: '#/components/schemas/Node' } } }
    UsedBy:
      type: object
      required: [productId, versionId, level]
      properties: { productId: { type: string }, versionId: { type: string }, siteId: { type: string }, level: { type: integer }, parents: { type: array, items: { $ref: '#/components/schemas/UsedBy' } } }
    RouteOperation:
      type: object
      additionalProperties: false
      required: [no, processQty]
      properties:
        no: { type: integer }
        next: { type: integer, description: 0 ends the route }
        priority: { type: string }
        setup: { type: string }
        run: { type: string }
        processQty: { type: string }
        queueBefore: { type: string }
        queueAfter: { type: string }
        transit: { type: string }
        efficiencyPct: { type: string }
        overlapQty: { type: string, description: 'transfer batch: the next operation may start once this many units are done; 0 or at least the quantity is no overlap' }
    LeadTimeRequest:
      type: object
      additionalProperties: false
      required: [operations, quantity, hoursPerDay]
      properties:
        operations: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/RouteOperation' } }
        quantity: { type: string }
        hoursPerDay: { type: string }
    LeadTime:
      type: object
      required: [hours, calendarDays]
      properties: { hours: { type: string }, calendarDays: { type: integer } }
    Eco:
      type: object
      additionalProperties: false
      required: [number]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, maxLength: 40 }
        state: { type: string, enum: [draft, submitted, approved, scheduled, released, rejected, cancelled] }
        releaseDate: { type: string, format: date, description: 'Optional. Empty releases on the day :release is called. On create it must be no earlier than today and no more than 365 days ahead, both as UTC dates.' }
        decidedBy: { type: string }
        createdBy: { type: string, readOnly: true, description: The user who created the ECO; they cannot decide it. }
        decisionReason: { type: string, readOnly: true, maxLength: 200 }
        ecrId: { type: string, format: uuid, description: 'Optional. The approved ECR this ECO carries out. Every replaced product must be listed on the ECR (422 ENG-ECR-PRODUCT), the ECR must be approved (409 ENG-ECR-NOT-APPROVED) and have no other live ECO (409 ENG-ECR-CONVERTED).' }
        replaces: { type: array, items: { type: object, required: [oldVersionId, newVersionId], properties: { oldVersionId: { type: string, format: uuid }, newVersionId: { type: string, format: uuid } } }, description: BOM version replacements. At least one of replaces or documents is required. }
        documents: { type: array, items: { type: object, required: [oldDocumentId, newDocumentId], properties: { oldDocumentId: { type: string, format: uuid }, newDocumentId: { type: string, format: uuid } } }, description: Document version replacements for an ECO-controlled DIR (FR-9.25). }
    Ecr:
      type: object
      additionalProperties: false
      required: [number, title, priority, products]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, maxLength: 40 }
        title: { type: string, maxLength: 200 }
        reason: { type: string, maxLength: 2000 }
        priority: { type: string, enum: [low, medium, high, critical] }
        state: { type: string, readOnly: true, enum: [draft, submitted, under_review, approved, rejected, cancelled] }
        products: { type: array, minItems: 1, maxItems: 100, items: { type: string, maxLength: 64 }, description: Affected product ids, each listed once. }
        requestedBy: { type: string, readOnly: true }
        decidedBy: { type: string, readOnly: true }
        decisionReason: { type: string, readOnly: true, maxLength: 200 }
        ecoId: { type: string, format: uuid, readOnly: true, description: The live (not rejected or cancelled) ECO that names this ECR. }
    EcoImpact:
      type: object
      required: [asOf, replacements, products, siteIds, openProductionOrders, openPlannedOrders]
      properties:
        asOf: { type: string, format: date }
        replacements:
          type: array
          items:
            type: object
            required: [oldVersionId, newVersionId, productId, changes]
            properties:
              oldVersionId: { type: string, format: uuid }
              newVersionId: { type: string, format: uuid }
              productId: { type: string }
              changes:
                type: array
                items:
                  type: object
                  required: [componentProductId, change]
                  properties:
                    componentProductId: { type: string }
                    change: { type: string, enum: [added, removed, changed] }
                    oldQuantity: { type: string, description: Decimal, summed over the lines of the old version }
                    newQuantity: { type: string, description: Decimal, summed over the lines of the new version }
        products:
          type: array
          description: Distinct affected products, replaced products first, then parents by level and product id.
          items:
            type: object
            required: [productId, reason, level, topLevel, siteIds, versionIds]
            properties:
              productId: { type: string }
              reason: { type: string, enum: [replaced, parent] }
              level: { type: integer, description: 0 for a replaced product, otherwise the shortest distance to it }
              topLevel: { type: boolean, description: 'True when no active version uses this product as of the date: the distinct top-level products of the where-used (AC-9.6).' }
              siteIds: { type: array, description: Sites of the affected versions; empty when they all apply to every site., items: { type: string } }
              versionIds: { type: array, description: 'For a replaced product, the replaced version and the active versions at its site; for a parent, its active versions that use an affected product.', items: { type: string, format: uuid } }
        siteIds: { type: array, items: { type: string } }
        openProductionOrders: { type: integer }
        openPlannedOrders: { type: integer }
    Shift:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        end: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: 'An end before start runs past midnight and must not overlap the next day''s shifts; 24:00 is allowed as an end only' }
        efficiencyPct: { type: string, description: 1 to 100 with at most two decimals }
    CalendarRequest:
      type: object
      additionalProperties: false
      required: [code, name, template]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        template: { type: array, minItems: 7, maxItems: 7, description: 'Seven day patterns, Monday first', items: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/Shift' } } }
        closedDates: { type: array, maxItems: 2000, items: { type: string, format: date } }
    Calendar:
      type: object
      required: [id, code, name, template, closedDates, version, warnings]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        template: { type: array, items: { type: array, items: { $ref: '#/components/schemas/Shift' } } }
        closedDates: { type: array, items: { type: string, format: date } }
        version: { type: integer }
        generatedFrom: { type: string, format: date }
        generatedTo: { type: string, format: date }
        warnings: { type: array, items: { type: string } }
    DateRange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties: { from: { type: string, format: date }, to: { type: string, format: date } }
    CalendarGeneration:
      type: object
      required: [openDays, totalHours]
      properties: { openDays: { type: integer }, totalHours: { type: string } }
    CalendarDay:
      type: object
      required: [date, open, shifts, totalH]
      properties: { date: { type: string, format: date }, open: { type: boolean }, shifts: { type: array, items: { $ref: '#/components/schemas/Shift' } }, totalH: { type: string } }
    ResourceGroup:
      type: object
      additionalProperties: false
      required: [code, name, siteId]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        siteId: { type: string, maxLength: 64 }
        calendarId: { type: string, format: uuid }
    Capability:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
    ResourceCapability:
      type: object
      additionalProperties: false
      required: [capabilityId, level, effectiveFrom]
      properties:
        capabilityId: { type: string, format: uuid }
        level: { type: integer, minimum: 1 }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
    Resource:
      type: object
      additionalProperties: false
      required: [code, name, type, siteId]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        type: { type: string, enum: [machine, tool, labor, vendor, location] }
        siteId: { type: string, maxLength: 64 }
        groupId: { type: string, format: uuid }
        calendarId: { type: string, format: uuid }
        efficiencyPct: { type: string, description: Above 0 to 100 with at most two decimals, default: '100' }
        capacityPerDayH: { type: string, description: Below 1000000 with at most four decimals, default: '0' }
        exclusive: { type: boolean, default: false }
        vendorPartyId: { type: string, maxLength: 64, description: Required for type vendor and refused for other types }
        capabilities: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ResourceCapability' } }
        effectiveCalendarId: { type: string, format: uuid, readOnly: true }
        version: { type: integer, minimum: 1, description: 'Starts at 1 and counts each saved edit. Required on PUT as the value the editor loaded; ignored on POST.' }
    EngineeringOrganization:
      type: object
      additionalProperties: false
      required: [legalEntityId, code, name]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid, description: The caller must be scoped to it (403 ENG-RELEASE-SCOPE). }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
    Nomenclature:
      type: object
      additionalProperties: false
      required: [code, segments]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 20 }
        separator: { type: string, maxLength: 3 }
        segments:
          type: array
          minItems: 1
          items:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [number, letter, constant, date] }
              width: { type: integer }
              start: { type: integer }
              skipIo: { type: boolean }
              format: { type: string, enum: [yyyyMMdd, yyMM] }
              text: { type: string }
    EngineeringCategory:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        productType: { type: string }
        trackVersions: { type: boolean }
        versionAsDimension: { type: boolean }
        nomenclatureId: { type: string, format: uuid }
        readinessPolicyId: { type: string, format: uuid }
        releasePolicyId: { type: string, format: uuid }
        changeControlled: { type: boolean }
    EngineeringVersion:
      type: object
      additionalProperties: false
      required: [productId, versionCode, engineeringLeId]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, maxLength: 64 }
        versionCode: { type: string, maxLength: 64 }
        engineeringLeId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        bomVersionId: { type: string, format: uuid }
        routeVersionId: { type: string, format: uuid }
        lifecycleState: { type: string }
    ProductIdentifier:
      type: object
      additionalProperties: false
      required: [idType, value, productId]
      properties:
        idType: { type: string, maxLength: 64 }
        value: { type: string, maxLength: 64 }
        productId: { type: string, maxLength: 64 }
    ReleasePolicy:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        copyBom: { type: boolean }
        activateBom: { type: boolean }
        copyRoute: { type: boolean }
        activateRoute: { type: boolean }
        copyAttributes: { type: boolean }
        copyOrderSettings: { type: boolean }
        copyDocuments: { type: boolean }
        requireAcceptance: { type: object, description: Keyed by legal-entity UUID., additionalProperties: { type: boolean } }
    SiteMapping:
      type: object
      additionalProperties: false
      required: [engineeringLeId, operationalLeId]
      properties:
        engineeringLeId: { type: string, format: uuid }
        operationalLeId: { type: string, format: uuid }
        engineeringSite: { type: string }
        operationalSite: { type: string }
    ReleaseLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        productId: { type: string }
        engineeringVersion: { type: string }
        legalEntityId: { type: string, format: uuid }
        status: { type: string, enum: [pending, sent, accepted, rejected, failed] }
        reason: { type: string }
        acceptedBy: { type: string }
        copiedBomVersionId: { type: string, format: uuid }
        copiedRouteVersionId: { type: string, format: uuid }
    ReleaseSession:
      type: object
      additionalProperties: false
      required: [policyId, engineeringLeId, productId, versionCode, legalEntities]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, description: 'Generated as REL-{yyyy}-{#####} from a sequence when omitted.' }
        createdBy: { type: string, readOnly: true, description: The signed-in user; a request that sets it is refused with 400. }
        source: { type: string, enum: [manual, eco, job] }
        policyId: { type: string, format: uuid }
        ecoId: { type: string, format: uuid }
        readinessPolicyId: { type: string, format: uuid, description: Evaluates each received product; falls back to the engineering category's policy. }
        engineeringLeId: { type: string, format: uuid, description: 'The owning engineering legal entity. The caller must be scoped to it, and to every receiving entity that accepts without review (403 ENG-RELEASE-SCOPE). Lines are visible to this entity and to their receiving entity.' }
        productId: { type: string, maxLength: 64 }
        versionCode: { type: string, maxLength: 64 }
        legalEntities: { type: array, minItems: 1, maxItems: 100, items: { type: string, format: uuid } }
        lines: { type: array, items: { $ref: '#/components/schemas/ReleaseLine' } }
    ReadinessPolicy:
      type: object
      additionalProperties: false
      required: [code, checks]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        targetState: { type: string }
        continuous: { type: boolean }
        checks:
          type: array
          items:
            type: object
            properties:
              key: { type: string, maxLength: 64 }
              kind: { type: string, enum: [auto, manual] }
              mandatory: { type: boolean }
    ReleasedProduct:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string }
        legalEntityId: { type: string, format: uuid }
        engineeringVersion: { type: string }
        sessionId: { type: string, format: uuid }
        state: { type: string }
        checks:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              status: { type: string }
              signedBy: { type: string }
    DocumentType:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        changeControlled: { type: boolean }
        signatureOnRelease: { type: boolean }
        independentReview: { type: boolean }
        signatureMeaning: { type: string }
    Document:
      type: object
      additionalProperties: false
      required: [typeCode, number]
      properties:
        id: { type: string, format: uuid }
        typeCode: { type: string, maxLength: 64 }
        number: { type: string, maxLength: 64 }
        part: { type: string }
        version: { type: string }
        description: { type: string }
        status: { type: string, enum: [in_work, in_review, released, obsolete, cancelled] }
        lastEditor: { type: string }
        ecoId: { type: string, format: uuid, readOnly: true, description: Set by the ECO that replaces the document; a create that sets it is refused with 400. }
        signedAt: { type: string, format: date-time }
        originals:
          type: array
          items:
            type: object
            required: [storageKey, sha256]
            properties:
              storageKey: { type: string, maxLength: 512, description: 'Must start with the tenant id and a slash; the file is not fetched from storage yet.' }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
              sizeBytes: { type: integer, minimum: 0 }
        links:
          type: array
          items:
            type: object
            properties:
              targetType: { type: string }
              targetId: { type: string }
    DocumentSignature:
      type: object
      required: [id, recordId, signerId, meaning, signedAt]
      properties:
        id: { type: string, format: uuid }
        recordId: { type: string, format: uuid }
        documentNumber: { type: string }
        documentVersion: { type: string }
        transition: { type: string }
        signerId: { type: string }
        printedName: { type: string }
        meaning: { type: string }
        signedAt: { type: string, format: date-time }
        originalsHash: { type: string, description: 'sha256 of the canonical record: id, number, part, version, type and the originals sorted by key (name kept for compatibility).' }
        method: { type: string, description: The re-authentication method the verifier proved; dev-unverified marks a PASSAGE_ENV=dev signature with no re-authentication. }
    DocumentWhereUsed:
      type: object
      properties:
        targetType: { type: string }
        targetId: { type: string }
        productId: { type: string }
    EbomImport:
      type: object
      additionalProperties: false
      required: [source, partNumber, revision, lines]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, maxLength: 64 }
        partNumber: { type: string, maxLength: 64 }
        revision: { type: string, maxLength: 64 }
        status: { type: string }
        bomVersionId: { type: string, format: uuid }
        ecrId: { type: string, format: uuid }
        added: { type: integer }
        removed: { type: integer }
        changed: { type: integer }
        lines:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: object
            required: [partNumber, quantity]
            properties:
              findNumber: { type: integer, minimum: 0, maximum: 99999, description: Unique within the import; 0 or omitted takes the next free multiple of ten. }
              partNumber: { type: string, maxLength: 64, description: Must differ from the assembly's partNumber. }
              quantity: { type: string, description: Positive decimal string; required. }
              unit: { type: string }
        exceptions:
          type: array
          items:
            type: object
            properties:
              partNumber: { type: string }
              code: { type: string }
    Problem:
      type: object
      required: [type, title, status]
      x-passage-platform-codes: [unbalanced_entry, period_closed, dimension_invalid, validation_failed, unique_violation, state_transition_invalid, conflict_version, idempotency_key_reuse, idempotency_in_progress, forbidden_duty, forbidden_tenant, sod_conflict, approval_required, inventory_insufficient, rate_limited, upstream_unavailable]
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string }, code: { type: string, description: 'ENG-*, COM-* and AUTH-* codes of this service, or idempotency_key_reuse. x-passage-platform-codes lists the shared platform vocabulary; this service emits only idempotency_key_reuse from it.' }, serviceCode: { type: string }, traceId: { type: string }, errors: { type: object, additionalProperties: { type: string } } }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: AUTH-0003, the caller lacks the duty this operation requires.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    InvalidQuery:
      description: COM-0001 with an errors map naming each bad filter, limit or cursor.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: ENG-CAL-NOTFOUND, ENG-RES-NOTFOUND, ENG-ROUTE-NOTFOUND or ENG-BOM-NOTFOUND as RFC 9457 problem details.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: ENG-DUPLICATE, a record with this code already exists.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unprocessable:
      description: ENG-CAL-SHIFT, ENG-CAL-RANGE, ENG-RES-VENDOR, ENG-RES-SITE or idempotency_key_reuse.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
