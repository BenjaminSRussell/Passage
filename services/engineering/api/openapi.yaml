openapi: 3.1.0
info:
  title: engineering
  version: 0.1.0
  description: Engineering data service. Covers BOM versions, explosion, where-used, routing lead time, engineering change orders, and (slice 4) work calendars, resource groups, capabilities and resources, and (slice 6) read APIs for route versions, the active route version as of a date, and BOM version detail, and (slice 8) resource, resource group and capability lists and route version activation.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/engineering/bom-versions:
    post:
      operationId: createBomVersion
      summary: Create a BOM version
      x-passage-duty: engineering.bom.write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
      responses:
        '201':
          description: BOM version created as draft or active, or the original version on an Idempotency-Key replay. A cycle is ENG-BOM-CYCLE and an overlapping active range is ENG-BOM-OVERLAP.
          content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listBomVersions
      summary: List BOM versions
      x-passage-duty: engineering.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: productId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: siteId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, expired, superseded, cancelled] } }
        - { name: asOf, in: query, description: Only versions whose effective range covers this date., schema: { type: string, format: date } }
      responses:
        '200':
          description: One page of BOM version headers ordered by id. Pass nextCursor as cursor for the next page. A bad filter, limit or cursor is 400 COM-0001 with the offending fields in errors.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BomVersion' } }, nextCursor: { type: string } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/bom-versions/{id}:
    get:
      operationId: getBomVersion
      summary: Get a BOM version with its lines
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The BOM version with its lines in line-number order, the body create returns.
          content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateBomVersion
      summary: Save an edited draft BOM version
      x-passage-duty: engineering.bom.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
      responses:
        '200':
          description: The draft as saved (BR-9.3). The site, effectivity, quantity range and every line are replaced by the request, so a line left out is deleted; version is the loaded version plus 1. The product, status and id do not change and no event is emitted, as creating a draft emits none. The version field of the request is required and must be the value the editor loaded. Lines are identified by lineNo; a line without one is numbered by its position, as on create. An Idempotency-Key replay returns the draft as it is now.
          content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
        '400':
          description: COM-0001 with per-field errors, for a missing version, a status other than draft, a changed productId, an id that differs from the path, a missing or malformed date, bad lines, an unknown field, or an id that is not a UUID.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-BOM-VERSION-CONFLICT, another save came first (reload the draft and merge line by line); ENG-BOM-STATE, the version is not a draft; ENG-BOM-IN-ECO, an open ECO will release this draft; or the Idempotency-Key is in flight.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: ENG-BOM-CYCLE, a component would close a cycle as of the new date; or idempotency_key_reuse, the key was used for a different request.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/bom-versions/{id}:activate:
    post:
      operationId: activateBomVersion
      summary: Activate a draft BOM version
      x-passage-duty: engineering.bom.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The BOM version with its lines, now active. Activating an already active version returns it unchanged and emits no second bomversion.activated event.
          content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-BOM-STATE, the version is not a draft (it is expired, superseded or cancelled); or ENG-BOM-IN-ECO, an ECO that is not yet released, rejected or cancelled replaces an old version with this draft, so the ECO release activates it.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: ENG-BOM-ECO-REQUIRED, the product and site already have a version so the draft must be released through an ECO; ENG-BOM-OVERLAP, an active version overlaps its dates and quantities; or ENG-BOM-CYCLE, a component would create a cycle.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/bom-versions/{id}:cancel:
    post:
      operationId: cancelBomVersion
      summary: Cancel a draft BOM version
      x-passage-duty: engineering.bom.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The BOM version with its lines, now cancelled (BR-9.1 draft to cancelled). The row is kept and no event is emitted, as creating a draft emits none. Cancelling an already cancelled version returns it unchanged.
          content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-BOM-STATE, the version is not a draft; or ENG-BOM-IN-ECO, an ECO that is not yet released, rejected or cancelled replaces an old version with this draft.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/bom-versions/{id}:copy:
    post:
      operationId: copyBomVersion
      summary: Copy a BOM version into a new draft
      x-passage-duty: engineering.bom.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BomCopyRequest' } } }
      responses:
        '201':
          description: A new draft BOM version with the source's quantity range, the chosen lines (every line when lineNos is omitted), the source's product and site unless the request names others, the requested effectivity, and copiedFromVersionId set to the source (FR-9.12). The source may be in any status, including cancelled or expired, and is not changed. The copy goes through the create-time cycle check and emits no event, as creating a draft emits none; activating it or releasing it through an ECO is a separate call. An Idempotency-Key replay returns the draft created the first time.
          content: { application/json: { schema: { $ref: '#/components/schemas/BomVersion' } } }
        '400':
          description: COM-0001 with per-field errors, for a missing or malformed effectiveFrom or an effectiveTo before it, an empty lineNos or a line number the source does not have, a siteId over 64 characters, an unknown field, or an id that is not a UUID.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The Idempotency-Key is in flight.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: ENG-BOM-CYCLE, the copied lines would close a cycle as of the new date; or idempotency_key_reuse, the key was used for a different source or dates.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/route-versions:
    get:
      operationId: listRouteVersions
      summary: List route versions
      x-passage-duty: engineering.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: productId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: siteId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, expired, cancelled] } }
        - { name: asOf, in: query, description: Only versions whose effective range covers this date., schema: { type: string, format: date } }
      responses:
        '200':
          description: One page of route version headers ordered by id, each with operationCount and no operations. Pass nextCursor as cursor for the next page. A bad filter, limit or cursor is 400 COM-0001.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/RouteVersionHeader' } }, nextCursor: { type: string } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createRouteVersion
      summary: Create a draft route version
      x-passage-duty: engineering.route.write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersionCreate' } } }
      responses:
        '201':
          description: Draft route version with its operations and requirements, or the original version on an Idempotency-Key replay. Omitting versionNo takes the next number for the product, site and route code. Activation is a separate call.
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400':
          description: COM-0001 with per-field errors, for a malformed or missing field or a value its column cannot hold (integers above 2147483647, hours from 10000000000, process or overlap quantity from 100000000000000 or with more than 6 decimals, efficiency from 1000, a requirement refId over 64 characters).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: ENG-DUPLICATE, the version number is already used for this product, site and route code, or the Idempotency-Key is in flight.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: A route rule failed, such as ENG-ROUTE-CYCLE, ENG-ROUTE-NEXT, ENG-ROUTE-OP-DUP, ENG-ROUTE-OPS-LIMIT, ENG-ROUTE-QTY, ENG-ROUTE-REQ-KIND or ENG-ROUTE-SECONDARY-NOPRIMARY (BR-9.7, a secondary operation with no primary joining the same next operation), or idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/route-versions:active:
    get:
      operationId: getActiveRouteVersion
      summary: Get the active route version as of a date
      x-passage-duty: engineering.read
      parameters:
        - { name: productId, in: query, required: true, schema: { type: string, maxLength: 64 } }
        - { name: siteId, in: query, required: true, schema: { type: string, maxLength: 64 } }
        - { name: asOf, in: query, description: Defaults to today (UTC)., schema: { type: string, format: date } }
      responses:
        '200':
          description: The single active route version covering asOf, with operations and requirements. Drafts and expired versions never match.
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/route-versions/{id}:
    get:
      operationId: getRouteVersion
      summary: Get a route version with its operations
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The route version with its operations and their requirements.
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateRouteVersion
      summary: Save an edited draft route version
      x-passage-duty: engineering.route.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersionEdit' } } }
      responses:
        '200':
          description: The draft as saved (BR-9.3). The effectivity and every operation with its requirements are replaced by the request, so an operation left out is deleted; version is the loaded version plus 1. The product, site, route code, version number, status and id do not change and no event is emitted, as creating a draft emits none. The version field of the request is required and must be the value the editor loaded. An Idempotency-Key replay returns the draft as it is now.
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } }
        '400':
          description: COM-0001 with per-field errors, for a missing version, a changed productId, siteId, routeCode or versionNo, a missing or malformed date, a value an operation column cannot hold, an unknown field, or an id that is not a UUID.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-ROUTE-VERSION-CONFLICT, another save came first (reload the draft and merge); ENG-ROUTE-STATE, the version is not a draft; or the Idempotency-Key is in flight.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: A route rule failed, such as ENG-ROUTE-CYCLE, ENG-ROUTE-NEXT, ENG-ROUTE-OP-DUP, ENG-ROUTE-OPS-LIMIT, ENG-ROUTE-QTY, ENG-ROUTE-REQ-KIND or ENG-ROUTE-SECONDARY-NOPRIMARY; or idempotency_key_reuse, the key was used for a different request.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/route-versions/{id}:activate:
    post:
      operationId: activateRouteVersion
      summary: Activate a route version
      x-passage-duty: engineering.route.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The route version, now active. Activating an already active version returns it unchanged and emits no second routeversion.activated event.
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-ROUTE-STATE, the version is not a draft, or ENG-ROUTE-OVERLAP, another active version of the same product and site overlaps its dates.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: ENG-ROUTE-UNSATISFIED, an operation requirement cannot be met by the resources of the site.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/route-versions/{id}:cancel:
    post:
      operationId: cancelRouteVersion
      summary: Cancel a draft route version
      x-passage-duty: engineering.route.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The route version with its operations, now cancelled (BR-9.1 draft to cancelled). The row, operations and requirements are kept and no event is emitted, as creating a draft emits none. Cancelling an already cancelled version returns it unchanged.
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } }
        '400':
          description: COM-0001, the id is not a UUID.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-ROUTE-STATE, the version is not a draft.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/route-versions/{id}:copy:
    post:
      operationId: copyRouteVersion
      summary: Copy a route version into a new draft
      x-passage-duty: engineering.route.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RouteCopyRequest' } } }
      responses:
        '201':
          description: A new draft route version with the source's route code, operations and requirements, the source's product and site unless the request names others, the next version number for that product, site and route code, the requested effectivity, and copiedFromVersionId set to the source (FR-9.12). The source may be in any status, including cancelled or expired, and is not changed. No event is emitted; activation, which checks the requirements against the target site's resources, is a separate call. An Idempotency-Key replay returns the draft created the first time.
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } }
        '400':
          description: COM-0001 with per-field errors, for a missing or malformed effectiveFrom or an effectiveTo before it, a productId or siteId over 64 characters, an unknown field, or an id that is not a UUID.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ENG-DUPLICATE, another copy took the version number first, or the Idempotency-Key is in flight.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: A route rule failed on the copied operations, or idempotency_key_reuse, the key was used for a different source or dates.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/boms:explode:
    post:
      operationId: explodeBom
      summary: Explode a BOM to its components
      x-passage-duty: engineering.read
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExplodeRequest' } } }
      responses:
        '200':
          description: Multi-level explosion as of the requested date, with phantoms inlined and a flat component list.
          content: { application/json: { schema: { $ref: '#/components/schemas/Explosion' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/boms:where-used:
    get:
      operationId: whereUsedBom
      summary: List where a component is used
      x-passage-duty: engineering.read
      parameters:
        - { name: component, in: query, required: true, schema: { type: string } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - { name: levels, in: query, schema: { type: integer, minimum: 1, maximum: 25, default: 25 } }
      responses:
        '200':
          description: Products whose active BOM version uses the component, with their own parents nested.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/UsedBy' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/routes:lead-time:
    post:
      operationId: computeRouteLeadTime
      summary: Compute routing lead time
      x-passage-duty: engineering.read
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LeadTimeRequest' } } }
      responses:
        '200':
          description: Stateless lead time for the supplied operations. Sequential operations add, parallel branches take the longest.
          content: { application/json: { schema: { $ref: '#/components/schemas/LeadTime' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ecos:
    post:
      operationId: createEco
      summary: Create an engineering change order
      x-passage-duty: engineering.bom.write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Eco' } } }
      responses:
        '201':
          description: ECO created in the submitted state, or the original ECO on an Idempotency-Key replay.
          content: { application/json: { schema: { $ref: '#/components/schemas/Eco' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listEcos
      summary: List engineering change orders
      x-passage-duty: engineering.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [draft, submitted, approved, scheduled, released, rejected, cancelled] } }
      responses:
        '200':
          description: One page of ECOs ordered by id, each with its replacements. Pass nextCursor as cursor for the next page. A bad state, limit or cursor is 400 COM-0001.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Eco' } }, nextCursor: { type: string } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ecos/{id}:
    get:
      operationId: getEco
      summary: Get an engineering change order
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The ECO with its state, release date, approver and the BOM version replacements.
          content: { application/json: { schema: { $ref: '#/components/schemas/Eco' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ecos/{id}/impact:
    get:
      operationId: getEcoImpact
      summary: Get the impact report of an engineering change order
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, description: 'Date the where-used is evaluated. Defaults to the ECO release date when it is in the future, otherwise today.', schema: { type: string, format: date } }
      responses:
        '200':
          description: Each replacement with its component line differences, and the distinct products affected as of the date, the replaced products and every product that uses them at any level, with sites and active version ids. Open production and planned order counts are 0 until waves 21 and 22 supply them.
          content: { application/json: { schema: { $ref: '#/components/schemas/EcoImpact' } } }
        '400':
          description: COM-0001, the id is not a UUID or asOf is not a YYYY-MM-DD date.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: ENG-ECO-NOTFOUND, no ECO with this id in the tenant.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: ENG-BOM-CYCLE or ENG-BOM-TOOLARGE, the stored structure cannot be walked.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ecos/{id}:release:
    post:
      operationId: releaseEco
      summary: Approve and release an engineering change order
      x-passage-duty: engineering.eco.approve or engineering.eco.workflow
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: ECO approved and released. Old versions expire the day before the release date and new versions become active in one transaction. A future release date schedules the ECO. Releasing an already released ECO returns it unchanged with no side effects, so a retry under the same Idempotency-Key is safe. An approved ECO (see the decision routes) is released without asking the approval service. An unavailable approval service is 503 ENG-ECO-APPROVER-UNAVAILABLE and leaves a submitted ECO unchanged.
          content: { application/json: { schema: { $ref: '#/components/schemas/Eco' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ecos/{id}:approve:
    post:
      operationId: approveEco
      summary: Record the approval of a submitted engineering change order
      x-passage-duty: engineering.eco.workflow
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'The ECO is approved, decidedBy is the acting user (never its creator: 403 ENG-ECO-SELF-APPROVAL; no user: ENG-ECO-ACTOR-REQUIRED), and eco.approved is enqueued. No BOM version changes until the ECO is released. Repeating it on an approved ECO returns the ECO unchanged. Any other state is 409 ENG-ECO-STATE.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Eco' } } }
        '404':
          description: ENG-ECO-NOTFOUND, no ECO with this id in the tenant.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ecos/{id}:reject:
    post:
      operationId: rejectEco
      summary: Record the rejection of a submitted engineering change order
      x-passage-duty: engineering.eco.workflow
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'The ECO is rejected and decidedBy is the acting user. A rejected ECO is final. An optional JSON body {reason} (200 characters at most) is kept as decisionReason; the creator cannot reject: 403 ENG-ECO-SELF-APPROVAL. Repeating it on a rejected ECO returns the ECO unchanged. Any other state is 409 ENG-ECO-STATE.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Eco' } } }
        '404':
          description: ENG-ECO-NOTFOUND, no ECO with this id in the tenant.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/ecos/{id}:cancel:
    post:
      operationId: cancelEco
      summary: Cancel a submitted engineering change order
      x-passage-duty: engineering.eco.workflow
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The ECO is cancelled, for example when nobody decided it in time (the workflow acts as system:eco-timeout and sends {reason}, kept as decisionReason), and decidedBy is the acting user. No event is enqueued. Repeating it on a cancelled ECO returns the ECO unchanged. Any other state is 409 ENG-ECO-STATE.
          content: { application/json: { schema: { $ref: '#/components/schemas/Eco' } } }
        '404':
          description: ENG-ECO-NOTFOUND, no ECO with this id in the tenant.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/calendars:
    get:
      operationId: listCalendars
      summary: List work calendars
      x-passage-duty: engineering.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of work calendars with their templates and generated range. Ordered by code then id. Pass nextCursor as cursor for the next page.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Calendar' } }, nextCursor: { type: string } } }
        '422': { $ref: '#/components/responses/InvalidQuery' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createCalendar
      summary: Create a work calendar
      x-passage-duty: engineering.resource.write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalendarRequest' } } }
      responses:
        '201':
          description: Calendar created, or the original calendar on an Idempotency-Key replay. warnings lists soft limits such as weekly shift hours above 48. Overlapping or malformed shifts are 422 ENG-CAL-SHIFT.
          content: { application/json: { schema: { $ref: '#/components/schemas/Calendar' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/calendars/{id}:
    get:
      operationId: getCalendar
      summary: Get a work calendar
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The work calendar with its weekly template, closed dates, version and generated range. An unknown id is 404 ENG-CAL-NOTFOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/Calendar' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/calendars/{id}:generate:
    post:
      operationId: generateCalendar
      summary: Generate calendar days for a range
      x-passage-duty: engineering.resource.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DateRange' } } }
      responses:
        '200':
          description: Days generated for the range. A repeat upserts the same days and returns the same counts, so a retry under the same Idempotency-Key is safe. A range over 60 months or with to before from is 422 ENG-CAL-RANGE.
          content: { application/json: { schema: { $ref: '#/components/schemas/CalendarGeneration' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/calendars/{id}/days:
    get:
      operationId: listCalendarDays
      summary: List generated calendar days
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Generated days inside the requested range only, ordered by date.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/CalendarDay' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/resource-groups:
    get:
      operationId: listResourceGroups
      summary: List resource groups
      x-passage-duty: engineering.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: siteId, in: query, description: Only groups on this site., schema: { type: string, format: uuid, maxLength: 64 } }
      responses:
        '200':
          description: One page of resource groups. Ordered by code then id. Pass nextCursor as cursor for the next page.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ResourceGroup' } }, nextCursor: { type: string } } }
        '422': { $ref: '#/components/responses/InvalidQuery' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createResourceGroup
      summary: Create a resource group
      x-passage-duty: engineering.resource.write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResourceGroup' } } }
      responses:
        '201':
          description: Resource group created, or the original group on an Idempotency-Key replay. A duplicate code is 409 ENG-DUPLICATE.
          content: { application/json: { schema: { $ref: '#/components/schemas/ResourceGroup' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/capabilities:
    get:
      operationId: listCapabilities
      summary: List capabilities
      x-passage-duty: engineering.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of capabilities. Ordered by code then id. Pass nextCursor as cursor for the next page.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Capability' } }, nextCursor: { type: string } } }
        '422': { $ref: '#/components/responses/InvalidQuery' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createCapability
      summary: Create a capability
      x-passage-duty: engineering.resource.write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Capability' } } }
      responses:
        '201':
          description: Capability created, or the original capability on an Idempotency-Key replay. A duplicate code is 409 ENG-DUPLICATE.
          content: { application/json: { schema: { $ref: '#/components/schemas/Capability' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/capabilities/{id}:
    get:
      operationId: getCapability
      summary: Get a capability
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The capability. An unknown id is 404 ENG-RES-NOTFOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/Capability' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/resource-groups/{id}:
    get:
      operationId: getResourceGroup
      summary: Get a resource group
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The resource group with its site and calendar. An unknown id is 404 ENG-RES-NOTFOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/ResourceGroup' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/resources:
    get:
      operationId: listResources
      summary: List resources
      x-passage-duty: engineering.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: siteId, in: query, schema: { type: string, format: uuid, maxLength: 64 } }
        - { name: type, in: query, schema: { type: string, enum: [machine, tool, labor, vendor, location] } }
        - { name: groupId, in: query, schema: { type: string, format: uuid, maxLength: 64 } }
        - { name: capabilityId, in: query, schema: { type: string, format: uuid, maxLength: 64 } }
      responses:
        '200':
          description: One page of resources, each with its capabilities and effectiveCalendarId. capabilityId matches resources holding that capability. Ordered by code then id. Pass nextCursor as cursor for the next page.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Resource' } }, nextCursor: { type: string } } }
        '422': { $ref: '#/components/responses/InvalidQuery' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createResource
      summary: Create a resource
      x-passage-duty: engineering.resource.write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
      responses:
        '201':
          description: Resource created with its capabilities, or the original resource on an Idempotency-Key replay. A vendor without vendorPartyId is 422 ENG-RES-VENDOR and a group on another site is 422 ENG-RES-SITE.
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/engineering/resources/{id}:
    get:
      operationId: getResource
      summary: Get a resource
      x-passage-duty: engineering.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The resource with its capabilities and effectiveCalendarId, which is the resource's own calendar or else its group's.
          content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      summary: Liveness probe
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      summary: Readiness probe
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string }
  schemas:
    BomLine:
      type: object
      required: [componentProductId, quantity]
      properties:
        lineNo: { type: integer }
        componentProductId: { type: string, maxLength: 64 }
        quantity: { type: string, description: Positive decimal string }
        series: { type: string, description: Positive decimal string, default: '1' }
        lineType: { type: string, enum: [item, phantom, co_product, by_product], default: item }
        scrapConst: { type: string }
        scrapVarPct: { type: string, description: 0 to 100 }
        roundUp: { type: string, enum: ['', quantity] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
    BomVersion:
      type: object
      additionalProperties: false
      required: [productId, effectiveFrom, lines]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, maxLength: 64 }
        siteId: { type: string }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        fromQty: { type: string }
        toQty: { type: string }
        status: { type: string, enum: [draft, active, expired, superseded, cancelled], default: draft }
        lines: { type: array, minItems: 1, maxItems: 5000, items: { $ref: '#/components/schemas/BomLine' } }
        copiedFromVersionId: { type: string, format: uuid, readOnly: true, description: The version this one was copied from (FR-9.12 lineage); ignored on create. }
        version: { type: integer, minimum: 1, description: 'The optimistic-locking counter (BR-9.3): reads return it, create ignores it, and PUT requires the value the editor loaded.' }
    OperationRequirement:
      type: object
      properties: { kind: { type: string, enum: [resource, group, capability, type] }, refId: { type: string }, level: { type: integer, minimum: 0 }, quantity: { type: integer, minimum: 1 } }
    RouteVersionOperation:
      type: object
      properties:
        { no: { type: integer }, operationId: { type: string, maxLength: 20 }, nextNo: { type: integer }, linkType: { type: string, enum: [hard, soft] },
          priority: { type: string, enum: [primary, secondary1, secondary2, secondary3] }, setupH: { type: string }, runH: { type: string }, processQty: { type: string },
          queueBeforeH: { type: string }, queueAfterH: { type: string }, transitH: { type: string }, efficiencyPct: { type: string }, overlapQty: { type: string }, scrapPercent: { type: string },
          requirements: { type: array, items: { $ref: '#/components/schemas/OperationRequirement' } } }
    RouteVersionHeader:
      type: object
      required: [id, productId, siteId, routeCode, versionNo, effectiveFrom, status, operationCount]
      properties:
        { id: { type: string, format: uuid }, productId: { type: string }, siteId: { type: string }, routeCode: { type: string }, versionNo: { type: integer },
          effectiveFrom: { type: string, format: date }, effectiveTo: { type: string, format: date }, status: { type: string, enum: [draft, active, expired, cancelled] },
          operationCount: { type: integer }, version: { type: integer, minimum: 1, description: 'The optimistic-locking counter (BR-9.3): it starts at 1 and each edit, activation and cancellation adds 1.' }, copiedFromVersionId: { type: string, format: uuid, description: The version this one was copied from (FR-9.12 lineage). } }
    BomCopyRequest:
      type: object
      additionalProperties: false
      required: [effectiveFrom]
      properties:
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        productId: { type: string, maxLength: 64, description: The product of the copy; omitted keeps the source's. }
        siteId: { type: string, maxLength: 64, description: The site of the copy; omitted keeps the source's, an empty string makes it valid for every site. }
        lineNos: { type: array, minItems: 1, items: { type: integer }, description: The source line numbers to copy; omitted copies every line. }
    RouteCopyRequest:
      type: object
      additionalProperties: false
      required: [effectiveFrom]
      properties:
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        productId: { type: string, maxLength: 64, description: The product of the copy; omitted keeps the source's. }
        siteId: { type: string, maxLength: 64, description: The site of the copy; omitted keeps the source's. }
    RouteVersionCreate:
      type: object
      additionalProperties: false
      required: [productId, siteId, routeCode, effectiveFrom, operations]
      properties:
        productId: { type: string, maxLength: 64 }
        siteId: { type: string, maxLength: 64 }
        routeCode: { type: string, maxLength: 64 }
        versionNo: { type: integer, minimum: 1, maximum: 2147483647, description: Omit to take the next number for the product, site and route code. }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        operations: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/RouteVersionOperation' } }
    RouteVersionEdit:
      type: object
      additionalProperties: false
      required: [effectiveFrom, operations, version]
      properties:
        productId: { type: string, maxLength: 64, description: Optional; when sent it must equal the draft's product. }
        siteId: { type: string, maxLength: 64, description: Optional; when sent it must equal the draft's site. }
        routeCode: { type: string, maxLength: 64, description: Optional; when sent it must equal the draft's route code. }
        versionNo: { type: integer, minimum: 1, maximum: 2147483647, description: Optional; when sent it must equal the draft's number. }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        version: { type: integer, minimum: 1, description: The optimistic-locking counter the editor loaded (BR-9.3). }
        operations: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/RouteVersionOperation' } }
    RouteVersion:
      allOf:
        - { $ref: '#/components/schemas/RouteVersionHeader' }
        - { type: object, required: [operations], properties: { operations: { type: array, items: { $ref: '#/components/schemas/RouteVersionOperation' } } } }
    ExplodeRequest:
      type: object
      additionalProperties: false
      required: [productId]
      properties:
        productId: { type: string }
        siteId: { type: string }
        asOf: { type: string, format: date, description: Defaults to today }
        quantity: { type: string, description: Defaults to 1 }
        levels: { type: integer, minimum: 1, maximum: 25, default: 25 }
    Explosion:
      type: object
      required: [root, flat]
      properties:
        root: { $ref: '#/components/schemas/Node' }
        flat: { type: array, items: { type: object, required: [productId, quantity], properties: { productId: { type: string }, quantity: { type: string } } } }
    Node:
      type: object
      required: [productId, level, quantity]
      properties: { productId: { type: string }, lineNo: { type: integer }, level: { type: integer }, quantity: { type: string }, children: { type: array, items: { $ref: '#/components/schemas/Node' } } }
    UsedBy:
      type: object
      required: [productId, versionId, level]
      properties: { productId: { type: string }, versionId: { type: string }, siteId: { type: string }, level: { type: integer }, parents: { type: array, items: { $ref: '#/components/schemas/UsedBy' } } }
    RouteOperation:
      type: object
      additionalProperties: false
      required: [no, processQty]
      properties:
        no: { type: integer }
        next: { type: integer, description: 0 ends the route }
        priority: { type: string }
        setup: { type: string }
        run: { type: string }
        processQty: { type: string }
        queueBefore: { type: string }
        queueAfter: { type: string }
        transit: { type: string }
        efficiencyPct: { type: string }
        overlapQty: { type: string, description: 'transfer batch: the next operation may start once this many units are done; 0 or at least the quantity is no overlap' }
    LeadTimeRequest:
      type: object
      additionalProperties: false
      required: [operations, quantity, hoursPerDay]
      properties:
        operations: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/RouteOperation' } }
        quantity: { type: string }
        hoursPerDay: { type: string }
    LeadTime:
      type: object
      required: [hours, calendarDays]
      properties: { hours: { type: string }, calendarDays: { type: integer } }
    Eco:
      type: object
      additionalProperties: false
      required: [number, replaces]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, maxLength: 40 }
        state: { type: string, enum: [draft, submitted, approved, scheduled, released, rejected, cancelled] }
        releaseDate: { type: string, format: date }
        decidedBy: { type: string }
        createdBy: { type: string, readOnly: true, description: The user who created the ECO; they cannot decide it. }
        decisionReason: { type: string, readOnly: true, maxLength: 200 }
        replaces: { type: array, minItems: 1, items: { type: object, required: [oldVersionId, newVersionId], properties: { oldVersionId: { type: string, format: uuid }, newVersionId: { type: string, format: uuid } } } }
    EcoImpact:
      type: object
      required: [asOf, replacements, products, siteIds, openProductionOrders, openPlannedOrders]
      properties:
        asOf: { type: string, format: date }
        replacements:
          type: array
          items:
            type: object
            required: [oldVersionId, newVersionId, productId, changes]
            properties:
              oldVersionId: { type: string, format: uuid }
              newVersionId: { type: string, format: uuid }
              productId: { type: string }
              changes:
                type: array
                items:
                  type: object
                  required: [componentProductId, change]
                  properties:
                    componentProductId: { type: string }
                    change: { type: string, enum: [added, removed, changed] }
                    oldQuantity: { type: string, description: Decimal, summed over the lines of the old version }
                    newQuantity: { type: string, description: Decimal, summed over the lines of the new version }
        products:
          type: array
          description: Distinct affected products, replaced products first, then parents by level and product id.
          items:
            type: object
            required: [productId, reason, level, topLevel, siteIds, versionIds]
            properties:
              productId: { type: string }
              reason: { type: string, enum: [replaced, parent] }
              level: { type: integer, description: 0 for a replaced product, otherwise the shortest distance to it }
              topLevel: { type: boolean, description: 'True when no active version uses this product as of the date: the distinct top-level products of the where-used (AC-9.6).' }
              siteIds: { type: array, description: Sites of the affected versions; empty when they all apply to every site., items: { type: string } }
              versionIds: { type: array, description: 'For a replaced product, the replaced version and the active versions at its site; for a parent, its active versions that use an affected product.', items: { type: string, format: uuid } }
        siteIds: { type: array, items: { type: string } }
        openProductionOrders: { type: integer }
        openPlannedOrders: { type: integer }
    Shift:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        end: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: An end before start runs past midnight }
        efficiencyPct: { type: string, description: 1 to 100 with at most two decimals }
    CalendarRequest:
      type: object
      additionalProperties: false
      required: [code, name, template]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        template: { type: array, minItems: 7, maxItems: 7, description: 'Seven day patterns, Monday first', items: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/Shift' } } }
        closedDates: { type: array, maxItems: 2000, items: { type: string, format: date } }
    Calendar:
      type: object
      required: [id, code, name, template, closedDates, version, warnings]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        template: { type: array, items: { type: array, items: { $ref: '#/components/schemas/Shift' } } }
        closedDates: { type: array, items: { type: string, format: date } }
        version: { type: integer }
        generatedFrom: { type: string, format: date }
        generatedTo: { type: string, format: date }
        warnings: { type: array, items: { type: string } }
    DateRange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties: { from: { type: string, format: date }, to: { type: string, format: date } }
    CalendarGeneration:
      type: object
      required: [openDays, totalHours]
      properties: { openDays: { type: integer }, totalHours: { type: string } }
    CalendarDay:
      type: object
      required: [date, open, shifts, totalH]
      properties: { date: { type: string, format: date }, open: { type: boolean }, shifts: { type: array, items: { $ref: '#/components/schemas/Shift' } }, totalH: { type: string } }
    ResourceGroup:
      type: object
      additionalProperties: false
      required: [code, name, siteId]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        siteId: { type: string, maxLength: 64 }
        calendarId: { type: string, format: uuid }
    Capability:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
    ResourceCapability:
      type: object
      additionalProperties: false
      required: [capabilityId, level, effectiveFrom]
      properties:
        capabilityId: { type: string, format: uuid }
        level: { type: integer, minimum: 1 }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
    Resource:
      type: object
      additionalProperties: false
      required: [code, name, type, siteId]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        type: { type: string, enum: [machine, tool, labor, vendor, location] }
        siteId: { type: string, maxLength: 64 }
        groupId: { type: string, format: uuid }
        calendarId: { type: string, format: uuid }
        efficiencyPct: { type: string, description: Above 0 to 100 with at most two decimals, default: '100' }
        capacityPerDayH: { type: string, description: Below 1000000 with at most four decimals, default: '0' }
        exclusive: { type: boolean, default: false }
        vendorPartyId: { type: string, maxLength: 64, description: Required for type vendor and refused for other types }
        capabilities: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ResourceCapability' } }
        effectiveCalendarId: { type: string, format: uuid, readOnly: true }
    Problem:
      type: object
      required: [type, title, status]
      x-passage-platform-codes: [unbalanced_entry, period_closed, dimension_invalid, validation_failed, unique_violation, state_transition_invalid, conflict_version, idempotency_key_reuse, idempotency_in_progress, forbidden_duty, forbidden_tenant, sod_conflict, approval_required, inventory_insufficient, rate_limited, upstream_unavailable]
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string }, code: { type: string, description: 'ENG-*, COM-* and AUTH-* codes of this service, or idempotency_key_reuse. x-passage-platform-codes lists the shared platform vocabulary; this service emits only idempotency_key_reuse from it.' }, serviceCode: { type: string }, traceId: { type: string }, errors: { type: object, additionalProperties: { type: string } } }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: AUTH-0003, the caller lacks the duty this operation requires.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    InvalidQuery:
      description: COM-0001 with an errors map naming each bad filter, limit or cursor.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: ENG-CAL-NOTFOUND, ENG-RES-NOTFOUND, ENG-ROUTE-NOTFOUND or ENG-BOM-NOTFOUND as RFC 9457 problem details.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: ENG-DUPLICATE, a record with this code already exists.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unprocessable:
      description: ENG-CAL-SHIFT, ENG-CAL-RANGE, ENG-RES-VENDOR, ENG-RES-SITE or idempotency_key_reuse.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
