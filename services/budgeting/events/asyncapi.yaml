asyncapi: 3.0.0
info:
  title: budgeting
  version: 0.1.0
  description: CloudEvents 1.0 envelope from platform/go/events; payloads below are the data member. Emitted through the transactional outbox in the same transaction as the state change.
channels:
  passage.budget.register:
    address: passage.budget.register
    messages:
      posted:
        $ref: '#/components/messages/registerPosted'
  passage.budget.check:
    address: passage.budget.check
    messages:
      completed:
        $ref: '#/components/messages/checkCompleted'
  passage.budget.encumbrance:
    address: passage.budget.encumbrance
    messages:
      relieved:
        $ref: '#/components/messages/encumbranceRelieved'
  passage.budget.reservation:
    address: passage.budget.reservation
    messages:
      consumed:
        $ref: '#/components/messages/reservationConsumed'
  passage.budget.program:
    address: passage.budget.program
    messages:
      carriedforward:
        $ref: '#/components/messages/programCarriedForward'
operations:
  onRegisterPosted:
    action: send
    channel: { $ref: '#/channels/passage.budget.register' }
    messages: [{ $ref: '#/channels/passage.budget.register/messages/posted' }]
  onCheckCompleted:
    action: send
    channel: { $ref: '#/channels/passage.budget.check' }
    messages: [{ $ref: '#/channels/passage.budget.check/messages/completed' }]
  onEncumbranceRelieved:
    action: send
    channel: { $ref: '#/channels/passage.budget.encumbrance' }
    messages: [{ $ref: '#/channels/passage.budget.encumbrance/messages/relieved' }]
  onReservationConsumed:
    action: send
    channel: { $ref: '#/channels/passage.budget.reservation' }
    messages: [{ $ref: '#/channels/passage.budget.reservation/messages/consumed' }]
  onProgramCarriedForward:
    action: send
    channel: { $ref: '#/channels/passage.budget.program' }
    messages: [{ $ref: '#/channels/passage.budget.program/messages/carriedforward' }]
components:
  messages:
    registerPosted:
      name: posted
      title: Budget register entry posted
      payload:
        type: object
        required: [entry_id, rule_version_id, entry_type, lines]
        properties:
          entry_id: { type: string, format: uuid }
          rule_version_id: { type: string, format: uuid }
          entry_type: { type: string, enum: [Original, Revision, Transfer, CarryForward] }
          lines:
            type: array
            items:
              type: object
              required: [dimension_key, span_key, amount]
              properties:
                dimension_key: { type: string }
                span_key: { type: string }
                amount: { type: string }
      x-passage-type: dev.passage.budget.register.posted.v1
    checkCompleted:
      name: completed
      title: Budget check completed
      description: Emitted for every recorded check, pass, warn or fail. Replays emit nothing.
      payload:
        type: object
        required: [check_id, source_document_id, result, line_results]
        properties:
          check_id: { type: string, format: uuid }
          source_document_id: { type: string, format: uuid }
          result: { type: string, enum: [pass, warn, fail] }
          line_results:
            type: array
            items:
              type: object
              required: [line_id, result, available, amount]
              properties:
                line_id: { type: string, format: uuid }
                result: { type: string, enum: [pass, warn, fail] }
                available: { type: string }
                amount: { type: string }
      x-passage-type: dev.passage.budget.check.completed.v1
    encumbranceRelieved:
      name: relieved
      title: Encumbrance relieved
      description: Emitted when an invoice relieves a non-zero amount. A relief of 0.00 changes nothing and emits nothing.
      payload:
        type: object
        required: [encumbrance_id, invoice_id, amount, remaining]
        properties:
          encumbrance_id: { type: string, format: uuid }
          invoice_id: { type: string, format: uuid }
          amount: { type: string }
          remaining: { type: string }
      x-passage-type: dev.passage.budget.encumbrance.relieved.v1
    reservationConsumed:
      name: consumed
      title: Budget reservation consumed
      description: >-
        A follow-on document line drew on an earmarked funds line (FR-38.20). remaining is the document's open amount
        after the consumption. A reservation's creation check emits check.completed with source_document_id = the reservation id.
      payload:
        type: object
        required: [reservation_id, number, line_id, document_type, document_id, encumbrance_id, amount, remaining]
        properties:
          reservation_id: { type: string, format: uuid }
          number: { type: string }
          line_id: { type: string, format: uuid }
          document_type: { type: string, enum: [Requisition, PurchaseOrder, Invoice, Journal] }
          document_id: { type: string, format: uuid }
          encumbrance_id: { type: string, format: uuid }
          amount: { type: string }
          remaining: { type: string }
      x-passage-type: dev.passage.budget.reservation.consumed.v1
    programCarriedForward:
      name: carriedforward
      title: Investment program carried forward
      description: >-
        Unused budget of an investment program's positions was carried to the next approval year (FR-38.21, BR-38.15).
        Each position is carried once; amount is the sum over positions.
      payload:
        type: object
        required: [program_id, from_year, to_year, amount, positions]
        properties:
          program_id: { type: string, format: uuid }
          from_year: { type: integer }
          to_year: { type: integer }
          amount: { type: string }
          positions:
            type: array
            items:
              type: object
              required: [position_id, code, amount]
              properties:
                position_id: { type: string, format: uuid }
                code: { type: string }
                amount: { type: string }
      x-passage-type: dev.passage.budget.program.carriedforward.v1
