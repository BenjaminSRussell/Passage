openapi: 3.1.0
info:
  title: budgeting
  version: 0.1.0
  description: >-
    Budget control (wave 38, slices 1 to 3). Budget control rule versions, budget register entries posted directly,
    budget checks under FR-38.4 with row-locked balances, encumbrance relief from matched invoice lines (FR-38.5), and
    budget reservation documents (earmarked funds, FR-38.20): create with a check, consume by a follow-on document line,
    close, and the expiry run; investment programs (FR-38.21): position hierarchy, top-down budget distribution capped by
    the parent (BR-38.15), assignment of capex requests, assets under construction and projects with rollup of plan,
    actual and commitment, and carry-forward of unused budget to the next approval year.
    Every command requires Idempotency-Key; a replay returns the stored response, a reused key with a different body is 422.
    Reads need budget.view and return {"items": [...]} for lists (at most 500 rows, newest first).
    Error codes: COM-0001 (validation), AUTH-0001, AUTH-0003, BUD-0001 (rule version not found), BUD-0002 (encumbrance not found),
    BUD-0003 (line already reserved on another combination), BUD-0004 (check not found), BUD-0005 (reservation not found),
    BUD-0006 (reservation closed, expired or fully consumed), BUD-0007 (consumption above the line's open amount),
    BUD-0008 (RevenueForecast cannot be consumed), BUD-0009 (reservation reached its expiry date),
    CO-0601 (reservation creation check failed), CO-0604 (transfer does not net to zero),
    CO-0631 (funds blocking cannot be consumed), CO-0641 (distribution exceeds the parent position budget),
    BUD-0020 (position below level 6), BUD-0021 (program already carried forward), BUD-0023 (position budget below what
    it distributes), BUD-0024 (position not found in the program), BUD-0026 (position code used under another parent),
    BUD-0030 (program not found), BUD-0031 (program code exists for the year), BUD-0032 (carry-forward goes to the next
    approval year only), idempotency_key_reuse, idempotency_in_progress.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/budget/control-rules:
    get:
      operationId: listBudgetControlRules
      summary: "List budget control rules"
      x-passage-duty: budget.view
      parameters:
        - { name: legalEntityId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Rule versions by code, newest version first.
          content: { application/json: { schema: { $ref: '#/components/schemas/RuleList' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createBudgetControlRule
      summary: "Create a budget control rule"
      x-passage-duty: budget.configure
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateRule' } } }
      responses:
        '201':
          description: The new rule version. Version numbers count up per legal entity and code.
          content: { application/json: { schema: { $ref: '#/components/schemas/Rule' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/control-rules/{id}:
    get:
      operationId: getBudgetControlRule
      summary: "Get a budget control rule"
      x-passage-duty: budget.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One rule version.
          content: { application/json: { schema: { $ref: '#/components/schemas/Rule' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/register-entries:
    get:
      operationId: listBudgetRegisterEntries
      summary: "List budget register entries"
      x-passage-duty: budget.view
      parameters:
        - { $ref: '#/components/parameters/Rule' }
      responses:
        '200':
          description: Posted entries of the rule version, newest first.
          content: { application/json: { schema: { $ref: '#/components/schemas/PostedEntryList' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: postBudgetRegisterEntry
      summary: "Post a budget register entry"
      x-passage-duty: budget.maintain
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterEntry' } } }
      responses:
        '201':
          description: The posted entry. Transfer lines must net to zero (CO-0604, 422).
          content: { application/json: { schema: { $ref: '#/components/schemas/PostedEntry' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/available:
    get:
      operationId: getAvailableFunds
      summary: "Get the available funds"
      x-passage-duty: budget.view
      parameters:
        - { $ref: '#/components/parameters/Rule' }
        - { name: dims, in: query, required: false, description: Control dimension key., schema: { type: string } }
        - { name: span, in: query, required: false, description: Time span key., schema: { type: string } }
      responses:
        '200':
          description: Control combinations with available = budget − actuals − encumbrances − pre-encumbrances.
          content: { application/json: { schema: { $ref: '#/components/schemas/BalanceList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/checks:
    get:
      operationId: listBudgetChecks
      summary: "List budget checks"
      x-passage-duty: budget.view
      parameters:
        - { $ref: '#/components/parameters/Rule' }
        - { name: documentId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Recorded checks (pass, warn and fail), newest first.
          content: { application/json: { schema: { $ref: '#/components/schemas/CheckList' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: checkBudget
      summary: "Check a request against the budget"
      x-passage-duty: budget.check
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Check' } } }
      responses:
        '200':
          description: >-
            The recorded check. The document result is the worst line result. A fail result reserves nothing and is still
            recorded. The budget.override duty turns fail into warn with the trace step override. A line seen before is
            checked for its net change against its stored reservation (FR-38.4 step 4); the same line on another
            combination is BUD-0003 (409).
          content: { application/json: { schema: { $ref: '#/components/schemas/CheckResult' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/checks/{id}:
    get:
      operationId: getBudgetCheck
      summary: "Get a budget check"
      x-passage-duty: budget.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One recorded check with its per-line trace.
          content: { application/json: { schema: { $ref: '#/components/schemas/CheckResult' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/encumbrances:
    get:
      operationId: listEncumbrances
      summary: "List encumbrances"
      x-passage-duty: budget.view
      parameters:
        - { $ref: '#/components/parameters/Rule' }
        - { name: status, in: query, required: false, schema: { type: string, enum: [Open, PartiallyRelieved, Relieved, Released] } }
      responses:
        '200':
          description: Reservations of the rule version, newest first.
          content: { application/json: { schema: { $ref: '#/components/schemas/EncumbranceList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/encumbrances/{id}:
    get:
      operationId: getEncumbrance
      summary: "Get an encumbrance"
      x-passage-duty: budget.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One reservation with its Reserve / Adjust / Relieve history.
          content: { application/json: { schema: { $ref: '#/components/schemas/Encumbrance' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/encumbrances/{id}:relieve:
    post:
      operationId: relieveEncumbrance
      summary: "Relieve an encumbrance"
      x-passage-duty: budget.check
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Relieve' } } }
      responses:
        '200':
          description: >-
            Relief is min(invoiceQuantity x poUnitPrice, remaining reservation). excess is the invoice amount above the
            relief and must be run through POST /v1/budget/checks as a new amount.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReliefResult' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/encumbrances/{id}:release:
    post:
      operationId: releaseEncumbrance
      x-passage-duty: budget.check
      description: >-
        Gives the open remainder of an encumbrance (reserved less relieved) back to available funds when the PO line is
        cancelled or the PO is closed (FR-38.5). The balance and the encumbrance move in one transaction and
        encumbrance.released.v1 is written to the outbox. The line is then Released: a later check or consumption for the
        same line is refused with BUD-0011, and an invoice against it relieves nothing (its whole amount is excess).
        Nothing open to release is BUD-0010 (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Release' } } }
      responses:
        '200':
          description: The released amount; remaining is 0.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseResult' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/encumbrances/{id}:convert:
    post:
      operationId: convertPreEncumbrance
      x-passage-duty: budget.encumbrance.convert
      description: >-
        A budget check of a Requisition reserves a pre-encumbrance (stage pre, in the balance's preEncumbrances). The confirmed
        purchase order converts it: the open amount moves from preEncumbrances to encumbrances and the line is re-keyed to the PO
        line, so the PO's own budget check revises it (a price difference is the change) instead of reserving twice (FR-38.5).
        A line that is not a pre-encumbrance is BUD-0071 (409); a released one BUD-0011; a PO line that already carries a
        reservation BUD-0072. A PO check or an invoice relief on a pre-encumbrance is BUD-0070 until it is converted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [purchaseOrderId, purchaseOrderLineId], additionalProperties: false, properties: { purchaseOrderId: { type: string, format: uuid }, purchaseOrderLineId: { type: string, format: uuid } } } } }
      responses:
        '200':
          description: The amount that moved.
          content: { application/json: { schema: { type: object, required: [encumbranceId, purchaseOrderId, purchaseOrderLineId, converted, status], properties: { encumbranceId: { type: string, format: uuid }, purchaseOrderId: { type: string, format: uuid }, purchaseOrderLineId: { type: string, format: uuid }, converted: { $ref: '#/components/schemas/Money' }, status: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/encumbrances:convert:
    post:
      operationId: convertPreEncumbranceByLine
      x-passage-duty: budget.encumbrance.convert
      description: >-
        Service-only (purchasing). The same conversion, naming the pre-encumbrance by the requisition line it was checked for
        (the line id of the Requisition check). BUD-0002 (404) when nothing was reserved for that line, which purchasing treats as
        "nothing to convert".
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [requisitionLineId, purchaseOrderId, purchaseOrderLineId], additionalProperties: false, properties: { requisitionLineId: { type: string, format: uuid }, purchaseOrderId: { type: string, format: uuid }, purchaseOrderLineId: { type: string, format: uuid } } } } }
      responses:
        '200':
          description: The amount that moved.
          content: { application/json: { schema: { type: object, required: [encumbranceId, purchaseOrderId, purchaseOrderLineId, converted, status], properties: { encumbranceId: { type: string, format: uuid }, purchaseOrderId: { type: string, format: uuid }, purchaseOrderLineId: { type: string, format: uuid }, converted: { $ref: '#/components/schemas/Money' }, status: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/reservations:
    get:
      operationId: listBudgetReservations
      x-passage-duty: budget.view
      description: Earmarked funds list (PRD 7.38.14), newest first, without lines and consumptions.
      parameters:
        - { name: rule, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: type, in: query, required: false, schema: { $ref: '#/components/schemas/ReservationType' } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/ReservationStatus' } }
      responses:
        '200':
          description: Reservation documents.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReservationList' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createBudgetReservation
      x-passage-duty: budget.reserve
      description: >-
        Runs the FR-38.4 check on every line of a FundsReservation, Precommitment or FundsBlocking document and holds the
        amounts in the balances' reservations, so available funds drop. A failing line refuses the document with CO-0601;
        the budget.override duty turns fail into warn. A RevenueForecast holds nothing and is not checked. Numbers come from
        a per-type sequence per legal entity (FR-, PC-, FB-, RF-).
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateReservation' } } }
      responses:
        '201':
          description: The document, its lines and the recorded check (absent for RevenueForecast).
          content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/reservations:expire:
    post:
      operationId: expireBudgetReservations
      x-passage-duty: budget.reserve
      description: >-
        Job reservation-expiry (BR-38.14). Moves Open and PartiallyConsumed documents whose expiry date is on or before
        asOf to Expired and releases their residual; at most 200 per call, a rerun picks up the rest.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asOf]
              additionalProperties: false
              properties:
                asOf: { type: string, format: date }
      responses:
        '200':
          description: The documents this run expired.
          content: { application/json: { schema: { $ref: '#/components/schemas/ExpireResult' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/reservations/{id}:
    get:
      operationId: getBudgetReservation
      summary: "Get a budget reservation"
      x-passage-duty: budget.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One document with its lines and consumption history.
          content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/reservations/{id}:consume:
    post:
      operationId: consumeBudgetReservation
      x-passage-duty: budget.check
      description: >-
        A follow-on document line draws on one reservation line. In one transaction the line is relieved and the follow-on
        line's encumbrance is created (or raised), so the balance moves the amount from reservations to encumbrances and
        available funds do not change (AC-38.12). Emits dev.passage.budget.reservation.consumed.v1.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConsumeReservation' } } }
      responses:
        '200':
          description: The consumption and what is left open.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConsumeResult' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/reservations/{id}:close:
    post:
      operationId: closeBudgetReservation
      x-passage-duty: budget.reserve
      description: Releases the residual and marks the document Closed (BR-38.14). FundsBlocking closes from Open only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      responses:
        '200':
          description: The released residual.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseResult' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/plans:
    get:
      operationId: listBudgetPlans
      summary: "List budget plans"
      x-passage-duty: budget.view
      parameters:
        - { name: legalEntityId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Plans, newest fiscal year first., content: { application/json: { schema: { $ref: '#/components/schemas/PlanList' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createBudgetPlan
      x-passage-duty: budget.plan.maintain
      description: Opens a planning process (FR-38.2) on a control rule version with a Baseline scenario. Name is unique per legal entity and fiscal year (BUD-0041).
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [legalEntityId, ruleVersionId, name, fiscalYear], properties: { legalEntityId: { type: string, format: uuid }, ruleVersionId: { type: string, format: uuid }, ledgerId: { type: string, format: uuid, description: Names the ledger the prior-year-actuals helper reads. }, name: { type: string }, fiscalYear: { type: integer }, fiscalYearStartMonth: { type: integer, enum: [1], description: Only January is supported; any other value is refused with BUD-0058. } } } } }
      responses:
        '201': { description: The plan with its Baseline scenario., content: { application/json: { schema: { $ref: '#/components/schemas/PlanView' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/plans/{id}:
    get:
      operationId: getBudgetPlan
      summary: "Get a budget plan"
      x-passage-duty: budget.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The plan with scenarios (totals and ETag versions) and stage owners with their sign-offs., content: { application/json: { schema: { $ref: '#/components/schemas/PlanView' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/plans/{id}/stage-owners:
    put:
      operationId: setBudgetPlanStageOwners
      x-passage-duty: budget.plan.maintain
      description: Replaces the owners of the Review and Approve stages per org unit on a Draft plan. One person cannot own both stages (BUD-0044).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [owners], properties: { owners: { type: array, maxItems: 200, items: { type: object, required: [stage, orgUnitId, owner], properties: { stage: { type: string, enum: [Review, Approve] }, orgUnitId: { type: string, format: uuid }, owner: { type: string } } } } } } } }
      responses:
        '200': { description: The plan., content: { application/json: { schema: { $ref: '#/components/schemas/PlanView' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/plans/{id}/scenarios:
    post:
      operationId: createBudgetPlanScenario
      x-passage-duty: budget.plan.maintain
      description: Adds a scenario to a Draft plan, up to 10 (BUD-0051). copyFromScenarioId copies that scenario's cells, scaled by adjustmentPct.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name, kind], properties: { name: { type: string }, kind: { type: string, enum: [Baseline, Optimistic, Pessimistic, Custom] }, copyFromScenarioId: { type: string, format: uuid }, adjustmentPct: { type: string, description: Above -100 and at most 1000; with a copy only. } } } } }
      responses:
        '201': { description: The scenario., content: { application/json: { schema: { $ref: '#/components/schemas/PlanScenario' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/plans/{id}/scenarios/{sid}/grid:
    get:
      operationId: getBudgetPlanGrid
      x-passage-duty: budget.view
      description: Cells of one scenario (account x cost center x period), filterable. The ETag header is the version a write must send in If-Match.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: account, in: query, required: false, schema: { type: string } }
        - { name: costCenter, in: query, required: false, schema: { type: string } }
        - { name: period, in: query, required: false, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }
      responses:
        '200': { description: The cells (at most 10000; truncated says more matched) and the total of every matching cell., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/PlanGrid' } } } }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: upsertBudgetPlanGrid
      x-passage-duty: budget.plan.maintain
      description: >-
        Bulk upserts up to 5000 cells of a Draft plan under optimistic concurrency. A missing If-Match is 428; a stale one is
        412 BUD-0050 and nothing is written. The response carries the new ETag.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, description: The grid ETag read from the last GET or write (the scenario version)., schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [cells], properties: { cells: { type: array, minItems: 1, maxItems: 5000, items: { type: object, required: [account, costCenter, period, amount], properties: { account: { type: string }, costCenter: { type: string }, period: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }, amount: { type: string, description: Not negative; at most 4 decimal places. } } } } } } } }
      responses:
        '200': { description: Cells written and the scenario total. A spread by prior-year-actuals that found no actuals sets priorYearFallback., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/PlanGridWritten' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/plans/{id}/scenarios:compare:
    get:
      operationId: compareBudgetPlanScenarios
      x-passage-duty: budget.view
      description: >-
        Sets two scenarios of the plan side by side, grouped by account (default), cost center or period. A key only one scenario
        holds shows zero for the other. deltaPct is omitted when the base is zero.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: base, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: other, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: groupBy, in: query, required: false, schema: { type: string, enum: [account, costCenter, period], default: account } }
      responses:
        '200': { description: The comparison., content: { application/json: { schema: { $ref: '#/components/schemas/PlanComparison' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/plans/{id}/scenarios/{sid}:spread:
    post:
      operationId: spreadBudgetPlanGrid
      x-passage-duty: budget.plan.maintain
      description: >-
        Allocates a total over cost centers by weight and spreads each share over the 12 periods, evenly or in the
        proportions of the account's posted balances in the prior fiscal year read from the ledger (net per month, absolute).
        The rounding remainder goes to the heaviest weight so the cells add up to the total. Writes the cells like the grid PUT
        (If-Match required). The ledger balance is per account, so the weights do not distinguish cost centers. The plan must be a Draft (BUD-0042),
        a cost center may appear once, and the cost center weights must not sum to zero (422 BUD-0060). When the prior year holds no net debit for the account
        the periods are weighted evenly and the response says so with priorYearFallback true.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, description: The grid ETag read from the last GET or write (the scenario version)., schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [account, total, method, costCenters], properties: { account: { type: string }, total: { type: string }, method: { type: string, enum: [even, prior-year-actuals, custom] }, periodWeights: { type: array, minItems: 12, maxItems: 12, items: { type: string }, description: 'The distribution key of method custom, and only with it: 12 weights, one per period (a seasonal curve); not negative, not all zero.' }, costCenters: { type: array, items: { type: object, required: [costCenter, weight], properties: { costCenter: { type: string }, weight: { type: string } } } } } } } }
      responses:
        '200': { description: Cells written and the scenario total. A spread by prior-year-actuals that found no actuals sets priorYearFallback., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/PlanGridWritten' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/plans/{id}/scenarios/{sid}:generate:
    post:
      operationId: generateBudgetPlanGrid
      x-passage-duty: budget.plan.maintain
      description: >-
        Fills the scenario from another source (FR-38.14) and writes the cells like the grid PUT (If-Match required, Draft plan
        only). source prior-plan copies the approved scenario of the previous fiscal year's plan on the same legal entity and rule
        version into this plan's year, for the named accounts or all of them. source gl-actuals reads the previous fiscal year's posted
        net debit per month of each named account from the ledger and shares it over the cost centers by weight; an account with
        nothing posted adds no cells and the response says so with priorYearFallback. Every amount is scaled by adjustmentPct.
        Nothing to copy is 422 BUD-0061, more than 5000 cells 422 BUD-0062, zero cost center weights 422 BUD-0060.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, description: The grid ETag read from the last GET or write (the scenario version)., schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [source], additionalProperties: false, properties: { source: { type: string, enum: [prior-plan, gl-actuals] }, adjustmentPct: { type: string, description: Above -100 and at most 1000, at most 4 decimal places. }, accounts: { type: array, maxItems: 50, items: { type: string } }, costCenters: { type: array, maxItems: 200, description: Only with gl-actuals., items: { type: object, required: [costCenter, weight], properties: { costCenter: { type: string }, weight: { type: string } } } } } } } }
      responses:
        '200': { description: Cells written and the scenario total., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/PlanGridWritten' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/plans/{id}:submit:
    post:
      operationId: submitBudgetPlan
      x-passage-duty: budget.plan.maintain
      description: Draft to Submitted once both stages have owners and some scenario holds an amount (BUD-0045). Emits dev.passage.budget.plan.submitted.v1.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      responses:
        '200': { description: The plan., content: { application/json: { schema: { $ref: '#/components/schemas/PlanView' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/plans/{id}/stages/{stage}:sign-off:
    post:
      operationId: signOffBudgetPlanStage
      x-passage-duty: budget.plan.workflow
      description: >-
        Service-only; called by workflow-ts with the deciding person as the acting user. That person must own the stage for the
        org unit (BUD-0043), not have submitted the plan and, for Approve, not have reviewed it (BUD-0044). submission must be the
        current one (BUD-0046). When the last org unit signed Review the plan is Reviewed; when the last signed Approve the
        scenarioId is posted as an Original register entry and the plan is Approved. The approver must not have created the plan, set its owners or
        edited the scenario (or the scenario it was copied from) (BUD-0044); an Original entry for the fiscal year already on the rule version refuses
        the approval (409 BUD-0059), as does another approved plan for the rule version and year (409 BUD-0057).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: stage, in: path, required: true, schema: { type: string, enum: [review, approve] } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [orgUnitId, submission], properties: { orgUnitId: { type: string, format: uuid }, scenarioId: { type: string, format: uuid, description: Required for approve; not allowed for review. }, submission: { type: integer, minimum: 1 } } } } }
      responses:
        '200': { description: The plan., content: { application/json: { schema: { $ref: '#/components/schemas/PlanView' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/plans/{id}:reject:
    post:
      operationId: rejectBudgetPlan
      x-passage-duty: budget.plan.workflow
      description: Service-only. An owner of the open stage sends the plan back to Draft and the sign-offs are cleared. Emits dev.passage.budget.plan.rejected.v1.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason, submission], properties: { reason: { type: string, maxLength: 500 }, submission: { type: integer, minimum: 1 } } } } }
      responses:
        '200': { description: The plan., content: { application/json: { schema: { $ref: '#/components/schemas/PlanView' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/investment-programs:
    get:
      operationId: listInvestmentPrograms
      summary: "List investment programs"
      x-passage-duty: budget.view
      parameters:
        - { name: legalEntityId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Programs, newest approval year first.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProgramList' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createInvestmentProgram
      x-passage-duty: budget.program.maintain
      description: Creates a Capex program for one approval year. The code is unique per legal entity and year (BUD-0031).
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateProgram' } } }
      responses:
        '201':
          description: The program, with no positions yet.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProgramView' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/investment-programs/{id}:
    get:
      operationId: getInvestmentProgram
      summary: "Get an investment program"
      x-passage-duty: budget.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The program with every position (parents first), assignments and rolled-up plan, actual and commitment.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProgramView' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/investment-programs/{id}:distribute:
    post:
      operationId: distributeInvestmentProgram
      x-passage-duty: budget.program.maintain
      description: >-
        Sets the budgets of child positions under one parent (the program itself when parentPositionId is absent),
        creating positions for new codes one level down. Σ child budgets never exceed the parent budget (CO-0641 with the
        excess, AC-38.13) and a position cannot drop below what it distributes (BUD-0023). The program row is locked, so
        concurrent distributions serialize.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DistributeProgram' } } }
      responses:
        '200':
          description: The program after the distribution.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProgramView' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/investment-programs/{id}:assign:
    post:
      operationId: assignToInvestmentProgram
      x-passage-duty: budget.program.maintain
      description: >-
        Puts a capex request, asset under construction or project on a position with the plan, actual and commitment its
        owning service reports. Re-assigning the same object replaces its amounts and may move it to another position.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssignToProgram' } } }
      responses:
        '200':
          description: The program after the assignment.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProgramView' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/budget/investment-programs/{id}:carry-forward:
    post:
      operationId: carryForwardInvestmentProgram
      x-passage-duty: budget.program.maintain
      description: >-
        Records each position's unused budget (its undistributed slice less the actual and commitment of its own
        assignments) for the next approval year, once per position (BR-38.15). Emits
        dev.passage.budget.program.carriedforward.v1 when anything is carried; a rerun with nothing left is BUD-0021.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toYear]
              additionalProperties: false
              properties:
                toYear: { type: integer, description: The program's approval year + 1. }
      responses:
        '200':
          description: The carried amounts per position.
          content: { application/json: { schema: { $ref: '#/components/schemas/CarryForwardResult' } } }
        default: { $ref: '#/components/responses/Problem' }
components:
  parameters:
    Rule:
      name: rule
      in: query
      required: true
      description: Budget control rule version id.
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              instance: { type: string }
              code: { type: string }
              traceId: { type: string }
              errors: { type: object, additionalProperties: { type: string } }
  schemas:
    Money:
      type: string
      description: Decimal string, never a JSON number in responses.
    PlanScenario:
      type: object
      required: [id, name, kind, version, total]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [Baseline, Optimistic, Pessimistic, Custom] }
        copiedFromId: { type: string, format: uuid }
        version: { type: integer, format: int64, description: The grid ETag. }
        total: { $ref: '#/components/schemas/Money' }
    PlanStageOwner:
      type: object
      required: [stage, orgUnitId, owner]
      properties:
        stage: { type: string, enum: [Review, Approve] }
        orgUnitId: { type: string, format: uuid }
        owner: { type: string }
        signedBy: { type: string }
        signedAt: { type: string }
    Plan:
      type: object
      required: [id, legalEntityId, ruleVersionId, name, fiscalYear, currency, status, submission, version, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        ruleVersionId: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        name: { type: string }
        fiscalYear: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [Draft, Submitted, Reviewed, Approved] }
        submission: { type: integer, description: Counts submissions; signals carry the one they were started for. }
        submittedBy: { type: string }
        approvedScenarioId: { type: string, format: uuid }
        registerEntryId: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    PlanView:
      allOf:
        - { $ref: '#/components/schemas/Plan' }
        - type: object
          required: [scenarios, stageOwners]
          properties:
            scenarios: { type: array, items: { $ref: '#/components/schemas/PlanScenario' } }
            stageOwners: { type: array, items: { $ref: '#/components/schemas/PlanStageOwner' } }
    PlanList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Plan' } }
    PlanCell:
      type: object
      required: [account, costCenter, period, amount]
      properties:
        account: { type: string }
        costCenter: { type: string }
        period: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        amount: { $ref: '#/components/schemas/Money' }
    PlanGrid:
      type: object
      required: [scenario, cells, total, truncated]
      properties:
        scenario: { $ref: '#/components/schemas/PlanScenario' }
        cells: { type: array, maxItems: 10000, items: { $ref: '#/components/schemas/PlanCell' } }
        total: { $ref: '#/components/schemas/Money' }
        truncated: { type: boolean, description: More than 10000 cells matched; narrow the filter to see the rest. total still covers every match. }
    PlanComparison:
      type: object
      required: [groupBy, base, other, rows, delta]
      properties:
        groupBy: { type: string, enum: [account, costCenter, period] }
        base: { $ref: '#/components/schemas/PlanScenario' }
        other: { $ref: '#/components/schemas/PlanScenario' }
        delta: { $ref: '#/components/schemas/Money', description: Other total less base total. }
        rows:
          type: array
          items:
            type: object
            required: [key, base, other, delta]
            properties:
              key: { type: string }
              base: { $ref: '#/components/schemas/Money' }
              other: { $ref: '#/components/schemas/Money' }
              delta: { $ref: '#/components/schemas/Money' }
              deltaPct: { type: string, description: Change as a percentage of the base, two decimals; omitted when the base is zero. }
    PlanGridWritten:
      type: object
      required: [scenarioId, version, cells, total]
      properties:
        scenarioId: { type: string, format: uuid }
        version: { type: integer, format: int64, description: The new grid ETag. }
        cells: { type: integer }
        total: { $ref: '#/components/schemas/Money' }
        priorYearFallback: { type: boolean, description: A prior-year-actuals spread found no actuals and weighted the periods evenly. }
    CreateRule:
      type: object
      required: [legalEntityId, code, warnPct, blockPct, currency, effectiveFrom]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9_-]{2,40}$' }
        warnPct: { $ref: '#/components/schemas/Money' }
        blockPct: { $ref: '#/components/schemas/Money' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        effectiveFrom: { type: string, format: date }
    Rule:
      type: object
      required: [id, legalEntityId, code, version, warnPct, blockPct, currency, effectiveFrom]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string }
        version: { type: integer }
        warnPct: { $ref: '#/components/schemas/Money' }
        blockPct: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        effectiveFrom: { type: string, format: date }
    RegisterEntry:
      type: object
      required: [ruleVersionId, entryType, lines]
      additionalProperties: false
      properties:
        ruleVersionId: { type: string, format: uuid }
        entryType: { type: string, enum: [Original, Revision, Transfer, CarryForward] }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/RegisterLine' }
    RegisterLine:
      type: object
      required: [dimensionKey, spanKey, amount]
      additionalProperties: false
      properties:
        dimensionKey: { type: string, maxLength: 200 }
        spanKey: { type: string, maxLength: 40 }
        amount: { $ref: '#/components/schemas/Money' }
    PostedEntry:
      type: object
      required: [id, ruleVersionId, entryType, status, total, postedAt, lines]
      properties:
        id: { type: string, format: uuid }
        ruleVersionId: { type: string, format: uuid }
        entryType: { type: string, enum: [Original, Revision, Transfer, CarryForward] }
        status: { type: string, enum: [Posted] }
        total: { $ref: '#/components/schemas/Money' }
        postedAt: { type: string, format: date-time }
        lines: { type: array, items: { $ref: '#/components/schemas/RegisterLine' } }
    PostedEntryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PostedEntry' } }
    RuleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Rule' } }
    Balance:
      type: object
      required: [id, ruleVersionId, controlDimensionKey, timeSpanKey, budgetTotal, actuals, encumbrances, preEncumbrances, reservations, available, version]
      properties:
        id: { type: string, format: uuid }
        ruleVersionId: { type: string, format: uuid }
        controlDimensionKey: { type: string }
        timeSpanKey: { type: string }
        budgetTotal: { $ref: '#/components/schemas/Money' }
        actuals: { $ref: '#/components/schemas/Money' }
        encumbrances: { $ref: '#/components/schemas/Money' }
        preEncumbrances: { $ref: '#/components/schemas/Money' }
        reservations: { $ref: '#/components/schemas/Money', description: Open amounts of fund-holding reservation documents. }
        available: { $ref: '#/components/schemas/Money', description: budgetTotal - actuals - encumbrances - preEncumbrances - reservations. }
        version: { type: integer }
    BalanceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Balance' } }
    Encumbrance:
      type: object
      required: [id, ruleVersionId, controlDimensionKey, timeSpanKey, sourceType, sourceDocumentId, sourceLineId, reserved, relieved, released, remaining, status, history, createdAt]
      properties:
        id: { type: string, format: uuid }
        ruleVersionId: { type: string, format: uuid }
        controlDimensionKey: { type: string }
        timeSpanKey: { type: string }
        sourceType: { type: string, enum: [Requisition, PurchaseOrder, Invoice, Journal] }
        sourceDocumentId: { type: string, format: uuid }
        sourceLineId: { type: string, format: uuid }
        reserved: { $ref: '#/components/schemas/Money' }
        relieved: { $ref: '#/components/schemas/Money' }
        released: { $ref: '#/components/schemas/Money', description: Open remainder given back on a PO line cancellation or PO close. }
        remaining: { $ref: '#/components/schemas/Money', description: reserved - relieved - released. }
        status: { type: string, enum: [Open, PartiallyRelieved, Relieved, Released] }
        stage: { type: string, enum: [pre, encumbrance], description: A requisition reserves a pre-encumbrance; the purchase order converts it into an encumbrance. }
        history:
          type: array
          items:
            type: object
            required: [type, amount, documentId, at]
            properties:
              type: { type: string, enum: [Reserve, Adjust, Relieve, Consume, Release, Convert] }
              amount: { $ref: '#/components/schemas/Money' }
              documentId: { type: string, format: uuid }
              at: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    EncumbranceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Encumbrance' } }
    CheckList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CheckResult' } }
    Check:
      type: object
      required: [ruleVersionId, documentId, documentType, lines]
      additionalProperties: false
      properties:
        ruleVersionId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        documentType: { type: string, enum: [Requisition, PurchaseOrder, Invoice, Journal] }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [lineId, dimensionKey, spanKey, amount]
            properties:
              lineId: { type: string, format: uuid }
              dimensionKey: { type: string, maxLength: 200 }
              spanKey: { type: string, maxLength: 40, description: 'For example FY2026, 2026-Q3 or 2026-09.' }
              amount: { $ref: '#/components/schemas/Money' }
    CheckResult:
      type: object
      required: [id, ruleVersionId, documentId, documentType, result, overridden, checkedAt, lines]
      properties:
        id: { type: string, format: uuid }
        ruleVersionId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        documentType: { type: string, enum: [Requisition, PurchaseOrder, Invoice, Journal, Reservation] }
        result: { type: string, enum: [pass, warn, fail] }
        overridden: { type: boolean }
        checkedAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [lineId, dimensionKey, spanKey, amount, prior, result, available, net, overPct, trace]
            properties:
              lineId: { type: string, format: uuid }
              dimensionKey: { type: string }
              spanKey: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
              prior: { $ref: '#/components/schemas/Money', description: The line's stored reservation before this check (step 4). }
              encumbranceId: { type: string, format: uuid, description: Present once the line holds a reservation. }
              result: { type: string, enum: [pass, warn, fail] }
              available: { $ref: '#/components/schemas/Money' }
              net: { $ref: '#/components/schemas/Money' }
              overPct: { $ref: '#/components/schemas/Money' }
              trace: { type: array, items: { type: string } }
    Relieve:
      type: object
      required: [invoiceId, invoiceAmount, invoiceQuantity, poUnitPrice]
      additionalProperties: false
      properties:
        invoiceId: { type: string, format: uuid }
        invoiceAmount: { $ref: '#/components/schemas/Money' }
        invoiceQuantity: { $ref: '#/components/schemas/Money' }
        poUnitPrice: { $ref: '#/components/schemas/Money' }
    ReliefResult:
      type: object
      required: [encumbranceId, relieved, remaining, excess, status]
      properties:
        encumbranceId: { type: string, format: uuid }
        relieved: { $ref: '#/components/schemas/Money' }
        remaining: { $ref: '#/components/schemas/Money' }
        excess: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [Open, PartiallyRelieved, Relieved, Released] }
    Release:
      type: object
      required: [documentId, reason]
      additionalProperties: false
      properties:
        documentId: { type: string, format: uuid, description: The cancelled or closed purchase order. }
        reason: { type: string, enum: [Cancelled, Closed], description: Cancelled for a PO line cancellation, Closed for a PO closed with a residual. }
    ReleaseResult:
      type: object
      required: [encumbranceId, reason, released, relieved, remaining, status]
      properties:
        encumbranceId: { type: string, format: uuid }
        reason: { type: string, enum: [Cancelled, Closed] }
        released: { $ref: '#/components/schemas/Money' }
        relieved: { $ref: '#/components/schemas/Money' }
        remaining: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [Released] }
    ReservationType:
      type: string
      enum: [FundsReservation, Precommitment, FundsBlocking, RevenueForecast]
    ReservationStatus:
      type: string
      enum: [Open, PartiallyConsumed, Consumed, Closed, Expired]
    CreateReservation:
      type: object
      required: [ruleVersionId, type, lines]
      additionalProperties: false
      properties:
        ruleVersionId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ReservationType' }
        description: { type: string, maxLength: 500 }
        expiryDate: { type: string, format: date, description: First day the document no longer holds funds. Not allowed on FundsBlocking. }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [dimensionKey, spanKey, amount]
            additionalProperties: false
            properties:
              dimensionKey: { type: string, maxLength: 200 }
              spanKey: { type: string, maxLength: 40 }
              amount: { $ref: '#/components/schemas/Money' }
    Reservation:
      type: object
      required: [id, legalEntityId, ruleVersionId, type, number, description, status, total, consumed, released, open, version, createdAt, lines, consumptions]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        ruleVersionId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ReservationType' }
        number: { type: string, examples: [FR-000001] }
        description: { type: string }
        expiryDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        total: { $ref: '#/components/schemas/Money' }
        consumed: { $ref: '#/components/schemas/Money' }
        released: { $ref: '#/components/schemas/Money' }
        open: { $ref: '#/components/schemas/Money' }
        checkId: { type: string, format: uuid }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [lineId, dimensionKey, spanKey, amount, consumed, released, open]
            properties:
              lineId: { type: string, format: uuid }
              dimensionKey: { type: string }
              spanKey: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
              consumed: { $ref: '#/components/schemas/Money' }
              released: { $ref: '#/components/schemas/Money' }
              open: { $ref: '#/components/schemas/Money' }
        consumptions:
          type: array
          items:
            type: object
            required: [id, lineId, encumbranceId, documentType, documentId, documentLineId, amount, consumedAt]
            properties:
              id: { type: string, format: uuid }
              lineId: { type: string, format: uuid }
              encumbranceId: { type: string, format: uuid }
              documentType: { type: string, enum: [Requisition, PurchaseOrder, Invoice, Journal] }
              documentId: { type: string, format: uuid }
              documentLineId: { type: string, format: uuid }
              amount: { $ref: '#/components/schemas/Money' }
              consumedAt: { type: string, format: date-time }
        check: { $ref: '#/components/schemas/CheckResult', description: Present on the create response of a fund-holding document. }
    ReservationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Reservation' } }
    ConsumeReservation:
      type: object
      required: [lineId, documentType, documentId, documentLineId, amount]
      additionalProperties: false
      properties:
        lineId: { type: string, format: uuid, description: The reservation line drawn on. }
        documentType: { type: string, enum: [Requisition, PurchaseOrder, Invoice, Journal] }
        documentId: { type: string, format: uuid }
        documentLineId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
    ConsumeResult:
      type: object
      required: [reservationId, lineId, documentId, encumbranceId, consumed, lineOpen, open, status]
      properties:
        reservationId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        encumbranceId: { type: string, format: uuid }
        consumed: { $ref: '#/components/schemas/Money' }
        lineOpen: { $ref: '#/components/schemas/Money' }
        open: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/ReservationStatus' }
    ReleaseResult:
      type: object
      required: [reservationId, number, released, status]
      properties:
        reservationId: { type: string, format: uuid }
        number: { type: string }
        released: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/ReservationStatus' }
    ExpireResult:
      type: object
      required: [asOf, expired]
      properties:
        asOf: { type: string, format: date }
        expired: { type: array, items: { $ref: '#/components/schemas/ReleaseResult' } }
    CreateProgram:
      type: object
      required: [legalEntityId, code, approvalYear, currency, budget]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9_-]{2,40}$' }
        name: { type: string, maxLength: 200 }
        approvalYear: { type: integer, minimum: 1900, maximum: 2999 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        budget: { $ref: '#/components/schemas/Money' }
    Program:
      type: object
      required: [id, legalEntityId, code, name, approvalYear, programType, currency, budget, distributed, status, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        approvalYear: { type: integer }
        programType: { type: string, enum: [Capex] }
        currency: { type: string }
        budget: { $ref: '#/components/schemas/Money' }
        distributed: { $ref: '#/components/schemas/Money', description: Σ budgets of the top-level positions. }
        status: { type: string, enum: [Open, Closed] }
        version: { type: integer, description: Increases with every distribution, assignment and carry-forward. }
        createdAt: { type: string, format: date-time }
    ProgramList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Program' } }
    ProgramView:
      allOf:
        - { $ref: '#/components/schemas/Program' }
        - type: object
          required: [plan, actual, commitment, available, carriedForward, positions]
          properties:
            plan: { $ref: '#/components/schemas/Money' }
            actual: { $ref: '#/components/schemas/Money' }
            commitment: { $ref: '#/components/schemas/Money' }
            available: { $ref: '#/components/schemas/Money', description: budget − actual − commitment. }
            carriedForward: { $ref: '#/components/schemas/Money' }
            positions: { type: array, items: { $ref: '#/components/schemas/ProgramPosition' } }
    ProgramPosition:
      type: object
      required: [id, programId, code, level, category, budget, distributed, undistributed, plan, actual, commitment, available, carriedForward, assignments]
      properties:
        id: { type: string, format: uuid }
        programId: { type: string, format: uuid }
        parentId: { type: string, format: uuid, description: Absent on a top-level position. }
        code: { type: string }
        level: { type: integer, minimum: 1, maximum: 6 }
        category: { type: string, enum: [Capex, Opex-related, Contingency] }
        budget: { $ref: '#/components/schemas/Money' }
        distributed: { $ref: '#/components/schemas/Money', description: Σ budgets of the child positions. }
        undistributed: { $ref: '#/components/schemas/Money' }
        plan: { $ref: '#/components/schemas/Money', description: Rolled up over the subtree. }
        actual: { $ref: '#/components/schemas/Money', description: Rolled up over the subtree. }
        commitment: { $ref: '#/components/schemas/Money', description: Rolled up over the subtree. }
        available: { $ref: '#/components/schemas/Money', description: budget − rolled-up actual − rolled-up commitment. }
        carriedForward: { $ref: '#/components/schemas/Money' }
        assignments:
          type: array
          items:
            type: object
            required: [id, positionId, objectType, objectRef, plan, actual, commitment, updatedAt]
            properties:
              id: { type: string, format: uuid }
              positionId: { type: string, format: uuid }
              objectType: { type: string, enum: [CapexRequest, AssetUnderConstruction, Project] }
              objectRef: { type: string }
              plan: { $ref: '#/components/schemas/Money' }
              actual: { $ref: '#/components/schemas/Money' }
              commitment: { $ref: '#/components/schemas/Money' }
              updatedAt: { type: string, format: date-time }
    DistributeProgram:
      type: object
      required: [allocations]
      additionalProperties: false
      properties:
        parentPositionId: { type: string, format: uuid, description: Absent or empty distributes the program budget. }
        allocations:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [positionCode, budget]
            additionalProperties: false
            properties:
              positionCode: { type: string, pattern: '^[A-Z0-9_.-]{1,40}$', description: Unique within the program; a new code creates the position. }
              category: { type: string, enum: [Capex, Opex-related, Contingency], description: Defaults to Capex for a new position; absent keeps an existing one. }
              budget: { $ref: '#/components/schemas/Money' }
    AssignToProgram:
      type: object
      required: [positionId, objectType, objectRef]
      additionalProperties: false
      properties:
        positionId: { type: string, format: uuid }
        objectType: { type: string, enum: [CapexRequest, AssetUnderConstruction, Project] }
        objectRef: { type: string, minLength: 1, maxLength: 80 }
        plan: { $ref: '#/components/schemas/Money' }
        actual: { $ref: '#/components/schemas/Money' }
        commitment: { $ref: '#/components/schemas/Money' }
    CarryForwardResult:
      type: object
      required: [programId, fromYear, toYear, amount, positions]
      properties:
        programId: { type: string, format: uuid }
        fromYear: { type: integer }
        toYear: { type: integer }
        amount: { $ref: '#/components/schemas/Money' }
        positions:
          type: array
          items:
            type: object
            required: [positionId, code, amount]
            properties:
              positionId: { type: string, format: uuid }
              code: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
