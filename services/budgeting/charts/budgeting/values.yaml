image: { repository: ghcr.io/benjaminsrussell/budgeting, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: budgeting-db
migrateOnStart: false
replicaCount: 2
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 192Mi }
serviceMonitor: { enabled: false }
# The general ledger the prior-year-actuals spreading helper reads; unset, that helper answers 503 BUD-0054.
ledgerUrl: ""
# The services a plan is generated from (FR-38.14): the fixed asset register (depreciation schedules), HR (positions), projects
# (forecast models) and planning (demand forecast). Each needs serviceIdentity.signingKeySecret, and budgeting's public key in that
# service's serviceIdentity.publicKeys. A source whose URL is unset answers 503 BUD-0063.
assetsUrl: ""
hrUrl: ""
projectsUrl: ""
planningUrl: ""
serviceIdentity:
  signingKeySecret: ""
  keyId: ""
  # workflow-ts's Ed25519 public key ("name[:kid]=base64", comma separated) so budget.plan.workflow service tokens verify.
  publicKeys: ""
