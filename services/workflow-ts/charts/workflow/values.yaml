image:
  repository: ghcr.io/benjaminsrussell/passage-workflow
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
replicaCount: 1
temporal:
  address: temporal-frontend.temporal.svc:7233
  namespace: passage
  taskQueue: passage-approvals
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
# Each target Service listens on 8080. payables, engineering, quality and party name their Service after the
# release (these defaults assume the release is named like the chart); transport names it after the chart.
payablesUrl: http://payables.passage.svc:8080
engineeringUrl: http://engineering.passage.svc:8080
qualityUrl: http://quality.passage.svc:8080
transportUrl: http://transport.passage.svc:8080
partyUrl: http://party.passage.svc:8080
serviceIdentity:
  signingKeySecret: ""
  keyId: ""
# The tender trigger (#426): with brokers set, the worker consumes transport's passage.tms.load and passage.tms.tender,
# starts tenderWorkflow on load.released and signals it on tender.accepted and tender.declined. The secret holds the
# KafkaUser's password and the cluster CA (keys password, ca.crt); deploy/kafka/workflow-ts-consumer.yaml grants the user.
kafka:
  brokers: ""
  group: workflow-ts-tender
  dlqTopic: passage.workflow.tender.dlq
  username: workflow-ts-consumer
  secret: ""
networkPolicy:
  gatewayNamespace: envoy-gateway-system
