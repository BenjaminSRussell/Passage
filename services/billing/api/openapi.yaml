openapi: 3.1.0
info:
  title: Passage Billing API
  version: 0.1.0
  description: >
    Invoice proposals, posting and reads for the billing context (PSG-29).
    Slice 1 covers free-text invoices; slice 3 adds installment plans on the
    free-text proposal (FR-29.18) and credit notes against posted invoices
    (FR-29.5); slice 5 adds invoice proposals from posted packing slips, one
    per order or consolidated (FR-29.1, FR-29.2), and the invoice audit trace
    (FR-29.12). Subscription flows arrive in later slices (see NOT-IMPLEMENTED.md).
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/billing/free-text-invoices:
    post:
      operationId: createFreeTextInvoice
      summary: Create a free-text invoice proposal (not yet posted).
      description: >
        Quotes tax per line through the tax engine (FR-29.6). When the engine is
        unavailable nothing is stored (503 BIL-0001); a tax code the engine does
        not know is refused (422 BIL-0102). A caller scoped to one legal entity
        may only invoice for that entity (403 AUTH-0003). With installmentTerms
        the gross is split into one open item per installment (BR-29.11):
        round_half_even(gross × pct) each, the residual on the last, due on the
        invoice date + offset; the invoice's due date is the last installment's.
      x-passage-duty: billing.invoice.maintain (InvoiceMaintain)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreeTextInvoiceRequest"
      responses:
        "201":
          description: Proposal created with tax quoted per line.
          headers:
            ETag:
              description: The invoice version, to send as If-Match when posting.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "200":
          description: Idempotent replay of an earlier completed request with the same body.
          headers:
            Idempotent-Replayed:
              description: Always true on a replay.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: A concurrent request holds the same Idempotency-Key (idempotency_in_progress).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >
            Idempotency-Key reused with another body (idempotency_key_reuse), unknown
            tax code (BIL-0102) or installment percentages not totalling 100 (BIL-0011).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/billing/proposals:
    post:
      operationId: createShipmentProposals
      summary: Build invoice proposals from posted packing slips (one per order, or consolidated).
      description: >
        The slips all bill one invoice account in one currency and terms. Without
        `consolidate` there is one SHIPMENT invoice per order; with it every slip
        goes on one invoice, CONSOLIDATED when it spans more than one order
        (FR-29.1, FR-29.2, BR-29.5). An invoice over BILLING_MAX_LINES lines is
        split at slip boundaries; a slip alone over the limit is refused (422
        BIL-0007). The invoice date may not precede a slip's date (422 BIL-0006).
        Each invoice line keeps its packing slip, slip line, order, order line,
        product and price explanation. Tax is quoted per invoice; when the engine
        is unavailable nothing is stored (503 BIL-0001). The batch is stored in one
        transaction. The Idempotency-Key names the whole request: a replay returns
        every invoice (200). A packing slip line is invoiced once: a request naming
        a slip line already on an invoice or proposal is refused whole (409 BIL-0104).
      x-passage-duty: billing.invoice.maintain (InvoiceMaintain)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentProposalRequest"
      responses:
        "201":
          description: Proposals created with tax quoted per line, in batch order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalBatch"
        "200":
          description: Idempotent replay of an earlier completed request with the same body.
          headers:
            Idempotent-Replayed:
              description: Always true on a replay.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalBatch"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: >
            A packing slip line is already on an invoice or proposal (BIL-0104), or a
            concurrent request holds the same Idempotency-Key (idempotency_in_progress).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >
            Idempotency-Key reused with another body (idempotency_key_reuse), invoice
            date before a slip date (BIL-0006), a slip over the line limit (BIL-0007)
            or an unknown tax code (BIL-0102).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/billing/invoices:
    get:
      operationId: listInvoices
      summary: List invoice headers, newest first (Invoices list inquiry, §5.29.14).
      x-passage-duty: billing.invoice.view (InvoiceView)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PROPOSAL, POSTED, PARTIALLY_SETTLED, SETTLED, REVERSED] }
        - name: type
          in: query
          schema: { type: string, enum: [SHIPMENT, CONSOLIDATED, FREE_TEXT, SUBSCRIPTION, MILESTONE, CREDIT_NOTE] }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
        - name: originalInvoiceId
          in: query
          description: Only the credit notes of this invoice.
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          description: The nextCursor of the previous page (opaque).
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: At most `limit` invoice headers without lines; nextCursor is present when more follow.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InvoiceSummary"
                  nextCursor:
                    type: string
                    description: Pass as cursor for the next page; absent on the last page.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/billing/invoices/{id}:
    get:
      operationId: getInvoice
      summary: Read one invoice or credit note with its lines, installments and totals.
      description: >
        A posted invoice that can be credited also carries `credited` (gross of its
        posted credit notes and the remaining creditable amount) and per line the
        quantity credited so far.
      x-passage-duty: billing.invoice.view (InvoiceView)
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: The invoice.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/billing/invoices/{id}/trace:
    get:
      operationId: getInvoiceTrace
      summary: Audit trace of an invoice to its packing slips, order lines and price explanations.
      description: >
        FR-29.12 (§5.29.14 invoice trace). Every line with the packing slip, slip
        line, order, order line, product and price explanation it came from, and
        the packing slips once each with their date and order. A credit note's
        lines resolve through the original invoice's lines; a free-text invoice has
        no documents behind its lines. Revenue schedules are not on the trace yet.
      x-passage-duty: billing.invoice.view (InvoiceView)
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: The trace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceTrace"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/billing/invoices/{id}:post:
    post:
      operationId: postInvoice
      summary: Post a proposal. Re-quotes tax, books AR and the journal, and assigns the gap-free number.
      x-passage-duty: billing.invoice.post (InvoicePost)
      description: >
        Posting an already posted invoice returns it unchanged (idempotent by state;
        the PRD's idempotency key is the invoice id). A failed post consumes no
        invoice number. The tax is re-quoted and the post is refused when it moved
        by more than 0.01 (409 BIL-0002) or the engine is down (503 BIL-0001).
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - name: If-Match
          in: header
          required: false
          description: The ETag (version) the caller reviewed; a stale value returns 412 BIL-0103.
          schema: { type: string }
      responses:
        "200":
          description: The posted invoice with its number.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: Not a proposal (BIL-0101) or tax moved beyond tolerance (BIL-0002).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/billing/sales-reports:
    get:
      operationId: listSalesReports
      summary: List the reports of posted invoices to sales (#29), newest first.
      x-passage-duty: billing.invoice.view (InvoiceView)
      description: >
        One report per (invoice, order) tells sales' `:record-progress` what an invoice billed (kind INVOICED). A PARKED report
        carries the reason in `lastError` (sales refused it, or the attempts ran out); a report sales answers "not yet" (SLS-0058,
        SLS-0059: the order is not shipped or the delivery has not been reported) is retried with backoff first. At most 200 items.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, REPORTED, PARKED] }
      responses:
        "200":
          description: The reports.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SalesReport"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/billing/sales-reports/{id}:retry:
    post:
      operationId: retrySalesReport
      summary: Put a PARKED sales report back in the queue.
      x-passage-duty: billing.invoice.post (InvoicePost)
      description: >
        A PARKED report becomes PENDING again, due now, with its attempts counted from zero; a PENDING one is returned as it is.
        The body and the Idempotency-Key sent to sales do not change, so sales answers a report it already holds from its copy.
        A REPORTED report is refused with 409 BIL-0111; an unknown one is 404 BIL-0110.
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReport"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/billing/tax-reports:
    get:
      operationId: listTaxReports
      summary: List the reports of booked invoices and credit notes to the tax service (#29), newest first.
      x-passage-duty: billing.invoice.view (InvoiceView)
      description: >
        Booking a document to the GL queues one report; a leased reporter records its output tax per tax code with the tax
        service (`POST /v1/tax/transactions`), negative on a credit note. A PARKED report carries the reason in `lastError`
        (the tax service refused it, or the attempts ran out). At most 200 items.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, REPORTED, PARKED] }
      responses:
        "200":
          description: The reports.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaxReport"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/billing/tax-reports/{id}:retry:
    post:
      operationId: retryTaxReport
      summary: Put a PARKED tax report back in the queue.
      x-passage-duty: billing.invoice.post (InvoicePost)
      description: >
        A PARKED report becomes PENDING again, due now, with its attempts counted from zero; a PENDING one is returned as it is.
        The body does not change, so the tax service answers a transaction it already holds as a duplicate. A REPORTED report is
        refused with 409 BIL-0121; an unknown one is 404 BIL-0120.
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxReport"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/billing/gl-postings:
    post:
      operationId: postGL
      summary: Book the invoice journal (FR-29.3) of posted invoices and credit notes in the general ledger.
      x-passage-duty: billing.invoice.post (InvoicePost)
      description: >
        The auto-book worker (BILLING_GL_AUTOBOOK_TENANT_IDS) runs this same posting on a timer; calling it books what the worker has
        not reached yet, and a document booked by either is never booked again (ledger key per document).
        Books one balanced entry per posted invoice not yet booked: Dr receivable
        (billed gross), Cr revenue per line account, Cr 2400, Cr / Dr contract position,
        Cr charges, Cr tax. The invoice lines, the receivable and the tax keep the contractual
        price; what an order line books is the revrec allocation of the order's contract
        (ASC 606, BR-29.1), read at posting time: the lines of a product share its remaining
        allocation (the allocation less what earlier booked documents of the contract
        consumed, so the first invoice of a product takes it and a later one books none), and
        the part that is not a POINT_IN_TIME obligation goes to 2400. The difference between
        the billed nets and the allocated amounts moves the contract position of the order,
        netted per contract (ASC 606-10-45, IFRS 15.105): billed above allocated credits 2400
        contract liability, billed below debits the profile's `contractAssetAccount` (1250
        Contract Asset by default). An invoice with an order line is not booked while revrec
        is not configured, has no unique contract for the order or does not answer: it is
        listed under `failed` with BIL-0207 and backed off, never booked at its billed
        amounts and never parked for it. A deferred line the allocation does not cover, a
        currency other than the contract's or an allocation below what was already booked
        parks the document with BIL-0208. A credit note books the mirror entry in the
        proportions of its original, its contract position change included. Ledger, accounts and amounts come
        from the profile, the stored document and revrec, never from the request; the ledger key
        (`billing-invoice-<id>`, `billing-credit-note-<id>`) makes a retry return the same
        entry. A document the ledger refuses is listed under `failed`, retried later with
        backoff and parked with its reason code after five refusals (`retryParked` offers
        parked documents again); it never holds up the documents behind it. A credit note
        is held until its original has its entry and is parked with BIL-0206 while the
        original is parked. A ledger failure without a verdict (502 BIL-0201) is recorded
        on the document with a backoff but does not count toward parking, so one document that
        always fails is skipped by the next call and an outage never parks it. At most 200
        documents per call; `more` says that due documents remain beyond this page, `halted`
        (BIL-0207) that revrec did not answer and the rest of the page was not attempted. One
        run per legal entity at a time: 409 BIL-0209 while another runs. 503 BIL-0200 without
        `LEDGER_URL`, 422 BIL-0202 for an entity with no profile, 422 BIL-0203 when the
        profile's ledger belongs to another entity, 502 BIL-0201 when the ledger does not
        answer (`errors.booked` lists the documents booked before the failure).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId]
              properties:
                legalEntityId: { type: string, format: uuid }
                retryParked: { type: boolean }
      responses:
        "200":
          description: The entries booked by this call and the documents the ledger refused.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        documentId: { type: string, format: uuid }
                        number: { type: string }
                        kind: { type: string, enum: [invoice, credit_note] }
                        currency: { type: string }
                        postingDate: { type: string, format: date }
                        amount: { type: string }
                        journalEntryId: { type: string }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        documentId: { type: string, format: uuid }
                        number: { type: string }
                        ledgerCode: { type: string }
                        parked: { type: boolean }
                  more: { type: boolean }
                  halted: { type: string, enum: [BIL-0207] }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/billing/credit-notes:
    post:
      operationId: createCreditNote
      summary: Propose a credit note against a posted invoice (FR-29.5).
      description: >
        Without `lines` the whole remainder of the original is credited, header
        charges included; with `lines` only those quantities of the original's
        lines are credited, plus `chargeAmount` when given. Lines copy the
        original's description, price, revenue account and tax code. Tax is the
        original's, pro rata to the quantity (half-even to the minor unit), and
        the last remaining quantity of a line takes exactly what is left, so
        partial credits sum to the original to the cent; tax is not re-quoted.
        A credit beyond what the original still allows, or of an invoice that is
        not posted, is refused with 422 BIL-0005. Amounts are positive
        magnitudes; the type CREDIT_NOTE carries the sign.
      x-passage-duty: billing.invoice.maintain (InvoiceMaintain)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditNoteRequest"
      responses:
        "201":
          description: Credit note proposal created.
          headers:
            ETag:
              description: The credit note version, to send as If-Match when posting.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "200":
          description: Idempotent replay of an earlier completed request with the same body.
          headers:
            Idempotent-Replayed:
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: The original invoice does not exist (BIL-0100).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A concurrent request holds the same Idempotency-Key (idempotency_in_progress).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Credit beyond the remaining creditable amount or original not posted (BIL-0005), or Idempotency-Key reuse (idempotency_key_reuse).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/billing/invoices/{id}/credit-reservations:
    post:
      operationId: createCreditReservation
      summary: Reserve part of a posted invoice for a credit issued outside billing (an RMA credit).
      description: >
        Takes the named quantities of the invoice's lines (and optionally
        `chargeAmount`) under the invoice's row lock, the same lock credit note
        posting takes, so posted credit notes plus active reservations never
        exceed what was invoiced. Net and tax are planned like a credit note:
        the original's tax pro rata, the last quantity of a line taking exactly
        what is left. A reservation counts against the invoice until it is
        released or consumed; `credited.reserved` and `reservedQty` on the invoice
        read show it. Reserving again with the key of a released reservation
        re-runs the bound under the same lock: it succeeds (200, RESERVED again)
        or is refused 422 BIL-0005; the key of a consumed reservation replays it.
        Beyond what the invoice still allows, or on an invoice that is not
        posted, it is refused with 422 BIL-0005. The Idempotency-Key is stable
        per RMA: the same key and body return the stored reservation (200),
        the same key with another body is 422.
      x-passage-duty: billing.credit-reservation.write (service only)
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditReservationRequest"
      responses:
        "201":
          description: Credit reserved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditReservation"
        "200":
          description: Idempotent replay of an earlier request with the same key and body.
          headers:
            Idempotent-Replayed:
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditReservation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: The invoice does not exist (BIL-0100).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A concurrent request holds the same Idempotency-Key (idempotency_in_progress).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Credit beyond the remaining creditable amount or invoice not posted (BIL-0005), or Idempotency-Key reuse (idempotency_key_reuse).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/billing/credit-reservations/{id}:release:
    post:
      operationId: releaseCreditReservation
      summary: Release a credit reservation so its amount can be credited again.
      description: >
        Releasing a released reservation returns it unchanged. A consumed
        reservation cannot be released (409 reservation_state). Reservations do
        not expire; the caller releases or commits them.
      x-passage-duty: billing.credit-reservation.write (service only)
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: The released reservation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditReservation"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: The reservation does not exist (BIL-0100).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The reservation is consumed (reservation_state).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/billing/credit-reservations/{id}:commit:
    post:
      operationId: commitCreditReservation
      summary: Mark a reservation consumed once the credit it held was issued.
      description: >
        RESERVED becomes CONSUMED; a consumed reservation keeps counting against
        the invoice and can no longer be released. Committing a consumed
        reservation returns it unchanged; a released one is refused (409
        reservation_state).
      x-passage-duty: billing.credit-reservation.write (service only)
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: The consumed reservation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditReservation"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: The reservation does not exist (BIL-0100).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The reservation is released (reservation_state).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/billing/credit-notes/{id}:post:
    post:
      operationId: postCreditNote
      summary: Post a credit note proposal with the next gap-free CN- number.
      x-passage-duty: billing.creditnote.post (CreditNotePost)
      description: >
        Locks the original invoice and re-checks the remaining creditable amount
        against the credit notes posted since the proposal (422 BIL-0005), then
        assigns `CN-<year>-<7 digits>` and publishes creditnote.posted. Posting an
        already posted credit note returns it unchanged. An invoice id is refused
        with 409 BIL-0101 (invoices post through /v1/billing/invoices/{id}:post,
        which in turn refuses credit notes).
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - name: If-Match
          in: header
          required: false
          description: The ETag (version) the caller reviewed; a stale value returns 412 BIL-0103.
          schema: { type: string }
      responses:
        "200":
          description: The posted credit note with its number.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: Not a credit note proposal (BIL-0101).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          description: The credit no longer fits the original (BIL-0005).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/billing/subscriptions:
    post:
      operationId: createSubscription
      summary: Start a subscription (FR-29.10).
      x-passage-duty: billing.invoice.maintain (InvoiceMaintain)
      description: >
        A plan price per billing period of 1, 3, 6 or 12 months from a start date.
        A retry with the same Idempotency-Key and body returns the subscription
        (200, Idempotent-Replayed). 503 BIL-0109 when subscriptions are not available in the deployment.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionRequest" }
      responses:
        "200": { description: The subscription created by the same key., content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "201": { description: The subscription., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/billing/subscriptions/{id}:
    get:
      operationId: getSubscription
      summary: Read a subscription with its plan terms and the end of the last invoiced period.
      x-passage-duty: billing.invoice.view (InvoiceView)
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200": { description: The subscription., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/billing/subscriptions/{id}:change-plan:
    post:
      operationId: changeSubscriptionPlan
      summary: Move a subscription to another plan price from a date.
      x-passage-duty: billing.invoice.maintain (InvoiceMaintain)
      description: >
        The change must take effect after the current plan began and after the
        last invoiced period (422 BIL-0107); a cancelled subscription refuses it
        (422 BIL-0108). A period that spans the change is billed as one line per plan.
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - { name: If-Match, in: header, required: false, description: "The ETag (version) the caller reviewed; a stale value returns 412 BIL-0103.", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanChangeRequest" }
      responses:
        "200": { description: The subscription with the new term., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/billing/subscriptions/{id}:cancel:
    post:
      operationId: cancelSubscription
      summary: Cancel a subscription; service ends on the last service day.
      x-passage-duty: billing.invoice.maintain (InvoiceMaintain)
      description: >
        The last service day must not be before the current plan began nor before
        the end of the last invoiced period (422 BIL-0107). Cancelling twice is
        refused (422 BIL-0108).
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - { name: If-Match, in: header, required: false, description: "The ETag (version) the caller reviewed; a stale value returns 412 BIL-0103.", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelRequest" }
      responses:
        "200": { description: The cancelled subscription., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/billing/subscriptions/{id}:bill:
    post:
      operationId: billSubscription
      summary: Invoice one billing period of a subscription, prorated by calendar days (BR-29.8).
      x-passage-duty: billing.invoice.maintain (InvoiceMaintain)
      description: >
        periodFrom is the first of a month; the period runs periodMonths months.
        Each plan term served in the period becomes one line, its price times the
        days served over the days in the period, rounded half-even to the
        currency's minor unit. Tax is quoted as for any invoice (503 BIL-0001
        when the tax engine is down) and the SUBSCRIPTION proposal posts through
        /v1/billing/invoices/{id}:post. The period is the idempotency key: a
        repeat returns the same invoice (200, Idempotent-Replayed) and an
        overlapping period is refused (409 BIL-0106). A period with nothing to
        bill is refused (422 BIL-0105); no zero invoice is issued.
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillRequest" }
      responses:
        "200": { description: The invoice already issued for the period., content: { application/json: { schema: { $ref: "#/components/schemas/Invoice" } } } }
        "201": { description: The prorated invoice proposal., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Invoice" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client key, 1 to 255 characters. Retries with the same key and body return the same proposal.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ReservationId:
      name: id
      in: path
      required: true
      description: The credit reservation.
      schema:
        type: string
        format: uuid
    ReportId:
      name: id
      in: path
      required: true
      description: The report id.
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 problem document.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    SalesReport:
      type: object
      required: [id, legalEntityId, invoiceId, sourceRef, orderId, status, attempts, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        sourceRef: { type: string, description: The invoice number. }
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, REPORTED, PARKED] }
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        lastStatus: { type: integer, description: What sales answered; absent when it did not answer. }
        lastError: { type: string }
        reportedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    TaxReport:
      type: object
      required: [id, legalEntityId, invoiceId, kind, sourceRef, status, attempts, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid, description: The invoice or credit note the report records. }
        originalInvoiceId: { type: string, format: uuid, description: The invoice a credit note credits. }
        kind: { type: string, enum: [INVOICE, CREDIT_NOTE] }
        sourceRef: { type: string, description: The document number. }
        status: { type: string, enum: [PENDING, REPORTED, PARKED] }
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        lastStatus: { type: integer, description: What the tax service answered; absent when it did not answer. }
        lastError: { type: string }
        reportedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    SubscriptionRequest:
      type: object
      required: [legalEntityId, customerId, invoiceAccountId, currency, planCode, price, periodMonths, startDate, revenueAccount, taxCode, paymentTermDays]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        invoiceAccountId: { type: string, format: uuid }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        planCode: { type: string, maxLength: 50 }
        price: { type: string, description: "Price of one billing period; positive, up to 6 fraction digits." }
        periodMonths: { type: integer, enum: [1, 3, 6, 12] }
        startDate: { type: string, format: date }
        revenueAccount: { type: string, maxLength: 20 }
        taxCode: { type: string, maxLength: 20 }
        paymentTermDays: { type: integer, minimum: 0, maximum: 365 }
    PlanChangeRequest:
      type: object
      required: [planCode, price, effectiveFrom]
      additionalProperties: false
      properties:
        planCode: { type: string, maxLength: 50 }
        price: { type: string }
        effectiveFrom: { type: string, format: date }
    CancelRequest:
      type: object
      required: [lastServiceDay]
      additionalProperties: false
      properties:
        lastServiceDay: { type: string, format: date }
    BillRequest:
      type: object
      required: [periodFrom]
      additionalProperties: false
      properties:
        periodFrom: { type: string, format: date, description: "The first of a month; after the first invoiced period it must start the day after the latest invoiced period ends or end the day before the earliest one starts (400 COM-0001 otherwise)." }
        invoiceDate: { type: string, format: date, description: "Defaults to periodFrom." }
    Subscription:
      type: object
      required: [id, legalEntityId, customerId, invoiceAccountId, currency, periodMonths, startDate, status, revenueAccount, taxCode, paymentTermDays, terms, version]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        invoiceAccountId: { type: string, format: uuid }
        currency: { type: string }
        periodMonths: { type: integer }
        startDate: { type: string, format: date }
        lastServiceDay: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, CANCELLED] }
        revenueAccount: { type: string }
        taxCode: { type: string }
        paymentTermDays: { type: integer }
        billedThrough: { type: string, format: date, description: "End of the last invoiced period." }
        terms:
          type: array
          items:
            type: object
            required: [planCode, price, effectiveFrom]
            properties:
              planCode: { type: string }
              price: { type: string }
              effectiveFrom: { type: string, format: date }
        version: { type: integer }
    FreeTextInvoiceRequest:
      type: object
      required: [legalEntityId, customerId, invoiceAccountId, currency, invoiceDate, paymentTermDays, lines]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        invoiceAccountId: { type: string, format: uuid }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        invoiceDate: { type: string, format: date }
        paymentTermDays: { type: integer, minimum: 0, maximum: 365 }
        chargeAmount: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$", description: "Header charge, non-negative decimal." }
        installmentTerms:
          type: array
          maxItems: 24
          description: >
            Installment plan (FR-29.18); percentages must total 100 (BIL-0011) and
            offsets must not decrease. Until the wave-7 payment-terms client is
            wired the plan is sent with the proposal.
          items:
            type: object
            required: [percent, offsetDays]
            additionalProperties: false
            properties:
              percent: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$", description: "Above 0, at most 100." }
              offsetDays: { type: integer, minimum: 0, maximum: 365 }
        lines:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            $ref: "#/components/schemas/FreeTextLine"
    FreeTextLine:
      type: object
      required: [description, qty, unitPrice, revenueAccount, taxCode]
      additionalProperties: false
      properties:
        description: { type: string, minLength: 1, maxLength: 200 }
        qty: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$", description: "Positive decimal string." }
        unitPrice: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$", description: "Non-negative decimal string." }
        discountPct: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$", description: "Percent 0 to 100." }
        revenueAccount: { type: string, pattern: "^[A-Za-z0-9._-]{1,20}$", description: "Ledger account; missing returns the field error ending (BIL-0004)." }
        taxCode: { type: string, pattern: "^[A-Z0-9_-]{1,20}$", description: "Tax code quoted by the tax engine (FR-29.4)." }
    ShipmentProposalRequest:
      type: object
      required: [legalEntityId, customerId, invoiceAccountId, currency, invoiceDate, paymentTermDays, slips]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        invoiceAccountId: { type: string, format: uuid }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        invoiceDate: { type: string, format: date, description: "Not before any slip's date (BIL-0006)." }
        paymentTermDays: { type: integer, minimum: 0, maximum: 365 }
        consolidate: { type: boolean, default: false, description: "One invoice for all slips instead of one per order." }
        slips:
          type: array
          minItems: 1
          maxItems: 200
          description: Posted packing slips; at most 10000 slip lines in all.
          items:
            $ref: "#/components/schemas/PackingSlip"
    PackingSlip:
      type: object
      required: [id, orderId, date, lines]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        date: { type: string, format: date, description: "The slip's posting date." }
        chargeAmount: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$", description: "Freight or handling of the slip, added to the invoice charges." }
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PackingSlipLine"
    PackingSlipLine:
      type: object
      required: [id, orderLineId, productId, description, qty, unitPrice, revenueAccount, taxCode]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: "Packing slip line; invoiced once (BIL-0104)." }
        orderLineId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        description: { type: string, minLength: 1, maxLength: 200 }
        qty: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$", description: "Shipped quantity; positive." }
        unitPrice: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$", description: "The order line's price." }
        discountPct: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$", description: "Percent 0 to 100." }
        revenueAccount: { type: string, pattern: "^[A-Za-z0-9._-]{1,20}$", description: "Missing returns the field error ending (BIL-0004)." }
        taxCode: { type: string, pattern: "^[A-Z0-9_-]{1,20}$" }
        priceExplainRef: { type: string, maxLength: 200, description: "The pricing explanation (wave 26) behind the price." }
    ProposalBatch:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
    InvoiceTrace:
      type: object
      required: [invoice, packingSlips, lines]
      properties:
        invoice: { $ref: "#/components/schemas/InvoiceSummary" }
        original:
          $ref: "#/components/schemas/InvoiceSummary"
          description: On a credit note, the invoice it credits.
        packingSlips:
          type: array
          items:
            type: object
            required: [id, date, orderId]
            properties:
              id: { type: string, format: uuid }
              date: { type: string, format: date }
              orderId: { type: string, format: uuid }
        lines:
          type: array
          items:
            type: object
            required: [lineNo, description, qty, net, revenueAccount]
            properties:
              lineNo: { type: integer }
              description: { type: string }
              qty: { type: string }
              net: { $ref: "#/components/schemas/Money" }
              revenueAccount: { type: string }
              originalLineNo: { type: integer, description: "On a credit note: the credited line of the original." }
              packingSlipId: { type: string, format: uuid }
              packingSlipLineId: { type: string, format: uuid }
              orderId: { type: string, format: uuid }
              orderLineId: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              priceExplainRef: { type: string }
    CreditNoteRequest:
      type: object
      required: [originalInvoiceId, creditDate, reason]
      additionalProperties: false
      properties:
        originalInvoiceId: { type: string, format: uuid, description: "The posted invoice to credit." }
        creditDate: { type: string, format: date, description: "Document date of the credit note; not before the original's invoice date." }
        reason: { type: string, minLength: 1, maxLength: 200, description: "Printed on the credit note (EU VAT Directive art. 219)." }
        chargeAmount:
          type: string
          pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$"
          description: Header charges to credit; only with lines (a whole credit includes the remaining charges).
        lines:
          type: array
          maxItems: 2000
          description: Quantities of the original's lines to credit; omit to credit the whole remainder.
          items:
            type: object
            required: [lineNo, qty]
            additionalProperties: false
            properties:
              lineNo: { type: integer, minimum: 1 }
              qty: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$", description: "Positive; at most the line's remaining quantity." }
    CreditReservationRequest:
      type: object
      required: [reference, lines]
      additionalProperties: false
      properties:
        reference: { type: string, minLength: 1, maxLength: 255, description: "The credit's own identifier, for example the RMA id." }
        chargeAmount:
          type: string
          pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$"
          description: Header charges to reserve.
        lines:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            type: object
            required: [lineNo, qty]
            additionalProperties: false
            properties:
              lineNo: { type: integer, minimum: 1 }
              qty: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$", description: "Positive; at most the line's remaining quantity." }
    CreditReservation:
      type: object
      required: [id, invoiceId, reference, status, currency, lines, totals, createdAt]
      properties:
        id: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        reference: { type: string }
        status: { type: string, enum: [RESERVED, CONSUMED, RELEASED] }
        currency: { type: string }
        createdAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time }
        totals:
          type: object
          properties:
            net: { $ref: "#/components/schemas/Money" }
            charges: { $ref: "#/components/schemas/Money" }
            tax: { $ref: "#/components/schemas/Money" }
            gross: { $ref: "#/components/schemas/Money" }
        lines:
          type: array
          items:
            type: object
            properties:
              lineNo: { type: integer, description: "The invoice line reserved." }
              qty: { type: string }
              net: { $ref: "#/components/schemas/Money" }
              tax: { $ref: "#/components/schemas/Money" }
    Money:
      type: string
      pattern: "^-?[0-9]+\\.[0-9]+$"
      description: Decimal string rounded to the currency minor unit.
    Invoice:
      allOf:
        - $ref: "#/components/schemas/InvoiceSummary"
        - type: object
          required: [lines, installments]
          properties:
            reason: { type: string, description: "Credit note reason." }
            credited:
              type: object
              description: On a posted invoice that can be credited.
              required: [gross, reserved, remaining]
              properties:
                gross: { $ref: "#/components/schemas/Money" }
                reserved: { $ref: "#/components/schemas/Money" }
                remaining: { $ref: "#/components/schemas/Money" }
            installments:
              type: array
              description: Open items of the installment plan; empty without a plan.
              items:
                type: object
                required: [no, percent, offsetDays, amount, dueDate]
                properties:
                  no: { type: integer }
                  percent: { type: string }
                  offsetDays: { type: integer }
                  amount: { $ref: "#/components/schemas/Money" }
                  dueDate: { type: string, format: date }
            lines:
              type: array
              items:
                type: object
                required: [lineNo, description, qty, unitPrice, discountPct, net, tax, revenueAccount, taxCode]
                properties:
                  lineNo: { type: integer }
                  description: { type: string }
                  qty: { type: string }
                  unitPrice: { type: string }
                  discountPct: { type: string }
                  net: { $ref: "#/components/schemas/Money" }
                  tax: { $ref: "#/components/schemas/Money" }
                  revenueAccount: { type: string }
                  taxCode: { type: string }
                  originalLineNo: { type: integer, description: "On a credit note: the credited line of the original." }
                  creditedQty: { type: string, description: "On a creditable invoice: quantity credited by posted credit notes." }
                  reservedQty: { type: string, description: "On a creditable invoice with credit: quantity held by active credit reservations." }
                  creditedTax: { type: string, description: "On a creditable invoice with credits: tax already reversed by posted credit notes." }
                  packingSlipId: { type: string, format: uuid, description: "Shipment and consolidated lines: the packing slip billed." }
                  packingSlipLineId: { type: string, format: uuid }
                  orderId: { type: string, format: uuid }
                  orderLineId: { type: string, format: uuid }
                  productId: { type: string, format: uuid }
                  priceExplainRef: { type: string }
    InvoiceSummary:
      type: object
      required: [id, legalEntityId, customerId, invoiceAccountId, type, status, currency, invoiceDate, dueDate, paymentTermDays, totals, version]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        invoiceAccountId: { type: string, format: uuid }
        type: { type: string, enum: [SHIPMENT, CONSOLIDATED, FREE_TEXT, SUBSCRIPTION, MILESTONE, CREDIT_NOTE], description: "FREE_TEXT, SHIPMENT, CONSOLIDATED and CREDIT_NOTE are created so far." }
        status: { type: string, enum: [PROPOSAL, POSTED, PARTIALLY_SETTLED, SETTLED, REVERSED], description: "PROPOSAL and POSTED are reached so far." }
        number: { type: string, description: "INV-<year>-<7 digits> for an invoice, CN-<year>-<7 digits> for a credit note; present once posted." }
        currency: { type: string }
        invoiceDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        postingDate: { type: string, format: date }
        paymentTermDays: { type: integer }
        originalInvoiceId: { type: string, format: uuid, description: "On a credit note." }
        originalNumber: { type: string, description: "On a credit note: the original's invoice number." }
        totals:
          type: object
          required: [net, charges, tax, gross]
          properties:
            net: { $ref: "#/components/schemas/Money" }
            charges: { $ref: "#/components/schemas/Money" }
            tax: { $ref: "#/components/schemas/Money" }
            gross: { $ref: "#/components/schemas/Money" }
        version: { type: integer }
    Problem:
      type: object
      description: RFC 9457 problem details with a stable code.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, description: "https://passage.dev/problems/<code>" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
