asyncapi: 3.0.0
info:
  title: Passage Billing events
  version: 0.1.0
  description: CloudEvents published by the billing context (PSG-29, slices 1 and 3, and creditnote.booked for revrec, #29).
defaultContentType: application/cloudevents+json
channels:
  invoicePosted:
    address: passage.billing.invoice
    description: Outbox relay topic for billing invoice lifecycle events.
    messages:
      invoicePosted:
        $ref: "#/components/messages/InvoicePosted"
      creditNotePosted:
        $ref: "#/components/messages/CreditNotePosted"
      creditNoteBooked:
        $ref: "#/components/messages/CreditNoteBooked"
operations:
  publishInvoicePosted:
    action: send
    channel:
      $ref: "#/channels/invoicePosted"
    summary: Billing publishes invoice.posted when a free-text proposal posts.
    messages:
      - $ref: "#/channels/invoicePosted/messages/invoicePosted"
  publishCreditNotePosted:
    action: send
    channel:
      $ref: "#/channels/invoicePosted"
    summary: Billing publishes creditnote.posted when a credit note proposal posts (FR-29.5).
    messages:
      - $ref: "#/channels/invoicePosted/messages/creditNotePosted"
  publishCreditNoteBooked:
    action: send
    channel:
      $ref: "#/channels/invoicePosted"
    summary: Billing publishes creditnote.booked when the credit note's journal is booked in the general ledger (POST /v1/billing/gl-postings).
    messages:
      - $ref: "#/channels/invoicePosted/messages/creditNoteBooked"
components:
  messages:
    InvoicePosted:
      name: dev.passage.billing.invoice.posted.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [invoice_id, number, type, legal_entity_id, customer, invoice_account, currency, invoice_date, posting_date, due_date, lines, totals, installments, journal_posting_id, intercompany]
        additionalProperties: false
        properties:
          invoice_id: { type: string, format: uuid }
          number: { type: string }
          type: { type: string, enum: [FREE_TEXT, SHIPMENT, CONSOLIDATED], description: "Free-text invoices and invoices from packing slips (one per order, or consolidated)." }
          legal_entity_id: { type: string, format: uuid }
          customer: { type: string, format: uuid }
          invoice_account: { type: string, format: uuid }
          currency: { type: string, pattern: "^[A-Z]{3}$" }
          invoice_date: { type: string, format: date }
          posting_date: { type: string, format: date }
          due_date: { type: string, format: date }
          lines:
            type: array
            items:
              type: object
              required: [line_no, description, qty, net, tax, tax_code, revenue_account]
              additionalProperties: false
              properties:
                line_no: { type: integer }
                description: { type: string }
                qty: { type: string }
                net: { type: string, description: "Decimal string at the currency's minor unit." }
                tax: { type: string, description: "Decimal string at the currency's minor unit." }
                tax_code: { type: string }
                revenue_account: { type: string }
                order_line_id: { type: string, format: uuid, description: "Shipment and consolidated lines only: the sales order line billed." }
                product: { type: string, format: uuid, description: "Shipment and consolidated lines only." }
                packing_slip_line_id: { type: string, format: uuid, description: "Shipment and consolidated lines only: the packing slip line now invoiced (AC-29.5)." }
          totals:
            type: object
            required: [net, charges, tax, gross]
            additionalProperties: false
            properties:
              net: { type: string }
              charges: { type: string }
              tax: { type: string }
              gross: { type: string }
          installments:
            type: array
            description: >
              One open item per installment (FR-29.18, BR-29.11), all under the
              invoice number; amounts sum to totals.gross exactly. Empty when the
              invoice has no installment plan (one open item for the gross, due on
              due_date). Tax is reported once on the invoice, not per installment.
            items:
              type: object
              required: [no, amount, due_date]
              additionalProperties: false
              properties:
                no: { type: integer, minimum: 1 }
                amount: { type: string, description: "Decimal string at the currency's minor unit." }
                due_date: { type: string, format: date }
          journal_posting_id:
            type: [string, "null"]
            description: Always null on the event; the journal is booked after the post by POST /v1/billing/gl-postings and its ledger entry id is kept in invoice.journal_posting_id.
          intercompany: { type: boolean }
    CreditNotePosted:
      name: dev.passage.billing.creditnote.posted.v1
      contentType: application/cloudevents+json
      description: >
        The PRD names this event passage.billing.credit-note.posted.v1; the
        platform type grammar allows lowercase letters and digits per segment, so
        the entity is "creditnote". Amounts are positive magnitudes that reduce
        AR, revenue and tax. Receivables settles the original's open items with
        it; revrec reverses recognized and deferred revenue (BR-29.6); the ledger
        books the reversal journal.
      payload:
        type: object
        required: [credit_note_id, number, original_invoice_id, original_number, reason, legal_entity_id, customer, invoice_account, currency, credit_date, posting_date, lines, totals, journal_posting_id]
        additionalProperties: false
        properties:
          credit_note_id: { type: string, format: uuid }
          number: { type: string, description: "CN-<year>-<7 digits>, gap-free per entity and year." }
          original_invoice_id: { type: string, format: uuid }
          original_number: { type: string }
          reason: { type: string }
          legal_entity_id: { type: string, format: uuid }
          customer: { type: string, format: uuid }
          invoice_account: { type: string, format: uuid }
          currency: { type: string, pattern: "^[A-Z]{3}$" }
          credit_date: { type: string, format: date }
          posting_date: { type: string, format: date }
          lines:
            type: array
            items:
              type: object
              required: [line_no, original_line_no, description, qty, net, tax, tax_code, revenue_account]
              additionalProperties: false
              properties:
                line_no: { type: integer }
                original_line_no: { type: integer, description: "The credited line of the original invoice." }
                description: { type: string }
                qty: { type: string }
                net: { type: string, description: "Decimal string at the currency's minor unit." }
                tax: { type: string, description: "Decimal string at the currency's minor unit." }
                tax_code: { type: string }
                revenue_account: { type: string }
          totals:
            type: object
            required: [net, charges, tax, gross]
            additionalProperties: false
            properties:
              net: { type: string }
              charges: { type: string }
              tax: { type: string }
              gross: { type: string }
          journal_posting_id:
            type: [string, "null"]
            description: Always null on the event; the journal is booked after the post by POST /v1/billing/gl-postings and its ledger entry id is kept in invoice.journal_posting_id.
    CreditNoteBooked:
      name: dev.passage.billing.creditnote.booked.v1
      contentType: application/cloudevents+json
      description: >
        Written in the transaction that stores the credit note's ledger entry
        (invoice.journal_posting_id). creditnote.posted is published before the
        journal exists, and the deferred share a credit note debits to 2400 is
        the original invoice line's booked share apportioned to the credited net,
        known only once the original is booked; this event carries it per line.
        Revrec consumes it (consumer revrec-creditnotes) and reverses the
        schedules of the credited obligations by `deferred` (BR-29.6), so the
        roll-forward keeps tying to GL 2400. Keyed by the credit note id; a line
        is identified by (credit_note_id, line_no).
      payload:
        type: object
        required: [credit_note_id, number, original_invoice_id, original_number, legal_entity_id, currency, posting_date, journal_entry_id, lines]
        additionalProperties: false
        properties:
          credit_note_id: { type: string, format: uuid }
          number: { type: string }
          original_invoice_id: { type: string, format: uuid }
          original_number: { type: string }
          legal_entity_id: { type: string, format: uuid }
          currency: { type: string, pattern: "^[A-Z]{3}$" }
          posting_date: { type: string, format: date, description: "The credit note's posting date, the date of its journal." }
          journal_entry_id: { type: string, description: "The ledger entry of the credit note's journal (invoice.journal_posting_id)." }
          lines:
            type: array
            items:
              type: object
              required: [line_no, original_line_no, net, allocated, deferred]
              additionalProperties: false
              properties:
                line_no: { type: integer }
                original_line_no: { type: integer }
                order_id: { type: string, format: uuid, description: "The order of the credited original line; absent on free-text lines." }
                product: { type: string, format: uuid, description: "The product of the credited original line; absent on free-text lines." }
                net: { type: string, description: "The credited net, a decimal string at the currency's minor unit." }
                allocated: { type: string, description: "Revenue the journal debited for the line at the revrec allocation (positive)." }
                deferred: { type: string, description: "The part of allocated debited to 2400 deferred revenue (positive, at most allocated)." }
