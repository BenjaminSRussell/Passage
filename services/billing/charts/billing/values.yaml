image:
  repository: ghcr.io/benjaminsrussell/billing
  # Prefer digest pinning from Argo CD; when set it takes precedence over tag.
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
# DATABASE_URL is read from this secret, never from values.
databaseSecret: billing-db
migrateOnStart: false
replicaCount: 2
service:
  port: 8080
  adminPort: 9090
maxLines: 2000
# Interim tax rates per tax code ("DE19=19,DE7=7,EXEMPT=0") until the wave-13 tax
# client is wired. Empty means every quote fails closed with BIL-0001.
taxRates: ""
# Callers (edi reads invoices) present a signed service token verified against these
# keys, formatted name=base64-public-key and comma separated.
serviceIdentity:
  publicKeys: ""
  signingKeySecret: ""
  keyId: ""
# Unset, the journal postings answer 503 BIL-0200. When set, glProfiles (rendered as
# BILLING_GL_PROFILES) lists per legal entity: legalEntityId, ledgerId, receivableAccount,
# taxAccount, chargeAccount, deferredRevenueAccounts and contractAssetAccount (1250 Contract
# Asset when omitted; open it in the ledger chart next to 2400 Contract Liability).
ledgerUrl: ""
glProfiles: []
# With tenantIds set (and ledgerUrl), a worker books the journal of posted invoices and credit notes of every
# legal entity in glProfiles whose profile has that tenantId, each interval; unset, bookings wait for POST /v1/billing/gl-postings.
autoBook:
  tenantIds: []
  interval: 1m
# Revrec reads the allocation of a contract (REVREC_URL). Required when ledgerUrl is set (the
# chart and the service refuse to start without it): an order invoice is never booked at its
# billed amounts, it backs off with BIL-0207 until revrec answers with the order's contract.
revrecUrl: ""
# With salesUrl set (needs serviceIdentity.signingKeySecret; sales must list billing's public key) every replica runs a
# reporter that sends posted invoices to sales' :record-progress (SALES_URL, BILLING_SALES_REPORT_INTERVAL). Unset, reports wait.
salesUrl: ""
salesReportInterval: "30s"
# With taxUrl set (needs serviceIdentity.signingKeySecret; tax must list billing's public key) every replica runs a reporter
# that records booked invoices and credit notes with the tax service (TAX_URL, BILLING_TAX_REPORT_INTERVAL). Unset, reports wait.
taxUrl: ""
taxReportInterval: "30s"
# With tenantIds set, every replica runs the subscription billing job (BILLING_SUBSCRIPTION_JOB_*): it creates the invoice
# proposal of every period due for the tenants' legal entities; posting stays with the billing workspace. It ticks every
# interval, or once a day at `at` (UTC, "03:00") when that is set; set one of the two. A period is invoiced once, so several
# replicas running together are safe.
subscriptionJob:
  tenantIds: []
  interval: 1h
  at: ""
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }
serviceMonitor:
  enabled: false
  interval: 30s
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
