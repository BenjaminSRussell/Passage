{{- if .Values.consumer.enabled }}
# The intercompany charge consumer (#40, args [consume]): raises the lender's FREE_TEXT invoice proposal of every
# chargeinvoice.requested intercompany publishes in Invoice settlement mode. It starts only while service:billing-iccharge is
# seeded in the service principal table. Kafka user and ACLs: deploy/kafka/billing-consumer.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-consumer
  labels:
    app.kubernetes.io/name: billing
    app.kubernetes.io/component: consumer
spec:
  replicas: {{ .Values.consumer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: billing
      app.kubernetes.io/component: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing
        app.kubernetes.io/component: consumer
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: kafka
          secret:
            secretName: {{ required "consumer.kafka.secret is required" .Values.consumer.kafka.secret }}
            defaultMode: 0440
      containers:
        - name: billing-consumer
          {{- if .Values.image.digest }}
          image: "{{ (include "passage.imageRepository" $) }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ (include "passage.imageRepository" $) }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [consume]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: admin
              containerPort: 9090
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: ADMIN_ADDR
              value: ":9090"
            - name: BILLING_TAX_RATES
              value: {{ .Values.taxRates | quote }}
            - name: BILLING_IC_REVENUE_ACCOUNT
              value: {{ required "consumer.icCharge.revenueAccount is required with the consumer" .Values.consumer.icCharge.revenueAccount | quote }}
            - name: BILLING_IC_TAX_CODE
              value: {{ .Values.consumer.icCharge.taxCode | quote }}
            - name: BILLING_IC_PAYMENT_TERM_DAYS
              value: {{ .Values.consumer.icCharge.paymentTermDays | quote }}
            - name: KAFKA_BROKERS
              value: {{ required "consumer.kafka.brokers is required" .Values.consumer.kafka.brokers | quote }}
            - name: KAFKA_GROUP
              value: {{ .Values.consumer.kafka.group | quote }}
            - name: KAFKA_USERNAME
              value: {{ .Values.consumer.kafka.username | quote }}
            - name: KAFKA_PASSWORD_FILE
              value: /var/run/passage/kafka/password
            - name: KAFKA_TLS_CA_FILE
              value: /var/run/passage/kafka/ca.crt
          volumeMounts:
            - { name: kafka, mountPath: /var/run/passage/kafka, readOnly: true }
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.consumer.resources | nindent 12 }}
{{- end }}
