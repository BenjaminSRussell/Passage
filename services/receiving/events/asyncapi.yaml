asyncapi: 3.0.0
info:
  title: Passage Receiving Events
  version: 1.0.0
  description: |
    CloudEvents 1.0 published through the transactional outbox (Debezium relays
    rows to Kafka). Each event is written in the same database transaction as the
    state change it announces, so a rolled-back change emits nothing. Types follow
    dev.passage.<context>.<entity>.<verb>.v<n>. Additive-only schema evolution.
    The invoice event uses the payables context named by the PRD (3.18.5) although
    the receiving service posts the invoice today.
defaultContentType: application/cloudevents+json
channels:
  receiptEvents:
    address: passage.receiving.receipt
    messages:
      receiptPosted:
        $ref: "#/components/messages/ReceiptPosted"
      receiptCorrected:
        $ref: "#/components/messages/ReceiptCorrected"
  invoiceEvents:
    address: passage.payables.invoice
    messages:
      invoicePosted:
        $ref: "#/components/messages/InvoicePosted"
      invoiceAdjusted:
        $ref: "#/components/messages/InvoiceAdjusted"
      invoiceSampled:
        $ref: "#/components/messages/InvoiceSampled"
      invoiceRejected:
        $ref: "#/components/messages/InvoiceRejected"
  policyEvents:
    address: passage.receiving.policy
    messages:
      auditPolicyChanged:
        $ref: "#/components/messages/AuditPolicyChanged"
      ersVendorChanged:
        $ref: "#/components/messages/ErsVendorChanged"
      ersPriceConfirmed:
        $ref: "#/components/messages/ErsPriceConfirmed"
  serviceEntryEvents:
    address: passage.receiving.serviceentrysheet
    messages:
      serviceSheetDecided:
        $ref: "#/components/messages/ServiceSheetDecided"
  settlementEvents:
    address: passage.payables.settlement
    messages:
      settlementPosted:
        $ref: "#/components/messages/SettlementPosted"
operations:
  publishReceiptPosted:
    action: send
    channel: { $ref: "#/channels/receiptEvents" }
    messages:
      - { $ref: "#/channels/receiptEvents/messages/receiptPosted" }
  publishReceiptCorrected:
    action: send
    channel: { $ref: "#/channels/receiptEvents" }
    messages:
      - { $ref: "#/channels/receiptEvents/messages/receiptCorrected" }
  publishInvoicePosted:
    action: send
    channel: { $ref: "#/channels/invoiceEvents" }
    messages:
      - { $ref: "#/channels/invoiceEvents/messages/invoicePosted" }
  publishInvoiceAdjusted:
    action: send
    channel: { $ref: "#/channels/invoiceEvents" }
    messages:
      - { $ref: "#/channels/invoiceEvents/messages/invoiceAdjusted" }
  publishInvoiceSampled:
    action: send
    channel: { $ref: "#/channels/invoiceEvents" }
    messages:
      - { $ref: "#/channels/invoiceEvents/messages/invoiceSampled" }
  publishInvoiceRejected:
    action: send
    channel: { $ref: "#/channels/invoiceEvents" }
    messages:
      - { $ref: "#/channels/invoiceEvents/messages/invoiceRejected" }
  publishAuditPolicyChanged:
    action: send
    channel: { $ref: "#/channels/policyEvents" }
    messages:
      - { $ref: "#/channels/policyEvents/messages/auditPolicyChanged" }
  publishErsVendorChanged:
    action: send
    channel: { $ref: "#/channels/policyEvents" }
    messages:
      - { $ref: "#/channels/policyEvents/messages/ersVendorChanged" }
  publishErsPriceConfirmed:
    action: send
    channel: { $ref: "#/channels/policyEvents" }
    messages:
      - { $ref: "#/channels/policyEvents/messages/ersPriceConfirmed" }
  publishServiceSheetDecided:
    action: send
    channel: { $ref: "#/channels/serviceEntryEvents" }
    messages:
      - { $ref: "#/channels/serviceEntryEvents/messages/serviceSheetDecided" }
  publishSettlementPosted:
    action: send
    channel: { $ref: "#/channels/settlementEvents" }
    messages:
      - { $ref: "#/channels/settlementEvents/messages/settlementPosted" }
components:
  messages:
    ReceiptPosted:
      name: dev.passage.receiving.receipt.posted.v1
      summary: >-
        POST /v1/receiving/receipts/{id}:post moved a receipt to POSTED, posted Dr inventory / Cr GR/IR to the ledger and
        opened one GR/IR item per line. Consumers: inventory, payables (re-match, ERS), costing, supplier portal.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ReceiptPostedData"
    ReceiptCorrected:
      name: dev.passage.receiving.receipt.corrected.v1
      summary: >-
        A POSTED receipt was corrected by a quantity delta (kind CORRECTION) or fully reversed (kind CANCELLATION).
        Cancelling an ARRIVED or REGISTERED receipt posts nothing and emits nothing. Consumers: payables, costing.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ReceiptCorrectedData"
    InvoicePosted:
      name: dev.passage.payables.invoice.posted.v1
      summary: >-
        POST /v1/receiving/invoices:post or POST /v1/receiving/ers-settlements:run (source ERS) posted a vendor invoice
        against GR/IR items and persisted it, or POST /v1/receiving/invoices/{id}:release-audit-block released an invoice the
        stochastic audit block had held and posted it to the ledger. Consumers: ledger reconciliation, costing, tax,
        analytics.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/InvoicePostedData"
    InvoiceAdjusted:
      name: dev.passage.payables.invoice.adjusted.v1
      summary: >-
        POST /v1/receiving/invoice-adjustments:post posted a subsequent debit (the vendor charges more) or a credit note
        (the vendor charges less) against a posted vendor invoice. The adjustment changes value only: GR/IR items and
        quantities are untouched. Consumers: payables, costing, tax, analytics.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/InvoiceAdjustedData"
    InvoiceSampled:
      name: dev.passage.payables.invoice.sampled.v1
      summary: >-
        The stochastic audit block selected an invoice (manual or ERS) at posting. GR/IR quantity is reserved but nothing is
        posted to the ledger until POST /v1/receiving/invoices/{id}:release-audit-block; the invoice.posted event follows
        then. Consumers: workflow, notifications, audit.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/InvoiceSampledData"
    InvoiceRejected:
      name: dev.passage.payables.invoice.rejected.v1
      summary: >-
        An auditor rejected an invoice held by the stochastic audit block (POST /v1/receiving/invoices/{id}:reject-audit-block).
        Nothing was posted to the ledger and the reserved GR/IR quantity is free again. Consumers: workflow, notifications, audit.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/InvoiceRejectedData"
    AuditPolicyChanged:
      name: dev.passage.receiving.auditpolicy.changed.v1
      summary: 'PUT /v1/receiving/audit-policy changed the stochastic audit sample rate of a legal entity. Consumers: audit.'
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/AuditPolicyChangedData"
    ErsVendorChanged:
      name: dev.passage.receiving.ersvendor.changed.v1
      summary: 'PUT /v1/receiving/ers-vendors/{vendorId} turned evaluated receipt settlement on or off for a vendor. Consumers: audit.'
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ErsVendorChangedData"
    ErsPriceConfirmed:
      name: dev.passage.receiving.erspriceconfirmation.confirmed.v1
      summary: 'A buyer confirmed the PO price an ERS run may settle a receipt line at (BR-18.9). Consumers: audit.'
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ErsPriceConfirmedData"
    ServiceSheetDecided:
      name: dev.passage.receiving.serviceentrysheet.decided.v1
      summary: >-
        POST /v1/receiving/service-entry-sheets/{id}:accept or :reject decided a service entry sheet. ACCEPTED sheets are the
        acceptance of the service performed against purchase order lines; no GR/IR item or ledger entry follows yet.
        Consumers: audit, purchasing.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ServiceSheetDecidedData"
    SettlementPosted:
      name: dev.passage.payables.settlement.posted.v1
      summary: >-
        An invoicing plan row (kind PLAN_ROW, Dr GR/IR / Cr vendor control) or a consumed consignment journal (kind
        CONSIGNMENT, Dr consignment accrual / Cr vendor control) was settled by POST /v1/receiving/plan-settlements:run or
        /v1/receiving/consignment-settlements:run. Emitted once per source. Consumers: payables, treasury, analytics.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/SettlementPostedData"
  schemas:
    ReceiptPostedData:
      type: object
      required: [receipt_id, receipt_number, po_id, legal_entity_id, vendor_id, posting_date, currency, ledger_entry_id, lines]
      properties:
        receipt_id: { type: string, format: uuid }
        receipt_number: { type: string, pattern: "^RCV-\\d{8}$" }
        po_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        posting_date: { type: string, format: date }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        ledger_entry_id: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [line_no, po_line_id, product_id, unit, qty, batch, serials, location_id, inventory_status, amount, amount_acct]
            properties:
              line_no: { type: integer, minimum: 1 }
              po_line_id: { type: string }
              po_line_no: { type: integer, minimum: 1, description: "Purchase order line number; omitted when the receipt line was keyed without one" }
              product_id: { type: string, format: uuid }
              unit: { type: string }
              qty: { type: string, description: "decimal string" }
              batch: { type: string }
              serials: { type: array, items: { type: string } }
              location_id: { type: string }
              inventory_status: { type: string, enum: [AVAILABLE, QUARANTINE, BLOCKED] }
              amount: { type: string, description: "decimal string, receipt currency" }
              amount_acct: { type: string, description: "decimal string, accounting currency (amount times the receipt exchange rate)" }
    ReceiptCorrectedData:
      type: object
      required: [receipt_id, receipt_number, kind, correction_seq, ledger_entry_id, currency, lines]
      properties:
        receipt_id: { type: string, format: uuid }
        receipt_number: { type: string }
        kind: { type: string, enum: [CORRECTION, CANCELLATION] }
        correction_seq: { type: integer, minimum: 0, description: "1-based sequence of the correction; the count so far on a cancellation" }
        ledger_entry_id: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        lines:
          type: array
          items:
            type: object
            required: [line_no, po_line_id, product_id, qty_delta, amount_delta, amount_acct_delta]
            properties:
              line_no: { type: integer, minimum: 1 }
              po_line_id: { type: string }
              product_id: { type: string, format: uuid }
              qty_delta: { type: string, description: "decimal string, negative when the received quantity falls" }
              amount_delta: { type: string, description: "decimal string, receipt currency" }
              amount_acct_delta: { type: string, description: "decimal string, accounting currency" }
    InvoicePostedData:
      type: object
      required: [invoice_id, legal_entity_id, vendor_id, invoice_number, source, invoice_date, posting_date, currency, total, ledger_entry_id, lines]
      properties:
        invoice_id: { type: string, format: uuid, description: "derived from tenant, vendor and invoice number; stable across retries" }
        one_time_payee_id: { type: string, format: uuid, description: "present when the invoice names a one-time payee (FR-18.19); the payee's data is never in an event" }
        source: { type: string, enum: [MANUAL, ERS] }
        legal_entity_id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        vendor_group_id: { type: string, format: uuid, description: "the vendor's group from the party vendor master; omitted when party is unreachable, refuses the lookup or does not know the vendor, because AP posting does not depend on party availability" }
        vendor_group_code: { type: string, pattern: '^[A-Z0-9_-]{1,10}$', description: "the short code of the vendor group (party vendor group, issue #421); also posted as the VENDGRP dimension of the vendor-control credit line on a ledger that defines VENDGRP (an optional dimension, dropped by a ledger without it). Omitted when the lookup fails or the group has no registered code." }
        invoice_number: { type: string }
        invoice_date: { type: string, format: date }
        posting_date: { type: string, format: date }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        total: { type: string, description: "decimal string; the vendor control credit" }
        ledger_entry_id: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [line_no, receipt_id, receipt_line_no, qty, unit_price, amount, grir_cleared_amount]
            properties:
              line_no: { type: integer, minimum: 1 }
              receipt_id: { type: string, format: uuid }
              receipt_line_no: { type: integer, minimum: 1 }
              qty: { type: string }
              unit_price: { type: string }
              amount: { type: string }
              grir_cleared_amount: { type: string, description: "decimal string; the GR/IR amount this line cleared (pro rata, the exact remainder on the last quantity)" }
    InvoiceSampledData:
      type: object
      required: [invoice_id, legal_entity_id, vendor_id, invoice_number, source, currency, total, sample_rate_pct, rule_version, reason]
      properties:
        invoice_id: { type: string, format: uuid }
        one_time_payee_id: { type: string, format: uuid, description: "present when the invoice names a one-time payee" }
        legal_entity_id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        invoice_number: { type: string }
        source: { type: string, enum: [MANUAL, ERS] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        total: { type: string, description: "decimal string; the vendor control credit that will post on release" }
        sample_rate_pct: { type: string, description: "decimal string, 0 to 100; the legal entity's sample rate when the draw was made" }
        rule_version: { type: integer, minimum: 0, description: "version of the legal entity's audit policy (rate and threshold) the draw used; the decision is recorded with it and never re-drawn" }
        reason: { type: string, enum: ["stochastic sample", "re-issue after audit rejection"], description: "why the invoice was held; a re-issue of a rejected ERS invoice is always held" }
    InvoiceRejectedData:
      type: object
      required: [invoice_id, legal_entity_id, vendor_id, invoice_number, source, currency, total, reason, rejected_by]
      properties:
        invoice_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        invoice_number: { type: string }
        source: { type: string, enum: [MANUAL, ERS] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        total: { type: string }
        reason: { type: string, description: "the auditor's reason, 1 to 500 characters" }
        rejected_by: { type: string }
    AuditPolicyChangedData:
      type: object
      required: [legal_entity_id, old_rate_pct, new_rate_pct, rule_version, changed_by]
      properties:
        legal_entity_id: { type: string, format: uuid }
        old_rate_pct: { type: string, description: decimal string, 0 to 100 }
        new_rate_pct: { type: string, description: decimal string, 0 to 100 }
        threshold_amount: { type: string, description: "decimal string; present when amount weighting is on (BR-18.14)" }
        threshold_currency: { type: string, pattern: "^[A-Z]{3}$" }
        rule_version: { type: integer, minimum: 1, description: "policy version after this change; bumped whenever the rate or threshold changes" }
        changed_by: { type: string }
    ErsPriceConfirmedData:
      type: object
      required: [receipt_id, line_no, legal_entity_id, new_price, confirmed_by]
      properties:
        receipt_id: { type: string, format: uuid }
        line_no: { type: integer, minimum: 1 }
        legal_entity_id: { type: string, format: uuid }
        old_price: { type: string, description: "decimal string; omitted on the first confirmation" }
        new_price: { type: string, description: "decimal string, the confirmed unit price" }
        confirmed_by: { type: string }
    ServiceSheetDecidedData:
      type: object
      required: [sheet_id, legal_entity_id, vendor_id, purchase_order_id, currency, total, decision, decided_by, lines]
      properties:
        sheet_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        purchase_order_id: { type: string, format: uuid }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        total: { type: string, description: "decimal string, the sum of the line amounts" }
        decision: { type: string, enum: [ACCEPTED, REJECTED] }
        decided_by: { type: string }
        reason: { type: string, description: "the rejection reason; omitted when accepted" }
        lines:
          type: array
          items:
            type: object
            required: [po_line_no, qty, amount]
            properties:
              po_line_no: { type: integer, minimum: 1 }
              qty: { type: string }
              amount: { type: string }
    ErsVendorChangedData:
      type: object
      required: [legal_entity_id, vendor_id, old_enabled, new_enabled, changed_by]
      properties:
        legal_entity_id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        old_enabled: { type: boolean }
        new_enabled: { type: boolean }
        changed_by: { type: string }
    InvoiceAdjustedData:
      type: object
      required: [adjustment_id, original_invoice_id, kind, legal_entity_id, vendor_id, document_number, document_date, posting_date, currency, total, ledger_entry_id, lines]
      properties:
        adjustment_id: { type: string, format: uuid, description: "derived from tenant, original invoice and document number; stable across retries" }
        original_invoice_id: { type: string, format: uuid }
        kind: { type: string, enum: [CREDIT, DEBIT] }
        legal_entity_id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        document_number: { type: string, description: "the vendor's credit note or debit note number" }
        document_date: { type: string, format: date }
        posting_date: { type: string, format: date }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        total: { type: string, description: "decimal string; the vendor control movement, always positive" }
        ledger_entry_id: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [line_no, invoice_line_no, amount]
            properties:
              line_no: { type: integer, minimum: 1 }
              invoice_line_no: { type: integer, minimum: 1, description: "the line of the original invoice this adjustment changes" }
              amount: { type: string, description: "decimal string, positive; the kind says whether it adds or removes value" }
    SettlementPostedData:
      type: object
      required: [settlement_id, kind, source_ref, legal_entity_id, vendor_id, posting_date, currency, amount, ledger_entry_id]
      properties:
        settlement_id: { type: string, format: uuid, description: "derived from tenant, kind and source; stable across retries" }
        kind: { type: string, enum: [PLAN_ROW, CONSIGNMENT] }
        source_ref: { type: string, description: "<purchase order id>/<line no>/<row seq> for PLAN_ROW; the inventory OWNERSHIP_CHANGE journal id for CONSIGNMENT" }
        legal_entity_id: { type: string, format: uuid }
        vendor_id: { type: string, description: "the purchase order's vendor (uuid) for PLAN_ROW; the inventory owner dimension for CONSIGNMENT" }
        posting_date: { type: string, format: date }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        amount: { type: string, description: "decimal string, positive; the vendor control credit" }
        ledger_entry_id: { type: string }
