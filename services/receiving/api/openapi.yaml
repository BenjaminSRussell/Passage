openapi: 3.1.0
info:
  title: receiving
  version: 0.1.0
  description: Receiving, product receipts, GR/IR and vendor invoice posting, and the pure matching policy tester.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/receiving/matching:evaluate:
    post:
      operationId: evaluateMatching
      x-passage-duty: MatchingPolicyMaintain
      description: Pure policy tester. Evaluates an invoice against a matching policy without persisting anything; the Idempotency-Key header is accepted and has no effect because evaluation is side-effect free.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateRequest' }
      responses:
        '200':
          description: Match result per line and for the header, with the postings an accepted invoice would create.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvaluateResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003: duty missing, or the purchase order is outside the caller access.' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-004: unknown purchase order.' }
        '422': { $ref: '#/components/responses/Problem', description: 'RCV-PO-001: purchase order not APPROVED or CONFIRMED; RCV-PO-002: purchase order line cancelled.' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem', description: 'COM-0503: purchase order lookup not configured or unavailable.' }
  /v1/receiving/arrivals:
    post:
      operationId: createArrival
      x-passage-duty: ReceivingMaintain
      description: Records a vendor delivery at the dock in state ARRIVED. PO line facts come in the body. A repeated Idempotency-Key with the same body replays the stored response.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArrivalRequest' }
      responses:
        '201':
          description: Receipt in state ARRIVED.
          headers:
            Location: { schema: { type: string }, description: '/v1/receiving/receipts/{id}' }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present on replays only. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001 validation, with errors naming each field.' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-DUP-001 packing slip already used for the vendor; COM-0410 key in flight (Retry-After: 1).' }
        '422': { $ref: '#/components/responses/Problem', description: 'COM-0409 idempotency key reused with a different request.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/receipts:
    post:
      operationId: createReceipt
      x-passage-duty: ReceivingMaintain
      description: Direct receipt. Creates the receipt and registers it in one transaction (state REGISTERED, version 2) without a prior arrival.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DirectReceiptRequest' }
      responses:
        '201':
          description: Receipt in state REGISTERED.
          headers:
            Location: { schema: { type: string }, description: '/v1/receiving/receipts/{id}' }
            ETag: { schema: { type: string }, description: Row version in quotes. }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present on replays only. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001 validation, with errors naming each field.' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-DUP-001 packing slip already used; COM-0410 key in flight.' }
        '422': { $ref: '#/components/responses/Problem', description: 'RCV-OVR-001 over-delivery; INV-SER-001 serial already recorded; RCV-VAL-001 tracking rule; COM-0409 key reused with a different request.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
    get:
      operationId: listReceipts
      x-passage-duty: ReceivingMaintain
      description: Receipts newest first. Lines are omitted from list items; fetch one receipt for its lines. Page with nextCursor.
      parameters:
        - { name: vendorId, in: query, schema: { type: string, format: uuid } }
        - { name: purchaseOrderId, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: string, enum: [ARRIVED, REGISTERED, POSTED, CANCELLED] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of receipts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptPage' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/receipts/{id}:
    get:
      operationId: getReceipt
      x-passage-duty: ReceivingMaintain
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
      responses:
        '200':
          description: The receipt with its lines.
          headers:
            ETag: { schema: { type: string }, description: Row version in quotes; send it back in If-Match. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-001' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/receipts/{id}:register:
    post:
      operationId: registerReceipt
      x-passage-duty: ReceivingMaintain
      description: Registers an ARRIVED receipt with received quantities, batch, serials and location. Needs If-Match.
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200': { $ref: '#/components/responses/ReceiptChanged' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-001' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-STA-001 receipt is not ARRIVED; COM-0410 key in flight.' }
        '412': { $ref: '#/components/responses/Problem', description: 'COM-0412 If-Match differs from the current version.' }
        '422': { $ref: '#/components/responses/Problem', description: 'RCV-OVR-001, INV-SER-001, RCV-VAL-001, COM-0409.' }
        '428': { $ref: '#/components/responses/Problem', description: 'COM-0428 If-Match missing.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/receipts/{id}:post:
    post:
      operationId: postReceipt
      x-passage-duty: ReceivingPost
      description: Posts a REGISTERED receipt (Dr inventory, Cr GR/IR through the ledger, idempotency key = receipt id), opens one GR/IR item per line and writes dev.passage.receiving.receipt.posted.v1 to the outbox in the same transaction. No body.
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/ReceiptChanged' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-001' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-STA-001 receipt is not REGISTERED; RCV-IDM-001 an earlier ledger posting touching the receipt is unfinished or differs (errors.pendingKey and errors.createdAt name it); COM-0410.' }
        '412': { $ref: '#/components/responses/Problem', description: 'COM-0412' }
        '422': { $ref: '#/components/responses/Problem', description: 'PER-AP-001 ledger period closed; COM-0409.' }
        '428': { $ref: '#/components/responses/Problem', description: 'COM-0428' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/receipts/{id}:correct:
    post:
      operationId: correctReceipt
      x-passage-duty: ReceivingPost
      description: Delta quantity correction of a POSTED receipt (FR-18.3). A line cannot go below its invoiced quantity or to zero (cancel instead), serial-tracked lines are refused. The receipt stays POSTED and its row version and correction sequence advance; dev.passage.receiving.receipt.corrected.v1 is written to the outbox.
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectRequest' }
      responses:
        '200': { $ref: '#/components/responses/ReceiptChanged' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-001' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-STA-001 receipt not POSTED; RCV-COR-001 correction below the invoiced quantity; RCV-IDM-001 an earlier ledger posting touching the receipt is unfinished or differs (errors.pendingKey and errors.createdAt name it); COM-0410.' }
        '412': { $ref: '#/components/responses/Problem', description: 'COM-0412' }
        '422': { $ref: '#/components/responses/Problem', description: 'RCV-VAL-001, RCV-OVR-001, PER-AP-001, COM-0409.' }
        '428': { $ref: '#/components/responses/Problem', description: 'COM-0428' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/receipts/{id}:cancel:
    post:
      operationId: cancelReceipt
      x-passage-duty: ReceivingPost
      description: Cancels an ARRIVED, REGISTERED or POSTED receipt. A POSTED receipt is fully reversed in the ledger and its GR/IR items close at zero, and is refused once any line is invoiced. Serials recorded by a registered receipt are released. The optional body carries postingDate.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                postingDate: { type: string, format: date, description: Ledger posting date; defaults to the receipt date and may not precede it. }
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/ReceiptChanged' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-001' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-STA-001 already cancelled or has invoiced quantity; RCV-IDM-001 an earlier ledger posting touching the receipt is unfinished or differs (errors.pendingKey and errors.createdAt name it); COM-0410.' }
        '412': { $ref: '#/components/responses/Problem', description: 'COM-0412' }
        '422': { $ref: '#/components/responses/Problem', description: 'PER-AP-001, RCV-VAL-001 posting date before the receipt date, COM-0409.' }
        '428': { $ref: '#/components/responses/Problem', description: 'COM-0428' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/grir:
    get:
      operationId: listGrir
      x-passage-duty: APInquire
      description: GR/IR open items newest first with per-currency open totals over the whole filter (not just the page).
      parameters:
        - { name: vendorId, in: query, schema: { type: string, format: uuid } }
        - { name: purchaseOrderId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, PARTIAL, CLEARED, WRITTEN_OFF] } }
        - { name: ageGt, in: query, schema: { type: integer, minimum: 0, maximum: 3650 }, description: Only items older than this many days. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of open items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrirPage' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/invoices:post:
    post:
      operationId: postVendorInvoice
      x-passage-duty: VendorInvoicePost
      description: Posts a vendor invoice against GR/IR items. Checks the AP period, clears GR/IR pro rata (the last quantity clears the exact remainder), posts to the ledger, persists the invoice and writes dev.passage.payables.invoice.posted.v1 to the outbox. The invoice id derives from tenant, vendor and invoice number, so the ledger idempotency key is stable across retries.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceRequest' }
      responses:
        '201':
          description: Posted invoice.
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present on replays only. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-002 receipt line has no open GR/IR item.' }
        '409': { $ref: '#/components/responses/Problem', description: 'AP-DUP-001 invoice number already posted for the vendor; RCV-IDM-001 an earlier posting for this invoice is unfinished or differs; COM-0410.' }
        '422': { $ref: '#/components/responses/Problem', description: 'PER-AP-001 closed AP period; AP-QTY-001 more than received and uninvoiced; RCV-VAL-001 other vendor or entity; COM-0409.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/pending-postings:
    get:
      operationId: listPendingPostings
      x-passage-duty: ReceivingAdmin
      description: Ledger postings this service recorded before calling the ledger and has not seen complete (oldest first, at most 200). A row stays open when the ledger call ended in an unknown outcome (timeout, transport error, 5xx) or the local commit failed after the ledger accepted the entry.
      responses:
        '200':
          description: Open pending postings.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, subjects, createdAt, ageSeconds]
                      properties:
                        key: { type: string }
                        subjects: { type: array, items: { type: string }, description: Receipt ids and, for an invoice posting, the invoice id. }
                        createdAt: { type: string, format: date-time }
                        ageSeconds: { type: integer }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/pending-postings/{key}/resolve:
    post:
      operationId: resolvePendingPosting
      x-passage-duty: ReceivingAdmin
      description: Re-sends the stored journal to the ledger under its key. When the ledger returns an entry id (it had it, or accepts it now) that entry is reversed and the row is marked REVERSED, which frees the receipt and invoice it blocked; the user then repeats the command, which posts under a new ledger key generation. A definite ledger rejection marks the row REJECTED. Colons in the key may be sent as they are or percent-encoded.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Outcome REVERSED (with the reversed ledger entry id) or REJECTED.
          content:
            application/json:
              schema:
                type: object
                required: [key, outcome]
                properties:
                  key: { type: string }
                  outcome: { type: string, enum: [REVERSED, REJECTED] }
                  ledgerEntryId: { type: string }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-003' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-STA-001 already finished; RCV-IDM-001 the ledger holds a different entry under the key, another resolve holds the posting, or the posting is younger than 33 s and its command may still be running.' }
        '422': { $ref: '#/components/responses/Problem', description: 'PER-AP-001 the ledger period of the entry is closed; RCV-LDG-001 the ledger refused the reversal. Not retryable.' }
        '503': { $ref: '#/components/responses/Problem', description: 'COM-0503 the ledger could not be reached or the reversal failed; try again.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /healthz:
    get:
      operationId: liveness
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable or slower than 500 ms. }
  /metrics:
    get:
      operationId: metrics
      x-passage-duty: public
      description: Served on the admin port only.
      responses:
        '200': { description: Prometheus text format. }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The receipt row version from the last response (body version or ETag), quoted or bare.
      schema: { type: string }
    ReceiptId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ReceiptChanged:
      description: The receipt after the change; ETag carries the new row version.
      headers:
        ETag: { schema: { type: string } }
        Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present on replays only. }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Receipt' }
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: 'Stable code such as COM-0001, AUTH-0001, AUTH-0003.' }
        serviceCode: { type: string, description: 'Not emitted yet: platform/go/httpx.Problem has no such field.' }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, description: Decimal string at the currency minor unit. }
        currency: { type: string, minLength: 3, maxLength: 3 }
    Policy:
      type: object
      additionalProperties: false
      properties:
        matchLevel: { type: string, enum: [NONE, TWO_WAY, THREE_WAY], default: THREE_WAY }
        priceTolPct: { type: [number, string], minimum: 0, default: 2.0 }
        priceTolAbs: { type: [number, string], minimum: 0, default: 25.00 }
        qtyTolPct: { type: [number, string], minimum: 0, default: 5.0 }
        totalTolPct: { type: [number, string], minimum: 0, default: 1.0 }
        totalTolAbs: { type: [number, string], minimum: 0, default: 50.00 }
        smallDiffAbs: { type: [number, string], minimum: 0, default: 0.50 }
        priceTolMode: { type: string, enum: [UPPER_ONLY, BOTH], default: UPPER_ONLY }
    Line:
      type: object
      additionalProperties: false
      required: [qty, unitPrice]
      description: poUnitPrice is required unless poLineNo is given with a request-level purchaseOrderId; a body value always wins over the purchase order.
      properties:
        poLineNo: { type: integer, minimum: 1, description: 'Line of the request purchaseOrderId. Fills poUnitPrice (net of discount, per price unit), poQtyRemaining and poCurrency when absent.' }
        qty: { type: [number, string], exclusiveMinimum: 0 }
        unit: { type: string, description: 'Unit of measure, echoed in the response.' }
        unitPrice: { type: [number, string], minimum: 0 }
        poUnitPrice: { type: [number, string], minimum: 0 }
        poCurrency: { type: string, description: Absent means the invoice currency; a different value yields PRICE_VARIANCE with currencyMismatch. }
        receiptState: { type: string, enum: [REGISTERED, POSTED], description: Absent means no receipt exists. }
        receivedUninvoicedQty: { type: [number, string], minimum: 0, default: 0 }
        poQtyRemaining: { type: [number, string], minimum: 0, default: 0 }
    EvaluateRequest:
      type: object
      additionalProperties: false
      required: [currency, headerTotal, lines]
      properties:
        purchaseOrderId: { type: string, format: uuid, description: 'Purchase order in services/purchasing that lines naming poLineNo are read from, with the caller identity.' }
        policy: { $ref: '#/components/schemas/Policy' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        headerTotal: { type: [number, string] }
        charges: { type: [number, string], minimum: 0, default: 0 }
        tax: { type: [number, string], minimum: 0, default: 0 }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/Line' }
    ArrivalLine:
      type: object
      additionalProperties: false
      required: [poLineId, productId, orderedRemaining, unitPrice, unit]
      properties:
        poLineId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        orderedRemaining: { type: [number, string], exclusiveMinimum: 0 }
        overDeliveryPct: { type: [number, string], minimum: 0, maximum: 100, default: 0 }
        unitPrice: { type: [number, string], minimum: 0 }
        unit: { type: string, minLength: 1, maxLength: 16 }
