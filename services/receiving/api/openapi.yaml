openapi: 3.1.0
info:
  title: receiving
  version: 0.1.0
  description: Receiving, product receipts, GR/IR, vendor invoice posting, subsequent debits and credits, invoicing plan and consignment settlement, and the pure matching policy tester.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/receiving/matching:evaluate:
    post:
      operationId: evaluateMatching
      x-passage-duty: receiving.matching-policy.maintain
      description: Pure policy tester. Evaluates an invoice against a matching policy without persisting anything; the Idempotency-Key header is accepted and has no effect because evaluation is side-effect free.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateRequest' }
      responses:
        '200':
          description: Match result per line and for the header, with the postings an accepted invoice would create.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvaluateResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003: duty missing, or the purchase order is outside the caller access.' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-004: unknown purchase order.' }
        '422': { $ref: '#/components/responses/Problem', description: 'RCV-PO-001: purchase order not APPROVED or CONFIRMED; RCV-PO-002: purchase order line cancelled.' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem', description: 'COM-0503: purchase order lookup not configured or unavailable.' }
  /v1/receiving/arrivals:
    post:
      operationId: createArrival
      x-passage-duty: receiving.receipt.maintain
      description: Records a vendor delivery at the dock in state ARRIVED. PO line facts come in the body. A repeated Idempotency-Key with the same body replays the stored response.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArrivalRequest' }
      responses:
        '201':
          description: Receipt in state ARRIVED.
          headers:
            Location: { schema: { type: string }, description: '/v1/receiving/receipts/{id}' }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present on replays only. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001 validation, with errors naming each field.' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-DUP-001 packing slip already used for the vendor; COM-0410 key in flight (Retry-After: 1).' }
        '422': { $ref: '#/components/responses/Problem', description: 'COM-0409 idempotency key reused with a different request.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/receipts:
    post:
      operationId: createReceipt
      x-passage-duty: receiving.receipt.maintain
      description: Direct receipt. Creates the receipt and registers it in one transaction (state REGISTERED, version 2) without a prior arrival.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DirectReceiptRequest' }
      responses:
        '201':
          description: Receipt in state REGISTERED.
          headers:
            Location: { schema: { type: string }, description: '/v1/receiving/receipts/{id}' }
            ETag: { schema: { type: string }, description: Row version in quotes. }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present on replays only. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001 validation, with errors naming each field.' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-DUP-001 packing slip already used; COM-0410 key in flight.' }
        '422': { $ref: '#/components/responses/Problem', description: 'RCV-OVR-001 over-delivery; INV-SER-001 serial already recorded; RCV-VAL-001 tracking rule; RCV-CW-001 catch-weight outside min/max × cases; COM-0409 key reused with a different request.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
    get:
      operationId: listReceipts
      x-passage-duty: receiving.receipt.maintain
      description: Receipts newest first. Lines are omitted from list items; fetch one receipt for its lines. Page with nextCursor.
      parameters:
        - { name: vendorId, in: query, schema: { type: string, format: uuid } }
        - { name: purchaseOrderId, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: string, enum: [ARRIVED, REGISTERED, POSTED, CANCELLED] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of receipts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptPage' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/receipts/{id}:
    get:
      operationId: getReceipt
      summary: Read one goods receipt
      x-passage-duty: receiving.receipt.maintain
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
      responses:
        '200':
          description: The receipt with its lines.
          headers:
            ETag: { schema: { type: string }, description: Row version in quotes; send it back in If-Match. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-001' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/receipts/{id}:register:
    post:
      operationId: registerReceipt
      x-passage-duty: receiving.receipt.maintain
      description: Registers an ARRIVED receipt with received quantities, batch, serials and location. Needs If-Match.
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200': { $ref: '#/components/responses/ReceiptChanged' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-001' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-STA-001 receipt is not ARRIVED; COM-0410 key in flight.' }
        '412': { $ref: '#/components/responses/Problem', description: 'COM-0412 If-Match differs from the current version.' }
        '422': { $ref: '#/components/responses/Problem', description: 'RCV-OVR-001, INV-SER-001, RCV-VAL-001, RCV-CW-001, COM-0409.' }
        '428': { $ref: '#/components/responses/Problem', description: 'COM-0428 If-Match missing.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/receipts/{id}:post:
    post:
      operationId: postReceipt
      x-passage-duty: receiving.receipt.post
      description: Posts a REGISTERED receipt (Dr inventory, Cr GR/IR through the ledger, idempotency key = receipt id), opens one GR/IR item per line and writes dev.passage.receiving.receipt.posted.v1 to the outbox in the same transaction. No body.
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/ReceiptChanged' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-001' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-STA-001 receipt is not REGISTERED; RCV-IDM-001 an earlier ledger posting touching the receipt is unfinished or differs (errors.pendingKey and errors.createdAt name it); COM-0410.' }
        '412': { $ref: '#/components/responses/Problem', description: 'COM-0412' }
        '422': { $ref: '#/components/responses/Problem', description: 'PER-AP-001 ledger period closed; COM-0409.' }
        '428': { $ref: '#/components/responses/Problem', description: 'COM-0428' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/receipts/{id}:correct:
    post:
      operationId: correctReceipt
      x-passage-duty: receiving.receipt.post
      description: Delta quantity correction of a POSTED receipt (FR-18.3). A line cannot go below its invoiced quantity or to zero (cancel instead), serial-tracked lines are refused. The receipt stays POSTED and its row version and correction sequence advance; dev.passage.receiving.receipt.corrected.v1 is written to the outbox.
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectRequest' }
      responses:
        '200': { $ref: '#/components/responses/ReceiptChanged' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-001' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-STA-001 receipt not POSTED; RCV-SVC-001 receipt of an accepted service entry sheet; RCV-COR-001 correction below the invoiced quantity; RCV-IDM-001 an earlier ledger posting touching the receipt is unfinished or differs (errors.pendingKey and errors.createdAt name it); COM-0410.' }
        '412': { $ref: '#/components/responses/Problem', description: 'COM-0412' }
        '422': { $ref: '#/components/responses/Problem', description: 'RCV-VAL-001, RCV-OVR-001, PER-AP-001, COM-0409.' }
        '428': { $ref: '#/components/responses/Problem', description: 'COM-0428' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/receipts/{id}:cancel:
    post:
      operationId: cancelReceipt
      x-passage-duty: receiving.receipt.post
      description: Cancels an ARRIVED, REGISTERED or POSTED receipt. A POSTED receipt is fully reversed in the ledger and its GR/IR items close at zero, and is refused once any line is invoiced. Serials recorded by a registered receipt are released. The optional body carries postingDate.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                postingDate: { type: string, format: date, description: Ledger posting date; defaults to the receipt date and may not precede it. }
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/ReceiptChanged' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-001' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-STA-001 already cancelled or has invoiced quantity; RCV-SVC-001 receipt of an accepted service entry sheet; RCV-IDM-001 an earlier ledger posting touching the receipt is unfinished or differs (errors.pendingKey and errors.createdAt name it); COM-0410.' }
        '412': { $ref: '#/components/responses/Problem', description: 'COM-0412' }
        '422': { $ref: '#/components/responses/Problem', description: 'PER-AP-001, RCV-VAL-001 posting date before the receipt date, COM-0409.' }
        '428': { $ref: '#/components/responses/Problem', description: 'COM-0428' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/grir:
    get:
      operationId: listGrir
      x-passage-duty: receiving.ap.inquire
      description: GR/IR open items newest first with per-currency open totals over the whole filter (not just the page).
      parameters:
        - { name: vendorId, in: query, schema: { type: string, format: uuid } }
        - { name: purchaseOrderId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, PARTIAL, CLEARED, WRITTEN_OFF] } }
        - { name: ageGt, in: query, schema: { type: integer, minimum: 0, maximum: 3650 }, description: Only items older than this many days. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of open items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrirPage' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/invoices:
    get:
      operationId: listInvoices
      x-passage-duty: receiving.ap.inquire
      description: Vendor invoices newest first, with their lines and the ledger entry id (empty while an invoice is held for audit). Find the invoices of one receipt (receiptId) or purchase order (purchaseOrderId), which is how a purchase order page links on to the invoices and ledger entries it produced. Only invoices inside the caller's tenant and legal entities are returned. Page with nextCursor.
      parameters:
        - { name: vendorId, in: query, schema: { type: string, format: uuid } }
        - { name: receiptId, in: query, schema: { type: string, format: uuid }, description: Invoices with a line against this receipt. }
        - { name: purchaseOrderId, in: query, schema: { type: string, format: uuid }, description: Invoices with a line against a receipt of this purchase order. }
        - { name: status, in: query, schema: { type: string, enum: [POSTED, AUDIT_BLOCKED, AUDIT_REJECTED] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of invoices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoicePage' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/invoices:post:
    post:
      operationId: postVendorInvoice
      x-passage-duty: receiving.vendor-invoice.post
      description: 'Posts a vendor invoice against GR/IR items. Checks the AP period, clears GR/IR pro rata (the last quantity clears the exact remainder), posts to the ledger, persists the invoice and writes dev.passage.payables.invoice.posted.v1 to the outbox. The invoice id derives from tenant, vendor and invoice number, so the ledger idempotency key is stable across retries. When the legal entity has a stochastic audit sample rate (PUT /v1/receiving/audit-policy), the invoice may be drawn for audit: it is stored with status AUDIT_BLOCKED, reserves its GR/IR quantity (so no other invoice, ERS run or plan settlement can take it), posts nothing to the ledger and writes dev.passage.payables.invoice.sampled.v1 instead, until an auditor calls :release-audit-block. Subsequent debits and credits against a blocked invoice are refused (AP-AUD-001).'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceRequest' }
      responses:
        '201':
          description: Posted invoice.
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present on replays only. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-002 receipt line has no open GR/IR item; RCV-NF-006 oneTimePayeeId names no payee the caller can see.' }
        '409': { $ref: '#/components/responses/Problem', description: 'AP-DUP-001 invoice number already posted for the vendor; RCV-IDM-001 an earlier posting for this invoice is unfinished or differs; COM-0410.' }
        '422': { $ref: '#/components/responses/Problem', description: 'PER-AP-001 closed AP period; AP-QTY-001 more than received and uninvoiced; AP-PLN-001 the PO line is settled by its invoicing plan; RCV-VAL-001 other vendor or entity, or a one-time payee of another legal entity; COM-0409.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/one-time-payees:
    post:
      operationId: createOneTimePayee
      x-passage-duty: receiving.vendor-invoice.post
      description: 'Records the document-level payee of a vendor invoice for the legal entity''s one-time vendor account (FR-18.19). Name, address, tax id, email and bank account are encrypted with platform fieldcrypt (a per-tenant data key derived from the service key in FIELDCRYPT_KEYS_FILE or FIELDCRYPT_KEYS, with tenant and field bound as additional data) before they reach the database; the payee is immutable once stored. The response, error bodies, logs and events carry the payee id, never its data: a validation error names the field and the rule, not the value. The bank account is validated like a vendor bank account (IBAN mod-97 and ISO 13616 per-country length, or ABA checksum, AP-BNK-001). With fieldcrypt keys the Idempotency-Key record stores an HMAC of the request under the tenant''s key, not a plain digest of the payee data. Reference the returned id as oneTimePayeeId on POST /v1/receiving/invoices:post. There is no read endpoint; payment (FR-19.23) needs a separate decrypting read. Erasure is a separate route (POST /v1/receiving/one-time-payees:erase); the optional subjectRef is the opaque data-subject id a compliance erasure command names.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OneTimePayeeRequest' }
      responses:
        '201':
          description: Payee recorded.
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present on replays only. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OneTimePayee' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001 no authenticated user.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '422': { $ref: '#/components/responses/Problem', description: 'AP-BNK-001 the bank account failed its checksum, IBAN country length or format check; COM-0409.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
        '503': { $ref: '#/components/responses/Problem', description: 'RCV-CRY-001 no field encryption keys are configured.' }
  /v1/receiving/invoice-captures:
    post:
      operationId: createInvoiceCapture
      x-passage-duty: receiving.vendor-invoice.post
      description: >-
        Captures a vendor invoice document as a draft that posts nothing. format UBL parses a UBL 2.1 Invoice (a DOCTYPE is
        refused); format OCR hands the PDF or image to the document extractor chosen by OCR_PROVIDER (503 COM-0503 when
        none is set; the local provider reads labelled lines from a PDF text layer and refuses images with RCV-CAP-002). The capture is CAPTURED, or NEEDS_REVIEW with reviewReasons LOW_CONFIDENCE
        (confidence below 0.80), TOTAL_MISMATCH (total differs from the line sum by more than 0.01; the UBL total is the
        tax-exclusive amount) or NO_VENDOR_TAX_ID. The same document (SHA-256) in the same legal entity answers 200 with the
        existing capture instead of a second row. A person turns a capture into an invoice with POST /v1/receiving/invoices:post.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceCaptureRequest' }
      responses:
        '200':
          description: The document was captured before; the existing capture.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceCapture' }
        '201':
          description: Captured.
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present on replays only. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceCapture' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001 no authenticated user.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '413': { $ref: '#/components/responses/Problem', description: 'COM-0413 the body is over 4 MiB.' }
        '422': { $ref: '#/components/responses/Problem', description: 'RCV-CAP-001 the document is not a valid invoice; RCV-CAP-002 the extractor could not read it; COM-0409.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
        '503': { $ref: '#/components/responses/Problem', description: 'COM-0503 no OCR extractor is configured.' }
  /v1/receiving/invoice-captures/{id}:
    get:
      operationId: getInvoiceCapture
      summary: Read one captured vendor invoice
      x-passage-duty: receiving.ap.inquire
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The capture.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceCapture' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-007' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/ers-self-bills/{id}:
    get:
      operationId: getErsSelfBill
      x-passage-duty: receiving.ap.inquire
      description: Returns the self-billing PDF issued to the vendor for a posted ERS invoice. The path id is the invoice id.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The self-billing document.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-009' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/service-entry-sheets:
    post:
      operationId: createServiceEntrySheet
      x-passage-duty: receiving.service-entry.maintain
      description: >-
        Enters a service entry sheet against lines of an APPROVED or CONFIRMED purchase order in the caller's legal entity: per
        line the service performed (description, quantity, unit price). The vendor and currency come from the purchase order and
        the line amounts are rounded to the currency's minor units. The sheets of one purchase order line (PENDING and ACCEPTED)
        may not exceed the line's value, quantity times net price (AP-SES-001). The sheet starts PENDING and posts nothing.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceEntrySheetRequest' }
      responses:
        '201':
          description: Entered.
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present on replays only. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceEntrySheet' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001 no authenticated user.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-004 purchase order not found.' }
        '422': { $ref: '#/components/responses/Problem', description: 'AP-SES-001 over the line value; RCV-PO-001 PO not approved; RCV-PO-002 line cancelled; RCV-PO-003 other legal entity; COM-0409.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
        '503': { $ref: '#/components/responses/Problem', description: 'COM-0503 purchase order lookup unavailable.' }
  /v1/receiving/service-entry-sheets/{id}:
    get:
      operationId: getServiceEntrySheet
      summary: Read one service entry sheet
      x-passage-duty: receiving.service-entry.maintain or receiving.service-entry.accept
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The sheet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceEntrySheet' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-008' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/service-entry-sheets/{id}:accept:
    post:
      operationId: acceptServiceEntrySheet
      x-passage-duty: receiving.service-entry.accept
      description: >-
        Accepts a PENDING sheet. The user who entered the sheet cannot decide it (403 AP-SES-002). Posts Dr expense / Cr GR/IR
        through the ledger, opens GR/IR items on a synthetic POSTED service receipt (packing slip SES-{sheet id}) so ERS and
        vendor invoices can settle it as ERS-{sheet id}, and writes serviceentrysheet.decided and receipt.posted to the outbox.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceEntrySheet' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003; AP-SES-002 the decider entered the sheet.' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-008' }
        '409': { $ref: '#/components/responses/Problem', description: 'AP-SES-003 the sheet is not PENDING.' }
        '422': { $ref: '#/components/responses/Problem', description: 'PER-AP-001 the AP period is not open.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/service-entry-sheets/{id}:reject:
    post:
      operationId: rejectServiceEntrySheet
      x-passage-duty: receiving.service-entry.accept
      description: Rejects a PENDING sheet with a reason, which frees its amounts for the purchase order lines. Same segregation as accept.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceEntrySheet' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003; AP-SES-002 the decider entered the sheet.' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-008' }
        '409': { $ref: '#/components/responses/Problem', description: 'AP-SES-003 the sheet is not PENDING.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/one-time-payees:erase:
    post:
      operationId: eraseOneTimePayees
      x-passage-duty: receiving.payee.erase
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      description: >-
        Retention and erasure path for one-time payees (BR-48.5, BR-48.6, #335). Pseudonymizes the legal entity's payees
        (all of them, or those with the given subjectRef) by overwriting the sealed name, address, tax id, email and bank
        account and setting erased_at; the row stays because posted invoices reference it. A payee is erased only when
        84 months (7 years, owner decision for AP and payee records) have passed since its last activity, the later of its
        creation and its latest invoice, and the legal entity's country (LEGAL_ENTITY_COUNTRIES) has no longer statutory floor (an entity in DE or FR, 10 years, and an entity whose country is not configured are
        skipped and counted as retained until the local rules land, LOC-0502), and when the compliance service reports no active legal hold covering the payee
        (data class AP_PAYEE, the payee id as recordRef, its subjectRef). A payee inside retention or under a hold is
        kept and counted; each hold check runs immediately before that payee's own erasure, and a hold check that cannot be answered stops the run (500; payees already erased stay erased and a repeat continues), and with no
        COMPLIANCE_URL the route answers 503 RCV-HLD-001. A run pages through every payee of the entity by (created_at, id) cursor. The same path runs from the dev.passage.privacy.erasure.requested.v1 consumer. Repeating a run is safe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legalEntityId]
              properties:
                legalEntityId: { type: string, format: uuid }
                subjectRef: { type: string, maxLength: 200, description: 'Empty runs the retention sweep over every payee of the entity.' }
      responses:
        '200':
          description: What the run did.
          content:
            application/json:
              schema:
                type: object
                required: [erased, retained, held]
                properties:
                  erased: { type: integer }
                  retained: { type: integer }
                  held: { type: integer }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001, COM-0002' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500 including a legal hold check that failed.' }
        '503': { $ref: '#/components/responses/Problem', description: 'RCV-HLD-001 no compliance hold check is configured.' }
  /v1/receiving/invoice-adjustments:post:
    post:
      operationId: postInvoiceAdjustment
      x-passage-duty: receiving.vendor-invoice.post
      description: >-
        Posts a subsequent debit (kind DEBIT, the vendor charges more) or a credit note (kind CREDIT, the vendor charges less)
        against a posted vendor invoice. The adjustment is value only: each line names a line of the original invoice and a
        positive amount, GR/IR items and quantities are untouched, and the amount posts to the difference account that line used
        (inventory, or PPV when the invoice line was standardCost) against vendor control (DEBIT: Dr difference / Cr vendor
        control; CREDIT: Dr vendor control / Cr difference). The vendor and currency come from the original invoice. Credits are
        capped per invoice line at invoiced amount + earlier debits - earlier credits, counting every line of the request
        (AP-CRD-001). The adjustment id derives from tenant, original invoice and document number (unique per invoice ignoring
        case), so the ledger idempotency key is stable across retries. Writes dev.passage.payables.invoice.adjusted.v1 to the outbox.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceAdjustmentRequest' }
      responses:
        '201':
          description: Posted adjustment.
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present on replays only. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceAdjustment' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-005 original invoice not found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'AP-DUP-001 document number already posted for the invoice; RCV-IDM-001 an earlier posting is unfinished or differs; COM-0410.' }
        '422': { $ref: '#/components/responses/Problem', description: 'AP-CRD-001 credit above what is left to credit; PER-AP-001 closed AP period; RCV-VAL-001 unknown invoice line, amount with more decimals than the currency, other entity or ledger; COM-0409.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/plan-settlements:run:
    post:
      operationId: runPlanSettlement
      x-passage-duty: receiving.vendor-invoice.post
      description: >-
        Settles the due rows of a purchase order's invoicing plans (purchasing GET .../invoicing-plans). A row is settled when its
        due date is on or before postingDate, it is OPEN in purchasing, its line is not cancelled, the plan has
        settleWithoutReceipt, its currency is the order's and its amount is positive. Each settled row posts Dr GR/IR / Cr vendor
        control for its amount and is recorded once per (order, line, row), so a repeated run settles nothing twice. Other due rows
        come back in skipped with a reason. At most 100 rows are settled per run (hasMore); a failure stops the run, rows already
        settled stay settled and a repeat continues. Rows stay OPEN in purchasing (it has no marking endpoint yet). The caller
        needs the purchasing duty procurement.purchase-order.inquire. Writes dev.passage.payables.settlement.posted.v1 per row.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanSettlementRequest' }
      responses:
        '200':
          description: Rows settled by this run and rows skipped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementRun' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-004 purchase order not found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-IDM-001, COM-0410.' }
        '422': { $ref: '#/components/responses/Problem', description: 'PER-AP-001 closed AP period; RCV-PO-001 order not approved; RCV-VAL-001 order of another entity or foreign ledger; COM-0409.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
        '503': { $ref: '#/components/responses/Problem', description: 'COM-0503 purchasing unavailable or not configured.' }
  /v1/receiving/consignment-settlements:run:
    post:
      operationId: runConsignmentSettlement
      x-passage-duty: receiving.vendor-invoice.post
      description: >-
        Settles consumed consignment stock. Reads the legal entity's POSTED OWNERSHIP_CHANGE journals from inventory (GET
        /v1/inventory/journals and /{id}; the vendor is the owner dimension of the lines, the accrual account and amount come from
        the journal's GL entry credit) and, for every journal not settled yet, posts Dr consignment accrual / Cr vendor control
        for the journal amount, once per journal. vendorId limits the run to one vendor (the owner text, case-insensitive). At most
        100 journals are settled per run (hasMore); a failure stops the run and a repeat continues. The caller needs the inventory
        duty inventory.read. Answers 503 when INVENTORY_URL is not set. Writes dev.passage.payables.settlement.posted.v1 per journal.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsignmentSettlementRequest' }
      responses:
        '200':
          description: Journals settled by this run and journals skipped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementRun' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-006 journal not found in inventory.' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-IDM-001, COM-0410.' }
        '422': { $ref: '#/components/responses/Problem', description: 'PER-AP-001 closed AP period; RCV-VAL-001 foreign ledger; COM-0409.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
        '503': { $ref: '#/components/responses/Problem', description: 'COM-0503 inventory unavailable or not configured.' }
  /v1/receiving/invoices/{id}:release-audit-block:
    post:
      operationId: releaseInvoiceAuditBlock
      x-passage-duty: receiving.invoice-audit.release
      description: >-
        Releases an invoice held by the stochastic audit block: checks the AP period for the invoice's posting date, posts the
        journal (the GR/IR clearings fixed when the invoice was drawn, so the entry equals the one a normal post would have made)
        under the invoice's own idempotency key, sets the status to POSTED, records the releasing user and time, and writes
        dev.passage.payables.invoice.posted.v1. The duty is separate from receiving.vendor-invoice.post (segregation of duties), and the user
        who posted the invoice cannot release it (AP-AUD-003). An ERS invoice whose self-billing parties lack an address, country or name in the master data stays blocked with 422 AP-ERS-005. The caller needs an authenticated user.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseAuditBlockRequest' }
      responses:
        '200':
          description: The released invoice (status POSTED, releasedBy and releasedAt set).
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present on replays only. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001 no tenant or no user.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003; AP-AUD-003 the releaser posted the invoice.' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-005 invoice not found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'AP-AUD-002 the invoice is not blocked for audit (also a second release); RCV-IDM-001; COM-0410.' }
        '422': { $ref: '#/components/responses/Problem', description: 'PER-AP-001 closed AP period; RCV-VAL-001 other legal entity; AP-ERS-005 self-billing party data incomplete; COM-0409.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/invoices/{id}:reject-audit-block:
    post:
      operationId: rejectInvoiceAuditBlock
      x-passage-duty: receiving.invoice-audit.release
      description: >-
        Rejects an invoice held by the stochastic audit block. Nothing is posted; the GR/IR quantity and cleared amount the invoice
        reserved are freed, the status becomes AUDIT_REJECTED, and the rejecting user, time and reason are stored. The invoice number
        stays used for the vendor. Same duty and segregation as the release: the user who posted the invoice cannot reject it
        (AP-AUD-003), nor can anyone when the poster is unknown. Writes dev.passage.payables.invoice.rejected.v1.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectAuditBlockRequest' }
      responses:
        '200':
          description: The rejected invoice.
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present on replays only. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001 including a missing reason.' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001 no tenant or no user.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003; AP-AUD-003 the rejecter posted the invoice.' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-005 invoice not found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'AP-AUD-002 the invoice is not blocked for audit; RCV-IDM-001; COM-0410.' }
        '422': { $ref: '#/components/responses/Problem', description: 'RCV-VAL-001 other legal entity; COM-0409.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/ers-settlements:run:
    post:
      operationId: runErsSettlement
      x-passage-duty: receiving.vendor-invoice.post
      description: >-
        Evaluated receipt settlement (self-billing). Scans the OPEN GR/IR items (no quantity invoiced yet) of the vendor and/or
        purchase order, and for each POSTED receipt of an ERS-enabled vendor (PUT /v1/receiving/ers-vendors/{vendorId}) creates
        and posts one self-billed invoice numbered ERS-{receipt number}: every open receipt line at the received quantity times
        the PO line's net unit price (the PO line is the usable line of the order with the line's product; none or several skip
        the receipt), Dr GR/IR (the receipt's value) with the difference to inventory or PPV, Cr vendor control. The PO is read
        through the purchasing adapter with the caller's identity. A receipt with some lines already invoiced is skipped whole (PARTIALLY_INVOICED) so its ERS number is not used up. The caller must carry an authenticated end user (401 otherwise): the user is stored as the invoice's poster for segregation of duties, so a scheduler needs a user actor. Lines settled by an invoicing plan are not
        touched: the run uses the same per-line locks and checks as POST /v1/receiving/invoices:post, so an ERS-settled line
        cannot be invoiced again and an invoiced line is skipped. Idempotent per receipt (ALREADY_SETTLED). The invoice goes
        through the stochastic audit block like any other (status AUDIT_BLOCKED in the result). At most 100 invoices are created
        per run and 1000 GR/IR items scanned (hasMore); a failure stops the run and a repeat continues. Quantity discrepancies
        are not handled. A receipt whose legal entity country has no tax rule (or a supplier in another country or with no country, or no tax service) is skipped TAX_NOT_DETERMINED. A vendor whose party has no address with a country, or a legal entity without a name or country in the org master, is skipped PARTY_DATA_INCOMPLETE (detail names the gap); both skips leave the receipt open for a later run. BR-18.9: a receipt line whose recorded unit price differs (at 6 decimals) from the PO line's current net price is skipped (PRICE_CHANGED, detail AP-ERS-001 with old and new price) until a buyer confirms the current price (PUT /v1/receiving/receipts/{id}/lines/{lineNo}/ers-price-confirmation); a later PO price change needs a new confirmation. Writes dev.passage.payables.invoice.posted.v1 (source ERS) or
        invoice.sampled.v1 per invoice.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErsRunRequest' }
      responses:
        '200':
          description: Self-billed invoices created by this run and receipts skipped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErsRun' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001 including neither vendorId nor purchaseOrderId.' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-IDM-001, COM-0410.' }
        '422': { $ref: '#/components/responses/Problem', description: 'PER-AP-001 closed AP period; RCV-VAL-001 foreign ledger; COM-0409.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
        '503': { $ref: '#/components/responses/Problem', description: 'COM-0503 purchasing unavailable or not configured.' }
  /v1/receiving/ers-vendors/{vendorId}:
    put:
      operationId: setErsVendor
      x-passage-duty: receiving.matching-policy.maintain
      description: Turns evaluated receipt settlement on or off for a vendor in a legal entity. Neither purchasing nor party carries an ERS flag, so receiving owns it. The change records the user. Absent means off.
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErsVendorRequest' }
      responses:
        '200':
          description: The stored setting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErsVendor' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001 no tenant or no user.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/receipts/{id}/lines/{lineNo}/ers-price-confirmation:
    put:
      operationId: confirmErsPrice
      x-passage-duty: receiving.ers-price.confirm
      description: A buyer confirms the unit price an ERS run may settle a receipt line at when the PO price changed since receipt (BR-18.9, AP-ERS-001). unitPrice must equal the PO line's current net price (409 AP-ERS-002). The receipt must be POSTED and its vendor ERS-enabled (409 AP-ERS-003). The user who posted the receipt cannot confirm it (403 AP-ERS-004), and an ERS run by the confirming user skips the line (PRICE_CONFIRMED_BY_RUNNER). Each confirmation is kept in an insert-only history and published as erspriceconfirmation.confirmed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: lineNo
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legalEntityId, unitPrice]
              properties:
                legalEntityId: { type: string, format: uuid }
                unitPrice: { type: [number, string], minimum: 0 }
      responses:
        '200':
          description: The stored confirmation.
          content:
            application/json:
              schema:
                type: object
                required: [receiptId, lineNo, unitPrice]
                properties:
                  receiptId: { type: string, format: uuid }
                  lineNo: { type: integer }
                  unitPrice: { type: string }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001 no tenant or no user.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-001 no such receipt line in the legal entity.' }
        '409': { $ref: '#/components/responses/Problem', description: 'AP-ERS-002 price differs from the PO, AP-ERS-003 not confirmable.' }
  /v1/receiving/audit-policy:
    put:
      operationId: setAuditPolicy
      x-passage-duty: receiving.matching-policy.maintain
      description: Sets the stochastic audit sample rate of a legal entity, a percentage from 0 to 100 with at most two decimals (default 0, nothing is sampled). Each invoice posted afterwards (manual or ERS) is drawn from a seedable random source and blocked with that probability. The change records the user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditPolicyRequest' }
      responses:
        '200':
          description: The stored policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPolicy' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001 no tenant or no user.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/pending-postings:
    get:
      operationId: listPendingPostings
      x-passage-duty: receiving.admin
      description: Ledger postings this service recorded before calling the ledger and has not seen complete (oldest first, at most 200). A row stays open when the ledger call ended in an unknown outcome (timeout, transport error, 5xx) or the local commit failed after the ledger accepted the entry.
      responses:
        '200':
          description: Open pending postings.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, subjects, createdAt, ageSeconds]
                      properties:
                        key: { type: string }
                        subjects: { type: array, items: { type: string }, description: Receipt ids and, for an invoice posting, the invoice id. }
                        createdAt: { type: string, format: date-time }
                        ageSeconds: { type: integer }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /v1/receiving/pending-postings/{key}/resolve:
    post:
      operationId: resolvePendingPosting
      x-passage-duty: receiving.admin
      description: Re-sends the stored journal to the ledger under its key. When the ledger returns an entry id (it had it, or accepts it now) that entry is reversed and the row is marked REVERSED, which frees the receipt and invoice it blocked; the user then repeats the command, which posts under a new ledger key generation. A definite ledger rejection marks the row REJECTED. Colons in the key may be sent as they are or percent-encoded.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Outcome REVERSED (with the reversed ledger entry id) or REJECTED.
          content:
            application/json:
              schema:
                type: object
                required: [key, outcome]
                properties:
                  key: { type: string }
                  outcome: { type: string, enum: [REVERSED, REJECTED] }
                  ledgerEntryId: { type: string }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003' }
        '404': { $ref: '#/components/responses/Problem', description: 'RCV-NF-003' }
        '409': { $ref: '#/components/responses/Problem', description: 'RCV-STA-001 already finished; RCV-IDM-001 the ledger holds a different entry under the key, another resolve holds the posting, or the posting is younger than 33 s and its command may still be running.' }
        '422': { $ref: '#/components/responses/Problem', description: 'PER-AP-001 the ledger period of the entry is closed; RCV-LDG-001 the ledger refused the reversal. Not retryable.' }
        '503': { $ref: '#/components/responses/Problem', description: 'COM-0503 the ledger could not be reached or the reversal failed; try again.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500' }
  /healthz:
    get:
      operationId: liveness
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable or slower than 500 ms. }
  /metrics:
    get:
      operationId: metrics
      x-passage-duty: public
      description: Served on the admin port only.
      responses:
        '200': { description: Prometheus text format. }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The receipt row version from the last response (body version or ETag), quoted or bare.
      schema: { type: string }
    ReceiptId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ReceiptChanged:
      description: The receipt after the change; ETag carries the new row version.
      headers:
        ETag: { schema: { type: string } }
        Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present on replays only. }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Receipt' }
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: 'Stable code such as COM-0001, AUTH-0001, AUTH-0003.' }
        serviceCode: { type: string, description: 'Not emitted yet: platform/go/httpx.Problem has no such field.' }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, description: Decimal string at the currency minor unit. }
        currency: { type: string, minLength: 3, maxLength: 3 }
    Policy:
      type: object
      additionalProperties: false
      properties:
        matchLevel: { type: string, enum: [NONE, TWO_WAY, THREE_WAY], default: THREE_WAY }
        priceTolPct: { type: [number, string], minimum: 0, default: 2.0 }
        priceTolAbs: { type: [number, string], minimum: 0, default: 25.00 }
        qtyTolPct: { type: [number, string], minimum: 0, default: 5.0 }
        totalTolPct: { type: [number, string], minimum: 0, default: 1.0 }
        totalTolAbs: { type: [number, string], minimum: 0, default: 50.00 }
        smallDiffAbs: { type: [number, string], minimum: 0, default: 0.50 }
        priceTolMode: { type: string, enum: [UPPER_ONLY, BOTH], default: UPPER_ONLY }
    Line:
      type: object
      additionalProperties: false
      required: [qty, unitPrice]
      description: poUnitPrice is required unless poLineNo is given with a request-level purchaseOrderId; with poLineNo set, poUnitPrice, poQtyRemaining and poCurrency are refused (400 COM-0001) and the purchase order supplies them.
      properties:
        poLineNo: { type: integer, minimum: 1, description: 'Line of the request purchaseOrderId. Supplies poUnitPrice (net of discount, per price unit), poQtyRemaining and poCurrency from the purchase order; sending any of them with poLineNo is refused (400 COM-0001), as is repeating a poLineNo within the request. A purchase order that is not approved or confirmed (including FINALIZED) is refused with RCV-PO-001.' }
        qty: { type: [number, string], exclusiveMinimum: 0 }
        unit: { type: string, description: 'Unit of measure, echoed in the response.' }
        unitPrice: { type: [number, string], minimum: 0 }
        poUnitPrice: { type: [number, string], minimum: 0 }
        poCurrency: { type: string, description: Absent means the invoice currency; a different value yields PRICE_VARIANCE with currencyMismatch. }
        receiptState: { type: string, enum: [REGISTERED, POSTED], description: Absent means no receipt exists. }
        receivedUninvoicedQty: { type: [number, string], minimum: 0, default: 0 }
        poQtyRemaining: { type: [number, string], minimum: 0, default: 0 }
    EvaluateRequest:
      type: object
      additionalProperties: false
      required: [currency, headerTotal, lines]
      properties:
        purchaseOrderId: { type: string, format: uuid, description: 'Purchase order in services/purchasing that lines naming poLineNo are read from, with the caller identity.' }
        legalEntityId: { type: string, format: uuid, description: 'Legal entity of the receipt or invoice being tested. When present, and a service signing key is configured, the purchase order read is signed for this entity even for a user scoped to several; it must lie in the caller scope. When absent, a user scoped to several entities has their own identity forwarded.' }
        policy: { $ref: '#/components/schemas/Policy' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        headerTotal: { type: [number, string] }
        charges: { type: [number, string], minimum: 0, default: 0 }
        tax: { type: [number, string], minimum: 0, default: 0 }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/Line' }
    ArrivalLine:
      type: object
      additionalProperties: false
      required: [productId, unit]
      description: |
        With poLineNo the line is validated against the purchase order line (same legal entity, vendor, currency,
        product and unit, open quantity above zero), orderedRemaining is the order quantity not yet received and
        unitPrice the net price per unit, and poLineId is derived from the order line; supplying any of them is 400. The open quantity is the order line
        quantity less what non-cancelled registered or posted receipts here already took. poLineNo is required whenever the purchase order lookup is configured
        (PURCHASING_URL); only a local deployment with fakes takes a line without it, and then poLineId, orderedRemaining and unitPrice are required and trusted as sent. Either every line carries poLineNo or none does.
      properties:
        poLineId: { type: string, format: uuid }
        poLineNo: { type: integer, minimum: 1 }
        productId: { type: string, format: uuid }
        orderedRemaining: { type: [number, string], exclusiveMinimum: 0 }
        overDeliveryPct: { type: [number, string], minimum: 0, maximum: 100, default: 0 }
        unitPrice: { type: [number, string], minimum: 0 }
        unit: { type: string, minLength: 1, maxLength: 16 }
        batchTracked: { type: boolean, default: false }
        serialTracked: { type: boolean, default: false }
        siteId:
          type: string
          format: uuid
          description: Delivery site of a line without poLineNo (#480), carried on receipt.posted so inventory can book the line. A line with poLineNo takes the order line's site; supplying it is 400.
        warehouseId:
          type: string
          format: uuid
          description: Delivery warehouse of a line without poLineNo; needs siteId. A line with poLineNo takes the order line's warehouse; supplying it is 400.
    ArrivalRequest:
      type: object
      additionalProperties: false
      required: [vendorId, purchaseOrderId, legalEntityId, packingSlip, receiptDate, currency, lines]
      properties:
        vendorId: { type: string, format: uuid }
        purchaseOrderId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        packingSlip: { type: string, minLength: 1, maxLength: 64 }
        carrier: { type: string, maxLength: 128 }
        palletCount: { type: integer, minimum: 0 }
        receiptDate: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        exchangeRate: { type: [number, string], exclusiveMinimum: 0, default: 1 }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/ArrivalLine' }
    ReceiptLine:
      type: object
      required: [lineNo, poLineId, productId, orderedRemaining, overDeliveryPct, unitPrice, unit, batchTracked, serialTracked, qty, batch, serials, locationId, inventoryStatus, amount, amountAcct]
      properties:
        lineNo: { type: integer }
        poLineId: { type: string, format: uuid }
        poLineNo: { type: integer, minimum: 1, description: Purchase order line number; absent when the line was keyed without a purchase order line. }
        productId: { type: string, format: uuid }
        orderedRemaining: { type: string }
        overDeliveryPct: { type: string }
        unitPrice: { type: string }
        unit: { type: string }
        batchTracked: { type: boolean }
        serialTracked: { type: boolean }
        qty: { type: string }
        batch: { type: string }
        serials: { type: array, items: { type: string } }
        locationId: { type: string }
        inventoryStatus: { type: string }
        amount: { type: [string, 'null'], description: Null until posted. }
        amountAcct: { type: [string, 'null'], description: Null until posted. }
        cwQty: { type: integer, minimum: 1, description: Catch-weight count (cases). qty is the actual weight. }
        siteId: { type: string, format: uuid, description: The line's delivery site (the purchase order line's, or the one keyed on a line without it); absent when none is known. }
        warehouseId: { type: string, format: uuid, description: The line's delivery warehouse; absent when none is known. }
    Receipt:
      type: object
      required: [id, receiptNumber, state, version, vendorId, purchaseOrderId, legalEntityId, packingSlip, carrier, receiptDate, currency, exchangeRate, createdAt, lines]
      properties:
        id: { type: string, format: uuid }
        receiptNumber: { type: string, pattern: '^RCV-\d{8}$' }
        state: { type: string, enum: [ARRIVED, REGISTERED, POSTED, CANCELLED] }
        version: { type: integer, description: Row version; send it in If-Match. }
        vendorId: { type: string, format: uuid }
        purchaseOrderId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        packingSlip: { type: string }
        carrier: { type: string }
        palletCount: { type: integer }
        receiptDate: { type: string, format: date }
        currency: { type: string }
        exchangeRate: { type: string }
        postingDate: { type: string, format: date }
        ledgerEntryId: { type: string }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ReceiptLine' }
    DirectReceiptRequest:
      type: object
      additionalProperties: false
      required: [vendorId, purchaseOrderId, legalEntityId, packingSlip, receiptDate, currency, lines]
      properties:
        vendorId: { type: string, format: uuid }
        purchaseOrderId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        packingSlip: { type: string, minLength: 1, maxLength: 64 }
        carrier: { type: string, maxLength: 128 }
        palletCount: { type: integer, minimum: 0 }
        receiptDate: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        exchangeRate: { type: [number, string], exclusiveMinimum: 0, default: 1 }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [productId, unit, qty, locationId]
            description: Same purchase order line rules as ArrivalLine.
            properties:
              poLineId: { type: string, format: uuid }
              poLineNo: { type: integer, minimum: 1 }
              productId: { type: string, format: uuid }
              orderedRemaining: { type: [number, string], exclusiveMinimum: 0 }
              overDeliveryPct: { type: [number, string], minimum: 0, maximum: 100, default: 0 }
              unitPrice: { type: [number, string], minimum: 0 }
              unit: { type: string, minLength: 1, maxLength: 16 }
              batchTracked: { type: boolean, default: false }
              serialTracked: { type: boolean, default: false }
              qty: { type: [number, string], exclusiveMinimum: 0, description: Actual weight when cwQty is set, otherwise the received quantity. }
              cwQty: { type: integer, minimum: 1, description: Catch-weight count (cases). Requires catchWeight. }
              catchWeight:
                type: object
                additionalProperties: false
                required: [nominal, min, max]
                properties:
                  nominal: { type: [number, string] }
                  min: { type: [number, string] }
                  max: { type: [number, string] }
              batch: { type: string, maxLength: 128 }
              serials: { type: array, maxItems: 1000, items: { type: string, minLength: 1, maxLength: 64 } }
              locationId: { type: string, format: uuid }
              inventoryStatus: { type: string, enum: [AVAILABLE, QUARANTINE, BLOCKED], default: AVAILABLE }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [lineNo, qty, locationId]
            properties:
              lineNo: { type: integer, minimum: 1 }
              qty: { type: [number, string], exclusiveMinimum: 0, description: Actual weight when cwQty is set, otherwise the received quantity. }
              cwQty: { type: integer, minimum: 1, description: Catch-weight count (cases). Requires catchWeight. }
              catchWeight:
                type: object
                additionalProperties: false
                required: [nominal, min, max]
                properties:
                  nominal: { type: [number, string] }
                  min: { type: [number, string] }
                  max: { type: [number, string] }
              batch: { type: string, maxLength: 128 }
              serials: { type: array, maxItems: 1000, items: { type: string, minLength: 1, maxLength: 64 } }
              locationId: { type: string, format: uuid }
              inventoryStatus: { type: string, enum: [AVAILABLE, QUARANTINE, BLOCKED], default: AVAILABLE }
    CorrectRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        postingDate: { type: string, format: date, description: Ledger posting date; defaults to the receipt date and may not precede it. }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [lineNo, qtyDelta]
            properties:
              lineNo: { type: integer, minimum: 1 }
              qtyDelta: { type: [number, string], description: Non-zero; negative reduces the received quantity (the weight on a catch-weight line). }
              cwQtyDelta: { type: integer, description: "Catch-weight lines only: non-zero change of the case count, sent with the qtyDelta of the weight; the corrected count stays at least 1 and BR-24.5 (RCV-CW-001) is checked on the corrected weight and count. RCV-VAL-001 (422) on a line that is not catch-weight." }
    ReceiptPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Receipt' } }
        nextCursor: { type: string, description: Absent on the last page. }
    GrirItem:
      type: object
      required: [id, receiptId, receiptNumber, lineNo, vendorId, poLineId, unitPrice, receivedQty, invoicedQty, receivedAmount, clearedAmount, openAmount, currency, status, ageDays, createdAt]
      properties:
        id: { type: string, format: uuid }
        receiptId: { type: string, format: uuid }
        receiptNumber: { type: string }
        lineNo: { type: integer }
        vendorId: { type: string }
        poLineId: { type: string }
        unitPrice: { type: string, description: The receipt line unit price (per weight unit on a catch-weight line). }
        receivedQty: { type: string, description: The received quantity; the actual weight on a catch-weight line. }
        cwQty: { type: integer, minimum: 1, description: "Catch-weight lines only (FR-24.7): the case count received (after corrections); receivedQty is then the weight and unitPrice the price per weight unit." }
        invoicedQty: { type: string }
        receivedAmount: { type: string }
        clearedAmount: { type: string }
        openAmount: { type: string }
        currency: { type: string }
        status: { type: string, enum: [OPEN, PARTIAL, CLEARED, WRITTEN_OFF] }
        ageDays: { type: integer }
        createdAt: { type: string, format: date-time }
    GrirPage:
      type: object
      required: [items, totals]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/GrirItem' } }
        totals:
          type: object
          required: [count, openAmount]
          properties:
            count: { type: integer }
            openAmount: { type: array, items: { $ref: '#/components/schemas/Money' } }
        nextCursor: { type: string }
    OneTimePayeeRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, name, address, country]
      properties:
        legalEntityId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 140 }
        address: { type: string, minLength: 1, maxLength: 300 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        taxId: { type: string, maxLength: 40 }
        email: { type: string, maxLength: 254 }
        subjectRef: { type: string, maxLength: 200, description: 'Optional opaque data-subject id (not personal data); an erasure command for that subject reaches this payee.' }
        bankAccount:
          type: object
          additionalProperties: false
          description: Either iban (with an optional bic) or routingNumber with accountNumber.
          properties:
            iban: { type: string }
            bic: { type: string }
            routingNumber: { type: string, pattern: '^[0-9]{9}$' }
            accountNumber: { type: string, pattern: '^[0-9]{4,17}$' }
    OneTimePayee:
      type: object
      required: [id, legalEntityId, country, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        createdAt: { type: string, format: date-time }
    InvoiceCaptureRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, format, content]
      properties:
        legalEntityId: { type: string, format: uuid }
        format: { type: string, enum: [UBL, OCR] }
        mediaType: { type: string, enum: [application/pdf, image/png, image/jpeg, image/tiff], description: Required for OCR. }
        content: { type: string, format: byte, description: The document, base64. }
    InvoiceCapture:
      type: object
      required: [id, legalEntityId, source, status, reviewReasons, vendorTaxId, invoiceNumber, invoiceDate, currency, total, confidence, lines, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        source: { type: string, enum: [UBL, OCR] }
        status: { type: string, enum: [CAPTURED, NEEDS_REVIEW] }
        reviewReasons: { type: array, items: { type: string, enum: [LOW_CONFIDENCE, TOTAL_MISMATCH, NO_VENDOR_TAX_ID] } }
        vendorTaxId: { type: string }
        invoiceNumber: { type: string }
        invoiceDate: { type: string, format: date }
        currency: { type: string }
        total: { type: string }
        confidence: { type: string }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [description, unit, qty, unitPrice, amount]
            properties:
              description: { type: string }
              unit: { type: string }
              qty: { type: string }
              unitPrice: { type: string }
              amount: { type: string }
    ServiceEntrySheetRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, purchaseOrderId, lines]
      properties:
        legalEntityId: { type: string, format: uuid }
        purchaseOrderId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [poLineNo, qty, unitPrice]
            properties:
              poLineNo: { type: integer, minimum: 1 }
              description: { type: string, maxLength: 200 }
              unit: { type: string, maxLength: 20 }
              qty: { type: [number, string], exclusiveMinimum: 0 }
              unitPrice: { type: [number, string], minimum: 0 }
    ServiceEntrySheet:
      type: object
      required: [id, legalEntityId, vendorId, purchaseOrderId, currency, status, total, createdBy, createdAt, lines]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        purchaseOrderId: { type: string, format: uuid }
        currency: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED] }
        total: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
        rejectReason: { type: string }
        receiptId: { type: string, format: uuid, description: Present after accept; the synthetic POSTED service receipt that holds the GR/IR items. }
        ledgerEntryId: { type: string, description: Present after accept; the ledger journal of the Dr expense / Cr GR/IR accrual. }
        lines:
          type: array
          items:
            type: object
            required: [poLineNo, description, unit, qty, unitPrice, amount]
            properties:
              poLineNo: { type: integer }
              description: { type: string }
              unit: { type: string }
              qty: { type: string }
              unitPrice: { type: string }
              amount: { type: string }
    InvoiceRequest:
      type: object
      additionalProperties: false
      required: [vendorId, legalEntityId, invoiceNumber, invoiceDate, postingDate, currency, lines]
      properties:
        vendorId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        invoiceNumber: { type: string, minLength: 1, maxLength: 64, description: Trimmed; unique per vendor ignoring case. }
        invoiceDate: { type: string, format: date }
        postingDate: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        ledgerId: { type: string, format: uuid, description: Optional. The service posts to its configured ledger (POSTING_LEDGER_ID); a different value is refused with 422 RCV-VAL-001. }
        fiscalPeriodId: { type: string, format: uuid, deprecated: true, description: 'Optional, check only. The service resolves the fiscal period from legalEntityId, its ledger and postingDate through close (GET /v1/close/periods:resolve); a different value is refused with 422 PER-AP-002, as is a date no period or several periods cover.' }
        oneTimePayeeId: { type: string, format: uuid, description: 'Optional. A payee recorded with POST /v1/receiving/one-time-payees in the same legal entity; vendorId is then the legal entity''s one-time vendor account (not checked: no parameter holds it yet). Unknown or invisible: 404 RCV-NF-006; another legal entity: 422 RCV-VAL-001.' }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [receiptId, receiptLineNo, qty, unitPrice]
            properties:
              receiptId: { type: string, format: uuid }
              receiptLineNo: { type: integer, minimum: 1 }
              qty: { type: [number, string], exclusiveMinimum: 0 }
              unitPrice: { type: [number, string], minimum: 0 }
              standardCost: { type: boolean, default: false, description: Price difference posts to PPV instead of inventory. }
    InvoicePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
        nextCursor: { type: string, description: Absent on the last page. }
    Invoice:
      type: object
      required: [id, vendorId, legalEntityId, invoiceNumber, invoiceDate, postingDate, currency, ledgerId, fiscalPeriodId, total, ledgerEntryId, source, status, createdAt, lines]
      properties:
        source: { type: string, enum: [MANUAL, ERS] }
        oneTimePayeeId: { type: string, format: uuid, description: The payee recorded for the invoice; its data is never returned. }
        auditReason: { type: string, enum: [stochastic sample, re-issue after audit rejection], description: Why an invoice is or was held for audit. }
        status: { type: string, enum: [POSTED, AUDIT_BLOCKED, AUDIT_REJECTED], description: 'AUDIT_BLOCKED invoices have an empty ledgerEntryId until released.' }
        releasedBy: { type: string, description: The user who released the audit block. }
        releasedAt: { type: string, format: date-time }
        rejectedBy: { type: string }
        rejectedAt: { type: string, format: date-time }
        rejectReason: { type: string }
        id: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        invoiceNumber: { type: string }
        invoiceDate: { type: string, format: date }
        postingDate: { type: string, format: date }
        currency: { type: string }
        ledgerId: { type: string, format: uuid }
        fiscalPeriodId: { type: string, format: uuid }
        total: { type: string }
        ledgerEntryId: { type: string }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [lineNo, receiptId, receiptLineNo, qty, unitPrice, amount, standardCost]
            properties:
              lineNo: { type: integer }
              receiptId: { type: string, format: uuid }
              receiptLineNo: { type: integer }
              qty: { type: string }
              unitPrice: { type: string }
              amount: { type: string }
              standardCost: { type: boolean }
    InvoiceAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [originalInvoiceId, legalEntityId, kind, documentNumber, documentDate, postingDate, lines]
      properties:
        originalInvoiceId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid, description: Must be the legal entity of the original invoice. }
        kind: { type: string, enum: [CREDIT, DEBIT] }
        documentNumber: { type: string, minLength: 1, maxLength: 64, description: The vendor's credit or debit note number. Trimmed; unique per original invoice ignoring case. }
        documentDate: { type: string, format: date }
        postingDate: { type: string, format: date }
        ledgerId: { type: string, format: uuid, description: Optional. The service posts to its configured ledger; a different value is refused with 422 RCV-VAL-001. }
        fiscalPeriodId: { type: string, format: uuid, deprecated: true, description: 'Optional, check only. The service resolves the fiscal period from legalEntityId, its ledger and postingDate through close (GET /v1/close/periods:resolve); a different value is refused with 422 PER-AP-002, as is a date no period or several periods cover.' }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [invoiceLineNo, amount]
            properties:
              invoiceLineNo: { type: integer, minimum: 1, description: The line of the original invoice (lineNo in the Invoice response). The same line may appear more than once. }
              amount: { type: [number, string], exclusiveMinimum: 0, description: In the invoice currency with at most its minor-unit decimals. }
    InvoiceAdjustment:
      type: object
      required: [id, originalInvoiceId, legalEntityId, vendorId, kind, documentNumber, documentDate, postingDate, currency, ledgerId, fiscalPeriodId, total, ledgerEntryId, createdAt, lines]
      properties:
        id: { type: string, format: uuid }
        originalInvoiceId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        kind: { type: string, enum: [CREDIT, DEBIT] }
        documentNumber: { type: string }
        documentDate: { type: string, format: date }
        postingDate: { type: string, format: date }
        currency: { type: string }
        ledgerId: { type: string, format: uuid }
        fiscalPeriodId: { type: string, format: uuid }
        total: { type: string }
        ledgerEntryId: { type: string }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [lineNo, invoiceLineNo, amount]
            properties:
              lineNo: { type: integer }
              invoiceLineNo: { type: integer }
              amount: { type: string }
    PlanSettlementRequest:
      type: object
      additionalProperties: false
      required: [purchaseOrderId, legalEntityId, postingDate]
      properties:
        purchaseOrderId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid, description: Must be the legal entity of the purchase order. }
        postingDate: { type: string, format: date, description: Rows due on or before this date are settled; it is also the ledger posting date. }
        ledgerId: { type: string, format: uuid }
        fiscalPeriodId: { type: string, format: uuid, deprecated: true, description: 'Optional, check only. The service resolves the fiscal period from legalEntityId, its ledger and postingDate through close (GET /v1/close/periods:resolve); a different value is refused with 422 PER-AP-002, as is a date no period or several periods cover.' }
    ConsignmentSettlementRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, postingDate]
      properties:
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, description: Optional. Limits the run to one vendor (inventory owner text). }
        postingDate: { type: string, format: date, description: The ledger posting date. }
        ledgerId: { type: string, format: uuid }
        fiscalPeriodId: { type: string, format: uuid, deprecated: true, description: 'Optional, check only. The service resolves the fiscal period from legalEntityId, its ledger and postingDate through close (GET /v1/close/periods:resolve); a different value is refused with 422 PER-AP-002, as is a date no period or several periods cover.' }
    SettlementRun:
      type: object
      required: [settled, skipped, hasMore]
      properties:
        settled:
          type: array
          items:
            type: object
            required: [id, kind, sourceRef, legalEntityId, vendorId, postingDate, currency, amount, ledgerId, fiscalPeriodId, ledgerEntryId]
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, enum: [PLAN_ROW, CONSIGNMENT] }
              sourceRef: { type: string, description: '<order id>/<line no>/<row seq> for PLAN_ROW; the inventory journal id for CONSIGNMENT.' }
              legalEntityId: { type: string, format: uuid }
              vendorId: { type: string }
              postingDate: { type: string, format: date }
              currency: { type: string }
              amount: { type: string }
              ledgerId: { type: string, format: uuid }
              fiscalPeriodId: { type: string, format: uuid }
              ledgerEntryId: { type: string }
        skipped:
          type: array
          items:
            type: object
            required: [sourceRef, reason]
            properties:
              sourceRef: { type: string }
              reason: { type: string, enum: [ALREADY_INVOICED, UNKNOWN_ROW_STATUS, ALREADY_SETTLED, AWAITS_RECEIPT, LINE_CANCELLED, LINE_INVOICED, NO_PRODUCT, CURRENCY_MISMATCH, NO_AMOUNT, OTHER_VENDOR, OTHER_LEGAL_ENTITY] }
        hasMore: { type: boolean, description: True when the run stopped at 100 settlements or the inventory journal list was cut at its page bound; run again. }
    ReleaseAuditBlockRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId]
      properties:
        legalEntityId: { type: string, format: uuid, description: Must be the legal entity of the invoice. }
    RejectAuditBlockRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, reason]
      properties:
        legalEntityId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 500, description: Trimmed. }
    ErsRunRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, postingDate, fiscalPeriodId]
      description: At least one of vendorId and purchaseOrderId is required.
      properties:
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        purchaseOrderId: { type: string, format: uuid }
        postingDate: { type: string, format: date, description: The invoice date and the ledger posting date of the self-billed invoices. }
        ledgerId: { type: string, format: uuid }
        fiscalPeriodId: { type: string, format: uuid }
    ErsRun:
      type: object
      required: [settled, skipped, hasMore]
      properties:
        settled:
          type: array
          items:
            type: object
            required: [invoiceId, invoiceNumber, receiptId, receiptNumber, vendorId, currency, total, status, ledgerEntryId]
            properties:
              invoiceId: { type: string, format: uuid }
              invoiceNumber: { type: string, description: 'ERS-{receipt number}' }
              receiptId: { type: string, format: uuid }
              receiptNumber: { type: string }
              vendorId: { type: string, format: uuid }
              currency: { type: string }
              total: { type: string }
              status: { type: string, enum: [POSTED, AUDIT_BLOCKED] }
              ledgerEntryId: { type: string }
        skipped:
          type: array
          items:
            type: object
            required: [sourceRef, reason]
            properties:
              sourceRef: { type: string, description: The receipt number. }
              reason: { type: string, enum: [RECEIPT_NOT_POSTED, OTHER_LEGAL_ENTITY, NOT_ERS_VENDOR, PO_NOT_FOUND, PO_FORBIDDEN, PO_NOT_APPROVED, CURRENCY_MISMATCH, OTHER_VENDOR, NO_PO_LINE, AMBIGUOUS_PO_LINE, ALREADY_INVOICED, PARTIALLY_INVOICED, ALREADY_SETTLED, PLAN_SETTLED, LINE_INVOICED, PRICE_CHANGED, PRICE_CONFIRMED_BY_RUNNER, TAX_NOT_DETERMINED, PARTY_DATA_INCOMPLETE] }
        hasMore: { type: boolean, description: True when the run stopped at 100 invoices or at the scan bound; run again. }
    ErsVendorRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, enabled]
      properties:
        legalEntityId: { type: string, format: uuid }
        enabled: { type: boolean }
    ErsVendor:
      type: object
      required: [legalEntityId, vendorId, enabled]
      properties:
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        enabled: { type: boolean }
    AuditPolicyRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, sampleRatePct]
      properties:
        legalEntityId: { type: string, format: uuid }
        sampleRatePct: { type: [number, string], minimum: 0, maximum: 100, description: At most two decimals. }
        thresholdAmount: { type: [number, string], exclusiveMinimum: 0, description: 'BR-18.14: an invoice below it in thresholdCurrency is blocked with probability rate x total / threshold; omit for a flat rate.' }
        thresholdCurrency: { type: string, pattern: '^[A-Z]{3}$', description: Required with thresholdAmount; invoices in another currency are drawn at the full rate. }
    AuditPolicy:
      type: object
      required: [legalEntityId, sampleRatePct, ruleVersion]
      properties:
        legalEntityId: { type: string, format: uuid }
        sampleRatePct: { type: string }
        thresholdAmount: { type: string }
        thresholdCurrency: { type: string }
        ruleVersion: { type: integer, minimum: 1, description: Bumped whenever the rate or threshold changes; each invoice records the version its draw used. }
    Status:
      type: string
      enum: [NOT_MATCHED, MATCHED, PRICE_VARIANCE, QTY_VARIANCE, TOTAL_VARIANCE, NO_RECEIPT, WAITING_RECEIPT]
    EvaluateResponse:
      type: object
      required: [status, lines, totalVariance, postings]
      properties:
        status: { $ref: '#/components/schemas/Status' }
        totalVariance: { $ref: '#/components/schemas/Money' }
        lines:
          type: array
          items:
            type: object
            properties:
              unit: { type: string }
              status: { $ref: '#/components/schemas/Status' }
              priceVariance: { $ref: '#/components/schemas/Money' }
              currencyMismatch: { type: boolean }
        postings:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [PPV, SMALL_DIFF] }
              amount: { $ref: '#/components/schemas/Money' }
