openapi: 3.1.0
info:
  title: receiving
  version: 0.1.0
  description: Receiving, product receipts and three-way match. This slice serves the pure matching policy tester and probes.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/receiving/matching:evaluate:
    post:
      operationId: evaluateMatching
      x-passage-duty: MatchingPolicyMaintain
      description: Pure policy tester. Evaluates an invoice against a matching policy without persisting anything; the Idempotency-Key header is accepted and has no effect because evaluation is side-effect free.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateRequest' }
      responses:
        '200':
          description: Match result per line and for the header, with the postings an accepted invoice would create.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvaluateResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable or slower than 500 ms. }
  /metrics:
    get:
      operationId: metrics
      x-passage-duty: public
      description: Served on the admin port only.
      responses:
        '200': { description: Prometheus text format. }
components:
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: 'Stable code such as COM-0001, AUTH-0001, AUTH-0003.' }
        serviceCode: { type: string, description: 'Not emitted yet: platform/go/httpx.Problem has no such field.' }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, description: Decimal string at the currency minor unit. }
        currency: { type: string, minLength: 3, maxLength: 3 }
    Policy:
      type: object
      additionalProperties: false
      properties:
        matchLevel: { type: string, enum: [NONE, TWO_WAY, THREE_WAY], default: THREE_WAY }
        priceTolPct: { type: number, minimum: 0, default: 2.0 }
        priceTolAbs: { type: number, minimum: 0, default: 25.00 }
        qtyTolPct: { type: number, minimum: 0, default: 5.0 }
        totalTolPct: { type: number, minimum: 0, default: 1.0 }
        totalTolAbs: { type: number, minimum: 0, default: 50.00 }
        smallDiffAbs: { type: number, minimum: 0, default: 0.50 }
        priceTolMode: { type: string, enum: [UPPER_ONLY, BOTH], default: UPPER_ONLY }
    Line:
      type: object
      additionalProperties: false
      required: [qty, unitPrice, poUnitPrice]
      properties:
        qty: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, description: Unit of measure, echoed in the response. }
        unitPrice: { type: number, minimum: 0 }
        poUnitPrice: { type: number, minimum: 0 }
        poCurrency: { type: string, description: Absent means the invoice currency; a different value yields PRICE_VARIANCE with currencyMismatch. }
        receiptState: { type: string, enum: [REGISTERED, POSTED], description: Absent means no receipt exists. }
        receivedUninvoicedQty: { type: number, minimum: 0, default: 0 }
        poQtyRemaining: { type: number, minimum: 0, default: 0 }
    EvaluateRequest:
      type: object
      additionalProperties: false
      required: [currency, headerTotal, lines]
      properties:
        policy: { $ref: '#/components/schemas/Policy' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        headerTotal: { type: number }
        charges: { type: number, minimum: 0, default: 0 }
        tax: { type: number, minimum: 0, default: 0 }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/Line' }
    Status:
      type: string
      enum: [NOT_MATCHED, MATCHED, PRICE_VARIANCE, QTY_VARIANCE, TOTAL_VARIANCE, NO_RECEIPT, WAITING_RECEIPT]
    EvaluateResponse:
      type: object
      required: [status, lines, totalVariance, postings]
      properties:
        status: { $ref: '#/components/schemas/Status' }
        totalVariance: { $ref: '#/components/schemas/Money' }
        lines:
          type: array
          items:
            type: object
            properties:
              unit: { type: string }
              status: { $ref: '#/components/schemas/Status' }
              priceVariance: { $ref: '#/components/schemas/Money' }
              currencyMismatch: { type: boolean }
        postings:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [PPV, SMALL_DIFF] }
              amount: { $ref: '#/components/schemas/Money' }
