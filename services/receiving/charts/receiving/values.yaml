image:
  repository: ghcr.io/benjaminsrussell/receiving
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: receiving-db
migrateOnStart: false
replicaCount: 1
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor:
  enabled: true
  interval: 30s
alerts:
  enabled: true
  labels: {}
  severity: page
  errorRatio: 0.01
  p99LatencySeconds: 4
