image:
  repository: ghcr.io/benjaminsrussell/receiving
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: receiving-db
auditSeedSecret: receiving-audit-seed
migrateOnStart: false
serviceUrls:
  ledger: ""
  close: ""
  purchasing: ""
  inventory: ""
# postingProfile values are required outside dev: the pod exits at startup with "POSTING_LEDGER_ID is required" when ledgerId is empty.
# serviceUrls.purchasing defaults to http://purchasing-purchasing.<namespace>.svc, the Service the purchasing chart renders for a release named "purchasing".
postingProfile:
  ledgerId: ""
  inventoryAccount: ""
  grirAccount: ""
  ppvAccount: ""
  vendorControlAccount: ""
replicaCount: 1
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor:
  enabled: true
  interval: 30s
alerts:
  enabled: true
  labels: {}
  severity: page
  errorRatio: 0.01
  p99LatencySeconds: 4

serviceIdentity:
  signingKeySecret: ""
  keyId: ""

fieldCrypt:
  keysSecret: ""
  currentKeyId: ""
