image:
  repository: ghcr.io/benjaminsrussell/receiving
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: receiving-db
auditSeedSecret: receiving-audit-seed
migrateOnStart: false
serviceUrls:
  ledger: ""
  close: ""
  purchasing: ""
  inventory: ""
  party: ""
  org: ""
  tax: ""
  compliance: ""
# postingProfile values are required outside dev: the pod exits at startup with "POSTING_LEDGER_ID is required" when ledgerId is empty.
# serviceUrls.purchasing defaults to http://purchasing-purchasing.<namespace>.svc, the Service the purchasing chart renders for a release named "purchasing".
postingProfile:
  ledgerId: ""
  inventoryAccount: ""
  grirAccount: ""
  ppvAccount: ""
  vendorControlAccount: ""
  expenseAccount: ""
  inputTaxAccount: ""
# tax.rules is required when serviceUrls.tax is set: a JSON array of {"country","code","jurisdiction","ratePct"}, one entry per legal entity country.
# A receipt whose legal entity country has no rule is skipped as TAX_NOT_DETERMINED; it is never settled at zero tax.
tax:
  rules: ""
# legalEntityCountries maps legal entity ids to ISO country codes ("<uuid>=GB,<uuid>=DE"); one-time payee erasure keeps every payee of an entity that is not listed.
legalEntityCountries: ""
# ocrProvider selects the invoice OCR extractor: "" (OCR captures answer 503) or "local" (reads the text layer of a PDF; no network, no key).
ocrProvider: ""
replicaCount: 1
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor:
  enabled: true
  interval: 30s
alerts:
  enabled: true
  labels: {}
  severity: page
  errorRatio: 0.01
  p99LatencySeconds: 4

serviceIdentity:
  signingKeySecret: ""
  keyId: ""

fieldCrypt:
  keysSecret: ""
  currentKeyId: ""

consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: receiving-ers
    username: receiving-consumer
    secret: ""
