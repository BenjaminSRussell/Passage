apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: receiving
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: receiving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: receiving
    spec:
      securityContext:
        runAsNonRoot: true
        {{- if or .Values.serviceIdentity.signingKeySecret .Values.fieldCrypt.keysSecret }}
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- if or .Values.serviceIdentity.signingKeySecret .Values.fieldCrypt.keysSecret }}
      volumes:
{{- if .Values.serviceIdentity.signingKeySecret }}
        - name: service-identity
          secret:
            secretName: {{ .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
{{- end }}
{{- if .Values.fieldCrypt.keysSecret }}
        - name: field-crypt
          secret:
            secretName: {{ .Values.fieldCrypt.keysSecret }}
            defaultMode: 0440
{{- end }}
      {{- end }}
      containers:
        - name: receiving
          image: {{ include "receiving.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            {{- include "passage.cloudEnv" $ | nindent 12 }}
            {{- include "receiving.env" . | nindent 12 }}
          {{- if or .Values.serviceIdentity.signingKeySecret .Values.fieldCrypt.keysSecret }}
          volumeMounts:
{{- if .Values.serviceIdentity.signingKeySecret }}
            - { name: service-identity, mountPath: /var/run/passage/service-identity, readOnly: true }
{{- end }}
{{- if .Values.fieldCrypt.keysSecret }}
            - { name: field-crypt, mountPath: /var/run/passage/field-crypt, readOnly: true }
{{- end }}
          {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
