openapi: 3.1.0
info:
  title: Passage Lean Manufacturing
  version: 0.4.0
  description: >
    Lean manufacturing (wave 24, PSG-24 slices 1 to 5): production flows with their
    activities, kanban rules, kanban cards with one job per flow activity, the
    kanban board, the work-cell board of jobs and flow costing periods. Routes match the
    handlers in internal/api (checked by internal/api/openapi_test.go). Errors are
    RFC 9457 problem details (application/problem+json) with a stable `code`; see
    README.md. The gateway routes /api/v1/lean/* to this service.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/lean/flows:
    post:
      operationId: createFlow
      summary: Create a draft production flow with its activities (FR-24.8)
      x-passage-duty: lean.flow.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FlowRequest' } } }
      responses:
        '201':
          description: 'Created in status draft. A replay returns 200 with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Flow' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409':
          description: LEAN-0105 when the value stream already has a flow with this name, or activity names repeat.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listFlows
      summary: Production flows, newest first (activities omitted; activityCount given)
      x-passage-duty: lean.read
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/FlowStatus' } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Flows
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Flow' } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/flows/{id}:
    get:
      operationId: getFlow
      summary: One production flow with its activities in sequence order
      x-passage-duty: lean.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The flow
          content: { application/json: { schema: { $ref: '#/components/schemas/Flow' } } }
        '404':
          description: LEAN-0101
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/flows/{id}:activate:
    post:
      operationId: activateFlow
      summary: Validate connectivity and activate a draft flow (FR-24.8)
      x-passage-duty: lean.flow.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1, description: The flow version the caller read (optimistic concurrency). }
                activeFrom: { type: string, format: date, description: Defaults to today (UTC). }
                activeTo: { type: string, format: date }
      responses:
        '200':
          description: 'The active flow with version + 1. A replay returns the first answer with Idempotent-Replayed: true. Writes dev.passage.lean.flow.activated.v1.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Flow' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: LEAN-0101
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: LEAN-0104 when the version is stale; LEAN-0106 when the flow is not a draft.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: LEAN-0004 when a process activity has no output location; idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/flows/{id}/costing-periods:
    post:
      operationId: openCostingPeriod
      summary: Open a costing period of a flow (FR-24.12)
      x-passage-duty: lean.flow.settle
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PeriodRequest' } } }
      responses:
        '201':
          description: 'The open period. A replay returns 200 with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CostingPeriod' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: LEAN-0101 when the flow does not exist.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: LEAN-0109 when the dates overlap another period of the flow.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCostingPeriods
      summary: A flow's costing periods, latest first (FR-24.12, PRD 4.24.14 flow costing period)
      x-passage-duty: lean.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The periods.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CostingPeriod' } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: LEAN-0101 when the flow does not exist.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/flows/{id}/costing-periods:export:
    get:
      operationId: exportCostingPeriods
      summary: A flow's costing periods as CSV, oldest first (PRD 4.24.14 flow costing period report)
      x-passage-duty: lean.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: >-
            One header row (period_start, period_end, status, currency, material_cost, conversion_cost,
            output_value, variance, kanbans, settled_at, settled_by, journal_entry_id) and one row per period,
            at most 200. Open periods have empty amounts. Sent as an attachment.
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: LEAN-0101 when the flow does not exist.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/flows/{id}/costing-periods/{periodId}:settle:
    post:
      operationId: settleCostingPeriod
      summary: Settle a period after its last day with variance = material + conversion − output (BR-24.9, AC-24.8)
      x-passage-duty: lean.flow.settle
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: periodId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettleRequest' } } }
      responses:
        '200':
          description: 'The settled period with version + 1. A replay returns the first answer with Idempotent-Replayed: true. Writes dev.passage.lean.flowperiod.settled.v1.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CostingPeriod' } } }
        '400':
          description: COM-0001, including an amount with more decimals than the period currency's minor unit.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: LEAN-0110 when the period does not exist on this flow.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: >-
            LEAN-0003 (FLOW_PERIOD_OPEN_KANBANS) listing the cards with jobs in the period that are not
            completed or emptied; LEAN-0104 when the version is stale; LEAN-0111 when the period is already
            settled; LEAN-0112 when the period's last day has not passed (UTC).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/flows/{id}/costing-periods/{periodId}:backflush:
    post:
      operationId: previewBackflush
      summary: Preview the conversion cost of a period by backflush, cycle time × cost rate per activity (FR-24.12)
      description: >-
        For every activity of the flow, the kanban jobs completed within the period's days (UTC), including
        those of cards reused since, and the quantity they processed (reported plus scrap). Hours are the
        activity's cycle time per unit × that quantity; cost is hours × the activity's hourly rate in the
        period currency, rounded once per activity to the minor unit, and conversionCost is the sum of the
        activity costs. Service activities are priced by their purchase agreement (FR-24.20) and get no
        rate here. Nothing is stored, so no Idempotency-Key is taken; the settle command takes the amounts.
      x-passage-duty: lean.flow.settle
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: periodId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BackflushRequest' } } }
      responses:
        '200':
          description: The conversion cost by activity, in sequence order.
          content: { application/json: { schema: { $ref: '#/components/schemas/BackflushPreview' } } }
        '400':
          description: >-
            COM-0001: a malformed or duplicate rate, a rate for an activity that is not in the flow or is a
            service activity, a negative rate or one with more than six decimals, or no rate for a process or
            transfer activity with completed jobs in the period.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: LEAN-0110 when the period does not exist on this flow.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/kanban-rules:
    post:
      operationId: createKanbanRule
      summary: Create a kanban rule (FR-24.9)
      x-passage-duty: lean.kanban-rule.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RuleRequest' } } }
      responses:
        '201':
          description: 'Created. A replay returns 200 with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Rule' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: LEAN-0101 when flowId names no flow.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: LEAN-0105 when the code is taken.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listKanbanRules
      summary: Kanban rules ordered by code, with their active card count
      x-passage-duty: lean.read
      parameters:
        - { name: flowId, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Rule' } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/kanban-rules/{id}:
    get:
      operationId: getKanbanRule
      summary: One kanban rule
      x-passage-duty: lean.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The rule
          content: { application/json: { schema: { $ref: '#/components/schemas/Rule' } } }
        '404':
          description: LEAN-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/kanban-rules/{id}/analysis:
    get:
      operationId: analyseKanbanRule
      summary: Kanban rule analysis over a period (PRD 4.24.14)
      description: >-
        Cycles are the completions of the rule's cards within the period's days (UTC); a reused card counts
        once per completion. Lead time runs from planning (when the rule's lead time starts and the due time
        is set) to completion. A cycle is late when it completed after its due time.
      x-passage-duty: lean.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: from, in: query, schema: { type: string, format: date }, description: 'First day, inclusive (UTC). Default: 29 days before to.' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Last day, inclusive (UTC). Default: today.' }
      responses:
        '200':
          description: The rule's KPI.
          content: { application/json: { schema: { $ref: '#/components/schemas/RuleAnalysis' } } }
        '400':
          description: COM-0001 for a malformed date, to before from, or a period longer than 366 days.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: LEAN-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/kanban-rules/{id}/count-check:
    get:
      operationId: checkKanbanRuleCount
      summary: Fixed-kanban count check for one rule (PRD 4.24.16, BR-24.7)
      description: >-
        The weekly fixed-kanban count suggestion, run on demand for one fixed rule: the BR-24.7
        suggestion ⌈dailyDemand × leadTimeH / 24 × (1 + safetyPct / 100) / fixedQty⌉ from the rule's
        lead time and fixed quantity, against its number of kanbans. A deviation above 25 % is
        reported. Advisory: it writes nothing and never changes the rule.
      x-passage-duty: lean.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: dailyDemand, in: query, required: true, schema: { $ref: '#/components/schemas/Decimal' }, description: 'Daily demand in the rule item''s unit, 0 or more, at most 6 decimals.' }
        - { name: safetyPct, in: query, schema: { $ref: '#/components/schemas/Decimal' }, description: 'Safety stock in percent, 0 (default) to below 1000.' }
      responses:
        '200':
          description: The configured and suggested counts and the deviation.
          content: { application/json: { schema: { $ref: '#/components/schemas/CountCheck' } } }
        '400':
          description: COM-0001 for a malformed id, a missing, negative or malformed demand, or a malformed or out-of-range safety.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: LEAN-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: LEAN-0113 when the rule is not a fixed rule.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/kanban-rules:fixed-count:
    post:
      operationId: suggestFixedKanbanCount
      summary: Suggest the number of kanbans for a fixed rule (BR-24.7). Writes nothing and is never applied automatically.
      x-passage-duty: lean.kanban-rule.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FixedCountRequest' } } }
      responses:
        '200':
          description: The suggested number of kanbans.
          content:
            application/json:
              schema:
                type: object
                properties:
                  numberOfKanbans: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/kanbans:generate:
    post:
      operationId: generateKanbans
      summary: Generate kanbans for a fixed or event rule (FR-24.9, FR-24.11, BR-24.7, BR-24.8)
      description: >
        A fixed rule creates `count` cards in Not planned (0 or omitted fills the rule to its
        number of kanbans). An event rule creates ⌈demandQty / fixedQty⌉ cards in Planned, due
        at `due` or now + lead time, each referencing the triggering line; the last card is full
        size unless the rule has exactQty. Cards are numbered <rule code>-0001, -0002, ... A
        scheduled rule's kanbans come from master planning (wave 22) and are refused here.
      x-passage-duty: lean.kanban.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GenerateRequest' } } }
      responses:
        '201':
          description: 'The created cards. A replay returns the first answer with 200 and Idempotent-Replayed: true. Writes dev.passage.lean.kanban.created.v1 per card.'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Kanban' } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: LEAN-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: LEAN-0002 when a fixed rule would exceed its number of kanbans.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: LEAN-0107 when the rule is scheduled or not effective today; idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/kanbans/{id}:
    get:
      operationId: getKanban
      summary: One kanban card
      x-passage-duty: lean.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The card
          content: { application/json: { schema: { $ref: '#/components/schemas/Kanban' } } }
        '404':
          description: LEAN-0103
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/kanbans/{id}:move:
    post:
      operationId: moveKanban
      summary: Move a card one step through the kanban state machine (BR-24.6)
      description: >
        Forward moves are one step at a time: Not planned → Planned → Prepared → In progress →
        Completed → Emptied. The backward moves are Planned → Not planned and, for fixed rules
        only, Emptied → Not planned (card reuse, which counts against the rule's number of
        kanbans again). Moving to Planned sets the due date from the rule lead time when none
        is set; moving back to Not planned clears it. A card with jobs (its rule has a flow)
        reaches In progress and Completed only through its jobs (LEAN-0001 here); its jobs
        follow it to Not planned, Planned and Prepared, and reuse clears what they reported.
      x-passage-duty: lean.kanban.work
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, version]
              properties:
                to: { $ref: '#/components/schemas/KanbanState' }
                version: { type: integer, minimum: 1, description: The card version the caller read. }
      responses:
        '200':
          description: 'The moved card with version + 1. A replay returns the first answer with Idempotent-Replayed: true. Writes dev.passage.lean.kanban.statechanged.v1.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Kanban' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: LEAN-0103
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: LEAN-0001 when the move is not allowed (AC-24.7); LEAN-0002 when card reuse would exceed the rule; LEAN-0104 when the version is stale.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/board:
    get:
      operationId: getKanbanBoard
      summary: The kanban board by card state, or the work-cell board of jobs (FR-24.10)
      description: >
        Without workCellId: one column per card state with every card that is not emptied, plus
        emptied fixed-rule cards waiting for reuse, oldest due first, at most 500 cards. Spent
        event-rule cards are left out. With workCellId: the work-cell board, one column per job
        state (Not planned to Completed) with the jobs at that work cell's activities whose card
        is not emptied, oldest due card first, at most 500 jobs. truncated is true when the limit
        was reached.
      x-passage-duty: lean.kanban.work
      parameters:
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: flowId, in: query, schema: { type: string, format: uuid } }
        - { name: ruleId, in: query, schema: { type: string, format: uuid } }
        - { name: workCellId, in: query, description: The work cell (wave-9 resource) whose jobs to show., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Board columns in state order; CardBoard without workCellId, JobBoard with it.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CardBoard'
                  - $ref: '#/components/schemas/JobBoard'
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/kanban-jobs/{id}:start:
    post:
      operationId: startKanbanJob
      summary: Start a kanban job on the work-cell board (FR-24.10, BR-24.6)
      description: >
        A Planned or Prepared job moves to In progress. The first started job of a card moves the
        card to In progress; a card still Planned passes through Prepared first, which an activity
        that requires picking refuses (move the card to Prepared once picking is done). The card's
        other jobs follow it to Prepared. A completed or running job, or a card that is not
        Planned, Prepared or In progress, is LEAN-0001.
      x-passage-duty: lean.kanban.work
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1, description: The job version the caller read. }
      responses:
        '200':
          description: >
            The started job with version + 1. A replay returns the first answer with
            Idempotent-Replayed: true. Writes dev.passage.lean.kanbanjob.statechanged.v1 and, for
            each card step, dev.passage.lean.kanban.statechanged.v1 with the jobId.
          content: { application/json: { schema: { $ref: '#/components/schemas/KanbanJob' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: LEAN-0108
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: LEAN-0001 when the job or its card cannot start; LEAN-0104 when the version is stale.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/kanban-jobs/{id}:complete:
    post:
      operationId: completeKanbanJob
      summary: Complete a kanban job with quantity, scrap and handling units (FR-24.10)
      description: >
        Only an In progress job completes: a Planned job dragged to Completed is LEAN-0001
        (AC-24.7). The last job of a card to complete moves the card to Completed with the job's
        handling units (BR-24.6); that card event carries the job's report and triggers the
        report as finished (manufacturing) or the transfer (withdrawal).
      x-passage-duty: lean.kanban.work
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reportedQty]
              properties:
                version: { type: integer, minimum: 1, description: The job version the caller read. }
                reportedQty: { $ref: '#/components/schemas/Report', description: 'The good quantity; 0 when all was scrapped.' }
                scrapQty: { $ref: '#/components/schemas/Report', description: Defaults to 0. reportedQty + scrapQty must be above 0. }
                handlingUnits: { type: integer, minimum: 1, maximum: 100000, default: 1 }
      responses:
        '200':
          description: >
            The completed job with version + 1 and cardState. A replay returns the first answer
            with Idempotent-Replayed: true. Writes dev.passage.lean.kanbanjob.statechanged.v1 and,
            when the card completes, dev.passage.lean.kanban.statechanged.v1.
          content: { application/json: { schema: { $ref: '#/components/schemas/KanbanJob' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: LEAN-0108
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: LEAN-0001 when the job is not In progress (AC-24.7); LEAN-0104 when the version is stale.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lean/subcontracting:preview:
    post:
      operationId: previewSubcontractLines
      summary: Purchase order lines for completed service jobs on vendor work cells (FR-24.20, BR-24.16)
      description: >
        Stores nothing. po-per-kanban gives one line per job; periodic-po one line per vendor,
        service item and price. Each job is priced by the purchase agreement valid on its
        completion date (the newest when several overlap); amounts round to the currency's
        minor unit.
      x-passage-duty: lean.flow.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, agreements, jobs]
              properties:
                mode: { type: string, enum: [po-per-kanban, periodic-po] }
                agreements:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [vendorId, itemId, unitPrice, currency, validFrom]
                    properties:
                      vendorId: { type: string, minLength: 1, maxLength: 80 }
                      itemId: { type: string, minLength: 1, maxLength: 80 }
                      unitPrice: { $ref: '#/components/schemas/Decimal' }
                      currency: { type: string, pattern: '^[A-Z]{3}$' }
                      validFrom: { type: string, format: date }
                      validTo: { type: string, format: date, nullable: true, description: Inclusive; null is open-ended. }
                jobs:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [jobId, vendorId, itemId, qty, completedOn]
                    properties:
                      jobId: { type: string, minLength: 1, maxLength: 80 }
                      vendorId: { type: string, minLength: 1, maxLength: 80 }
                      itemId: { type: string, minLength: 1, maxLength: 80 }
                      qty: { $ref: '#/components/schemas/Decimal' }
                      completedOn: { type: string, format: date }
      responses:
        '200':
          description: The purchase order lines.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string }
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        vendorId: { type: string }
                        itemId: { type: string }
                        qty: { $ref: '#/components/schemas/Decimal' }
                        unitPrice: { $ref: '#/components/schemas/Decimal' }
                        currency: { type: string }
                        priceDate: { type: string, format: date }
                        amount: { $ref: '#/components/schemas/Decimal' }
                        jobIds: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/Problem' }
        '422':
          description: LEAN-0005 when no purchase agreement prices a job's service item on its completion date.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: healthz
      summary: Liveness
      security: []
      responses:
        '200': { description: Process is up }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness (Postgres reachable)
      security: []
      responses:
        '200': { description: Ready }
        '503': { description: Database unreachable }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1 to 200 characters. A retry with the same key and body returns the first answer; a different body is idempotency_key_reuse (422).
      schema: { type: string, minLength: 1, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  schemas:
    Decimal:
      type: string
      description: Decimal as a JSON string (numbers are accepted on input).
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    Quantity:
      type: string
      description: Positive decimal below 10^12 with at most 6 decimals.
      pattern: '^[0-9]{1,12}(\.[0-9]{1,6})?$'
    FlowStatus:
      type: string
      enum: [draft, active, expired]
    ActivityKind:
      type: string
      enum: [process, transfer, service]
    KanbanState:
      type: string
      enum: [not-planned, planned, prepared, in-progress, completed, emptied]
    JobState:
      type: string
      enum: [not-planned, planned, prepared, in-progress, completed]
    Report:
      type: string
      description: Decimal from 0 to below 10^12 with at most 6 decimals.
      pattern: '^[0-9]{1,12}(\.[0-9]{1,6})?$'
    ActivityRequest:
      type: object
      required: [sequence, name, kind]
      properties:
        sequence: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { $ref: '#/components/schemas/ActivityKind' }
        cycleTimeS: { type: integer, minimum: 0 }
        workCellResourceId: { type: [string, 'null'], format: uuid }
        inputLocationId: { type: [string, 'null'], format: uuid }
        outputLocationId: { type: [string, 'null'], format: uuid, description: Required on process activities before activation (LEAN-0004). }
        predecessors: { type: array, items: { type: integer }, description: Sequence numbers of other activities of this flow. }
        pickingRequired: { type: boolean, default: false }
    Activity:
      allOf:
        - $ref: '#/components/schemas/ActivityRequest'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    FlowRequest:
      type: object
      required: [valueStreamId, siteId, name, activities]
      properties:
        valueStreamId: { type: string, format: uuid, description: The wave-6 operating unit of type value stream. }
        siteId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        taktTimeS: { type: [integer, 'null'], minimum: 1 }
        activities: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/ActivityRequest' } }
    Flow:
      type: object
      required: [id, valueStreamId, siteId, name, status, version, activityCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        valueStreamId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        name: { type: string }
        taktTimeS: { type: [integer, 'null'] }
        status: { $ref: '#/components/schemas/FlowStatus' }
        activeFrom: { type: [string, 'null'], format: date }
        activeTo: { type: [string, 'null'], format: date }
        version: { type: integer }
        activityCount: { type: integer }
        activities: { type: array, items: { $ref: '#/components/schemas/Activity' }, description: Present on create, get and activate, omitted in lists. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RuleRequest:
      type: object
      required: [code, itemId, siteId, ruleType, replenishment, fixedQty]
      properties:
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_.-]{0,31}$' }
        itemId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        flowId: { type: [string, 'null'], format: uuid }
        ruleType: { type: string, enum: [manufacturing, withdrawal] }
        replenishment: { type: string, enum: [fixed, scheduled, event] }
        fixedQty: { $ref: '#/components/schemas/Quantity' }
        numberOfKanbans: { type: [integer, 'null'], minimum: 1, maximum: 1000, description: Required on fixed rules, refused on others. }
        leadTimeH: { type: integer, minimum: 0, maximum: 8760, default: 0 }
        eventSource: { type: [string, 'null'], enum: [sales, bom, kanban, min-stock, null], description: Required on event rules, refused on others. }
        exactQty: { type: boolean, default: false, description: 'Event rules: the last card holds the remainder instead of a full fixedQty (BR-24.8).' }
        effectiveFrom: { type: string, format: date, description: Defaults to today (UTC). }
        effectiveTo: { type: [string, 'null'], format: date }
    Rule:
      type: object
      required: [id, code, itemId, siteId, ruleType, replenishment, fixedQty, leadTimeH, exactQty, effectiveFrom, version, activeKanbans, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        itemId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        flowId: { type: [string, 'null'], format: uuid }
        ruleType: { type: string, enum: [manufacturing, withdrawal] }
        replenishment: { type: string, enum: [fixed, scheduled, event] }
        fixedQty: { $ref: '#/components/schemas/Decimal' }
        numberOfKanbans: { type: [integer, 'null'] }
        leadTimeH: { type: integer }
        eventSource: { type: [string, 'null'] }
        exactQty: { type: boolean }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
        version: { type: integer }
        activeKanbans: { type: integer, description: Cards that are not emptied (BR-24.7). }
        createdAt: { type: string, format: date-time }
    FixedCountRequest:
      type: object
      required: [dailyDemand, leadTimeDays, safetyPct, fixedQty]
      properties:
        dailyDemand: { $ref: '#/components/schemas/Decimal' }
        leadTimeDays: { $ref: '#/components/schemas/Decimal' }
        safetyPct: { $ref: '#/components/schemas/Decimal' }
        fixedQty: { $ref: '#/components/schemas/Decimal' }
    GenerateRequest:
      type: object
      required: [ruleId]
      properties:
        ruleId: { type: string, format: uuid }
        count: { type: integer, minimum: 0, maximum: 1000, description: 'Fixed rules: cards to add; 0 or omitted fills the rule.' }
        demandQty: { $ref: '#/components/schemas/Quantity' }
        eventRefType: { type: [string, 'null'], maxLength: 80, description: 'Event rules: the triggering line type, for example sales-line.' }
        eventRefId: { type: [string, 'null'], maxLength: 80 }
        due: { type: [string, 'null'], format: date-time }
    Kanban:
      type: object
      required: [id, ruleId, ruleCode, itemId, ruleType, replenishment, cardNumber, qty, state, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        ruleCode: { type: string }
        itemId: { type: string, format: uuid }
        ruleType: { type: string, enum: [manufacturing, withdrawal] }
        replenishment: { type: string, enum: [fixed, scheduled, event] }
        cardNumber: { type: string, example: MIX-A-0001 }
        qty: { $ref: '#/components/schemas/Decimal' }
        state: { $ref: '#/components/schemas/KanbanState' }
        due: { type: [string, 'null'], format: date-time }
        eventRefType: { type: [string, 'null'] }
        eventRefId: { type: [string, 'null'] }
        handlingUnits: { type: [integer, 'null'], description: Reported by the card's last job when it completes. }
        jobCount: { type: integer, description: 'Jobs of the card, one per activity of the rule''s flow; 0 when the rule has no flow.' }
        jobs: { type: array, items: { $ref: '#/components/schemas/KanbanJob' }, description: 'The card''s jobs in sequence order; on get only.' }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    KanbanJob:
      type: object
      description: A card's work at one flow activity (PRD 4.24.4 KanbanJob), with the card and activity fields the board shows.
      required: [id, kanbanId, cardNumber, ruleId, ruleCode, itemId, ruleType, cardState, cardQty, activityId, activityName, activityKind, sequence, pickingRequired, state, version, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kanbanId: { type: string, format: uuid }
        cardNumber: { type: string }
        ruleId: { type: string, format: uuid }
        ruleCode: { type: string }
        itemId: { type: string, format: uuid }
        ruleType: { type: string, enum: [manufacturing, withdrawal] }
        cardState: { $ref: '#/components/schemas/KanbanState' }
        cardQty: { $ref: '#/components/schemas/Decimal' }
        due: { type: [string, 'null'], format: date-time }
        activityId: { type: string, format: uuid }
        activityName: { type: string }
        activityKind: { $ref: '#/components/schemas/ActivityKind' }
        sequence: { type: integer, minimum: 1 }
        workCellResourceId: { type: [string, 'null'], format: uuid }
        pickingRequired: { type: boolean }
        state: { $ref: '#/components/schemas/JobState' }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        reportedQty: { type: [string, 'null'], description: Decimal; set when completed. }
        scrapQty: { type: [string, 'null'], description: Decimal; set when completed. }
        handlingUnits: { type: [integer, 'null'], description: Set when completed. }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    Takt:
      type: [object, 'null']
      description: >
        Takt vs cycle (FR-24.14) when the board is filtered to a flow that has a takt time
        and activities: the slowest activity's cycle time against the takt time.
      properties:
        taktTimeS: { type: integer }
        cycleTimeS: { type: integer }
        bottleneckActivity: { type: string }
        withinTakt: { type: boolean }
    CardBoard:
      type: object
      required: [columns, truncated]
      properties:
        columns:
          type: array
          items:
            type: object
            required: [state, kanbans]
            properties:
              state: { $ref: '#/components/schemas/KanbanState' }
              kanbans: { type: array, items: { $ref: '#/components/schemas/Kanban' } }
        truncated: { type: boolean }
        takt: { $ref: '#/components/schemas/Takt' }
    JobBoard:
      type: object
      required: [workCellId, columns, truncated]
      properties:
        workCellId: { type: string, format: uuid }
        columns:
          type: array
          items:
            type: object
            required: [state, jobs]
            properties:
              state: { $ref: '#/components/schemas/JobState' }
              jobs: { type: array, items: { $ref: '#/components/schemas/KanbanJob' } }
        truncated: { type: boolean }
        takt: { $ref: '#/components/schemas/Takt' }
    PeriodRequest:
      type: object
      required: [periodStart, periodEnd, currency]
      properties:
        periodStart: { type: string, format: date, description: First day, inclusive (UTC). }
        periodEnd: { type: string, format: date, description: Last day, inclusive; not before periodStart. }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: ISO 4217 code of the period's amounts. }
    SettleRequest:
      type: object
      required: [version, materialCost, conversionCost, outputValue]
      description: >-
        The period's amounts, zero or more, with no more decimals than the currency's minor unit. The
        cards checked by BR-24.9 are found by the service, not supplied.
      properties:
        version: { type: integer, minimum: 1, description: The period version the caller read (optimistic concurrency). }
        materialCost: { $ref: '#/components/schemas/Decimal' }
        conversionCost: { $ref: '#/components/schemas/Decimal' }
        outputValue: { $ref: '#/components/schemas/Decimal' }
    CostingPeriod:
      type: object
      required: [id, flowId, periodStart, periodEnd, currency, status, version]
      properties:
        id: { type: string, format: uuid }
        flowId: { type: string, format: uuid }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        currency: { type: string }
        status: { type: string, enum: [open, settled] }
        materialCost: { type: [string, 'null'], description: Decimal at the currency's minor unit; null while open. }
        conversionCost: { type: [string, 'null'], description: Decimal at the currency's minor unit; null while open. }
        outputValue: { type: [string, 'null'], description: Decimal at the currency's minor unit; null while open. }
        variance: { type: [string, 'null'], description: 'materialCost + conversionCost − outputValue; negative when favourable; null while open.' }
        kanbans: { type: [integer, 'null'], description: Cards with jobs in the period at settlement. }
        journalEntryId: { type: [string, 'null'], format: uuid, description: Null until the ledger integration posts the journal. }
        settledAt: { type: [string, 'null'], format: date-time }
        settledBy: { type: [string, 'null'] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CountCheck:
      type: object
      required: [ruleId, ruleCode, dailyDemand, safetyPct, leadTimeH, fixedQty, configured, suggested, deviationPct, limitPct, reportable]
      properties:
        ruleId: { type: string, format: uuid }
        ruleCode: { type: string }
        dailyDemand: { $ref: '#/components/schemas/Decimal' }
        safetyPct: { $ref: '#/components/schemas/Decimal' }
        leadTimeH: { type: integer, description: 'The rule''s lead time in hours; the formula uses it in days (÷ 24).' }
        fixedQty: { $ref: '#/components/schemas/Decimal' }
        configured: { type: integer, description: 'The rule''s number of kanbans.' }
        suggested: { type: integer, description: 'The BR-24.7 suggestion; never applied automatically.' }
        deviationPct:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: '|suggested − configured| ÷ configured × 100, to two places.'
        limitPct: { type: integer, description: 'The deviation above which the check is reported (25).' }
        reportable: { type: boolean, description: 'The deviation is above limitPct.' }
    RuleAnalysis:
      type: object
      required: [ruleId, ruleCode, from, to, cycles, timedCycles, avgLeadTimeH, targetLeadTimeH, dueCycles, lateCycles, latePct, activeKanbans, maxKanbans, overdueOpen]
      properties:
        ruleId: { type: string, format: uuid }
        ruleCode: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        cycles: { type: integer, description: Card completions in the period. }
        timedCycles: { type: integer, description: Cycles with a recorded planning time; the average lead time is over these. }
        avgLeadTimeH: { type: [string, 'null'], description: Mean hours from planning to completion, two decimals; null when no cycle is timed. }
        targetLeadTimeH: { type: integer, description: The rule's lead time in hours. }
        dueCycles: { type: integer, description: Cycles with a due time. }
        lateCycles: { type: integer, description: Due cycles completed after their due time. }
        latePct: { type: [string, 'null'], description: lateCycles ÷ dueCycles × 100, two decimals; null when no cycle had a due time. }
        activeKanbans: { type: integer, description: Cards now in circulation (not emptied). }
        maxKanbans: { type: [integer, 'null'], description: The fixed rule's number of kanbans; null for scheduled and event rules. }
        overdueOpen: { type: integer, description: Active cards not yet completed whose due time has passed. }
    BackflushRequest:
      type: object
      required: [rates]
      properties:
        rates:
          type: array
          maxItems: 200
          items:
            type: object
            required: [activityId, ratePerHour]
            properties:
              activityId: { type: string, format: uuid }
              ratePerHour: { $ref: '#/components/schemas/Decimal', description: 'Cost per hour in the period currency: zero or more, below 10^14, at most six decimals.' }
    BackflushPreview:
      type: object
      required: [periodId, flowId, periodStart, periodEnd, currency, status, conversionCost, activities]
      properties:
        periodId: { type: string, format: uuid }
        flowId: { type: string, format: uuid }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        currency: { type: string }
        status: { type: string, enum: [open, settled] }
        conversionCost: { type: string, description: Sum of the activity costs at the currency's minor unit. }
        activities:
          type: array
          items:
            type: object
            required: [activityId, sequence, name, kind, cycleTimeS, jobs, processedQty, hours, ratePerHour, cost]
            properties:
              activityId: { type: string, format: uuid }
              sequence: { type: integer }
              name: { type: string }
              kind: { $ref: '#/components/schemas/ActivityKind' }
              cycleTimeS: { type: integer, description: Cycle time per unit in seconds. }
              jobs: { type: integer, description: Jobs completed in the period. }
              processedQty: { type: string, description: Reported plus scrap quantity of those jobs. }
              hours: { type: string, description: cycleTimeS × processedQty ÷ 3600, four decimals. }
              ratePerHour: { type: [string, 'null'], description: The rate given; null when none was given (no jobs) and for service activities. }
              cost: { type: [string, 'null'], description: Hours × rate at the currency's minor unit; null for service activities. }
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type: { type: string, example: 'https://passage.dev/problems/LEAN-0001' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors: { type: object, additionalProperties: { type: string } }
  responses:
    Problem:
      description: Problem details (application/problem+json).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
