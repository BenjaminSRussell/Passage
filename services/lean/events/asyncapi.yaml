asyncapi: 3.0.0
info:
  title: Passage Lean events
  version: 0.5.0
  description: >
    CloudEvents 1.0 published through the transactional outbox (Debezium
    outbox router), each in the same transaction as the change it reports.
    Event types follow dev.passage.<context>.<entity>.<verb>.v<n>. Payloads
    match internal/events/events.go. PRD 4.24.5 names the card transition
    passage.lean.kanban.state-changed.v1; the kernel rule allows no hyphen, so
    the verb is statechanged; job transitions use their own entity, kanbanjob,
    so that a job reaching completed is never mistaken for a card completion.
    The PRD's flow-period.settled is flowperiod.settled for the same reason.
defaultContentType: application/cloudevents+json
channels:
  flow:
    address: passage.lean.flow
    messages:
      flowActivated:
        $ref: '#/components/messages/FlowActivated'
      flowExpired:
        $ref: '#/components/messages/FlowExpired'
  kanban:
    address: passage.lean.kanban
    messages:
      kanbanCreated:
        $ref: '#/components/messages/KanbanCreated'
      kanbanStateChanged:
        $ref: '#/components/messages/KanbanStateChanged'
  kanbanjob:
    address: passage.lean.kanbanjob
    messages:
      jobStateChanged:
        $ref: '#/components/messages/JobStateChanged'
  flowperiod:
    address: passage.lean.flowperiod
    messages:
      flowPeriodSettled:
        $ref: '#/components/messages/FlowPeriodSettled'
operations:
  publishFlowActivated:
    action: send
    channel: { $ref: '#/channels/flow' }
    messages: [{ $ref: '#/channels/flow/messages/flowActivated' }]
    summary: A production flow passed connectivity and went live (production, planning consume it)
  publishFlowExpired:
    action: send
    channel: { $ref: '#/channels/flow' }
    messages: [{ $ref: '#/channels/flow/messages/flowExpired' }]
    summary: A production flow version was replaced by a newer version that went active (production, planning stop using it)
  publishKanbanCreated:
    action: send
    channel: { $ref: '#/channels/kanban' }
    messages: [{ $ref: '#/channels/kanban/messages/kanbanCreated' }]
    summary: A kanban card was generated for a fixed or event rule (production, shop floor consume it)
  publishKanbanStateChanged:
    action: send
    channel: { $ref: '#/channels/kanban' }
    messages: [{ $ref: '#/channels/kanban/messages/kanbanStateChanged' }]
    summary: >
      A card moved one step (BR-24.6). A manufacturing card reaching completed is
      the trigger for the kanban production order's report as finished (wave 21);
      a withdrawal card reaching completed triggers the inventory transfer (wave 16).
      A card with jobs moves to in-progress and completed through its jobs; those
      events carry the jobId, and the completion carries the last job's report.
  publishJobStateChanged:
    action: send
    channel: { $ref: '#/channels/kanbanjob' }
    messages: [{ $ref: '#/channels/kanbanjob/messages/jobStateChanged' }]
    summary: >
      A kanban job was started or completed on the work-cell board (FR-24.10);
      a completion carries the reported, scrap and handling-unit quantities
      (shop floor and lean subcontracting consume it). Jobs that follow their
      card to Not planned, Planned or Prepared are reported by the card's
      statechanged event only.
  publishFlowPeriodSettled:
    action: send
    channel: { $ref: '#/channels/flowperiod' }
    messages: [{ $ref: '#/channels/flowperiod/messages/flowPeriodSettled' }]
    summary: >
      A flow costing period was settled (FR-24.12, BR-24.9) with its material,
      conversion and output amounts and variance = material + conversion −
      output. The ledger (wave 13) posts the variance to the flow's posting
      profile; journalEntryId is null until that integration exists.
components:
  messages:
    FlowActivated:
      name: dev.passage.lean.flow.activated.v1
      summary: A production flow was activated and its activities are fixed
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/FlowActivatedData' }
    FlowExpired:
      name: dev.passage.lean.flow.expired.v1
      summary: A production flow version expired because a newer version was activated
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/FlowExpiredData' }
    KanbanCreated:
      name: dev.passage.lean.kanban.created.v1
      summary: A kanban card was generated from a rule or a demand line
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/KanbanCreatedData' }
    KanbanStateChanged:
      name: dev.passage.lean.kanban.statechanged.v1
      summary: A kanban card moved to another state (completion drives the replenishment transfer or order)
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/KanbanStateChangedData' }
    JobStateChanged:
      name: dev.passage.lean.kanbanjob.statechanged.v1
      summary: A kanban job moved to another state (service-activity completions drive subcontract POs)
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/JobStateChangedData' }
    FlowPeriodSettled:
      name: dev.passage.lean.flowperiod.settled.v1
      summary: A flow costing period was settled; the ledger posts the variance from it
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/FlowPeriodSettledData' }
  schemas:
    FlowPeriodSettledData:
      type: object
      required: [flowId, periodId, periodStart, periodEnd, currency, materialCost, conversionCost, outputValue, variance, kanbans, journalEntryId]
      properties:
        flowId: { type: string, format: uuid }
        periodId: { type: string, format: uuid }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        materialCost: { type: string, description: Decimal at the currency's minor unit. }
        conversionCost: { type: string, description: Decimal at the currency's minor unit. }
        outputValue: { type: string, description: Decimal at the currency's minor unit. }
        variance: { type: string, description: 'materialCost + conversionCost − outputValue; negative when favourable.' }
        kanbans: { type: integer, minimum: 0, description: Cards with jobs in the period, all completed or emptied. }
        journalEntryId: { type: [string, 'null'], format: uuid, description: Null until the ledger integration posts the journal. }
    FlowActivatedData:
      type: object
      required: [flowId, valueStreamId, siteId, name, activeFrom, activities, flowVersion, previousFlowId]
      properties:
        flowId: { type: string, format: uuid }
        valueStreamId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        name: { type: string }
        activeFrom: { type: string, format: date }
        activities: { type: integer }
        flowVersion: { type: integer, minimum: 1, description: 1 for a first version. }
        previousFlowId: { type: [string, 'null'], format: uuid, description: The flow version this one replaces; it is expired in the same transaction. }
    FlowExpiredData:
      type: object
      required: [flowId, name, flowVersion, activeTo, supersededBy]
      properties:
        flowId: { type: string, format: uuid }
        name: { type: string }
        flowVersion: { type: integer, minimum: 1 }
        activeTo: { type: string, format: date, description: The day before the new version starts. }
        supersededBy: { type: string, format: uuid, description: The flow that replaces it. }
    KanbanCreatedData:
      type: object
      required: [kanbanId, ruleId, cardNumber, itemId, ruleType, qty, state]
      properties:
        kanbanId: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        cardNumber: { type: string }
        itemId: { type: string, format: uuid }
        ruleType: { type: string, enum: [manufacturing, withdrawal] }
        qty: { type: string, description: Decimal as a string. }
        state: { type: string, enum: [not-planned, planned] }
        eventRefType: { type: [string, 'null'] }
        eventRefId: { type: [string, 'null'] }
        due: { type: [string, 'null'], format: date-time }
    KanbanStateChangedData:
      type: object
      required: [kanbanId, ruleId, cardNumber, itemId, ruleType, from, to, qty, version]
      properties:
        kanbanId: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        cardNumber: { type: string }
        itemId: { type: string, format: uuid }
        ruleType: { type: string, enum: [manufacturing, withdrawal] }
        from: { $ref: '#/components/schemas/KanbanState' }
        to: { $ref: '#/components/schemas/KanbanState' }
        qty: { type: string, description: Decimal as a string. }
        version: { type: integer }
        jobId: { type: string, format: uuid, description: Set when a job moved the card. }
        reportedQty: { type: string, description: 'Decimal as a string; the last job''s good quantity, on completion through jobs.' }
        scrapQty: { type: string, description: 'Decimal as a string; the last job''s scrap, on completion through jobs.' }
        handlingUnits: { type: integer, minimum: 1, description: 'The last job''s handling units, on completion through jobs.' }
    JobStateChangedData:
      type: object
      required: [jobId, kanbanId, cardNumber, itemId, activityId, activityKind, sequence, workCellResourceId, from, to, version]
      properties:
        jobId: { type: string, format: uuid }
        kanbanId: { type: string, format: uuid }
        cardNumber: { type: string }
        itemId: { type: string, format: uuid }
        activityId: { type: string, format: uuid }
        activityKind: { type: string, enum: [process, transfer, service] }
        sequence: { type: integer, minimum: 1 }
        workCellResourceId: { type: [string, 'null'], format: uuid }
        from: { $ref: '#/components/schemas/JobState' }
        to: { $ref: '#/components/schemas/JobState' }
        reportedQty: { type: string, description: Decimal as a string; set on completion. }
        scrapQty: { type: string, description: Decimal as a string; set on completion. }
        handlingUnits: { type: integer, minimum: 1, description: Set on completion. }
        version: { type: integer }
    JobState:
      type: string
      enum: [not-planned, planned, prepared, in-progress, completed]
    KanbanState:
      type: string
      enum: [not-planned, planned, prepared, in-progress, completed, emptied]
