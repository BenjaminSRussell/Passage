openapi: 3.1.0
info:
  title: Passage Costing API
  version: 0.6.0
  description: >-
    Inventory costing (PSG-20, wave 20), slices 1 to 6. Settlement preview under the
    item model group's costing method (with marking and split valuation types),
    parallel valuation ledger preview, inventory aging preview, costing versions with
    item-cost import (JSON or CSV), copy with percent change, standard cost activation
    with revaluation preview, the as-of standard cost lookup, and the internal purchase
    price variance hook. Slice 4 adds the valuation ledger and valuation category
    registries, saved aging bucket sets and stored month-end aging snapshots. Slice 5
    adds the append-only cost transaction projection, the inventory value report by
    product, site, warehouse and valuation type per valuation ledger, and its tie-out
    to ledger balances. Slice 6 adds manual cost adjustments of on-hand value and of receipts
    (with a preview) and stored reconciliation runs that emit reconciliation.diff. Settlement,
    ledger, aging previews and PPV are stateless; versions, item costs, valuation setup, bucket
    sets, snapshots, cost transactions, adjustments and reconciliation runs are persisted with RLS.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env: { default: dev }
paths:
  /readyz:
    get:
      operationId: readyz
      summary: Readiness (own Postgres reachable within 500 ms)
      x-passage-duty: none
      responses:
        "200": { description: ready, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
        "503": { description: not ready, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
  /v1/costing/settlements:preview:
    post:
      operationId: previewSettlements
      summary: Settle issues against receipts under a costing method (no persistence)
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlePreviewRequest" }
      responses:
        "200":
          description: settlement result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlePreviewResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/costing/valuation-ledgers:preview:
    post:
      operationId: previewValuationLedgers
      summary: Settle the same transactions under each parallel valuation ledger (no persistence)
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValuationLedgersPreviewRequest" }
      responses:
        "200":
          description: per-ledger settlement result; exactly one ledger is primary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValuationLedgersPreviewResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/costing/aging:preview:
    post:
      operationId: previewAging
      summary: Inventory aging of remaining cost as of a date, bucketed by receipt age (no persistence)
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgingPreviewRequest" }
      responses:
        "200":
          description: aging buckets; tiesToRemaining is true when the buckets equal the settled remaining value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgingPreviewResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/costing/versions:
    post:
      operationId: createCostingVersion
      summary: Create a DRAFT costing version
      x-passage-duty: costing.version.write
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVersionRequest" }
      responses:
        "201":
          description: created (or the stored response for a replayed Idempotency-Key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostingVersion" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409":
          description: CST-VER-CODE-DUPLICATE, the code is taken in this legal entity
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: idempotency_key_reuse, the key was used with a different body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    get:
      operationId: listCostingVersions
      summary: List costing versions visible to the caller, ordered by code
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - { name: legalEntityId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [STANDARD, PLANNED] } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: one page of versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CostingVersion" } }
                  nextCursor: { type: string, description: Absent on the last page. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/costing/versions/{id}:
    get:
      operationId: getCostingVersion
      summary: One costing version with its item count; the ETag is its optimistic version
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: the version
          headers:
            ETag: { schema: { type: string }, description: 'The version number in quotes, e.g. "3".' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostingVersion" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: CST-VER-NOT-FOUND }
  /v1/costing/versions/{id}/item-costs:
    get:
      operationId: listItemCosts
      summary: A version's item costs by site and product, each compared to the standard cost active in another version
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: one page of item costs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ItemCostRow" } }
                  nextCursor: { type: string, description: Absent on the last page. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: CST-VER-NOT-FOUND }
  /v1/costing/versions/{id}/item-costs:import:
    post:
      operationId: importItemCosts
      summary: Import pending item costs into a DRAFT version from JSON or CSV (all or nothing; idempotent per product and site; bumps the version's optimistic version)
      x-passage-duty: costing.version.write
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportItemCostsRequest" }
          text/csv:
            schema:
              type: string
              description: >-
                Header row naming productId, siteId and unitCost (any order, case-insensitive,
                extra columns ignored), then one row per product and site; at most 50,000 rows
                and 8 MiB. Any bad row refuses the whole file with CST-IMP-001 naming the line.
      responses:
        "200":
          description: imported
          content:
            application/json:
              schema:
                type: object
                required: [versionId, imported]
                properties:
                  versionId: { type: string, format: uuid }
                  imported: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem", description: CST-VER-NOT-DRAFT }
        "422": { $ref: "#/components/responses/Problem", description: CST-IMP-001 invalid CSV file }
  /v1/costing/versions/{id}/item-costs:copy:
    post:
      operationId: copyItemCosts
      summary: Copy another version's item costs into a DRAFT version, moved by a percent change (idempotent per product and site; bumps the optimistic version)
      x-passage-duty: costing.version.write
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyItemCostsRequest" }
      responses:
        "200":
          description: copied
          content:
            application/json:
              schema:
                type: object
                required: [versionId, copied]
                properties:
                  versionId: { type: string, format: uuid }
                  copied: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: CST-VER-NOT-FOUND (target or source) }
        "409": { $ref: "#/components/responses/Problem", description: CST-VER-NOT-DRAFT }
        "422":
          $ref: "#/components/responses/Problem"
          description: >-
            CST-COPY-001 percent change at or below -100 or a cost past 14 integer digits,
            CST-COPY-002 empty source, CST-COPY-003 source is the target,
            CST-COPY-004 source in another legal entity or currency
  /v1/costing/versions/{id}:preview-activation:
    post:
      operationId: previewActivation
      summary: Revaluation of activating a version, without writing anything (the UI requires it before activation); for an ACTIVE version, the revaluation it recorded
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivationRequest" }
      responses:
        "200":
          description: revaluation preview (status PREVIEW, or ALREADY_ACTIVE); the ETag is the version to send as If-Match
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem", description: CST-VER-NOT-DRAFT (ARCHIVED) }
        "422": { $ref: "#/components/responses/ActivationRefused" }
  /v1/costing/versions/{id}:activate:
    post:
      operationId: activateVersion
      summary: >-
        Activate a DRAFT STANDARD version in one transaction. The previous ACTIVE cost of each
        product and site is superseded, the pending costs become ACTIVE with their revaluation
        recorded, and cost.changed is emitted per product and site. Idempotent per version id:
        an ACTIVE version answers ALREADY_ACTIVE with the recorded revaluation.
      x-passage-duty: costing.version.activate
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - $ref: "#/components/parameters/VersionId"
        - name: If-Match
          in: header
          required: true
          description: The version from the activation preview (its ETag); a change since then is 412.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivationRequest" }
      responses:
        "200":
          description: activated (status ACTIVATED) or already active (status ALREADY_ACTIVE)
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem", description: CST-VER-NOT-DRAFT (ARCHIVED) or CST-ACT-008 concurrent activation }
        "412": { $ref: "#/components/responses/Problem", description: conflict_version, the version changed since the preview }
        "422": { $ref: "#/components/responses/ActivationRefused" }
        "428": { $ref: "#/components/responses/Problem", description: COM-0428 If-Match missing }
  /v1/costing/products/{id}/cost:
    get:
      operationId: getProductCost
      summary: Standard cost of a product at a site in force at the end of a date (waves 21 and 27)
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: site
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: false
          description: Date (UTC), default today. The cost activated last on or before it, even if superseded since.
          schema: { type: string, format: date }
      responses:
        "200":
          description: the cost in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostLookup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: CST-COST-001 no standard cost in force on that date }
  /v1/costing/valuation-ledgers:
    get:
      operationId: listValuationLedgers
      summary: Valuation ledgers in the caller's scope, primary first (FR-20.15)
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - $ref: "#/components/parameters/LegalEntityFilter"
      responses:
        "200":
          description: the ledgers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValuationLedgerList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createValuationLedger
      summary: Register a valuation ledger of a legal entity bound to a ledger group (FR-20.15)
      description: >-
        A code or ledger group already used in the legal entity is refused, and so is a
        second primary ledger. Re-sending the same ledger is refused as a duplicate, so a
        retried create cannot add a second ledger.
      x-passage-duty: costing.valuation.write
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValuationLedgerRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValuationLedger" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem", description: "CST-VLG-002 code taken; CST-VLG-003 primary taken; CST-VLG-004 ledger group taken" }
  /v1/costing/valuation-categories:
    get:
      operationId: listValuationCategories
      summary: Valuation categories of the tenant by code (FR-20.16)
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
      responses:
        "200":
          description: the categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValuationCategoryList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createValuationCategory
      summary: Register a split or batch valuation category (FR-20.16, BR-20.14)
      x-passage-duty: costing.valuation.write
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValuationCategoryRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValuationCategory" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem", description: "CST-VAL-004 code taken" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-VAL-003 a batch category with types, a split category without, or a type listed twice" }
  /v1/costing/aging/bucket-sets:
    get:
      operationId: listAgingBucketSets
      summary: Saved aging bucket sets in the caller's scope, by name (FR-20.17)
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - $ref: "#/components/parameters/LegalEntityFilter"
      responses:
        "200":
          description: the bucket sets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketSetList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAgingBucketSet
      summary: Save an aging bucket set for a legal entity (FR-20.17)
      x-passage-duty: costing.aging.write
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BucketSetRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketSet" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem", description: "CST-AGE-002 name taken in the legal entity" }
  /v1/costing/aging/snapshots:
    get:
      operationId: listAgingSnapshots
      summary: Stored aging snapshots in the caller's scope, newest as-of date first, without their lines
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - $ref: "#/components/parameters/LegalEntityFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: one page of snapshot summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAgingSnapshot
      summary: Age every product x site line as of a date and store it as month-end evidence (FR-20.17)
      description: >-
        Each line is aged the way the aging preview ages one product (per valuation type
        when split). Buckets come from a saved bucket set, from bucketBounds, or default to
        30/90/180/365 days. With valuationLedgerId the snapshot takes the ledger's method
        and currency. Writes dev.passage.costing.agingsnapshot.created.v1 to the outbox in
        the same transaction. A replayed Idempotency-Key returns the stored snapshot with
        200 and writes nothing.
      x-passage-duty: costing.aging.write
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapshotRequest" }
      responses:
        "201":
          description: stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "200":
          description: idempotent replay of the stored snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: "CST-VLG-005 valuation ledger or CST-AGE-003 bucket set not found" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-TXN-001 invalid stream or a product x site listed twice; CST-VAL-001 untyped issue; idempotency_key_reuse" }
  /v1/costing/aging/snapshots/{id}:
    get:
      operationId: getAgingSnapshot
      summary: One stored aging snapshot with its lines
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: the snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: "CST-AGE-004 not found" }
  /internal/v1/costing/ppv:
    post:
      operationId: calculatePpv
      summary: Purchase price variance for a STANDARD item at receipt or invoice (internal hook, no persistence in slice 1)
      x-passage-duty: costing.ppv.post
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PpvRequest" }
      responses:
        "200":
          description: PPV amount (positive is a debit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PpvResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/costing/value-report:
    get:
      operationId: getValueReport
      summary: Inventory value by dimension at a date, physical and financial (FR-20.4, FR-20.15, FR-20.16)
      description: >-
        Sums the cost transactions of one legal entity and valuation ledger with a financial date
        up to asOf. PPV rows never count (they post to the PPV account). Without valuationLedgerId
        the report is the primary valuation, in the primary ledger's currency when one exists.
        CST-RPT-001 for an unknown grouping, CST-RPT-004 when the ledger holds rows in another
        currency, CST-VLG-005 (404) for a ledger the legal entity does not have.
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, required: true, schema: { type: string, format: date } }
        - $ref: "#/components/parameters/ValuationLedgerFilter"
        - { name: siteId, in: query, required: false, description: Only this site., schema: { type: string, format: uuid } }
        - name: groupBy
          in: query
          required: false
          description: Comma list of product, site, warehouse, valuationType. Absent means site; empty means one total row.
          schema: { type: string, default: site }
      responses:
        "200":
          description: the value report with totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValueReport" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/costing/value-report:tie-out:
    post:
      operationId: tieOutValueReport
      summary: Compare the value report with the ledger balances of the inventory accounts (read only)
      description: >-
        The caller supplies the ledger balances grouped like the report; each balance names exactly
        the grouping dimensions (CST-RPT-002) and at most once (CST-RPT-003). A group on one side only
        is compared with zero. It only reads; POST /v1/costing/reconciliations runs the same
        tie-out, stores it and emits reconciliation.diff.
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TieOutRequest" }
      responses:
        "200":
          description: one row per group; ties is true when every group agrees with the ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TieOut" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/costing/cost-transactions:
    get:
      operationId: listCostTransactions
      summary: Cost transactions of one legal entity and valuation ledger, newest financial date first (value report drill-down)
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/ValuationLedgerFilter"
        - { name: productId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: kind, in: query, required: false, schema: { $ref: "#/components/schemas/CostTransactionKind" } }
        - { name: asOf, in: query, required: false, description: Financial date up to and including., schema: { type: string, format: date } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: one page of cost transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostTransactionList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /internal/v1/costing/cost-transactions:
    post:
      operationId: recordCostTransactions
      summary: Append value-affecting cost transactions (producers' hook; all or nothing, idempotent per sourceKey)
      description: >-
        A sourceKey already recorded with the same content is a replay and is skipped; with other
        content the batch is refused with CST-CTX-001. A valuationLedgerId must be a ledger of the
        row's legal entity (CST-VLG-005); rows of the primary ledger are stored as the primary
        valuation. Every row is in its ledger's currency (CST-CTX-002). Rows are never updated.
      x-passage-duty: costing.cost-transaction.post
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/CostTransactionRequest" }
      responses:
        "201":
          description: recorded; received counts the batch, inserted the new source keys
          content:
            application/json:
              schema:
                type: object
                required: [received, inserted]
                properties:
                  received: { type: integer }
                  inserted: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/costing/adjustments:preview:
    post:
      operationId: previewAdjustment
      summary: Show what a manual cost adjustment would post, without posting it (FR-20.6 voucher preview)
      description: >-
        Reads the current quantity and value of the stock (ON_HAND) or the receipt (RECEIPT) up to
        financialDate in the valuation ledger and returns the new value and the delta the post would
        write. A reason is not needed. The same refusals as the post apply.
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustmentRequest" }
      responses:
        "200":
          description: the planned adjustment (no id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Adjustment" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: "CST-VLG-005 valuation ledger not found" }
        "422": { $ref: "#/components/responses/AdjustmentRefused" }
  /v1/costing/adjustments:
    get:
      operationId: listAdjustments
      summary: Posted manual cost adjustments in the caller's scope, newest financial date first
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - $ref: "#/components/parameters/LegalEntityFilter"
        - { name: productId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [ON_HAND, RECEIPT] } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: one page of adjustments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdjustmentList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAdjustment
      summary: Post a manual adjustment of on-hand value or of one receipt (FR-20.6)
      description: >-
        ON_HAND revalues the stock of a product x site x warehouse x valuation type at financialDate,
        to a new unitCost (round half-even at the currency's minor unit) or by a signed amount;
        RECEIPT changes the value of one receipt transaction by an amount, which flows to its issues
        on the next close. The post appends one MANUAL_ADJ cost transaction (qty 0, amount = delta,
        source key manual-adjustment:<id>) in the same transaction, so the value report moves at once.
        An ON_HAND adjustment of the primary valuation that changes the unit cost of positive stock
        writes dev.passage.costing.cost.changed.v1 to the outbox. Adjustments of one product x site
        are serialised; with expectedValue (the value the caller previewed) a value that moved since
        is refused with CST-ADJ-006. A replayed Idempotency-Key returns the stored adjustment with 200
        and writes nothing; the same key with another body is idempotency_key_reuse. The ledger
        voucher (inventory / cost adjustment account) is not posted yet.
      x-passage-duty: costing.adjust
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustmentRequest" }
      responses:
        "201":
          description: posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Adjustment" }
        "200":
          description: idempotent replay of the stored adjustment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Adjustment" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: "CST-VLG-005 valuation ledger not found" }
        "409": { $ref: "#/components/responses/Problem", description: "CST-ADJ-006 the value changed since the preview" }
        "422": { $ref: "#/components/responses/AdjustmentRefused" }
  /v1/costing/adjustments/{id}:
    get:
      operationId: getAdjustment
      summary: One posted manual cost adjustment
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: the adjustment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Adjustment" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: "CST-ADJ-007 not found" }
  /v1/costing/reconciliations:
    get:
      operationId: listReconciliations
      summary: Stored reconciliation runs in the caller's scope, newest as-of date first, without their rows
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - $ref: "#/components/parameters/LegalEntityFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: one page of run summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createReconciliation
      summary: Run the value report tie-out against ledger balances and store it (FR-20.4, costing.reconcile)
      description: >-
        The same tie-out as POST /v1/costing/value-report:tie-out, stored as a run. Every group whose
        difference is not zero writes one dev.passage.costing.reconciliation.diff.v1 to the outbox in
        the same transaction. The caller (the daily costing.reconcile job, or a cost accountant)
        supplies the ledger balances until the ledger balance read exists. A replayed Idempotency-Key
        returns the stored run with 200 and emits nothing, even if the inventory moved since; the same
        key with another body is idempotency_key_reuse. The job uses "<entity>|<ledger>|<asOf>" as its key.
      x-passage-duty: costing.reconcile
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TieOutRequest" }
      responses:
        "201":
          description: stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationRun" }
        "200":
          description: idempotent replay of the stored run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem", description: "CST-RPT-001 to 004 as for the tie-out; idempotency_key_reuse" }
  /v1/costing/reconciliations/{id}:
    get:
      operationId: getReconciliation
      summary: One stored reconciliation run with its rows
      x-passage-duty: costing.read
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Duties"
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: the run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationRun" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: "CST-REC-002 not found" }
components:
  parameters:
    TenantHeader:
      name: X-Passage-Tenant
      in: header
      required: true
      description: Tenant id set by the gateway until JWT validation lands (kernel tenant middleware).
      schema: { type: string, format: uuid }
    Duties:
      name: X-Passage-Duties
      in: header
      required: false
      description: Comma-separated duties of the caller; checked per operation.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
    VersionId:
      name: id
      in: path
      required: true
      description: Costing version id; a malformed id is 404 CST-VER-NOT-FOUND.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    LegalEntityFilter:
      name: legalEntityId
      in: query
      required: false
      description: Only this legal entity; without it, every legal entity in the caller's scope.
      schema: { type: string, format: uuid }
    ValuationLedgerFilter:
      name: valuationLedgerId
      in: query
      required: false
      description: A valuation ledger of the legal entity; without it (or with the primary ledger's id), the primary valuation.
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      description: nextCursor from the previous page.
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AdjustmentRefused:
      description: >-
        CST-ADJ-002 nothing on hand to adjust (or not a receipt of the legal entity and ledger),
        CST-ADJ-003 a unit cost without positive stock, CST-ADJ-004 the adjustment changes nothing,
        CST-ADJ-005 a negative value on positive stock, CST-RPT-004 the stock is held in two
        currencies, idempotency_key_reuse
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ActivationRefused:
      description: >-
        CST-ACT-001 blocked version, CST-ACT-002 zero pending cost, CST-ACT-003 nothing pending,
        CST-ACT-005 not a STANDARD version, CST-ACT-006 effective date still ahead,
        CST-ACT-007 stock without a standard and no bookValue
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: "https://passage.dev/problems/CST-TXN-001" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        serviceCode: { type: string, example: "CST-0001" }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    Decimal:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
      description: Decimal string; money and quantities never travel as numbers.
    Transaction:
      type: object
      required: [id, kind, qty, financialDate]
      properties:
        id: { type: string }
        kind: { type: string, enum: [RECEIPT, ISSUE] }
        qty: { $ref: "#/components/schemas/Decimal" }
        value: { $ref: "#/components/schemas/Decimal", description: "Required for RECEIPT; the receipt value in the currency." }
        financialDate: { type: string, format: date }
        physicalDate: { type: string, format: date, description: "Defaults to financialDate." }
        valuationType: { type: string, maxLength: 64, description: "Split valuation type (FR-20.16); empty when the product is not split. In a split product every receipt needs one (or defaultValuationType)." }
        markedReceiptId:
          type: string
          description: >-
            ISSUE only: the receipt of the same run, dated on or before the issue, that this issue settles
            against first (FR-20.8). The marked quantity is reserved on that receipt so no other issue
            consumes it. Honoured by every method except STANDARD. An untyped issue takes the marked
            receipt's valuation type.
    SettlePreviewRequest:
      type: object
      required: [method, currency, transactions]
      properties:
        method: { type: string, enum: [FIFO, LIFO, LIFO_DATE, WEIGHTED_AVG_RUNNING, WEIGHTED_AVG_PERIODIC, MOVING_AVG, STANDARD] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        fallback:
          type: string
          enum: [RUNNING_AVG, STANDARD, LAST_RECEIPT]
          default: RUNNING_AVG
          description: >-
            Valuation of issue quantity no receipt in the run covers (BR-20.3). RUNNING_AVG uses the
            average of the stock before the issue, then standardUnitCost, then the last receipt cost.
        standardUnitCost: { $ref: "#/components/schemas/Decimal", description: "Required for STANDARD and for the STANDARD fallback." }
        defaultValuationType: { type: string, maxLength: 64, description: "Valuation type for untyped receipts and issues (BR-20.14)." }
        transactions:
          type: array
          minItems: 1
          maxItems: 20000
          items: { $ref: "#/components/schemas/Transaction" }
    SettlePreviewResponse:
      type: object
      required: [method, currency, issueCosts, settlements, exceptions, remainingQty, remainingValue]
      properties:
        method: { type: string }
        currency: { type: string }
        issueCosts:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Decimal" }
        settlements:
          type: array
          items:
            type: object
            required: [seq, issueId, qty, value]
            properties:
              seq: { type: integer }
              issueId: { type: string }
              receiptId: { type: string }
              pool: { type: string }
              qty: { $ref: "#/components/schemas/Decimal" }
              value: { $ref: "#/components/schemas/Decimal" }
        exceptions:
          type: array
          items:
            type: object
            required: [issueId, qty, value, fallback]
            properties:
              issueId: { type: string }
              qty: { $ref: "#/components/schemas/Decimal" }
              value: { $ref: "#/components/schemas/Decimal" }
              fallback: { type: string }
        remainingQty: { $ref: "#/components/schemas/Decimal" }
        remainingValue: { $ref: "#/components/schemas/Decimal" }
        remainingByValuationType:
          type: object
          description: Present only when stock is split by valuation type.
          additionalProperties: { $ref: "#/components/schemas/Decimal" }
    ValuationLedgersPreviewRequest:
      type: object
      required: [ledgers, transactions]
      properties:
        ledgers:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            required: [id, method, currency, rate]
            properties:
              id: { type: string }
              method: { type: string, enum: [FIFO, LIFO, LIFO_DATE, WEIGHTED_AVG_RUNNING, WEIGHTED_AVG_PERIODIC, MOVING_AVG, STANDARD] }
              currency: { type: string, pattern: "^[A-Z]{3}$" }
              rate: { $ref: "#/components/schemas/Decimal", description: "Ledger currency per unit of the primary currency; must be > 0, exactly 1 for the primary." }
              primary: { type: boolean, default: false }
              standardUnitCost: { $ref: "#/components/schemas/Decimal", description: "In ledger currency; STANDARD only." }
              fallback: { type: string, enum: [RUNNING_AVG, STANDARD, LAST_RECEIPT] }
        transactions:
          type: array
          minItems: 1
          maxItems: 20000
          items: { $ref: "#/components/schemas/Transaction" }
    ValuationLedgersPreviewResponse:
      type: object
      required: [ledgers]
      properties:
        ledgers:
          type: array
          items:
            type: object
            required: [id, currency, primary, issueCosts, remainingQty, remainingValue, settlements, exceptions]
            properties:
              id: { type: string }
              currency: { type: string }
              primary: { type: boolean }
              issueCosts:
                type: object
                additionalProperties: { $ref: "#/components/schemas/Decimal" }
              remainingQty: { $ref: "#/components/schemas/Decimal" }
              remainingValue: { $ref: "#/components/schemas/Decimal" }
              settlements: { type: integer }
              exceptions: { type: integer }
    AgingPreviewRequest:
      type: object
      required: [method, currency, asOf, transactions]
      properties:
        method: { type: string, enum: [FIFO, LIFO, LIFO_DATE, WEIGHTED_AVG_RUNNING, WEIGHTED_AVG_PERIODIC, MOVING_AVG, STANDARD] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        fallback: { type: string, enum: [RUNNING_AVG, STANDARD, LAST_RECEIPT] }
        standardUnitCost: { $ref: "#/components/schemas/Decimal" }
        defaultValuationType: { type: string, maxLength: 64, description: "Valuation type for untyped receipts and issues (BR-20.14)." }
        asOf: { type: string, format: date, description: "Transactions dated after it are refused." }
        bucketBounds:
          type: array
          description: Strictly ascending upper bounds in days; default 30, 90, 180, 365.
          maxItems: 12
          items: { type: integer, minimum: 0 }
        transactions:
          type: array
          minItems: 1
          maxItems: 20000
          items: { $ref: "#/components/schemas/Transaction" }
    AgingPreviewResponse:
      type: object
      required: [method, currency, asOf, buckets, totalQty, totalValue, remainingValue, tiesToRemaining]
      properties:
        method: { type: string }
        currency: { type: string }
        asOf: { type: string, format: date }
        buckets:
          type: array
          items:
            type: object
            required: [label, qty, value]
            properties:
              label: { type: string }
              qty: { $ref: "#/components/schemas/Decimal" }
              value: { $ref: "#/components/schemas/Decimal" }
        totalQty: { $ref: "#/components/schemas/Decimal" }
        totalValue: { $ref: "#/components/schemas/Decimal" }
        remainingValue: { $ref: "#/components/schemas/Decimal" }
        tiesToRemaining: { type: boolean }
        valuationTypes:
          type: array
          description: Present only when stock is split by valuation type; each type is aged at its own average.
          items:
            type: object
            required: [valuationType, buckets, totalQty, totalValue, remainingValue]
            properties:
              valuationType: { type: string }
              buckets:
                type: array
                items:
                  type: object
                  required: [label, qty, value]
                  properties:
                    label: { type: string }
                    qty: { $ref: "#/components/schemas/Decimal" }
                    value: { $ref: "#/components/schemas/Decimal" }
              totalQty: { $ref: "#/components/schemas/Decimal" }
              totalValue: { $ref: "#/components/schemas/Decimal" }
              remainingValue: { $ref: "#/components/schemas/Decimal" }
    CreateVersionRequest:
      type: object
      required: [legalEntityId, code, type, currency, effectiveFrom]
      properties:
        legalEntityId: { type: string, format: uuid }
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,31}$" }
        type: { type: string, enum: [STANDARD, PLANNED] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        effectiveFrom: { type: string, format: date }
        blockActivation: { type: boolean, default: false }
    CostingVersion:
      type: object
      required: [id, legalEntityId, code, type, status, currency, effectiveFrom, blockActivation, version, createdAt, itemCount]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string }
        type: { type: string, enum: [STANDARD, PLANNED] }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        currency: { type: string }
        effectiveFrom: { type: string, format: date }
        blockActivation: { type: boolean }
        version: { type: integer, description: Optimistic version; every import, copy and the activation bump it. }
        createdAt: { type: string, format: date-time }
        activatedAt: { type: string, format: date-time, description: Set once the version is ACTIVE. }
        itemCount: { type: integer, description: Item costs in the version (0 on the create response). }
    ItemCost:
      type: object
      required: [productId, siteId, unitCost]
      properties:
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        unitCost:
          type: string
          pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$"
          description: Non-negative unit cost in the version currency; at most 14 integer digits and 6 decimals (numeric(20,6)).
    ItemCostRow:
      type: object
      required: [productId, siteId, unitCost, status, source]
      properties:
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        unitCost: { $ref: "#/components/schemas/Decimal" }
        status: { type: string, enum: [PENDING, ACTIVE, SUPERSEDED] }
        source: { type: string, enum: [MANUAL, IMPORT, COPY, ROLLUP] }
        activeCost: { $ref: "#/components/schemas/Decimal", description: The standard cost active for this product and site in another version, if any. }
        previousUnitCost: { $ref: "#/components/schemas/Decimal", description: Set on activation when an older standard was superseded. }
        bookValue: { $ref: "#/components/schemas/Decimal", description: Set on activation when there was no older standard. }
        onHandQty: { $ref: "#/components/schemas/Decimal", description: On-hand the activation revalued. }
        revaluationAmount: { $ref: "#/components/schemas/Decimal" }
        activatedAt: { type: string, format: date-time }
    ImportItemCostsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50000
          items: { $ref: "#/components/schemas/ItemCost" }
    CopyItemCostsRequest:
      type: object
      required: [sourceVersionId, percentChange]
      properties:
        sourceVersionId: { type: string, format: uuid, description: Another version of the same legal entity and currency. }
        percentChange: { $ref: "#/components/schemas/Decimal", description: "Percent applied to every copied cost, e.g. 2.5 or -1; greater than -100. Results round half-even to 6 places." }
    ActivationRequest:
      type: object
      properties:
        onHand:
          type: array
          maxItems: 50000
          description: >-
            Physical on-hand per product and site at activation time (BR-20.7). A pending cost
            whose pair is missing revalues zero quantity. Where the pair has no active standard
            yet and its quantity is not zero, bookValue is required (CST-ACT-007).
          items:
            type: object
            required: [productId, siteId, qty]
            properties:
              productId: { type: string, format: uuid }
              siteId: { type: string, format: uuid }
              qty: { $ref: "#/components/schemas/Decimal", description: "At most 22 integer digits and 6 decimals; negative stock is allowed." }
              bookValue: { $ref: "#/components/schemas/Decimal", description: Current inventory value of that on-hand in the version currency. }
    ActivationResponse:
      type: object
      required: [versionId, versionCode, version, status, currency, lineCount, revaluationTotal, sites, topDeltas]
      properties:
        versionId: { type: string, format: uuid }
        versionCode: { type: string }
        version: { type: integer, description: Optimistic version; send it as If-Match to activate. }
        status: { type: string, enum: [PREVIEW, ACTIVATED, ALREADY_ACTIVE] }
        currency: { type: string }
        lineCount: { type: integer }
        revaluationTotal: { $ref: "#/components/schemas/Decimal" }
        sites:
          type: array
          description: One revaluation voucher per site, the sum of its rounded lines.
          items:
            type: object
            required: [siteId, revaluation]
            properties:
              siteId: { type: string, format: uuid }
              revaluation: { $ref: "#/components/schemas/Decimal" }
        topDeltas:
          type: array
          maxItems: 20
          description: Largest absolute revaluations first.
          items:
            type: object
            required: [productId, siteId, newCost, onHandQty, revaluation]
            properties:
              productId: { type: string, format: uuid }
              siteId: { type: string, format: uuid }
              previousCost: { $ref: "#/components/schemas/Decimal", description: The superseded standard; absent for a first standard. }
              bookValue: { $ref: "#/components/schemas/Decimal", description: The value replaced when there was no standard. }
              newCost: { $ref: "#/components/schemas/Decimal" }
              onHandQty: { $ref: "#/components/schemas/Decimal" }
              revaluation: { $ref: "#/components/schemas/Decimal", description: "(new − old) × on-hand, or new × on-hand − book value, rounded half-even to the currency." }
    CostLookup:
      type: object
      required: [productId, siteId, unitCost, currency, versionId, versionCode, effectiveFrom, activatedAt]
      properties:
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        unitCost: { $ref: "#/components/schemas/Decimal" }
        currency: { type: string }
        versionId: { type: string, format: uuid }
        versionCode: { type: string }
        effectiveFrom: { type: string, format: date }
        activatedAt: { type: string, format: date-time }
    ValuationLedgerRequest:
      type: object
      required: [legalEntityId, ledgerGroupId, code, method, currency, rateType]
      properties:
        legalEntityId: { type: string, format: uuid }
        ledgerGroupId: { type: string, format: uuid, description: "Wave 12 ledger group; one valuation ledger per ledger group and legal entity." }
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,31}$", example: IFRS }
        method: { type: string, enum: [FIFO, LIFO, LIFO_DATE, WEIGHTED_AVG_RUNNING, WEIGHTED_AVG_PERIODIC, MOVING_AVG, STANDARD] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        rateType: { type: string, enum: [SPOT, AVERAGE, HISTORICAL] }
        primary: { type: boolean, default: false, description: "At most one primary ledger per legal entity." }
    ValuationLedger:
      allOf:
        - $ref: "#/components/schemas/ValuationLedgerRequest"
        - type: object
          required: [id, primary, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    ValuationLedgerList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ValuationLedger" } }
    ValuationType:
      type: object
      required: [code, account]
      properties:
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,31}$", example: IMPORT }
        account: { type: string, minLength: 1, maxLength: 64, description: "Inventory account of the type (valuation class equivalent)." }
    ValuationCategoryRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,31}$", example: ORIGIN }
        batch: { type: boolean, default: false, description: "A batch category lists no types: each batch becomes its own type at receipt." }
        types: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/ValuationType" } }
    ValuationCategory:
      type: object
      required: [id, code, batch, types, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        batch: { type: boolean }
        types: { type: array, items: { $ref: "#/components/schemas/ValuationType" } }
        createdAt: { type: string, format: date-time }
    ValuationCategoryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ValuationCategory" } }
    BucketBounds:
      type: array
      description: Strictly ascending upper bounds in days; the last bucket is open-ended.
      minItems: 1
      maxItems: 12
      items: { type: integer, minimum: 0 }
    BucketSetRequest:
      type: object
      required: [legalEntityId, name, bounds]
      properties:
        legalEntityId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 64 }
        bounds: { $ref: "#/components/schemas/BucketBounds" }
    BucketSet:
      type: object
      required: [id, legalEntityId, name, bounds, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        name: { type: string }
        bounds: { $ref: "#/components/schemas/BucketBounds" }
        createdAt: { type: string, format: date-time }
    BucketSetList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BucketSet" } }
    SnapshotLineRequest:
      type: object
      required: [productId, siteId, transactions]
      properties:
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        standardUnitCost: { $ref: "#/components/schemas/Decimal" }
        defaultValuationType: { type: string, maxLength: 64 }
        transactions: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Transaction" } }
    SnapshotRequest:
      type: object
      required: [legalEntityId, asOf, lines]
      properties:
        legalEntityId: { type: string, format: uuid }
        valuationLedgerId: { type: string, format: uuid, description: "Optional; the snapshot then takes the ledger's method and currency." }
        asOf: { type: string, format: date }
        method: { type: string, enum: [FIFO, LIFO, LIFO_DATE, WEIGHTED_AVG_RUNNING, WEIGHTED_AVG_PERIODIC, MOVING_AVG, STANDARD], description: "Required without a valuation ledger." }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "Required without a valuation ledger." }
        fallback: { type: string, enum: [RUNNING_AVG, STANDARD, LAST_RECEIPT] }
        bucketSetId: { type: string, format: uuid, description: "A saved bucket set of the same legal entity; not with bucketBounds." }
        bucketBounds: { $ref: "#/components/schemas/BucketBounds" }
        lines:
          type: array
          minItems: 1
          maxItems: 2000
          description: One line per product x site; at most 20,000 transactions in total.
          items: { $ref: "#/components/schemas/SnapshotLineRequest" }
    SnapshotBucket:
      type: object
      required: [label, qty, value]
      properties:
        label: { type: string, example: "0-30" }
        qty: { $ref: "#/components/schemas/Decimal" }
        value: { $ref: "#/components/schemas/Decimal" }
    SnapshotTypeAging:
      type: object
      required: [valuationType, buckets, totalQty, totalValue, remainingValue]
      properties:
        valuationType: { type: string }
        buckets: { type: array, items: { $ref: "#/components/schemas/SnapshotBucket" } }
        totalQty: { $ref: "#/components/schemas/Decimal" }
        totalValue: { $ref: "#/components/schemas/Decimal" }
        remainingValue: { $ref: "#/components/schemas/Decimal" }
    SnapshotLine:
      type: object
      required: [productId, siteId, buckets, totalQty, totalValue, remainingValue, tiesToRemaining]
      properties:
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        buckets: { type: array, items: { $ref: "#/components/schemas/SnapshotBucket" } }
        totalQty: { $ref: "#/components/schemas/Decimal" }
        totalValue: { $ref: "#/components/schemas/Decimal" }
        remainingValue: { $ref: "#/components/schemas/Decimal" }
        tiesToRemaining: { type: boolean }
        valuationTypes: { type: array, items: { $ref: "#/components/schemas/SnapshotTypeAging" }, description: "Present when the product is split by valuation type." }
    Snapshot:
      type: object
      required: [id, legalEntityId, asOf, method, currency, buckets, totalQty, totalValue, remainingValue, tiesToRemaining, lineCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        valuationLedgerId: { type: string, format: uuid }
        asOf: { type: string, format: date }
        method: { type: string }
        currency: { type: string }
        bucketSetId: { type: string, format: uuid }
        buckets: { type: array, items: { $ref: "#/components/schemas/SnapshotBucket" } }
        totalQty: { $ref: "#/components/schemas/Decimal" }
        totalValue: { $ref: "#/components/schemas/Decimal" }
        remainingValue: { $ref: "#/components/schemas/Decimal" }
        tiesToRemaining: { type: boolean, description: "True when every line's buckets equal its settled remaining value." }
        lineCount: { type: integer }
        lines: { type: array, items: { $ref: "#/components/schemas/SnapshotLine" }, description: "Absent from list results." }
        createdAt: { type: string, format: date-time }
    SnapshotList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Snapshot" } }
        nextCursor: { type: string, description: Absent on the last page. }
    CostTransactionKind:
      type: string
      enum: [PHYSICAL, FINANCIAL, INVOICE_DIFF, SETTLEMENT_ADJ, PPV, REVALUATION, MANUAL_ADJ, RECALC]
      description: PHYSICAL, FINANCIAL and PPV may carry quantity; the others are value-only (qty 0). PPV never counts in the inventory value.
    CostTransactionRequest:
      type: object
      required: [sourceKey, legalEntityId, productId, siteId, kind, qty, amount, currency, financialDate]
      properties:
        sourceKey: { type: string, minLength: 1, maxLength: 200, description: "The producer's own key of the event (voucher line, settlement row)." }
        legalEntityId: { type: string, format: uuid }
        inventoryTransactionId: { type: string, format: uuid, description: "Wave 16 inventory transaction; absent for an on-hand revaluation." }
        ledgerEntryId: { type: string, format: uuid, description: "The ledger voucher (waves 11-14)." }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        valuationType: { type: string, maxLength: 64, description: "Split valuation type (FR-20.16); empty for none." }
        valuationLedgerId: { type: string, format: uuid, description: "Absent for the primary valuation." }
        kind: { $ref: "#/components/schemas/CostTransactionKind" }
        qty: { $ref: "#/components/schemas/Decimal", description: "Signed; at most 22 integer digits and 6 decimals." }
        amount: { $ref: "#/components/schemas/Decimal", description: "Signed, in the ledger currency; at most 15 integer digits and 4 decimals." }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        financialDate: { type: string, format: date }
    CostTransaction:
      allOf:
        - $ref: "#/components/schemas/CostTransactionRequest"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    CostTransactionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CostTransaction" } }
        nextCursor: { type: string, description: Absent on the last page. }
    ValueAmounts:
      type: object
      required: [qty, physicalValue, financialValue, value]
      properties:
        qty: { $ref: "#/components/schemas/Decimal" }
        physicalValue: { $ref: "#/components/schemas/Decimal", description: "PHYSICAL rows: received or shipped, not yet invoiced." }
        financialValue: { $ref: "#/components/schemas/Decimal", description: "Every other inventory kind." }
        value: { $ref: "#/components/schemas/Decimal", description: "physicalValue + financialValue; what the tie-out compares with the ledger." }
    ReportHeader:
      type: object
      required: [legalEntityId, asOf, currency, groupBy]
      properties:
        legalEntityId: { type: string, format: uuid }
        asOf: { type: string, format: date }
        valuationLedgerId: { type: string, format: uuid, description: "Absent for the primary valuation requested without an id." }
        valuationLedgerCode: { type: string }
        siteId: { type: string, format: uuid }
        currency: { type: string, description: "Empty when no ledger and no row names one." }
        groupBy: { type: array, items: { type: string, enum: [product, site, warehouse, valuationType] } }
    ValueReport:
      allOf:
        - $ref: "#/components/schemas/ReportHeader"
        - type: object
          required: [rows, total]
          properties:
            rows:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/ValueAmounts"
                  - type: object
                    required: [key]
                    properties:
                      key: { type: object, additionalProperties: { type: string }, description: "Grouping dimension values; an empty warehouse or valuation type is none." }
            total: { $ref: "#/components/schemas/ValueAmounts" }
    TieOutRequest:
      type: object
      required: [legalEntityId, asOf, glBalances]
      properties:
        legalEntityId: { type: string, format: uuid }
        asOf: { type: string, format: date }
        valuationLedgerId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        groupBy: { type: array, items: { type: string, enum: [product, site, warehouse, valuationType] }, default: [site] }
        glBalances:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            required: [dimensions, balance]
            properties:
              dimensions: { type: object, additionalProperties: { type: string }, description: "Exactly the grouping dimensions." }
              balance: { $ref: "#/components/schemas/Decimal", description: "Ledger balance of the inventory account(s) for the group." }
    TieOut:
      allOf:
        - $ref: "#/components/schemas/ReportHeader"
        - type: object
          required: [rows, differences, totalDiff, ties]
          properties:
            rows:
              type: array
              items:
                type: object
                required: [key, inventory, ledger, diff]
                properties:
                  key: { type: object, additionalProperties: { type: string } }
                  inventory: { $ref: "#/components/schemas/Decimal" }
                  ledger: { $ref: "#/components/schemas/Decimal" }
                  diff: { $ref: "#/components/schemas/Decimal", description: "inventory - ledger" }
            differences: { type: integer, description: "Groups whose diff is not zero." }
            totalDiff: { $ref: "#/components/schemas/Decimal" }
            ties: { type: boolean }
    AdjustmentRequest:
      type: object
      required: [legalEntityId, kind, mode, financialDate]
      description: >-
        ON_HAND needs productId and siteId (warehouseId and valuationType name the finer grain; absent
        is none). RECEIPT needs receiptTransactionId, takes product, site, warehouse and valuation type
        from the receipt, and is by AMOUNT. reason is required to post, not to preview.
      properties:
        legalEntityId: { type: string, format: uuid }
        kind: { type: string, enum: [ON_HAND, RECEIPT] }
        mode: { type: string, enum: [UNIT_COST, AMOUNT] }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        valuationType: { type: string, maxLength: 64 }
        valuationLedgerId: { type: string, format: uuid, description: "Absent (or the primary ledger's id) for the primary valuation." }
        receiptTransactionId: { type: string, format: uuid, description: "The wave 16 receipt transaction, as recorded on its cost transactions." }
        financialDate: { type: string, format: date, description: "Not after today; the value is read up to and including this date." }
        unitCost: { $ref: "#/components/schemas/Decimal", description: "UNIT_COST only: greater than 0, at most 14 integer digits and 6 decimals." }
        amount: { $ref: "#/components/schemas/Decimal", description: "AMOUNT only: signed, at most 15 integer digits and 4 decimals." }
        expectedValue: { $ref: "#/components/schemas/Decimal", description: "The current value the caller previewed; a different value refuses the post (CST-ADJ-006)." }
        reason: { type: string, maxLength: 500 }
    Adjustment:
      type: object
      required: [legalEntityId, kind, mode, productId, siteId, currency, financialDate, qty, oldValue, newValue, delta]
      properties:
        id: { type: string, format: uuid, description: Absent on a preview. }
        legalEntityId: { type: string, format: uuid }
        kind: { type: string, enum: [ON_HAND, RECEIPT] }
        mode: { type: string, enum: [UNIT_COST, AMOUNT] }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        valuationType: { type: string }
        valuationLedgerId: { type: string, format: uuid, description: "Absent for the primary valuation." }
        receiptTransactionId: { type: string, format: uuid }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "The currency the stock is valued in." }
        financialDate: { type: string, format: date }
        reason: { type: string }
        unitCost: { $ref: "#/components/schemas/Decimal" }
        amount: { $ref: "#/components/schemas/Decimal" }
        qty: { $ref: "#/components/schemas/Decimal", description: "On-hand (or receipt) quantity; never changed by an adjustment." }
        oldValue: { $ref: "#/components/schemas/Decimal" }
        newValue: { $ref: "#/components/schemas/Decimal" }
        delta: { $ref: "#/components/schemas/Decimal", description: "newValue - oldValue; the MANUAL_ADJ amount." }
        oldUnitCost: { $ref: "#/components/schemas/Decimal", description: "Present when the quantity is positive." }
        newUnitCost: { $ref: "#/components/schemas/Decimal", description: "Present when the quantity is positive." }
        costTransactionId: { type: string, format: uuid, description: "The MANUAL_ADJ cost transaction; absent on a preview." }
        createdAt: { type: string, format: date-time }
    AdjustmentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Adjustment" } }
        nextCursor: { type: string, description: Absent on the last page. }
    ReconciliationRun:
      allOf:
        - $ref: "#/components/schemas/ReportHeader"
        - type: object
          required: [id, differences, totalDiff, ties, rowCount, createdAt]
          properties:
            id: { type: string, format: uuid }
            differences: { type: integer, description: "Groups whose diff is not zero; one reconciliation.diff event each." }
            totalDiff: { $ref: "#/components/schemas/Decimal" }
            ties: { type: boolean }
            rowCount: { type: integer }
            rows:
              type: array
              description: Absent from list results.
              items:
                type: object
                required: [key, inventory, ledger, diff]
                properties:
                  key: { type: object, additionalProperties: { type: string } }
                  inventory: { $ref: "#/components/schemas/Decimal" }
                  ledger: { $ref: "#/components/schemas/Decimal" }
                  diff: { $ref: "#/components/schemas/Decimal", description: "inventory - ledger" }
            createdAt: { type: string, format: date-time }
    ReconciliationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ReconciliationRun" } }
        nextCursor: { type: string, description: Absent on the last page. }
    PpvRequest:
      type: object
      required: [kind, currency, qty, poUnitPrice, sourceDocumentId]
      properties:
        kind: { type: string, enum: [RECEIPT, INVOICE] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        qty: { $ref: "#/components/schemas/Decimal", description: "Must be positive." }
        standardUnitCost: { $ref: "#/components/schemas/Decimal", description: "Required for RECEIPT: (PO price - standard) x qty." }
        poUnitPrice: { $ref: "#/components/schemas/Decimal", description: "PO unit price, required for both kinds." }
        invoiceUnitPrice: { $ref: "#/components/schemas/Decimal", description: "Required for INVOICE: (invoice price - PO price) x qty." }
        sourceDocumentId: { type: string, maxLength: 188 }
        legalEntityId: { type: string, format: uuid, description: "With productId, siteId and financialDate (all four or none), also appends the PPV cost transaction under source key ppv:<kind>:<sourceDocumentId>; a retry is a replay." }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        financialDate: { type: string, format: date }
    PpvResponse:
      type: object
      required: [kind, currency, amount, direction, sourceDocumentId, recorded]
      properties:
        kind: { type: string }
        currency: { type: string }
        amount: { $ref: "#/components/schemas/Decimal" }
        direction: { type: string, enum: [DR, CR, NONE], description: "DR is an unfavourable debit; CR a credit." }
        sourceDocumentId: { type: string }
        recorded: { type: boolean, description: "True when the PPV cost transaction was appended or replayed." }
