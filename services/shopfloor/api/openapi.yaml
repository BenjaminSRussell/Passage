openapi: 3.1.0
info:
  title: Passage Shop Floor API
  version: 0.1.0
  description: |
    Shop floor service for PSG-25. Slice 1: workers, batch registrations from
    the kiosk with client UUIDs, pay calculation per worker-day, approval, and
    the lists the supervisor approval screen reads. Slice 2: machines, edge
    machine-event ingest, downtimes and reason codes, andon, the OEE series and
    payroll export batches. Slice 4: process messages (record, monitor, delivery
    reports from the consuming contexts, reprocess). Slice 6: per-machine idle
    threshold (BR-25.6), the OEE rollup that stores buckets, kiosk badge login
    and the "Who is clocked in" inquiry. Slice 7: the job dispatch projection
    and list, job detail, and operator feedback with quality checks (FR-25.3 to
    FR-25.5). Commands that change state
    (except the registration batch, idempotent per item id, process message
    creation, idempotent per source and sourceMessageId, job plans keyed by job id,
    job feedback idempotent per feedbackId, and the scheduler jobs
    that are safe to repeat) require an
    `Idempotency-Key` header; a repeated key returns the stored
    outcome with `Idempotent-Replayed: true`. Errors are RFC 9457 problem
    details (application/problem+json) with a stable `code`; see README.md.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /api/v1/shopfloor/workers:
    post:
      operationId: createWorker
      summary: Register a worker (shop floor projection of an employee)
      x-passage-duty: shopfloor.setup.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewWorker"
      responses:
        "201":
          description: Created (or the stored outcome of a repeated key).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listWorkers
      summary: List workers by name
      x-passage-duty: shopfloor.view
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
          description: true lists active workers only.
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Workers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Worker"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/workers/{id}:
    get:
      operationId: getWorker
      summary: Get one worker
      x-passage-duty: shopfloor.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The worker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/registrations:
    get:
      operationId: listRegistrations
      summary: A worker's registrations in a date range, or every registration of a bundle
      x-passage-duty: shopfloor.view
      description: |
        With `bundleId`, returns the bundle's registrations (BR-25.1) and ignores
        the other filters. Otherwise `workerId`, `from` and `to` are required.
      parameters:
        - name: workerId
          in: query
          description: Required unless bundleId is given.
          schema:
            type: string
            format: uuid
        - name: bundleId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: First local day (YYYY-MM-DD). Required unless bundleId is given.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last local day (YYYY-MM-DD), at most 31 days after from. Required unless bundleId is given.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/TimeZone"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Registrations, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StoredRegistration"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRegistrations
      summary: Create registrations (batch of 1 to 500, offline replay)
      x-passage-duty: shopfloor.time.register
      description: |
        Each item carries a client-generated UUID `id`. An item whose id already
        exists is ignored and reported as `duplicate` (BR-25.7). Items are stored
        in client timestamp order; results are in request order. New items emit
        dev.passage.shopfloor.registration.posted.v1 in the same transaction.
        An unknown or inactive worker fails the whole batch (SF-0101).

        Bundles (BR-25.1): the closed job registrations sharing a `bundleId` must
        belong to one worker, cover the same interval and name each job once;
        the interval's hours are split across them by good quantity (equal split
        when no good quantity is reported), in 0.01 h shares that sum to the
        rounded total. Every closed job of a bundle must arrive in one batch; a
        later batch adding closed jobs to the same bundle is SF-0113.

        Clock skew (BR-25.7): when the batch carries `deviceSentAt`, the server
        measures its clock minus the device clock. An offset above 5 minutes is
        added to every item's times and recorded on the stored registrations.

        Job dispatch (FR-25.3): a new `job-start` moves a released job to
        `started`. A worker has one open unit of work: an open `job-start` (no
        `stoppedAt`) stops the worker's other open job, or every open job of
        another bundle, with a closed `job-stop` the server writes from each
        job's start to the new start (flag `auto-stopped`, warning SF-0002). An
        auto-stopped bundle's time is split by the good quantity on its starts,
        or equally (BR-25.1). Starts sharing the incoming `bundleId` stay open.
        A start older than an open unit (a late offline replay) is itself
        closed at that unit's start. A unit open for more than 24 hours is
        stopped at 24 hours with flag `auto-stop-capped`. A `job-start` for a
        job the server already finished is stored with flag
        `job-finished-conflict` and warning SF-0004, and the job stays finished
        (BR-25.7). A job the dispatch list does not hold yet is accepted without
        dispatch effects. To stop work without starting another, send a closed
        `job-stop` (startedAt = the job's start, stoppedAt = now), one per job of
        a bundle in one batch. A duplicate item has no flags or auto-stops.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationBatch"
      responses:
        "200":
          description: Per-item outcome in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/pay:calculate:
    post:
      operationId: calculatePay
      summary: Calculate pay lines for a worker over a date range
      x-passage-duty: shopfloor.pay.calculate
      description: |
        Recomputes non-approved worker-days from the worker's clock registrations.
        The weekly overtime threshold counts the earlier days of the pay week
        (Monday start) even when they are outside the range; only days in the
        range are saved. Approved days are never rewritten; a range that
        contains one fails with SF-0102.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayRange"
      responses:
        "200":
          description: Calculated worker-days with pay lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayCalculateResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/pay:approve:
    post:
      operationId: approvePay
      summary: Approve calculated worker-days
      x-passage-duty: shopfloor.pay.approve
      description: |
        Approves every calculated day in the range. Days already approved are
        returned unchanged. Any open flag fails the request (SF-0006); a day whose
        registrations changed after calculation fails with SF-0104; approving
        your own day fails with SF-0106. Newly approved days emit
        dev.passage.shopfloor.payday.approved.v1.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayRange"
      responses:
        "200":
          description: Approved worker-days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayApproveResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/worker-days:
    get:
      operationId: listWorkerDays
      summary: Calculated and approved worker-days with pay lines (approval list)
      x-passage-duty: shopfloor.view
      parameters:
        - name: workerId
          in: query
          schema:
            type: string
            format: uuid
          description: Omit to list every worker.
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: status
          in: query
          schema:
            type: string
            enum: [calculated, approved]
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Worker-days ordered by date and worker name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkerDay"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/machines:
    post:
      operationId: registerMachine
      summary: Map an edge machine code to a resource with its ideal cycle time
      description: One machine per resource and one resource per machine code in this slice (SF-0109).
      x-passage-duty: shopfloor.setup.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMachine"
      responses:
        "201":
          description: Registered (or the stored outcome of a repeated key).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Machine"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listMachines
      summary: List registered machines by code
      x-passage-duty: shopfloor.view
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Machines.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Machine"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/machine-events:
    post:
      operationId: ingestMachineEvents
      summary: Ingest a batch of edge machine events (BR-25.4)
      description: |
        Called by the iot-edge gateway with its service identity. Events are
        classified per machine: seq at or below the last stored seq and events
        older than 7 days are dropped and counted; missing seq runs are
        reported in `gaps` (SF-0008). Each event is keyed by (machine, seq), so
        a replayed batch is idempotent without an Idempotency-Key. A DOWN state
        opens a downtime and any other state closes it; a downtime open for more
        than 10 minutes raises one andon per resource. An unknown machine code
        rejects the whole batch (SF-0108).
      x-passage-duty: shopfloor.machine.ingest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineEventBatch"
      responses:
        "200":
          description: Batch outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/downtimes:
    get:
      operationId: listDowntimes
      summary: Machine downtimes, newest first
      x-passage-duty: shopfloor.view
      parameters:
        - name: open
          in: query
          schema:
            type: boolean
          description: true lists downtimes that have not ended.
        - name: resourceId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Downtimes.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Downtime"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/downtimes/{id}:code:
    post:
      operationId: codeDowntime
      summary: Assign a downtime reason code (FR-25.11)
      description: The andon raised for the downtime stays open until its condition clears (AC-25.6).
      x-passage-duty: shopfloor.time.register
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DowntimeCode"
      responses:
        "200":
          description: The coded downtime.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Downtime"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/andon:
    get:
      operationId: listAndon
      summary: Open andon alerts, oldest first (BR-25.10)
      x-passage-duty: shopfloor.view
      parameters:
        - name: siteId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Open alerts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Andon"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/oee:
    get:
      operationId: getOee
      summary: OEE series per resource and bucket (FR-25.10, BR-25.5)
      description: |
        Computed on read from stored machine events. Downtime coded as planned
        is taken out of planned minutes. RUNNING time with no count for longer
        than the machine's idle threshold is idle downtime from the last count to
        the next count (BR-25.6); time after now is not scheduled. Buckets without planned time (no known
        state, OFF, or wholly planned downtime) are omitted, as are resources
        without a machine. Roll up to a shift by summing minutes and counts, never by
        averaging ratios.
      x-passage-duty: shopfloor.view
      parameters:
        - name: resourceIds
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated resource UUIDs, 1 to 50.
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: After from, at most 7 days later, and a whole number of buckets after it.
        - name: bucket
          in: query
          schema:
            type: string
            enum: [5m, 15m, 60m]
            default: 15m
      responses:
        "200":
          description: Buckets ordered by resource (as requested) and start.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OeeBucket"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/oee:rollup:
    post:
      operationId: rollupOee
      summary: OEE rollup job - store the buckets of a window (FR-25.10)
      description: |
        PRD job "OEE rollup" (every 15 minutes). The platform scheduler calls it per
        tenant with a service identity holding the rollup duty. The buckets are
        computed exactly as GET /oee computes them and upserted by (resource, bucket
        width, bucket start). A new or changed bucket publishes
        `dev.passage.shopfloor.oeebucket.updated.v1`; a stored bucket of the window
        that no longer has planned time is removed and publishes
        `dev.passage.shopfloor.oeebucket.removed.v1`; an unchanged bucket is not
        rewritten and publishes nothing, so calling it again is safe and it takes no
        Idempotency-Key. Without `resourceIds` every registered machine is rolled up.
      x-passage-duty: shopfloor.oee.rollup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OeeRollup"
      responses:
        "200":
          description: What the rollup wrote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OeeRollupResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/sessions:badge:
    post:
      operationId: badgeLogin
      summary: Kiosk login by badge scan (FR-25.1)
      description: |
        Resolves a scanned badge (GS1 barcode or NFC payload) to an active worker and
        says whether the worker is clocked in. The BFF holds the kiosk session and
        logs it out after `idleTimeoutMinutes` without input. An unknown badge and the
        badge of a deactivated worker are both SF-0001 (422). Nothing is stored, so
        there is no Idempotency-Key. PIN login is not built yet.
      x-passage-duty: shopfloor.kiosk.login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadgeLogin"
      responses:
        "200":
          description: The worker the kiosk now acts for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskSession"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/clocked-in:
    get:
      operationId: listClockedIn
      summary: Who is clocked in (PRD 4.25.14, FR-25.14 supervisor view)
      description: |
        Workers whose latest clock punch is a clock-in, longest present first, with
        the jobs they started since and have not stopped (a bundle lists each job).
      x-passage-duty: shopfloor.view
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Clocked-in workers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClockedWorker"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/pay:export:
    post:
      operationId: exportPay
      summary: Export approved pay lines to payroll as one batch (FR-25.8)
      description: |
        Every approved pay line in the range that is not yet in a batch joins a
        new batch. The response carries the CSV; the batch emits
        dev.passage.shopfloor.payday.exported.v1 with its lines in the same
        transaction. A range with nothing new fails with SF-0111.
      x-passage-duty: shopfloor.pay.export
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayExportRange"
      responses:
        "201":
          description: The new batch (or the stored outcome of a repeated key).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayExport"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/pay-exports:
    get:
      operationId: listPayExports
      summary: Payroll export batches, newest first (without CSV)
      x-passage-duty: shopfloor.pay.export
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Batches.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PayExport"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/pay-exports/{id}:
    get:
      operationId: getPayExport
      summary: One payroll export batch with its CSV
      x-passage-duty: shopfloor.pay.export
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayExport"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/process-messages:
    post:
      operationId: createProcessMessage
      summary: Record a process message (FR-25.17, BR-25.13)
      description: |
        From a kiosk PI sheet, the edge connector or manual entry. The category decides the
        destinations. Numeric values outside their limits are flagged (`outOfLimit`) and
        accepted, unless the category rejects out-of-limit values (SF-0114). Idempotent by
        (source, sourceMessageId): a replay answers 200 with the stored message and
        `duplicate: true`, so no Idempotency-Key is needed.
      x-passage-duty: shopfloor.process.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewProcessMessage"
      responses:
        "201":
          description: Stored; deliveries are pending except Kafka, which is the outbox event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessIngest"
        "200":
          description: Replay of a stored (source, sourceMessageId); nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessIngest"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listProcessMessages
      summary: Process message monitor, newest first (CO54 equivalent)
      description: |
        Keyset paging: pass the `nextCursor` of a page as `cursor` to get the next one;
        `nextCursor` is null on the last page. Deleted messages are not listed (read one
        by id to see its deletion). A cursor this list did not return is COM-0001 naming
        `cursor`.
      x-passage-duty: shopfloor.view
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProcessMessageStatus"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/ProcessCategory"
        - name: destination
          in: query
          description: Messages that route to this destination.
          schema:
            $ref: "#/components/schemas/ProcessDestination"
        - name: orderId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          description: Opaque position from the previous page's `nextCursor`.
          schema:
            type: string
      responses:
        "200":
          description: One page of messages with their per-destination deliveries.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProcessMessage"
                  nextCursor:
                    type: [string, "null"]
                    description: Cursor of the next page; null on the last page.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/process-messages/{id}:
    get:
      operationId: getProcessMessage
      summary: One process message with its deliveries
      description: A deleted message is still returned, with `deletedAt`, `deletedBy` and `deleteReason` set.
      x-passage-duty: shopfloor.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessMessage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/process-messages/{id}/deliveries/{destination}:report:
    post:
      operationId: reportProcessMessageDelivery
      summary: Report a destination outcome (consuming context)
      description: |
        Called by the context that owns the destination after it handled
        `processmessage.received`. A failure waits 1, 5, 15 and then 60 minutes; after the
        fifth failed attempt the destination is `error` until reprocessed. A delivered
        destination is final; reporting again changes nothing. A deleted message takes no
        reports (SF-0120). The message becomes
        `delivered` (and `processmessage.delivered` is published once) when every
        destination is delivered.
      x-passage-duty: shopfloor.process.deliver
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: destination
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ProcessDestination"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryReport"
      responses:
        "200":
          description: The message after the report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessMessage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/process-messages/{id}:reprocess:
    post:
      operationId: reprocessProcessMessage
      summary: Send a destination in error again, with a reason
      description: Only a destination in `error` can be reprocessed (SF-0116), and not on a deleted message (SF-0120). It returns to pending with its attempts reset, and `processmessage.received` is published naming that destination alone.
      x-passage-duty: shopfloor.process.create
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reprocess"
      responses:
        "200":
          description: The message after the reprocess.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessMessage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/process-messages/{id}:delete:
    post:
      operationId: deleteProcessMessage
      summary: Delete a message with a destination in error, with a reason
      description: |
        FR-25.17: a destination whose retries are used up stays in error "for manual
        reprocess or deletion (with reason)". Only a message with at least one destination
        in `error` can be deleted (SF-0119); a deleted message cannot be deleted again
        (SF-0120). The message is kept for audit with `deletedAt`, `deletedBy` and
        `deleteReason`, leaves the monitor, takes no further reports or reprocesses, and the
        retry sweep skips it. Destinations already delivered are not undone.
        `processmessage.deleted` is published naming the destinations that never received
        the message. Needs an authenticated user.
      x-passage-duty: shopfloor.process.create
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteProcessMessage"
      responses:
        "200":
          description: The deleted message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessMessage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/process-messages:retry-due:
    post:
      operationId: retryDueProcessMessages
      summary: Retry sweep - publish again the destinations whose wait elapsed
      description: |
        FR-25.17 retry job. The platform scheduler calls it every minute for each tenant,
        with a service identity holding the deliver duty, so the sweep runs under that
        tenant's row-level security. It takes up to `limit` destinations that failed at
        least once, are still pending and whose `nextAttemptAt` has passed (oldest first),
        and publishes `processmessage.received` once per message naming only those
        destinations. Each is leased until its next scheduled attempt (the same 1, 5, 15
        or 60 minute wait), so a consumer that does not answer is not flooded; its next
        report replaces the lease. Concurrent sweeps skip messages another one holds.
        Destinations that never reported (waiting for their consumer), in error (waiting
        for a supervisor) and deleted messages are not retried. Calling it again is safe,
        so it takes no Idempotency-Key.
      x-passage-duty: shopfloor.process.deliver
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: The destinations published again by this sweep.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RetryClaim"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/jobs:
    post:
      operationId: upsertJob
      summary: Write a job's plan into the dispatch projection (FR-25.3, w23 schedule)
      description: |
        Called by the w23 schedule's service identity. The job id is the key, so a resend
        is naturally idempotent and takes no Idempotency-Key: 201 when the job is new, 200
        when it updates the plan. Plan fields (order, operation, resource, planned quantity,
        sequence start, check definitions) are last-writer-wins; reported quantities,
        status and check results are never overwritten. Not in the PRD API table.
      x-passage-duty: shopfloor.job.schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobPlan"
      responses:
        "200":
          description: The plan of an existing job was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "201":
          description: The job was added to the projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listJobs
      summary: Dispatch list (FR-25.3)
      description: |
        Jobs in sequence-start order. Finished jobs are hidden unless `status=finished`
        asks for them. `results` is empty in the list; read one job for its results. The
        PRD `workerId` filter needs the worker's default resource and is not built yet.
      x-passage-duty: shopfloor.time.register
      parameters:
        - name: resourceId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [released, started, finished]
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Jobs in start order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/jobs/{id}:
    get:
      operationId: getJob
      summary: Job detail with its quality check results (kiosk job detail)
      x-passage-duty: shopfloor.time.register
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/shopfloor/jobs/{id}:feedback:
    post:
      operationId: recordJobFeedback
      summary: Report good and scrap quantities, check values and finished (FR-25.4, FR-25.5)
      description: |
        Quantities are increments added to the job's totals; scrap above zero needs a
        `scrapReasonId`. Check values are evaluated against the job's check definitions
        (unknown code SF-0123, value that cannot be evaluated SF-0125) and the latest value
        per check is kept. `finished: true` is refused with SF-0005 while a mandatory check
        has no passing result (AC-25.9), unless the posting carries `override.reason`,
        which needs the duty `shopfloor.check.override` and an authenticated user; a
        refused posting stores nothing. A finished job takes no feedback (SF-0122). The
        client `feedbackId` is the idempotency key (offline replay): a resend returns 200
        with `duplicate: true` and changes nothing; the same id on another job is SF-0124.
        Each stored posting publishes `dev.passage.shopfloor.job.reported.v1`.
      x-passage-duty: shopfloor.time.register
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobFeedback"
      responses:
        "200":
          description: Replay of a stored feedbackId; nothing changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobFeedbackResult"
        "201":
          description: Feedback stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobFeedbackResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /healthz:
    get:
      operationId: healthz
      summary: Liveness
      responses:
        "200":
          description: Alive.
  /readyz:
    get:
      operationId: readyz
      summary: Readiness (Postgres reachable within 500 ms)
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    From:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date
      description: Inclusive; at most 31 days after from.
    TimeZone:
      name: timeZone
      in: query
      schema:
        type: string
        default: UTC
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    NewWorker:
      type: object
      required: [partyId, name, costRate, currency]
      properties:
        partyId:
          type: string
          format: uuid
          description: Employee party (wave 7).
        name:
          type: string
          minLength: 1
          maxLength: 120
        badgeId:
          type: [string, "null"]
          maxLength: 64
          description: Unique per tenant (SF-0105).
        userId:
          type: [string, "null"]
          maxLength: 200
          description: Sign-in user; that user cannot approve this worker's days (SF-0106).
        costRate:
          type: string
          description: Decimal money per hour, not negative.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    Worker:
      type: object
      required: [id, partyId, name, badgeId, userId, costRate, currency, active, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        name:
          type: string
        badgeId:
          type: [string, "null"]
        userId:
          type: [string, "null"]
        costRate:
          type: string
        currency:
          type: string
        active:
          type: boolean
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
    StoredRegistration:
      type: object
      required: [id, workerId, kind, jobId, bundleId, qtyGood, qtyScrap, scrapReasonId, startedAt, stoppedAt, hours, serverReceivedAt, deviceId, offline, note, clockOffsetSeconds, flags]
      properties:
        id:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [clock-in, clock-out, job-start, job-stop, absence, indirect]
        jobId:
          type: [string, "null"]
        bundleId:
          type: [string, "null"]
        qtyGood:
          type: string
        qtyScrap:
          type: string
        scrapReasonId:
          type: [string, "null"]
        startedAt:
          type: string
          format: date-time
        stoppedAt:
          type: [string, "null"]
          format: date-time
        hours:
          type: [string, "null"]
          description: Elapsed hours (4 places) of a closed registration, or a bundled job's share in 0.01 h (BR-25.1).
        serverReceivedAt:
          type: string
          format: date-time
        deviceId:
          type: [string, "null"]
        offline:
          type: boolean
        note:
          type: [string, "null"]
        clockOffsetSeconds:
          type: [integer, "null"]
          description: Device clock correction applied to the times, server minus device (BR-25.7); null when none was needed.
        flags:
          type: array
          items:
            type: string
            enum: [job-finished-conflict, auto-stopped, auto-stop-capped]
          description: Review flags (BR-25.7, FR-25.3).
    WorkerDay:
      type: object
      required: [workerId, workerName, workDate, hours, flags, status, timeZone, calculatedAt, approvedBy, approvedAt, payLines]
      properties:
        workerId:
          type: string
          format: uuid
        workerName:
          type: string
        workDate:
          type: string
          format: date
        hours:
          type: string
        flags:
          type: array
          items:
            type: string
            enum: [missing-clock-out, orphan-clock-out]
        status:
          type: string
          enum: [calculated, approved]
        timeZone:
          type: string
        calculatedAt:
          type: string
          format: date-time
        approvedBy:
          type: [string, "null"]
        approvedAt:
          type: [string, "null"]
          format: date-time
        payLines:
          type: array
          items:
            $ref: "#/components/schemas/PayLine"
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
    RegistrationBatch:
      type: object
      required: [items]
      properties:
        deviceSentAt:
          type: [string, "null"]
          format: date-time
          description: The kiosk's own clock when it sent the batch (BR-25.7).
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/Registration"
    Registration:
      type: object
      required: [id, workerId, kind, startedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated UUID (idempotency key for the item).
        workerId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [clock-in, clock-out, job-start, job-stop, absence, indirect]
        jobId:
          type: [string, "null"]
          format: uuid
        bundleId:
          type: [string, "null"]
          format: uuid
        qtyGood:
          type: [string, "null"]
          description: Decimal string, not negative.
        qtyScrap:
          type: [string, "null"]
          description: Decimal string, not negative.
        scrapReasonId:
          type: [string, "null"]
          description: Required when qtyScrap is above zero (FR-25.4).
        startedAt:
          type: string
          format: date-time
        stoppedAt:
          type: [string, "null"]
          format: date-time
          description: At most 24 hours after startedAt.
        deviceId:
          type: [string, "null"]
        offline:
          type: boolean
          default: false
        note:
          type: [string, "null"]
          maxLength: 500
    RegistrationResponse:
      type: object
      required: [items, clockCorrected]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RegistrationResult"
        clockOffsetSeconds:
          type: integer
          description: Server clock minus device clock, present when the batch carried deviceSentAt (BR-25.7).
        clockCorrected:
          type: boolean
          description: True when the offset exceeded 5 minutes and was applied to the items.
      type: object
      required: [workerId, from, to]
      properties:
        workerId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Inclusive; at most 28 days after from.
        timeZone:
          type: string
          default: UTC
          description: IANA time zone name.
    PayCalculateResponse:
      type: object
      required: [workerId, from, to, timeZone, days]
      properties:
        workerId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        timeZone:
          type: string
        days:
          type: array
          items:
            $ref: "#/components/schemas/PayDay"
    PayDay:
      type: object
      required: [workDate, hours, flags, payLines]
      properties:
        workDate:
          type: string
          format: date
        hours:
          type: string
          description: Decimal hours, two places.
        flags:
          type: array
          items:
            type: string
            enum: [missing-clock-out, orphan-clock-out]
        payLines:
          type: array
          items:
            $ref: "#/components/schemas/PayLine"
    PayLine:
      type: object
      required: [type, hours, multiplier, amount, currency]
      properties:
        type:
          type: string
          enum: [base, overtime-1.5, overtime-2.0, shift-premium, flex-in, flex-out, absence-paid, absence-unpaid]
        hours:
          type: string
        multiplier:
          type: string
        amount:
          type: string
          description: Decimal money, rounded to the currency's minor unit.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    PayApproveResponse:
      type: object
      required: [workerId, from, to, days]
      properties:
        workerId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: array
          items:
            type: object
            required: [workDate, hours, status, newlyApproved, payLines]
            properties:
              workDate:
                type: string
                format: date
              hours:
                type: string
              status:
                type: string
                enum: [calculated, approved]
              newlyApproved:
                type: boolean
              payLines:
                type: array
                items:
                  $ref: "#/components/schemas/PayLine"
    NewMachine:
      type: object
      required: [machineId, resourceId, idealCycleSeconds]
      properties:
        machineId:
          type: string
          minLength: 1
          maxLength: 64
          description: Edge machine code, unique per tenant (e.g. M-101).
        resourceId:
          type: string
          format: uuid
        siteId:
          type: [string, "null"]
          format: uuid
        idealCycleSeconds:
          type: string
          description: Decimal seconds per unit, above 0 and at most 86400, up to 3 decimals.
          examples: ["60", "1.5"]
        idleThresholdSeconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 300
          description: RUNNING with no count for longer than this is idle (BR-25.6).
    Machine:
      type: object
      required: [id, machineId, resourceId, siteId, idealCycleSeconds, idleThresholdSeconds, lastSeq, createdAt]
      properties:
        id:
          type: string
          format: uuid
        machineId:
          type: string
        resourceId:
          type: string
          format: uuid
        siteId:
          type: [string, "null"]
          format: uuid
        idealCycleSeconds:
          type: string
        idleThresholdSeconds:
          type: integer
        lastSeq:
          type: integer
          description: Highest sequence number stored for the machine.
        createdAt:
          type: string
          format: date-time
    MachineEventBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/MachineEvent"
    MachineEvent:
      type: object
      required: [machineId, seq, kind, ts]
      properties:
        machineId:
          type: string
          minLength: 1
          maxLength: 64
        seq:
          type: integer
          minimum: 1
          description: Per-machine monotonic sequence from the edge.
        kind:
          type: string
          enum: [count, state, downtime, alarm, measurement]
        ts:
          type: string
          format: date-time
          description: Device time.
        goodCount:
          type: integer
          minimum: 0
          description: Delta since the previous count event; count events only.
        rejectCount:
          type: integer
          minimum: 0
          description: Delta since the previous count event; count events only.
        state:
          type: string
          enum: [RUNNING, IDLE, DOWN, SETUP, OFF]
          description: Required for state events.
        reasonCode:
          type: [string, "null"]
          minLength: 1
          maxLength: 32
        measurement:
          type: [object, "null"]
          required: [name, value]
          properties:
            name:
              type: string
            value:
              type: number
            unit:
              type: [string, "null"]
        jobId:
          type: [string, "null"]
          format: uuid
    IngestResult:
      type: object
      required: [accepted, dropped, staleDropped, gaps, andonsRaised, downtimesOpen]
      properties:
        accepted:
          type: integer
        dropped:
          type: integer
          description: Duplicates, regressions and stale events.
        staleDropped:
          type: integer
          description: The part of dropped that was older than 7 days.
        gaps:
          type: array
          description: Missing sequence runs (SF-0008); replay them from the edge buffer.
          items:
            type: object
            required: [machineId, from, to]
            properties:
              machineId:
                type: string
                description: Edge machine code.
              from:
                type: integer
              to:
                type: integer
        andonsRaised:
          type: integer
        downtimesOpen:
          type: integer
    Downtime:
      type: object
      required: [id, machineId, resourceId, startedAt, endedAt, reasonCode, category, andonRaised]
      properties:
        id:
          type: string
          format: uuid
        machineId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, "null"]
          format: date-time
        reasonCode:
          type: [string, "null"]
        category:
          type: string
          enum: [planned, unplanned]
        andonRaised:
          type: boolean
    DowntimeCode:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          minLength: 1
          maxLength: 32
        category:
          type: string
          enum: [planned, unplanned]
          description: Omit to keep the current category.
    Andon:
      type: object
      required: [id, resourceId, siteId, kind, severity, downtimeId, startedAt]
      properties:
        id:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        siteId:
          type: [string, "null"]
          format: uuid
        kind:
          type: string
          enum: [downtime]
        severity:
          type: string
          enum: [info, warning, error]
        downtimeId:
          type: [string, "null"]
          format: uuid
        startedAt:
          type: string
          format: date-time
    OeeBucket:
      type: object
      required: [resourceId, bucketStart, plannedMinutes, runMinutes, downMinutes, totalCount, goodCount,
        availability, performance, quality, oee, overRate, sourceEvents]
      properties:
        resourceId:
          type: string
          format: uuid
        bucketStart:
          type: string
          format: date-time
        plannedMinutes:
          type: string
        runMinutes:
          type: string
        downMinutes:
          type: string
          description: Unplanned downtime minutes (planned minutes less run minutes).
        totalCount:
          type: integer
        goodCount:
          type: integer
        availability:
          type: string
          description: Decimal, 4 places.
        performance:
          type: string
          description: Decimal, 4 places, capped at 1.
        quality:
          type: string
        oee:
          type: string
        overRate:
          type: boolean
          description: Performance exceeded 1.0 and was capped.
        sourceEvents:
          type: integer
    OeeRollup:
      type: object
      required: [from, to]
      properties:
        resourceIds:
          type: array
          maxItems: 1000
          items:
            type: string
            format: uuid
          description: Omit to roll up every registered machine.
        from:
          type: string
          format: date-time
          description: On a bucket boundary in UTC.
        to:
          type: string
          format: date-time
          description: A whole number of buckets after from, at most 24 hours later, not in the future.
        bucket:
          type: string
          enum: [5m, 15m, 60m]
          default: 15m
    OeeRollupResult:
      type: object
      required: [bucketMinutes, computed, changed, removed]
      properties:
        bucketMinutes:
          type: integer
        computed:
          type: integer
          description: Buckets with planned time in the window.
        changed:
          type: integer
          description: Buckets inserted or rewritten because a value changed.
        removed:
          type: integer
          description: Stored buckets removed because they no longer have planned time.
    BadgeLogin:
      type: object
      required: [badgeId]
      properties:
        badgeId:
          type: string
          minLength: 1
          maxLength: 64
          description: The scanned badge; surrounding blanks are ignored.
    RegistrationResult:
      type: object
      required: [id, status, flags, autoStopped, warnings]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, duplicate]
        flags:
          type: array
          items:
            type: string
            enum: [job-finished-conflict]
          description: Review flags stored on the item (BR-25.7).
        autoStopped:
          type: array
          description: Jobs this job-start stopped automatically (FR-25.3).
          items:
            $ref: "#/components/schemas/AutoStop"
        warnings:
          type: array
          description: Catalog warnings for the kiosk, SF-0002 per auto-stopped job and SF-0004 for a finished job.
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
                enum: [SF-0002, SF-0004]
              message:
                type: string
    AutoStop:
      type: object
      required: [registrationId, jobId, bundleId, startedAt, stoppedAt, hours, flags]
      properties:
        registrationId:
          type: string
          format: uuid
          description: The job-stop registration the server wrote.
        jobId:
          type: string
          format: uuid
        bundleId:
          type: [string, "null"]
          format: uuid
        startedAt:
          type: string
          format: date-time
        stoppedAt:
          type: string
          format: date-time
        hours:
          type: string
          description: Elapsed hours, or the job's share of the bundle in 0.01 h (BR-25.1).
        flags:
          type: array
          items:
            type: string
            enum: [auto-stopped, auto-stop-capped]
    KioskSession:
      type: object
      required: [workerId, partyId, name, userId, clockedInAt, openJobs, idleTimeoutMinutes]
      properties:
        workerId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        name:
          type: string
        userId:
          type: [string, "null"]
        clockedInAt:
          type: [string, "null"]
          format: date-time
          description: The open clock-in, or null when the worker is clocked out.
        openJobs:
          type: array
          description: The worker's open job-starts, one job or the jobs of one bundle (FR-25.3).
          items:
            $ref: "#/components/schemas/CurrentJob"
        idleTimeoutMinutes:
          type: integer
          description: Site parameter "Kiosk idle timeout min" (default 10).
    CurrentJob:
      type: object
      required: [jobId, bundleId, startedAt]
      properties:
        jobId:
          type: string
          format: uuid
        bundleId:
          type: [string, "null"]
          format: uuid
        startedAt:
          type: string
          format: date-time
    JobCheck:
      type: object
      required: [code, name, kind, mandatory]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          type: string
          enum: [numeric, pass-fail, text]
          description: Numeric passes within [min, max]; pass-fail takes "pass" or "fail"; text passes once a value is recorded.
        min:
          type: [string, "null"]
          description: Decimal, inclusive; numeric checks only.
        max:
          type: [string, "null"]
          description: Decimal, inclusive; numeric checks only.
        mandatory:
          type: boolean
          description: A mandatory check without a passing result blocks finished (SF-0005).
    JobCheckResult:
      type: object
      required: [code, value, pass]
      properties:
        code:
          type: string
        value:
          type: string
        pass:
          type: boolean
    JobPlan:
      type: object
      required: [id, orderRef, operationRef, resourceId, plannedQuantity, sequenceStart]
      properties:
        id:
          type: string
          format: uuid
          description: The w23 scheduled job id.
        orderRef:
          type: string
          minLength: 1
          maxLength: 64
        operationRef:
          type: string
          minLength: 1
          maxLength: 64
        resourceId:
          type: string
          format: uuid
        plannedQuantity:
          type: string
          description: Decimal, not negative, at most 4 decimal places.
        sequenceStart:
          type: string
          format: date-time
        checks:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/JobCheck"
    Job:
      type: object
      required: [id, orderRef, operationRef, resourceId, status, plannedQuantity, goodQuantity, scrapQuantity, sequenceStart, checks, results, finishedAt, version, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        orderRef:
          type: string
        operationRef:
          type: string
        resourceId:
          type: string
          format: uuid
        status:
          type: string
          enum: [released, started, finished]
        plannedQuantity:
          type: string
        goodQuantity:
          type: string
        scrapQuantity:
          type: string
        sequenceStart:
          type: string
          format: date-time
        checks:
          type: array
          items:
            $ref: "#/components/schemas/JobCheck"
        results:
          type: array
          description: Latest value per check; empty in the dispatch list.
          items:
            $ref: "#/components/schemas/JobCheckResult"
        finishedAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time
    JobFeedback:
      type: object
      required: [feedbackId]
      properties:
        feedbackId:
          type: string
          format: uuid
          description: Client-generated; a resend is a no-op.
        goodQuantity:
          type: [string, "null"]
          description: Decimal increment, not negative, at most 4 decimal places.
        scrapQuantity:
          type: [string, "null"]
          description: Decimal increment; above zero needs scrapReasonId.
        scrapReasonId:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          description: Scrap reason code, as on registrations.
        finished:
          type: boolean
          default: false
        checks:
          type: array
          maxItems: 50
          items:
            type: object
            required: [code, value]
            properties:
              code:
                type: string
              value:
                type: string
                minLength: 1
                maxLength: 64
        override:
          type: [object, "null"]
          description: Supervisor override of failed mandatory checks; only with finished true.
          required: [reason]
          properties:
            reason:
              type: string
              minLength: 1
              maxLength: 500
    JobFeedbackResult:
      type: object
      required: [job, duplicate]
      properties:
        job:
          $ref: "#/components/schemas/Job"
        duplicate:
          type: boolean
    ClockedWorker:
      type: object
      required: [workerId, name, badgeId, active, clockedInAt, jobs]
      properties:
        workerId:
          type: string
          format: uuid
        name:
          type: string
        badgeId:
          type: [string, "null"]
        active:
          type: boolean
        clockedInAt:
          type: string
          format: date-time
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/CurrentJob"
    PayRange:
      type: object
      required: [workerId, from, to]
      properties:
        workerId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Inclusive, at most 28 days after from.
        timeZone:
          type: string
          default: UTC
          description: IANA time zone the worker-days are calculated in.
    PayExportRange:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Inclusive; at most 31 days after from.
    PayExport:
      type: object
      required: [batchId, fromDate, toDate, lineCount, createdBy, createdAt]
      properties:
        batchId:
          type: string
          format: uuid
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        lineCount:
          type: integer
          minimum: 1
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        csv:
          type: string
          description: |
            Present on create and on get. Header batchId,workerId,workDate,payType,hours,multiplier,amount,currency;
            decimals keep their stored scale.
    ProcessCategory:
      type: string
      enum: [phase-start, phase-end, consumption, yield, process-data, quality-result, deviation, order-status, custom]
    ProcessDestination:
      type: string
      enum: [ebr, journal, quality, kafka, webhook]
    ProcessMessageStatus:
      type: string
      enum: [received, delivered, partially-delivered, error]
    Characteristic:
      type: object
      required: [name, type, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique within the message.
        type:
          type: string
          enum: [numeric, text, boolean]
        value:
          type: string
          description: Decimal string for numeric, "true" or "false" for boolean, at most 500 characters for text.
        min:
          type: string
          description: Decimal lower limit (numeric only).
        max:
          type: string
          description: Decimal upper limit (numeric only).
        unit:
          type: string
        outOfLimit:
          type: boolean
          readOnly: true
          description: Set by the server when a numeric value is outside its limits.
    NewProcessMessage:
      type: object
      required: [source, sourceMessageId, categoryCode, orderId, occurredAt]
      properties:
        source:
          type: string
          enum: [kiosk, edge, manual]
        sourceMessageId:
          type: string
          minLength: 1
          maxLength: 128
          description: Unique per source; a replay returns the stored message.
        categoryCode:
          $ref: "#/components/schemas/ProcessCategory"
        orderId:
          type: string
          format: uuid
        phasePath:
          type: string
          maxLength: 255
          description: ISA-88 path, procedure/unit procedure/operation/phase.
        occurredAt:
          type: string
          format: date-time
        values:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Characteristic"
    ProcessDelivery:
      type: object
      required: [destination, status, attempts, lastError, nextAttemptAt, deliveredAt]
      properties:
        destination:
          $ref: "#/components/schemas/ProcessDestination"
        status:
          type: string
          enum: [pending, delivered, error]
        attempts:
          type: integer
          minimum: 0
          maximum: 5
        lastError:
          type: [string, "null"]
        nextAttemptAt:
          type: [string, "null"]
          format: date-time
        deliveredAt:
          type: [string, "null"]
          format: date-time
    ProcessMessage:
      type: object
      required: [id, source, sourceMessageId, categoryCode, orderId, phasePath, occurredAt, receivedAt, status, outOfLimit, values, deliveries, deletedAt, deletedBy, deleteReason]
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          enum: [kiosk, edge, manual]
        sourceMessageId:
          type: string
        categoryCode:
          $ref: "#/components/schemas/ProcessCategory"
        orderId:
          type: string
          format: uuid
        phasePath:
          type: string
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ProcessMessageStatus"
        outOfLimit:
          type: boolean
          description: At least one value is outside its limits (BR-25.13).
        values:
          type: array
          items:
            $ref: "#/components/schemas/Characteristic"
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/ProcessDelivery"
        deletedAt:
          type: [string, "null"]
          format: date-time
          description: When a supervisor deleted the message; null while it is not deleted.
        deletedBy:
          type: [string, "null"]
        deleteReason:
          type: [string, "null"]
    DeleteProcessMessage:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the message is deleted; kept for audit (leading and trailing spaces are trimmed).
    RetryClaim:
      type: object
      required: [messageId, destination, attempts, nextAttemptAt]
      properties:
        messageId:
          type: string
          format: uuid
        destination:
          $ref: "#/components/schemas/ProcessDestination"
        attempts:
          type: integer
          description: Failed attempts reported so far.
        nextAttemptAt:
          type: string
          format: date-time
          description: End of the lease; the sweep does not publish the destination again before it unless its consumer reports.
    ProcessIngest:
      type: object
      required: [message, duplicate]
      properties:
        message:
          $ref: "#/components/schemas/ProcessMessage"
        duplicate:
          type: boolean
    DeliveryReport:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [delivered, failed]
        error:
          type: string
          maxLength: 1000
          description: Why the destination failed; kept as lastError.
    Reprocess:
      type: object
      required: [destination, reason]
      properties:
        destination:
          $ref: "#/components/schemas/ProcessDestination"
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Problem:
      type: object
      description: RFC 9457 problem details with Passage extensions.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: https://passage.dev/problems/<code>
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable catalog code such as SF-0101, or a snake_case code.
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
