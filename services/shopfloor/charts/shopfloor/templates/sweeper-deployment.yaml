{{- if .Values.sweeper.enabled }}
# The tenant sweeper (#25, 25-1): andon sweep, OEE rollup, auto clock-out and process message retry for
# the tenants listed in sweeper.tenantIds. Every job is safe to repeat, but one replica is enough.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-shopfloor-sweeper
  labels:
    app.kubernetes.io/name: shopfloor
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sweeper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shopfloor
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sweeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopfloor
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: sweeper
    spec:
{{- if eq .Values.sweeper.tenantSource "identity" }}
      volumes:
        - name: service-identity
          secret:
            secretName: {{ required "sweeper.signingKeySecret is required with tenantSource identity" .Values.sweeper.signingKeySecret }}
            defaultMode: 0440
{{- end }}
      containers:
        - name: shopfloor-sweeper
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [sweep]
          ports:
            - name: admin
              containerPort: 9090
          env:
            - name: PASSAGE_ENV
              value: {{ .Values.config.env | quote }}
            - name: SERVICE_NAME
              value: {{ .Values.config.serviceName | quote }}
            - name: ADMIN_ADDR
              value: {{ .Values.config.adminAddr | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret.name }}
                  key: {{ .Values.databaseSecret.key }}
            - name: SWEEP_TENANT_IDS
              value: {{ if eq .Values.sweeper.tenantSource "identity" }}{{ .Values.sweeper.tenantIds | quote }}{{ else }}{{ required "sweeper.tenantIds is required" .Values.sweeper.tenantIds | quote }}{{ end }}
            - name: SWEEP_ANDON_INTERVAL
              value: {{ .Values.sweeper.andonInterval | quote }}
            - name: SWEEP_ROLLUP_INTERVAL
              value: {{ .Values.sweeper.rollupInterval | quote }}
            - name: SWEEP_AUTO_CLOCK_INTERVAL
              value: {{ .Values.sweeper.autoClockInterval | quote }}
            - name: SWEEP_RETRY_INTERVAL
              value: {{ .Values.sweeper.retryInterval | quote }}
            - name: SWEEP_AUTO_CLOCK_AFTER_HOURS
              value: {{ .Values.sweeper.autoClockAfterHours | quote }}
{{- if eq .Values.sweeper.tenantSource "identity" }}
            - name: SWEEP_TENANT_SOURCE
              value: identity
            - name: IDENTITY_URL
              value: {{ required "sweeper.identityUrl is required with tenantSource identity" .Values.sweeper.identityUrl | quote }}
            - name: SWEEP_OPERATOR_TENANT_ID
              value: {{ required "sweeper.operatorTenantId is required with tenantSource identity" .Values.sweeper.operatorTenantId | quote }}
            - name: PASSAGE_SERVICE_NAME
              value: shopfloor
            - name: PASSAGE_SERVICE_SIGNING_KEY_FILE
              value: /var/run/passage/service-identity/signing-key
{{- if .Values.sweeper.keyId }}
            - name: PASSAGE_SERVICE_KEY_ID
              value: {{ .Values.sweeper.keyId | quote }}
{{- end }}
          volumeMounts:
            - { name: service-identity, mountPath: /var/run/passage/service-identity, readOnly: true }
{{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.sweeper.resources | nindent 12 }}
{{- end }}
