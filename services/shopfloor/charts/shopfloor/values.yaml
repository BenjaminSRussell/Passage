image:
  repository: ghcr.io/benjaminsrussell/passage/shopfloor
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 3

# Name of a Secret holding key DATABASE_URL (passage_app role, no BYPASSRLS).
databaseSecret:
  name: shopfloor-db
  key: DATABASE_URL

config:
  env: dev
  httpAddr: ":8080"
  adminAddr: ":9090"
  serviceName: shopfloor

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceMonitor:
  enabled: false
  interval: 30s

# The CA that signs edge connector client certificates (25-4, dev and demo plant; the platform
# certificate issuer is not built). A Secret with keys ca.crt and ca.key. Empty: enrollment answers SF-0173.
edgeCa:
  secret: ""

# The production operation status consumer (slice 17). It exits at start until
# service:shopfloor-production is seeded in the service principal table.
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: shopfloor-production
    username: shopfloor-consumer
    secret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# The tenant sweeper (#25, 25-1): `shopfloor sweep` runs the andon sweep (1m), OEE rollup (15m),
# auto clock-out (1h) and process message retry (1m) for the listed tenants. "0" switches a job off.
sweeper:
  enabled: false
  tenantIds: ""        # comma-separated tenant UUIDs; with tenantSource identity, extra tenants on top of the registry's
  # config: sweep tenantIds. identity: also sweep every active tenant of the identity registry (read at the
  # start of every run). That needs identityUrl, the platform operator tenant, and a service signing key whose
  # public key identity trusts for the caller "shopfloor" (the grant shopfloor -> identity.tenant-registry.read).
  tenantSource: config
  identityUrl: ""
  operatorTenantId: ""
  signingKeySecret: ""  # Secret with key signing-key (base64 Ed25519 seed)
  keyId: ""
  andonInterval: 1m
  rollupInterval: 15m
  autoClockInterval: 1h
  retryInterval: 1m
  autoClockAfterHours: 16
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
