image:
  repository: ghcr.io/benjaminsrussell/passage/shopfloor
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 3

# Name of a Secret holding key DATABASE_URL (passage_app role, no BYPASSRLS).
databaseSecret:
  name: shopfloor-db
  key: DATABASE_URL

config:
  env: dev
  httpAddr: ":8080"
  adminAddr: ":9090"
  serviceName: shopfloor

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceMonitor:
  enabled: false
  interval: 30s
