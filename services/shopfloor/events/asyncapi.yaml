asyncapi: 3.0.0
info:
  title: Passage Shop Floor events
  version: 0.1.0
  description: |
    CloudEvents 1.0 published by the shopfloor service through the transactional
    outbox (Debezium relays to Kafka), written in the same transaction as the
    change. Source is `shopfloor`; the Kafka key is the aggregate id
    (registration id, worker id for payday approvals, batch id for payroll
    exports, alert id for andon, message id for process messages, resource id
    for OEE buckets).
    Schema evolution is additive only.
defaultContentType: application/cloudevents+json
channels:
  registrationPosted:
    address: passage.shopfloor.registration
    messages:
      registrationPosted:
        $ref: "#/components/messages/RegistrationPosted"
  paydayApproved:
    address: passage.shopfloor.payday
    messages:
      paydayApproved:
        $ref: "#/components/messages/PaydayApproved"
  registrationCorrected:
    address: passage.shopfloor.registration-corrected
    description: |
      A supervisor changed the times of a registration with a reason (FR-25.8). Not in
      the PRD event table; consumers that posted the old hours (w21 job card) replace them.
    messages:
      registrationCorrected:
        $ref: "#/components/messages/RegistrationCorrected"
  paydayRevised:
    address: passage.shopfloor.payday-revised
    description: |
      An approved worker-day was revised with reversal lines (BR-25.8, AC-25.8). Not in
      the PRD event table; payroll applies the reversed and added lines.
    messages:
      paydayRevised:
        $ref: "#/components/messages/PaydayRevised"
  paydayExported:
    address: passage.shopfloor.pay-export
    messages:
      paydayExported:
        $ref: "#/components/messages/PaydayExported"
  andonRaised:
    address: passage.shopfloor.andon
    messages:
      andonRaised:
        $ref: "#/components/messages/AndonRaised"
  jobReported:
    address: passage.shopfloor.job
    description: |
      Operator feedback on a job (FR-25.4, FR-25.5): reported quantities, the finish of
      the operation and failed quality checks. Not in the PRD event table; production
      (w21) and quality (w33) consume it.
    messages:
      jobReported:
        $ref: "#/components/messages/JobReported"
  oeeBuckets:
    address: passage.shopfloor.oee
    description: |
      Stored OEE buckets written by the OEE rollup job (FR-25.10; the PRD names the
      event `passage.shopfloor.oee.bucket-updated.v1`, renamed to the platform rule
      of one word per segment). Dashboards (w46) roll buckets up by summing minutes
      and counts, never by averaging ratios (BR-25.5).
    messages:
      oeeBucketUpdated:
        $ref: "#/components/messages/OEEBucketUpdated"
      oeeBucketRemoved:
        $ref: "#/components/messages/OEEBucketRemoved"
  processMessages:
    address: passage.shopfloor.process-messages
    description: |
      The Kafka destination of process messages (FR-25.17, PRD topic
      `shopfloor.process-messages`). Consuming contexts (w21 journal, w33 quality,
      w24 EBR, w35 webhook) act on the destinations they own and report the
      outcome to POST /process-messages/{id}/deliveries/{destination}:report.
    messages:
      processMessageReceived:
        $ref: "#/components/messages/ProcessMessageReceived"
      processMessageDelivered:
        $ref: "#/components/messages/ProcessMessageDelivered"
      processMessageDeleted:
        $ref: "#/components/messages/ProcessMessageDeleted"
operations:
  publishJobReported:
    action: send
    channel:
      $ref: "#/channels/jobReported"
    messages:
      - $ref: "#/channels/jobReported/messages/jobReported"
  publishOEEBucketUpdated:
    action: send
    channel:
      $ref: "#/channels/oeeBuckets"
    messages:
      - $ref: "#/channels/oeeBuckets/messages/oeeBucketUpdated"
  publishOEEBucketRemoved:
    action: send
    channel:
      $ref: "#/channels/oeeBuckets"
    messages:
      - $ref: "#/channels/oeeBuckets/messages/oeeBucketRemoved"
  publishProcessMessageReceived:
    action: send
    channel:
      $ref: "#/channels/processMessages"
    messages:
      - $ref: "#/channels/processMessages/messages/processMessageReceived"
  publishProcessMessageDelivered:
    action: send
    channel:
      $ref: "#/channels/processMessages"
    messages:
      - $ref: "#/channels/processMessages/messages/processMessageDelivered"
  publishProcessMessageDeleted:
    action: send
    channel:
      $ref: "#/channels/processMessages"
    messages:
      - $ref: "#/channels/processMessages/messages/processMessageDeleted"
  publishRegistrationCorrected:
    action: send
    summary: Registration corrected
    description: Sends the registration corrected event through the outbox.
    channel:
      $ref: "#/channels/registrationCorrected"
    messages:
      - $ref: "#/channels/registrationCorrected/messages/registrationCorrected"
  publishPaydayRevised:
    action: send
    summary: Payday revised
    description: Sends the payday revised event through the outbox.
    channel:
      $ref: "#/channels/paydayRevised"
    messages:
      - $ref: "#/channels/paydayRevised/messages/paydayRevised"
  publishPaydayExported:
    action: send
    summary: Payday exported
    description: Sends the payday exported event through the outbox.
    channel:
      $ref: "#/channels/paydayExported"
    messages:
      - $ref: "#/channels/paydayExported/messages/paydayExported"
  publishAndonRaised:
    action: send
    summary: Andon raised
    description: Sends the andon raised event through the outbox.
    channel:
      $ref: "#/channels/andonRaised"
    messages:
      - $ref: "#/channels/andonRaised/messages/andonRaised"
  publishRegistrationPosted:
    action: send
    summary: Registration posted
    description: Sends the registration posted event through the outbox.
    channel:
      $ref: "#/channels/registrationPosted"
    messages:
      - $ref: "#/channels/registrationPosted/messages/registrationPosted"
  publishPaydayApproved:
    action: send
    summary: Payday approved
    description: Sends the payday approved event through the outbox.
    channel:
      $ref: "#/channels/paydayApproved"
    messages:
      - $ref: "#/channels/paydayApproved/messages/paydayApproved"
components:
  messages:
    JobReported:
      name: dev.passage.shopfloor.job.reported.v1
      contentType: application/cloudevents+json
      description: Published once per stored feedback posting on a job, in the same transaction; a replayed feedbackId publishes nothing.
      payload:
        $ref: "#/components/schemas/JobReportedData"
    OEEBucketUpdated:
      name: dev.passage.shopfloor.oeebucket.updated.v1
      contentType: application/cloudevents+json
      description: Published by the OEE rollup for a bucket that is new or whose values changed; an unchanged bucket publishes nothing.
      payload:
        $ref: "#/components/schemas/OEEBucketUpdatedData"
    OEEBucketRemoved:
      name: dev.passage.shopfloor.oeebucket.removed.v1
      contentType: application/cloudevents+json
      description: Published by the OEE rollup when a stored bucket no longer has planned time (for example its downtime was later coded as planned).
      payload:
        $ref: "#/components/schemas/OEEBucketRemovedData"
    RegistrationPosted:
      name: dev.passage.shopfloor.registration.posted.v1
      contentType: application/cloudevents+json
      summary: Published once per stored time registration (or batch item)
      description: Published once per stored time registration (or batch item), in the same transaction; closed job registrations carry hours and bundle id for the w21 job-card consumer.
      payload:
        $ref: "#/components/schemas/RegistrationPostedData"
    RegistrationCorrected:
      name: dev.passage.shopfloor.registration.corrected.v1
      contentType: application/cloudevents+json
      summary: Registration corrected
      description: Published once per supervisor correction of a registration, in the same transaction; hours is the new elapsed time of a closed registration.
      payload:
        $ref: "#/components/schemas/RegistrationCorrectedData"
    PaydayRevised:
      name: dev.passage.shopfloor.payday.revised.v1
      contentType: application/cloudevents+json
      summary: Approved payday revised
      description: Published once per approved worker-day revised with reversal lines; reversed lines carry negative hours and amounts.
      payload:
        $ref: "#/components/schemas/PaydayRevisedData"
    PaydayApproved:
      name: dev.passage.shopfloor.payday.approved.v1
      contentType: application/cloudevents+json
      summary: Published when a supervisor approves a worker day
      description: Published when a supervisor approves a worker day; the pay lines are locked and ready for export.
      payload:
        $ref: "#/components/schemas/PaydayApprovedData"
    PaydayExported:
      name: dev.passage.shopfloor.payday.exported.v1
      contentType: application/cloudevents+json
      summary: Published once per payroll export batch with the approved pay lines it contains
      description: Published once per payroll export batch with the approved pay lines it contains, in the same transaction as the batch.
      payload:
        $ref: "#/components/schemas/PaydayExportedData"
    AndonRaised:
      name: dev.passage.shopfloor.andon.raised.v1
      contentType: application/cloudevents+json
      summary: Published when a machine downtime stays open past the andon threshold (10 minutes) and an alert is raised
      description: Published when a machine downtime stays open past the andon threshold (10 minutes) and an alert is raised.
      payload:
        $ref: "#/components/schemas/AndonRaisedData"
    ProcessMessageReceived:
      name: dev.passage.shopfloor.processmessage.received.v1
      contentType: application/cloudevents+json
      description: Published when a process message is stored, again when a destination in error is reprocessed, and again by the retry sweep for the destinations whose wait elapsed (then `destinations` holds only those destinations).
      payload:
        $ref: "#/components/schemas/ProcessMessageReceivedData"
    ProcessMessageDelivered:
      name: dev.passage.shopfloor.processmessage.delivered.v1
      contentType: application/cloudevents+json
      description: Published once, when every destination of the message is delivered.
      payload:
        $ref: "#/components/schemas/ProcessMessageDeliveredData"
    ProcessMessageDeleted:
      name: dev.passage.shopfloor.processmessage.deleted.v1
      contentType: application/cloudevents+json
      description: Published once, when a supervisor deletes a message with a destination in error, with the reason. `undelivered` names the destinations that never received it; the EBR consumer records the missed message as an exception (BR-24.15).
      payload:
        $ref: "#/components/schemas/ProcessMessageDeletedData"
  schemas:
    ProcessMessageReceivedData:
      type: object
      required: [messageId, source, sourceMessageId, categoryCode, orderId, phasePath, destinations, values, outOfLimit, occurredAt]
      properties:
        messageId:
          type: string
          format: uuid
        source:
          type: string
          enum: [kiosk, edge, manual]
        sourceMessageId:
          type: string
        categoryCode:
          type: string
          enum: [phase-start, phase-end, consumption, yield, process-data, quality-result, deviation, order-status, custom]
        orderId:
          type: string
          format: uuid
        phasePath:
          type: string
          description: ISA-88 path of the phase; empty when the message is not tied to a phase.
        destinations:
          type: array
          minItems: 1
          items:
            type: string
            enum: [ebr, journal, quality, kafka, webhook]
        values:
          type: array
          items:
            $ref: "#/components/schemas/Characteristic"
        outOfLimit:
          type: boolean
          description: A value is outside its limits; the EBR consumer records an exception (BR-25.13).
        occurredAt:
          type: string
          format: date-time
    ProcessMessageDeliveredData:
      type: object
      required: [messageId, categoryCode, orderId]
      properties:
        messageId:
          type: string
          format: uuid
        categoryCode:
          type: string
        orderId:
          type: string
          format: uuid
    ProcessMessageDeletedData:
      type: object
      required: [messageId, categoryCode, orderId, reason, undelivered, deletedBy, deletedAt]
      properties:
        messageId:
          type: string
          format: uuid
        categoryCode:
          type: string
        orderId:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500
        undelivered:
          type: array
          items:
            type: string
            enum: [ebr, journal, quality, kafka, webhook]
        deletedBy:
          type: string
        deletedAt:
          type: string
          format: date-time
    Characteristic:
      type: object
      required: [name, type, value, outOfLimit]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [numeric, text, boolean]
        value:
          type: string
          description: Decimal string for numeric, "true" or "false" for boolean.
        min:
          type: string
        max:
          type: string
        unit:
          type: string
        outOfLimit:
          type: boolean
    PaydayExportedData:
      type: object
      required: [batchId, fromDate, toDate, lineCount, createdBy, lines]
      additionalProperties: false
      description: One payroll export batch (FR-25.8) with every pay line it carries; consumed by payroll (w43).
      properties:
        batchId:
          type: string
          format: uuid
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        lineCount:
          type: integer
          minimum: 1
        createdBy:
          type: string
        lines:
          type: array
          items:
            type: object
            required: [workerId, workDate, type, hours, multiplier, amount, currency]
            additionalProperties: false
            properties:
              workerId:
                type: string
                format: uuid
              workDate:
                type: string
                format: date
              type:
                type: string
              hours:
                type: string
              multiplier:
                type: string
              amount:
                type: string
              currency:
                type: string
                pattern: "^[A-Z]{3}$"
    OEEBucketUpdatedData:
      type: object
      required: [resourceId, bucketMinutes, bucketStart, plannedMinutes, runMinutes, downMinutes, totalCount, goodCount,
        availability, performance, quality, oee, overRate]
      additionalProperties: false
      properties:
        resourceId:
          type: string
          format: uuid
        bucketMinutes:
          type: integer
          enum: [5, 15, 60]
        bucketStart:
          type: string
          format: date-time
        plannedMinutes:
          type: string
          description: Decimal, 4 places.
        runMinutes:
          type: string
        downMinutes:
          type: string
          description: Unplanned downtime (planned less run), including idle time (BR-25.6).
        totalCount:
          type: integer
        goodCount:
          type: integer
        availability:
          type: string
          description: Decimal ratio, 4 places.
        performance:
          type: string
          description: Decimal ratio, 4 places, capped at 1.
        quality:
          type: string
        oee:
          type: string
        overRate:
          type: boolean
    OEEBucketRemovedData:
      type: object
      required: [resourceId, bucketMinutes, bucketStart]
      additionalProperties: false
      properties:
        resourceId:
          type: string
          format: uuid
        bucketMinutes:
          type: integer
          enum: [5, 15, 60]
        bucketStart:
          type: string
          format: date-time
    JobReportedData:
      type: object
      required: [jobId, feedbackId, orderRef, operationRef, resourceId, qtyGood, qtyScrap, scrapReasonId, goodQuantity, scrapQuantity, finished, failedChecks, overrideReason, recordedBy, recordedAt]
      additionalProperties: false
      properties:
        jobId:
          type: string
          format: uuid
        feedbackId:
          type: string
          format: uuid
        orderRef:
          type: string
        operationRef:
          type: string
        resourceId:
          type: string
          format: uuid
        qtyGood:
          type: string
          description: Decimal; this posting's good quantity.
        qtyScrap:
          type: string
          description: Decimal; this posting's scrap quantity.
        scrapReasonId:
          type: [string, "null"]
        goodQuantity:
          type: string
          description: Decimal; the job's good total after this posting.
        scrapQuantity:
          type: string
          description: Decimal; the job's scrap total after this posting.
        finished:
          type: boolean
        failedChecks:
          type: array
          description: Codes of checks whose latest result fails.
          items:
            type: string
        overrideReason:
          type: [string, "null"]
          description: Set when a supervisor finished the job over failed mandatory checks (SF-0005).
        recordedBy:
          type: string
        recordedAt:
          type: string
          format: date-time
    AndonRaisedData:
      type: object
      required: [alertId, resourceId, kind, severity, jobId, startedAt]
      additionalProperties: false
      properties:
        alertId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [downtime]
        severity:
          type: string
          enum: [info, warning, error]
        jobId:
          type: [string, "null"]
          format: uuid
        startedAt:
          type: string
          format: date-time
    RegistrationPostedData:
      type: object
      required: [registrationId, workerId, kind, jobId, bundleId, hours, qtyGood, qtyScrap, offline]
      additionalProperties: false
      properties:
        registrationId:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [clock-in, clock-out, job-start, job-stop, absence, indirect]
        jobId:
          type: [string, "null"]
          format: uuid
        bundleId:
          type: [string, "null"]
          format: uuid
          description: Set when the job was worked in a bundle; its hours are then the job's share (BR-25.1).
        hours:
          type: [string, "null"]
          description: |
            Elapsed hours (decimal, 4 places) of a closed registration; for a
            bundled job, its share of the bundle's time in 0.01 h (BR-25.1).
            Null while open.
        qtyGood:
          type: string
        qtyScrap:
          type: string
        offline:
          type: boolean
        flags:
          type: array
          items:
            type: string
            enum: [job-finished-conflict, auto-stopped, auto-stop-capped]
          description: |
            Review flags. `job-finished-conflict` on a job-start for a job the
            server had already finished (BR-25.7); `auto-stopped` (and
            `auto-stop-capped` past 24 hours) on a closed job-stop the server
            wrote when the worker started another job (FR-25.3). Empty otherwise.
    RegistrationCorrectedData:
      type: object
      required: [registrationId, workerId, kind, jobId, oldStartedAt, oldStoppedAt, newStartedAt, newStoppedAt, hours, reason, correctedBy]
      additionalProperties: false
      properties:
        registrationId:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [clock-in, clock-out, job-start, job-stop, absence, indirect]
        jobId:
          type: [string, "null"]
          format: uuid
        oldStartedAt:
          type: string
          format: date-time
        oldStoppedAt:
          type: [string, "null"]
          format: date-time
        newStartedAt:
          type: string
          format: date-time
        newStoppedAt:
          type: [string, "null"]
          format: date-time
        hours:
          type: [string, "null"]
          description: New elapsed hours of a closed registration.
        reason:
          type: string
        correctedBy:
          type: string
    PaydayRevisedData:
      type: object
      required: [workerId, workDate, revision, reason, reversedLines, addedLines, revisedBy]
      additionalProperties: false
      properties:
        workerId:
          type: string
          format: uuid
        workDate:
          type: string
          format: date
        revision:
          type: integer
          minimum: 1
        reason:
          type: string
        reversedLines:
          type: array
          items:
            type: object
            required: [type, hours, multiplier, amount, currency]
            properties:
              type:
                type: string
              hours:
                type: string
              multiplier:
                type: string
              amount:
                type: string
              currency:
                type: string
                pattern: "^[A-Z]{3}$"
        addedLines:
          type: array
          items:
            type: object
            required: [type, hours, multiplier, amount, currency]
            properties:
              type:
                type: string
              hours:
                type: string
              multiplier:
                type: string
              amount:
                type: string
              currency:
                type: string
                pattern: "^[A-Z]{3}$"
        revisedBy:
          type: string
    PaydayApprovedData:
      type: object
      required: [workerId, workDate, payLines, approvedBy]
      additionalProperties: false
      properties:
        workerId:
          type: string
          format: uuid
        workDate:
          type: string
          format: date
        payLines:
          type: array
          items:
            type: object
            required: [type, hours, multiplier, amount, currency]
            properties:
              type:
                type: string
              hours:
                type: string
              multiplier:
                type: string
              amount:
                type: string
              currency:
                type: string
                pattern: "^[A-Z]{3}$"
        approvedBy:
          type: string
