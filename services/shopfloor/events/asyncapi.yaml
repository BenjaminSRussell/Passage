asyncapi: 3.0.0
info:
  title: Passage Shop Floor events
  version: 0.1.0
  description: |
    CloudEvents 1.0 published by the shopfloor service through the transactional
    outbox (Debezium relays to Kafka), written in the same transaction as the
    change. Source is `shopfloor`; the Kafka key is the aggregate id
    (registration id, worker id for payday approvals, batch id for payroll
    exports, alert id for andon, message id for process messages, resource id
    for OEE buckets, profile id for time profiles, agreement id for pay agreements).
    Schema evolution is additive only.
defaultContentType: application/cloudevents+json
channels:
  registrationPosted:
    address: passage.shopfloor.registration
    messages:
      registrationPosted:
        $ref: "#/components/messages/RegistrationPosted"
  paydayApproved:
    address: passage.shopfloor.payday
    messages:
      paydayApproved:
        $ref: "#/components/messages/PaydayApproved"
  registrationCorrected:
    address: passage.shopfloor.registration-corrected
    description: |
      A supervisor changed the times of a registration with a reason (FR-25.8). Not in
      the PRD event table; consumers that posted the old hours (w21 job card) replace them.
    messages:
      registrationCorrected:
        $ref: "#/components/messages/RegistrationCorrected"
  paydayRevised:
    address: passage.shopfloor.payday-revised
    description: |
      An approved worker-day was revised with reversal lines (BR-25.8, AC-25.8). Not in
      the PRD event table; payroll applies the reversed and added lines.
    messages:
      paydayRevised:
        $ref: "#/components/messages/PaydayRevised"
  timeProfileSaved:
    address: passage.shopfloor.timeprofile
    description: A time profile was created or changed (FR-25.7). Not in the PRD event table.
    messages:
      timeProfileSaved:
        $ref: "#/components/messages/TimeProfileSaved"
  payAgreementSaved:
    address: passage.shopfloor.payagreement
    description: A pay agreement was created or changed (FR-25.7). Not in the PRD event table.
    messages:
      payAgreementSaved:
        $ref: "#/components/messages/PayAgreementSaved"
  workerAssigned:
    address: passage.shopfloor.worker
    description: A worker was linked to, or unlinked from, a time profile and a pay agreement. Not in the PRD event table.
    messages:
      workerAssigned:
        $ref: "#/components/messages/WorkerAssigned"
  absenceCodeSaved:
    address: passage.shopfloor.absencecode
    description: An absence code was created or changed (FR-25.2). Not in the PRD event table.
    messages:
      absenceCodeSaved:
        $ref: "#/components/messages/AbsenceCodeSaved"
  downtimeReasonSaved:
    address: passage.shopfloor.downtimereason
    description: A downtime reason code was created or changed (FR-25.11). Not in the PRD event table.
    messages:
      downtimeReasonSaved:
        $ref: "#/components/messages/DowntimeReasonSaved"
  productionOperation:
    address: passage.production.operation
    description: |
      Production's operation status (w21), consumed by the `shopfloor-production` consumer: an
      operation was finished (the finish command, or the last report as finished) or reopened. A
      finished operation stops new online job starts on its jobs (SF-0157) and flags offline ones
      (`job-finished-conflict`) and refuses quantity feedback on them (SF-0161) until it is reopened.
      A finish newer than the stored status also closes, in the same transaction, every open
      job-start on its jobs with a job-stop flagged `production-finished` published as
      `registration.posted`; a bundle with an open member on those jobs is closed whole, its time
      from its earliest start to the finish split again over all its members (BR-25.1). A start that
      began after the finish but was stored before the event arrived is closed at 0.00 h and its stop
      also carries `job-finished-conflict`. The consumer keeps the latest status per order
      and operation, ordered by `orderVersion` and then `occurredAt`, and refuses (dead-letters) an
      event whose CloudEvents `source` is not `production`.
    messages:
      operationStatusChanged:
        $ref: "#/components/messages/OperationStatusChanged"
  edgeNodeSaved:
    address: passage.shopfloor.edge-node
    description: An edge node was registered or its name, site, ring, connector identity or status changed (FR-25.19). Not in the PRD event table.
    messages:
      edgeNodeSaved:
        $ref: "#/components/messages/EdgeNodeSaved"
  edgeConfig:
    address: passage.shopfloor.edge-config
    description: |
      Configuration documents of an edge node (FR-25.19): a new version was published, and a
      heartbeat reported a version applied. Not in the PRD event table; fleet audit and the
      rollout job consume them. A heartbeat itself publishes nothing.
    messages:
      edgeConfigPublished:
        $ref: "#/components/messages/EdgeConfigPublished"
      edgeConfigApplied:
        $ref: "#/components/messages/EdgeConfigApplied"
  paydayExported:
    address: passage.shopfloor.pay-export
    messages:
      paydayExported:
        $ref: "#/components/messages/PaydayExported"
  andonRaised:
    address: passage.shopfloor.andon
    messages:
      andonRaised:
        $ref: "#/components/messages/AndonRaised"
  jobReported:
    address: passage.shopfloor.job
    description: |
      Operator feedback on a job (FR-25.4, FR-25.5): reported quantities, the finish of
      the operation and failed quality checks, and the reopening of a finished job by a
      supervisor. Not in the PRD event table; production (w21) and quality (w33) consume it.
    messages:
      jobReported:
        $ref: "#/components/messages/JobReported"
      jobReopened:
        $ref: "#/components/messages/JobReopened"
  oeeBuckets:
    address: passage.shopfloor.oee
    description: |
      Stored OEE buckets written by the OEE rollup job (FR-25.10; the PRD names the
      event `passage.shopfloor.oee.bucket-updated.v1`, renamed to the platform rule
      of one word per segment). Dashboards (w46) roll buckets up by summing minutes
      and counts, never by averaging ratios (BR-25.5).
    messages:
      oeeBucketUpdated:
        $ref: "#/components/messages/OEEBucketUpdated"
      oeeBucketRemoved:
        $ref: "#/components/messages/OEEBucketRemoved"
  processMessages:
    address: passage.shopfloor.process-messages
    description: |
      The Kafka destination of process messages (FR-25.17, PRD topic
      `shopfloor.process-messages`). Consuming contexts (w21 journal, w33 quality,
      w24 EBR, w35 webhook) act on the destinations they own and report the
      outcome to POST /process-messages/{id}/deliveries/{destination}:report.
    messages:
      processMessageReceived:
        $ref: "#/components/messages/ProcessMessageReceived"
      processMessageDelivered:
        $ref: "#/components/messages/ProcessMessageDelivered"
      processMessageDeleted:
        $ref: "#/components/messages/ProcessMessageDeleted"
operations:
  receiveOperationStatusChanged:
    action: receive
    channel:
      $ref: "#/channels/productionOperation"
    messages:
      - $ref: "#/channels/productionOperation/messages/operationStatusChanged"
  publishDowntimeReasonSaved:
    action: send
    channel:
      $ref: "#/channels/downtimeReasonSaved"
    messages:
      - $ref: "#/channels/downtimeReasonSaved/messages/downtimeReasonSaved"
  publishJobReopened:
    action: send
    channel:
      $ref: "#/channels/jobReported"
    messages:
      - $ref: "#/channels/jobReported/messages/jobReopened"
  publishJobReported:
    action: send
    channel:
      $ref: "#/channels/jobReported"
    messages:
      - $ref: "#/channels/jobReported/messages/jobReported"
  publishOEEBucketUpdated:
    action: send
    channel:
      $ref: "#/channels/oeeBuckets"
    messages:
      - $ref: "#/channels/oeeBuckets/messages/oeeBucketUpdated"
  publishOEEBucketRemoved:
    action: send
    channel:
      $ref: "#/channels/oeeBuckets"
    messages:
      - $ref: "#/channels/oeeBuckets/messages/oeeBucketRemoved"
  publishProcessMessageReceived:
    action: send
    channel:
      $ref: "#/channels/processMessages"
    messages:
      - $ref: "#/channels/processMessages/messages/processMessageReceived"
  publishProcessMessageDelivered:
    action: send
    channel:
      $ref: "#/channels/processMessages"
    messages:
      - $ref: "#/channels/processMessages/messages/processMessageDelivered"
  publishProcessMessageDeleted:
    action: send
    channel:
      $ref: "#/channels/processMessages"
    messages:
      - $ref: "#/channels/processMessages/messages/processMessageDeleted"
  publishRegistrationCorrected:
    action: send
    summary: Registration corrected
    description: Sends the registration corrected event through the outbox.
    channel:
      $ref: "#/channels/registrationCorrected"
    messages:
      - $ref: "#/channels/registrationCorrected/messages/registrationCorrected"
  publishPaydayRevised:
    action: send
    summary: Payday revised
    description: Sends the payday revised event through the outbox.
    channel:
      $ref: "#/channels/paydayRevised"
    messages:
      - $ref: "#/channels/paydayRevised/messages/paydayRevised"
  publishPaydayExported:
    action: send
    summary: Payday exported
    description: Sends the payday exported event through the outbox.
    channel:
      $ref: "#/channels/paydayExported"
    messages:
      - $ref: "#/channels/paydayExported/messages/paydayExported"
  publishAndonRaised:
    action: send
    summary: Andon raised
    description: Sends the andon raised event through the outbox.
    channel:
      $ref: "#/channels/andonRaised"
    messages:
      - $ref: "#/channels/andonRaised/messages/andonRaised"
  publishRegistrationPosted:
    action: send
    summary: Registration posted
    description: Sends the registration posted event through the outbox.
    channel:
      $ref: "#/channels/registrationPosted"
    messages:
      - $ref: "#/channels/registrationPosted/messages/registrationPosted"
  publishPaydayApproved:
    action: send
    summary: Payday approved
    description: Sends the payday approved event through the outbox.
    channel:
      $ref: "#/channels/paydayApproved"
    messages:
      - $ref: "#/channels/paydayApproved/messages/paydayApproved"
  publishTimeProfileSaved:
    action: send
    summary: Time profile saved
    description: Sends the time profile saved event through the outbox.
    channel:
      $ref: "#/channels/timeProfileSaved"
    messages:
      - $ref: "#/channels/timeProfileSaved/messages/timeProfileSaved"
  publishPayAgreementSaved:
    action: send
    summary: Pay agreement saved
    description: Sends the pay agreement saved event through the outbox.
    channel:
      $ref: "#/channels/payAgreementSaved"
    messages:
      - $ref: "#/channels/payAgreementSaved/messages/payAgreementSaved"
  publishWorkerAssigned:
    action: send
    summary: Worker assigned
    description: Sends the worker assigned event through the outbox.
    channel:
      $ref: "#/channels/workerAssigned"
    messages:
      - $ref: "#/channels/workerAssigned/messages/workerAssigned"
  publishAbsenceCodeSaved:
    action: send
    summary: Absence code saved
    description: Sends the absence code saved event through the outbox.
    channel:
      $ref: "#/channels/absenceCodeSaved"
    messages:
      - $ref: "#/channels/absenceCodeSaved/messages/absenceCodeSaved"
  publishEdgeNodeSaved:
    action: send
    summary: Edge node saved
    description: Sends the edge node saved event through the outbox.
    channel:
      $ref: "#/channels/edgeNodeSaved"
    messages:
      - $ref: "#/channels/edgeNodeSaved/messages/edgeNodeSaved"
  publishEdgeConfigPublished:
    action: send
    summary: Edge configuration published
    description: Sends the edge configuration published event through the outbox.
    channel:
      $ref: "#/channels/edgeConfig"
    messages:
      - $ref: "#/channels/edgeConfig/messages/edgeConfigPublished"
  publishEdgeConfigApplied:
    action: send
    summary: Edge configuration applied
    description: Sends the edge configuration applied event through the outbox.
    channel:
      $ref: "#/channels/edgeConfig"
    messages:
      - $ref: "#/channels/edgeConfig/messages/edgeConfigApplied"
components:
  messages:
    JobReported:
      name: dev.passage.shopfloor.job.reported.v1
      contentType: application/cloudevents+json
      description: Published once per stored feedback posting on a job, in the same transaction; a replayed feedbackId publishes nothing.
      payload:
        $ref: "#/components/schemas/JobReportedData"
    JobReopened:
      name: dev.passage.shopfloor.job.reopened.v1
      contentType: application/cloudevents+json
      description: Published once when a supervisor reopens a finished job (FR-25.3), in the same transaction as the reopening; a repeated Idempotency-Key publishes nothing. Nothing reported is reversed and the time registrations on the job are untouched; later job.reported postings carry only what they add (qtyGood, qtyScrap), and the next finish is a new job.reported with finished true. Consumers that closed the operation on the finish (w21 job cards, w33) reopen it on this event.
      payload:
        $ref: "#/components/schemas/JobReopenedData"
    OEEBucketUpdated:
      name: dev.passage.shopfloor.oeebucket.updated.v1
      contentType: application/cloudevents+json
      description: Published by the OEE rollup for a bucket that is new or whose values changed; an unchanged bucket publishes nothing.
      payload:
        $ref: "#/components/schemas/OEEBucketUpdatedData"
    OEEBucketRemoved:
      name: dev.passage.shopfloor.oeebucket.removed.v1
      contentType: application/cloudevents+json
      description: Published by the OEE rollup when a stored bucket no longer has planned time (for example its downtime was later coded as planned).
      payload:
        $ref: "#/components/schemas/OEEBucketRemovedData"
    RegistrationPosted:
      name: dev.passage.shopfloor.registration.posted.v1
      contentType: application/cloudevents+json
      summary: Published once per stored time registration (or batch item)
      description: Published once per stored time registration (or batch item), in the same transaction; closed job registrations carry hours and bundle id for the w21 job-card consumer.
      payload:
        $ref: "#/components/schemas/RegistrationPostedData"
    RegistrationCorrected:
      name: dev.passage.shopfloor.registration.corrected.v1
      contentType: application/cloudevents+json
      summary: Registration corrected
      description: Published once per supervisor correction of a registration, in the same transaction; hours is the new elapsed time of a closed registration. A supervisor's confirmation of an auto clock-out (BR-25.3) is published the same way with the new times equal to the old ones.
      payload:
        $ref: "#/components/schemas/RegistrationCorrectedData"
    TimeProfileSaved:
      name: dev.passage.shopfloor.timeprofile.saved.v1
      contentType: application/cloudevents+json
      summary: Time profile created or changed
      description: Published in the transaction that creates or replaces a time profile; version is 1 for a new profile.
      payload:
        $ref: "#/components/schemas/TimeProfileSavedData"
    PayAgreementSaved:
      name: dev.passage.shopfloor.payagreement.saved.v1
      contentType: application/cloudevents+json
      summary: Pay agreement created or changed
      description: Published in the transaction that creates or replaces a pay agreement; decimals are strings.
      payload:
        $ref: "#/components/schemas/PayAgreementSavedData"
    AbsenceCodeSaved:
      name: dev.passage.shopfloor.absencecode.saved.v1
      contentType: application/cloudevents+json
      summary: Absence code created or changed
      description: Published in the transaction that creates or replaces an absence code; payMultiplier is a decimal string.
      payload:
        $ref: "#/components/schemas/AbsenceCodeSavedData"
    DowntimeReasonSaved:
      name: dev.passage.shopfloor.downtimereason.saved.v1
      contentType: application/cloudevents+json
      summary: Downtime reason code created or changed
      description: Published in the transaction that creates or replaces a downtime reason code; the Kafka key is the reason id.
      payload:
        $ref: "#/components/schemas/DowntimeReasonSavedData"
    OperationStatusChanged:
      x-passage-type: dev.passage.production.operation.statuschanged.v1
      contentType: application/cloudevents+json
      summary: Production finished or reopened an operation (consumed)
      description: Published by production (w21); the shop floor stores the status per order and operation. `to` finished stops new job starts and feedback on the operation's jobs and closes their open job-starts (not those of a bundle); any other status lets them start and take feedback again. A reopen does not reopen the closed starts.
      payload:
        $ref: "#/components/schemas/OperationStatusChangedData"
    EdgeNodeSaved:
      name: dev.passage.shopfloor.edgenode.saved.v1
      contentType: application/cloudevents+json
      summary: Edge node registered or changed
      description: Published in the transaction that registers an edge node or changes its name, site, ring, connector identity or status.
      payload:
        $ref: "#/components/schemas/EdgeNodeSavedData"
    EdgeConfigPublished:
      name: dev.passage.shopfloor.edgeconfig.published.v1
      contentType: application/cloudevents+json
      summary: Edge configuration version published
      description: Published in the transaction that stores the next configuration version of an edge node; it is the audit record of the publish (who, the SHA-256 of the stored document and the write allowlist nodes). The Kafka key is the edge id.
      payload:
        $ref: "#/components/schemas/EdgeConfigPublishedData"
    EdgeConfigApplied:
      name: dev.passage.shopfloor.edgeconfig.applied.v1
      contentType: application/cloudevents+json
      summary: Edge configuration version applied
      description: Published when a heartbeat reports a configuration version other than the one applied before; previousVersion is null for the first. The Kafka key is the edge id.
      payload:
        $ref: "#/components/schemas/EdgeConfigAppliedData"
    WorkerAssigned:
      name: dev.passage.shopfloor.worker.assigned.v1
      contentType: application/cloudevents+json
      summary: Worker linked to a time profile, pay agreement and home resource
      description: Published when a worker's profile, agreement or home resource link changes; a null id means the defaults apply. Days already calculated keep their pay lines until recalculated.
      payload:
        $ref: "#/components/schemas/WorkerAssignedData"
    PaydayRevised:
      name: dev.passage.shopfloor.payday.revised.v1
      contentType: application/cloudevents+json
      summary: Approved payday revised
      description: Published once per approved worker-day revised with reversal lines; reversed lines carry negative hours and amounts.
      payload:
        $ref: "#/components/schemas/PaydayRevisedData"
    PaydayApproved:
      name: dev.passage.shopfloor.payday.approved.v1
      contentType: application/cloudevents+json
      summary: Published when a supervisor approves a worker day
      description: Published when a supervisor approves a worker day; the pay lines are locked and ready for export.
      payload:
        $ref: "#/components/schemas/PaydayApprovedData"
    PaydayExported:
      name: dev.passage.shopfloor.payday.exported.v1
      contentType: application/cloudevents+json
      summary: Published once per payroll export batch with the approved pay lines it contains
      description: Published once per payroll export batch with the approved pay lines it contains, in the same transaction as the batch.
      payload:
        $ref: "#/components/schemas/PaydayExportedData"
    AndonRaised:
      name: dev.passage.shopfloor.andon.raised.v1
      contentType: application/cloudevents+json
      summary: Published when an andon alert is raised for a downtime, a scrap rate or a quality fail
      description: Published once when an andon alert opens (BR-25.10, one open alert per resource and kind). Kind `downtime` is a downtime open past the andon threshold (10 minutes), raised at machine ingest or by the andon sweep; `scrap-rate` is more than 5 % scrap in the latest completed OEE bucket, raised by the sweep; `quality-fail` is a failed quality check in a job feedback posting, and carries `jobId`.
      payload:
        $ref: "#/components/schemas/AndonRaisedData"
    ProcessMessageReceived:
      name: dev.passage.shopfloor.processmessage.received.v1
      contentType: application/cloudevents+json
      description: Published when a process message is stored, again when a destination in error is reprocessed, and again by the retry sweep for the destinations whose wait elapsed (then `destinations` holds only those destinations).
      payload:
        $ref: "#/components/schemas/ProcessMessageReceivedData"
    ProcessMessageDelivered:
      name: dev.passage.shopfloor.processmessage.delivered.v1
      contentType: application/cloudevents+json
      description: Published once, when every destination of the message is delivered.
      payload:
        $ref: "#/components/schemas/ProcessMessageDeliveredData"
    ProcessMessageDeleted:
      name: dev.passage.shopfloor.processmessage.deleted.v1
      contentType: application/cloudevents+json
      description: Published once, when a supervisor deletes a message with a destination in error, with the reason. `undelivered` names the destinations that never received it; the EBR consumer records the missed message as an exception (BR-24.15).
      payload:
        $ref: "#/components/schemas/ProcessMessageDeletedData"
  schemas:
    ProcessMessageReceivedData:
      type: object
      required: [messageId, source, sourceMessageId, categoryCode, orderId, phasePath, destinations, values, outOfLimit, occurredAt]
      properties:
        messageId:
          type: string
          format: uuid
        source:
          type: string
          enum: [kiosk, edge, manual]
        sourceMessageId:
          type: string
        categoryCode:
          type: string
          enum: [phase-start, phase-end, consumption, yield, process-data, quality-result, deviation, order-status, custom]
        orderId:
          type: string
          format: uuid
        phasePath:
          type: string
          description: ISA-88 path of the phase; empty when the message is not tied to a phase.
        destinations:
          type: array
          minItems: 1
          items:
            type: string
            enum: [ebr, journal, quality, kafka, webhook]
        values:
          type: array
          items:
            $ref: "#/components/schemas/Characteristic"
        outOfLimit:
          type: boolean
          description: A value is outside its limits; the EBR consumer records an exception (BR-25.13).
        occurredAt:
          type: string
          format: date-time
    ProcessMessageDeliveredData:
      type: object
      required: [messageId, categoryCode, orderId]
      properties:
        messageId:
          type: string
          format: uuid
        categoryCode:
          type: string
        orderId:
          type: string
          format: uuid
    ProcessMessageDeletedData:
      type: object
      required: [messageId, categoryCode, orderId, reason, undelivered, deletedBy, deletedAt]
      properties:
        messageId:
          type: string
          format: uuid
        categoryCode:
          type: string
        orderId:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500
        undelivered:
          type: array
          items:
            type: string
            enum: [ebr, journal, quality, kafka, webhook]
        deletedBy:
          type: string
        deletedAt:
          type: string
          format: date-time
    Characteristic:
      type: object
      required: [name, type, value, outOfLimit]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [numeric, text, boolean]
        value:
          type: string
          description: Decimal string for numeric, "true" or "false" for boolean.
        min:
          type: string
        max:
          type: string
        unit:
          type: string
        outOfLimit:
          type: boolean
    PaydayExportedData:
      type: object
      required: [batchId, fromDate, toDate, lineCount, createdBy, lines]
      additionalProperties: false
      description: One payroll export batch (FR-25.8) with every pay line it carries; consumed by payroll (w43).
      properties:
        batchId:
          type: string
          format: uuid
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        lineCount:
          type: integer
          minimum: 1
        createdBy:
          type: string
        lines:
          type: array
          items:
            type: object
            required: [workerId, workDate, type, hours, multiplier, amount, currency]
            additionalProperties: false
            properties:
              workerId:
                type: string
                format: uuid
              workDate:
                type: string
                format: date
              type:
                type: string
              hours:
                type: string
              multiplier:
                type: string
              amount:
                type: string
              currency:
                type: string
                pattern: "^[A-Z]{3}$"
    OEEBucketUpdatedData:
      type: object
      required: [resourceId, bucketMinutes, bucketStart, plannedMinutes, runMinutes, downMinutes, totalCount, goodCount,
        availability, performance, quality, oee, overRate]
      additionalProperties: false
      properties:
        resourceId:
          type: string
          format: uuid
        bucketMinutes:
          type: integer
          enum: [5, 15, 60]
        bucketStart:
          type: string
          format: date-time
        plannedMinutes:
          type: string
          description: Decimal, 4 places.
        runMinutes:
          type: string
        downMinutes:
          type: string
          description: Unplanned downtime (planned less run), including idle time (BR-25.6).
        totalCount:
          type: integer
        goodCount:
          type: integer
        availability:
          type: string
          description: Decimal ratio, 4 places.
        performance:
          type: string
          description: Decimal ratio, 4 places, capped at 1.
        quality:
          type: string
        oee:
          type: string
        overRate:
          type: boolean
    OEEBucketRemovedData:
      type: object
      required: [resourceId, bucketMinutes, bucketStart]
      additionalProperties: false
      properties:
        resourceId:
          type: string
          format: uuid
        bucketMinutes:
          type: integer
          enum: [5, 15, 60]
        bucketStart:
          type: string
          format: date-time
    JobReportedData:
      type: object
      required: [jobId, feedbackId, orderRef, operationRef, resourceId, qtyGood, qtyScrap, scrapReasonId, goodQuantity, scrapQuantity, finished, failedChecks, overrideReason, recordedBy, recordedAt]
      additionalProperties: false
      properties:
        jobId:
          type: string
          format: uuid
        feedbackId:
          type: string
          format: uuid
        orderRef:
          type: string
        operationRef:
          type: string
        resourceId:
          type: string
          format: uuid
        qtyGood:
          type: string
          description: Decimal; this posting's good quantity.
        qtyScrap:
          type: string
          description: Decimal; this posting's scrap quantity.
        scrapReasonId:
          type: [string, "null"]
        goodQuantity:
          type: string
          description: Decimal; the job's good total after this posting. After a reopening (job.reopened) the total still includes what was reported before it, so consumers post qtyGood, never this total, or a second finish counts the earlier quantities twice.
        scrapQuantity:
          type: string
          description: Decimal; the job's scrap total after this posting (see goodQuantity; post qtyScrap).
        finished:
          type: boolean
          description: True when this posting finished the job. A job can finish more than once when a supervisor reopens it in between (job.reopened).
        failedChecks:
          type: array
          description: Codes of checks whose latest result fails.
          items:
            type: string
        overrideReason:
          type: [string, "null"]
          description: Set when a supervisor finished the job over failed mandatory checks (SF-0005).
        recordedBy:
          type: string
        recordedAt:
          type: string
          format: date-time
    JobReopenedData:
      type: object
      required: [jobId, reopeningId, orderRef, operationRef, resourceId, goodQuantity, scrapQuantity, reason, reopenedBy, reopenedAt, previousFinishedAt]
      additionalProperties: false
      properties:
        jobId:
          type: string
          format: uuid
        reopeningId:
          type: string
          format: uuid
        orderRef:
          type: string
        operationRef:
          type: string
        resourceId:
          type: string
          format: uuid
        goodQuantity:
          type: string
          description: Decimal; the job's good total at the reopening.
        scrapQuantity:
          type: string
          description: Decimal; the job's scrap total at the reopening.
        reason:
          type: string
        reopenedBy:
          type: string
        reopenedAt:
          type: string
          format: date-time
        previousFinishedAt:
          type: string
          format: date-time
          description: The finish that no longer stands; consumers that closed the operation on it reopen it.
    AndonRaisedData:
      type: object
      required: [alertId, resourceId, kind, severity, jobId, startedAt]
      additionalProperties: false
      properties:
        alertId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [downtime, scrap-rate, quality-fail]
        severity:
          type: string
          enum: [info, warning, error]
        jobId:
          type: [string, "null"]
          format: uuid
        startedAt:
          type: string
          format: date-time
    RegistrationPostedData:
      type: object
      required: [registrationId, workerId, kind, jobId, bundleId, hours, qtyGood, qtyScrap, offline]
      additionalProperties: false
      properties:
        registrationId:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [clock-in, clock-out, job-start, job-stop, absence, indirect]
        jobId:
          type: [string, "null"]
          format: uuid
        bundleId:
          type: [string, "null"]
          format: uuid
          description: Set when the job was worked in a bundle; its hours are then the job's share (BR-25.1).
        absenceCodeId:
          type: [string, "null"]
          format: uuid
          description: The absence code of an absence registration (FR-25.2); null for every other kind.
        hours:
          type: [string, "null"]
          description: |
            Elapsed hours (decimal, 4 places) of a closed registration; for a
            bundled job, its share of the bundle's time in 0.01 h (BR-25.1).
            Null while open.
        qtyGood:
          type: string
        qtyScrap:
          type: string
        offline:
          type: boolean
        flags:
          type: array
          items:
            type: string
            enum: [job-finished-conflict, auto-stopped, auto-stop-capped, production-finished, auto-clock-out]
          description: |
            Review flags. `auto-clock-out` on a clock-out the auto clock-out
            sweep wrote (D2h). `job-finished-conflict` on a job-start for a job the
            server had already finished (BR-25.7); `auto-stopped` (and
            `auto-stop-capped` past 24 hours) on a closed job-stop the server
            wrote when the worker started another job (FR-25.3); `production-finished`
            on a closed job-stop the server wrote when production finished the job's
            operation while the start (or a start of its bundle) was open, with
            `job-finished-conflict` too when the start began after the finish.
            Empty otherwise.
        orderRef:
          type: string
          description: The job's production order id when the registration names a known job (FR-25.4). Omitted on punches.
        operationRef:
          type: string
          description: The job's operation number as stored when the registration names a known job.
        costRate:
          type: string
          description: The worker's hourly cost rate when greater than zero; the w21 job-card consumer uses it over the resource labor rate (BR-25.9).
        costRateCurrency:
          type: string
          description: Currency of costRate (the worker's currency); the consumer uses costRate only when it equals the order currency.
    RegistrationCorrectedData:
      type: object
      required: [registrationId, workerId, kind, jobId, oldStartedAt, oldStoppedAt, newStartedAt, newStoppedAt, hours, reason, correctedBy]
      additionalProperties: false
      properties:
        registrationId:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [clock-in, clock-out, job-start, job-stop, absence, indirect]
        jobId:
          type: [string, "null"]
          format: uuid
        oldStartedAt:
          type: string
          format: date-time
        oldStoppedAt:
          type: [string, "null"]
          format: date-time
        newStartedAt:
          type: string
          format: date-time
        newStoppedAt:
          type: [string, "null"]
          format: date-time
        hours:
          type: [string, "null"]
          description: New elapsed hours of a closed registration.
        reason:
          type: string
        correctedBy:
          type: string
          description: >-
            The supervisor who corrected the registration, or
            `system:offline-replay` when the server cancels its own auto-stop
            (to 0 hours) because the kiosk's job-stop for the same start arrived.
    TimeProfileSavedData:
      type: object
      required: [profileId, code, name, active, version, savedBy]
      additionalProperties: false
      properties:
        profileId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
        savedBy:
          type: string
    PayAgreementSavedData:
      type: object
      required: [agreementId, code, name, dailyThreshold, weeklyThreshold, overtimeMultiplier, sundayMultiplier, weekStart, shiftPremiums, active, version, savedBy]
      additionalProperties: false
      properties:
        agreementId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        dailyThreshold:
          type: string
        weeklyThreshold:
          type: string
        overtimeMultiplier:
          type: string
        sundayMultiplier:
          type: string
        weekStart:
          type: integer
          minimum: 0
          maximum: 6
        shiftPremiums:
          type: array
          description: Premium windows of the agreement; empty when it has none.
          items:
            type: object
            additionalProperties: false
            required: [name, from, to, premium]
            properties:
              name:
                type: string
              from:
                type: string
                description: Local HH:MM start of the window.
              to:
                type: string
                description: Local HH:MM end; not after from means the window crosses midnight.
              premium:
                type: string
                description: Decimal string, the extra share of the worker's rate.
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
        savedBy:
          type: string
    DowntimeReasonSavedData:
      type: object
      required: [reasonId, code, name, category, active, version, savedBy]
      additionalProperties: false
      properties:
        reasonId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [planned, unplanned]
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
        savedBy:
          type: string
    OperationStatusChangedData:
      type: object
      description: The part of production's payload the shop floor reads.
      required: [orderId, operNumber, to, orderVersion, occurredAt]
      properties:
        orderId:
          type: string
          format: uuid
        operNumber:
          type: integer
          minimum: 1
        action:
          type: string
          description: finish or reopen.
        from:
          type: string
        to:
          type: string
          description: open, started or finished.
        orderVersion:
          type: integer
          minimum: 1
          description: The order's version after the change; orders the events of one order.
        actor:
          type: string
        occurredAt:
          type: string
          format: date-time
    AbsenceCodeSavedData:
      type: object
      required: [absenceCodeId, code, name, paid, payMultiplier, active, version, savedBy]
      additionalProperties: false
      properties:
        absenceCodeId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        paid:
          type: boolean
        payMultiplier:
          type: string
          description: Decimal string, the share of the worker's rate paid per absence hour; 0 for an unpaid code. Fixed once an absence names the code.
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
        savedBy:
          type: string
    EdgeNodeSavedData:
      type: object
      required: [edgeId, siteId, name, platform, ring, connectorSubject, active, version, savedBy]
      additionalProperties: false
      properties:
        edgeId:
          type: string
          format: uuid
        siteId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        platform:
          type: string
          enum: [k3s, windows, linux]
        ring:
          type: string
          enum: [canary, ring1, all]
        connectorSubject:
          type: [string, "null"]
          description: The connector identity bound to the node; null when unbound.
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
        savedBy:
          type: string
    EdgeConfigPublishedData:
      type: object
      required: [edgeId, version, documentSha256, writeRuleNodes, publishedBy]
      additionalProperties: false
      properties:
        edgeId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        documentSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the stored document, as the configuration endpoints return it.
        writeRuleNodes:
          type: array
          description: The nodes of the version's write allowlist, in document order.
          items:
            type: string
        publishedBy:
          type: string
    EdgeConfigAppliedData:
      type: object
      required: [edgeId, version, previousVersion]
      additionalProperties: false
      properties:
        edgeId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        previousVersion:
          type: [integer, "null"]
          minimum: 1
    WorkerAssignedData:
      type: object
      required: [workerId, profileId, payAgreementId, defaultResourceId, assignedBy]
      additionalProperties: false
      properties:
        workerId:
          type: string
          format: uuid
        profileId:
          type: [string, "null"]
          format: uuid
        payAgreementId:
          type: [string, "null"]
          format: uuid
        defaultResourceId:
          type: [string, "null"]
          format: uuid
          description: Home resource whose jobs make up the worker's dispatch list; null means none.
        assignedBy:
          type: string
    PaydayRevisedData:
      type: object
      required: [workerId, workDate, revision, reason, reversedLines, addedLines, revisedBy]
      additionalProperties: false
      properties:
        workerId:
          type: string
          format: uuid
        workDate:
          type: string
          format: date
        revision:
          type: integer
          minimum: 1
        reason:
          type: string
        reversedLines:
          type: array
          items:
            type: object
            required: [type, hours, multiplier, amount, currency]
            properties:
              type:
                type: string
              hours:
                type: string
              multiplier:
                type: string
              amount:
                type: string
              currency:
                type: string
                pattern: "^[A-Z]{3}$"
        addedLines:
          type: array
          items:
            type: object
            required: [type, hours, multiplier, amount, currency]
            properties:
              type:
                type: string
              hours:
                type: string
              multiplier:
                type: string
              amount:
                type: string
              currency:
                type: string
                pattern: "^[A-Z]{3}$"
        revisedBy:
          type: string
    PaydayApprovedData:
      type: object
      required: [workerId, workDate, payLines, approvedBy]
      additionalProperties: false
      properties:
        workerId:
          type: string
          format: uuid
        workDate:
          type: string
          format: date
        payLines:
          type: array
          items:
            type: object
            required: [type, hours, multiplier, amount, currency]
            properties:
              type:
                type: string
              hours:
                type: string
              multiplier:
                type: string
              amount:
                type: string
              currency:
                type: string
                pattern: "^[A-Z]{3}$"
        approvedBy:
          type: string
