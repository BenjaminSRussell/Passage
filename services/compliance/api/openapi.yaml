openapi: 3.1.0
info:
  title: Passage compliance
  version: 0.6.0
  description: >-
    Segregation of duties (PSG-48 slice 1): seed rules, pre-save simulation,
    evaluation of a user's effective roles, the conflict listing and the
    mitigation and risk-acceptance workflow (FR-48.4, FR-48.5, BR-48.1).
    Breach notification clocks (PSG-48 slice 2, FR-48.29, BR-48.18).
    Audit rule evaluation, audit case grouping and status machine, and
    break-glass session planning (PSG-48 slice 3, FR-48.14, FR-48.15,
    FR-48.23, BR-48.19); these store nothing yet.
    Sanctions screening with stored hits and the officer decision, and the
    export license determination of a delivery (PSG-48 slice 4, FR-48.19,
    FR-48.20, BR-48.15, BR-48.16).
    Stored GDPR and CCPA subject requests with their state machine, the
    erasure preview and the retention purge check, certification campaign
    planning and close, the incident lifecycle step, and export governance
    and read-log classification (PSG-48 slice 5, FR-48.6, FR-48.10, FR-48.11,
    FR-48.24, FR-48.25, FR-48.29, BR-48.5, BR-48.6, BR-48.9, BR-48.18); only
    subject requests are stored.
    Browser calls go to /api/v1/sod/..., /api/v1/compliance/...,
    /api/v1/security/..., /api/v1/trade/... and /api/v1/privacy/...; the
    gateway strips /api.
servers:
  - url: https://api.passage.dev
paths:
  /v1/sod/rules:
    get:
      operationId: listSodRules
      summary: "List the segregation-of-duties rules"
      x-passage-duty: compliance.sod.review
      responses:
        "200":
          description: The FR-48.4 seed rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Rule" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/sod/simulate:
    post:
      operationId: simulateRoleAssignment
      x-passage-duty: compliance.security.admin
      description: >-
        Returns the conflicts a role assignment would introduce, before anything
        is saved. With sod.block_high the save is blocked (code SOD-1101) when the
        resulting role set holds a HIGH conflict that the service has not recorded
        as MITIGATED, new or existing (FR-48.5, AC-48.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
                currentRoles: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/Role" } }
                proposedRoles: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/Role" } }
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                type: object
                required: [newConflicts, blocked, blockingRuleIds]
                properties:
                  newConflicts: { type: array, items: { $ref: "#/components/schemas/SimulatedConflict" } }
                  blocked: { type: boolean }
                  blockingRuleIds: { type: array, items: { type: string } }
                  code: { type: string, enum: [SOD-1101], description: set when blocked }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/sod/evaluations:
    post:
      operationId: evaluateUserRoles
      x-passage-duty: compliance.security.admin
      description: >-
        Evaluates a user's effective roles after an assignment change (or from the
        nightly run) and records the outcome: new conflicts are stored OPEN and emit
        dev.passage.sod.conflict.detected.v1, a RESOLVED conflict detected again is
        reopened, and a stored conflict that is no longer detected is RESOLVED. A
        repeat with the same roles changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId, roles]
              properties:
                userId: { type: string, format: uuid }
                roles: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/Role" } }
      responses:
        "200":
          description: Every conflict recorded for the user after the evaluation
          content:
            application/json:
              schema:
                type: object
                required: [userId, conflicts]
                properties:
                  userId: { type: string, format: uuid }
                  conflicts: { type: array, items: { $ref: "#/components/schemas/Conflict" } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/sod/conflicts:
    get:
      operationId: listSodConflicts
      x-passage-duty: compliance.sod.review
      description: Conflicts, newest detection first. Lapsed mitigations are reopened before reading.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [OPEN, MITIGATED, RESOLVED, ACCEPTED_RISK] } }
        - { name: severity, in: query, schema: { type: string, enum: [HIGH, MEDIUM, LOW] } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: ruleId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of conflicts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Conflict" } }
                  nextCursor: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/sod/conflicts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSodConflict
      summary: "Get a segregation-of-duties conflict"
      x-passage-duty: compliance.sod.review
      responses:
        "200":
          description: The conflict with its mitigation history
          headers:
            ETag: { schema: { type: string }, description: 'the conflict version, e.g. "2"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConflictDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/sod/conflicts/{id}/mitigations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: mitigateSodConflict
      x-passage-duty: compliance.sod.approve
      description: >-
        Approves a compensating control for an OPEN conflict (FR-48.5, AC-48.4).
        The approver is the calling user and must not be the conflicted user; the
        expiry must be in the future and within min(rule cap, sod.max_mitigation_days).
        Emits dev.passage.sod.mitigation.approved.v1 in the same transaction.
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [controlRef, reason, expiresAt]
              properties:
                controlRef: { type: string, maxLength: 2000 }
                reason: { type: string, maxLength: 2000 }
                expiresAt: { type: string, format: date-time }
      responses:
        "201":
          description: The conflict, now MITIGATED, with its mitigation history
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConflictDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/sod/conflicts/{id}/accept-risk:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: acceptSodRisk
      x-passage-duty: compliance.sod.admin
      description: Accepts the risk of an OPEN LOW or MEDIUM conflict with a reason (BR-48.1).
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: The conflict, now ACCEPTED_RISK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConflictDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/security/incidents:breach-clocks:
    post:
      operationId: computeBreachClocks
      x-passage-duty: compliance.security-incident.manage
      description: >-
        Notification clocks for a confirmed personal-data breach (FR-48.29).
        Clocks start at awareAt, not at detection, and deadlines are UTC
        instants (BR-48.18); status is computed at the server time. A clock
        with no fixed hour ("without undue delay", "as soon as feasible") has
        no deadlineAt. Read-only: nothing is stored until the security_incident
        store exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [awareAt, personalDataBreach, regimes]
              properties:
                awareAt: { type: string, format: date-time, description: when the controller became aware; not in the future }
                personalDataBreach: { type: boolean, description: must be true (INC-1303 otherwise) }
                regimes:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { $ref: "#/components/schemas/BreachRegime" }
                usStateWindowDays: { type: integer, minimum: 30, maximum: 60, description: US_STATE only; 0 or omitted means 30 }
      responses:
        "200":
          description: Clocks in regime order with their status at asOf
          content:
            application/json:
              schema:
                type: object
                required: [awareAt, asOf, items]
                properties:
                  awareAt: { type: string, format: date-time }
                  asOf: { type: string, format: date-time }
                  items: { type: array, items: { $ref: "#/components/schemas/BreachClock" } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/compliance/audit-policies:evaluate:
    post:
      operationId: evaluateAuditPolicy
      x-passage-duty: compliance.audit-policy.run
      description: >-
        Runs one audit rule (FR-48.14) over a document window the caller
        selected and returns the findings. Every rule type is supported:
        DUPLICATE (BR-48.14, partyId is the vendor and date the invoice date),
        KEYWORD, LIST_SEARCH, SAMPLING (seeded, so a rerun selects the same
        documents), THRESHOLD, WEEKEND_HOLIDAY and AGGREGATE. Each finding key
        is idempotent on (policy id, version, document id). Nothing is stored:
        persisted runs and audit_violation rows come with the audit store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policyId, version, spec]
              properties:
                policyId: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }
                spec: { $ref: "#/components/schemas/AuditSpec" }
                documents:
                  type: array
                  maxItems: 100000
                  description: ids are unique; DUPLICATE, WEEKEND_HOLIDAY and AGGREGATE need a date on every document
                  items: { $ref: "#/components/schemas/AuditDocument" }
      responses:
        "200":
          description: Findings sorted by document id
          content:
            application/json:
              schema:
                type: object
                required: [count, findings]
                properties:
                  count: { type: integer }
                  findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
                  code: { type: string, enum: [AUD-0701], description: "warning: {n} documents violate the policy; absent when count is 0" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422":
          description: AUD-0711 unknown rule type, AUD-0712 rule configuration incomplete or out of range
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/compliance/audit-cases:group:
    post:
      operationId: groupViolationsIntoCases
      x-passage-duty: compliance.audit-case.manage
      description: >-
        Groups unassigned violations into audit case drafts (FR-48.15).
        DUPLICATE violations group per vendor (AC-48.13: one case per vendor);
        other rules group per policy. A violation that already has a caseId is
        skipped, so it belongs to at most one case. Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                violations:
                  type: array
                  maxItems: 10000
                  description: ids are unique
                  items: { $ref: "#/components/schemas/Violation" }
      responses:
        "200":
          description: Case drafts sorted by key
          content:
            application/json:
              schema:
                type: object
                required: [cases]
                properties:
                  cases: { type: array, items: { $ref: "#/components/schemas/CaseDraft" } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/compliance/audit-cases:transition:
    post:
      operationId: transitionAuditCase
      x-passage-duty: compliance.audit-case.manage
      description: >-
        Applies one action of the audit case status machine (FR-48.15):
        OPEN -START_REVIEW-> IN_REVIEW -RESOLVE_NO_ISSUE|RESOLVE_ISSUE->
        RESOLVED_NO_ISSUE|RESOLVED_ISSUE -CLOSE-> CLOSED -ARCHIVE-> ARCHIVED.
        For RESOLVE_* the resolution code (and recovery) are the action's
        inputs; for CLOSE and ARCHIVE they are the values already on the case.
        Closing requires a resolution code and stamps the server time;
        archiving needs audit.case_archive_days (tenant setting, 365 by
        default) since closedAt, measured at the server time. Nothing is
        stored until the audit case store exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, action]
              properties:
                status: { $ref: "#/components/schemas/CaseStatus" }
                action: { type: string, enum: [START_REVIEW, RESOLVE_NO_ISSUE, RESOLVE_ISSUE, CLOSE, ARCHIVE] }
                resolutionCode:
                  type: string
                  enum: [NO_ISSUE, FALSE_POSITIVE, SAMPLE_CLEARED, DUPLICATE_RECOVERED, POLICY_CORRECTED, REFERRED_FRAUD]
                  description: the first three resolve without issue, the last three with an issue
                recoveryAmount: { type: string, description: "decimal, not negative; RESOLVE_ISSUE only", pattern: '^\d+(\.\d+)?$' }
                currency: { type: string, pattern: '^[A-Z]{3}$', description: required with a positive recoveryAmount }
                closedAt: { type: string, format: date-time, description: when the case was closed; not in the future; ARCHIVE only }
      responses:
        "200":
          description: Case state after the action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseState" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422":
          description: AUD-0713 action not allowed from the status, AUD-0714 resolution missing or wrong for the action, AUD-0715 archive window not yet passed
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/security/elevated-sessions:plan:
    post:
      operationId: planElevatedSession
      x-passage-duty: compliance.break-glass.request
      description: >-
        Validates a break-glass request of the calling user (X-Passage-User)
        and returns the session it would open (FR-48.23, BR-48.19): the window
        from the server time, capped by breakglass.max_minutes (tenant
        setting, 60 by default, never above 240), the approval path and the
        reviewer deadline breakglass.review_days business days after the end.
        A protected role (compliance.security.admin, platform.global.admin) can never be granted
        to yourself (SEC-0707) and, for another user, always waits for a
        second platform.global.admin. Otherwise breakglass.self_activate decides
        between approval by a compliance.break-glass.approve holder and self-activation
        with mandatory post-review. No session is stored and no token issued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles, reasonCode, ticketRef]
              properties:
                targetUserId: { type: string, format: uuid, description: defaults to the calling user }
                roles: { type: array, minItems: 1, maxItems: 200, items: { type: string, minLength: 1 } }
                reasonCode: { type: string, enum: [INCIDENT_RESPONSE, PRODUCTION_OUTAGE, DATA_CORRECTION_APPROVED, PERIOD_CLOSE_BLOCKER, AUDIT_EVIDENCE_REQUEST] }
                ticketRef: { type: string, minLength: 1, maxLength: 2000 }
                requestedMinutes: { type: integer, minimum: 15, maximum: 240, description: "0 or omitted means 60, or the tenant maximum when lower" }
      responses:
        "200":
          description: Validated session plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElevatedPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422":
          description: SEC-0707 self-grant of a protected role, SEC-0713 request incomplete or out of range
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/trade/screening/check:
    post:
      operationId: screenSubject
      x-passage-duty: compliance.trade-screening.view
      description: >-
        Screens a party or document on demand against the given list entries
        (FR-48.19) with normalized token-set matching and transliteration, at the
        tenant's screening.threshold (default 0.88). Each new hit is stored OPEN
        and emits dev.passage.trade.screening.hit.v1 in the same transaction; an
        OPEN hit for the same subject and entry is refreshed, not duplicated. An
        entry cleared as a false positive for the same entry version and the same
        subject name, address and country is not flagged again (BR-48.15).
        Until the screening_list store exists the caller supplies the entries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject, entries]
              properties:
                subject: { $ref: "#/components/schemas/ScreeningSubject" }
                entries: { type: array, maxItems: 10000, items: { $ref: "#/components/schemas/ListEntry" } }
      responses:
        "200":
          description: >-
            The subject's blocking hits (OPEN and CONFIRMED) after this run; while
            any exist the subject may not be released, shipped, sent or paid.
          content:
            application/json:
              schema:
                type: object
                required: [blocked, hits]
                properties:
                  blocked: { type: boolean }
                  hits: { type: array, items: { $ref: "#/components/schemas/ScreeningHit" } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/trade/screening/hits:
    get:
      operationId: listScreeningHits
      x-passage-duty: compliance.trade-screening.view
      description: Screening hits, newest detection first (the screening workbench).
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [OPEN, FALSE_POSITIVE, CONFIRMED] } }
        - { name: listCode, in: query, schema: { type: string } }
        - { name: subjectType, in: query, schema: { type: string, enum: [PARTY, DOCUMENT] } }
        - { name: subjectId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of hits
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ScreeningHit" } }
                  nextCursor: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/trade/screening/hits/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getScreeningHit
      summary: "Get a trade screening hit"
      x-passage-duty: compliance.trade-screening.view
      responses:
        "200":
          description: The hit
          headers:
            ETag: { schema: { type: string }, description: 'the hit version, e.g. "1"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScreeningHit" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/trade/screening/hits/{id}/decision:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: decideScreeningHit
      x-passage-duty: compliance.trade-screening.decide
      description: >-
        Clears an OPEN hit as a false positive or confirms it, with a reason
        (FR-48.19). The decider is the calling user. A false positive becomes the
        whitelist entry for this subject and list entry (BR-48.15); a confirmed
        hit keeps the subject blocked. A repeated Idempotency-Key replays the
        first answer.
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [CLEAR_FALSE_POSITIVE, CONFIRM] }
                reason: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: The decided hit
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScreeningHit" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/trade/export-checks:
    post:
      operationId: checkExportLicenses
      x-passage-duty: compliance.trade-screening.view
      description: >-
        License determination for a delivery (FR-48.20, AC-48.17). A destination
        under comprehensive embargo blocks every line with TRD-1002 whatever the
        classification (BR-48.16); otherwise each line needing a license by the
        pack decision table must find a valid, unexpired license for its
        classification and destination with quantity and value left, counting
        earlier lines of the same delivery, or it gets TRD-1003 (blocked under
        trade.license_check BLOCK, a warning under WARN, skipped under OFF).
        officerReleaseLicenseRef releases an embargoed delivery and requires
        compliance.trade-screening.decide (403 otherwise). Until the export_license store
        exists the caller supplies the licenses; nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [destination, items]
              properties:
                destination: { type: string, pattern: '^[A-Za-z]{2}$', description: ISO 3166 alpha-2 }
                region: { type: string, description: 'ISO 3166-2 of the destination, e.g. UA-43' }
                items: { type: array, minItems: 1, maxItems: 5000, items: { $ref: "#/components/schemas/ExportItem" } }
                licenses: { type: array, items: { $ref: "#/components/schemas/ExportLicense" } }
                officerReleaseLicenseRef: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: The determination per line
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/privacy/requests:
    post:
      operationId: intakeSubjectRequest
      x-passage-duty: compliance.privacy-request.create
      description: >-
        Takes in a GDPR or CCPA subject request in RECEIVED (FR-48.10). The
        deadline is receivedAt plus 30 days (GDPR) or 45 days (CCPA);
        deadlineDays may only shorten it (PRV-1206). receivedAt defaults to the
        server time and cannot lie in the future. A repeated Idempotency-Key
        replays the first answer; the same key with another body is SOD-1110.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, regulation, subjectRef]
              properties:
                type: { $ref: "#/components/schemas/PrivacyRequestType" }
                regulation: { type: string, enum: [GDPR, CCPA] }
                subjectRef: { type: string, maxLength: 200, description: 'party, worker, user or contact reference, e.g. party:42' }
                receivedAt: { type: string, format: date-time }
                deadlineDays: { type: integer, minimum: 1 }
      responses:
        "201":
          description: The request
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubjectRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listSubjectRequests
      x-passage-duty: compliance.privacy-request.process
      description: Subject requests, nearest deadline first (the privacy request list inquiry).
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/PrivacyState" } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/PrivacyRequestType" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SubjectRequest" } }
                  nextCursor: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/privacy/requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSubjectRequest
      summary: "Get a data subject privacy request"
      x-passage-duty: compliance.privacy-request.process
      responses:
        "200":
          description: The request
          headers:
            ETag: { schema: { type: string }, description: 'the request version, e.g. "1"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubjectRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/privacy/requests/{id}/actions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: actOnSubjectRequest
      x-passage-duty: compliance.privacy-request.process
      description: >-
        Moves a stored request one step: VERIFY (RECEIVED, two distinct matched
        attributes and the e-mail link, else PRV-1203), DISCOVER (VERIFIED; an
        ERASURE with holdIds goes to HELD, AC-48.7), RELEASE_HOLD (HELD;
        holdIds are the holds still standing and must be empty, else PRV-1201),
        APPROVE (DISCOVERED; records the calling officer), DELIVER (APPROVED),
        CLOSE (DELIVERED; after the deadline needs a justification of 10
        characters, PRV-1205, and is marked late; emits
        dev.passage.privacy.request.completed.v1) and REJECT (any open state,
        reason of 10 characters, PRV-1207). Any other step is PRV-1204. The
        type, state and deadline are the stored ones.
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [VERIFY, DISCOVER, RELEASE_HOLD, APPROVE, DELIVER, CLOSE, REJECT] }
                holdIds: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
                matchedAttributes: { type: array, maxItems: 20, items: { type: string, maxLength: 200 } }
                emailLinkVerified: { type: boolean }
                justification: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: The request after the step
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubjectRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/privacy/requests/{id}/erasure-preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: previewErasure
      x-passage-duty: compliance.privacy-request.process
      description: >-
        Shows what an ERASURE request does to one record of the subject
        (BR-48.5): name, address, email, phone, tax_id, bank_account and
        date_of_birth become a deterministic pseudonym, every other field
        (amounts, dates, dimensions) is kept and erased is set to "true". The
        request must be an ERASURE past discovery (PRV-1204) and free of legal
        holds (PRV-1201). Nothing is written; the domains apply it in the fan-out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [record]
              properties:
                record: { type: object, minProperties: 1, maxProperties: 200, additionalProperties: { type: string } }
      responses:
        "200":
          description: The pseudonymized record
          content:
            application/json:
              schema:
                type: object
                required: [record, pseudonymized]
                properties:
                  record: { type: object, additionalProperties: { type: string } }
                  pseudonymized: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/privacy/holds:
    post:
      operationId: placeLegalHold
      x-passage-duty: compliance.legal-hold.place
      description: >-
        Places a legal hold (FR-48.11) on a subject, a data class, a record or a combination inside one legal
        entity in the caller's scope. A hold suspends erasure and retention purge for what it covers; every field
        set on the hold must match, and a hold on a data class also covers a check that names no class. Emits
        privacy.hold.placed. A repeated Idempotency-Key replays the first answer.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legalEntityId, reason]
              properties:
                legalEntityId: { type: string, format: uuid }
                subjectRef: { type: string, maxLength: 200 }
                dataClass: { $ref: "#/components/schemas/DataClass" }
                recordRef: { type: string, maxLength: 200 }
                reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        "201":
          description: The hold
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalHold" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listLegalHolds
      x-passage-duty: compliance.legal-hold.read
      description: Holds newest first, keyset-paginated; filter by state, legal entity, subject and data class.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [ACTIVE, RELEASED] } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: subjectRef, in: query, schema: { type: string } }
        - { name: dataClass, in: query, schema: { $ref: "#/components/schemas/DataClass" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of holds
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LegalHold" } }
                  nextCursor: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/privacy/holds:check:
    get:
      operationId: checkLegalHolds
      x-passage-duty: compliance.legal-hold.check
      description: >-
        The hold check participants call before they erase or purge (FR-48.11). Answers whether an active hold in
        the legal entity covers the target: every field set on the hold must equal the target's, and a hold on a
        data class covers a target that names none. A target without subjectRef is not covered by a subject hold.
        legalEntityId must be in the caller's scope. Fail closed: a caller that cannot reach this endpoint must
        not erase.
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: subjectRef, in: query, schema: { type: string, maxLength: 200 } }
        - { name: dataClass, in: query, schema: { $ref: "#/components/schemas/DataClass" } }
        - { name: recordRef, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: The covering holds
          content:
            application/json:
              schema:
                type: object
                required: [held, holdIds]
                properties:
                  held: { type: boolean }
                  holdIds: { type: array, items: { type: string, format: uuid } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/privacy/holds/{id}:
    get:
      operationId: getLegalHold
      summary: "Get a legal hold"
      x-passage-duty: compliance.legal-hold.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The hold
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalHold" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/privacy/holds/{id}/release:
    post:
      operationId: releaseLegalHold
      x-passage-duty: compliance.legal-hold.release
      description: >-
        Releases an ACTIVE hold with a reason of at least 10 characters (If-Match required; stale is 412
        PRV-1223, an already released hold PRV-1222). Emits privacy.hold.released. The hold row is kept.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        "200":
          description: The released hold
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalHold" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/privacy/erasures:
    post:
      operationId: requestErasure
      x-passage-duty: compliance.erasure.request
      description: >-
        Fans an erasure out to the participating services (FR-48.10, FR-48.11, AC-48.7). Refused with 422
        PRV-1201 and no event when an active legal hold covers the subject (and the listed data classes, or every
        class when none is listed) in the legal entity. Otherwise it stores an append-only command and emits
        privacy.erasure.requested, which participants act on once retention allows and after they re-check holds.
        requestId, when given, must be an approved or delivered ERASURE request of the same subject (PRV-1204).
        A repeated Idempotency-Key replays the first answer.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legalEntityId, subjectRef]
              properties:
                legalEntityId: { type: string, format: uuid }
                subjectRef: { type: string, maxLength: 200 }
                dataClasses: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/DataClass" } }
                requestId: { type: string, format: uuid }
      responses:
        "202":
          description: The command that was emitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErasureCommand" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/privacy/retention-policies:
    get:
      operationId: listRetentionPolicies
      x-passage-duty: compliance.retention.read
      description: >-
        The default retention per data class (FR-48.11): AP_PAYEE and FINANCIAL_RECORD 84 months after last
        activity (owner decision), EMPLOYMENT 72 months after termination, CANDIDATE 6 months after rejection,
        SYSTEM_LOG 12 months. Per-legal-entity overrides (retention.<record_class>) are not stored yet.
      responses:
        "200":
          description: The policies
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RetentionPolicy" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/privacy/retention:purge-check:
    post:
      operationId: checkRetentionPurge
      x-passage-duty: compliance.privacy-request.process
      description: >-
        BR-48.6 for one record the monthly retention purge considers: a record
        under legal hold, in an open fiscal period or referenced by an open
        document is skipped with PRV-1208 and the reasons. Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recordClass]
              properties:
                recordClass: { type: string, maxLength: 200 }
                holdIds: { type: array, maxItems: 50, items: { type: string } }
                fiscalPeriodOpen: { type: boolean }
                openDocumentRefs: { type: array, maxItems: 1000, items: { type: string } }
      responses:
        "200":
          description: The purge decision
          content:
            application/json:
              schema:
                type: object
                required: [purgeable, reasons]
                properties:
                  purgeable: { type: boolean }
                  code: { type: string, enum: [PRV-1208] }
                  reasons: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/sod/campaigns:plan:
    post:
      operationId: planCertificationCampaign
      x-passage-duty: compliance.sod.admin
      description: >-
        The close instant of an access certification campaign (FR-48.6):
        startsAt plus windowDays (0 takes the 14-day default; 3 to 60, else
        SOD-1120). Nothing is stored yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [startsAt]
              properties:
                startsAt: { type: string, format: date-time }
                windowDays: { type: integer, minimum: 0, maximum: 60 }
      responses:
        "200":
          description: The campaign window
          content:
            application/json:
              schema:
                type: object
                required: [startsAt, closesAt]
                properties:
                  startsAt: { type: string, format: date-time }
                  closesAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/sod/campaigns:close:
    post:
      operationId: closeCertificationCampaign
      x-passage-duty: compliance.sod.admin
      description: >-
        Campaign progress and, once closesAt has passed at the server time, the
        close of BR-48.9: explicit REVOKE decisions are revoked; an uncertified
        role is revoked when autoRevoke is set (certification.auto_revoke) and
        flagged otherwise, and its manager counts as overdue. Before closesAt
        closed is false and pending roles are only counted. A manager deciding
        on their own roles is SOD-1121; a missing, duplicated or unknown line is
        SOD-1122. Nothing is stored yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entries, closesAt]
              properties:
                entries: { type: array, minItems: 1, maxItems: 5000, items: { $ref: "#/components/schemas/CampaignEntry" } }
                autoRevoke: { type: boolean }
                closesAt: { type: string, format: date-time }
      responses:
        "200":
          description: The close result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignCloseResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/security/incidents:transition:
    post:
      operationId: checkIncidentStep
      x-passage-duty: compliance.security-incident.manage
      description: >-
        One step of the security incident lifecycle (FR-48.29): TRIAGE when
        opened (from empty), then CONTAINED, ERADICATED, RECOVERED and CLOSED,
        one step at a time (INC-1322). A Sev-1 incident reports pageOnCall. For a
        confirmed personal-data breach the clocks run from awareAt (BR-48.18);
        notifiedAt records when each regime's fixed-deadline notice went out.
        Closing needs a late-notification justification for every clock sent
        after its deadline or still unsent past it (INC-1302). Status is at the
        server time; nothing is stored yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [severity, source, to]
              properties:
                severity: { type: string, enum: [SEV1, SEV2, SEV3, SEV4] }
                source: { type: string, enum: [ALERT, USER_REPORT, VENDOR, PEN_TEST] }
                from: { type: string, enum: [TRIAGE, CONTAINED, ERADICATED, RECOVERED, CLOSED] }
                to: { type: string, enum: [TRIAGE, CONTAINED, ERADICATED, RECOVERED, CLOSED] }
                awareAt: { type: string, format: date-time }
                personalDataBreach: { type: boolean }
                regimes: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/BreachRegime" } }
                usStateWindowDays: { type: integer, minimum: 30, maximum: 60 }
                notifiedAt: { type: object, additionalProperties: { type: string, format: date-time }, description: 'keyed by regime, e.g. {"GDPR": "2026-11-04T10:00:00Z"}' }
                justification: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: The incident after the step
          content:
            application/json:
              schema:
                type: object
                required: [status, pageOnCall, clocks, asOf]
                properties:
                  status: { type: string }
                  pageOnCall: { type: boolean }
                  asOf: { type: string, format: date-time }
                  clocks:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/BreachClock" }
                        - type: object
                          required: [met, late]
                          properties:
                            notifiedAt: { type: string, format: date-time }
                            met: { type: boolean }
                            late: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/compliance/export-governance:evaluate:
    post:
      operationId: evaluateExportGovernance
      x-passage-duty: compliance.view
      description: >-
        The export policy decision for one download (FR-48.24). Defaults per
        classification: PII REASON and WATERMARK, FINANCIAL AUDIT, CONFIDENTIAL
        AUDIT (assumed), PUBLIC ALLOW; the request cannot override them. DENY is SEC-0709; REASON needs a reason of 10 characters
        (SEC-0710); APPROVAL, or an API_BULK or MCP_BULK read above 10,000 rows
        of a non-public class, holds the download (allowed false). Every export
        is audited. Unknown classification, channel or action is SEC-0711;
        negative rows SEC-0715.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [classification, channel, rows]
              properties:
                classification: { $ref: "#/components/schemas/ExportClassification" }
                channel: { type: string, enum: [GRID, EXPLORER, REPORT, API_BULK, MCP_BULK] }
                rows: { type: integer }
                reason: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: The decision
          content:
            application/json:
              schema:
                type: object
                required: [allowed, actions, requiresReason, requiresApproval, watermark, audit]
                properties:
                  allowed: { type: boolean }
                  actions: { type: array, items: { $ref: "#/components/schemas/ExportAction" } }
                  requiresReason: { type: boolean }
                  requiresApproval: { type: boolean }
                  watermark: { type: boolean }
                  audit: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/compliance/read-log:classify:
    post:
      operationId: classifyReadLog
      x-passage-duty: compliance.view
      description: >-
        Which fields of one read the read-log policy covers (FR-48.25). The rules
        are fixed server-side: national_id, bank_account, salary, health, i9_document and
        date_of_birth on any entity ("*.name" matches the last segment); field
        names only, never values. retention is fixed server-side at 730 days (readlog.retention_days,
        90 to 3650, else SEC-0714).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fields]
              properties:
                fields: { type: array, minItems: 1, maxItems: 1000, items: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: The logged fields
          content:
            application/json:
              schema:
                type: object
                required: [logged, fields, retentionDays]
                properties:
                  logged: { type: boolean }
                  fields: { type: array, items: { type: string } }
                  retentionDays: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
components:
  schemas:
    DataClass: { type: string, enum: [AP_PAYEE, FINANCIAL_RECORD, EMPLOYMENT, CANDIDATE, SYSTEM_LOG] }
    LegalHold:
      type: object
      required: [holdId, legalEntityId, reason, state, placedBy, placedAt, version]
      properties:
        holdId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        subjectRef: { type: string }
        dataClass: { $ref: "#/components/schemas/DataClass" }
        recordRef: { type: string }
        reason: { type: string }
        state: { type: string, enum: [ACTIVE, RELEASED] }
        placedBy: { type: string }
        placedAt: { type: string, format: date-time }
        releasedBy: { type: string }
        releasedAt: { type: string, format: date-time }
        releaseReason: { type: string }
        version: { type: integer, minimum: 1 }
    ErasureCommand:
      type: object
      required: [erasureId, legalEntityId, subjectRef, dataClasses, requestedBy, requestedAt]
      properties:
        erasureId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        subjectRef: { type: string }
        dataClasses: { type: array, items: { $ref: "#/components/schemas/DataClass" } }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
    RetentionPolicy:
      type: object
      required: [dataClass, months, anchor, source]
      properties:
        dataClass: { $ref: "#/components/schemas/DataClass" }
        months: { type: integer }
        anchor: { type: string, description: 'the event the months count from' }
        source: { type: string }
    PrivacyRequestType:
      type: string
      enum: [ACCESS, PORTABILITY, ERASURE, RECTIFICATION, RESTRICTION]
    PrivacyState:
      type: string
      enum: [RECEIVED, VERIFIED, DISCOVERED, HELD, APPROVED, DELIVERED, CLOSED, REJECTED]
    SubjectRequest:
      type: object
      required: [requestId, type, regulation, subjectRef, receivedAt, deadlineAt, state, holdIds, late, createdBy, createdAt, updatedAt, version]
      properties:
        requestId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/PrivacyRequestType" }
        regulation: { type: string, enum: [GDPR, CCPA] }
        subjectRef: { type: string }
        receivedAt: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/PrivacyState" }
        holdIds: { type: array, items: { type: string } }
        verifiedAt: { type: string, format: date-time }
        privacyOfficerId: { type: string }
        approvedAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        late: { type: boolean }
        justification: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    CampaignEntry:
      type: object
      required: [managerId, userId, roleName]
      properties:
        managerId: { type: string, maxLength: 200 }
        userId: { type: string, maxLength: 200 }
        roleName: { type: string, maxLength: 200 }
        decision: { type: string, enum: [CERTIFY, REVOKE, PENDING], description: empty means PENDING }
    CampaignCloseResult:
      type: object
      required: [closed, revoke, flagged, progress, asOf]
      properties:
        closed: { type: boolean }
        revoke: { type: array, items: { $ref: "#/components/schemas/CampaignEntry" } }
        flagged: { type: array, items: { $ref: "#/components/schemas/CampaignEntry" } }
        asOf: { type: string, format: date-time }
        progress:
          type: object
          required: [total, certified, revoked, pending, percentCertified, overdueByManager]
          properties:
            total: { type: integer }
            certified: { type: integer }
            revoked: { type: integer }
            pending: { type: integer }
            percentCertified: { type: integer }
            overdueByManager: { type: object, additionalProperties: { type: integer } }
    ExportClassification:
      type: string
      enum: [PII, FINANCIAL, CONFIDENTIAL, PUBLIC]
    ExportAction:
      type: string
      enum: [ALLOW, AUDIT, WATERMARK, REASON, APPROVAL, DENY]
    BreachRegime:
      type: string
      enum: [GDPR, UK_GDPR, US_STATE, PIPEDA, CERT_IN, LFPDPPP]
    Decimal:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
      description: decimal amount as a string, never a float
    AuditSpec:
      type: object
      required: [type]
      description: only the fields of the rule type are read
      properties:
        type: { type: string, enum: [DUPLICATE, KEYWORD, LIST_SEARCH, SAMPLING, THRESHOLD, WEEKEND_HOLIDAY, AGGREGATE] }
        keywords: { type: array, maxItems: 1000, items: { type: string }, description: KEYWORD; whole words, case and punctuation ignored }
        watchList: { type: array, maxItems: 1000, items: { type: string }, description: LIST_SEARCH; matched against partyId }
        limits:
          type: object
          maxProperties: 1000
          additionalProperties: { $ref: "#/components/schemas/Decimal" }
          description: THRESHOLD; positive limit per document category, in currency
        currency: { type: string, description: THRESHOLD and AGGREGATE; documents in another currency are not compared }
        holidays: { type: array, maxItems: 1000, items: { type: string, format: date }, description: WEEKEND_HOLIDAY; YYYY-MM-DD }
        sample:
          type: object
          required: [seed]
          description: SAMPLING; percent or everyK
          properties:
            seed: { type: string, minLength: 1 }
            percent: { type: integer, minimum: 1, maximum: 100 }
            everyK: { type: integer, minimum: 1 }
        limit: { $ref: "#/components/schemas/Decimal", description: AGGREGATE limit per party per calendar month }
    AuditDocument:
      type: object
      required: [id]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        partyId: { type: string, description: vendor, employee or customer }
        category: { type: string }
        amount: { $ref: "#/components/schemas/Decimal" }
        currency: { type: string }
        date: { type: string, format: date-time }
        texts: { type: array, items: { type: string } }
        number: { type: string, description: DUPLICATE; invoice number }
        postedCredit: { type: boolean, description: DUPLICATE; a posted credit note is never a duplicate }
    Finding:
      type: object
      required: [key, ruleType, documentId, score, evidence]
      properties:
        key: { type: string, description: "audit:<policyId>:v<version>:<documentId>" }
        ruleType: { type: string }
        documentId: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        evidence: { type: object, additionalProperties: { type: string } }
    Violation:
      type: object
      required: [id, policyId, ruleType, documentId]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        policyId: { type: string }
        ruleType: { type: string, enum: [DUPLICATE, KEYWORD, LIST_SEARCH, SAMPLING, THRESHOLD, WEEKEND_HOLIDAY, AGGREGATE] }
        documentId: { type: string }
        partyId: { type: string, description: required for DUPLICATE (the vendor) }
        caseId: { type: string, description: set when the violation already belongs to a case }
    CaseDraft:
      type: object
      required: [key, category, violationIds, documentIds]
      properties:
        key: { type: string }
        category: { type: string, enum: [DUPLICATE_PAYMENT, POLICY_BREACH, SAMPLED_REVIEW] }
        violationIds: { type: array, items: { type: string } }
        documentIds: { type: array, items: { type: string } }
    CaseStatus:
      type: string
      enum: [OPEN, IN_REVIEW, RESOLVED_NO_ISSUE, RESOLVED_ISSUE, CLOSED, ARCHIVED]
    CaseState:
      type: object
      required: [status, recoveryAmount, asOf]
      properties:
        status: { $ref: "#/components/schemas/CaseStatus" }
        resolutionCode: { type: string }
        recoveryAmount: { $ref: "#/components/schemas/Decimal" }
        currency: { type: string }
        closedAt: { type: string, format: date-time }
        asOf: { type: string, format: date-time, description: server time the action was judged at }
    ElevatedPlan:
      type: object
      required: [requesterId, targetUserId, roles, minutes, startsAt, endsAt, reviewDueAt, needsApproval, requiresPostReview]
      properties:
        requesterId: { type: string, format: uuid }
        targetUserId: { type: string, format: uuid }
        roles: { type: array, items: { type: string }, description: trimmed and de-duplicated }
        minutes: { type: integer }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        reviewDueAt: { type: string, format: date-time, description: endsAt plus breakglass.review_days business days (Monday to Friday) }
        needsApproval: { type: boolean }
        approverDuty: { type: string, enum: [compliance.break-glass.approve, platform.global.admin], description: present when needsApproval }
        requiresPostReview: { type: boolean }
    BreachClock:
      type: object
      required: [regime, recipient, basis, status]
      properties:
        regime: { $ref: "#/components/schemas/BreachRegime" }
        recipient: { type: string }
        basis: { type: string }
        deadlineAt: { type: string, format: date-time, description: absent where the regime has no fixed hour }
        status:
          type: string
          enum: [NO_FIXED_DEADLINE, NOT_DUE, AT_RISK, OVERDUE]
          description: AT_RISK inside the last 12 hours before the deadline
    Role:
      type: object
      required: [name, duties]
      properties:
        name: { type: string, minLength: 1 }
        duties: { type: array, maxItems: 500, items: { type: string } }
    Rule:
      type: object
      required: [ruleId, name, dutyA, dutyB, severity, riskId, mitigationAllowed, maxMitigationDays, status, version]
      properties:
        ruleId: { type: string, pattern: '^[A-Z0-9]+-\d{3}$' }
        name: { type: string }
        dutyA: { type: string, description: duty id or glob pattern such as *Post* }
        dutyB: { type: string }
        severity: { type: string, enum: [HIGH, MEDIUM, LOW] }
        riskId: { type: string }
        description: { type: string }
        mitigationAllowed: { type: boolean }
        maxMitigationDays: { type: integer, minimum: 1, maximum: 730 }
        status: { type: string, enum: [ACTIVE, RETIRED] }
        version: { type: integer }
    SimulatedConflict:
      type: object
      required: [userId, ruleId, severity, riskId, dutyA, dutyB, rolesA, rolesB, state]
      properties:
        userId: { type: string }
        ruleId: { type: string }
        severity: { type: string, enum: [HIGH, MEDIUM, LOW] }
        riskId: { type: string }
        dutyA: { type: string }
        dutyB: { type: string }
        rolesA: { type: array, items: { type: string } }
        rolesB: { type: array, items: { type: string } }
        state: { type: string, enum: [OPEN, MITIGATED, ACCEPTED_RISK] }
    Conflict:
      type: object
      required: [conflictId, userId, ruleId, riskId, severity, dutyA, dutyB, rolesA, rolesB, state, detectedAt, updatedAt, version]
      properties:
        conflictId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        ruleId: { type: string }
        riskId: { type: string }
        severity: { type: string, enum: [HIGH, MEDIUM, LOW] }
        dutyA: { type: string }
        dutyB: { type: string }
        rolesA: { type: array, items: { type: string } }
        rolesB: { type: array, items: { type: string } }
        state: { type: string, enum: [OPEN, MITIGATED, RESOLVED, ACCEPTED_RISK] }
        mitigationId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time, description: mitigation expiry, only while MITIGATED }
        decidedBy: { type: string, description: approver of the latest mitigation or the compliance.sod.admin holder who accepted the risk }
        decisionReason: { type: string }
        detectedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    Mitigation:
      type: object
      required: [mitigationId, conflictId, controlRef, reason, approverId, approvedAt, expiresAt]
      properties:
        mitigationId: { type: string, format: uuid }
        conflictId: { type: string, format: uuid }
        controlRef: { type: string }
        reason: { type: string }
        approverId: { type: string }
        approvedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ConflictDetail:
      allOf:
        - { $ref: "#/components/schemas/Conflict" }
        - type: object
          required: [mitigations]
          properties:
            mitigations: { type: array, items: { $ref: "#/components/schemas/Mitigation" } }
    ScreeningSubject:
      type: object
      additionalProperties: false
      required: [type, id, name]
      properties:
        type: { type: string, enum: [PARTY, DOCUMENT] }
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 500 }
        address: { type: string, maxLength: 2000 }
        country: { type: string, pattern: '^[A-Za-z]{2}$' }
    ListEntry:
      type: object
      additionalProperties: false
      required: [listCode, entryId, version, name]
      properties:
        listCode: { type: string, example: OFAC_SDN }
        entryId: { type: string }
        version: { type: integer, minimum: 1 }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        address: { type: string }
        country: { type: string }
    ScreeningHit:
      type: object
      required: [hitId, subjectType, subjectId, subjectName, listCode, listEntryId, listEntryVersion, listEntryName, score, matchedFields, state, detectedAt, updatedAt, version]
      properties:
        hitId: { type: string, format: uuid }
        subjectType: { type: string, enum: [PARTY, DOCUMENT] }
        subjectId: { type: string, format: uuid }
        subjectName: { type: string }
        listCode: { type: string }
        listEntryId: { type: string }
        listEntryVersion: { type: integer, minimum: 1 }
        listEntryName: { type: string }
        score: { type: number, minimum: 0, maximum: 1, description: composite match score, three decimal places }
        matchedFields: { type: array, items: { type: string, enum: [name, address, country] } }
        state: { type: string, enum: [OPEN, FALSE_POSITIVE, CONFIRMED] }
        decidedBy: { type: string }
        reason: { type: string }
        decidedAt: { type: string, format: date-time }
        detectedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    ExportItem:
      type: object
      additionalProperties: false
      required: [itemId, classification, qty, value]
      properties:
        itemId: { type: string }
        classification:
          type: object
          additionalProperties: false
          required: [regime, code]
          properties:
            regime: { type: string, enum: [US_EAR, EU_DUALUSE, HS] }
            code: { type: string, example: 5A002 }
        qty: { $ref: "#/components/schemas/Decimal" }
        value: { $ref: "#/components/schemas/Decimal" }
    ExportLicense:
      type: object
      additionalProperties: false
      required: [licenseId, regime, classifications, destinations, usedQty, usedValue, expiresAt]
      properties:
        licenseId: { type: string }
        number: { type: string }
        regime: { type: string, enum: [US_EAR, EU_DUALUSE, HS] }
        classifications: { type: array, items: { type: string, example: "US_EAR:5A002" } }
        destinations: { type: array, items: { type: string } }
        qtyLimit: { $ref: "#/components/schemas/Decimal" }
        usedQty: { $ref: "#/components/schemas/Decimal" }
        valueLimit: { $ref: "#/components/schemas/Decimal" }
        usedValue: { $ref: "#/components/schemas/Decimal" }
        expiresAt: { type: string, format: date-time }
    ExportResult:
      type: object
      required: [embargo, blocked, items]
      properties:
        embargo: { type: boolean }
        blocked: { type: boolean }
        items:
          type: array
          items:
            type: object
            required: [itemId, licenseRequired, blocked, warning]
            properties:
              itemId: { type: string }
              licenseRequired: { type: boolean }
              licenseId: { type: string, description: the license drawn on, or the officer's release reference }
              blocked: { type: boolean }
              warning: { type: boolean }
              code: { type: string, enum: [TRD-1002, TRD-1003] }
              detail: { type: string }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors: { type: object, additionalProperties: { type: string } }
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
