asyncapi: 3.0.0
info:
  title: Passage compliance events
  version: 1.0.0
  description: >-
    CloudEvents 1.0 events published by the compliance service through the
    outbox (wave 48: segregation of duties from slice 1, sanctions screening
    from slice 4, subject requests from slice 5). Types follow
    dev.passage.<context>.<entity>.<verb>.v<n>; the topic
    passage.<context>.<entity> is relayed by Debezium's outbox router, keyed by
    the aggregate id (conflict id, screening hit id or subject request id).
defaultContentType: application/cloudevents+json
servers:
  kafka:
    host: kafka.passage.svc:9092
    protocol: kafka
channels:
  conflictDetected:
    address: passage.sod.conflict
    messages:
      conflictDetected:
        $ref: "#/components/messages/ConflictDetected"
  mitigationApproved:
    address: passage.sod.mitigation
    messages:
      mitigationApproved:
        $ref: "#/components/messages/MitigationApproved"
  screeningHit:
    address: passage.trade.screening
    messages:
      screeningHit:
        $ref: "#/components/messages/ScreeningHit"
  requestCompleted:
    address: passage.privacy.request
    messages:
      requestCompleted:
        $ref: "#/components/messages/RequestCompleted"
operations:
  publishConflictDetected:
    action: send
    channel: {$ref: "#/channels/conflictDetected"}
    summary: >-
      An evaluation of a user's effective roles raised a conflict, or raised a
      RESOLVED one again (FR-48.4). Consumers - workflow, compliance.
    messages:
      - {$ref: "#/channels/conflictDetected/messages/conflictDetected"}
  publishMitigationApproved:
    action: send
    channel: {$ref: "#/channels/mitigationApproved"}
    summary: >-
      A non-conflicted approver mitigated an OPEN conflict with a compensating
      control and an expiry (FR-48.5, AC-48.4). Consumers - audit.
    messages:
      - {$ref: "#/channels/mitigationApproved/messages/mitigationApproved"}
  publishScreeningHit:
    action: send
    channel: {$ref: "#/channels/screeningHit"}
    summary: >-
      Screening opened a hit on a party or document at or above the tenant
      threshold (FR-48.19, AC-48.16). The subject stays blocked for order
      release, shipment, PO send and payment until a TradeComplianceOfficer
      clears or confirms the hit. Consumers - sales, procurement, payments.
    messages:
      - {$ref: "#/channels/screeningHit/messages/screeningHit"}
  publishRequestCompleted:
    action: send
    channel: {$ref: "#/channels/requestCompleted"}
    summary: >-
      A privacy officer closed a delivered GDPR or CCPA subject request
      (FR-48.10). late is true when it closed after its deadline, with the
      late-closure justification kept on the request. Consumers - audit.
    messages:
      - {$ref: "#/channels/requestCompleted/messages/requestCompleted"}
components:
  messages:
    ConflictDetected:
      name: dev.passage.sod.conflict.detected.v1
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/CloudEventHeaders"
      payload:
        $ref: "#/components/schemas/ConflictDetectedData"
    MitigationApproved:
      name: dev.passage.sod.mitigation.approved.v1
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/CloudEventHeaders"
      payload:
        $ref: "#/components/schemas/MitigationApprovedData"
    ScreeningHit:
      name: dev.passage.trade.screening.hit.v1
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/CloudEventHeaders"
      payload:
        $ref: "#/components/schemas/ScreeningHitData"
    RequestCompleted:
      name: dev.passage.privacy.request.completed.v1
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/CloudEventHeaders"
      payload:
        $ref: "#/components/schemas/RequestCompletedData"
  schemas:
    CloudEventHeaders:
      type: object
      required: [specversion, id, source, type, tenantid]
      properties:
        specversion: {type: string, const: "1.0"}
        id: {type: string}
        source: {type: string, example: compliance}
        type: {type: string}
        subject: {type: string, description: conflict id, screening hit id or subject request id}
        time: {type: string, format: date-time}
        tenantid: {type: string, format: uuid}
        correlationid: {type: string}
        causationid: {type: string}
        actor: {type: string}
    ConflictDetectedData:
      type: object
      required: [conflict_id, user_id, rule_id, risk_id, severity, duty_a, duty_b, roles]
      properties:
        conflict_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        rule_id: {type: string, pattern: '^[A-Z0-9]+-\d{3}$'}
        risk_id: {type: string}
        severity: {type: string, enum: [HIGH, MEDIUM, LOW]}
        duty_a: {type: string}
        duty_b: {type: string}
        roles: {type: array, items: {type: string}, description: roles that grant either duty}
    MitigationApprovedData:
      type: object
      required: [conflict_id, mitigation_id, user_id, rule_id, control_ref, approver, expires_at]
      properties:
        conflict_id: {type: string, format: uuid}
        mitigation_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        rule_id: {type: string}
        control_ref: {type: string}
        approver: {type: string}
        expires_at: {type: string, format: date-time}
    ScreeningHitData:
      type: object
      required: [hit_id, subject_type, subject_id, list_code, list_entry_id, score, matched_fields]
      properties:
        hit_id: {type: string, format: uuid}
        subject_type: {type: string, enum: [PARTY, DOCUMENT]}
        subject_id: {type: string, format: uuid}
        list_code: {type: string, example: OFAC_SDN}
        list_entry_id: {type: string}
        score: {type: string, pattern: '^[01]\.\d{3}$', example: "0.920"}
        matched_fields: {type: array, items: {type: string, enum: [name, address, country]}}
    RequestCompletedData:
      type: object
      required: [request_id, type, regulation, affected_domains, delivered_at, closed_at, late]
      properties:
        request_id: {type: string, format: uuid}
        type: {type: string, enum: [ACCESS, PORTABILITY, ERASURE, RECTIFICATION, RESTRICTION]}
        regulation: {type: string, enum: [GDPR, CCPA]}
        affected_domains:
          type: array
          items: {type: string}
          description: domains that held the subject; empty until the per-domain fan-out exists
        delivered_at: {type: string, format: date-time}
        closed_at: {type: string, format: date-time}
        late: {type: boolean}
