apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-compliance
  labels:
    app.kubernetes.io/name: {{ .Values.serviceName }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.serviceName }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.serviceName }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- if .Values.fieldCrypt.keysSecret }}
        fsGroup: 65532
        {{- end }}
{{- if .Values.fieldCrypt.keysSecret }}
      volumes:
        - name: field-crypt
          secret:
            secretName: {{ .Values.fieldCrypt.keysSecret }}
            defaultMode: 0440
{{- end }}
      containers:
        - name: compliance
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          env:
            - name: PASSAGE_ENV
              value: {{ .Values.config.passageEnv | quote }}
            - name: SERVICE_NAME
              value: {{ .Values.serviceName | quote }}
            - name: HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: ADMIN_ADDR
              value: {{ .Values.config.adminAddr | quote }}
            - name: MIGRATE_ON_START
              value: {{ .Values.config.migrateOnStart | quote }}
            - name: SOD_BLOCK_HIGH
              value: {{ .Values.config.sodBlockHigh | quote }}
            - name: SOD_MAX_MITIGATION_DAYS
              value: {{ .Values.config.sodMaxMitigationDays | quote }}
            - name: AUDIT_CASE_ARCHIVE_DAYS
              value: {{ .Values.config.auditCaseArchiveDays | quote }}
            - name: BREAKGLASS_MAX_MINUTES
              value: {{ .Values.config.breakglassMaxMinutes | quote }}
            - name: BREAKGLASS_SELF_ACTIVATE
              value: {{ .Values.config.breakglassSelfActivate | quote }}
            - name: BREAKGLASS_REVIEW_DAYS
              value: {{ .Values.config.breakglassReviewDays | quote }}
            - name: SCREENING_THRESHOLD
              value: {{ .Values.config.screeningThreshold | quote }}
            - name: TRADE_LICENSE_CHECK
              value: {{ .Values.config.tradeLicenseCheck | quote }}
            - name: PASSAGE_SERVICE_NAME
              value: compliance
{{- if .Values.serviceIdentity.publicKeys }}
            - { name: PASSAGE_SERVICE_PUBLIC_KEYS, value: {{ .Values.serviceIdentity.publicKeys | quote }} }
{{- end }}
{{- if .Values.fieldCrypt.keysSecret }}
            - { name: FIELDCRYPT_KEYS_FILE, value: /var/run/passage/field-crypt/keys }
            - { name: FIELDCRYPT_CURRENT_KEY_ID, value: {{ .Values.fieldCrypt.currentKeyId | quote }} }
{{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret.name }}
                  key: {{ .Values.databaseSecret.key }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
{{- if .Values.fieldCrypt.keysSecret }}
          volumeMounts:
            - { name: field-crypt, mountPath: /var/run/passage/field-crypt, readOnly: true }
{{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
