openapi: 3.1.0
info:
  title: payables
  version: 0.1.0
  description: Accounts payable settlement and payments (wave 19). This slice ships the stateless settlement preview.
servers:
  - url: https://api.passage.dev
paths:
  /v1/payables/settlements:preview:
    post:
      operationId: previewSettlement
      x-passage-duty: settlement.read
      description: Computes discount, FX difference, write-off and the balanced settlement journal for one credit against a vendor's open invoices. Writes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettlementRequest' }
      responses:
        '200':
          description: Settlement lines, journal and unapplied credit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/payables/payment-files:preview:
    post:
      operationId: previewPaymentFile
      x-passage-duty: payment-file.preview
      description: Builds a pain.001.001.09 file from the request, validates it against the vendored XSD and returns it with a summary. XSD violations are reported in validation.errors (AP-FIL-002) with status 200. Writes nothing. Bodies over 4 MiB are rejected with 413 and requests over 2000 payments with 400 (PAY-0001). An xmllint failure other than an invalid document is a 500.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentFileRequest' }
      responses:
        '200':
          description: Generated file, summary and XSD validation result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentFilePreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503':
          description: XSD validation timed out (COM-0503). Retry-After is sent only when the request timed out waiting for a validator slot; a document that ran the full validation timeout will time out again and carries no Retry-After.
          headers:
            Retry-After:
              description: Seconds to wait before retrying; present only when the validator was busy.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/KernelProblem' }
  /v1/payables/payments/status:parse:
    post:
      operationId: parsePaymentStatus
      x-passage-duty: payment-status.parse
      description: Parses a pain.002.001.10 status report into structured outcomes against the caller-supplied known message and payment ids. Writes nothing. Bodies over 16 MiB or status files over 10 MiB are rejected with 413.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentStatusRequest' }
      responses:
        '200':
          description: Per-payment outcomes and unknown references.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentStatusReport' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/payables/aging:
    get:
      operationId: vendorAging
      x-passage-duty: aging.read
      description: Vendor aging from the open-item store. Buckets (CURRENT, 1-30, 31-60, 61-90, 91-180, OVER-180) are whole days past due at as_of; amounts are open_amount per currency, optionally per vendor. Open amounts are the current balances; as_of bounds the invoice date and sets the bucket day count, it does not rewind settlements.
      parameters:
        - { name: legal_entity, in: query, required: false, description: Legal entity; defaults to the caller's single legal-entity scope., schema: { type: string, format: uuid } }
        - { name: as_of, in: query, required: false, description: Defaults to today (UTC)., schema: { type: string, format: date } }
        - { name: group_by, in: query, required: false, schema: { type: string, enum: [vendor, none], default: none } }
      responses:
        '200':
          description: Aging buckets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgingReport' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/payables/aging:reconcile:
    get:
      operationId: reconcileAging
      x-passage-duty: aging.reconcile
      description: Compares total open AP per currency with the AP control account (config AP_CONTROL_ACCOUNT, default 2000) in the ledger, as credits minus debits through the ledger period containing as_of. The ledger reports one currency per ledger; other currencies are listed with ledgerAvailable false and are never reconciled. When open items exist in any currency other than the ledger's, the ledger-currency line is also not comparable (comparable false, reason foreign-currency items require translation, difference null) because the ledger balance includes translated foreign invoices, and the overall reconciled flag is false. The ledger balance is cumulative to period end, so reconcile at a period end. The ledger call forwards the caller's identity and duties, so the caller needs ledger.balance.read and ledger.journal.read (the ledger is looked up to confirm it belongs to the legal entity; a 400 is returned otherwise, and a ledger 403 is passed through as 403) until service identity (#226) replaces forwarding.
      parameters:
        - { name: legal_entity, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: as_of, in: query, required: false, schema: { type: string, format: date } }
        - { name: ledger, in: query, required: true, description: Ledger holding the control account for the legal entity., schema: { type: string, format: uuid } }
        - { name: group_by, in: query, required: false, description: "vendorGroup adds vendorGroups: per currency and vendor group code, the open AP of the subledger against the AP control balance of the ledger lines carrying that code as the VENDGRP dimension (ledger balances with group_by=VENDGRP; open items and ledger lines without a code are UNASSIGNED). vendorGroupsReconciled is true only when every line is comparable and reconciles; reconciled still reflects the per-currency comparison. When the ledger does not define VENDGRP the lines are not comparable and say so. The aging report rejects vendorGroup.", schema: { type: string, enum: [vendor, vendorGroup, none], default: none } }
      responses:
        '200':
          description: Per-currency differences and the overall reconciled flag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgingReconciliation' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/payables/open-items:
    get:
      operationId: listOpenItems
      x-passage-duty: open-item.read
      description: Open items of one legal entity, ordered by due date then id, with keyset pagination (limit 1 to 200, default 50; pass the previous nextCursor as cursor). legal_entity defaults to the caller's legal-entity scope and is required for an unscoped caller; naming an entity outside the caller's scope is a 403. With value_in, every item carries a valuation in that currency at the spot rate of today (UTC) from the fx service; the call forwards the caller's identity and duties, so the caller also needs the fx rate-read duty until service identity (#226) replaces forwarding.
      parameters:
        - { name: legal_entity, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: vendor, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: held, in: query, required: false, description: "true keeps the unsettled items on payment hold. The duty payables.inbox.read (used by the batch service's My work inbox) reads this list only with held=true.", schema: { type: boolean } }
        - { name: due_from, in: query, required: false, description: Due date on or after., schema: { type: string, format: date } }
        - { name: due_to, in: query, required: false, description: Due date on or before., schema: { type: string, format: date } }
        - { name: currency, in: query, required: false, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [OPEN, PARTIALLY_SETTLED, SETTLED, REVERSED] } }
        - { name: source_invoices, in: query, required: false, description: Comma-separated ids of at most 200 source invoices (the receiving invoice ids); keeps the open items created from them., schema: { type: string } }
        - { name: value_in, in: query, required: false, description: Currency to value each item in (normally the legal entity currency)., schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, required: false, description: The nextCursor of the previous page (opaque)., schema: { type: string } }
      responses:
        '200':
          description: One page of open items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenItemPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/payables/open-items/{id}:
    get:
      operationId: getOpenItem
      summary: Read one AP open item
      x-passage-duty: open-item.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: value_in, in: query, required: false, schema: { type: string, pattern: '^[A-Z]{3}$' } }
      responses:
        '200':
          description: The open item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenItem' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/payables/open-items/{id}:hold:
    post:
      operationId: setPaymentHold
      x-passage-duty: payment-hold.manage
      description: Places a payment hold on an open item, so proposals skip it and approval or run start refuse a proposal that still holds it. Optional body {reason} (at most 500 characters) is stored with the hold and the user who placed it (payment_hold_reason, payment_held_by) and carried in the event. Idempotent, so holding a held item emits no event, counts nothing and logs no audit line. A SETTLED or REVERSED item is a 409 (AP-OPN-001). The change is audited by a structured log line and a dev.passage.payables.openitem.held.v1 event carrying the actor. The version is not bumped. The caller needs an identified user (X-Passage-User); an item outside the caller's legal-entity scope is a 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentHoldRequest' }
      responses:
        '200':
          description: The open item with its current paymentHold.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenItem' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/payables/open-items/{id}:release:
    post:
      operationId: releasePaymentHold
      x-passage-duty: payment-hold.manage
      description: Releases the payment hold of an open item (dev.passage.payables.openitem.released.v1 when the hold changes). A proposal that was built before the hold stays valid. The caller needs an identified user (X-Passage-User).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentHoldRequest' }
      responses:
        '200':
          description: The open item with its current paymentHold.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenItem' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/payables/vendors/{id}:block:
    post:
      operationId: blockVendorPayments
      x-passage-duty: vendor-block.manage
      description: Blocks a vendor for payment in one legal entity (legalEntityId, defaulting to the caller's legal-entity scope; an entity outside the caller's scope is a 403), so proposals of that entity skip the vendor's items and approval or run start refuse a proposal that includes them; other legal entities are unaffected. Blocking again replaces the reason. The vendor id is not validated against a vendor master until the party service (wave 07) exists. Audited by a structured log line and a dev.passage.payables.vendor.blocked.v1 event carrying the actor and reason. The caller needs an identified user (X-Passage-User).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorBlockRequest' }
      responses:
        '200':
          description: The vendor is blocked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorBlock' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/payables/vendors/{id}:unblock:
    post:
      operationId: unblockVendorPayments
      x-passage-duty: vendor-block.manage
      description: Removes the payment block of a vendor in one legal entity (optional body {legalEntityId}, default as for block; dev.passage.payables.vendor.unblocked.v1). A vendor that is not blocked in that entity is a 404. The caller needs an identified user (X-Passage-User).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorUnblockRequest' }
      responses:
        '200':
          description: The vendor is no longer blocked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorBlock' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/payables/employee-vendors/{workerId}:
    put:
      operationId: registerEmployeeVendor
      x-passage-duty: employee-vendor.maintain
      description: Maps an HR worker to the party vendor that pays their expense reimbursements in one legal entity (legalEntityId, defaulting to the caller's legal-entity scope; outside it is a 403). The vendor must be in the party vendor master (unknown is a 422 AP-EMP-001; party not configured is a 503, unreachable a 502). A worker is mapped once; the same vendor again is a 200 with Idempotent-Replayed true and another vendor is a 409 AP-EMP-002 (remapping is not supported). In the same transaction the worker's OPEN items still waiting for a payee move to the vendor (repointedItems) and leave PAYEE_UNVERIFIED; open items created from approved expense reports afterwards name the vendor and carry the worker in payeeWorkerId. The caller needs an identified user (X-Passage-User).
      parameters:
        - { name: workerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vendorId]
              properties:
                legalEntityId: { type: string, format: uuid }
                vendorId: { type: string, format: uuid }
      responses:
        '200': { description: The worker was already mapped to this vendor., content: { application/json: { schema: { $ref: '#/components/schemas/EmployeeVendor' } } } }
        '201': { description: The worker is mapped to the vendor., content: { application/json: { schema: { $ref: '#/components/schemas/EmployeeVendor' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/payables/opening-batches:
    post:
      operationId: importOpeningBatch
      x-passage-duty: opening-item.import
      description: Cutover import of open vendor items for one legal entity (legalEntityId, defaulting to the caller's legal-entity scope), called by the migration factory with a service token. All or nothing, 1 to 1000 items, rows numbered from 1. Every row needs a unique reference, a vendor in the party vendor master, an invoice number, invoice and due dates, a currency and a positive amount in whole minor units. controlTotalsMinor declares the total per currency; any mismatch refuses the batch (422 AP-OPB-003). A row error is a 422 AP-OPB-001 with errors keyed items[row].field. The same batchKey with the same content is a 200 with Idempotent-Replayed true; with other content it is a 409 AP-OPB-002; a reference already imported by another batch is a 422 AP-OPB-004. Imported items are ordinary OPEN items (listed, payable in proposals) marked as opening items; nothing is posted to the ledger, because the GL opening journal carries the AP control balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [batchKey, controlTotalsMinor, items]
              properties:
                legalEntityId: { type: string, format: uuid }
                batchKey: { type: string, maxLength: 100 }
                controlTotalsMinor: { type: object, additionalProperties: { type: integer, format: int64 }, description: "Total of the items per currency, in minor units." }
                items:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    additionalProperties: false
                    required: [reference, vendorId, invoiceNumber, invoiceDate, dueDate, currency, amountMinor]
                    properties:
                      reference: { type: string, maxLength: 100, description: "Legacy item reference, unique per legal entity." }
                      vendorId: { type: string, format: uuid }
                      invoiceNumber: { type: string, maxLength: 100 }
                      invoiceDate: { type: string, format: date }
                      dueDate: { type: string, format: date }
                      currency: { type: string, pattern: '^[A-Z]{3}$' }
                      amountMinor: { type: integer, format: int64, minimum: 1, description: "Open amount at cutover in minor units of the currency." }
      responses:
        '200': { description: The batch was already imported with this content., headers: { Idempotent-Replayed: { schema: { type: string, enum: ['true'] } } }, content: { application/json: { schema: { $ref: '#/components/schemas/OpeningBatch' } } } }
        '201': { description: The batch was imported., content: { application/json: { schema: { $ref: '#/components/schemas/OpeningBatch' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listOpeningBatches
      x-passage-duty: opening-item.import.read
      description: Imported opening batches of one legal entity (legal_entity, defaulting to the caller's scope), newest first, optionally one batch_key, with keyset paging (limit 1 to 200, default 50; pass the previous nextCursor as cursor). itemCount and totalsMinor are read back from the stored items, so the loader can verify what landed against what it sent.
      parameters:
        - { name: legal_entity, in: query, schema: { type: string, format: uuid } }
        - { name: batch_key, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: "The previous page's nextCursor." }
      responses:
        '200':
          description: Batches.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, asOf]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OpeningBatch' } }
                  nextCursor: { type: string, description: "Empty on the last page." }
                  asOf: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/payables/payment-proposals:
    get:
      operationId: listPaymentProposals
      x-passage-duty: payment-proposal.read
      description: Payment proposals of one legal entity without groups or lines, newest run date first (then id), with keyset pagination (limit 1 to 200, default 50; pass the previous nextCursor as cursor). legal_entity defaults to the caller's legal-entity scope and is required for an unscoped caller; naming an entity outside the caller's scope is a 403. totalValued is the sum of the group valuations in legalEntityCurrency. Fetch one proposal for its groups and lines.
      parameters:
        - { name: legal_entity, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [DRAFT, APPROVED, CANCELLED, EXECUTING, EXECUTED, FAILED] } }
        - { name: run_from, in: query, required: false, description: Run date on or after., schema: { type: string, format: date } }
        - { name: run_to, in: query, required: false, description: Run date on or before., schema: { type: string, format: date } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, required: false, description: The nextCursor of the previous page (opaque)., schema: { type: string } }
      responses:
        '200':
          description: One page of proposal summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentProposalPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createPaymentProposal
      x-passage-duty: payment-proposal.write
      description: |
        Selects the legal entity's open items with due_date on or before dueBy (default runDate) that are not on payment hold, whose vendor is not blocked and that are not already on a proposal. A cash discount is taken when runDate is on or before the item's discount date, the item is still OPEN (not partially settled) and the discount is smaller than the open amount. Items are grouped per vendor, currency and payment method (vendorPaymentMethods overrides paymentMethod per vendor) and valued in legalEntityCurrency at the spot rate of runDate (today when runDate is in the future) from the fx service. The proposal is saved as DRAFT with the caller as creator.
        runDate is the payment date and may not be earlier than today (UTC; 400 on the runDate field); cash-discount eligibility is decided against it, so a backdated date cannot revive an expired discount. Replaying an existing run is still allowed after its day has passed. Creation is idempotent per (legal entity, runDate, runId): repeating the same request returns the stored proposal with 200 and Idempotent-Replayed: true; the same key with a different request is a 409 (AP-PRP-001). A 409 with the same code also reports that items changed, were held or were taken by another proposal while it was built; retry. Withholding: withholdingCodes maps vendor ids to a code from the legal entity's posting profile (withholdingCodes); payables calls the tax service (POST /v1/tax/withholding/calculate, signed token) once per line of those vendors with the vendor's year-to-date paid amount (lines of APPROVED, EXECUTING and EXECUTED proposals of the same vendor and currency) and records withheld per line and group; a code missing from the profile or a tax rule rejection is a 422 AP-PRP-006, tax unreachable is a retryable 502 COM-0502 (a tax refusal such as 403 is a non-retryable 500 COM-0500), tax not configured a 503 COM-0503. If a vendor's year-to-date payments changed between proposal and approval (a concurrent draft was approved first) the approval is a 409 AP-PRP-001 and a new proposal is needed. With payment runs enabled, approval also needs the party service (503 COM-0503 otherwise) and field encryption keys, because it binds each group's bank account. Bank details are never part of a proposal. A run with nothing due after the filters is a 422 (AP-PRP-005) and nothing is stored. Null and an empty vendorPaymentMethods are the same request for replay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentProposalRequest' }
      responses:
        '200':
          description: Replay of an existing proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentProposal' }
        '201':
          description: Proposal created as a draft.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentProposal' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/payables/payment-proposals/{id}:
    get:
      operationId: getPaymentProposal
      summary: Read one payment proposal with its groups and lines
      x-passage-duty: payment-proposal.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The proposal with its groups and lines.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentProposal' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/payables/payment-proposals/{id}:approve:
    post:
      operationId: approvePaymentProposal
      x-passage-duty: payment-proposal.approve
      description: |
        Moves a DRAFT proposal to APPROVED. Segregation of duties: the approver must be a different user than the creator (403, AP-PRP-003); the database also refuses a row whose approver equals its creator. Approval locks every line's open item and re-checks version, open amount, payment hold, vendor block and status; if any line changed since the proposal was created the call is a 409 (AP-PRP-001) naming the open item ids. A proposal that is not a draft is a 409 (AP-PRP-002). A proposal whose runDate is before today (UTC) can no longer be approved: 409 AP-PRP-004, create a new proposal. Both the creator and the approver need an identified user (X-Passage-User). An approved proposal is executed by a payment run (POST /v1/payables/payment-runs).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The approved proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentProposal' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/payables/payment-proposals/{id}:cancel:
    post:
      operationId: cancelPaymentProposal
      x-passage-duty: payment-proposal.write
      description: |
        Cancels a DRAFT proposal (status CANCELLED, cancelledBy and cancelledAt recorded) and releases its open items so a new proposal can select them. The lines stay on the cancelled proposal for audit. An APPROVED or already cancelled proposal is a 409 (AP-PRP-002). The runId of a cancelled proposal stays used: repeating its request replays the cancelled proposal, so a new proposal needs a new runId. The caller needs an identified user (X-Passage-User).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The cancelled proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentProposal' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/payables/payment-runs:
    post:
      operationId: startPaymentRun
      x-passage-duty: payment-run.execute
      description: |
        Starts the payment run of an APPROVED proposal (duty payment-run.execute, distinct from payment-proposal.approve). The body names only the legal entity and the proposal: the ledger, GL accounts and paying bank account come from the server-side posting profile of the legal entity (PAYABLES_POSTING_PROFILES; none is a 422 AP-RUN-013) and the payee bank details are fetched from the party vendor master at file generation, so any other field is a 400 and a request can redirect nothing. The executor must be neither the proposal's creator nor its approver (403 AP-PRP-003; the database refuses it too, and a replay by the creator or approver is refused the same way instead of returning the run). A caller without an identified user is a 403 AP-RUN-016. Idempotent per (legal entity, proposal): repeating returns the stored run with 200 and Idempotent-Replayed: true, also after the run date. The call verifies the profile's ledger belongs to the legal entity, that every group is TRANSFER or WIRE, in the legal-entity currency (foreign-currency groups are a 422 until realized FX exists) and that the profile has a discount account when the proposal takes a discount and a withholding account when it withholds tax (422 AP-RUN-013); the party service must be configured (422 AP-RUN-013); a run date before today (UTC) is a 409 AP-PRP-004. It then locks the proposal, moves it APPROVED to EXECUTING and re-checks every line like approval does. If a line changed (hold, vendor block, version, amount) the run is created FAILED, the proposal becomes FAILED and its lines are released, and the response is 201 with status FAILED. A proposal that is not APPROVED is a 409 (AP-PRP-002). The activity calls below are driven by the workflow in services/workflow-ts with a signed service token and are each safe to repeat.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentRunRequest' }
      responses:
        '200':
          description: Replay of an existing run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRun' }
        '201':
          description: Run started (status RUNNING) or failed at start (status FAILED).
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRun' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/payables/payment-runs/{id}:
    get:
      operationId: getPaymentRun
      summary: Read one payment run
      x-passage-duty: payment-run.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The run with its payments and step timestamps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRun' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/payables/payment-runs/{id}/file:
    get:
      operationId: getPaymentRunFile
      x-passage-duty: payment-run.execute
      description: 'The generated pain.001.001.09 file, which carries the payees'' full bank details, so it needs the execute duty and every read is audited (log line "audit: payment file read" and payables_payment_file_reads_total). 404 until the generate-file step has run.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The pain.001 document.
          content:
            application/xml:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/payables/payment-runs/{id}:generate-file:
    post:
      operationId: generatePaymentRunFile
      x-passage-duty: payment-run.execute
      description: |
        Builds one pain.001.001.09 payment per proposal group (a bank account whose id or fingerprint differs from the one bound at approval is a terminal 422 AP-RUN-017), paying the group net of withheld tax, from the bank details revealed by the party service (GET /v1/party/vendors/{id}/bank-accounts:reveal, signed token with duty party.vendor-bank.reveal) at this step and never persisted in the clear: the one account in the group currency is used. A vendor that is unknown, has no account in the currency, has several, or has no account holder or bank country is a terminal 422 AP-RUN-017; party unreachable (transport failure or 5xx) is a retryable 502 COM-0502, while a party refusal (400, 401, 403, a missing signing key or scope) is a terminal 422 AP-RUN-013 configuration fault. The file is then validated against the XSD and stores the file and the ap_payment rows (one per group; a group can be paid once, ever). Repeating the step returns the stored file untouched. A bank-rule or XSD failure is a terminal 422 (AP-FIL-002, AP-RUN-002, AP-FIL-001, PAY-0001): fail the run. A FAILED run is a 409 (AP-RUN-011).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The run after the step (also when the step was already done).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRun' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /v1/payables/payment-runs/{id}:post-journal:
    post:
      operationId: postPaymentRunJournal
      x-passage-duty: payment-run.execute
      description: |
        Posts one balanced journal to the ledger through POST /v1/ledger/journal-entries with Idempotency-Key payables:payment-run:<run id>: debit the control account per group (gross, valued in the legal-entity currency), credit the bank clearing account (paid, valued) and credit the discount account (the rounding-exact difference) when a discount is taken. Crash-safe: a retry after a lost reply replays the same ledger entry. Needs the file step (409 AP-RUN-012). Only a ledger 400 or 422 is terminal (422 AP-RUN-014, recorded; the journal is never requested again). Any other ledger answer or a transport failure is a retryable 502 that records nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The run after the step (also when the step was already done).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRun' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /v1/payables/payment-runs/{id}:settle:
    post:
      operationId: settlePaymentRunItems
      x-passage-duty: payment-run.execute
      description: |
        Settles every unsettled line of the proposal in one transaction: open_amount reduced by the line open amount (discount included), status PARTIALLY_SETTLED or SETTLED, version bumped, payables.openitem.settled outbox event with the run id as settlement id. A line is marked settled so a repeat settles nothing twice. Needs the journal step (409 AP-RUN-012). An item changed since approval is a 409 (AP-RUN-015) and nothing is settled.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The run after the step (also when the step was already done).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRun' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /v1/payables/payment-runs/{id}:complete:
    post:
      operationId: completePaymentRun
      x-passage-duty: payment-run.execute
      description: |
        Marks the run COMPLETED and the proposal EXECUTED. Needs the settle step (409 AP-RUN-012); repeating on a completed run returns it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The run after the step (also when the step was already done).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRun' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /v1/payables/payment-runs/{id}:fail:
    post:
      operationId: failPaymentRun
      x-passage-duty: payment-run.execute
      description: Marks a run whose journal is not yet posted FAILED, the proposal FAILED and releases the proposal's lines so the items can be proposed again. Once the journal is posted the money is committed and the call is a 409 (AP-RUN-011); the run must complete instead. Repeating on a failed run returns it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: The failed run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRun' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
  /metrics:
    get:
      operationId: metrics
      x-passage-duty: public
      description: Served on the admin port (9090), never through the ingress.
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema: { type: string }
components:
  schemas:
    AgingReport:
      type: object
      required: [asOf, legalEntityId, groupBy, buckets]
      properties:
        asOf: { type: string, format: date }
        legalEntityId: { type: string, format: uuid }
        groupBy: { type: string, enum: [vendor, none] }
        buckets:
          type: array
          items:
            type: object
            required: [currency, bucket, amount]
            properties:
              vendorId: { type: string, format: uuid }
              currency: { type: string }
              bucket: { type: string, enum: [CURRENT, 1-30, 31-60, 61-90, 91-180, OVER-180] }
              amount: { type: string }
    AgingReconciliation:
      type: object
      required: [asOf, legalEntityId, ledgerId, controlAccount, ledgerPeriod, currencies, reconciled]
      properties:
        asOf: { type: string, format: date }
        legalEntityId: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        controlAccount: { type: string }
        ledgerPeriod: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        reconciled: { type: boolean, description: True only when every currency reconciles. }
        vendorGroups:
          type: array
          description: Present with group_by=vendorGroup; per currency and vendor group code, the subledger total against the ledger control balance of the VENDGRP dimension, UNASSIGNED last per currency.
          items:
            type: object
            required: [vendorGroupCode, currency, subledgerTotal, comparable, reconciled]
            properties:
              vendorGroupCode: { type: string, description: Vendor group short code or UNASSIGNED. }
              currency: { type: string }
              subledgerTotal: { type: string }
              ledgerBalance: { type: string, description: Credits minus debits of the control account for the code; absent when the ledger side is unavailable. }
              difference: { type: string, description: Subledger minus ledger; absent when not comparable. }
              comparable: { type: boolean }
              reconciled: { type: boolean }
              reason: { type: string, description: Why the line is not comparable. }
        vendorGroupDimension: { type: string, description: The ledger dimension attribute the vendor group lines were compared on; present with vendorGroups. }
        vendorGroupsReconciled: { type: boolean, description: True when every vendor group line is comparable and reconciles; present with vendorGroups. }
        currencies:
          type: array
          items:
            type: object
            required: [currency, subledgerTotal, ledgerBalance, difference, reconciled, ledgerAvailable, comparable]
            properties:
              currency: { type: string }
              subledgerTotal: { type: string }
              ledgerBalance: { type: [string, 'null'] }
              difference: { type: [string, 'null'], description: Subledger minus ledger. }
              reconciled: { type: boolean }
              ledgerAvailable: { type: boolean }
              comparable: { type: boolean }
              reason: { type: string }
    OpenItem:
      type: object
      required: [id, legalEntityId, vendorId, sourceInvoiceId, invoiceNumber, invoiceDate, dueDate, dueDateSource, currency, amount, openAmount, discountAmount, status, version, paymentHold]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        vendorGroupId: { type: string, format: uuid, description: Vendor group at creation (invoice.posted vendor_group_id); absent when the event carried none. }
        vendorGroupCode: { type: string, description: Short code of the vendor group (invoice.posted vendor_group_code, the VENDGRP ledger dimension value); absent when the event carried none. }
        sourceInvoiceId: { type: string, format: uuid }
        invoiceNumber: { type: string }
        invoiceDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        dueDateSource: { type: string, enum: [EVENT, DEFAULTED, OPENING], description: "OPENING marks an item loaded at cutover by an opening batch." }
        currency: { type: string }
        amount: { type: string }
        openAmount: { type: string }
        discountDate: { type: string, format: date }
        discountAmount: { type: string }
        status: { type: string, enum: [OPEN, PARTIALLY_SETTLED, SETTLED, REVERSED] }
        version: { type: integer }
        paymentHold: { type: boolean }
        paymentHoldReason: { type: string, description: Why the item is on payment hold; absent when it is not held or no reason was given. }
        proposalId: { type: string, format: uuid, description: The payment proposal (draft or approved, not cancelled or released) that holds the item; absent when no proposal does. }
        payeeUnverified: { type: boolean, description: "True for an expense reimbursement whose worker the employee-vendor register does not map yet (vendorId is the worker id); with bank bindings on it is left out of proposals until the worker is registered." }
        openingReference: { type: string, description: "Legacy item reference of an item loaded at cutover; absent otherwise." }
        payeeWorkerId: { type: string, format: uuid, description: "The worker an expense reimbursement pays, once vendorId is the vendor the employee-vendor register maps them to." }
        valuation:
          type: object
          description: Present when value_in is set. amount is openAmount times rate rounded to the minor unit of currency.
          required: [currency, amount, rate, rateDate]
          properties:
            currency: { type: string }
            amount: { type: string }
            rate: { type: string }
            rateDate: { type: string, format: date }
    OpenItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OpenItem' }
        nextCursor: { type: string, description: Absent on the last page. }
    PaymentHoldRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500, description: Why the item is held; ignored on release. }
    VendorBlockRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal-entity scope; required for an unscoped caller. }
        reason: { type: string, minLength: 1, maxLength: 500, description: Why the vendor is blocked; trimmed. }
    VendorUnblockRequest:
      type: object
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        reason: { type: string, description: Ignored. }
    EmployeeVendor:
      type: object
      required: [legalEntityId, workerId, vendorId, registeredBy, registeredAt, repointedItems]
      properties:
        legalEntityId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        registeredBy: { type: string }
        registeredAt: { type: string, format: date-time }
        repointedItems: { type: integer, description: "OPEN items of the worker this call moved to the vendor" }
    OpeningBatch:
      type: object
      required: [id, legalEntityId, batchKey, itemCount, totalsMinor, importedBy, importedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        batchKey: { type: string }
        itemCount: { type: integer }
        totalsMinor: { type: object, additionalProperties: { type: integer, format: int64 }, description: "Stored item total per currency in minor units." }
        importedBy: { type: string }
        importedAt: { type: string, format: date-time }
    VendorBlock:
      type: object
      required: [vendorId, legalEntityId, blocked]
      properties:
        vendorId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        blocked: { type: boolean }
        reason: { type: string, description: Present when blocked. }
    PaymentProposalSummary:
      type: object
      required: [id, legalEntityId, runDate, runId, dueBy, legalEntityCurrency, paymentMethod, status, createdBy, createdAt, totalValued]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        runDate: { type: string, format: date }
        runId: { type: string }
        dueBy: { type: string, format: date }
        legalEntityCurrency: { type: string }
        paymentMethod: { type: string }
        status: { type: string, enum: [DRAFT, APPROVED, CANCELLED, EXECUTING, EXECUTED, FAILED] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        approvedBy: { type: string }
        approvedAt: { type: string, format: date-time }
        totalValued: { type: string }
    PaymentProposalPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PaymentProposalSummary' }
        nextCursor: { type: string, description: Absent on the last page. }
    PaymentProposalRequest:
      type: object
      additionalProperties: false
      required: [legalEntityCurrency, runDate, runId, paymentMethod]
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal-entity scope; required for an unscoped caller. }
        legalEntityCurrency: { type: string, pattern: '^[A-Z]{3}$', description: Currency every group is valued in. }
        runDate: { type: string, format: date }
        runId: { type: string, minLength: 1, maxLength: 64 }
        dueBy: { type: string, format: date, description: Selection cut-off; defaults to runDate and may not be earlier. }
        paymentMethod: { type: string, enum: [TRANSFER, ACH, CHECK, CARD, WIRE] }
        vendorPaymentMethods:
          type: object
          maxProperties: 500
          description: Vendor id to payment method, overriding paymentMethod.
          additionalProperties: { type: string, enum: [TRANSFER, ACH, CHECK, CARD, WIRE] }
        withholdingCodes:
          type: object
          maxProperties: 500
          description: Vendor id to a withholding code defined in the legal entity's posting profile. Part of the request hash.
          additionalProperties: { type: string, minLength: 1, maxLength: 40 }
    PaymentProposal:
      type: object
      required: [id, legalEntityId, runDate, runId, dueBy, rateDate, legalEntityCurrency, paymentMethod, status, createdBy, createdAt, groups, totalValued]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        runDate: { type: string, format: date }
        runId: { type: string }
        dueBy: { type: string, format: date }
        rateDate: { type: string, format: date }
        legalEntityCurrency: { type: string }
        paymentMethod: { type: string }
        status: { type: string, enum: [DRAFT, APPROVED, CANCELLED, EXECUTING, EXECUTED, FAILED], description: 'APPROVED moves to EXECUTING when a payment run starts, then to EXECUTED or, if the run fails before its journal posts, FAILED (lines released).' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        approvedBy: { type: string }
        approvedAt: { type: string, format: date-time }
        cancelledBy: { type: string }
        cancelledAt: { type: string, format: date-time }
        executedAt: { type: string, format: date-time }
        failedAt: { type: string, format: date-time }
        totalValued: { type: string, description: Sum of group valued amounts in legalEntityCurrency. }
        totalWithheld: { type: object, additionalProperties: { type: string }, description: Tax withheld per group currency; never summed across currencies. }
        excludedItems:
          type: array
          description: Open items left out because their payee (an expense reimbursement to a worker the employee-vendor register does not map) is unverified; reason PAYEE_UNVERIFIED. Kept with the proposal, so the replay and GET return them too. They stay open and are offered again once the worker is registered.
          items:
            type: object
            required: [itemId, vendorId, reason]
            properties:
              itemId: { type: string, format: uuid }
              vendorId: { type: string, format: uuid }
              reason: { type: string, enum: [PAYEE_UNVERIFIED] }
        groups:
          type: array
          items:
            type: object
            required: [id, vendorId, currency, paymentMethod, gross, discount, net, valued, lines]
            properties:
              id: { type: string, format: uuid }
              vendorId: { type: string, format: uuid }
              currency: { type: string }
              paymentMethod: { type: string }
              gross: { type: string, description: Sum of open amounts in the group currency. }
              discount: { type: string }
              withheld: { type: string, description: Tax withheld in the group currency. }
              bankAccountId: { type: string, description: Party bank account id bound at approval; absent on a draft. }
              bankLast4: { type: string, description: Last four digits of the bound account number. }
              net: { type: string, description: Gross minus discount minus withheld; the amount paid to the vendor in the group currency. }
              valued: { type: string, description: Sum of line valued amounts in legalEntityCurrency. }
              lines:
                type: array
                items:
                  type: object
                  required: [openItemId, openAmount, discount, pay, rate, valued]
                  properties:
                    openItemId: { type: string, format: uuid }
                    openAmount: { type: string }
                    discount: { type: string }
                    pay: { type: string, description: Open amount minus discount, before withholding. }
                    withheld: { type: string }
                    withholdingCode: { type: string }
                    rate: { type: string, description: Group currency to legalEntityCurrency; 1 for the same currency. }
                    valued: { type: string, description: (pay minus withheld) times rate rounded to the minor unit of legalEntityCurrency. }
    PaymentRunRequest:
      type: object
      additionalProperties: false
      required: [proposalId]
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal-entity scope; required for an unscoped caller. }
        proposalId: { type: string, format: uuid }
    PaymentRun:
      type: object
      required: [id, legalEntityId, proposalId, status, requestedBy, ledgerId, bankAccount, controlAccount, createdAt, payments]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        proposalId: { type: string, format: uuid }
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        requestedBy: { type: string }
        ledgerId: { type: string, format: uuid }
        bankAccount: { type: string }
        controlAccount: { type: string }
        discountAccount: { type: string }
        withholdingAccount: { type: string }
        fileNumber: { type: string }
        fileSha256: { type: string }
        paymentCount: { type: integer }
        fileGeneratedAt: { type: string, format: date-time }
        journalRequestedAt: { type: string, format: date-time, description: Set before the ledger is called; from then on the run can no longer be failed unless the ledger rejected the journal. }
        journalRejectedAt: { type: string, format: date-time }
        journalEntryId: { type: string }
        journalPostedAt: { type: string, format: date-time }
        settledAt: { type: string, format: date-time }
        failureReason: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        payments:
          type: array
          items:
            type: object
            required: [groupId, vendorId, currency, paymentMethod, endToEndId, amount, valuedAmount]
            properties:
              id: { type: string, format: uuid }
              groupId: { type: string, format: uuid }
              vendorId: { type: string, format: uuid }
              currency: { type: string }
              paymentMethod: { type: string }
              endToEndId: { type: string }
              amount: { type: string }
              valuedAmount: { type: string }
    DecimalString:
      type: string
      pattern: '^[0-9]+(\.[0-9]+)?$'
      maxLength: 28
    PostalAddress:
      type: object
      additionalProperties: false
      required: [country]
      properties:
        streetName: { type: string }
        postCode: { type: string }
        townName: { type: string }
        country: { type: string, pattern: '^[A-Z]{2}$' }
    Party:
      type: object
      additionalProperties: false
      required: [name, address]
      properties:
        name: { type: string }
        address: { $ref: '#/components/schemas/PostalAddress' }
    Account:
      type: object
      additionalProperties: false
      properties:
        iban: { type: string }
        otherId: { type: string, maxLength: 34 }
    PaymentFileRequest:
      type: object
      additionalProperties: false
      required: [fileNumber, debtor, debtorAccount, debtorBic, profile, payments]
      properties:
        fileNumber: { type: string, maxLength: 35 }
        created: { type: string, format: date-time, description: Defaults to the server clock. }
        debtor: { $ref: '#/components/schemas/Party' }
        debtorAccount: { $ref: '#/components/schemas/Account' }
        debtorBic: { type: string }
        profile:
          type: object
          additionalProperties: false
          required: [variant]
          properties:
            variant: { type: string, enum: [SEPA, US, UK, CH] }
            pain001Version: { type: string, enum: ['001.001.09'] }
            overrides: { type: object, additionalProperties: true }
        payments:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            type: object
            additionalProperties: false
            required: [method, executionDate, number, amount, currency, creditor]
            properties:
              method:
                type: object
                additionalProperties: false
                required: [type, format]
                properties:
                  type:
                    type: string
                    enum: [TRANSFER, WIRE]
                    description: Narrower than the bank profile method enum (TRANSFER, ACH, CHECK, CARD, WIRE) on purpose. The preview only renders pain.001, and only TRANSFER and WIRE map to the PAIN001 format; ACH (NACHA), CHECK and CARD cannot be sent as pain.001.
                  format: { type: string, enum: [PAIN001] }
                  minPayment: { $ref: '#/components/schemas/DecimalString' }
                  maxPayment: { $ref: '#/components/schemas/DecimalString' }
                  cutoffTime: { type: string }
              executionDate: { type: string, format: date }
              number: { type: string, maxLength: 35 }
              amount: { $ref: '#/components/schemas/DecimalString' }
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              creditor:
                type: object
                additionalProperties: false
                required: [name, address]
                properties:
                  name: { type: string }
                  address: { $ref: '#/components/schemas/PostalAddress' }
                  iban: { type: string }
                  otherId: { type: string }
                  bic: { type: string }
                  routingNumber: { type: string }
              invoices:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [number, amount]
                  properties:
                    number: { type: string }
                    amount: { $ref: '#/components/schemas/DecimalString' }
    PaymentFilePreview:
      type: object
      required: [format, fileNumber, content, summary, validation]
      properties:
        format: { type: string, enum: [PAIN001] }
        fileNumber: { type: string }
        content: { type: string, description: The pain.001.001.09 XML document. }
        summary:
          type: object
          required: [paymentCount, controlSum, sha256]
          properties:
            paymentCount: { type: integer }
            controlSum: { $ref: '#/components/schemas/DecimalString' }
            sha256: { type: string }
        validation:
          type: object
          required: [valid, errors]
          properties:
            valid: { type: boolean }
            errors:
              type: array
              items:
                type: object
                required: [code, path, reason]
                properties:
                  code: { type: string, enum: [AP-FIL-002] }
                  path: { type: string }
                  reason: { type: string }
    PaymentStatusRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, description: The pain.002.001.10 XML document, at most 10485760 bytes (UTF-8; the server counts bytes, not characters). }
        messages:
          type: object
          description: Original message id to the end-to-end ids it carried.
          additionalProperties: { type: array, items: { type: string } }
        payments:
          type: object
          description: End-to-end id to the payment's current status and method.
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              status: { type: string }
              method: { type: string }
    PaymentStatusReport:
      type: object
      required: [messageId, originalMessageId, outcomes, unknown]
      properties:
        messageId: { type: string }
        originalMessageId: { type: string }
        outcomes:
          type: array
          items:
            type: object
            required: [endToEndId, bankStatus]
            properties:
              endToEndId: { type: string }
              bankStatus: { type: string }
              reasonCode: { type: string }
              reasonText: { type: string }
              from: { type: string }
              to: { type: string }
              hold: { type: string }
              transitionError:
                type: object
                properties:
                  code: { type: string }
                  detail: { type: string }
              warning:
                type: object
                properties:
                  payment: { type: string }
                  code: { type: string }
                  text: { type: string }
        unknown:
          type: array
          items:
            type: object
            required: [code, kind, id]
            properties:
              code: { type: string, enum: [AP-STS-002] }
              kind: { type: string, enum: [message, payment] }
              id: { type: string }
    SettlementRequest:
      type: object
      additionalProperties: false
      required: [settlementDate, accountingCurrency, credit, invoices]
      properties:
        settlementDate: { type: string, format: date }
        accountingCurrency: { type: string, pattern: '^[A-Z]{3}$' }
        credit:
          type: object
          additionalProperties: false
          required: [currency, amount]
          properties:
            currency: { type: string, pattern: '^[A-Z]{3}$' }
            amount: { $ref: '#/components/schemas/DecimalString' }
            rate: { $ref: '#/components/schemas/DecimalString' }
        invoices:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [id, currency, amount, dueDate]
            properties:
              id: { type: string, minLength: 1, maxLength: 64 }
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              amount: { $ref: '#/components/schemas/DecimalString' }
              openAmount: { $ref: '#/components/schemas/DecimalString' }
              rate: { $ref: '#/components/schemas/DecimalString' }
              dueDate: { type: string, format: date }
              discountPct: { $ref: '#/components/schemas/DecimalString' }
              discountDate: { type: string, format: date }
              alwaysDiscount: { type: boolean }
              marked: { type: boolean }
        policy:
          type: object
          additionalProperties: false
          properties:
            discountOnPartial: { type: boolean }
            autoWriteOff: { type: boolean }
            writeOffLimit: { $ref: '#/components/schemas/DecimalString' }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string }
        currency: { type: string }
    SettlementResult:
      type: object
      required: [lines, journal, creditRemaining]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [invoiceId, applied, discount, writeOff, appliedAccounting, fxDifference, openAfter, status]
            properties:
              invoiceId: { type: string }
              applied: { $ref: '#/components/schemas/Money' }
              discount: { $ref: '#/components/schemas/Money' }
              writeOff: { $ref: '#/components/schemas/Money' }
              appliedAccounting: { $ref: '#/components/schemas/Money' }
              fxDifference: { $ref: '#/components/schemas/Money' }
              openAfter: { $ref: '#/components/schemas/Money' }
              status: { type: string, enum: [SETTLED, PARTIALLY_SETTLED] }
        journal:
          type: array
          items:
            type: object
            required: [account, side, amount]
            properties:
              account: { type: string, enum: [ap_control, bank_clearing, discount_taken, write_off, fx_gain, fx_loss] }
              side: { type: string, enum: [debit, credit] }
              amount: { $ref: '#/components/schemas/Money' }
        creditRemaining: { $ref: '#/components/schemas/Money' }
    Problem:
      type: object
      required: [type, title, status, code, serviceCode]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        serviceCode: { type: string }
        traceId: { type: string }
        errors: { type: object, additionalProperties: { type: string } }
    KernelProblem:
      type: object
      description: Problem body written by the platform kernel (httpx.Problem); carries no serviceCode.
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: Raw service code such as AUTH-0003. }
        traceId: { type: string }
        errors: { type: object, additionalProperties: { type: string } }
    TenantRejection:
      type: object
      description: JSON text written by tenant.Middleware through http.Error, with no instance or traceId.
      required: [type, title, status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
  responses:
    Unauthorized:
      description: Tenant header missing (tenant.Middleware, text/plain carrying the JSON of TenantRejection) or malformed (the handler's own check, application/problem+json).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
        text/plain:
          schema: { $ref: '#/components/schemas/TenantRejection' }
          example: '{"type":"https://passage.dev/problems/AUTH-0001","title":"Unauthorized","status":401,"code":"AUTH-0001","detail":"missing tenant"}'
    Forbidden:
      description: Principal lacks the duty the route requires (see x-passage-duty). Written by authz.RequireDuty through httpx.Fail.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/KernelProblem' }
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
