asyncapi: 3.0.0
info:
  title: Passage Payables Events
  version: 1.0.0
  description: |
    CloudEvents 1.0 published through the transactional outbox (Debezium relays
    rows to Kafka). Each event is written in the same database transaction as the
    state change it announces. Types follow dev.passage.<context>.<entity>.<verb>.v<n>.
    Additive-only schema evolution.
defaultContentType: application/cloudevents+json
channels:
  openItemEvents:
    address: passage.payables.openitem
    messages:
      openItemCreated:
        $ref: "#/components/messages/OpenItemCreated"
      openItemSettled:
        $ref: "#/components/messages/OpenItemSettled"
      openItemGrouped:
        $ref: "#/components/messages/OpenItemGrouped"
      openItemHeld:
        $ref: "#/components/messages/OpenItemHeld"
      openItemReleased:
        $ref: "#/components/messages/OpenItemReleased"
  vendorEvents:
    address: passage.payables.vendor
    messages:
      vendorBlocked:
        $ref: "#/components/messages/VendorBlocked"
      vendorUnblocked:
        $ref: "#/components/messages/VendorUnblocked"
  paymentProposalEvents:
    address: passage.payables.paymentproposal
    messages:
      proposalCreated:
        $ref: "#/components/messages/ProposalCreated"
      proposalApproved:
        $ref: "#/components/messages/ProposalApproved"
      proposalCancelled:
        $ref: "#/components/messages/ProposalCancelled"
operations:
  publishOpenItemCreated:
    action: send
    channel: { $ref: "#/channels/openItemEvents" }
    messages:
      - { $ref: "#/channels/openItemEvents/messages/openItemCreated" }
  publishOpenItemSettled:
    action: send
    channel: { $ref: "#/channels/openItemEvents" }
    messages:
      - { $ref: "#/channels/openItemEvents/messages/openItemSettled" }
  publishOpenItemGrouped:
    action: send
    channel: { $ref: "#/channels/openItemEvents" }
    messages:
      - { $ref: "#/channels/openItemEvents/messages/openItemGrouped" }
  publishOpenItemHeld:
    action: send
    channel: { $ref: "#/channels/openItemEvents" }
    messages:
      - { $ref: "#/channels/openItemEvents/messages/openItemHeld" }
  publishOpenItemReleased:
    action: send
    channel: { $ref: "#/channels/openItemEvents" }
    messages:
      - { $ref: "#/channels/openItemEvents/messages/openItemReleased" }
  publishVendorBlocked:
    action: send
    channel: { $ref: "#/channels/vendorEvents" }
    messages:
      - { $ref: "#/channels/vendorEvents/messages/vendorBlocked" }
  publishVendorUnblocked:
    action: send
    channel: { $ref: "#/channels/vendorEvents" }
    messages:
      - { $ref: "#/channels/vendorEvents/messages/vendorUnblocked" }
  publishProposalCreated:
    action: send
    channel: { $ref: "#/channels/paymentProposalEvents" }
    messages:
      - { $ref: "#/channels/paymentProposalEvents/messages/proposalCreated" }
  publishProposalApproved:
    action: send
    channel: { $ref: "#/channels/paymentProposalEvents" }
    messages:
      - { $ref: "#/channels/paymentProposalEvents/messages/proposalApproved" }
  publishProposalCancelled:
    action: send
    channel: { $ref: "#/channels/paymentProposalEvents" }
    messages:
      - { $ref: "#/channels/paymentProposalEvents/messages/proposalCancelled" }
components:
  messages:
    OpenItemCreated:
      name: dev.passage.payables.openitem.created.v1
      summary: >-
        A dev.passage.payables.invoice.posted.v1 event opened a vendor open item. Redelivery of the same source invoice
        emits nothing. Consumers: aging, payment proposals.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/OpenItemData"
    OpenItemSettled:
      name: dev.passage.payables.openitem.settled.v1
      summary: >-
        A settlement reduced the open amount of a vendor open item; status is PARTIALLY_SETTLED or SETTLED.
        Consumers: aging, ledger posting.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/OpenItemSettledData"
    OpenItemGrouped:
      name: dev.passage.payables.openitem.grouped.v1
      summary: >-
        A redelivered dev.passage.payables.invoice.posted.v1 carried the vendor group (id or code) of an open item that was created
        without one, and the group was assigned. Emitted once per open item; a group is never overwritten.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/OpenItemData"
    OpenItemHeld:
      name: dev.passage.payables.openitem.held.v1
      summary: >-
        A user placed a payment hold on an open item (POST /v1/payables/open-items/{id}:hold). Held items are excluded from
        payment proposals. Emitted only when the hold changes.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/OpenItemHoldData"
    OpenItemReleased:
      name: dev.passage.payables.openitem.released.v1
      summary: >-
        A user released the payment hold of an open item (POST /v1/payables/open-items/{id}:release). Emitted only when the
        hold changes.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/OpenItemHoldData"
    VendorBlocked:
      name: dev.passage.payables.vendor.blocked.v1
      summary: >-
        A user blocked a vendor for payment in one legal entity (POST /v1/payables/vendors/{id}:block). Re-blocking
        replaces the reason and emits again.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/VendorBlockData"
    VendorUnblocked:
      name: dev.passage.payables.vendor.unblocked.v1
      summary: A user removed the payment block of a vendor (POST /v1/payables/vendors/{id}:unblock).
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/VendorBlockData"
    ProposalCreated:
      name: dev.passage.payables.paymentproposal.created.v1
      summary: >-
        A DRAFT payment proposal was stored. An idempotent replay of the same run emits nothing. Consumers: approval
        notification.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ProposalData"
    ProposalApproved:
      name: dev.passage.payables.paymentproposal.approved.v1
      summary: >-
        A DRAFT proposal was approved by a user other than its creator. Consumers: payment run workflow.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ProposalData"
    ProposalCancelled:
      name: dev.passage.payables.paymentproposal.cancelled.v1
      summary: >-
        A DRAFT proposal was cancelled (the rejection path of the approval flow) and its open items were released for
        another proposal.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ProposalData"
  schemas:
    OpenItemData:
      type: object
      required: [open_item_id, legal_entity_id, vendor_id, source_invoice_id, currency, open_amount, status]
      properties:
        open_item_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        vendor_group_id: { type: string, format: uuid, description: "vendor group the open item was created under; absent when unknown" }
        vendor_group_code: { type: string, pattern: "^[A-Z0-9_-]{1,10}$", description: "short code of the vendor group (the VENDGRP ledger dimension value of the invoice's vendor-control credit); absent when invoice.posted carried none" }
        source_invoice_id: { type: string, format: uuid, description: "id of the source document (a posted invoice, or an approved expense report) that created the open item" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        open_amount: { type: string, description: "decimal string; the amount still open after this change" }
        status: { type: string, enum: [OPEN, PARTIALLY_SETTLED, SETTLED, REVERSED] }
    OpenItemSettledData:
      type: object
      required: [open_item_id, legal_entity_id, vendor_id, source_invoice_id, currency, open_amount, status, settled_amount]
      properties:
        open_item_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        source_invoice_id: { type: string, format: uuid, description: "id of the source document (a posted invoice, or an approved expense report) that created the open item" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        open_amount: { type: string, description: "decimal string; the amount still open after this settlement" }
        status: { type: string, enum: [PARTIALLY_SETTLED, SETTLED] }
        settled_amount: { type: string, description: "decimal string; the amount this settlement applied" }
        settlement_id: { type: string, description: "reference of the settlement that applied the amount; absent when the caller gave none" }
    OpenItemHoldData:
      type: object
      required: [open_item_id, legal_entity_id, vendor_id, payment_hold, actor]
      properties:
        open_item_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        payment_hold: { type: boolean, description: "the hold flag after this change" }
        reason: { type: string, description: "why the item was held; held events only, absent when none was given" }
        actor: { type: string, description: "user who made the change" }
    VendorBlockData:
      type: object
      required: [vendor_id, legal_entity_id, actor]
      properties:
        vendor_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        reason: { type: string, description: "present on blocked events only" }
        actor: { type: string, description: "user who made the change" }
    ProposalData:
      type: object
      required: [proposal_id, legal_entity_id, run_date, run_id, status, actor]
      properties:
        proposal_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        run_date: { type: string, format: date }
        run_id: { type: string }
        status: { type: string, enum: [DRAFT, APPROVED, CANCELLED] }
        actor: { type: string, description: "creator on created, approver on approved, canceller on cancelled" }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "legal entity currency; created events only" }
        total_valued: { type: string, description: "decimal string, proposal total in the legal entity currency, net of withheld tax; created events only" }
        total_withheld: { type: object, additionalProperties: { type: string }, description: "currency to decimal string, tax withheld per group currency, absent when nothing is withheld; created events only" }
