apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: payables
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: payables
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payables
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
      containers:
        - name: payables
          image: {{ include "payables.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: PASSAGE_SERVICE_NAME
              value: payables
{{- if .Values.serviceIdentity.publicKeys }}
            - name: PASSAGE_SERVICE_PUBLIC_KEYS
              value: {{ .Values.serviceIdentity.publicKeys | quote }}
{{- end }}
{{- if .Values.serviceIdentity.signingKeySecret }}
            - name: PASSAGE_SERVICE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serviceIdentity.signingKeySecret }}
                  key: signing-key
{{- end }}
            - { name: LEDGER_URL, value: {{ .Values.ledgerUrl | quote }} }
            - { name: AP_CONTROL_ACCOUNT, value: {{ .Values.controlAccount | quote }} }
            - { name: FX_URL, value: {{ .Values.fxUrl | quote }} }
            - { name: FX_RATE_TYPE, value: {{ .Values.fxRateType | quote }} }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
