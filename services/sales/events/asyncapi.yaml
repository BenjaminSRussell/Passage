        $ref: "#/components/schemas/QuotationConvertedData"
    QuotationExpired:
      name: dev.passage.sales.quotation.expired.v1
      title: Quotation expired
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/CloudEventHeaders"
      payload:
        $ref: "#/components/schemas/QuotationExpiredData"
    QuotationChanged:
      name: dev.passage.sales.quotation.changed.v1
      title: Quotation changed
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/CloudEventHeaders"
      payload:
        $ref: "#/components/schemas/QuotationChangedData"
    QuotationCancelled:
      name: dev.passage.sales.quotation.cancelled.v1
      title: Quotation cancelled
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/CloudEventHeaders"
      payload:
        $ref: "#/components/schemas/QuotationCancelledData"
    IntakeErrorRecorded:
      name: dev.passage.sales.intakeerror.recorded.v1
      title: Intake error recorded
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/CloudEventHeaders"
      payload:
        $ref: "#/components/schemas/IntakeErrorData"
    IntakeErrorResolved:
      name: dev.passage.sales.intakeerror.resolved.v1
      title: Intake error resolved
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/CloudEventHeaders"
      payload:
        $ref: "#/components/schemas/IntakeErrorData"
    OrderConfirmed:
      name: dev.passage.sales.order.confirmed.v1
      title: Sales order confirmed
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/CloudEventHeaders"
      payload:
        $ref: "#/components/schemas/OrderConfirmedData"
    OrderHoldApplied:
      name: dev.passage.sales.orderhold.applied.v1
      title: Order hold applied
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/CloudEventHeaders"
      payload:
        $ref: "#/components/schemas/OrderHoldData"
    OrderHoldReleased:
      name: dev.passage.sales.orderhold.released.v1
      title: Order hold released
      contentType: application/cloudevents+json
