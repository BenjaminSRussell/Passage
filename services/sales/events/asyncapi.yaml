    ATPPromised:
      name: dev.passage.sales.atp.promised.v1
      title: Order line promised against ATP
      contentType: application/cloudevents+json
      headers:
        $ref: "#/components/schemas/CloudEventHeaders"
      payload:
        $ref: "#/components/schemas/ATPPromisedData"
  schemas:
    ReturnOrderData:
      type: object
      required: [return_order_id, rma_number, legal_entity_id, customer_id, status, currency, gross, restocking, net, lines, actor, version]
      properties:
        return_order_id: {type: string, format: uuid}
        rma_number: {type: string}
        legal_entity_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        status: {type: string, enum: [REQUESTED, AUTHORIZED, RECEIVED, INSPECTED, DISPOSITIONED, CREDITED, CLOSED, REJECTED, EXPIRED]}
        currency: {type: string}
        gross: {type: string}
        restocking: {type: string}
        net: {type: string}
        credit_note_id: {type: string}
        journal_posting_id: {type: string}
        actor: {type: string}
        version: {type: integer}
        lines:
          type: array
          items:
            type: object
            required: [line_id, line_no, product_id, quantity_expected, quantity_received, unit_price, restocking]
            properties:
              line_id: {type: string, format: uuid}
              line_no: {type: integer}
              product_id: {type: string, format: uuid}
              disposition: {type: string, enum: [CREDIT_ONLY, RETURN_TO_STOCK]}
              quantity_expected: {type: string}
              quantity_received: {type: string}
              unit_price: {type: string}
              restocking: {type: string}
              inventory_receipt_id: {type: string}
    ATPPromisedData:
      type: object
      required: [order_id, line_id, line_no, product_id, site_id, warehouse_id, quantity, requested_ship_date, source, complete, backorder_qty, schedule, actor, version]
      properties:
        order_id: {type: string, format: uuid}
        line_id: {type: string, format: uuid}
        line_no: {type: integer}
        product_id: {type: string, format: uuid}
        site_id: {type: string}
        warehouse_id: {type: string}
        quantity: {type: string, description: line quantity (decimal string)}
        requested_ship_date: {type: string, format: date, description: the line's requested ship date}
        source: {type: string, enum: [ATP, ALLOCATION, BACKORDER_RUN], description: ALLOCATION when the quota period the line drew from held the promise back (BR-27.15); BACKORDER_RUN when a committed backorder run changed the line (FR-27.17)}
        complete: {type: boolean, description: true when the whole quantity was placed on dated schedule lines}
        promised_date: {type: string, format: date, description: the line's new confirmed ship date - the date of the first dated schedule line; absent when nothing could be promised}
        backorder_qty: {type: string, description: quantity promised after the requested date or not at all (decimal string)}
        schedule:
          type: array
          items:
            type: object
            required: [quantity, status]
            properties:
              date: {type: string, format: date, description: absent on an UNPROMISED slice}
              bucket_date: {type: string, format: date, description: date of the ATP bucket the slice drew on (with product, site and warehouse the atp_bucket key); absent on an UNPROMISED slice}
              quantity: {type: string}
              status: {type: string, enum: [CONFIRMED, BACKORDER, UNPROMISED]}
        actor: {type: string}
        version: {type: integer, description: order version after the promise}
    OrderChangeRequestedData:
      type: object
      required: [request_id, legal_entity_id, order_id, customer_id, kind, base_version, reason, actor, diff]
      properties:
        request_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        kind: {type: string, enum: [CHANGE, CANCEL], description: CHANGE is a PATCH waiting for approval; CANCEL is a cancellation}
        base_version: {type: integer, description: order version the change was made against}
        reason: {type: string}
        actor: {type: string, description: who asked for the change}
        diff:
          type: array
          items:
            type: object
            required: [line_no, field, old, new]
            properties:
              line_no: {type: integer, description: 0 for a header field}
              field: {type: string}
              old: {type: string}
              new: {type: string}
    OrderChangeDecidedData:
      type: object
      required: [request_id, legal_entity_id, order_id, kind, requested_by, actor, comment]
      properties:
        request_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        kind: {type: string, enum: [CHANGE, CANCEL]}
        requested_by: {type: string}
        actor: {type: string, description: who decided; on a withdrawal, the requester}
        comment: {type: string}
        applied_version: {type: integer, description: order version the approval produced; absent on a rejection or a withdrawal}
    ChangePolicyChangedData:
      type: object
      required: [legal_entity_id, customer_id, approval_required, approver_ids, actor, version]
      properties:
        legal_entity_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        approval_required: {type: boolean}
        approval_threshold: {type: string, description: changes applied without approval may together move an order by less than this; absent when every change needs approval}
        threshold_currency: {type: string, pattern: "^[A-Z]{3}$"}
        approver_ids: {type: array, items: {type: string, format: uuid}, description: the only users who may decide the customer's requests or change its confirmed orders directly; empty when anyone holding sales.order.approve may}
        actor: {type: string}
        version: {type: integer, description: version after the change}
    ParametersChangedData:
      type: object
      required: [legal_entity_id, quotation_expiry_days, quotation_probability_default, credit_release_validity_days, credit_hold_sla_business_days, default_order_type, credit_check_points, intake_dedup_window_days, delivery_date_control_default, sales_lead_time_days, actor, version]
      properties:
        legal_entity_id: {type: string, format: uuid}
        quotation_expiry_days: {type: integer, minimum: 1, maximum: 365}
        quotation_probability_default: {type: integer, minimum: 0, maximum: 100}
        credit_release_validity_days: {type: integer, minimum: 1, maximum: 30}
        credit_hold_sla_business_days: {type: integer, minimum: 1, maximum: 10}
        default_order_type: {type: string, enum: [JOURNAL, ORDER, SUBSCRIPTION]}
        one_time_order_limit: {type: string, description: the one-time order limit as a decimal string; absent when the defaults apply}
        one_time_order_limit_currency: {type: string, pattern: "^[A-Z]{3}$"}
        credit_check_points: {type: array, minItems: 1, items: {type: string, enum: [entry, confirm, release, packing_slip, invoice]}, description: "where the credit rules run for the legal entity; always includes confirm. packing_slip and invoice are PRD values sales refuses until the fulfillment and billing waves run them, listed so consumers accept them then"}
        intake_dedup_window_days: {type: integer, minimum: 1, maximum: 90, description: how many days a (channel, externalRef) pair identifies one order of the legal entity}
        delivery_date_control_default: {type: string, enum: [NONE, SALES_LEAD_TIME], description: the control of a line without its own (FR-27.3)}
        sales_lead_time_days: {type: integer, minimum: 0, maximum: 365, description: days SALES_LEAD_TIME adds to today}
        actor: {type: string}
        version: {type: integer, description: version after the change}
    OrderProgressData:
      type: object
      required: [progress_id, order_id, legal_entity_id, kind, source_ref, lines, previous_status, order_status, actor, version]
      properties:
        progress_id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        currency: {type: string, pattern: "^[A-Z]{3}$", description: "the order currency (#480)"}
        kind: {type: string, enum: [DELIVERED, INVOICED]}
        source_ref: {type: string, description: the packing slip, shipment or invoice number the report came with}
        lines:
          type: array
          items:
            type: object
            required: [line_id, line_no, quantity, delivered_qty, invoiced_qty, line_status]
            properties:
              line_id: {type: string, format: uuid}
              line_no: {type: integer}
              quantity: {type: string, description: what this report covered}
              delivered_qty: {type: string, description: the line's delivered quantity after the report}
              invoiced_qty: {type: string, description: the line's invoiced quantity after the report}
              line_status: {type: string, enum: [OPEN, RESERVED, PICKED, DELIVERED, INVOICED, CANCELLED]}
              reported_weight: {type: string, description: "catch-weight lines on a DELIVERED report only (FR-24.7): the weight this report delivered (its actualWeight, else cases x nominal), decimal string in the product's inventory weight unit"}
              delivered_weight: {type: string, description: "catch-weight lines on a DELIVERED report only: the line's delivered weight so far"}
              product_id: {type: string, format: uuid, description: "the line's product (#480)"}
              unit: {type: string, description: "the line's unit (the case unit on a catch-weight line)"}
              site_id: {type: string, format: uuid, description: "the line's site, when set"}
              warehouse_id: {type: string, format: uuid, description: "the line's warehouse, when set"}
              tracking:
                type: array
                description: "DELIVERED reports that named them only (#480): the batches and serials the delivery took, in the reported order; quantities add up to quantity"
                items:
                  type: object
                  required: [quantity]
                  properties:
                    batch: {type: string}
                    serial: {type: string}
                    quantity: {type: string, description: "decimal string in the line's unit (cases on a catch-weight line)"}
                    reported_weight: {type: string, description: "catch-weight lines split over several entries: the entry's weight; the entries add up to reported_weight"}
        previous_status: {type: string}
        order_status: {type: string, enum: [CONFIRMED, PARTIALLY_SHIPPED, SHIPPED, INVOICED]}
        actor: {type: string}
        version: {type: integer, description: the order version the report produced}
    DeliveryTermsData:
      type: object
      required: [terms_id, legal_entity_id, customer_id, transport_days, receiving_days, actor, version]
      properties:
        terms_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        transport_days: {type: integer, minimum: 0, maximum: 60}
        receiving_days: {type: array, items: {type: integer, minimum: 1, maximum: 7}, description: ISO weekdays, 1 Monday to 7 Sunday}
        previous_transport_days: {type: integer, description: absent on created}
        previous_receiving_days: {type: array, items: {type: integer}, description: absent on created}
        actor: {type: string}
        version: {type: integer, description: terms version after the change}
    AllocationQuotaData:
      type: object
      required: [quota_id, product_id, period_start, period_end, quota_qty, consumed_qty, actor, version]
      properties:
        quota_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid, description: absent when the quota applies to every customer of the legal entity}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date}
        quota_qty: {type: string, description: quota quantity as a decimal string}
        previous_qty: {type: string, description: quota quantity before a change; absent on created}
        consumed_qty: {type: string}
        actor: {type: string}
        version: {type: integer, description: quota version after the change}
    AllocationData:
      type: object
      required: [quota_id, order_id, line_id, product_id, quantity, consumed_qty, remaining_qty]
      properties:
        quota_id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        line_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        quantity: {type: string, description: quantity drawn or returned}
        consumed_qty: {type: string, description: quota consumed after the change}
        remaining_qty: {type: string}
        confirmed_ship_date: {type: string, format: date, description: on consumed, the date the line is confirmed for}
        source: {type: string, enum: [ALLOCATION], description: on consumed, present when the line moved to a later period because the requested one was exhausted}
    CloudEventHeaders:
      type: object
      required: [specversion, id, source, type, tenantid, sequence, dataschema]
      properties:
        specversion: {type: string, const: "1.0"}
        id: {type: string, format: uuid}
        source: {type: string, example: "/passage/sales/sales"}
        type: {type: string}
        subject: {type: string}
        time: {type: string, format: date-time}
        tenantid: {type: string, format: uuid}
        legalentityid: {type: string, format: uuid}
        correlationid: {type: string}
        causationid: {type: string}
        traceparent: {type: string}
        actor: {type: string}
        sequence: {type: integer, description: aggregate version}
        dataschema: {type: string, format: uri}
    OrderConfirmedData:
      type: object
      required: [order_id, customer_id, order_type, currency, lines, net_total, version]
      properties:
        order_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        order_type: {type: string, enum: [JOURNAL, ORDER, SUBSCRIPTION, RETURNED], description: a JOURNAL order never reserves or consumes ATP (BR-27.7); inventory and planning skip its lines}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        lines:
          type: array
          items:
            type: object
            required: [line_id, product_id, quantity, atp_qty, site_id, warehouse_id, confirmed_ship_date]
            properties:
              line_id: {type: string, format: uuid}
              product_id: {type: string, format: uuid}
              quantity: {type: string}
              site_id: {type: string, format: uuid}
              warehouse_id: {type: string, format: uuid}
              confirmed_ship_date: {type: string, format: date}
              confirmed_receipt_date: {type: string, format: date, description: "confirmed_ship_date plus the customer's transport days, rolled to its next receiving weekday (BR-27.2)"}
              atp_qty: {type: string, description: "quantity of the line whose schedule lines are CONFIRMED (promised by the requested date); a release caller sends it as atpQty on POST /v1/fulfillment/releases:run"}
              configuration_id: {type: string, format: uuid, description: the saved configuration of a configured line; production builds the line to it (absent on ordinary lines)}
              catch_weight:
                type: object
                description: "catch-weight lines only (FR-24.7): quantity is then a count of cases; the spec is per case, decimal strings in the product's inventory weight unit"
                required: [nominal, min, max]
                properties:
                  nominal: {type: string}
                  min: {type: string}
                  max: {type: string}
        net_total: {type: string}
        version: {type: integer}
        one_time:
          type: object
          description: >-
            present on a one-time customer order (FR-27.22), absent otherwise. The walk-in buyer's name, address and tax id
            are personal data kept sealed in sales and are not carried on the bus; the invoice and open item read them from
            GET /v1/sales/orders/{id} (sales.order.read).
          required: [country]
          properties:
            country: {type: string, pattern: "^[A-Z]{2}$", description: the buyer's ISO 3166 alpha-2 country}
    OrderChangedData:
      type: object
      required: [order_id, version, reason, actor, diff, repromised_lines]
      properties:
        order_id: {type: string, format: uuid}
        version: {type: integer, description: the version this change produced}
        reason: {type: string, maxLength: 500}
        actor: {type: string}
        diff:
          type: array
          description: >-
            field-level changes; line_no 0 is a header field. A change of a
            parent line also lists the follow-on changes of its supplementary
            lines (BR-27.14): quantity, requested and confirmed ship date, and
            lineStatus OPEN to CANCELLED when the parent drops below the rule's
            base quantity. A line added by the change is listed with a lineAdded
            entry (new is the product id) followed by lineId, unit, siteId,
            warehouseId, quantity, unitPrice, discPct, requestedShipDate and, on
            a confirmed order, confirmedShipDate, each with an empty old; a line
            the change removed is listed as lineStatus OPEN to CANCELLED.
          items:
            type: object
            required: [line_no, field, old, new]
            properties:
              line_no: {type: integer}
              field: {type: string}
              old: {type: string}
              new: {type: string}
        repromised_lines:
          type: array
          description: line numbers whose confirmed ship date was re-promised (quantity or date changed on a confirmed order), including supplementary lines that moved with their parent and lines the change added
          items: {type: integer}
    OrderCancelledData:
      type: object
      required: [order_id, version, line_ids, reason, actor]
      properties:
        order_id: {type: string, format: uuid}
        version: {type: integer}
        line_ids:
          type: array
          description: the lines this cancellation moved to CANCELLED
          items: {type: string, format: uuid}
        reason: {type: string, maxLength: 500}
        actor: {type: string}
    OrderClosedData:
      type: object
      required: [order_id, legal_entity_id, version, previous_status, grace_days, actor]
      properties:
        order_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        version: {type: integer, description: the order version the close produced}
        previous_status: {type: string, enum: [INVOICED]}
        grace_days: {type: integer, description: "the grace period the run applied: the order had been unchanged for at least this many days"}
        actor: {type: string, description: the principal that ran the job}
    OrderRemainderCancelledData:
      type: object
      required: [order_id, legal_entity_id, version, status, lines, reason, actor]
      properties:
        order_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        version: {type: integer}
        status: {type: string, enum: [CONFIRMED, CANCELLED, PARTIALLY_SHIPPED, SHIPPED, INVOICED], description: the order status after the remainder was closed; PARTIALLY_SHIPPED after a one-line close while another line has quantity to deliver; CONFIRMED when a PATCH removed, lowered, raised or reopened lines of a confirmed order; CANCELLED when a confirmed order was cancelled as a whole (every line goes out with kept_qty 0)}
        lines:
          type: array
          description: the lines that gave up quantity (only the named line for a one-line close; the removed lines and their cancelled supplementary lines, and the lines whose quantity was lowered, raised or reopened, for a PATCH; every cancelled line for a whole-order cancel)
          items:
            type: object
            required: [line_id, line_no, product_id, cancelled_qty, kept_qty, line_status]
            properties:
              line_id: {type: string, format: uuid}
              line_no: {type: integer}
              product_id: {type: string, format: uuid}
              cancelled_qty: {type: string, description: decimal quantity the line gave up, 0 for a raised or reopened line}
              kept_qty: {type: string, description: decimal quantity the line keeps, 0 when the line was cancelled}
              line_status: {type: string, enum: [OPEN, RESERVED, CANCELLED, DELIVERED, INVOICED], description: the line status after the close; OPEN or RESERVED for a line a PATCH lowered, raised or reopened}
        reason: {type: string, maxLength: 500}
        actor: {type: string}
    OrderHoldData:
      type: object
      required: [order_id, hold_id, hold_type, reason_code, actor, version]
      properties:
        order_id: {type: string, format: uuid}
        hold_id: {type: string, format: uuid}
        hold_type: {type: string, enum: [CREDIT, FRAUD, MANUAL, PRICE_REVIEW]}
        reason_code: {type: string}
        actor: {type: string}
        version: {type: integer}
    OrderHoldRejectedData:
      type: object
      required: [order_id, hold_id, hold_type, reason_code, comment, actor, version]
      properties:
        order_id: {type: string, format: uuid}
        hold_id: {type: string, format: uuid}
        hold_type: {type: string, enum: [CREDIT]}
        reason_code: {type: string}
        comment: {type: string, maxLength: 500, description: the credit manager's reason for the rejection}
        actor: {type: string}
        version: {type: integer, description: the order version after the cancellation}
    AgreementReleasedData:
      type: object
      required: [agreement_id, agreement_number, customer_id, product_id, sales_order_id, quantity, released_qty, remaining_qty, status, version, actor]
      properties:
        agreement_id: {type: string, format: uuid}
        agreement_number: {type: string, example: SA-0000001}
        customer_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        sales_order_id: {type: string, format: uuid, description: the DRAFT order the release created}
        quantity: {type: string, description: quantity drawn by this release (decimal string)}
        released_qty: {type: string, description: cumulative released quantity after this release}
        remaining_qty: {type: string, description: commitment with the over-delivery tolerance, less released quantity}
        status: {type: string, enum: [ACTIVE, EXHAUSTED]}
        version: {type: integer, description: the agreement version after the release}
        actor: {type: string}
    AgreementLifecycleData:
      type: object
      required: [agreement_id, agreement_number, legal_entity_id, customer_id, product_id, commitment_qty, overdelivery_pct, released_qty, remaining_qty, unit_price, status, diff, version, actor]
      properties:
        agreement_id: {type: string, format: uuid}
        agreement_number: {type: string, example: SA-0000001}
        legal_entity_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        commitment_qty: {type: string, description: commitment after the change (decimal string)}
        overdelivery_pct: {type: string, description: tolerance above the commitment in percent after the change (decimal string)}
        released_qty: {type: string, description: released quantity after the change}
        remaining_qty: {type: string, description: commitment with the over-delivery tolerance, less released quantity}
        unit_price: {type: string, description: agreed price after the change; applies to later releases}
        status: {type: string, enum: [ACTIVE, EXHAUSTED, CLOSED]}
        diff:
          type: array
          description: changed fields (commitmentQty, unitPrice, cumTolerance, overdeliveryPct, validFrom, validTo, releasedQty, status)
          items:
            type: object
            required: [line_no, field, old, new]
            properties:
              line_no: {type: integer, description: always 0, the fields are agreement fields}
              field: {type: string}
              old: {type: string}
              new: {type: string}
        reason: {type: string, description: the close reason, or the order cancellation or line change that returned or drew quantity}
        sales_order_id: {type: string, format: uuid, description: returned and drawn only; the order that gave back or drew the quantity}
        returned_qty: {type: string, description: returned only; quantity given back}
        drawn_qty: {type: string, description: drawn only; quantity drawn by raising the release line}
        version: {type: integer, description: the agreement version after the change}
        actor: {type: string}
    BackorderRunCommittedData:
      type: object
      required: [run_id, legal_entity_id, product_id, site_id, warehouse_id, strategy, supply, allocated, deconfirmed_count, lines, actor, version]
      properties:
        run_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        site_id: {type: string, format: uuid}
        warehouse_id: {type: string, format: uuid}
        strategy: {type: string, enum: [WIN, GAIN, REDISTRIBUTE, FILL, LOSE]}
        supply: {type: string, description: supply the run distributed (decimal string)}
        allocated: {type: string, description: quantity carrying a promised date across the run's lines after the run}
        deconfirmed_count: {type: integer, description: lines whose dated quantity fell}
        lines:
          type: array
          description: only the lines whose dated quantity changed
          items:
            type: object
            required: [order_id, line_id, line_no, before_qty, after_qty, deconfirmed]
            properties:
              order_id: {type: string, format: uuid}
              line_id: {type: string, format: uuid}
              line_no: {type: integer}
              before_qty: {type: string}
              after_qty: {type: string}
              deconfirmed: {type: boolean}
        actor: {type: string}
        version: {type: integer, description: the run version after the commit}
    ScheduleReleaseData:
      type: object
      required: [release_id, release_no, release_type, legal_entity_id, agreement_id, agreement_number, customer_id, product_id, status, cum_received, cum_shipped, difference, open_qty, lines, actor]
      properties:
        release_id: {type: string, format: uuid}
        release_no: {type: string, description: the customer's release number}
        release_type: {type: string, enum: [FORECAST, JIT]}
        legal_entity_id: {type: string, format: uuid}
        agreement_id: {type: string, format: uuid}
        agreement_number: {type: string, example: SA-0000001}
        customer_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        status: {type: string, enum: [ACCEPTED, HELD, REJECTED], description: HELD means CUM_QTY_MISMATCH and no schedule line changed}
        cum_received: {type: string, description: the customer's cumulative received quantity (decimal string)}
        cum_shipped: {type: string, description: shipped quantity the release is reconciled against on its own cumulative basis (shipped since the reset plus the offset of closed periods)}
        difference: {type: string, description: cum_received less cum_shipped}
        open_qty: {type: string, description: cumulative required less shipped, at least 0}
        lines:
          type: array
          description: the open schedule lines now owned by the release; empty when HELD or REJECTED
          items:
            type: object
            required: [date, quantity]
            properties:
              date: {type: string, format: date}
              quantity: {type: string}
        superseded_release_id: {type: string, format: uuid, description: the release whose open lines were replaced}
        decision: {type: string, enum: [ACCEPT, REJECT], description: resolved only}
        reason: {type: string, description: resolved only}
        actor: {type: string}
    QuotationConvertedData:
      type: object
      required: [quotation_id, quotation_number, customer_id, order_id, order_number, lines, actor, version]
      properties:
        quotation_id: {type: string, format: uuid}
        quotation_number: {type: string, description: SQ- number}
        customer_id: {type: string, format: uuid}
        order_id: {type: string, format: uuid, description: DRAFT order created from the converted lines}
        order_number: {type: string, description: SO- number}
        lines:
          type: array
          items: {type: integer, minimum: 1, description: quotation line numbers; the order renumbers them from 1 in this order}
        actor: {type: string}
        version: {type: integer, description: quotation version produced by the conversion}
    QuotationExpiredData:
      type: object
      required: [quotation_id, quotation_number, legal_entity_id, customer_id, valid_until, previous_status, probability_pct, net_total, currency, actor, version]
      properties:
        quotation_id: {type: string, format: uuid}
        quotation_number: {type: string, description: SQ- number}
        legal_entity_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        valid_until: {type: string, format: date, description: the last day the quotation was valid}
        previous_status: {type: string, enum: [DRAFT, SENT]}
        probability_pct: {type: integer, minimum: 0, maximum: 100}
        net_total: {type: string, description: decimal string in currency}
        currency: {type: string, description: ISO 4217 alpha-3}
        actor: {type: string}
        version: {type: integer, description: quotation version produced by the expiry}
    QuotationChangedData:
      type: object
      required: [quotation_id, quotation_number, legal_entity_id, customer_id, status, changed, valid_until, probability_pct, line_count, net_total, currency, actor, version]
      properties:
        quotation_id: {type: string, format: uuid}
        quotation_number: {type: string, description: SQ- number}
        legal_entity_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        status: {type: string, enum: [DRAFT, SENT]}
        changed:
          type: array
          description: what the call changed
          items: {type: string, enum: [valid_until, probability_pct, lines]}
        valid_until: {type: string, format: date, description: the validity after the change}
        probability_pct: {type: integer, minimum: 0, maximum: 100}
        line_count: {type: integer, minimum: 1}
        net_total: {type: string, description: decimal string in currency}
        currency: {type: string, description: ISO 4217 alpha-3}
        actor: {type: string}
        version: {type: integer, description: quotation version produced by the change}
    QuotationCancelledData:
      type: object
      required: [quotation_id, quotation_number, legal_entity_id, customer_id, previous_status, reason, net_total, currency, actor, version]
      properties:
        quotation_id: {type: string, format: uuid}
        quotation_number: {type: string, description: SQ- number}
        legal_entity_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        previous_status: {type: string, enum: [DRAFT, SENT]}
        reason: {type: string, maxLength: 200}
        net_total: {type: string, description: decimal string in currency}
        currency: {type: string, description: ISO 4217 alpha-3}
        actor: {type: string}
        version: {type: integer, description: quotation version produced by the cancellation}
    IntakeErrorData:
      type: object
      required: [intake_error_id, legal_entity_id, channel, request_hash, error_code, attempts, version]
      properties:
        intake_error_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        channel: {type: string}
        external_ref: {type: string}
        request_hash: {type: string, description: "fingerprint of the refused payload; keyed (hmac:<key id>:<hex>) when the request carries a one-time buyer, so the buyer cannot be confirmed against it"}
        error_code: {type: string, description: problem code of the refusal}
        attempts: {type: integer, minimum: 1}
        actor: {type: string, description: the resolving user; absent on recorded}
        version: {type: integer}
    CreditCheckData:
      type: object
      required: [customer_id, order_id, rules, outcome, point]
      properties:
        customer_id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        point: {type: string, enum: [entry, confirm, release], description: the credit_check_points value the check ran at}
        rules:
          type: array
          items:
            type: object
            required: [id, result]
            properties:
              id: {type: string, enum: [CR-1, CR-2, CR-3, CR-4, CR-5, CR-6]}
              result: {type: string, enum: [PASS, WARN, FAIL]}
              value: {type: string}
              threshold: {type: string}
              note: {type: string, description: why a result is not a plain comparison (for example an order currency without an FX rate)}
        outcome: {type: string, enum: [PASS, WARN, FAIL]}
