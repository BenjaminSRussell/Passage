{{- with ((.Values.global | default dict).workloadIdentity | default dict).fieldcryptClientId }}
# AKS workload identity (#599): the fieldcrypt identity's client id, federated to this account by deploy/tofu/cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: passage-sales
  annotations:
    azure.workload.identity/client-id: {{ . | quote }}
{{- end }}
