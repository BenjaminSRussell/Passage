apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sales
  labels:
    app.kubernetes.io/name: {{ .Values.serviceName }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.serviceName }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.serviceName }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- if .Values.fieldCrypt.keysSecret }}
        fsGroup: 65532
        {{- end }}
      {{- if .Values.fieldCrypt.keysSecret }}
      volumes:
        - name: field-crypt
          secret:
            secretName: {{ .Values.fieldCrypt.keysSecret }}
            defaultMode: 0440
      {{- end }}
      containers:
        - name: sales
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          env:
            - name: PASSAGE_ENV
              value: {{ .Values.config.passageEnv | quote }}
            - name: SERVICE_NAME
              value: {{ .Values.serviceName | quote }}
            - name: HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: ADMIN_ADDR
              value: {{ .Values.config.adminAddr | quote }}
            - name: MIGRATE_ON_START
              value: {{ .Values.config.migrateOnStart | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret.name }}
                  key: {{ .Values.databaseSecret.key }}
            - name: PASSAGE_SERVICE_NAME
              value: sales
{{- if .Values.serviceIdentity.publicKeys }}
            - name: PASSAGE_SERVICE_PUBLIC_KEYS
              value: {{ .Values.serviceIdentity.publicKeys | quote }}
{{- end }}
{{- if .Values.serviceIdentity.signingKeySecret }}
            - name: PASSAGE_SERVICE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serviceIdentity.signingKeySecret | quote }}
                  key: signing-key
{{- if .Values.serviceIdentity.keyId }}
            - name: PASSAGE_SERVICE_KEY_ID
              value: {{ .Values.serviceIdentity.keyId | quote }}
{{- end }}
{{- end }}
            - name: PRODUCT_URL
              value: {{ .Values.upstream.productUrl | quote }}
            - name: PRODUCTION_URL
              value: {{ .Values.upstream.productionUrl | quote }}
            - name: BILLING_URL
              value: {{ .Values.upstream.billingUrl | quote }}
            - name: FULFILLMENT_URL
              value: {{ .Values.upstream.fulfillmentUrl | quote }}
            - name: INVENTORY_URL
              value: {{ .Values.upstream.inventoryUrl | quote }}
            - name: RECEIVABLES_URL
              value: {{ .Values.upstream.receivablesUrl | quote }}
            - name: SALES_RETURN_OFFSET_ACCOUNT
              value: {{ .Values.upstream.returnOffsetAccount | quote }}
{{- if .Values.fieldCrypt.keysSecret }}
            - { name: FIELDCRYPT_KEYS_FILE, value: /var/run/passage/field-crypt/keys }
            - { name: FIELDCRYPT_CURRENT_KEY_ID, value: {{ .Values.fieldCrypt.currentKeyId | quote }} }
          volumeMounts:
            - { name: field-crypt, mountPath: /var/run/passage/field-crypt, readOnly: true }
{{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
