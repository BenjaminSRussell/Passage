image:
  repository: ghcr.io/benjaminsrussell/passage-sales
  # Stage and prod pin the digest (cosign-signed) through Argo CD; the tag is for dev.
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 3

serviceName: sales

config:
  passageEnv: dev
  httpAddr: ":8080"
  adminAddr: ":9090"
  migrateOnStart: "false"

# DATABASE_URL is read from this secret (Vault via External Secrets), never inline.
databaseSecret:
  name: passage-sales-db
  key: url

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: false
  interval: 30s

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

serviceIdentity:
  signingKeySecret: ""
  keyId: ""
  # Callers' public keys (name[:kid]=base64 Ed25519 public key, comma separated; not secret).
  # List fulfillment's key so its packing slip reports reach :record-progress (#496,
  # sales.order.record-delivery only) and billing's for invoice reports. List edi's key as edi=<base64 Ed25519 key>
  # too: edi reads sales orders and posts channel intake orders (sales.channel.intake) with it (#35).
  publicKeys: ""

upstream:
  productUrl: "http://product:8080"
  productionUrl: "http://production:8080"
  partyUrl: "http://party:8080"
  billingUrl: "http://billing:8080"
  fulfillmentUrl: "http://fulfillment:8080"
  inventoryUrl: "http://inventory:8080"
  receivablesUrl: "http://receivables:8080"
  returnOffsetAccount: ""

# Field encryption (platform fieldcrypt) for the buyer of a one-time customer
# order: keysSecret is a Secret with a "keys" entry of id=base64(32 bytes)
# lines, mounted as FIELDCRYPT_KEYS_FILE; currentKeyId names the sealing key.
# Unset, one-time orders are refused (503 SLS-0054).
fieldCrypt:
  keysSecret: ""
  currentKeyId: ""
