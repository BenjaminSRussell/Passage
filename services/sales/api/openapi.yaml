  /v1/sales/change-requests:
    get:
      summary: Change requests awaiting approval (status=PENDING, oldest first) or the change history of an order (FR-27.9)
      description: >-
        A change of a CONFIRMED order for a customer whose changes need approval
        is stored here instead of applied when the caller lacks
        sales.order.approve, and so is the cancellation of such an order (kind
        CANCEL). Each item carries the change, the field-level diff
        it would make and the order version it was made against.
      operationId: listChangeRequests
      x-passage-duty: sales.order.read
      parameters:
        - $ref: "#/components/parameters/LegalEntityQuery"
        - {name: status, in: query, schema: {type: string, enum: [PENDING, APPROVED, REJECTED, WITHDRAWN]}}
        - {name: orderId, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: the change requests; PENDING oldest first, otherwise newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ChangeRequest"}}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/sales/change-requests/{id}:
    get:
      summary: Read one change request with its diff and decision
      operationId: getChangeRequest
      x-passage-duty: sales.order.read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: the change request; the ETag is its version, used as If-Match by approve and reject
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChangeRequest"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/sales/change-requests/{id}:approve:
    post:
      summary: Approve a change request and apply it to the order in the same transaction (FR-27.9)
      description: >-
        The order gets its new version through the same path as a direct PATCH
        (diff, re-promise of the changed lines, allocation, credit re-check), as
        the requester's change. orderchange.approved is written with
        order.changed. A request of kind CANCEL cancels the order through the
        same path as a direct :cancel (lines, holds, allocation and agreement
        quantity returned), as the requester's cancellation, with
        order.cancelled before orderchange.approved. The requester cannot
        approve their own request; an order that moved since the request was
        made refuses the approval and the request stays PENDING.
      operationId: approveChangeRequest
      x-passage-duty: sales.order.approve
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangeDecisionRequest"}
      responses:
        "200":
          description: the approved request and the order at its new version
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema:
                type: object
                required: [request, order]
                properties:
                  request: {$ref: "#/components/schemas/ChangeRequest"}
                  order: {$ref: "#/components/schemas/Order"}
        "400": {$ref: "#/components/responses/Problem"}
        "403":
          description: the caller lacks sales.order.approve, or SLS-0045 the caller requested the change, or SLS-0150 the customer names its approvers and the caller is not one
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409":
          description: SLS-0044 the request was already decided; SLS-0046 the order changed since the request was made
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0024 the stored change no longer applies; SLS-0013 allocation quota cannot cover a changed line; SLS-0025 a line of a cancellation is no longer OPEN or RESERVED
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/change-requests/{id}:reject:
    post:
      summary: Reject a change request with a comment; the order stays as it was (FR-27.9)
      operationId: rejectChangeRequest
      x-passage-duty: sales.order.approve
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ChangeDecisionRequest"
                - {type: object, required: [comment]}
      responses:
        "200":
          description: the rejected request; orderchange.rejected is written in the same transaction
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChangeRequest"}
        "400": {$ref: "#/components/responses/Problem"}
        "403":
          description: the caller lacks sales.order.approve, or SLS-0150 the customer names its approvers and the caller is not one
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409":
          description: SLS-0044 the request was already decided
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/change-requests/{id}:withdraw:
    post:
      summary: Withdraw your own pending change request before it is decided (FR-27.9)
      description: >-
        Only the user who requested the change or cancellation can withdraw
        it; an approver rejects it instead. The request ends as WITHDRAWN, the
        order stays as it was and orderchange.withdrawn is written in the same
        transaction. A new request can then be made.
      operationId: withdrawChangeRequest
      x-passage-duty: sales.order.write
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangeDecisionRequest"}
      responses:
        "200":
          description: the withdrawn request
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChangeRequest"}
        "400": {$ref: "#/components/responses/Problem"}
        "403":
          description: the caller lacks sales.order.write, or SLS-0114 the caller did not request the change
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409":
          description: SLS-0044 the request was already decided
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/customers/{customerId}/change-policy:
    parameters:
      - {name: customerId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: legalEntityId, in: query, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read whether a customer's changes to confirmed orders need approval (change_approval_required, off at version 0)
      operationId: getChangePolicy
      x-passage-duty: sales.order.read
      responses:
        "200":
          description: the switch; the ETag is the version, 0 when never saved
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChangePolicy"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    put:
      summary: Set a customer's change approval switch, amount threshold and approver group (If-Match carries the current ETag; first save uses "0")
      description: >-
        approvalRequired is always replaced. A member the body names replaces
        the stored value (null or [] clears it); a member it leaves out keeps
        the stored value, so the plain {"approvalRequired": true} body of older
        clients does not wipe a threshold or group. approvalThreshold and
        thresholdCurrency go together: naming either replaces both. With
        approvalRequired on and a threshold set, a change to a confirmed order
        applies without approval only while the value it moves (the sum of each
        line's absolute net movement), added to what earlier unapproved changes
        of the order moved, stays below the threshold, so a large change cannot
        be split into small ones; a cancellation moves the whole total. An order
        in another currency than thresholdCurrency always needs approval, since
        no rate converts it. A non-empty approverIds (identity user ids) limits
        who may approve or reject the customer's requests (SLS-0150) and who
        may change or cancel its confirmed orders without a request; the
        sales.order.approve duty is still required. An empty group lets anyone
        holding the duty decide, so a policy never leaves requests without an
        approver.
      operationId: putChangePolicy
      x-passage-duty: sales.order.approve
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvalRequired]
              properties:
                approvalRequired: {type: boolean}
                approvalThreshold: {type: [string, "null"], description: "decimal string, greater than 0 and below 10^15, at most 4 places; needs thresholdCurrency; null clears it, absent keeps it"}
                thresholdCurrency: {type: [string, "null"], pattern: "^[A-Z]{3}$", description: "the threshold's currency; null clears it with the threshold, absent keeps it"}
                approverIds: {type: array, maxItems: 20, items: {type: string, format: uuid}, description: "identity user ids, stored in canonical form, de-duplicated and sorted; [] clears the group, absent keeps it"}
      responses:
        "200":
          description: the saved policy; changepolicy.changed is written in the same transaction
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChangePolicy"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/credit-profiles:
    get:
      summary: List credit profiles of one legal entity, or of every legal entity in the caller's scope
      operationId: listCreditProfiles
      x-passage-duty: sales.order.read
