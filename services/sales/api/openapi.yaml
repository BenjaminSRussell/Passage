        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeliveryTermsReplaceRequest"}
      responses:
        "200":
          description: the terms after the change; unchanged terms keep their version
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeliveryTerms"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412":
          description: SLS-0006 the If-Match version is stale
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/product-proposal-rules:
