                cumShipped: {$ref: "#/components/schemas/Money"}
                cumResetDate: {type: string, format: date, description: moving it forward starts a new cumulative period}
      responses:
        "200":
          description: the agreement with its new cumulative shipped quantity
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesAgreement"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0040 the quantity would fall without a later reset date, or the reset date moves back
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/atp:check:
