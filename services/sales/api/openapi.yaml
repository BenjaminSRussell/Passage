          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreditProfile"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/orders/{id}:plan-production:
    post:
      summary: >-
        Create, for every configured line of a CONFIRMED order, the production order built to the
        line's saved configuration (origin SalesOrderLine) and link it to the line. Idempotent per
        line: a line that is linked is reported as it is, and production answers the same order for
        a line it already built, so a retry after a partial failure plans each line once.
        The call to production carries a service token that holds only production.order.create-from-sales.
      operationId: planProduction
      x-passage-duty: sales.order.plan-production
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: the configured lines with their production orders (created is false for a line planned before)
          content:
            application/json:
              schema:
                type: object
                required: [orderId, lines]
                properties:
                  orderId: {type: string, format: uuid}
                  lines:
                    type: array
                    items:
                      type: object
                      required: [lineId, lineNo, configurationId, productionOrderId, created]
                      properties:
                        lineId: {type: string, format: uuid}
                        lineNo: {type: integer}
                        configurationId: {type: string, format: uuid}
                        productionOrderId: {type: string, format: uuid}
                        created: {type: boolean}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {description: SLS-0100 the order does not exist or is in another legal entity, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
        "409": {description: SLS-0051 production already has an order for the line made for another product or configuration, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
        "422": {description: SLS-0049 the order is not CONFIRMED, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
        "502": {description: SLS-0050 production could not plan a line; the lines planned before it are kept, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
        "503": {description: SLS-0050 the production service is not configured, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
  /v1/sales/orders/{id}:cancel:
    post:
      summary: >-
        Cancel an order that has not shipped (BR-27.5). Every OPEN or RESERVED line is cancelled,
        ACTIVE holds are CLEARED, a new version is written and order.cancelled is emitted; a
        CONFIRMED order also emits order.remaindercancelled (status CANCELLED, every cancelled line
        kept at 0) so fulfillment cuts what it released. An order with a picked, delivered or
        invoiced line is refused (SLS-0025).
      operationId: cancelOrder
      x-passage-duty: sales.order.confirm
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        "200":
          description: the cancelled order at its new version
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "202":
          description: >-
            the customer's changes to confirmed orders need approval (a cancellation
            moves the whole total, on top of what earlier unapproved changes moved)
            and the caller lacks sales.order.approve or is outside the customer's
            named approvers: nothing was cancelled, the order is returned
            unchanged with pendingChange holding the stored request (kind CANCEL)
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409":
          description: SLS-0043 the order already has a change waiting for approval
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/orders/{id}:cancel-remainder:
    post:
      summary: >-
        Close what a partly shipped order has not delivered (BR-27.5). An undelivered OPEN or RESERVED
        line is CANCELLED; a line delivered in part keeps the delivered quantity and is closed at it.
        The net total falls to what was delivered (so the credit exposure does), allocation quota and
        agreement quantity held by the closed quantity are returned and remaining schedule lines are
        cancelled. ACTIVE holds stay until released through the holds API. The order becomes SHIPPED,
        or INVOICED when all that was delivered is invoiced. A new version is written and
        order.remaindercancelled is emitted. A retry with the old If-Match gets 412 and never closes
        twice; a delivery reported afterwards is refused with SLS-0058.
      operationId: cancelOrderRemainder
      x-passage-duty: sales.order.write
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        "200":
          description: the order at its new version, with the closed lines
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412":
          description: SLS-0006 the If-Match version is not the order's current version (also a retry of a close that already happened)
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: SLS-0025 the order is not PARTIALLY_SHIPPED, or a line cannot be closed
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/orders/{id}/lines/{lineNo}:cancel-remainder:
    post:
      summary: >-
        Close what one line of a partly shipped order has not delivered (BR-27.5). A line with nothing
        delivered, still OPEN or RESERVED, is CANCELLED; a line delivered in part keeps the delivered
        quantity and is closed at it. The other lines are not touched. The net total falls by the closed
        value (so the credit exposure does), quota and agreement quantity held by the closed quantity are
        returned and the line's open schedule lines are cancelled. The order status follows its lines
        (SHIPPED or INVOICED once every line is delivered or cancelled). A new version is written and
        order.remaindercancelled is emitted for that one line. ACTIVE holds stay.
      operationId: cancelOrderLineRemainder
      x-passage-duty: sales.order.write
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: lineNo, in: path, required: true, schema: {type: integer, minimum: 1}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        "200":
          description: the order at its new version, with the closed line
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404":
          description: SLS-0100 the order does not exist; SLS-0109 the order has no such line
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "412":
          description: SLS-0006 the If-Match version is not the order's current version
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: SLS-0025 the order is not PARTIALLY_SHIPPED, the line is already delivered in full or cancelled, or the line cannot be closed
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/orders/{id}/versions:
    get:
      summary: An order's change history, newest first, with the field-level diff of each version (FR-27.9)
      operationId: listOrderVersions
      x-passage-duty: sales.order.read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: up to 200 versions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/OrderVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/sales/orders/{id}/lines/{lineNo}:promise:
    post:
      summary: Promise one open line of a confirmed or partly shipped order against ATP buckets and store its schedule lines (FR-27.6, BR-27.1, AC-27.8)
      description: >-
        Places the line quantity against the supplied buckets. The part that can ship by the requested date stays CONFIRMED, supply that
        arrives later becomes BACKORDER lines and quantity no bucket covers an UNPROMISED line. The line's confirmed ship date becomes the
        first dated schedule line (never earlier than the quota period it drew from, BR-27.15), its supplementary lines follow, the order
        gets a new version with the diff, and order.changed and atp.promised are written in the same transaction.
      operationId: promiseOrderLine
      x-passage-duty: sales.order.write
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: lineNo, in: path, required: true, schema: {type: integer, minimum: 1}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periods]
              properties:
                completeOnly: {type: boolean, default: false, description: ship the whole quantity on one date or backorder it in full}
                periods:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: {$ref: "#/components/schemas/AtpPeriod"}
      responses:
        "200":
          description: the order after the promise and the active schedule lines of the order
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema:
                type: object
                required: [order, scheduleLines]
                properties:
                  order: {$ref: "#/components/schemas/Order"}
                  scheduleLines:
                    type: array
                    items: {$ref: "#/components/schemas/ScheduleLine"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404":
          description: SLS-0100 the order does not exist; SLS-0109 the order has no such line
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0037 the order is not CONFIRMED or is a JOURNAL order, the line is past RESERVED or the line is a supplementary line
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/orders/{id}/schedule-lines:
    get:
      summary: The active schedule lines of an order by line and sequence (FR-27.6)
      operationId: listScheduleLines
      x-passage-duty: sales.order.read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: CONFIRMED, BACKORDER and UNPROMISED schedule lines; superseded and cancelled lines are not listed
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ScheduleLine"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/sales/backorders:
    get:
      summary: Backorder list - schedule lines promised after the requested date or not at all, by promised date (FR-27.6, AC-27.8)
      operationId: listBackorders
      x-passage-duty: sales.order.read
      parameters:
        - {name: legalEntityId, in: query, schema: {type: string, format: uuid}}
        - {name: productId, in: query, schema: {type: string, format: uuid}}
        - {name: customerId, in: query, schema: {type: string, format: uuid}}
        - {name: promisedTo, in: query, description: only lines promised on or before this date (undated lines are always listed), schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: backorder lines of CONFIRMED and PARTIALLY_SHIPPED orders (lines not yet wholly delivered), earliest promised date first, undated lines last
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/BackorderItem"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/sales/schedule-releases:check:
    post:
      summary: Stateless reconciliation of a scheduling-agreement release; a cumulative mismatch holds the release (BR-27.12, FR-27.20)
      operationId: checkScheduleRelease
      x-passage-duty: sales.agreement.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cumReceived, cumShipped, buckets]
              properties:
                cumReceived: {$ref: "#/components/schemas/Money"}
                cumShipped: {$ref: "#/components/schemas/Money"}
                tolerance: {$ref: "#/components/schemas/Money"}
                buckets:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [date, cumRequired]
                    properties:
                      date: {type: string, format: date}
                      cumRequired: {$ref: "#/components/schemas/Money"}
      responses:
        "200":
          description: reconciliation; held=true means CUM_QTY_MISMATCH (SLS-0014) and no schedule lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  held: {type: boolean}
                  code: {type: string, example: CUM_QTY_MISMATCH}
                  serviceCode: {type: string, example: SLS-0014}
                  difference: {$ref: "#/components/schemas/Money"}
                  openQuantity: {$ref: "#/components/schemas/Money"}
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        date: {type: string, format: date}
                        quantity: {$ref: "#/components/schemas/Money"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sales/backorder-runs:preview:
    post:
      summary: Preview a backorder processing run for one product and site; nothing is committed (BR-27.11, FR-27.17)
      operationId: previewBackorderRun
      x-passage-duty: sales.backorder.run
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BackorderPreviewRequest"}
      responses:
        "200":
          description: allocation per line in processing order; warningCode SLS-0015 when lines would be deconfirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  preview: {type: boolean, enum: [true]}
                  strategy: {type: string}
                  allocated: {$ref: "#/components/schemas/Money"}
                  deconfirmedCount: {type: integer}
                  warning: {type: string}
                  warningCode: {type: string, example: SLS-0015}
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        before: {$ref: "#/components/schemas/Money"}
                        after: {$ref: "#/components/schemas/Money"}
                        changed: {type: boolean}
                        deconfirmed: {type: boolean}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sales/backorder-runs:
    get:
      summary: Stored backorder runs in the caller's scope, newest first, without their lines (Backorder run results)
      operationId: listBackorderRuns
      x-passage-duty: sales.order.read
      parameters:
        - $ref: "#/components/parameters/LegalEntityQuery"
        - {name: productId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [PREVIEW, COMMITTED]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/BackorderRun"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: >-
        Plan a backorder processing run over the open lines of one product at a site and warehouse, read from
        the CONFIRMED and PARTIALLY_SHIPPED orders, and store it as a PREVIEW; no order changes until it is committed (FR-27.17, BR-27.11)
      operationId: createBackorderRun
      x-passage-duty: sales.backorder.run
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BackorderRunRequest"}
      responses:
        "200":
          description: the stored run of an earlier request with the same Idempotency-Key and body
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackorderRun"}
        "201":
          description: the PREVIEW run with its lines in processing order; warningCode SLS-0015 when lines would be deconfirmed
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackorderRun"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0027 no open line, more than 10000 lines, or a WIN, GAIN or LOSE run that cannot keep a protected confirmation; or the Idempotency-Key was used with another body
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /v1/sales/backorder-runs/{id}:
    get:
      summary: One stored backorder run with its lines in processing order
      operationId: getBackorderRun
      x-passage-duty: sales.order.read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: the run
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackorderRun"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/sales/backorder-runs/{id}:commit:
    post:
      summary: >-
        Commit a PREVIEW run at its ETag: in one transaction, serialised per product, site and warehouse, rewrite the
        schedule lines of every changed line, move confirmed dates, version each order and emit order.changed,
        atp.promised per changed line and backorderrun.committed
      operationId: commitBackorderRun
      x-passage-duty: sales.backorder.run
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: the COMMITTED run
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackorderRun"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409":
          description: >-
            SLS-0041 the run was already committed (also for a retry at the old ETag), or SLS-0042 an order changed since the
            preview or another open line of the product, site and warehouse holds another promised quantity, and nothing was applied
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/quotations:
    get:
      summary: Quotations in the caller's scope, newest first, without lines (Quotations pipeline)
      operationId: listQuotations
      x-passage-duty: sales.order.read
      parameters:
        - $ref: "#/components/parameters/LegalEntityQuery"
        - {name: customerId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [DRAFT, SENT, CONVERTED, LOST, EXPIRED, CANCELLED]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: quotations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Quotation"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Create a DRAFT quotation numbered SQ- (FR-27.1); validity defaults to +30 days and probability to 50
      operationId: createQuotation
      x-passage-duty: sales.quotation.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateQuotationRequest"}
      responses:
        "201":
          description: created; ETag carries the version
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quotation"}
        "200":
          description: a repeat of the Idempotency-Key with the same body returns the stored quotation
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quotation"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422":
          description: idempotency_key_reuse - the key was used with a different body
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /v1/sales/quotations/{id}:
    get:
      summary: One quotation with its lines; converted lines name their order
      operationId: getQuotation
      x-passage-duty: sales.order.read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: the quotation
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quotation"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/sales/quotations/{id}:send:
    post:
      summary: Move a DRAFT quotation that is still valid to SENT
      operationId: sendQuotation
      x-passage-duty: sales.quotation.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: sent
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quotation"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0030 not a DRAFT; SLS-0031 the validity has passed
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/quotations/{id}:lose:
    post:
      summary: Mark a DRAFT or SENT quotation LOST with a reason
      operationId: loseQuotation
      x-passage-duty: sales.quotation.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 200}
      responses:
        "200":
          description: lost
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quotation"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0030 the quotation is converted, lost or expired
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/quotations/{id}:convert:
    post:
      summary: >-
        Convert the selected open lines (every open line when lineNos is empty or the body absent)
        into one DRAFT order at the quoted prices (FR-27.1, AC-27.6); emits quotation.converted
      operationId: convertQuotation
      x-passage-duty: sales.quotation.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConvertQuotationRequest"}
      responses:
        "201":
          description: the quotation (CONVERTED) and the DRAFT order; ETag carries the quotation version
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuotationConversion"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: >-
            SLS-0030 not SENT or CONVERTED; SLS-0031 the validity has passed; SLS-0032 a line is not open;
            SLS-0011 a line is not listed for the customer
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/quotations:expire:
    post:
      summary: Expire lapsed quotations - every DRAFT or SENT quotation past its validity becomes EXPIRED, up to 500 per run (FR-27.1)
      description: >-
        The run the hourly quotation-expiry job calls. It is state-based, so repeating it is harmless and it
        takes no Idempotency-Key. Each quotation's version is bumped and quotation.expired is written in the
        same transaction. When more is true the batch limit stopped the run; call it again.
      operationId: expireQuotations
      x-passage-duty: sales.quotation.maintain
      parameters:
        - $ref: "#/components/parameters/LegalEntityQuery"
      responses:
        "200":
          description: the quotations expired by this run, possibly none
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExpireResult"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/sales/summary:
    get:
      summary: Sales workspace tiles (active holds, backorder lines, quotations expiring) and the quotation pipeline KPIs
      description: >-
        The tiles and the conversion rate ignore the pipeline filters (status, minProbabilityPct,
        expiringWithinDays), which narrow the pipeline only. Days are UTC calendar days.
      operationId: getSalesSummary
      x-passage-duty: sales.order.read
      parameters:
        - $ref: "#/components/parameters/LegalEntityQuery"
        - {name: windowDays, in: query, description: Days over which the conversion rate is measured, schema: {type: integer, minimum: 1, maximum: 365, default: 90}}
        - {name: status, in: query, description: Pipeline filter - only DRAFT or only SENT quotations (default both), schema: {type: string, enum: [DRAFT, SENT]}}
        - {name: minProbabilityPct, in: query, description: Pipeline filter - only quotations whose win probability is at least this, schema: {type: integer, minimum: 0, maximum: 100, default: 0}}
        - {name: expiringWithinDays, in: query, description: Pipeline filter - only quotations whose last valid day is today or within the next N-1 days (default any validity), schema: {type: integer, minimum: 1, maximum: 365}}
      responses:
        "200":
          description: the counts and pipeline of the caller's legal entities
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesSummary"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/sales/holds:
    get:
