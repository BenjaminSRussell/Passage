openapi: 3.1.0
info:
  title: Passage Sales
  version: 1.0.0
  description: >-
    Sales orders, ATP promise checks, credit profiles and order holds, change
    management, listings, agreements, quotations, the hold release queue and
    supplementary item rules and product proposals (wave 27, slices 1 to 7). Every operation carries x-passage-duty. Errors are RFC 9457
    application/problem+json with a stable code listed in the service README.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /readyz:
    get:
      summary: Readiness (Postgres reachable within 500 ms)
      operationId: ready
      x-passage-duty: none
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ready]}
        "503":
          $ref: "#/components/responses/Problem"
  /v1/sales/orders:
    get:
      summary: List orders, newest first (Sales orders list; hold=CREDIT is the credit release queue)
      operationId: listOrders
      x-passage-duty: sales.order.read
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [DRAFT, OPEN, CONFIRMED, PARTIALLY_SHIPPED, SHIPPED, INVOICED, CLOSED, CANCELLED]}}
        - {name: customerId, in: query, schema: {type: string, format: uuid}}
        - {name: hold, in: query, description: only orders with an ACTIVE hold of this type, schema: {type: string, enum: [CREDIT, FRAUD, MANUAL, PRICE_REVIEW]}}
        - {name: cursor, in: query, description: nextCursor of the previous page, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: one page of orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/OrderSummary"}
                  nextCursor: {type: string, format: uuid}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Create an order (UI or channel intake)
      description: >-
        MANDATORY supplementary item rules of the legal entity (FR-27.14) add
        their lines at commit, numbered after the ordered lines, each naming
        its parent line in supplementaryOf and inheriting the parent's site,
        warehouse and requested date (BR-27.14). The response lists each added
        line as an SLS-0012 warning. OPTIONAL rules are offered by
        POST /v1/sales/supplementary-items:evaluate and never added.
      operationId: createOrder
      x-passage-duty: sales.order.write | sales.channel.intake
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: created; ETag carries the version
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "200":
          description: idempotent replay or (channel, externalRef) duplicate with the same body; returns the original order
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sales/orders/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read an order with lines and holds
      operationId: getOrder
      x-passage-duty: sales.order.read
      responses:
        "200":
          description: the order
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      summary: Change an order's header or lines; creates a new version with a field-level diff and re-prices changed lines (FR-27.9)
      description: >-
        A supplementary line follows its parent (BR-27.14): changing its own
        quantity or requested date is refused (422 SLS-0024); a change of the
        parent's quantity recomputes it, cancels it when the parent drops below
        the rule's base quantity, and a change of the parent's dates moves it
        with the parent. Those follow-on changes are part of the version's diff.
        On a CONFIRMED order, a line whose quantity or requested date changes,
        or that is cancelled or reopened with its parent, returns its allocation
        quota draw and draws again (BR-27.15); a line moved to a later period
        gets an SLS-0013 entry in warnings and the moved date in the diff, and a
        line no period can cover refuses the change with 422 SLS-0013.
      operationId: changeOrder
      x-passage-duty: sales.order.write
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangeOrderRequest"}
      responses:
        "200":
          description: the order at its new version; a no-op returns the current version unchanged
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0023 the order cannot be changed; SLS-0024 the change is invalid; SLS-0013 allocation quota cannot cover a changed line in any period
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/orders/{id}:confirm:
    post:
      summary: Confirm an order (runs the credit check; a failing check places a CREDIT hold)
      operationId: confirmOrder
      x-passage-duty: sales.order.confirm
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: >-
            outcome; confirmed=false means the credit check failed and a CREDIT hold is now ACTIVE (creditCheck lists every rule).
            A line moved to a later period because its allocation quota was used up has an SLS-0013 entry in order.warnings (FR-27.16).
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfirmResult"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0019 the order is not DRAFT or OPEN; SLS-0005 an ACTIVE CREDIT hold blocks confirmation; SLS-0021 an ACTIVE FRAUD hold blocks it; SLS-0013 allocation is exhausted for a line in every later period
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/orders/{id}/holds/{holdId}:release:
    post:
      summary: >-
        Release an ACTIVE hold. CREDIT holds need sales.credit.release, other types
        sales.order.hold; the user who applied the hold may not release it. Releasing
        the CREDIT hold of an unconfirmed order confirms it when no other hold blocks
        confirmation (confirmed=true). When allocation quota cannot cover a line of
        that confirmation, the hold is still released, the order stays unconfirmed
        (confirmed=false) and order.warnings carries the SLS-0013 refusal.
      operationId: releaseHold
      x-passage-duty: sales.credit.release | sales.order.hold
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: holdId, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: the order after release, and whether the release confirmed it
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfirmResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0022 the hold is not ACTIVE
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/orders/{id}/holds:
    post:
      summary: >-
        Apply a MANUAL, FRAUD or PRICE_REVIEW hold (FR-27.8). CREDIT holds come only
        from the credit check. A FRAUD hold blocks confirmation (BR-27.4). If-Match
        carries the order ETag, so a retried request cannot apply the hold twice.
      operationId: applyOrderHold
      x-passage-duty: sales.order.hold
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApplyHoldRequest"}
      responses:
        "201":
          description: the order at its new version with the hold listed as ACTIVE
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0028 the order is shipped, closed or cancelled, or already has an ACTIVE hold of this type
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/product-listings:
    get:
      summary: Listing inquiry - ALLOW and DENY entries in the caller's scope, newest first (BR-27.13)
      operationId: listProductListings
      x-passage-duty: sales.order.read
      parameters:
        - $ref: "#/components/parameters/LegalEntityQuery"
        - {name: productId, in: query, schema: {type: string, format: uuid}}
        - {name: scopeKey, in: query, description: customer UUID or group code, schema: {type: string, maxLength: 80}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: listing entries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ProductListing"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Add an ALLOW or DENY entry for a product per customer or customer group, with optional validity (FR-27.15)
      operationId: createProductListing
      x-passage-duty: sales.listing.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductListingRequest"}
      responses:
        "201":
          description: the stored entry
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductListing"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/sales/product-listings/{id}:
    delete:
      summary: Remove a listing entry; orders already taken keep their logged overrides
      operationId: deleteProductListing
      x-passage-duty: sales.listing.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: removed}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/sales/agreements:
    get:
      summary: Sales agreements in the caller's scope, newest first, with commitment, released and remaining quantity
      operationId: listSalesAgreements
      x-passage-duty: sales.order.read
      parameters:
        - $ref: "#/components/parameters/LegalEntityQuery"
        - {name: customerId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [ACTIVE, EXHAUSTED]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: agreements
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/SalesAgreement"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Create an ACTIVE quantity commitment for one product of a customer at an agreed price, numbered SA- (FR-27.10)
      operationId: createSalesAgreement
      x-passage-duty: sales.agreement.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SalesAgreementRequest"}
      responses:
        "201":
          description: the new agreement
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesAgreement"}
        "200":
          description: a repeat of the Idempotency-Key with the same body returns the stored agreement
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesAgreement"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422":
          description: idempotency_key_reuse - the key was used with a different body
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /v1/sales/agreements/{id}:
    get:
      summary: One agreement with its remaining commitment and release history, newest first
      operationId: getSalesAgreement
      x-passage-duty: sales.order.read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: the agreement
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesAgreement"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/sales/agreements/{id}:release-order:
    post:
      summary: >-
        Draw quantity against the commitment and create a DRAFT order of one line at the
        agreement price (channel AGREEMENT), atomically under the agreement's row lock
        (FR-27.10, BR-27.9). The order passes the product listing check.
      operationId: releaseAgreementOrder
      x-passage-duty: sales.agreement.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AgreementReleaseRequest"}
      responses:
        "201":
          description: the release was applied; the agreement after it and the order it created
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgreementReleaseResult"}
        "200":
          description: a repeat of the Idempotency-Key with the same body returns the stored result
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgreementReleaseResult"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422":
          description: >-
            SLS-0008 AGREEMENT_EXHAUSTED (AC-27.9), SLS-0029 outside the validity period,
            SLS-0011 PRODUCT_NOT_LISTED, or idempotency_key_reuse
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /v1/sales/agreements/{id}/schedule-releases:
    get:
      summary: Scheduling releases stored against an agreement, newest first, without schedule lines (FR-27.20)
      operationId: listAgreementScheduleReleases
      x-passage-duty: sales.order.read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: the releases with status, cumulative quantities, open quantity and requirement buckets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ScheduleRelease"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    post:
      summary: >-
        Store a forecast or JIT release against an agreement and reconcile its cumulative received
        quantity with the shipped quantity (FR-27.20, BR-27.12). Within the tolerance it is ACCEPTED and
        replaces the previous release's open schedule lines atomically; beyond it, it is stored HELD
        with CUM_QTY_MISMATCH (SLS-0014) and no schedule line changes (AC-27.13).
      operationId: createAgreementScheduleRelease
      x-passage-duty: sales.agreement.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScheduleReleaseRequest"}
      responses:
        "201":
          description: the release was stored, ACCEPTED or HELD
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleRelease"}
        "200":
          description: a repeat of the Idempotency-Key with the same body returns the stored release
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleRelease"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409":
          description: SLS-0038 the release number was already received for the agreement, or a concurrent request stored this release first
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: SLS-0026 negative, unordered or decreasing buckets, SLS-0029 the agreement is not valid on the receipt date, or idempotency_key_reuse
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /v1/sales/agreements/{id}/schedule-releases/{releaseId}:
    get:
      summary: One scheduling release with its schedule lines, open and superseded
      operationId: getAgreementScheduleRelease
      x-passage-duty: sales.order.read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: releaseId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: the release
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleRelease"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/sales/agreements/{id}/schedule-releases/{releaseId}:resolve:
    post:
      summary: >-
        Decide a HELD release at its ETag. ACCEPT overrides the cumulative mismatch and replaces the
        open schedule lines, with open quantity against the agreement's current shipped quantity;
        REJECT closes it and changes nothing. Emits schedulerelease.resolved.
      operationId: resolveAgreementScheduleRelease
      x-passage-duty: sales.agreement.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: releaseId, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: {type: string, enum: [ACCEPT, REJECT]}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        "200":
          description: the release after the decision
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleRelease"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0039 the release is not HELD, or a newer release is already in effect, or SLS-0026 invalid buckets
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/agreements/{id}:record-shipped:
    post:
      summary: >-
        Set the agreement's cumulative shipped quantity at its ETag (until wave 28 shipments drive it)
        and recalculate the open schedule lines of the release in effect (cumulative required less
        shipped). The quantity may fall only when the reset date moves forward; the closed period's
        shipped quantity then moves into the shippedOffset of the ACCEPTED and HELD releases.
      operationId: recordAgreementShipped
      x-passage-duty: sales.agreement.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cumShipped]
              properties:
                cumShipped: {$ref: "#/components/schemas/Money"}
                cumResetDate: {type: string, format: date, description: moving it forward starts a new cumulative period}
      responses:
        "200":
          description: the agreement with its new cumulative shipped quantity
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesAgreement"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0040 the quantity would fall without a later reset date, or the reset date moves back
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/atp:check:
    post:
      summary: Stateless ATP promise check over caller-supplied buckets (BR-27.1)
      operationId: atpCheck
      x-passage-duty: sales.order.read
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AtpCheckRequest"}
      responses:
        "200":
          description: promise, echoed buckets and cumulative ATP
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AtpCheckResponse"}
        "400": {$ref: "#/components/responses/Problem"}
  /v1/sales/parameters:
    parameters:
      - {name: legalEntityId, in: query, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read the sales parameters of a legal entity (the defaults, at version 0, when none were saved)
      operationId: getSalesParameters
      x-passage-duty: sales.order.read
      responses:
        "200":
          description: the parameters; the ETag is the version, 0 when the legal entity never saved them
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesParameters"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    put:
      summary: Replace the sales parameters (If-Match carries the current ETag; first save uses "0")
      operationId: putSalesParameters
      x-passage-duty: sales.parameter.maintain
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SalesParametersRequest"}
      responses:
        "200":
          description: saved parameters; parameters.changed is written in the same transaction
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesParameters"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/credit-profiles:
    get:
      summary: List credit profiles of one legal entity, or of every legal entity in the caller's scope
      operationId: listCreditProfiles
      x-passage-duty: sales.order.read
      parameters:
        - {name: legalEntityId, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: profiles ordered by legal entity and customer
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/CreditProfile"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/sales/credit-profiles/{customerId}:
    parameters:
      - {name: customerId, in: path, required: true, schema: {type: string, format: uuid}}
      - $ref: "#/components/parameters/LegalEntityQuery"
    get:
      summary: Read the customer's credit profile in one legal entity
      operationId: getCreditProfile
      x-passage-duty: sales.order.read
      responses:
        "200":
          description: the profile
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreditProfile"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    put:
      summary: Replace the credit profile (If-Match carries the current ETag; a new profile uses "0")
      operationId: putCreditProfile
      x-passage-duty: sales.credit.maintain
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreditProfileRequest"}
      responses:
        "200":
          description: saved profile
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreditProfile"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/orders/{id}:cancel:
    post:
      summary: >-
        Cancel an order that has not shipped (BR-27.5). Every OPEN or RESERVED line is cancelled,
        ACTIVE holds are CLEARED, a new version is written and order.cancelled is emitted. An order
        with a picked, delivered or invoiced line is refused (SLS-0025).
      operationId: cancelOrder
      x-passage-duty: sales.order.confirm
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        "200":
          description: the cancelled order at its new version
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/orders/{id}/versions:
    get:
      summary: An order's change history, newest first, with the field-level diff of each version (FR-27.9)
      operationId: listOrderVersions
      x-passage-duty: sales.order.read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: up to 200 versions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/OrderVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/sales/orders/{id}/lines/{lineNo}:promise:
    post:
      summary: Promise one line of a confirmed order against ATP buckets and store its schedule lines (FR-27.6, BR-27.1, AC-27.8)
      description: >-
        Places the line quantity against the supplied buckets. The part that can ship by the requested date stays CONFIRMED, supply that
        arrives later becomes BACKORDER lines and quantity no bucket covers an UNPROMISED line. The line's confirmed ship date becomes the
        first dated schedule line (never earlier than the quota period it drew from, BR-27.15), its supplementary lines follow, the order
        gets a new version with the diff, and order.changed and atp.promised are written in the same transaction.
      operationId: promiseOrderLine
      x-passage-duty: sales.order.write
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: lineNo, in: path, required: true, schema: {type: integer, minimum: 1}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periods]
              properties:
                completeOnly: {type: boolean, default: false, description: ship the whole quantity on one date or backorder it in full}
                periods:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: {$ref: "#/components/schemas/AtpPeriod"}
      responses:
        "200":
          description: the order after the promise and the active schedule lines of the order
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema:
                type: object
                required: [order, scheduleLines]
                properties:
                  order: {$ref: "#/components/schemas/Order"}
                  scheduleLines:
                    type: array
                    items: {$ref: "#/components/schemas/ScheduleLine"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404":
          description: SLS-0100 the order does not exist; SLS-0109 the order has no such line
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0037 the order is not CONFIRMED or is a JOURNAL order, the line is past RESERVED or the line is a supplementary line
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/orders/{id}/schedule-lines:
    get:
      summary: The active schedule lines of an order by line and sequence (FR-27.6)
      operationId: listScheduleLines
      x-passage-duty: sales.order.read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: CONFIRMED, BACKORDER and UNPROMISED schedule lines; superseded and cancelled lines are not listed
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ScheduleLine"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/sales/backorders:
    get:
      summary: Backorder list - schedule lines promised after the requested date or not at all, by promised date (FR-27.6, AC-27.8)
      operationId: listBackorders
      x-passage-duty: sales.order.read
      parameters:
        - {name: legalEntityId, in: query, schema: {type: string, format: uuid}}
        - {name: productId, in: query, schema: {type: string, format: uuid}}
        - {name: customerId, in: query, schema: {type: string, format: uuid}}
        - {name: promisedTo, in: query, description: only lines promised on or before this date (undated lines are always listed), schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: backorder lines of CONFIRMED orders, earliest promised date first, undated lines last
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/BackorderItem"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/sales/schedule-releases:check:
    post:
      summary: Stateless reconciliation of a scheduling-agreement release; a cumulative mismatch holds the release (BR-27.12, FR-27.20)
      operationId: checkScheduleRelease
      x-passage-duty: sales.agreement.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cumReceived, cumShipped, buckets]
              properties:
                cumReceived: {$ref: "#/components/schemas/Money"}
                cumShipped: {$ref: "#/components/schemas/Money"}
                tolerance: {$ref: "#/components/schemas/Money"}
                buckets:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [date, cumRequired]
                    properties:
                      date: {type: string, format: date}
                      cumRequired: {$ref: "#/components/schemas/Money"}
      responses:
        "200":
          description: reconciliation; held=true means CUM_QTY_MISMATCH (SLS-0014) and no schedule lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  held: {type: boolean}
                  code: {type: string, example: CUM_QTY_MISMATCH}
                  serviceCode: {type: string, example: SLS-0014}
                  difference: {$ref: "#/components/schemas/Money"}
                  openQuantity: {$ref: "#/components/schemas/Money"}
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        date: {type: string, format: date}
                        quantity: {$ref: "#/components/schemas/Money"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sales/backorder-runs:preview:
    post:
      summary: Preview a backorder processing run for one product and site; nothing is committed (BR-27.11, FR-27.17)
      operationId: previewBackorderRun
      x-passage-duty: sales.backorder.run
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BackorderPreviewRequest"}
      responses:
        "200":
          description: allocation per line in processing order; warningCode SLS-0015 when lines would be deconfirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  preview: {type: boolean, enum: [true]}
                  strategy: {type: string}
                  allocated: {$ref: "#/components/schemas/Money"}
                  deconfirmedCount: {type: integer}
                  warning: {type: string}
                  warningCode: {type: string, example: SLS-0015}
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        before: {$ref: "#/components/schemas/Money"}
                        after: {$ref: "#/components/schemas/Money"}
                        changed: {type: boolean}
                        deconfirmed: {type: boolean}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sales/backorder-runs:
    get:
      summary: Stored backorder runs in the caller's scope, newest first, without their lines (Backorder run results)
      operationId: listBackorderRuns
      x-passage-duty: sales.order.read
      parameters:
        - $ref: "#/components/parameters/LegalEntityQuery"
        - {name: productId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [PREVIEW, COMMITTED]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/BackorderRun"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: >-
        Plan a backorder processing run over the open lines of one product at a site and warehouse, read from
        the CONFIRMED orders, and store it as a PREVIEW; no order changes until it is committed (FR-27.17, BR-27.11)
      operationId: createBackorderRun
      x-passage-duty: sales.backorder.run
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BackorderRunRequest"}
      responses:
        "200":
          description: the stored run of an earlier request with the same Idempotency-Key and body
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackorderRun"}
        "201":
          description: the PREVIEW run with its lines in processing order; warningCode SLS-0015 when lines would be deconfirmed
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackorderRun"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0027 no open line, more than 10000 lines, or a WIN, GAIN or LOSE run that cannot keep a protected confirmation; or the Idempotency-Key was used with another body
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /v1/sales/backorder-runs/{id}:
    get:
      summary: One stored backorder run with its lines in processing order
      operationId: getBackorderRun
      x-passage-duty: sales.order.read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: the run
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackorderRun"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/sales/backorder-runs/{id}:commit:
    post:
      summary: >-
        Commit a PREVIEW run at its ETag: in one transaction, serialised per product, site and warehouse, rewrite the
        schedule lines of every changed line, move confirmed dates, version each order and emit order.changed,
        atp.promised per changed line and backorderrun.committed
      operationId: commitBackorderRun
      x-passage-duty: sales.backorder.run
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: the COMMITTED run
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackorderRun"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409":
          description: >-
            SLS-0041 the run was already committed (also for a retry at the old ETag), or SLS-0042 an order changed since the
            preview or another open line of the product, site and warehouse holds another promised quantity, and nothing was applied
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/quotations:
    get:
      summary: Quotations in the caller's scope, newest first, without lines (Quotations pipeline)
      operationId: listQuotations
      x-passage-duty: sales.order.read
      parameters:
        - $ref: "#/components/parameters/LegalEntityQuery"
        - {name: customerId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [DRAFT, SENT, CONVERTED, LOST, EXPIRED, CANCELLED]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: quotations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Quotation"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Create a DRAFT quotation numbered SQ- (FR-27.1); validity defaults to +30 days and probability to 50
      operationId: createQuotation
      x-passage-duty: sales.quotation.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateQuotationRequest"}
      responses:
        "201":
          description: created; ETag carries the version
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quotation"}
        "200":
          description: a repeat of the Idempotency-Key with the same body returns the stored quotation
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quotation"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422":
          description: idempotency_key_reuse - the key was used with a different body
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /v1/sales/quotations/{id}:
    get:
      summary: One quotation with its lines; converted lines name their order
      operationId: getQuotation
      x-passage-duty: sales.order.read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: the quotation
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quotation"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/sales/quotations/{id}:send:
    post:
      summary: Move a DRAFT quotation that is still valid to SENT
      operationId: sendQuotation
      x-passage-duty: sales.quotation.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: sent
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quotation"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0030 not a DRAFT; SLS-0031 the validity has passed
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/quotations/{id}:lose:
    post:
      summary: Mark a DRAFT or SENT quotation LOST with a reason
      operationId: loseQuotation
      x-passage-duty: sales.quotation.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 200}
      responses:
        "200":
          description: lost
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quotation"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: SLS-0030 the quotation is converted, lost or expired
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/quotations/{id}:convert:
    post:
      summary: >-
        Convert the selected open lines (every open line when lineNos is empty or the body absent)
        into one DRAFT order at the quoted prices (FR-27.1, AC-27.6); emits quotation.converted
      operationId: convertQuotation
      x-passage-duty: sales.quotation.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConvertQuotationRequest"}
      responses:
        "201":
          description: the quotation (CONVERTED) and the DRAFT order; ETag carries the quotation version
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuotationConversion"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422":
          description: >-
            SLS-0030 not SENT or CONVERTED; SLS-0031 the validity has passed; SLS-0032 a line is not open;
            SLS-0011 a line is not listed for the customer
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/quotations:expire:
    post:
      summary: Expire lapsed quotations - every DRAFT or SENT quotation past its validity becomes EXPIRED, up to 500 per run (FR-27.1)
      description: >-
        The run the hourly quotation-expiry job calls. It is state-based, so repeating it is harmless and it
        takes no Idempotency-Key. Each quotation's version is bumped and quotation.expired is written in the
        same transaction. When more is true the batch limit stopped the run; call it again.
      operationId: expireQuotations
      x-passage-duty: sales.quotation.maintain
      parameters:
        - $ref: "#/components/parameters/LegalEntityQuery"
      responses:
        "200":
          description: the quotations expired by this run, possibly none
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExpireResult"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/sales/summary:
    get:
      summary: Sales workspace tiles (active holds, backorder lines, quotations expiring) and the quotation pipeline KPIs
      description: >-
        The tiles and the conversion rate ignore the pipeline filters (status, minProbabilityPct,
        expiringWithinDays), which narrow the pipeline only. Days are UTC calendar days.
      operationId: getSalesSummary
      x-passage-duty: sales.order.read
      parameters:
        - $ref: "#/components/parameters/LegalEntityQuery"
        - {name: windowDays, in: query, description: Days over which the conversion rate is measured, schema: {type: integer, minimum: 1, maximum: 365, default: 90}}
        - {name: status, in: query, description: Pipeline filter - only DRAFT or only SENT quotations (default both), schema: {type: string, enum: [DRAFT, SENT]}}
        - {name: minProbabilityPct, in: query, description: Pipeline filter - only quotations whose win probability is at least this, schema: {type: integer, minimum: 0, maximum: 100, default: 0}}
        - {name: expiringWithinDays, in: query, description: Pipeline filter - only quotations whose last valid day is today or within the next N-1 days (default any validity), schema: {type: integer, minimum: 1, maximum: 365}}
      responses:
        "200":
          description: the counts and pipeline of the caller's legal entities
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesSummary"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/sales/holds:
    get:
      summary: Release queue - ACTIVE holds oldest first with the failed credit rule and the customer's limit (holdType=CREDIT is the credit release queue)
      operationId: listHolds
      x-passage-duty: sales.credit.release | sales.order.hold
      parameters:
        - $ref: "#/components/parameters/LegalEntityQuery"
        - {name: holdType, in: query, schema: {type: string, enum: [CREDIT, FRAUD, MANUAL, PRICE_REVIEW]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: active holds
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/HoldQueueItem"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/sales/supplementary-item-rules:
    get:
      summary: Supplementary item rules in the caller's scope, optionally for one parent product
      operationId: listSupplementaryRules
      x-passage-duty: sales.order.read
      parameters:
        - $ref: "#/components/parameters/LegalEntityQuery"
        - {name: parentProductId, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/SupplementaryRule"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Create a supplementary item rule (FR-27.14); FREE rules carry no price, PRICED rules a positive one
      operationId: createSupplementaryRule
      x-passage-duty: sales.listing.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SupplementaryRuleRequest"}
      responses:
        "201":
          description: the stored rule
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupplementaryRule"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409":
          description: SLS-0033 a rule for this parent, customer (or all customers) and item exists
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /v1/sales/supplementary-item-rules/{id}:
    delete:
      summary: Remove a supplementary item rule
      operationId: deleteSupplementaryRule
      x-passage-duty: sales.listing.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: removed}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/sales/supplementary-items:evaluate:
    post:
      summary: >-
        Stateless - the supplementary lines a parent line of a product and quantity triggers for a customer;
        MANDATORY lines go with the parent, OPTIONAL lines are offered (FR-27.14)
      operationId: evaluateSupplementary
      x-passage-duty: sales.order.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, productId, quantity]
              properties:
                legalEntityId: {type: string, format: uuid}
                productId: {type: string, format: uuid}
                customerId: {type: string, format: uuid}
                quantity: {$ref: "#/components/schemas/Money"}
      responses:
        "200":
          description: supplementary lines, empty when none apply
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/SupplementaryLine"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/sales/allocation-quotas:
    get:
      summary: Allocation quota inquiry per product and period - quota, consumed and remaining (FR-27.16)
      operationId: listAllocationQuotas
      x-passage-duty: sales.order.read
      parameters:
        - $ref: "#/components/parameters/LegalEntityQuery"
        - {name: productId, in: query, schema: {type: string, format: uuid}}
        - {name: customerId, in: query, schema: {type: string, format: uuid}}
        - {name: onDate, in: query, description: keeps quotas whose period contains this day, schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: quotas ordered by product and period, latest period first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/AllocationQuota"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: >-
        Set a product allocation quota for a period, for one customer or every customer (FR-27.16, SAP OVZJ).
        Confirmation of an order consumes it in requested-period order (BR-27.15).
      operationId: createAllocationQuota
      x-passage-duty: sales.allocation.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AllocationQuotaRequest"}
      responses:
        "201":
          description: the stored quota with consumed quantity 0; ETag carries the version
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AllocationQuota"}
        "200":
          description: a repeat of the Idempotency-Key with the same body returns the stored quota
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AllocationQuota"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409":
          description: SLS-0035 a quota for this product and customer already covers part of the period
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: the Idempotency-Key was used with a different request body
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /v1/sales/allocation-quotas/{id}:
    get:
      summary: One allocation quota with its draw history, newest first
      operationId: getAllocationQuota
      x-passage-duty: sales.order.read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: the quota with its consumptions
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AllocationQuota"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      summary: Change a quota quantity under If-Match; below the consumed quantity is refused (BR-27.15)
      operationId: changeAllocationQuota
      x-passage-duty: sales.allocation.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quotaQty]
              properties:
                quotaQty: {type: string, description: new quota quantity as a decimal string, greater than 0, below 10^14, at most 6 places, example: "120"}
      responses:
        "200":
          description: the quota after the change
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AllocationQuota"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409":
          description: SLS-0036 the quantity is below what is consumed
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "412":
          description: SLS-0006 the If-Match version is stale (every draw and return also moves the version)
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/sales/product-proposal-rules:
    get:
      summary: Product proposal rules in the caller's scope with their recorded accept and decline counts (FR-27.21)
      operationId: listProposalRules
      x-passage-duty: sales.order.read
      parameters:
        - $ref: "#/components/parameters/LegalEntityQuery"
        - name: orderedProductId
          in: query
          description: repeatable; at most 50 values; absent means every ordered product
          schema: {type: array, maxItems: 50, items: {type: string, format: uuid}}
          style: form
          explode: true
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: rules in creation order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ProposalRule"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Create a product proposal rule (FR-27.21, SAP VB41 cross-selling)
      operationId: createProposalRule
      x-passage-duty: sales.listing.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProposalRuleRequest"}
      responses:
        "201":
          description: the stored rule
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProposalRule"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409":
          description: SLS-0034 a rule for this ordered product, customer (or all customers) and proposed product exists
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /v1/sales/product-proposal-rules/{id}:
    delete:
      summary: Remove a product proposal rule; its recorded responses are kept
      operationId: deleteProposalRule
      x-passage-duty: sales.listing.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: removed}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/sales/product-proposals:evaluate:
    post:
      summary: >-
        Stateless - the products to propose when products are committed on an order (FR-27.21); a product
        already on the order or being committed is never proposed, and a customer's own rule wins over the
        rule for every customer. Nothing is created unless the user accepts a proposal.
      operationId: evaluateProposals
      x-passage-duty: sales.order.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, productIds]
              properties:
                legalEntityId: {type: string, format: uuid}
                customerId: {type: string, format: uuid}
                productIds: {type: array, minItems: 1, maxItems: 50, items: {type: string, format: uuid}, description: products being committed}
                currentProductIds: {type: array, maxItems: 50, items: {type: string, format: uuid}, description: products already on the order}
      responses:
        "200":
          description: proposals, empty when none apply
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Proposal"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/sales/product-proposals:respond:
    post:
      summary: Record a user's accept or decline of a proposal, the input of the acceptance rate (FR-27.21)
      operationId: respondToProposal
      x-passage-duty: sales.order.write | sales.channel.intake
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, ruleId, accepted]
              properties:
                legalEntityId: {type: string, format: uuid}
                ruleId: {type: string, format: uuid}
                customerId: {type: string, format: uuid}
                orderId: {type: string, format: uuid, description: absent while the order is still being entered}
                accepted: {type: boolean}
      responses:
        "201":
          description: recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProposalResponse"}
        "200":
          description: a replay of the same Idempotency-Key and body; the stored response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProposalResponse"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404":
          description: SLS-0107 the rule does not exist in the legal entity
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: idempotency_key_reuse the key was used with another body
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 255}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag of the version being changed, for example "3".
      schema: {type: string}
    LegalEntityQuery:
      name: legalEntityId
      in: query
      required: false
      description: >-
        The legal entity the profile belongs to. Defaults to the caller's legal entity
        (gateway header X-Passage-Legal-Entity); a caller scoped to one legal entity
        may not name another (403). Required when the caller has no legal entity.
      schema: {type: string, format: uuid}
  headers:
    ETag:
      description: Strong ETag of the versioned resource.
      schema: {type: string}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    ExpiredQuotation:
      type: object
      required: [id, quotationNumber, legalEntityId, customerId, validUntil, previousStatus, version]
      properties:
        id: {type: string, format: uuid}
        quotationNumber: {type: string, example: "SQ-0000001"}
        legalEntityId: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        validUntil: {type: string, format: date}
        previousStatus: {type: string, enum: [DRAFT, SENT]}
        version: {type: integer, description: the quotation version after the expiry}
    ExpireResult:
      type: object
      required: [expired, count, more]
      properties:
        expired:
          type: array
          items: {$ref: "#/components/schemas/ExpiredQuotation"}
        count: {type: integer}
        more: {type: boolean, description: true when the 500-quotation batch limit stopped the run}
    PipelineCurrency:
      type: object
      required: [currency, openCount, openNet, weightedNet]
      properties:
        currency: {type: string, description: ISO 4217 alpha-3; currencies are never added together}
        openCount: {type: integer}
        openNet: {$ref: "#/components/schemas/Money"}
        weightedNet: {allOf: [{$ref: "#/components/schemas/Money"}], description: sum of net total times win probability}
    SalesSummary:
      type: object
      required: [activeHolds, backorderLines, quotationsExpiring, quotationsLapsed, pipeline, windowDays, won, lost, expired]
      properties:
        activeHolds: {type: integer, description: ACTIVE order holds of every type}
        backorderLines: {type: integer, description: BACKORDER and UNPROMISED schedule lines of CONFIRMED orders}
        quotationsExpiring: {type: integer, description: open quotations whose last valid day is today or one of the next 6 days}
        quotationsLapsed: {type: integer, description: open quotations already past their validity that no expiry run has closed}
        pipeline:
          type: array
          description: valid DRAFT and SENT quotations per currency, narrowed by the pipeline filters
          items: {$ref: "#/components/schemas/PipelineCurrency"}
        windowDays: {type: integer}
        won: {type: integer, description: CONVERTED quotations last updated within the window}
        lost: {type: integer, description: LOST quotations last updated within the window}
        expired: {type: integer, description: EXPIRED quotations last updated within the window}
        conversionRatePct:
          type: string
          description: won / (won + lost + expired) in percent at one place; absent when nothing closed in the window
          example: "42.9"
    AllocationQuotaRequest:
      type: object
      required: [legalEntityId, productId, periodStart, periodEnd, quotaQty]
      properties:
        legalEntityId: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        customerId: {type: string, format: uuid, description: absent means every customer of the legal entity}
        periodStart: {type: string, format: date}
        periodEnd: {type: string, format: date, description: inclusive; not before periodStart}
        quotaQty: {type: string, description: decimal string greater than 0 and below 10^14 with at most 6 places, example: "100"}
    AllocationQuota:
      type: object
      required: [id, legalEntityId, productId, periodStart, periodEnd, quotaQty, consumedQty, remainingQty, version, createdBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        periodStart: {type: string, format: date}
        periodEnd: {type: string, format: date}
        quotaQty: {type: string}
        consumedQty: {type: string}
        remainingQty: {type: string}
        version: {type: integer}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        consumptions:
          type: array
          description: draw history, newest first; only on a single read
          items:
            type: object
            required: [id, orderId, lineId, lineNo, quantity, consumedAt]
            properties:
              id: {type: string, format: uuid}
              orderId: {type: string, format: uuid}
              lineId: {type: string, format: uuid}
              lineNo: {type: integer}
              quantity: {type: string}
              consumedAt: {type: string, format: date-time}
              returnedAt: {type: string, format: date-time, description: set when the order or line was cancelled or changed}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri, example: "https://passage.dev/problems/SLS-0005"}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        serviceCode: {type: string, example: SLS-0005}
        traceId: {type: string}
        errors:
          type: object
          additionalProperties: {type: string}
    Money:
      type: string
      description: Decimal string at 6 places (never float).
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    CreateOrderRequest:
      type: object
      required: [legalEntityId, customerId, invoiceAccountId, currency, requestedShipDate, lines]
      properties:
        legalEntityId: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        invoiceAccountId: {type: string, format: uuid}
        orderType: {type: string, enum: [JOURNAL, ORDER, SUBSCRIPTION, RETURNED], description: "omitted: the legal entity's defaultOrderType (ORDER unless set in the sales parameters)"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        requestedShipDate: {type: string, format: date}
        channel: {type: string, pattern: "^[A-Za-z0-9_-]{1,40}$", default: UI}
        externalRef: {type: string, minLength: 1, maxLength: 100}
        customerGroup:
          type: string
          minLength: 1
          maxLength: 80
          description: The customer's group for GROUP listing entries (BR-27.13), until the w7 party lookup supplies it.
        listingOverrideReason:
          type: string
          maxLength: 500
          description: >-
            With duty sales.order.approve, accepts lines the product listing denies (FR-27.15);
            each accepted line is logged in listingOverrides. Without it a denied line is
            422 SLS-0011 PRODUCT_NOT_LISTED.
        lines:
          type: array
          minItems: 1
          maxItems: 2000
          items: {$ref: "#/components/schemas/OrderLineRequest"}
    ApplyHoldRequest:
      type: object
      required: [holdType, reasonCode]
      properties:
        holdType: {type: string, enum: [MANUAL, FRAUD, PRICE_REVIEW]}
        reasonCode: {type: string, minLength: 1, maxLength: 80}
    ListingOverride:
      type: object
      description: A denied line accepted by a user with sales.order.approve (FR-27.15, AC-27.11)
      required: [lineNo, productId, decision, reason, actor]
      properties:
        lineNo: {type: integer}
        productId: {type: string, format: uuid}
        decision: {type: string, enum: [CUSTOMER_DENY, GROUP_DENY, NOT_LISTED]}
        reason: {type: string}
        actor: {type: string}
    ProductListingRequest:
      type: object
      required: [legalEntityId, scopeType, scopeKey, productId, listingType]
      properties:
        legalEntityId: {type: string, format: uuid}
        scopeType: {type: string, enum: [CUSTOMER, GROUP]}
        scopeKey: {type: string, minLength: 1, maxLength: 80, description: customer UUID for CUSTOMER; group code for GROUP}
        productId: {type: string, format: uuid}
        listingType: {type: string, enum: [ALLOW, DENY]}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date}
    ProductListing:
      type: object
      required: [id, legalEntityId, scopeType, scopeKey, productId, listingType, createdBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        scopeType: {type: string, enum: [CUSTOMER, GROUP]}
        scopeKey: {type: string}
        productId: {type: string, format: uuid}
        listingType: {type: string, enum: [ALLOW, DENY]}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
    SalesAgreementRequest:
      type: object
      required: [legalEntityId, customerId, productId, unit, unitPrice, currency, commitmentQty]
      properties:
        legalEntityId: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        invoiceAccountId: {type: string, format: uuid, description: defaults to the customer}
        productId: {type: string, format: uuid}
        unit: {type: string, minLength: 1, maxLength: 10}
        unitPrice: {$ref: "#/components/schemas/Money"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        commitmentQty: {$ref: "#/components/schemas/Money"}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date}
        cumTolerance: {$ref: "#/components/schemas/Money", description: how far a release's cumulative received quantity may differ from the shipped quantity (BR-27.12); default 0}
    SalesAgreement:
      type: object
      required: [id, legalEntityId, agreementNumber, customerId, invoiceAccountId, productId, unit, unitPrice, currency, commitmentQty, releasedQty, remainingQty, status, version]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        agreementNumber: {type: string, example: "SA-0000001", description: unique per legal entity}
        customerId: {type: string, format: uuid}
        invoiceAccountId: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        unit: {type: string}
        unitPrice: {$ref: "#/components/schemas/Money"}
        currency: {type: string}
        commitmentQty: {$ref: "#/components/schemas/Money"}
        releasedQty: {$ref: "#/components/schemas/Money"}
        remainingQty: {$ref: "#/components/schemas/Money"}
        status: {type: string, enum: [ACTIVE, EXHAUSTED]}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date}
        version: {type: integer, minimum: 1}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        cumTolerance: {$ref: "#/components/schemas/Money"}
        cumShipped: {$ref: "#/components/schemas/Money", description: quantity shipped since the cumulative reset date}
        cumResetDate: {type: string, format: date}
        releases:
          type: array
          description: release history, newest first; present on GET /agreements/{id} only
          items: {$ref: "#/components/schemas/AgreementReleaseRecord"}
    ScheduleReleaseRequest:
      type: object
      required: [releaseNo, releaseType, cumReceived, buckets]
      properties:
        releaseNo: {type: string, minLength: 1, maxLength: 40, description: the customer's release number, unique per agreement}
        releaseType: {type: string, enum: [FORECAST, JIT]}
        cumReceived: {$ref: "#/components/schemas/Money", description: the customer's cumulative received quantity}
        buckets:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [date, cumRequired]
            properties:
              date: {type: string, format: date}
              cumRequired: {$ref: "#/components/schemas/Money"}
    ScheduleRelease:
      type: object
      required: [id, agreementId, agreementNumber, releaseNo, releaseType, status, cumReceived, cumShipped, shippedOffset, tolerance, difference, openQuantity, buckets, receivedBy, receivedAt, version]
      properties:
        id: {type: string, format: uuid}
        agreementId: {type: string, format: uuid}
        agreementNumber: {type: string}
        releaseNo: {type: string}
        releaseType: {type: string, enum: [FORECAST, JIT]}
        status: {type: string, enum: [ACCEPTED, HELD, REJECTED, SUPERSEDED]}
        cumReceived: {$ref: "#/components/schemas/Money"}
        cumShipped: {$ref: "#/components/schemas/Money", description: shipped quantity the release was last reconciled or recalculated against, on its own cumulative basis (shippedOffset included)}
        shippedOffset: {$ref: "#/components/schemas/Money", description: shipped quantity of cumulative periods closed by a later reset date that still counts against this release}
        tolerance: {$ref: "#/components/schemas/Money"}
        difference: {$ref: "#/components/schemas/Money", description: cumulative received less shipped}
        openQuantity: {$ref: "#/components/schemas/Money"}
        code: {type: string, example: CUM_QTY_MISMATCH, description: present while the release is HELD}
        serviceCode: {type: string, example: SLS-0014}
        buckets:
          type: array
          items:
            type: object
            required: [date, cumRequired]
            properties:
              date: {type: string, format: date}
              cumRequired: {$ref: "#/components/schemas/Money"}
        lines:
          type: array
          description: schedule lines; present on a single read and after a write
          items:
            type: object
            required: [id, dueDate, quantity, status]
            properties:
              id: {type: string, format: uuid}
              dueDate: {type: string, format: date}
              quantity: {$ref: "#/components/schemas/Money"}
              status: {type: string, enum: [OPEN, SUPERSEDED]}
        receivedBy: {type: string}
        receivedAt: {type: string, format: date-time}
        resolvedBy: {type: string}
        resolvedAt: {type: string, format: date-time}
        resolutionReason: {type: string}
        version: {type: integer, minimum: 1}
    AgreementReleaseRecord:
      type: object
      required: [id, quantity, salesOrderId, orderNumber, actor, releasedAt]
      properties:
        id: {type: string, format: uuid}
        quantity: {$ref: "#/components/schemas/Money"}
        salesOrderId: {type: string, format: uuid}
        orderNumber: {type: string}
        actor: {type: string}
        releasedAt: {type: string, format: date-time}
    AgreementReleaseRequest:
      type: object
      required: [quantity, siteId, warehouseId, requestedShipDate]
      properties:
        quantity: {$ref: "#/components/schemas/Money"}
        siteId: {type: string, format: uuid}
        warehouseId: {type: string, format: uuid}
        requestedShipDate: {type: string, format: date}
    AgreementReleaseResult:
      type: object
      required: [agreement, order]
      properties:
        agreement: {$ref: "#/components/schemas/SalesAgreement"}
        order: {$ref: "#/components/schemas/Order"}
    OrderLineRequest:
      type: object
      required: [productId, quantity, unit, siteId, warehouseId, unitPrice, requestedShipDate]
      properties:
        productId: {type: string, format: uuid}
        quantity: {$ref: "#/components/schemas/Money"}
        unit: {type: string, minLength: 1, maxLength: 10}
        siteId: {type: string, format: uuid}
        warehouseId: {type: string, format: uuid}
        unitPrice: {$ref: "#/components/schemas/Money"}
        discPct: {$ref: "#/components/schemas/Money"}
        requestedShipDate: {type: string, format: date}
    Order:
      type: object
      required: [id, legalEntityId, orderNumber, customerId, invoiceAccountId, orderType, status, currency, version, lines, holds]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        orderNumber: {type: string, example: "SO-0000001", description: unique per legal entity}
        customerId: {type: string, format: uuid}
        invoiceAccountId: {type: string, format: uuid}
        orderType: {type: string, enum: [JOURNAL, ORDER, SUBSCRIPTION, RETURNED]}
        status: {type: string, enum: [DRAFT, OPEN, CONFIRMED, PARTIALLY_SHIPPED, SHIPPED, INVOICED, CLOSED, CANCELLED]}
        currency: {type: string}
        requestedShipDate: {type: string, format: date}
        channel: {type: string}
        externalRef: {type: string}
        customerGroup: {type: string}
        netTotal: {$ref: "#/components/schemas/Money"}
        version: {type: integer, minimum: 0}
        creditCheck: {$ref: "#/components/schemas/CreditEvaluation"}
        lines:
          type: array
          items: {$ref: "#/components/schemas/OrderLine"}
        holds:
          type: array
          items: {$ref: "#/components/schemas/Hold"}
        listingOverrides:
          type: array
          items: {$ref: "#/components/schemas/ListingOverride"}
        warnings:
          type: array
          description: >-
            set only on the result of a create (and its replay), a quotation conversion or an agreement release (SLS-0012),
            and of a confirm, a CREDIT release or a change of a confirmed order that allocation quota affected (SLS-0013)
          items: {$ref: "#/components/schemas/Notice"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Notice:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: SLS-0012}
        message: {type: string, example: "Mandatory supplementary item 6f1c… added (2 EA)"}
        lineNo: {type: integer, description: the order line the warning is about}
    OrderLine:
      type: object
      properties:
        id: {type: string, format: uuid}
        lineNo: {type: integer}
        productId: {type: string, format: uuid}
        quantity: {$ref: "#/components/schemas/Money"}
        unit: {type: string}
        siteId: {type: string, format: uuid}
        warehouseId: {type: string, format: uuid}
        unitPrice: {$ref: "#/components/schemas/Money"}
        discPct: {$ref: "#/components/schemas/Money"}
        lineNet: {$ref: "#/components/schemas/Money"}
        requestedShipDate: {type: string, format: date}
        confirmedShipDate: {type: string, format: date}
        lineStatus: {type: string, enum: [OPEN, RESERVED, PICKED, DELIVERED, INVOICED, CANCELLED]}
        supplementaryOf: {type: string, format: uuid, description: "id of the parent line a MANDATORY supplementary line was added for (FR-27.14); absent on ordinary lines"}
        parentLineNo: {type: integer, description: line number of the parent line; set with supplementaryOf}
        supplementaryRuleId: {type: string, format: uuid, description: the supplementary item rule that added the line}
    Hold:
      type: object
      properties:
        id: {type: string, format: uuid}
        holdType: {type: string, enum: [CREDIT, FRAUD, MANUAL, PRICE_REVIEW]}
        reasonCode: {type: string}
        status: {type: string, enum: [ACTIVE, RELEASED, CLEARED]}
        orderAmount: {$ref: "#/components/schemas/Money"}
        appliedBy: {type: string}
        releasedBy: {type: string}
        releasedUntil: {type: string, format: date-time}
        appliedAt: {type: string, format: date-time}
    AtpPeriod:
      type: object
      required: [date, supply, demand]
      properties:
        date: {type: string, format: date}
        supply: {$ref: "#/components/schemas/Money"}
        demand: {$ref: "#/components/schemas/Money"}
    AtpCheckRequest:
      type: object
      required: [requested, quantity, periods]
      properties:
        requested: {type: string, format: date}
        quantity: {$ref: "#/components/schemas/Money"}
        completeOnly: {type: boolean, default: false}
        periods:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: "#/components/schemas/AtpPeriod"}
    AtpCheckResponse:
      type: object
      properties:
        promise:
          type: object
          properties:
            promisedDate: {type: string, format: date, description: absent when nothing could be placed; never before the requested date}
            complete: {type: boolean}
            backorder: {$ref: "#/components/schemas/Money"}
            source: {type: string, enum: [ATP]}
            schedule:
              type: array
              items:
                type: object
                properties:
                  date: {type: string, format: date}
                  quantity: {$ref: "#/components/schemas/Money"}
                  period: {type: integer}
        periods:
          type: array
          items: {$ref: "#/components/schemas/AtpPeriod"}
        cumulative:
          type: array
          items: {$ref: "#/components/schemas/Money"}
    CreditProfile:
      type: object
      required: [legalEntityId, customerId, limit, currency, limitType, version]
      properties:
        legalEntityId: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        limit: {$ref: "#/components/schemas/Money"}
        currency: {type: string}
        limitType: {type: string, enum: [NONE, BALANCE, BALANCE_PACKING_SLIP, BALANCE_ALL]}
        tolerancePct: {$ref: "#/components/schemas/Money"}
        toleranceAmount: {$ref: "#/components/schemas/Money"}
        oldestItemDaysMax: {type: integer}
        maxDunningLevel: {type: integer, minimum: 0, maximum: 9}
        reviewDate: {type: string, format: date}
        customerSince: {type: string, format: date}
        mandatoryCheck: {type: boolean}
        exposure: {$ref: "#/components/schemas/Exposure"}
        version: {type: integer}
        updatedAt: {type: string, format: date-time}
    SalesParametersRequest:
      type: object
      description: every value is required; the PUT replaces them all. Names are the PRD 5.27.13 parameter names.
      required: [quotationExpiryDays, quotationProbabilityDefault, creditReleaseValidityDays, creditHoldSlaBusinessDays, defaultOrderType]
      properties:
        quotationExpiryDays: {type: integer, minimum: 1, maximum: 365, description: validity in days of a quotation created without validUntil (quotation_expiry_days)}
        quotationProbabilityDefault: {type: integer, minimum: 0, maximum: 100, description: win probability of a quotation created without probabilityPct (quotation_probability_default)}
        creditReleaseValidityDays: {type: integer, minimum: 1, maximum: 30, description: how long a CREDIT release stays valid (credit_release_validity_days, BR-27.4)}
        creditHoldSlaBusinessDays: {type: integer, minimum: 1, maximum: 10, description: "business days (Monday to Friday) a hold may wait for release; the queue reports slaDueAt (credit_hold_sla_business_days, FR-27.8)"}
        defaultOrderType: {type: string, enum: [JOURNAL, ORDER, SUBSCRIPTION], description: order type of an order created without one (default_order_type)}
    SalesParameters:
      allOf:
        - $ref: "#/components/schemas/SalesParametersRequest"
        - type: object
          required: [legalEntityId, version]
          properties:
            legalEntityId: {type: string, format: uuid}
            version: {type: integer, description: 0 when never saved}
            updatedBy: {type: string, description: absent when never saved}
            updatedAt: {type: string, format: date-time, description: absent when never saved}
    CreditProfileRequest:
      type: object
      required: [limit, currency, limitType]
      properties:
        limit: {$ref: "#/components/schemas/Money"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        limitType: {type: string, enum: [NONE, BALANCE, BALANCE_PACKING_SLIP, BALANCE_ALL]}
        tolerancePct: {$ref: "#/components/schemas/Money"}
        toleranceAmount: {$ref: "#/components/schemas/Money"}
        oldestItemDaysMax: {type: integer, minimum: 0}
        maxDunningLevel: {type: integer, minimum: 0, maximum: 9}
        reviewDate: {type: string, format: date}
        customerSince: {type: string, format: date}
        mandatoryCheck: {type: boolean}
        exposure: {$ref: "#/components/schemas/Exposure"}
    Exposure:
      type: object
      description: >-
        The customer's open position in the profile currency, supplied with the profile
        until the receivables projection exists (waves 29/30). Amounts are non-negative;
        unapplied cash lowers the balance.
      properties:
        openAr: {$ref: "#/components/schemas/Money"}
        unapplied: {$ref: "#/components/schemas/Money"}
        deliveredNotInvoiced: {$ref: "#/components/schemas/Money"}
        openOrders: {$ref: "#/components/schemas/Money"}
        overdueAr: {$ref: "#/components/schemas/Money"}
        oldestItemDays: {type: integer, minimum: 0}
        dunningLevel: {type: integer, minimum: 0}
    CreditEvaluation:
      type: object
      description: Every BR-27.3 rule evaluated at the last confirm, with value and threshold.
      properties:
        outcome: {type: string, enum: [PASS, WARN, FAIL]}
        rules:
          type: array
          items:
            type: object
            required: [id, result]
            properties:
              id: {type: string, enum: [CR-1, CR-2, CR-3, CR-4, CR-5, CR-6]}
              result: {type: string, enum: [PASS, WARN, FAIL]}
              value: {type: string}
              threshold: {type: string}
              note: {type: string}
    ConfirmResult:
      allOf:
        - {$ref: "#/components/schemas/Order"}
        - type: object
          required: [confirmed]
          properties:
            confirmed: {type: boolean}
    OrderSummary:
      type: object
      required: [id, legalEntityId, orderNumber, customerId, orderType, status, currency, netTotal, lineCount, activeHolds, version]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        orderNumber: {type: string}
        customerId: {type: string, format: uuid}
        orderType: {type: string, enum: [JOURNAL, ORDER, SUBSCRIPTION, RETURNED]}
        status: {type: string}
        currency: {type: string}
        requestedShipDate: {type: string, format: date}
        channel: {type: string}
        externalRef: {type: string}
        netTotal: {$ref: "#/components/schemas/Money"}
        lineCount: {type: integer}
        activeHolds:
          type: array
          items: {type: string, enum: [CREDIT, FRAUD, MANUAL, PRICE_REVIEW]}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
    ScheduleLine:
      type: object
      required: [id, lineNo, seq, quantity, status, source]
      properties:
        id: {type: string, format: uuid}
        lineNo: {type: integer}
        seq: {type: integer}
        quantity: {$ref: "#/components/schemas/Money"}
        deliveryDate: {type: string, format: date, description: absent on an UNPROMISED line}
        status: {type: string, enum: [CONFIRMED, BACKORDER, UNPROMISED]}
        source: {type: string, enum: [LINE, ATP], description: LINE copies the line's confirmed ship date (confirm or change); ATP was placed by a promise}
        bucketDate: {type: string, format: date, description: the ATP bucket a dated ATP slice drew on}
    BackorderItem:
      type: object
      required: [scheduleLineId, legalEntityId, orderId, orderNumber, orderVersion, customerId, lineId, lineNo, productId, siteId, warehouseId, quantity, requestedShipDate, status]
      properties:
        scheduleLineId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        orderVersion: {type: integer}
        customerId: {type: string, format: uuid}
        lineId: {type: string, format: uuid}
        lineNo: {type: integer}
        productId: {type: string, format: uuid}
        siteId: {type: string}
        warehouseId: {type: string}
        quantity: {$ref: "#/components/schemas/Money"}
        requestedShipDate: {type: string, format: date}
        promisedDate: {type: string, format: date, description: absent when no supply covers the quantity}
        daysLate: {type: integer, description: promised date minus requested date}
        status: {type: string, enum: [BACKORDER, UNPROMISED]}
    OrderVersion:
      type: object
      required: [version, actor, reason, diff, changedAt]
      properties:
        version: {type: integer}
        actor: {type: string}
        reason: {type: string}
        changedAt: {type: string, format: date-time}
        diff:
          type: array
          description: field-level changes; lineNo 0 is a header field
          items:
            type: object
            required: [lineNo, field, old, new]
            properties:
              lineNo: {type: integer}
              field: {type: string, example: quantity}
              old: {type: string}
              new: {type: string}
    ChangeOrderRequest:
      type: object
      description: At least one of lines or requestedShipDate. Absent line fields keep their value.
      properties:
        reason: {type: string, maxLength: 500}
        requestedShipDate: {type: string, format: date}
        lines:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [lineNo]
            properties:
              lineNo: {type: integer, minimum: 1}
              quantity: {$ref: "#/components/schemas/Money"}
              unitPrice: {$ref: "#/components/schemas/Money"}
              discPct: {$ref: "#/components/schemas/Money"}
              requestedShipDate: {type: string, format: date}
    BackorderRunRequest:
      type: object
      required: [legalEntityId, productId, siteId, warehouseId, strategy, supply, supplyDate]
      properties:
        legalEntityId: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        warehouseId: {type: string, format: uuid}
        strategy: {type: string, enum: [WIN, GAIN, REDISTRIBUTE, FILL, LOSE]}
        supply: {$ref: "#/components/schemas/Money", description: the whole quantity available for the open lines, what they hold today included}
        supplyDate: {type: string, format: date, description: the date the supply is available; a line that gains is promised no earlier}
        loseThreshold: {type: integer, minimum: 1, maximum: 9, default: 3, description: LOSE may deconfirm only lines of this priority class or above}
        defaultPriorityClass: {type: integer, minimum: 1, maximum: 9, default: 5, description: priority class of customers not listed in priorityClasses}
        priorityClasses:
          type: object
          description: priority class (1 is highest) by customer id until the party master carries it
          additionalProperties: {type: integer, minimum: 1, maximum: 9}
    BackorderRunLine:
      type: object
      properties:
        seq: {type: integer, description: position in processing order}
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        orderVersion: {type: integer, description: the order version the preview was computed on; a commit refuses a newer one}
        lineId: {type: string, format: uuid}
        lineNo: {type: integer}
        customerId: {type: string, format: uuid}
        priorityClass: {type: integer}
        requestedDate: {type: string, format: date}
        orderValue: {$ref: "#/components/schemas/Money"}
        demand: {$ref: "#/components/schemas/Money"}
        before: {$ref: "#/components/schemas/Money", description: quantity with a promised date now}
        after: {$ref: "#/components/schemas/Money", description: quantity with a promised date after the run}
        changed: {type: boolean}
        deconfirmed: {type: boolean}
        gainDate: {type: string, format: date, description: date a gaining line is promised on}
    BackorderRun:
      type: object
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        warehouseId: {type: string, format: uuid}
        strategy: {type: string, enum: [WIN, GAIN, REDISTRIBUTE, FILL, LOSE]}
        supply: {$ref: "#/components/schemas/Money"}
        supplyDate: {type: string, format: date}
        loseThreshold: {type: integer}
        defaultPriorityClass: {type: integer}
        status: {type: string, enum: [PREVIEW, COMMITTED]}
        allocated: {$ref: "#/components/schemas/Money", description: quantity with a promised date across the lines after the run}
        deconfirmedCount: {type: integer}
        changedCount: {type: integer}
        version: {type: integer}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        committedBy: {type: string}
        committedAt: {type: string, format: date-time}
        warning: {type: string}
        warningCode: {type: string, example: SLS-0015}
        lines:
          type: array
          description: absent from the list
          items: {$ref: "#/components/schemas/BackorderRunLine"}
    BackorderPreviewRequest:
      type: object
      required: [strategy, available, lines]
      properties:
        strategy: {type: string, enum: [WIN, GAIN, REDISTRIBUTE, FILL, LOSE]}
        available: {$ref: "#/components/schemas/Money"}
        loseThreshold: {type: integer, minimum: 1, maximum: 9, default: 3}
        lines:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            required: [id, priorityClass, requestedDate, orderValue, demand, confirmed]
            properties:
              id: {type: string}
              priorityClass: {type: integer, minimum: 1, maximum: 9}
              requestedDate: {type: string, format: date}
              orderValue: {$ref: "#/components/schemas/Money"}
              demand: {$ref: "#/components/schemas/Money"}
              confirmed: {$ref: "#/components/schemas/Money"}
    CreateQuotationRequest:
      type: object
      required: [legalEntityId, customerId, currency, lines]
      properties:
        legalEntityId: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        invoiceAccountId: {type: string, format: uuid, description: defaults to the customer}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        validUntil: {type: string, format: date, description: "today to today + 365 days; default today + the legal entity's quotationExpiryDays (30 unless set)"}
        probabilityPct: {type: integer, minimum: 0, maximum: 100, description: "default the legal entity's quotationProbabilityDefault (50 unless set)"}
        lines:
          type: array
          minItems: 1
          maxItems: 2000
          items: {$ref: "#/components/schemas/OrderLineRequest"}
    QuotationLine:
      allOf:
        - $ref: "#/components/schemas/OrderLine"
        - type: object
          properties:
            lineStatus: {type: string, enum: [OPEN, CONVERTED]}
            convertedOrderId: {type: string, format: uuid, description: the order a CONVERTED line became}
    Quotation:
      type: object
      required: [id, legalEntityId, quotationNumber, customerId, invoiceAccountId, currency, status, validUntil, probabilityPct, netTotal, version, lines, lineCount, openLines]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        quotationNumber: {type: string, example: "SQ-0000001", description: unique per legal entity}
        customerId: {type: string, format: uuid}
        invoiceAccountId: {type: string, format: uuid}
        currency: {type: string}
        status: {type: string, enum: [DRAFT, SENT, CONVERTED, LOST, EXPIRED, CANCELLED]}
        validUntil: {type: string, format: date, description: the last day the quotation can be sent or converted}
        probabilityPct: {type: integer, minimum: 0, maximum: 100}
        netTotal: {$ref: "#/components/schemas/Money"}
        lostReason: {type: string}
        version: {type: integer, minimum: 1}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lines:
          type: array
          description: filled on a single read, empty in the list
          items: {$ref: "#/components/schemas/QuotationLine"}
        lineCount: {type: integer}
        openLines: {type: integer, description: lines not yet converted}
    ConvertQuotationRequest:
      type: object
      properties:
        lineNos:
          type: array
          maxItems: 2000
          items: {type: integer, minimum: 1}
          description: quotation line numbers; empty converts every open line
        listingOverrideReason:
          type: string
          maxLength: 500
          description: With duty sales.order.approve, accepts lines the product listing denies (FR-27.15).
    QuotationConversion:
      type: object
      required: [quotation, order]
      properties:
        quotation: {$ref: "#/components/schemas/Quotation"}
        order: {$ref: "#/components/schemas/Order"}
    HoldQueueItem:
      type: object
      required: [holdId, legalEntityId, orderId, orderNumber, orderVersion, customerId, holdType, reasonCode, amount, currency, appliedBy, appliedAt, slaDueAt]
      properties:
        holdId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        orderVersion: {type: integer, description: the order's ETag value for the release call}
        customerId: {type: string, format: uuid}
        holdType: {type: string, enum: [CREDIT, FRAUD, MANUAL, PRICE_REVIEW]}
        reasonCode: {type: string, description: the failed rule id (CR-1..CR-6) for CREDIT holds}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string}
        appliedBy: {type: string}
        appliedAt: {type: string, format: date-time}
        slaDueAt: {type: string, format: date-time, description: appliedAt plus the legal entity's creditHoldSlaBusinessDays (Monday to Friday); a hold past it is overdue}
        failedRule:
          type: object
          description: the failed rule of the order's last credit check (CREDIT holds); for CR-1 value is exposure plus the order and threshold the limit with tolerance
          properties:
            id: {type: string}
            result: {type: string, enum: [FAIL]}
            value: {type: string}
            threshold: {type: string}
            note: {type: string}
        creditLimit: {$ref: "#/components/schemas/Money"}
        limitCurrency: {type: string}
    SupplementaryRuleRequest:
      type: object
      required: [legalEntityId, parentProductId, supplementaryProductId, unit, requirement, baseQuantity, quantityPerBase, pricing]
      properties:
        legalEntityId: {type: string, format: uuid}
        parentProductId: {type: string, format: uuid}
        customerId: {type: string, format: uuid, description: absent for every customer of the legal entity}
        supplementaryProductId: {type: string, format: uuid}
        unit: {type: string, minLength: 1, maxLength: 10}
        requirement: {type: string, enum: [MANDATORY, OPTIONAL]}
        baseQuantity: {$ref: "#/components/schemas/Money"}
        quantityPerBase: {$ref: "#/components/schemas/Money"}
        pricing: {type: string, enum: [FREE, PRICED]}
        unitPrice: {$ref: "#/components/schemas/Money"}
    SupplementaryRule:
      allOf:
        - $ref: "#/components/schemas/SupplementaryRuleRequest"
        - type: object
          required: [id, unitPrice]
          properties:
            id: {type: string, format: uuid}
    ProposalRuleRequest:
      type: object
      required: [legalEntityId, orderedProductId, proposedProductId, reason]
      properties:
        legalEntityId: {type: string, format: uuid}
        orderedProductId: {type: string, format: uuid}
        proposedProductId: {type: string, format: uuid, description: must differ from the ordered product}
        customerId: {type: string, format: uuid, description: absent means every customer of the legal entity}
        reason: {type: string, enum: [CROSS_SELL, UP_SELL, ACCESSORY]}
    ProposalRule:
      allOf:
        - $ref: "#/components/schemas/ProposalRuleRequest"
        - type: object
          required: [id, acceptedCount, declinedCount]
          properties:
            id: {type: string, format: uuid}
            acceptedCount: {type: integer, minimum: 0, description: accepted responses recorded against the rule}
            declinedCount: {type: integer, minimum: 0, description: declined responses recorded against the rule}
    Proposal:
      type: object
      required: [ruleId, orderedProductId, proposedProductId, reason]
      properties:
        ruleId: {type: string, format: uuid}
        orderedProductId: {type: string, format: uuid}
        proposedProductId: {type: string, format: uuid}
        reason: {type: string, enum: [CROSS_SELL, UP_SELL, ACCESSORY]}
    ProposalResponse:
      type: object
      required: [id, legalEntityId, ruleId, orderedProductId, proposedProductId, reason, accepted, respondedBy, respondedAt]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        ruleId: {type: string, format: uuid}
        orderedProductId: {type: string, format: uuid}
        proposedProductId: {type: string, format: uuid}
        reason: {type: string, enum: [CROSS_SELL, UP_SELL, ACCESSORY]}
        customerId: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        accepted: {type: boolean}
        respondedBy: {type: string}
        respondedAt: {type: string, format: date-time}
    SupplementaryLine:
      type: object
      required: [ruleId, productId, unit, requirement, quantity, unitPrice, supplementaryOf]
      properties:
        ruleId: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        unit: {type: string}
        requirement: {type: string, enum: [MANDATORY, OPTIONAL]}
        quantity: {$ref: "#/components/schemas/Money"}
        unitPrice: {$ref: "#/components/schemas/Money", description: zero for FREE items}
        supplementaryOf: {type: string, format: uuid, description: the parent product}
