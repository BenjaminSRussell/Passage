apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: agent-runtime
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-runtime
          image: {{ include "agent-runtime.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: {{ .Values.providerSecret }}
          env:
            {{- include "passage.cloudEnv" $ | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            - name: MCP_URL
              value: {{ .Values.mcpUrl | quote }}
            - name: HTTP_ADDR
              value: "0.0.0.0:8080"
            - name: ADMIN_ADDR
              value: "0.0.0.0:9090"
            - name: SERVICE_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: AGENTS_PROVIDER
              value: {{ .Values.model.provider | quote }}
            - name: AGENTS_MODEL
              value: {{ .Values.model.default | quote }}
            {{- if .Values.model.copilot }}
            - name: AGENTS_COPILOT_MODEL
              value: {{ .Values.model.copilot | quote }}
            {{- end }}
            {{- if .Values.model.overrides }}
            - name: AGENTS_MODEL_OVERRIDES
              value: {{ .Values.model.overrides | quote }}
            {{- end }}
            {{- if .Values.openai.baseUrl }}
            - name: AGENTS_OPENAI_BASE_URL
              value: {{ .Values.openai.baseUrl | quote }}
            - name: AGENTS_OPENAI_AUTH
              value: {{ .Values.openai.auth | quote }}
            {{- end }}
            {{- if .Values.openai.apiVersion }}
            - name: AGENTS_OPENAI_API_VERSION
              value: {{ .Values.openai.apiVersion | quote }}
            {{- end }}
            {{- if .Values.model.region }}
            - name: AGENTS_PROVIDER_REGION
              value: {{ .Values.model.region | quote }}
            {{- end }}
            {{- if .Values.phiFields }}
            - name: AGENTS_PHI_FIELDS
              value: {{ join "," .Values.phiFields | quote }}
            {{- end }}
            {{- if .Values.bedrock.region }}
            - name: AWS_REGION
              value: {{ .Values.bedrock.region | quote }}
            {{- end }}
            - name: AGENTS_RUN_TOKEN_CAP
              value: {{ .Values.runTokenCap | quote }}
            - name: AGENTS_COPILOT_TOKEN_CAP
              value: {{ .Values.copilot.tokenCap | quote }}
            - name: AGENTS_COPILOT_MAX_TURNS
              value: {{ .Values.copilot.maxTurns | quote }}
            {{- if .Values.approvalExpiryHours }}
            - name: AGENTS_APPROVAL_EXPIRY_H
              value: {{ .Values.approvalExpiryHours | quote }}
            {{- end }}
            - name: AGENTS_KILLSWITCH_POLL_MS
              value: {{ .Values.killSwitchPollMs | quote }}
            - name: AGENTS_SELF_APPROVAL_LIMIT
              value: {{ .Values.selfApprovalLimit.amount | quote }}
            - name: AGENTS_SELF_APPROVAL_CURRENCY
              value: {{ .Values.selfApprovalLimit.currency | quote }}
            - name: AGENTS_EVAL_PASSED
              value: {{ .Values.evalPassed | quote }}
            - name: AGENTS_JWT_ISSUER
              value: {{ .Values.auth.issuer | quote }}
            - name: AGENTS_JWT_AUDIENCE
              value: {{ .Values.auth.audience | quote }}
            {{- if .Values.auth.jwksUrl }}
            - name: AGENTS_JWKS_URL
              value: {{ .Values.auth.jwksUrl | quote }}
            {{- end }}
            {{- if .Values.auth.jwksConfigMap.name }}
            - name: AGENTS_JWKS_FILE
              value: /etc/passage/jwks/jwks.json
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.auth.jwksConfigMap.name }}
          volumeMounts:
            - { name: jwks, mountPath: /etc/passage/jwks, readOnly: true }
          {{- end }}
      {{- if .Values.auth.jwksConfigMap.name }}
      volumes:
        - name: jwks
          configMap:
            name: {{ .Values.auth.jwksConfigMap.name | quote }}
            items:
              - { key: {{ .Values.auth.jwksConfigMap.key | quote }}, path: jwks.json }
      {{- end }}
