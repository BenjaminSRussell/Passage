openapi: 3.1.0
info:
  title: Passage agent runtime
  version: 0.1.0
  description: |
    PRD 9.47.5 endpoints for agent runs, approvals, kill switch, budgets and
    eval triggers. This build serves the kill switch (read and toggle), the
    approval decision, run start and run read, and the copilot chat
    (src/api/router.ts). The budget, eval and promotion endpoints are not
    served yet; NOT-IMPLEMENTED.md lists them. Every route needs the
    caller's bearer token (Authorization: Bearer), which the runtime verifies
    itself (RS256, issuer, audience, expiry) and takes the tenant, user and
    duties from; the x-passage-tenant, x-passage-user and x-passage-duties
    headers the edge sets must match it, and are never trusted alone (401
    AGT-0401). Errors are RFC 9457 problems with a stable `code`: AGT-04xx and
    AGT-0500 for HTTP-level errors, AGT-02xx from the PRD 9.47.18 catalog for
    business refusals (README, Error codes).
servers:
  - url: https://api.passage.dev
paths:
  /api/v1/agents/kill-switch:
    get:
      operationId: getKillSwitchStatus
      summary: The caller's tenant kill switch and the global kill switch (9.47.6 agent administration)
      description: |
        As this worker sees them. `halted` is true when runs for the caller's
        tenant are stopped for any reason, including a worker that has not
        heard from the kill-switch stream for 10 s (`stale`, fail-closed).
        Readable with agents.admin or platform.global.admin.
      x-passage-duty: agents.admin
      responses:
        "200":
          description: Kill switch status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KillSwitchStatus"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      operationId: toggleKillSwitch
      summary: Halt or resume agent runs for a tenant or globally (AC-47.6)
      description: |
        TENANT scope needs agents.admin and the caller's own tenant (AGT-0403
        otherwise). GLOBAL scope needs platform.global.admin (break-glass). Idempotent
        by scope: asking for the state the switch is already in returns its
        current toggle and publishes nothing. Otherwise
        dev.passage.agent.killswitch.changed.v1 is published before the
        response, and only then applied to this worker. Versions are strictly
        increasing so workers ignore duplicates.
      x-passage-duty: agents.admin
      x-passage-approval: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KillSwitchCommand"}
      responses:
        "200":
          description: The switch's current toggle.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KillSwitchResult"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
  /api/v1/agents/runs/{runId}/actions/{actionId}/decision:
    post:
      operationId: decideAgentAction
      summary: Approve or reject a proposal that waits at the approval gate (FR-47.8)
      description: |
        The caller must hold the action's approval duty (AGT-0203). An approver
        who started the run may not approve above the self-approval limit
        (AGT-0209). An expired request is recorded and answered with decision
        REJECTED, reason EXPIRED and code AGT-0208 (BR-47.3): the source
        document stays unposted. Idempotent by action id: the same decision
        again returns the recorded one; a different decision on a decided
        action is 409 AGT-0409. Another tenant's action is never found (404).
      x-passage-duty: AgentApprove
      x-passage-approval: none
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: actionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApprovalDecisionCommand"}
      responses:
        "200":
          description: The recorded decision.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApprovalDecisionResult"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
  /api/v1/agents/{agentId}/runs:
    post:
      operationId: startAgentRun
      summary: Start an agent run for one document or question (FR-47.4)
      description: |
        Refused before any state exists when the agent is unknown (404 AGT-0404),
        the caller lacks agents.invoke or one of the agent's own duties (403
        AGT-0203), the kill switch is on (422 AGT-0201), the agent version has no
        passing evaluation (422 AGT-0204) or the month's token budget is
        exhausted (422 AGT-0202). Otherwise the run executes in the background
        as the caller, with the caller's bearer token forwarded to the MCP
        gateway, and the answer is 202 with the run id. A run in suggest mode
        waits at the approval gate; poll GET /api/v1/agents/runs/{runId}.
      x-passage-duty: agents.invoke
      x-passage-approval: none
      parameters:
        - {name: agentId, in: path, required: true, schema: {type: string, enum: [ap_coding, cash_app, mrp_triage, collections, anomaly]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: {type: string, minLength: 1, maxLength: 8000}
              additionalProperties: false
      responses:
        "202":
          description: The run was accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StartedRun"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /api/v1/agents/runs/{runId}:
    get:
      operationId: getAgentRun
      summary: A run of the caller's tenant with the approvals still waiting
      description: |
        status is RUNNING until the run ends, including while it waits for an
        approver. pendingApprovals lists the action ids the decision endpoint
        takes. Another tenant's run is never found (404).
      x-passage-duty: agents.run.read
      x-passage-approval: none
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunView"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/agents/runs/{runId}/actions:
    get:
      operationId: listAgentRunActions
      summary: The audit rows of a run (AC-47.3)
      description: Inputs and outputs are pseudonymized; the approver and the committed reference are recorded per action.
      x-passage-duty: agents.run.read
      x-passage-approval: none
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The actions in sequence order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/AgentAction"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/knowledge/search:
    post:
      operationId: knowledgeSearch
      summary: Hybrid search over the tenant's knowledge chunks (FR-47.14)
      description: |
        Postgres full-text search and embedding similarity, fused by reciprocal rank. Each chunk carries its fused score
        and, when the embedding side found it, its cosine similarity; the copilot's citation gate (AGT-0212) accepts a
        chunk only at 0.75 or more. Without an embedding port the search is keyword only and no chunk carries a
        similarity. The copilot calls this as its read tool `passage.knowledge.search`.
      x-passage-duty: mcp.copilot.use
      x-passage-approval: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string, minLength: 1, maxLength: 1000}
                limit: {type: integer, minimum: 1, maximum: 20, default: 10}
              additionalProperties: false
      responses:
        "200":
          description: Chunks, best first.
          content:
            application/json:
              schema:
                type: object
                required: [chunks]
                properties:
                  chunks:
                    type: array
                    items:
                      type: object
                      required: [chunkId, sourceType, sourceRef, section, fusedScore]
                      properties:
                        chunkId: {type: string, format: uuid}
                        sourceType: {type: string, enum: [ARTICLE, DOC, POLICY]}
                        sourceRef: {type: string}
                        section: {type: string}
                        fusedScore: {type: number}
                        similarity: {type: number}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/knowledge/chunks:
    post:
      operationId: knowledgeIndexChunks
      summary: Index or replace knowledge chunks (FR-47.14)
      description: |
        Stores 1 to 100 chunks of articles, documents or policies, replacing a chunk of the same source and section, and
        embeds them when an embedding port is configured.
      x-passage-duty: knowledge.write
      x-passage-approval: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chunks]
              properties:
                chunks:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [sourceType, sourceRef, section, body]
                    properties:
                      sourceType: {type: string, enum: [ARTICLE, DOC, POLICY]}
                      sourceRef: {type: string, minLength: 1, maxLength: 200}
                      section: {type: string, minLength: 1, maxLength: 200}
                      body: {type: string, minLength: 1, maxLength: 20000}
                    additionalProperties: false
              additionalProperties: false
      responses:
        "200":
          description: How many chunks were indexed and embedded.
          content:
            application/json:
              schema:
                type: object
                required: [indexed, embedded]
                properties:
                  indexed: {type: integer}
                  embedded: {type: integer}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/copilot/chat:
    post:
      operationId: copilotChat
      summary: One copilot turn (FR-47.3, BR-47.11)
      description: |
        The model may call read tools the caller is allowed to use; each call is
        made with the caller's token and audited as a run of agent "copilot". A
        tool outside the caller's duties is answered AGT-0203 and never called.
        With Accept: text/event-stream the answer arrives as `token` frames
        ({text}) and one terminal `done` frame (the JSON body); otherwise as
        JSON. Failures before the first byte are ordinary problems. Answers are
        cached per tenant, user, duty set and mode for 5 minutes.
      x-passage-duty: mcp.copilot.use
      x-passage-approval: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, message]
              properties:
                mode: {type: string, enum: [ask, explain, draft, summarize]}
                message: {type: string, minLength: 1, maxLength: 4000}
                recordRef: {type: string, minLength: 1, maxLength: 200}
              additionalProperties: false
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatResponse"}
            text/event-stream:
              schema: {type: string, description: "token frames then one done frame"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
components:
  responses:
    Problem:
      description: RFC 9457 problem details (application/problem+json).
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code]
            properties:
              type: {type: string, format: uri, description: "https://passage.dev/problems/<code>"}
              title: {type: string}
              status: {type: integer}
              code: {type: string, pattern: "^AGT-[0-9]{4}$"}
              detail: {type: string}
              instance: {type: string}
  schemas:
    StartedRun:
      type: object
      required: [runId, agentId, agentVersion, status]
      properties:
        runId: {type: string, format: uuid}
        agentId: {type: string}
        agentVersion: {type: integer, minimum: 1}
        status: {type: string, enum: [RUNNING]}
    PendingApproval:
      type: object
      required: [actionId, runId, seq, tool, requestedAt, approvalDuty]
      properties:
        actionId: {type: string, format: uuid}
        runId: {type: string}
        seq: {type: integer, minimum: 1}
        tool: {type: string}
        requestedAt: {type: string, format: date-time}
        approvalDuty: {type: string}
    RunView:
      type: object
      required: [run, pendingApprovals]
      properties:
        run:
          type: object
          required: [runId, agentId, agentVersion, invokerUserId, status, tokensIn, tokensOut, estimated, createdAt]
          properties:
            runId: {type: string}
            agentId: {type: string}
            agentVersion: {type: integer}
            invokerUserId: {type: string}
            status: {type: string, enum: [RUNNING, COMMITTED, REJECTED, FAILED, KILLED, FAILED_AFTER_COMMIT]}
            code: {type: string}
            reason: {type: string}
            tokensIn: {type: integer, minimum: 0}
            tokensOut: {type: integer, minimum: 0}
            estimated: {type: boolean}
            postCommitError: {type: string}
            createdAt: {type: string, format: date-time}
        pendingApprovals:
          type: array
          items: {$ref: "#/components/schemas/PendingApproval"}
    ChatResponse:
      type: object
      required: [answer, citations, toolCalls, refusal, generated]
      properties:
        answer: {type: string}
        citations:
          type: array
          items:
            type: object
            required: [sourceType, sourceRef, label]
            properties:
              sourceType: {type: string, enum: [RECORD, METRIC, ARTICLE, DOC, POLICY]}
              sourceRef: {type: string}
              label: {type: string}
        toolCalls:
          type: array
          items:
            type: object
            required: [tool, status]
            properties:
              tool: {type: string}
              status: {type: string, enum: [OK, DENIED, ERROR]}
              code: {type: string}
        refusal:
          type: [object, "null"]
          properties:
            code: {type: string}
            message: {type: string}
        generated: {type: boolean, enum: [true]}
    KillSwitchCommand:
      type: object
      required: [scope, active]
      properties:
        scope: {type: string, enum: [GLOBAL, TENANT]}
        tenantId: {type: [string, "null"], format: uuid, description: Required for TENANT, forbidden for GLOBAL.}
        active: {type: boolean}
      additionalProperties: false
    KillSwitchResult:
      type: object
      required: [scope, tenantId, active, version, changedAt, byUser]
      properties:
        scope: {type: string, enum: [GLOBAL, TENANT]}
        tenantId: {type: [string, "null"], format: uuid}
        active: {type: boolean}
        version: {type: integer, minimum: 1}
        changedAt: {type: string, format: date-time}
        byUser: {type: string, format: uuid}
    KillSwitchState:
      type: object
      required: [active, version, changedAt]
      properties:
        active: {type: boolean, description: False when the switch was never toggled.}
        version: {type: [integer, "null"], minimum: 1}
        changedAt: {type: [string, "null"], format: date-time}
    KillSwitchStatus:
      type: object
      required: [tenantId, halted, stale, tenant, global]
      properties:
        tenantId: {type: string, format: uuid}
        halted: {type: boolean}
        stale: {type: boolean}
        tenant:
          allOf:
            - {$ref: "#/components/schemas/KillSwitchState"}
            - type: object
              required: [byUser]
              properties:
                byUser: {type: [string, "null"], format: uuid}
        global:
          description: The operator who toggled it belongs to another tenant, so no user id is returned.
          allOf:
            - {$ref: "#/components/schemas/KillSwitchState"}
    ApprovalDecisionCommand:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [APPROVED, REJECTED]}
      additionalProperties: false
    ApprovalDecisionResult:
      type: object
      required: [runId, actionId, decision, approverUserId, decidedAt]
      properties:
        runId: {type: string, format: uuid}
        actionId: {type: string, format: uuid}
        decision: {type: string, enum: [APPROVED, REJECTED]}
        reason: {type: string, enum: [EXPIRED]}
        code: {type: string, enum: [AGT-0208]}
        approverUserId: {type: string, format: uuid}
        decidedAt: {type: string, format: date-time}
    RunStatus:
      type: string
      description: BR-47.1 run state machine. COMMITTED, REJECTED, FAILED and KILLED are terminal.
      enum: [PLANNING, ACTING, AWAITING_APPROVAL, COMMITTED, REJECTED, FAILED, KILLED]
    ActionDecision:
      type: string
      enum: [APPROVED, REJECTED, AUTO, DENIED]
    AgentMode:
      type: string
      enum: [OFF, SUGGEST, AUTO]
    AgentErrorCode:
      type: string
      description: Stable codes from PRD 9.47.18 raised by this slice.
      enum: [AGT-0201, AGT-0202, AGT-0203, AGT-0204, AGT-0208, AGT-0209, AGT-0210, AGT-0214]
    RunResult:
      type: object
      description: Returned by runAgent. Mirrors RunResult in src/runtime/engine.ts.
      required: [runId, status, tokensIn, tokensOut, estimated, actions]
      properties:
        runId: {type: string}
        status: {$ref: "#/components/schemas/RunStatus"}
        code: {$ref: "#/components/schemas/AgentErrorCode"}
        reason: {type: string}
        displayText: {type: string, description: Model text with pseudonyms resolved; shown in the UI only.}
        tokensIn: {type: integer, minimum: 0}
        tokensOut: {type: integer, minimum: 0}
        estimated: {type: boolean, description: BR-47.4 — true when the provider reported no usage.}
        budgetState: {type: string, enum: [OK, SOFT, HARD]}
        actions:
          type: array
          items: {$ref: "#/components/schemas/AgentAction"}
    AgentAction:
      type: object
      description: One audited tool call or proposal (agent_action).
      required: [seq, toolName, inputJson, decision, committedEntityRef, approverUserId]
      properties:
        seq: {type: integer, minimum: 1}
        toolName: {type: string}
        inputJson: {type: string, description: Redacted input. Never contains raw PII.}
        decision: {$ref: "#/components/schemas/ActionDecision"}
        approverUserId: {type: [string, "null"], format: uuid}
        committedEntityRef: {type: [string, "null"]}
