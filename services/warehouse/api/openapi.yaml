openapi: 3.1.0
info:
  title: Passage warehouse (wave 31, slice 2)
  version: 0.2.0
  description: >
    Location-directive simulation. Stateless: the caller sends the line, the
    directives, the candidate locations and optional hazmat compliance data, and
    receives the location the rules choose with a rule-by-rule trace. Slice 2 adds
    hazmat storage compatibility (FR-31.19) to the simulation. Persistence, work,
    waves and the other wave-31 endpoints are later slices (see NOT-IMPLEMENTED.md).
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env: { default: dev }
paths:
  /v1/warehouse/location-directives:simulate:
    post:
      operationId: simulateLocationDirective
      summary: Evaluate location directives for a hypothetical line
      description: >
        BR-31.1 without persistence. Directives are taken in sequence order; the
        first directive in scope whose query matches and whose line (quantity
        band, from_qty <= qty < to_qty) covers the quantity runs its actions in
        seq order, and the first action with a candidate wins. A PUT candidate
        passes status, mixing and capacity (BR-31.2) and, when the request
        carries compliance data and the item has a hazmat profile, storage
        compatibility (BR-31.15): allowed storage classes of the location,
        prohibited pairs in its fire-containment section, separate pairs in its
        rack group and the section limit in kg. Each refusal is a trace reason,
        for example "hazmat: class 3 vs 5.1 prohibited in FCS-02". A PICK
        candidate holds at least the line quantity of the item (no split picks
        yet). The body is capped at 4 MiB by the platform decoder.
      x-passage-duty: warehouse.setup.view
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulateRequest" }
      responses:
        "200":
          description: Evaluation result. A blocked line is a 200 with blocked true and code WMS-0101.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulateResponse" }
        "400":
          description: >
            Validation failed (COM-0001) with field errors: missing or malformed
            line fields, unknown strategy or status, a directive line without
            actions, overlapping quantity bands in one directive, duplicate
            directive or location ids, negative capacity, usage or stock, a
            blank allowed storage class, or invalid compliance data (field
            compliance: unknown relation, conflicting pair, duplicate or
            incomplete hazmat profile, negative section limit).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: No tenant (AUTH-0001).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Missing duty warehouse.setup.view (AUTH-0003).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /healthz:
    get:
      operationId: healthz
      responses:
        "200": { description: Process is alive }
  /readyz:
    get:
      operationId: readyz
      responses:
        "200": { description: Process is ready to serve }
components:
  schemas:
    Decimal:
      type: string
      description: Decimal as a string, never a float.
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    SimulateRequest:
      type: object
      additionalProperties: false
      required: [line, directives, locations]
      properties:
        line: { $ref: "#/components/schemas/Line" }
        directives:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/Directive" }
        locations:
          type: array
          maxItems: 50000
          items: { $ref: "#/components/schemas/Location" }
        compliance: { $ref: "#/components/schemas/Compliance" }
    Compliance:
      type: object
      description: >
        Hazmat reference data (BR-31.15). Pairs without an entry are allowed.
        Invalid data is a 400 on field compliance.
      additionalProperties: false
      properties:
        hazmatProfiles:
          type: array
          items: { $ref: "#/components/schemas/HazmatProfile" }
        segregation:
          type: array
          items: { $ref: "#/components/schemas/SegregationPair" }
        sectionLimitsKg:
          type: object
          description: >
            Section quantity limit in kg per fire-containment section. The
            section quantity is the used weight of its locations that hold an
            item with a hazmat profile.
          additionalProperties: { $ref: "#/components/schemas/Decimal" }
    HazmatProfile:
      type: object
      additionalProperties: false
      required: [itemId, storageClass]
      properties:
        itemId: { type: string }
        unNumber: { type: string, pattern: "^UN[0-9]{4}$" }
        shippingName: { type: string }
        class: { type: string }
        division: { type: string }
        packingGroup: { type: string }
        storageClass: { type: string, examples: ["3", "5.1"] }
        waterHazardClass: { type: string }
        flashPointC: { $ref: "#/components/schemas/Decimal" }
        netExplosiveMassKg: { $ref: "#/components/schemas/Decimal" }
    SegregationPair:
      type: object
      additionalProperties: false
      required: [a, b, rel]
      properties:
        a: { type: string }
        b: { type: string }
        rel: { type: string, enum: [allowed, separate, prohibited] }
    Line:
      type: object
      additionalProperties: false
      required: [itemId, workType, direction, warehouseId, qty]
      properties:
        itemId: { type: string }
        workType: { type: string, examples: [PURCHASE_PUTAWAY, SALES_PICK] }
        direction: { type: string, enum: [PUT, PICK] }
        warehouseId: { type: string, format: uuid }
        qty: { $ref: "#/components/schemas/Decimal" }
        weight: { $ref: "#/components/schemas/Decimal" }
        volume: { $ref: "#/components/schemas/Decimal" }
        lps: { type: integer, minimum: 0 }
        attributes: { type: object, additionalProperties: { type: string } }
    Directive:
      type: object
      additionalProperties: false
      required: [id, sequence, workType, direction, warehouseId, lines]
      properties:
        id: { type: string }
        sequence: { type: integer }
        workType: { type: string }
        direction: { type: string, enum: [PUT, PICK] }
        warehouseId: { type: string, format: uuid }
        query: { type: object, additionalProperties: { type: string } }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Band" }
    Band:
      type: object
      additionalProperties: false
      required: [seq, fromQty, actions]
      properties:
        seq: { type: integer }
        fromQty: { $ref: "#/components/schemas/Decimal" }
        toQty: { $ref: "#/components/schemas/Decimal" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/Action" }
    Action:
      type: object
      additionalProperties: false
      required: [seq, strategy]
      properties:
        seq: { type: integer }
        strategy:
          type: string
          enum: [consolidate, fifo, lifo, fefo, empty_location, match_packing_quantity, round_up_to_lp, outbound_staging]
        zone: { type: string }
    Location:
      type: object
      additionalProperties: false
      required: [id, name, zone, status]
      properties:
        id: { type: string }
        name: { type: string }
        zone: { type: string }
        pickSequence: { type: integer }
        status:
          type: string
          enum: [ACTIVE, BLOCKED_IN, BLOCKED_OUT, BLOCKED, INACTIVE]
        capacity:
          type: object
          additionalProperties: false
          properties:
            maxWeight: { $ref: "#/components/schemas/Decimal" }
            maxVolume: { $ref: "#/components/schemas/Decimal" }
            maxLps: { type: integer, minimum: 0 }
            maxItems: { type: integer, minimum: 0 }
            allowMixedItems: { type: boolean }
        used:
          type: object
          additionalProperties: false
          description: Current weight, volume and LP count. The item count is derived from stock.
          properties:
            weight: { $ref: "#/components/schemas/Decimal" }
            volume: { $ref: "#/components/schemas/Decimal" }
            lps: { type: integer, minimum: 0 }
        stock:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Decimal" }
        fireSection: { type: string, description: "Fire-containment section (FR-31.19); empty means none." }
        rackGroup: { type: string, description: "Location group that separate segregation compares." }
        allowedStorageClasses:
          type: array
          description: Storage classes a hazmat item may have here; empty allows any.
          items: { type: string, minLength: 1 }
    SimulateResponse:
      type: object
      required: [blocked, trace]
      properties:
        blocked: { type: boolean }
        code: { type: string, description: "WMS-0101 when blocked" }
        locationId: { type: string }
        location: { type: string }
        directive: { type: string }
        trace:
          type: array
          items:
            type: object
            required: [directive, outcome, reason]
            properties:
              directive: { type: string }
              band: { type: integer }
              action: { type: integer }
              outcome: { type: string, enum: [hit, miss, skip] }
              reason: { type: string }
    Problem:
      type: object
      description: RFC 9457 problem details with a stable code.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
