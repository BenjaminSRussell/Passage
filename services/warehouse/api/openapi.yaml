openapi: 3.1.0
info:
  title: Passage warehouse (wave 31, slice 4)
  version: 0.4.0
  description: >
    Location-directive simulation (stateless, with optional hazmat compliance
    data), and with a database: locations with their stock, location
    directives, and directed work (create, list, assign, confirm, short pick,
    cancel). Commands require an Idempotency-Key (kept 24 hours): a repeat with
    the same request returns the first answer with Idempotent-Replayed: true; a
    repeat with another request is 422 idempotency_key_reuse. Work commands
    accept an optional If-Match with the work version. Slice 4 adds dock doors
    and appointments and ASN receiving (register the ASN, then receive each
    pallet into put-away work). Waves, replenishment, loads and the other
    wave-31 endpoints are later slices (see NOT-IMPLEMENTED.md).
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env: { default: dev }
paths:
  /v1/warehouse/location-directives:simulate:
    post:
      operationId: simulateLocationDirective
      summary: Evaluate location directives for a hypothetical line
      description: >
        BR-31.1 without persistence. Directives are taken in sequence order; the
        first directive in scope whose query matches and whose line (quantity
        band, from_qty <= qty < to_qty) covers the quantity runs its actions in
        seq order, and the first action with a candidate wins. A PUT candidate
        passes status, mixing and capacity (BR-31.2) and, when the request
        carries compliance data and the item has a hazmat profile, storage
        compatibility (BR-31.15): allowed storage classes of the location,
        prohibited pairs in its fire-containment section, separate pairs in its
        rack group and the section limit in kg. Each refusal is a trace reason,
        for example "hazmat: class 3 vs 5.1 prohibited in FCS-02". A PICK
        candidate holds at least the line quantity of the item (no split picks
        yet). The body is capped at 4 MiB by the platform decoder.
      x-passage-duty: warehouse.setup.view
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulateRequest" }
      responses:
        "200":
          description: Evaluation result. A blocked line is a 200 with blocked true and code WMS-0101.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulateResponse" }
        "400":
          description: >
            Validation failed (COM-0001) with field errors: missing or malformed
            line fields, unknown strategy or status, a directive line without
            actions, overlapping quantity bands in one directive, duplicate
            directive or location ids, negative capacity, usage or stock, a
            blank allowed storage class, or invalid compliance data (field
            compliance: unknown relation, conflicting pair, duplicate or
            incomplete hazmat profile, negative section limit).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: No tenant (AUTH-0001).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Missing duty warehouse.setup.view (AUTH-0003).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/warehouse/locations:bulk:
    post:
      operationId: createLocations
      summary: Create the locations of a warehouse (FR-31.1)
      description: >
        Creates 1 to 1,000 locations in one transaction with zero usage and no
        stock (stock arrives through confirmed PUT work). Status defaults to
        ACTIVE. A name already used in the warehouse refuses the whole batch
        (409 WMS-DUPLICATE). Updating locations is a later slice.
      x-passage-duty: warehouse.setup.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationsRequest" }
      responses:
        "201":
          description: Created (or replayed, with Idempotent-Replayed true).
          headers: { Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationPage" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/warehouse/locations:
    get:
      operationId: listLocations
      summary: List a warehouse's locations with their stock, by name
      x-passage-duty: warehouse.setup.view
      parameters:
        - { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: zone, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page, ordered by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationPage" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/warehouse/location-directives:
    post:
      operationId: createLocationDirective
      summary: Create a location directive (FR-31.3)
      description: >
        The server assigns the id. The sequence must be unique per warehouse,
        work type and direction (409 WMS-DUPLICATE). Quantity bands must not
        overlap. Versioning and effective dating are a later slice.
      x-passage-duty: warehouse.setup.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectiveInput" }
      responses:
        "201":
          description: Created (or replayed).
          headers: { Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Directive" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      operationId: listLocationDirectives
      summary: List a warehouse's directives in evaluation order
      x-passage-duty: warehouse.setup.view
      parameters:
        - { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: workType, in: query, schema: { $ref: "#/components/schemas/WorkType" } }
        - { name: direction, in: query, schema: { type: string, enum: [PUT, PICK] } }
      responses:
        "200":
          description: Every matching directive, by work type, direction and sequence.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Directive" } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/warehouse/work:
    post:
      operationId: createWork
      summary: Create work and direct each line to a location (CreateWorkFromOrderLines)
      description: >
        Each line is evaluated against the warehouse's persisted directives
        (BR-31.1) with remaining capacity and stock net of every open line
        (BR-31.2). A line no directive can place has no location and reason
        WMS-0101, and the work is BLOCKED_NO_LOCATION. Emits
        dev.passage.wms.work.created.v1. Priority defaults to 50 (1 highest).
      x-passage-duty: warehouse.work.supervise
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkRequest" }
      responses:
        "201":
          description: Created (or replayed). traces holds each line's directive result and rule trace.
          headers: { Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Planned" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      operationId: listWork
      summary: List a warehouse's work headers, highest priority then oldest first
      x-passage-duty: warehouse.inquiry.view
      parameters:
        - { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/WorkStatus" } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of work headers; lines is empty here, read one work for its lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkPage" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/warehouse/work/{id}:
    get:
      operationId: getWork
      summary: Read one work with its lines
      x-passage-duty: warehouse.inquiry.view
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: The work.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/warehouse/work:assign:
    post:
      operationId: assignWork
      summary: Assign the next work of a warehouse to the calling user (FR-31.7)
      description: >
        ASSIGNED work idle past WMS_LOCK_TIMEOUT_MIN (default 30) returns to
        OPEN first (BR-31.3). The OPEN work with the best priority, then the
        oldest, is taken with FOR UPDATE SKIP LOCKED (BR-31.8), so no work goes
        to two users. The user is X-Passage-User. work is null when nothing is
        assignable. Work class and user filters are a later slice.
      x-passage-duty: warehouse.work.execute
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [warehouseId]
              properties:
                warehouseId: { type: string, format: uuid }
      responses:
        "200":
          description: The assigned work, or null.
          headers: { Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" } }
          content:
            application/json:
              schema:
                type: object
                required: [work]
                properties:
                  work:
                    oneOf:
                      - { $ref: "#/components/schemas/Work" }
                      - { type: "null" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/warehouse/work/{id}/lines/{n}:confirm:
    post:
      operationId: confirmWorkLine
      summary: Confirm a line at its open quantity (ConfirmWorkLine)
      description: >
        Only the assignee confirms (403 WMS-NOT-ASSIGNEE), and only while the
        work is ASSIGNED or IN_PROGRESS (409 WMS-0110). qty must equal the open
        quantity: the over-pick tolerance is 0 (422 WMS-0106 above it; a lower
        quantity is a short pick). The stock moves at the line's location under
        a row lock: a PUT receives with capacity and mixing checked again
        (422 WMS-0102, WMS-0103), a PICK issues. The last open line completes the
        work and emits dev.passage.wms.work.completed.v1. A second confirmation
        of the line with another key is 409 WMS-0105 (BR-31.8).
      x-passage-duty: warehouse.work.execute
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [qty]
              properties:
                qty: { $ref: "#/components/schemas/Decimal" }
                lot: { type: string, maxLength: 40, description: What was counted; replaces the ASN's lot on the pallet's label. }
                expiryDate: { type: string, format: date, description: What was counted; replaces the ASN's expiry date. }
      responses:
        "200":
          description: The work after the confirmation (or replayed).
          headers: { Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/warehouse/work/{id}:exception:
    post:
      operationId: workException
      summary: Short pick a line or cancel a work, with a reason (FR-31.7)
      description: >
        SHORT_PICK (assignee only) confirms a PICK line at confirmedQty, 0 or
        more and below the open quantity: the line becomes SHORT, only that
        quantity leaves the location, the work becomes PARTIALLY_COMPLETED once
        no line is open, and the remainder is a new OPEN work with parentWorkId
        (AC-31.5). CANCEL is allowed from OPEN, ASSIGNED and BLOCKED_NO_LOCATION
        while no line is confirmed; the assignee, or a holder of
        warehouse.work.supervise, may cancel. Skip location is a later slice.
      x-passage-duty: warehouse.work.execute
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { type: string, enum: [SHORT_PICK, CANCEL] }
                lineNo: { type: integer, minimum: 1, description: "Required for SHORT_PICK." }
                confirmedQty: { $ref: "#/components/schemas/Decimal" }
                reason: { type: string, minLength: 1, maxLength: 200, examples: [EMPTY, DAMAGED] }
      responses:
        "200":
          description: The work after the exception and, for a short pick, the remainder work.
          headers: { Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" } }
          content:
            application/json:
              schema:
                type: object
                required: [work, remainder]
                properties:
                  work: { $ref: "#/components/schemas/Work" }
                  remainder:
                    oneOf:
                      - { $ref: "#/components/schemas/Work" }
                      - { type: "null" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/warehouse/dock-doors:
    post:
      operationId: createDockDoor
      summary: Add a dock door to a warehouse (FR-31.8)
      description: The code is unique in the warehouse (409 WMS-DUPLICATE).
      x-passage-duty: warehouse.setup.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [warehouseId, code]
              properties:
                warehouseId: { type: string, format: uuid }
                code: { type: string, minLength: 1, maxLength: 20, examples: [D1] }
      responses:
        "201":
          description: Created (or replayed).
          headers: { Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DockDoor" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      operationId: listDockDoors
      summary: List a warehouse's dock doors by code (at most 200)
      x-passage-duty: warehouse.inquiry.view
      parameters:
        - { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The doors.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DockDoor" } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/warehouse/dock-appointments:
    post:
      operationId: createDockAppointment
      summary: Book a door for a window (FR-31.8)
      description: >
        start and end are on the 15-minute grid, end is after start and at most
        24 hours later. The window is half open, so 09:00–09:45 and 09:45–10:00
        do not overlap. An appointment overlapping another on the door is 409
        WMS-0108 (AC-31.8 DOOR_SLOT_OVERLAP); a door that is not in the
        warehouse is 404 WMS-DOOR-NOT-FOUND. INBOUND needs
        warehouse.receipt.register, OUTBOUND needs warehouse.shipment.confirm.
      x-passage-duty: warehouse.receipt.register or warehouse.shipment.confirm
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [warehouseId, doorId, direction, reference, start, end]
              properties:
                warehouseId: { type: string, format: uuid }
                doorId: { type: string, format: uuid }
                direction: { $ref: "#/components/schemas/AppointmentDirection" }
                reference: { type: string, minLength: 1, maxLength: 100, description: The ASN, shipment or load number. }
                start: { type: string, format: date-time }
                end: { type: string, format: date-time }
      responses:
        "201":
          description: Booked (or replayed). Times are returned in UTC.
          headers: { Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      operationId: listDockAppointments
      summary: List a warehouse's appointments overlapping a window, earliest first (at most 500)
      x-passage-duty: warehouse.inquiry.view
      parameters:
        - { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: doorId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, description: Appointments ending after this time; open when absent., schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Appointments starting before this time; open when absent., schema: { type: string, format: date-time } }
      responses:
        "200":
          description: The appointments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Appointment" } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/warehouse/receipts:from-asn:
    post:
      operationId: registerASNReceipt
      summary: Register a receipt from an ASN packing structure (FR-31.9)
      description: >
        Stores the ASN's pallets (one license plate each) as an OPEN receipt with
        every pallet EXPECTED; nothing is put away until a pallet is received.
        The PRD keys this command by the ASN: send the ASN reference as
        Idempotency-Key to make a resend a replay. A second receipt for the same
        ASN in the warehouse under another key is 409 WMS-DUPLICATE.
        tolerancePct is the ASN variance tolerance (default 2, 0–20, BR-31.10).
        weight and volume are for the expected quantity.
      x-passage-duty: warehouse.receipt.register
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [warehouseId, asnRef, lines]
              properties:
                warehouseId: { type: string, format: uuid }
                asnRef: { type: string, minLength: 1, maxLength: 100 }
                tolerancePct: { $ref: "#/components/schemas/Decimal" }
                lines:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    additionalProperties: false
                    required: [lineNo, itemId, expectedQty]
                    properties:
                      lineNo: { type: integer, minimum: 1 }
                      itemId: { type: string, minLength: 1, maxLength: 60 }
                      lpId:
                        type: string
                        pattern: "^[A-Za-z0-9._-]{1,40}$"
                        description: >
                          The pallet's license plate. Left out, the warehouse names it when the pallet is received:
                          the SSCC it generates from the tenant's GS1 company prefix (PUT /v1/warehouse/gs1-settings).
                          An 18-digit SSCC here is also the pallet's SSCC.
                      lot: { type: string, maxLength: 40, description: The lot the label shows; the receive command may replace it. }
                      expiryDate: { type: string, format: date, description: The expiry date the label shows; the receive command may replace it. }
                      poLineRef: { type: string, maxLength: 100 }
                      expectedQty: { $ref: "#/components/schemas/Decimal" }
                      weight: { $ref: "#/components/schemas/Decimal" }
                      volume: { $ref: "#/components/schemas/Decimal" }
      responses:
        "201":
          description: Registered (or replayed).
          headers: { Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/warehouse/receipts:
    get:
      operationId: listReceipts
      summary: List a warehouse's receipts by ASN reference, with pallet counts
      x-passage-duty: warehouse.inquiry.view
      parameters:
        - { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ReceiptStatus" } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of receipts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ReceiptSummary" } }
                  nextCursor: { type: string }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/warehouse/receipts/{id}:
    get:
      operationId: getReceipt
      summary: Read one receipt with its pallets
      x-passage-duty: warehouse.inquiry.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/warehouse/receipts/{id}/lines/{n}:receive:
    post:
      operationId: receiveASNPallet
      summary: Receive one ASN pallet with the quantity that arrived (FR-31.9, BR-31.10)
      description: >
        Records qty on pallet n under a row lock on the receipt. The variance
        (received − ASN, and as a % of the ASN quantity) beyond the receipt's
        tolerance is a discrepancy: the pallet is still received at the actual
        quantity and the answer carries a WMS-0107 warning (AC-31.7). The
        pallet becomes PURCHASE_PUTAWAY work of one LP placed by the
        warehouse's directives (BLOCKED_NO_LOCATION when none places it), with
        the LP id, receipt id and ASN line as line attributes; stock reaches the
        location when the put-away is confirmed. Emits
        dev.passage.wms.work.created.v1 and dev.passage.wms.receipt.registered.v1.
        A pallet already received is 409 WMS-RECEIPT-LINE-RECEIVED. The user is
        X-Passage-User. The warehouse gives the pallet its identity (#32): the
        ASN's license plate stays, an SSCC in it is the pallet's SSCC, and a
        pallet with neither gets the next SSCC of the tenant's GS1 company prefix,
        which is also its license plate id; the put-away work line carries lpId,
        sscc, lot and expiry, so a device prints the label from the work with no
        second scan. 422 WMS-GS1-NOT-SET when it must generate one and no prefix is set.
      x-passage-duty: warehouse.receipt.register
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: false
          description: The receipt version last read, as "3" or 3. A stale version is 409 WMS-VERSION-CONFLICT.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [qty]
              properties:
                qty: { $ref: "#/components/schemas/Decimal" }
      responses:
        "200":
          description: The receipt, the put-away work, its directive trace and any warnings (or replayed).
          headers: { Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" } }
          content:
            application/json:
              schema:
                type: object
                required: [receipt, work, traces, warnings]
                properties:
                  receipt: { $ref: "#/components/schemas/Receipt" }
                  work: { $ref: "#/components/schemas/Work" }
                  traces: { $ref: "#/components/schemas/Planned/properties/traces" }
                  warnings:
                    type: array
                    items:
                      type: object
                      required: [code, detail]
                      properties:
                        code: { type: string, enum: [WMS-0107] }
                        detail: { type: string }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /healthz:
    get:
      operationId: healthz
      responses:
        "200": { description: Process is alive }
  /readyz:
    get:
      operationId: readyz
      responses:
        "200": { description: Process is ready to serve }
  /v1/warehouse/gs1-settings:
    put:
      operationId: putGS1Settings
      summary: Set the GS1 company prefix SSCCs are generated from (#32)
      description: >
        The prefix is 7 to 11 digits, the extension digit 0 to 9. Once SSCCs were issued the prefix cannot change
        (409 WMS-GS1-LOCKED); the extension digit can.
      x-passage-duty: warehouse.setup.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [companyPrefix]
              properties:
                companyPrefix: { type: string, pattern: "^[0-9]{7,11}$" }
                extension: { type: integer, minimum: 0, maximum: 9 }
      responses:
        "200":
          description: The settings.
          content: { application/json: { schema: { $ref: "#/components/schemas/GS1Settings" } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: WMS-GS1-LOCKED }
    get:
      operationId: getGS1Settings
      summary: The GS1 company prefix and how many SSCCs were issued
      x-passage-duty: warehouse.setup.view
      responses:
        "200":
          description: The settings.
          content: { application/json: { schema: { $ref: "#/components/schemas/GS1Settings" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: WMS-GS1-NOT-SET, no prefix is set yet. }
  /v1/warehouse/pallets/{sscc}/label:
    get:
      operationId: getPalletLabel
      summary: What a pallet's label shows, by its SSCC (#32)
      description: >
        The license plate, item, lot and expiry date the receipt holds for the pallet, and the put-away work it created, so
        a device prints the label from the warehouse's own data with no second scan. 404 WMS-PALLET-NOT-FOUND for an SSCC
        that is not a pallet of this tenant.
      x-passage-duty: warehouse.inquiry.view
      parameters:
        - { name: sscc, in: path, required: true, schema: { type: string, pattern: "^[0-9]{18}$" } }
      responses:
        "200":
          description: The label data.
          content:
            application/json:
              schema:
                type: object
                required: [sscc, lpId, itemId, receiptId, lineNo, received]
                properties:
                  sscc: { type: string }
                  lpId: { type: string }
                  itemId: { type: string }
                  lot: { type: string }
                  expiryDate: { type: string, format: date }
                  receiptId: { type: string, format: uuid }
                  lineNo: { type: integer }
                  workId: { type: string, format: uuid }
                  received: { type: boolean }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/warehouse/rfid-reads:ingest:
    post:
      operationId: ingestRFIDReads
      summary: Post the reads of an RFID reader or portal (FR-32.9)
      description: >
        Up to 500 reads. Each EPC (24 hexadecimal characters, 96 bits) is decoded: SGTIN-96, SSCC-96, SGLN-96,
        GRAI-96, GIAI-96, GSRN-96 and GDTI-96. A read that cannot be decoded is listed in `rejected` with its position
        (WMS-EPC-INVALID) and the rest are stored. A tag read again at the same reader within five seconds is counted
        in `duplicates`. A tag that is an SSCC the warehouse labelled names its receipt and pallet.
      x-passage-duty: warehouse.rfid.ingest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reads]
              properties:
                reads:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    additionalProperties: false
                    required: [readerId, epc, readAt]
                    properties:
                      readerId: { type: string, minLength: 1, maxLength: 64 }
                      antenna: { type: integer, minimum: 0, maximum: 255 }
                      locationCode: { type: string, maxLength: 60 }
                      epc: { type: string, pattern: "^[0-9A-Fa-f]{24}$" }
                      rssi: { type: integer, minimum: -200, maximum: 0 }
                      readAt: { type: string, format: date-time }
      responses:
        "200":
          description: What was stored.
          content: { application/json: { schema: { $ref: "#/components/schemas/RFIDIngest" } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/warehouse/rfid-reads:
    get:
      operationId: listRFIDReads
      summary: Stored RFID reads, newest first
      x-passage-duty: warehouse.inquiry.view
      parameters:
        - { name: key, in: query, required: false, description: A GS1 key, an SSCC for example., schema: { type: string } }
        - { name: readerId, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: The reads.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { type: object, additionalProperties: true } } } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/warehouse/automation/transport-orders:
    post:
      operationId: createTransportOrder
      summary: Give one line of a work to a PLC station as a MOVE order (FR-32.12)
      description: >
        The load unit is the line's pallet SSCC (or `loadUnit`). The line has the location it goes to or comes from; the
        other end, the PLC's infeed or outfeed point, is given as `fromLocation` or `toLocation`. Locations are at most
        12 characters, the width of a telegram's field (WMS-AUTO-LOCATION, 422). The work is assigned to the station's
        identity (`automation:<station>`), so the PLC's arrival confirms the line. 409 WMS-AUTO-ORDER-EXISTS when the line
        has an order.
      x-passage-duty: warehouse.work.supervise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workId, lineNo, station]
              properties:
                workId: { type: string, format: uuid }
                lineNo: { type: integer, minimum: 1 }
                station: { type: string, pattern: "^[A-Za-z0-9._-]{1,8}$" }
                loadUnit: { type: string, pattern: "^[0-9]{18}$" }
                fromLocation: { type: string, maxLength: 12 }
                toLocation: { type: string, maxLength: 12 }
      responses:
        "201":
          description: The order, PENDING.
          content: { application/json: { schema: { $ref: "#/components/schemas/AutomationOrder" } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: WMS-AUTO-ORDER-EXISTS, or the work is in a state it cannot be given to a PLC from. }
        "422": { description: WMS-AUTO-LOCATION or WMS-AUTO-LOAD-UNIT. }
    get:
      operationId: listTransportOrders
      summary: Transport orders, oldest first
      description: The connector of a station reads its PENDING orders; people read all of them.
      x-passage-duty: warehouse.inquiry.view or warehouse.automation.execute
      parameters:
        - { name: station, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, SENT, REFUSED, ARRIVED, DIVERTED, FAULT, CANCELLED] } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: The orders.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AutomationOrder" } } } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/warehouse/automation/transport-orders/{id}:report:
    post:
      operationId: reportTransportOrder
      summary: The connector reports a PENDING order sent to the PLC, or refused by it
      description: Repeating the status it has changes nothing. Any other state is 409 WMS-AUTO-ORDER-STATE.
      x-passage-duty: warehouse.automation.execute
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [SENT, REFUSED] }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The order.
          content: { application/json: { schema: { $ref: "#/components/schemas/AutomationOrder" } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: WMS-AUTO-ORDER-NOT-FOUND }
        "409": { description: WMS-AUTO-ORDER-STATE }
  /v1/warehouse/automation/events:
    post:
      operationId: ingestAutomationEvents
      summary: The PLC's events: arrived, diverted, fault (FR-32.12)
      description: >
        Each event is stored once by station and sequence, so a telegram the PLC repeats is a duplicate. An arrival of a
        load unit with an order SENT to the station marks the order ARRIVED and confirms its work line as the station's
        identity, so the stock moves; `confirmed` counts those. A confirmation that fails leaves the order ARRIVED with
        the reason in `confirmError`.
      x-passage-duty: warehouse.automation.execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [station, events]
              properties:
                station: { type: string, pattern: "^[A-Za-z0-9._-]{1,8}$" }
                events:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, seq, at]
                    properties:
                      kind: { type: string, enum: [arrived, diverted, fault] }
                      seq: { type: integer, minimum: 0 }
                      loadUnit: { type: string, pattern: "^[0-9]{18}$" }
                      location: { type: string }
                      lane: { type: string }
                      code: { type: string }
                      text: { type: string }
                      at: { type: string, format: date-time }
      responses:
        "200":
          description: What was stored and confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates, confirmed, unmatched]
                properties:
                  accepted: { type: integer }
                  duplicates: { type: integer }
                  confirmed: { type: integer }
                  unmatched: { type: integer }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One key per user action, at most 200 characters, kept 24 hours.
      schema: { type: string, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The work version last read, as "3" or 3. A stale version is 409 WMS-VERSION-CONFLICT.
      schema: { type: string }
    WorkId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: nextCursor of the previous page.
      schema: { type: string }
  headers:
    IdempotentReplayed:
      description: true when the answer is the stored answer of an earlier request with the same key.
      schema: { type: string, enum: ["true"] }
  responses:
    Validation:
      description: Validation failed (COM-0001); errors names the fields, including Idempotency-Key and X-Passage-User.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: No tenant, or a tenant that is not a UUID (AUTH-0001).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Missing duty (AUTH-0003), or the work is assigned to another user (WMS-NOT-ASSIGNEE).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: >
        No such work (WMS-WORK-NOT-FOUND), receipt (WMS-RECEIPT-NOT-FOUND),
        dock door in the warehouse (WMS-DOOR-NOT-FOUND), or work or receipt
        line (WMS-LINE-NOT-FOUND) in the tenant.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: >
        WMS-DUPLICATE (location name, directive sequence, door code or ASN
        reference taken), WMS-0105 (line already confirmed with another key),
        WMS-0108 (door already booked for an overlapping window),
        WMS-RECEIPT-LINE-RECEIVED (pallet already received), WMS-0110 (illegal
        work or line transition, or a blocked location status at confirmation)
        or WMS-VERSION-CONFLICT (stale If-Match).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: >
        idempotency_key_reuse (key used for another request), WMS-0101 (line
        without location), WMS-0102 (capacity), WMS-0103 (mixed items) or
        WMS-0106 (over-pick).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    GS1Settings:
      type: object
      required: [companyPrefix, extension, nextSerial, issued, updatedBy, updatedAt]
      properties:
        companyPrefix: { type: string }
        extension: { type: integer }
        nextSerial: { type: integer, format: int64 }
        issued: { type: integer, format: int64, description: How many SSCCs were issued. }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    RFIDIngest:
      type: object
      required: [accepted, duplicates, rejected, reads]
      properties:
        accepted: { type: integer }
        duplicates: { type: integer }
        rejected:
          type: array
          items:
            type: object
            required: [index, code, reason]
            properties:
              index: { type: integer }
              code: { type: string }
              reason: { type: string }
        reads:
          type: array
          items:
            type: object
            required: [index, id, epc]
            properties:
              index: { type: integer }
              id: { type: string, format: uuid }
              epc: { type: object, additionalProperties: true }
              receiptId: { type: string, format: uuid }
              lineNo: { type: integer }
    AutomationOrder:
      type: object
      required: [id, workId, lineNo, station, loadUnit, fromLocation, toLocation, priority, status, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        workId: { type: string, format: uuid }
        lineNo: { type: integer }
        station: { type: string }
        loadUnit: { type: string }
        fromLocation: { type: string }
        toLocation: { type: string }
        priority: { type: integer, minimum: 1, maximum: 9 }
        status: { type: string, enum: [PENDING, SENT, REFUSED, ARRIVED, DIVERTED, FAULT, CANCELLED] }
        reason: { type: string }
        confirmError: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
        doneAt: { type: string, format: date-time }
    WorkType:
      type: string
      enum: [PURCHASE_PUTAWAY, SALES_PICK, TRANSFER_ISSUE, TRANSFER_RECEIPT, PRODUCTION_PICK, RAF_PUTAWAY, REPLENISHMENT, MOVEMENT, COUNT, RETURN]
    WorkStatus:
      type: string
      enum: [OPEN, ASSIGNED, IN_PROGRESS, COMPLETED, PARTIALLY_COMPLETED, CANCELLED, BLOCKED_NO_LOCATION, WAITING]
    LocationInput:
      type: object
      additionalProperties: false
      required: [name, zone]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, examples: [A-01-02-03] }
        zone: { type: string, minLength: 1, maxLength: 40 }
        pickSequence: { type: integer, minimum: 0 }
        status: { type: string, enum: [ACTIVE, BLOCKED_IN, BLOCKED_OUT, BLOCKED, INACTIVE], default: ACTIVE }
        capacity: { $ref: "#/components/schemas/Capacity" }
        fireSection: { type: string }
        rackGroup: { type: string }
        allowedStorageClasses: { type: array, items: { type: string, minLength: 1 } }
    LocationsRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, locations]
      properties:
        warehouseId: { type: string, format: uuid }
        locations:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/LocationInput" }
    LocationPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Location" } }
        nextCursor: { type: string }
    Capacity:
      type: object
      additionalProperties: false
      description: A missing limit is unlimited.
      properties:
        maxWeight: { $ref: "#/components/schemas/Decimal" }
        maxVolume: { $ref: "#/components/schemas/Decimal" }
        maxLps: { type: integer, minimum: 0 }
        maxItems: { type: integer, minimum: 0 }
        allowMixedItems: { type: boolean }
    DirectiveInput:
      type: object
      additionalProperties: false
      required: [warehouseId, sequence, workType, direction, lines]
      properties:
        warehouseId: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        workType: { $ref: "#/components/schemas/WorkType" }
        direction: { type: string, enum: [PUT, PICK] }
        query: { type: object, additionalProperties: { type: string } }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Band" }
    WorkLineInput:
      type: object
      additionalProperties: false
      required: [itemId, direction, qty]
      properties:
        itemId: { type: string, minLength: 1, maxLength: 60 }
        direction: { type: string, enum: [PUT, PICK] }
        qty: { $ref: "#/components/schemas/Decimal" }
        weight: { $ref: "#/components/schemas/Decimal" }
        volume: { $ref: "#/components/schemas/Decimal" }
        lps: { type: integer, minimum: 0 }
        attributes:
          type: object
          additionalProperties: { type: string }
          description: >-
            Free-form line attributes. `batch` names the lot a PICK takes; `issueRef` names the document line the
            pick serves (`SALES_LINE:<order line id>` or `PRODUCTION_ORDER:<order id>:<item id>`), so inventory
            counts the pick and the later ship or consumption of the same units once while a quality hold exists.
        orderLineId:
          type: string
          format: uuid
          description: >-
            PICK only: the sales order line the pick serves. It sets the `issueRef` attribute to `SALES_LINE:<id>`,
            the ref of fulfillment's ship claim and of the line's DELIVERED booking, so the delivery settles the pick
            and the ship together. Not together with `issueRef`. A pick with neither has no ref, no issue settles it, and it is released
            explicitly at inventory. An `issueRef` attribute must be canonical (`SALES_LINE:<lower-case uuid>` or
            `PRODUCTION_ORDER:<uuid>:<uuid>`).
    WorkRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, workType, lines]
      properties:
        warehouseId: { type: string, format: uuid }
        workType: { $ref: "#/components/schemas/WorkType" }
        priority: { type: integer, minimum: 1, maximum: 99, description: "1 is the highest; default 50." }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/WorkLineInput" }
    WorkLine:
      type: object
      required: [lineNo, itemId, direction, qty, confirmedQty, weight, volume, lps, status]
      properties:
        lineNo: { type: integer }
        itemId: { type: string }
        direction: { type: string, enum: [PUT, PICK] }
        qty: { $ref: "#/components/schemas/Decimal" }
        confirmedQty: { $ref: "#/components/schemas/Decimal" }
        weight: { $ref: "#/components/schemas/Decimal" }
        volume: { $ref: "#/components/schemas/Decimal" }
        lps: { type: integer }
        fromLocationId: { type: string, format: uuid, description: "Source of a PICK line." }
        toLocationId: { type: string, format: uuid, description: "Destination of a PUT line." }
        status: { type: string, enum: [OPEN, COMPLETED, SHORT, CANCELLED] }
        reason: { type: string, description: "WMS-0101 on a blocked line; the short-pick or cancel reason otherwise." }
        attributes: { type: object, additionalProperties: { type: string } }
    Work:
      type: object
      required: [id, warehouseId, workType, status, priority, version, createdAt, updatedAt, lines]
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        workType: { $ref: "#/components/schemas/WorkType" }
        status: { $ref: "#/components/schemas/WorkStatus" }
        priority: { type: integer, minimum: 1, maximum: 99 }
        parentWorkId: { type: string, format: uuid }
        assignedUser: { type: string }
        assignedAt: { type: string, format: date-time }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lines: { type: array, items: { $ref: "#/components/schemas/WorkLine" } }
    WorkPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Work" } }
        nextCursor: { type: string }
    Planned:
      type: object
      required: [work, traces]
      properties:
        work: { $ref: "#/components/schemas/Work" }
        traces:
          type: array
          items:
            type: object
            required: [blocked, trace]
            properties:
              directive: { type: string }
              blocked: { type: boolean }
              code: { type: string }
              trace: { type: array, items: { $ref: "#/components/schemas/Step" } }
    Step:
      type: object
      required: [directive, outcome, reason]
      properties:
        directive: { type: string }
        band: { type: integer }
        action: { type: integer }
        outcome: { type: string, enum: [hit, miss, skip] }
        reason: { type: string }
    DockDoor:
      type: object
      required: [id, warehouseId, code, createdAt]
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        code: { type: string }
        createdAt: { type: string, format: date-time }
    AppointmentDirection:
      type: string
      enum: [INBOUND, OUTBOUND]
    Appointment:
      type: object
      required: [id, warehouseId, doorId, doorCode, direction, reference, start, end, createdAt]
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        doorId: { type: string, format: uuid }
        doorCode: { type: string }
        direction: { $ref: "#/components/schemas/AppointmentDirection" }
        reference: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ReceiptStatus:
      type: string
      enum: [OPEN, PARTIALLY_RECEIVED, RECEIVED]
    ReceiptLine:
      type: object
      required: [lineNo, itemId, lpId, expectedQty, weight, volume, status, receivedQty, varianceQty, variancePct, discrepancy]
      properties:
        lineNo: { type: integer }
        itemId: { type: string }
        lpId: { type: string, description: The ASN's license plate, or the SSCC the warehouse generated when the pallet was received. }
        sscc: { type: string, pattern: "^[0-9]{18}$", description: The pallet's SSCC; empty while the pallet has none (not received, no GS1 prefix set, a non-SSCC license plate). }
        lot: { type: string }
        expiryDate: { type: string, format: date }
        poLineRef: { type: string }
        expectedQty: { $ref: "#/components/schemas/Decimal" }
        weight: { $ref: "#/components/schemas/Decimal" }
        volume: { $ref: "#/components/schemas/Decimal" }
        status: { type: string, enum: [EXPECTED, RECEIVED] }
        receivedQty: { $ref: "#/components/schemas/Decimal" }
        varianceQty: { $ref: "#/components/schemas/Decimal" }
        variancePct: { $ref: "#/components/schemas/Decimal" }
        discrepancy: { type: boolean, description: The variance is beyond the receipt's tolerance (BR-31.10). }
        reason: { type: string, description: The WMS-0107 text of a discrepancy. }
        workId: { type: string, format: uuid }
        receivedBy: { type: string }
        receivedAt: { type: string, format: date-time }
    Receipt:
      type: object
      required: [id, warehouseId, asnRef, tolerancePct, status, version, createdAt, updatedAt, lines]
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        asnRef: { type: string }
        tolerancePct: { $ref: "#/components/schemas/Decimal" }
        status: { $ref: "#/components/schemas/ReceiptStatus" }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lines: { type: array, items: { $ref: "#/components/schemas/ReceiptLine" } }
    ReceiptSummary:
      type: object
      required: [id, warehouseId, asnRef, tolerancePct, status, lines, received, discrepancies, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        asnRef: { type: string }
        tolerancePct: { $ref: "#/components/schemas/Decimal" }
        status: { $ref: "#/components/schemas/ReceiptStatus" }
        lines: { type: integer, description: Pallets on the ASN. }
        received: { type: integer, description: Pallets received. }
        discrepancies: { type: integer, description: Received pallets outside tolerance. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Decimal:
      type: string
      description: Decimal as a string, never a float.
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    SimulateRequest:
      type: object
      additionalProperties: false
      required: [line, directives, locations]
      properties:
        line: { $ref: "#/components/schemas/Line" }
        directives:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/Directive" }
        locations:
          type: array
          maxItems: 50000
          items: { $ref: "#/components/schemas/Location" }
        compliance: { $ref: "#/components/schemas/Compliance" }
    Compliance:
      type: object
      description: >
        Hazmat reference data (BR-31.15). Pairs without an entry are allowed.
        Invalid data is a 400 on field compliance.
      additionalProperties: false
      properties:
        hazmatProfiles:
          type: array
          items: { $ref: "#/components/schemas/HazmatProfile" }
        segregation:
          type: array
          items: { $ref: "#/components/schemas/SegregationPair" }
        sectionLimitsKg:
          type: object
          description: >
            Section quantity limit in kg per fire-containment section. The
            section quantity is the used weight of its locations that hold an
            item with a hazmat profile.
          additionalProperties: { $ref: "#/components/schemas/Decimal" }
    HazmatProfile:
      type: object
      additionalProperties: false
      required: [itemId, storageClass]
      properties:
        itemId: { type: string }
        unNumber: { type: string, pattern: "^UN[0-9]{4}$" }
        shippingName: { type: string }
        class: { type: string }
        division: { type: string }
        packingGroup: { type: string }
        storageClass: { type: string, examples: ["3", "5.1"] }
        waterHazardClass: { type: string }
        flashPointC: { $ref: "#/components/schemas/Decimal" }
        netExplosiveMassKg: { $ref: "#/components/schemas/Decimal" }
    SegregationPair:
      type: object
      additionalProperties: false
      required: [a, b, rel]
      properties:
        a: { type: string }
        b: { type: string }
        rel: { type: string, enum: [allowed, separate, prohibited] }
    Line:
      type: object
      additionalProperties: false
      required: [itemId, workType, direction, warehouseId, qty]
      properties:
        itemId: { type: string }
        workType: { type: string, examples: [PURCHASE_PUTAWAY, SALES_PICK] }
        direction: { type: string, enum: [PUT, PICK] }
        warehouseId: { type: string, format: uuid }
        qty: { $ref: "#/components/schemas/Decimal" }
        weight: { $ref: "#/components/schemas/Decimal" }
        volume: { $ref: "#/components/schemas/Decimal" }
        lps: { type: integer, minimum: 0 }
        attributes: { type: object, additionalProperties: { type: string } }
    Directive:
      type: object
      additionalProperties: false
      description: A directive as the simulation takes it and the directive routes return it.
      required: [id, sequence, workType, direction, warehouseId, lines]
      properties:
        id: { type: string }
        sequence: { type: integer }
        workType: { type: string }
        direction: { type: string, enum: [PUT, PICK] }
        warehouseId: { type: string, format: uuid }
        query: { type: object, additionalProperties: { type: string } }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Band" }
    Band:
      type: object
      additionalProperties: false
      required: [seq, fromQty, actions]
      properties:
        seq: { type: integer }
        fromQty: { $ref: "#/components/schemas/Decimal" }
        toQty: { $ref: "#/components/schemas/Decimal" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/Action" }
    Action:
      type: object
      additionalProperties: false
      required: [seq, strategy]
      properties:
        seq: { type: integer }
        strategy:
          type: string
          enum: [consolidate, fifo, lifo, fefo, empty_location, match_packing_quantity, round_up_to_lp, outbound_staging]
        zone: { type: string }
    Location:
      type: object
      additionalProperties: false
      required: [id, name, zone, status]
      properties:
        id: { type: string }
        name: { type: string }
        zone: { type: string }
        pickSequence: { type: integer }
        status:
          type: string
          enum: [ACTIVE, BLOCKED_IN, BLOCKED_OUT, BLOCKED, INACTIVE]
        capacity:
          type: object
          additionalProperties: false
          properties:
            maxWeight: { $ref: "#/components/schemas/Decimal" }
            maxVolume: { $ref: "#/components/schemas/Decimal" }
            maxLps: { type: integer, minimum: 0 }
            maxItems: { type: integer, minimum: 0 }
            allowMixedItems: { type: boolean }
        used:
          type: object
          additionalProperties: false
          description: Current weight, volume and LP count. The item count is derived from stock.
          properties:
            weight: { $ref: "#/components/schemas/Decimal" }
            volume: { $ref: "#/components/schemas/Decimal" }
            lps: { type: integer, minimum: 0 }
        stock:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Decimal" }
        fireSection: { type: string, description: "Fire-containment section (FR-31.19); empty means none." }
        rackGroup: { type: string, description: "Location group that separate segregation compares." }
        allowedStorageClasses:
          type: array
          description: Storage classes a hazmat item may have here; empty allows any.
          items: { type: string, minLength: 1 }
        version: { type: integer, readOnly: true, description: "Stored version of a persisted location; ignored by the simulation." }
    SimulateResponse:
      type: object
      required: [blocked, trace]
      properties:
        blocked: { type: boolean }
        code: { type: string, description: "WMS-0101 when blocked" }
        locationId: { type: string }
        location: { type: string }
        directive: { type: string }
        trace:
          type: array
          items:
            type: object
            required: [directive, outcome, reason]
            properties:
              directive: { type: string }
              band: { type: integer }
              action: { type: integer }
              outcome: { type: string, enum: [hit, miss, skip] }
              reason: { type: string }
    Problem:
      type: object
      description: RFC 9457 problem details with a stable code.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
