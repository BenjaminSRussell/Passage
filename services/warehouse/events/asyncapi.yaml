asyncapi: 3.0.0
info:
  title: Passage warehouse events (wave 31, slice 4)
  version: 0.4.0
  description: >
    Work and receipt events, written to the outbox in the same transaction as
    the change and relayed by Debezium as CloudEvents 1.0 (source "warehouse",
    subject = work or receipt id, Kafka key = that id). Payload fields are
    snake_case and quantities are decimal strings. wave.released.v1 and
    load.shipped.v1 arrive with waves and loads in later slices. shipment.shipped is consumed by the EDI engine.
defaultContentType: application/json
channels:
  wmsWork:
    address: passage.wms.work
    description: Topic of every work event (platform events.Topic).
    messages:
      workCreated: { $ref: "#/components/messages/workCreated" }
      workCompleted: { $ref: "#/components/messages/workCompleted" }
      workReleased: { $ref: "#/components/messages/workReleased" }
  wmsReceipt:
    address: passage.wms.receipt
    description: Topic of every receipt event (platform events.Topic).
    messages:
      receiptRegistered: { $ref: "#/components/messages/receiptRegistered" }
  wmsShipment:
    address: passage.wms.shipment
    description: Topic of the shipment events (platform events.Topic); the EDI engine's outbound consumer reads it.
    messages:
      shipmentShipped: { $ref: "#/components/messages/shipmentShipped" }
operations:
  publishWorkCreated:
    action: send
    channel: { $ref: "#/channels/wmsWork" }
    messages: [{ $ref: "#/channels/wmsWork/messages/workCreated" }]
  publishWorkCompleted:
    action: send
    channel: { $ref: "#/channels/wmsWork" }
    messages: [{ $ref: "#/channels/wmsWork/messages/workCompleted" }]
  publishWorkReleased:
    action: send
    channel: { $ref: "#/channels/wmsWork" }
    messages: [{ $ref: "#/channels/wmsWork/messages/workReleased" }]
  publishReceiptRegistered:
    action: send
    channel: { $ref: "#/channels/wmsReceipt" }
    messages: [{ $ref: "#/channels/wmsReceipt/messages/receiptRegistered" }]
  publishShipmentShipped:
    action: send
    channel: { $ref: "#/channels/wmsShipment" }
    messages: [{ $ref: "#/channels/wmsShipment/messages/shipmentShipped" }]
components:
  messages:
    shipmentShipped:
      name: dev.passage.wms.shipment.shipped.v1
      title: Shipment shipped
      summary: >
        The warehouse confirmed that a fulfillment shipment left the dock
        without a packing slip posted for it (POST
        /v1/warehouse/shipments/{id}:ship). Subject and Kafka key are the
        shipment id. Consumer: the EDI engine (edi-outbound), which sends the
        whole shipment's 856 or DESADV (#35, 35-1).
      payload: { $ref: "#/components/schemas/ShipmentShipped" }
    workCreated:
      name: dev.passage.wms.work.created.v1
      title: Work created
      summary: >
        A work header was committed: by POST /v1/warehouse/work, or as the OPEN
        remainder of a short pick (parent_work_id set). Consumers: wms-mobile,
        analytics.
      payload: { $ref: "#/components/schemas/WorkCreated" }
    workCompleted:
      name: dev.passage.wms.work.completed.v1
      title: Work completed
      summary: >
        The last open line was confirmed or short picked: status COMPLETED or
        PARTIALLY_COMPLETED. confirmed_qty per line is what moved. Consumers:
        inventory (post the transfer), sales fulfillment, production.
      payload: { $ref: "#/components/schemas/WorkCompleted" }
    workReleased:
      name: dev.passage.wms.work.released.v1
      title: Work released
      summary: >
        A WAITING work (a pick that needs a refill) became OPEN because the
        refill it waited for was completed or cancelled. A short-picked refill
        passes the wait on to its remainder work instead. Consumers: wms-mobile.
      payload: { $ref: "#/components/schemas/WorkReleased" }
    receiptRegistered:
      name: dev.passage.wms.receipt.registered.v1
      title: Receipt registered
      summary: >
        One ASN pallet (license plate) was received by
        POST /v1/warehouse/receipts/{id}/lines/{n}:receive, committed with its
        PURCHASE_PUTAWAY work. One event per pallet; items[].qty is what
        arrived, and the variance is against the ASN quantity (BR-31.10,
        discrepancy true beyond the receipt's tolerance). Consumers: purchasing
        (PO receipt), quality.
      payload: { $ref: "#/components/schemas/ReceiptRegistered" }
  schemas:
    ShipmentShipped:
      type: object
      required: [shipment_id, legal_entity_id, warehouse_id, shipped_at, containers, user]
      properties:
        shipment_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        carrier_code: { type: string, description: The carrier's SCAC, when known. }
        shipped_at: { type: string, format: date-time }
        containers:
          type: array
          description: The containers that left; empty means every closed container of the shipment.
          items:
            type: object
            required: [sscc]
            properties:
              sscc: { type: string, pattern: "^[0-9]{18}$" }
        user: { type: string }
    Decimal:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    Line:
      type: object
      required: [line_no, item_id, direction, qty, confirmed_qty, status]
      properties:
        line_no: { type: integer }
        item_id: { type: string }
        direction: { type: string, enum: [PUT, PICK] }
        qty: { $ref: "#/components/schemas/Decimal" }
        confirmed_qty: { $ref: "#/components/schemas/Decimal" }
        status: { type: string, enum: [OPEN, COMPLETED, SHORT, CANCELLED] }
        from_location_id: { type: string, format: uuid }
        to_location_id: { type: string, format: uuid }
    WorkCreated:
      type: object
      required: [work_id, work_type, warehouse_id, priority, status, lines]
      properties:
        work_id: { type: string, format: uuid }
        work_type: { type: string }
        warehouse_id: { type: string, format: uuid }
        priority: { type: integer, minimum: 1, maximum: 99 }
        status: { type: string, enum: [OPEN, BLOCKED_NO_LOCATION, WAITING] }
        parent_work_id: { type: string, format: uuid }
        lines: { type: array, items: { $ref: "#/components/schemas/Line" } }
    WorkCompleted:
      type: object
      required: [work_id, work_type, warehouse_id, status, user, duration_s, lines]
      properties:
        work_id: { type: string, format: uuid }
        work_type: { type: string }
        warehouse_id: { type: string, format: uuid }
        status: { type: string, enum: [COMPLETED, PARTIALLY_COMPLETED] }
        user: { type: string }
        duration_s: { type: integer, description: Seconds from assignment to the last confirmation. }
        lines: { type: array, items: { $ref: "#/components/schemas/Line" } }
    WorkReleased:
      type: object
      required: [work_id, warehouse_id, after_work_id, after_status]
      properties:
        work_id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        after_work_id: { type: string, format: uuid, description: The refill work whose end released this work. }
        after_status: { type: string, enum: [COMPLETED, CANCELLED] }
    ItemQty:
      type: object
      required: [item_id, qty]
      properties:
        item_id: { type: string }
        qty: { $ref: "#/components/schemas/Decimal" }
    ReceiptRegistered:
      type: object
      required: [receipt_id, warehouse_id, asn_ref, line_no, po_line_refs, lp_ids, items, expected_qty, variance_qty, variance_pct, discrepancy, work_id, user]
      properties:
        receipt_id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        asn_ref: { type: string }
        line_no: { type: integer, description: The ASN line (pallet) received. }
        po_line_refs: { type: array, items: { type: string }, description: Purchase order line references of the pallet; empty when the ASN gave none. }
        lp_ids: { type: array, items: { type: string, maxLength: 40 } }
        items: { type: array, items: { $ref: "#/components/schemas/ItemQty" } }
        expected_qty: { $ref: "#/components/schemas/Decimal" }
        variance_qty: { $ref: "#/components/schemas/Decimal" }
        variance_pct: { $ref: "#/components/schemas/Decimal" }
        discrepancy: { type: boolean }
        work_id: { type: string, format: uuid, description: The put-away work created for the pallet. }
        user: { type: string }
