  /v1/service/work-orders/{id}:assign:
    post:
      operationId: assignWorkOrder
      summary: Give a work order to a technician at a start time and make it SCHEDULED (FR-45.7, BR-45.3)
      description: |
        The end follows from the estimated duration. Every broken hard constraint is returned together in
        `errors`, keyed by code (SVC-DSP-003 skills, 004 technician not eligible, 005 customer window,
        006 shift, 007 overlap or buffer, 008 daily load); `code` is the first of them. An UNSCHEDULED or
        SCHEDULED order can be assigned or moved; a dispatched one cannot. Writes
        dev.passage.service.assignment.changed.v1.
      x-passage-duty: fieldservice.technician.dispatch
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignRequest" }
      responses:
