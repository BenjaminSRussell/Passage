  /v1/cases/{id}/stage:
    post:
      operationId: advanceCaseStage
      summary: Move an OPEN case to the next stage of its process, or back one stage with a reason (BR-45.9, AC-45.10)
      description: |
        Moving forward requires every required activity of the current stage to be DONE
        on the case (an activity whose associations hold {entityType case, entityId the
        case id} and whose subject equals the template), else CASE-STG-001 naming the
        missing activities. Any other target is CASE-STG-002. Emits
        dev.passage.case.stage.changed.v1 in the same transaction.
      x-passage-duty: CaseMaintain
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toStage]
              additionalProperties: false
              properties:
                toStage: { type: string, pattern: "^[A-Z0-9_-]{2,40}$" }
                reason: { type: string, maxLength: 500, description: Required to move back one stage. }
      responses:
        "200":
          description: Moved (a replay carries Idempotent-Replayed true)
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericCase" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/cases/{id}:transition:
    post:
      operationId: transitionGenericCase
      summary: Resolve (with a resolution code), close or cancel a case (BR-45.9)
      description: |
        OPEN to RESOLVED (resolutionCode required, from the category's list when it has
        one: CASE-RES-001, CASE-RES-002) or CANCELED; RESOLVED to CLOSED. CLOSED and
        CANCELED are final; see :reopen.
      x-passage-duty: CaseMaintain
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              additionalProperties: false
              properties:
                to: { type: string, enum: [RESOLVED, CLOSED, CANCELED] }
                resolutionCode: { type: string, pattern: "^[A-Z0-9_-]{2,40}$" }
                resolutionText: { type: string, maxLength: 4000 }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Transitioned (a replay carries Idempotent-Replayed true)
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericCase" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/cases/{id}:reopen:
    post:
      operationId: reopenGenericCase
      summary: Reopen a RESOLVED or CLOSED case (BR-45.9)
      description: |
        Within the category's reopen window (days since resolution; default 14, 0
        disables it) the case itself returns to OPEN at its stage with its resolution
        cleared (200). After the window a new OPEN case is created at the first stage,
        linked by reopenedFrom and carrying the original's associations (201).
      x-passage-duty: CaseMaintain
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: The case reopened itself (or a replay, with Idempotent-Replayed true)
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReopenResult" }
        "201":
          description: A new case linked by reopenedFrom; ETag is the new case's version
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReopenResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/cases/{id}/associations:
    post:
      operationId: associateCase
      summary: Associate any registry record with a case that is not CLOSED or CANCELED (FR-45.12)
      description: Associating the same record again replaces its role. The case version moves; no If-Match is needed (PRD 8.45.5).
      x-passage-duty: CaseMaintain
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseAssociation" }
      responses:
        "200":
          description: The case with its associations (a replay carries Idempotent-Replayed true)
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericCase" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/service/supplier-claims:
    post:
      operationId: createSupplierClaim
      summary: Draft a supplier warranty claim (FR-45.15, BR-45.12)
      description: |
        A SERVICE_WO claim names POSTED work orders and gets one line per order from its WARRANTY lines: the
        warranty cost of its part lines and the hours of its labor lines, with the item and serial of the
        case's service object. Legal entity, currency and the completion date (the earliest of the orders)
        come from the orders. An EAM_WO claim (standing in for the wave-44 `eam.warranty.claimable.v1`
        consumer) carries one line per source and its legal entity, currency and completion date. Each line
        claims partAmount + laborHours × laborRate, rounded half-even to the currency (laborRate 0 when the
        vendor does not cover labor). A work order is claimed once (SVC-SWC-009).
      x-passage-duty: SvcClaimMaintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendorPartyId, sourceKind, sourceIds]
              properties:
                vendorPartyId: { type: string, format: uuid }
                sourceKind: { type: string, enum: [SERVICE_WO, EAM_WO] }
                sourceIds: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid } }
                laborRate: { type: string, description: "Vendor labor rate per hour as a decimal string; default 0", example: "60.00" }
                failureCode: { type: string, maxLength: 40 }
                windowDays: { type: integer, minimum: 1, maximum: 365, default: 30 }
                returnRequired: { type: boolean, default: false, description: The vendor requires the failed part back before submission. }
                legalEntityId: { type: string, format: uuid, description: EAM_WO only. }
                currency: { type: string, pattern: "^[A-Z]{3}$", description: EAM_WO only. }
                completedOn: { type: string, format: date, description: EAM_WO only. }
                lines:
                  type: array
                  description: EAM_WO only; one per source id, in order.
                  items:
                    type: object
                    required: [itemId]
                    properties:
                      itemId: { type: string, format: uuid }
                      serial: { type: string, maxLength: 100 }
                      failureCode: { type: string, maxLength: 40 }
                      partAmount: { type: string }
                      laborHours: { type: string }
      responses:
        "201":
          description: The DRAFT claim
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierClaim" }
        "200": { $ref: "#/components/responses/Replayed" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listSupplierClaims
      summary: List supplier claims newest first
      x-passage-duty: SvcClaimMaintain or SvcInquire
      parameters:
        - { name: vendorPartyId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, SUBMITTED, ACCEPTED, PARTIALLY_ACCEPTED, REJECTED, SETTLED, CLOSED] } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SupplierClaim" } }
                  nextCursor: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/service/supplier-claims/{id}:
    get:
      operationId: getSupplierClaim
      summary: Read one supplier claim; ETag carries its version
      x-passage-duty: SvcClaimMaintain or SvcInquire
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The claim
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierClaim" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/service/supplier-claims/{id}:submit:
    post:
      operationId: submitSupplierClaim
      summary: Submit a DRAFT claim to the vendor today (BR-45.12)
      description: Refused after the vendor's claim window (SVC-SWC-001) and, when the vendor requires the failed part back, without a return order (SVC-SWC-002).
      x-passage-duty: SvcClaimMaintain
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vendorReference: { type: string, maxLength: 100 }
                returnOrderId: { type: string, maxLength: 100, description: The wave-30/17 vendor return of the failed part. }
      responses:
        "200": { $ref: "#/components/responses/ClaimMoved" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/service/supplier-claims/{id}/decision:
    post:
      operationId: decideSupplierClaim
      summary: Record the vendor decision on a SUBMITTED claim (BR-45.12)
      description: |
        ACCEPTED accepts every line in full (acceptedAmounts may be omitted); PARTIALLY_ACCEPTED needs one
        amount per line totalling more than zero and less than the claim; REJECTED needs a reason and
        accepts nothing. No line accepts more than it claimed (SVC-SWC-003).
      x-passage-duty: SvcClaimMaintain
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [ACCEPTED, PARTIALLY_ACCEPTED, REJECTED] }
                reason: { type: string, maxLength: 500 }
                vendorReference: { type: string, maxLength: 100 }
                acceptedAmounts: { type: array, items: { type: string }, description: One decimal string per claim line, in order. }
      responses:
        "200": { $ref: "#/components/responses/ClaimMoved" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/service/supplier-claims/{id}:settle:
    post:
      operationId: settleSupplierClaim
      summary: Match the vendor credit note to an accepted claim (BR-45.12, AC-45.13)
      description: |
        The credit note quotes the claim's vendor reference (SVC-SWC-010) and credits exactly the accepted
        total in the claim currency (SVC-SWC-005). The claim becomes SETTLED with the credit as the recovered
        amount, and `dev.passage.service.supplierclaim.settled.v1` goes to the outbox for the GL warranty
        recovery.
      x-passage-duty: SvcClaimMaintain
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creditNoteId, vendorReference, amount, currency]
              properties:
                creditNoteId: { type: string, maxLength: 100, description: The wave-18 vendor credit note. }
                vendorReference: { type: string, maxLength: 100 }
                amount: { type: string, example: "250.00" }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
      responses:
        "200": { $ref: "#/components/responses/ClaimMoved" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/service/supplier-claims/{id}:close:
    post:
      operationId: closeSupplierClaim
      summary: Close a REJECTED (with its reason, no posting) or SETTLED claim
      x-passage-duty: SvcClaimMaintain
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/ClaimMoved" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/case-mailboxes:
    post:
      operationId: upsertCaseMailbox
      summary: Set the legal entity and default category of a case mailbox (BR-45.13)
      description: |
        The lower-cased address is the natural key, so the call is idempotent without an Idempotency-Key.
        The default category cannot be SERVICE or CUSTOMER_SERVICE (CASE-CAT-002) or require a customer
        (COLLECTIONS, CASE-MAIL-003).
      x-passage-duty: CaseSetupAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, legalEntityId, categoryId]
              properties:
                address: { type: string, format: email, maxLength: 320 }
                legalEntityId: { type: string, format: uuid }
                categoryId: { type: string, format: uuid }
      responses:
        "201":
          description: A new mailbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseMailbox" }
        "200":
          description: The mailbox was updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseMailbox" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listCaseMailboxes
      summary: List the case mailboxes by address
      x-passage-duty: CaseMaintain, CaseCreate or CaseSetupAdmin
      responses:
        "200":
          description: Every mailbox in the caller's legal-entity scope
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CaseMailbox" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/inbound-messages:
    post:
      operationId: ingestInboundMessage
      summary: Record one inbound email from the integration hub and thread it onto a case (FR-45.16, BR-45.13)
      description: |
        The message is attached to the case a `[CS-n]` subject token names (with or without the zero padding)
        or, failing that, the case holding the message In-Reply-To names, unless that case is CLOSED or
        CANCELED: then a new case continues it, linked by reopenedFrom. Otherwise a new case is opened in the
        mailbox's default category, the caller owning it. A case the caller may not access (BR-45.10) is not
        matched. A new case answers 201 with `acknowledge` true unless the mail is an auto-reply
        (Auto-Submitted other than "no", or X-Autoreply); the hub sends the acknowledgment. An attached
        message answers 200 with the info message CASE-MAIL-001. The Message-ID is the idempotency key: a
        redelivery answers 200 with Idempotent-Replayed true and the stored result.
      x-passage-duty: CaseCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailbox, messageId, fromAddress, receivedAt]
              properties:
                mailbox: { type: string, format: email }
                messageId: { type: string, maxLength: 998 }
                inReplyTo: { type: string, maxLength: 998 }
                fromAddress: { type: string, format: email }
                subject: { type: string, maxLength: 998 }
                body: { type: string, maxLength: 100000, description: Plain-text body; the first 4000 characters describe a new case. }
                receivedAt: { type: string, format: date-time }
                customerPartyId: { type: string, format: uuid, description: The sender's party when the hub matched it to a contact. }
                attachments: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/MailAttachment" } }
                autoSubmitted: { type: string, maxLength: 100, description: The Auto-Submitted header (RFC 3834). }
                xAutoreply: { type: boolean, description: An X-Autoreply header was present. }
      responses:
        "201":
          description: A new case was opened for the message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboundResult" }
        "200":
          description: The message was attached to an open case (message CASE-MAIL-001), or a redelivery (Idempotent-Replayed true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboundResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listInboundMessages
      summary: List inbound email newest first, without the messages of cases the caller may not read
      x-passage-duty: CaseMaintain
      parameters:
        - { name: mailbox, in: query, schema: { type: string, format: email } }
        - { name: caseId, in: query, schema: { type: string, format: uuid } }
        - { name: route, in: query, schema: { type: string, enum: [ATTACHED, NEW_CASE] } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InboundMessage" } }
                  nextCursor: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag of the current version, such as "3" (optimistic concurrency).
      schema: { type: string, example: '"3"' }
    Cursor:
      name: cursor
      in: query
      description: The nextCursor of the previous page.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  headers:
    ETag:
      description: The aggregate version, quoted ("3"); echo it in If-Match.
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Replayed:
      description: The stored result of an earlier request with the same Idempotency-Key and body (header Idempotent-Replayed true).
    ClaimMoved:
      description: The claim after the move (or a replay, with Idempotent-Replayed true); the ETag carries its new version
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SupplierClaim" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "https://passage.dev/problems/SVC-WO-011" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    Money:
      type: object
      description: Amounts are decimal strings; never floats.
      properties:
        amount: { type: string, pattern: "^-?[0-9]+(\\.[0-9]{1,6})?$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    SlaTarget:
      type: object
      required: [priority, responseMinutes, resolutionMinutes]
      properties:
        priority: { type: integer, minimum: 1, maximum: 4 }
        responseMinutes: { type: integer, minimum: 1 }
        resolutionMinutes: { type: integer, minimum: 1 }
    SlaProfileRequest:
      type: object
      required: [code, name, timeZone, targets]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,19}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        timeZone: { type: string, description: IANA zone of the service site }
        allDay: { type: boolean, description: 24x7 profile when true }
        openMinute: { type: integer, minimum: 0, maximum: 1440, description: Required unless allDay; stored as 0 for 24x7 }
        closeMinute: { type: integer, minimum: 0, maximum: 1440, description: Required unless allDay; stored as 1440 for 24x7 }
        pauseOnParts: { type: boolean }
        holidays:
          type: array
          maxItems: 400
          description: Local dates without business time (BR-45.2); ignored by 24x7 profiles.
          items: { type: string, format: date }
        targets:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: "#/components/schemas/SlaTarget" }
    SlaProfile:
      allOf:
        - $ref: "#/components/schemas/SlaProfileRequest"
        - type: object
          properties:
            id: { type: string, format: uuid }
    AgreementLine:
      type: object
      description: Covers one service object or one category (not both).
      properties:
        serviceObjectId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        includedVisits: { type: integer, minimum: 0, description: Recorded; visit consumption is a later slice }
        includedHours: { type: string, description: decimal labor hours consumed first-in first-out (BR-45.4) }
        partsCovered: { type: boolean }
        laborCovered: { type: boolean }
        travelCovered: { type: boolean }
    AgreementRequest:
      type: object
      required: [customerPartyId, legalEntityId, validFrom, slaProfileId, billingModel, priorityRank, lines]
      additionalProperties: false
      properties:
        customerPartyId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        validFrom: { type: string, format: date }
        validTo: { type: [string, "null"], format: date }
        slaProfileId: { type: string, format: uuid }
        billingModel: { type: string, enum: [PREPAID, PER_VISIT, SUBSCRIPTION] }
        priorityRank: { type: integer, minimum: 1, maximum: 100, description: Entitlement tie-break after specificity; the higher rank wins }
        status: { type: string, enum: [DRAFT, ACTIVE], default: DRAFT, description: Only ACTIVE agreements entitle cases and cover work orders }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/AgreementLine" }
    Agreement:
      allOf:
        - $ref: "#/components/schemas/AgreementRequest"
        - type: object
          properties:
            id: { type: string, format: uuid }
            number: { type: string, example: SA-000001 }
            status: { type: string, enum: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, CANCELED] }
            hoursConsumed: { type: string, description: Included labor hours consumed by posted work orders }
    AgreementPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Agreement" } }
        nextCursor: { type: string, format: uuid }
    CasePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Case" } }
        nextCursor: { type: string, format: uuid }
    WorkOrderPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkOrder" } }
        nextCursor: { type: string, format: uuid }
    OpenCaseRequest:
      type: object
      required: [customerPartyId, legalEntityId, channel, priority]
      additionalProperties: false
      properties:
        customerPartyId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        serviceObjectId: { type: [string, "null"], format: uuid }
        channel: { type: string, enum: [PHONE, EMAIL, PORTAL, IOT, INTERNAL] }
        priority: { type: integer, minimum: 1, maximum: 4 }
        description: { type: string, maxLength: 4000 }
        openedAt: { type: string, format: date-time, description: defaults to server time }
        fallbackSlaProfileId: { type: [string, "null"], format: uuid, description: used when no agreement matches (SVC-ENT-001) }
    Case:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: CS-000001 }
        customerPartyId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        serviceObjectId: { type: [string, "null"], format: uuid }
        channel: { type: string }
        priority: { type: integer }
        description: { type: string }
        status: { type: string, enum: [NEW, IN_PROGRESS, WAITING_CUSTOMER, WAITING_PARTS, RESOLVED, CLOSED, CANCELED] }
        agreementId: { type: [string, "null"], format: uuid }
        slaProfileId: { type: string, format: uuid }
        entitlementTrace:
          type: array
          items: { type: string }
          description: Resolution trace from BR-45.1 (why this agreement was chosen)
        slaState: { type: string, enum: [RUNNING, PAUSED, MET, BREACHED], description: state of the resolution clock }
        slaPausedMinutes: { type: integer, description: business minutes of closed pauses of the resolution clock }
        slaPausedAt: { type: [string, "null"], format: date-time, description: start of the open pause }
        slaAlerts:
          type: array
          items: { type: string, enum: [RESPONSE_WARNING, RESPONSE_BREACH, RESOLUTION_WARNING, RESOLUTION_BREACH] }
          description: SLA events already emitted for the case (each fires once)
        openedAt: { type: string, format: date-time }
        respondedAt: { type: [string, "null"], format: date-time, description: first move out of NEW, or the first dispatch of its work orders }
        resolvedAt: { type: [string, "null"], format: date-time }
        slaResponseDue: { type: string, format: date-time }
        slaResponseWarnAt: { type: string, format: date-time }
        slaResolutionDue: { type: string, format: date-time }
        slaResolutionWarnAt: { type: string, format: date-time }
        version: { type: integer, description: echoed as If-Match on transitions }
    WorkLine:
      type: object
      required: [kind, qty]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: server-generated when absent }
        kind: { type: string, enum: [LABOR, PART, TRAVEL, FEE] }
        qty: { type: string, description: decimal quantity, must be positive }
        unitPrice: { type: string, description: decimal, non-negative; defaults to 0 }
        unitCost: { type: string, description: decimal, non-negative; defaults to 0; recorded as warranty cost on WARRANTY lines }
    WorkOrderRequest:
      type: object
      required: [customerPartyId, legalEntityId, territoryId, estDurationMinutes, currency]
      additionalProperties: false
      properties:
        customerPartyId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        territoryId: { type: string, format: uuid }
        caseId: { type: [string, "null"], format: uuid, description: Must belong to the same customer and legal entity (SVC-CASE-002) }
        agreementId: { type: [string, "null"], format: uuid, description: Defaults to the case's agreement; must belong to the same customer and legal entity (SVC-AGR-003) }
        incidentTypeId: { type: [string, "null"], format: uuid }
        estDurationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        lines:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/WorkLine" }
    WorkOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: SWO-000001 }
        customerPartyId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        territoryId: { type: string, format: uuid }
        caseId: { type: [string, "null"], format: uuid }
        agreementId: { type: [string, "null"], format: uuid }
        status:
          type: string
          enum: [UNSCHEDULED, SCHEDULED, DISPATCHED, TRAVELING, IN_PROGRESS, ON_HOLD, COMPLETED, POSTED, CANCELED]
        estDurationMinutes: { type: integer }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/WorkLine" }
        incidentTypeId: { type: [string, "null"], format: uuid }
        posting: { $ref: "#/components/schemas/Posting" }
        followUpOf: { type: [string, "null"], format: uuid, description: the finished order this one follows up (BR-45.5) }
        completedAt: { type: [string, "null"], format: date-time }
        firstTimeFix: { type: [boolean, "null"], description: set true at completion, false once a follow-up exists }
        version: { type: integer }
    Kpis:
      type: object
      description: |
        Cases count by opening time, work orders by completion time; follow-up orders
        are not counted as jobs. Rates are percentages as decimal strings rounded
        half-even to two places, null when their denominator is zero. Means are
        wall-clock minutes. A breached clock stays a miss when resolved later.
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        territory: { type: string, format: uuid }
        casesOpened: { type: integer }
        responseMet: { type: integer }
        responseMissed: { type: integer, description: answered late, or still NEW and past its response due }
        responseAttainmentPct: { type: [string, "null"] }
        meanResponseMinutes: { type: [string, "null"] }
        resolutionMet: { type: integer }
        resolutionBreached: { type: integer }
        resolutionAttainmentPct: { type: [string, "null"] }
        meanResolutionMinutes: { type: [string, "null"] }
        workOrdersCompleted: { type: integer }
        firstTimeFix: { type: integer }
        firstTimeFixPct: { type: [string, "null"] }
    PostedLine:
      type: object
      properties:
        lineId: { type: string, format: uuid }
        kind: { type: string, enum: [LABOR, PART, TRAVEL, FEE] }
        coverage: { type: string, enum: [BILLABLE, WARRANTY, AGREEMENT] }
        qty: { type: string }
        amount: { type: string, description: Billed amount, rounded half-even to the currency minor unit }
        warrantyCost: { type: string }
        agreementHours: { type: string }
    Posting:
      type: object
      description: Present once POSTED (BR-45.4). A labor line split between included and billable hours yields two posted lines.
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        lines: { type: array, items: { $ref: "#/components/schemas/PostedLine" } }
        billableTotal: { type: string }
        warrantyCost: { type: string }
        entitlementConsumed: { type: string }
    WarrantyTerm:
      type: object
      required: [startTrigger, months]
      properties:
        startTrigger: { type: string, enum: [SHIP, INSTALL, REGISTRATION] }
        months: { type: integer, minimum: 0, maximum: 240, description: 0 means no warranty }
        partsCovered: { type: boolean }
        laborCovered: { type: boolean }
        travelCovered: { type: boolean }
    ServiceObjectRequest:
      type: object
      required: [itemId, serial, customerPartyId, legalEntityId, warranty]
      additionalProperties: false
      properties:
        itemId: { type: string, format: uuid }
        serial: { type: string, minLength: 1, maxLength: 100 }
        customerPartyId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        siteAddressId: { type: [string, "null"], format: uuid }
        parentId: { type: [string, "null"], format: uuid, description: must belong to the same customer (SVC-OBJ-003) }
        shippedOn: { type: [string, "null"], format: date }
        installedOn: { type: [string, "null"], format: date }
        warranty: { $ref: "#/components/schemas/WarrantyTerm" }
    ServiceObject:
      type: object
      required: [id, itemId, serial, customerPartyId, legalEntityId, status, warranty, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        serial: { type: string }
        customerPartyId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        siteAddressId: { type: string, format: uuid }
        parentId: { type: string, format: uuid }
        shipmentId: { type: string, format: uuid }
        shippedOn: { type: string, format: date }
        installedOn: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, INACTIVE, RETURNED] }
        warranty: { $ref: "#/components/schemas/WarrantyTerm" }
        warrantyStartsOn: { type: string, format: date, description: absent until the trigger date is known }
        warrantyEndsOn: { type: string, format: date, description: first day the warranty no longer covers }
        createdAt: { type: string, format: date-time }
        version: { type: integer }
    ServiceObjectPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ServiceObject" } }
        nextCursor: { type: string, format: uuid }
    InstallRequest:
      type: object
      required: [installedOn]
      additionalProperties: false
      properties:
        installedOn: { type: string, format: date }
        siteAddressId: { type: [string, "null"], format: uuid }
    ShipmentRequest:
      type: object
      required: [shipmentId, shipDate, customerPartyId, legalEntityId, lines]
      additionalProperties: false
      properties:
        shipmentId: { type: string, format: uuid }
        shipDate: { type: string, format: date }
        customerPartyId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        siteAddressId: { type: [string, "null"], format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          description: At most 2,000 serials in all.
          items:
            type: object
            required: [itemId, serials, warranty]
            additionalProperties: false
            properties:
              itemId: { type: string, format: uuid }
              serials: { type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 100 } }
              warranty: { $ref: "#/components/schemas/WarrantyTerm" }
    ShipmentReceipt:
      type: object
      required: [created, existing]
      properties:
        created: { type: integer }
        existing: { type: integer }
    Association:
      type: object
      required: [entityType, entityId]
      additionalProperties: false
      properties:
        entityType: { type: string, enum: [case, work_order, agreement, service_object, knowledge_article, project, customer, vendor, worker, invoice, item, asset, audit_finding] }
        entityId: { type: string, format: uuid }
    ActivitySchedule:
      type: object
      additionalProperties: false
      properties:
        dueAt: { type: [string, "null"], format: date-time }
        startAt: { type: [string, "null"], format: date-time }
        endAt: { type: [string, "null"], format: date-time, description: not before startAt }
    ActivityRequest:
      type: object
      required: [kind, subject, ownerWorkerId]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [TASK, APPOINTMENT, CALL_NOTE, EMAIL_NOTE] }
        subject: { type: string, minLength: 1, maxLength: 200 }
        ownerWorkerId: { type: string, format: uuid }
        dueAt: { type: [string, "null"], format: date-time }
        startAt: { type: [string, "null"], format: date-time }
        endAt: { type: [string, "null"], format: date-time }
        reminderMinutes: { type: [integer, "null"], minimum: 0, maximum: 10080 }
        associations: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/Association" } }
    Activity:
      type: object
      required: [id, kind, subject, ownerWorkerId, status, associations, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [TASK, APPOINTMENT, CALL_NOTE, EMAIL_NOTE] }
        subject: { type: string }
        ownerWorkerId: { type: string, format: uuid }
        dueAt: { type: string, format: date-time }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status: { type: string, enum: [OPEN, DONE, CANCELED] }
        reminderMinutes: { type: integer }
        associations: { type: array, items: { $ref: "#/components/schemas/Association" } }
        completedAt: { type: string, format: date-time, description: set when DONE }
        createdAt: { type: string, format: date-time }
        version: { type: integer }
    ActivityPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Activity" } }
        nextCursor: { type: string, format: uuid }
    Applicability:
      type: object
      additionalProperties: false
      properties:
        itemIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        itemGroupIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        incidentTypeIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        assetTypeIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        categoryIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
    ArticleRequest:
      type: object
      required: [title, language, solution]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        language: { type: string, pattern: "^[a-z]{2}(-[A-Za-z]{2,4})?$", description: fixed per version; ignored by PUT }
        symptom: { type: string, maxLength: 4000 }
        cause: { type: string, maxLength: 4000 }
        solution: { type: string, minLength: 1, maxLength: 4000 }
        applicability: { $ref: "#/components/schemas/Applicability" }
    Article:
      type: object
      required: [id, number, version, language, title, symptom, cause, solution, applicability, status, authorId, helpfulYes, helpfulNo, createdAt, revision]
      properties:
        id: { type: string, format: uuid, description: id of this version }
        number: { type: string, example: KB-000001 }
        version: { type: integer, minimum: 1 }
        language: { type: string }
        title: { type: string }
        symptom: { type: string }
        cause: { type: string }
        solution: { type: string }
        applicability: { $ref: "#/components/schemas/Applicability" }
        status: { type: string, enum: [DRAFT, IN_REVIEW, PUBLISHED, RETIRED] }
        authorId: { type: string, format: uuid }
        reviewerId: { type: string, format: uuid }
        publishedAt: { type: string, format: date-time }
        helpfulYes: { type: integer }
        helpfulNo: { type: integer }
        helpfulPercent: { type: string, description: "decimal percent, shown from ten votes (BR-45.11)" }
        createdAt: { type: string, format: date-time }
        revision: { type: integer, description: optimistic-concurrency token of this version; the ETag }
    ArticlePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Article" } }
        nextCursor: { type: string, format: uuid }
    PublishResult:
      type: object
      required: [article, warnings]
      properties:
        article: { $ref: "#/components/schemas/Article" }
        retiredVersion: { type: integer, description: the version this publish retired }
        warnings: { type: array, items: { type: string }, description: "KB-PUB-002 when a version was retired" }
    Suggestion:
      type: object
      required: [article, score]
      properties:
        article: { $ref: "#/components/schemas/Article" }
        score: { type: number, minimum: 0, maximum: 1 }
    SuggestionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Suggestion" } }
    VoteRequest:
      type: object
      required: [helpful]
      additionalProperties: false
      properties:
        helpful: { type: boolean }
    CaseStage:
      type: object
      required: [code, sequence]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[A-Z0-9_-]{2,40}$" }
        sequence: { type: integer, minimum: 1, description: "1 to n in order" }
        requiredActivities:
          type: array
          description: Activity subjects that must be DONE on the case before it leaves the stage.
          items: { type: string, minLength: 1, maxLength: 200 }
    CaseProcessRequest:
      type: object
      required: [code, name, stages]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[A-Z0-9_-]{2,40}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        stages: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/CaseStage" } }
    CaseProcess:
      allOf:
        - $ref: "#/components/schemas/CaseProcessRequest"
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    CaseCategoryRequest:
      type: object
      required: [code, name, categoryType]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[A-Z0-9_-]{2,40}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        categoryType: { type: string, enum: [SERVICE, CUSTOMER_SERVICE, HR, COLLECTIONS, PRODUCT_CHANGE, AUDIT, PROJECT, VENDOR, INTERNAL] }
        parentId: { type: string, format: uuid }
        processId: { type: string, format: uuid }
        slaProfileId: { type: string, format: uuid }
        defaultPriority: { type: integer, minimum: 1, maximum: 4, default: 3 }
        reopenWindowDays: { type: integer, minimum: 0, maximum: 365, default: 14 }
        accessDuty: { type: string, maxLength: 100, description: "Duty that, beside ownership, grants access to the category's cases (BR-45.10); empty leaves them to every CaseMaintain holder." }
        resolutionCodes: { type: array, maxItems: 50, uniqueItems: true, items: { type: string, pattern: "^[A-Z0-9_-]{2,40}$" } }
    CaseCategory:
      type: object
      required: [id, code, name, categoryType, defaultPriority, reopenWindowDays, accessDuty, resolutionCodes]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        categoryType: { type: string }
        parentId: { type: string, format: uuid }
        processId: { type: string, format: uuid }
        slaProfileId: { type: string, format: uuid }
        defaultPriority: { type: integer }
        reopenWindowDays: { type: integer }
        accessDuty: { type: string }
        resolutionCodes: { type: array, items: { type: string } }
    CaseAssociation:
      type: object
      required: [entityType, entityId]
      additionalProperties: false
      properties:
        entityType: { type: string, enum: [case, work_order, agreement, service_object, knowledge_article, project, customer, vendor, worker, invoice, item, asset, audit_finding] }
        entityId: { type: string, format: uuid }
        role: { type: string, enum: [SUBJECT, RELATED], default: RELATED }
    CaseLogEntry:
      type: object
      required: [at, actor, kind, text]
      properties:
        at: { type: string, format: date-time }
        actor: { type: string }
        kind: { type: string, enum: [CREATED, STAGE, STATUS, ASSOCIATION, REOPENED] }
        text: { type: string }
    GenericCaseRequest:
      type: object
      required: [categoryId, legalEntityId, subject]
      additionalProperties: false
      properties:
        categoryId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerPartyId: { type: string, format: uuid, description: Required for COLLECTIONS. }
        subject: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        priority: { type: integer, minimum: 1, maximum: 4, description: Defaults to the category's default priority. }
        associations: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/CaseAssociation" } }
    GenericCase:
      type: object
      required: [id, number, categoryId, categoryCode, categoryType, legalEntityId, ownerId, subject, description, priority, stageCode,
        status, resolutionText, openedAt, version, createdAt, updatedAt, associations, log]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: CS-000042 }
        categoryId: { type: string, format: uuid }
        categoryCode: { type: string }
        categoryType: { type: string }
        legalEntityId: { type: string, format: uuid }
        customerPartyId: { type: string, format: uuid }
        ownerId: { type: string }
        subject: { type: string }
        description: { type: string }
        priority: { type: integer }
        stageCode: { type: string, description: Empty when the category has no process. }
        status: { type: string, enum: [OPEN, RESOLVED, CLOSED, CANCELED] }
        resolutionCode: { type: string }
        resolutionText: { type: string }
        slaProfileId: { type: string, format: uuid }
        slaResponseDue: { type: string, format: date-time }
        slaResolutionDue: { type: string, format: date-time }
        openedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        reopenedFrom: { type: string, format: uuid }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        associations:
          type: array
          items:
            type: object
            required: [entityType, entityId, role]
            properties:
              entityType: { type: string }
              entityId: { type: string, format: uuid }
              role: { type: string, enum: [SUBJECT, RELATED] }
        log: { type: array, items: { $ref: "#/components/schemas/CaseLogEntry" } }
    GenericCasePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GenericCase" } }
        nextCursor: { type: string, format: uuid }
    ReopenResult:
      type: object
      required: [case, created]
      properties:
        case: { $ref: "#/components/schemas/GenericCase" }
        created: { type: boolean, description: True when a new case linked by reopenedFrom was created. }
    ClaimLine:
      type: object
      required: [sourceId, partAmount, laborHours, laborRate, claimedAmount, acceptedAmount]
      properties:
        sourceId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        serial: { type: string }
        failureCode: { type: string }
        partAmount: { type: string }
        laborHours: { type: string }
        laborRate: { type: string }
        claimedAmount: { type: string, description: partAmount + laborHours × laborRate }
        acceptedAmount: { type: string }
    SupplierClaim:
      type: object
      required: [id, number, vendorPartyId, legalEntityId, sourceKind, sourceIds, currency, laborRate, lines, claimedTotal, acceptedTotal,
        recoveredAmount, status, completedOn, windowDays, windowEndsOn, returnRequired, returnOrderId, vendorReference, decisionReason,
        creditNoteId, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: SWC-000001 }
        vendorPartyId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        sourceKind: { type: string, enum: [SERVICE_WO, EAM_WO] }
        sourceIds: { type: array, items: { type: string, format: uuid } }
        currency: { type: string }
        laborRate: { type: string }
        lines: { type: array, items: { $ref: "#/components/schemas/ClaimLine" } }
        claimedTotal: { type: string }
        acceptedTotal: { type: string }
        recoveredAmount: { type: string }
        status: { type: string, enum: [DRAFT, SUBMITTED, ACCEPTED, PARTIALLY_ACCEPTED, REJECTED, SETTLED, CLOSED] }
        completedOn: { type: string, format: date }
        windowDays: { type: integer }
        windowEndsOn: { type: string, format: date, description: The last day the claim can be submitted. }
        returnRequired: { type: boolean }
        returnOrderId: { type: string }
        submittedOn: { type: string, format: date }
        vendorReference: { type: string }
        decisionReason: { type: string }
        decidedAt: { type: string, format: date-time }
        creditNoteId: { type: string }
        settledAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CaseMailbox:
      type: object
      required: [address, legalEntityId, categoryId, categoryCode, updatedAt]
      properties:
        address: { type: string, format: email }
        legalEntityId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        categoryCode: { type: string }
        updatedAt: { type: string, format: date-time }
    MailAttachment:
      type: object
      required: [name, objectRef]
      properties:
        name: { type: string, maxLength: 255 }
        contentType: { type: string, maxLength: 255 }
        sizeBytes: { type: integer, minimum: 0, maximum: 26214400 }
        objectRef: { type: string, maxLength: 512, description: Where the hub stored the bytes. }
    InboundMessage:
      type: object
      required: [id, mailbox, messageId, inReplyTo, fromAddress, subject, body, receivedAt, caseId, caseNumber, route, automated, acknowledge,
        attachments, createdAt]
      properties:
        id: { type: string, format: uuid }
        mailbox: { type: string }
        messageId: { type: string }
        inReplyTo: { type: string }
        fromAddress: { type: string }
        subject: { type: string }
        body: { type: string }
        receivedAt: { type: string, format: date-time }
        caseId: { type: string, format: uuid }
        caseNumber: { type: string, example: CS-001042 }
        route: { type: string, enum: [ATTACHED, NEW_CASE] }
        reopenedFrom: { type: string, format: uuid, description: The closed case a NEW_CASE message continued. }
        reopenedFromNumber: { type: string }
        automated: { type: boolean }
        acknowledge: { type: boolean, description: The hub sends the one acknowledgment of the new case. }
        attachments: { type: array, items: { $ref: "#/components/schemas/MailAttachment" } }
        createdAt: { type: string, format: date-time }
    InboundResult:
      allOf:
        - $ref: "#/components/schemas/InboundMessage"
        - type: object
          properties:
            message:
              type: object
              description: The info message CASE-MAIL-001 when the email was attached to a case.
              properties:
                code: { type: string, example: CASE-MAIL-001 }
                text: { type: string }
