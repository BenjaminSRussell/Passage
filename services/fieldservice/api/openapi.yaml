  /v1/service/dispatch/optimizations:
    post:
      operationId: requestDispatchOptimization
      summary: Optimize a territory-day with the dispatch service (BR-45.3)
      description: |
        Snapshots the active technicians of the legal entity who cover the territory, the territory's
        UNSCHEDULED work orders and the orders those technicians already hold on the day (which stay where
        they are), stores the snapshot and makes the first call to the dispatch service. Work orders without
        coordinates or with a window outside the day, and technicians off that day, in another time zone,
        without a home position or whose held visits cannot be reached by travel, are listed in skipped.
        A work order that no technician can reach within a day's travel, and a technician with nothing to
        reach, are skipped as TOO_FAR (a wrong coordinate shows up here rather than failing the run). The
        technician's visits on the day in any territory are held where they are; a technician whose held
        visits do not fit the snapshot limit is skipped as OVER_LIMIT, as is every technician after it by id (the
        cut-off can skip a technician who holds no visits). A visit from the night before that ended before the
        shift starts is ignored.
        A failed call is retried by :sync after min(3600, 60 * 2^attempts) seconds and the optimization is
        PARKED after five failures or a refusal that cannot change. Nothing to place is SVC-DSP-016; a
        service without DISPATCH_URL or signing key is SVC-DSP-017.
      x-passage-duty: fieldservice.technician.dispatch
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OptimizeRequest" }
      responses:
        "201":
          description: The optimization after the first call
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchOptimization" }
        "200": { $ref: "#/components/responses/Replayed" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listDispatchOptimizations
      summary: List dispatch optimizations newest first
      x-passage-duty: fieldservice.inquire
      parameters:
        - { name: territoryId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, ACCEPTED, PARKED] } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchOptimizationPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/service/dispatch/optimizations/{id}:
    get:
      operationId: getDispatchOptimization
      summary: Read an optimization with its plan and, once accepted, its outcome
