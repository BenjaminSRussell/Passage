openapi: 3.1.0
info:
  title: Passage Field Service API
  version: 0.1.0
  description: |
    Service agreements, SLA profiles, cases with their status lifecycle and SLA monitor,
    service work orders with follow-ups, service KPIs, the installed base with warranties,
    activities on any record, the knowledge base (wave 45, slices 1 to 3) and generic
    case management: case processes, the case category tree and cases in any
    non-service category with stages, associations and a log (slice 4), supplier warranty
    claims with vendor recovery, case mailboxes and email-to-case intake (slice 5), technicians, work-order
    scheduling data, manual assignment under the BR-45.3 hard constraints, the dispatch board and publishing a
    territory-day (slice 7).
    Service routes are mounted under /v1/service and generic case routes under
    /v1/cases, /v1/case-categories, /v1/case-processes, /v1/case-mailboxes and
    /v1/inbound-messages (PRD 8.45.5); the browser
    reaches them as /api/v1/... through the web BFF. Every mutating operation requires an
    Idempotency-Key header, except the case transition, where it is optional because
    If-Match already makes a retry safe, the If-Match-guarded custom methods of slice 3 (a retry after success
    is answered 412 and the client reloads), the shipment receipt, which is idempotent per serial, the mailbox upsert (keyed by address) and the
    inbound message (keyed by its Message-ID). Custom
    methods (`:transition`, `:post`, `:follow-up`, `:install`, `:complete`, `:publish`, ...) and PUT require If-Match
    with the current aggregate version. Errors are RFC 9457 problem details whose
    `code` is listed in the service README.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/service/sla-profiles:
    post:
      operationId: createSlaProfile
      summary: Create an SLA profile with business-hour calendar, holidays and priority targets
      x-passage-duty: fieldservice.agreement.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlaProfileRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlaProfile" }
        "200": { $ref: "#/components/responses/Replayed" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listSlaProfiles
      summary: List the tenant's SLA profiles by code (at most 500)
      x-passage-duty: fieldservice.inquire
      responses:
        "200":
          description: The profiles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SlaProfile" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/service/sla-profiles/{id}:
    get:
      operationId: getSlaProfile
      summary: Read an SLA profile
      x-passage-duty: fieldservice.inquire
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlaProfile" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/service/agreements:
    post:
      operationId: createAgreement
      summary: Create a service agreement with covered lines and billing model
      x-passage-duty: fieldservice.agreement.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgreementRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agreement" }
        "200": { $ref: "#/components/responses/Replayed" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listAgreements
      summary: List agreements newest first inside the caller's legal-entity scope
      x-passage-duty: fieldservice.inquire
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, CANCELED] } }
        - { name: customerPartyId, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgreementPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/service/agreements/{id}:
    get:
      operationId: getAgreement
      summary: Read a service agreement with its consumed included hours
      x-passage-duty: fieldservice.inquire
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The agreement
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agreement" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/service/agreements/{id}:transition:
    post:
      operationId: transitionAgreement
      summary: Activate, suspend, resume or cancel a service agreement (FR-45.3)
      description: |
        DRAFT to ACTIVE or CANCELED; ACTIVE to SUSPENDED or CANCELED; SUSPENDED to ACTIVE
        (resume) or CANCELED. Only ACTIVE agreements entitle cases and cover work orders.
        Suspending and canceling need a reason. Activating or resuming an agreement whose
        validTo is behind today is refused (SVC-AGR-006). EXPIRED is not requested; the
        expiry pass sets it. CANCELED and EXPIRED are final. Writes
        `dev.passage.service.agreement.changed.v1` and a status history row in the same
        transaction.
      x-passage-duty: fieldservice.agreement.maintain
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional; a retry with the same key and request returns the first answer.
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              additionalProperties: false
              properties:
                to: { type: string, enum: [ACTIVE, SUSPENDED, CANCELED] }
                reason: { type: string, maxLength: 500, description: Required when to is SUSPENDED or CANCELED }
      responses:
        "200":
          description: Transitioned (a replay carries Idempotent-Replayed true)
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agreement" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/service/agreements:expire:
    post:
      operationId: expireAgreements
      summary: Expire ACTIVE and SUSPENDED agreements whose validTo is behind today (FR-45.3)
      description: |
        One pass for the caller's tenant and legal-entity scope. Each expired agreement
        writes `dev.passage.service.agreement.changed.v1` and a history row. Repeating the
        pass changes nothing. A daily scheduler calls it.
      x-passage-duty: fieldservice.agreement.maintain
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }, description: Agreements handled in this pass }
      responses:
        "200":
          description: The pass result
          content:
            application/json:
              schema:
                type: object
                required: [scanned, expired]
                properties:
                  scanned: { type: integer }
                  expired: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/service/agreements/{id}/visits:
    post:
      operationId: recordAgreementVisit
      summary: Consume one included visit of an agreement line (FR-45.3)
      description: |
        The agreement must be ACTIVE (SVC-AGR-007) and cover the visit date (SVC-AGR-008);
        the line must exist (SVC-AGR-009) and still have an included visit (SVC-AGR-010). A
        visit tied to a work order requires an order of this agreement (SVC-AGR-011) and
        consumes at most one visit per order (SVC-AGR-012). Writes
        `dev.passage.service.agreementvisit.recorded.v1`.
      x-passage-duty: fieldservice.agreement.maintain
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lineIndex, kind, visitDate]
              additionalProperties: false
              properties:
                lineIndex: { type: integer, minimum: 0, description: Zero-based index in the agreement's lines }
                kind: { type: string, enum: [PREVENTIVE, CORRECTIVE] }
                visitDate: { type: string, format: date }
                workOrderId: { type: [string, "null"], format: uuid }
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Recorded, with the visits left on the line
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgreementVisit" }
        "200": { $ref: "#/components/responses/Replayed" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listAgreementVisits
      summary: List the visits consumed from an agreement, oldest first
      x-passage-duty: fieldservice.inquire
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The visits
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AgreementVisit" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/service/agreements/{id}/history:
    get:
      operationId: listAgreementHistory
      summary: List the status changes of an agreement, oldest first
      x-passage-duty: fieldservice.inquire
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The status changes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AgreementChange" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/service/cases:
    post:
      operationId: openCase
      summary: Open a service case; resolves the entitlement and starts the SLA clocks (BR-45.1, BR-45.2)
      x-passage-duty: fieldservice.service-case.create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenCaseRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "200": { $ref: "#/components/responses/Replayed" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listCases
      summary: List cases newest first inside the caller's legal-entity scope
      x-passage-duty: fieldservice.inquire
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [NEW, IN_PROGRESS, WAITING_CUSTOMER, WAITING_PARTS, RESOLVED, CLOSED, CANCELED] } }
        - { name: slaState, in: query, schema: { type: string, enum: [RUNNING, PAUSED, MET, BREACHED] } }
        - { name: customerPartyId, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CasePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/service/cases/{id}:
    get:
      operationId: getCase
      summary: Read a service case with its SLA state
      x-passage-duty: fieldservice.inquire
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The case
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/service/cases/{id}:transition:
    post:
      operationId: transitionCase
      summary: Move a case along its status machine; pauses, resumes or stops the SLA clocks (FR-45.5, BR-45.2)
      description: |
        PRD 8.45.5 names this `POST /cases/{id}/status`; it follows the custom-method
        form of the work-order routes. WAITING_CUSTOMER pauses the resolution clock,
        WAITING_PARTS pauses it when the profile has pauseOnParts; leaving the pause
        moves the due by the paused business minutes. Leaving NEW records the response.
        A clock found past due becomes BREACHED and emits `sla.breached` once; a
        case resolved in time is MET. NEW cannot be requested; CLOSED only follows
        RESOLVED and is final.
      x-passage-duty: fieldservice.service-case.maintain
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional; a retry with the same key and request returns the first answer.
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              additionalProperties: false
              properties:
                to:
                  type: string
                  enum: [IN_PROGRESS, WAITING_CUSTOMER, WAITING_PARTS, RESOLVED, CLOSED, CANCELED]
      responses:
        "200":
          description: Transitioned (a request for the current status is a no-op; a replay carries Idempotent-Replayed true)
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/service/sla:scan:
    post:
      operationId: scanSLA
      summary: One pass of the SLA monitor over the caller's tenant (BR-45.2, AC-45.3, job service-sla-monitor)
      description: |
        Selects RUNNING clocks of open cases with a warning (75 % of the target) or a
        breach due and not yet emitted, oldest resolution due first, records each
        alert on the case and writes `sla.warning` / `sla.breached` to the outbox in
        the same transaction. Repeating a pass emits nothing new.
      x-passage-duty: fieldservice.service-case.maintain
      parameters:
        - { name: limit, in: query, description: cases per pass, schema: { type: integer, minimum: 1, maximum: 5000, default: 500 } }
      responses:
        "200":
          description: What the pass did
          content:
            application/json:
              schema:
                type: object
                required: [scanned, warnings, breaches]
                properties:
                  scanned: { type: integer }
                  warnings: { type: integer }
                  breaches: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/service/kpis:
    get:
      operationId: getKpis
      summary: Service KPIs over a window - SLA attainment, mean time to respond and resolve, first-time fix (FR-45.11)
      x-passage-duty: fieldservice.inquire
      parameters:
        - { name: from, in: query, required: true, description: inclusive, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, description: exclusive; at most 366 days after from, schema: { type: string, format: date-time } }
        - { name: territory, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The measures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Kpis" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/service/work-orders:
    post:
      operationId: createWorkOrder
      summary: Create a service work order; from a case it inherits the case's agreement (FR-45.6)
      x-passage-duty: fieldservice.work-order.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkOrderRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        "200": { $ref: "#/components/responses/Replayed" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listWorkOrders
      summary: List work orders newest first inside the caller's legal-entity scope
      x-passage-duty: fieldservice.inquire
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [UNSCHEDULED, SCHEDULED, DISPATCHED, TRAVELING, IN_PROGRESS, ON_HOLD, COMPLETED, POSTED, CANCELED] } }
        - { name: territoryId, in: query, schema: { type: string, format: uuid } }
        - { name: caseId, in: query, schema: { type: string, format: uuid } }
        - { name: customerPartyId, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrderPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/service/work-orders/{id}:
    get:
      operationId: getWorkOrder
      summary: Read a service work order
      x-passage-duty: fieldservice.inquire
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The work order
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/service/work-orders/{id}:transition:
    post:
      operationId: transitionWorkOrder
      summary: Move a work order along the BR-45.5 status machine by hand
      description: |
        The office override for the technician's own actions. SCHEDULED is reached only through `:assign` and
        DISPATCHED only by publishing the territory-day, so neither is accepted here. Completing needs the
        customer's signature unless the work order is `signatureExempt` (SVC-WO-001) and writes
        dev.passage.service.workorder.completed.v1 (without working minutes when no action log exists).
      x-passage-duty: fieldservice.work-order.maintain
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              additionalProperties: false
              properties:
                to:
                  type: string
                  enum: [TRAVELING, IN_PROGRESS, ON_HOLD, COMPLETED, CANCELED]
      responses:
        "200":
          description: Transitioned (a request for the current status is a no-op)
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/service/work-orders/{id}:post:
    post:
      operationId: postWorkOrder
      summary: Post a completed work order to billing (billable lines) and warranty cost (BR-45.4)
      x-passage-duty: fieldservice.billing.post
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Posted (or replayed with Idempotent-Replayed true; a replay skips the If-Match check)
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/service/work-orders/{id}:follow-up:
    post:
      operationId: followUpWorkOrder
      summary: Open the follow-up of a COMPLETED or POSTED work order; clears its first-time fix (BR-45.5)
      x-passage-duty: fieldservice.work-order.maintain
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: The new UNSCHEDULED follow-up order (linked by followUpOf, without lines)
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
