              description: The info message CASE-MAIL-001 when the email was attached to a case.
              properties:
                code: { type: string, example: CASE-MAIL-001 }
                text: { type: string }
    SchedulingFields:
      type: object
      description: Scheduling data of a work order (PRD 8.45.4).
      properties:
        requiredSkills:
          type: array
          maxItems: 30
          description: Skill codes (upper-cased, 1 to 40 of A-Z, 0-9, _, . or -) the visit needs; the technician must hold all of them (SVC-DSP-003).
          items: { type: string }
        windowStart: { type: [string, "null"], format: date-time, description: Start of the customer-promised window; comes with windowEnd. }
        windowEnd: { type: [string, "null"], format: date-time }
        address: { type: string, maxLength: 500 }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90, description: Comes with longitude. }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
    SchedulingRequest:
      allOf:
        - $ref: "#/components/schemas/SchedulingFields"
        - type: object
          required: [estDurationMinutes]
          properties:
            estDurationMinutes: { type: integer, minimum: 1, maximum: 1440 }
    AssignRequest:
      type: object
      required: [technicianId, start]
      additionalProperties: false
      properties:
        technicianId: { type: string, format: uuid }
        start: { type: string, format: date-time, description: The visit starts here and ends after the work order's estimated duration. }
        pinned: { type: boolean, default: false, description: A pinned assignment survives re-optimization. }
    TechnicianFields:
      type: object
      required: [name, legalEntityId, territoryIds, timeZone]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        workerId: { type: [string, "null"], format: uuid, description: The wave-42 worker; not checked yet. }
        legalEntityId: { type: string, format: uuid }
        territoryIds: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: uuid } }
        skills: { type: array, maxItems: 40, items: { type: string } }
        timeZone: { type: string, example: America/Chicago, description: The zone the shift is read in. }
        shiftDays: { type: array, items: { type: integer, minimum: 1, maximum: 7 }, description: ISO weekdays worked, Monday 1; Monday to Friday when absent. }
        shiftStartMinute: { type: integer, minimum: 0, maximum: 1439, default: 480 }
        shiftEndMinute: { type: integer, minimum: 1, maximum: 1440, default: 1020 }
        homeLatitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        homeLongitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        truckLocationId: { type: [string, "null"], format: uuid, description: The truck's location inside its warehouse; not checked against inventory. }
        truckSiteId: { type: [string, "null"], format: uuid, description: The truck's site in inventory; with truckWarehouseId (both or neither), before a truckLocationId. }
        truckWarehouseId: { type: [string, "null"], format: uuid, description: The truck's warehouse in inventory (BR-45.7). }
        maxDailyMinutes: { type: integer, minimum: 60, maximum: 1440, default: 480 }
        overtimeAllowed: { type: boolean, default: false, description: Adds up to 120 minutes to the shift end and the daily maximum (BR-45.3). }
        active: { type: boolean, default: true }
    TechnicianRequest:
      allOf:
        - $ref: "#/components/schemas/TechnicianFields"
        - type: object
          required: [code]
          properties:
            code: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,19}$" }
    Technician:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        workerId: { type: [string, "null"], format: uuid }
        legalEntityId: { type: string, format: uuid }
        territoryIds: { type: array, items: { type: string, format: uuid } }
        skills: { type: array, items: { type: string } }
        timeZone: { type: string }
        shiftDays: { type: array, items: { type: integer } }
        shiftStartMinute: { type: integer }
        shiftEndMinute: { type: integer }
        homeLatitude: { type: [number, "null"] }
        homeLongitude: { type: [number, "null"] }
        truckLocationId: { type: [string, "null"], format: uuid }
        truckSiteId: { type: [string, "null"], format: uuid }
        truckWarehouseId: { type: [string, "null"], format: uuid }
        maxDailyMinutes: { type: integer }
        overtimeAllowed: { type: boolean }
        active: { type: boolean }
        version: { type: integer }
    TechnicianPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Technician" } }
        nextCursor: { type: string, format: uuid }
    DispatchBoard:
      type: object
      properties:
        territoryId: { type: string, format: uuid }
        date: { type: string, format: date }
        timeZone: { type: string }
        technicians:
          type: array
          items:
            type: object
            properties:
              technician: { $ref: "#/components/schemas/Technician" }
              assignments: { type: array, items: { $ref: "#/components/schemas/WorkOrder" } }
              bookedMinutes: { type: integer, description: Estimated minutes of the day's assignments, without buffers. }
        unscheduled: { type: array, items: { $ref: "#/components/schemas/WorkOrder" } }
    PublishRequest:
      type: object
      required: [legalEntityId, territoryId, date]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        territoryId: { type: string, format: uuid }
        date: { type: string, format: date, description: The local calendar day. }
        timeZone: { type: string, example: America/Chicago, description: UTC when absent. }
    DispatchedOrder:
      type: object
      properties:
        workOrderId: { type: string, format: uuid }
        number: { type: string, example: SWO-000001 }
        technicianId: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1, description: Route order of the technician's day. }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    DispatchRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        territoryId: { type: string, format: uuid }
        date: { type: string, format: date }
        timeZone: { type: string }
        status: { type: string, enum: [PUBLISHED] }
        assignments: { type: array, items: { $ref: "#/components/schemas/DispatchedOrder" } }
        dispatchedCount: { type: integer }
        publishedBy: { type: string }
        publishedAt: { type: string, format: date-time }
    DispatchRunPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DispatchRun" } }
        nextCursor: { type: string, format: uuid }
    OptimizeRequest:
      type: object
      required: [legalEntityId, territoryId, date]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        territoryId: { type: string, format: uuid }
        date: { type: string, format: date, description: The local calendar day. }
        timeZone: { type: string, example: America/Chicago, description: UTC when absent; technicians of another time zone are skipped. }
        timeLimitSeconds: { type: integer, minimum: 1, maximum: 120, default: 20, description: Solver time limit; the greedy plan is the fallback. }
    OptimizationAssignment:
      type: object
      properties:
        workOrderId: { type: string, format: uuid }
        technicianId: { type: string, format: uuid }
        start: { type: integer, description: Minutes from the start of the local day. }
        end: { type: integer }
        sequence: { type: integer }
    OptimizationResult:
      type: object
      properties:
        assignments: { type: array, items: { $ref: "#/components/schemas/OptimizationAssignment" } }
        unassigned: { type: array, items: { type: string, format: uuid } }
        solver: { type: string, enum: [cpsat, greedy] }
        cpsatStatus: { type: string }
        fallbackReason: { type: string, nullable: true }
        elapsedSeconds: { type: number }
        cost:
          type: object
          properties:
            unassignedPriority: { type: integer }
            latenessMinutes: { type: integer }
            travelMinutes: { type: integer }
            overtimeMinutes: { type: integer }
            technicians: { type: integer }
            total: { type: integer }
    OptimizationSkipped:
      type: object
      properties:
        kind: { type: string, enum: [TECHNICIAN, WORK_ORDER] }
        id: { type: string, format: uuid }
        reason: { type: string, enum: [TIME_ZONE, OFF_DAY, NO_HOME, HELD_ROUTE_UNREACHABLE, HELD_VISIT_STALE, NO_LOCATION, WINDOW_OUTSIDE_DAY, TOO_FAR, OVER_LIMIT] }
    OptimizationOutcome:
      type: object
      properties:
        applied:
          type: array
          items:
            type: object
            properties:
              workOrderId: { type: string, format: uuid }
              technicianId: { type: string, format: uuid }
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
        rejected:
          type: array
          items:
            type: object
            properties:
              workOrderId: { type: string, format: uuid }
              code: { type: string }
              detail: { type: string }
    DispatchOptimization:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        territoryId: { type: string, format: uuid }
        date: { type: string, format: date }
        timeZone: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, ACCEPTED, PARKED] }
        technicians: { type: integer, description: Technicians in the snapshot. }
        workOrders: { type: integer, description: Open work orders in the snapshot. }
        pinned: { type: integer, description: Held orders fixed in place. }
        skipped: { type: array, items: { $ref: "#/components/schemas/OptimizationSkipped" } }
        remoteRunId: { type: string }
        result: { $ref: "#/components/schemas/OptimizationResult" }
        outcome: { $ref: "#/components/schemas/OptimizationOutcome" }
        attemptCount: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        lastError: { type: string }
        requestedBy: { type: string }
        acceptedBy: { type: string }
        acceptedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    DispatchOptimizationPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DispatchOptimization" } }
        nextCursor: { type: string, format: uuid }
