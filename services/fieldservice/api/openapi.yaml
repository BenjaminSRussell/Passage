      description: |
        The caller becomes the owner and must hold the category's access duty when it
        has one (category-scoped CaseCreate, BR-45.10). SERVICE and CUSTOMER_SERVICE
        categories are refused (CASE-CAT-002); they open through /v1/service/cases with
        entitlement and SLA. COLLECTIONS needs customerPartyId (CASE-CUS-001). A category
        SLA profile sets the response and resolution dues. Priority defaults to the
        category's default priority.
      x-passage-duty: CaseCreate
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenericCaseRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericCase" }
        "200": { $ref: "#/components/responses/Replayed" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listGenericCases
      summary: List the cases the caller may read (BR-45.10) newest first inside the caller's legal-entity scope
      x-passage-duty: CaseMaintain
      parameters:
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, RESOLVED, CLOSED, CANCELED] } }
        - { name: stage, in: query, schema: { type: string, maxLength: 40 } }
        - { name: ownerId, in: query, schema: { type: string, maxLength: 100 } }
        - { name: entityType, in: query, description: With entityId, keeps the cases associated with that record., schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericCasePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
