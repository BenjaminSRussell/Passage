  /v1/service/work-orders/{id}/actions:
    post:
      operationId: recordWorkOrderActions
      summary: Merge a batch of the technician's offline actions into a work order (BR-45.6, FR-45.8)
      description: |
        Actions are append-only with client-generated UUIDs and device timestamps; the server orders them by
        (deviceTime, position in the batch). Each action is judged on its own: APPLIED, SUPERSEDED (a status move
        behind the furthest state already reached, or a note or signature older than the stored one) or REJECTED
        with a code (SVC-WO-001 signature required to complete, SVC-SYNC-002 status, 003 not this technician's
        order, 004 part line or quantity, 006 device time before the work order was created). Only the
        technician's own worker (the caller's user id equals the technician's workerId) or office staff holding
        fieldservice.work-order.maintain may post for a technician; anyone else gets 403 SVC-SYNC-003 and nothing is stored. A device
        time more than 5 minutes ahead of the server is a 400. An action id seen before returns its stored outcome
        with `duplicate: true` and applies nothing, so a retried batch is safe; an id reused for anything else
        (another work order, technician, kind, device time or payload) is refused with 422 SVC-SYNC-005.
        PART_USED is idempotent per action id and cannot exceed the PART line quantity; a part action that
        arrives after the work order completed is REJECTED (SVC-SYNC-002). A COMPLETE completes the work order
        (dated no later than the server clock and no earlier than the last applied status move) and writes
        dev.passage.service.workorder.completed.v1 once; the work order is locked, so concurrent batches merge in
        turn. `message` carries SVC-SYNC-001 when conflicts were resolved.
      x-passage-duty: fieldservice.work-order.execute
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionBatch" }
      responses:
        "200":
          description: The outcome of every action and the work order after the merge
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionSyncResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          description: The caller lacks fieldservice.work-order.execute, or is neither the technician's worker nor office staff with fieldservice.work-order.maintain (SVC-SYNC-003)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listWorkOrderActions
      summary: Read the action log of a work order in merge order
      description: The timeline a dispatcher reviews, ordered by device time then receipt order, with each action's outcome.
      x-passage-duty: fieldservice.inquire
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The logged actions, oldest device time first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WorkOrderAction" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/service/technicians/{id}/day:
    get:
      operationId: getTechnicianDay
      summary: The technician's route for one local day, with what the device needs to work it offline (FR-45.8)
      description: |
        `{id}` is a technician id, or `me` for the technician whose workerId is the caller's user id (404
        SVC-TECH-006 when there is none). The visits are the work orders assigned to the technician that start on
        the local `date` (default today in the technician's time zone) and have been published (DISPATCHED up to
        POSTED), in start order, plus orders still being worked from an earlier day (`carryOver`). Each visit
        carries the customer and case, address and position, the promised window, the lines with the quantity
        consumed so far, the checklist with its ticks, the photos attached and the signature state. Only the
        technician's own worker, or office staff holding fieldservice.work-order.maintain or
        fieldservice.technician.dispatch, may read a technician's day (403 SVC-SYNC-003).
      x-passage-duty: fieldservice.work-order.execute
      parameters:
        - $ref: "#/components/parameters/TechnicianOrMe"
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: The route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechnicianDay" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/service/work-orders/{id}/captures/{captureId}:
    put:
      operationId: putWorkOrderCapture
      summary: Upload a photo or the customer's signature image (FR-45.8)
      description: |
        The body is the image (image/png or image/jpeg; the type is read from the bytes). A photo is at most
        1,600 px on its long edge, a signature must be a PNG of at most 2,000 px; either is at most 2 MB
        (422 SVC-CAP-001). `captureId` is chosen by the device: the same id with the same bytes returns the
        stored capture with `duplicate: true` and stores nothing twice, and any other use of the id is 422
        SVC-SYNC-005. The work order must be assigned to `technicianId` and dispatched up to completed (422
        SVC-CAP-003), and the caller must be that technician's worker or office staff with
        fieldservice.work-order.maintain (403 SVC-SYNC-003). The returned `ref` is what a PHOTO or SIGNATURE
        action names the capture by.
      x-passage-duty: fieldservice.work-order.execute
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: captureId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: technicianId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: kind, in: query, required: true, schema: { type: string, enum: [PHOTO, SIGNATURE] } }
        - { name: capturedAt, in: query, required: true, schema: { type: string, format: date-time }, description: The device clock; not more than 5 minutes ahead of the server. }
        - { name: lat, in: query, required: false, schema: { type: number }, description: With lon. }
        - { name: lon, in: query, required: false, schema: { type: number } }
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: The capture was stored before
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capture" }
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capture" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: getWorkOrderCapture
      summary: Read a stored photo or signature image
      x-passage-duty: fieldservice.inquire
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: captureId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The image
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/service/work-orders/{id}/checklist:
    put:
