      operationId: syncDispatchOptimization
      summary: Take the next step of an optimization
      description: Submits a PENDING optimization whose back-off has passed, or polls the RUNNING run at the dispatch service and stores its plan. Any other state is returned unchanged.
      x-passage-duty: fieldservice.technician.dispatch
      parameters:
        - $ref: "#/components/parameters/Id"
