        "200": { $ref: "#/components/responses/Replayed" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listCaseCategories
      summary: List the case categories ordered by code (at most 500); any one of the listed duties suffices
      x-passage-duty: [fieldservice.case.maintain, fieldservice.case.create, fieldservice.case-setup.admin]
      responses:
        "200":
          description: The categories
          content:
            application/json:
