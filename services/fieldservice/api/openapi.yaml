      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseProcessRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseProcess" }
        "200": { $ref: "#/components/responses/Replayed" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listCaseProcesses
      summary: List the case processes ordered by code (at most 500); any one of the listed duties suffices
      x-passage-duty: [fieldservice.case.maintain, fieldservice.case.create, fieldservice.case-setup.admin]
