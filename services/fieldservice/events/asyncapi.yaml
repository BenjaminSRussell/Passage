asyncapi: 3.0.0
info:
  title: Passage Field Service events
  version: 0.1.0
  description: |
    Events published by the fieldservice service (wave 45, slices 1 to 7). Every event is
    written to the service outbox in the same transaction as the state change and
    relayed by Debezium to Kafka. Envelope: CloudEvents 1.0 (source /passage/service/fieldservice).
defaultContentType: application/json
channels:
  caseOpened:
    address: passage.service.case
    messages:
      caseOpened:
        $ref: "#/components/messages/CaseOpened"
  workOrderPosted:
    address: passage.service.workorder
    messages:
      workOrderPosted:
        $ref: "#/components/messages/WorkOrderPosted"
  workOrderCompleted:
    address: passage.service.workorder.completed
    messages:
      workOrderCompleted:
        $ref: "#/components/messages/WorkOrderCompleted"
  slaAlerts:
    address: passage.service.sla
    messages:
      slaWarning:
        $ref: "#/components/messages/SLAWarning"
      slaBreached:
        $ref: "#/components/messages/SLABreached"
  articlePublished:
    address: passage.knowledge.article
    messages:
      articlePublished:
        $ref: "#/components/messages/ArticlePublished"
  caseStageChanged:
    address: passage.case.stage
    messages:
      caseStageChanged:
        $ref: "#/components/messages/CaseStageChanged"
  supplierClaimSettled:
    address: passage.service.supplierclaim
    messages:
      supplierClaimSettled:
        $ref: "#/components/messages/SupplierClaimSettled"
  agreementChanged:
    address: passage.service.agreement
    messages:
      agreementChanged:
        $ref: "#/components/messages/AgreementChanged"
  agreementVisitRecorded:
    address: passage.service.agreementvisit
    messages:
      agreementVisitRecorded:
        $ref: "#/components/messages/AgreementVisitRecorded"
  assignmentChanged:
    address: passage.service.assignment
    messages:
      assignmentChanged:
        $ref: "#/components/messages/AssignmentChanged"
  dispatchPublished:
    address: passage.service.dispatch
    messages:
      dispatchPublished:
        $ref: "#/components/messages/DispatchPublished"
operations:
  publishCaseOpened:
    action: send
    channel: { $ref: "#/channels/caseOpened" }
    summary: A service case was opened and its entitlement and SLA clocks started.
    messages:
      - $ref: "#/channels/caseOpened/messages/caseOpened"
  publishWorkOrderPosted:
    action: send
    channel: { $ref: "#/channels/workOrderPosted" }
    summary: A completed service work order was posted to billing and warranty cost.
    messages:
      - $ref: "#/channels/workOrderPosted/messages/workOrderPosted"
  publishWorkOrderCompleted:
    action: send
    channel: { $ref: "#/channels/workOrderCompleted" }
    summary: A work order was completed by the technician's complete action or by hand; inventory issues the consumed parts from the truck (BR-45.6).
    messages:
      - $ref: "#/channels/workOrderCompleted/messages/workOrderCompleted"
  publishSLAWarning:
    action: send
    channel: { $ref: "#/channels/slaAlerts" }
    summary: A case clock reached the 75 % warning threshold (BR-45.2, SVC-SLA-001); emitted once per case and clock.
    messages:
      - $ref: "#/channels/slaAlerts/messages/slaWarning"
  publishSLABreached:
    action: send
    channel: { $ref: "#/channels/slaAlerts" }
    summary: A case clock ran past its due (BR-45.2, SVC-SLA-002); emitted once per case and clock by the monitor, a late response or a transition.
    messages:
      - $ref: "#/channels/slaAlerts/messages/slaBreached"
  publishArticlePublished:
    action: send
    channel: { $ref: "#/channels/articlePublished" }
    summary: A knowledge article version was published (FR-45.13, BR-45.11); the previous PUBLISHED version of the article and language, if any, was retired in the same transaction.
    messages:
      - $ref: "#/channels/articlePublished/messages/articlePublished"
  publishCaseStageChanged:
    action: send
    channel: { $ref: "#/channels/caseStageChanged" }
    summary: A case in any non-service category moved to the next stage (its gate passed) or back one stage with a reason (FR-45.12, BR-45.9).
    messages:
      - $ref: "#/channels/caseStageChanged/messages/caseStageChanged"
  publishSupplierClaimSettled:
    action: send
    channel: { $ref: "#/channels/supplierClaimSettled" }
    summary: A vendor credit note was matched to an accepted supplier warranty claim, which is now SETTLED (FR-45.15, BR-45.12); analytics and the GL warranty recovery consume it.
    messages:
      - $ref: "#/channels/supplierClaimSettled/messages/supplierClaimSettled"
  publishAgreementChanged:
    action: send
    channel: { $ref: "#/channels/agreementChanged" }
    summary: A service agreement was activated, suspended, resumed, canceled or expired (FR-45.3); wave 29 starts or stops the subscription from it.
    messages:
      - $ref: "#/channels/agreementChanged/messages/agreementChanged"
  publishAgreementVisitRecorded:
    action: send
    channel: { $ref: "#/channels/agreementVisitRecorded" }
    summary: An included visit of an agreement line was consumed (FR-45.3); wave 29 bills PER_VISIT agreements from it.
    messages:
      - $ref: "#/channels/agreementVisitRecorded/messages/agreementVisitRecorded"
  publishAssignmentChanged:
    action: send
    channel: { $ref: "#/channels/assignmentChanged" }
    summary: A work order was assigned to a technician at a time, moved, or taken off the schedule (FR-45.7).
    messages:
      - $ref: "#/channels/assignmentChanged/messages/assignmentChanged"
  publishDispatchPublished:
    action: send
    channel: { $ref: "#/channels/dispatchPublished" }
    summary: The SCHEDULED work orders of a territory-day were dispatched to their technicians (FR-45.7).
    messages:
      - $ref: "#/channels/dispatchPublished/messages/dispatchPublished"
components:
  messages:
    CaseOpened:
      name: dev.passage.service.case.opened.v1
      contentType: application/cloudevents+json
      summary: A service case was opened with its entitlement resolved and its SLA clocks started.
      payload:
        type: object
        required: [caseId, number, customerId, priority, agreementId, responseDue, resolutionDue]
        additionalProperties: false
        properties:
          caseId: { type: string, format: uuid }
          number: { type: string, example: CS-000001 }
          customerId: { type: string, format: uuid }
          priority: { type: integer, minimum: 1, maximum: 4 }
          agreementId: { type: [string, "null"], format: uuid }
          responseDue: { type: string, format: date-time }
          resolutionDue: { type: string, format: date-time }
    WorkOrderCompleted:
      name: dev.passage.service.workorder.completed.v1
      contentType: application/cloudevents+json
      summary: A work order reached COMPLETED.
      description: |
        Written in the transaction that completes the work order: the merge of a COMPLETE action, or a manual
        transition. `consumedQty` is the sum of the technician's applied PART_USED actions per line; inventory
        issues it from the truck once per work order. `durationMinutes` is the time IN_PROGRESS by device time
        (0 for a manual completion without an action log).
      payload:
        type: object
        required: [workOrderId, number, customerId, legalEntityId, caseId, technicianId, firstTimeFix, durationMinutes, completedAt, lines]
        additionalProperties: false
        properties:
          workOrderId: { type: string, format: uuid }
          number: { type: string, example: SWO-000001 }
          customerId: { type: string, format: uuid }
          legalEntityId: { type: string, format: uuid }
          caseId: { type: [string, "null"], format: uuid }
          technicianId: { type: [string, "null"], format: uuid }
          firstTimeFix: { type: boolean }
          durationMinutes: { type: integer, minimum: 0 }
          completedAt: { type: string, format: date-time }
          lines:
            type: array
            items:
              type: object
              required: [lineId, kind, qty, consumedQty]
              additionalProperties: false
              properties:
                lineId: { type: string, format: uuid }
                kind: { type: string, enum: [LABOR, PART, TRAVEL, FEE] }
                qty: { type: string, description: Planned quantity as a decimal string. }
                consumedQty: { type: string, description: Reported consumption as a decimal string; "0" when none. }
    WorkOrderPosted:
      name: dev.passage.service.workorder.posted.v1
      contentType: application/cloudevents+json
      description: |
        Carries what wave-29 invoicing needs to invoice the BILLABLE lines (customer,
        legal entity, lines with coverage) and what the GL needs for warranty cost.
        The invoice id of PRD 8.45.5 is assigned by invoicing, not here.
      payload:
        type: object
        required: [workOrderId, number, customerId, legalEntityId, caseId, agreementId, currency, billableTotal, warrantyCost, entitlementConsumed, lines]
        additionalProperties: false
        properties:
          workOrderId: { type: string, format: uuid }
          number: { type: string, example: SWO-000001 }
          customerId: { type: string, format: uuid }
          legalEntityId: { type: string, format: uuid }
          caseId: { type: [string, "null"], format: uuid }
          agreementId: { type: [string, "null"], format: uuid }
          currency: { type: string, pattern: "^[A-Z]{3}$" }
          billableTotal:
            type: string
            description: Sum of BILLABLE line amounts as a decimal string (never a float).
          warrantyCost:
            type: string
            description: Cost of WARRANTY lines recorded for the warranty expense account.
          entitlementConsumed:
            type: string
            description: Included hours consumed from the agreement.
          lines:
            type: array
            items:
              type: object
              required: [lineId, kind, coverage, qty, amount, warrantyCost, agreementHours]
              additionalProperties: false
              properties:
                lineId: { type: string, format: uuid }
                kind: { type: string, enum: [LABOR, PART, TRAVEL, FEE] }
                coverage: { type: string, enum: [BILLABLE, WARRANTY, AGREEMENT] }
                qty: { type: string }
                amount: { type: string, description: Billed amount; zero unless BILLABLE }
                warrantyCost: { type: string }
                agreementHours: { type: string }
    SLAWarning:
      name: dev.passage.service.sla.warning.v1
      contentType: application/cloudevents+json
      summary: A case SLA clock reached the warning threshold; emitted once per case and clock.
      payload:
        type: object
        required: [caseId, number, slaType, priority, dueAt, warnedAt, thresholdPercent]
        additionalProperties: false
        properties:
          caseId: { type: string, format: uuid }
          number: { type: string, example: CS-000001 }
          slaType: { type: string, enum: [RESPONSE, RESOLUTION] }
          priority: { type: integer, minimum: 1, maximum: 4 }
          dueAt: { type: string, format: date-time }
          warnedAt: { type: string, format: date-time }
          thresholdPercent: { type: integer, example: 75 }
    SLABreached:
      name: dev.passage.service.sla.breached.v1
      contentType: application/cloudevents+json
      description: PRD 8.0 payload (caseId, slaType, dueAt, breachedAt) plus the case number and priority. breachedAt is when the service detected the breach.
      payload:
        type: object
        required: [caseId, number, slaType, priority, dueAt, breachedAt]
        additionalProperties: false
        properties:
          caseId: { type: string, format: uuid }
          number: { type: string, example: CS-000001 }
          slaType: { type: string, enum: [RESPONSE, RESOLUTION] }
          priority: { type: integer, minimum: 1, maximum: 4 }
          dueAt: { type: string, format: date-time }
          breachedAt: { type: string, format: date-time }
    ArticlePublished:
      name: dev.passage.knowledge.article.published.v1
      contentType: application/cloudevents+json
      description: PRD 8.45.5 payload (articleId, version, language, applicability) plus the article number, title, publish time and the version it retired. Consumers are the search index and copilot retrieval (wave 47).
      payload:
        type: object
        required: [articleId, number, version, language, title, applicability, publishedAt, retiredArticleId]
        additionalProperties: false
        properties:
          articleId: { type: string, format: uuid, description: Id of the published version row. }
          number: { type: string, example: KB-000001 }
          version: { type: integer, minimum: 1 }
          language: { type: string, example: en }
          title: { type: string }
          applicability:
            type: object
            required: [itemIds, itemGroupIds, incidentTypeIds, assetTypeIds, categoryIds]
            additionalProperties: false
            properties:
              itemIds: { type: array, items: { type: string, format: uuid } }
              itemGroupIds: { type: array, items: { type: string, format: uuid } }
              incidentTypeIds: { type: array, items: { type: string, format: uuid } }
              assetTypeIds: { type: array, items: { type: string, format: uuid } }
              categoryIds: { type: array, items: { type: string, format: uuid } }
          publishedAt: { type: string, format: date-time }
          retiredArticleId: { type: [string, "null"], format: uuid, description: The version row this publish retired. }
    CaseStageChanged:
      name: dev.passage.case.stage.changed.v1
      contentType: application/cloudevents+json
      description: PRD 8.45.5 payload (caseId, categoryId, from, to, at, actor) plus the case number and the reason of a move back. Consumers are workflow, notifications and the domain owners (HR, collections, audit).
      payload:
        type: object
        required: [caseId, number, categoryId, from, to, at, actor, reason]
        additionalProperties: false
        properties:
          caseId: { type: string, format: uuid }
          number: { type: string, example: CS-000002 }
          categoryId: { type: string, format: uuid }
          from: { type: string, description: Stage code the case left. }
          to: { type: string, description: Stage code the case entered. }
          at: { type: string, format: date-time }
          actor: { type: string, description: User id of the caller who moved the case. }
          reason: { type: string, description: The reason of a move back one stage; empty on a forward move. }
    SupplierClaimSettled:
      name: dev.passage.service.supplierclaim.settled.v1
      contentType: application/cloudevents+json
      description: |
        PRD 8.45.5 `dev.passage.service.supplier-claim.settled.v1` (claimId, vendorId, claimedAmount,
        recoveredAmount) plus the number, legal entity, currency, credit note and vendor reference. The
        kernel event type rule allows no hyphen in a segment, so the entity is `supplierclaim`. The GL
        warranty recovery credits the warranty expense account of the legal entity with recoveredAmount.
      payload:
        type: object
        required: [claimId, number, vendorId, legalEntityId, currency, claimedAmount, recoveredAmount, creditNoteId, vendorReference, settledAt]
        additionalProperties: false
        properties:
          claimId: { type: string, format: uuid }
          number: { type: string, example: SWC-000001 }
          vendorId: { type: string, format: uuid, description: The vendor party. }
          legalEntityId: { type: string, format: uuid }
          currency: { type: string, pattern: "^[A-Z]{3}$" }
          claimedAmount: { type: string, description: Claimed total as a decimal string. }
          recoveredAmount: { type: string, description: The matched credit as a decimal string; equals the accepted total. }
          creditNoteId: { type: string, description: The vendor credit note (wave 18) that settled the claim. }
          vendorReference: { type: string, description: The vendor's reference of the claim, quoted on the credit note. }
          settledAt: { type: string, format: date-time }
    AgreementChanged:
      name: dev.passage.service.agreement.changed.v1
      contentType: application/cloudevents+json
      summary: A service agreement changed status.
      description: |
        Written in the transaction of the change (the activate, suspend, resume or cancel action, or the
        expiry pass). Only ACTIVE agreements entitle cases and cover work orders, so wave 29 starts the
        subscription on ACTIVE and stops it on SUSPENDED, CANCELED or EXPIRED.
      payload:
        type: object
        required: [agreementId, number, customerId, legalEntityId, billingModel, from, to, reason, validTo, at, actor]
        additionalProperties: false
        properties:
          agreementId: { type: string, format: uuid }
          number: { type: string, example: SA-000001 }
          customerId: { type: string, format: uuid }
          legalEntityId: { type: string, format: uuid }
          billingModel: { type: string, enum: [PREPAID, PER_VISIT, SUBSCRIPTION], description: Tells wave 29 whether a subscription starts or stops. }
          from: { type: string, enum: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, CANCELED] }
          to: { type: string, enum: [DRAFT, ACTIVE, SUSPENDED, EXPIRED, CANCELED] }
          reason: { type: string, description: The caller's reason; empty for an activation, and "validTo passed" from the expiry pass. }
          validTo: { type: [string, "null"], format: date }
          at: { type: string, format: date-time }
          actor: { type: string, description: User id of the caller who made the change or ran the expiry pass; empty when the caller has no user. }
    AgreementVisitRecorded:
      name: dev.passage.service.agreementvisit.recorded.v1
      contentType: application/cloudevents+json
      summary: An included visit of an agreement line was consumed.
      description: Written in the transaction that records the visit. visitsLeft is what remains of the line's includedVisits.
      payload:
        type: object
        required: [visitId, agreementId, number, customerId, legalEntityId, billingModel, lineIndex, kind, visitDate, workOrderId, visitsLeft]
        additionalProperties: false
        properties:
          visitId: { type: string, format: uuid }
          agreementId: { type: string, format: uuid }
          number: { type: string, example: SA-000001 }
          customerId: { type: string, format: uuid, description: The customer party wave 29 bills. }
          legalEntityId: { type: string, format: uuid }
          billingModel: { type: string, enum: [PREPAID, PER_VISIT, SUBSCRIPTION], description: Wave 29 bills the visit when PER_VISIT. }
          lineIndex: { type: integer, minimum: 0 }
          kind: { type: string, enum: [PREVENTIVE, CORRECTIVE] }
          visitDate: { type: string, format: date }
          workOrderId: { type: [string, "null"], format: uuid }
          visitsLeft: { type: integer, minimum: 0 }
    AssignmentChanged:
      name: dev.passage.service.assignment.changed.v1
      contentType: application/cloudevents+json
      summary: A work order was assigned to a technician, moved or unassigned.
      description: |
        Written in the transaction of the assign or unassign call. ASSIGNED also covers a move to another
        technician or time, with previousTechnicianId set when the technician changed. For UNASSIGNED the
        technician and times are the ones the order lost.
      payload:
        type: object
        required: [workOrderId, number, legalEntityId, territoryId, action, technicianId, previousTechnicianId, start, end, pinned, at, actor]
        additionalProperties: false
        properties:
          workOrderId: { type: string, format: uuid }
          number: { type: string, example: SWO-000001 }
          legalEntityId: { type: string, format: uuid }
          territoryId: { type: string, format: uuid }
          action: { type: string, enum: [ASSIGNED, UNASSIGNED] }
          technicianId: { type: [string, "null"], format: uuid }
          previousTechnicianId: { type: [string, "null"], format: uuid }
          start: { type: [string, "null"], format: date-time }
          end: { type: [string, "null"], format: date-time }
          pinned: { type: boolean, description: A pinned assignment survives re-optimization (BR-45.3). }
          at: { type: string, format: date-time }
          actor: { type: string, description: User id of the dispatcher; empty when the caller has no user. }
    DispatchPublished:
      name: dev.passage.service.dispatch.published.v1
      contentType: application/cloudevents+json
      summary: The SCHEDULED work orders of a territory-day were dispatched.
      description: |
        Written in the transaction that moves the work orders from SCHEDULED to DISPATCHED. Assignments are
        listed per technician in route order (sequence from 1). The technician apps and customer
        notifications consume it.
      payload:
        type: object
        required: [runId, legalEntityId, territoryId, date, timeZone, publishedAt, actor, assignments]
        additionalProperties: false
        properties:
          runId: { type: string, format: uuid }
          legalEntityId: { type: string, format: uuid }
          territoryId: { type: string, format: uuid }
          date: { type: string, format: date, description: The local calendar day in timeZone. }
          timeZone: { type: string, example: America/Chicago }
          publishedAt: { type: string, format: date-time }
          actor: { type: string }
          assignments:
            type: array
            items:
              type: object
              required: [workOrderId, number, technicianId, sequence, start, end]
              additionalProperties: false
              properties:
                workOrderId: { type: string, format: uuid }
                number: { type: string, example: SWO-000001 }
                technicianId: { type: string, format: uuid }
                sequence: { type: integer, minimum: 1 }
                start: { type: string, format: date-time }
                end: { type: string, format: date-time }
