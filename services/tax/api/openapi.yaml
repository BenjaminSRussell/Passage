openapi: 3.0.3
info:
  title: Passage Tax
  version: 0.3.0
  description: >-
    Tax determination, calculation, withholding, provider failover, settlement reconciliation to the
    general ledger and a SAF-T tax extract. Amounts are decimal strings with at most 6 decimal places,
    dates are YYYY-MM-DD. Errors are RFC 7807 problem+json with code, serviceCode and traceId.
paths:
  /healthz:
    get:
      operationId: liveness
      x-passage-duty: public
      responses:
        "200": { description: The process is up }
  /readyz:
    get:
      operationId: readiness
      x-passage-duty: public
      responses:
        "200": { description: The database answers a ping }
        "503": { description: The database is unreachable }
  /v1/tax/calculate:
    post:
      operationId: calculateTax
      x-passage-duty: tax.tax.calculate
      summary: Stateless tax calculation of one document
      description: >-
        With a provider name the call goes to that provider and falls back to the internal engine on a
        timeout or 5xx (warning TAX-0007, fallback true). The document is then queued for recommit and
        dev.passage.tax.provider.fallback.v1 is published when the tax store is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalculateRequest" }
      responses:
        "200":
          description: Calculation result with per-line taxes and determination trace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalculateResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/tax/withholding/calculate:
    post:
      operationId: calculateWithholding
      x-passage-duty: tax.withholding.calculate
      summary: Stateless withholding tax calculation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WithholdingRequest" }
      responses:
        "200":
          description: Taxable base, withholding amount and net payable with determination trace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithholdingResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/tax/transactions:
    post:
      operationId: recordTaxTransactions
      x-passage-duty: tax.transaction.record
      summary: Record posted tax amounts of the request's legal entity
      description: Idempotent per transaction id; a transaction already recorded is counted as a duplicate and left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionsRequest" }
      responses:
        "201":
          description: Recorded and duplicate counts
          content:
            application/json:
              schema:
                type: object
                required: [recorded, duplicates]
                properties:
                  recorded: { type: integer }
                  duplicates: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/settlements:run:
    post:
      operationId: runTaxSettlement
      x-passage-duty: tax.settlement.run
      summary: Settle the open tax transactions of a period after reconciling to the GL tax accounts to the cent
      description: >-
        Every recorded transaction of the period, settled or not, is compared per code and direction with
        the movement of its GL tax account read from the ledger (output tax is the credit movement, input
        tax the debit movement). The period must cover whole calendar months. Any difference is TAX-0008
        and nothing is settled. Open transactions are then marked with the new run (a delta run when
        earlier runs exist). No open transaction is TAX-0009. A ledger that cannot be read is 502. The ledger and account map come from the legal entity's stored
        configuration (PUT /v1/tax/ledger-config); none stored is 422 COM-0503.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettleRequest" }
      responses:
        "201":
          description: The settlement run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/ledger-config:
    put:
      operationId: setTaxLedgerConfig
      x-passage-duty: tax.ledgerconfig.manage
      summary: Set the ledger and GL tax accounts a legal entity settles against
      description: >-
        Stores the ledger and the code|direction to GL account map for the request's single legal entity.
        Settlement reads only this stored configuration, never the settlement request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LedgerConfig" }
      responses:
        "200":
          description: The stored configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerConfig" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/recommit:run:
    post:
      operationId: runTaxRecommit
      x-passage-duty: tax.recommit.run
      summary: Re-calculate queued fallback documents on their external provider
      description: >-
        Takes the oldest pending queue entries of the request's legal entity, calculates each on its
        provider again and marks it done when the provider answers. A provider that is still down leaves the
        entry pending with an attempt counted; after 5 attempts the entry is marked failed and no longer
        taken, and entries with fewer attempts are taken first. Call it from the scheduler.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Counts of the batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommitSummary" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/saft:
    get:
      operationId: exportSaft
      x-passage-duty: tax.saft.export
      summary: SAF-T tax extract of a period
      description: >-
        XML in the OECD SAF-T 2.00 namespace with the header and a tax table of per-code period totals.
        With ledger_id the extract also carries the ledger's journals for the period as GeneralLedgerEntries, read from the
        ledger service and checked for balance and control totals; ledger_id must belong to the caller's legal entity, the period must cover whole calendar months and currency must equal the
        ledger's accounting currency (422 TAX-0011). Ledger data that does not form a valid extract is 502 TAX-0012.
        Customers and suppliers are not exported yet.
      parameters:
        - { name: period_from, in: query, required: true, schema: { type: string, format: date } }
        - { name: period_to, in: query, required: true, schema: { type: string, format: date } }
        - { name: company_name, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: registration_number, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: country, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: currency, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: ledger_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The SAF-T document
          content:
            application/xml:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/jurisdictions:
    get:
      operationId: listJurisdictions
      x-passage-duty: tax.config.read
      summary: The jurisdiction tree as a flat list with parent codes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemsOfJurisdiction" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/jurisdictions/{code}:
    put:
      operationId: putJurisdiction
      x-passage-duty: tax.config.manage
      summary: Create or replace a jurisdiction; refuses a parent that loops the tree
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Jurisdiction" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Jurisdiction" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteJurisdiction
      x-passage-duty: tax.config.manage
      summary: Delete a jurisdiction with no children and no tax codes (TAX-0013 otherwise)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: OK }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/codes:
    get:
      operationId: listTaxCodes
      x-passage-duty: tax.config.read
      summary: Stored tax codes with their effective-dated rates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemsOfConfigCode" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/codes/{code}:
    put:
      operationId: putTaxCode
      x-passage-duty: tax.config.manage
      summary: Create or replace a tax code and its rate history
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigCode" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigCode" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteTaxCode
      x-passage-duty: tax.config.manage
      summary: Delete a tax code that no group or return box uses (TAX-0013 otherwise)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: OK }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/groups/{kind}:
    get:
      operationId: listTaxGroups
      x-passage-duty: tax.config.read
      summary: Party tax groups (kind party) or item tax groups (kind item)
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemsOfGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/groups/{kind}/{code}:
    put:
      operationId: putTaxGroup
      x-passage-duty: tax.config.manage
      summary: Create or replace a tax group and the tax codes it selects
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Group" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteTaxGroup
      x-passage-duty: tax.config.manage
      summary: Delete a tax group
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: OK }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/config:
    get:
      operationId: getTaxConfig
      x-passage-duty: tax.config.read
      summary: The stored configuration in the shape calculate takes inline; send stored_config true to use it
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredConfig" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/entity-settings:
    get:
      operationId: getEntitySettings
      x-passage-duty: tax.config.read
      summary: Country and VAT number of the request's legal entity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitySetting" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    put:
      operationId: putEntitySettings
      x-passage-duty: tax.config.manage
      summary: Set the country and VAT number of the request's legal entity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntitySetting" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitySetting" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/vat-boxes:
    get:
      operationId: listVatBoxes
      x-passage-duty: tax.config.read
      summary: VAT return box definitions and the tax codes each box sums
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemsOfBox" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    put:
      operationId: putVatBoxes
      x-passage-duty: tax.config.manage
      summary: Replace the whole box set
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoxesRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemsOfBox" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/vat-return:
    get:
      operationId: getVatReturn
      x-passage-duty: tax.vatreturn.read
      summary: Box totals of the request's legal entity over a period, computed from recorded tax transactions
      parameters:
        - { name: period_from, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
        - { name: period_to, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [gb-mtd-json, de-ustva-csv] }, description: "Return the figures as a national filing file instead of JSON. Needs the matching layout applied; refused while transactions lack a base amount." }
        - { name: period_key, in: query, required: false, schema: { type: string, maxLength: 8 }, description: "The authority's period key; required for gb-mtd-json." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VatReturn" }
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/esl:
    get:
      operationId: getEuSalesList
      x-passage-duty: tax.vatreturn.read
      summary: EU sales list: supplies to other member states grouped by country, VAT number and kind of supply
      parameters:
        - { name: period_from, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
        - { name: period_to, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [de-zm-csv] }, description: "Return the list as a national filing file instead of JSON; refused while sales lack a VAT number or a base amount." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Esl" }
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/intrastat/master/{kind}:
    get:
      operationId: listIntrastatMaster
      x-passage-duty: tax.intrastat.read
      summary: Intrastat master data of one kind (commodity, transaction_code, transport_mode, port, country or delivery_terms)
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemsOfMaster" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/intrastat/master/{kind}/{code}:
    put:
      operationId: putIntrastatMaster
      x-passage-duty: tax.intrastatmaster.manage
      summary: Create or replace one master data entry
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterEntry" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteIntrastatMaster
      x-passage-duty: tax.intrastatmaster.manage
      summary: Delete one master data entry
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: OK }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tax/intrastat/journals:
    get:
      operationId: listIntrastatJournals
      x-passage-duty: tax.intrastat.read
      summary: Intrastat journals of the request's legal entity, newest period first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemsOfJournal" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
