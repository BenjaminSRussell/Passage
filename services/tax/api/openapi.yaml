        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  responses:
    Problem:
      description: RFC 7807 problem (COM-0001, COM-0500, COM-0502, COM-0503, AUTH-0001, AUTH-0003, TAX-0001 to TAX-0009, TAX-0011 to TAX-0013)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, serviceCode]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        serviceCode: { type: string }
        traceId: { type: string }
        errors: { type: object, additionalProperties: { type: string } }
    Decimal: { type: string, pattern: '^-?[0-9]+(\.[0-9]{1,6})?$' }
    Date: { type: string, format: date }
    Rate:
      type: object
      properties:
        valid_from: { $ref: "#/components/schemas/Date" }
        valid_to: { $ref: "#/components/schemas/Date" }
        from_amount: { $ref: "#/components/schemas/Decimal" }
        to_amount: { $ref: "#/components/schemas/Decimal" }
        rate_pct: { $ref: "#/components/schemas/Decimal" }
        min_tax: { $ref: "#/components/schemas/Decimal" }
        max_tax: { $ref: "#/components/schemas/Decimal" }
    CalculateRequest:
      type: object
      required: [currency, direction, document_date, lines]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        direction: { type: string, enum: [output, input] }
        document_date: { $ref: "#/components/schemas/Date" }
        tax_date: { $ref: "#/components/schemas/Date" }
        ship_from_country: { type: string }
        document_ref: { type: string, description: "Names the document at an external provider so a later commit or void can find it; without it a provider only quotes." }
        provider: { type: string, enum: [avalara, vertex], description: External provider name (avalara or vertex, when configured); empty uses the internal engine. }
        stored_config: { type: boolean, description: Use the persisted tax configuration (GET /v1/tax/config) instead of an inline config. }
        party:
          type: object
          properties:
            tax_group: { type: string }
            tax_id: { type: string }
            country: { type: string }
            certificate: { type: string }
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [line_ref, amount]
            properties:
              line_ref: { type: string, maxLength: 64 }
              amount: { $ref: "#/components/schemas/Decimal" }
              item_tax_group: { type: string }
              price_includes_tax: { type: boolean }
        config:
          type: object
          properties:
            default_rounding: { type: string, enum: [per_line, per_document] }
            groups: { type: object, additionalProperties: { type: array, items: { type: string } } }
            item_groups: { type: object, additionalProperties: { type: array, items: { type: string } } }
            codes:
              type: array
              items:
                type: object
                required: [code]
                properties:
                  code: { type: string }
                  jurisdiction: { type: string }
                  mechanism: { type: string, enum: [standard, reverse_charge, use_tax] }
                  calc_basis: { type: string, enum: [line, document] }
                  rounding: { type: string, enum: [per_line, per_document] }
                  compound_sequence: { type: integer, minimum: 0 }
                  recoverable_pct: { $ref: "#/components/schemas/Decimal" }
                  rates: { type: array, items: { $ref: "#/components/schemas/Rate" } }
            exemptions:
              type: array
              items:
                type: object
                properties:
                  number: { type: string }
                  codes: { type: array, items: { type: string } }
                  valid_from: { $ref: "#/components/schemas/Date" }
                  valid_to: { $ref: "#/components/schemas/Date" }
    CalculateResult:
      type: object
      required: [engine, fallback, lines, document_taxes_by_code, warnings, determination_trace]
      properties:
        engine: { type: string }
        fallback: { type: boolean }
        lines:
          type: array
          items:
            type: object
            properties:
              line_ref: { type: string }
              base: { $ref: "#/components/schemas/Decimal" }
              taxes:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string }
                    jurisdiction: { type: string }
                    rate_pct: { $ref: "#/components/schemas/Decimal" }
                    tax_amount: { $ref: "#/components/schemas/Decimal" }
                    recoverable: { $ref: "#/components/schemas/Decimal" }
                    nonrecoverable: { $ref: "#/components/schemas/Decimal" }
                    direction: { type: string }
        document_taxes_by_code:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              direction: { type: string }
              base: { $ref: "#/components/schemas/Decimal" }
              tax_amount: { $ref: "#/components/schemas/Decimal" }
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              detail: { type: string }
        determination_trace: { type: array, items: { type: string } }
    WithholdingRequest:
      type: object
      required: [currency, party_type, payment_date, code, gross_amount, codes]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        party_type: { type: string, enum: [vendor, customer] }
        payment_date: { $ref: "#/components/schemas/Date" }
        code: { type: string }
        gross_amount: { $ref: "#/components/schemas/Decimal" }
        paid_to_date: { $ref: "#/components/schemas/Decimal" }
        codes:
          type: array
          items:
            type: object
            required: [code]
            properties:
              code: { type: string }
              jurisdiction: { type: string }
              income_type: { type: string }
              rates:
                type: array
                items:
                  type: object
                  properties:
                    valid_from: { $ref: "#/components/schemas/Date" }
                    valid_to: { $ref: "#/components/schemas/Date" }
                    rate_pct: { $ref: "#/components/schemas/Decimal" }
                    threshold: { $ref: "#/components/schemas/Decimal" }
    WithholdingResult:
      type: object
      properties:
        code: { type: string }
        jurisdiction: { type: string }
        income_type: { type: string }
        party_type: { type: string }
        rate_pct: { $ref: "#/components/schemas/Decimal" }
        gross_amount: { $ref: "#/components/schemas/Decimal" }
        taxable_base: { $ref: "#/components/schemas/Decimal" }
        withholding_amount: { $ref: "#/components/schemas/Decimal" }
        net_payable: { $ref: "#/components/schemas/Decimal" }
        determination_trace: { type: array, items: { type: string } }
    TransactionsRequest:
      type: object
      required: [transactions]
      properties:
        transactions:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [id, code, direction, tax_date, amount]
            properties:
              id: { type: string, format: uuid }
              code: { type: string, maxLength: 64 }
              direction: { type: string, enum: [output, input, use] }
              tax_date: { $ref: "#/components/schemas/Date" }
              amount: { $ref: "#/components/schemas/Decimal" }
              base_amount: { $ref: "#/components/schemas/Decimal" }
              recoverable_amount: { $ref: "#/components/schemas/Decimal", description: "Input or use tax only: the part found recoverable under the recovery policies; the VAT reclaim totals it, else it applies the code recoverable_pct." }
              counterparty_country: { type: string, pattern: '^[A-Z]{2}$' }
              counterparty_vat_id: { type: string, maxLength: 20 }
              supply_kind: { type: string, enum: [goods, services, triangular] }
    SettleRequest:
      type: object
      required: [period_from, period_to]
      properties:
        period_from: { $ref: "#/components/schemas/Date" }
        period_to: { $ref: "#/components/schemas/Date" }
    LedgerConfig:
      type: object
      required: [ledger_id, accounts]
      properties:
        ledger_id: { type: string, format: uuid }
        accounts:
          type: object
          description: GL tax account per "code|direction" key, for example "VAT19|output".
          additionalProperties: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$' }
    SettlementRun:
      type: object
      required: [id, ledger_id, version, period_from, period_to, output_tax_total, input_tax_total, net_amount, transaction_ids, lines]
      properties:
        id: { type: string, format: uuid }
        ledger_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        period_from: { $ref: "#/components/schemas/Date" }
        period_to: { $ref: "#/components/schemas/Date" }
        output_tax_total: { $ref: "#/components/schemas/Decimal" }
        input_tax_total: { $ref: "#/components/schemas/Decimal" }
        net_amount: { $ref: "#/components/schemas/Decimal" }
        transaction_ids: { type: array, items: { type: string, format: uuid } }
        lines:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              direction: { type: string }
              amount: { $ref: "#/components/schemas/Decimal" }
    RecommitSummary:
      type: object
      required: [processed, completed, failed]
      properties:
        processed: { type: integer }
        completed: { type: integer }
        failed: { type: integer }
    StoredConfig:
      type: object
      description: The engine configuration (groups, item_groups, codes) assembled from what is stored.
      additionalProperties: true
    ItemsOfJurisdiction:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Jurisdiction" } }
    ItemsOfConfigCode:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ConfigCode" } }
    ItemsOfGroup:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Group" } }
    ItemsOfBox:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Box" } }
    ItemsOfMaster:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MasterEntry" } }
    ItemsOfJournal:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Journal" } }
    Jurisdiction:
      type: object
      required: [name, kind, country]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9._-]{1,32}$' }
        name: { type: string, maxLength: 120 }
        kind: { type: string, enum: [country, state, county, city, district] }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        parent_code: { type: string, description: Empty for a root; must exist and not loop the tree. }
    ConfigCode:
      type: object
      required: [name, jurisdiction]
      properties:
        code: { type: string }
        name: { type: string, maxLength: 120 }
        jurisdiction: { type: string, description: Code of a stored jurisdiction. }
        mechanism: { type: string, enum: [standard, reverse_charge, use_tax] }
        calc_basis: { type: string, enum: [line, document] }
        rounding: { type: string, enum: [per_line, per_document] }
        compound_sequence: { type: integer, minimum: 0 }
        recoverable_pct: { $ref: "#/components/schemas/Decimal" }
        rates:
          type: array
          maxItems: 200
          items:
            type: object
            required: [valid_from, rate_pct]
            properties:
              valid_from: { $ref: "#/components/schemas/Date" }
              valid_to: { $ref: "#/components/schemas/Date" }
              rate_pct: { $ref: "#/components/schemas/Decimal" }
              from_amount: { $ref: "#/components/schemas/Decimal" }
              to_amount: { $ref: "#/components/schemas/Decimal" }
              min_tax: { $ref: "#/components/schemas/Decimal" }
              max_tax: { $ref: "#/components/schemas/Decimal" }
    Group:
      type: object
      required: [name]
      properties:
        kind: { type: string, enum: [party, item] }
        code: { type: string }
        name: { type: string }
        tax_codes: { type: array, items: { type: string } }
    EntitySetting:
      type: object
      required: [home_country]
      properties:
        home_country: { type: string, pattern: '^[A-Z]{2}$' }
        vat_id: { type: string, maxLength: 20 }
    Box:
      type: object
      required: [box, label, kind]
      properties:
        box: { type: string, pattern: '^[A-Za-z0-9._-]{1,16}$' }
        label: { type: string }
        kind: { type: string, enum: [base, tax, payable] }
        sort: { type: integer }
        codes:
          type: array
          items:
            type: object
            required: [code, direction]
            properties:
              code: { type: string }
              direction: { type: string, enum: [output, input, use] }
    BoxesRequest:
      type: object
      required: [boxes]
      properties:
        boxes: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/Box" } }
    VatReturn:
      type: object
      properties:
        period_from: { $ref: "#/components/schemas/Date" }
        period_to: { $ref: "#/components/schemas/Date" }
        boxes:
          type: array
          items:
            type: object
            properties:
              box: { type: string }
              label: { type: string }
              kind: { type: string }
              amount: { $ref: "#/components/schemas/Decimal" }
        transactions: { type: integer }
        missing_base: { type: integer, description: Transactions feeding a base box without a base amount; the box is understated. }
        unmapped: { type: integer, description: Transactions whose code and direction feed no box. }
    Esl:
      type: object
      properties:
        period_from: { $ref: "#/components/schemas/Date" }
        period_to: { $ref: "#/components/schemas/Date" }
        home_country: { type: string }
        vat_id: { type: string }
        rows:
          type: array
          items:
            type: object
            properties:
              country: { type: string }
              vat_id: { type: string }
              indicator: { type: string, enum: [L, S, T] }
              supply_kind: { type: string, enum: [goods, services, triangular] }
              base: { $ref: "#/components/schemas/Decimal" }
              transactions: { type: integer }
        total: { $ref: "#/components/schemas/Decimal" }
        missing_vat_id: { type: integer }
        missing_base: { type: integer }
    MasterEntry:
      type: object
      required: [description]
      properties:
        kind: { type: string, enum: [commodity, transaction_code, transport_mode, port, country, delivery_terms] }
        code: { type: string }
        description: { type: string, maxLength: 200 }
        attrs:
          type: object
          description: supplementary_unit on commodities; eu_member and intrastat_code on countries; country on ports.
          additionalProperties: { type: string, maxLength: 20 }
    CreateJournalRequest:
      type: object
      required: [flow, period_from]
      properties:
        flow: { type: string, enum: [arrival, dispatch] }
        period_from: { $ref: "#/components/schemas/Date" }
    IntrastatLine:
      type: object
      properties:
        line_no: { type: integer }
        source_ref: { type: string, maxLength: 64 }
        partner_country: { type: string }
        commodity_code: { type: string }
        transaction_code: { type: string }
        transport_mode: { type: string }
        delivery_terms: { type: string }
        port: { type: string }
        origin_country: { type: string }
        net_mass: { $ref: "#/components/schemas/Decimal" }
        supplementary_qty: { $ref: "#/components/schemas/Decimal" }
        invoice_value: { $ref: "#/components/schemas/Decimal" }
        statistical_value: { $ref: "#/components/schemas/Decimal" }
        compressed_from: { type: integer }
        errors: { type: array, items: { type: string } }
    TransferRequest:
      type: object
      required: [lines]
      properties:
        lines: { type: array, minItems: 1, maxItems: 5000, items: { $ref: "#/components/schemas/IntrastatLine" } }
    TransferResult:
      type: object
      properties:
        added: { type: integer }
        skipped: { type: integer }
    Journal:
      type: object
      properties:
        id: { type: string, format: uuid }
        flow: { type: string, enum: [arrival, dispatch] }
        period_from: { $ref: "#/components/schemas/Date" }
        status: { type: string, enum: [draft, validated, exported] }
        correction_of: { type: string }
        created_at: { type: string, format: date-time }
        exported_at: { type: string, format: date-time, nullable: true }
        line_count: { type: integer }
        error_count: { type: integer }
        lines: { type: array, items: { $ref: "#/components/schemas/IntrastatLine" } }
    Certificate:
      type: object
      required: [codes, valid_from]
      properties:
        number: { type: string, pattern: '^[A-Za-z0-9._/-]{1,64}$' }
        party_ref: { type: string, maxLength: 64 }
        note: { type: string, maxLength: 200 }
        codes: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
        valid_from: { $ref: "#/components/schemas/Date" }
        valid_to: { $ref: "#/components/schemas/Date" }
    ItemsOfCertificate:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Certificate" } }
    SeedRequest:
      type: object
      properties:
        kinds: { type: array, items: { type: string, enum: [commodity, transaction_code, transport_mode, port, country, delivery_terms] } }
    ImportRequest:
      type: object
      required: [entries]
      properties:
        entries: { type: array, minItems: 1, maxItems: 5000, items: { $ref: "#/components/schemas/MasterEntry" } }
        overwrite: { type: boolean }
    ImportResult:
      type: object
      properties:
        added: { type: integer }
        skipped: { type: integer }
    ApplyLayoutRequest:
      type: object
      required: [mapping]
      properties:
        mapping:
          type: object
          description: Per box id, the tax codes and directions that feed it; a payable box takes none.
          additionalProperties:
            type: array
            items:
              type: object
              required: [code, direction]
              properties:
                code: { type: string }
                direction: { type: string, enum: [output, input, use] }
    ItemsOfBox:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Box" } }
    ItemsOfLayout:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              country: { type: string }
              name: { type: string }
              format: { type: string, enum: [gb-mtd-json, de-ustva-csv] }
              boxes:
                type: array
                items:
                  type: object
                  properties:
                    box: { type: string }
                    label: { type: string }
                    kind: { type: string, enum: [base, tax, payable] }
                    role: { type: string }
    RecoveryPolicy:
      type: object
      required: [recoverable_pct, valid_from]
      properties:
        code: { type: string }
        item_group: { type: string, description: "An item tax group; empty applies to every group of the code, and a policy for the line's own group wins." }
        recoverable_pct: { $ref: "#/components/schemas/Decimal" }
        valid_from: { $ref: "#/components/schemas/Date" }
        valid_to: { $ref: "#/components/schemas/Date" }
        note: { type: string, maxLength: 200 }
    ItemsOfRecoveryPolicy:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RecoveryPolicy" } }
    Reclaim:
      type: object
      properties:
        period_from: { $ref: "#/components/schemas/Date" }
        period_to: { $ref: "#/components/schemas/Date" }
        total_input_tax: { type: string }
        total_recoverable: { type: string }
        total_non_recoverable: { type: string }
        rows:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              input_tax: { type: string }
              recoverable: { type: string }
              non_recoverable: { type: string }
              transactions: { type: integer }
              estimated: { type: integer, description: "Transactions recorded without a recoverable amount, which took the code's own recoverable_pct." }
