apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: tax
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tax
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tax
    spec:
      securityContext:
        runAsNonRoot: true
        {{- if .Values.serviceIdentity.signingKeySecret }}
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
{{- if .Values.serviceIdentity.signingKeySecret }}
      volumes:
        - name: service-identity
          secret:
            secretName: {{ .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
{{- end }}
      containers:
        - name: tax
          image: {{ include "tax.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            - name: PASSAGE_SERVICE_NAME
              value: tax
{{- if .Values.serviceIdentity.signingKeySecret }}
            - name: PASSAGE_SERVICE_SIGNING_KEY_FILE
              value: /var/run/passage/service-identity/signing-key
{{- if .Values.serviceIdentity.keyId }}
            - name: PASSAGE_SERVICE_KEY_ID
              value: {{ .Values.serviceIdentity.keyId | quote }}
{{- end }}
{{- end }}
{{- if .Values.serviceIdentity.publicKeys }}
            - { name: PASSAGE_SERVICE_PUBLIC_KEYS, value: {{ .Values.serviceIdentity.publicKeys | quote }} }
{{- end }}
            - { name: LEDGER_URL, value: {{ .Values.ledgerUrl | quote }} }
            - { name: TAX_PROVIDER_TIMEOUT_MS, value: {{ .Values.providerTimeoutMs | quote }} }
{{- with .Values.providers.avalara }}
{{- if .url }}
            - { name: AVALARA_URL, value: {{ .url | quote }} }
            - { name: AVALARA_COMPANY_CODE, value: {{ .companyCode | quote }} }
            - { name: AVALARA_ACCOUNT_ID, valueFrom: { secretKeyRef: { name: {{ .secret | quote }}, key: account-id } } }
            - { name: AVALARA_LICENSE_KEY, valueFrom: { secretKeyRef: { name: {{ .secret | quote }}, key: license-key } } }
{{- end }}
{{- end }}
{{- with .Values.providers.vertex }}
{{- if .url }}
            - { name: VERTEX_URL, value: {{ .url | quote }} }
            - { name: VERTEX_TOKEN_URL, value: {{ .tokenUrl | quote }} }
            - { name: VERTEX_COMPANY, value: {{ .company | quote }} }
            - { name: VERTEX_CLIENT_ID, valueFrom: { secretKeyRef: { name: {{ .secret | quote }}, key: client-id } } }
            - { name: VERTEX_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: {{ .secret | quote }}, key: client-secret } } }
            - { name: VERTEX_USERNAME, valueFrom: { secretKeyRef: { name: {{ .secret | quote }}, key: username } } }
            - { name: VERTEX_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .secret | quote }}, key: password } } }
{{- end }}
{{- end }}
{{- if .Values.settlement.tenantIds }}
            - { name: TAX_SETTLEMENT_TENANT_IDS, value: {{ join "," .Values.settlement.tenantIds | quote }} }
            - { name: TAX_SETTLEMENT_DAY, value: {{ .Values.settlement.day | quote }} }
            - { name: TAX_SETTLEMENT_AT, value: {{ .Values.settlement.at | quote }} }
{{- end }}
{{- if .Values.recommit.tenantIds }}
            - { name: TAX_RECOMMIT_TENANT_IDS, value: {{ join "," .Values.recommit.tenantIds | quote }} }
            - { name: TAX_RECOMMIT_INTERVAL, value: {{ .Values.recommit.interval | quote }} }
{{- end }}
{{- if .Values.serviceIdentity.signingKeySecret }}
          volumeMounts:
            - { name: service-identity, mountPath: /var/run/passage/service-identity, readOnly: true }
{{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
