[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passage-tms-optimizer"
version = "0.1.0"
description = "Passage transportation route optimizer (OR-Tools VRP) for wave 34"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.10",
  "fastapi>=0.110",
  "pydantic>=2.6",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["tms_optimizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
