asyncapi: 3.0.0
info:
  title: Passage integration hub events
  version: 0.2.0
  description: |
    The hub's own CloudEvents 1.0 (platform/go/events envelope), written to the outbox
    in the same transaction as the change (src/events.ts) and relayed by Debezium. The
    outbox payload is the whole envelope; the schemas below are its `data` member, with
    snake_case field names as in the PRD. Subscription URLs, signing secrets and rest-push
    credentials never appear in an event. The outbox `aggregate_type` is the type's entity
    segment, so the EventRouter publishes each event to `passage.hub.<entity>`, the topic
    platform/go/events.Topic gives for its type (the channels below); the Kafka key is the
    subscription, API client or catalog entry id. When the hub consumes `passage.hub.webhook` and a
    subscription matches `dev.passage.hub.webhook.*`, that subscription receives the
    outcome events, but delivering an outcome event writes no outcome event of its own
    (no feedback loop).
defaultContentType: application/cloudevents+json
channels:
  passage.hub.subscription:
    address: passage.hub.subscription
    messages:
      subscriptionCreated:
        $ref: '#/components/messages/subscriptionCreated'
      subscriptionUpdated:
        $ref: '#/components/messages/subscriptionUpdated'
      subscriptionDeleted:
        $ref: '#/components/messages/subscriptionDeleted'
      subscriptionPaused:
        $ref: '#/components/messages/subscriptionPaused'
      subscriptionResumed:
        $ref: '#/components/messages/subscriptionResumed'
  passage.hub.webhook:
    address: passage.hub.webhook
    messages:
      webhookDelivered:
        $ref: '#/components/messages/webhookDelivered'
      webhookDeadlettered:
        $ref: '#/components/messages/webhookDeadlettered'
  passage.hub.apiclient:
    address: passage.hub.apiclient
    messages:
      apiClientRegistered:
        $ref: '#/components/messages/apiClientRegistered'
      apiClientUpdated:
        $ref: '#/components/messages/apiClientUpdated'
      apiClientRevoked:
        $ref: '#/components/messages/apiClientRevoked'
  passage.hub.catalogentry:
    address: passage.hub.catalogentry
    messages:
      catalogEntryPublished:
        $ref: '#/components/messages/catalogEntryPublished'
      catalogEntryUpdated:
        $ref: '#/components/messages/catalogEntryUpdated'
      catalogEntryDeprecated:
        $ref: '#/components/messages/catalogEntryDeprecated'
      catalogEntryRetired:
        $ref: '#/components/messages/catalogEntryRetired'
operations:
  publishSubscriptionCreated:
    action: send
    channel:
      $ref: '#/channels/passage.hub.subscription'
    summary: "A subscription was created."
    messages:
      - $ref: '#/channels/passage.hub.subscription/messages/subscriptionCreated'
  publishSubscriptionUpdated:
    action: send
    channel:
      $ref: '#/channels/passage.hub.subscription'
    summary: "A subscription's name, URL, patterns or rest-push settings changed."
    messages:
      - $ref: '#/channels/passage.hub.subscription/messages/subscriptionUpdated'
  publishSubscriptionDeleted:
    action: send
    channel:
      $ref: '#/channels/passage.hub.subscription'
    summary: "A subscription and its deliveries were deleted; the data is the last state."
    messages:
      - $ref: '#/channels/passage.hub.subscription/messages/subscriptionDeleted'
  publishSubscriptionPaused:
    action: send
    channel:
      $ref: '#/channels/passage.hub.subscription'
    summary: "A subscription was paused because its receiver answered 410 Gone (HUB-0114)."
    messages:
      - $ref: '#/channels/passage.hub.subscription/messages/subscriptionPaused'
  publishSubscriptionResumed:
    action: send
    channel:
      $ref: '#/channels/passage.hub.subscription'
    summary: "A paused subscription was resumed."
    messages:
      - $ref: '#/channels/passage.hub.subscription/messages/subscriptionResumed'
  publishWebhookDelivered:
    action: send
    channel:
      $ref: '#/channels/passage.hub.webhook'
    summary: "An event was delivered to a subscription's receiver (2xx)."
    messages:
      - $ref: '#/channels/passage.hub.webhook/messages/webhookDelivered'
  publishWebhookDeadlettered:
    action: send
    channel:
      $ref: '#/channels/passage.hub.webhook'
    summary: "An event was dead-lettered: retries exhausted (HUB-0115), refused for good (HUB-0117) or a conflicting legacy key (HUB-0118)."
    messages:
      - $ref: '#/channels/passage.hub.webhook/messages/webhookDeadlettered'
  publishApiClientRegistered:
    action: send
    channel:
      $ref: '#/channels/passage.hub.apiclient'
    summary: "An API client was registered."
    messages:
      - $ref: '#/channels/passage.hub.apiclient/messages/apiClientRegistered'
  publishApiClientUpdated:
    action: send
    channel:
      $ref: '#/channels/passage.hub.apiclient'
    summary: "An API client's name, scopes, quota, sandbox tenant or owner changed."
    messages:
      - $ref: '#/channels/passage.hub.apiclient/messages/apiClientUpdated'
  publishApiClientRevoked:
    action: send
    channel:
      $ref: '#/channels/passage.hub.apiclient'
    summary: "An API client was revoked."
    messages:
      - $ref: '#/channels/passage.hub.apiclient/messages/apiClientRevoked'
  publishCatalogEntryPublished:
    action: send
    channel:
      $ref: '#/channels/passage.hub.catalogentry'
    summary: "A version of an API or event contract was published to the catalog."
    messages:
      - $ref: '#/channels/passage.hub.catalogentry/messages/catalogEntryPublished'
  publishCatalogEntryUpdated:
    action: send
    channel:
      $ref: '#/channels/passage.hub.catalogentry'
    summary: "A catalog entry's title, summary or owner service changed."
    messages:
      - $ref: '#/channels/passage.hub.catalogentry/messages/catalogEntryUpdated'
  publishCatalogEntryDeprecated:
    action: send
    channel:
      $ref: '#/channels/passage.hub.catalogentry'
    summary: "A catalog entry was deprecated with a sunset date."
    messages:
      - $ref: '#/channels/passage.hub.catalogentry/messages/catalogEntryDeprecated'
  publishCatalogEntryRetired:
    action: send
    channel:
      $ref: '#/channels/passage.hub.catalogentry'
    summary: "A deprecated catalog entry was retired after its sunset date."
    messages:
      - $ref: '#/channels/passage.hub.catalogentry/messages/catalogEntryRetired'
components:
  messages:
    subscriptionCreated:
      name: dev.passage.hub.subscription.created.v1
      title: subscription.created
      summary: "A subscription was created."
      payload:
        $ref: '#/components/schemas/SubscriptionData'
    subscriptionUpdated:
      name: dev.passage.hub.subscription.updated.v1
      title: subscription.updated
      summary: "A subscription's name, URL, patterns or rest-push settings changed."
      payload:
        $ref: '#/components/schemas/SubscriptionData'
    subscriptionDeleted:
      name: dev.passage.hub.subscription.deleted.v1
      title: subscription.deleted
      summary: "A subscription and its deliveries were deleted; the data is the last state."
      payload:
        $ref: '#/components/schemas/SubscriptionData'
    subscriptionPaused:
      name: dev.passage.hub.subscription.paused.v1
      title: subscription.paused
      summary: "A subscription was paused because its receiver answered 410 Gone (HUB-0114)."
      payload:
        $ref: '#/components/schemas/SubscriptionData'
    subscriptionResumed:
      name: dev.passage.hub.subscription.resumed.v1
      title: subscription.resumed
      summary: "A paused subscription was resumed."
      payload:
        $ref: '#/components/schemas/SubscriptionData'
    webhookDelivered:
      name: dev.passage.hub.webhook.delivered.v1
      title: webhook.delivered
      summary: "An event was delivered to a subscription's receiver (2xx)."
      payload:
        $ref: '#/components/schemas/DeliveredData'
    webhookDeadlettered:
      name: dev.passage.hub.webhook.deadlettered.v1
      title: webhook.deadlettered
      summary: "An event was dead-lettered: retries exhausted (HUB-0115), refused for good (HUB-0117) or a conflicting legacy key (HUB-0118)."
      payload:
        $ref: '#/components/schemas/DeadletteredData'
    apiClientRegistered:
      name: dev.passage.hub.apiclient.registered.v1
      title: apiclient.registered
      summary: "An API client was registered."
      payload:
        $ref: '#/components/schemas/ClientData'
    apiClientUpdated:
      name: dev.passage.hub.apiclient.updated.v1
      title: apiclient.updated
      summary: "An API client's name, scopes, quota, sandbox tenant or owner changed."
      payload:
        $ref: '#/components/schemas/ClientData'
    apiClientRevoked:
      name: dev.passage.hub.apiclient.revoked.v1
      title: apiclient.revoked
      summary: "An API client was revoked."
      payload:
        $ref: '#/components/schemas/ClientData'
    catalogEntryPublished:
      name: dev.passage.hub.catalogentry.published.v1
      title: catalogentry.published
      summary: "A version of an API or event contract was published to the catalog."
      payload:
        $ref: '#/components/schemas/CatalogEntryData'
    catalogEntryUpdated:
      name: dev.passage.hub.catalogentry.updated.v1
      title: catalogentry.updated
      summary: "A catalog entry's title, summary or owner service changed."
      payload:
        $ref: '#/components/schemas/CatalogEntryData'
    catalogEntryDeprecated:
      name: dev.passage.hub.catalogentry.deprecated.v1
      title: catalogentry.deprecated
      summary: "A catalog entry was deprecated with a sunset date."
      payload:
        $ref: '#/components/schemas/CatalogEntryData'
    catalogEntryRetired:
      name: dev.passage.hub.catalogentry.retired.v1
      title: catalogentry.retired
      summary: "A deprecated catalog entry was retired after its sunset date."
      payload:
        $ref: '#/components/schemas/CatalogEntryData'
  schemas:
    SubscriptionData:
      type: object
      required: [subscription_id, kind, name, patterns, status, paused_reason, version]
      additionalProperties: false
      properties:
        subscription_id: {type: string, format: uuid}
        kind: {type: string, enum: [webhook, rest-push]}
        name: {type: string}
        patterns: {type: array, items: {type: string}}
        status: {type: string, enum: [active, paused]}
        paused_reason: {type: [string, "null"], description: "HUB-0114 after a 410 Gone."}
        version: {type: integer, minimum: 1}
    DeliveredData:
      type: object
      required: [subscription_id, event_id, attempts]
      additionalProperties: false
      properties:
        subscription_id: {type: string, format: uuid}
        event_id: {type: string, description: "The id of the delivered CloudEvent."}
        attempts: {type: integer, minimum: 0}
    DeadletteredData:
      type: object
      required: [subscription_id, event_id, attempts, code, last_status]
      additionalProperties: false
      properties:
        subscription_id: {type: string, format: uuid}
        event_id: {type: string}
        attempts: {type: integer, minimum: 0}
        code: {type: string, enum: [HUB-0115, HUB-0117, HUB-0118]}
        last_status: {type: [integer, "null"], description: "The receiver's last HTTP status, null for silence."}
    ClientData:
      type: object
      required: [api_client_id, client_id, name, scopes, quota_per_min, burst, sandbox_tenant_id, status, version]
      additionalProperties: false
      properties:
        api_client_id: {type: string, format: uuid}
        client_id: {type: string, description: "The Keycloak client id."}
        name: {type: string}
        scopes: {type: array, items: {type: string}}
        quota_per_min: {type: integer}
        burst: {type: integer}
        sandbox_tenant_id: {type: [string, "null"], format: uuid}
        status: {type: string, enum: [active, revoked]}
        version: {type: integer, minimum: 1}
    CatalogEntryData:
      type: object
      required: [catalog_entry_id, kind, name, spec_version, title, owner_service, lifecycle, sunset_at, replaced_by, version]
      additionalProperties: false
      properties:
        catalog_entry_id: {type: string, format: uuid}
        kind: {type: string, enum: [api, event]}
        name: {type: string}
        spec_version: {type: string, description: "MAJOR.MINOR.PATCH of the published contract."}
        title: {type: string}
        owner_service: {type: string}
        lifecycle: {type: string, enum: [active, deprecated, retired], description: "A version published into a deprecated major line is published deprecated."}
        sunset_at: {type: [string, "null"], format: date-time, description: "Set once deprecated."}
        replaced_by: {type: [string, "null"], format: uuid}
        version: {type: integer, minimum: 1}
