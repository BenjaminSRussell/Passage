{{- if and .Values.notify.enabled .Values.notify.externalSecret.enabled }}
{{- $prefix := replace "{env}" (required "notify.externalSecret.environment is required" .Values.notify.externalSecret.environment) .Values.notify.externalSecret.pathPrefix }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.notify.secretName }}
  labels:
    app.kubernetes.io/name: batch
spec:
  refreshInterval: {{ .Values.notify.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.notify.externalSecret.storeName }}
  target:
    name: {{ .Values.notify.secretName }}
    creationPolicy: Owner
  data:
    {{- if .Values.notify.smtp.enabled }}
    {{- range $key := list "smtp-host" "smtp-port" "smtp-user" "smtp-password" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $prefix }}/{{ $key }}
        property: value
    {{- end }}
    {{- end }}
    {{- if .Values.notify.webhook.enabled }}
    - secretKey: webhook-token
      remoteRef:
        key: {{ $prefix }}/webhook-token
        property: value
    {{- end }}
{{- end }}
