apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: batch
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: batch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch
    spec:
      securityContext:
        runAsNonRoot: true
        {{- if .Values.notify.enabled }}
        fsGroup: {{ .Values.notify.fsGroup }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: batch
          image: {{ include "batch.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            {{- if .Values.notify.enabled }}
            - name: NOTIFY_SECRETS_DIR
              value: {{ .Values.notify.mountPath | quote }}
            {{- if .Values.notify.smtp.enabled }}
            - name: NOTIFY_SMTP_ENABLED
              value: "true"
            - name: NOTIFY_SMTP_FROM
              value: {{ .Values.notify.smtp.from | quote }}
            {{- end }}
            {{- if .Values.notify.webhook.enabled }}
            - name: NOTIFY_WEBHOOK_ENABLED
              value: "true"
            - name: NOTIFY_WEBHOOK_URL
              value: {{ .Values.notify.webhook.url | quote }}
            {{- end }}
            {{- end }}
          {{- if .Values.notify.enabled }}
          volumeMounts:
            - name: notify-secrets
              mountPath: {{ .Values.notify.mountPath | quote }}
              readOnly: true
          {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.notify.enabled }}
      volumes:
        - name: notify-secrets
          secret:
            secretName: {{ .Values.notify.secretName }}
            defaultMode: 0440
      {{- end }}
