asyncapi: 3.0.0
info:
  title: Passage Planning events
  version: 0.5.0
  description: CloudEvents 1.0 with Passage extensions (tenantid, correlationid, causationid, actor). Published through the outbox in the same transaction as the plan version change, the firming or the forecast publication.
defaultContentType: application/cloudevents+json
channels:
  plan:
    address: passage.planning.plan
    messages:
      planStartedV1:
        $ref: '#/components/messages/PlanStartedV1'
      planCompletedV1:
        $ref: '#/components/messages/PlanCompletedV1'
      messageRaisedV1:
        $ref: '#/components/messages/MessageRaisedV1'
  plannedOrderFirmed:
    address: passage.planning.plannedorder
    messages:
      plannedOrderFirmedV1:
        $ref: '#/components/messages/PlannedOrderFirmedV1'
  forecast:
    address: passage.planning.forecast
    messages:
      forecastPublishedV1:
        $ref: '#/components/messages/ForecastPublishedV1'
      forecastGeneratedV1:
        $ref: '#/components/messages/ForecastGeneratedV1'
  scenario:
    address: passage.planning.scenario
    messages:
      scenarioSimulatedV1:
        $ref: '#/components/messages/ScenarioSimulatedV1'
operations:
  publishPlanStarted:
    action: send
    channel:
      $ref: '#/channels/plan'
    messages:
      - $ref: '#/channels/plan/messages/planStartedV1'
    summary: A plan run started its version (FR-22.1). Runs are synchronous, so it is written in the run's transaction ahead of the run's other events.
  publishPlanCompleted:
    action: send
    channel:
      $ref: '#/channels/plan'
    messages:
      - $ref: '#/channels/plan/messages/planCompletedV1'
    summary: A plan version became the current version of its plan.
  publishMessageRaised:
    action: send
    channel:
      $ref: '#/channels/plan'
    messages:
      - $ref: '#/channels/plan/messages/messageRaisedV1'
    summary: A run created an action or delay message (FR-22.7). One event per message, in the run's transaction, keyed by the plan.
  publishPlannedOrderFirmed:
    action: send
    channel:
      $ref: '#/channels/plannedOrderFirmed'
    summary: A planned order was firmed (FR-22.10), by a planner's firming request or by a plan run inside the firming time fence (BR-22.4, in the run transaction; batch_id is then the run's firming batch). One event per planned order; the owning context creates the target order with target_id, and orders that share a target_id are the lines of one purchase order.
  publishForecastPublished:
    action: send
    channel:
      $ref: '#/channels/forecast'
    messages:
      - $ref: '#/channels/forecast/messages/forecastPublishedV1'
    summary: An approver published a submitted forecast consensus (FR-22.9). Written in the publishing transaction; the model's cells are locked from then on.
  publishForecastGenerated:
    action: send
    channel:
      $ref: '#/channels/forecast'
    messages:
      - $ref: '#/channels/forecast/messages/forecastGeneratedV1'
    summary: A statistical forecast generation wrote cells into a model (FR-22.9). Written in the generating transaction; manual and consensus cells are never overwritten and are counted in cells_kept.
  publishScenarioSimulated:
    action: send
    channel:
      $ref: '#/channels/scenario'
    messages:
      - $ref: '#/channels/scenario/messages/scenarioSimulatedV1'
    summary: A scenario run finished as a simulation version of its plan (FR-22.15, BR-22.14). Written in the run's transaction. Simulations publish no plan.completed.v1, message.raised.v1 or plannedorder.firmed.v1, so operational consumers never see them.
components:
  messages:
    PlanStartedV1:
      name: dev.passage.planning.plan.started.v1
      title: A plan run started its version
      summary: A plan run started its version (CloudEvent dev.passage.planning.plan.started.v1).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PlanStartedData'
    MessageRaisedV1:
      name: dev.passage.planning.message.raised.v1
      title: The run raised an action or delay message
      summary: The run raised an action or delay message (CloudEvent dev.passage.planning.message.raised.v1).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MessageRaisedData'
    PlanCompletedV1:
      name: dev.passage.planning.plan.completed.v1
      title: A plan version became the current version
      summary: A plan version became the current version (CloudEvent dev.passage.planning.plan.completed.v1).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PlanCompletedData'
    PlannedOrderFirmedV1:
      name: dev.passage.planning.plannedorder.firmed.v1
      title: A planned order was firmed
      summary: A planned order was firmed (CloudEvent dev.passage.planning.plannedorder.firmed.v1).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PlannedOrderFirmedData'
    ForecastPublishedV1:
      name: dev.passage.planning.forecast.published.v1
      title: A forecast consensus was published
      summary: A forecast consensus was published (CloudEvent dev.passage.planning.forecast.published.v1).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ForecastPublishedData'
    ForecastGeneratedV1:
      name: dev.passage.planning.forecast.generated.v1
      title: A statistical forecast was generated
      summary: A statistical forecast was generated into a model (CloudEvent dev.passage.planning.forecast.generated.v1).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ForecastGeneratedData'
    ScenarioSimulatedV1:
      name: dev.passage.planning.scenario.simulated.v1
      title: A scenario simulation finished
      summary: A scenario simulation finished (CloudEvent dev.passage.planning.scenario.simulated.v1).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ScenarioSimulatedData'
  schemas:
    ScenarioSimulatedData:
      type: object
      required: [plan_id, plan_code, scenario_id, scenario_code, version_id, version_number, site_id, as_of, items_planned, planned_orders, messages, duration_ms, plan_hash]
      properties:
        plan_id: {type: string, format: uuid}
        plan_code: {type: string}
        scenario_id: {type: string, format: uuid}
        scenario_code: {type: string}
        version_id: {type: string, format: uuid, description: The simulation version; it is never the plan's current version}
        version_number: {type: integer}
        site_id: {type: string, format: uuid}
        as_of: {type: string, format: date}
        items_planned: {type: integer}
        planned_orders:
          type: object
          required: [purchase, production, transfer]
          properties:
            purchase: {type: integer}
            production: {type: integer}
            transfer: {type: integer}
        messages: {type: integer, description: Messages stored with the version; none of them is published}
        duration_ms: {type: integer}
        plan_hash: {type: string, description: sha256 hex over orders, pegging and messages}
    PlanStartedData:
      type: object
      required: [plan_id, plan_code, version_id, version_number, kind, site_id, as_of, items_planned]
      properties:
        plan_id: {type: string, format: uuid}
        plan_code: {type: string}
        version_id: {type: string, format: uuid}
        version_number: {type: integer}
        kind: {type: string, enum: [static], description: 'Plan kind; dynamic net-change runs are not built yet'}
        site_id: {type: string, format: uuid, description: The run's scope is the whole snapshot of this site}
        as_of: {type: string, format: date}
        items_planned: {type: integer}
    MessageRaisedData:
      type: object
      required: [message_id, plan_id, plan_code, version_id, site_id, action, item_id, supply_ref, demand_ref, suggested_date, delay_days, qty]
      properties:
        message_id: {type: string, format: uuid}
        plan_id: {type: string, format: uuid}
        plan_code: {type: string}
        version_id: {type: string, format: uuid}
        site_id: {type: string, format: uuid}
        action:
          type: string
          enum: [delay, postpone, advance, shortage, cancel, decrease, increase, red-zone, sales-on-top, no-vendor]
          description: 'Values are added within v1 only (PRD appendix: additive evolution); a consumer must ignore an action it does not know. no-vendor is PLAN-0008, a planned purchase of the item with no vendor (supply_ref its earliest such order, qty the item''s vendorless quantity)'
          x-passage-added-in: {red-zone: PSG-2220, sales-on-top: PSG-2223, no-vendor: PSG-2224}
        item_id: {type: string, format: uuid}
        warehouse_id: {type: [string, 'null'], format: uuid, description: 'The warehouse planning scope the message is about (FR-22.18, added in PSG-2227); null for the site scope. A consumer that ignores it reads a warehouse message as a site one'}
        supply_ref: {type: string, description: Planned order number or receipt ref; empty for a shortage}
        demand_ref: {type: string, description: 'Demand the message is about (sales line, forecast, bom line); empty when none'}
        suggested_date: {type: string, format: date}
        delay_days: {type: integer}
        qty: {type: string, description: Decimal string in the inventory unit}
    PlanCompletedData:
      type: object
      required: [plan_id, plan_code, version_id, version_number, items_planned, planned_orders, messages, duration_ms, plan_hash]
      properties:
        plan_id: {type: string, format: uuid}
        plan_code: {type: string}
        version_id: {type: string, format: uuid}
        version_number: {type: integer}
        items_planned: {type: integer}
        planned_orders:
          type: object
          required: [purchase, production, transfer]
          properties:
            purchase: {type: integer}
            production: {type: integer}
            transfer: {type: integer}
        messages: {type: integer}
        duration_ms: {type: integer}
        plan_hash: {type: string, description: sha256 hex (FR-22.14)}
    PlannedOrderFirmedData:
      type: object
      required: [planned_order_id, plan_version_id, batch_id, order_type, target_type, target_id, item_id, site_id, vendor_id, qty, order_date, delivery_date]
      properties:
        planned_order_id: {type: string, format: uuid}
        plan_version_id: {type: string, format: uuid}
        batch_id: {type: string, format: uuid, description: The firming request; its Idempotency-Key replays return the same batch}
        order_type: {type: string, enum: [purchase, production, transfer]}
        target_type: {type: string, enum: [purchase-order, production-order, transfer-order]}
        target_id: {type: string, format: uuid, description: Id of the order to create; planned orders of one group share it}
        item_id: {type: string, format: uuid}
        warehouse_id: {type: [string, 'null'], format: uuid, description: 'Warehouse of a warehouse planning scope (FR-22.18, added in PSG-2227): for a planned transfer the to-warehouse, whose from-warehouse is the site (BR-22.7); null for an order of the site scope. The owning context creates the transfer order to this warehouse'}
        site_id: {type: string, format: uuid}
        vendor_id: {type: [string, 'null'], format: uuid}
        qty: {type: string, description: Decimal string in the inventory unit}
        order_date: {type: string, format: date}
        delivery_date: {type: string, format: date}
        quota_arrangement_id: {type: [string, 'null'], format: uuid, description: Quota arrangement the plan run applied to the order (FR-22.17); null when none}
        quota_source_id: {type: [string, 'null'], format: uuid, description: Quota source the order was allocated to; the owning context keeps it on the target order}
    ForecastGeneratedData:
      type: object
      required: [model_id, model_code, version, series, cells_written, cells_kept, period_from, period_to, generated_by]
      properties:
        model_id: {type: string, format: uuid}
        model_code: {type: string}
        version: {type: integer, description: The model's version (ETag) after the generation}
        series: {type: integer, description: Item and site series in the request}
        cells_written: {type: integer, description: Statistical cells written}
        cells_kept: {type: integer, description: Cells left alone because a manual or consensus value holds the month}
        period_from: {type: string, format: date, description: First period start}
        period_to: {type: string, format: date, description: Last period end}
        generated_by: {type: string, description: User who ran the generation}
    ForecastPublishedData:
      type: object
      required: [model_id, model_code, version, items, horizon_periods, period_from, period_to, submitted_by, approved_by]
      properties:
        model_id: {type: string, format: uuid}
        model_code: {type: string}
        version: {type: integer, description: The model's version (ETag) after publishing}
        items: {type: integer, description: Item and site series in the published forecast}
        horizon_periods: {type: integer, description: Distinct periods of the published cells}
        period_from: {type: string, format: date, description: First period start}
        period_to: {type: string, format: date, description: Last period end}
        submitted_by: {type: string, description: User who submitted the consensus}
        approved_by: {type: string, description: User who approved it; never the submitter or a cell writer}
