  /v1/planning/scenarios:
    get:
      operationId: listScenarios
      summary: Planning scenarios of the tenant, optionally of one plan (FR-22.15)
      x-passage-duty: planning.read
      parameters:
        - name: planCode
          in: query
          schema: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
          description: Only the scenarios of this plan
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Scenarios ordered by plan and code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Scenario'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createScenario
      summary: Create a planning scenario (FR-22.15)
      description: |
        A scenario is a named set of changes a simulation run applies to its
        snapshot: a demand factor overall and per item, added sales demand,
        lead-time overrides. Omitted fields take demand factor 1 and active
        true. The scenario belongs to the plan and to the plan's legal
        entity: the plan must have run once and be visible to the caller
        (404 PLAN-NOT-FOUND otherwise), and callers outside that entity
        cannot read, change or run the scenario. A code already in use is
        409 PLAN-SCENARIO-EXISTS; an 11th
        active scenario of a plan is 409 PLAN-SCENARIO-LIMIT. With an
        Idempotency-Key, a retry of the same body returns the created
        scenario with 200 and Idempotent-Replayed: true; another body under
        the key is 422.
      x-passage-duty: planning.simulate
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [code, planCode, name]
                  properties:
                    code: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
                - $ref: '#/components/schemas/ScenarioSettings'
      responses:
        '201':
          description: The created scenario; the ETag header carries its version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Scenario'}
        '200':
          description: 'Idempotent replay of an earlier create (Idempotent-Replayed: true)'
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Scenario'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/planning/scenarios/{code}:
    get:
      operationId: getScenario
      summary: One planning scenario by code
      x-passage-duty: planning.read
      parameters:
        - $ref: '#/components/parameters/CoverageCode'
      responses:
        '200':
          description: The scenario; the ETag header carries its version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
