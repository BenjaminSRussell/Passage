        '200':
          description: Idempotent replay of an earlier create
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BufferProfile'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/planning/buffer-profiles/{id}:
    get:
      operationId: getBufferProfile
      summary: One buffer profile by id
      x-passage-duty: planning.read
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: The buffer profile; the ETag header carries its version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BufferProfile'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateBufferProfile
      summary: Replace a buffer profile under If-Match; omitted fields take the defaults, as on create. Stored buffers keep their zones until recalculated.
      x-passage-duty: planning.setup.maintain
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BufferProfileInput'}
      responses:
        '200':
          description: The changed profile with its new ETag
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BufferProfile'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/planning/ddmrp/buffers:
    get:
      operationId: listDdmrpBuffers
      summary: DDMRP buffer status inquiry (4.22.14), most urgent (lowest priority) first
      x-passage-duty: planning.read
      parameters:
        - name: siteId
          in: query
          schema: {type: string, format: uuid}
        - name: zone
          in: query
          schema: {type: string, enum: [red, yellow, green]}
        - name: maxPriority
          in: query
          description: Only buffers whose priority (NFP / TOG) is at most this decimal, e.g. 0.5 for 50%
          schema: {type: string}
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Stored buffers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/DdmrpBuffer'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/planning/ddmrp/buffers:recalculate:
    post:
      operationId: recalculateDdmrpBuffer
      summary: Evaluate a buffer with its stored profile (BR-22.11) and replace the stored result of its item, site and warehouse scope
      description: |
        The profile supplies the factors, spike threshold, ADU window and spike
        horizon (the body's spikeHorizonDays overrides it; null on both means
        the DLT). Repeating a request stores the same row again, so no
        Idempotency-Key is needed. An unknown profile is 422
        PLAN-PROFILE-NOT-FOUND; an empty ADU window or inconsistent parameters
        422 PLAN-INPUT-INVALID.
      x-passage-duty: planning.run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, siteId, profileId, dltDays]
              properties:
                legalEntityId: {type: string, format: uuid, description: "Owning legal entity of the stored buffer: the caller's single legal entity by default, required (422) for a caller scoped to several or to all; 403 outside the caller's scope. A buffer of the same item, site and warehouse that the caller's scope cannot write is 409 PLAN-BUFFER-ENTITY; an all-entity caller naming an entity claims a legacy buffer that has none."}
                itemId: {type: string, format: uuid}
                siteId: {type: string, format: uuid}
                warehouseId: {type: string, format: uuid, description: Absent for the site scope}
                profileId: {type: string, format: uuid}
                adu: {type: string, description: ADU as a decimal string; or send history}
                history:
                  type: array
                  maxItems: 100000
                  items: {$ref: '#/components/schemas/DayQty'}
                daf: {type: string, default: '1', description: 'Dynamic adjustment factor, at most 999.999'}
                dltDays: {type: string, description: 'Decoupled lead time in days, at most 2 decimals'}
                onHand: {type: string}
                openSupply: {type: string, description: Open supply inside the DLT}
                demand:
                  type: array
                  maxItems: 10000
                  items: {$ref: '#/components/schemas/DayQty'}
                orderMultiple: {type: string, default: '0'}
                spikeHorizonDays: {type: [integer, 'null'], minimum: 0, maximum: 3650}
      responses:
        '200':
          description: The stored buffer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DdmrpBuffer'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/planning/quota-arrangements:
    get:
      operationId: listQuotaArrangements
      summary: Quota arrangements with their sources (FR-22.17), ordered by item, site and validity start
      x-passage-duty: planning.read
      parameters:
        - name: itemId
          in: query
          schema: {type: string, format: uuid}
        - name: siteId
          in: query
          schema: {type: string, format: uuid}
        - name: validOn
          in: query
          description: Only arrangements valid on this date
          schema: {type: string, format: date}
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Quota arrangements
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/QuotaArrangement'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createQuotaArrangement
      summary: Set up a quota arrangement and its sources (FR-22.17, Maintain planning setup)
      description: |
        Its validity (inclusive dates) must not overlap another arrangement of
        the same item and site: 409 PLAN-QUOTA-OVERLAP. With an
        Idempotency-Key, a retry of the same body returns the created
        arrangement with 200 and Idempotent-Replayed: true; another body under
        the key is 422.
      x-passage-duty: planning.setup.maintain
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuotaArrangementInput'}
      responses:
        '201':
          description: The created arrangement; the ETag header carries its version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuotaArrangement'}
        '200':
          description: Idempotent replay of an earlier create
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuotaArrangement'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/planning/quota-arrangements/{id}:
    get:
      operationId: getQuotaArrangement
      summary: One quota arrangement with its sources
      x-passage-duty: planning.read
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: The arrangement; the ETag header carries its version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuotaArrangement'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateQuotaArrangement
      summary: Replace an arrangement and all its sources under If-Match; the overlap rule applies as on create
      description: A source naming the same type and reference as a current source keeps its id, so planned orders allocated to it still book on it when firmed; other sources get new ids. Firming an order allocated to one of its sources adds the quantity to the source's allocatedQty and bumps the arrangement's version, so an update sent with an older ETag is a 412.
      x-passage-duty: planning.setup.maintain
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuotaArrangementInput'}
      responses:
        '200':
          description: The changed arrangement with its new ETag
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuotaArrangement'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
components:
  headers:
    ETag:
      description: 'Entity version as a quoted integer, e.g. "3"; send it back as If-Match'
      schema: {type: string}
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 'ETag of the version the change is based on, e.g. "3" (a new forecast model is "0")'
      schema: {type: string}
    CoverageCode:
      name: code
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
    EntityId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ItemCoverageId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ModelCode:
      name: modelCode
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 255}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 500}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    DiffOrder:
      type: object
      required: [number, itemId, orderType, qty, orderDate, deliveryDate]
      properties:
        number: {type: string}
        itemId: {type: string, format: uuid}
        orderType: {type: string, enum: [purchase, production, transfer]}
        qty: {type: string, description: Decimal string}
        orderDate: {type: string, format: date}
        deliveryDate: {type: string, format: date}
        vendorId: {type: string, format: uuid, description: Absent when the order has no vendor}
    VersionDiff:
      type: object
      required: [from, to, identical, messagesDelta, addedCount, removedCount, changedCount, unchanged, truncated, added, removed, changed, qtyDeltaByOrderType]
      properties:
        from: {$ref: '#/components/schemas/PlanVersion'}
        to: {$ref: '#/components/schemas/PlanVersion'}
        identical: {type: boolean, description: True when both plan hashes are equal}
        messagesDelta: {type: integer, description: Messages of `to` minus messages of `from`}
        addedCount: {type: integer, minimum: 0, description: All added orders, including any beyond the limit}
        removedCount: {type: integer, minimum: 0, description: All removed orders, including any beyond the limit}
        changedCount: {type: integer, minimum: 0, description: All changed orders, including any beyond the limit}
        truncated: {type: boolean, description: True when added, removed or changed lists fewer orders than its count}
        added:
          type: array
          items: {$ref: '#/components/schemas/DiffOrder'}
        removed:
          type: array
          items: {$ref: '#/components/schemas/DiffOrder'}
        changed:
          type: array
          items:
            type: object
            required: [from, to, qtyDelta]
            properties:
              from: {$ref: '#/components/schemas/DiffOrder'}
              to: {$ref: '#/components/schemas/DiffOrder'}
              qtyDelta: {type: string, description: Decimal string, to minus from}
        unchanged: {type: integer, minimum: 0}
        qtyDeltaByOrderType:
          type: object
          description: Net planned quantity change per order type over every order (to minus from)
          additionalProperties: {type: string, description: Decimal string}
    CoverageSettings:
      type: object
      required: [coverageCode]
      properties:
        coverageCode: {type: string, enum: [requirement, period, minmax, manual]}
        coverageTimeFenceDays: {type: integer, minimum: 1, maximum: 3650, default: 100}
        negativeDays: {type: integer, minimum: 0, maximum: 365, default: 1}
        positiveDays: {type: integer, minimum: 0, maximum: 365, default: 0}
        periodDays: {type: integer, minimum: 0, maximum: 365, default: 0, description: 1 to 365 for period coverage}
        freezeFenceDays: {type: integer, minimum: 0, maximum: 3650, default: 0}
        actionFenceDays: {type: integer, minimum: 0, maximum: 3650, default: 0, description: 0 is unlimited}
        futuresFenceDays: {type: integer, minimum: 0, maximum: 3650, default: 0, description: 0 is unlimited}
        firmingFenceDays: {type: integer, minimum: 0, maximum: 3650, default: 0}
        autoFirm: {type: boolean, default: false, description: Needs firmingFenceDays of at least 1}
        generateActions: {type: boolean, default: true}
        generateFutures: {type: boolean, default: true}
        safetyStockPolicy: {type: string, enum: [today, first-issue], default: today, description: 'BR-22.5. today nets the safety stock as a demand at today; first-issue as a demand on the item first issue date (today when the item has no demand).'}
    CoverageGroup:
      allOf:
        - type: object
          required: [id, version, code]
          properties:
            id: {type: string, format: uuid}
            version: {type: integer, minimum: 1, description: Same as the ETag}
            code: {type: string}
        - $ref: '#/components/schemas/CoverageSettings'
    ItemCoverageInput:
      type: object
      required: [itemId, siteId, coverageGroupId]
      description: Omitted fields (and explicit nulls) take the defaults below.
      properties:
        legalEntityId: {type: string, format: uuid, description: "Owning legal entity on create: the caller's single legal entity by default, required (422) for a caller scoped to several or to all; 403 outside the caller's scope; ignored on update."}
        itemId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        warehouseId: {type: [string, 'null'], format: uuid, description: 'Required for warehouse scope, absent otherwise'}
        coverageGroupId: {type: string, format: uuid}
        minQty: {type: string, default: '0', description: 'Decimal string, at most 6 decimals'}
        maxQty: {type: string, default: '0', description: 'Decimal string; 0 means no maximum, otherwise at least minQty'}
        safetyMarginReceiptDays: {type: integer, minimum: 0, maximum: 365, default: 0}
        safetyMarginIssueDays: {type: integer, minimum: 0, maximum: 365, default: 0, description: 'Working days each demand of the item is moved earlier (FR-22.5 issue margin)'}
        safetyMarginReorderDays: {type: integer, minimum: 0, maximum: 365, default: 0, description: 'Working days added to the lead time of the item''s planned orders (FR-22.5 reorder margin)'}
        leadTimeDays: {type: [integer, 'null'], minimum: 0, maximum: 3650, description: Lead time override; null uses the item lead time}
        vendorId: {type: [string, 'null'], format: uuid, description: Default vendor; the subcontractor for subcontractor scope}
        plannedOrderType: {type: string, enum: [purchase, production, transfer], default: purchase, description: Must be transfer (provision) for subcontractor scope}
        planningStrategy: {type: string, enum: [mts-net, mts-gross, mto, assemble-to-order-final, plan-without-final-assembly, subassembly], default: mts-net}
        planningScope: {type: string, enum: [site, warehouse, subcontractor], default: site, description: MRP area (FR-22.18)}
        decouplingPoint: {type: boolean, default: false, description: Strategic DDMRP buffer position (FR-22.16)}
        bufferProfileId: {type: [string, 'null'], format: uuid, description: A stored buffer profile of the tenant (422 PLAN-PROFILE-NOT-FOUND otherwise)}
        requiredShelfLifeDays: {type: integer, minimum: 0, maximum: 3650, default: 0, description: Remaining shelf life a demand needs (FR-22.20)}
        priorityBased: {type: boolean, default: false, description: Plan by planning priority instead of date (FR-22.16)}
    ItemCoverage:
      type: object
      required: [id, version, itemId, siteId, warehouseId, coverageGroupId, coverageGroupCode, minQty, maxQty, safetyMarginReceiptDays,
        leadTimeDays, vendorId, plannedOrderType, planningStrategy, planningScope, decouplingPoint, bufferProfileId,
        requiredShelfLifeDays, priorityBased, safetyMarginIssueDays, safetyMarginReorderDays]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1, description: Same as the ETag}
        itemId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        warehouseId: {type: [string, 'null'], format: uuid}
        coverageGroupId: {type: string, format: uuid}
        coverageGroupCode: {type: string, description: Code of the referenced coverage group}
        minQty: {type: string, description: Decimal string in inventory UoM}
        maxQty: {type: string, description: Decimal string; 0 means no maximum}
        safetyMarginReceiptDays: {type: integer}
        safetyMarginIssueDays: {type: integer, description: Issue margin in working days}
        safetyMarginReorderDays: {type: integer, description: Reorder margin in working days}
        leadTimeDays: {type: [integer, 'null']}
        vendorId: {type: [string, 'null'], format: uuid}
        plannedOrderType: {type: string, enum: [purchase, production, transfer]}
        planningStrategy: {type: string, enum: [mts-net, mts-gross, mto, assemble-to-order-final, plan-without-final-assembly, subassembly]}
        planningScope: {type: string, enum: [site, warehouse, subcontractor]}
        decouplingPoint: {type: boolean}
        bufferProfileId: {type: [string, 'null'], format: uuid}
        requiredShelfLifeDays: {type: integer}
        priorityBased: {type: boolean}
    BufferProfileInput:
      type: object
      required: [code, itemType, leadTimeFactor, variabilityFactor]
      description: Omitted fields take the defaults below.
      properties:
        code: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
        itemType: {type: string, enum: [manufactured, purchased, distributed]}
        leadTimeFactor: {type: string, description: 'LTF, decimal string 0 to 99.999 with at most 3 decimals'}
        variabilityFactor: {type: string, description: 'VF, decimal string 0 to 99.999 with at most 3 decimals'}
        orderCycleDays: {type: integer, minimum: 0, maximum: 3650, default: 0}
        minOrderQty: {type: string, default: '0', description: 'MOQ, decimal string with at most 6 decimals'}
        spikeThresholdPct: {type: string, default: '50', description: 'Percent of the red zone, 1 to 500'}
        spikeHorizonDays: {type: [integer, 'null'], minimum: 0, maximum: 3650, description: null means the DLT of the buffered item}
        aduWindowPastDays: {type: integer, minimum: 0, maximum: 365, default: 90, description: Past and future windows together cover at least 7 days}
        aduWindowFutureDays: {type: integer, minimum: 0, maximum: 365, default: 0}
    BufferProfile:
      type: object
      required: [id, version, code, itemType, leadTimeFactor, variabilityFactor, orderCycleDays, minOrderQty, spikeThresholdPct,
        spikeHorizonDays, aduWindowPastDays, aduWindowFutureDays]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1, description: Same as the ETag}
        code: {type: string}
        itemType: {type: string, enum: [manufactured, purchased, distributed]}
        leadTimeFactor: {type: string}
        variabilityFactor: {type: string}
        orderCycleDays: {type: integer}
        minOrderQty: {type: string}
        spikeThresholdPct: {type: string}
        spikeHorizonDays: {type: [integer, 'null']}
        aduWindowPastDays: {type: integer}
        aduWindowFutureDays: {type: integer}
    BufferZones:
      type: object
      required: [redBase, redSafety, yellow, green, topOfRed, topOfYellow, topOfGreen]
      properties:
        redBase: {type: string}
        redSafety: {type: string}
        yellow: {type: string}
        green: {type: string}
        topOfRed: {type: string}
        topOfYellow: {type: string}
        topOfGreen: {type: string}
    DdmrpBuffer:
      type: object
      description: Stored result of the last recalculation of one item, site and warehouse scope (data model DdmrpBuffer, BR-22.11)
      required: [id, itemId, siteId, warehouseId, profileId, profileCode, adu, dltDays, daf, adjustedAdu, zones, qualifiedDemand,
        netFlow, plannedQty, priority, zone, calculatedAt]
      properties:
        id: {type: string, format: uuid}
        itemId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        warehouseId: {type: [string, 'null'], format: uuid}
        profileId: {type: string, format: uuid}
        profileCode: {type: string}
        adu: {type: string}
        dltDays: {type: string}
        daf: {type: string}
        adjustedAdu: {type: string, description: ADU × DAF}
        zones: {$ref: '#/components/schemas/BufferZones'}
        qualifiedDemand: {type: string}
        netFlow: {type: string, description: NFP = on-hand + open supply − qualified demand}
        plannedQty: {type: string, description: 'TOG − NFP when NFP ≤ TOY (at least MOQ, rounded up to the order multiple); 0 otherwise'}
        priority: {type: string, description: 'NFP / TOG, 4 decimals; lower is more urgent'}
        zone: {type: string, enum: [red, yellow, green]}
        calculatedAt: {type: string, format: date-time}
    QuotaSourceInput:
      type: object
      required: [type, quota]
      description: Exactly the reference of the source type is set; a source may not be named twice in one arrangement.
      properties:
        type: {type: string, enum: [vendor, production, transfer]}
        vendorId: {type: string, format: uuid, description: 'Required for vendor, absent otherwise'}
        productionVersionId: {type: string, format: uuid, description: 'Required for production, absent otherwise'}
        fromWarehouseId: {type: string, format: uuid, description: 'Required for transfer, absent otherwise'}
        quota: {type: string, description: 'Share weight 0 to 99999.9999; 0 is a fallback used only when every other source is blocked'}
        baseQty: {type: string, default: '0'}
        allocatedQty: {type: string, default: '0', description: Carried over from a legacy system (SAP EQUP); firming adds the quantity of the planned orders allocated to the source}
        maxQtyPerPeriod: {type: [string, 'null'], description: Positive; given together with periodDays}
        periodDays: {type: [integer, 'null'], minimum: 1, maximum: 366}
        priority: {type: integer, minimum: 0, maximum: 999, default: 0, description: 'Breaks rating ties, lower first'}
        blocked: {type: boolean, default: false}
    QuotaSource:
      allOf:
        - $ref: '#/components/schemas/QuotaSourceInput'
        - type: object
          required: [id, rating]
          properties:
            id: {type: string, format: uuid}
            rating: {type: [string, 'null'], description: '(allocated + base) / quota, 4 decimals (BR-22.12); null for quota 0'}
    QuotaArrangementInput:
      type: object
      required: [itemId, siteId, validFrom, validTo, sources]
      properties:
        legalEntityId: {type: string, format: uuid, description: "Owning legal entity on create: the caller's single legal entity by default, required (422) for a caller scoped to several or to all; ignored on update."}
        itemId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date, description: Inclusive; on or after validFrom}
        split: {type: boolean, default: false, description: Split one requirement across sources (BR-22.12)}
        minSplitQty: {type: string, default: '0'}
        sources:
          type: array
          minItems: 1
          maxItems: 100
          description: The quotas must add up to more than 0
          items: {$ref: '#/components/schemas/QuotaSourceInput'}
    QuotaArrangement:
      type: object
      required: [id, version, itemId, siteId, validFrom, validTo, split, minSplitQty, sources]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1, description: Same as the ETag}
        itemId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date}
        split: {type: boolean}
        minSplitQty: {type: string}
        sources:
          type: array
          items: {$ref: '#/components/schemas/QuotaSource'}
    RunRequest:
      type: object
      required: [asOf, siteId, items]
      properties:
        asOf: {type: string, format: date, description: Day 0 of the plan}
        siteId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid, description: "Owning legal entity of the plan when this run creates it: defaults to the caller's single legal entity and is required (422) for a caller scoped to several or to all legal entities; 403 outside the caller's scope. For an existing plan it is an assertion and a different value is 422. A plan code held by a plan outside the caller's scope, including one with no legal entity yet, is 409 PLAN-CODE-TAKEN. When forecastModel is set its legal entity must equal the plan's (422 PLAN-FORECAST-ENTITY)."}
        forecastModel:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'
          description: 'Adds the reduced forecast of this model at the site as forecast demand (ref FC:<model>:<period start>) of the snapshot items; periods that ended before asOf are skipped. 422 PLAN-FORECAST-NOT-FOUND when the model does not exist.'
        calendar:
          type: object
          description: 'Site work calendar (FR-22.5, BR-22.8). Lead times, receipt margins and futures dates then count working days; a demand on a closed day moves forward and a receipt or planned delivery on a closed day moves backward to the nearest open day. Omit to count calendar days. Period, positive and negative days stay calendar days.'
          properties:
            closedWeekdays:
              type: array
              maxItems: 7
              description: At least one weekday must stay open.
              items: {type: integer, minimum: 0, maximum: 6, description: 0 Sunday to 6 Saturday}
            closedDates:
              type: array
              maxItems: 1000
              items: {type: string, format: date}
        carryForward:
          type: boolean
          default: false
          description: 'When true the plan''s firmed planned orders at the site whose delivery date is on or after asOf are added as scheduled receipts (refType planned-order, ref FP:<planned order id>) of their items, so a firmed order is supply of the run and is not planned a second time (FR-22.1, FR-22.10). The approved planned orders of the current version are carried the same way, since an operational run firms them (FR-22.11). Leave it false when the target orders already arrive in receipts. Orders of simulation versions are never carried.'
        horizonDays:
          type: integer
          minimum: 0
          maximum: 1095
          default: 0
          description: 'Demand dated more than this many days after asOf is ignored (planning horizon, 30 to 1,095). 0 takes the service default PLANNING_HORIZON_DAYS (365 unless configured). Supply is never dropped, and supply dated beyond the horizon raises no cancel or decrease message.'
        scope:
          $ref: '#/components/schemas/PlanScope'
        items:
          type: array
          minItems: 1
          maxItems: 100000
          items: {$ref: '#/components/schemas/RunItem'}
    PlanScope:
      type: object
      description: 'Plan scope filter (FR-22.13). The version reports only the items that match every given criterion; the whole snapshot is still exploded and netted, so a component inside the scope is sized by parents outside it. Omitted or empty criteria restrict nothing.'
      properties:
        itemIds: {type: array, maxItems: 1000, items: {type: string, format: uuid}, description: Only these items}
        itemGroups: {type: array, maxItems: 1000, items: {type: string, minLength: 1, maxLength: 64}, description: 'Only items whose itemGroup is one of these'}
        planners: {type: array, maxItems: 1000, items: {type: string, minLength: 1, maxLength: 64}, description: 'Only items whose planner is one of these'}
        llcMin: {type: integer, minimum: 0, maximum: 99, description: Lowest low-level code reported, 0 is an end item}
        llcMax: {type: integer, minimum: 0, maximum: 99, description: Highest low-level code reported, at least llcMin}
    RunItem:
      type: object
      required: [itemId]
      properties:
        itemId: {type: string, format: uuid}
        itemGroup: {type: string, maxLength: 64, description: 'Item group, matched by scope.itemGroups (FR-22.13)'}
        planner: {type: string, maxLength: 64, description: 'Planner, matched by scope.planners (FR-22.13)'}
        coverage:
          type: object
          description: Omit it, or send it without a code, to use the stored item coverage of the item at the site; a block without a code is replaced whole.
          properties:
            code: {type: string, enum: [requirement, period, minmax, manual], description: Required unless the item has a stored site-scope item coverage}
            periodDays: {type: integer, minimum: 0}
            marginDays: {type: integer, minimum: 0, maximum: 365, description: Receipt margin in working days (FR-22.5)}
            issueMarginDays: {type: integer, minimum: 0, maximum: 365, description: Working days each demand of the item is moved earlier (FR-22.5)}
            reorderMarginDays: {type: integer, minimum: 0, maximum: 365, description: Working days added to the lead time of planned orders (FR-22.5)}
            positiveDays: {type: integer, minimum: 0}
            negativeDays: {type: integer, minimum: 0}
            reorderMin: {type: string, description: Decimal string}
            reorderMax: {type: string, description: Decimal string}
            freezeFenceDays: {type: integer, minimum: 0, maximum: 3650, description: 'BR-22.4: no planned orders for requirements inside; the uncovered rest is a shortage message. 0 freezes nothing.'}
            actionFenceDays: {type: integer, minimum: 0, maximum: 3650, description: 'BR-22.4: advance/postpone only for receipts inside. 0 is unlimited.'}
            futuresFenceDays: {type: integer, minimum: 0, maximum: 3650, description: 'BR-22.4: delay messages only for requirements inside. 0 is unlimited.'}
            coverageFenceDays: {type: integer, minimum: 0, maximum: 3650, description: 'FR-22.2 coverage time fence: existing supply at or beyond it that demand does not need raises cancel (nothing pegged) or decrease (by the unpegged part), inside the action fence. 0 raises neither.'}
            firmingFenceDays: {type: integer, minimum: 0, maximum: 3650, description: 'BR-22.4 firming time fence. With autoFirm, planned orders whose order date falls inside it are firmed by the run (grouping vendor-date, one plannedorder.firmed.v1 each). 0 firms nothing.'}
            autoFirm: {type: boolean, default: false, description: Needs firmingFenceDays of at least 1}
            safetyStockPolicy: {type: string, enum: [today, first-issue], description: 'BR-22.5 safety-stock policy. Left out, the run takes the policy of the stored coverage group, else today.'}
        onHand: {type: string, description: Decimal string}
        safetyStock: {type: string, description: Decimal string}
        orderType: {type: string, enum: [purchase, production, transfer], description: Required unless the item has a stored site-scope item coverage}
        leadTimeDays: {type: integer, minimum: 0, maximum: 3650, description: 'Omitted: the stored item coverage''s lead-time override, else 0'}
        lot:
          type: object
          properties:
            minOrderQty: {type: string}
            multipleQty: {type: string}
            maxOrderQty: {type: string}
            standardQty: {type: string}
        demand: {type: array, items: {$ref: '#/components/schemas/RunRequirement'}}
        receipts: {type: array, items: {$ref: '#/components/schemas/RunRequirement'}}
        components:
          type: array
          items:
            type: object
            required: [itemId, qty]
            properties:
              itemId: {type: string, format: uuid}
              qty: {type: string}
    RunRequirement:
      type: object
      required: [ref, refType, date, qty]
      properties:
        ref: {type: string}
        refType: {type: string, enum: [sales-line, forecast, safety-stock, bom-line, transfer-issue, on-hand, purchase-line, production-order, transfer-receipt, planned-order]}
        date: {type: string, format: date}
        qty: {type: string, description: Positive decimal string}
        priority: {type: integer, description: 'Lower nets first; default sales-line 1, forecast 2, others 4'}
    ScenarioSettings:
      type: object
      required: [planCode, name]
      properties:
        planCode: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$', description: The plan the scenario simulates against; at most 10 active scenarios per plan}
        name: {type: string, minLength: 1, maxLength: 120}
        demandFactor: {type: string, default: '1', description: 'Multiplies the independent demand (sales lines and forecast) of every item without its own factor; 0 to 100, at most 4 decimals. Safety-stock and transfer-issue demand is not scaled; dependent demand follows from the explosion.'}
        itemFactors:
          type: array
          maxItems: 500
          items:
            type: object
            required: [itemId, factor]
            properties:
              itemId: {type: string, format: uuid}
              factor: {type: string, description: 'Replaces demandFactor for this item; 0 to 100'}
        addedDemand:
          type: array
          maxItems: 500
          items:
            type: object
            required: [itemId, date, qty]
            properties:
              itemId: {type: string, format: uuid}
              date: {type: string, format: date, description: A date before the run date is due on the run date}
              qty: {type: string, description: Decimal greater than 0, at most 6 decimals}
        leadTimeOverrides:
          type: array
          maxItems: 500
          items:
            type: object
            required: [itemId, leadTimeDays]
            properties:
              itemId: {type: string, format: uuid}
              leadTimeDays: {type: integer, minimum: 0, maximum: 3650}
        active: {type: boolean, default: true}
    ScenarioUpdate:
      type: object
      description: Same fields as ScenarioSettings; planCode may be left out on update
      properties:
        planCode: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
        name: {type: string, minLength: 1, maxLength: 120}
        demandFactor: {type: string, default: '1'}
        itemFactors: {$ref: '#/components/schemas/ScenarioSettings/properties/itemFactors'}
        addedDemand: {$ref: '#/components/schemas/ScenarioSettings/properties/addedDemand'}
        leadTimeOverrides: {$ref: '#/components/schemas/ScenarioSettings/properties/leadTimeOverrides'}
        active: {type: boolean, default: true}
    Scenario:
      allOf:
        - type: object
          required: [id, version, code]
          properties:
            id: {type: string, format: uuid}
            version: {type: integer, minimum: 1, description: Same as the ETag}
            code: {type: string}
        - $ref: '#/components/schemas/ScenarioSettings'
    PlanVersion:
      type: object
      properties:
        id: {type: string, format: uuid}
        planCode: {type: string}
        number: {type: integer}
        status: {type: string, enum: [running, complete, failed, current]}
        kind: {type: string, enum: [static, simulation], description: 'A simulation version is written by a scenario run, is never current and cannot be firmed (FR-22.15)'}
        scenarioCode: {type: string, description: Set on a simulation version}
        asOf: {type: string, format: date}
        itemsPlanned: {type: integer, description: 'Items the version reports: every item of the snapshot, or those inside the run''s scope (FR-22.13)'}
        plannedOrders: {type: integer}
        approvedFirmed: {type: integer, description: 'Planned orders approved in the previous version that this run firmed (FR-22.11), in one firming batch with one plannedorder.firmed.v1 each'}
        messages: {type: integer}
        durationMs: {type: integer, format: int64}
        planHash: {type: string, description: 'sha256 hex over orders, pegging and messages, and the quota source of each allocated order'}
    PlannedOrder:
      type: object
      properties:
        id: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        number: {type: string, description: 'PLN-nnnnnn; the parts of an order a split quota arrangement divided are numbered <number>-<n>'}
        itemId: {type: string, format: uuid}
        orderType: {type: string, enum: [purchase, production, transfer]}
        qty: {type: string}
        orderDate: {type: string, format: date}
        deliveryDate: {type: string, format: date}
        futuresDate: {type: [string, 'null'], format: date}
        delayDays: {type: integer}
        lotRule: {type: string}
        status: {type: string, enum: [unprocessed, approved, firmed, deleted]}
        version: {type: integer, minimum: 1, description: Same as the ETag}
        vendorId: {type: string, format: uuid, description: Set by maintenance on purchase orders, or by a plan run from the vendor of the quota source the order was allocated to}
        quotaArrangementId: {type: string, format: uuid, description: The quota arrangement a plan run applied to the order (FR-22.17); absent when none applied}
        quotaSourceId: {type: string, format: uuid, description: The quota source the run allocated the order to; firming books its quantity on that source. A vendor change on the order moves it to that vendor's source of the arrangement, or out of the arrangement when the vendor is not one of its sources}
        firmedTargetType: {type: string, enum: [purchase-order, production-order, transfer-order], description: Set once the order is firmed}
        firmedTargetId: {type: string, format: uuid, description: Id of the order it became (FR-22.10); orders of one purchase group share it}
    FirmRequest:
      type: object
      required: [plannedOrderIds]
      properties:
        plannedOrderIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: {type: string, format: uuid}
        grouping: {type: string, enum: [none, vendor, vendor-date, vendor-week], default: vendor-date, description: 'How planned purchase orders of one site and vendor merge: not at all, all, per delivery date, or per Monday-to-Sunday week'}
    FirmBatch:
      type: object
      required: [id, grouping, firmed, groups]
      properties:
        id: {type: string, format: uuid}
        grouping: {type: string, enum: [none, vendor, vendor-date, vendor-week]}
        firmed: {type: integer, description: Planned orders firmed}
        groups:
          type: array
          items:
            type: object
            required: [targetType, targetId, orderType, siteId, vendorId, deliveryDate, qty, plannedOrderIds]
            properties:
              targetType: {type: string, enum: [purchase-order, production-order, transfer-order]}
              targetId: {type: string, format: uuid}
              orderType: {type: string, enum: [purchase, production, transfer]}
              siteId: {type: string, format: uuid}
              vendorId: {type: [string, 'null'], format: uuid}
              deliveryDate: {type: string, format: date, description: Earliest delivery date of the group}
              qty: {type: string, description: Sum of the grouped planned quantities}
              plannedOrderIds: {type: array, items: {type: string, format: uuid}}
    PlannedOrderPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        qty: {type: string, description: 'Positive decimal string, at most 6 decimals'}
        orderDate: {type: string, format: date}
        deliveryDate: {type: string, format: date}
        vendorId: {type: string, format: uuid, description: Planned purchase orders only}
        status: {type: string, enum: [approved], description: Approve the order; firming is a separate command}
    ForecastModel:
      type: object
      required: [code, version, reductionPrinciple, reductionPercent, status, submittedBy, decidedBy, publishedAt]
      properties:
        code: {type: string}
        version: {type: integer, minimum: 0}
        reductionPrinciple: {type: string, enum: [none, percent, transactions, transactions-dynamic]}
        reductionPercent: {type: string, description: 'Decimal string, used by principle percent'}
        status: {type: string, enum: [draft, submitted, published], description: 'FR-22.9 consensus status; only a draft accepts cell writes'}
        submittedBy: {type: [string, 'null'], description: User who submitted the model; null in draft}
        decidedBy: {type: [string, 'null'], description: User who last published or rejected the model}
        publishedAt: {type: [string, 'null'], format: date-time}
    ConsensusResult:
      type: object
      required: [model]
      properties:
        model: {$ref: '#/components/schemas/ForecastModel'}
        publication:
          type: object
          description: Present on publish only
          required: [items, horizonPeriods, periodFrom, periodTo]
          properties:
            items: {type: integer, description: Item and site series}
            horizonPeriods: {type: integer, description: Distinct periods}
            periodFrom: {type: string, format: date}
            periodTo: {type: string, format: date}
    ForecastLine:
      type: object
      required: [itemId, siteId, periodStart, periodEnd, source, qty, salesQty, reducedQty]
      properties:
        itemId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        periodStart: {type: string, format: date}
        periodEnd: {type: string, format: date}
        source: {type: string, enum: [statistical, manual, consensus]}
        qty: {type: string}
        salesQty: {type: string, description: Open sales quantity of the period used by the reduction}
        reducedQty: {type: string, description: Forecast left after reduction; this is what a run nets}
    ForecastLinesWrite:
      type: object
      required: [lines]
      additionalProperties: false
      properties:
        legalEntityId: {type: string, format: uuid, description: "Owning legal entity of a model this write creates; required (422) for a caller scoped to several or to all. For an existing model it is an assertion and a different value is 422."}
        reductionPrinciple: {type: string, enum: [none, percent, transactions, transactions-dynamic]}
        reductionPercent: {type: string, description: '0 to 100 with at most 6 decimals; only with reductionPrinciple percent'}
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [itemId, siteId, periodStart, periodEnd, qty]
            additionalProperties: false
            properties:
              itemId: {type: string, format: uuid}
              siteId: {type: string, format: uuid}
              periodStart: {type: string, format: date}
              periodEnd: {type: string, format: date}
              qty: {type: string, description: 'Decimal string, 0 or more with at most 6 decimals; 0 clears the period'}
              salesQty: {type: string, description: 'Decimal string, 0 or more'}
              source: {type: string, enum: [manual, statistical], default: manual}
    DayQty:
      type: object
      required: [day, qty]
      description: A quantity on a day offset from day 0 of a calculation; negative days are in the past
      properties:
        day: {type: integer, minimum: -3650, maximum: 3650}
        qty: {type: string, description: 'Decimal string, 0 or more'}
    Pegging:
      type: object
      required: [orderId, number, qty, tree]
      properties:
        orderId: {type: string, format: uuid}
        number: {type: string}
        qty: {type: string}
        tree: {$ref: '#/components/schemas/PegNode'}
    PegNode:
      type: object
      required: [ref, refType, qty, children]
      properties:
        ref: {type: string}
        refType: {type: string}
        qty: {type: string}
        children:
          type: array
          items: {$ref: '#/components/schemas/PegNode'}
    NetRequirement:
      type: object
      required: [itemId, date, grossRequirements, scheduledReceipts, plannedReceipts, projectedAvailableBalance, netRequirement]
      properties:
        itemId: {type: string, format: uuid}
        date: {type: string, format: date}
        grossRequirements: {type: string, description: 'Decimal string in the inventory unit: demand, dependent demand and safety stock (at the as-of date) due that day'}
        scheduledReceipts: {type: string, description: Existing supply (open orders) due that day}
        plannedReceipts: {type: string, description: Planned orders delivered that day}
        projectedAvailableBalance: {type: string, description: 'PAB(t) = PAB(t-1) + SR + PR - GR, opening at on-hand'}
        netRequirement: {type: string, description: 'The day''s own shortfall before planned receipts: max(0, GR - max(PAB(t-1), 0) - SR)'}
    Message:
      type: object
      properties:
        action: {type: string, enum: [delay, postpone, advance, shortage, cancel, decrease, increase]}
        itemId: {type: string, format: uuid}
        supplyRef: {type: string, description: Planned order number or receipt ref; empty for a shortage}
        demandRef: {type: string, description: Demand the message is about; empty when none}
        suggestedDate: {type: string, format: date, description: 'delay: expected date; postpone/advance: suggested receipt date; shortage: demand date; cancel/decrease/increase: receipt date'}
        delayDays: {type: integer}
        qty: {type: string}
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri, example: 'https://passage.dev/problems/PLAN-0001'}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string, example: PLAN-0001}
        serviceCode: {type: string, example: PLN-0001}
        traceId: {type: string}
        errors:
          type: object
          additionalProperties: {type: string}
