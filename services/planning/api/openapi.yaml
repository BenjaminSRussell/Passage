  /v1/planning/strategies:
    get:
      operationId: listStrategies
      summary: The six planning strategies with their setup (FR-22.19)
      description: |
        Always six entries in setup order (mts-net, mts-gross, mto,
        assemble-to-order-final, plan-without-final-assembly, subassembly).
        A strategy without stored setup is shown with the PRD defaults and
        configured false, without id or version.
      x-passage-duty: planning.read
      responses:
        '200':
          description: The six strategies
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PlanningStrategy'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createStrategy
      summary: Store the setup of a planning strategy (FR-22.19, BR-22.13)
      description: |
        Omitted fields take the defaults of the strategy: consumption mode
        backward, backward window 30 days, forward window 0, marking on for
        mto and plan-without-final-assembly, no segregated stock. A strategy
        that already has setup is 409 PLAN-STRATEGY-EXISTS. With an
        Idempotency-Key, a retry of the same body returns the stored setup
        with 200 and Idempotent-Replayed: true; another body under the key is
        422. A plan run reads the setup of the strategy on an item's
        site-scope item coverage when it nets the forecast model: mto plans no
        forecast, mts-gross the forecast as entered and not netted against
        on-hand, assemble-to-order-final the forecast left after the item's
        sales lines consumed it inside the window (a sale that finds no forecast
        raises the PLAN-0015 sales-on-top message), and the other strategies
        the reduced forecast. A scenario's added sales consume forecast the same
        way. A strategy sent on an item's coverage block in a run wins over the
        stored coverage.
      x-passage-duty: planning.setup.maintain
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [code]
                  properties:
                    code: {$ref: '#/components/schemas/StrategyCode'}
                - $ref: '#/components/schemas/StrategySettings'
      responses:
        '201':
          description: The stored setup; the ETag header carries its version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanningStrategy'}
        '200':
          description: 'Idempotent replay of an earlier create (Idempotent-Replayed: true)'
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanningStrategy'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
