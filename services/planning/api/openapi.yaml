      description: The plan of a scenario cannot change; planCode may be left out or must equal the stored one (422 PLAN-SCENARIO-PLAN). Activating a scenario past the limit of 10 active per plan is 409 PLAN-SCENARIO-LIMIT.
      x-passage-duty: planning.simulate
      parameters:
        - $ref: '#/components/parameters/CoverageCode'
