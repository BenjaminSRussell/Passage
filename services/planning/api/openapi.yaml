openapi: 3.1.0
info:
  title: Passage Planning API
  version: 0.4.0
  description: |
    Master planning (wave 22, slices 1 to 8). Covers static plan runs with time
    fences (auto-firming inside the firming fence), forecast demand and a site
    work calendar, run history and version status, planned orders with their
    maintenance (change quantity, dates and vendor, approve, delete under
    If-Match) and firming, explain-tree pegging, action/delay messages, the
    MD04-style net requirements view, forecast cells with reduction and the
    forecast consensus workflow (submit, publish, reject), coverage group
    setup (list, create, read, change under If-Match), and stateless
    calculators. Every planned order is pegged to the demand it serves.
    Browser clients call these paths under /api (the web BFF strips the
    prefix). Not yet exposed (see NOT-IMPLEMENTED.md): item coverage,
    statistical forecast generation through this service (forecast-py serves
    it), simulation plans.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/planning/plans/{planCode}:run:
    post:
      operationId: runPlan
      summary: Run a static plan and make its version current on success
      description: 'An item sent without a coverage code, without orderType or without leadTimeDays takes them from its stored site-scope item coverage at siteId and that coverage''s group (FR-22.2, FR-22.5): the whole coverage block (group settings with the item coverage''s min, max and receipt margin), the planned order type and the lead-time override. Inline values always win, including an explicit leadTimeDays of 0. An item left without a coverage code or order type is a 400 naming items[i].coverage.code or items[i].orderType. The Idempotency-Key fingerprint is the request as sent, so a retry replays even after the stored coverage changed. Warehouse and subcontractor scopes are not read (FR-22.18). A run with a scope (FR-22.13) still becomes the current version, so the plan then holds planned orders only for the items inside that scope. Quota arrangements (FR-22.17, BR-22.12): a planned order of an item with an arrangement at siteId valid on its delivery date goes to the source with the lowest rating among the sources of its order type (vendor for purchase, production version for production, warehouse for transfer), orders taken in delivery order so the ratings move during the run; a source with a per-period maximum takes no more than what is left of it after the firmed and approved orders of the period; a split arrangement replaces the order by one order per source numbered <number>-<n>, with its pegging divided over them. The order then carries quotaArrangementId, quotaSourceId and, for a vendor source, vendorId; an order no source can take stays without a source. Firming books the order quantity on the source. DDMRP (FR-22.16, BR-22.11): an item whose site-scope item coverage is a decouplingPoint and that has a stored site-scope buffer at siteId (of the plan''s legal entity) is replenished by the buffer''s planned quantity (the last recalculation), due after the decoupled lead time and no earlier than the item''s lead time, instead of being netted: its own demand, receipts, on-hand, safety stock and min/max are not used, and it is removed from the components of other items (the decoupling point absorbs the demand above it) while its own components still explode. Its planned orders carry the buffer''s planningPriority and bufferZone. A green buffer plans nothing; a buffer in the red zone raises a red-zone action message (PLAN-0010) on each of its orders (on each part of a quota split).'
      x-passage-duty: planning.run
      parameters:
        - name: planCode
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunRequest'}
      responses:
        '201':
          description: Version created and made current
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanVersion'}
        '200':
          description: 'Replay of an earlier run with the same Idempotency-Key (Idempotent-Replayed: true)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /v1/planning/plans/{planCode}/versions:
    get:
      operationId: listVersions
      summary: Plan run history, newest version first
      x-passage-duty: planning.read
      parameters:
        - name: planCode
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Versions of the plan
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PlanVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/planning/plans/{planCode}/versions/{number}:
    get:
      operationId: getVersion
      summary: Version status, counts and plan hash
      x-passage-duty: planning.read
      parameters:
        - name: planCode
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
        - name: number
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Plan version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/planning/plans/{planCode}/diff:
    get:
      operationId: diffVersions
      summary: Compare the planned orders of two plan versions
      description: >-
        Version-to-version diff (FR-22.14). Planned orders match on item, order
        type and delivery day; orders equal in quantity, order date and vendor
        pair first and are unchanged, the remaining ones pair in quantity order
        and are changed, and the leftovers are added (only in `to`) or removed
        (only in `from`). Deleted orders are left out. `identical` is true when
        both plan hashes are equal. The counts and quantity deltas cover every
        order; `added`, `removed` and `changed` list at most `limit` entries
        each, and `truncated` says when one was cut.
      x-passage-duty: planning.read
      parameters:
        - name: planCode
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
        - name: from
          in: query
          required: true
          description: Earlier version number.
          schema: {type: integer, minimum: 1}
        - name: to
          in: query
          required: true
          description: Later version number.
          schema: {type: integer, minimum: 1}
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Differences between the two versions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersionDiff'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/planning/plans/{planCode}/projection:
    get:
      operationId: getPlanProjection
      summary: Supply schedule and inventory projection of items in the current plan version (FR-22.21, FR-22.22)
      description: >-
        The supply schedule workbench over a stored plan: for up to 20 items
        at the version's site, the days of the current version are grouped
        into buckets counted from the version's as-of date: days, ISO weeks
        (Monday to Sunday; the first runs from the as-of date to the Sunday
        of its week), or calendar months (the first runs from the as-of date
        to the end of its month); the last bucket ends at the horizon.
        Demand is the run's gross requirements (it includes the safety stock
        the run holds back), supply the scheduled receipts, planned the planned
        receipts, and `closingOnHand` the projected available balance at the
        bucket's end (opening on-hand + supply + planned - demand), so it
        matches the net requirements view. A bucket is a shortage when its
        balance is below zero. `daysOfSupply` is the balance over the average
        daily demand of the following 30 days (null without demand). Given
        `unitCost` and `currency`, each bucket carries the value of its balance;
        otherwise `value` and `currency` are null. An item the plan did not plan
        has `planned` false and zero rows. Edits to planned orders after the run
        are not reflected until the next run. A plan outside the caller's legal
        entities reads as not found.
      x-passage-duty: planning.read
      parameters:
        - name: planCode
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
        - name: itemId
          in: query
          required: true
          description: Item to project; repeat the parameter for up to 20 items.
          style: form
          explode: true
          schema: {type: array, minItems: 1, maxItems: 20, items: {type: string, format: uuid}}
        - name: bucket
          in: query
          description: Day, ISO week (Monday to Sunday), or calendar month; the first week or month runs from the as-of date to its end.
          schema: {type: string, enum: [day, week, month], default: week}
        - name: horizonDays
          in: query
          description: Days from the as-of date to project, 1 to 730.
          schema: {type: integer, minimum: 1, maximum: 730, default: 84}
        - name: unitCost
          in: query
          description: Current cost per inventory unit; give it with `currency` to value each bucket's balance (the cost comes from inventory costing, PSG-20, and is entered until that is read).
          schema: {type: string, example: '2.50'}
        - name: currency
          in: query
          schema: {type: string, pattern: '^[A-Z]{3}$', example: EUR}
      responses:
        '200':
          description: One schedule per requested item, in the order asked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanProjection'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/planning/planned-orders:
    get:
      operationId: listPlannedOrders
      summary: Planned orders of the current version of a plan
      x-passage-duty: planning.read
      parameters:
        - name: planCode
          in: query
          required: true
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string, enum: [unprocessed, approved, firmed]}
        - name: itemId
          in: query
          schema: {type: string, format: uuid}
        - name: warehouseId
          in: query
          description: Only the orders of this warehouse planning scope (FR-22.18); left out, every scope
          schema: {type: string, format: uuid}
        - name: version
          in: query
          description: Read this version number instead of the current one, e.g. a simulation version (FR-22.15)
          schema: {type: integer, minimum: 1}
        - name: sort
          in: query
          description: 'priority: planned orders that replenish a DDMRP buffer first, lowest planning priority (net-flow position over top of green) first, then the rest in number order (FR-22.16). Without sort only the buffer orders of items whose site-scope item coverage is priorityBased lead by priority; the rest are in number order'
          schema: {type: string, enum: [priority]}
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Planned orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PlannedOrder'}
        '400': {$ref: '#/components/responses/Problem'}
  /v1/planning/planned-orders/{id}:
    get:
      operationId: getPlannedOrder
      summary: One planned order of any version
      x-passage-duty: planning.read
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Planned order; the ETag header carries its version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlannedOrder'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updatePlannedOrder
      summary: Change quantity, dates or vendor of an open planned order of the current version, or approve it (FR-22.11)
      x-passage-duty: planning.order.maintain
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlannedOrderPatch'}
      responses:
        '200':
          description: The changed order with its new ETag
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlannedOrder'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: PLAN-ORDER-NOT-EDITABLE (firmed, deleted or not in the current version)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '412':
          description: conflict_version (If-Match is not the current version)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: PLAN-ORDER-INVALID (order date after delivery date, vendor on a non-purchase order)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '428':
          description: precondition_required (If-Match missing)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    delete:
      operationId: deletePlannedOrder
      summary: Delete an open planned order of the current version (FR-22.11)
      x-passage-duty: planning.order.maintain
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': {description: Deleted; the order no longer appears in lists}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/planning/planned-orders:firm:
    post:
      operationId: firmPlannedOrders
      summary: Firm up to 1,000 planned orders of current plan versions into purchase, production and transfer orders (FR-22.10, BR-22.9)
      description: >-
        All orders are firmed or none. Planned purchase orders of one site and vendor merge into one purchase order per
        grouping; production and transfer orders are never merged. Each order becomes firmed with the id of its target
        order and one dev.passage.planning.plannedorder.firmed.v1 per order is published through the outbox; the owning
        context creates the target order with that id.
      x-passage-duty: planning.order.firm
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FirmRequest'}
      responses:
        '201':
          description: Orders firmed; the target orders to create
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirmBatch'}
        '200':
          description: 'Replay of an earlier firming with the same Idempotency-Key (Idempotent-Replayed: true)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirmBatch'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404':
          description: PLAN-ORDER-NOT-FOUND (an id is not a planned order of the tenant)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: PLAN-0002 (an order is already firmed), PLAN-ORDER-NOT-EDITABLE (deleted, or not in the current version) or PLAN-0003 (the order belongs to a simulation, BR-22.14)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: idempotency_key_reuse (the key was used with another request)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/planning/planned-orders/{id}/pegging:
    get:
      operationId: getPegging
      summary: Explain tree from a planned order to the demand it serves
      x-passage-duty: planning.read
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: depth
          in: query
          schema: {type: integer, minimum: 1, maximum: 20, default: 5}
      responses:
        '200':
          description: Explain tree; the root's children sum to the planned quantity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pegging'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/planning/messages:
    get:
      operationId: listMessages
      summary: Action and delay messages of the current version
      x-passage-duty: planning.read
      parameters:
        - name: planCode
          in: query
          required: true
          schema: {type: string}
        - name: action
          in: query
          schema: {type: string, enum: [delay, postpone, advance, shortage, cancel, decrease, increase, red-zone, sales-on-top, no-vendor, no-quota-source, lot-split, bom-cycle]}
        - name: status
          in: query
          description: 'Messages of this status; open when left out, all for every status (FR-22.7)'
          schema: {type: string, enum: [open, applied, dismissed, all], default: open}
        - name: sort
          in: query
          description: 'priority: messages about planned orders that replenish a DDMRP buffer first, lowest planning priority (net-flow position over top of green) first, then the rest in action, supply, demand order (FR-22.16). Without sort only the messages about buffer orders of items whose site-scope item coverage is priorityBased lead by priority; the rest are in action, supply, demand order'
          schema: {type: string, enum: [priority]}
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Message'}
        '400': {$ref: '#/components/responses/Problem'}
  /v1/planning/messages/{id}:
    get:
      operationId: getMessage
      summary: One action message of any version with its status
      x-passage-duty: planning.read
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: The message; the ETag header carries its version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/planning/messages/{id}:apply:
    post:
      operationId: applyMessage
      summary: Apply an open action message about existing supply (FR-22.7)
      description: Marks the message applied and publishes message.applied.v1 in the same transaction; the context that owns the source order (supplyRef) makes the change, planning changes no order. A later run that raises the same message again carries the decision onto it (carriedFrom) without a new event. Only postpone, advance, cancel, decrease and increase messages can be applied; the others are 422 PLAN-MESSAGE-NOT-ACTIONABLE and can be dismissed. An optional Idempotency-Key makes a retry of the same decision return the stored message (Idempotent-Replayed true).
      x-passage-duty: planning.order.maintain
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageDecision'}
      responses:
        '200':
          description: The applied message with its new ETag
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: PLAN-MESSAGE-DECIDED (applied or dismissed before) or PLAN-MESSAGE-STALE (its plan version is no longer current)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '412':
          description: conflict_version (If-Match is not the current version of the message)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: PLAN-MESSAGE-NOT-ACTIONABLE (the message changes no source order)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '428':
          description: precondition_required (If-Match missing)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/planning/messages/{id}:dismiss:
    post:
      operationId: dismissMessage
      summary: Dismiss an open action message (FR-22.7)
      description: Marks the message dismissed and publishes message.dismissed.v1 in the same transaction. Every action can be dismissed. A later run that raises the same message again carries the dismissal onto it (carriedFrom), so it does not come back as open. An optional Idempotency-Key makes a retry of the same decision return the stored message (Idempotent-Replayed true).
      x-passage-duty: planning.order.maintain
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageDecision'}
      responses:
        '200':
          description: The dismissed message with its new ETag
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: PLAN-MESSAGE-DECIDED (applied or dismissed before) or PLAN-MESSAGE-STALE (its plan version is no longer current)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '412':
          description: conflict_version (If-Match is not the current version of the message)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '428':
          description: precondition_required (If-Match missing)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/planning/net-requirements:
    get:
      operationId: listNetRequirements
      summary: MD04-style time-phased net requirements of one item in the current version (FR-22.12)
      description: One row per day with movement, as the run netted it; quiet days carry the PAB over. Past-due demand and receipts count at the plan's as-of date. Edits to planned orders after the run are not reflected until the next run.
      x-passage-duty: planning.read
      parameters:
        - name: planCode
          in: query
          required: true
          schema: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
        - name: itemId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: warehouseId
          in: query
          description: Read the item's own scope in this warehouse (FR-22.18, AC-22.16); left out, the site scope, whose rows never include a warehouse's
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Days in date order; empty when the plan has no current version or did not plan the item in that scope
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/NetRequirement'}
        '400': {$ref: '#/components/responses/Problem'}
  /v1/planning/forecasts/{modelCode}/lines:
    get:
      operationId: getForecastLines
      summary: Forecast cells of a model with their reduced quantities (FR-22.8)
      x-passage-duty: planning.read
      parameters:
        - $ref: '#/components/parameters/ModelCode'
        - name: itemId
          in: query
          schema: {type: string, format: uuid}
        - name: siteId
          in: query
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The model and its cells, ordered by item, site and period; the ETag header carries the model version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                type: object
                required: [model, items]
                properties:
                  model: {$ref: '#/components/schemas/ForecastModel'}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ForecastLine'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: putForecastLines
      summary: Upsert forecast cells (each replaces the cell of its item, site and period) and recompute reduction
      description: |
        Creates the model on first write (send If-Match "0"). A reductionPrinciple
        replaces the model's reduction setup and recomputes every series of the
        model; otherwise only the series of the written cells are recomputed.
      x-passage-duty: planning.forecast.maintain
      parameters:
        - $ref: '#/components/parameters/ModelCode'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForecastLinesWrite'}
      responses:
        '200':
          description: Written; the ETag header carries the new model version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                type: object
                required: [model, updated]
                properties:
                  model: {$ref: '#/components/schemas/ForecastModel'}
                  updated: {type: integer}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {description: 'PLAN-FORECAST-LOCKED: the model is submitted or published', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/planning/forecasts/{modelCode}:submit:
    post:
      operationId: submitForecastConsensus
      summary: Submit a draft forecast model for consensus approval (FR-22.9); its cells lock
      description: |
        Records the signed-in user as submitter. The model must exist and have
        cells. If-Match is required, so a replayed submit is answered 412.
      x-passage-duty: planning.forecast.maintain
      parameters:
        - $ref: '#/components/parameters/ModelCode'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Submitted; the ETag header carries the new model version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsensusResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {description: 'Missing duty, or PLAN-CONSENSUS-SOD: no user identity', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {description: 'PLAN-CONSENSUS-STATE: the model is not a draft', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {description: 'PLAN-CONSENSUS-EMPTY: the model has no cells', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/planning/forecasts/{modelCode}:generate:
    post:
      operationId: generateStatisticalForecast
      summary: Generate a statistical forecast from monthly histories into a model (FR-22.9)
      description: |
        Needs the planning.statistical-forecast feature flag (409 PLAN-FEATURE-OFF
        otherwise). Each history is modelled by the forecast service (ETS, Croston
        or TSB selected by AICc and demand interval, with optional season-length
        detection) and written as one statistical cell per calendar month from
        firstPeriodStart. A cell replaces the stored cell of the same item, site
        and month only when that cell is statistical, so manual and consensus
        values survive (cellsKept counts the cells left alone). The reduced
        quantities of the touched series are recomputed, the model version
        increases and dev.passage.planning.forecast.generated.v1 is written in
        the same transaction. Creates the model on first use (send If-Match "0").
        A stale If-Match or a submitted or published model is refused before the
        forecast service is called. Forecast values are stored at 6 decimals
        (BR-22.10), negative values as 0.
      x-passage-duty: planning.forecast.maintain
      parameters:
        - $ref: '#/components/parameters/ModelCode'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerateForecastRequest'}
      responses:
        '200':
          description: Generated; the ETag header carries the new model version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerateForecastResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {description: 'PLAN-FEATURE-OFF: the statistical forecast feature is not enabled; or PLAN-FORECAST-LOCKED: the model is submitted or published', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {description: 'PLAN-FORECAST-RANGE: a forecast value exceeds the largest storable quantity (999,999,999,999.999999); nothing is written', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '428': {$ref: '#/components/responses/Problem'}
        '502': {description: 'PLAN-FORECAST-UNAVAILABLE: the forecast service did not answer', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /v1/planning/forecasts/{modelCode}:allocate:
    post:
      operationId: allocateForecast
      summary: Split aggregate forecast quantities across items by an allocation key into a model (FR-22.8, BR-22.10)
      description: |
        Each period carries an aggregate quantity in the key's forecast unit. The
        quantity is split across the key's items by percentage share (each part cut
        down to 6 decimals, the remainder going to the largest share, ties to the
        lowest item id, so the parts add up exactly) and each part is converted to the
        item's inventory unit with the item's factor by the same rule per factor: the
        converted parts of the items sharing a factor add up to the sum of their parts
        times the factor rounded half away from zero to 6 decimals (a factor of 1 keeps
        the part as it is). The result is written as one manual cell
        per item and period at the site. A cell replaces the stored cell of the same
        item, site and period start and keeps its sales quantity. The reduced
        quantities of the touched series are recomputed, the model version increases
        and dev.passage.planning.forecast.allocated.v1 is written in the same
        transaction. Creates the model on first use (send If-Match "0"); an unknown key
        creates nothing. A submitted or published model is locked.
      x-passage-duty: planning.forecast.maintain
      parameters:
        - $ref: '#/components/parameters/ModelCode'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AllocateForecastRequest'}
      responses:
        '200':
          description: Allocated; the ETag header carries the new model version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AllocateForecastResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {description: 'PLAN-ALLOCATION-KEY-NOT-FOUND: no allocation key has that code', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '409': {description: 'PLAN-FORECAST-LOCKED: the model is submitted or published', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {description: 'PLAN-ALLOCATION-RANGE: a converted quantity exceeds the largest storable quantity (999,999,999,999.999999); nothing is written', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/planning/forecasts/{modelCode}:publish:
    post:
      operationId: publishForecastConsensus
      summary: Approve and publish a submitted forecast model (FR-22.9)
      description: |
        The approver must be neither the submitter nor a writer of any cell of
        the model (4.22.17). Marks the cells consensus, locks the model for good
        and writes dev.passage.planning.forecast.published.v1 in the same
        transaction.
      x-passage-duty: planning.forecast.approve
      parameters:
        - $ref: '#/components/parameters/ModelCode'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Published; the ETag header carries the new model version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsensusResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {description: 'Missing duty, or PLAN-CONSENSUS-SOD: the approver submitted or edited the model', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {description: 'PLAN-CONSENSUS-STATE: the model is not submitted', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/planning/forecasts/{modelCode}:reject:
    post:
      operationId: rejectForecastConsensus
      summary: Return a submitted forecast model to draft (FR-22.9)
      description: Same segregation of duties as publish. The cells can be written again.
      x-passage-duty: planning.forecast.approve
      parameters:
        - $ref: '#/components/parameters/ModelCode'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Rejected; the ETag header carries the new model version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsensusResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {description: 'Missing duty, or PLAN-CONSENSUS-SOD', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {description: 'PLAN-CONSENSUS-STATE: the model is not submitted', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/planning/ddmrp/buffers:evaluate:
    post:
      operationId: evaluateBuffer
      summary: DDMRP zones, net-flow position and planned quantity for one buffer (FR-22.16, BR-22.11)
      description: |
        Stateless calculator: nothing is stored, so no Idempotency-Key and no
        event. Send `adu`, or a `history` to derive it from over the
        pastDays/futureDays window (default 90/0). The planned quantity is
        TOG - NFP, at least the profile's minOrderQty, rounded up to
        orderMultiple; priority is NFP / TOG to 4 places.
      x-passage-duty: planning.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile, dltDays]
              properties:
                profile:
                  type: object
                  properties:
                    leadTimeFactor: {type: string, description: 'Decimal, 0 or more'}
                    variabilityFactor: {type: string, description: 'Decimal, 0 or more'}
                    orderCycleDays: {type: integer, minimum: 0, maximum: 3650}
                    minOrderQty: {type: string, description: 'Decimal, 0 or more'}
                    spikeThresholdPct: {type: string, description: 'Percent of the red zone, 0 to 500; default 50'}
                adu: {type: string, description: Average daily usage; send adu or history}
                history:
                  type: array
                  maxItems: 100000
                  items: {$ref: '#/components/schemas/DayQty'}
                pastDays: {type: integer, minimum: 0, maximum: 3650, default: 90}
                futureDays: {type: integer, minimum: 0, maximum: 3650, default: 0}
                daf: {type: string, description: 'Dynamic adjustment factor; default 1'}
                dltDays: {type: string, description: 'Decoupled lead time in days, 0 to 3650'}
                onHand: {type: string}
                openSupply: {type: string, description: 'Open supply inside the DLT, 0 or more'}
                demand:
                  type: array
                  maxItems: 10000
                  items: {$ref: '#/components/schemas/DayQty'}
                spikeHorizonDays: {type: integer, minimum: 0, maximum: 3650, description: Default is the DLT rounded up}
                orderMultiple: {type: string, description: 'Decimal, 0 or more; 0 means none'}
      responses:
        '200':
          description: Zones, net flow, planned quantity and priority
          content:
            application/json:
              schema:
                type: object
                required: [adu, adjustedAdu, zones, qualifiedDemand, netFlow, plannedQty, priority, zone]
                properties:
                  adu: {type: string}
                  adjustedAdu: {type: string}
                  zones:
                    type: object
                    required: [redBase, redSafety, yellow, green, topOfRed, topOfYellow, topOfGreen]
                    properties:
                      redBase: {type: string}
                      redSafety: {type: string}
                      yellow: {type: string}
                      green: {type: string}
                      topOfRed: {type: string}
                      topOfYellow: {type: string}
                      topOfGreen: {type: string}
                  qualifiedDemand: {type: string}
                  netFlow: {type: string}
                  plannedQty: {type: string, description: 0 when NFP is above the top of yellow}
                  priority: {type: string, description: 'NFP / TOG, 4 decimals'}
                  zone: {type: string, enum: [red, yellow, green]}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/planning/quota-arrangements:allocate:
    post:
      operationId: allocateQuota
      summary: Quota-rating split of one requirement across sources (FR-22.17, BR-22.12)
      description: |
        Stateless calculator. Without split the whole quantity goes to the
        source with the lowest (allocated + base) / quota (ties: priority, then
        id). With split the quantity is divided so the receiving sources end at
        equal ratings; shares below minSplitQty are dropped. Sources with quota
        0 are used only when every other source is blocked; with none usable
        the answer is 422 PLAN-0009.
      x-passage-duty: planning.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sources, qty]
              properties:
                sources:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [id, type, quota]
                    properties:
                      id: {type: string, maxLength: 64}
                      type: {type: string, enum: [vendor, production, transfer]}
                      quota: {type: string, description: 'Decimal, 0 or more'}
                      baseQty: {type: string}
                      allocatedQty: {type: string}
                      priority: {type: integer}
                      blocked: {type: boolean}
                qty: {type: string, description: Positive decimal}
                split: {type: boolean, default: false}
                minSplitQty: {type: string}
      responses:
        '200':
          description: Assignments per source, sorted by source id; they sum to qty
          content:
            application/json:
              schema:
                type: object
                required: [assignments, qty]
                properties:
                  assignments:
                    type: array
                    items:
                      type: object
                      required: [sourceId, qty, ratingAfter]
                      properties:
                        sourceId: {type: string}
                        qty: {type: string}
                        ratingAfter: {type: string}
                  qty: {type: string}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/planning/strategies:consume-forecast:
    post:
      operationId: consumeForecast
      summary: Forecast consumption by sales lines for assemble-to-order-final (FR-22.19, BR-22.13)
      description: |
        Stateless calculator. A sales line on day d consumes forecast in
        [d - backwardDays, d] latest first, then in (d, d + forwardDays]
        earliest first; the mode selects which windows apply. Forecast never
        goes negative; unconsumed sales add on top (grossQty).
      x-passage-duty: planning.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [backward, forward, backward-forward]}
                backwardDays: {type: integer, minimum: 0, maximum: 3650, default: 30}
                forwardDays: {type: integer, minimum: 0, maximum: 3650, default: 0}
                forecast:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [id, startDate, endDate, qty]
                    properties:
                      id: {type: string}
                      startDate: {type: string, format: date}
                      endDate: {type: string, format: date}
                      qty: {type: string}
                sales:
                  type: array
                  maxItems: 10000
                  items:
                    type: object
                    required: [id, date, qty]
                    properties:
                      id: {type: string}
                      date: {type: string, format: date}
                      qty: {type: string}
      responses:
        '200':
          description: Remaining forecast per period and consumption per sales line, both in request order, and the gross requirement
          content:
            application/json:
              schema:
                type: object
                required: [forecast, sales, grossQty]
                properties:
                  forecast:
                    type: array
                    items:
                      type: object
                      required: [id, remainingQty]
                      properties:
                        id: {type: string}
                        remainingQty: {type: string}
                  sales:
                    type: array
                    items:
                      type: object
                      required: [id, consumedQty, unconsumedQty]
                      properties:
                        id: {type: string}
                        consumedQty: {type: string}
                        unconsumedQty: {type: string}
                  grossQty: {type: string}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/planning/supply-schedule:project:
    post:
      operationId: projectSupplySchedule
      summary: Bucketed supply schedule with projected on-hand, value and days of supply for one item and site (FR-22.21, FR-22.22)
      description: |
        Stateless calculator. Days are offsets from day 0; past-due flows count
        on day 0 and flows at or after the horizon are left out (demand after
        the horizon still feeds days of supply). A month bucket is 30 days.
        Value is closing on-hand x unitCost, rounded to the currency's minor
        unit; daysOfSupply is closing on-hand over the average daily demand of
        the 30 days after the bucket, null when there is none.
      x-passage-duty: planning.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [horizonDays, bucket, currency]
              properties:
                horizonDays: {type: integer, minimum: 1, maximum: 3650}
                bucket: {type: string, enum: [day, week, month]}
                openingOnHand: {type: string}
                safetyStock: {type: string}
                unitCost: {type: string, description: 'Current cost per inventory unit, 0 or more'}
                currency: {type: string, pattern: '^[A-Z]{3}$', description: ISO 4217 code of unitCost}
                demand:
                  type: array
                  maxItems: 10000
                  items: {$ref: '#/components/schemas/DayQty'}
                supply:
                  type: array
                  maxItems: 10000
                  description: Scheduled receipts
                  items: {$ref: '#/components/schemas/DayQty'}
                planned:
                  type: array
                  maxItems: 10000
                  description: Planned supply
                  items: {$ref: '#/components/schemas/DayQty'}
      responses:
        '200':
          description: One row per bucket and totals over the horizon
          content:
            application/json:
              schema:
                type: object
                required: [bucket, horizonDays, currency, periods, totals]
                properties:
                  bucket: {type: string, enum: [day, week, month]}
                  horizonDays: {type: integer}
                  currency: {type: string}
                  periods:
                    type: array
                    items:
                      type: object
                      required: [startDay, endDay, demand, supply, planned, closingOnHand, safetyStock, shortage, value, daysOfSupply]
                      properties:
                        startDay: {type: integer}
                        endDay: {type: integer}
                        demand: {type: string}
                        supply: {type: string}
                        planned: {type: string}
                        closingOnHand: {type: string}
                        safetyStock: {type: string}
                        shortage: {type: boolean, description: Closing on-hand below safety stock}
                        value: {type: string, description: Fixed to the currency's minor unit}
                        daysOfSupply: {type: [string, 'null']}
                  totals:
                    type: object
                    required: [demand, supply, planned, closingOnHand]
                    properties:
                      demand: {type: string}
                      supply: {type: string}
                      planned: {type: string}
                      closingOnHand: {type: string}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/planning/shelf-life:allocate:
    post:
      operationId: allocateShelfLife
      summary: Shelf-life aware FEFO allocation of batches to one demand (FR-22.20, BR-22.15)
      description: |
        Stateless calculator. A batch serves the demand only when expiryDay -
        demandDay >= requiredShelfLifeDays; usable batches are taken
        first-expiry-first. With horizonDay set, batches that still have
        quantity and expire by that day are listed (message PLAN-0011).
      x-passage-duty: planning.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [demandDay, demandQty, requiredShelfLifeDays, batches]
              properties:
                demandDay: {type: integer, minimum: 0, maximum: 3650}
                demandQty: {type: string}
                requiredShelfLifeDays: {type: integer, minimum: 0, maximum: 3650}
                horizonDay: {type: integer, minimum: 0, maximum: 3650}
                batches:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [id, qty, expiryDay]
                    properties:
                      id: {type: string, maxLength: 64}
                      qty: {type: string}
                      expiryDay: {type: integer, minimum: -3650, maximum: 3650}
      responses:
        '200':
          description: Allocations, shortfall to cover with planned supply, and expiring unpegged batches
          content:
            application/json:
              schema:
                type: object
                required: [allocations, shortfallQty, expiringUnpegged]
                properties:
                  allocations:
                    type: array
                    items:
                      type: object
                      required: [batchId, qty]
                      properties:
                        batchId: {type: string}
                        qty: {type: string}
                  shortfallQty: {type: string}
                  expiringUnpegged:
                    type: array
                    items:
                      type: object
                      required: [batchId, qty, expiryDay]
                      properties:
                        batchId: {type: string}
                        qty: {type: string}
                        expiryDay: {type: integer}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/planning/coverage-groups:
    get:
      operationId: listCoverageGroups
      summary: Coverage groups of the tenant, ordered by code (FR-22.2)
      x-passage-duty: planning.read
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Coverage groups
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CoverageGroup'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createCoverageGroup
      summary: Create a coverage group (FR-22.2)
      description: |
        Omitted fields take the FR-22.2 defaults: coverage time fence 100 days,
        negative days 1, positive days 0, freeze and firming fences 0,
        auto-firm off, action and futures messages on. A code already in use
        is 409 PLAN-COVERAGE-EXISTS. With an Idempotency-Key, a retry of the
        same body returns the created group with 200 and
        Idempotent-Replayed: true; another body under the key is 422.
      x-passage-duty: planning.setup.maintain
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [code]
                  properties:
                    code: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
                - $ref: '#/components/schemas/CoverageSettings'
      responses:
        '201':
          description: The created coverage group; the ETag header carries its version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoverageGroup'}
        '200':
          description: Idempotent replay of an earlier create
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoverageGroup'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/planning/coverage-groups/{code}:
    get:
      operationId: getCoverageGroup
      summary: One coverage group by code
      x-passage-duty: planning.read
      parameters:
        - $ref: '#/components/parameters/CoverageCode'
      responses:
        '200':
          description: The coverage group; the ETag header carries its version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoverageGroup'}
