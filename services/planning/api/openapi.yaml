          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ItemCoverage'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/planning/buffer-profiles:
    get:
      operationId: listBufferProfiles
      summary: DDMRP buffer profiles of the tenant, ordered by code (FR-22.16)
      x-passage-duty: planning.read
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Buffer profiles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
