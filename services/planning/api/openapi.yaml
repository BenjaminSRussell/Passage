            application/json:
              schema: {$ref: '#/components/schemas/Scenario'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/planning/scenarios/{code}:run:
    post:
      operationId: runScenario
      summary: Run a scenario as a simulation version of its plan (FR-22.15, BR-22.14)
      description: |
        Takes the same snapshot as a plan run (stored item coverage and the
        forecast model are read the same way), applies the scenario to it and
        stores the result as a new version of kind simulation. The plan's
        current version, its messages and its events are untouched: no
        plan.completed.v1, message.raised.v1 or plannedorder.firmed.v1 is
        published, only scenario.simulated.v1. Nothing is auto-firmed and
        firming a planned order of the version is 409 PLAN-0003. Compare it
        with the operational version through the version diff. The plan must
        already have an operational run (404 PLAN-NOT-FOUND); an inactive
        scenario is 409 PLAN-SCENARIO-INACTIVE. The Idempotency-Key
        fingerprint covers the stored scenario and the request. DDMRP buffers
        (FR-22.16) apply after the scenario: a lead-time override of a
        buffered item moves its buffer order, and demand the scenario adds to
        a buffered item is absorbed by its buffer, as in an operational run.
      x-passage-duty: planning.simulate
      parameters:
        - $ref: '#/components/parameters/CoverageCode'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunRequest'}
      responses:
        '201':
          description: Simulation version created; it is never current
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanVersion'}
        '200':
          description: 'Replay of an earlier simulation with the same Idempotency-Key (Idempotent-Replayed: true)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
