openapi: 3.1.0
info:
  title: Passage Planning API
  version: 0.2.0
  description: |
    Master planning (wave 22, slices 1 and 2). Covers static plan runs with time
    fences and forecast demand, run history and version status, planned orders
    and their maintenance (change, approve, delete under If-Match),
    explain-tree pegging, action/delay messages, and forecast cells with
    reduction. Every planned order is pegged to the demand it serves. Browser
    clients call these paths under /api (the web BFF strips the prefix). Not yet
    exposed (see NOT-IMPLEMENTED.md): firming, net requirements, coverage
    groups, statistical forecast generation.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/planning/plans/{planCode}:run:
    post:
      operationId: runPlan
      summary: Run a static plan and make its version current on success
      x-passage-duty: planning.run
      parameters:
        - name: planCode
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunRequest'}
      responses:
        '201':
          description: Version created and made current
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanVersion'}
        '200':
          description: 'Replay of an earlier run with the same Idempotency-Key (Idempotent-Replayed: true)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /v1/planning/plans/{planCode}/versions:
    get:
      operationId: listVersions
      summary: Plan run history, newest version first
      x-passage-duty: planning.read
      parameters:
        - name: planCode
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Versions of the plan
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PlanVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/planning/plans/{planCode}/versions/{number}:
    get:
      operationId: getVersion
      summary: Version status, counts and plan hash
      x-passage-duty: planning.read
      parameters:
        - name: planCode
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
        - name: number
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Plan version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/planning/planned-orders:
    get:
      operationId: listPlannedOrders
      summary: Planned orders of the current version of a plan
      x-passage-duty: planning.read
      parameters:
        - name: planCode
          in: query
          required: true
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string, enum: [unprocessed, approved, firmed]}
        - name: itemId
          in: query
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Planned orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PlannedOrder'}
        '400': {$ref: '#/components/responses/Problem'}
  /v1/planning/planned-orders/{id}:
    get:
      operationId: getPlannedOrder
      summary: One planned order of any version
      x-passage-duty: planning.read
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Planned order; the ETag header carries its version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlannedOrder'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updatePlannedOrder
      summary: Change quantity, dates or vendor of an open planned order of the current version, or approve it (FR-22.11)
      x-passage-duty: planning.order.maintain
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlannedOrderPatch'}
      responses:
        '200':
          description: The changed order with its new ETag
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlannedOrder'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: PLAN-ORDER-NOT-EDITABLE (firmed, deleted or not in the current version)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '412':
          description: conflict_version (If-Match is not the current version)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: PLAN-ORDER-INVALID (order date after delivery date, vendor on a non-purchase order)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '428':
          description: precondition_required (If-Match missing)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    delete:
      operationId: deletePlannedOrder
      summary: Delete an open planned order of the current version (FR-22.11)
      x-passage-duty: planning.order.maintain
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': {description: Deleted; the order no longer appears in lists}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/planning/planned-orders/{id}/pegging:
    get:
      operationId: getPegging
      summary: Explain tree from a planned order to the demand it serves
      x-passage-duty: planning.read
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: depth
          in: query
          schema: {type: integer, minimum: 1, maximum: 20, default: 5}
      responses:
        '200':
          description: Explain tree; the root's children sum to the planned quantity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pegging'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/planning/messages:
    get:
      operationId: listMessages
      summary: Action and delay messages of the current version
      x-passage-duty: planning.read
      parameters:
        - name: planCode
          in: query
          required: true
          schema: {type: string}
        - name: action
          in: query
          schema: {type: string, enum: [delay, postpone, advance, shortage]}
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Message'}
        '400': {$ref: '#/components/responses/Problem'}
  /v1/planning/forecasts/{modelCode}/lines:
    get:
      operationId: getForecastLines
      summary: Forecast cells of a model with their reduced quantities (FR-22.8)
      x-passage-duty: planning.read
      parameters:
        - $ref: '#/components/parameters/ModelCode'
        - name: itemId
          in: query
          schema: {type: string, format: uuid}
        - name: siteId
          in: query
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The model and its cells, ordered by item, site and period; the ETag header carries the model version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                type: object
                required: [model, items]
                properties:
                  model: {$ref: '#/components/schemas/ForecastModel'}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ForecastLine'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: putForecastLines
      summary: Upsert forecast cells (each replaces the cell of its item, site and period) and recompute reduction
      description: |
        Creates the model on first write (send If-Match "0"). A reductionPrinciple
        replaces the model's reduction setup and recomputes every series of the
        model; otherwise only the series of the written cells are recomputed.
      x-passage-duty: planning.forecast.maintain
      parameters:
        - $ref: '#/components/parameters/ModelCode'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForecastLinesWrite'}
      responses:
        '200':
          description: Written; the ETag header carries the new model version
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                type: object
                required: [model, updated]
                properties:
                  model: {$ref: '#/components/schemas/ForecastModel'}
                  updated: {type: integer}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
components:
  headers:
    ETag:
      description: 'Entity version as a quoted integer, e.g. "3"; send it back as If-Match'
      schema: {type: string}
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 'ETag of the version the change is based on, e.g. "3" (a new forecast model is "0")'
      schema: {type: string}
    ModelCode:
      name: modelCode
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 255}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 500}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    RunRequest:
      type: object
      required: [asOf, siteId, items]
      properties:
        asOf: {type: string, format: date, description: Day 0 of the plan}
        siteId: {type: string, format: uuid}
        forecastModel:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'
          description: 'Adds the reduced forecast of this model at the site as forecast demand (ref FC:<model>:<period start>) of the snapshot items; periods that ended before asOf are skipped. 422 PLAN-FORECAST-NOT-FOUND when the model does not exist.'
        items:
          type: array
          minItems: 1
          maxItems: 100000
          items: {$ref: '#/components/schemas/RunItem'}
    RunItem:
      type: object
      required: [itemId, coverage, orderType]
      properties:
        itemId: {type: string, format: uuid}
        coverage:
          type: object
          required: [code]
          properties:
            code: {type: string, enum: [requirement, period, minmax, manual]}
            periodDays: {type: integer, minimum: 0}
            marginDays: {type: integer, minimum: 0}
            positiveDays: {type: integer, minimum: 0}
            negativeDays: {type: integer, minimum: 0}
            reorderMin: {type: string, description: Decimal string}
            reorderMax: {type: string, description: Decimal string}
            freezeFenceDays: {type: integer, minimum: 0, maximum: 3650, description: 'BR-22.4: no planned orders for requirements inside; the uncovered rest is a shortage message. 0 freezes nothing.'}
            actionFenceDays: {type: integer, minimum: 0, maximum: 3650, description: 'BR-22.4: advance/postpone only for receipts inside. 0 is unlimited.'}
            futuresFenceDays: {type: integer, minimum: 0, maximum: 3650, description: 'BR-22.4: delay messages only for requirements inside. 0 is unlimited.'}
        onHand: {type: string, description: Decimal string}
        safetyStock: {type: string, description: Decimal string}
        orderType: {type: string, enum: [purchase, production, transfer]}
        leadTimeDays: {type: integer, minimum: 0, maximum: 3650}
        lot:
          type: object
          properties:
            minOrderQty: {type: string}
            multipleQty: {type: string}
            maxOrderQty: {type: string}
            standardQty: {type: string}
        demand: {type: array, items: {$ref: '#/components/schemas/RunRequirement'}}
        receipts: {type: array, items: {$ref: '#/components/schemas/RunRequirement'}}
        components:
          type: array
          items:
            type: object
            required: [itemId, qty]
            properties:
              itemId: {type: string, format: uuid}
              qty: {type: string}
    RunRequirement:
      type: object
      required: [ref, refType, date, qty]
      properties:
        ref: {type: string}
        refType: {type: string, enum: [sales-line, forecast, safety-stock, bom-line, transfer-issue, on-hand, purchase-line, production-order, transfer-receipt, planned-order]}
        date: {type: string, format: date}
        qty: {type: string, description: Positive decimal string}
        priority: {type: integer, description: 'Lower nets first; default sales-line 1, forecast 2, others 4'}
    PlanVersion:
      type: object
      properties:
        id: {type: string, format: uuid}
        planCode: {type: string}
        number: {type: integer}
        status: {type: string, enum: [running, complete, failed, current]}
        asOf: {type: string, format: date}
        itemsPlanned: {type: integer}
        plannedOrders: {type: integer}
        messages: {type: integer}
        durationMs: {type: integer, format: int64}
        planHash: {type: string, description: sha256 hex over orders, pegging and messages}
    PlannedOrder:
      type: object
      properties:
        id: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        number: {type: string}
        itemId: {type: string, format: uuid}
        orderType: {type: string, enum: [purchase, production, transfer]}
        qty: {type: string}
        orderDate: {type: string, format: date}
        deliveryDate: {type: string, format: date}
        futuresDate: {type: [string, 'null'], format: date}
        delayDays: {type: integer}
        lotRule: {type: string}
        status: {type: string, enum: [unprocessed, approved, firmed, deleted]}
        version: {type: integer, minimum: 1, description: Same as the ETag}
        vendorId: {type: string, format: uuid, description: Set by maintenance on purchase orders}
    PlannedOrderPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        qty: {type: string, description: Positive decimal string, at most 6 decimals}
        orderDate: {type: string, format: date}
        deliveryDate: {type: string, format: date}
        vendorId: {type: string, format: uuid, description: Planned purchase orders only}
        status: {type: string, enum: [approved], description: Approve the order; firming is a separate command}
    ForecastModel:
      type: object
      required: [code, version, reductionPrinciple, reductionPercent]
      properties:
        code: {type: string}
        version: {type: integer, minimum: 0}
        reductionPrinciple: {type: string, enum: [none, percent, transactions, transactions-dynamic]}
        reductionPercent: {type: string, description: Decimal string, used by principle percent}
    ForecastLine:
      type: object
      required: [itemId, siteId, periodStart, periodEnd, source, qty, salesQty, reducedQty]
      properties:
        itemId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        periodStart: {type: string, format: date}
        periodEnd: {type: string, format: date}
        source: {type: string, enum: [statistical, manual, consensus]}
        qty: {type: string}
        salesQty: {type: string, description: Open sales quantity of the period used by the reduction}
        reducedQty: {type: string, description: Forecast left after reduction; this is what a run nets}
    ForecastLinesWrite:
      type: object
      required: [lines]
      additionalProperties: false
      properties:
        reductionPrinciple: {type: string, enum: [none, percent, transactions, transactions-dynamic]}
        reductionPercent: {type: string, description: '0 to 100 with at most 6 decimals; only with reductionPrinciple percent'}
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [itemId, siteId, periodStart, periodEnd, qty]
            additionalProperties: false
            properties:
              itemId: {type: string, format: uuid}
              siteId: {type: string, format: uuid}
              periodStart: {type: string, format: date}
              periodEnd: {type: string, format: date}
              qty: {type: string, description: 'Decimal string, 0 or more with at most 6 decimals; 0 clears the period'}
              salesQty: {type: string, description: Decimal string, 0 or more}
              source: {type: string, enum: [manual, statistical], default: manual}
    Pegging:
      type: object
      required: [orderId, number, qty, tree]
      properties:
        orderId: {type: string, format: uuid}
        number: {type: string}
        qty: {type: string}
        tree: {$ref: '#/components/schemas/PegNode'}
    PegNode:
      type: object
      required: [ref, refType, qty, children]
      properties:
        ref: {type: string}
        refType: {type: string}
        qty: {type: string}
        children:
          type: array
          items: {$ref: '#/components/schemas/PegNode'}
    Message:
      type: object
      properties:
        action: {type: string, enum: [delay, postpone, advance, shortage]}
        itemId: {type: string, format: uuid}
        supplyRef: {type: string, description: Planned order number or receipt ref; empty for a shortage}
        demandRef: {type: string, description: Demand the message is about; empty when none}
        suggestedDate: {type: string, format: date, description: 'delay: expected date; postpone/advance: suggested receipt date; shortage: demand date'}
        delayDays: {type: integer}
        qty: {type: string}
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri, example: 'https://passage.dev/problems/PLAN-0001'}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string, example: PLAN-0001}
        serviceCode: {type: string, example: PLN-0001}
        traceId: {type: string}
        errors:
          type: object
          additionalProperties: {type: string}
