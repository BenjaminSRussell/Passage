apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: planning
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: planning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: planning
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: planning
          image: {{ include "planning.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            - name: PLANNING_MAX_VERSIONS
              value: {{ .Values.maxVersions | quote }}
            - name: PLANNING_HORIZON_DAYS
              value: {{ .Values.horizonDays | quote }}
            - name: PLANNING_MAX_CONCURRENT_RUNS
              value: {{ .Values.maxConcurrentRuns | quote }}
            - name: PLANNING_RUN_TIMEOUT_MINUTES
              value: {{ .Values.runTimeoutMinutes | quote }}
            - name: PLANNING_FEATURE_FLAGS
              value: {{ .Values.featureFlags | quote }}
            {{- if .Values.forecastUrl }}
            - name: FORECAST_URL
              value: {{ .Values.forecastUrl | quote }}
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
