image: { repository: ghcr.io/benjaminsrussell/planning, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: planning-db
migrateOnStart: false
# PLANNING_MAX_VERSIONS: plan versions a run keeps (2 to 100).
maxVersions: 20
# PLANNING_HORIZON_DAYS: demand beyond this many days is ignored by a run (30 to 1095).
horizonDays: 365
# PLANNING_MAX_CONCURRENT_RUNS: asynchronous plan runs one replica executes at once (1 to 16);
# a 50k-item run holds several GB (6.2 GiB peak for the whole test process through the async route in
# #479), so the memory limit below is 8Gi; raise it with this value.
maxConcurrentRuns: 1
# PLANNING_RUN_TIMEOUT_MINUTES: an asynchronous plan run is failed after this long (1 to 720).
runTimeoutMinutes: 60
# PLANNING_FEATURE_FLAGS: comma-separated planning.dynamic, planning.statistical-forecast,
# planning.mps-scope; an unknown name stops the service at startup.
featureFlags: ""
# FORECAST_URL: base URL of the forecast service (services/forecast-py); required while
# planning.statistical-forecast is enabled.
forecastUrl: ""
replicaCount: 2
resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { cpu: "2", memory: 8Gi }
serviceMonitor: { enabled: false }
