{{- if .Values.consumer.enabled }}
# The credit-note consumer (#29, args [consume]): reverses the revenue schedules of billing's creditnote.booked (BR-29.6). It
# starts only while service:revrec-creditnotes is seeded in the service principal table and needs no ledger: the reversal
# postings are booked by POST /v1/revrec/journal-postings. Kafka user and ACLs: deploy/kafka/revrec-consumer.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-consumer
  labels:
    app.kubernetes.io/name: revrec
    app.kubernetes.io/component: consumer
spec:
  replicas: {{ .Values.consumer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: revrec
      app.kubernetes.io/component: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: revrec
        app.kubernetes.io/component: consumer
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: kafka
          secret:
            secretName: {{ required "consumer.kafka.secret is required" .Values.consumer.kafka.secret }}
            defaultMode: 0440
      containers:
        - name: revrec-consumer
          {{- if .Values.image.digest }}
          image: "{{ (include "passage.imageRepository" $) }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ (include "passage.imageRepository" $) }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [consume]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
          env:
            {{- include "passage.cloudEnv" $ | nindent 12 }}
            - name: SERVICE_NAME
              value: revrec
            - name: ADMIN_ADDR
              value: ":{{ .Values.service.adminPort }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: KAFKA_BROKERS
              value: {{ required "consumer.kafka.brokers is required" .Values.consumer.kafka.brokers | quote }}
            - name: KAFKA_GROUP
              value: {{ .Values.consumer.kafka.group | quote }}
            - name: KAFKA_USERNAME
              value: {{ .Values.consumer.kafka.username | quote }}
            - name: KAFKA_PASSWORD_FILE
              value: /var/run/passage/kafka/password
            - name: KAFKA_TLS_CA_FILE
              value: /var/run/passage/kafka/ca.crt
            - name: PASSAGE_SERVICE_NAME
              value: revrec
          volumeMounts:
            - { name: kafka, mountPath: /var/run/passage/kafka, readOnly: true }
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.consumer.resources | nindent 12 }}
{{- end }}
