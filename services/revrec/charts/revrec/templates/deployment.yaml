apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: revrec
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: revrec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: revrec
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.serviceIdentity.signingKeySecret }}
      volumes:
        - name: service-identity
          secret:
            secretName: {{ .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
      {{- end }}
      containers:
        - name: revrec
          {{- if .Values.image.digest }}
          image: "{{ (include "passage.imageRepository" $) }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ (include "passage.imageRepository" $) }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
          env:
            {{- include "passage.cloudEnv" $ | nindent 12 }}
            - name: SERVICE_NAME
              value: revrec
            - name: HTTP_ADDR
              value: ":{{ .Values.service.port }}"
            - name: ADMIN_ADDR
              value: ":{{ .Values.service.adminPort }}"
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            # Required since slice 2: contracts, schedules and runs live in revrec-db.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: PASSAGE_SERVICE_NAME
              value: revrec
            {{- with .Values.serviceIdentity.publicKeys }}
            - name: PASSAGE_SERVICE_PUBLIC_KEYS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.ledgerUrl }}
            - name: LEDGER_URL
              value: {{ .Values.ledgerUrl | quote }}
            - name: REVREC_LEDGER_IDS
              value: {{ include "revrec.ledgerIds" . | quote }}
            {{- end }}
            {{- if .Values.serviceIdentity.signingKeySecret }}
            - name: PASSAGE_SERVICE_SIGNING_KEY_FILE
              value: /var/run/passage/service-identity/signing-key
            {{- if .Values.serviceIdentity.keyId }}
            - name: PASSAGE_SERVICE_KEY_ID
              value: {{ .Values.serviceIdentity.keyId | quote }}
            {{- end }}
          volumeMounts:
            - { name: service-identity, mountPath: /var/run/passage/service-identity, readOnly: true }
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
