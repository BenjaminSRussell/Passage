image:
  repository: ghcr.io/benjaminsrussell/revrec
  # Prefer digest pinning from Argo CD; when set it takes precedence over tag.
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
# DATABASE_URL is read from this secret, never from values.
databaseSecret: revrec-db
# Dev only: apply migrations at start. Elsewhere the migrator job applies them.
migrateOnStart: false
# Unset, the ledger postings and the GL 2400 reconciliation answer 503 REV-0200.
ledgerUrl: ""
# Legal entity id -> ledger id; required when ledgerUrl is set (rendered as REVREC_LEDGER_IDS).
ledgerIds: {}
# Billing base URL for the modification billing reporter (#29): a contract modification's price change is sent to billing's
# POST /v1/billing/contract-modifications (needs serviceIdentity.signingKeySecret). Unset, the requests wait PENDING.
billingUrl: ""
# How often the reporter sends due requests (REVREC_BILLING_INTERVAL).
billingInterval: 30s
serviceIdentity:
  signingKeySecret: ""
  keyId: ""
  publicKeys: ""
replicaCount: 2
# The credit-note consumer (#29, args [consume]): reverses the revenue schedules of
# billing's creditnote.booked (BR-29.6) so the roll-forward keeps tying to GL 2400.
# It exits at start unless service:revrec-creditnotes is seeded in the service
# principal table. Its KafkaUser, ACLs and dead-letter topic are
# deploy/kafka/revrec-consumer.yaml; off by default, like the other consumers in
# dev, until it is turned on per environment (billing's outbox connector, which
# creates passage.billing.invoice, is not deployed yet).
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: revrec-creditnotes
    username: revrec-consumer
    dlqTopic: passage.revrec.creditnotes.dlq
    secret: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
service:
  port: 8080
  adminPort: 9090
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor:
  enabled: false
  interval: 30s
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
