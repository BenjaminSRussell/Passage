image:
  repository: ghcr.io/benjaminsrussell/revrec
  # Prefer digest pinning from Argo CD; when set it takes precedence over tag.
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
# Slice 1 is stateless; the secret is wired (optional) so the revrec store can land without a chart change.
databaseSecret: revrec-db
replicaCount: 2
service:
  port: 8080
  adminPort: 9090
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor:
  enabled: false
  interval: 30s
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
