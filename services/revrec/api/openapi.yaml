openapi: 3.1.0
info:
  title: Passage Revenue Recognition API
  version: 0.2.0
  description: >
    ASC 606 / IFRS 15 revenue recognition (PSG-29, slices 1 and 2): the
    stateless allocation preview, persisted revenue contracts with SSP
    allocation and schedules, milestone satisfaction, period recognition runs
    and the deferred revenue roll-forward. Duties are enforced with
    platform/authz: 401 AUTH-0001 without a principal, 403 AUTH-0003 without
    the duty or outside the caller's legal-entity scope.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/revrec/allocations:preview:
    post:
      operationId: previewAllocation
      summary: Allocate a transaction price across performance obligations by SSP and return ratable schedules.
      x-passage-duty: revrec.view (RevRecView)
      description: >
        Pure computation: nothing is stored and no event is emitted. Allocation
        follows BR-29.1 (proportional to SSP, residual to the rule's obligation)
        and BR-29.3 (2-decimal shares, last ratable period absorbs the residual).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
      responses:
        "200":
          description: Allocation per obligation; ratable obligations carry their schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/revrec/contracts:
    post:
      operationId: createContract
      summary: Create a revenue contract, allocate its transaction price by SSP and plan its schedules (FR-29.7, FR-29.8).
      x-passage-duty: revrec.maintain (RevRecMaintain)
      description: >
        POINT_IN_TIME obligations are recognized at their transfer date
        (satisfiedOn) because the invoice credits that revenue directly;
        MILESTONE obligations wait for :satisfy; RATABLE obligations get one
        line per calendar month of the term, dated at the period end; USAGE
        obligations have no line until usage posts. Emits
        dev.passage.revrec.contract.allocated.v1. A contract with nothing left
        to recognize is COMPLETE at once. BIL-0009 warns for a RESIDUAL SSP.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractRequest"
      responses:
        "201":
          description: Contract created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "200":
          description: Idempotent replay (same key and body); header Idempotent-Replayed is true.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listContracts
      summary: Revenue contracts inquiry (§5.29.14), newest first, with recognized and remaining amounts.
      x-passage-duty: revrec.view (RevRecView)
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: orderId, in: query, description: "The contracts of one sales order; billing reads the allocation of the order it invoices.", schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, COMPLETE, CANCELLED] } }
        - { name: method, in: query, description: "Contracts with at least one obligation of this recognition method.", schema: { type: string, enum: [POINT_IN_TIME, RATABLE, MILESTONE, USAGE] } }
        - { name: cursor, in: query, description: "The nextCursor of the previous page (opaque).", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: At most `limit` contract headers; nextCursor is present when more follow.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ContractSummary" }
                  nextCursor: { type: string, description: "Pass as cursor for the next page; absent on the last page." }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/revrec/contracts/{id}:
    get:
      operationId: getContract
      summary: A revenue contract with its obligations and schedule lines.
      x-passage-duty: revrec.view (RevRecView)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The contract.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/revrec/contracts/{id}:allocate:
    post:
      operationId: allocateContract
      summary: Modify a contract by adding obligations for products first invoiced after it was opened.
      x-passage-duty: revrec.maintain (RevRecMaintain)
      description: >
        The added goods or services are accounted for as a separate contract (ASC 606-10-25-12): `transactionPriceIncrease`
        is allocated over the new obligations only, the contract's transaction price grows by it, and the obligations and
        schedules already there keep their allocation. A completed contract is reopened when a new obligation has
        recognition left. The new lines are numbered after the last. REV-0105 (409) when the contract already has an
        obligation for a product, REV-0104 (409) for a cancelled contract. If-Match, when sent, must carry the contract
        version the caller reviewed. Emits dev.passage.revrec.contract.allocated.v1 again with every obligation.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: false, schema: { type: string }, description: 'Contract version as an entity tag, e.g. "1".' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllocateRequest" }
      responses:
        "200":
          description: The modified contract.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/revrec/contracts/{id}:modify:
    post:
      operationId: modifyContract
      summary: Re-allocate a contract's existing obligations after a price change or an SSP revision (prospective or cumulative catch-up).
      x-passage-duty: revrec.maintain (RevRecMaintain)
      description: >
        ASC 606-10-25-10 to 25-13 and IFRS 15.20 to 15.21. `PROSPECTIVE` (the remaining goods are distinct): the consideration
        still to recognize, the new transaction price less what is already recognized or booked by the invoice, is allocated over
        the obligations with performance left by their SSP weighted by the share left, and spread over their unrecognized lines;
        recognized revenue is untouched. `CATCH_UP` (the remaining goods are not distinct): the whole new price is allocated again
        over the obligations (point in time and usage obligations keep their amount) and each obligation recognizes the cumulative
        catch-up so that its revenue to date equals its new allocation times its progress at `effectiveDate`; a satisfied milestone's
        catch-up is recognized at once, a ratable one is a line dated on the effective date that the next recognition run takes.
        `obligations` revises the SSP of the named obligations at the modification date and reduces (`remainingScope` between 0 and 1)
        or removes (`remainingScope` 0) their remaining performance. A negative cumulative catch-up takes recognized revenue back out at
        the effective date, and a prospective price below what is recognized is a price concession on transferred performance (IFRS
        15.88, ASC 606-10-32-43) taken out of revenue in proportion to the recognized revenue; both are `reversal`s posted Dr 4000 / Cr
        2400 by the journal postings. Only a price below what point-in-time and usage obligations were billed at is 422 REV-0402 (a
        credit note); a prospective change with nothing left is 422 REV-0404; a date before the contract date is 422 REV-0401. A
        contract that credit notes touched is modified on its amounts net of them (REV-0405 is no longer returned). A price change is
        queued for billing (`billingStatus` PENDING), which invoices the products whose allocation rose and credits those whose
        allocation fell. Each modification stores each
        obligation's allocation change on its effective date, and the roll-forward adds it in that period. Adding goods or services is
        `:allocate`. If-Match is required and must carry the contract version the caller reviewed. Emits
        dev.passage.revrec.contract.allocated.v1 again, and schedule.recognized for a milestone catch-up.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string }, description: 'Contract version as an entity tag, e.g. "1". Required (428 without it): the price change is relative, so a repeat of the same call finds the version moved on and is refused with 412 instead of applying twice.' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModifyRequest" }
      responses:
        "200":
          description: The re-allocated contract with the outcome of the modification.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModifyResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/revrec/modifications/{id}:retry-billing:
    post:
      operationId: retryModificationBilling
      summary: Put a parked billing request of a contract modification back in the queue.
      x-passage-duty: revrec.post (RevRecPost)
      description: >
        `id` is the modification id. A PARKED request goes back to PENDING with its attempts reset and the same body and key; the
        reporter (BILLING_URL) sends it on its next run. A PENDING or BILLED request is returned as it is.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The billing request.
          content:
            application/json:
              schema:
                type: object
                required: [id, modificationId, status, attempts]
                properties:
                  id: { type: string, format: uuid }
                  modificationId: { type: string, format: uuid }
                  status: { type: string, enum: [PENDING, BILLED, PARKED] }
                  attempts: { type: integer }
                  lastError: { type: string }
                  billedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/revrec/milestones/{id}:satisfy:
    post:
      operationId: satisfyMilestone
      summary: Satisfy a MILESTONE obligation and recognize its revenue (Dr 2400 / Cr 4000).
      x-passage-duty: revrec.maintain (RevRecMaintain)
      description: >
        `id` is the obligation id. Emits dev.passage.revrec.schedule.recognized.v1
        and bumps the contract version. A retry with the same date returns the
        recorded satisfaction (Idempotent-Replayed: true) and changes nothing,
        so no Idempotency-Key is needed. If-Match, when sent, must carry the
        contract version the caller reviewed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: false, schema: { type: string }, description: 'Contract version as an entity tag, e.g. "1".' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [satisfiedOn]
              additionalProperties: false
              properties:
                satisfiedOn: { type: string, format: date, description: "On or after the contract date." }
      responses:
        "200":
          description: Satisfied (or replayed).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Satisfaction" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/revrec/recognition-templates:
    get:
      operationId: listRecognitionTemplates
      summary: List how products are recognized when a contract is opened from a posted invoice (29-4).
      x-passage-duty: revrec.view (RevRecView)
      responses:
        "200":
          description: Templates by product.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RecognitionTemplate" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/revrec/recognition-templates/{id}:
    put:
      operationId: putRecognitionTemplate
      summary: Set how a product is recognized when a contract is opened from a posted invoice (29-4).
      x-passage-duty: revrec.maintain (RevRecMaintain)
      description: >
        `id` is the product id. The revrec invoice consumer opens one contract per invoiced order with one
        obligation per product, its invoiced net as the SSP. A RATABLE template spreads the obligation over
        `termMonths` from the invoice posting date; a product with no template, or POINT_IN_TIME, is recognized
        at the posting date; MILESTONE waits for `:satisfy`; USAGE has no schedule until usage posts and keeps the
        contract open. An invoice of an order that already has a contract changes nothing already there: a product
        the contract has no obligation for yet is added to it at its invoiced net (a separate contract in the sense
        of ASC 606-10-25-12, see `:allocate`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              additionalProperties: false
              properties:
                method: { type: string, enum: [POINT_IN_TIME, RATABLE, MILESTONE, USAGE] }
                termMonths: { type: integer, minimum: 1, maximum: 120, description: "Required for RATABLE, absent for the other methods." }
      responses:
        "200":
          description: Stored template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecognitionTemplate" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/revrec/recognition-runs:
    post:
      operationId: runRecognition
      summary: Recognize every due RATABLE schedule line of a legal entity through a period end (FR-29.8).
      x-passage-duty: revrec.post (RevRecPost)
      description: >
        Key = (legal entity, period end): the first call creates the run (201)
        and emits one dev.passage.revrec.schedule.recognized.v1 per line; a
        rerun returns the recorded run (200, Idempotent-Replayed) and recognizes
        nothing twice. Lines are recognized on the period end. A period end
        after today is refused (REV-0007).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, periodEnd]
              additionalProperties: false
              properties:
                legalEntityId: { type: string, format: uuid }
                periodEnd: { type: string, format: date }
      responses:
        "201":
          description: Run created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecognitionRun" }
        "200":
          description: The run already recorded for this entity and period end.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecognitionRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listRecognitionRuns
      summary: Recognition runs, latest period first.
      x-passage-duty: revrec.view (RevRecView)
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: At most `limit` runs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RecognitionRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/revrec/roll-forward:
    get:
      operationId: getRollForward
      summary: Deferred revenue roll-forward of one legal entity and currency, or of one contract, for a calendar month (FR-29.9).
      x-passage-duty: revrec.view (RevRecView)
      description: >
        Opening + additions − recognized + reversed + adjustments = closing.
        Additions are the RATABLE and MILESTONE allocations of contracts dated in
        the month; recognized are their lines recognized in it. Adjustments are
        the credit notes posted in the month (negative): the deferred part billing
        debited to 2400 for the credited lines, which the credit-note consumer
        took off the unrecognized schedule first; reversed is the recognized
        revenue those credit notes reversed back through 2400 because they exceeded
        what was still unrecognized (BR-29.6). The tie to GL 2400 is
        GET /v1/revrec/gl-reconciliation. Send legalEntityId and currency for
        the entity roll-forward, or contractId alone for the drill-down to one
        contract, stated in the contract's currency (404 REV-0100 when the
        contract is unknown or outside the caller's scope). The contracts of an
        entity's roll-forward sum to it.
      parameters:
        - { name: legalEntityId, in: query, description: "Required without contractId.", schema: { type: string, format: uuid } }
        - { name: currency, in: query, description: "Required without contractId.", schema: { type: string, pattern: "^[A-Z]{3}$" } }
        - { name: contractId, in: query, description: "The drill-down to one contract; excludes legalEntityId and currency.", schema: { type: string, format: uuid } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }, description: "YYYY-MM" }
      responses:
        "200":
          description: The month's movement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RollForward" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/revrec/journal-postings:
    post:
      operationId: postJournal
      summary: Post recognized revenue to the general ledger as Dr 2400 contract liability / Cr 4000 revenue (§5.29.9).
      x-passage-duty: revrec.post (RevRecPost)
      description: >
        Claims every recognized, not yet posted RATABLE and MILESTONE line
        recognized on or before `through` (default the last completed month end) and posts one ledger
        entry per currency and month of recognition, dated the month end, through
        the ledger's journal API with the service token. A posting the ledger
        did not answer stays pending and is retried by the next call with the
        same ledger idempotency key, so no amount posts twice. A posting the
        ledger refuses for good (a 4xx such as a closed period) is marked
        rejected, its lines are released and it is listed under `rejected`; it
        does not block the entity's other postings, and its lines are offered
        again only when the request sets `retryRejected`. The ledger comes from the
        service configuration (REVREC_LEDGER_IDS), never from the request, and is
        pinned to the legal entity before anything is posted (the ledger's own
        record of its entity; 422 REV-0203 when it belongs to another entity).
        The same call books the recognized revenue that credit notes reversed
        (`reversals`): one entry per credit-note line, Dr 4000 / Cr 2400 for the
        stored reversed amount, dated the credit note's posting date and keyed
        `revrec-reversal-<id>`. A reversal the ledger refuses is backed off
        (5 minutes, doubling, at most a day) and parked after 5 refusals
        (`failedReversals`, `parked`); `retryRejected` offers parked reversals
        again; a reversal pinned to another ledger is listed under
        `otherLedgerReversals`. 503 REV-0200 when LEDGER_URL is not set; 422
        REV-0202 when the legal entity has no configured ledger; 502 REV-0201
        when the ledger does not answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalPostingRequest" }
      responses:
        "200":
          description: The entries posted by this call; empty when nothing was waiting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalPostings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/revrec/gl-reconciliation:
    get:
      operationId: getGLReconciliation
      summary: Reconcile the revenue recognized and the deferred revenue balance through a month with GL 2400 (§5.29.9).
      x-passage-duty: revrec.view (RevRecView)
      description: >
        Compares the cumulative revenue recognized by the roll-forward through
        the month end with the ledger's 2400 debit total through the same
        period (`difference`: recognized revenue the ledger does not hold yet), and
        the roll-forward's closing deferred balance (the allocated deferred amounts
        less revenue recognized) with the ledger's closing 2400 balance, credits less
        debits (`closingDifference`). A deferral booked off the allocation shows as a
        closing difference. The roll-forward adds a contract on its `contractDate`, the
        ledger credits 2400 on the invoice's posting date, so an invoice posted in a later
        month than its contract date shows a timing difference until it posts.
        Credit notes: 2400 is also debited by billing's credit notes for their
        deferred part, which the roll-forward carries as negative adjustments once
        the credit-note consumer has reversed them (`creditNotes`, cumulative), so
        `difference` compares the ledger's debits with recognized plus
        `creditNotes`; recognized revenue the credit notes reversed (`reversed`)
        is a credit to 2400 that revrec posts, and shows as a closing difference
        until it is posted. `reconciled` needs both differences to be zero.
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: currency, in: query, required: true, schema: { type: string, pattern: "^[A-Z]{3}$" } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }, description: "YYYY-MM" }
      responses:
        "200":
          description: Both sides and their difference.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GLReconciliation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
  headers:
    ETag:
      description: The contract version as a strong entity tag, e.g. "1".
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem document.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    RecognitionTemplate:
      type: object
      required: [productId, method, updatedAt]
      properties:
        productId: { type: string, format: uuid }
        method: { type: string, enum: [POINT_IN_TIME, RATABLE, MILESTONE, USAGE] }
        termMonths: { type: integer }
        updatedAt: { type: string, format: date-time }
    PreviewRequest:
      type: object
      required: [currency, transactionPrice, obligations]
      additionalProperties: false
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        transactionPrice: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$" }
        residualRule: { type: string, enum: [LARGEST, FIRST, LAST], default: LARGEST }
        ratableBasis: { type: string, enum: [DAILY, MONTHLY], default: DAILY, description: "§5.29.13 ratable_basis. DAILY weighs each month by the days the term covers; MONTHLY gives every month the term touches an equal share. The residual is on the last line." }
        obligations:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/Obligation"
    Obligation:
      type: object
      required: [id, sspSource, method]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 64, description: "Unique within the request." }
        ssp: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$", description: "Positive standalone selling price; required unless sspSource is RESIDUAL. A RESIDUAL obligation's ssp is derived (the transaction price less the other SSPs), so it may be omitted; one that is sent must still match the pattern and is ignored." }
        sspSource: { type: string, enum: [EXPLICIT, LIST, PCT_OF_LIST, RESIDUAL], description: "At most one RESIDUAL (REV-0003); its derived ssp must be positive (REV-0008)." }
        method: { type: string, enum: [POINT_IN_TIME, RATABLE, MILESTONE, USAGE] }
        termStart: { type: string, format: date, description: "Required for RATABLE." }
        termEnd: { type: string, format: date, description: "Required for RATABLE; on or after termStart." }
      if: { properties: { sspSource: { not: { const: RESIDUAL } } } }
      then: { required: [ssp] }
    PreviewResponse:
      type: object
      required: [currency, transactionPrice, residualRule, ratableBasis, obligations]
      properties:
        currency: { type: string }
        transactionPrice: { type: string }
        residualRule: { type: string }
        ratableBasis: { type: string, enum: [DAILY, MONTHLY] }
        obligations:
          type: array
          items:
            $ref: "#/components/schemas/AllocatedObligation"
    AllocatedObligation:
      type: object
      required: [id, ssp, sspSource, method, allocated]
      properties:
        id: { type: string }
        ssp: { type: string, description: "At the currency's minor unit, or with every fraction digit beyond it (up to 6); for RESIDUAL the derived SSP." }
        sspSource: { type: string }
        method: { type: string }
        allocated: { type: string }
        schedule:
          type: array
          items:
            type: object
            required: [start, end, amount]
            properties:
              start: { type: string, format: date }
              end: { type: string, format: date }
              amount: { type: string }
    ContractRequest:
      type: object
      required: [legalEntityId, orderId, customerId, currency, transactionPrice, contractDate, obligations]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        transactionPrice: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$" }
        residualRule: { type: string, enum: [LARGEST, FIRST, LAST], default: LARGEST }
        ratableBasis: { type: string, enum: [DAILY, MONTHLY], default: DAILY, description: "§5.29.13 ratable_basis. DAILY weighs each month by the days the term covers; MONTHLY gives every month the term touches an equal share. The residual is on the last line." }
        contractDate: { type: string, format: date, description: "The invoice date that opens the deferral." }
        obligations:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [productId, sspSource, method]
            additionalProperties: false
            if: { properties: { sspSource: { not: { const: RESIDUAL } } } }
            then: { required: [ssp] }
            properties:
              productId: { type: string, format: uuid, description: "May repeat across lines." }
              ssp: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$", description: "Positive standalone selling price; required unless sspSource is RESIDUAL, whose ssp is derived and may be omitted (one that is sent must still match the pattern and is ignored)." }
              sspSource: { type: string, enum: [EXPLICIT, LIST, PCT_OF_LIST, RESIDUAL], description: "At most one RESIDUAL per contract (REV-0003); its ssp is derived as the transaction price less the other SSPs and is refused when not positive (REV-0008)." }
              method: { type: string, enum: [POINT_IN_TIME, RATABLE, MILESTONE, USAGE] }
              termStart: { type: string, format: date, description: "Required for RATABLE." }
              termEnd: { type: string, format: date, description: "Required for RATABLE; on or after termStart." }
              satisfiedOn: { type: string, format: date, description: "Required for POINT_IN_TIME (the transfer date); refused for other methods." }
    AllocateRequest:
      type: object
      required: [transactionPriceIncrease, obligations]
      additionalProperties: false
      properties:
        transactionPriceIncrease: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$", description: "The price of the added obligations, allocated over them." }
        obligations: { $ref: "#/components/schemas/ContractRequest/properties/obligations" }
    ModifyRequest:
      type: object
      required: [type, effectiveDate, transactionPriceChange]
      additionalProperties: false
      properties:
        type: { type: string, enum: [PROSPECTIVE, CATCH_UP] }
        effectiveDate: { type: string, format: date }
        transactionPriceChange: { type: string, pattern: "^-?[0-9]{1,14}(\\.[0-9]{1,6})?$", description: "Signed change of the transaction price; 0 when only SSPs are revised." }
        obligations:
          type: array
          description: Obligations whose standalone selling price is revised, or whose remaining performance is reduced or removed, at the modification date; each needs ssp, remainingScope or both.
          items:
            type: object
            required: [obligationId]
            additionalProperties: false
            properties:
              obligationId: { type: string, format: uuid }
              ssp: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$" }
              remainingScope: { type: string, pattern: "^(0(\\.[0-9]{1,6})?|1(\\.0{1,6})?)$", description: "Share of the remaining, not yet transferred performance still promised: 0 removes the obligation, 1 leaves it unchanged. Without ssp the SSP scales to what stays promised." }
        reason: { type: string, maxLength: 500 }
    ModifyResponse:
      allOf:
        - { $ref: "#/components/schemas/Contract" }
        - type: object
          required: [modification]
          properties:
            modification:
              type: object
              required: [id, type, effectiveDate, priceBefore, priceAfter, catchUp, obligations]
              properties:
                id: { type: string, format: uuid }
                type: { type: string, enum: [PROSPECTIVE, CATCH_UP] }
                effectiveDate: { type: string, format: date }
                priceBefore: { type: string }
                priceAfter: { type: string }
                catchUp: { type: string, description: Total cumulative catch-up revenue recognized on the effective date. }
                reversal: { type: string, description: Recognized revenue taken back out on the effective date (Dr 4000 / Cr 2400). }
                billingStatus: { type: string, enum: [PENDING, NONE], description: PENDING when the price change was queued for billing. }
                obligations:
                  type: array
                  items:
                    type: object
                    required: [obligationId, allocatedBefore, allocatedAfter, sspBefore, sspAfter, catchUp]
                    properties:
                      obligationId: { type: string, format: uuid }
                      allocatedBefore: { type: string }
                      allocatedAfter: { type: string }
                      sspBefore: { type: string }
                      sspAfter: { type: string }
                      progress: { type: string, description: Share transferred at the effective date (CATCH_UP only). }
                      catchUp: { type: string }
                      reversal: { type: string }
                      removed: { type: boolean }
    ContractSummary:
      type: object
      required: [id, legalEntityId, orderId, customerId, currency, transactionPrice, recognized, remaining, residualRule, ratableBasis, contractDate, status, version]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        currency: { type: string }
        transactionPrice: { type: string }
        recognized: { type: string, description: "Revenue recognized so far, every method." }
        remaining: { type: string, description: "transactionPrice − recognized." }
        residualRule: { type: string, enum: [LARGEST, FIRST, LAST] }
        ratableBasis: { type: string, enum: [DAILY, MONTHLY] }
        contractDate: { type: string, format: date }
        status: { type: string, enum: [OPEN, COMPLETE, CANCELLED] }
        version: { type: integer }
    Contract:
      allOf:
        - $ref: "#/components/schemas/ContractSummary"
        - type: object
          required: [obligations, warnings]
          properties:
            obligations:
              type: array
              items: { $ref: "#/components/schemas/ContractObligation" }
            warnings:
              type: array
              items:
                type: object
                required: [code, detail]
                properties:
                  code: { type: string, description: "BIL-0009 when an obligation uses the RESIDUAL SSP source." }
                  detail: { type: string }
    ContractObligation:
      type: object
      required: [id, lineNo, productId, ssp, sspSource, allocated, recognized, method, schedule]
      properties:
        id: { type: string, format: uuid }
        lineNo: { type: integer }
        productId: { type: string, format: uuid }
        ssp: { type: string, description: "At the currency's minor unit, or with every fraction digit beyond it (up to 6); for RESIDUAL the derived SSP." }
        sspSource: { type: string, enum: [EXPLICIT, LIST, PCT_OF_LIST, RESIDUAL] }
        allocated: { type: string }
        recognized: { type: string }
        method: { type: string, enum: [POINT_IN_TIME, RATABLE, MILESTONE, USAGE] }
        termStart: { type: string, format: date }
        termEnd: { type: string, format: date }
        satisfiedOn: { type: string, format: date }
        schedule:
          type: array
          items:
            type: object
            required: [id, seq, amount, status]
            properties:
              id: { type: string, format: uuid }
              seq: { type: integer }
              date: { type: string, format: date, description: "Absent for a milestone awaiting satisfaction." }
              amount: { type: string }
              status: { type: string, enum: [SCHEDULED, RECOGNIZED, REVERSED] }
              recognizedOn: { type: string, format: date }
    Satisfaction:
      type: object
      required: [contractId, contractVersion, obligationId, scheduleId, amount, recognizedOn]
      properties:
        contractId: { type: string, format: uuid }
        contractVersion: { type: integer }
        obligationId: { type: string, format: uuid }
        scheduleId: { type: string, format: uuid }
        amount: { type: string }
        recognizedOn: { type: string, format: date }
    RecognitionRun:
      type: object
      required: [id, legalEntityId, periodEnd, lineCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        periodEnd: { type: string, format: date }
        lineCount: { type: integer, description: "Schedule lines recognized by this run." }
        createdAt: { type: string, format: date-time }
    RollForward:
      type: object
      required: [legalEntityId, currency, period, start, end, opening, additions, recognized, reversed, adjustments, closing]
      properties:
        legalEntityId: { type: string, format: uuid }
        contractId: { type: string, format: uuid, description: "Present on the drill-down to one contract." }
        currency: { type: string }
        period: { type: string }
        start: { type: string, format: date }
        end: { type: string, format: date }
        opening: { type: string }
        additions: { type: string }
        recognized: { type: string }
        reversed: { type: string, description: "Recognized revenue reversed by credit notes in the period (positive)." }
        adjustments: { type: string, description: "Deferred revenue reduced by credit notes in the period (negative)." }
        closing: { type: string }
    JournalPostingRequest:
      type: object
      required: [legalEntityId]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        through: { type: string, format: date, description: "Last recognition date to post; default and upper bound the last completed month end." }
        retryRejected: { type: boolean, description: "Offer the lines of ledger-rejected postings and the parked reversal postings again; by default they are skipped." }
    JournalPostings:
      type: object
      required: [through, items, rejected, otherLedger, reversals, failedReversals, otherLedgerReversals]
      properties:
        reversals:
          type: array
          description: Reversal postings (Dr 4000 / Cr 2400) the ledger accepted in this call.
          items: { $ref: "#/components/schemas/ReversalPosting" }
        failedReversals:
          type: array
          description: Reversal postings the ledger refused in this call, backed off; `parked` once the refusal limit is reached.
          items: { $ref: "#/components/schemas/ReversalPosting" }
        otherLedgerReversals:
          type: array
          description: Reversals pinned to a ledger other than the configured one; reported, never re-targeted.
          items: { $ref: "#/components/schemas/ReversalPosting" }
        through: { type: string, format: date, description: "The last recognition date posted: the requested date clamped to the last completed month end." }
        otherLedger:
          type: array
          description: Pending postings on a ledger other than the configured one; reported, never re-targeted.
          items:
            type: object
            required: [id, ledgerId, currency, postingDate, amount]
            properties:
              id: { type: string, format: uuid }
              ledgerId: { type: string, format: uuid }
              currency: { type: string }
              postingDate: { type: string, format: date }
              amount: { type: string }
        rejected:
          type: array
          items:
            type: object
            required: [id, currency, postingDate, amount, ledgerCode]
            properties:
              id: { type: string, format: uuid }
              currency: { type: string }
              postingDate: { type: string, format: date }
              amount: { type: string }
              ledgerCode: { type: string }
        items:
          type: array
          items:
            type: object
            required: [id, currency, postingDate, amount, lineCount, journalEntryId]
            properties:
              id: { type: string, format: uuid }
              currency: { type: string }
              postingDate: { type: string, format: date }
              amount: { type: string }
              lineCount: { type: integer }
              journalEntryId: { type: string }
    ReversalPosting:
      type: object
      required: [id, contractId, creditNoteId, creditNoteNumber, currency, postingDate, amount]
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        creditNoteId: { type: string, format: uuid }
        creditNoteNumber: { type: string }
        modificationId: { type: string, format: uuid, description: "Set (credit note fields empty) for revenue a contract modification took back." }
        currency: { type: string }
        postingDate: { type: string, format: date, description: "The credit note's posting date." }
        amount: { type: string, description: "Recognized revenue reversed, from the stored reversal." }
        journalEntryId: { type: string }
        ledgerCode: { type: string }
        parked: { type: boolean }
        ledgerId: { type: string, format: uuid }
    GLReconciliation:
      type: object
      required: [legalEntityId, ledgerId, currency, period, account, recognized, creditNotes, reversed, glDebit, difference, deferred, glCredit, glClosing, closingDifference, reconciled]
      properties:
        legalEntityId: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        currency: { type: string }
        period: { type: string }
        account: { type: string }
        recognized: { type: string }
        creditNotes: { type: string, description: "Cumulative deferred amounts of the credit notes revrec reversed (billing's debits to 2400)." }
        modificationCredits: { type: string, description: "Cumulative price decreases of contract modifications, which billing credits and debits to 2400." }
        reversed: { type: string, description: "Cumulative recognized revenue reversed by credit notes (revrec's credits to 2400)." }
        glDebit: { type: string }
        difference: { type: string }
        deferred: { type: string }
        glCredit: { type: string }
        glClosing: { type: string }
        closingDifference: { type: string }
        reconciled: { type: boolean }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, description: "https://passage.dev/problems/<code>" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
