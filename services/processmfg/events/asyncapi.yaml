asyncapi: 3.0.0
info:
  title: Passage Process Manufacturing events
  version: 0.7.0
  description: >
    CloudEvents 1.0 published through the transactional outbox (Debezium
    outbox router), each in the same transaction as the change it reports.
    Event types follow dev.passage.<context>.<entity>.<verb>.v<n>; the context
    is production, as in PRD 4.24.5, and the entity drops the PRD hyphen
    (batch-order → batchorder) because the kernel rule allows none. Payloads
    match internal/events/events.go. The PRD's batch.attributes-recorded is
    batch.attributesrecorded for the same reason.
defaultContentType: application/cloudevents+json
channels:
  formula:
    address: passage.production.formula
    messages:
      formulaCreated:
        $ref: '#/components/messages/FormulaCreated'
  batchOrder:
    address: passage.production.batchorder
    messages:
      batchOrderCreated:
        $ref: '#/components/messages/BatchOrderCreated'
      batchOrderRescaled:
        $ref: '#/components/messages/BatchOrderRescaled'
      batchOrderStateChanged:
        $ref: '#/components/messages/BatchOrderStateChanged'
  coProduct:
    address: passage.production.coproduct
    messages:
      coProductAllocated:
        $ref: '#/components/messages/CoProductAllocated'
  batchAttribute:
    address: passage.production.batchattribute
    messages:
      batchAttributeDefined:
        $ref: '#/components/messages/BatchAttributeDefined'
  batch:
    address: passage.production.batch
    messages:
      batchRegistered:
        $ref: '#/components/messages/BatchRegistered'
      batchAttributesRecorded:
        $ref: '#/components/messages/BatchAttributesRecorded'
      batchDispositionChanged:
        $ref: '#/components/messages/BatchDispositionChanged'
      batchMerged:
        $ref: '#/components/messages/BatchMerged'
      batchDerived:
        $ref: '#/components/messages/BatchDerived'
  inheritanceRule:
    address: passage.production.inheritancerule
    messages:
      inheritanceRuleDefined:
        $ref: '#/components/messages/InheritanceRuleDefined'
      inheritanceRuleRetired:
        $ref: '#/components/messages/InheritanceRuleRetired'
  batchRequirement:
    address: passage.production.batchrequirement
    messages:
      batchRequirementDefined:
        $ref: '#/components/messages/BatchRequirementDefined'
      batchRequirementRetired:
        $ref: '#/components/messages/BatchRequirementRetired'
  batchRecordProfile:
    address: passage.production.batchrecordprofile
    messages:
      batchRecordProfileDefined:
        $ref: '#/components/messages/BatchRecordProfileDefined'
      batchRecordProfileRetired:
        $ref: '#/components/messages/BatchRecordProfileRetired'
  batchRecord:
    address: passage.production.batchrecord
    messages:
      batchRecordCompiled:
        $ref: '#/components/messages/BatchRecordCompiled'
      batchRecordExceptionRaised:
        $ref: '#/components/messages/BatchRecordExceptionRaised'
      batchRecordExceptionDispositioned:
        $ref: '#/components/messages/BatchRecordExceptionDispositioned'
      batchRecordApproved:
        $ref: '#/components/messages/BatchRecordApproved'
      batchRecordSealed:
        $ref: '#/components/messages/BatchRecordSealed'
operations:
  publishFormulaCreated:
    action: send
    channel: { $ref: '#/channels/formula' }
    messages: [{ $ref: '#/channels/formula/messages/formulaCreated' }]
    summary: A formula was created (engineering, planning consume it)
  publishBatchOrderCreated:
    action: send
    channel: { $ref: '#/channels/batchOrder' }
    messages: [{ $ref: '#/channels/batchOrder/messages/batchOrderCreated' }]
    summary: A batch order was created from a formula snapshot (planning, analytics consume it)
  publishBatchOrderRescaled:
    action: send
    channel: { $ref: '#/channels/batchOrder' }
    messages: [{ $ref: '#/channels/batchOrder/messages/batchOrderRescaled' }]
    summary: A batch order's size changed before it started (planning, scheduling consume it)
  publishBatchOrderStateChanged:
    action: send
    channel: { $ref: '#/channels/batchOrder' }
    messages: [{ $ref: '#/channels/batchOrder/messages/batchOrderStateChanged' }]
    summary: A batch order was released, started, reported as finished or ended (planning, costing, analytics consume it)
  publishCoProductAllocated:
    action: send
    channel: { $ref: '#/channels/coProduct' }
    messages: [{ $ref: '#/channels/coProduct/messages/coProductAllocated' }]
    summary: The batch cost of an ended order was split over its main item, co-products and by-product burdens (the ledger posts from it)
  publishBatchAttributeDefined:
    action: send
    channel: { $ref: '#/channels/batchAttribute' }
    messages: [{ $ref: '#/channels/batchAttribute/messages/batchAttributeDefined' }]
    summary: An item got a batch attribute definition (quality, inventory consume it)
  publishBatchRegistered:
    action: send
    channel: { $ref: '#/channels/batch' }
    messages: [{ $ref: '#/channels/batch/messages/batchRegistered' }]
    summary: A batch got its quality record (inventory, traceability consume it)
  publishBatchAttributesRecorded:
    action: send
    channel: { $ref: '#/channels/batch' }
    messages: [{ $ref: '#/channels/batch/messages/batchAttributesRecorded' }]
    summary: Attribute values were recorded on a batch; failures count the values outside their limits (quality raises exceptions from it)
  publishBatchDispositionChanged:
    action: send
    channel: { $ref: '#/channels/batch' }
    messages: [{ $ref: '#/channels/batch/messages/batchDispositionChanged' }]
    summary: A batch moved to another disposition; picking, reservation and shipping honour it
  publishBatchMerged:
    action: send
    channel: { $ref: '#/channels/batch' }
    messages: [{ $ref: '#/channels/batch/messages/batchMerged' }]
    summary: Stored batches were merged into a new batch with weighted attributes and cost; inventory posts the transfers from the parents
  publishBatchDerived:
    action: send
    channel: { $ref: '#/channels/batch' }
    messages: [{ $ref: '#/channels/batch/messages/batchDerived' }]
    summary: A batch got attribute values derived from its sender batches by the inheritance rules (quality, traceability consume it)
  publishInheritanceRuleDefined:
    action: send
    channel: { $ref: '#/channels/inheritanceRule' }
    messages: [{ $ref: '#/channels/inheritanceRule/messages/inheritanceRuleDefined' }]
    summary: An attribute inheritance rule was defined for an item
  publishInheritanceRuleRetired:
    action: send
    channel: { $ref: '#/channels/inheritanceRule' }
    messages: [{ $ref: '#/channels/inheritanceRule/messages/inheritanceRuleRetired' }]
    summary: An attribute inheritance rule was retired and no longer applies
  publishBatchRequirementDefined:
    action: send
    channel: { $ref: '#/channels/batchRequirement' }
    messages: [{ $ref: '#/channels/batchRequirement/messages/batchRequirementDefined' }]
    summary: A customer batch requirement was defined; reservation, picking and shelf-life aware planning read the rules from it
  publishBatchRequirementRetired:
    action: send
    channel: { $ref: '#/channels/batchRequirement' }
    messages: [{ $ref: '#/channels/batchRequirement/messages/batchRequirementRetired' }]
    summary: A customer batch requirement was retired and no longer applies
  publishBatchRecordProfileDefined:
    action: send
    channel: { $ref: '#/channels/batchRecordProfile' }
    messages: [{ $ref: '#/channels/batchRecordProfile/messages/batchRecordProfileDefined' }]
    summary: An item got an electronic batch record profile; it says whether releasing a batch needs an approved record
  publishBatchRecordProfileRetired:
    action: send
    channel: { $ref: '#/channels/batchRecordProfile' }
    messages: [{ $ref: '#/channels/batchRecordProfile/messages/batchRecordProfileRetired' }]
    summary: A batch record profile was retired and its item's batches are no longer held for a record
  publishBatchRecordCompiled:
    action: send
    channel: { $ref: '#/channels/batchRecord' }
    messages: [{ $ref: '#/channels/batchRecord/messages/batchRecordCompiled' }]
    summary: The electronic batch record of a batch was compiled or refreshed; quality and release review read it
  publishBatchRecordExceptionRaised:
    action: send
    channel: { $ref: '#/channels/batchRecord' }
    messages: [{ $ref: '#/channels/batchRecord/messages/batchRecordExceptionRaised' }]
    summary: A batch record got an exception, from a value outside its limits or raised by a reviewer; quality follows it up
  publishBatchRecordExceptionDispositioned:
    action: send
    channel: { $ref: '#/channels/batchRecord' }
    messages: [{ $ref: '#/channels/batchRecord/messages/batchRecordExceptionDispositioned' }]
    summary: An exception of a batch record was decided with the signature behind it (accepted, deviation raised or rejected)
  publishBatchRecordApproved:
    action: send
    channel: { $ref: '#/channels/batchRecord' }
    messages: [{ $ref: '#/channels/batchRecord/messages/batchRecordApproved' }]
    summary: A batch record was approved by exception; the batch can be released
  publishBatchRecordSealed:
    action: send
    channel: { $ref: '#/channels/batchRecord' }
    messages: [{ $ref: '#/channels/batchRecord/messages/batchRecordSealed' }]
    summary: A batch record was sealed with the SHA-256 of its document; archiving reads it
components:
  messages:
    FormulaCreated:
      name: dev.passage.production.formula.created.v1
      summary: A formula was created with its lines
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/FormulaCreatedData' }
    BatchOrderCreated:
      name: dev.passage.production.batchorder.created.v1
      summary: A batch order was created from a formula snapshot
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchOrderCreatedData' }
    BatchOrderRescaled:
      name: dev.passage.production.batchorder.rescaled.v1
      summary: A batch order was rescaled before it started
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchOrderRescaledData' }
    BatchOrderStateChanged:
      name: dev.passage.production.batchorder.statechanged.v1
      summary: A batch order moved to released, started, reported or ended
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchOrderStateChangedData' }
    CoProductAllocated:
      name: dev.passage.production.coproduct.allocated.v1
      summary: The batch cost of an ended order was allocated; the shares add up to the batch cost exactly
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/CoProductAllocatedData' }
    BatchAttributeDefined:
      name: dev.passage.production.batchattribute.defined.v1
      summary: An item got a batch attribute definition
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchAttributeDefinedData' }
    BatchRegistered:
      name: dev.passage.production.batch.registered.v1
      summary: A batch got its quality record
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchRegisteredData' }
    BatchAttributesRecorded:
      name: dev.passage.production.batch.attributesrecorded.v1
      summary: Attribute values were recorded on a batch
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchAttributesRecordedData' }
    BatchDispositionChanged:
      name: dev.passage.production.batch.dispositionchanged.v1
      summary: A batch moved to another disposition
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchDispositionChangedData' }
    BatchMerged:
      name: dev.passage.production.batch.merged.v1
      summary: Batches were merged into a new batch
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchMergedData' }
    BatchDerived:
      name: dev.passage.production.batch.derived.v1
      summary: A batch got attribute values derived from its senders
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchDerivedData' }
    InheritanceRuleDefined:
      name: dev.passage.production.inheritancerule.defined.v1
      summary: An attribute inheritance rule was defined
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/InheritanceRuleData' }
    InheritanceRuleRetired:
      name: dev.passage.production.inheritancerule.retired.v1
      summary: An attribute inheritance rule was retired
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/InheritanceRuleData' }
    BatchRequirementDefined:
      name: dev.passage.production.batchrequirement.defined.v1
      summary: A customer batch requirement was defined
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchRequirementData' }
    BatchRequirementRetired:
      name: dev.passage.production.batchrequirement.retired.v1
      summary: A customer batch requirement was retired
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchRequirementData' }
    BatchRecordProfileDefined:
      name: dev.passage.production.batchrecordprofile.defined.v1
      summary: A batch record profile was defined
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchRecordProfileData' }
    BatchRecordProfileRetired:
      name: dev.passage.production.batchrecordprofile.retired.v1
      summary: A batch record profile was retired
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchRecordProfileData' }
    BatchRecordCompiled:
      name: dev.passage.production.batchrecord.compiled.v1
      summary: A batch record was compiled or refreshed
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchRecordData' }
    BatchRecordExceptionRaised:
      name: dev.passage.production.batchrecord.exceptionraised.v1
      summary: An exception was raised on a batch record
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchRecordExceptionData' }
    BatchRecordExceptionDispositioned:
      name: dev.passage.production.batchrecord.exceptiondispositioned.v1
      summary: An exception of a batch record was decided
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchRecordExceptionData' }
    BatchRecordApproved:
      name: dev.passage.production.batchrecord.approved.v1
      summary: A batch record was approved
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchRecordData' }
    BatchRecordSealed:
      name: dev.passage.production.batchrecord.sealed.v1
      summary: A batch record was sealed
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/BatchRecordData' }
  schemas:
    FormulaCreatedData:
      type: object
      required: [formulaId, code, itemId, size, unit, lines]
      properties:
        formulaId: { type: string, format: uuid }
        code: { type: string }
        itemId: { type: string, format: uuid }
        size: { type: string, description: Decimal as a string. }
        unit: { type: string }
        lines: { type: integer }
    OutputLine:
      type: object
      required: [lineNumber, itemId, type, qty]
      properties:
        lineNumber: { type: integer }
        itemId: { type: string, format: uuid }
        type: { type: string, enum: [co-product, by-product] }
        qty: { type: string, description: Quantity at the batch size. }
    BatchOrderCreatedData:
      type: object
      required: [orderId, orderNumber, legalEntityId, formulaId, formulaVersion, itemId, batchSize, scaleFactor, coProducts]
      properties:
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        legalEntityId: { type: string, format: uuid }
        formulaId: { type: string, format: uuid }
        formulaVersion: { type: integer }
        itemId: { type: string, format: uuid }
        batchSize: { type: string }
        scaleFactor: { type: string }
        coProducts: { type: array, items: { $ref: '#/components/schemas/OutputLine' } }
    BatchOrderRescaledData:
      type: object
      required: [orderId, previousBatchSize, batchSize, scaleFactor, version, coProducts]
      properties:
        orderId: { type: string, format: uuid }
        previousBatchSize: { type: string }
        batchSize: { type: string }
        scaleFactor: { type: string }
        version: { type: integer }
        coProducts: { type: array, items: { $ref: '#/components/schemas/OutputLine' } }
    ReportedLine:
      type: object
      required: [lineNumber, itemId, type, rafQty]
      properties:
        lineNumber: { type: integer }
        itemId: { type: string, format: uuid }
        type: { type: string, enum: [co-product, by-product] }
        rafQty: { type: string, description: Quantity reported as finished. }
    BatchOrderStateChangedData:
      type: object
      required: [orderId, orderNumber, legalEntityId, itemId, from, to, version]
      properties:
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        legalEntityId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        from: { type: string, enum: [planned, released, started, reported] }
        to: { type: string, enum: [released, started, reported, ended] }
        version: { type: integer, description: The order version after the change. }
        actualQty: { type: string, description: Quantity of the order's own item reported as finished; set when to is reported. }
        outputs: { type: array, items: { $ref: '#/components/schemas/ReportedLine' }, description: Set when to is reported. }
        batchCost: { type: string, description: Cost the order ended with; set when to is ended. }
        currency: { type: string, description: ISO 4217 code; set when to is ended. }
        method: { type: string, enum: [none, manual, tca, quantity], description: Allocation method; set when to is ended. }
    AllocationShare:
      type: object
      required: [role, lineNumber, itemId, rafQty, amount, percent]
      properties:
        role: { type: string, enum: [main, co-product, by-product-burden] }
        lineNumber: { type: integer, description: 0 for the order's own item. }
        itemId: { type: string, format: uuid }
        rafQty: { type: string }
        amount: { type: string, description: Decimal with 4 places. }
        percent: { type: string }
    CoProductAllocatedData:
      type: object
      required: [orderId, orderNumber, legalEntityId, method, currency, batchCost, shares]
      properties:
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        legalEntityId: { type: string, format: uuid }
        method: { type: string, enum: [none, manual, tca, quantity] }
        currency: { type: string }
        batchCost: { type: string }
        shares: { type: array, items: { $ref: '#/components/schemas/AllocationShare' } }
    BatchAttributeDefinedData:
      type: object
      required: [definitionId, itemId, name, kind, role]
      properties:
        definitionId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [numeric, text, enum, date] }
        role: { type: string, enum: [generic, potency] }
        target: { type: string }
        min: { type: string }
        max: { type: string }
        options: { type: array, items: { type: string } }
    BatchRegisteredData:
      type: object
      required: [batchId, legalEntityId, itemId, batchNumber, disposition]
      properties:
        batchId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        batchNumber: { type: string }
        batchOrderId: { type: string, format: uuid }
        disposition: { type: string, enum: [available, on-hold, rejected, quarantine] }
    RecordedAttribute:
      type: object
      required: [name, kind, value, pass]
      properties:
        name: { type: string }
        kind: { type: string, enum: [numeric, text, enum, date] }
        value: { type: string, description: The number, text or yyyy-mm-dd date as a string. }
        pass: { type: boolean, description: False for a numeric value outside its limits (an EBR exception). }
        detail: { type: string }
    BatchAttributesRecordedData:
      type: object
      required: [batchId, legalEntityId, itemId, batchNumber, version, attributes, failures]
      properties:
        batchId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        batchNumber: { type: string }
        version: { type: integer, description: The batch version after the change. }
        expiryDate: { type: string, format: date, description: The batch's expiry date after the change, when it has one. }
        potency: { type: string, description: The value recorded for the item's potency-role attribute, when this recording carries one. }
        attributes: { type: array, items: { $ref: '#/components/schemas/RecordedAttribute' } }
        failures: { type: integer, description: Values outside their limits. }
    BatchDispositionChangedData:
      type: object
      required: [batchId, legalEntityId, itemId, batchNumber, from, to, reason, segregationConflict, version]
      properties:
        batchId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        batchNumber: { type: string }
        from: { type: string, enum: [available, on-hold, rejected, quarantine] }
        to: { type: string, enum: [available, on-hold, rejected, quarantine] }
        reason: { type: string }
        segregationConflict: { type: boolean, description: The same user recorded attribute values on this batch (PRD 4.24.17). }
        version: { type: integer, description: The batch version after the change. }
    MergedParent:
      type: object
      required: [batchId, batchNumber, qty, unitCost]
      properties:
        batchId: { type: string, format: uuid }
        batchNumber: { type: string }
        qty: { type: string, description: Quantity the parent contributed, as given by the caller. }
        unitCost: { type: string }
    BatchMergedData:
      type: object
      required: [batchId, legalEntityId, itemId, batchNumber, disposition, warehouseId, qty, unitCost, parents]
      properties:
        batchId: { type: string, format: uuid, description: The new batch. }
        legalEntityId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        batchNumber: { type: string }
        disposition: { type: string, enum: [available, on-hold, rejected, quarantine], description: The disposition the parents shared. }
        warehouseId: { type: string, description: The warehouse the parents share; inventory posts the transfers out of each parent and into the new batch there. }
        cwUnit: { type: string, description: The catch-weight unit the parents share, when the item has one. }
        expiryDate: { type: string, format: date, description: The earliest expiry of the parents, when they have one. }
        qty: { type: string, description: Sum of the parents' quantities. }
        unitCost: { type: string, description: Quantity-weighted average cost per unit. }
        parents: { type: array, items: { $ref: '#/components/schemas/MergedParent' } }
    InheritanceRuleData:
      type: object
      required: [ruleId, legalEntityId, itemId, attribute, aggregation, version]
      properties:
        ruleId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        attribute: { type: string, description: The receiver attribute the rule fills. }
        aggregation: { type: string, enum: [copy, min, max, weighted-average, earliest-date, latest-date, fixed] }
        decimals: { type: integer, description: Rounding of a weighted average (default 4 when absent). }
        fixed: { type: string, description: The fixed value of a fixed rule. }
        version: { type: integer, description: The rule version after the change (1 when defined, 2 when retired). }
    DerivedAttribute:
      type: object
      required: [attribute, aggregation, recorded, missing]
      properties:
        attribute: { type: string }
        aggregation: { type: string }
        recorded: { type: boolean, description: False when no sender had a value; the receiver attribute was left as it was. }
        value: { type: string, description: The derived value as text (date as yyyy-mm-dd). }
        missing: { type: array, items: { type: string, format: uuid }, description: Sender batches without a value for the attribute (PMF-0007). }
    BatchDerivedData:
      type: object
      required: [batchId, legalEntityId, itemId, batchNumber, version, senders, derived]
      properties:
        batchId: { type: string, format: uuid, description: The receiver batch. }
        legalEntityId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        batchNumber: { type: string }
        version: { type: integer, description: The receiver batch version after the derivation. }
        senders: { type: array, items: { type: string, format: uuid } }
        derived: { type: array, items: { $ref: '#/components/schemas/DerivedAttribute' } }
    BatchRequirementData:
      type: object
      required: [requirementId, legalEntityId, itemId, level, version]
      properties:
        requirementId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerGroupId: { type: string, format: uuid }
        level: { type: integer, enum: [1, 2, 3], description: 3 for a customer, 2 for a customer group, 1 for the item default. }
        sellableDays: { type: integer }
        attribute: { type: string }
        min: { type: string }
        max: { type: string }
        sameBatch: { type: boolean }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        version: { type: integer, description: The rule version after the change (1 when defined, 2 when retired). }

    BatchRecordProfileData:
      type: object
      required: [profileId, legalEntityId, code, itemId, approvalRequiredForRelease, version]
      properties:
        profileId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string }
        itemId: { type: string, format: uuid }
        approvalRequiredForRelease: { type: boolean }
        version: { type: integer, description: The profile version after the change (1 when defined, 2 when retired). }
    BatchRecordData:
      type: object
      required: [recordId, legalEntityId, batchOrderId, batchId, batchNumber, itemId, status, version, exceptions, openExceptions]
      properties:
        recordId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        batchOrderId: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        batchNumber: { type: string }
        itemId: { type: string, format: uuid }
        status: { type: string, enum: [in-review, approved, sealed] }
        version: { type: integer }
        exceptions: { type: integer, description: Exceptions on the record. }
        openExceptions: { type: integer, description: Exceptions without a disposition and signature. }
        contentHash: { type: string, description: Hex SHA-256 of the sealed document; set on sealed. }
    BatchRecordExceptionData:
      type: object
      required: [recordId, exceptionId, legalEntityId, batchId, sourceType, severity]
      properties:
        recordId: { type: string, format: uuid }
        exceptionId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        sourceType: { type: string, enum: [attribute, manual] }
        severity: { type: string, enum: [minor, major, critical] }
        disposition: { type: string, enum: [accepted, deviation-raised, rejected], description: Set on exceptiondispositioned. }
