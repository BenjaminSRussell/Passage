        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0115
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-record-profiles/{id}:retire:
    post:
      operationId: retireBatchRecordProfile
      summary: Retire a batch record profile
      description: Records already compiled keep their profile; new batches of the item are no longer held for a record. Writes dev.passage.production.batchrecordprofile.retired.v1.
      x-passage-duty: production.batch-record.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } }
      responses:
        '200':
          description: 'The retired profile at version + 1. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/RecordProfile' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0115
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0117 when the profile is already retired.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-records:
    post:
      operationId: compileBatchRecord
      summary: Compile the electronic batch record of a batch, or refresh it while in review (FR-24.21)
      description: >-
        Builds the record from the batch order and the batch (order header, scaled lines, cost split, attributes,
        dispositions) and raises one exception for each recorded value outside its limits that has none yet (BR-24.15).
        Compiling again while the record is in review reads the content again and adds the exceptions of values
        recorded since. The batch needs a batch order and an active profile of its item. An approved or sealed record
        does not change (PMF-0120). Writes dev.passage.production.batchrecord.compiled.v1 and one
        dev.passage.production.batchrecord.exceptionraised.v1 for each new exception.
      x-passage-duty: production.batch-record.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompileRecordRequest' } } }
      responses:
        '200':
          description: 'The record in review with its exceptions. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ElectronicBatchRecord' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0108 when the batch is not found.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0119 when the item has no active profile; PMF-0120 when the record is approved or sealed.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: PMF-0123 when the batch has no batch order; idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listBatchRecords
      summary: Electronic batch records, newest first (exceptions and content omitted)
      x-passage-duty: production.batch-order.read
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RecordStatus' } }
        - { name: batchId, in: query, schema: { type: string, format: uuid } }
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Records with their exception counts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ElectronicBatchRecord' } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-records/{id}:
    get:
      operationId: getBatchRecord
      summary: One batch record with its content, exceptions and, once sealed, the sealed document and hash
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The record.
          content: { application/json: { schema: { $ref: '#/components/schemas/ElectronicBatchRecord' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0118
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-records/{id}/exceptions:
    post:
      operationId: raiseBatchRecordException
      summary: Raise an exception on a record in review (BR-24.15)
      description: For something the reviewer found that no recorded value shows. Writes dev.passage.production.batchrecord.exceptionraised.v1.
      x-passage-duty: production.batch-record.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RaiseExceptionRequest' } } }
      responses:
        '200':
          description: 'The record at version + 1 with the new exception. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ElectronicBatchRecord' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0118
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0120 when the record is no longer in review.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-records/{id}/exceptions/{exceptionId}:disposition:
    post:
      operationId: dispositionBatchRecordException
      summary: Decide an exception of a record in review with the signature behind it (BR-24.15)
      description: >-
        Accept it, raise a deviation or reject; this is the review step (PRD duty *Review batch records*). WARNING, NOT
        21 CFR PART 11 COMPLIANT YET: the signature service (FR-24.22) is not built, so signatureId is stored exactly as
        given and is NOT verified. Any well-formed UUID is accepted; there is no re-authentication, no binding of the
        signature to the record hash and no check that the signature exists or belongs to the caller. The decision is
        attributed to the authenticated caller (dispositionedBy), and the sealed document records signaturesVerified
        false. A decision is final (409 PMF-0125). Writes
        dev.passage.production.batchrecord.exceptiondispositioned.v1.
      x-passage-duty: production.batch-record.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: exceptionId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DispositionExceptionRequest' } } }
      responses:
        '200':
          description: 'The record at version + 1. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ElectronicBatchRecord' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0118 when the record is not found; PMF-0122 when it has no such exception.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0120 when the record is no longer in review; PMF-0125 when the exception is already decided.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-records/{id}:approve:
    post:
      operationId: approveBatchRecord
      summary: Approve a batch record by exception (BR-24.15, AC-24.16)
      description: >-
        Refused with 422 PMF-0014 while any exception lacks a disposition or its signature, with 409 PMF-0121 when a
        value outside its limits was recorded after the last compile (compile again first), and with 422 PMF-0124 when
        the caller raised or decided an exception of this record or created its batch order (segregation of duties,
        PRD 4.24.17). The signature ids behind the decisions are not verified (see the disposition operation). Once
        approved, the content is frozen and the batch can be released. Writes
        dev.passage.production.batchrecord.approved.v1.
      x-passage-duty: production.batch-record.approve
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } }
      responses:
        '200':
          description: 'The approved record at version + 1. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ElectronicBatchRecord' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0118
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0120 when the record is not in review; PMF-0121 when the record is out of date.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: PMF-0014 while any exception lacks a disposition or a signature; PMF-0124 when the caller reviewed the record or created its batch order; idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-records/{id}:seal:
    post:
      operationId: sealBatchRecord
      summary: Seal an approved batch record with a content hash (FR-24.21)
      description: >-
        Stores the canonical JSON document of the record, the content as it was approved (not compiled again) and its
        exceptions with their decisions, and its SHA-256: contentHash is the hex SHA-256 of the UTF-8 bytes of
        sealedDocument. Canonical means compact, object keys sorted at every level, no HTML escaping, numbers as first
        written (quantities and money are decimal strings) and times in UTC, so any sorted-keys JSON encoder
        reproduces it. The document carries signaturesVerified false while the signature service is not built. A
        sealed record never changes again; the database refuses any update or delete. No PDF/A rendition or document
        archive yet. Writes dev.passage.production.batchrecord.sealed.v1.
      x-passage-duty: production.batch-record.approve
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } }
      responses:
        '200':
          description: 'The sealed record with its document and hash. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ElectronicBatchRecord' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0118
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0120 when the record is not approved.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1 to 200 characters. A retry with the same key and body returns the first answer; a different body is idempotency_key_reuse (422).
      schema: { type: string, minLength: 1, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  schemas:
    AttributeKind:
      type: string
      enum: [numeric, text, enum, date]
    AttributeRole:
      type: string
      description: The potency attribute carries an item's active-ingredient percentage (PRD 4.24.4 role).
      enum: [generic, potency]
    BatchAttributeDefinitionRequest:
      type: object
      required: [itemId, name, kind]
      properties:
        itemId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 40 }
        kind: { $ref: '#/components/schemas/AttributeKind' }
        role: { $ref: '#/components/schemas/AttributeRole', description: Defaults to generic; potency only on a numeric attribute, at most one per item. }
        target: { $ref: '#/components/schemas/Decimal', description: Numeric attributes only. }
        min: { $ref: '#/components/schemas/Decimal', description: Numeric attributes only; inclusive. }
        max: { $ref: '#/components/schemas/Decimal', description: Numeric attributes only; inclusive. }
        options: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 200 }, uniqueItems: true, description: Enum attributes only; at least one. }
    BatchAttributeDefinition:
      type: object
      required: [id, itemId, name, kind, role, options, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/AttributeKind' }
        role: { $ref: '#/components/schemas/AttributeRole' }
        target: { $ref: '#/components/schemas/Decimal' }
        min: { $ref: '#/components/schemas/Decimal' }
        max: { $ref: '#/components/schemas/Decimal' }
        options: { type: array, items: { type: string } }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    BatchRequest:
      type: object
      required: [itemId, batchNumber]
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity. }
        itemId: { type: string, format: uuid }
        batchNumber: { type: string, minLength: 1, maxLength: 40 }
        batchOrderId: { type: [string, 'null'], format: uuid }
        disposition: { $ref: '#/components/schemas/Disposition', description: Defaults to available. }
    RecordAttributesRequest:
      type: object
      required: [version, values]
      properties:
        version: { type: integer, minimum: 1, description: The batch version you read. }
        values: { type: object, minProperties: 1, maxProperties: 100, additionalProperties: { $ref: '#/components/schemas/AttributeValue' }, description: Attribute name to value. }
    DispositionRequest:
      type: object
      required: [version, disposition, reason]
      properties:
        version: { type: integer, minimum: 1 }
        disposition: { $ref: '#/components/schemas/Disposition' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    BatchAttribute:
      type: object
      required: [name, kind, pass, recordedBy, recordedAt]
      properties:
        name: { type: string }
        kind: { $ref: '#/components/schemas/AttributeKind' }
        num: { $ref: '#/components/schemas/Decimal' }
        text: { type: string }
        date: { type: string, format: date }
        pass: { type: boolean, description: False for a numeric value outside its limits. }
        detail: { type: string }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
    DispositionChange:
      type: object
      required: [from, to, reason, segregationConflict, changedBy, changedAt]
      properties:
        from: { $ref: '#/components/schemas/Disposition' }
        to: { $ref: '#/components/schemas/Disposition' }
        reason: { type: string }
        segregationConflict: { type: boolean, description: The user who changed the disposition also recorded attribute values on this batch (flagged segregation-of-duties conflict). }
        changedBy: { type: string }
        changedAt: { type: string, format: date-time }
    BatchRecord:
      type: object
      description: The quality record of a batch (slice 11); not the Batch a preview takes as input.
      required: [id, legalEntityId, itemId, batchNumber, disposition, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        batchNumber: { type: string }
        batchOrderId: { type: string, format: uuid }
        disposition: { $ref: '#/components/schemas/Disposition' }
        expiryDate: { type: string, format: date, description: Set from the expiry date attribute. }
        version: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        attributes: { type: array, items: { $ref: '#/components/schemas/BatchAttribute' }, description: The latest value of each attribute; on the detail only. }
        attributeHistory: { type: array, items: { $ref: '#/components/schemas/BatchAttribute' }, description: Every recorded value, newest first, at most 500; on the detail only. }
        dispositions: { type: array, items: { $ref: '#/components/schemas/DispositionChange' }, description: Newest first; on the detail only. }
    MergeSource:
      type: object
      required: [batchId, version, warehouseId, qty, unitCost]
      properties:
        batchId: { type: string, format: uuid }
        version: { type: integer, minimum: 1, description: The batch version the caller read; the merge moves it by one. }
        warehouseId: { type: string, minLength: 1, maxLength: 80, description: Sources in different warehouses are refused. }
        cwUnit: { type: string, maxLength: 80, description: Catch-weight unit; sources must share it. }
        qty: { $ref: '#/components/schemas/Decimal', description: Quantity merged, from inventory. }
        unitCost: { $ref: '#/components/schemas/Decimal', description: Cost per unit, from inventory. }
    MergeStoredRequest:
      type: object
      required: [targetBatchNumber, sources]
      properties:
        targetBatchNumber: { type: string, minLength: 1, maxLength: 40 }
        sources: { type: array, minItems: 2, maxItems: 50, items: { $ref: '#/components/schemas/MergeSource' } }
        mergeOverride: { type: array, items: { type: string }, description: Text attributes allowed to differ. }
    GenealogyLink:
      type: object
      required: [batchId, batchNumber, itemId, relation, qty, unitCost, createdBy, createdAt]
      properties:
        batchId: { type: string, format: uuid }
        batchNumber: { type: string }
        itemId: { type: string, format: uuid }
        relation: { type: string, enum: [merge, rework] }
        qty: { $ref: '#/components/schemas/Decimal' }
        unitCost: { $ref: '#/components/schemas/Decimal' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    MergeStoredResult:
      type: object
      required: [batch, qty, unitCost, parents]
      properties:
        batch: { $ref: '#/components/schemas/BatchRecord' }
        qty: { $ref: '#/components/schemas/Decimal' }
        unitCost: { $ref: '#/components/schemas/Decimal' }
        parents: { type: array, items: { $ref: '#/components/schemas/GenealogyLink' } }
    Genealogy:
      type: object
      required: [batchId, parents, children, reworks]
      properties:
        batchId: { type: string, format: uuid }
        parents: { type: array, items: { $ref: '#/components/schemas/GenealogyLink' } }
        children: { type: array, items: { $ref: '#/components/schemas/GenealogyLink' } }
        reworks:
          type: array
          description: The rework orders of the batch, as the batch reworked or as the output, oldest first (FR-24.18, AC-24.18). A rework that keeps the batch number shows here only.
          items: { $ref: '#/components/schemas/ReworkOrder' }
    AttributeCheck:
      type: object
      required: [name, pass]
      properties:
        name: { type: string }
        pass: { type: boolean }
        detail: { type: string }
    AttributesResult:
      type: object
      required: [batch, checks]
      properties:
        batch: { $ref: '#/components/schemas/BatchRecord' }
        checks: { type: array, items: { $ref: '#/components/schemas/AttributeCheck' } }
    CustomerRequirementRequest:
      type: object
      required: [itemId]
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity. }
        itemId: { type: string, format: uuid }
        customerId: { type: string, format: uuid, description: "The rule is the customer's (scope 3). Not with customerGroupId. A party/sales customer id, not looked up." }
        customerGroupId: { type: string, format: uuid, description: "The rule is the customer group's (scope 2). With neither, it is the item default (scope 1). A sales customer-group id, not looked up." }
        sellableDays: { type: integer, minimum: 0, maximum: 3650, description: Minimum remaining shelf life in whole days at shipment. }
        attribute: { type: string, minLength: 1, maxLength: 40, description: The attribute a value must lie in the range of; needs min or max. }
        min: { $ref: '#/components/schemas/Decimal' }
        max: { $ref: '#/components/schemas/Decimal' }
        sameBatch: { type: boolean, description: The whole line quantity must come from one batch. }
        validFrom: { type: string, format: date, description: First day the rule applies; empty for no start. }
        validTo: { type: string, format: date, description: Last day the rule applies (inclusive); empty for no end. }
    CustomerRequirement:
      type: object
      required: [id, legalEntityId, itemId, level, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerGroupId: { type: string, format: uuid }
        level: { type: integer, enum: [1, 2, 3], description: 3 for a customer, 2 for a customer group, 1 for the item default. }
        sellableDays: { type: integer }
        attribute: { type: string }
        min: { $ref: '#/components/schemas/Decimal' }
        max: { $ref: '#/components/schemas/Decimal' }
        sameBatch: { type: boolean }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        retiredAt: { type: string, format: date-time }
        retiredBy: { type: string }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InheritanceRuleRequest:
      type: object
      required: [itemId, attribute, aggregation]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity. }
        itemId: { type: string, format: uuid }
        attribute: { type: string, minLength: 1, maxLength: 40, description: The receiver attribute the item defines. }
        aggregation: { $ref: '#/components/schemas/Aggregation' }
        decimals: { type: integer, minimum: 0, maximum: 6, description: Rounding of a weighted average (default 4). }
        fixed: { $ref: '#/components/schemas/AttributeValue' }
    InheritanceRule:
      type: object
      required: [id, legalEntityId, itemId, attribute, aggregation, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        attribute: { type: string }
        aggregation: { $ref: '#/components/schemas/Aggregation' }
        decimals: { type: integer }
        fixedNum: { $ref: '#/components/schemas/Decimal' }
        fixedText: { type: string }
        fixedDate: { type: string, format: date }
        retiredAt: { type: string, format: date-time }
        retiredBy: { type: string }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DeriveSender:
      type: object
      required: [batchId, qty]
      additionalProperties: false
      properties:
        batchId: { type: string, format: uuid }
        qty: { type: string, description: Quantity consumed from the sender, 0 to below 10^12 with at most 6 decimals; the weight of a weighted average. }
    DeriveStoredRequest:
      type: object
      required: [version, senders]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1, description: The receiver batch version the caller read. }
        senders: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/DeriveSender' } }
    DerivedValue:
      type: object
      required: [ruleId, attribute, aggregation, recorded, missing]
      properties:
        ruleId: { type: string, format: uuid }
        attribute: { type: string }
        aggregation: { $ref: '#/components/schemas/Aggregation' }
        recorded: { type: boolean, description: False when no sender had a value; the receiver attribute was left as it was. }
        value: { type: string, description: The derived value as text (a date as yyyy-mm-dd). }
        missing: { type: array, items: { type: string, format: uuid }, description: Senders without a value for the attribute (PMF-0007). }
    DeriveStoredResponse:
      type: object
      required: [batch, derived, warnings]
      properties:
        batch: { $ref: '#/components/schemas/BatchRecord' }
        derived: { type: array, items: { $ref: '#/components/schemas/DerivedValue' } }
        warnings: { type: array, items: { type: string } }
    Derivation:
      type: object
      required: [id, legalEntityId, receiverBatchId, batchNumber, receiverVersion, ruleId, attribute, aggregation, recorded, senders, missing, runBy, runAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        receiverBatchId: { type: string, format: uuid }
        batchNumber: { type: string }
        receiverVersion: { type: integer, description: The receiver version after the derivation. }
        ruleId: { type: string, format: uuid }
        attribute: { type: string }
        aggregation: { $ref: '#/components/schemas/Aggregation' }
        recorded: { type: boolean }
        value: { type: string, description: The value derived (absent when recorded is false). }
        valueBefore: { type: string, description: The receiver's value of the attribute before the derivation (absent when it had none). }
        senders:
          type: array
          items:
            type: object
            required: [batchId, batchNumber, qty]
            properties:
              batchId: { type: string, format: uuid }
              batchNumber: { type: string }
              qty: { type: string }
        missing: { type: array, items: { type: string, format: uuid } }
        runBy: { type: string }
        runAt: { type: string, format: date-time }
    CheckStoredRequest:
      type: object
      required: [itemId, shipDate, qty, onHand]
      properties:
        legalEntityId: { type: string, format: uuid, description: The legal entity whose rules apply. Defaults to the caller's legal entity. }
        itemId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerGroupId: { type: string, format: uuid, description: The customer's group; the service does not look it up. }
        shipDate: { type: string, format: date, description: The shipping site's local calendar day. }
        qty: { $ref: '#/components/schemas/Quantity' }
        onHand:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [batchId, qty]
            properties:
              batchId: { type: string, format: uuid }
              qty: { $ref: '#/components/schemas/Decimal' }
    CheckStoredResponse:
      allOf:
        - $ref: '#/components/schemas/CheckResponse'
        - type: object
          required: [applied, batchNumbers]
          properties:
            applied: { type: array, items: { type: string, format: uuid }, description: "The stored rules the requirement took a value from, in precedence order; overridden rules are left out." }
            batchNumbers: { type: object, additionalProperties: { type: string }, description: Batch number by batch id. }
    Decimal:
      type: string
      description: Decimal as a JSON string (numbers are accepted on input).
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    Quantity:
      type: string
      description: Positive decimal below 10^12 with at most 6 decimals.
      pattern: '^[0-9]{1,12}(\.[0-9]{1,6})?$'
    LineType:
      type: string
      enum: [ingredient, active-ingredient, phantom, co-product, by-product]
    OrderStatus:
      type: string
      enum: [planned, released, started, reported, ended, closed]
    FormulaLineRequest:
      type: object
      required: [lineNumber, itemId, type]
      properties:
        lineNumber: { type: integer, minimum: 1 }
        itemId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/LineType' }
        qty: { $ref: '#/components/schemas/Decimal' }
        percent: { $ref: '#/components/schemas/Decimal', description: '0 to 100, at most 4 decimals' }
        scalable: { type: boolean, default: true }
        percentControlled: { type: boolean, default: false, description: Not allowed on co- and by-product lines. }
    FormulaRequest:
      type: object
      required: [code, name, itemId, size, unit, lines]
      properties:
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_.-]{0,39}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        itemId: { type: string, format: uuid }
        bomVersionId: { type: [string, 'null'], format: uuid }
        size: { $ref: '#/components/schemas/Quantity' }
        unit: { type: string, minLength: 1, maxLength: 10 }
        lines: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/FormulaLineRequest' } }
    FormulaLine:
      type: object
      required: [lineNumber, itemId, type, qty, percent, scalable, percentControlled]
      properties:
        lineNumber: { type: integer }
        itemId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/LineType' }
        qty: { $ref: '#/components/schemas/Decimal' }
        percent: { $ref: '#/components/schemas/Decimal' }
        scalable: { type: boolean }
        percentControlled: { type: boolean }
    Formula:
      type: object
      required: [id, code, name, itemId, size, unit, version, lineCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        itemId: { type: string, format: uuid }
        bomVersionId: { type: [string, 'null'], format: uuid }
        size: { $ref: '#/components/schemas/Decimal' }
        unit: { type: string }
        version: { type: integer }
        lineCount: { type: integer }
        lines: { type: array, items: { $ref: '#/components/schemas/FormulaLine' }, description: Present on create and get, omitted in lists. }
        createdAt: { type: string, format: date-time }
    BatchOrderRequest:
      type: object
      required: [formulaId, batchSize]
      properties:
        formulaId: { type: string, format: uuid }
        batchSize: { $ref: '#/components/schemas/Quantity' }
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity. }
    OrderLine:
      type: object
      required: [lineNumber, itemId, type, formulaQty, percent, scalable, percentControlled, qty]
      properties:
        lineNumber: { type: integer }
        itemId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/LineType' }
        formulaQty: { $ref: '#/components/schemas/Decimal' }
        percent: { $ref: '#/components/schemas/Decimal' }
        scalable: { type: boolean }
        percentControlled: { type: boolean }
        qty: { $ref: '#/components/schemas/Decimal', description: Quantity at the order's batch size. }
        rafQty: { $ref: '#/components/schemas/Decimal', description: Quantity reported as finished of a co- or by-product line, once the order is reported. }
    VersionRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1, description: The order version the caller read (optimistic concurrency). }
    ReportOutput:
      type: object
      required: [lineNumber, qty]
      properties:
        lineNumber: { type: integer, description: Line number of a co-product or by-product line of the order. }
        qty: { $ref: '#/components/schemas/Decimal', description: Quantity reported as finished, zero or more. }
    ReportRequest:
      type: object
      required: [version, mainQty]
      properties:
        version: { type: integer, minimum: 1 }
        mainQty: { $ref: '#/components/schemas/Quantity', description: Quantity of the order's own item reported as finished. }
        outputs: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ReportOutput' }, description: A co- or by-product line left out is reported at its planned quantity. }
    EndBasis:
      type: object
      properties:
        lineNumber: { type: integer, description: Co-product line number; not used for the main item. }
        standardCost: { $ref: '#/components/schemas/Decimal', description: 'Weight for the tca method (standard cost times reported quantity); zero or more, below 10^12, at most 6 decimals.' }
        percent: { $ref: '#/components/schemas/Decimal', description: 'Weight for the manual method; 0 to 100, at most 6 decimals. Percentages are normalized, so they need not add up to 100.' }
    EndByProduct:
      type: object
      required: [lineNumber, costType]
      properties:
        lineNumber: { type: integer, description: By-product line number. }
        costType: { type: string, enum: [per-series, per-quantity, percent, recycled] }
        rate: { $ref: '#/components/schemas/Decimal', description: 'Percent of the batch cost for percent, else the amount per unit of the reported quantity; zero or more, at most 6 decimals.' }
    EndRequest:
      type: object
      required: [version, method, currency, batchCost]
      properties:
        version: { type: integer, minimum: 1 }
        method: { type: string, enum: [none, manual, tca, quantity] }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: ISO 4217 code. }
        batchCost: { $ref: '#/components/schemas/Decimal', description: Cost the order ends with, at most the currency's minor-unit decimals. }
        main: { $ref: '#/components/schemas/EndBasis' }
        coProducts: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/EndBasis' } }
        byProducts: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/EndByProduct' }, description: A by-product line without an entry carries no burden. }
    AllocationShare:
      type: object
      required: [role, lineNumber, itemId, rafQty, amount, percent]
      properties:
        role: { type: string, enum: [main, co-product, by-product-burden] }
        lineNumber: { type: integer, description: 0 for the order's own item. }
        itemId: { type: string, format: uuid }
        rafQty: { $ref: '#/components/schemas/Decimal' }
        amount: { $ref: '#/components/schemas/Decimal', description: Amount with 4 decimals. }
        percent: { $ref: '#/components/schemas/Decimal' }
    OrderAllocation:
      type: object
      required: [method, currency, batchCost, shares]
      properties:
        method: { type: string, enum: [none, manual, tca, quantity] }
        currency: { type: string }
        batchCost: { $ref: '#/components/schemas/Decimal' }
        shares: { type: array, items: { $ref: '#/components/schemas/AllocationShare' }, description: Main item first, then co-products, then by-product burdens; the amounts add up to batchCost exactly. }
    BatchOrder:
      type: object
      required: [id, legalEntityId, orderNumber, formulaId, formulaCode, formulaVersion, itemId, unit, formulaSize, batchSize, scaleFactor, status, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        orderNumber: { type: string, example: BO-000001 }
        formulaId: { type: string, format: uuid }
        formulaCode: { type: string }
        formulaVersion: { type: integer }
        itemId: { type: string, format: uuid }
        unit: { type: string }
        formulaSize: { $ref: '#/components/schemas/Decimal' }
        batchSize: { $ref: '#/components/schemas/Decimal' }
        scaleFactor: { $ref: '#/components/schemas/Decimal' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        version: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        reportedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        actualQty: { $ref: '#/components/schemas/Decimal', description: Quantity of the order's own item reported as finished. }
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' }, description: Present on create, get and the commands, omitted in lists. }
        allocation: { $ref: '#/components/schemas/OrderAllocation', description: Present once the order has ended. }
    ScaledLine:
      type: object
      properties:
        lineNumber: { type: integer }
        itemId: { type: string }
        type: { $ref: '#/components/schemas/LineType' }
        formulaQty: { $ref: '#/components/schemas/Decimal' }
        qty: { $ref: '#/components/schemas/Decimal' }
    ScaleResponse:
      type: object
      properties:
        batchSize: { $ref: '#/components/schemas/Decimal' }
        scaleFactor: { $ref: '#/components/schemas/Decimal' }
        lines: { type: array, items: { $ref: '#/components/schemas/ScaledLine' } }
    PotencyRequest:
      type: object
      required: [planned, standardPotency, batchPotency, compensatingPlanned]
      properties:
        planned: { $ref: '#/components/schemas/Decimal' }
        standardPotency: { $ref: '#/components/schemas/Decimal' }
        batchPotency: { $ref: '#/components/schemas/Decimal' }
        compensatingPlanned: { $ref: '#/components/schemas/Decimal' }
    PotencyResponse:
      type: object
      properties:
        qty: { $ref: '#/components/schemas/Decimal' }
        compensatingQty: { $ref: '#/components/schemas/Decimal' }
    CatchWeightRequest:
      type: object
      required: [nominal, min, max, cwQty, weight]
      properties:
        nominal: { $ref: '#/components/schemas/Decimal' }
        min: { $ref: '#/components/schemas/Decimal' }
        max: { $ref: '#/components/schemas/Decimal' }
        cwQty: { type: integer, minimum: 1 }
        weight: { $ref: '#/components/schemas/Decimal' }
    Valid:
      type: object
      properties:
        valid: { type: boolean }
    CostItem:
      type: object
      required: [itemId]
      properties:
        itemId: { type: string }
        standardCost: { $ref: '#/components/schemas/Decimal' }
        rafQty: { $ref: '#/components/schemas/Decimal' }
        percent: { $ref: '#/components/schemas/Decimal' }
    ByProductItem:
      type: object
      required: [itemId, costType]
      properties:
        itemId: { type: string }
        costType: { type: string, enum: [per-series, per-quantity, percent, recycled] }
        qty: { $ref: '#/components/schemas/Decimal' }
        rate: { $ref: '#/components/schemas/Decimal' }
    AllocateRequest:
      type: object
      required: [batchCost, currency, method, main]
      properties:
        batchCost: { $ref: '#/components/schemas/Decimal' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        method: { type: string, enum: [none, manual, tca, quantity] }
        main: { $ref: '#/components/schemas/CostItem' }
        coProducts: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/CostItem' } }
        byProducts: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ByProductItem' } }
    Allocated:
      type: object
      properties:
        itemId: { type: string }
        amount: { $ref: '#/components/schemas/Decimal' }
        percent: { $ref: '#/components/schemas/Decimal' }
    AllocateResponse:
      type: object
      properties:
        currency: { type: string }
        main: { $ref: '#/components/schemas/Allocated' }
        coProducts: { type: array, items: { $ref: '#/components/schemas/Allocated' } }
        byProductBurdens: { type: array, items: { $ref: '#/components/schemas/Allocated' } }
        total: { $ref: '#/components/schemas/Decimal' }
    AttributeValue:
      type: object
      description: One attribute value; at most one of num, text and date. An empty object is a missing value.
      additionalProperties: false
      properties:
        num: { $ref: '#/components/schemas/Decimal' }
        text: { type: string, maxLength: 200 }
        date: { type: string, format: date }
    Aggregation:
      type: string
      enum: [copy, min, max, weighted-average, earliest-date, latest-date, fixed]
    DeriveRequest:
      type: object
      required: [rule, senders]
      properties:
        rule:
          type: object
          required: [attribute, aggregation]
          properties:
            attribute: { type: string, minLength: 1, maxLength: 40 }
            aggregation: { $ref: '#/components/schemas/Aggregation' }
            decimals: { type: integer, minimum: 0, maximum: 10, description: Rounding of a weighted average; default 4. }
            fixed: { $ref: '#/components/schemas/AttributeValue' }
        senders:
          type: array
          maxItems: 200
          items:
            type: object
            required: [batchId, value]
            properties:
              batchId: { type: string, minLength: 1, maxLength: 80 }
              value: { $ref: '#/components/schemas/AttributeValue' }
              qty: { $ref: '#/components/schemas/Decimal', description: Consumed quantity; the weight of a weighted average. }
    DeriveResponse:
      type: object
      properties:
        attribute: { type: string }
        value: { $ref: '#/components/schemas/AttributeValue' }
        missingSenders: { type: array, items: { type: string } }
        warningCode: { type: string, enum: [PMF-0007] }
    Disposition:
      type: string
      enum: [available, on-hold, rejected, quarantine]
    Batch:
      type: object
      required: [id, qty]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        itemId: { type: string }
        warehouseId: { type: string }
        cwUnit: { type: string }
        disposition: { $ref: '#/components/schemas/Disposition' }
        qty: { $ref: '#/components/schemas/Quantity' }
        unitCost: { $ref: '#/components/schemas/Decimal' }
        values:
          type: object
          description: Attribute values by name; the shelf-life dates are expiry and best-before.
          additionalProperties: { $ref: '#/components/schemas/AttributeValue' }
    MergeRequest:
      type: object
      required: [batches]
      properties:
        batches: { type: array, minItems: 2, maxItems: 200, items: { $ref: '#/components/schemas/Batch' } }
        mergeOverride: { type: array, items: { type: string }, description: Text attributes allowed to differ. }
    MergeResponse:
      type: object
      properties:
        qty: { $ref: '#/components/schemas/Decimal' }
        unitCost: { $ref: '#/components/schemas/Decimal' }
        disposition: { $ref: '#/components/schemas/Disposition' }
        values: { type: object, additionalProperties: { $ref: '#/components/schemas/AttributeValue' } }
        parents: { type: array, items: { type: string } }
    Requirement:
      type: object
      required: [level]
      properties:
        level: { type: integer, enum: [1, 2, 3], description: 1 item default, 2 customer group, 3 customer. }
        sellableDays: { type: integer, minimum: 0, maximum: 3650 }
        attribute: { type: string, maxLength: 40 }
        min: { $ref: '#/components/schemas/Decimal' }
        max: { $ref: '#/components/schemas/Decimal' }
        sameBatch: { type: boolean }
    CheckRequest:
      type: object
      required: [requirements, shipDate, qty, batches]
      properties:
        requirements: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Requirement' } }
        shipDate: { type: string, format: date }
        qty: { $ref: '#/components/schemas/Quantity' }
        batches: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Batch' } }
    CheckResponse:
      type: object
      properties:
        requirement:
          type: object
          properties:
            sellableDays: { type: integer }
            sameBatch: { type: boolean }
            ranges:
              type: object
              additionalProperties:
                type: object
                properties:
                  min: { $ref: '#/components/schemas/Decimal' }
                  max: { $ref: '#/components/schemas/Decimal' }
        qualifying:
          type: array
          items:
            type: object
            properties:
              batchId: { type: string }
              qty: { $ref: '#/components/schemas/Decimal' }
              expiry: { type: string, format: date }
        excluded:
          type: array
          items:
            type: object
            properties:
              batchId: { type: string }
              reason: { type: string }
              warningCode: { type: string, enum: [PMF-0009] }
        qtyAvailable: { $ref: '#/components/schemas/Decimal' }
        sameBatchId: { type: string, nullable: true }
    ConsolidateRequest:
      type: object
      required: [relation, packedOrders]
      properties:
        relation:
          type: object
          required: [packQtyPerUnit, multiple]
          properties:
            packQtyPerUnit: { $ref: '#/components/schemas/Quantity', description: Bulk UoM per packed unit. }
            multiple: { $ref: '#/components/schemas/Quantity', description: Formula multiple. }
            max: { $ref: '#/components/schemas/Decimal', description: Formula maximum (a multiple of multiple); 0 means none. }
        packedOrders:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [orderId, units, due]
            properties:
              orderId: { type: string, minLength: 1, maxLength: 80 }
              itemId: { type: string }
              units: { $ref: '#/components/schemas/Quantity' }
              due: { type: string, format: date }
    ConsolidateResponse:
      type: object
      properties:
        bulkOrders:
          type: array
          items:
            type: object
            properties:
              qty: { $ref: '#/components/schemas/Decimal' }
              pegs:
                type: array
                items:
                  type: object
                  properties:
                    orderId: { type: string }
                    itemId: { type: string }
                    bulkQty: { $ref: '#/components/schemas/Decimal' }
    ApproveCheckRequest:
      type: object
      required: [exceptions]
      properties:
        exceptions:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id]
            properties:
              id: { type: string, minLength: 1, maxLength: 80 }
              disposition: { type: string, enum: ['', accepted, deviation-raised, rejected] }
              signatureId: { type: string }
    ApproveCheckResponse:
      type: object
      properties:
        approvable: { type: boolean }
        exceptions: { type: integer }
    AttributeDefinition:
      type: object
      required: [name, kind]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        kind: { type: string, enum: [numeric, text, enum, date] }
        target: { $ref: '#/components/schemas/Decimal' }
        min: { $ref: '#/components/schemas/Decimal', description: Inclusive; numeric only. }
        max: { $ref: '#/components/schemas/Decimal', description: Inclusive; numeric only. }
        options: { type: array, maxItems: 50, items: { type: string }, description: Required for enum; enum only. }
    AttributesRequest:
      type: object
      required: [definitions, values]
      properties:
        definitions: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AttributeDefinition' } }
        values: { type: object, maxProperties: 100, additionalProperties: { $ref: '#/components/schemas/AttributeValue' } }
    AttributesResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              attribute: { type: string }
              pass: { type: boolean }
              detail: { type: string, description: Why the value is outside its limits. }
        exceptions: { type: integer, description: Values outside their limits. }
    PickingRequest:
      type: object
      required: [postingDate, qty, batches]
      properties:
        postingDate: { type: string, format: date }
        qty: { $ref: '#/components/schemas/Quantity' }
        potency:
          type: object
          required: [attribute, min, max]
          properties:
            attribute: { type: string, minLength: 1, maxLength: 40 }
            min: { $ref: '#/components/schemas/Decimal' }
            max: { $ref: '#/components/schemas/Decimal' }
        overrideReason: { type: string, maxLength: 500, description: Audit reason for consuming expired batches (BR-24.10). }
        batches: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Batch' } }
    PickingResponse:
      type: object
      properties:
        picked:
          type: array
          items:
            type: object
            properties:
              batchId: { type: string }
              qty: { $ref: '#/components/schemas/Decimal' }
              expiry: { type: string, format: date }
              expiredOverride: { type: boolean, description: Picked on the consume-expired override; an EBR exception (BR-24.15). }
        excluded:
          type: array
          items:
            type: object
            properties:
              batchId: { type: string }
              code: { type: string, enum: [PMF-0003, PMF-0005, PMF-0016] }
              detail: { type: string }
        shortfall: { $ref: '#/components/schemas/Decimal' }
        overrideHeld: { type: boolean }
    StoredPickingRequest:
      type: object
      required: [itemId, postingDate, qty, onHand]
      properties:
        itemId: { type: string, format: uuid }
        postingDate: { type: string, format: date }
        qty: { $ref: '#/components/schemas/Quantity' }
        potency:
          type: object
          required: [min, max]
          properties:
            attribute: { type: string, minLength: 1, maxLength: 40, description: Defaults to the item's potency attribute. }
            min: { $ref: '#/components/schemas/Decimal' }
            max: { $ref: '#/components/schemas/Decimal' }
        overrideReason: { type: string, maxLength: 500, description: Audit reason for consuming expired batches (BR-24.10). }
        onHand:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [batchId, qty]
            properties:
              batchId: { type: string, format: uuid }
              qty: { $ref: '#/components/schemas/Decimal' }
    StoredPickingResponse:
      allOf:
        - $ref: '#/components/schemas/PickingResponse'
        - type: object
          properties:
            batchNumbers:
              type: object
              additionalProperties: { type: string }
              description: Batch number of each listed batch id.
    CreateReworkRequest:
      type: object
      required: [formulaId, batchSize, sourceBatchId, sourceVersion, sourceQty, reworkQty, outputQty]
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity. }
        formulaId: { type: string, format: uuid, description: The rework formula; it must make the item of the batch. }
        batchSize: { $ref: '#/components/schemas/Quantity', description: The batch size of the batch order made from the formula. }
        sourceBatchId: { type: string, format: uuid }
        sourceVersion: { type: integer, minimum: 1, description: The batch version the caller read. }
        sourceQty: { $ref: '#/components/schemas/Quantity', description: The quantity of the batch; the register keeps none. }
        reworkQty: { $ref: '#/components/schemas/Quantity', description: The quantity put in as the first ingredient, at most sourceQty. }
        outputQty: { $ref: '#/components/schemas/Quantity', description: The planned output quantity. }
        params:
          type: object
          additionalProperties: false
          properties:
            keepBatchNumber: { type: boolean, default: true }
            requireQualityOrder: { type: boolean, default: true }
            outputDisposition: { type: string, enum: [available, on-hold, quarantine], default: quarantine }
            capitalize: { type: boolean, default: false }
    ReworkOrder:
      type: object
      required: [id, legalEntityId, batchOrderId, orderNumber, orderStatus, sourceBatchId, sourceBatchNumber, itemId, inputQty, outputQty, keepBatchNumber, qualityOrderRequired, outputDisposition, varianceType, status, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        batchOrderId: { type: string, format: uuid, description: The batch order that does the work; it runs through release, start, report-finished and end. }
        orderNumber: { type: string }
        orderStatus: { type: string, enum: [planned, released, started, reported, ended, closed], description: The status of the batch order. }
        sourceBatchId: { type: string, format: uuid }
        sourceBatchNumber: { type: string }
        itemId: { type: string, format: uuid }
        inputQty: { $ref: '#/components/schemas/Quantity' }
        outputQty: { $ref: '#/components/schemas/Quantity' }
        keepBatchNumber: { type: boolean }
        qualityOrderRequired: { type: boolean }
        outputDisposition: { type: string, enum: [available, on-hold, quarantine] }
        varianceType: { type: string, enum: [rework, capitalized] }
        status: { type: string, enum: [planned, received] }
        outputBatchId: { type: string, format: uuid, description: Set once received; the source batch itself when its number is kept. }
        outputBatchNumber: { type: string }
        receivedQty: { $ref: '#/components/schemas/Quantity' }
        receivedBy: { type: string }
        receivedAt: { type: string, format: date-time }
        version: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReworkRequest:
      type: object
      required: [batch, reworkQty, outputQty]
      properties:
        batch: { $ref: '#/components/schemas/Batch' }
        reworkQty: { $ref: '#/components/schemas/Quantity' }
        outputQty: { $ref: '#/components/schemas/Quantity' }
        params:
          type: object
          additionalProperties: false
          properties:
            keepBatchNumber: { type: boolean, default: true }
            requireQualityOrder: { type: boolean, default: true }
            outputDisposition: { type: string, enum: [available, on-hold, quarantine], default: quarantine }
            capitalize: { type: boolean, default: false }
    ReworkResponse:
      type: object
      properties:
        sourceBatchId: { type: string }
        reworkQty: { $ref: '#/components/schemas/Decimal' }
        outputBatchId: { type: [string, 'null'], description: The kept batch number, or null for a new number drawn at report as finished. }
        outputQty: { $ref: '#/components/schemas/Decimal' }
        outputDisposition: { $ref: '#/components/schemas/Disposition' }
        qualityOrderRequired: { type: boolean }
        varianceType: { type: string, enum: [rework, capitalized] }
        parents: { type: array, items: { type: string } }
    RecordStatus:
      type: string
      enum: [in-review, approved, sealed]
    RecordProfileRequest:
      type: object
      required: [code, itemId]
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity. }
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_.-]{0,39}$' }
        itemId: { type: string, format: uuid }
        approvalRequiredForRelease: { type: boolean, default: true, description: When true a batch of the item is released (disposition available) only with an approved or sealed record (PMF-0015). }
    RecordProfile:
      type: object
      required: [id, legalEntityId, code, itemId, approvalRequiredForRelease, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string }
        itemId: { type: string, format: uuid }
        approvalRequiredForRelease: { type: boolean }
        retiredAt: { type: string, format: date-time }
        retiredBy: { type: string }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CompileRecordRequest:
      type: object
      required: [batchId]
      properties:
        batchId: { type: string, format: uuid, description: A registered batch that is linked to a batch order. }
    RaiseExceptionRequest:
      type: object
      required: [version, description]
      properties:
        version: { type: integer, minimum: 1, description: The record version the caller read. }
        description: { type: string, minLength: 1, maxLength: 500 }
        severity: { type: string, enum: [minor, major, critical], default: major }
    DispositionExceptionRequest:
      type: object
      required: [version, disposition, signatureId]
      properties:
        version: { type: integer, minimum: 1, description: The record version the caller read. }
        disposition: { type: string, enum: [accepted, deviation-raised, rejected] }
        comment: { type: string, maxLength: 500 }
        signatureId: { type: string, format: uuid, description: 'The electronic signature (FR-24.22) meant to back the decision. NOT VERIFIED: stored as given until the signature service exists.' }
    RecordException:
      type: object
      required: [id, sourceType, sourceId, description, severity, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        sourceType: { type: string, enum: [attribute, manual], description: attribute for a recorded value outside its limits, manual for one a reviewer raised. }
        sourceId: { type: string, description: The attribute history row, or the exception's own id. }
        description: { type: string }
        severity: { type: string, enum: [minor, major, critical] }
        disposition: { type: string, enum: [accepted, deviation-raised, rejected], description: Absent while the exception is open. }
        dispositionComment: { type: string }
        signatureId: { type: string, format: uuid }
        dispositionedBy: { type: string }
        dispositionedAt: { type: string, format: date-time }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    ElectronicBatchRecord:
      type: object
      required: [id, legalEntityId, batchOrderId, batchId, batchNumber, itemId, profileId, status, compiledAt, version, exceptionCount, openExceptions, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        batchOrderId: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        batchNumber: { type: string }
        itemId: { type: string, format: uuid }
        profileId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RecordStatus' }
        compiledAt: { type: string, format: date-time }
        approvedBy: { type: string }
        approvedAt: { type: string, format: date-time }
        sealedBy: { type: string }
        sealedAt: { type: string, format: date-time }
        contentHash: { type: string, description: Hex SHA-256 of sealedDocument; set when sealed. }
        version: { type: integer, minimum: 1 }
        exceptionCount: { type: integer }
        openExceptions: { type: integer, description: Exceptions without a disposition and signature. }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        content: { type: object, additionalProperties: true, description: 'The compiled sections, batchOrder and batch. Only on the detail.' }
        sealedDocument: { type: string, description: 'The canonical JSON document that was hashed (recordId, batch and profile ids, compiledAt, approvedBy, approvedAt, sealedBy, sealedAt, signaturesVerified, content, exceptions). Only on a sealed record''s detail.' }
        exceptions: { type: array, items: { $ref: '#/components/schemas/RecordException' }, description: Only on the detail and the commands. }
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type: { type: string, example: 'https://passage.dev/problems/PMF-0001' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors: { type: object, additionalProperties: { type: string } }
  responses:
    Problem:
      description: Problem details (application/problem+json).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
