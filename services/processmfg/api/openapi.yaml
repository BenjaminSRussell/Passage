openapi: 3.1.0
info:
  title: Passage Process Manufacturing
  version: 0.7.0
  description: >
    Process manufacturing (wave 24, PSG-24 slices 1 to 3, 9, 11 to 15): formulas, batch orders
    scaled from a formula snapshot, the potency, catch-weight and co-product
    allocation calculators (slice 1), the batch derivation, merge, consolidation,
    customer requirement and EBR approval previews (slice 2), and the batch
    attribute check, the picking proposal and the rework plan (slice 3), and the
    batch-order lifecycle with co-product cost allocation at End (slice 9), and the batch quality record: attribute definitions, batches, recorded attribute values with the limit check and the disposition with its history (slice 11), the merge of stored batches with its genealogy (slice 13), and the customer batch requirements with the requirement check over stored batches (slice 14), and the electronic batch record: profiles, compilation, review by exception, approval and the sealed content hash (slice 15). Routes
    match the handlers in internal/api (checked by internal/api/openapi_test.go).
    Errors are RFC 9457 problem details (application/problem+json) with a stable
    `code`; see README.md. The gateway routes /api/v1/production/* paths listed
    here to this service.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/production/formulas:
    post:
      operationId: createFormula
      summary: Create a formula with its lines (FR-24.1)
      x-passage-duty: production.formula.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FormulaRequest' } } }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true. Writes dev.passage.production.formula.created.v1.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Formula' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409':
          description: PMF-0103 when the code is taken.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: PMF-0001 when percent-controlled scalable lines do not sum to 100 within ±0.01 (AC-24.9); idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listFormulas
      summary: Formulas ordered by code (lines omitted; lineCount given)
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Formulas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Formula' } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/formulas/{id}:
    get:
      operationId: getFormula
      summary: One formula with its lines
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The formula
          content: { application/json: { schema: { $ref: '#/components/schemas/Formula' } } }
        '404':
          description: PMF-0101
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/formulas/{id}:scale:
    post:
      operationId: previewScale
      summary: Preview a formula at a batch size without writing (BR-24.1)
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchSize]
              properties:
                batchSize: { $ref: '#/components/schemas/Quantity' }
      responses:
        '200':
          description: Scaled lines. The scalable input lines sum exactly to their unrounded total; the rounding residual sits on the largest of them.
          content: { application/json: { schema: { $ref: '#/components/schemas/ScaleResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0101
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-orders:
    post:
      operationId: createBatchOrder
      summary: Create a batch order from a formula at a batch size (FR-24.2, BR-24.1)
      x-passage-duty: production.batch-order.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrderRequest' } } }
      responses:
        '201':
          description: 'Created in status planned with number BO-nnnnnn per legal entity. A replay returns 200 with Idempotent-Replayed: true. Writes dev.passage.production.batchorder.created.v1.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrder' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403':
          description: AUTH-0003 when the duty is missing or legalEntityId is outside the caller's scope.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: PMF-0101 when the formula does not exist.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listBatchOrders
      summary: Batch orders, newest first (lines omitted)
      x-passage-duty: production.batch-order.read
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: formulaId, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Batch orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BatchOrder' } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-orders/{id}:
    get:
      operationId: getBatchOrder
      summary: One batch order with its scaled lines
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The batch order
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrder' } } }
        '404':
          description: PMF-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-orders/{id}:rescale:
    post:
      operationId: rescaleBatchOrder
      summary: Change the batch size before the order starts (PRD 4.24.5)
      x-passage-duty: production.batch-order.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchSize, version]
              properties:
                batchSize: { $ref: '#/components/schemas/Quantity' }
                version: { type: integer, minimum: 1, description: The order version the caller read (optimistic concurrency). }
      responses:
        '200':
          description: 'The rescaled order with version + 1; the snapshot lines are re-scaled. A replay returns the first answer with Idempotent-Replayed: true. Writes dev.passage.production.batchorder.rescaled.v1.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrder' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0105 when the order has started.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-orders/{id}:release:
    post:
      operationId: releaseBatchOrder
      summary: Release a planned batch order (PRD 4.24.5)
      x-passage-duty: production.batch-order.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } }
      responses:
        '200':
          description: 'The released order with version + 1. Writes dev.passage.production.batchorder.statechanged.v1. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrder' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0106 when the order is not planned.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-orders/{id}:start:
    post:
      operationId: startBatchOrder
      summary: Start a released batch order (PRD 4.24.5)
      x-passage-duty: production.batch-order.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } }
      responses:
        '200':
          description: 'The started order with version + 1; it can no longer be rescaled. Writes dev.passage.production.batchorder.statechanged.v1. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrder' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0106 when the order is not released.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-orders/{id}:report-finished:
    post:
      operationId: reportBatchOrderFinished
      summary: Report the finished quantities of a started batch order (RAF)
      x-passage-duty: production.batch-order.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReportRequest' } } }
      responses:
        '200':
          description: 'The reported order with the main quantity and the reported quantity of each co- and by-product line. Writes dev.passage.production.batchorder.statechanged.v1 with the outputs. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrder' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0106 when the order is not started.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: PMF-0107 when a reported quantity is invalid; idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-orders/{id}:end:
    post:
      operationId: endBatchOrder
      summary: End a reported batch order and allocate its cost (FR-24.4, BR-24.3)
      x-passage-duty: production.journal.post
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EndRequest' } } }
      responses:
        '200':
          description: 'The ended order with its allocation; the shares add up to the batch cost exactly. Writes dev.passage.production.batchorder.statechanged.v1 and dev.passage.production.coproduct.allocated.v1 in one transaction. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrder' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0106 when the order is not reported.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: PMF-0021 when the by-product burden exceeds the batch cost or the allocation weights sum to zero; PMF-0107 when no quantity was reported; idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/potency:consume:
    post:
      operationId: consumePotency
      summary: Potency-based consumption of an active-ingredient line (BR-24.2)
      x-passage-duty: production.batch-order.read
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PotencyRequest' } } }
      responses:
        '200':
          description: Active-ingredient quantity and the compensating line after adjustment.
          content: { application/json: { schema: { $ref: '#/components/schemas/PotencyResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422':
          description: PMF-0002 (POTENCY_COMPENSATION_NEGATIVE) when the compensating line would become negative.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/catch-weight:validate:
    post:
      operationId: validateCatchWeight
      summary: Validate a catch-weight receipt or RAF weight (BR-24.5)
      x-passage-duty: production.batch-order.read
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CatchWeightRequest' } } }
      responses:
        '200':
          description: The weight is within min × units to max × units.
          content: { application/json: { schema: { $ref: '#/components/schemas/Valid' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422':
          description: PMF-0004 when the weight is outside min × units to max × units.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/co-products:allocate:
    post:
      operationId: allocateCoProducts
      summary: Preview co-product and by-product cost allocation (FR-24.4, BR-24.3)
      x-passage-duty: production.journal.post
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AllocateRequest' } } }
      responses:
        '200':
          description: Allocated amounts (4 decimals, BR-24.3). Main + co-products + by-product burdens equal the batch cost exactly.
          content: { application/json: { schema: { $ref: '#/components/schemas/AllocateResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422':
          description: PMF-0021 when weights sum to zero or burdens exceed the batch cost.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-derivation:preview:
    post:
      operationId: previewBatchDerivation
      summary: Preview a batch attribute or shelf-life derivation from sender batches (FR-24.15, BR-24.11)
      description: Stores nothing. Senders without a value of the rule's kind are left out of the aggregation and listed in missingSenders with warningCode PMF-0007.
      x-passage-duty: production.batch-attribute.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeriveRequest' } } }
      responses:
        '200':
          description: The derived receiver value and the senders without a value.
          content: { application/json: { schema: { $ref: '#/components/schemas/DeriveResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-merge:preview:
    post:
      operationId: previewBatchMerge
      summary: Preview the target batch of a merge (FR-24.16)
      description: Numeric attributes become the quantity-weighted average, dates the earliest, text must agree unless listed in mergeOverride (then the largest batch's text wins). Cost per unit is the weighted average. Stores nothing.
      x-passage-duty: production.batch.merge
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MergeRequest' } } }
      responses:
        '200':
          description: The target batch.
          content: { application/json: { schema: { $ref: '#/components/schemas/MergeResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422':
          description: PMF-0006 when the batches differ in item, warehouse, catch-weight unit, disposition, the kind of an attribute, or a text attribute that is not merge-override.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-requirements:check:
    post:
      operationId: checkBatchRequirements
      summary: Customer batch requirement check for a line (FR-24.19, BR-24.13)
      description: Resolves the requirement rows by precedence (customer over customer group over item default, field by field), then splits the batches into qualifying and excluded (PMF-0009 with a reason). Only available batches that are not expired on the ship date qualify.
      x-passage-duty: production.batch-order.read
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CheckRequest' } } }
      responses:
        '200':
          description: The resolved requirement, qualifying and excluded batches, and the same-batch pick.
          content: { application/json: { schema: { $ref: '#/components/schemas/CheckResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409':
          description: PMF-0008 (SAME_BATCH_UNAVAILABLE) when the line is same-batch and no qualifying batch holds its whole quantity; the detail names the largest available quantity.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/bulk-consolidation:preview:
    post:
      operationId: previewBulkConsolidation
      summary: Size the bulk batch orders for packed orders and peg them by due date (FR-24.17, BR-24.12)
      x-passage-duty: production.batch-order.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConsolidateRequest' } } }
      responses:
        '200':
          description: The bulk orders, each with the packing orders pegged to it.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConsolidateResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-records:approve-check:
    post:
      operationId: checkBatchRecordApproval
      summary: Whether a batch record can be approved (BR-24.15 review by exception)
      x-passage-duty: production.batch-record.approve
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ApproveCheckRequest' } } }
      responses:
        '200':
          description: Every exception has a disposition and a signature.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApproveCheckResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422':
          description: PMF-0014 while any exception lacks a disposition or a signature.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-attributes:check:
    post:
      operationId: checkBatchAttributes
      summary: Check recorded batch attribute values against the item's definitions (FR-24.5)
      description: Refuses (400) an attribute the item does not define, a value of the wrong type for its kind, an enum value that is not an option, and invalid definitions. A numeric value outside min/max is accepted with pass false and counted in exceptions, because it is recorded and becomes an EBR exception (BR-24.15). Stores nothing.
      x-passage-duty: production.batch-attribute.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AttributesRequest' } } }
      responses:
        '200':
          description: One result per recorded value, sorted by attribute.
          content: { application/json: { schema: { $ref: '#/components/schemas/AttributesResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-picking:proposal:
    post:
      operationId: proposeBatchPicking
      summary: Propose the batches a line consumes (FR-24.3, FR-24.5, FR-24.6, BR-24.10)
      description: >-
        Available batches only, expiry first (FEFO; batches without expiry last), with potency inside the line's band.
        Excluded batches carry their code: PMF-0016 for a disposition other than available (AC-24.10), PMF-0003
        (BATCH_EXPIRED) for an expiry before the posting date (AC-24.4), PMF-0005 for potency outside the band or not
        recorded. Expired batches are eligible only when the caller holds production.batch.consume-expired and gives
        overrideReason (at least 10 characters, else 400); they are flagged expiredOverride. Stores nothing. This is a
        what-if preview for batches that are not in the batch register: a batch id the register holds in the caller's
        scope is refused with 409 PMF-0112, because its disposition and expiry are on record; propose it with
        batch-picking:propose-stored.
      x-passage-duty: production.batch-order.read
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PickingRequest' } } }
      responses:
        '200':
          description: The picked batches with the quantity taken from each, the excluded batches and the shortfall.
          content: { application/json: { schema: { $ref: '#/components/schemas/PickingResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409':
          description: A listed batch is in the batch register (PMF-0112); use batch-picking:propose-stored.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-picking:propose-stored:
    post:
      operationId: proposeStoredBatchPicking
      summary: Propose the batches a line consumes from the stored batch register (FR-24.3, FR-24.5, FR-24.6)
      description: >-
        The same rules and codes as batch-picking:proposal (PMF-0016, PMF-0003, PMF-0005, the consume-expired override
        of BR-24.10), but the disposition, expiry date and current attribute values of each batch are read from the
        batch quality record, so a batch put on hold or past its expiry cannot be picked by leaving that out. The
        register keeps no quantity, so the caller passes the on-hand quantity per batch. The potency attribute
        defaults to the item's potency attribute. A batch that does not exist in the caller's scope is 404 PMF-0108;
        a batch of another item is 400. Stores nothing.
      x-passage-duty: production.batch-order.read
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StoredPickingRequest' } } }
      responses:
        '200':
          description: The picked batches, the excluded batches with their codes, the shortfall and the batch numbers.
          content: { application/json: { schema: { $ref: '#/components/schemas/StoredPickingResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: A listed batch does not exist (PMF-0108).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/customer-batch-requirements:
    post:
      operationId: createCustomerBatchRequirement
      summary: Define a customer batch requirement for an item (FR-24.19, BR-24.13)
      description: A rule for an item at one scope (a customer, a customer group or everyone) that sets sellable days (minimum remaining shelf life at shipment, 0 to 3650), a numeric range for one attribute and the same-batch flag; it sets at least one. When a line is checked, each field (sellable days, the same-batch flag, each attribute range) comes from the most specific rule that sets it (customer over customer group over item default, BR-24.13); within one scope the rule that started last wins (no validFrom counts as earliest), then the one defined last, so a rule with a later validFrom takes over from an open-ended one from that day. A rule is never edited; retire it, or define its successor with a later validFrom. customerId and customerGroupId are references to party and sales master data, checked for form (UUID) only. legalEntityId defaults to the caller's legal entity. Writes dev.passage.production.batchrequirement.defined.v1 in the same transaction.
      x-passage-duty: production.batch-requirement.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerRequirementRequest' } } }
      responses:
        '201':
          description: 'The stored rule at version 1. A replay returns 200 with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CustomerRequirement' } } }
        '400':
          description: COM-0001 for a malformed body, a rule that sets nothing, a customer and a group together, sellable days outside 0 to 3650, a range without an attribute (or the reverse) or with min above max, or dates out of order.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403':
          description: AUTH-0003 when the legal entity is outside the caller's scope.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCustomerBatchRequirements
      summary: Customer batch requirements by item, oldest first
      description: Filter by legal entity, item, customer or customer group. With activeOn the list keeps the rules in force that day and not retired; without it retired rules are listed too.
      x-passage-duty: production.batch-order.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: customerGroupId, in: query, schema: { type: string, format: uuid } }
        - { name: activeOn, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The rules.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CustomerRequirement' } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/customer-batch-requirements/{id}:
    get:
      operationId: getCustomerBatchRequirement
      summary: One customer batch requirement
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The rule, with its version and whether it is retired.
          content: { application/json: { schema: { $ref: '#/components/schemas/CustomerRequirement' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0113
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/customer-batch-requirements/{id}:retire:
    post:
      operationId: retireCustomerBatchRequirement
      summary: Retire a customer batch requirement
      description: The rule stops applying at once and stays on record. Writes dev.passage.production.batchrequirement.retired.v1 in the same transaction.
      x-passage-duty: production.batch-requirement.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } }
      responses:
        '200':
          description: 'The retired rule at version + 1. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CustomerRequirement' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0113
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0114 when the rule is already retired.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/inheritance-rules:
    post:
      operationId: createInheritanceRule
      summary: Define how a batch attribute is derived from its sender batches (FR-24.15)
      description: One active rule per item and attribute (PMF-0127; retire it to replace it). The item must define the attribute (400 COM-0001 otherwise) and the aggregation must fit its kind (min, max and weighted-average need a numeric attribute, earliest-date and latest-date a date, copy any kind) and a fixed rule carries one value (num, text or date) of the attribute kind. decimals (0 to 6, default 4) applies to weighted-average only (BR-24.11). legalEntityId defaults to the caller's legal entity. Writes dev.passage.production.inheritancerule.defined.v1 in the same transaction. A rule is never edited.
      x-passage-duty: production.inheritance-rule.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InheritanceRuleRequest' } } }
      responses:
        '201':
          description: 'The stored rule at version 1. A replay returns 200 with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/InheritanceRule' } } }
        '400':
          description: COM-0001 for a malformed body, an unknown aggregation, an attribute the item does not define, an aggregation that does not fit the attribute kind, decimals on another aggregation or a fixed value of the wrong kind.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403':
          description: AUTH-0003 when the legal entity is outside the caller's scope.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0127 when the item already has an active rule for the attribute.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listInheritanceRules
      summary: Inheritance rules by item and attribute
      description: Filter by legal entity and item; active=true leaves out retired rules.
      x-passage-duty: production.batch-order.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
        - { name: active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The rules.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InheritanceRule' } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/inheritance-rules/{id}:
    get:
      operationId: getInheritanceRule
      summary: One inheritance rule
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The rule, with its version and whether it is retired.
          content: { application/json: { schema: { $ref: '#/components/schemas/InheritanceRule' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0126
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/inheritance-rules/{id}:retire:
    post:
      operationId: retireInheritanceRule
      summary: Retire an inheritance rule
      description: The rule stops applying to later derivations; batches derived earlier keep their values and their log. Writes dev.passage.production.inheritancerule.retired.v1 in the same transaction.
      x-passage-duty: production.inheritance-rule.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } }
      responses:
        '200':
          description: 'The retired rule at version + 1. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/InheritanceRule' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0126
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0128 when the rule is already retired.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batches/{id}:derive:
    post:
      operationId: deriveBatchAttributes
      summary: Derive a batch's attributes from its sender batches (FR-24.15, AC-24.11)
      description: For each active inheritance rule of the receiver's item, reads the senders' current value of the attribute from the batch register, derives the receiver value (copy needs one distinct value; weighted-average weights by the quantity given per sender and rounds to the rule's decimals, BR-24.11), records it in the receiver's attribute history (checked against its definitions, so the expiry attribute sets the expiry date) and logs the derivation with the senders used and those without a value (a PMF-0007 warning; the attribute is left as it was when no sender has a value). Running it again re-derives from the senders given and moves the version. Senders must be other batches of the receiver's legal entity (400 otherwise) and none may descend from the receiver through the latest derivation of each batch (422 PMF-0130, a derivation cycle); the register keeps no quantity, so the caller passes the quantity consumed from each and it is not checked against the sender's stock or the consumption posted. The log keeps the receiver value before and after. Writes dev.passage.production.batch.attributesrecorded.v1 and dev.passage.production.batch.derived.v1 in the same transaction.
      x-passage-duty: production.batch-attribute.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeriveStoredRequest' } } }
      responses:
        '200':
          description: 'The receiver at its new version, the value each rule derived and the PMF-0007 warnings. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/DeriveStoredResponse' } } }
        '400':
          description: COM-0001 for a malformed body, a sender that is the receiver, belongs to another legal entity or is listed twice, a copy rule whose senders disagree, or a weighted average over a sender with a value and no consumed quantity.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: PMF-0108 when the receiver or a sender does not exist in the caller's scope.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the receiver version is stale.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: PMF-0129 when the item has no active rule; PMF-0130 when a sender descends from the receiver (a derivation cycle); idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-derivations:
    get:
      operationId: listBatchDerivations
      summary: Derivation log (the derivation monitor, FR-24.15)
      description: Every derivation of a rule on a receiver batch, newest first, with the receiver value before, the value derived, the senders used and the senders without a value. Filter by receiver batch or item; withMissing=true keeps the derivations that had senders without a value.
      x-passage-duty: production.batch-order.read
      parameters:
        - { name: batchId, in: query, schema: { type: string, format: uuid } }
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
        - { name: withMissing, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The log rows.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Derivation' } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-requirements:check-stored:
    post:
      operationId: checkStoredBatchRequirements
      summary: Check stored batches against a customer's stored requirements (FR-24.19, AC-24.14)
      description: >-
        Resolves the stored rules of the legal entity (default the caller's) for the item that are in force on the
        ship date and apply to the customer, the customer's group or everyone (customer over group over item default,
        field by field; within a scope the rule that started last, then the one defined last), reads the disposition,
        expiry and attribute values of each batch from the batch register, and splits the batches into qualifying and
        excluded (PMF-0009 with the reason) as batch-requirements:check does. The register keeps no quantity, so the
        caller passes the on-hand quantity per batch. A batch outside the caller's scope is 404 PMF-0108; one of another
        item is 400. The customer and group ids are references to party and sales master data, checked for form only;
        the caller names the customer's group. The ship date and the batch expiry are calendar days compared as such
        (expiry − ship date ≥ sellable days, BR-24.13) with no time-zone conversion; send the shipping site's local
        day. Stores nothing.
      x-passage-duty: production.batch-order.read
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CheckStoredRequest' } } }
      responses:
        '200':
          description: The resolved requirement, the rules it came from, the qualifying and excluded batches, the same-batch pick and the batch numbers.
          content: { application/json: { schema: { $ref: '#/components/schemas/CheckStoredResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403':
          description: AUTH-0003 when the legal entity is outside the caller's scope.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: A listed batch does not exist (PMF-0108).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0008 (SAME_BATCH_UNAVAILABLE) when the line is same-batch and no qualifying batch holds its whole quantity; the detail names the largest available quantity.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/rework-orders:preview:
    post:
      operationId: previewReworkOrder
      summary: Plan a rework batch order for a batch (FR-24.18, AC-24.18)
      description: The batch, or part of it, is the first ingredient. Omitted parameters take the FR-24.18 defaults (keepBatchNumber true, requireQualityOrder true, outputDisposition quarantine, capitalize false). The output cannot be available while a quality order is required. Stores nothing.
      x-passage-duty: production.batch-order.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReworkRequest' } } }
      responses:
        '200':
          description: The rework plan.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReworkResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/rework-orders:
    post:
      operationId: createReworkOrder
      summary: Create a rework batch order from a stored batch (FR-24.18, AC-24.18)
      description: >-
        Plans the rework as rework-orders:preview does (a quantity of the batch, at most its quantity; the output cannot
        be available while a quality order is required), creates the batch order from the rework formula at the batch
        size, which must make the item of the batch, and links it to the batch with the quantity put in, the planned
        output and the parameters. The register keeps no quantity, so the caller gives the quantity of the batch and the
        version of the batch it read; the batch is locked and a hold, disposition change or merge since then is
        PMF-0104. The batch version moves by one, so a merge, derivation or disposition change based on the version read
        before the rework is refused as stale in turn. A batch has at most one open rework order (PMF-0132). Writes dev.passage.production.batchorder.created.v1 and
        dev.passage.production.reworkorder.created.v1 in the same transaction.
      x-passage-duty: production.batch-order.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateReworkRequest' } } }
      responses:
        '201':
          description: 'The rework order at version 1, status planned. A replay returns 200 with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ReworkOrder' } } }
        '400':
          description: COM-0001 for a malformed body, a rework quantity above the batch quantity, a refused output disposition, a rework formula that makes another item or a batch of another legal entity.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403':
          description: AUTH-0003 when the legal entity is outside the caller's scope.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: PMF-0108 when the batch is not in the caller's scope; PMF-0101 when the formula is not found.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the batch version is stale; PMF-0132 when the batch already has an open rework order.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listReworkOrders
      summary: List rework batch orders
      description: Newest first, optionally for one status or one source batch.
      x-passage-duty: production.batch-order.read
      parameters:
        - name: status
          in: query
          description: Only rework orders in this status.
          schema: { type: string, enum: [planned, received] }
        - name: sourceBatchId
          in: query
          description: Only rework orders of this batch.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The rework orders, newest first, without a next page (at most 200).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReworkOrder' } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/rework-orders/{id}:
    get:
      operationId: getReworkOrder
      summary: Read a rework batch order
      description: The order with its batch order, the batch it reworks and, once received, the batch that holds the output.
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The rework order.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReworkOrder' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0131
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/rework-orders/{id}:receive:
    post:
      operationId: receiveReworkOrder
      summary: Receive the output of a rework batch order (FR-24.18)
      description: >-
        Allowed once the batch order is reported as finished (PMF-0134 before), and once. A rework that keeps the batch
        number moves the batch to the planned output disposition (history reason "Rework <order number>"); one that does
        not registers a new batch under newBatchNumber, on that disposition, with a genealogy link to the source
        (relation rework, the quantity put in, cost 0 as the register keeps none). A move to available is gated by the
        item's batch record profile (PMF-0015). An output planned as available releases the batch, so the caller also
        needs the duty production.batch-disposition.write (Maintain batch disposition), else AUTH-0003 and nothing is
        written. The quantity reported on the order is the received quantity. Writes
        dev.passage.production.reworkorder.received.v1, with batch.dispositionchanged or batch.registered, in the same
        transaction.
      x-passage-duty: production.batch-order.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1, description: The rework order version the caller read. }
                newBatchNumber: { type: string, maxLength: 40, description: Required when the rework does not keep the batch number; refused when it does. }
      responses:
        '200':
          description: 'The rework order at status received with its output batch. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ReworkOrder' } } }
        '400':
          description: COM-0001 for a malformed body, a batch number given when the number is kept or missing when it is not.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403':
          description: AUTH-0003 when the output is planned as available and the caller lacks production.batch-disposition.write.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: PMF-0131
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0133 when the output was already received; PMF-0109 when the new batch number already exists for the item.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: PMF-0134 when the batch order is not reported as finished; PMF-0015 when the output would be available and the batch record profile requires an approved record; idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: healthz
      summary: Liveness
      security: []
      responses:
        '200': { description: Process is up }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness (Postgres reachable)
      security: []
      responses:
        '200': { description: Ready }
        '503': { description: Database unreachable }
  /v1/production/batch-attribute-definitions:
    post:
      operationId: defineBatchAttribute
      summary: Define a batch attribute of an item (FR-24.5)
      x-passage-duty: production.batch-attribute.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchAttributeDefinitionRequest' } } }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true. Writes dev.passage.production.batchattribute.defined.v1.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchAttributeDefinition' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409':
          description: PMF-0110 when the item already defines an attribute of that name, or already has a potency attribute.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listBatchAttributeDefinitions
      summary: Batch attribute definitions by item and name
      x-passage-duty: production.batch-order.read
      parameters:
        - { name: itemId, in: query, description: Only the definitions of this item., schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Definitions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BatchAttributeDefinition' } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batches:
    post:
      operationId: registerBatch
      summary: Register a batch for quality records (FR-24.5)
      x-passage-duty: production.batch-attribute.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchRequest' } } }
      responses:
        '201':
          description: 'Created at version 1 (disposition defaults to available). A replay returns 200 with Idempotent-Replayed: true. Writes dev.passage.production.batch.registered.v1.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchRecord' } } }
        '400':
          description: COM-0001 for a malformed body, or a batch order of another legal entity than the batch.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403':
          description: AUTH-0003 when the duty is missing or legalEntityId is outside the caller's scope.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: PMF-0102 when batchOrderId names no batch order in the caller's scope.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0109 when the item already has a batch with that number.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: PMF-0015 when the batch is registered as available while its item has a batch record profile that requires an approved record; idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listBatches
      summary: Batches, newest first (attributes and histories omitted)
      x-passage-duty: production.batch-order.read
      parameters:
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
        - { name: disposition, in: query, schema: { $ref: '#/components/schemas/Disposition' } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Batches
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BatchRecord' } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batches/{id}:
    get:
      operationId: getBatch
      summary: One batch with its current attributes and both histories
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The batch
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchRecord' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0108
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batches/{id}/attributes:
    put:
      operationId: recordBatchAttributes
      summary: Record attribute values on a batch with the limit check (FR-24.5)
      x-passage-duty: production.batch-attribute.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecordAttributesRequest' } } }
      responses:
        '200':
          description: 'The batch at version + 1 and the check of each value; a numeric value outside min/max is recorded with pass false (an EBR exception, BR-24.15). A date under the expiry attribute sets expiryDate. Writes dev.passage.production.batch.attributesrecorded.v1. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/AttributesResult' } } }
        '400':
          description: COM-0001 for a malformed body, an attribute the item does not define, a value of the wrong type or an enum value that is not an option.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: PMF-0108
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
