openapi: 3.1.0
info:
  title: Passage Process Manufacturing
  version: 0.4.0
  description: >
    Process manufacturing (wave 24, PSG-24 slices 1 to 3, 9 and 11): formulas, batch orders
    scaled from a formula snapshot, the potency, catch-weight and co-product
    allocation calculators (slice 1), the batch derivation, merge, consolidation,
    customer requirement and EBR approval previews (slice 2), and the batch
    attribute check, the picking proposal and the rework plan (slice 3), and the
    batch-order lifecycle with co-product cost allocation at End (slice 9), and the batch quality record: attribute definitions, batches, recorded attribute values with the limit check and the disposition with its history (slice 11). Routes
    match the handlers in internal/api (checked by internal/api/openapi_test.go).
    Errors are RFC 9457 problem details (application/problem+json) with a stable
    `code`; see README.md. The gateway routes /api/v1/production/* paths listed
    here to this service.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/production/formulas:
    post:
      operationId: createFormula
      summary: Create a formula with its lines (FR-24.1)
      x-passage-duty: production.formula.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FormulaRequest' } } }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true. Writes dev.passage.production.formula.created.v1.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Formula' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409':
          description: PMF-0103 when the code is taken.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: PMF-0001 when percent-controlled scalable lines do not sum to 100 within ±0.01 (AC-24.9); idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listFormulas
      summary: Formulas ordered by code (lines omitted; lineCount given)
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Formulas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Formula' } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/formulas/{id}:
    get:
      operationId: getFormula
      summary: One formula with its lines
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The formula
          content: { application/json: { schema: { $ref: '#/components/schemas/Formula' } } }
        '404':
          description: PMF-0101
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/formulas/{id}:scale:
    post:
      operationId: previewScale
      summary: Preview a formula at a batch size without writing (BR-24.1)
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchSize]
              properties:
                batchSize: { $ref: '#/components/schemas/Quantity' }
      responses:
        '200':
          description: Scaled lines. The scalable input lines sum exactly to their unrounded total; the rounding residual sits on the largest of them.
          content: { application/json: { schema: { $ref: '#/components/schemas/ScaleResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0101
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-orders:
    post:
      operationId: createBatchOrder
      summary: Create a batch order from a formula at a batch size (FR-24.2, BR-24.1)
      x-passage-duty: production.batch-order.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrderRequest' } } }
      responses:
        '201':
          description: 'Created in status planned with number BO-nnnnnn per legal entity. A replay returns 200 with Idempotent-Replayed: true. Writes dev.passage.production.batchorder.created.v1.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrder' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403':
          description: AUTH-0003 when the duty is missing or legalEntityId is outside the caller's scope.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: PMF-0101 when the formula does not exist.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listBatchOrders
      summary: Batch orders, newest first (lines omitted)
      x-passage-duty: production.batch-order.read
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: formulaId, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Batch orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BatchOrder' } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-orders/{id}:
    get:
      operationId: getBatchOrder
      summary: One batch order with its scaled lines
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The batch order
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrder' } } }
        '404':
          description: PMF-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-orders/{id}:rescale:
    post:
      operationId: rescaleBatchOrder
      summary: Change the batch size before the order starts (PRD 4.24.5)
      x-passage-duty: production.batch-order.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchSize, version]
              properties:
                batchSize: { $ref: '#/components/schemas/Quantity' }
                version: { type: integer, minimum: 1, description: The order version the caller read (optimistic concurrency). }
      responses:
        '200':
          description: 'The rescaled order with version + 1; the snapshot lines are re-scaled. A replay returns the first answer with Idempotent-Replayed: true. Writes dev.passage.production.batchorder.rescaled.v1.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrder' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0105 when the order has started.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-orders/{id}:release:
    post:
      operationId: releaseBatchOrder
      summary: Release a planned batch order (PRD 4.24.5)
      x-passage-duty: production.batch-order.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } }
      responses:
        '200':
          description: 'The released order with version + 1. Writes dev.passage.production.batchorder.statechanged.v1. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrder' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0106 when the order is not planned.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-orders/{id}:start:
    post:
      operationId: startBatchOrder
      summary: Start a released batch order (PRD 4.24.5)
      x-passage-duty: production.batch-order.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } }
      responses:
        '200':
          description: 'The started order with version + 1; it can no longer be rescaled. Writes dev.passage.production.batchorder.statechanged.v1. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrder' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0106 when the order is not released.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-orders/{id}:report-finished:
    post:
      operationId: reportBatchOrderFinished
      summary: Report the finished quantities of a started batch order (RAF)
      x-passage-duty: production.batch-order.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReportRequest' } } }
      responses:
        '200':
          description: 'The reported order with the main quantity and the reported quantity of each co- and by-product line. Writes dev.passage.production.batchorder.statechanged.v1 with the outputs. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrder' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0106 when the order is not started.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: PMF-0107 when a reported quantity is invalid; idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-orders/{id}:end:
    post:
      operationId: endBatchOrder
      summary: End a reported batch order and allocate its cost (FR-24.4, BR-24.3)
      x-passage-duty: production.journal.post
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EndRequest' } } }
      responses:
        '200':
          description: 'The ended order with its allocation; the shares add up to the batch cost exactly. Writes dev.passage.production.batchorder.statechanged.v1 and dev.passage.production.coproduct.allocated.v1 in one transaction. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchOrder' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0102
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0106 when the order is not reported.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: PMF-0021 when the by-product burden exceeds the batch cost or the allocation weights sum to zero; PMF-0107 when no quantity was reported; idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/potency:consume:
    post:
      operationId: consumePotency
      summary: Potency-based consumption of an active-ingredient line (BR-24.2)
      x-passage-duty: production.batch-order.read
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PotencyRequest' } } }
      responses:
        '200':
          description: Active-ingredient quantity and the compensating line after adjustment.
          content: { application/json: { schema: { $ref: '#/components/schemas/PotencyResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422':
          description: PMF-0002 (POTENCY_COMPENSATION_NEGATIVE) when the compensating line would become negative.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/catch-weight:validate:
    post:
      operationId: validateCatchWeight
      summary: Validate a catch-weight receipt or RAF weight (BR-24.5)
      x-passage-duty: production.batch-order.read
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CatchWeightRequest' } } }
      responses:
        '200':
          description: The weight is within min × units to max × units.
          content: { application/json: { schema: { $ref: '#/components/schemas/Valid' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422':
          description: PMF-0004 when the weight is outside min × units to max × units.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/co-products:allocate:
    post:
      operationId: allocateCoProducts
      summary: Preview co-product and by-product cost allocation (FR-24.4, BR-24.3)
      x-passage-duty: production.journal.post
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AllocateRequest' } } }
      responses:
        '200':
          description: Allocated amounts (4 decimals, BR-24.3). Main + co-products + by-product burdens equal the batch cost exactly.
          content: { application/json: { schema: { $ref: '#/components/schemas/AllocateResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422':
          description: PMF-0021 when weights sum to zero or burdens exceed the batch cost.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-derivation:preview:
    post:
      operationId: previewBatchDerivation
      summary: Preview a batch attribute or shelf-life derivation from sender batches (FR-24.15, BR-24.11)
      description: Stores nothing. Senders without a value of the rule's kind are left out of the aggregation and listed in missingSenders with warningCode PMF-0007.
      x-passage-duty: production.batch-attribute.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeriveRequest' } } }
      responses:
        '200':
          description: The derived receiver value and the senders without a value.
          content: { application/json: { schema: { $ref: '#/components/schemas/DeriveResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-merge:preview:
    post:
      operationId: previewBatchMerge
      summary: Preview the target batch of a merge (FR-24.16)
      description: Numeric attributes become the quantity-weighted average, dates the earliest, text must agree unless listed in mergeOverride (then the largest batch's text wins). Cost per unit is the weighted average. Stores nothing.
      x-passage-duty: production.batch.merge
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MergeRequest' } } }
      responses:
        '200':
          description: The target batch.
          content: { application/json: { schema: { $ref: '#/components/schemas/MergeResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422':
          description: PMF-0006 when the batches differ in item, warehouse, catch-weight unit, disposition, the kind of an attribute, or a text attribute that is not merge-override.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-requirements:check:
    post:
      operationId: checkBatchRequirements
      summary: Customer batch requirement check for a line (FR-24.19, BR-24.13)
      description: Resolves the requirement rows by precedence (customer over customer group over item default, field by field), then splits the batches into qualifying and excluded (PMF-0009 with a reason). Only available batches that are not expired on the ship date qualify.
      x-passage-duty: production.batch-order.read
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CheckRequest' } } }
      responses:
        '200':
          description: The resolved requirement, qualifying and excluded batches, and the same-batch pick.
          content: { application/json: { schema: { $ref: '#/components/schemas/CheckResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409':
          description: PMF-0008 (SAME_BATCH_UNAVAILABLE) when the line is same-batch and no qualifying batch holds its whole quantity; the detail names the largest available quantity.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/bulk-consolidation:preview:
    post:
      operationId: previewBulkConsolidation
      summary: Size the bulk batch orders for packed orders and peg them by due date (FR-24.17, BR-24.12)
      x-passage-duty: production.batch-order.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConsolidateRequest' } } }
      responses:
        '200':
          description: The bulk orders, each with the packing orders pegged to it.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConsolidateResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-records:approve-check:
    post:
      operationId: checkBatchRecordApproval
      summary: Whether a batch record can be approved (BR-24.15 review by exception)
      x-passage-duty: production.batch-record.approve
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ApproveCheckRequest' } } }
      responses:
        '200':
          description: Every exception has a disposition and a signature.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApproveCheckResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422':
          description: PMF-0014 while any exception lacks a disposition or a signature.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-attributes:check:
    post:
      operationId: checkBatchAttributes
      summary: Check recorded batch attribute values against the item's definitions (FR-24.5)
      description: Refuses (400) an attribute the item does not define, a value of the wrong type for its kind, an enum value that is not an option, and invalid definitions. A numeric value outside min/max is accepted with pass false and counted in exceptions, because it is recorded and becomes an EBR exception (BR-24.15). Stores nothing.
      x-passage-duty: production.batch-attribute.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AttributesRequest' } } }
      responses:
        '200':
          description: One result per recorded value, sorted by attribute.
          content: { application/json: { schema: { $ref: '#/components/schemas/AttributesResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-picking:proposal:
    post:
      operationId: proposeBatchPicking
      summary: Propose the batches a line consumes (FR-24.3, FR-24.5, FR-24.6, BR-24.10)
      description: >-
        Available batches only, expiry first (FEFO; batches without expiry last), with potency inside the line's band.
        Excluded batches carry their code: PMF-0016 for a disposition other than available (AC-24.10), PMF-0003
        (BATCH_EXPIRED) for an expiry before the posting date (AC-24.4), PMF-0005 for potency outside the band or not
        recorded. Expired batches are eligible only when the caller holds production.batch.consume-expired and gives
        overrideReason (at least 10 characters, else 400); they are flagged expiredOverride. Stores nothing.
      x-passage-duty: production.batch-order.read
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PickingRequest' } } }
      responses:
        '200':
          description: The picked batches with the quantity taken from each, the excluded batches and the shortfall.
          content: { application/json: { schema: { $ref: '#/components/schemas/PickingResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/rework-orders:preview:
    post:
      operationId: previewReworkOrder
      summary: Plan a rework batch order for a batch (FR-24.18, AC-24.18)
      description: The batch, or part of it, is the first ingredient. Omitted parameters take the FR-24.18 defaults (keepBatchNumber true, requireQualityOrder true, outputDisposition quarantine, capitalize false). The output cannot be available while a quality order is required. Stores nothing.
      x-passage-duty: production.batch-order.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReworkRequest' } } }
      responses:
        '200':
          description: The rework plan.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReworkResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: healthz
      summary: Liveness
      security: []
      responses:
        '200': { description: Process is up }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness (Postgres reachable)
      security: []
      responses:
        '200': { description: Ready }
        '503': { description: Database unreachable }
  /v1/production/batch-attribute-definitions:
    post:
      operationId: defineBatchAttribute
      summary: Define a batch attribute of an item (FR-24.5)
      x-passage-duty: production.batch-attribute.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchAttributeDefinitionRequest' } } }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true. Writes dev.passage.production.batchattribute.defined.v1.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchAttributeDefinition' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409':
          description: PMF-0110 when the item already defines an attribute of that name, or already has a potency attribute.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listBatchAttributeDefinitions
      summary: Batch attribute definitions by item and name
      x-passage-duty: production.batch-order.read
      parameters:
        - { name: itemId, in: query, description: Only the definitions of this item., schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Definitions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BatchAttributeDefinition' } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batches:
    post:
      operationId: registerBatch
      summary: Register a batch for quality records (FR-24.5)
      x-passage-duty: production.batch-attribute.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchRequest' } } }
      responses:
        '201':
          description: 'Created at version 1 (disposition defaults to available). A replay returns 200 with Idempotent-Replayed: true. Writes dev.passage.production.batch.registered.v1.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchRecord' } } }
        '400':
          description: COM-0001 for a malformed body, or a batch order of another legal entity than the batch.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403':
          description: AUTH-0003 when the duty is missing or legalEntityId is outside the caller's scope.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: PMF-0102 when batchOrderId names no batch order in the caller's scope.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0109 when the item already has a batch with that number.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listBatches
      summary: Batches, newest first (attributes and histories omitted)
      x-passage-duty: production.batch-order.read
      parameters:
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
        - { name: disposition, in: query, schema: { $ref: '#/components/schemas/Disposition' } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Batches
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BatchRecord' } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batches/{id}:
    get:
      operationId: getBatch
      summary: One batch with its current attributes and both histories
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The batch
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchRecord' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0108
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batches/{id}/attributes:
    put:
      operationId: recordBatchAttributes
      summary: Record attribute values on a batch with the limit check (FR-24.5)
      x-passage-duty: production.batch-attribute.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecordAttributesRequest' } } }
      responses:
        '200':
          description: 'The batch at version + 1 and the check of each value; a numeric value outside min/max is recorded with pass false (an EBR exception, BR-24.15). A date under the expiry attribute sets expiryDate. Writes dev.passage.production.batch.attributesrecorded.v1. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/AttributesResult' } } }
        '400':
          description: COM-0001 for a malformed body, an attribute the item does not define, a value of the wrong type or an enum value that is not an option.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: PMF-0108
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batches/{id}:disposition:
    post:
      operationId: changeBatchDisposition
      summary: Change the disposition of a batch with a reason (AC-24.10)
      x-passage-duty: production.batch-disposition.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DispositionRequest' } } }
      responses:
        '200':
          description: 'The batch at version + 1 with the change in its disposition history; the change is flagged segregationConflict when the caller recorded attribute values on this batch. Writes dev.passage.production.batch.dispositionchanged.v1. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchRecord' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0108
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0111 when the batch already has that disposition.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1 to 200 characters. A retry with the same key and body returns the first answer; a different body is idempotency_key_reuse (422).
      schema: { type: string, minLength: 1, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  schemas:
    AttributeKind:
      type: string
      enum: [numeric, text, enum, date]
    AttributeRole:
      type: string
      description: The potency attribute carries an item's active-ingredient percentage (PRD 4.24.4 role).
      enum: [generic, potency]
    BatchAttributeDefinitionRequest:
      type: object
      required: [itemId, name, kind]
      properties:
        itemId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 40 }
        kind: { $ref: '#/components/schemas/AttributeKind' }
        role: { $ref: '#/components/schemas/AttributeRole', description: Defaults to generic; potency only on a numeric attribute, at most one per item. }
        target: { $ref: '#/components/schemas/Decimal', description: Numeric attributes only. }
        min: { $ref: '#/components/schemas/Decimal', description: Numeric attributes only; inclusive. }
        max: { $ref: '#/components/schemas/Decimal', description: Numeric attributes only; inclusive. }
        options: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 200 }, uniqueItems: true, description: Enum attributes only; at least one. }
    BatchAttributeDefinition:
      type: object
      required: [id, itemId, name, kind, role, options, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/AttributeKind' }
        role: { $ref: '#/components/schemas/AttributeRole' }
        target: { $ref: '#/components/schemas/Decimal' }
        min: { $ref: '#/components/schemas/Decimal' }
        max: { $ref: '#/components/schemas/Decimal' }
        options: { type: array, items: { type: string } }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    BatchRequest:
      type: object
      required: [itemId, batchNumber]
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity. }
        itemId: { type: string, format: uuid }
        batchNumber: { type: string, minLength: 1, maxLength: 40 }
        batchOrderId: { type: [string, 'null'], format: uuid }
        disposition: { $ref: '#/components/schemas/Disposition', description: Defaults to available. }
    RecordAttributesRequest:
      type: object
      required: [version, values]
      properties:
        version: { type: integer, minimum: 1, description: The batch version you read. }
        values: { type: object, minProperties: 1, maxProperties: 100, additionalProperties: { $ref: '#/components/schemas/AttributeValue' }, description: Attribute name to value. }
    DispositionRequest:
      type: object
      required: [version, disposition, reason]
      properties:
        version: { type: integer, minimum: 1 }
        disposition: { $ref: '#/components/schemas/Disposition' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    BatchAttribute:
      type: object
      required: [name, kind, pass, recordedBy, recordedAt]
      properties:
        name: { type: string }
        kind: { $ref: '#/components/schemas/AttributeKind' }
        num: { $ref: '#/components/schemas/Decimal' }
        text: { type: string }
        date: { type: string, format: date }
        pass: { type: boolean, description: False for a numeric value outside its limits. }
        detail: { type: string }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
    DispositionChange:
      type: object
      required: [from, to, reason, segregationConflict, changedBy, changedAt]
      properties:
        from: { $ref: '#/components/schemas/Disposition' }
        to: { $ref: '#/components/schemas/Disposition' }
        reason: { type: string }
        segregationConflict: { type: boolean, description: The user who changed the disposition also recorded attribute values on this batch (flagged segregation-of-duties conflict). }
        changedBy: { type: string }
        changedAt: { type: string, format: date-time }
    BatchRecord:
      type: object
      description: The quality record of a batch (slice 11); not the Batch a preview takes as input.
      required: [id, legalEntityId, itemId, batchNumber, disposition, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        batchNumber: { type: string }
        batchOrderId: { type: string, format: uuid }
        disposition: { $ref: '#/components/schemas/Disposition' }
        expiryDate: { type: string, format: date, description: Set from the expiry date attribute. }
        version: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        attributes: { type: array, items: { $ref: '#/components/schemas/BatchAttribute' }, description: The latest value of each attribute; on the detail only. }
        attributeHistory: { type: array, items: { $ref: '#/components/schemas/BatchAttribute' }, description: Every recorded value, newest first, at most 500; on the detail only. }
        dispositions: { type: array, items: { $ref: '#/components/schemas/DispositionChange' }, description: Newest first; on the detail only. }
    AttributeCheck:
      type: object
      required: [name, pass]
      properties:
        name: { type: string }
        pass: { type: boolean }
        detail: { type: string }
    AttributesResult:
      type: object
      required: [batch, checks]
      properties:
        batch: { $ref: '#/components/schemas/BatchRecord' }
        checks: { type: array, items: { $ref: '#/components/schemas/AttributeCheck' } }
    Decimal:
      type: string
      description: Decimal as a JSON string (numbers are accepted on input).
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    Quantity:
      type: string
      description: Positive decimal below 10^12 with at most 6 decimals.
      pattern: '^[0-9]{1,12}(\.[0-9]{1,6})?$'
    LineType:
      type: string
      enum: [ingredient, active-ingredient, phantom, co-product, by-product]
    OrderStatus:
      type: string
      enum: [planned, released, started, reported, ended, closed]
    FormulaLineRequest:
      type: object
      required: [lineNumber, itemId, type]
      properties:
        lineNumber: { type: integer, minimum: 1 }
        itemId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/LineType' }
        qty: { $ref: '#/components/schemas/Decimal' }
        percent: { $ref: '#/components/schemas/Decimal', description: '0 to 100, at most 4 decimals' }
        scalable: { type: boolean, default: true }
        percentControlled: { type: boolean, default: false, description: Not allowed on co- and by-product lines. }
    FormulaRequest:
      type: object
      required: [code, name, itemId, size, unit, lines]
      properties:
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_.-]{0,39}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        itemId: { type: string, format: uuid }
        bomVersionId: { type: [string, 'null'], format: uuid }
        size: { $ref: '#/components/schemas/Quantity' }
        unit: { type: string, minLength: 1, maxLength: 10 }
        lines: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/FormulaLineRequest' } }
    FormulaLine:
      type: object
      required: [lineNumber, itemId, type, qty, percent, scalable, percentControlled]
      properties:
        lineNumber: { type: integer }
        itemId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/LineType' }
        qty: { $ref: '#/components/schemas/Decimal' }
        percent: { $ref: '#/components/schemas/Decimal' }
        scalable: { type: boolean }
        percentControlled: { type: boolean }
    Formula:
      type: object
      required: [id, code, name, itemId, size, unit, version, lineCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        itemId: { type: string, format: uuid }
        bomVersionId: { type: [string, 'null'], format: uuid }
        size: { $ref: '#/components/schemas/Decimal' }
        unit: { type: string }
        version: { type: integer }
        lineCount: { type: integer }
        lines: { type: array, items: { $ref: '#/components/schemas/FormulaLine' }, description: Present on create and get, omitted in lists. }
        createdAt: { type: string, format: date-time }
    BatchOrderRequest:
      type: object
      required: [formulaId, batchSize]
      properties:
        formulaId: { type: string, format: uuid }
        batchSize: { $ref: '#/components/schemas/Quantity' }
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity. }
    OrderLine:
      type: object
      required: [lineNumber, itemId, type, formulaQty, percent, scalable, percentControlled, qty]
      properties:
        lineNumber: { type: integer }
        itemId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/LineType' }
        formulaQty: { $ref: '#/components/schemas/Decimal' }
        percent: { $ref: '#/components/schemas/Decimal' }
        scalable: { type: boolean }
        percentControlled: { type: boolean }
        qty: { $ref: '#/components/schemas/Decimal', description: Quantity at the order's batch size. }
        rafQty: { $ref: '#/components/schemas/Decimal', description: Quantity reported as finished of a co- or by-product line, once the order is reported. }
    VersionRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1, description: The order version the caller read (optimistic concurrency). }
    ReportOutput:
      type: object
      required: [lineNumber, qty]
      properties:
        lineNumber: { type: integer, description: Line number of a co-product or by-product line of the order. }
        qty: { $ref: '#/components/schemas/Decimal', description: Quantity reported as finished, zero or more. }
    ReportRequest:
      type: object
      required: [version, mainQty]
      properties:
        version: { type: integer, minimum: 1 }
        mainQty: { $ref: '#/components/schemas/Quantity', description: Quantity of the order's own item reported as finished. }
        outputs: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ReportOutput' }, description: A co- or by-product line left out is reported at its planned quantity. }
    EndBasis:
      type: object
      properties:
        lineNumber: { type: integer, description: Co-product line number; not used for the main item. }
        standardCost: { $ref: '#/components/schemas/Decimal', description: 'Weight for the tca method (standard cost times reported quantity); zero or more, below 10^12, at most 6 decimals.' }
        percent: { $ref: '#/components/schemas/Decimal', description: 'Weight for the manual method; 0 to 100, at most 6 decimals. Percentages are normalized, so they need not add up to 100.' }
    EndByProduct:
      type: object
      required: [lineNumber, costType]
      properties:
        lineNumber: { type: integer, description: By-product line number. }
        costType: { type: string, enum: [per-series, per-quantity, percent, recycled] }
        rate: { $ref: '#/components/schemas/Decimal', description: 'Percent of the batch cost for percent, else the amount per unit of the reported quantity; zero or more, at most 6 decimals.' }
    EndRequest:
      type: object
      required: [version, method, currency, batchCost]
      properties:
        version: { type: integer, minimum: 1 }
        method: { type: string, enum: [none, manual, tca, quantity] }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: ISO 4217 code. }
        batchCost: { $ref: '#/components/schemas/Decimal', description: Cost the order ends with, at most the currency's minor-unit decimals. }
        main: { $ref: '#/components/schemas/EndBasis' }
        coProducts: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/EndBasis' } }
        byProducts: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/EndByProduct' }, description: A by-product line without an entry carries no burden. }
    AllocationShare:
      type: object
      required: [role, lineNumber, itemId, rafQty, amount, percent]
      properties:
        role: { type: string, enum: [main, co-product, by-product-burden] }
        lineNumber: { type: integer, description: 0 for the order's own item. }
        itemId: { type: string, format: uuid }
        rafQty: { $ref: '#/components/schemas/Decimal' }
        amount: { $ref: '#/components/schemas/Decimal', description: Amount with 4 decimals. }
        percent: { $ref: '#/components/schemas/Decimal' }
    OrderAllocation:
      type: object
      required: [method, currency, batchCost, shares]
      properties:
        method: { type: string, enum: [none, manual, tca, quantity] }
        currency: { type: string }
        batchCost: { $ref: '#/components/schemas/Decimal' }
        shares: { type: array, items: { $ref: '#/components/schemas/AllocationShare' }, description: Main item first, then co-products, then by-product burdens; the amounts add up to batchCost exactly. }
    BatchOrder:
      type: object
      required: [id, legalEntityId, orderNumber, formulaId, formulaCode, formulaVersion, itemId, unit, formulaSize, batchSize, scaleFactor, status, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        orderNumber: { type: string, example: BO-000001 }
        formulaId: { type: string, format: uuid }
        formulaCode: { type: string }
        formulaVersion: { type: integer }
        itemId: { type: string, format: uuid }
        unit: { type: string }
        formulaSize: { $ref: '#/components/schemas/Decimal' }
        batchSize: { $ref: '#/components/schemas/Decimal' }
        scaleFactor: { $ref: '#/components/schemas/Decimal' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        version: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        reportedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        actualQty: { $ref: '#/components/schemas/Decimal', description: Quantity of the order's own item reported as finished. }
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' }, description: Present on create, get and the commands, omitted in lists. }
        allocation: { $ref: '#/components/schemas/OrderAllocation', description: Present once the order has ended. }
    ScaledLine:
      type: object
      properties:
        lineNumber: { type: integer }
        itemId: { type: string }
        type: { $ref: '#/components/schemas/LineType' }
        formulaQty: { $ref: '#/components/schemas/Decimal' }
        qty: { $ref: '#/components/schemas/Decimal' }
    ScaleResponse:
      type: object
      properties:
        batchSize: { $ref: '#/components/schemas/Decimal' }
        scaleFactor: { $ref: '#/components/schemas/Decimal' }
        lines: { type: array, items: { $ref: '#/components/schemas/ScaledLine' } }
    PotencyRequest:
      type: object
      required: [planned, standardPotency, batchPotency, compensatingPlanned]
      properties:
        planned: { $ref: '#/components/schemas/Decimal' }
        standardPotency: { $ref: '#/components/schemas/Decimal' }
        batchPotency: { $ref: '#/components/schemas/Decimal' }
        compensatingPlanned: { $ref: '#/components/schemas/Decimal' }
    PotencyResponse:
      type: object
      properties:
        qty: { $ref: '#/components/schemas/Decimal' }
        compensatingQty: { $ref: '#/components/schemas/Decimal' }
    CatchWeightRequest:
      type: object
      required: [nominal, min, max, cwQty, weight]
      properties:
        nominal: { $ref: '#/components/schemas/Decimal' }
        min: { $ref: '#/components/schemas/Decimal' }
        max: { $ref: '#/components/schemas/Decimal' }
        cwQty: { type: integer, minimum: 1 }
        weight: { $ref: '#/components/schemas/Decimal' }
    Valid:
      type: object
      properties:
        valid: { type: boolean }
    CostItem:
      type: object
      required: [itemId]
      properties:
        itemId: { type: string }
        standardCost: { $ref: '#/components/schemas/Decimal' }
        rafQty: { $ref: '#/components/schemas/Decimal' }
        percent: { $ref: '#/components/schemas/Decimal' }
    ByProductItem:
      type: object
      required: [itemId, costType]
      properties:
        itemId: { type: string }
        costType: { type: string, enum: [per-series, per-quantity, percent, recycled] }
        qty: { $ref: '#/components/schemas/Decimal' }
        rate: { $ref: '#/components/schemas/Decimal' }
    AllocateRequest:
      type: object
      required: [batchCost, currency, method, main]
      properties:
        batchCost: { $ref: '#/components/schemas/Decimal' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        method: { type: string, enum: [none, manual, tca, quantity] }
        main: { $ref: '#/components/schemas/CostItem' }
        coProducts: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/CostItem' } }
        byProducts: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ByProductItem' } }
    Allocated:
      type: object
      properties:
        itemId: { type: string }
        amount: { $ref: '#/components/schemas/Decimal' }
        percent: { $ref: '#/components/schemas/Decimal' }
    AllocateResponse:
      type: object
      properties:
        currency: { type: string }
        main: { $ref: '#/components/schemas/Allocated' }
        coProducts: { type: array, items: { $ref: '#/components/schemas/Allocated' } }
        byProductBurdens: { type: array, items: { $ref: '#/components/schemas/Allocated' } }
        total: { $ref: '#/components/schemas/Decimal' }
    AttributeValue:
      type: object
      description: One attribute value; at most one of num, text and date. An empty object is a missing value.
      additionalProperties: false
      properties:
        num: { $ref: '#/components/schemas/Decimal' }
        text: { type: string, maxLength: 200 }
        date: { type: string, format: date }
    Aggregation:
      type: string
      enum: [copy, min, max, weighted-average, earliest-date, latest-date, fixed]
    DeriveRequest:
      type: object
      required: [rule, senders]
      properties:
        rule:
          type: object
          required: [attribute, aggregation]
          properties:
            attribute: { type: string, minLength: 1, maxLength: 40 }
            aggregation: { $ref: '#/components/schemas/Aggregation' }
            decimals: { type: integer, minimum: 0, maximum: 10, description: Rounding of a weighted average; default 4. }
            fixed: { $ref: '#/components/schemas/AttributeValue' }
        senders:
          type: array
          maxItems: 200
          items:
            type: object
            required: [batchId, value]
            properties:
              batchId: { type: string, minLength: 1, maxLength: 80 }
              value: { $ref: '#/components/schemas/AttributeValue' }
              qty: { $ref: '#/components/schemas/Decimal', description: Consumed quantity; the weight of a weighted average. }
    DeriveResponse:
      type: object
      properties:
        attribute: { type: string }
        value: { $ref: '#/components/schemas/AttributeValue' }
        missingSenders: { type: array, items: { type: string } }
        warningCode: { type: string, enum: [PMF-0007] }
    Disposition:
      type: string
      enum: [available, on-hold, rejected, quarantine]
    Batch:
      type: object
      required: [id, qty]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        itemId: { type: string }
        warehouseId: { type: string }
        cwUnit: { type: string }
        disposition: { $ref: '#/components/schemas/Disposition' }
        qty: { $ref: '#/components/schemas/Quantity' }
        unitCost: { $ref: '#/components/schemas/Decimal' }
        values:
          type: object
          description: Attribute values by name; the shelf-life dates are expiry and best-before.
          additionalProperties: { $ref: '#/components/schemas/AttributeValue' }
    MergeRequest:
      type: object
      required: [batches]
      properties:
        batches: { type: array, minItems: 2, maxItems: 200, items: { $ref: '#/components/schemas/Batch' } }
        mergeOverride: { type: array, items: { type: string }, description: Text attributes allowed to differ. }
    MergeResponse:
      type: object
      properties:
        qty: { $ref: '#/components/schemas/Decimal' }
        unitCost: { $ref: '#/components/schemas/Decimal' }
        disposition: { $ref: '#/components/schemas/Disposition' }
        values: { type: object, additionalProperties: { $ref: '#/components/schemas/AttributeValue' } }
        parents: { type: array, items: { type: string } }
    Requirement:
      type: object
      required: [level]
      properties:
        level: { type: integer, enum: [1, 2, 3], description: 1 item default, 2 customer group, 3 customer. }
        sellableDays: { type: integer, minimum: 0, maximum: 3650 }
        attribute: { type: string, maxLength: 40 }
        min: { $ref: '#/components/schemas/Decimal' }
        max: { $ref: '#/components/schemas/Decimal' }
        sameBatch: { type: boolean }
    CheckRequest:
      type: object
      required: [requirements, shipDate, qty, batches]
      properties:
        requirements: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Requirement' } }
        shipDate: { type: string, format: date }
        qty: { $ref: '#/components/schemas/Quantity' }
        batches: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Batch' } }
    CheckResponse:
      type: object
      properties:
        requirement:
          type: object
          properties:
            sellableDays: { type: integer }
            sameBatch: { type: boolean }
            ranges:
              type: object
              additionalProperties:
                type: object
                properties:
                  min: { $ref: '#/components/schemas/Decimal' }
                  max: { $ref: '#/components/schemas/Decimal' }
        qualifying:
          type: array
          items:
            type: object
            properties:
              batchId: { type: string }
              qty: { $ref: '#/components/schemas/Decimal' }
              expiry: { type: string, format: date }
        excluded:
          type: array
          items:
            type: object
            properties:
              batchId: { type: string }
              reason: { type: string }
              warningCode: { type: string, enum: [PMF-0009] }
        qtyAvailable: { $ref: '#/components/schemas/Decimal' }
        sameBatchId: { type: string, nullable: true }
    ConsolidateRequest:
      type: object
      required: [relation, packedOrders]
      properties:
        relation:
          type: object
          required: [packQtyPerUnit, multiple]
          properties:
            packQtyPerUnit: { $ref: '#/components/schemas/Quantity', description: Bulk UoM per packed unit. }
            multiple: { $ref: '#/components/schemas/Quantity', description: Formula multiple. }
            max: { $ref: '#/components/schemas/Decimal', description: Formula maximum (a multiple of multiple); 0 means none. }
        packedOrders:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [orderId, units, due]
            properties:
              orderId: { type: string, minLength: 1, maxLength: 80 }
              itemId: { type: string }
              units: { $ref: '#/components/schemas/Quantity' }
              due: { type: string, format: date }
    ConsolidateResponse:
      type: object
      properties:
        bulkOrders:
          type: array
          items:
            type: object
            properties:
              qty: { $ref: '#/components/schemas/Decimal' }
              pegs:
                type: array
                items:
                  type: object
                  properties:
                    orderId: { type: string }
                    itemId: { type: string }
                    bulkQty: { $ref: '#/components/schemas/Decimal' }
    ApproveCheckRequest:
      type: object
      required: [exceptions]
      properties:
        exceptions:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id]
            properties:
              id: { type: string, minLength: 1, maxLength: 80 }
              disposition: { type: string, enum: ['', accepted, deviation-raised, rejected] }
              signatureId: { type: string }
    ApproveCheckResponse:
      type: object
      properties:
        approvable: { type: boolean }
        exceptions: { type: integer }
    AttributeDefinition:
      type: object
      required: [name, kind]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        kind: { type: string, enum: [numeric, text, enum, date] }
        target: { $ref: '#/components/schemas/Decimal' }
        min: { $ref: '#/components/schemas/Decimal', description: Inclusive; numeric only. }
        max: { $ref: '#/components/schemas/Decimal', description: Inclusive; numeric only. }
        options: { type: array, maxItems: 50, items: { type: string }, description: Required for enum; enum only. }
    AttributesRequest:
      type: object
      required: [definitions, values]
      properties:
        definitions: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AttributeDefinition' } }
        values: { type: object, maxProperties: 100, additionalProperties: { $ref: '#/components/schemas/AttributeValue' } }
    AttributesResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              attribute: { type: string }
              pass: { type: boolean }
              detail: { type: string, description: Why the value is outside its limits. }
        exceptions: { type: integer, description: Values outside their limits. }
    PickingRequest:
      type: object
      required: [postingDate, qty, batches]
      properties:
        postingDate: { type: string, format: date }
        qty: { $ref: '#/components/schemas/Quantity' }
        potency:
          type: object
          required: [attribute, min, max]
          properties:
            attribute: { type: string, minLength: 1, maxLength: 40 }
            min: { $ref: '#/components/schemas/Decimal' }
            max: { $ref: '#/components/schemas/Decimal' }
        overrideReason: { type: string, maxLength: 500, description: Audit reason for consuming expired batches (BR-24.10). }
        batches: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Batch' } }
    PickingResponse:
      type: object
      properties:
        picked:
          type: array
          items:
            type: object
            properties:
              batchId: { type: string }
              qty: { $ref: '#/components/schemas/Decimal' }
              expiry: { type: string, format: date }
              expiredOverride: { type: boolean, description: Picked on the consume-expired override; an EBR exception (BR-24.15). }
        excluded:
          type: array
          items:
            type: object
            properties:
              batchId: { type: string }
              code: { type: string, enum: [PMF-0003, PMF-0005, PMF-0016] }
              detail: { type: string }
        shortfall: { $ref: '#/components/schemas/Decimal' }
        overrideHeld: { type: boolean }
    ReworkRequest:
      type: object
      required: [batch, reworkQty, outputQty]
      properties:
        batch: { $ref: '#/components/schemas/Batch' }
        reworkQty: { $ref: '#/components/schemas/Quantity' }
        outputQty: { $ref: '#/components/schemas/Quantity' }
        params:
          type: object
          additionalProperties: false
          properties:
            keepBatchNumber: { type: boolean, default: true }
            requireQualityOrder: { type: boolean, default: true }
            outputDisposition: { type: string, enum: [available, on-hold, quarantine], default: quarantine }
            capitalize: { type: boolean, default: false }
    ReworkResponse:
      type: object
      properties:
        sourceBatchId: { type: string }
        reworkQty: { $ref: '#/components/schemas/Decimal' }
        outputBatchId: { type: [string, 'null'], description: The kept batch number, or null for a new number drawn at report as finished. }
        outputQty: { $ref: '#/components/schemas/Decimal' }
        outputDisposition: { $ref: '#/components/schemas/Disposition' }
        qualityOrderRequired: { type: boolean }
        varianceType: { type: string, enum: [rework, capitalized] }
        parents: { type: array, items: { type: string } }
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type: { type: string, example: 'https://passage.dev/problems/PMF-0001' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors: { type: object, additionalProperties: { type: string } }
  responses:
    Problem:
      description: Problem details (application/problem+json).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
