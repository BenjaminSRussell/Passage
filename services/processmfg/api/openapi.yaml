          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batches/{id}:disposition:
    post:
      operationId: changeBatchDisposition
      summary: Change the disposition of a batch with a reason (AC-24.10)
      x-passage-duty: production.batch-disposition.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DispositionRequest' } } }
      responses:
        '200':
          description: 'The batch at version + 1 with the change in its disposition history; the change is flagged segregationConflict when the caller recorded attribute values on this batch. Writes dev.passage.production.batch.dispositionchanged.v1. A replay returns the first answer with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/BatchRecord' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0108
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when the version is stale; PMF-0111 when the batch already has that disposition.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: PMF-0015 when the batch is moved to available while its item has a profile that requires an approved record and the batch (or, for a merged batch, any batch it was merged from) has no approved or sealed record; idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batches:merge:
    post:
      operationId: mergeBatches
      summary: Merge stored batches into a new batch (FR-24.16, AC-24.12)
      description: Reads the disposition and recorded attribute values of the source batches from the batch register, applies the merge rule of batch-merge:preview (numbers quantity-weighted, dates earliest, text must agree unless listed in mergeOverride), registers the target with the merged values checked against the item's definitions and the earliest expiry, and writes one genealogy row per source. The register keeps no quantity or cost, so the caller gives them per source with the version it read. Each source's version moves by one, so a second merge or a disposition change from the version read before is refused as stale; a source stays registered and can be merged again from its new version (a partial merge). Writes dev.passage.production.batch.merged.v1 in the same transaction; the inventory transfers are posted by services/inventory from that event.
      x-passage-duty: production.batch.merge
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MergeStoredRequest' } } }
      responses:
        '201':
          description: 'The new batch at version 1 with its merged attributes, the total quantity, the weighted cost per unit and the parents. A replay returns 200 with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/MergeStoredResult' } } }
        '400':
          description: COM-0001 for a malformed body, fewer than two sources, a repeated batch or an attribute value the item's definitions refuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: PMF-0108 when a source batch is not in the caller's scope.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: PMF-0104 when a source version is stale; PMF-0109 when the target batch number already exists for the item.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: PMF-0006 when the sources differ in item, legal entity, warehouse, catch-weight unit, disposition, the kind of an attribute, or a text attribute that is not merge-override; PMF-0015 when the target would be available and a source (or a batch an earlier merge made it from) lacks the approved record its profile requires; idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batches/{id}/genealogy:
    get:
      operationId: getBatchGenealogy
      summary: Where a batch was merged or reworked from and where it went (FR-24.16, FR-24.18)
      description: Parents are the batches this one was merged or reworked from, children the batches it went into, each with the relation, quantity and cost per unit it contributed; reworks are the rework orders of the batch (AC-24.18), including a rework that kept the batch number.
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The parents and children of the batch.
          content: { application/json: { schema: { $ref: '#/components/schemas/Genealogy' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: PMF-0108
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-record-profiles:
    post:
      operationId: defineBatchRecordProfile
      summary: Define the electronic batch record profile of an item (FR-24.21)
      description: >-
        Says that the batches of the item get an electronic batch record and whether releasing a batch needs the
        record approved (default yes). One active profile per item and legal entity; the code is unique among the
        active ones. While the profile requires approval, a batch cannot be registered or moved to available without
        an approved or sealed record (PMF-0015). Writes dev.passage.production.batchrecordprofile.defined.v1.
      x-passage-duty: production.batch-record.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecordProfileRequest' } } }
      responses:
        '201':
          description: 'Created at version 1. A replay returns 200 with Idempotent-Replayed: true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/RecordProfile' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409':
          description: PMF-0116 when the item already has an active profile or the code is taken.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listBatchRecordProfiles
      summary: Batch record profiles by item and code
      x-passage-duty: production.batch-order.read
      parameters:
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
        - { name: active, in: query, description: 'true keeps the profiles that are not retired.', schema: { type: boolean } }
