      responses:
        '200':
          description: Profiles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RecordProfile' } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/production/batch-record-profiles/{id}:
    get:
      operationId: getBatchRecordProfile
      summary: One batch record profile
      x-passage-duty: production.batch-order.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The profile with its version and whether it is retired.
