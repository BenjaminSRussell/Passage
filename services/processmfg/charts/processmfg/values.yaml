image: { repository: ghcr.io/benjaminsrussell/processmfg, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: processmfg-db
migrateOnStart: false
replicaCount: 2
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor: { enabled: false }
# Service calls. identityUrl switches the process-manufacturing feature gate on; shopfloorUrl makes releasing a
# batch order generate its control recipe (the item's recipe target says where it goes). Both sign their calls
# with serviceIdentity.signingKeySecret (key signing-key, a base64 Ed25519 seed) whose public key identity and
# shopfloor trust for the caller "processmfg".
identityUrl: ""
shopfloorUrl: ""
serviceIdentity: { signingKeySecret: "", keyId: "" }
