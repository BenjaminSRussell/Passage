apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: processmfg
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: processmfg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processmfg
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
{{- if or .Values.identityUrl .Values.shopfloorUrl }}
      volumes:
        - name: service-identity
          secret:
            secretName: {{ required "serviceIdentity.signingKeySecret is required with identityUrl or shopfloorUrl" .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
{{- end }}
      containers:
        - name: processmfg
          image: {{ include "processmfg.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            {{- include "passage.cloudEnv" $ | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
{{- if .Values.identityUrl }}
            - name: IDENTITY_URL
              value: {{ .Values.identityUrl | quote }}
{{- end }}
{{- if .Values.shopfloorUrl }}
            # Releasing a batch order generates its control recipe in the shop floor service (#25).
            - name: SHOPFLOOR_URL
              value: {{ .Values.shopfloorUrl | quote }}
{{- end }}
{{- if or .Values.identityUrl .Values.shopfloorUrl }}
            - name: PASSAGE_SERVICE_NAME
              value: processmfg
            - name: PASSAGE_SERVICE_SIGNING_KEY_FILE
              value: /var/run/passage/service-identity/signing-key
{{- if .Values.serviceIdentity.keyId }}
            - name: PASSAGE_SERVICE_KEY_ID
              value: {{ .Values.serviceIdentity.keyId | quote }}
{{- end }}
{{- end }}
{{- if or .Values.identityUrl .Values.shopfloorUrl }}
          volumeMounts:
            - { name: service-identity, mountPath: /var/run/passage/service-identity, readOnly: true }
{{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
