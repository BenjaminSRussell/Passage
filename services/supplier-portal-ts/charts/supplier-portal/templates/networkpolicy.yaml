{{- if .Values.networkPolicy.enabled }}
# Ingress: only the edge gateway. Egress: DNS, the four owning services, Keycloak over 443, and clamd when a scanner is set.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: supplier-portal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: supplier-portal
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.edgeNamespace | quote }}
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace | quote }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        {{- range .Values.networkPolicy.upstreamNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - ipBlock: { cidr: {{ .Values.networkPolicy.identityProviderCidr | quote }} }
      ports:
        - { protocol: TCP, port: 443 }
    {{- if .Values.scan.clamavAddr }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.clamavNamespace | quote }}
      ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.clamavPort }} }
    {{- end }}
{{- end }}
