apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: supplier-portal
spec:
  replicas: {{ if and (gt (int .Values.replicaCount) 1) (not .Values.sessionStore.url) }}{{ fail "replicaCount > 1 needs sessionStore.url: sessions are per pod without a shared store" }}{{ else }}{{ .Values.replicaCount }}{{ end }}
  strategy:
    {{- if .Values.sessionStore.url }}
    # Sessions are in the shared store, so a new pod can take over from an old one.
    type: RollingUpdate
    {{- else }}
    # Never two pods at once: sessions are per process.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: supplier-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supplier-portal
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's node user; numeric so the kubelet can check runAsNonRoot.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: supplier-portal
          image: {{ include "supplier-portal.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            {{- include "passage.cloudEnv" $ | nindent 12 }}
            - name: HTTP_ADDR
              value: ":8080"
            - name: OIDC_ISSUER
              value: {{ required "oidc.issuer is required" .Values.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_REDIRECT_URI
              value: {{ required "oidc.redirectUri is required" .Values.oidc.redirectUri | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.oidc.clientSecretName | quote }}, key: client-secret } }
            - name: APP_ORIGIN
              value: {{ required "appOrigin is required" .Values.appOrigin | quote }}
            - name: PURCHASING_URL
              value: {{ .Values.upstreams.purchasing | quote }}
            - name: RECEIVING_URL
              value: {{ .Values.upstreams.receiving | quote }}
            - name: PARTY_URL
              value: {{ .Values.upstreams.party | quote }}
            - name: PAYABLES_URL
              value: {{ .Values.upstreams.payables | quote }}
            - name: SCAN_ALLOW_UNSCANNED
              value: {{ .Values.scan.allowUnscanned | quote }}
            {{- if .Values.scan.clamavAddr }}
            - name: CLAMAV_ADDR
              value: {{ .Values.scan.clamavAddr | quote }}
            - name: CLAMAV_TIMEOUT_MS
              value: {{ .Values.scan.clamavTimeoutMs | quote }}
            {{- end }}
            {{- if or .Values.registration.tenantId .Values.registration.legalEntityId }}
            - name: REGISTRATION_TENANT_ID
              value: {{ required "registration.tenantId is required with registration.legalEntityId" .Values.registration.tenantId | quote }}
            - name: REGISTRATION_LEGAL_ENTITY_ID
              value: {{ required "registration.legalEntityId is required with registration.tenantId" .Values.registration.legalEntityId | quote }}
            {{- end }}
            - name: PUBLIC_RATE_PER_HOUR
              value: {{ .Values.publicRatePerHour | quote }}
            - name: PASSAGE_TRUSTED_PROXIES
              value: {{ .Values.trustedProxies | quote }}
            {{- if .Values.sessionStore.url }}
            - name: SESSION_STORE_URL
              value: {{ .Values.sessionStore.url | quote }}
            {{- if .Values.sessionStore.passwordSecretName }}
            - name: SESSION_STORE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.sessionStore.passwordSecretName | quote }}, key: {{ .Values.sessionStore.passwordSecretKey | quote }} } }
            {{- end }}
            {{- end }}
            {{- if .Values.oidc.postLogoutRedirectUri }}
            - name: OIDC_POST_LOGOUT_REDIRECT_URI
              value: {{ .Values.oidc.postLogoutRedirectUri | quote }}
            {{- end }}
            {{- if .Values.keycloakAdmin.url }}
            - name: KEYCLOAK_ADMIN_URL
              value: {{ .Values.keycloakAdmin.url | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloakAdmin.realm | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: {{ .Values.keycloakAdmin.clientId | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.keycloakAdmin.clientSecretName | quote }}, key: client-secret } }
            {{- end }}
            - name: PASSAGE_SERVICE_NAME
              value: supplier-portal
            - name: PASSAGE_SERVICE_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.serviceSigningSecretName | quote }}, key: signing-key } }
          ports:
            - { name: http, containerPort: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
