image: { repository: ghcr.io/benjaminsrussell/passage-supplier-portal, digest: "", tag: "", pullPolicy: IfNotPresent }
# One replica unless sessionStore.url is set: without a shared store sessions live in the pod's memory, a restart signs everyone out and a
# second replica would not know the first one's sessions, so the chart refuses replicaCount > 1 then.
replicaCount: 1
sessionStore:
  # redis:// or rediss:// (TLS) URL of a Valkey or Redis server in the cluster, e.g. redis://valkey.valkey.svc:6379. Empty: in memory.
  url: ""
  # Secret holding the server's password under passwordSecretKey; empty when the server has none.
  passwordSecretName: ""
  passwordSecretKey: password
  # The namespace and port the network policy opens egress to when url is set.
  namespace: valkey
  port: 6379
# Keycloak Admin API client that creates an accepted invitation's user (realm-management manage-users and view-realm). Empty url: an
# administrator creates the user, as before.
keycloakAdmin:
  url: ""
  realm: passage
  clientId: passage-supplier-portal-admin
  # Secret holding the client secret under the key "client-secret". Created outside Git.
  clientSecretName: supplier-portal-keycloak-admin
oidc:
  # Where Keycloak sends the browser after sign-out; empty: APP_ORIGIN/. Must be a post.logout.redirect.uris entry of the client.
  postLogoutRedirectUri: ""
  # The Keycloak realm URL, e.g. https://keycloak.<env>.passage.dev/realms/passage. Required.
  issuer: ""
  clientId: passage-portal-supplier
  # The redirect URI registered on the client: https://supplier.<env>.passage.dev/bff/callback
  redirectUri: ""
  # Secret holding the client secret under the key "client-secret". Created outside Git.
  clientSecretName: supplier-portal-oidc
# The origin the app is served from, e.g. https://supplier.<env>.passage.dev. Required.
appOrigin: ""
# Owning services, as in-cluster URLs.
upstreams:
  purchasing: http://purchasing.purchasing.svc:8080
  receiving: http://receiving.receiving.svc:8080
  party: http://party.party.svc:8080
  payables: http://payables.payables.svc:8080
# Secret holding this service's Ed25519 seed under the key "signing-key". Its public key is added to
# PASSAGE_SERVICE_PUBLIC_KEYS of purchasing, receiving, party and payables as supplier-portal=...
serviceSigningSecretName: supplier-portal-signing
# Virus scan of uploaded documents (#511). clamavAddr is the host:port of clamd (INSTREAM over TCP). When it is set the scan is
# required: a failed scan refuses the upload. With no scanner, uploads are refused unless allowUnscanned is true (dev only).
scan:
  clamavAddr: ""
  clamavTimeoutMs: 30000
  allowUnscanned: false
# The public registration page for prospective suppliers. Both ids set opens it (a tenant and legal entity that receive the
# registrations); both empty closes it. publicRatePerHour limits registrations and invitation checks per client address.
registration:
  tenantId: ""
  legalEntityId: ""
publicRatePerHour: 10
# PASSAGE_TRUSTED_PROXIES: comma-separated CIDRs (or addresses) of the proxies in front of the pod whose X-Forwarded-For is
# believed, normally the edge (Envoy) pods' CIDR. Empty (the default) believes no header and counts each public request by the
# TCP peer, so behind the edge every client shares the edge's one allowance: set it wherever registration is open. A client
# address is the rightmost X-Forwarded-For entry that is not one of these proxies; an IPv6 client counts by its /64.
trustedProxies: ""
resources:
  requests: { cpu: 25m, memory: 96Mi }
  limits: { cpu: 500m, memory: 256Mi }
networkPolicy:
  enabled: true
  dnsNamespace: kube-system
  # The edge (Envoy) namespace, the only caller.
  edgeNamespace: envoy-gateway-system
  upstreamNamespaces: [purchasing, receiving, party, payables]
  # The namespace clamd runs in; its port is reached only when scan.clamavAddr is set.
  clamavNamespace: clamav
  clamavPort: 3310
  # Keycloak is reached on 443.
  identityProviderCidr: 0.0.0.0/0
