{{- if .Values.reconcile.enabled }}
{{- if not .Values.reconcile.tenantIds }}
{{- fail "reconcile.tenantIds must list at least one tenant UUID when reconcile.enabled is true" }}
{{- end }}
{{- if not .Values.ledgerUrl }}
{{- fail "ledgerUrl is required when reconcile.enabled is true" }}
{{- end }}
{{- if not .Values.serviceIdentity.signingKeySecret }}
{{- fail "serviceIdentity.signingKeySecret is required when reconcile.enabled is true" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-reconcile
  labels:
    app.kubernetes.io/name: intercompany-reconcile
spec:
  schedule: {{ .Values.reconcile.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: intercompany-reconcile
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: service-identity
              secret:
                secretName: {{ .Values.serviceIdentity.signingKeySecret }}
                defaultMode: 0440
          containers:
            - name: reconcile
              image: {{ include "intercompany.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - reconcile
                {{- range .Values.reconcile.tenantIds }}
                - {{ . | quote }}
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                {{- include "passage.cloudEnv" $ | nindent 16 }}
                - name: PASSAGE_SERVICE_NAME
                  value: intercompany
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.databaseSecret }}
                      key: DATABASE_URL
                - { name: LEDGER_URL, value: {{ .Values.ledgerUrl | quote }} }
                {{- if .Values.fxUrl }}
                - { name: FX_URL, value: {{ .Values.fxUrl | quote }} }
                - { name: FX_RATE_TYPE, value: {{ .Values.fxRateType | quote }} }
                {{- end }}
                - name: PASSAGE_SERVICE_SIGNING_KEY_FILE
                  value: /var/run/passage/service-identity/signing-key
                {{- if .Values.serviceIdentity.keyId }}
                - name: PASSAGE_SERVICE_KEY_ID
                  value: {{ .Values.serviceIdentity.keyId | quote }}
                {{- end }}
              volumeMounts:
                - { name: service-identity, mountPath: /var/run/passage/service-identity, readOnly: true }
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
{{- end }}
