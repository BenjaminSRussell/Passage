image: { repository: ghcr.io/benjaminsrussell/intercompany, digest: "", tag: "", pullPolicy: IfNotPresent }
# DATABASE_URL comes from this Kubernetes secret (Vault via External Secrets), never inline.
databaseSecret: intercompany-db
# Dev only; stage and prod apply migrations before the rollout.
migrateOnStart: false
replicaCount: 2
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor: { enabled: false }
# The ledger the service reads balances from and posts journals to (LEDGER_URL). Empty turns those routes off.
ledgerUrl: ""
# The fx service whose rate tables convert the two sides of a pair in different currencies (FX_URL), at rate type fxRateType.
fxUrl: ""
fxRateType: closing
# The org service whose fiscal calendars find the first open period after a closed one (ORG_URL). Empty means calendar months.
orgUrl: ""
# The tax service that prices a cross-border charge (TAX_URL) when the tenant has cross-border tax on.
taxUrl: ""
# CronJob running `intercompany reconcile <tenant-id>...`: reads every pair of the stored accounting matrix from the ledgers for
# the last and the current period and stores the runs (needs ledgerUrl and the signing key; tenants that have not set a
# reconciliation currency are skipped). Tenants are listed because the app role cannot enumerate them.
reconcile:
  enabled: false
  schedule: "17 3 * * *"
  tenantIds: []
# Ed25519 seed (base64) in this secret signs the service-to-service tokens sent to the ledger.
serviceIdentity:
  signingKeySecret: ""
  keyId: ""
