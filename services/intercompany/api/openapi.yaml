openapi: 3.1.0
info:
  title: Passage Intercompany
  version: 0.4.0
  description: |
    Wave 40, slices 1 to 4. Trading partners (FR-40.1) are stored: create a
    pairing with an Idempotency-Key, change its policy with If-Match (each
    change is a new version), price an IC line from the stored policy (FR-40.4)
    and check a linked order change against its tolerance (BR-40.3). Pairing
    changes publish dev.passage.interco.partner.created.v1 / updated.v1 through
    the outbox (events/asyncapi.yaml).

    The other endpoints are stateless intercompany calculations: the caller
    supplies the accounting matrix, balances, transfer prices, planning group,
    delivery chain or priced lines and the service returns the derived due-to /
    due-from journal (BR-40.4), the reconciliation classification (FR-40.6,
    BR-40.5), the priced IC charge with its Journal-mode legs (FR-40.13,
    BR-40.12), the centralized payment legs (FR-40.12) and their bank-return
    reversal (BR-40.11), the planning group run sequence with IC demand
    (FR-40.15, BR-40.13), the postings of a direct-delivery packing slip
    (FR-40.3) or the transfer-pricing evidence file (FR-40.4). Mirror sagas,
    persisted links, reconciliation runs, stored setups, charge posting and the
    planning run are later slices of PSG-40 (see NOT-IMPLEMENTED.md). Browser
    calls go through the web BFF at /api/v1/interco/..., which rewrites to
    these paths and sets the tenant and duty headers.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/interco/journals:preview:
    post:
      operationId: previewIntercompanyJournal
      summary: Derive the balanced due-to / due-from journal for one intercompany line (BR-40.4, AC-40.4)
      x-passage-duty: IntercompanyPost
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalPreviewRequest'
      responses:
        '200':
          description: Derived legs, one pair id, balanced in each entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: IC-0805 no accounting matrix row for the entity pair
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/interco/reconciliations:classify:
    post:
      operationId: classifyReconciliationItems
      summary: Classify IC balance pairs as Matched, Timing or Mismatch (FR-40.6, BR-40.5)
      x-passage-duty: IntercompanyReconcile
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
      responses:
        '200':
          description: Each item with its status and difference, plus counts per status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/interco/charges:preview:
    post:
      operationId: previewIntercompanyCharge
      summary: Price an IC charge by the transfer price effective on its date and derive its Journal-mode legs (FR-40.13, BR-40.12, AC-40.11)
      x-passage-duty: IntercompanyPost
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargePreviewRequest'
      responses:
        '200':
          description: Applied transfer price, cost, price, margin and the legs of both entities under one pair id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargePreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: IC-0821 no transfer price for the category and role on the date, or IC-0805 no accounting matrix row
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/interco/centralized-payments:preview:
    post:
      operationId: previewCentralizedPayment
      summary: Derive the paying and owning entities' legs of one pay- or receive-on-behalf payment (FR-40.12, AC-40.10)
      x-passage-duty: IntercompanyConfigure
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CentralPaymentPreviewRequest'
      responses:
        '200':
          description: Legs of both entities under one pair id, balanced in each entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: IC-0805 no accounting matrix row for the entity pair
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/interco/planning-groups:sequence:
    post:
      operationId: sequencePlanningGroup
      summary: Run order of a planning group (buyers before suppliers), IC demand dates and stale suppliers (FR-40.15, BR-40.13, AC-40.16)
      x-passage-duty: IntercompanyPlan
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningSequenceRequest'
      responses:
        '200':
          description: Entities in run order, IC demand per planned order, and IC-0815 warnings for a replanned buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningSequence'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: IC-0816 the partner graph has a cycle whose entities do not all carry an explicit sequence
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/interco/chains:preview:
    post:
      operationId: previewDeliveryChain
      summary: Validate a direct delivery chain and list what the seller's packing slip posts in the buyer entity in one saga (FR-40.3, AC-40.3)
      x-passage-duty: IntercompanyView
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChainPreviewRequest'
      responses:
        '200':
          description: The buyer's product receipt and customer packing slip at the shipped quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: IC-0801 no active pairing between the sales order's seller and the purchase order's buyer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/interco/transfer-pricing/evidence:export:
    post:
      operationId: exportTransferPricingEvidence
      summary: Render the transfer-pricing evidence file for one entity pair and period as CSV (FR-40.4)
      x-passage-duty: IntercompanyView
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceRequest'
      responses:
        '200':
          description: |
            CSV with the header seller_entity, buyer_entity, period, item,
            quantity, currency, price, cost, margin, margin_pct, basis and one
            line per row in request order. Amounts are at the currency minor
            unit; margin_pct is margin / price × 100 at two decimals (0.00 for a
            zero price). Text cells starting with = + - @ are prefixed with an
            apostrophe.
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="tp-evidence-P-S-2026-11.csv"' }
          content:
            text/csv:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/interco/centralized-payments/reversals:preview:
    post:
      operationId: previewCentralizedPaymentReversal
      summary: Derive the reversal of a centralized payment returned by the bank, in both entities under the original pair id (BR-40.11)
      x-passage-duty: IntercompanyConfigure
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CentralPaymentReversalRequest'
      responses:
        '200':
          description: The original legs with every side flipped, under the original pair id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: IC-0805 no accounting matrix row for the entity pair
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/interco/partners:
    get:
      operationId: listIntercompanyPartners
      summary: List the tenant's trading-partner pairings, ordered by id (FR-40.1)
      x-passage-duty: IntercompanyView
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - { name: entity, in: query, description: Entity code on either side, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: after, in: query, description: nextCursor of the previous page, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page of pairings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createIntercompanyPartner
      summary: Pair a customer in the seller entity with a vendor in the buyer entity, with action, pricing and tolerance policies (FR-40.1)
      description: |
        One active pairing per entity pair and direction. Omitted policies take
        the ic.partnerPolicy defaults: active, auto-create on, auto-confirm and
        auto-post off, PriceList pricing, tolerance price 0.5 % and date 2 days.
        Publishes dev.passage.interco.partner.created.v1 through the outbox.
      x-passage-duty: IntercompanyConfigure
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartnerRequest'
      responses:
        '201':
          description: The stored pairing at version 1, or the stored response of an earlier request with the same Idempotency-Key (Idempotent-Replayed true)
          headers:
            ETag: { description: Pairing version, schema: { type: string } }
            Location: { schema: { type: string } }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          description: IC-0840 an active pairing already exists for this direction
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: IC-0841 the Idempotency-Key was used with a different request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/interco/partners/{id}:
    get:
      operationId: getIntercompanyPartner
      summary: Read one pairing with its current policy version
      x-passage-duty: IntercompanyView
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/PartnerID'
      responses:
        '200':
          description: The pairing
          headers:
            ETag: { description: Pairing version, schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          description: IC-0842 no pairing with this id in the tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      operationId: updateIntercompanyPartner
      summary: Change, activate or deactivate a pairing's policy; the version increments (FR-40.1 policies versioned)
      description: |
        The direction (seller and buyer entity) never changes. A patch that
        changes nothing returns the pairing at its current version. Publishes
        dev.passage.interco.partner.updated.v1 through the outbox.
      x-passage-duty: IntercompanyConfigure
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/PartnerID'
        - { name: If-Match, in: header, required: true, description: 'The ETag of the version being changed, such as "1"', schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartnerRequest'
      responses:
        '200':
          description: The pairing after the change
          headers:
            ETag: { description: Pairing version, schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          description: IC-0842 no pairing with this id in the tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: IC-0840 activating would make a second active pairing for the direction
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: IC-0843 If-Match names a version the pairing no longer has
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: IC-0843 If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/interco/partners/{id}/lines:price:
    post:
      operationId: priceIntercompanyLine
      summary: Price one IC line from the pairing's pricing policy and return the pricing basis the IC document link records (FR-40.4)
      description: |
        PriceList takes listPrice, CostPlus the unitCost with the pairing's
        markup, TransferPriceTable the row for the item effective on the line
        date (category Item; rows are sent with the request until transfer
        prices are stored). The unit price keeps full precision; the extended
        amount is rounded once to the currency minor unit. Nothing is stored.
      x-passage-duty: IntercompanyView
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/PartnerID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceLineRequest'
      responses:
        '200':
          description: The priced line and its basis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricedLine'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          description: IC-0842 no pairing with this id in the tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: IC-0801 the pairing is inactive; IC-0821 no transfer price for the item on the date
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/interco/partners/{id}/changes:evaluate:
    post:
      operationId: evaluateIntercompanyOrderChange
      summary: Decide whether a change to a linked sales order updates the mirror PO silently or sends it for re-approval (BR-40.3, IC-0804)
      description: |
        Quantity must not change; the unit price may move by the pairing's
        price tolerance (percent of the old price) and the date by its date
        tolerance in days, both inclusive. Nothing is stored; routing the
        mirror PO to the wave-17 workflow comes with the mirror saga.
      x-passage-duty: IntercompanyView
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/PartnerID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateChangeRequest'
      responses:
        '200':
          description: The decision with every tolerance breach
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeDecision'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          description: IC-0842 no pairing with this id in the tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /healthz:
    get:
      operationId: healthz
      x-passage-duty: public
      responses:
        '200':
          description: Liveness
  /readyz:
    get:
      operationId: readyz
      x-passage-duty: public
      responses:
        '200':
          description: Readiness
components:
  parameters:
    TenantHeader:
      name: X-Passage-Tenant
      in: header
      required: true
      description: Set by the gateway; UUIDv7 tenant id
      schema:
        type: string
        format: uuid
    DutiesHeader:
      name: X-Passage-Duties
      in: header
      required: true
      description: Set by the gateway; comma-separated duties of the caller
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client key, at most 255 characters; a retry with the same key and body replays the stored response for the tenant
      schema:
        type: string
        maxLength: 255
    PartnerID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 problem details (COM-0001 validation, AUTH-0001 no tenant, AUTH-0003 missing duty)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{1,6})?$'
    JournalPreviewRequest:
      type: object
      additionalProperties: false
      required: [entity, account, side, amount, currency, offsetEntity, offsetAccount, matrix]
      properties:
        entity: { type: string, minLength: 1, description: Legal entity A that books the line }
        account: { type: string, minLength: 1 }
        side: { type: string, enum: [debit, credit] }
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,6})?$'
          description: Positive decimal in the entity currency; rounded to the currency minor unit
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        offsetEntity: { type: string, minLength: 1, description: Offset entity B; must differ from entity }
        offsetAccount: { type: string, minLength: 1, description: Account in B that takes the opposite side }
        counterCurrency: { type: string, pattern: '^[A-Z]{3}$', description: B's currency; defaults to currency }
        rate:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,6})?$'
          description: Positive document rate from currency to counterCurrency; required when they differ, else 1
        matrix:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MatrixRow'
    MatrixRow:
      type: object
      additionalProperties: false
      required: [entityA, entityB, dueFrom, dueTo]
      properties:
        entityA: { type: string, minLength: 1 }
        entityB: { type: string, minLength: 1 }
        dueFrom: { type: string, minLength: 1, description: Receivable account in entityA for entityB }
        dueTo: { type: string, minLength: 1, description: Payable account in entityB for entityA }
    JournalPreview:
      type: object
      required: [pairId, balanced, legs]
      properties:
        pairId: { type: string, format: uuid, description: Shared ic_pair_id for both entities' legs }
        balanced: { type: boolean }
        legs:
          type: array
          items:
            $ref: '#/components/schemas/JournalLeg'
    JournalLeg:
      type: object
      required: [entity, account, side, amount, currency]
      properties:
        entity: { type: string }
        account: { type: string }
        side: { type: string, enum: [debit, credit] }
        amount: { type: string, description: Positive, at the currency minor unit }
        currency: { type: string }
    ClassifyRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        fxTolerancePct:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,6})?$'
          description: ic.fxTolerancePct, 0 to 5; defaults to 0.5
        items:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: '#/components/schemas/ReconciliationItem'
    ReconciliationItem:
      type: object
      additionalProperties: false
      required: [entityA, entityB, period, currency, amountA, amountB]
      properties:
        id: { type: string, description: Echoed back; defaults to item-<n> }
        icPairId: { type: string }
        entityA: { type: string, minLength: 1 }
        entityB: { type: string, minLength: 1, description: Must differ from entityA }
        period: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        amountA: { $ref: '#/components/schemas/Decimal', description: Due-from booked in A in the period }
        amountB: { $ref: '#/components/schemas/Decimal', description: Due-to booked in B in the period }
        nextPeriodA: { $ref: '#/components/schemas/Decimal', description: What A booked for the pair in the next period }
        nextPeriodB: { $ref: '#/components/schemas/Decimal', description: What B booked for the pair in the next period }
        fxApplies: { type: boolean, description: The two sides were converted from different accounting currencies }
    ClassifyResult:
      type: object
      required: [fxTolerancePct, items, summary]
      properties:
        fxTolerancePct: { type: string }
        items:
          type: array
          items:
            type: object
            required: [id, entityA, entityB, period, currency, amountA, amountB, difference, status, toleranceApplied]
            properties:
              id: { type: string }
              icPairId: { type: string }
              entityA: { type: string }
              entityB: { type: string }
              period: { type: string }
              currency: { type: string }
              amountA: { type: string }
              amountB: { type: string }
              difference: { type: string, description: amountA − amountB in the period }
              status: { type: string, enum: [Matched, Timing, Mismatch] }
              toleranceApplied: { type: boolean, description: Only the FX tolerance made the sides agree }
        summary:
          type: object
          required: [matched, timing, mismatch, blocking]
          properties:
            matched: { type: integer }
            timing: { type: integer }
            mismatch: { type: integer }
            blocking:
              type: boolean
              description: True while any item is a Mismatch; consolidation is then blocked (CNS-0901) unless ConsolidationApprove overrides (FR-40.6)
    Amount:
      type: string
      pattern: '^[0-9]+(\.[0-9]{1,6})?$'
      description: Non-negative decimal with at most 6 decimals
    Date:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    ChargePreviewRequest:
      type: object
      additionalProperties: false
      required: [lendingEntity, borrowingEntity, category, transactionDate, quantity, unitCost, currency, transferPrices, costAccount, recoveryAccount, marginAccount, matrix]
      properties:
        lendingEntity: { type: string, minLength: 1, description: Entity whose resource or cost is charged }
        borrowingEntity: { type: string, minLength: 1, description: Entity that bears the cost; must differ from lendingEntity }
        category: { type: string, enum: [Expense, Hour, Item, Fee] }
        resourceRole: { type: string, description: Resource role the transfer price is keyed by; empty when the category has none }
        transactionDate: { $ref: '#/components/schemas/Date', description: Source transaction date that selects the transfer price }
        quantity: { $ref: '#/components/schemas/Amount', description: Above 0 }
        unitCost: { $ref: '#/components/schemas/Amount', description: Lending entity's unit cost in currency }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        transferPrices:
          type: array
          minItems: 1
          maxItems: 1000
          description: ic.transferPrices rows for this lender and borrower, in currency
          items:
            $ref: '#/components/schemas/TransferPrice'
        costAccount: { type: string, minLength: 1, description: Borrower's cost account (for example project cost) }
        recoveryAccount: { type: string, minLength: 1, description: Lender's cost recovery account }
        marginAccount: { type: string, minLength: 1, description: Lender's IC margin account }
        matrix:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MatrixRow'
    TransferPrice:
      type: object
      additionalProperties: false
      required: [category, method, effectiveFrom]
      properties:
        category: { type: string, enum: [Expense, Hour, Item, Fee] }
        resourceRole: { type: string }
        method: { type: string, enum: [Cost, CostPlus, Table] }
        markupPct: { $ref: '#/components/schemas/Amount', description: Required for CostPlus }
        unitPrice: { $ref: '#/components/schemas/Amount', description: Required for Table }
        effectiveFrom: { $ref: '#/components/schemas/Date' }
    ChargePreview:
      type: object
      required: [pairId, currency, transferPrice, cost, price, margin, balanced, legs]
      properties:
        pairId: { type: string, format: uuid }
        currency: { type: string }
        transferPrice:
          type: object
          required: [method, effectiveFrom]
          properties:
            method: { type: string, enum: [Cost, CostPlus, Table] }
            markupPct: { type: string }
            unitPrice: { type: string }
            effectiveFrom: { type: string, format: date }
        cost: { type: string, description: quantity × unit cost }
        price: { type: string, description: Charged to the borrower }
        margin: { type: string, description: price − cost; negative when a table price is below cost }
        balanced: { type: boolean }
        legs:
          type: array
          items:
            $ref: '#/components/schemas/JournalLeg'
    CentralPaymentPreviewRequest:
      type: object
      additionalProperties: false
      required: [payingEntity, owningEntity, paymentMethod, direction, amount, currency, bankAccount, owningAccount, matrix]
      properties:
        payingEntity: { type: string, minLength: 1, description: Entity whose bank pays or receives }
        owningEntity: { type: string, minLength: 1, description: Entity that owns the open item; must differ from payingEntity }
        paymentMethod: { type: string, minLength: 1 }
        direction: { type: string, enum: [Pay, Receive] }
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,6})?$'
          description: Positive; rounded to the currency minor unit
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        bankAccount: { type: string, minLength: 1, description: Paying entity's bank account }
        owningAccount: { type: string, minLength: 1, description: Owning entity's vendor (Pay) or customer (Receive) account }
        matrix:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MatrixRow'
    CentralPaymentReversalRequest:
      description: The original centralized payment and the pair id it posted under
      allOf:
        - $ref: '#/components/schemas/CentralPaymentPreviewRequest'
        - type: object
          required: [pairId]
          properties:
            pairId: { type: string, format: uuid, description: Pair id of the original payment }
    ChainLeg:
      type: object
      additionalProperties: false
      required: [docId, entity, quantity]
      properties:
        docId: { type: string, minLength: 1 }
        entity: { type: string, minLength: 1 }
        quantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,6})?$'
          description: Positive; equal on the three documents
    ChainPreviewRequest:
      type: object
      additionalProperties: false
      required: [chainId, partner, customerOrder, icPurchase, icSales]
      properties:
        chainId: { type: string, minLength: 1 }
        partner:
          type: object
          additionalProperties: false
          required: [sellerEntity, buyerEntity, active]
          properties:
            sellerEntity: { type: string, minLength: 1, description: Entity of the IC sales order }
            buyerEntity: { type: string, minLength: 1, description: Entity of the IC purchase order and the customer order }
            active: { type: boolean }
        customerOrder:
          $ref: '#/components/schemas/ChainLeg'
        icPurchase:
          $ref: '#/components/schemas/ChainLeg'
        icSales:
          $ref: '#/components/schemas/ChainLeg'
        shippedQuantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,6})?$'
          description: Quantity on the packing slip; defaults to the IC sales order quantity and must not exceed it
    ChainPreview:
      type: object
      required: [chainId, postings]
      properties:
        chainId: { type: string }
        postings:
          type: array
          items:
            type: object
            required: [kind, entity, docId, quantity]
            properties:
              kind: { type: string, enum: [ProductReceipt, CustomerPackingSlip] }
              entity: { type: string }
              docId: { type: string }
              quantity: { type: string }
    EvidenceRequest:
      type: object
      additionalProperties: false
      required: [sellerEntity, buyerEntity, period, currency, rows]
      properties:
        sellerEntity: { type: string, minLength: 1 }
        buyerEntity: { type: string, minLength: 1, description: Must differ from sellerEntity }
        period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        rows:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [item, quantity, price, cost, basis]
            properties:
              item: { type: string, minLength: 1, description: Item number or charge category }
              quantity:
                type: string
                pattern: '^[0-9]+(\.[0-9]{1,6})?$'
                description: Positive
              price:
                $ref: '#/components/schemas/Amount'
              cost:
                $ref: '#/components/schemas/Amount'
              basis: { type: string, minLength: 1, description: Pricing basis recorded on the link, such as CostPlus }
    PlanningSequenceRequest:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [entityId]
            properties:
              entityId: { type: string, minLength: 1 }
              sequence: { type: integer, minimum: 0, description: Explicit run position; 0 or absent means none. Required for every entity on a cycle }
        edges:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [buyer, supplier]
            properties:
              buyer: { type: string, minLength: 1 }
              supplier: { type: string, minLength: 1 }
              leadTimeDays: { type: integer, minimum: 0, description: IC transport lead time }
        plannedOrders:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [buyer, supplier, item, quantity, requestedDate]
            properties:
              buyer: { type: string, minLength: 1 }
              supplier: { type: string, minLength: 1, description: Needs an edge from buyer }
              item: { type: string, minLength: 1 }
              quantity: { $ref: '#/components/schemas/Amount', description: Above 0 }
              requestedDate: { $ref: '#/components/schemas/Date' }
        replannedBuyer: { type: string, description: A member replanned after the run; its already planned suppliers are reported stale }
    PlanningSequence:
      type: object
      required: [order, demand, staleSuppliers, warnings]
      properties:
        order:
          type: array
          items: { type: string }
        demand:
          type: array
          items:
            type: object
            required: [buyer, supplier, item, quantity, dueDate]
            properties:
              buyer: { type: string }
              supplier: { type: string }
              item: { type: string }
              quantity: { type: string }
              dueDate: { type: string, format: date, description: requestedDate − leadTimeDays }
        staleSuppliers:
          type: array
          items: { type: string }
        warnings:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [IC-0815] }
              message: { type: string }
    PartnerActions:
      type: object
      additionalProperties: false
      required: [autoCreate, autoConfirm, autoPostPackingSlip, autoPostInvoice]
      properties:
        autoCreate: { type: boolean, description: Create the mirror document automatically }
        autoConfirm: { type: boolean }
        autoPostPackingSlip: { type: boolean }
        autoPostInvoice: { type: boolean }
    PricingPolicy:
      type: string
      enum: [PriceList, CostPlus, TransferPriceTable]
    ToleranceInput:
      type: object
      additionalProperties: false
      properties:
        pricePct: { $ref: '#/components/schemas/Amount', description: 0 to 100 percent of the old unit price }
        dateDays: { type: integer, minimum: 0, maximum: 30 }
    Code:
      type: string
      minLength: 1
      maxLength: 64
    CreatePartnerRequest:
      type: object
      additionalProperties: false
      required: [sellerEntity, buyerEntity, customerAccount, vendorAccount]
      properties:
        sellerEntity: { $ref: '#/components/schemas/Code', description: Selling entity (customer side) }
        buyerEntity: { $ref: '#/components/schemas/Code', description: Buying entity (vendor side); differs from sellerEntity }
        customerAccount: { $ref: '#/components/schemas/Code', description: IC customer in the seller entity that stands for the buyer }
        vendorAccount: { $ref: '#/components/schemas/Code', description: IC vendor in the buyer entity that stands for the seller }
        active: { type: boolean, default: true }
        actions: { $ref: '#/components/schemas/PartnerActions' }
        pricing: { $ref: '#/components/schemas/PricingPolicy' }
        markupPct: { $ref: '#/components/schemas/Amount', description: Cost-plus markup, 0 to 1000 percent }
        tolerance: { $ref: '#/components/schemas/ToleranceInput' }
    UpdatePartnerRequest:
      type: object
      additionalProperties: false
      description: Every field is optional; omitted fields keep their stored value
      properties:
        customerAccount: { $ref: '#/components/schemas/Code' }
        vendorAccount: { $ref: '#/components/schemas/Code' }
        active: { type: boolean }
        actions: { $ref: '#/components/schemas/PartnerActions' }
        pricing: { $ref: '#/components/schemas/PricingPolicy' }
        markupPct: { $ref: '#/components/schemas/Amount' }
        tolerance: { $ref: '#/components/schemas/ToleranceInput' }
    Partner:
      type: object
      required: [id, version, sellerEntity, buyerEntity, customerAccount, vendorAccount, active, actions, pricing, markupPct, tolerance, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        sellerEntity: { type: string }
        buyerEntity: { type: string }
        customerAccount: { type: string }
        vendorAccount: { type: string }
        active: { type: boolean }
        actions: { $ref: '#/components/schemas/PartnerActions' }
        pricing: { $ref: '#/components/schemas/PricingPolicy' }
        markupPct: { $ref: '#/components/schemas/Amount' }
        tolerance:
          type: object
          required: [pricePct, dateDays]
          properties:
            pricePct: { $ref: '#/components/schemas/Amount' }
            dateDays: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PartnerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Partner' }
        nextCursor: { type: string, format: uuid, description: Absent on the last page }
    LineTransferPrice:
      type: object
      additionalProperties: false
      required: [item, method, effectiveFrom]
      properties:
        item: { $ref: '#/components/schemas/Code' }
        method: { type: string, enum: [Cost, CostPlus, Table] }
        markupPct: { $ref: '#/components/schemas/Amount', description: Required for CostPlus }
        unitPrice: { $ref: '#/components/schemas/Amount', description: Required for Table, in the line currency }
        effectiveFrom: { $ref: '#/components/schemas/Date' }
    PriceLineRequest:
      type: object
      additionalProperties: false
      required: [item, date, currency, quantity]
      properties:
        item: { $ref: '#/components/schemas/Code' }
        date: { $ref: '#/components/schemas/Date' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        quantity: { $ref: '#/components/schemas/Amount', description: Above 0 }
        listPrice: { $ref: '#/components/schemas/Amount', description: Unit list price; required for a PriceList pairing }
        unitCost: { $ref: '#/components/schemas/Amount', description: Unit cost; required for CostPlus and TransferPriceTable pairings }
        transferPrices:
          type: array
          maxItems: 1000
          description: Required for a TransferPriceTable pairing
          items: { $ref: '#/components/schemas/LineTransferPrice' }
    PricedLine:
      type: object
      required: [partnerId, partnerVersion, item, quantity, currency, unitPrice, extended, basis]
      properties:
        partnerId: { type: string, format: uuid }
        partnerVersion: { type: integer }
        item: { type: string }
        quantity: { $ref: '#/components/schemas/Amount' }
        currency: { type: string }
        unitPrice: { $ref: '#/components/schemas/Amount', description: Full precision }
        extended: { $ref: '#/components/schemas/Amount', description: quantity × unitPrice at the currency minor unit }
        basis:
          type: object
          description: The pricing_basis the IC document link records
          required: [policy, method, source]
          properties:
            policy: { $ref: '#/components/schemas/PricingPolicy' }
            method: { type: string, enum: [PriceList, Cost, CostPlus, Table] }
            markupPct: { $ref: '#/components/schemas/Amount', description: Present for CostPlus }
            source: { type: string, enum: [partner-policy, transfer-price-table] }
            effectiveFrom: { $ref: '#/components/schemas/Date', description: Present when a transfer price row applied }
    EvaluateChangeRequest:
      type: object
      additionalProperties: false
      required: [oldQuantity, newQuantity, oldPrice, newPrice, oldDate, newDate]
      properties:
        oldQuantity: { $ref: '#/components/schemas/Amount' }
        newQuantity: { $ref: '#/components/schemas/Amount' }
        oldPrice: { $ref: '#/components/schemas/Amount', description: Unit price before the change }
        newPrice: { $ref: '#/components/schemas/Amount' }
        oldDate: { $ref: '#/components/schemas/Date' }
        newDate: { $ref: '#/components/schemas/Date' }
    ChangeDecision:
      type: object
      required: [partnerId, partnerVersion, action, reasons, dateShiftDays, tolerance]
      properties:
        partnerId: { type: string, format: uuid }
        partnerVersion: { type: integer }
        action: { type: string, enum: [UpdateSilently, ReApprove] }
        code: { type: string, enum: [IC-0804], description: Present for ReApprove }
        reasons: { type: array, items: { type: string } }
        dateShiftDays: { type: integer }
        tolerance:
          type: object
          required: [pricePct, dateDays]
          properties:
            pricePct: { $ref: '#/components/schemas/Amount' }
            dateDays: { type: integer }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, description: 'https://passage.dev/problems/<code>' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
