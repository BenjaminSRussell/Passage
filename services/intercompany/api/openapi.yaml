openapi: 3.1.0
info:
  title: Passage Intercompany
  version: 0.2.0
  description: |
    Wave 40, slices 1 and 2. Stateless intercompany calculations: the caller
    supplies the accounting matrix, balances, transfer prices or planning group
    and the service returns the derived due-to / due-from journal (BR-40.4),
    the reconciliation classification (FR-40.6, BR-40.5), the priced IC charge
    with its Journal-mode legs (FR-40.13, BR-40.12), the centralized payment
    legs (FR-40.12) or the planning group run sequence with IC demand (FR-40.15,
    BR-40.13). Nothing is stored and no event is published, so no endpoint
    takes an Idempotency-Key. Mirror sagas, persisted links, reconciliation
    runs, stored setups, charge posting and the planning run are later slices
    of PSG-40 (see NOT-IMPLEMENTED.md). Browser calls go through the web BFF at
    /api/v1/interco/..., which rewrites to these paths and sets the tenant and
    duty headers.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/interco/journals:preview:
    post:
      operationId: previewIntercompanyJournal
      summary: Derive the balanced due-to / due-from journal for one intercompany line (BR-40.4, AC-40.4)
      x-passage-duty: IntercompanyPost
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalPreviewRequest'
      responses:
        '200':
          description: Derived legs, one pair id, balanced in each entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: IC-0805 no accounting matrix row for the entity pair
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/interco/reconciliations:classify:
    post:
      operationId: classifyReconciliationItems
      summary: Classify IC balance pairs as Matched, Timing or Mismatch (FR-40.6, BR-40.5)
      x-passage-duty: IntercompanyReconcile
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
      responses:
        '200':
          description: Each item with its status and difference, plus counts per status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/interco/charges:preview:
    post:
      operationId: previewIntercompanyCharge
      summary: Price an IC charge by the transfer price effective on its date and derive its Journal-mode legs (FR-40.13, BR-40.12, AC-40.11)
      x-passage-duty: IntercompanyPost
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargePreviewRequest'
      responses:
        '200':
          description: Applied transfer price, cost, price, margin and the legs of both entities under one pair id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargePreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: IC-0821 no transfer price for the category and role on the date, or IC-0805 no accounting matrix row
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/interco/centralized-payments:preview:
    post:
      operationId: previewCentralizedPayment
      summary: Derive the paying and owning entities' legs of one pay- or receive-on-behalf payment (FR-40.12, AC-40.10)
      x-passage-duty: IntercompanyConfigure
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CentralPaymentPreviewRequest'
      responses:
        '200':
          description: Legs of both entities under one pair id, balanced in each entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: IC-0805 no accounting matrix row for the entity pair
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/interco/planning-groups:sequence:
    post:
      operationId: sequencePlanningGroup
      summary: Run order of a planning group (buyers before suppliers), IC demand dates and stale suppliers (FR-40.15, BR-40.13, AC-40.16)
      x-passage-duty: IntercompanyPlan
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningSequenceRequest'
      responses:
        '200':
          description: Entities in run order, IC demand per planned order, and IC-0815 warnings for a replanned buyer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningSequence'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: IC-0816 the partner graph has a cycle whose entities do not all carry an explicit sequence
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /healthz:
    get:
      operationId: healthz
      x-passage-duty: public
      responses:
        '200':
          description: Liveness
  /readyz:
    get:
      operationId: readyz
      x-passage-duty: public
      responses:
        '200':
          description: Readiness (the stateless slice has no dependency to check)
components:
  parameters:
    TenantHeader:
      name: X-Passage-Tenant
      in: header
      required: true
      description: Set by the gateway; UUIDv7 tenant id
      schema:
        type: string
        format: uuid
    DutiesHeader:
      name: X-Passage-Duties
      in: header
      required: true
      description: Set by the gateway; comma-separated duties of the caller
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem details (COM-0001 validation, AUTH-0001 no tenant, AUTH-0003 missing duty)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{1,6})?$'
    JournalPreviewRequest:
      type: object
      additionalProperties: false
      required: [entity, account, side, amount, currency, offsetEntity, offsetAccount, matrix]
      properties:
        entity: { type: string, minLength: 1, description: Legal entity A that books the line }
        account: { type: string, minLength: 1 }
        side: { type: string, enum: [debit, credit] }
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,6})?$'
          description: Positive decimal in the entity currency; rounded to the currency minor unit
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        offsetEntity: { type: string, minLength: 1, description: Offset entity B; must differ from entity }
        offsetAccount: { type: string, minLength: 1, description: Account in B that takes the opposite side }
        counterCurrency: { type: string, pattern: '^[A-Z]{3}$', description: B's currency; defaults to currency }
        rate:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,6})?$'
          description: Positive document rate from currency to counterCurrency; required when they differ, else 1
        matrix:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MatrixRow'
    MatrixRow:
      type: object
      additionalProperties: false
      required: [entityA, entityB, dueFrom, dueTo]
      properties:
        entityA: { type: string, minLength: 1 }
        entityB: { type: string, minLength: 1 }
        dueFrom: { type: string, minLength: 1, description: Receivable account in entityA for entityB }
        dueTo: { type: string, minLength: 1, description: Payable account in entityB for entityA }
    JournalPreview:
      type: object
      required: [pairId, balanced, legs]
      properties:
        pairId: { type: string, format: uuid, description: Shared ic_pair_id for both entities' legs }
        balanced: { type: boolean }
        legs:
          type: array
          items:
            $ref: '#/components/schemas/JournalLeg'
    JournalLeg:
      type: object
      required: [entity, account, side, amount, currency]
      properties:
        entity: { type: string }
        account: { type: string }
        side: { type: string, enum: [debit, credit] }
        amount: { type: string, description: Positive, at the currency minor unit }
        currency: { type: string }
    ClassifyRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        fxTolerancePct:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,6})?$'
          description: ic.fxTolerancePct, 0 to 5; defaults to 0.5
        items:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: '#/components/schemas/ReconciliationItem'
    ReconciliationItem:
      type: object
      additionalProperties: false
      required: [entityA, entityB, period, currency, amountA, amountB]
      properties:
        id: { type: string, description: Echoed back; defaults to item-<n> }
        icPairId: { type: string }
        entityA: { type: string, minLength: 1 }
        entityB: { type: string, minLength: 1, description: Must differ from entityA }
        period: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        amountA: { $ref: '#/components/schemas/Decimal', description: Due-from booked in A in the period }
        amountB: { $ref: '#/components/schemas/Decimal', description: Due-to booked in B in the period }
        nextPeriodA: { $ref: '#/components/schemas/Decimal', description: What A booked for the pair in the next period }
        nextPeriodB: { $ref: '#/components/schemas/Decimal', description: What B booked for the pair in the next period }
        fxApplies: { type: boolean, description: The two sides were converted from different accounting currencies }
    ClassifyResult:
      type: object
      required: [fxTolerancePct, items, summary]
      properties:
        fxTolerancePct: { type: string }
        items:
          type: array
          items:
            type: object
            required: [id, entityA, entityB, period, currency, amountA, amountB, difference, status, toleranceApplied]
            properties:
              id: { type: string }
              icPairId: { type: string }
              entityA: { type: string }
              entityB: { type: string }
              period: { type: string }
              currency: { type: string }
              amountA: { type: string }
              amountB: { type: string }
              difference: { type: string, description: amountA − amountB in the period }
              status: { type: string, enum: [Matched, Timing, Mismatch] }
              toleranceApplied: { type: boolean, description: Only the FX tolerance made the sides agree }
        summary:
          type: object
          required: [matched, timing, mismatch]
          properties:
            matched: { type: integer }
            timing: { type: integer }
            mismatch: { type: integer }
    Amount:
      type: string
      pattern: '^[0-9]+(\.[0-9]{1,6})?$'
      description: Non-negative decimal with at most 6 decimals
    Date:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    ChargePreviewRequest:
      type: object
      additionalProperties: false
      required: [lendingEntity, borrowingEntity, category, transactionDate, quantity, unitCost, currency, transferPrices, costAccount, recoveryAccount, marginAccount, matrix]
      properties:
        lendingEntity: { type: string, minLength: 1, description: Entity whose resource or cost is charged }
        borrowingEntity: { type: string, minLength: 1, description: Entity that bears the cost; must differ from lendingEntity }
        category: { type: string, enum: [Expense, Hour, Item, Fee] }
        resourceRole: { type: string, description: Resource role the transfer price is keyed by; empty when the category has none }
        transactionDate: { $ref: '#/components/schemas/Date', description: Source transaction date that selects the transfer price }
        quantity: { $ref: '#/components/schemas/Amount', description: Above 0 }
        unitCost: { $ref: '#/components/schemas/Amount', description: Lending entity's unit cost in currency }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        transferPrices:
          type: array
          minItems: 1
          maxItems: 1000
          description: ic.transferPrices rows for this lender and borrower, in currency
          items:
            $ref: '#/components/schemas/TransferPrice'
        costAccount: { type: string, minLength: 1, description: Borrower's cost account (for example project cost) }
        recoveryAccount: { type: string, minLength: 1, description: Lender's cost recovery account }
        marginAccount: { type: string, minLength: 1, description: Lender's IC margin account }
        matrix:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MatrixRow'
    TransferPrice:
      type: object
      additionalProperties: false
      required: [category, method, effectiveFrom]
      properties:
        category: { type: string, enum: [Expense, Hour, Item, Fee] }
        resourceRole: { type: string }
        method: { type: string, enum: [Cost, CostPlus, Table] }
        markupPct: { $ref: '#/components/schemas/Amount', description: Required for CostPlus }
        unitPrice: { $ref: '#/components/schemas/Amount', description: Required for Table }
        effectiveFrom: { $ref: '#/components/schemas/Date' }
    ChargePreview:
      type: object
      required: [pairId, currency, transferPrice, cost, price, margin, balanced, legs]
      properties:
        pairId: { type: string, format: uuid }
        currency: { type: string }
        transferPrice:
          type: object
          required: [method, effectiveFrom]
          properties:
            method: { type: string, enum: [Cost, CostPlus, Table] }
            markupPct: { type: string }
            unitPrice: { type: string }
            effectiveFrom: { type: string, format: date }
        cost: { type: string, description: quantity × unit cost }
        price: { type: string, description: Charged to the borrower }
        margin: { type: string, description: price − cost; negative when a table price is below cost }
        balanced: { type: boolean }
        legs:
          type: array
          items:
            $ref: '#/components/schemas/JournalLeg'
    CentralPaymentPreviewRequest:
      type: object
      additionalProperties: false
      required: [payingEntity, owningEntity, paymentMethod, direction, amount, currency, bankAccount, owningAccount, matrix]
      properties:
        payingEntity: { type: string, minLength: 1, description: Entity whose bank pays or receives }
        owningEntity: { type: string, minLength: 1, description: Entity that owns the open item; must differ from payingEntity }
        paymentMethod: { type: string, minLength: 1 }
        direction: { type: string, enum: [Pay, Receive] }
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,6})?$'
          description: Positive; rounded to the currency minor unit
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        bankAccount: { type: string, minLength: 1, description: Paying entity's bank account }
        owningAccount: { type: string, minLength: 1, description: Owning entity's vendor (Pay) or customer (Receive) account }
        matrix:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MatrixRow'
    PlanningSequenceRequest:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [entityId]
            properties:
              entityId: { type: string, minLength: 1 }
              sequence: { type: integer, minimum: 0, description: Explicit run position; 0 or absent means none. Required for every entity on a cycle }
        edges:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [buyer, supplier]
            properties:
              buyer: { type: string, minLength: 1 }
              supplier: { type: string, minLength: 1 }
              leadTimeDays: { type: integer, minimum: 0, description: IC transport lead time }
        plannedOrders:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [buyer, supplier, item, quantity, requestedDate]
            properties:
              buyer: { type: string, minLength: 1 }
              supplier: { type: string, minLength: 1, description: Needs an edge from buyer }
              item: { type: string, minLength: 1 }
              quantity: { $ref: '#/components/schemas/Amount', description: Above 0 }
              requestedDate: { $ref: '#/components/schemas/Date' }
        replannedBuyer: { type: string, description: A member replanned after the run; its already planned suppliers are reported stale }
    PlanningSequence:
      type: object
      required: [order, demand, staleSuppliers, warnings]
      properties:
        order:
          type: array
          items: { type: string }
        demand:
          type: array
          items:
            type: object
            required: [buyer, supplier, item, quantity, dueDate]
            properties:
              buyer: { type: string }
              supplier: { type: string }
              item: { type: string }
              quantity: { type: string }
              dueDate: { type: string, format: date, description: requestedDate − leadTimeDays }
        staleSuppliers:
          type: array
          items: { type: string }
        warnings:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [IC-0815] }
              message: { type: string }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, description: 'https://passage.dev/problems/<code>' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
