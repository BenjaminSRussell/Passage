asyncapi: 3.0.0
info:
  title: Passage Treasury events (slices 1 and 3, PSG-36)
  version: 0.3.0
  description: |
    CloudEvents 1.0 structured envelope from platform/go/events (extensions
    tenantid, correlationid, causationid, actor). Written to the transactional
    outbox in the same transaction as the state change; the outbox aggregate is
    the statement or check id, so events of one aggregate stay ordered. Other event types of the
    treasury context (cashposition, instrument, pdc, deal, ...) are later slices.
defaultContentType: application/json
channels:
  statementImported:
    address: passage.treasury.statement
    description: Topic for treasury statement events (Debezium outbox router).
    messages:
      statementImported:
        $ref: "#/components/messages/StatementImported"
  checkVoided:
    address: passage.treasury.check
    description: Topic for treasury check events (Debezium outbox router).
    messages:
      checkVoided:
        $ref: "#/components/messages/CheckVoided"
  reconciliationMatched:
    address: passage.treasury.reconciliation
    description: Topic for treasury reconciliation events (Debezium outbox router).
    messages:
      reconciliationMatched:
        $ref: "#/components/messages/ReconciliationMatched"
      reconciliationUnmatched:
        $ref: "#/components/messages/ReconciliationUnmatched"
operations:
  publishReconciliationMatched:
    action: send
    channel:
      $ref: "#/channels/reconciliationMatched"
    summary: Statement lines were matched to items, by a run or by hand.
    messages:
      - $ref: "#/channels/reconciliationMatched/messages/reconciliationMatched"
  publishReconciliationUnmatched:
    action: send
    channel:
      $ref: "#/channels/reconciliationMatched"
    summary: A match was dissolved.
    messages:
      - $ref: "#/channels/reconciliationMatched/messages/reconciliationUnmatched"
  publishCheckVoided:
    action: send
    channel:
      $ref: "#/channels/checkVoided"
    summary: A check was voided (directly or by a reprint); AP positive pay consumes it.
    messages:
      - $ref: "#/channels/checkVoided/messages/checkVoided"
  publishStatementImported:
    action: send
    channel:
      $ref: "#/channels/statementImported"
    summary: A bank statement and its lines committed.
    messages:
      - $ref: "#/channels/statementImported/messages/statementImported"
components:
  messages:
    StatementImported:
      name: dev.passage.treasury.statement.imported.v1
      title: Statement imported
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [specversion, id, source, type, time, datacontenttype, tenantid, data]
        properties:
          specversion: {type: string, const: "1.0"}
          type: {type: string, const: dev.passage.treasury.statement.imported.v1}
          source: {type: string, const: /passage/treasury/treasury}
          id: {type: string}
          subject: {type: string, description: statement id}
          time: {type: string, format: date-time}
          datacontenttype: {type: string, const: application/json}
          tenantid: {type: string, format: uuid}
          correlationid: {type: string}
          causationid: {type: string}
          actor: {type: string}
          data:
            type: object
            required: [statementId, bankStatementRef, bankAccountId, legalEntityId, lineCount, openingBalance, closingBalance]
            properties:
              statementId: {type: string, format: uuid}
              bankStatementRef: {type: string, description: Stmt/Id from the bank file}
              bankAccountId: {type: string, format: uuid}
              legalEntityId: {type: string, format: uuid}
              lineCount: {type: integer, minimum: 0}
              openingBalance: {type: string, description: decimal string}
              closingBalance: {type: string, description: decimal string}
    CheckVoided:
      name: dev.passage.treasury.check.voided.v1
      title: Check voided
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [specversion, id, source, type, time, datacontenttype, tenantid, data]
        properties:
          specversion: {type: string, const: "1.0"}
          type: {type: string, const: dev.passage.treasury.check.voided.v1}
          source: {type: string, const: /passage/treasury/treasury}
          id: {type: string}
          subject: {type: string, description: check id}
          time: {type: string, format: date-time}
          datacontenttype: {type: string, const: application/json}
          tenantid: {type: string, format: uuid}
          correlationid: {type: string}
          causationid: {type: string}
          actor: {type: string}
          data:
            type: object
            required: [checkId, bankAccountId, number, reason, positivePayVoid]
            properties:
              checkId: {type: string, format: uuid}
              bankAccountId: {type: string, format: uuid}
              number: {type: integer, minimum: 1, description: check number, which stays consumed}
              reason: {type: string}
              unmatchedBy: {type: string}
              positivePayVoid: {type: boolean, description: "true when the check was sent or stopped, so the bank's positive pay file needs a void record (BR-36.5)"}
    ReconciliationMatched:
      name: dev.passage.treasury.reconciliation.matched.v1
      title: Reconciliation matched
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [specversion, id, source, type, time, datacontenttype, tenantid, data]
        properties:
          specversion: {type: string, const: "1.0"}
          type: {type: string, const: dev.passage.treasury.reconciliation.matched.v1}
          source: {type: string, const: /passage/treasury/treasury}
          id: {type: string}
          subject: {type: string, description: match id}
          time: {type: string, format: date-time}
          datacontenttype: {type: string, const: application/json}
          tenantid: {type: string, format: uuid}
          correlationid: {type: string}
          causationid: {type: string}
          actor: {type: string}
          data:
            type: object
            required: [matchId, statementId, bankAccountId, legalEntityId, kind, lineCount, itemCount]
            properties:
              matchId: {type: string, format: uuid}
              statementId: {type: string, format: uuid}
              bankAccountId: {type: string, format: uuid}
              legalEntityId: {type: string, format: uuid}
              kind: {type: string, enum: [auto, manual]}
              lineCount: {type: integer, minimum: 1}
              itemCount: {type: integer, minimum: 1}
              score: {type: integer, minimum: 0, maximum: 100, description: auto matches only}
    ReconciliationUnmatched:
      name: dev.passage.treasury.reconciliation.unmatched.v1
      title: Reconciliation unmatched
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [specversion, id, source, type, time, datacontenttype, tenantid, data]
        properties:
          specversion: {type: string, const: "1.0"}
          type: {type: string, const: dev.passage.treasury.reconciliation.unmatched.v1}
          source: {type: string, const: /passage/treasury/treasury}
          id: {type: string}
          subject: {type: string, description: match id}
          time: {type: string, format: date-time}
          datacontenttype: {type: string, const: application/json}
          tenantid: {type: string, format: uuid}
          correlationid: {type: string}
          causationid: {type: string}
          actor: {type: string}
          data:
            type: object
            required: [matchId, statementId, bankAccountId, legalEntityId, reason, unmatchedBy]
            properties:
              matchId: {type: string, format: uuid}
              statementId: {type: string, format: uuid}
              bankAccountId: {type: string, format: uuid}
              legalEntityId: {type: string, format: uuid}
              reason: {type: string}
              unmatchedBy: {type: string}
