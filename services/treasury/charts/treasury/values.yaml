image: { repository: ghcr.io/benjaminsrussell/treasury, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: treasury-db
migrateOnStart: false
replicaCount: 2
statement:
  maxFileMb: 50
# Scratch space for multipart uploads (two concurrent maximum-size files per pod).
uploadSpoolSize: 128Mi
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 256Mi }
serviceMonitor: { enabled: false }
# Bank connectivity keys stay in Vault transit and are never exported. Leave addr
# empty to switch it off (refused outside dev while bankChannels is set; the
# chart still emits TREASURY_BANK_CHANNELS so that refusal fires). Use k8sRole
# (Vault Kubernetes auth) or tokenSecret (a Secret holding VAULT_TOKEN).
# The Vault role must set bound_service_account_names to this release's
# ServiceAccount (named after the release) and bound_service_account_namespaces
# to its namespace, so no other pod can log in. sftpKeyVersion pins the transit
# key the bank is onboarded with; a rotation does not switch the login key.
vault:
  addr: ""
  k8sRole: ""
  k8sMount: kubernetes
  tokenSecret: ""
  signingKeyNames: []
  sftpKeyName: ""
  sftpKeyVersion: 0
  bankChannels: []
