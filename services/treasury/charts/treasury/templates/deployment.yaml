apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: treasury
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: treasury
  template:
    metadata:
      labels:
        app.kubernetes.io/name: treasury
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: treasury
          image: {{ include "treasury.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            - name: TREASURY_MAX_FILE_MB
              value: {{ .Values.statement.maxFileMb | quote }}
            {{- with .Values.vault }}
            {{- if .bankChannels }}
            - name: TREASURY_BANK_CHANNELS
              value: {{ join "," .bankChannels | quote }}
            {{- end }}
            {{- if .addr }}
            - name: VAULT_ADDR
              value: {{ .addr | quote }}
            {{- if .tokenSecret }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .tokenSecret }}
                  key: VAULT_TOKEN
            {{- else }}
            - name: VAULT_K8S_ROLE
              value: {{ required "vault.k8sRole or vault.tokenSecret is required" .k8sRole | quote }}
            - name: VAULT_K8S_AUTH_MOUNT
              value: {{ .k8sMount | quote }}
            {{- end }}
            - name: TREASURY_SIGNING_KEY_NAMES
              value: {{ join "," .signingKeyNames | quote }}
            - name: TREASURY_SFTP_KEY_NAME
              value: {{ .sftpKeyName | quote }}
            {{- if .sftpKeyVersion }}
            - name: TREASURY_SFTP_KEY_VERSION
              value: {{ .sftpKeyVersion | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          # Multipart statement uploads above 1 MB spool to /tmp; the root file system is read-only.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.uploadSpoolSize | quote }}
