openapi: 3.1.0
info:
  title: Passage Treasury (slices 1 and 3 and reconciliation, PSG-36)
  version: 0.4.0
  summary: Bank accounts, statement import, cash forecast, checks, facilities with LCs and guarantees, and loan contracts.
  description: |
    Wave 36 slices 1 and 3. Reconciliation rules, runs and matches are served; the reconciliation close, bills of exchange, promissory
    notes, postdated checks, deals, payment requests, bank connectivity and IHC endpoints
    are later slices (see NOT-IMPLEMENTED.md). Errors are RFC 9457 problem details with a stable `code`.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/treasury/bank-accounts:
    post:
      operationId: createBankAccount
      summary: Create a bank account in Draft status
      x-passage-duty: treasury.bank-account.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateBankAccountRequest"}
      responses:
        "201":
          description: Account created (or the stored account for a repeated key)
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listBankAccounts
      summary: List bank accounts of a legal entity
      x-passage-duty: treasury.view
      parameters:
        - name: legalEntityId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/BankAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-accounts/{id}:
    get:
      operationId: getBankAccount
      summary: Read a bank account (IBAN masked)
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Account
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankAccount"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-accounts/{id}:activate:
    post:
      operationId: activateBankAccount
      summary: Activate a Draft or Inactive bank account
      description: Allowed from draft or inactive; any other status is TRS-0417.
      x-passage-duty: treasury.bank-account.approve
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: New status stored; the version (ETag) is incremented
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-accounts/{id}:deactivate:
    post:
      operationId: deactivateBankAccount
      summary: Deactivate an Active bank account
      description: Allowed from active only (TRS-0417 otherwise). New statements are refused (TRS-0412); re-uploads still replay.
      x-passage-duty: treasury.bank-account.approve
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: New status stored; the version (ETag) is incremented
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-accounts/{id}:close:
    post:
      operationId: closeBankAccount
      summary: Close an Inactive bank account
      description: Allowed from inactive only (TRS-0417 otherwise). Closed is final.
      x-passage-duty: treasury.bank-account.approve
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: New status stored; the version (ETag) is incremented
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-accounts/{id}/statements:
    get:
      operationId: listStatements
      summary: List statements of a bank account
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Statements
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Statement"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/statements/import:
    post:
      operationId: importStatement
      summary: Upload a camt.053, BAI2 or MT940 statement (multipart). Same bytes replay with 200.
      description: >-
        The format is detected from the content (XML is camt.053, a leading 01 record is BAI2,
        a :20: tag is MT940). A file must hold one statement; a parse error is TRS-0493 with the
        failing line of a BAI2 or MT940 file in errors.line, or the failing camt.053 entry in errors.entry. The statement's account must be the bank account's IBAN or its
        statementAccount (TRS-0409).
      x-passage-duty: treasury.statement.import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bankAccountId, file]
              properties:
                bankAccountId: {type: string, format: uuid}
                file: {type: string, format: binary, description: "camt.053 XML, BAI2 or MT940 text; max 50 MB by default"}
      responses:
        "200":
          description: Identical file, or the same statement id with the same closing balance, already imported; existing statement returned (TRS-0405, BR-36.8)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportedStatement"}
        "201":
          description: Statement and lines committed; statement.imported.v1 written to the outbox. Warnings carry TRS-0407 for a sequence gap.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportedStatement"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/treasury/statements/{id}:
    get:
      operationId: getStatement
      summary: Read a statement header
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Statement"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/statements/{id}/lines:
    get:
      operationId: listStatementLines
      summary: Page through statement lines in line-number order
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: afterLineNo
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          description: Page size; 0 or more than 500 means 500
          schema: {type: integer, minimum: 0, default: 100}
      responses:
        "200":
          description: Lines
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/StatementLine"}
                  nextAfterLineNo:
                    type: [integer, "null"]
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-forecast-entries:
    post:
      operationId: createForecastEntry
      summary: Register a forecast entry (manual or from a source)
      x-passage-duty: treasury.forecast.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateForecastEntryRequest"}
      responses:
        "201":
          description: Entry stored (or the stored entry for a repeated key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ForecastEntry"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-forecast:
    get:
      operationId: getCashForecast
      summary: Forecast buckets for a legal entity (contributions from 90 days back to 366 days ahead)
      x-passage-duty: treasury.view
      parameters:
        - name: legalEntityId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: layout
          in: query
          schema: {type: string, enum: [daily, weekly, monthly], default: daily}
        - name: asOf
          in: query
          schema: {type: string, format: date}
        - name: currency
          in: query
          schema: {type: string, pattern: "^[A-Z]{3}$"}
      responses:
        "200":
          description: Buckets; each Net equals Inflow plus Outflow and Cumulative is the running Net
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Forecast"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks:
    post:
      operationId: issueCheck
      summary: Issue a check on the next gap-free number of an active bank account (FR-36.6)
      description: The check starts as created. Its currency must equal the account currency (TRS-0426); the account must be active (TRS-0412).
      x-passage-duty: treasury.check.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IssueCheckRequest"}
      responses:
        "201":
          description: Check issued (or the stored check for a repeated key)
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Check"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listChecks
      summary: Check register of a bank account, newest number first (at most 200)
      x-passage-duty: treasury.view
      parameters:
        - name: bankAccountId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Checks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Check"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks/{id}:
    get:
      operationId: getCheck
      summary: Read a check
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Check
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Check"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks/{id}:print:
    post:
      operationId: printCheck
      summary: Mark a created check printed
      description: Allowed from created only (TRS-0420 otherwise).
      x-passage-duty: treasury.check.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": {$ref: "#/components/responses/CheckChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks/{id}:send:
    post:
      operationId: sendCheck
      summary: Record that a printed check left the company
      description: Allowed from printed only (TRS-0420 otherwise). From here on a void also voids the positive pay record (BR-36.5).
      x-passage-duty: treasury.check.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": {$ref: "#/components/responses/CheckChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks/{id}:clear:
    post:
      operationId: clearCheck
      summary: Record that the bank paid a sent check
      description: Allowed from sent only (TRS-0420 otherwise). A cleared check can no longer be voided (TRS-0414). Statement matching will clear checks automatically in a later slice.
      x-passage-duty: treasury.check.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": {$ref: "#/components/responses/CheckChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks/{id}:stop:
    post:
      operationId: stopCheck
      summary: Record a stop-payment order on a sent check
      description: Allowed from sent only (TRS-0420 otherwise); a check still in hand is voided instead.
      x-passage-duty: treasury.check.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": {$ref: "#/components/responses/CheckChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks/{id}:void:
    post:
      operationId: voidCheck
      summary: Void a check; the number stays consumed
      description: |
        Allowed from created, printed, sent and stopped. A cleared check is TRS-0414 (BR-36.5).
        Writes dev.passage.treasury.check.voided.v1 to the outbox in the same transaction;
        positivePayVoid is true when the check was sent or stopped.
      x-passage-duty: treasury.check.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CheckReasonRequest"}
      responses:
        "200": {$ref: "#/components/responses/CheckChanged"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks/{id}:reprint:
    post:
      operationId: reprintCheck
      summary: Void a check and issue a printed replacement on the next number (AC-36.5)
      description: |
        One transaction: the old check is voided (check.voided.v1 written), and a new check with the
        same payee, amount and currency is printed on the next number and points back with replacesId.
        If-Match is the old check's ETag; the response is the new check.
      x-passage-duty: treasury.check.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CheckReasonRequest"}
      responses:
        "201":
          description: The new, printed check
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Check"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/facilities:
    post:
      operationId: createFacility
      summary: Register a bank facility with its limit and expiry (FR-36.7)
      x-passage-duty: treasury.facility.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateFacilityRequest"}
      responses:
        "201":
          description: Facility stored (or the stored facility for a repeated key)
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Facility"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listFacilities
      summary: Facilities of a legal entity with utilization and headroom
      x-passage-duty: treasury.view
      parameters:
        - name: legalEntityId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Facilities
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Facility"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/treasury/facilities/{id}:
    get:
      operationId: getFacility
      summary: Read a facility with utilization and headroom
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Facility
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Facility"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/facilities/{id}/instruments:
    post:
      operationId: createFacilityInstrument
      summary: Book a letter of credit or guarantee on a facility (FR-36.7, AC-36.6)
      description: |
        Refused with TRS-0415 when utilization + amount exceeds the limit, unless overrideLimit is true
        and the caller holds treasury.facility.override (403 AUTH-0003 without it). The facility must be
        active and not expired on the issue date (TRS-0429); the currency must equal the facility currency (TRS-0430).
      x-passage-duty: treasury.facility.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateInstrumentRequest"}
      responses:
        "201":
          description: Instrument booked as open (or the stored instrument for a repeated key)
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FacilityInstrument"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listFacilityInstruments
      summary: Instruments booked on a facility, oldest first
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Instruments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/FacilityInstrument"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/facility-instruments/{id}:close:
    post:
      operationId: closeFacilityInstrument
      summary: Close an open instrument and release it from utilization
      description: Allowed from open only (TRS-0434 otherwise).
      x-passage-duty: treasury.facility.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Instrument closed; the version (ETag) is incremented
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FacilityInstrument"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/loans:
    post:
      operationId: createLoan
      summary: Record a fixed-rate loan contract and generate its schedule (FR-36.19)
      description: |
        Maturity must fall a whole number of periods after the start date (month ends clamp, so
        31 January plus one month is 28/29 February); otherwise TRS-0446. Interest per period =
        opening principal x rate x days / basis, rounded half-up to the currency minor unit (BR-36.15).
      x-passage-duty: treasury.loan.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateLoanRequest"}
      responses:
        "201":
          description: Loan and schedule stored (or the stored loan for a repeated key)
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Loan"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listLoans
      summary: Loan contracts of a legal entity, newest start first (without schedules)
      x-passage-duty: treasury.view
      parameters:
        - name: legalEntityId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Loans
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Loan"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/treasury/loans/{id}:
    get:
      operationId: getLoan
      summary: Read a loan contract with its schedule
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Loan
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Loan"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/reconciliation-rules:
    post:
      operationId: createReconciliationRule
      summary: Store a matching rule for a bank account or for every account of a legal entity (FR-36.3)
      description: |
        Weights (amount, date, reference, counterparty) sum to 100 and the amount carries at least 20.
        A strict rule may only auto-match on a reference of 8 or more characters. Rules run in priority
        order (1 first). The name is unique per legal entity (TRS-0482). A bank account may have at most 20 active
        rules, counting the entity-wide ones (422 TRS-0489).
      x-passage-duty: treasury.reconciliation.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateReconciliationRuleRequest"}
      responses:
        "201":
          description: Rule stored (or the stored rule for a repeated key)
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReconciliationRule"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listReconciliationRules
      summary: Rules of a legal entity in run order, optionally those that apply to one bank account
      x-passage-duty: treasury.view
      parameters:
        - name: legalEntityId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: bankAccountId
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ReconciliationRule"}
        "400": {$ref: "#/components/responses/Problem"}
  /v1/treasury/reconciliation-rules/{id}:
    get:
      operationId: getReconciliationRule
      summary: Read a reconciliation rule
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Rule
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReconciliationRule"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/reconciliation-rules/{id}:deactivate:
    post:
      operationId: deactivateReconciliationRule
      summary: Stop a rule from running; matches it made stay
      x-passage-duty: treasury.reconciliation.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Rule deactivated; the version (ETag) is incremented
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReconciliationRule"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/reconciliation-runs:
    post:
      operationId: runReconciliation
      summary: Run the account's active rules over a statement against the open items offered (FR-36.3)
      description: |
        Ledger, AR and AP own the open items, so the caller offers them (at most 2,000; amounts in the
        statement's sign convention). The next 2,000 unmatched or suggested lines after `afterLineNo` are
        considered; `remainingLines` counts the open lines after that page and `nextAfterLineNo` is the cursor to
        run again with. Lines of the page that an earlier run suggested but found no candidate now return to
        unmatched; lines outside the page keep their status. `legalEntityId` must be the statement's legal entity
        (TRS-0488) and inside the caller's scope (403). A reference-only candidate (the reference agrees but the
        amount, date or payer does not) is suggested, never auto-matched. A placeholder end-to-end id such as
        NOTPROVIDED is ignored; the remittance reference of the line is scored instead.
        Unique matches are stored and published; N:1 batch receipts match when the items sharing the line's
        batch reference add up to the line exactly. An item wanted by two matches is released from both.
        Other lines with a candidate become suggested and are listed. TRS-0480 when the account has no active rule.
      x-passage-duty: treasury.reconciliation.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReconciliationRunRequest"}
      responses:
        "201":
          description: Run result (or the stored result for a repeated key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReconciliationRunResult"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/treasury/reconciliation-matches:
    post:
      operationId: createManualMatch
      summary: Match statement lines to items by hand with a reason (FR-36.3)
      description: |
        Many-to-one or one-to-many. The lines' amounts must add up to the items' exactly (TRS-0481);
        lines and items must be in the statement currency (TRS-0486) and free of another active
        match (409 TRS-0411). `legalEntityId` must be the statement's legal entity (TRS-0488).
      x-passage-duty: treasury.reconciliation.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateManualMatchRequest"}
      responses:
        "201":
          description: Match stored (or the stored match for a repeated key)
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReconciliationMatch"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listReconciliationMatches
      summary: Matches of a statement, oldest first, unmatched ones included
      x-passage-duty: treasury.view
      parameters:
        - name: statementId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 500}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: A page of matches; nextOffset is present when the page is full
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ReconciliationMatch"}
                  nextOffset: {type: integer, minimum: 1}
        "400": {$ref: "#/components/responses/Problem"}
  /v1/treasury/reconciliation-matches/{id}:
    get:
      operationId: getReconciliationMatch
      summary: Read a match with its lines and items
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Match
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReconciliationMatch"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/reconciliation-matches/{id}:unmatch:
    post:
      operationId: unmatchReconciliationMatch
      summary: Dissolve a match with a reason; its lines return to unmatched and its items are free again
      description: 409 TRS-0485 when the match is already unmatched. The match row stays as history and records `unmatchedBy`.
      x-passage-duty: treasury.reconciliation.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: {type: string, minLength: 1, maxLength: 200}
      responses:
        "200":
          description: Match unmatched; the version (ETag) is incremented
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReconciliationMatch"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers:
    post:
      operationId: createEbicsSubscriber
      summary: Register an EBICS user at a bank for one bank account
      description: >-
        Only the names of the Vault keys are given; no key material passes through the API. The subscriber starts in NEW.
        TRS-0496 when host, partner and user exist already, TRS-0497 for an unacceptable id or URL, 503 TRS-0502 when EBICS is not enabled.
      x-passage-duty: treasury.ebics.write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateEbicsSubscriberRequest"}
      responses:
        "201":
          description: Subscriber created
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsSubscriber"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers/{id}:
    get:
      operationId: getEbicsSubscriber
      summary: Read a subscriber with its state and the hashes of the bank keys downloaded so far
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Subscriber
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsSubscriber"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers/{id}:send-ini:
    post:
      operationId: sendEbicsIni
      summary: Send the A006 signature key to the bank (INI) and return the letter to print
      description: Allowed in NEW only (409 TRS-0498 otherwise). NEW to INI_SENT. 502 TRS-0501 when the bank refuses.
      x-passage-duty: treasury.ebics.keys
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Order accepted by the bank
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsLetterResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers/{id}:send-hia:
    post:
      operationId: sendEbicsHia
      summary: Send the X002 and E002 keys to the bank (HIA) and return the letter to print
      description: Allowed in INI_SENT only (409 TRS-0498 otherwise). INI_SENT to HIA_SENT.
      x-passage-duty: treasury.ebics.keys
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Order accepted by the bank
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsLetterResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers/{id}:fetch-bank-keys:
    post:
      operationId: fetchEbicsBankKeys
      summary: Download the bank's keys (HPB) and store them unconfirmed
      description: >-
        Allowed in HIA_SENT or BANK_KEYS_PENDING. The keys are not used for anything until they are confirmed. The response carries
        the hashes of the downloaded keys, to compare with the hashes on the bank's own letter.
      x-passage-duty: treasury.ebics.keys
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Subscriber
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsSubscriber"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers/{id}:confirm-bank-keys:
    post:
      operationId: confirmEbicsBankKeys
      summary: Activate the subscriber after the bank's key hashes were compared
      description: >-
        The hashes the bank printed must equal the hashes of the downloaded keys (422 TRS-0499 otherwise, and nothing is activated).
        The confirmer recorded is the authenticated user, never a value from the body. BANK_KEYS_PENDING to READY. Needs a duty other
        than the one that runs the key ceremony.
      x-passage-duty: treasury.ebics.approve
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfirmEbicsBankKeysRequest"}
      responses:
        "200":
          description: Subscriber
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsSubscriber"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers/{id}:unpark:
    post:
      operationId: unparkEbicsSubscriber
      summary: Let a parked subscriber transact again after a person reviewed the bank's refusal
      description: 409 TRS-0498 when the subscriber is not parked. The authenticated user is logged.
      x-passage-duty: treasury.ebics.approve
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Subscriber
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsSubscriber"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers/{id}/letters/{order}:
    get:
      operationId: getEbicsLetter
      summary: Rebuild the INI or HIA letter from the subscriber's public keys
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: order
          in: path
          required: true
          schema: {type: string, enum: [INI, HIA]}
      responses:
        "200":
          description: Letter
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsLetter"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Same key and body replay the stored response; same key with another body is idempotency_key_reuse (422)
      schema: {type: string, maxLength: 255}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the resource as last read (428 when absent, 412 when stale)
      schema: {type: string}
  headers:
    ETag:
      description: Version of the resource, quoted integer
      schema: {type: string}
  responses:
    CheckChanged:
      description: New status stored; the version (ETag) is incremented
      headers:
        ETag: {$ref: "#/components/headers/ETag"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Check"}
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Money:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]{1,6})?$"
      description: Decimal amount as a string (never a float)
    CreateBankAccountRequest:
      type: object
      required: [legalEntityId, accountCode, iban, currency, mainAccountId]
      additionalProperties: false
      properties:
        legalEntityId: {type: string, format: uuid}
        accountCode: {type: string, pattern: "^[A-Z0-9-]{1,20}$"}
        iban: {type: string, description: "Validated mod-97 (TRS-0401). Only a SHA-256 lookup hash, the masked form and the last four characters are stored; the full IBAN is not retained (see NOT-IMPLEMENTED.md)."}
        bic: {type: string, description: ISO 9362}
        statementAccount: {type: string, description: "Optional account number the bank writes on BAI2 (03 record), MT940 (:25:) or non-IBAN camt.053 (Acct/Id/Othr/Id) statements. Spaces are removed and letters upper-cased; then 1 to 35 characters of A-Z, 0-9, /, . or -. Stored only as a SHA-256 hash and its last four characters."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        mainAccountId: {type: string, format: uuid}
    BankAccount:
      type: object
      required: [id, legalEntityId, accountCode, ibanMasked, ibanLast4, currency, mainAccountId, status, version]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        accountCode: {type: string}
        ibanMasked: {type: string}
        ibanLast4: {type: string, minLength: 4, maxLength: 4}
        bic: {type: [string, "null"]}
        statementAccountLast4: {type: string, minLength: 1, maxLength: 4, description: Last four characters of the statement account number; absent when none was given}
        currency: {type: string}
        mainAccountId: {type: string, format: uuid}
        status: {type: string, enum: [draft, active, inactive, closed]}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Statement:
      type: object
      required: [id, bankAccountId, legalEntityId, statementId, format, currency, openingDate, openingBalance, closingDate, closingBalance, lineCount, createdAt]
      properties:
        id: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        statementId: {type: string}
        sequence: {type: [integer, "null"]}
        format: {type: string, pattern: "^(camt\\.053\\.001\\.[0-9]{2}|BAI2|MT940)$"}
        currency: {type: string}
        openingDate: {type: string, format: date}
        openingBalance: {$ref: "#/components/schemas/Money"}
        closingDate: {type: string, format: date}
        closingBalance: {$ref: "#/components/schemas/Money"}
        lineCount: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
    ImportedStatement:
      allOf:
        - $ref: "#/components/schemas/Statement"
        - type: object
          required: [warnings]
          properties:
            warnings:
              type: array
              description: Non-blocking findings of a new import (TRS-0407 sequence gap); empty on a replay
              items:
                type: object
                required: [code, detail]
                properties:
                  code: {type: string, example: TRS-0407}
                  detail: {type: string}
    StatementLine:
      type: object
      required: [lineNo, bookingDate, valueDate, amount, currency, status]
      properties:
        lineNo: {type: integer, minimum: 1}
        bookingDate: {type: string, format: date}
        valueDate: {type: string, format: date}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string}
        btcCode: {type: string}
        endToEndRef: {type: string}
        reference: {type: string}
        counterpartyName: {type: string}
        status: {type: string, enum: [unmatched, suggested, matched, created, in_transit]}
    CreateForecastEntryRequest:
      type: object
      required: [legalEntityId, sourceType, expectedDate, amount, currency]
      additionalProperties: false
      properties:
        legalEntityId: {type: string, format: uuid}
        sourceType: {type: string, enum: [AP, AR, PO, SO, Recurring, Manual, Payroll, Project]}
        sourceId: {type: string, maxLength: 64, description: Generated when omitted}
        expectedDate: {type: string, format: date}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        confidence: {type: string, description: Decimal between 0 and 1; default 1}
    ForecastEntry:
      type: object
      required: [id, legalEntityId, sourceType, sourceId, expectedDate, amount, currency, confidence]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        sourceType: {type: string}
        sourceId: {type: string}
        expectedDate: {type: string, format: date}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string}
        confidence: {type: string}
    Forecast:
      type: object
      required: [layout, asOf, buckets, outOfHorizon]
      properties:
        layout: {type: string, enum: [daily, weekly, monthly]}
        asOf: {type: string, format: date}
        buckets:
          type: array
          items:
            type: object
            required: [key, currency, inflow, outflow, net, cumulative]
            properties:
              key: {type: string, format: date}
              currency: {type: string}
              inflow: {$ref: "#/components/schemas/Money"}
              outflow: {$ref: "#/components/schemas/Money"}
              net: {$ref: "#/components/schemas/Money"}
              cumulative: {$ref: "#/components/schemas/Money"}
        outOfHorizon: {type: integer, minimum: 0}
    PositiveMoney:
      type: string
      pattern: "^[0-9]{1,14}(\\.[0-9]{1,4})?$"
      description: Positive decimal string with at most the currency's minor-unit places (two for EUR, none for JPY)
    IssueCheckRequest:
      type: object
      required: [bankAccountId, payee, amount, currency]
      additionalProperties: false
      properties:
        bankAccountId: {type: string, format: uuid}
        payee: {type: string, minLength: 1, maxLength: 140}
        amount: {$ref: "#/components/schemas/PositiveMoney"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
    CheckReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1, maxLength: 200}
    Check:
      type: object
      required: [id, legalEntityId, bankAccountId, checkNumber, payee, amount, currency, status, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid}
        checkNumber: {type: integer, minimum: 1, description: Gap-free per bank account}
        payee: {type: string}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string}
        status: {type: string, enum: [created, printed, sent, cleared, voided, stopped]}
        voidReason: {type: string}
        replacesId: {type: string, format: uuid, description: The voided check this reprint replaces}
        replacedById: {type: string, format: uuid, description: The reprint that replaced this voided check}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateFacilityRequest:
      type: object
      required: [legalEntityId, code, bankName, currency, limit, expiryDate]
      additionalProperties: false
      properties:
        legalEntityId: {type: string, format: uuid}
        code: {type: string, pattern: "^[A-Z0-9-]{1,20}$"}
        bankName: {type: string, minLength: 1, maxLength: 120}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        limit: {$ref: "#/components/schemas/PositiveMoney"}
        expiryDate: {type: string, format: date}
    Facility:
      type: object
      required: [id, legalEntityId, code, bankName, currency, limit, utilized, headroom, expiryDate, status, version, createdAt]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        code: {type: string}
        bankName: {type: string}
        currency: {type: string}
        limit: {$ref: "#/components/schemas/Money"}
        utilized: {$ref: "#/components/schemas/Money", description: Sum of open instruments}
        headroom: {$ref: "#/components/schemas/Money", description: Limit minus utilization, never below zero}
        expiryDate: {type: string, format: date}
        status: {type: string, enum: [active, closed]}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
    CreateInstrumentRequest:
      type: object
      required: [kind, reference, beneficiary, currency, amount, issueDate, expiryDate]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [lc_import, lc_export, guarantee]}
        reference: {type: string, minLength: 1, maxLength: 64}
        beneficiary: {type: string, minLength: 1, maxLength: 140}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        amount: {$ref: "#/components/schemas/PositiveMoney"}
        issueDate: {type: string, format: date}
        expiryDate: {type: string, format: date, description: Not before issueDate}
        linkedOrderRef: {type: string, maxLength: 64, description: Purchase or sales order the instrument secures}
        overrideLimit: {type: boolean, default: false, description: Book past the limit; needs treasury.facility.override}
    FacilityInstrument:
      type: object
      required: [id, facilityId, legalEntityId, kind, reference, beneficiary, currency, amount, issueDate, expiryDate, status, limitOverride, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        facilityId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        kind: {type: string, enum: [lc_import, lc_export, guarantee]}
        reference: {type: string}
        beneficiary: {type: string}
        currency: {type: string}
        amount: {$ref: "#/components/schemas/Money"}
        issueDate: {type: string, format: date}
        expiryDate: {type: string, format: date}
        linkedOrderRef: {type: string}
        status: {type: string, enum: [open, closed]}
        limitOverride: {type: boolean, description: True when the instrument was booked past the limit under the override duty}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateLoanRequest:
      type: object
      required: [legalEntityId, role, counterpartyName, principal, currency, startDate, maturityDate, scheduleType, fixedRate, dayCount, periodMonths]
      additionalProperties: false
      properties:
        legalEntityId: {type: string, format: uuid}
        role: {type: string, enum: [borrower, lender]}
        counterpartyName: {type: string, minLength: 1, maxLength: 140}
        principal: {$ref: "#/components/schemas/PositiveMoney"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        startDate: {type: string, format: date}
        maturityDate: {type: string, format: date}
        scheduleType: {type: string, enum: [Annuity, Linear, Bullet]}
        fixedRate: {type: string, pattern: "^(0(\\.[0-9]{1,6})?|1(\\.0{1,6})?)$", description: Annual rate as a fraction, 0.03 for 3.00%}
        dayCount: {type: string, enum: ["ACT/360", "ACT/365", "30/360"]}
        periodMonths: {type: integer, enum: [1, 3, 6, 12]}
    LoanScheduleLine:
      type: object
      required: [periodNo, periodStart, periodEnd, days, openingPrincipal, interest, principalRepayment, closingPrincipal]
      properties:
        periodNo: {type: integer, minimum: 1}
        periodStart: {type: string, format: date}
        periodEnd: {type: string, format: date}
        days: {type: integer, minimum: 1, description: Accrual days under the day-count convention}
        openingPrincipal: {$ref: "#/components/schemas/Money"}
        interest: {$ref: "#/components/schemas/Money"}
        principalRepayment: {$ref: "#/components/schemas/Money"}
        closingPrincipal: {$ref: "#/components/schemas/Money"}
    Loan:
      type: object
      required: [id, legalEntityId, role, counterpartyName, principal, currency, startDate, maturityDate, scheduleType, fixedRate, dayCount, periodMonths, status, version, createdAt]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        role: {type: string, enum: [borrower, lender]}
        counterpartyName: {type: string}
        principal: {$ref: "#/components/schemas/Money"}
        currency: {type: string}
        startDate: {type: string, format: date}
        maturityDate: {type: string, format: date}
        scheduleType: {type: string, enum: [Annuity, Linear, Bullet]}
        fixedRate: {type: string}
        dayCount: {type: string, enum: ["ACT/360", "ACT/365", "30/360"]}
        periodMonths: {type: integer, enum: [1, 3, 6, 12]}
        status: {type: string, enum: [draft, active, repaid, terminated]}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        schedule:
          type: array
          description: Present on create and get; omitted in the list
          items: {$ref: "#/components/schemas/LoanScheduleLine"}
    ReconciliationWeights:
      type: object
      required: [amount, date, reference, counterparty]
      additionalProperties: false
      properties:
        amount: {type: integer, minimum: 20, maximum: 100}
        date: {type: integer, minimum: 0, maximum: 80}
        reference: {type: integer, minimum: 0, maximum: 80}
        counterparty: {type: integer, minimum: 0, maximum: 80}
    CreateReconciliationRuleRequest:
      type: object
      required: [legalEntityId, name, priority, weights, amountTolerance, dateWindowDays]
      additionalProperties: false
      properties:
        legalEntityId: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid, description: Omit for a rule that applies to every account of the legal entity}
        name: {type: string, minLength: 1, maxLength: 80}
        priority: {type: integer, minimum: 1, maximum: 1000}
        weights: {$ref: "#/components/schemas/ReconciliationWeights"}
        amountTolerance: {type: string, description: Largest amount difference that still scores, decimal string}
        dateWindowDays: {type: integer, minimum: 0, maximum: 30}
        strict: {type: boolean, description: Auto-match only on a reference of 8 or more characters, unique among the open items}
    ReconciliationRule:
      type: object
      required: [id, legalEntityId, name, priority, weights, amountTolerance, dateWindowDays, strict, active, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid}
        name: {type: string}
        priority: {type: integer}
        weights: {$ref: "#/components/schemas/ReconciliationWeights"}
        amountTolerance: {type: string}
        dateWindowDays: {type: integer}
        strict: {type: boolean}
        active: {type: boolean}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ReconciliationItem:
      type: object
      required: [type, id, currency, amount]
      additionalProperties: false
      properties:
        type: {type: string, enum: [ledger, ar, ap]}
        id: {type: string, minLength: 1, maxLength: 100}
        currency: {type: string}
        amount: {$ref: "#/components/schemas/Money"}
    ReconciliationRunItem:
      type: object
      required: [type, id, currency, amount, valueDate]
      additionalProperties: false
      properties:
        type: {type: string, enum: [ledger, ar, ap]}
        id: {type: string, minLength: 1, maxLength: 100}
        currency: {type: string}
        amount: {$ref: "#/components/schemas/Money"}
        valueDate: {type: string, format: date}
        reference: {type: string, maxLength: 140, description: Invoice number, end-to-end id or check number}
        counterparty: {type: string, maxLength: 140}
        batch: {type: string, maxLength: 140, description: Remittance or batch id; items sharing it match one batch receipt line whose reference names it}
    ReconciliationRunRequest:
      type: object
      required: [statementId, legalEntityId, items]
      additionalProperties: false
      properties:
        statementId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid, description: Legal entity the offered items belong to; must be the statement's}
        afterLineNo: {type: integer, minimum: 0, default: 0, description: Only lines with a higher number are considered; pass the previous nextAfterLineNo}
        items:
          type: array
          minItems: 1
          maxItems: 2000
          items: {$ref: "#/components/schemas/ReconciliationRunItem"}
    ReconciliationRunResult:
      type: object
      required: [matches, suggestions, linesConsidered, itemsConsidered, remainingLines, nextAfterLineNo]
      properties:
        matches:
          type: array
          items: {$ref: "#/components/schemas/ReconciliationMatch"}
        suggestions:
          type: array
          items:
            type: object
            required: [lineNo, itemType, itemId, score]
            properties:
              lineNo: {type: integer}
              itemType: {type: string}
              itemId: {type: string}
              score: {type: integer, minimum: 0, maximum: 100}
        linesConsidered: {type: integer}
        itemsConsidered: {type: integer, description: Offered items in the statement currency and not already in an active match}
        remainingLines: {type: integer, description: Open lines after this page}
        nextAfterLineNo: {type: integer, description: Cursor for the next run; 0 when no lines remain}
    CreateManualMatchRequest:
      type: object
      required: [statementId, legalEntityId, lineNos, items, reason]
      additionalProperties: false
      properties:
        statementId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        lineNos:
          type: array
          minItems: 1
          maxItems: 50
          items: {type: integer, minimum: 1}
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: "#/components/schemas/ReconciliationItem"}
        reason: {type: string, minLength: 1, maxLength: 200}
    ReconciliationMatch:
      type: object
      required: [id, legalEntityId, bankAccountId, statementId, kind, status, difference, createdBy, version, lines, items, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid}
        statementId: {type: string, format: uuid}
        kind: {type: string, enum: [auto, manual]}
        status: {type: string, enum: [matched, unmatched]}
        ruleName: {type: string, description: The rule that decided an auto match, or batch}
        score: {type: integer, minimum: 0, maximum: 100}
        difference: {$ref: "#/components/schemas/Money"}
        reason: {type: string}
        unmatchReason: {type: string}
        unmatchedBy: {type: string}
        createdBy: {type: string}
        version: {type: integer, minimum: 1}
        lines:
          type: array
          items:
            type: object
            required: [lineNo, amount]
            properties:
              lineNo: {type: integer}
              amount: {$ref: "#/components/schemas/Money"}
        items:
          type: array
          items: {$ref: "#/components/schemas/ReconciliationItem"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri, example: "https://passage.dev/problems/TRS-0401"}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string, description: Stable code; see README error table}
        serviceCode: {type: string, example: TRS-0401}
        traceId: {type: string}
        errors:
          type: object
          description: Field name to message; parse errors carry "line"
          additionalProperties: {type: string}
    CreateEbicsSubscriberRequest:
      type: object
      required: [legalEntityId, bankAccountId, hostId, partnerId, userId, url, a006KeyName, x002KeyName, e002KvPath]
      additionalProperties: false
      properties:
        legalEntityId: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid}
        hostId: {type: string, pattern: "^[A-Za-z0-9._-]{1,35}$"}
        partnerId: {type: string, pattern: "^[A-Za-z0-9._-]{1,35}$"}
        userId: {type: string, pattern: "^[A-Za-z0-9._-]{1,35}$"}
        url: {type: string, description: HTTPS URL of the bank's EBICS server}
        a006KeyName: {type: string, description: Name of the Vault transit key that signs orders (A006)}
        x002KeyName: {type: string, description: Name of the Vault transit key that signs requests (X002)}
        e002KvPath: {type: string, description: "Vault KV path of the E002 private key; the public key is read from the same path with -pub appended"}
    EbicsSubscriber:
      type: object
      required: [id, legalEntityId, bankAccountId, hostId, partnerId, userId, url, state, keysConfirmed, version]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid}
        hostId: {type: string}
        partnerId: {type: string}
        userId: {type: string}
        url: {type: string}
        state: {type: string, enum: [NEW, INI_SENT, HIA_SENT, BANK_KEYS_PENDING, READY]}
        keysConfirmed: {type: boolean}
        confirmedBy: {type: string}
        confirmedAt: {type: string, format: date-time}
        parkedCode: {type: string, description: Return code of the bank refusal that parked the subscriber}
        parkedText: {type: string}
        bankKeyHashes:
          type: object
          properties:
            x002: {type: string, description: "SHA-256 of the bank's X002 key, uppercase hex pairs"}
            e002: {type: string}
        version: {type: integer, minimum: 1}
    EbicsLetter:
      type: object
      required: [order, text, hashes]
      properties:
        order: {type: string, enum: [INI, HIA]}
        text: {type: string, description: Letter to print, sign and send to the bank}
        hashes:
          type: object
          additionalProperties: {type: string}
    EbicsLetterResult:
      type: object
      required: [subscriber, letter]
      properties:
        subscriber: {$ref: "#/components/schemas/EbicsSubscriber"}
        letter: {$ref: "#/components/schemas/EbicsLetter"}
    ConfirmEbicsBankKeysRequest:
      type: object
      required: [x002Hash, e002Hash]
      additionalProperties: false
      properties:
        x002Hash: {type: string, description: Hash printed on the bank's own letter for its authentication key}
        e002Hash: {type: string, description: Hash printed on the bank's own letter for its encryption key}
