openapi: 3.1.0
info:
  title: Passage Treasury (slices 1 and 3 and reconciliation, PSG-36)
  version: 0.4.0
  summary: Bank accounts, statement import, cash forecast, checks, facilities with LCs and guarantees, and loan contracts.
  description: |
    Wave 36 slices 1 and 3. Reconciliation rules, runs and matches are served; the reconciliation close, bills of exchange, promissory
    notes, postdated checks, deals, payment requests, bank connectivity and IHC endpoints
    are later slices (see NOT-IMPLEMENTED.md). Errors are RFC 9457 problem details with a stable `code`.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/treasury/bank-accounts:
    post:
      operationId: createBankAccount
      summary: Create a bank account in Draft status
      x-passage-duty: treasury.bank-account.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateBankAccountRequest"}
      responses:
        "201":
          description: Account created (or the stored account for a repeated key)
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listBankAccounts
      summary: List bank accounts of a legal entity
      x-passage-duty: treasury.view
      parameters:
        - name: legalEntityId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/BankAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-accounts/{id}:
    get:
      operationId: getBankAccount
      summary: Read a bank account (IBAN masked)
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Account
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankAccount"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-accounts/{id}:activate:
    post:
      operationId: activateBankAccount
      summary: Activate a Draft or Inactive bank account
      description: Allowed from draft or inactive; any other status is TRS-0417.
      x-passage-duty: treasury.bank-account.approve
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: New status stored; the version (ETag) is incremented
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-accounts/{id}:deactivate:
    post:
      operationId: deactivateBankAccount
      summary: Deactivate an Active bank account
      description: Allowed from active only (TRS-0417 otherwise). New statements are refused (TRS-0412); re-uploads still replay.
      x-passage-duty: treasury.bank-account.approve
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: New status stored; the version (ETag) is incremented
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-accounts/{id}:close:
    post:
      operationId: closeBankAccount
      summary: Close an Inactive bank account
      description: Allowed from inactive only (TRS-0417 otherwise). Closed is final.
      x-passage-duty: treasury.bank-account.approve
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: New status stored; the version (ETag) is incremented
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankAccount"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-accounts/{id}/statements:
    get:
      operationId: listStatements
      summary: List statements of a bank account
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Statements
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Statement"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/statements/import:
    post:
      operationId: importStatement
      summary: Upload a camt.053, BAI2 or MT940 statement (multipart). Same bytes replay with 200.
      description: >-
        The format is detected from the content (XML is camt.053, a leading 01 record is BAI2,
        a :20: tag is MT940). A file must hold one statement; a parse error is TRS-0493 with the
        failing line of a BAI2 or MT940 file in errors.line, or the failing camt.053 entry in errors.entry. The statement's account must be the bank account's IBAN or its
        statementAccount (TRS-0409).
      x-passage-duty: treasury.statement.import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bankAccountId, file]
              properties:
                bankAccountId: {type: string, format: uuid}
                file: {type: string, format: binary, description: "camt.053 XML, BAI2 or MT940 text; max 50 MB by default"}
      responses:
        "200":
          description: Identical file, or the same statement id with the same closing balance, already imported; existing statement returned (TRS-0405, BR-36.8)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportedStatement"}
        "201":
          description: Statement and lines committed; statement.imported.v1 written to the outbox. Warnings carry TRS-0407 for a sequence gap.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportedStatement"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/treasury/statements/{id}:
    get:
      operationId: getStatement
      summary: Read a statement header
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Statement"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/statements/{id}/lines:
    get:
      operationId: listStatementLines
      summary: Page through statement lines in line-number order
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: afterLineNo
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          description: Page size; 0 or more than 500 means 500
          schema: {type: integer, minimum: 0, default: 100}
      responses:
        "200":
          description: Lines
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/StatementLine"}
                  nextAfterLineNo:
                    type: [integer, "null"]
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-forecast-entries:
    post:
      operationId: createForecastEntry
      summary: Register a forecast entry (manual or from a source)
      x-passage-duty: treasury.forecast.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateForecastEntryRequest"}
      responses:
        "201":
          description: Entry stored (or the stored entry for a repeated key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ForecastEntry"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/treasury/intraday-reports/import:
    post:
      operationId: importIntradayReport
      summary: Upload a camt.052 intraday account report (multipart). Same bytes replay with 200.
      description: >-
        A file must hold one report (one Rpt element); a parse error is TRS-0493. The report's account must be the bank
        account's IBAN or its statementAccount (TRS-0409), in the account's currency (TRS-0408), and the account must be active
        (TRS-0412). A report id imported before with other content is 409 TRS-0525. 503 TRS-0526 when the cash position is not
        enabled. The kept balances are OPBD, ITBD, ITAV, CLAV, FWAV, PRCD and CLBD; entries are not stored (the day's camt.053 carries them).
      x-passage-duty: treasury.statement.import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bankAccountId, file]
              properties:
                bankAccountId: {type: string, format: uuid}
                file: {type: string, format: binary, description: "camt.052 XML; max 50 MB by default"}
      responses:
        "200":
          description: Identical file already imported; the stored report is returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntradayReport"}
        "201":
          description: Report and balances stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntradayReport"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-position:
    get:
      operationId: getCashPosition
      summary: Booked and available balance of every active bank account of a legal entity, with totals per currency (FR-36.8)
      description: >-
        Each account shows the freshest of its latest camt.052 report and its latest camt.053 statement: the report when it was
        created after the statement's closing day ended, otherwise the statement (as of the end of its closing day); an account with a
        migrated opening balance starts from it (source opening, as of the end of the cutover day) until either is newer. Booked is the
        interim booked balance (ITBD, else the opening booked one); available is ITAV or CLAV and falls back to booked. A position
        older than staleHours (24) is stale, and an account with no report and no statement has source none and zero balances.
        Totals are per currency, never across currencies.
      x-passage-duty: treasury.view
      parameters:
        - {name: legalEntityId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Cash position
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CashPosition"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/opening-balances:
    post:
      operationId: importOpeningBalances
      summary: Load a batch of opening bank balances from a legacy system (#49, H-S10-1)
      description: |
        The migration factory's cutover snapshot of the book balance of each bank account, in whole minor units of the account's currency.
        A batch of 1 to 1000 items is stored all or nothing under its `batchKey`; the same key with the same content answers 200 with `Idempotent-Replayed`,
        the same key with other content is 422 TRS-0603. 422 TRS-0601 names invalid rows (`errors` keyed `items[row].field`), TRS-0602 rows whose
        account is not an account of the legal entity or whose currency differs, TRS-0604 an account that already has an opening balance.
        503 TRS-0605 when the import is not enabled.
      x-passage-duty: treasury.import.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, batchKey, asOf, items]
              additionalProperties: false
              properties:
                legalEntityId: {type: string, format: uuid}
                batchKey: {type: string, minLength: 1, maxLength: 200}
                asOf: {type: string, format: date}
                items:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [reference, bankAccountId, currency, balanceMinor]
                    additionalProperties: false
                    properties:
                      reference: {type: string, minLength: 1, maxLength: 255}
                      bankAccountId: {type: string, format: uuid}
                      currency: {type: string, pattern: "^[A-Z]{3}$"}
                      balanceMinor: {type: integer, format: int64}
      responses:
        "200":
          description: The stored batch (a replay)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OpeningBatch"}
        "201":
          description: Batch stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OpeningBatch"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listOpeningBalanceBatches
      summary: The opening balance batches of a legal entity, in key order, with their totals per currency
      x-passage-duty: treasury.import.read
      parameters:
        - {name: legal_entity, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: A page of batches
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/OpeningBatch"}}
                  nextCursor: {type: string}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-desks:
    post:
      operationId: createCashDesk
      summary: Create a cash desk of a legal entity in one currency (FR-36.16)
      description: A desk has a maximum balance (a receipt above it is TRS-0541) and the general-ledger cash account it belongs to. 409 TRS-0550 when the code exists in the legal entity. 503 TRS-0551 when cash desks are not enabled.
      x-passage-duty: treasury.cashdesk.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, code, name, currency, mainAccountId, maxBalance]
              additionalProperties: false
              properties:
                legalEntityId: {type: string, format: uuid}
                code: {type: string, pattern: "^[A-Z0-9-]{1,20}$"}
                name: {type: string, minLength: 1, maxLength: 120}
                currency: {type: string, pattern: "^[A-Z]{3}$"}
                mainAccountId: {type: string, format: uuid}
                maxBalance: {$ref: "#/components/schemas/PositiveMoney"}
                dualControl: {type: boolean, description: "A closed day needs a second person's signature (:approve)"}
      responses:
        "201":
          description: Desk created (or the stored one for a repeated key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CashDesk"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listCashDesks
      summary: Cash desks of a legal entity, each with the balance of its open day
      x-passage-duty: treasury.view
      parameters:
        - {name: legalEntityId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Desks by code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CashDesk"}}
        "400": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-desks/{id}:
    get:
      operationId: getCashDesk
      summary: One cash desk with its open day's balance
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Desk
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CashDesk"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    patch:
      operationId: updateCashDesk
      summary: Change a desk's name, maximum balance, cash account or dual control
      description: Needs If-Match with the desk's ETag (428 without, 412 when stale). A maximum below the cash the open day holds is 422 TRS-0541. A changed cash account or dual control applies to postings and closes from then on.
      x-passage-duty: treasury.cashdesk.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                maxBalance: {$ref: "#/components/schemas/PositiveMoney"}
                mainAccountId: {type: string, format: uuid}
                dualControl: {type: boolean}
      responses:
        "200":
          description: Desk updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CashDesk"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-desks/{id}:deactivate:
    post:
      operationId: deactivateCashDesk
      summary: Deactivate a desk; an inactive desk opens no day and takes no entry
      description: A desk with an open day is 409 TRS-0555. Needs If-Match.
      x-passage-duty: treasury.cashdesk.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Desk deactivated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CashDesk"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-desks/{id}:activate:
    post:
      operationId: activateCashDesk
      summary: Activate an inactive desk
      x-passage-duty: treasury.cashdesk.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Desk activated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CashDesk"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-desks/{id}/days:
    post:
      operationId: openCashDeskDay
      summary: Open a business day; the opening balance is the last closed day's count
      description: One day is open at a time (409 TRS-0543) and a day must be later than the last closed day (409 TRS-0545).
      x-passage-duty: treasury.cashdesk.write
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessDate]
              additionalProperties: false
              properties:
                businessDate: {type: string, format: date}
      responses:
        "201":
          description: Day opened
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CashDeskDay"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listCashDeskDays
      summary: A desk's business days, newest first (at most 100), each with its book balance
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Days
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CashDeskDay"}}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-desks/{id}/days/{date}:close:
    post:
      operationId: closeCashDeskDay
      summary: Close the open day against the counted cash
      description: >-
        The difference is counted less book. A difference needs a reason (422 TRS-0542) and is kept on the day. The counted
        cash opens the next day. A day that is not open is 409 TRS-0544. The count is a total, or denominations (value x count,
        which become the total; with both they must agree, 422 TRS-0556). Journal lines still waiting for the ledger stop the
        close (409 TRS-0552). On a desk with dualControl the day moves to closing and waits for :approve. Where the desk posts
        to the ledger, a difference is posted as cash over or short (shortage debits the difference account).
      x-passage-duty: treasury.cashdesk.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - {name: date, in: path, required: true, schema: {type: string, format: date}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                countedBalance: {type: string, description: "Not negative, at most the currency's minor units; required without denominations"}
                reason: {type: string, maxLength: 200}
                denominations:
                  type: array
                  maxItems: 40
                  items:
                    type: object
                    required: [value, count]
                    additionalProperties: false
                    properties:
                      value: {type: string, description: "A note or coin value, positive, once per value"}
                      count: {type: integer, minimum: 0, maximum: 1000000}
      responses:
        "200":
          description: Day closed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CashDeskDay"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-desks/{id}/days/{date}:approve:
    post:
      operationId: approveCashDeskDay
      summary: Second signature on a counted day of a dual-control desk
      description: The approver must differ from the person who counted (422 TRS-0553). A day that is not closing is 409 TRS-0554.
      x-passage-duty: treasury.cashdesk.approve
      parameters:
        - $ref: "#/components/parameters/Id"
        - {name: date, in: path, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          description: Day closed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CashDeskDay"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-desks/{id}/days/{date}:reject:
    post:
      operationId: rejectCashDeskDay
      summary: Send a counted day back to open so the cash is recounted
      x-passage-duty: treasury.cashdesk.approve
      parameters:
        - $ref: "#/components/parameters/Id"
        - {name: date, in: path, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          description: Day open again, count cleared
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CashDeskDay"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-desks/{id}/days/{date}:post:
    post:
      operationId: postCashDeskDay
      summary: Post what the day still owes the general ledger
      description: >-
        Journal lines saved while the ledger was down or refused them, and the count difference of a closed day. Every post has a
        stable idempotency key, so repeating it never books twice. 422 TRS-0518 carries the ledger's code in errors.ledgerCode;
        503 TRS-0519 means the ledger did not answer.
      x-passage-duty: treasury.cashdesk.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - {name: date, in: path, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          description: Nothing left waiting
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CashDeskDay"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-desks/{id}/days/{date}/entries:
    get:
      operationId: listCashDeskEntries
      summary: The cash journal of one day in line order, each line with the balance after it
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
        - {name: date, in: path, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CashDeskEntry"}}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-desks/{id}/entries:
    post:
      operationId: addCashDeskEntry
      summary: Book a receipt or payment on the desk's open day
      description: >-
        A payment that would take the desk below zero is 422 TRS-0540 and a receipt that would take it above its maximum is 422
        TRS-0541; the rules run under the desk's row lock. No open day is 409 TRS-0544. Where the desk posts to the ledger the line is posted at once (key treasury-desk-<id>); when the ledger refuses (422 TRS-0518) or does not answer (503 TRS-0519) the line is saved with postingStatus pending and :post on the day retries it. A repeated Idempotency-Key replays the entry.
      x-passage-duty: treasury.cashdesk.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, amount, description]
              additionalProperties: false
              properties:
                kind: {type: string, enum: [receipt, payment]}
                amount: {$ref: "#/components/schemas/PositiveMoney"}
                description: {type: string, minLength: 1, maxLength: 200}
                reference: {type: string, maxLength: 100}
                counterAccount: {type: string, pattern: "^[A-Za-z0-9._-]{1,20}$", description: "Ledger account on the other side of the cash; required where the desk posts to the ledger unless bankAccountId is given"}
                bankAccountId: {type: string, format: uuid, description: "A bank transfer: a payment is cash paid into this bank account, a receipt is cash drawn from it. An active account of the desk's legal entity and currency"}
      responses:
        "201":
          description: Entry booked
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CashDeskEntry"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/cash-forecast:
    get:
      operationId: getCashForecast
      summary: Forecast buckets for a legal entity (contributions from 90 days back to 366 days ahead)
      x-passage-duty: treasury.view
      parameters:
        - name: legalEntityId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: layout
          in: query
          schema: {type: string, enum: [daily, weekly, monthly], default: daily}
        - name: asOf
          in: query
          schema: {type: string, format: date}
        - name: currency
          in: query
          schema: {type: string, pattern: "^[A-Z]{3}$"}
        - name: live
          in: query
          description: >-
            false reads stored entries only. By default the AP and AR sources (open items of payables and receivables, read live)
            replace the stored entries of their type when they answer; one that does not answer is reported as unavailable and its
            stored entries are used.
          schema: {type: boolean, default: true}
      responses:
        "200":
          description: Buckets; each Net equals Inflow plus Outflow and Cumulative is the running Net
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Forecast"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks:
    post:
      operationId: issueCheck
      summary: Issue a check on the next gap-free number of an active bank account (FR-36.6)
      description: The check starts as created. Its currency must equal the account currency (TRS-0426); the account must be active (TRS-0412).
      x-passage-duty: treasury.check.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IssueCheckRequest"}
      responses:
        "201":
          description: Check issued (or the stored check for a repeated key)
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Check"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listChecks
      summary: Check register of a bank account, newest number first (at most 200)
      x-passage-duty: treasury.view
      parameters:
        - name: bankAccountId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Checks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Check"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks/{id}:
    get:
      operationId: getCheck
      summary: Read a check
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Check
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Check"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks/{id}:print:
    post:
      operationId: printCheck
      summary: Mark a created check printed
      description: Allowed from created only (TRS-0420 otherwise).
      x-passage-duty: treasury.check.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": {$ref: "#/components/responses/CheckChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks/{id}:send:
    post:
      operationId: sendCheck
      summary: Record that a printed check left the company
      description: Allowed from printed only (TRS-0420 otherwise). From here on a void also voids the positive pay record (BR-36.5).
      x-passage-duty: treasury.check.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": {$ref: "#/components/responses/CheckChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks/{id}:clear:
    post:
      operationId: clearCheck
      summary: Record that the bank paid a sent check
      description: Allowed from sent only (TRS-0420 otherwise). A cleared check can no longer be voided (TRS-0414). Statement matching will clear checks automatically in a later slice.
      x-passage-duty: treasury.check.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": {$ref: "#/components/responses/CheckChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks/{id}:stop:
    post:
      operationId: stopCheck
      summary: Record a stop-payment order on a sent check
      description: Allowed from sent only (TRS-0420 otherwise); a check still in hand is voided instead.
      x-passage-duty: treasury.check.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": {$ref: "#/components/responses/CheckChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks/{id}:void:
    post:
      operationId: voidCheck
      summary: Void a check; the number stays consumed
      description: |
        Allowed from created, printed, sent and stopped. A cleared check is TRS-0414 (BR-36.5).
        Writes dev.passage.treasury.check.voided.v1 to the outbox in the same transaction;
        positivePayVoid is true when the check was sent or stopped.
      x-passage-duty: treasury.check.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CheckReasonRequest"}
      responses:
        "200": {$ref: "#/components/responses/CheckChanged"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/checks/{id}:reprint:
    post:
      operationId: reprintCheck
      summary: Void a check and issue a printed replacement on the next number (AC-36.5)
      description: |
        One transaction: the old check is voided (check.voided.v1 written), and a new check with the
        same payee, amount and currency is printed on the next number and points back with replacesId.
        If-Match is the old check's ETag; the response is the new check.
      x-passage-duty: treasury.check.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CheckReasonRequest"}
      responses:
        "201":
          description: The new, printed check
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Check"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/facilities:
    post:
      operationId: createFacility
      summary: Register a bank facility with its limit and expiry (FR-36.7)
      x-passage-duty: treasury.facility.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateFacilityRequest"}
      responses:
        "201":
          description: Facility stored (or the stored facility for a repeated key)
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Facility"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listFacilities
      summary: Facilities of a legal entity with utilization and headroom
      x-passage-duty: treasury.view
      parameters:
        - name: legalEntityId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Facilities
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Facility"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/treasury/facilities/{id}:
    get:
      operationId: getFacility
      summary: Read a facility with utilization and headroom
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Facility
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Facility"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/facilities/{id}/instruments:
    post:
      operationId: createFacilityInstrument
      summary: Book a letter of credit or guarantee on a facility (FR-36.7, AC-36.6)
      description: |
        Refused with TRS-0415 when utilization + amount exceeds the limit, unless overrideLimit is true
        and the caller holds treasury.facility.override (403 AUTH-0003 without it). The facility must be
        active and not expired on the issue date (TRS-0429); the currency must equal the facility currency (TRS-0430).
      x-passage-duty: treasury.facility.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateInstrumentRequest"}
      responses:
        "201":
          description: Instrument booked as open (or the stored instrument for a repeated key)
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FacilityInstrument"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listFacilityInstruments
      summary: Instruments booked on a facility, oldest first
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Instruments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/FacilityInstrument"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/facility-instruments/{id}:close:
    post:
      operationId: closeFacilityInstrument
      summary: Close an open instrument and release it from utilization
      description: Allowed from open only (TRS-0434 otherwise).
      x-passage-duty: treasury.facility.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Instrument closed; the version (ETag) is incremented
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FacilityInstrument"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/loans:
    post:
      operationId: createLoan
      summary: Record a fixed-rate loan contract and generate its schedule (FR-36.19)
      description: |
        Maturity must fall a whole number of periods after the start date (month ends clamp, so
        31 January plus one month is 28/29 February); otherwise TRS-0446. Interest per period =
        opening principal x rate x days / basis, rounded half-up to the currency minor unit (BR-36.15).
      x-passage-duty: treasury.loan.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateLoanRequest"}
      responses:
        "201":
          description: Loan and schedule stored (or the stored loan for a repeated key)
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Loan"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listLoans
      summary: Loan contracts of a legal entity, newest start first (without schedules)
      x-passage-duty: treasury.view
      parameters:
        - name: legalEntityId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Loans
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Loan"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/treasury/loans/{id}:
    get:
      operationId: getLoan
      summary: Read a loan contract with its schedule
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Loan
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Loan"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/reconciliation-rules:
    post:
      operationId: createReconciliationRule
      summary: Store a matching rule for a bank account or for every account of a legal entity (FR-36.3)
      description: |
        Weights (amount, date, reference, counterparty) sum to 100 and the amount carries at least 20.
        A strict rule may only auto-match on a reference of 8 or more characters. Rules run in priority
        order (1 first). The name is unique per legal entity (TRS-0482). A bank account may have at most 20 active
        rules, counting the entity-wide ones (422 TRS-0489).
      x-passage-duty: treasury.reconciliation.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateReconciliationRuleRequest"}
      responses:
        "201":
          description: Rule stored (or the stored rule for a repeated key)
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReconciliationRule"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listReconciliationRules
      summary: Rules of a legal entity in run order, optionally those that apply to one bank account
      x-passage-duty: treasury.view
      parameters:
        - name: legalEntityId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: bankAccountId
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ReconciliationRule"}
        "400": {$ref: "#/components/responses/Problem"}
  /v1/treasury/reconciliation-rules/{id}:
    get:
      operationId: getReconciliationRule
      summary: Read a reconciliation rule
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Rule
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReconciliationRule"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/reconciliation-rules/{id}:deactivate:
    post:
      operationId: deactivateReconciliationRule
      summary: Stop a rule from running; matches it made stay
      x-passage-duty: treasury.reconciliation.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Rule deactivated; the version (ETag) is incremented
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReconciliationRule"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/reconciliation-runs:
    post:
      operationId: runReconciliation
      summary: Run the account's active rules over a statement against the open items offered (FR-36.3)
      description: |
        Ledger, AR and AP own the open items, so the caller offers them (at most 2,000; amounts in the
        statement's sign convention). The next 2,000 unmatched or suggested lines after `afterLineNo` are
        considered; `remainingLines` counts the open lines after that page and `nextAfterLineNo` is the cursor to
        run again with. Lines of the page that an earlier run suggested but found no candidate now return to
        unmatched; lines outside the page keep their status. `legalEntityId` must be the statement's legal entity
        (TRS-0488) and inside the caller's scope (403). A reference-only candidate (the reference agrees but the
        amount, date or payer does not) is suggested, never auto-matched. A placeholder end-to-end id such as
        NOTPROVIDED is ignored; the remittance reference of the line is scored instead.
        Unique matches are stored and published; N:1 batch receipts match when the items sharing the line's
        batch reference add up to the line exactly. An item wanted by two matches is released from both.
        Other lines with a candidate become suggested and are listed. TRS-0480 when the account has no active rule.
      x-passage-duty: treasury.reconciliation.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReconciliationRunRequest"}
      responses:
        "201":
          description: Run result (or the stored result for a repeated key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReconciliationRunResult"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/treasury/reconciliation-matches:
    post:
      operationId: createManualMatch
      summary: Match statement lines to items by hand with a reason (FR-36.3)
      description: |
        Many-to-one or one-to-many. The lines' amounts must add up to the items' exactly (TRS-0481);
        lines and items must be in the statement currency (TRS-0486) and free of another active
        match (409 TRS-0411). `legalEntityId` must be the statement's legal entity (TRS-0488).
