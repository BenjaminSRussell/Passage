                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ReconciliationMatch"}
                  nextOffset: {type: integer, minimum: 1}
        "400": {$ref: "#/components/responses/Problem"}
  /v1/treasury/reconciliation-matches/{id}:
    get:
      operationId: getReconciliationMatch
      summary: Read a match with its lines and items
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Match
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReconciliationMatch"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/treasury/reconciliation-matches/{id}:unmatch:
    post:
      operationId: unmatchReconciliationMatch
      summary: Dissolve a match with a reason; its lines return to unmatched and its items are free again
      description: 409 TRS-0485 when the match is already unmatched. The match row stays as history and records `unmatchedBy`.
      x-passage-duty: treasury.reconciliation.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: {type: string, minLength: 1, maxLength: 200}
      responses:
        "200":
          description: Match unmatched; the version (ETag) is incremented
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReconciliationMatch"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-reconciliations:
    post:
      operationId: createBankReconciliation
      summary: Open the reconciliation of one statement (one bank account and period) (FR-36.5)
      description: |
        One per statement (409 TRS-0504). Opening and closing balances come from the statement; the book balance and the
        book items not yet on the statement are supplied by the caller and can be corrected until the period closes.
        The service returns the difference `closing - (book + outstanding + excluded lines)`; a reconciliation closes only at zero.
      x-passage-duty: treasury.reconciliation.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateBankReconciliationRequest"}
      responses:
        "201":
          description: Reconciliation opened (or the stored one for a repeated key)
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankReconciliation"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listBankReconciliations
      summary: Reconciliations by bank account, period and state, newest period first
      x-passage-duty: treasury.reconciliation.view
      parameters:
        - {name: legalEntityId, in: query, schema: {type: string, format: uuid}}
        - {name: bankAccountId, in: query, schema: {type: string, format: uuid}}
        - {name: state, in: query, schema: {type: string, enum: [open, closed, reopened]}}
        - {name: periodFrom, in: query, description: Keeps reconciliations whose period ends on or after this date, schema: {type: string, format: date}}
        - {name: periodTo, in: query, description: Keeps reconciliations whose period starts on or before this date, schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
        - {name: cursor, in: query, description: The nextCursor of the previous page, schema: {type: string}}
      responses:
        "200":
          description: A page; nextCursor is present when more follow
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankReconciliationPage"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-reconciliations/{id}:
    get:
      operationId: getBankReconciliation
      summary: Read a reconciliation with its summary of matched, excluded and unmatched lines
      x-passage-duty: treasury.reconciliation.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Reconciliation
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankReconciliation"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-reconciliations/{id}:set-balances:
    post:
      operationId: setBankReconciliationBalances
      summary: Replace the book balance and the book items not yet on the statement
      description: |
        Refused with 409 TRS-0506 once the period is closed. The book balance is stated by the caller, not read from the
        ledger: every change is written to the reconciliation's audit trail (`balances_set`, with old and new values and the
        actor) and the person is stored as `bookBalanceStatedBy`. That person cannot close the reconciliation (403 TRS-0520).
      x-passage-duty: treasury.reconciliation.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookBalance, outstandingAmount]
              additionalProperties: false
              properties:
                bookBalance: {type: string, description: "Signed decimal, at most the currency's minor units"}
                outstandingAmount: {type: string, description: "Signed decimal, at most the currency's minor units"}
      responses:
        "200":
          description: Balances stored; the version (ETag) is incremented
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankReconciliation"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-reconciliations/{id}:close:
    post:
      operationId: closeBankReconciliation
      summary: Close the period; its lines and matches are locked against change
      description: |
        Allowed only when every line is matched or excluded with a reason (422 TRS-0507) and the difference is zero
        (422 TRS-0410), and no bank transaction from a line is still being posted or held for a person (409 TRS-0517, `errors.pendingLines`
        lists the line numbers). The person who last stated the book balance cannot close it (403 TRS-0520). Records who closed it and when.
        Closing a closed reconciliation answers 200 with it unchanged.
      x-passage-duty: treasury.reconciliation.close
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Reconciliation closed
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankReconciliation"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-reconciliations/{id}:reopen:
    post:
      operationId: reopenBankReconciliation
      summary: Reopen a closed period with a reason; audited
      description: |
        Needs its own duty and a reason. The person who closed the period cannot reopen it (403 TRS-0509). Refused with
        409 TRS-0508 while a later period of the same bank account is closed: reopen the later period first, latest first.
        Only a closed reconciliation can be reopened (422 TRS-0510). The reopening and its reason are stored with the actor.
      x-passage-duty: treasury.reconciliation.reopen
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonRequest"}
      responses:
        "200":
          description: Reconciliation reopened; lines and matches accept changes again
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BankReconciliation"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-reconciliations/{id}/lines/{lineNo}:exclude:
    post:
      operationId: excludeStatementLine
      summary: Take a statement line out of the reconciliation with a reason
      description: A matched line must be unmatched first (409 TRS-0411). A repeated call answers 200 with the excluded line.
      x-passage-duty: treasury.reconciliation.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/LineNo"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonRequest"}
      responses:
        "200":
          description: Line excluded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StatementLine"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-reconciliations/{id}/lines/{lineNo}:include:
    post:
      operationId: includeStatementLine
      summary: Put an excluded statement line back to unmatched
      x-passage-duty: treasury.reconciliation.write
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/LineNo"
      responses:
        "200":
          description: Line unmatched again
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StatementLine"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-reconciliations/{id}/lines/{lineNo}:abandon:
    post:
      operationId: abandonLineTransaction
      summary: Give up a bank transaction from a line that the ledger will never accept
      description: |
        For a transaction that is pending or held for a person (409 TRS-0522). It is stored as abandoned with the reason and the
        actor and written to the audit trail. The line stays unmatched and no longer blocks the close; check the general ledger
        by hand first, because an unanswered attempt may already have booked the entry. Then exclude the line or match it.
        409 TRS-0523 when the line has no such transaction. A pending transaction is abandoned only after its ledger call went
        unanswered (409 TRS-0516 otherwise: it may be posting right now), and never by the person who started it (403 TRS-0524).
      x-passage-duty: treasury.reconciliation.abandon
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/LineNo"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonRequest"}
      responses:
        "200":
          description: Transaction abandoned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LineTransaction"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/bank-reconciliations/{id}/lines/{lineNo}:create-transaction:
    post:
      operationId: createTransactionFromStatementLine
      summary: Book a bank fee, interest or an unidentified receipt from a statement line and match the line to it
      description: |
        Posts the journal to the general ledger with the posting profile of the legal entity (`TREASURY_GL_PROFILES`), then
        stores the entry, matches the line and moves the reconciliation's book balance by the line amount, in one transaction.
        Once per statement line: the ledger key is derived from the statement and line, so repeating the request, also
        after a lost answer, never posts twice. A line that already has its transaction answers 200 with it.
        A bank fee needs money out, an unknown receipt money in, interest either. The line currency must equal the account currency (422 TRS-0512).
        A refusal by the ledger or the profile (422 TRS-0518) stores nothing as matched, names the cause in `errors.ledgerCode` and releases
        the line for another try, also with another kind. After an earlier attempt that went unanswered the entry may already exist in the
        ledger, so a later refusal or an idempotency conflict does not release the line: it is held for a person (409 TRS-0522) until the
        transaction is abandoned. A 401, 403 or 429 from the ledger is not a business refusal and gives 503 TRS-0519.
        A ledger that does not answer gives 503 TRS-0519 and leaves the line pending; repeat the request. The same 503 answers when the
        ledger accepted the entry but the match could not be saved; repeating is safe.
        An unmapped bank account or a legal entity without a profile gives 422 TRS-0515 or TRS-0518.
        503 TRS-0514 when the service has no ledger client.
      x-passage-duty: treasury.reconciliation.post
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/LineNo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              additionalProperties: false
              properties:
                kind: {type: string, enum: [bank_fee, interest, unknown_receipt]}
      responses:
        "200":
          description: The line already had this transaction
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LineTransaction"}
        "201":
          description: Transaction posted and the line matched
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LineTransaction"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers:
    post:
      operationId: createEbicsSubscriber
      summary: Register an EBICS user at a bank for one bank account
      description: >-
        A retry with the same Idempotency-Key returns the first subscriber (422 when the key was used with another body). The Vault key names are derived by the service from the tenant, legal entity and subscriber id and cannot be chosen by the caller;
        no key material passes through the API. The subscriber starts in NEW.
        TRS-0496 when host, partner and user exist already or the bank account has a subscriber, TRS-0497 for an unacceptable id or URL, 503 TRS-0502 when EBICS is not enabled.
      x-passage-duty: treasury.ebics.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateEbicsSubscriberRequest"}
      responses:
        "201":
          description: Subscriber created
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsSubscriber"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers/{id}:
    get:
      operationId: getEbicsSubscriber
      summary: Read a subscriber with its state and the hashes of the bank keys downloaded so far
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Subscriber
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsSubscriber"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers/{id}:send-ini:
    post:
      operationId: sendEbicsIni
      summary: Send the A006 signature key to the bank (INI) and return the letter to print
      description: Allowed in NEW only (409 TRS-0498 otherwise). NEW to INI_SENT. 502 TRS-0501 when the bank refuses.
      x-passage-duty: treasury.ebics.keys
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Order accepted by the bank
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsLetterResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers/{id}:send-hia:
    post:
      operationId: sendEbicsHia
      summary: Send the X002 and E002 keys to the bank (HIA) and return the letter to print
      description: Allowed in INI_SENT only (409 TRS-0498 otherwise). INI_SENT to HIA_SENT.
      x-passage-duty: treasury.ebics.keys
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Order accepted by the bank
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsLetterResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers/{id}:fetch-bank-keys:
    post:
      operationId: fetchEbicsBankKeys
      summary: Download the bank's keys (HPB) and store them unconfirmed
      description: >-
        Allowed in HIA_SENT or BANK_KEYS_PENDING. The keys are not used for anything until they are confirmed. The response carries
        the hashes of the downloaded keys, to compare with the hashes on the bank's own letter. The caller is recorded as the person
        who downloaded them and cannot confirm them (403 TRS-0503 on confirmation).
      x-passage-duty: treasury.ebics.keys
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Subscriber
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsSubscriber"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers/{id}:confirm-bank-keys:
    post:
      operationId: confirmEbicsBankKeys
      summary: Activate the subscriber after the bank's key hashes were compared
      description: >-
        The hashes the bank printed must equal the hashes of the downloaded keys (422 TRS-0499 otherwise, and nothing is activated).
        The confirmer recorded is the authenticated user, never a value from the body. BANK_KEYS_PENDING to READY. Needs a duty other
        than the one that runs the key ceremony, and a different person than the one who downloaded the keys (403 TRS-0503).
      x-passage-duty: treasury.ebics.approve
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfirmEbicsBankKeysRequest"}
      responses:
        "200":
          description: Subscriber
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsSubscriber"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers/{id}:unpark:
    post:
      operationId: unparkEbicsSubscriber
      summary: Let a parked subscriber transact again after a person reviewed the bank's refusal
      description: >-
        409 TRS-0498 when the subscriber is not parked. The authenticated user and the time are written to an append-only audit row
        in the same transaction. Needs If-Match with the subscriber's ETag (428 without it, 412 when stale).
      x-passage-duty: treasury.ebics.approve
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Subscriber
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsSubscriber"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/treasury/ebics-subscribers/{id}/letters/{order}:
    get:
      operationId: getEbicsLetter
      summary: Rebuild the INI or HIA letter from the subscriber's public keys
      x-passage-duty: treasury.view
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: order
          in: path
          required: true
          schema: {type: string, enum: [INI, HIA]}
      responses:
        "200":
          description: Letter
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EbicsLetter"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    LineNo:
      name: lineNo
      in: path
      required: true
      description: Line number within the statement, from 1
      schema: {type: integer, minimum: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Same key and body replay the stored response; same key with another body is idempotency_key_reuse (422)
      schema: {type: string, maxLength: 255}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the resource as last read (428 when absent, 412 when stale)
      schema: {type: string}
  headers:
    ETag:
      description: Version of the resource, quoted integer
      schema: {type: string}
  responses:
    CheckChanged:
      description: New status stored; the version (ETag) is incremented
      headers:
        ETag: {$ref: "#/components/headers/ETag"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Check"}
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Money:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]{1,6})?$"
      description: Decimal amount as a string (never a float)
    CreateBankAccountRequest:
      type: object
      required: [legalEntityId, accountCode, iban, currency, mainAccountId]
      additionalProperties: false
      properties:
        legalEntityId: {type: string, format: uuid}
        accountCode: {type: string, pattern: "^[A-Z0-9-]{1,20}$"}
        iban: {type: string, description: "Validated mod-97 (TRS-0401). Only a SHA-256 lookup hash, the masked form and the last four characters are stored; the full IBAN is not retained (see NOT-IMPLEMENTED.md)."}
        bic: {type: string, description: ISO 9362}
        statementAccount: {type: string, description: "Optional account number the bank writes on BAI2 (03 record), MT940 (:25:) or non-IBAN camt.053 (Acct/Id/Othr/Id) statements. Spaces are removed and letters upper-cased; then 1 to 35 characters of A-Z, 0-9, /, . or -. Stored only as a SHA-256 hash and its last four characters."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        mainAccountId: {type: string, format: uuid}
    BankAccount:
      type: object
      required: [id, legalEntityId, accountCode, ibanMasked, ibanLast4, currency, mainAccountId, status, version]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        accountCode: {type: string}
        ibanMasked: {type: string}
        ibanLast4: {type: string, minLength: 4, maxLength: 4}
        bic: {type: [string, "null"]}
        statementAccountLast4: {type: string, minLength: 1, maxLength: 4, description: Last four characters of the statement account number; absent when none was given}
        currency: {type: string}
        mainAccountId: {type: string, format: uuid}
        status: {type: string, enum: [draft, active, inactive, closed]}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Statement:
      type: object
      required: [id, bankAccountId, legalEntityId, statementId, format, currency, openingDate, openingBalance, closingDate, closingBalance, lineCount, createdAt]
      properties:
        id: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        statementId: {type: string}
        sequence: {type: [integer, "null"]}
        format: {type: string, pattern: "^(camt\\.053\\.001\\.[0-9]{2}|BAI2|MT940)$"}
        currency: {type: string}
        openingDate: {type: string, format: date}
        openingBalance: {$ref: "#/components/schemas/Money"}
        closingDate: {type: string, format: date}
        closingBalance: {$ref: "#/components/schemas/Money"}
        lineCount: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
    IntradayReport:
      type: object
      required: [id, bankAccountId, legalEntityId, reportId, format, currency, createdAtBank, importedAt, balances]
      properties:
        id: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        reportId: {type: string}
        format: {type: string, description: "camt.052.001.xx"}
        currency: {type: string}
        createdAtBank: {type: string, format: date-time}
        importedAt: {type: string, format: date-time}
        balances:
          type: array
          items:
            type: object
            required: [code, amount, asOf]
            properties:
              code: {type: string, enum: [OPBD, ITBD, ITAV, CLAV, FWAV, PRCD, CLBD]}
              amount: {type: string, description: "Signed decimal: credit balances positive"}
              asOf: {type: string, format: date-time}
    CashPosition:
      type: object
      required: [asOf, staleHours, accounts, totals]
      properties:
        asOf: {type: string, format: date-time}
        staleHours: {type: integer}
        accounts:
          type: array
          items:
            type: object
            required: [bankAccountId, accountCode, ibanMasked, account, currency, booked, available, source, stale]
            properties:
              bankAccountId: {type: string, format: uuid}
              accountCode: {type: string}
              ibanMasked: {type: string}
              account: {type: string}
              currency: {type: string}
              booked: {type: string}
              available: {type: string}
              source: {type: string, enum: [camt.052, camt.053, opening, none], description: "opening is the migrated opening book balance (#49), used until a statement or report newer than the end of the cutover day arrives"}
              asOf: {type: string, format: date-time}
              stale: {type: boolean}
        totals:
          type: array
          items:
            type: object
            required: [currency, booked, available]
            properties:
              currency: {type: string}
              booked: {type: string}
              available: {type: string}
    OpeningBatch:
      type: object
      required: [legalEntityId, batchKey, asOf, itemCount, totalsMinor]
      properties:
        legalEntityId: {type: string, format: uuid}
        batchKey: {type: string}
        asOf: {type: string, format: date}
        itemCount: {type: integer}
        totalsMinor: {type: object, additionalProperties: {type: integer, format: int64}}
    CashDesk:
      type: object
      required: [id, legalEntityId, code, name, currency, mainAccountId, maxBalance, status, dualControl, version, createdAt]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        currency: {type: string}
        mainAccountId: {type: string, format: uuid}
        maxBalance: {type: string}
        status: {type: string, enum: [active, inactive]}
        dualControl: {type: boolean}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        openDate: {type: string, format: date, description: The open business day, when there is one}
        balance: {type: string, description: Book balance of the open day}
    CashDeskDay:
      type: object
      required: [deskId, businessDate, status, openingBalance, bookBalance, openedBy, openedAt, differencePosting]
      properties:
        deskId: {type: string, format: uuid}
        businessDate: {type: string, format: date}
        status: {type: string, enum: [open, closing, closed], description: closing is a counted day waiting for the second signature}
        openingBalance: {type: string}
        bookBalance: {type: string}
        countedBalance: {type: string}
        difference: {type: string, description: counted less book}
        differenceReason: {type: string}
        openedBy: {type: string}
        closedBy: {type: string}
        approvedBy: {type: string, description: the second signature of a dual-control desk}
        denominations:
          type: array
          items:
            type: object
            required: [value, count]
            properties:
              value: {type: string}
              count: {type: integer}
        openedAt: {type: string, format: date-time}
        closedAt: {type: string, format: date-time}
        differencePosting: {type: string, enum: [not_posted, pending, posted]}
        differenceLedgerEntryId: {type: string}
    CashDeskEntry:
      type: object
      required: [id, deskId, businessDate, lineNo, kind, amount, description, createdBy, createdAt, balanceAfter, postingStatus]
      properties:
        id: {type: string, format: uuid}
        deskId: {type: string, format: uuid}
        businessDate: {type: string, format: date}
        lineNo: {type: integer}
        kind: {type: string, enum: [receipt, payment]}
        amount: {type: string}
        description: {type: string}
        reference: {type: string}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        counterAccount: {type: string}
        bankAccountId: {type: string, format: uuid}
        postingStatus: {type: string, enum: [not_posted, pending, posted], description: not_posted when the desk does not post to the ledger}
        ledgerEntryId: {type: string}
        postedAt: {type: string, format: date-time}
        balanceAfter: {type: string}
    ImportedStatement:
      allOf:
        - $ref: "#/components/schemas/Statement"
        - type: object
          required: [warnings]
          properties:
            warnings:
              type: array
              description: Non-blocking findings of a new import (TRS-0407 sequence gap); empty on a replay
              items:
                type: object
                required: [code, detail]
                properties:
                  code: {type: string, example: TRS-0407}
                  detail: {type: string}
    StatementLine:
      type: object
      required: [lineNo, bookingDate, valueDate, amount, currency, status]
      properties:
        lineNo: {type: integer, minimum: 1}
        bookingDate: {type: string, format: date}
        valueDate: {type: string, format: date}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string}
        btcCode: {type: string}
        endToEndRef: {type: string}
        reference: {type: string}
        counterpartyName: {type: string}
        status: {type: string, enum: [unmatched, suggested, matched, created, in_transit]}
    CreateForecastEntryRequest:
      type: object
      required: [legalEntityId, sourceType, expectedDate, amount, currency]
      additionalProperties: false
      properties:
        legalEntityId: {type: string, format: uuid}
        sourceType: {type: string, enum: [AP, AR, PO, SO, Recurring, Manual, Payroll, Project]}
        sourceId: {type: string, maxLength: 64, description: Generated when omitted}
        expectedDate: {type: string, format: date}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        confidence: {type: string, description: Decimal between 0 and 1; default 1}
    ForecastEntry:
      type: object
      required: [id, legalEntityId, sourceType, sourceId, expectedDate, amount, currency, confidence]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        sourceType: {type: string}
        sourceId: {type: string}
        expectedDate: {type: string, format: date}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string}
        confidence: {type: string}
    Forecast:
      type: object
      required: [layout, asOf, buckets, outOfHorizon]
      properties:
        layout: {type: string, enum: [daily, weekly, monthly]}
        asOf: {type: string, format: date}
        buckets:
          type: array
          items:
            type: object
            required: [key, currency, inflow, outflow, net, cumulative]
            properties:
              key: {type: string, format: date}
              currency: {type: string}
              inflow: {$ref: "#/components/schemas/Money"}
              outflow: {$ref: "#/components/schemas/Money"}
              net: {$ref: "#/components/schemas/Money"}
              cumulative: {$ref: "#/components/schemas/Money"}
        outOfHorizon: {type: integer, minimum: 0}
        sources:
          type: array
          description: How each live source (AP, AR) took part; absent sources are not configured
          items:
            type: object
            required: [type, status, count]
            properties:
              type: {type: string, enum: [AP, AR]}
              status: {type: string, enum: [ok, truncated, unavailable], description: truncated means the subledger holds more items than were read, so the forecast is understated}
              count: {type: integer, minimum: 0}
    PositiveMoney:
      type: string
      pattern: "^[0-9]{1,14}(\\.[0-9]{1,4})?$"
      description: Positive decimal string with at most the currency's minor-unit places (two for EUR, none for JPY)
    IssueCheckRequest:
      type: object
      required: [bankAccountId, payee, amount, currency]
      additionalProperties: false
      properties:
        bankAccountId: {type: string, format: uuid}
        payee: {type: string, minLength: 1, maxLength: 140}
        amount: {$ref: "#/components/schemas/PositiveMoney"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
    CheckReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1, maxLength: 200}
    Check:
      type: object
      required: [id, legalEntityId, bankAccountId, checkNumber, payee, amount, currency, status, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid}
        checkNumber: {type: integer, minimum: 1, description: Gap-free per bank account}
        payee: {type: string}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string}
        status: {type: string, enum: [created, printed, sent, cleared, voided, stopped]}
        voidReason: {type: string}
        replacesId: {type: string, format: uuid, description: The voided check this reprint replaces}
        replacedById: {type: string, format: uuid, description: The reprint that replaced this voided check}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateFacilityRequest:
      type: object
      required: [legalEntityId, code, bankName, currency, limit, expiryDate]
      additionalProperties: false
      properties:
        legalEntityId: {type: string, format: uuid}
        code: {type: string, pattern: "^[A-Z0-9-]{1,20}$"}
        bankName: {type: string, minLength: 1, maxLength: 120}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        limit: {$ref: "#/components/schemas/PositiveMoney"}
        expiryDate: {type: string, format: date}
    Facility:
      type: object
      required: [id, legalEntityId, code, bankName, currency, limit, utilized, headroom, expiryDate, status, version, createdAt]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        code: {type: string}
        bankName: {type: string}
        currency: {type: string}
        limit: {$ref: "#/components/schemas/Money"}
        utilized: {$ref: "#/components/schemas/Money", description: Sum of open instruments}
        headroom: {$ref: "#/components/schemas/Money", description: Limit minus utilization, never below zero}
        expiryDate: {type: string, format: date}
        status: {type: string, enum: [active, closed]}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
    CreateInstrumentRequest:
      type: object
      required: [kind, reference, beneficiary, currency, amount, issueDate, expiryDate]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [lc_import, lc_export, guarantee]}
        reference: {type: string, minLength: 1, maxLength: 64}
        beneficiary: {type: string, minLength: 1, maxLength: 140}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        amount: {$ref: "#/components/schemas/PositiveMoney"}
        issueDate: {type: string, format: date}
        expiryDate: {type: string, format: date, description: Not before issueDate}
        linkedOrderRef: {type: string, maxLength: 64, description: Purchase or sales order the instrument secures}
        overrideLimit: {type: boolean, default: false, description: Book past the limit; needs treasury.facility.override}
    FacilityInstrument:
      type: object
      required: [id, facilityId, legalEntityId, kind, reference, beneficiary, currency, amount, issueDate, expiryDate, status, limitOverride, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        facilityId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        kind: {type: string, enum: [lc_import, lc_export, guarantee]}
        reference: {type: string}
        beneficiary: {type: string}
        currency: {type: string}
        amount: {$ref: "#/components/schemas/Money"}
        issueDate: {type: string, format: date}
        expiryDate: {type: string, format: date}
        linkedOrderRef: {type: string}
        status: {type: string, enum: [open, closed]}
        limitOverride: {type: boolean, description: True when the instrument was booked past the limit under the override duty}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateLoanRequest:
      type: object
      required: [legalEntityId, role, counterpartyName, principal, currency, startDate, maturityDate, scheduleType, fixedRate, dayCount, periodMonths]
      additionalProperties: false
      properties:
        legalEntityId: {type: string, format: uuid}
        role: {type: string, enum: [borrower, lender]}
        counterpartyName: {type: string, minLength: 1, maxLength: 140}
        principal: {$ref: "#/components/schemas/PositiveMoney"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        startDate: {type: string, format: date}
        maturityDate: {type: string, format: date}
        scheduleType: {type: string, enum: [Annuity, Linear, Bullet]}
        fixedRate: {type: string, pattern: "^(0(\\.[0-9]{1,6})?|1(\\.0{1,6})?)$", description: Annual rate as a fraction, 0.03 for 3.00%}
        dayCount: {type: string, enum: ["ACT/360", "ACT/365", "30/360"]}
        periodMonths: {type: integer, enum: [1, 3, 6, 12]}
    LoanScheduleLine:
      type: object
      required: [periodNo, periodStart, periodEnd, days, openingPrincipal, interest, principalRepayment, closingPrincipal]
      properties:
        periodNo: {type: integer, minimum: 1}
        periodStart: {type: string, format: date}
        periodEnd: {type: string, format: date}
        days: {type: integer, minimum: 1, description: Accrual days under the day-count convention}
        openingPrincipal: {$ref: "#/components/schemas/Money"}
        interest: {$ref: "#/components/schemas/Money"}
        principalRepayment: {$ref: "#/components/schemas/Money"}
        closingPrincipal: {$ref: "#/components/schemas/Money"}
    Loan:
      type: object
      required: [id, legalEntityId, role, counterpartyName, principal, currency, startDate, maturityDate, scheduleType, fixedRate, dayCount, periodMonths, status, version, createdAt]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        role: {type: string, enum: [borrower, lender]}
        counterpartyName: {type: string}
        principal: {$ref: "#/components/schemas/Money"}
        currency: {type: string}
        startDate: {type: string, format: date}
        maturityDate: {type: string, format: date}
        scheduleType: {type: string, enum: [Annuity, Linear, Bullet]}
        fixedRate: {type: string}
        dayCount: {type: string, enum: ["ACT/360", "ACT/365", "30/360"]}
        periodMonths: {type: integer, enum: [1, 3, 6, 12]}
        status: {type: string, enum: [draft, active, repaid, terminated]}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        schedule:
          type: array
          description: Present on create and get; omitted in the list
          items: {$ref: "#/components/schemas/LoanScheduleLine"}
    ReconciliationWeights:
      type: object
      required: [amount, date, reference, counterparty]
      additionalProperties: false
      properties:
        amount: {type: integer, minimum: 20, maximum: 100}
        date: {type: integer, minimum: 0, maximum: 80}
        reference: {type: integer, minimum: 0, maximum: 80}
        counterparty: {type: integer, minimum: 0, maximum: 80}
    CreateReconciliationRuleRequest:
      type: object
      required: [legalEntityId, name, priority, weights, amountTolerance, dateWindowDays]
      additionalProperties: false
      properties:
        legalEntityId: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid, description: Omit for a rule that applies to every account of the legal entity}
        name: {type: string, minLength: 1, maxLength: 80}
        priority: {type: integer, minimum: 1, maximum: 1000}
        weights: {$ref: "#/components/schemas/ReconciliationWeights"}
        amountTolerance: {type: string, description: Largest amount difference that still scores, decimal string}
        dateWindowDays: {type: integer, minimum: 0, maximum: 30}
        strict: {type: boolean, description: Auto-match only on a reference of 8 or more characters, unique among the open items}
    ReconciliationRule:
      type: object
      required: [id, legalEntityId, name, priority, weights, amountTolerance, dateWindowDays, strict, active, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid}
        name: {type: string}
        priority: {type: integer}
        weights: {$ref: "#/components/schemas/ReconciliationWeights"}
        amountTolerance: {type: string}
        dateWindowDays: {type: integer}
        strict: {type: boolean}
        active: {type: boolean}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ReconciliationItem:
      type: object
      required: [type, id, currency, amount]
      additionalProperties: false
      properties:
        type: {type: string, enum: [ledger, ar, ap]}
        id: {type: string, minLength: 1, maxLength: 100}
        currency: {type: string}
        amount: {$ref: "#/components/schemas/Money"}
    ReconciliationRunItem:
      type: object
      required: [type, id, currency, amount, valueDate]
      additionalProperties: false
      properties:
        type: {type: string, enum: [ledger, ar, ap]}
        id: {type: string, minLength: 1, maxLength: 100}
        currency: {type: string}
        amount: {$ref: "#/components/schemas/Money"}
        valueDate: {type: string, format: date}
        reference: {type: string, maxLength: 140, description: Invoice number, end-to-end id or check number}
        counterparty: {type: string, maxLength: 140}
        batch: {type: string, maxLength: 140, description: Remittance or batch id; items sharing it match one batch receipt line whose reference names it}
    ReconciliationRunRequest:
      type: object
      required: [statementId, legalEntityId, items]
      additionalProperties: false
      properties:
        statementId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid, description: Legal entity the offered items belong to; must be the statement's}
        afterLineNo: {type: integer, minimum: 0, default: 0, description: Only lines with a higher number are considered; pass the previous nextAfterLineNo}
        items:
          type: array
          minItems: 1
          maxItems: 2000
          items: {$ref: "#/components/schemas/ReconciliationRunItem"}
    ReconciliationRunResult:
      type: object
      required: [matches, suggestions, linesConsidered, itemsConsidered, remainingLines, nextAfterLineNo]
      properties:
        matches:
          type: array
          items: {$ref: "#/components/schemas/ReconciliationMatch"}
        suggestions:
          type: array
          items:
            type: object
            required: [lineNo, itemType, itemId, score]
            properties:
              lineNo: {type: integer}
              itemType: {type: string}
              itemId: {type: string}
              score: {type: integer, minimum: 0, maximum: 100}
        linesConsidered: {type: integer}
        itemsConsidered: {type: integer, description: Offered items in the statement currency and not already in an active match}
        remainingLines: {type: integer, description: Open lines after this page}
        nextAfterLineNo: {type: integer, description: Cursor for the next run; 0 when no lines remain}
    CreateManualMatchRequest:
      type: object
      required: [statementId, legalEntityId, lineNos, items, reason]
      additionalProperties: false
      properties:
        statementId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        lineNos:
          type: array
          minItems: 1
          maxItems: 50
          items: {type: integer, minimum: 1}
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: "#/components/schemas/ReconciliationItem"}
        reason: {type: string, minLength: 1, maxLength: 200}
    ReconciliationMatch:
      type: object
      required: [id, legalEntityId, bankAccountId, statementId, kind, status, difference, createdBy, version, lines, items, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid}
        statementId: {type: string, format: uuid}
        kind: {type: string, enum: [auto, manual]}
        status: {type: string, enum: [matched, unmatched]}
        ruleName: {type: string, description: The rule that decided an auto match, or batch}
        score: {type: integer, minimum: 0, maximum: 100}
        difference: {$ref: "#/components/schemas/Money"}
        reason: {type: string}
        unmatchReason: {type: string}
        unmatchedBy: {type: string}
        createdBy: {type: string}
        version: {type: integer, minimum: 1}
        lines:
          type: array
          items:
            type: object
            required: [lineNo, amount]
            properties:
              lineNo: {type: integer}
              amount: {$ref: "#/components/schemas/Money"}
        items:
          type: array
          items: {$ref: "#/components/schemas/ReconciliationItem"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri, example: "https://passage.dev/problems/TRS-0401"}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string, description: Stable code; see README error table}
        serviceCode: {type: string, example: TRS-0401}
        traceId: {type: string}
        errors:
          type: object
          description: Field name to message; parse errors carry "line"
          additionalProperties: {type: string}
    CreateEbicsSubscriberRequest:
      type: object
      required: [legalEntityId, bankAccountId, hostId, partnerId, userId, url]
      additionalProperties: false
      properties:
        legalEntityId: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid}
        hostId: {type: string, pattern: "^[A-Za-z0-9._-]{1,35}$"}
        partnerId: {type: string, pattern: "^[A-Za-z0-9._-]{1,35}$"}
        userId: {type: string, pattern: "^[A-Za-z0-9._-]{1,35}$"}
        url: {type: string, description: HTTPS URL of the bank's EBICS server}
    EbicsSubscriber:
      type: object
      required: [id, legalEntityId, bankAccountId, hostId, partnerId, userId, url, state, keysConfirmed, version]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid}
        hostId: {type: string}
        partnerId: {type: string}
        userId: {type: string}
        url: {type: string}
        state: {type: string, enum: [NEW, INI_SENT, HIA_SENT, BANK_KEYS_PENDING, READY]}
        keysConfirmed: {type: boolean}
        confirmedBy: {type: string}
        confirmedAt: {type: string, format: date-time}
        parkedCode: {type: string, description: Return code of the bank refusal that parked the subscriber}
        parkedText: {type: string}
        bankKeyHashes:
          type: object
          properties:
            x002: {type: string, description: "SHA-256 of the bank's X002 key, uppercase hex pairs"}
            e002: {type: string}
        version: {type: integer, minimum: 1}
    EbicsLetter:
      type: object
      required: [order, text, hashes]
      properties:
        order: {type: string, enum: [INI, HIA]}
        text: {type: string, description: Letter to print, sign and send to the bank}
        hashes:
          type: object
          additionalProperties: {type: string}
    EbicsLetterResult:
      type: object
      required: [letter]
      properties:
        subscriber: {$ref: "#/components/schemas/EbicsSubscriber"}
        letter: {$ref: "#/components/schemas/EbicsLetter"}
    ConfirmEbicsBankKeysRequest:
      type: object
      required: [x002Hash, e002Hash]
      additionalProperties: false
      properties:
        x002Hash: {type: string, description: Hash printed on the bank's own letter for its authentication key}
        e002Hash: {type: string, description: Hash printed on the bank's own letter for its encryption key}
    ReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1, maxLength: 200}
    CreateBankReconciliationRequest:
      type: object
      required: [statementId]
      additionalProperties: false
      properties:
        statementId: {type: string, format: uuid}
        bookBalance: {type: string, description: "Signed decimal, at most the currency's minor units; required unless bookBalanceSource is opening"}
        outstandingAmount: {type: string, description: "Book items not yet on the statement, signed; default 0"}
        bookBalanceSource: {type: string, enum: [stated, opening], default: stated, description: "opening starts the account's first reconciliation, of a statement closing on or after the cutover, from the opening book balance the migration factory loaded (#49); leave bookBalance out. 422 TRS-0606 without an opening balance, TRS-0607 for a later reconciliation or an earlier statement."}
    BankReconciliationLines:
      type: object
      required: [lines, matchedCount, matchedTotal, excludedCount, excludedTotal, unmatchedCount, unmatchedTotal]
      properties:
        lines: {type: integer}
        matchedCount: {type: integer, description: Lines matched, including those created from a transaction}
        matchedTotal: {type: string}
        excludedCount: {type: integer}
        excludedTotal: {type: string}
        unmatchedCount: {type: integer}
        unmatchedTotal: {type: string}
    BankReconciliation:
      type: object
      required: [id, legalEntityId, bankAccountId, statementId, currency, periodFrom, periodTo, state, openingBalance, closingBalance, bookBalance, outstandingAmount, difference, summary, version]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid}
        statementId: {type: string, format: uuid}
        currency: {type: string}
        periodFrom: {type: string, format: date}
        periodTo: {type: string, format: date}
        state: {type: string, enum: [open, closed, reopened]}
        openingBalance: {type: string}
        closingBalance: {type: string}
        bookBalance: {type: string}
        outstandingAmount: {type: string, description: "Signed. Positive: book payments not yet on the statement (outstanding checks). Negative: book receipts not yet on it (deposits in transit)."}
        bookBalanceSource: {type: string, enum: [stated, opening], description: "stated by a person, or opening: the account's first reconciliation started from the migrated opening book balance; a restatement makes it stated"}
        bookBalanceStatedBy: {type: string, description: The person who last stated the book balance; cannot close the reconciliation}
        bookBalanceStatedAt: {type: string, format: date-time}
        difference: {type: string, description: "closing - (book + outstanding + excluded lines); zero to close"}
        summary: {$ref: "#/components/schemas/BankReconciliationLines"}
        closedBy: {type: string}
        closedAt: {type: string, format: date-time}
        reopenedBy: {type: string}
        reopenedAt: {type: string, format: date-time}
        reopenReason: {type: string}
        version: {type: integer}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    BankReconciliationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/BankReconciliation"}
        nextCursor: {type: string}
    LineTransaction:
      type: object
      required: [id, reconciliationId, bankAccountId, statementId, lineNo, kind, amount, currency, postingDate, status, version]
      properties:
        id: {type: string, format: uuid}
        reconciliationId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        bankAccountId: {type: string, format: uuid}
        statementId: {type: string, format: uuid}
        lineNo: {type: integer}
        kind: {type: string, enum: [bank_fee, interest, unknown_receipt]}
        amount: {type: string, description: Signed as on the statement line, in the currency's minor units}
        currency: {type: string}
        postingDate: {type: string, format: date}
        status: {type: string, enum: [pending, posted, refused, conflict, abandoned]}
        ledgerEntryId: {type: string}
        matchId: {type: string, format: uuid}
        version: {type: integer}
