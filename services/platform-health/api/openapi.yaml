openapi: 3.1.0
info:
  title: hello-ledger
  version: 0.1.0
  description: Placeholder service that proves the delivery path end to end.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/hello-ledger/entries:
    post:
      operationId: createEntry
      x-passage-duty: hello.write
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEntry' }
      responses:
        '201':
          description: Entry created, or the original entry on an Idempotency-Key replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listEntries
      x-passage-duty: hello.read
      responses:
        '200':
          description: Newest entries for the caller's tenant, at most 100.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Entry' }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/platform/releases:
    post:
      operationId: recordRelease
      x-passage-duty: Maintain platform releases
      description: Records one promote or rollback of an image digest. Accepted only from the platform operator tenant (PLATFORM_OPERATOR_TENANT_ID; all writes are 403 while unset). Needs Maintain platform releases for dev or stage promotions, Approve production promotion for prod promotions and Rollback environment for rollbacks. Idempotency-Key is scoped to the caller tenant; reusing it with a different payload is 409 (the signed flag is ignored so a re-run after a signature-check flake replays the original). A rollback must target an imageDigest previously promoted to, or recorded as the previous digest of, the same service and environment; otherwise 422 PLH-0422. Platform-level data stored under the nil system tenant; the caller's tenant and user are kept for audit. Emits dev.passage.platform.release.promoted.v1 or dev.passage.platform.release.rolledback.v1 through the outbox.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordRelease' }
      responses:
        '201':
          description: Release recorded, or the original release on an Idempotency-Key replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listReleases
      x-passage-duty: View platform releases
      parameters:
        - name: service
          in: query
          required: false
          schema: { type: string }
        - name: env
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Newest releases first, at most 100.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Release' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
  /metrics:
    get:
      operationId: metrics
      x-passage-duty: public
      description: Served on the admin port (9090), never through the ingress.
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema: { type: string }
components:
  schemas:
    CreateEntry:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 280 }
    Entry:
      type: object
      required: [id, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    RecordRelease:
      type: object
      additionalProperties: false
      required: [service, environment, action, imageDigest, previousDigest, gitSha]
      properties:
        service: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}$' }
        environment: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}$', description: A registered platform environment (dev, stage, prod). }
        action: { type: string, enum: [promote, rollback] }
        imageDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$', description: Digest now pinned. }
        previousDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$', description: Digest it replaced; must differ from imageDigest. }
        gitSha: { type: string, pattern: '^[0-9a-f]{40}$', description: Commit that changed the environment manifest to this digest (the merge commit for git-driven releases). }
        signed: { type: boolean, description: True when cosign signature and SBOM attestation were verified. }
        reason: { type: string, maxLength: 280 }
    Release:
      type: object
      required: [id, service, environment, action, imageDigest, previousDigest, gitSha, signed, actor, createdAt]
      properties:
        id: { type: string, format: uuid }
        service: { type: string }
        environment: { type: string }
        action: { type: string, enum: [promote, rollback] }
        imageDigest: { type: string }
        previousDigest: { type: string }
        gitSha: { type: string }
        signed: { type: boolean }
        actor: { type: string, description: The operator's user id; empty unless the caller belongs to the platform operator tenant. }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
