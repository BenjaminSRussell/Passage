image:
  repository: ghcr.io/benjaminsrussell/hello-ledger
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: hello-ledger-db
migrateOnStart: false
replicaCount: 1
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor:
  enabled: false
ingress:
  enabled: true
  className: traefik
  host: app.local.passage.dev
  clusterIssuer: passage-local-ca
