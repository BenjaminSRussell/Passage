        documentNumber: { type: string }
        currency: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        promiseDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
    OpenDisputeRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, openItemId, reasonCode, disputedAmount, owner]
      properties:
        legalEntityId: { type: string, format: uuid }
        openItemId: { type: string, format: uuid }
        reasonCode: { type: string, pattern: "^[A-Z][A-Z_]{1,31}$", description: "Upper-case code such as PRICE or DAMAGE." }
        disputedAmount: { $ref: "#/components/schemas/Money" }
        owner: { type: string, minLength: 1, maxLength: 120 }
    Dispute:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        openItemId: { type: string, format: uuid }
        documentNumber: { type: string }
        reasonCode: { type: string }
        disputedAmount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        owner: { type: string }
        status: { type: string, enum: [OPEN, UNDER_REVIEW, RESOLVED_CREDIT, RESOLVED_PAID, RESOLVED_WRITE_OFF, REJECTED] }
        resolutionNote: { type: string }
        slaDue: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        version: { type: integer }
    ResolveDisputeRequest:
      type: object
      additionalProperties: false
      required: [resolution]
      properties:
        resolution: { type: string, enum: [CREDIT, PAID, WRITE_OFF, REJECTED] }
        note: { type: [string, "null"], maxLength: 2000 }
    BankStatementImportRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, content]
      properties:
        legalEntityId: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 3145728, description: "The camt.053 XML document (.001.02 to .001.08) as received from the bank." }
    BankStatementBatch:
      type: object
      required: [id, legalEntityId, fileSha256, statementCount, paymentCount, duplicateCount, skippedCount]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        fileSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        statementCount: { type: integer, minimum: 1 }
        paymentCount: { type: integer, description: CAMT053 payments created. }
        duplicateCount: { type: integer, description: Credits whose statement id and entry reference were imported before. }
        skippedCount: { type: integer, description: Entries that are not booked customer credits (debits, pending, reversals). }
        importedAt: { type: string, format: date-time }
        payments:
          type: array
          description: The payments created; returned by the import, omitted from the list.
          items: { $ref: "#/components/schemas/Payment" }
    DeductionType: { type: string, enum: [PROMO, PRICE, SHORT_SHIP, DAMAGE, UNKNOWN] }
    DeductionStatus: { type: string, enum: [OPEN, MATCHED, APPROVED, DENIED, SPLIT, WRITTEN_OFF] }
    ClaimType: { type: string, enum: [REBATE_ACCRUAL, PROMOTION_FUND, CHARGEBACK] }
    DeductionNote:
      type: object
      additionalProperties: false
      properties:
        note: { type: [string, "null"], maxLength: 1000 }
    CreateDeductionRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, openItemId, type, reasonCode, amount]
      properties:
        legalEntityId: { type: string, format: uuid }
        openItemId: { type: string, format: uuid, description: The short-paid debit item the amount moves off. }
        paymentId: { type: [string, "null"], format: uuid, description: The short payment. }
        type: { $ref: "#/components/schemas/DeductionType" }
        reasonCode: { type: string, minLength: 1, maxLength: 60, description: "The customer's stated reason, such as a promotion number." }
        amount: { $ref: "#/components/schemas/Money" }
    Deduction:
      type: object
      required: [id, legalEntityId, customerId, openItemId, documentNumber, type, reasonCode, currency, amount, status, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        openItemId: { type: string, format: uuid }
        documentNumber: { type: string, description: The short-paid item's document number. }
        paymentId: { type: string, format: uuid }
        parentId: { type: string, format: uuid, description: The deduction this one was split from. }
        type: { $ref: "#/components/schemas/DeductionType" }
        reasonCode: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        amount: { $ref: "#/components/schemas/Money" }
        status: { $ref: "#/components/schemas/DeductionStatus" }
        claimType: { $ref: "#/components/schemas/ClaimType" }
        claimRef: { type: string }
        claimRemaining: { $ref: "#/components/schemas/Money" }
        denialReason: { type: string, enum: [NOT_AUTHORIZED, EXPIRED, DUPLICATE] }
        decisionNote: { type: string }
        rebillItemId: { type: string, format: uuid, description: The DEDUCTION debit item a denial re-billed. }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        version: { type: integer }
        children:
          type: array
          description: The OPEN deductions a split created; present on a single read of a SPLIT deduction.
          items: { $ref: "#/components/schemas/Deduction" }
    RMACreditRequest:
      type: object
      additionalProperties: false
      required: [rmaId, rmaNumber, legalEntityId, invoiceNumber, postingDate, gross, restocking, net]
      properties:
        rmaId: { type: string, format: uuid }
        rmaNumber: { type: string, minLength: 1, maxLength: 40 }
        legalEntityId: { type: string, format: uuid }
        invoiceNumber: { type: string, minLength: 1, description: The original invoice; its open item decides the customer and currency }
        invoiceId:
          type: string
          format: uuid
          description: |
            The billing invoice id; required with taxLines and with invoiceLines. Receivables reads that invoice from billing (duty billing.invoice.read,
            BILLING_URL) and refuses a tax code the invoice never billed, or more tax per code than the invoice billed less
            billing credit notes and earlier RMA credits (422 AR-RMA-INVOICE).
        postingDate: { type: string, format: date }
        gross: { $ref: "#/components/schemas/Money" }
        restocking: { $ref: "#/components/schemas/Money" }
        net: { $ref: "#/components/schemas/Money" }
        invoiceLines:
          type: array
          maxItems: 2000
          description: |
            The invoice lines this credit returns and how much of each (quantity above 0, each line once). Required
            when billing is configured, with invoiceId; billing holds them against credit notes and other RMA credits.
          items:
            type: object
            additionalProperties: false
            required: [lineNo, qty]
            properties:
              lineNo: { type: integer, minimum: 1 }
              qty: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,6})?$" }
        taxLines:
          type: array
          maxItems: 20
          description: |
            The tax of the original invoice this credit reverses, one entry per tax code, derived by sales from the
            invoice's stored line tax (pro rata, never re-quoted). Debits the legal entity's GL tax account for the code
            (RECEIVABLES_RMA_TAX_ACCOUNTS) and is recorded with the tax service as a negative output transaction. The AR credit is net + tax.
          items:
            type: object
            additionalProperties: false
            required: [code, amount]
            properties:
              code: { type: string, minLength: 1, maxLength: 20 }
              amount: { $ref: "#/components/schemas/Money" }
    GLJournalView:
      type: object
      required: [id, legalEntityId, sourceType, sourceId, documentId, postingDate, currency, status, attempts, parked, createdAt, debit, lines]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        sourceType: { type: string, enum: [payment_receipt, payment_apply, dunning_fee, interest, down_payment, deduction] }
        sourceId: { type: string, format: uuid }
        documentId: { type: string }
        postingDate: { type: string, format: date }
        currency: { type: string }
        status: { type: string, enum: [PENDING, POSTED] }
        journalPostingId: { type: string }
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        parked: { type: boolean }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        debit: { $ref: "#/components/schemas/Money" }
        lines:
          type: array
          items:
            type: object
            required: [account, side, amount]
            properties:
              account: { type: string }
              side: { type: string, enum: [D, C] }
              amount: { $ref: "#/components/schemas/Money" }
              text: { type: string }
    GLReconciliation:
      type: object
      required: [legalEntityId, asOf, currency, openItemsNet, ledgerReceivable, receivableDifference, unappliedPayments, ledgerUnapplied, unappliedDifference, pendingJournals, parkedJournals, reconciled]
      properties:
        legalEntityId: { type: string, format: uuid }
        asOf: { type: string, format: date }
        currency: { type: string }
        openItemsNet: { $ref: "#/components/schemas/Money" }
        ledgerReceivable: { $ref: "#/components/schemas/Money" }
        receivableDifference: { $ref: "#/components/schemas/Money" }
        unappliedPayments: { $ref: "#/components/schemas/Money" }
        ledgerUnapplied: { $ref: "#/components/schemas/Money" }
        unappliedDifference: { $ref: "#/components/schemas/Money" }
        pendingJournals: { type: integer }
        parkedJournals: { type: integer }
        reconciled: { type: boolean }
    RMACreditView:
      type: object
      required: [id, rmaId, rmaNumber, legalEntityId, documentNumber, creditOpenItemId, customerId, currency, postingDate, gross, restocking, net, tax, status, glAttempts, glParked, createdAt]
      properties:
        id: { type: string, format: uuid }
        rmaId: { type: string, format: uuid }
        rmaNumber: { type: string }
        legalEntityId: { type: string, format: uuid }
        documentNumber: { type: string }
        creditOpenItemId: { type: string, format: uuid, description: The CREDIT_NOTE open item's id; the item exists once the credit is POSTED }
        customerId: { type: string, format: uuid }
        currency: { type: string }
        postingDate: { type: string, format: date }
        gross: { $ref: "#/components/schemas/Money" }
        restocking: { $ref: "#/components/schemas/Money" }
        net: { $ref: "#/components/schemas/Money" }
        tax: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [PENDING, POSTED] }
        journalPostingId: { type: string }
        glAttempts: { type: integer }
        glNextAttemptAt: { type: string, format: date-time }
        glParked: { type: boolean, description: True when the ledger or billing refused the credit and it waits for an operator's retry }
        reservationId: { type: string, format: uuid, description: The billing reservation held for the credit, when it holds one }
        needsAttention: { type: string, description: Why a POSTED credit needs an operator (its billing reservation was lost); the sweep does not retry it }
        reservationCommitted: { type: boolean, description: True once billing consumed the reservation; a POSTED credit without it is committed by a repeat or the sweep }
        createdAt: { type: string, format: date-time }
    RMACreditNote:
      type: object
      required: [openItemId, documentNumber, journalPostingId, customerId, currency, gross, restocking, net, tax]
      properties:
        openItemId: { type: string, format: uuid }
        documentNumber: { type: string }
        journalPostingId: { type: string }
        customerId: { type: string, format: uuid }
        currency: { type: string }
        gross: { $ref: "#/components/schemas/Money" }
        restocking: { $ref: "#/components/schemas/Money" }
        net: { $ref: "#/components/schemas/Money" }
        tax: { $ref: "#/components/schemas/Money" }
