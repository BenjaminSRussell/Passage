openapi: 3.1.0
info:
  title: Passage Receivables API
  version: 1.0.0
  description: |
    Wave 30 receivables context: open items, aging, manual, BAI2 lockbox and camt.053 cash
    application, the collections worklist with risk scores, dunning runs, interest
    notes, promises, disputes, cases, balance confirmations, down payments and the
    deductions workbench. Errors are RFC 9457 problem details with a stable `code`
    (see README). Every operation names its duty in `x-passage-duty`.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
security:
  - bearerAuth: []
paths:
  /v1/receivables/open-items:
    get:
      operationId: listOpenItems
      summary: Open items (FBL5N style)
      x-passage-duty: receivables.view
      parameters:
        - { name: customer, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [open, all], default: open } }
        - { name: importSource, in: query, description: Only items loaded by this opening-item import source, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        "200":
          description: Open items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OpenItem" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/receivables/open-items/{ref}:
    get:
      operationId: getOpenItem
      summary: One open item
      description: |
        Reads one open item in the caller's legal entities, with its version as the ETag. The migration loader reads
        the items it loaded through this route to reconcile a run (service duty `receivables.import.read`, which
        opens nothing else). An unknown id, or one outside the caller's legal entities, is 404 AR-OPEN-ITEM-NOT-FOUND.
      x-passage-duty: receivables.view
      x-passage-duty-alternatives: [receivables.import.read]
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The open item
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenItem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/receivables/aging:
    get:
      operationId: agingSnapshot
      summary: Aging snapshot by currency and bucket
      x-passage-duty: receivables.view
      parameters:
        - { name: asOf, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Aging totals
          content:
            application/json:
              schema:
                type: object
                required: [asOf, totals]
                properties:
                  asOf: { type: string, format: date }
                  totals:
                    type: array
                    items: { $ref: "#/components/schemas/AgingTotal" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/receivables/payments:
    get:
      operationId: listPayments
      summary: Payments, newest received first
      x-passage-duty: receivables.view
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [RECEIVED, SUGGESTED, APPLIED, ON_ACCOUNT, REVERSED] } }
        - { name: customer, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPayment
      summary: Record a manual payment (CHECK, ACH, WIRE, CARD, CASH)
      x-passage-duty: receivables.payment.post
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
      responses:
        "201":
          description: Payment received
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/receivables/payments/{id}:
    get:
      operationId: getPayment
      summary: Read a payment
      x-passage-duty: receivables.view
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
      responses:
        "200":
          description: Payment
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/receivables/payments/{id}:match:
    post:
      operationId: matchPayment
      summary: Score candidate settlements for a payment (BR-30.1); changes no state
      x-passage-duty: receivables.payment.post
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
      responses:
        "200":
          description: Decision and ranked candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/receivables/payments/{id}:apply:
    post:
      operationId: applyPayment
      summary: Apply a payment to open items; requires If-Match
      description: |
        Settlements plus `onAccount` must equal the unapplied amount (AR-0001).
        Items must be in the payment's legal entity and currency and belong to
        the payment's customer; an unidentified payment takes the customer of
        its items. A cash discount needs the value date on or before the
        discount date and may not exceed the item's discount; write-offs above
        tolerance are 422 AR-0006; a locked item is 409 AR-0002. A repeated
        Idempotency-Key with the same body replays the first response.
      x-passage-duty: receivables.payment.post
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/OptionalIdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyRequest" }
      responses:
        "200":
          description: Payment applied
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/receivables/open-items:batch:
    post:
      operationId: importOpeningItems
      summary: Load a cutover snapshot of open items from a legacy system (migration loader)
      description: |
        Called by the ERP migration loader at cutover (integration handoff H5). One batch carries up to 1000
        open items of one legal entity from one legacy system (`importSource`). Each row is keyed by
        (`importSource`, `legacyKey`), so the call is re-runnable: a new key creates the item, a known key
        whose item is untouched in Passage updates it to the snapshot (open amount, dates, document number;
        an identical row stores nothing and is reported UNCHANGED), and a known key whose item was settled,
        partly settled, cleared or deducted in Passage (ever, even if later reversed) is refused with
        AR-OPENING-SETTLED, because the snapshot no longer describes it; one with an active dispute or a
        promise to pay that still holds is refused with AR-OPENING-IN-COLLECTION. A known key cannot move to
        another legal entity, customer, currency, kind or side (AR-OPENING-IDENTITY, also when the key was
        loaded into a legal entity outside the caller's scope). The legacy open amount may be below the
        original amount (a partial payment made in the legacy system).

        Amounts are magnitudes; `side` gives the sign. INVOICE is a DEBIT; CREDIT_NOTE and PAYMENT (an
        unapplied payment) are CREDIT; ADJUSTMENT may be either. Credit-side items are stored with negative
        amounts, so balances, aging, statements, the worklist and the balance snapshot net them against
        debits; they are not matched, dunned, or settled against debits yet.

        Results are per row, in request order. With `atomic=false` (default) a refused row never blocks the
        others and the call answers 200 (201 when every row was created); with `atomic=true` one refused row
        refuses the batch: 422, nothing stored, every row reported. One `openitem.imported.v1` is written
        to the outbox in the same transaction when anything was created or updated. The caller must hold the
        service duty `receivables.import.write` and the legal entity must be inside its scope.
      x-passage-duty: receivables.import.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpeningImportRequest" }
      responses:
        "200":
          description: Batch processed; refused rows are listed with their code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpeningImportResult" }
        "201":
          description: Every row was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpeningImportResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422":
          description: Atomic batch refused; nothing was stored and every row is reported (`committed` false)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpeningImportResult" }
  /v1/receivables/open-item-imports:
    get:
      operationId: listOpeningImports
      summary: What each import source loaded, per legal entity and currency
      description: Totals of the imported items still in Passage, for the reconciliation against the legacy ledger at cutover.
      x-passage-duty: receivables.view
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Import totals, most recently loaded first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/OpeningImportSummary" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/lockbox/imports:
    get:
      operationId: listLockboxImports
      summary: Imported lockbox files, newest first
      x-passage-duty: receivables.view
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Lockbox batches (without their payments)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LockboxBatch" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: importLockbox
      summary: Import a BAI2 lockbox file; one unidentified CHECK payment per check credit (FR-30.3)
      description: |
        Duplicate files are refused by SHA-256 of the content (AR-0003). A malformed
        record is refused with AR-0004 and the line number in `detail`.
      x-passage-duty: receivables.payment-file.import
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LockboxImportRequest" }
      responses:
        "201":
          description: File imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LockboxBatch" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/receivables/worklist:
    get:
      operationId: collectionsWorklist
      summary: Customers ranked by risk score as of a date (FR-30.6, FR-30.10)
      x-passage-duty: receivables.view
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Ranked worklist rows, riskiest first
          content:
            application/json:
              schema:
                type: object
                required: [asOf, items]
                properties:
                  asOf: { type: string, format: date }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CustomerRisk" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/statements:
    get:
      operationId: getStatement
      summary: Customer account statement as of a date, by currency, with running balance and aging footer (FR-30.13)
      description: |
        Lists the customer's documents still open at the end of asOf (default today) in one legal entity, on the
        balance confirmation's as-of basis: a debit item is its amount less the settlements, down-payment clearings
        and deductions booked by then; a deduction still being worked that day is its own DEDUCTION line without a due
        date (aged apart from invoices); an unapplied payment is a negative PAYMENT line. Read-only (BR-30.10).
      x-passage-duty: receivables.view
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: customer, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: Statement sections, one per currency
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Statement" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/aging-snapshots:
    post:
      operationId: runAgingSnapshot
      summary: Store dated customer balances and emit customerbalance.changed.v1 for moved balances (§5.30.16)
      description: |
        The nightly aging snapshot and risk score job (01:30), callable for one legal entity. Writes one row per
        customer and currency for the key date (key = (customer, date); a re-run rewrites the rows). Emits
        dev.passage.receivables.customerbalance.changed.v1 when a balance, overdue amount, dunning level or risk score
        differs from the latest snapshot on or before the date, and a zero row with one event for a customer whose
        items all settled. Balances are those at the time of the run, so asOf may not be in the future.
      x-passage-duty: receivables.aging.run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgingSnapshotRequest" }
      responses:
        "200":
          description: Snapshot run summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgingSnapshotResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listAgingSnapshots
      summary: Stored customer balances for a key date (the latest when omitted), riskiest first
      x-passage-duty: receivables.view
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - { name: customer, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Snapshot rows
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BalanceSnapshot" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/dunning-runs:
    get:
      operationId: listDunningRuns
      summary: Dunning runs, latest run date first, with the count of letters not skipped
      x-passage-duty: receivables.view
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, REVIEWED, ISSUED, CANCELLED] } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Run summaries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DunningRunSummary" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createDunningRun
      summary: Propose a dunning run (DRAFT); letters are previewed, not issued
      x-passage-duty: receivables.dunning.run
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDunningRunRequest" }
      responses:
        "201":
          description: Run proposed
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DunningRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/receivables/dunning-runs/{id}:
    get:
      operationId: getDunningRun
      summary: Read a dunning run with its letters and exclusions
      x-passage-duty: receivables.view
      parameters:
        - { $ref: "#/components/parameters/RunId" }
      responses:
        "200":
          description: Dunning run
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DunningRun" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/receivables/dunning-runs/{id}:review:
    post:
      operationId: reviewDunningRun
      summary: Mark a DRAFT run REVIEWED; requires If-Match
      x-passage-duty: receivables.dunning.run
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Run reviewed
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DunningRun" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/receivables/dunning-runs/{id}:issue:
    post:
      operationId: issueDunningRun
      summary: Issue a REVIEWED run; only issue posts fees and raises levels (AR-0007 unless reviewed)
      x-passage-duty: receivables.dunning.run
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Run issued
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DunningRun" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/receivables/dunning-runs/{id}:cancel:
    post:
      operationId: cancelDunningRun
      summary: Cancel a run that has not been issued; requires If-Match
      x-passage-duty: receivables.dunning.run
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Run cancelled
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DunningRun" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/receivables/interest-notes:
    get:
      operationId: listInterestNotes
      summary: Posted interest notes, latest calculation first
      x-passage-duty: receivables.view
      parameters:
        - { name: customer, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Interest notes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InterestNote" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/interest-notes:calculate:
    post:
      operationId: calculateInterest
      summary: Preview interest on overdue items (BR-30.5); writes nothing
      x-passage-duty: receivables.interest.post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterestRequest" }
      responses:
        "200":
          description: Candidates and exclusions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterestResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/interest-notes:post:
    post:
      operationId: postInterest
      summary: Post interest notes as INTEREST open items; once per item and month, charging only days after the last note
      description: |
        A retry with the same Idempotency-Key replays the stored response; the same
        key with another body is 422 idempotency_key_reuse.
      x-passage-duty: receivables.interest.post
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterestRequest" }
      responses:
        "200":
          description: Candidates, exclusions and notes written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterestResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/receivables/promises:
    get:
      operationId: listPromises
      summary: Promises to pay, latest promise date first
      x-passage-duty: receivables.view
      parameters:
        - { name: customer, in: query, schema: { type: string, format: uuid } }
        - { name: openItem, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Promises
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Promise" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPromise
      summary: Record a promise to pay on an open item; excludes it from dunning and interest while open
