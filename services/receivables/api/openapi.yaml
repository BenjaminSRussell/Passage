        Clear a received down payment against its final invoice, or offset a deposit against an invoice, fee or
        interest item (BR-30.14). The amount defaults to min(remaining, item open); more is 422 AR-0017.
        Publishes downpayment.cleared.v1 with Dr 2190 or 2195 / Cr 1200. Requires If-Match.
      x-passage-duty: receivables.payment.settle
      parameters:
