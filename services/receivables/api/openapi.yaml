        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/receivables/bank-statements/imports:
    get:
      operationId: listBankStatementImports
      summary: Imported camt.053 statement files, newest first
      x-passage-duty: receivables.view
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Statement imports (without their payments)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/BankStatementBatch" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: importBankStatement
      summary: Import a camt.053 statement; one unidentified CAMT053 payment per booked customer credit (FR-30.5)
      description: |
        Only booked (`Sts` BOOK or absent), non-reversal CRDT entries become payments; debits,
        pending entries and reversals are counted in `skippedCount`. A payment is keyed by
        (statement Id, NtryRef or AcctSvcrRef), so an entry already imported from an
        overlapping statement is counted in `duplicateCount` and not created again
        (BR-30.7). A file whose SHA-256 is already stored is refused (409 AR-0003); a
        malformed entry is refused with 400 AR-0004 and its line in `detail`. Each
        payment publishes payment.received.v1; the clerk matches it with `:match`.
      x-passage-duty: receivables.payment-file.import
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankStatementImportRequest" }
      responses:
        "201":
          description: File imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankStatementBatch" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/receivables/deductions:
    get:
      operationId: listDeductions
      summary: Deductions, open and matched first, oldest first within them (FR-30.17)
      x-passage-duty: receivables.view
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DeductionStatus" } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/DeductionType" } }
        - { name: customer, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Deductions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Deduction" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createDeduction
      summary: Move the unexplained part of a short payment off its open item into the workbench
      description: |
        The open item is locked NOWAIT (409 AR-0002 when another clerk holds it); it must be
        OPEN or PARTIALLY_SETTLED, undisputed (409 AR-DISPUTE-EXISTS) and hold at least the
        amount (422 AR-AMOUNT-RANGE). Its open amount drops by the deduction, which takes the
        item's customer and currency; the deduction is aged apart from invoices and never
        dunned. A payment, when given, must share the item's legal entity, currency and
        customer (400 AR-DEDUCTION-MISMATCH). Publishes deduction.opened.v1. A repeated
        Idempotency-Key returns the stored deduction; with another body it is 422.
      x-passage-duty: receivables.deduction.maintain
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeductionRequest" }
      responses:
        "201":
          description: Deduction recorded
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deduction" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/receivables/deductions/{id}:
    get:
      operationId: getDeduction
      summary: Read one deduction, with its children when it was split
      x-passage-duty: receivables.view
      parameters:
        - { $ref: "#/components/parameters/DeductionId" }
      responses:
        "200": { $ref: "#/components/responses/Deduction" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/receivables/deductions/{id}:match:
    post:
      operationId: matchDeduction
      summary: >-
        Match an OPEN deduction to a wave 26 claim (rebate accrual, promotion fund or chargeback). The whole
        deduction must fit the claim's remaining amount, else 422 AR-0014 (split it first). Requires If-Match.
      x-passage-duty: receivables.deduction.maintain
      parameters:
        - { $ref: "#/components/parameters/DeductionId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [claimType, claimRef, claimRemaining]
              properties:
                claimType: { $ref: "#/components/schemas/ClaimType" }
                claimRef: { type: string, minLength: 1, maxLength: 200 }
                claimRemaining: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "The claim's remaining amount, as the clerk reads it in pricing until the claims API exists." }
      responses:
        "200": { $ref: "#/components/responses/Deduction" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/receivables/deductions/{id}:approve:
    post:
      operationId: approveDeduction
      summary: >-
        Approve a MATCHED deduction; billing issues the credit note against the claim, which consumes the fund or
        accrual (deduction.resolved.v1, APPROVED). Requires If-Match.
      x-passage-duty: receivables.deduction.maintain
      parameters:
        - { $ref: "#/components/parameters/DeductionId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeductionNote" }
      responses:
        "200": { $ref: "#/components/responses/Deduction" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/receivables/deductions/{id}:deny:
    post:
      operationId: denyDeduction
      summary: >-
        Deny an OPEN or MATCHED deduction with a denial reason; its amount is re-billed to the customer as a
        DEDUCTION debit open item due today (rebillItemId). Requires If-Match.
      x-passage-duty: receivables.deduction.maintain
      parameters:
        - { $ref: "#/components/parameters/DeductionId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, enum: [NOT_AUTHORIZED, EXPIRED, DUPLICATE] }
                note: { type: [string, "null"], maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/Deduction" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/receivables/deductions/{id}:split:
    post:
      operationId: splitDeduction
      summary: >-
        Split an OPEN deduction into 2 to 20 OPEN children whose amounts sum to it (else 422 AR-DEDUCTION-SPLIT).
        The parent becomes SPLIT and is returned with its children. Requires If-Match.
      x-passage-duty: receivables.deduction.maintain
      parameters:
        - { $ref: "#/components/parameters/DeductionId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [parts]
              properties:
                parts: { type: array, minItems: 2, maxItems: 20, items: { $ref: "#/components/schemas/Money" } }
      responses:
        "200": { $ref: "#/components/responses/Deduction" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/receivables/deductions/{id}:write-off:
    post:
      operationId: writeOffDeduction
      summary: >-
        Write off an OPEN or MATCHED deduction to 6110 (Dr 6110 / Cr 1200 on deduction.resolved.v1). Above
        deduction_write_off_limit (50.00 USD, 45.00 EUR, zero in other currencies) the caller also needs
        receivables.write-off.approve, else 403 AR-0006. Requires If-Match.
      x-passage-duty: receivables.deduction.maintain
      parameters:
        - { $ref: "#/components/parameters/DeductionId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeductionNote" }
      responses:
        "200": { $ref: "#/components/responses/Deduction" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/receivables/rma-credits:
    post:
      operationId: postRMACredit
      summary: Post an RMA credit note (AC-30.5)
      description: |
        Sales calls this, with a service token, after a return order is dispositioned. The customer
        and currency come from the original invoice's open item and the ledger from the legal
        entity's configured ledger (`RECEIVABLES_RMA_LEDGERS`); none is taken from the body. The
        return value (gross) is refused (422 AR-RMA-INVOICE) above the invoice amount less the gross
        of earlier RMA credits on it; the open amount does not bound it, so a paid or settled invoice
        is still returnable and its credit leaves the customer a credit balance. The credit is
        recorded PENDING, then Dr 4000 gross / Cr 4200 restocking / Cr 1200 net is posted under the
        journal key `rma-credit:{legalEntityId}:{document}`, and the CREDIT_NOTE open item (negative
        net, `CN-{rmaNumber}`) is created in the transaction that marks the credit POSTED. A ledger
        outage backs off (503 AR-RMA-GL) and the sweeper or a repeat posts it later; a ledger refusal
        parks the credit (409 AR-RMA-PARKED) until an operator retries it. A repeat of the same RMA
        returns the stored values; a repeat with other amounts is 422 idempotency_key_reuse.

        When billing is configured (`BILLING_URL`) the credit first reserves `invoiceLines` in billing
        (duty `billing.credit-reservation.write`, `Idempotency-Key` `rma-credit:{legalEntityId}:{rmaId}`),
        before anything is stored. Billing refusing the room is 422 AR-RMA-INVOICE and nothing is
        stored; billing unavailable is 503 AR-RMA-GL and nothing is stored or posted, so the repeat is safe.
        Once the credit is POSTED the reservation is committed; if that call fails the credit stays
        POSTED (the response is still 201) and a repeat or the sweep commits it later. A credit
        that is parked or refused after reserving releases the reservation; `:retry` reserves again with the same
        key and is refused 422 AR-RMA-INVOICE when the room is gone.
        Any other billing rejection (400, 422 such as idempotency_key_reuse) is 422 AR-RMA-INVOICE with
        a plain message; the reservation must cover the return value. A POSTED credit whose reservation
        billing cannot restore is flagged needsAttention for an operator.
      x-passage-duty: ar.rmacredit.post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RMACreditRequest" }
      responses:
        "201":
          description: Credit note posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RMACreditNote" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listRMACredits
      summary: List RMA credits, newest first (PENDING and parked ones for the operator)
      x-passage-duty: receivables.view
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, POSTED] } }
        - { name: parked, in: query, description: true lists only credits the ledger refused, schema: { type: boolean } }
        - { name: needsAttention, in: query, description: true lists only POSTED credits whose billing reservation was lost, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: RMA credits
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RMACreditView" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/rma-credits:sweep:
    post:
      operationId: sweepRMACredits
      summary: Post the caller's due PENDING RMA credits
      description: |
        The scheduler's entry point; the in-process sweeper (`RECEIVABLES_RMA_SWEEP_TENANT_IDS`,
        every `RECEIVABLES_RMA_SWEEP_INTERVAL`, default 5m) runs the same pass per tenant and legal
        entity. Posts, oldest first and at most 200 (or `limit`), the unparked PENDING credits whose
        backoff ran out and that are older than 2 minutes. A failure is recorded on the credit
        (backoff, or park on a ledger refusal) and the pass goes on.
      x-passage-duty: receivables.payment.post
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Sweep result
          content:
            application/json:
              schema:
                type: object
                required: [posted, failed, parked]
                properties:
                  posted: { type: integer }
                  failed: { type: integer }
                  parked: { type: integer }
                  committed: { type: integer, description: Posted credits whose billing reservation the sweep committed }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/gl-journals:
    get:
      operationId: listGLJournals
      summary: List the journals receivables owes or has posted to the ledger
      description: |
        Cash receipts (Dr 1000 / Cr 1205), payment applications (Dr 1205, Dr 4100 discount, Dr 6100 write-off /
        Cr 1200), dunning fees (Cr 4300), interest (Cr 4310), down payment and deposit moves and deduction
        write-offs. A journal is stored in the transaction of the change that causes it and posted by a worker.
      x-passage-duty: receivables.view
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, POSTED] } }
        - { name: sourceType, in: query, schema: { type: string } }
        - { name: parked, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Journals
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/GLJournalView" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/gl-journals:sweep:
    post:
      operationId: sweepGLJournals
      summary: Post the caller's due journals to the ledger
      description: |
        The scheduler's entry point; the in-process sweeper (`RECEIVABLES_RMA_SWEEP_TENANT_IDS`) runs the
        same pass per tenant and legal entity. Posts, oldest first and at most 200 (or `limit`), the unparked
        journals whose backoff ran out, under the key `gl-journal:{legalEntityId}:{journalId}`. A failure is
        recorded on the journal (backoff, or park on a ledger refusal) and the pass goes on. The ledger is the
        one pinned per legal entity in `RECEIVABLES_GL_LEDGERS`, else `RECEIVABLES_RMA_LEDGERS`.
      x-passage-duty: receivables.payment.post
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Sweep result
          content:
            application/json:
              schema:
                type: object
                required: [posted, failed, parked]
                properties:
                  posted: { type: integer }
                  failed: { type: integer }
                  parked: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/gl-journals/{id}:retry:
    post:
      operationId: retryGLJournal
      summary: Unpark, optionally re-date, and post a journal now
      description: |
        For a journal that is not POSTED: clears the park and the backoff, optionally re-dates it (a ledger
        refusal such as a closed period) and posts it now. A POSTED journal is 409 AR-JOURNAL-STATE.
      x-passage-duty: receivables.payment.post
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                postingDate: { type: string, format: date }
      responses:
        "200":
          description: Journal after the attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GLJournalView" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/receivables/gl-reconciliation:
    get:
      operationId: getGLReconciliation
      summary: Compare the open items and unapplied payments with GL 1200 and 1205
      description: |
        Reads the ledger's balances of 1200 and 1205 up to `asOf` and compares them with the open amounts of
        the legal entity's open items and the unapplied amounts of its payments in one currency.
        `reconciled` needs both differences at zero and no journal pending or parked. Items loaded by the
        opening-item import have no journal here, so they show in the difference until the ledger's opening
        balance is loaded.
      x-passage-duty: receivables.view
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: currency, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 3 } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Reconciliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GLReconciliation" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/receivables/rma-credits/{id}:retry:
    post:
      operationId: retryRMACredit
      summary: Unpark, optionally re-date, and post an RMA credit now
      description: |
        For a credit that is not POSTED: clears the park and the backoff and posts the journal now.
        `postingDate` re-dates a parked credit (one the ledger refused, for example for a closed
        period); re-dating a credit that is only waiting for the ledger is 409 AR-RMA-STATE. The
        ledger key stays the same, so an entry the ledger already holds under it answers an
        idempotency conflict and parks the credit again rather than posting twice. A POSTED credit
        is 409 AR-RMA-STATE.
      x-passage-duty: receivables.payment.post
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                postingDate: { type: string, format: date }
      responses:
        "200":
          description: Credit posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RMACreditView" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/receivables/rma-credits/{id}:cancel:
    post:
      operationId: cancelRMACredit
      summary: Cancel a PENDING RMA credit and release its invoice room
      description: |
        Drops a credit that was never posted, releases the room billing holds for it (reservations do
        not expire on their own) and frees its RMA to be credited again, for example with corrected
        amounts. Only a parked credit (the ledger refused it) or one never tried can be cancelled; a
        credit whose last ledger answer was lost may be booked, so it is 409 AR-RMA-STATE and is
        retried instead. A POSTED credit is 409 AR-RMA-STATE: reverse it with a billing credit note.
        The answer shows the credit with status CANCELLED.
      x-passage-duty: receivables.payment.post
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Credit cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RMACreditView" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/receivables/rma-credits/{id}:backfill-reservation:
    post:
      operationId: backfillRMAReservation
      summary: Give an RMA credit posted before billing reservations a reservation
      description: |
        For a POSTED credit that holds no reservation: reserves the named invoice lines in billing
        under the credit's key and commits the reservation at once, so billing counts the credit
        against the invoice's limit. The lines are the invoice lines the credit returned (sales works
        them out for a credit it stored earlier). 409 AR-RMA-STATE when the credit is not POSTED or
        already holds a reservation; 422 when billing has no room or holds less than the credit.
      x-passage-duty: receivables.payment.post
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invoiceId, invoiceLines]
              properties:
                invoiceId: { type: string, format: uuid }
                invoiceLines:
                  type: array
                  items:
                    type: object
                    required: [lineNo, qty]
                    properties:
                      lineNo: { type: integer, minimum: 1 }
                      qty: { type: string }
      responses:
        "200":
          description: Reservation taken and committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RMACreditView" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Resource version from the last read (ETag). Missing header returns 428.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 500 }
    PaymentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: id
      in: path
      required: true
      description: Dunning run id.
      schema: { type: string, format: uuid }
    DisputeId:
      name: id
      in: path
      required: true
      description: Dispute id.
      schema: { type: string, format: uuid }
    CaseId:
      name: id
      in: path
      required: true
      description: Collection case id.
      schema: { type: string, format: uuid }
    ConfirmationRunId:
      name: id
      in: path
      required: true
      description: Balance confirmation run id.
      schema: { type: string, format: uuid }
    DownPaymentId:
      name: id
      in: path
      required: true
      description: Down payment or security deposit id.
      schema: { type: string, format: uuid }
    DeductionId:
      name: id
      in: path
      required: true
      description: Deduction id.
      schema: { type: string, format: uuid }
  headers:
    ETag:
      description: Resource version, quoted.
      schema: { type: string }
  responses:
    Deduction:
      description: The deduction after the command
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Deduction" }
    DownPayment:
      description: The down payment after the command, with its clearings
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DownPayment" }
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    CreateCaseRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, customerId, category, owner, reason]
      properties:
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        category: { type: string, enum: [COLLECTION, DISPUTE, DEDUCTION] }
        owner: { type: string, minLength: 1, maxLength: 120 }
        priority: { type: string, enum: [LOW, NORMAL, HIGH], default: NORMAL }
        reason: { type: string, minLength: 1, maxLength: 500 }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: Required unless openItemId is given; the case then takes the item's currency. }
        openItemId: { type: [string, "null"], format: uuid, description: An open item of the same customer and legal entity. }
        attachedAmount: { $ref: "#/components/schemas/Money" }
    CollectionCase:
      type: object
      required: [id, legalEntityId, customerId, category, owner, priority, status, reason, currency, slaHours, slaDue, slaBreached, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        category: { type: string, enum: [COLLECTION, DISPUTE, DEDUCTION] }
        owner: { type: string }
        priority: { type: string, enum: [LOW, NORMAL, HIGH] }
        status: { type: string, enum: [OPEN, CLOSED] }
        reason: { type: string, description: "BALANCE_DIFFERENCE for a case a balance confirmation disagreement opened." }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        openItemId: { type: string, format: uuid }
        documentNumber: { type: string }
        attachedAmount: { $ref: "#/components/schemas/Money" }
        slaHours: { type: integer }
        slaDue: { type: string, format: date-time }
        slaBreached: { type: boolean, description: "Computed at read time: OPEN and past slaDue (AR-0018)." }
        closeNote: { type: string }
        closedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        version: { type: integer }
    CreateConfirmationRunRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, asOfDate]
      properties:
        legalEntityId: { type: string, format: uuid }
        asOfDate: { type: string, format: date }
        threshold: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "Defaults to 10000.00 (confirmation_threshold)." }
        sampleSize: { type: [integer, "null"], minimum: 1, maximum: 500 }
        includeZeroBalances: { type: boolean, default: false }
        reminderDays: { type: integer, minimum: 1, maximum: 60, default: 14 }
    ConfirmationRun:
      type: object
      required: [id, legalEntityId, asOfDate, threshold, includeZeroBalances, reminderDays, createdAt, counts]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        asOfDate: { type: string, format: date }
        threshold: { $ref: "#/components/schemas/Money" }
        sampleSize: { type: integer }
        includeZeroBalances: { type: boolean }
        reminderDays: { type: integer }
        createdAt: { type: string, format: date-time }
        counts:
          type: object
          required: [selected, agreed, disagreed, noReply]
          properties:
            selected: { type: integer }
            agreed: { type: integer }
            disagreed: { type: integer }
            noReply: { type: integer }
        confirmations:
          type: array
          description: Present on a single read and on create; left out of the list.
          items: { $ref: "#/components/schemas/Confirmation" }
    Confirmation:
      type: object
      required: [id, runId, legalEntityId, customerId, currency, ourBalance, status]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        ourBalance: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [NO_REPLY, AGREED, DISAGREED] }
        customerBalance: { $ref: "#/components/schemas/Money" }
        difference: { allOf: [{ $ref: "#/components/schemas/Money" }], description: customerBalance minus ourBalance. }
        comment: { type: string }
        repliedAt: { type: string, format: date-time }
        caseId: { type: string, format: uuid, description: The DISPUTE case a disagreement opened. }
    ConfirmationReplyRequest:
      type: object
      additionalProperties: false
      required: [confirmationId, reply]
      properties:
        confirmationId: { type: string, format: uuid }
        reply: { type: string, enum: [AGREED, DISAGREED] }
        customerBalance: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "Required for DISAGREED; for AGREED it may only repeat our balance." }
        comment: { type: [string, "null"], maxLength: 500 }
    CreateDownPaymentRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, customerId, kind, currency, amount]
      properties:
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        salesOrderId: { type: [string, "null"], format: uuid }
        kind: { type: string, enum: [DOWN_PAYMENT, SECURITY_DEPOSIT] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        amount: { $ref: "#/components/schemas/Money" }
    DownPayment:
      type: object
      required: [id, legalEntityId, customerId, kind, currency, amount, clearedAmount, remaining, status, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        salesOrderId: { type: string, format: uuid }
        kind: { type: string, enum: [DOWN_PAYMENT, SECURITY_DEPOSIT] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        amount: { $ref: "#/components/schemas/Money" }
        clearedAmount: { $ref: "#/components/schemas/Money" }
        remaining: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "Left to clear or release; the amount asked for on a request; zero once cleared, released or cancelled." }
        status: { type: string, enum: [REQUESTED, RECEIVED, CLEARED, RELEASED, CANCELLED] }
        receivedDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        version: { type: integer }
        clearings:
          type: array
          description: Present on a single read and after a command.
          items:
            type: object
            required: [id, openItemId, documentNumber, amount, clearedAt]
            properties:
              id: { type: string, format: uuid }
              openItemId: { type: string, format: uuid }
              documentNumber: { type: string }
              amount: { $ref: "#/components/schemas/Money" }
              clearedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    Money:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]{1,6})?$"
      description: Decimal string, never a float.
    RemittanceLine:
      type: object
      required: [reference, amount]
      properties:
        reference: { type: string, maxLength: 200 }
        amount: { $ref: "#/components/schemas/Money" }
    StatementLine:
      type: object
      required: [sourceType, documentNumber, documentDate, dueDate, amount, openAmount, runningBalance]
      properties:
        sourceType: { type: string, description: "the open item's source (INVOICE, FEE, INTEREST, DEDUCTION re-bill ...), DEDUCTION for a deduction being worked, PAYMENT for unapplied cash" }
        documentNumber: { type: string }
        documentDate: { type: string, format: date }
        dueDate: { type: [string, "null"], format: date, description: null for deductions and payments }
        amount: { $ref: "#/components/schemas/Money" }
        openAmount: { $ref: "#/components/schemas/Money" }
        runningBalance: { $ref: "#/components/schemas/Money" }
    StatementSection:
      type: object
      required: [currency, lines, closingBalance, aging]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/StatementLine" }
        closingBalance: { $ref: "#/components/schemas/Money" }
        aging:
          type: array
          description: Open debit items by aging bucket; deductions and payments are not aged here.
          items: { $ref: "#/components/schemas/AgingTotal" }
    Statement:
      type: object
      required: [legalEntityId, customerId, asOf, sections]
      properties:
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        asOf: { type: string, format: date }
        sections:
          type: array
          items: { $ref: "#/components/schemas/StatementSection" }
    AgingSnapshotRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId]
      properties:
        legalEntityId: { type: string, format: uuid }
        asOf: { type: string, format: date, description: key date, today by default; not after today }
    AgingSnapshotResult:
      type: object
      required: [legalEntityId, asOf, rows, changed]
      properties:
        legalEntityId: { type: string, format: uuid }
        asOf: { type: string, format: date }
        rows: { type: integer, description: balances written for the date }
        changed: { type: integer, description: customerbalance.changed.v1 events enqueued }
    BalanceSnapshot:
      type: object
      required: [legalEntityId, customerId, currency, asOf, totalOpen, overdue, oldestItemDays, dunningLevel, riskScore, takenAt]
      properties:
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        asOf: { type: string, format: date }
        totalOpen: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "Open debits less open credits (credit notes, unapplied payments); negative when the customer is net in credit." }
        overdue: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "The overdue debits the credits leave open (credits clear the oldest debits first); never negative." }
        oldestItemDays: { type: integer, minimum: 0 }
        dunningLevel: { type: integer, minimum: 0, maximum: 4 }
        riskScore: { type: integer, minimum: 0, maximum: 100 }
        takenAt: { type: string, format: date-time }
    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, paymentMode, source, amount, currency, receivedDate, valueDate]
      properties:
        legalEntityId: { type: string, format: uuid }
        customerId: { type: [string, "null"], format: uuid }
        paymentMode: { type: string, enum: [CHECK, ACH, WIRE, CARD, CASH] }
        source: { type: string, enum: [MANUAL] }
        sourceRef: { type: [string, "null"], maxLength: 120 }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        receivedDate: { type: string, format: date }
        valueDate: { type: string, format: date }
        payerName: { type: [string, "null"], minLength: 1, maxLength: 140, description: matched against learned payer names (R5) }
        payerAccount:
          type: [string, "null"]
          maxLength: 64
          description: >-
            The payer's IBAN or MICR routing and account as on the advice, 8 or more letters and digits (R4). Only its
            SHA-256 hash is stored; the account is never echoed.
        shortPayReason: { type: [string, "null"], minLength: 1, maxLength: 120, description: explains a short payment (R7) }
        remittance:
          type: array
          items: { $ref: "#/components/schemas/RemittanceLine" }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerId: { type: [string, "null"], format: uuid }
        paymentMode: { type: string }
        source: { type: string }
        sourceRef: { type: [string, "null"] }
        amount: { $ref: "#/components/schemas/Money" }
        unappliedAmount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        receivedDate: { type: string, format: date }
        valueDate: { type: string, format: date }
        payerName: { type: [string, "null"] }
        payerAccountHash: { type: string, pattern: "^[0-9a-f]{64}$", description: "SHA-256 of the payer's normalized account (R4); absent when none was given" }
        shortPayReason: { type: string, description: absent when none was given (R7) }
        remittance:
          type: array
          items: { $ref: "#/components/schemas/RemittanceLine" }
        status: { type: string, enum: [RECEIVED, SUGGESTED, APPLIED, ON_ACCOUNT, REVERSED] }
        version: { type: integer }
    OpenItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        sourceType: { type: string }
        documentNumber: { type: string }
        documentDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        currency: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        openAmount: { $ref: "#/components/schemas/Money" }
        cashDiscountDate: { type: [string, "null"], format: date }
        cashDiscountAmount: { $ref: "#/components/schemas/Money" }
        dunningLevel: { type: integer }
        dunningBlock: { type: boolean }
        status: { type: string }
        version: { type: integer }
        side: { type: string, enum: [DEBIT, CREDIT], description: "CREDIT items (credit notes, unapplied payments) carry negative amounts" }
        importSource: { type: string, description: the legacy system that loaded the item }
        legacyKey: { type: string, description: the item's key in the legacy system }
    OpeningImportRequest:
      type: object
      required: [legalEntityId, importSource, items]
      properties:
        legalEntityId: { type: string, format: uuid }
        importSource: { type: string, maxLength: 40, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$", description: "legacy system label, e.g. SAP-PRD" }
        atomic: { type: boolean, default: false, description: "true stores nothing unless every row is accepted" }
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/OpeningItem" }
    OpeningItem:
      type: object
      required: [legacyKey, documentNumber, customerId, kind, side, documentDate, dueDate, currency, originalAmount, openAmount]
      properties:
        legacyKey: { type: string, maxLength: 120, description: "the row's key in the legacy system; unique per importSource" }
        documentNumber: { type: string, maxLength: 60, description: "legacy document number; unique per legal entity" }
        customerId: { type: string, format: uuid, description: the Passage customer the loader resolved }
        kind: { type: string, enum: [INVOICE, CREDIT_NOTE, PAYMENT, ADJUSTMENT] }
        side: { type: string, enum: [DEBIT, CREDIT] }
        documentDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        originalAmount: { $ref: "#/components/schemas/Money" }
        openAmount: { $ref: "#/components/schemas/Money" }
        cashDiscountDate: { type: [string, "null"], format: date }
        cashDiscountAmount: { $ref: "#/components/schemas/Money" }
    OpeningImportResult:
      type: object
      required: [batchId, legalEntityId, importSource, atomic, committed, created, updated, unchanged, rejected, results]
      properties:
        batchId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        importSource: { type: string }
        atomic: { type: boolean }
        committed: { type: boolean }
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        rejected: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [index, legacyKey, outcome]
            properties:
              index: { type: integer, description: position in the request }
              legacyKey: { type: string }
              outcome: { type: string, enum: [CREATED, UPDATED, UNCHANGED, REJECTED] }
              openItemId: { type: string, format: uuid }
              code:
                type: string
                description: |
                  AR-OPENING-INVALID (a field failed validation), AR-OPENING-DUPLICATE-KEY (repeated in the batch),
                  AR-OPENING-IDENTITY (legal entity, customer, currency, kind or side differ from the loaded item),
                  AR-OPENING-SETTLED (settled, paid, cleared, deducted or changed in Passage),
                  AR-OPENING-IN-COLLECTION (an active dispute or a holding promise to pay), AR-OPENING-DOCUMENT-EXISTS
                  (document number taken by another item in the legal entity) or AR-OPENING-REJECTED (atomic batch
                  refused elsewhere)
              detail: { type: string }
    OpeningImportSummary:
      type: object
      required: [importSource, legalEntityId, currency, itemCount, debitCount, creditCount, debitOpen, creditOpen, netOpen]
      properties:
        importSource: { type: string }
        legalEntityId: { type: string, format: uuid }
        currency: { type: string }
        itemCount: { type: integer }
        debitCount: { type: integer }
        creditCount: { type: integer }
        debitOpen: { $ref: "#/components/schemas/Money" }
        creditOpen: { $ref: "#/components/schemas/Money", description: "negative" }
        netOpen: { $ref: "#/components/schemas/Money" }
        lastImportedAt: { type: string, format: date-time }
    AgingTotal:
      type: object
      properties:
        currency: { type: string }
        bucket: { type: string, enum: ["CURRENT", "1-30", "31-60", "61-90", "91-180", "OVER-180"] }
        amount: { $ref: "#/components/schemas/Money" }
    MatchResult:
      type: object
      required: [decision, candidates]
      properties:
        decision: { type: string, enum: [AUTO_APPLY, SUGGESTED, ON_ACCOUNT] }
        candidates:
          type: array
          maxItems: 3
          items:
            type: object
            required: [openItemIds, score, rules]
            properties:
              openItemIds: { type: array, items: { type: string, format: uuid } }
              score: { type: integer }
              rules:
                type: array
                description: >-
                  R1 reference +60, R2 amount +30 (R2-SUBSET +25), R3 amount less cash discount +28, R4 payer account
                  bound to the customer +15, R5 payer name Jaro-Winkler >= 0.92 to a learned name +10, R6 value date
                  within 7 days of due +5, R7 short by < 1% or < 50.00 USD / 45.00 EUR with a reason +20 (BR-30.1).
                items: { type: string, enum: [R1, R2, R2-SUBSET, R3, R4, R5, R6, R7] }
    ApplyRequest:
      type: object
