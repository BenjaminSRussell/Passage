openapi: 3.1.0
info:
  title: Passage Receivables API
  version: 1.0.0
  description: |
    Wave 30 receivables context: open items, aging, manual and BAI2 lockbox cash
    application, the collections worklist with risk scores, dunning runs, interest
    notes, promises and disputes. Errors are RFC 9457 problem details with a stable `code`
    (see README). Every operation names its duty in `x-passage-duty`.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
security:
  - bearerAuth: []
paths:
  /api/v1/receivables/open-items:
    get:
      operationId: listOpenItems
      summary: Open items (FBL5N style)
      x-passage-duty: ARView
      parameters:
        - { name: customer, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [open, all], default: open } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        "200":
          description: Open items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OpenItem" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/aging:
    get:
      operationId: agingSnapshot
      summary: Aging snapshot by currency and bucket
      x-passage-duty: ARView
      parameters:
        - { name: asOf, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Aging totals
          content:
            application/json:
              schema:
                type: object
                required: [asOf, totals]
                properties:
                  asOf: { type: string, format: date }
                  totals:
                    type: array
                    items: { $ref: "#/components/schemas/AgingTotal" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/payments:
    get:
      operationId: listPayments
      summary: Payments, newest received first
      x-passage-duty: ARView
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [RECEIVED, SUGGESTED, APPLIED, ON_ACCOUNT, REVERSED] } }
        - { name: customer, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPayment
      summary: Record a manual payment (CHECK, ACH, WIRE, CARD, CASH)
      x-passage-duty: ARPaymentPost
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
      responses:
        "201":
          description: Payment received
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/payments/{id}:
    get:
      operationId: getPayment
      summary: Read a payment
      x-passage-duty: ARView
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
      responses:
        "200":
          description: Payment
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/payments/{id}:match:
    post:
      operationId: matchPayment
      summary: Score candidate settlements for a payment (BR-30.1); changes no state
      x-passage-duty: ARPaymentPost
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
      responses:
        "200":
          description: Decision and ranked candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/payments/{id}:apply:
    post:
      operationId: applyPayment
      summary: Apply a payment to open items; requires If-Match
      description: |
        Settlements plus `onAccount` must equal the unapplied amount (AR-0001).
        Items must be in the payment's legal entity and currency and belong to
        the payment's customer; an unidentified payment takes the customer of
        its items. A cash discount needs the value date on or before the
        discount date and may not exceed the item's discount; write-offs above
        tolerance are 422 AR-0006; a locked item is 409 AR-0002. A repeated
        Idempotency-Key with the same body replays the first response.
      x-passage-duty: ARPaymentPost
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/OptionalIdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyRequest" }
      responses:
        "200":
          description: Payment applied
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/lockbox/imports:
    get:
      operationId: listLockboxImports
      summary: Imported lockbox files, newest first
      x-passage-duty: ARView
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Lockbox batches (without their payments)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LockboxBatch" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: importLockbox
      summary: Import a BAI2 lockbox file; one unidentified CHECK payment per check credit (FR-30.3)
      description: |
        Duplicate files are refused by SHA-256 of the content (AR-0003). A malformed
        record is refused with AR-0004 and the line number in `detail`.
      x-passage-duty: ARImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LockboxImportRequest" }
      responses:
        "201":
          description: File imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LockboxBatch" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/worklist:
    get:
      operationId: collectionsWorklist
      summary: Customers ranked by risk score as of a date (FR-30.6, FR-30.10)
      x-passage-duty: ARView
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Ranked worklist rows, riskiest first
          content:
            application/json:
              schema:
                type: object
                required: [asOf, items]
                properties:
                  asOf: { type: string, format: date }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CustomerRisk" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/dunning-runs:
    get:
      operationId: listDunningRuns
      summary: Dunning runs, latest run date first, with the count of letters not skipped
      x-passage-duty: ARView
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, REVIEWED, ISSUED, CANCELLED] } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Run summaries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DunningRunSummary" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createDunningRun
      summary: Propose a dunning run (DRAFT); letters are previewed, not issued
      x-passage-duty: DunningRun
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDunningRunRequest" }
      responses:
        "201":
          description: Run proposed
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DunningRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/dunning-runs/{id}:
    get:
      operationId: getDunningRun
      summary: Read a dunning run with its letters and exclusions
      x-passage-duty: ARView
      parameters:
        - { $ref: "#/components/parameters/RunId" }
      responses:
        "200":
          description: Dunning run
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DunningRun" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/dunning-runs/{id}:review:
    post:
      operationId: reviewDunningRun
      summary: Mark a DRAFT run REVIEWED; requires If-Match
      x-passage-duty: DunningRun
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Run reviewed
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DunningRun" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/dunning-runs/{id}:issue:
    post:
      operationId: issueDunningRun
      summary: Issue a REVIEWED run; only issue posts fees and raises levels (AR-0007 unless reviewed)
      x-passage-duty: DunningRun
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Run issued
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DunningRun" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/dunning-runs/{id}:cancel:
    post:
      operationId: cancelDunningRun
      summary: Cancel a run that has not been issued; requires If-Match
      x-passage-duty: DunningRun
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Run cancelled
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DunningRun" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/interest-notes:
    get:
      operationId: listInterestNotes
      summary: Posted interest notes, latest calculation first
      x-passage-duty: ARView
      parameters:
        - { name: customer, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Interest notes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InterestNote" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/interest-notes:calculate:
    post:
      operationId: calculateInterest
      summary: Preview interest on overdue items (BR-30.5); writes nothing
      x-passage-duty: InterestPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterestRequest" }
      responses:
        "200":
          description: Candidates and exclusions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterestResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/interest-notes:post:
    post:
      operationId: postInterest
      summary: Post interest notes as INTEREST open items; once per item and month, charging only days after the last note
      description: |
        A retry with the same Idempotency-Key replays the stored response; the same
        key with another body is 422 idempotency_key_reuse.
      x-passage-duty: InterestPost
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterestRequest" }
      responses:
        "200":
          description: Candidates, exclusions and notes written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterestResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/promises:
    get:
      operationId: listPromises
      summary: Promises to pay, latest promise date first
      x-passage-duty: ARView
      parameters:
        - { name: customer, in: query, schema: { type: string, format: uuid } }
        - { name: openItem, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Promises
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Promise" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPromise
      summary: Record a promise to pay on an open item; excludes it from dunning and interest while open
      x-passage-duty: CollectionsMaintain
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromiseRequest" }
      responses:
        "201":
          description: Promise recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promise" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/disputes:
    get:
      operationId: listDisputes
      summary: Disputes, nearest SLA first
      x-passage-duty: ARView
      parameters:
        - name: status
          in: query
          description: A dispute status, or `active` for OPEN and UNDER_REVIEW.
          schema: { type: string, enum: [active, OPEN, UNDER_REVIEW, RESOLVED_CREDIT, RESOLVED_PAID, RESOLVED_WRITE_OFF, REJECTED] }
        - { name: customer, in: query, schema: { type: string, format: uuid } }
        - { name: openItem, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Disputes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Dispute" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: openDispute
      summary: Open a dispute on an open item; excludes it from dunning and interest
      x-passage-duty: CollectionsMaintain
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenDisputeRequest" }
      responses:
        "201":
          description: Dispute opened
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/disputes/{id}:
    get:
      operationId: getDispute
      summary: Read one dispute
      x-passage-duty: ARView
      parameters:
        - { $ref: "#/components/parameters/DisputeId" }
      responses:
        "200":
          description: Dispute
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/disputes/{id}:review:
    post:
      operationId: reviewDispute
      summary: Move an OPEN dispute to UNDER_REVIEW; requires If-Match
      x-passage-duty: CollectionsMaintain
      parameters:
        - { $ref: "#/components/parameters/DisputeId" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Dispute under review
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /api/v1/receivables/disputes/{id}:resolve:
    post:
      operationId: resolveDispute
      summary: Resolve a dispute as CREDIT, PAID, WRITE_OFF or REJECTED; requires If-Match
      x-passage-duty: CollectionsMaintain
      parameters:
        - { $ref: "#/components/parameters/DisputeId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveDisputeRequest" }
      responses:
        "200":
          description: Dispute resolved
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Resource version from the last read (ETag). Missing header returns 428.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 500 }
    PaymentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: id
      in: path
      required: true
      description: Dunning run id.
      schema: { type: string, format: uuid }
    DisputeId:
      name: id
      in: path
      required: true
      description: Dispute id.
      schema: { type: string, format: uuid }
  headers:
    ETag:
      description: Resource version, quoted.
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    Money:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]{1,6})?$"
      description: Decimal string, never a float.
    RemittanceLine:
      type: object
      required: [reference, amount]
      properties:
        reference: { type: string, maxLength: 200 }
        amount: { $ref: "#/components/schemas/Money" }
    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, paymentMode, source, amount, currency, receivedDate, valueDate]
      properties:
        legalEntityId: { type: string, format: uuid }
        customerId: { type: [string, "null"], format: uuid }
        paymentMode: { type: string, enum: [CHECK, ACH, WIRE, CARD, CASH] }
        source: { type: string, enum: [MANUAL] }
        sourceRef: { type: [string, "null"], maxLength: 120 }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        receivedDate: { type: string, format: date }
        valueDate: { type: string, format: date }
