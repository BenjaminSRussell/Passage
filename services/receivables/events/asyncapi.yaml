asyncapi: 3.0.0
info:
  title: Passage Receivables Events
  version: 1.0.0
  description: |
    CloudEvents 1.0 published through the transactional outbox (Debezium relays
    rows to Kafka). Types follow dev.passage.<context>.<entity>.<verb>.v<n>.
    Additive-only schema evolution.
defaultContentType: application/cloudevents+json
channels:
  paymentEvents:
    address: passage.receivables.payment
    messages:
      paymentReceived:
        $ref: "#/components/messages/PaymentReceived"
      paymentApplied:
        $ref: "#/components/messages/PaymentApplied"
  disputeEvents:
    address: passage.receivables.dispute
    messages:
      disputeOpened:
        $ref: "#/components/messages/DisputeOpened"
      disputeResolved:
        $ref: "#/components/messages/DisputeResolved"
  dunningLetterEvents:
    address: passage.receivables.dunningletter
    messages:
      dunningLetterIssued:
        $ref: "#/components/messages/DunningLetterIssued"
  caseEvents:
    address: passage.receivables.case
    messages:
      caseOpened:
        $ref: "#/components/messages/CaseOpened"
      caseClosed:
        $ref: "#/components/messages/CaseClosed"
  confirmationEvents:
    address: passage.receivables.confirmation
    messages:
      confirmationReplied:
        $ref: "#/components/messages/ConfirmationReplied"
  downPaymentEvents:
    address: passage.receivables.downpayment
    messages:
      downPaymentReceived:
        $ref: "#/components/messages/DownPaymentReceived"
      downPaymentCleared:
        $ref: "#/components/messages/DownPaymentCleared"
      downPaymentReleased:
        $ref: "#/components/messages/DownPaymentReleased"
  deductionEvents:
    address: passage.receivables.deduction
    messages:
      deductionOpened:
        $ref: "#/components/messages/DeductionOpened"
      deductionResolved:
        $ref: "#/components/messages/DeductionResolved"
operations:
  publishDisputeOpened:
    action: send
    channel: { $ref: "#/channels/disputeEvents" }
    messages:
      - { $ref: "#/channels/disputeEvents/messages/disputeOpened" }
  publishDisputeResolved:
    action: send
    channel: { $ref: "#/channels/disputeEvents" }
    messages:
      - { $ref: "#/channels/disputeEvents/messages/disputeResolved" }
  publishDunningLetterIssued:
    action: send
    channel: { $ref: "#/channels/dunningLetterEvents" }
    messages:
      - { $ref: "#/channels/dunningLetterEvents/messages/dunningLetterIssued" }
  publishPaymentReceived:
    action: send
    channel: { $ref: "#/channels/paymentEvents" }
    messages:
      - { $ref: "#/channels/paymentEvents/messages/paymentReceived" }
  publishPaymentApplied:
    action: send
    channel: { $ref: "#/channels/paymentEvents" }
    messages:
      - { $ref: "#/channels/paymentEvents/messages/paymentApplied" }
  publishCaseOpened:
    action: send
    channel: { $ref: "#/channels/caseEvents" }
    messages:
      - { $ref: "#/channels/caseEvents/messages/caseOpened" }
  publishCaseClosed:
    action: send
    channel: { $ref: "#/channels/caseEvents" }
    messages:
      - { $ref: "#/channels/caseEvents/messages/caseClosed" }
  publishConfirmationReplied:
    action: send
    channel: { $ref: "#/channels/confirmationEvents" }
    messages:
      - { $ref: "#/channels/confirmationEvents/messages/confirmationReplied" }
  publishDownPaymentReceived:
    action: send
    channel: { $ref: "#/channels/downPaymentEvents" }
    messages:
      - { $ref: "#/channels/downPaymentEvents/messages/downPaymentReceived" }
  publishDownPaymentCleared:
    action: send
    channel: { $ref: "#/channels/downPaymentEvents" }
    messages:
      - { $ref: "#/channels/downPaymentEvents/messages/downPaymentCleared" }
  publishDownPaymentReleased:
    action: send
    channel: { $ref: "#/channels/downPaymentEvents" }
    messages:
      - { $ref: "#/channels/downPaymentEvents/messages/downPaymentReleased" }
  publishDeductionOpened:
    action: send
    channel: { $ref: "#/channels/deductionEvents" }
    messages:
      - { $ref: "#/channels/deductionEvents/messages/deductionOpened" }
  publishDeductionResolved:
    action: send
    channel: { $ref: "#/channels/deductionEvents" }
    messages:
      - { $ref: "#/channels/deductionEvents/messages/deductionResolved" }
components:
  messages:
    PaymentReceived:
      name: dev.passage.receivables.payment.received.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/PaymentReceivedData"
    PaymentApplied:
      name: dev.passage.receivables.payment.applied.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/PaymentAppliedData"
    DisputeOpened:
      name: dev.passage.receivables.dispute.opened.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/DisputeOpenedData"
    DisputeResolved:
      name: dev.passage.receivables.dispute.resolved.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/DisputeResolvedData"
    DunningLetterIssued:
      name: dev.passage.receivables.dunningletter.issued.v1
      summary: One per issued letter (PRD dunning-letter.issued.v1; the type rule allows no hyphen). Skipped letters publish nothing.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/DunningLetterIssuedData"
    CaseOpened:
      name: dev.passage.receivables.case.opened.v1
      summary: A collection case was opened, by a collector or by a disagreed balance confirmation (FR-30.18, BR-30.13).
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/CaseOpenedData"
    CaseClosed:
      name: dev.passage.receivables.case.closed.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/CaseClosedData"
    ConfirmationReplied:
      name: dev.passage.receivables.confirmation.replied.v1
      summary: A customer replied to a balance confirmation (FR-30.20). Repeating a recorded reply publishes nothing.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ConfirmationRepliedData"
    DownPaymentReceived:
      name: dev.passage.receivables.downpayment.received.v1
      summary: A down payment or deposit was received; postings Dr bank / Cr 2190 or 2195 (FR-30.21).
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/DownPaymentData"
    DownPaymentCleared:
      name: dev.passage.receivables.downpayment.cleared.v1
      summary: A down payment cleared an invoice, or a deposit offset an item; postings Dr 2190 or 2195 / Cr 1200 (BR-30.14).
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/DownPaymentData"
    DownPaymentReleased:
      name: dev.passage.receivables.downpayment.released.v1
      summary: A security deposit's remainder was refunded; postings Dr 2195 / Cr bank.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/DownPaymentData"
    DeductionOpened:
      name: dev.passage.receivables.deduction.opened.v1
      summary: >-
        A deduction moved off a short-paid open item into the workbench, or a split created it (parent_id) (FR-30.17).
        Consumers: collections, analytics.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/DeductionOpenedData"
    DeductionResolved:
      name: dev.passage.receivables.deduction.resolved.v1
      summary: >-
        A deduction was approved (billing issues the credit note against the claim; pricing consumes the fund or
        accrual), denied (re-billed as rebill_item_id), written off (postings Dr 6110 / Cr 1200) or split (child_ids)
        (BR-30.12).
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/DeductionResolvedData"
  schemas:
    CaseOpenedData:
      type: object
      required: [case_id, legal_entity_id, customer_id, category, priority, owner, reason, currency, open_item_id, attached_amount, sla_due]
      properties:
        case_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        category: { type: string, enum: [COLLECTION, DISPUTE, DEDUCTION] }
        priority: { type: string, enum: [LOW, NORMAL, HIGH] }
        owner: { type: string }
        reason: { type: string, description: "BALANCE_DIFFERENCE when a balance confirmation disagreement opened the case" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        open_item_id: { type: [string, "null"], format: uuid }
        attached_amount: { type: [string, "null"], description: "decimal string; the customer's balance on a BALANCE_DIFFERENCE case" }
        sla_due: { type: string, format: date-time }
    CaseClosedData:
      type: object
      required: [case_id, legal_entity_id, customer_id, category, sla_breached, note]
      properties:
        case_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        category: { type: string, enum: [COLLECTION, DISPUTE, DEDUCTION] }
        sla_breached: { type: boolean, description: closed after its SLA was due }
        note: { type: [string, "null"] }
    ConfirmationRepliedData:
      type: object
      required: [confirmation_id, run_id, legal_entity_id, customer_id, currency, reply, our_balance, customer_balance, difference, case_id]
      properties:
        confirmation_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        reply: { type: string, enum: [AGREED, DISAGREED] }
        our_balance: { type: string, description: "decimal string" }
        customer_balance: { type: string, description: "decimal string; our balance when AGREED" }
        difference: { type: string, description: "customer_balance minus our_balance, decimal string" }
        case_id: { type: [string, "null"], format: uuid, description: "the DISPUTE case a disagreement opened" }
    DownPaymentData:
      type: object
      required: [downpayment_id, legal_entity_id, customer_id, sales_order_id, kind, amount, currency, remaining, open_item_id, postings]
      properties:
        downpayment_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        sales_order_id: { type: [string, "null"], format: uuid }
        kind: { type: string, enum: [DOWN_PAYMENT, SECURITY_DEPOSIT] }
        amount: { type: string, description: "decimal string; the amount of this movement" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        remaining: { type: string, description: "decimal string; what is left to clear or release after this movement" }
        open_item_id: { type: [string, "null"], format: uuid, description: "the item cleared (cleared events only)" }
        postings:
          type: array
          description: Ledger lines for this movement; the ledger client posts them once it exists (NOT-IMPLEMENTED.md).
          items:
            type: object
            required: [account, debit, credit]
            properties:
              account: { type: string, description: "1000 bank, 1200 receivables, 2190 down payments, 2195 security deposits" }
              debit: { type: string, description: "decimal string" }
              credit: { type: string, description: "decimal string" }
    DisputeOpenedData:
      type: object
      required: [dispute_id, legal_entity_id, customer_id, open_item_id, amount, currency, reason_code]
      properties:
        dispute_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        open_item_id: { type: string, format: uuid }
        amount: { type: string, description: "decimal string" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        reason_code: { type: string }
    DisputeResolvedData:
      type: object
      required: [dispute_id, legal_entity_id, customer_id, open_item_id, amount, currency, reason_code, resolution]
      properties:
        dispute_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        open_item_id: { type: string, format: uuid }
        amount: { type: string, description: "disputed amount, decimal string" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        reason_code: { type: string }
        resolution: { type: string, enum: [CREDIT, PAID, WRITE_OFF, REJECTED] }
    DunningLetterIssuedData:
      type: object
      required: [run_id, letter_id, legal_entity_id, customer_id, currency, level, items, fee, document_ref]
      properties:
        run_id: { type: string, format: uuid }
        letter_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        level: { type: integer, minimum: 1, maximum: 4 }
        items:
          type: array
          items:
            type: object
            required: [open_item_id, open_amount, days_overdue]
            properties:
              open_item_id: { type: string, format: uuid }
              open_amount: { type: string, description: "decimal string" }
              days_overdue: { type: integer }
        fee: { type: string, description: "decimal string; 0 below level 3, posted as a FEE open item" }
        document_ref: { type: string }
    PaymentReceivedData:
      type: object
      required: [payment_id, legal_entity_id, source, amount, currency, remittance]
      properties:
        payment_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        customer_id: { type: [string, "null"], format: uuid }
        source: { type: string, enum: [MANUAL, LOCKBOX, CAMT053, PORTAL, REMITTANCE] }
        amount: { type: string, description: "decimal string" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        remittance:
          type: array
          items:
            type: object
            required: [reference, amount]
            properties:
              reference: { type: string }
              amount: { type: string }
    PaymentAppliedData:
      type: object
      required: [payment_id, legal_entity_id, customer_id, currency, settlements, residual, status, journal_posting_id]
      properties:
        payment_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        customer_id: { type: [string, "null"], format: uuid, description: "null only when nothing was settled and the payer is unidentified" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        journal_posting_id: { type: [string, "null"], format: uuid, description: "null until ledger posting is wired (NOT-IMPLEMENTED.md)" }
        settlements:
          type: array
          items:
            type: object
            required: [open_item_id, amount, cash_discount, write_off]
            properties:
              open_item_id: { type: string, format: uuid }
              amount: { type: string }
              cash_discount: { type: string }
              write_off: { type: string }
        residual: { type: string, description: "amount placed on account" }
        status: { type: string, enum: [APPLIED, ON_ACCOUNT] }
    DeductionOpenedData:
      type: object
      required: [deduction_id, legal_entity_id, customer_id, open_item_id, payment_id, parent_id, type, reason_code, amount, currency]
      properties:
        deduction_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        open_item_id: { type: string, format: uuid, description: "the short-paid item the amount moved off" }
        payment_id: { type: [string, "null"], format: uuid }
        parent_id: { type: [string, "null"], format: uuid, description: "the split parent, for a child" }
        type: { type: string, enum: [PROMO, PRICE, SHORT_SHIP, DAMAGE, UNKNOWN] }
        reason_code: { type: string }
        amount: { type: string, description: "decimal string" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    DeductionResolvedData:
      type: object
      required: [deduction_id, legal_entity_id, customer_id, resolution, amount, currency, claim_type, claim_ref, denial_reason, rebill_item_id, child_ids, postings]
      properties:
        deduction_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        resolution: { type: string, enum: [APPROVED, DENIED, WRITTEN_OFF, SPLIT] }
        amount: { type: string, description: "decimal string; the whole deduction" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        claim_type: { type: [string, "null"], enum: [REBATE_ACCRUAL, PROMOTION_FUND, CHARGEBACK, null] }
        claim_ref: { type: [string, "null"] }
        denial_reason: { type: [string, "null"], enum: [NOT_AUTHORIZED, EXPIRED, DUPLICATE, null] }
        rebill_item_id: { type: [string, "null"], format: uuid, description: "the DEDUCTION debit item a denial created" }
        child_ids: { type: array, items: { type: string, format: uuid }, description: "the OPEN deductions a split created" }
        postings:
          type: array
          description: Ledger lines (write-off only); the ledger client posts them once it exists (NOT-IMPLEMENTED.md).
          items:
            type: object
            required: [account, debit, credit]
            properties:
              account: { type: string, description: "6110 deductions written off, 1200 receivables" }
              debit: { type: string, description: "decimal string" }
              credit: { type: string, description: "decimal string" }
