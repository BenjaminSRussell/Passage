image:
  repository: ghcr.io/benjaminsrussell/passage-receivables
  tag: "0.1.0"
  # Pin by digest in Argo CD overlays; tag is a dev default only.
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 8080
  # /metrics is served on the admin port, not the API port.
  adminPort: 9090

database:
  # Secret holding DATABASE_URL (passage_app role, no BYPASSRLS).
  secretName: receivables-db
  secretKey: DATABASE_URL

migrations:
  # Dev only; stage and prod run migrations as an Argo PreSync Job.
  migrateOnStart: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# With tenantIds set, every replica runs the RMA credit sweep (RECEIVABLES_RMA_SWEEP_*): it posts PENDING RMA credits the request path
# left behind and commits their billing reservations. reservationTtl (>= 1h, "0" = never) cancels a PENDING credit the ledger
# refused (or never tried) once it is that old, releasing the invoice room billing holds for the abandoned RMA (#557).
rmaSweep:
  tenantIds: []
  interval: 5m
  reservationTtl: 720h

# With tenantIds set, every replica runs the scheduled auto-apply (RECEIVABLES_AUTO_APPLY_*): the matcher's AUTO_APPLY decision on
# the tenants' unapplied payments, so payments with no advice, and items opened later, settle without a clerk. It runs every
# interval, or once a day at `at` (UTC, "02:30") when that is set; set one of the two. A payment is never applied twice.
autoApply:
  tenantIds: []
  interval: 15m
  at: ""

# With sources set, every replica polls the bank inboxes (RECEIVABLES_SFTP_*): each camt.053 file in a source's inbox is imported like
# an upload and moved to its done directory (to failed when it cannot be read). A source is {tenantId, legalEntityId, addr, user,
# hostKeyFingerprint ("SHA256:..." of the bank's host key), inbox, done, failed, autoApply}. The client private key is the
# `keySecretKey` entry of the Secret `keySecret`, mounted read-only. Polls every interval, or daily at `at` (UTC "HH:MM").
sftpPoll:
  sources: []
  keySecret: ""
  keySecretKey: id_ed25519
  interval: 15m
  at: ""

serviceMonitor:
  enabled: false
  interval: 30s

# The billing consumer (#30, args [consume]): opens the open items of billing's posted
# invoices (one per installment) and credit notes. It exits at start unless
# service:receivables-billing is seeded in the service principal table. Its KafkaUser,
# ACLs and dead-letter topic are deploy/kafka/receivables-consumer.yaml; off by default,
# like the other consumers in dev, until it is turned on per environment (billing's
# outbox connector, which creates passage.billing.invoice, is not deployed yet).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: receivables-billing
    username: receivables-consumer
    dlqTopic: passage.receivables.invoices.dlq
    secret: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
