image:
  repository: ghcr.io/benjaminsrussell/passage-receivables
  tag: "0.1.0"
  # Pin by digest in Argo CD overlays; tag is a dev default only.
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 8080
  # /metrics is served on the admin port, not the API port.
  adminPort: 9090

database:
  # Secret holding DATABASE_URL (passage_app role, no BYPASSRLS).
  secretName: receivables-db
  secretKey: DATABASE_URL

migrations:
  # Dev only; stage and prod run migrations as an Argo PreSync Job.
  migrateOnStart: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceMonitor:
  enabled: false
  interval: 30s

# The billing consumer (#30, args [consume]): opens the open items of billing's posted
# invoices (one per installment) and credit notes. It exits at start unless
# service:receivables-billing is seeded in the service principal table. Its KafkaUser,
# ACLs and dead-letter topic are deploy/kafka/receivables-consumer.yaml; off by default,
# like the other consumers in dev, until it is turned on per environment (billing's
# outbox connector, which creates passage.billing.invoice, is not deployed yet).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: receivables-billing
    username: receivables-consumer
    dlqTopic: passage.receivables.invoices.dlq
    secret: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
