openapi: 3.1.0
info:
  title: expense
  version: 0.5.0
  description: >-
    Expense management, slices 1-5 of PSG-43. Slice 5 persists cash advances (FR-43.15:
    request, decide, record the AP prepayment that paid it, record a cash return), travel
    requisitions (FR-43.16: create, submit, decide) and card feed imports (FR-43.13: import
    into the workers' unassigned pools with a quarantine, list). Their custom methods take a
    required Idempotency-Key and honour If-Match; decisions refuse the requester
    (EXP-SOD-001). Slice 4 persists expense reports and lines
    (FR-43.11): create a report, add a line (evaluated against the default rule set at
    commit, FR-43.12), delete a line, submit, list and get. Creating POSTs and submit take a
    required Idempotency-Key; a repeated key with the same request replays the first outcome
    (header Idempotent-Replayed: true), with another request it is refused (422 EXP-IDEM-001).
    Every report response carries ETag "<version>"; submit and line delete honour If-Match
    (412 EXP-REP-004 on a stale version). The other operations are stateless previews of the
    rules: policy evaluation of report lines (receipts at 25.00 and up, alcohol blocked,
    submission later than 60 days blocked, duplicates of merchant, amount and date blocked,
    meals over 75.00 a day without attendees needing justification), oldest-first
    cash-advance settlement (BR-43.9), travel requisition variance (BR-43.13), per diem
    (BR-43.6), cash-advance aging (FR-43.15), requisition window and closure (BR-43.13), card
    feed parsing (CSV, OFX; FR-43.13), the travel requisition category gate (FR-43.16), the
    lodging cap and mileage amount (BR-43.5) and one-to-one card-to-receipt matching
    (FR-43.13); previews persist nothing and take no Idempotency-Key. Money is a decimal
    string, never a float.
    Error codes: COM-0001, COM-0503, AUTH-0001, AUTH-0003, AUTH-0004, EXP-REP-001,
    EXP-REP-002, EXP-REP-003, EXP-REP-004, EXP-REP-005, EXP-LINE-001, EXP-LINE-002, EXP-LINE-003,
    EXP-IDEM-001, EXP-ADV-001, EXP-ADV-002, EXP-ADV-004, EXP-ADV-005, EXP-ADV-006,
    EXP-ADV-007, EXP-ADV-008, EXP-TR-003, EXP-TR-004, EXP-TR-005, EXP-CARD-002,
    EXP-SOD-001, COM-0500; a refused submit is a 422 carrying the first unsatisfied
    result's code (EXP-POL-001, EXP-REC-001 or EXP-TR-002). Result codes (in bodies):
    EXP-POL-001, EXP-POL-002, EXP-REC-001, EXP-TR-001, EXP-TR-002, EXP-ADV-002, EXP-ADV-003.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/expense/report-evaluations:
    post:
      operationId: evaluateReport
      x-passage-duty: expense.report.write
      description: >-
        Evaluates every line at the submit date, PER_DAY rules and duplicate detection across
        the report's lines. A line whose category is in requisitionCategories (ignoring case)
        is an EXP-TR-002 BLOCK unless hasRequisition is true (FR-43.16). submittable is false
        while any BLOCK applies or any REQUIRE_* is unsatisfied. Line ids must be unique
        (400 COM-0001).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluationRequest' }
      responses:
        '200':
          description: Results per rule that applied, submittable flag and totals (total = reimbursable + companyPaid).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvaluationResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/cash-advance-settlements:
    post:
      operationId: previewAdvanceSettlement
      x-passage-duty: expense.report.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettleRequest' }
      responses:
        '200':
          description: Per-advance application, open balance and status, total applied and the AP invoice amount.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/travel-variances:
    post:
      operationId: checkRequisitionVariance
      x-passage-duty: expense.report.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VarianceRequest' }
      responses:
        '200':
          description: requiresJustification is true when the actual total exceeds estimate × (1 + tolerance). code EXP-TR-001 accompanies a true result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VarianceResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/per-diem-computations:
    post:
      operationId: computePerDiem
      x-passage-duty: expense.report.write
      description: >-
        BR-43.6 per diem for one trip. days must be consecutive calendar days in date order
        (400 COM-0001 on days otherwise). The first and last day pay 75% of the M&IE rate (a
        one-day trip is both); provided breakfast, lunch and dinner are deducted at 20/30/50% of
        the full-day rate, also on partial days, and a day never goes below zero (GSA and BMF
        practice). Lodging per charged night. Each day is rounded half away from zero to the rate
        currency's minor unit (JPY 0, KWD 3, otherwise 2), and amounts are formatted at that
        unit. The rate table is supplied by the caller; conversion to the line currency is not
        done here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerDiemRequest' }
      responses:
        '200':
          description: Per-day lines and totals in the rate currency.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerDiemResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/cash-advance-aging:
    post:
      operationId: checkAdvanceAging
      x-passage-duty: expense.report.write
      description: >-
        FR-43.15 aging. open = paid - settled - returned - recovered - writtenOff (BR-43.9); the
        cleared amounts together may not exceed paid and ids must be unique (400 COM-0001). An
        advance is overdue when it still has an open balance after its due date, tripEnd plus
        limitDays (default 30); the due date itself is in time. newAdvancesBlocked is true, with
        code EXP-ADV-002, while any advance is overdue. Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgingRequest' }
      responses:
        '200':
          description: Blocking flag and the overdue advances with due date and open balance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgingResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/travel-requisition-checks:
    post:
      operationId: checkRequisitionWindow
      x-passage-duty: expense.report.write
      description: >-
        BR-43.13 window and closure. Travel dates outside the approved window (inclusive) are
        returned as WARN candidates. closeDate is 60 days after lastTravelDate (default trip.to);
        closeDue is true when the linked report is posted or asOf is on or after closeDate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequisitionCheckRequest' }
      responses:
        '200':
          description: Out-of-range dates and the closure flag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequisitionCheckResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/card-transactions:parse:
    post:
      operationId: parseCardFeed
      x-passage-duty: expense.card.import
      description: >-
        FR-43.13 card feed parse (ExpenseAdmin). CSV with a header holding card_last4, txn_date,
        post_date, merchant, amount and currency (optional mcc; a UTF-8 BOM is ignored), or OFX
        1.x/2.x STMTTRN blocks (DTUSER as the transaction date, else DTPOSTED; SIC as mcc; each
        statement's own ACCTID and CURDEF). Rows that fail validation, including malformed CSV
        rows, are returned in rejected and do not stop the file. Amounts are never rounded: more
        decimals than the currency allows, a zero amount or a post date before the transaction
        date rejects the row. fileHash is the SHA-256 of the content and keys de-duplication.
        Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardFeedRequest' }
      responses:
        '200':
          description: Parsed transactions (spend positive, refunds negative), rejected rows and the file hash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardFeedResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/lodging-checks:
    post:
      operationId: checkLodging
      x-passage-duty: expense.report.write
      description: >-
        BR-43.5 lodging cap. A stay costing more than lodgingRate x 1.5 x nights needs a
        justification (rule EXP-LODG-150, REQUIRE_JUSTIFICATION, code EXP-POL-001); a stay at
        exactly the cap is allowed. lodgingRate is the per-diem lodging rate for the city and
        date, supplied by the caller until the pack tables load. Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LodgingRequest' }
      responses:
        '200':
          description: The cap and, when over it, the policy result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LodgingResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/mileage-computations:
    post:
      operationId: computeMileage
      x-passage-duty: expense.report.write
      description: >-
        BR-43.5 mileage amount, distance x rate rounded half away from zero to the cent. rate is
        the pack's table value per mile or km for the vehicle type and date (IRS 0.70 USD/mile,
        BMF 0.30 EUR/km in 2025), supplied by the caller. Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MileageRequest' }
      responses:
        '200':
          description: The mileage amount.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MileageResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/card-matches:
    post:
      operationId: matchCardTransactions
      x-passage-duty: expense.report.write
      description: >-
        FR-43.13 one-to-one card-to-receipt matching. A receipt matches a card transaction of the
        same worker with an equal merchant (ignoring case and surrounding space), a date within
        toleranceDays and an amount within tolerancePct of the card amount (defaults 1 % and 2
        days; range 0-10 each). Cards are taken in date then id order, each taking the unused
        receipt with the smallest amount difference, then the closest date, then the lowest id.
        Ids must be unique within each list (400 COM-0001). Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardMatchRequest' }
      responses:
        '200':
          description: Pairs, what stayed unmatched (input order) and matched cards over all cards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardMatchResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/reports:
    get:
      operationId: listReports
      x-passage-duty: expense.report.write
      description: Reports visible to the caller (tenant and legal-entity scope), in id order, without lines.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, RETURNED, POSTED, PAID] } }
        - { name: workerId, in: query, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, description: nextCursor of the previous page., schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page; nextCursor is empty on the last page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createReport
      x-passage-duty: expense.report.write
      description: >-
        Creates a DRAFT report with zero totals. The legal entity must be inside the caller's
        legal-entity scope (403 AUTH-0004).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReportRequest' }
      responses:
        '201':
          description: Created.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseReport' }
        '200':
          description: Replay of an earlier create with the same key and body.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseReport' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/reports/{id}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      operationId: getReport
      x-passage-duty: expense.report.write
      responses:
        '200':
          description: The report with its lines and each line's stored policy results.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseReport' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/reports/{id}/lines:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    post:
      operationId: addReportLine
      x-passage-duty: expense.report.write
      description: >-
        Adds a line to a DRAFT report (409 EXP-REP-002 otherwise) and re-evaluates every line
        of the report at today's date (FR-43.12), so PER_DAY rules and duplicate detection
        can change an earlier line's results. The line is stored whatever its outcome; submit
        is where unsatisfied results stop the report. The id is generated when omitted. Totals
        are recomputed (total = reimbursable + companyPaid). At most 500 lines (422
        EXP-LINE-003); a line id already used is 409 EXP-LINE-001.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewReportLine' }
      responses:
        '201':
          description: The report with the new line.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseReport' }
        '200':
          description: Replay of an earlier add with the same key and body.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseReport' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/reports/{id}/lines/{lineId}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
      - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteReportLine
      x-passage-duty: expense.report.write
      description: >-
        Removes a line from a DRAFT report and re-evaluates the remaining lines; this is how a
        line flagged by a refused submit is corrected. 404 EXP-LINE-002 when the line is not on
        the report.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The report without the line.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseReport' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/reports/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    post:
      operationId: submitReport
      x-passage-duty: expense.report.write
      description: >-
        Submits a DRAFT report with at least one line (422 EXP-REP-003). Every line is
        re-evaluated at today's date and the results are stored. When any BLOCK applies or any
        REQUIRE_* is unsatisfied (8.43.5) the report stays DRAFT and the answer is 422 with the
        first unsatisfied result's code and one error per result keyed "<lineId>/<ruleId>";
        each BLOCK result is still published as dev.passage.expense.policy.violated.v1. The
        outcome, success or refusal, is stored against the Idempotency-Key and replayed on a
        retry, which never publishes the violations again.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The SUBMITTED report (or the replay of an earlier submit).
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseReport' }
        '422':
          description: Refused by policy, empty report, or an Idempotency-Key reused with another request.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/reports/{id}/decide:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    post:
      operationId: decideReport
      x-passage-duty: expense.approve
      description: >-
        Approves or rejects a SUBMITTED report (409 EXP-REP-002 otherwise). The decision needs
        an authenticated user (401 AUTH-0001), and the user who submitted the report may not
        decide it (403 EXP-SOD-001); a report that does not record its creator and submitter
        (created before the approval migration) is refused with 403 EXP-REP-005. An approval
        with a reimbursable amount writes dev.passage.expense.report.approved.v1 to the outbox,
        carrying the stored reimbursable amount, in the same transaction; payables creates the
        employee's AP open item. The open item is paid by a payment run only once its payee
        resolves in the vendor master, which no employee does yet (see NOT-IMPLEMENTED), so the
        report stays APPROVED until then. A report with nothing to
        reimburse becomes PAID at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: The decided report, or the replay of an earlier decision with the same key.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseReport' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/cash-advances:
    get:
      operationId: listCashAdvances
      x-passage-duty: expense.report.write
      description: Cash advances visible to the caller (tenant and legal-entity scope), in id order.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, PAID, PARTIALLY_SETTLED, SETTLED] } }
        - { name: workerId, in: query, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, description: nextCursor of the previous page., schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page; nextCursor is empty on the last page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashAdvancePage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: requestCashAdvance
      x-passage-duty: expense.report.write
      description: >-
        Requests a cash advance (FR-43.15); it is stored SUBMITTED, routed for approval. The
        due settlement date is tripEnd plus 30 days (8.43.13 default). Refused with 422
        EXP-ADV-001 above the per-request maximum (2,000.00 default), 422 EXP-ADV-002 while
        the worker has a PAID or PARTIALLY_SETTLED advance still open after its due date,
        422 EXP-ADV-004 when the travel requisition belongs to another worker or legal entity
        or is REJECTED or CLOSED, 404 EXP-TR-003 when it does not exist, and 403 AUTH-0004 for a legal entity
        outside the caller's scope.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashAdvanceRequest' }
      responses:
        '201':
          description: Requested.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashAdvance' }
        '200':
          description: Replay of an earlier request with the same key and body.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashAdvance' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/cash-advances/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getCashAdvance
      x-passage-duty: expense.report.write
      responses:
        '200':
          description: The advance with its settlement amounts and open balance.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashAdvance' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/cash-advances/{id}/decide:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: decideCashAdvance
      x-passage-duty: expense.approve
      description: >-
        Approves or rejects a SUBMITTED advance (409 EXP-ADV-005 otherwise). The decision
        needs an authenticated user (401 AUTH-0001), and the user who requested the advance
        may not decide it (403 EXP-SOD-001, 8.43.17 own items blocked).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: The decided advance, or the replay of an earlier decision with the same key.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashAdvance' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/cash-advances/{id}/pay:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: payCashAdvance
      x-passage-duty: expense.advance.admin
      description: >-
        Records that the wave-18 AP prepayment prepaymentId paid an APPROVED advance in full
        (409 EXP-ADV-005 otherwise): paid becomes the amount, the status PAID, and
        dev.passage.expense.cashadvance.paid.v1 is written to the outbox in the same
        transaction.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayCashAdvanceRequest' }
      responses:
        '200':
          description: The PAID advance, or the replay of an earlier call with the same key.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashAdvance' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/cash-advances/{id}/return:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: returnCashAdvance
      x-passage-duty: expense.advance.admin
      description: >-
        Records cash the worker returned (BR-43.9 option a) against a PAID or
        PARTIALLY_SETTLED advance (409 EXP-ADV-005 before payment). The amount may not exceed
        the open balance (422 EXP-ADV-007). The status is re-derived: PARTIALLY_SETTLED while
        a balance stays open, SETTLED when it is cleared.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnCashAdvanceRequest' }
      responses:
        '200':
          description: The advance after the return, or the replay of an earlier return with the same key.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashAdvance' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/travel-requisitions:
    get:
      operationId: listTravelRequisitions
      x-passage-duty: expense.report.write
      description: Requisitions visible to the caller, in id order.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, CLOSED] } }
        - { name: workerId, in: query, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, description: nextCursor of the previous page., schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page; nextCursor is empty on the last page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TravelRequisitionPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createTravelRequisition
      x-passage-duty: expense.report.write
      description: >-
        Creates a DRAFT pre-trip requisition (FR-43.16) with destinations, trip dates and
        estimate lines by category; estimatedTotal is the sum of the estimate lines. 403
        AUTH-0004 for a legal entity outside the caller's scope.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TravelRequisitionRequest' }
      responses:
        '201':
          description: Created.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TravelRequisition' }
        '200':
          description: Replay of an earlier create with the same key and body.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TravelRequisition' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/travel-requisitions/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getTravelRequisition
      x-passage-duty: expense.report.write
      responses:
        '200':
          description: The requisition.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TravelRequisition' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/travel-requisitions/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: submitTravelRequisition
      x-passage-duty: expense.report.write
      description: Submits a DRAFT requisition for approval (409 EXP-TR-004 otherwise).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The SUBMITTED requisition, or the replay of an earlier submit with the same key.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TravelRequisition' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/travel-requisitions/{id}/decide:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      operationId: decideTravelRequisition
      x-passage-duty: expense.approve
      description: >-
        Approves or rejects a SUBMITTED requisition (409 EXP-TR-004 otherwise). The decision
        needs an authenticated user (401 AUTH-0001), and the user who created the
        requisition may not decide it (403 EXP-SOD-001).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: The decided requisition, or the replay of an earlier decision with the same key.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TravelRequisition' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/card-transactions:
    get:
      operationId: listCardTransactions
      x-passage-duty: expense.report.write
      description: Imported card transactions in id order; status UNASSIGNED with a workerId is that worker's unassigned pool.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [UNASSIGNED, ASSIGNED, DISPUTED, PERSONAL] } }
        - { name: workerId, in: query, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, description: nextCursor of the previous page., schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page; nextCursor is empty on the last page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardTransactionPage' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/expense/card-transactions/import:
    post:
      operationId: importCardFeed
      x-passage-duty: expense.card.import
      description: >-
        Imports a CSV or OFX card feed (FR-43.13). Each parsed row goes to the worker who holds
        its card (cardholders maps the last four digits to a worker id) as an UNASSIGNED card
        transaction; rows the parser rejected and rows of a card with no cardholder are kept
        on the import as its quarantine. The file hash is unique per tenant: the same file
        under a new key is 409 EXP-CARD-002, while the same key and body replays the import.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardImportRequest' }
      responses:
        '201':
          description: Imported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardImport' }
        '200':
          description: Replay of an earlier import with the same key and body.
          headers: { Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardImport' }
        default: { $ref: '#/components/responses/Problem' }
  /readyz:
    get:
      operationId: readyz
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
  /healthz:
    get:
      operationId: healthz
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        The resource version as an entity tag, for example "3". A stale version is 412:
        EXP-REP-004 (report), EXP-ADV-008 (cash advance), EXP-TR-005 (requisition).
      schema: { type: string }
    ReportId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    ETag:
      description: The resource version, for example "3".
      schema: { type: string }
    IdempotentReplayed:
      description: true when the response replays an earlier request with the same Idempotency-Key.
      schema: { type: string, enum: ['true'] }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: 'https://passage.dev/problems/COM-0001' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors: { type: object, additionalProperties: { type: string } }
    ExpenseLine:
      type: object
      required: [id, category, txnDate, amount]
      additionalProperties: false
      properties:
        id: { type: string, maxLength: 64 }
        category: { type: string, maxLength: 32, example: MEALS }
        txnDate: { type: string, format: date }
        amount: { type: string, description: Non-negative decimal in the accounting currency. }
        merchant: { type: string, maxLength: 200 }
        attendees: { type: integer, minimum: 0, maximum: 500 }
        hasReceipt: { type: boolean }
        justification: { type: string, maxLength: 500 }
        paidBy: { type: string, enum: [EMPLOYEE, COMPANY_CARD] }
    EvaluationRequest:
      type: object
      required: [submitDate, lines]
      additionalProperties: false
      properties:
        submitDate: { type: string, format: date }
        lines: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/ExpenseLine' } }
        requisitionCategories:
          type: array
          maxItems: 50
          description: Categories that need an approved travel requisition (FR-43.16 parameter).
          items: { type: string, minLength: 1, maxLength: 32 }
        hasRequisition: { type: boolean, description: The report is linked to an approved travel requisition. }
    PolicyResult:
      type: object
      required: [lineId, ruleId, ruleVersion, outcome, code, message, satisfied]
      properties:
        lineId: { type: string }
        ruleId: { type: string, example: EXP-RCPT-025 }
        ruleVersion: { type: integer }
        outcome: { type: string, enum: [WARN, BLOCK, REQUIRE_JUSTIFICATION, REQUIRE_RECEIPT] }
        code: { type: string, enum: [EXP-POL-001, EXP-POL-002, EXP-REC-001, EXP-TR-002], description: 'BLOCK and REQUIRE_JUSTIFICATION EXP-POL-001, WARN EXP-POL-002, REQUIRE_RECEIPT EXP-REC-001; a missing travel requisition EXP-TR-002 (BLOCK).' }
        message: { type: string }
        satisfied: { type: boolean }
    EvaluationResponse:
      type: object
      required: [submittable, results, totals]
      properties:
        submittable: { type: boolean }
        results: { type: array, items: { $ref: '#/components/schemas/PolicyResult' } }
        totals:
          type: object
          required: [total, reimbursable, companyPaid]
          properties:
            total: { type: string }
            reimbursable: { type: string }
            companyPaid: { type: string }
    Advance:
      type: object
      required: [id, paidOn, paid]
      additionalProperties: false
      description: A PAID cash advance of the worker in the report currency.
      properties:
        id: { type: string, maxLength: 64 }
        paidOn: { type: string, format: date }
        paid: { type: string }
        cleared: { type: string, description: 'Already settled, returned, recovered or written off; at most paid. Default 0.' }
    SettleRequest:
      type: object
      required: [reimbursableTotal]
      additionalProperties: false
      properties:
        advances: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Advance' } }
        reimbursableTotal: { type: string }
    Settlement:
      type: object
      required: [applications, applied, apInvoiceAmount]
      description: Advances applied oldest first; the AP invoice carries the rest of the reimbursable total.
      properties:
        applications:
          type: array
          items:
            type: object
            required: [advanceId, applied, openAfter, status]
            properties:
              advanceId: { type: string }
              applied: { type: string }
              openAfter: { type: string }
              status: { type: string, enum: [PAID, PARTIALLY_SETTLED, SETTLED] }
        applied: { type: string }
        apInvoiceAmount: { type: string }
        code: { type: string, example: EXP-ADV-003, description: Present when anything was applied. }
    VarianceRequest:
      type: object
      required: [estimatedTotal, actualTotal]
      additionalProperties: false
      properties:
        estimatedTotal: { type: string }
        actualTotal: { type: string }
        tolerancePct: { type: string, description: Percent from 0 to 100; default 10. }
    VarianceResponse:
      type: object
      required: [requiresJustification]
      properties:
        requiresJustification: { type: boolean }
        code: { type: string, example: EXP-TR-001 }
    PerDiemRequest:
      type: object
      required: [rate, days]
      additionalProperties: false
      properties:
        rate:
          type: object
          required: [currency, lodging, mealsIncidentals]
          additionalProperties: false
          properties:
            country: { type: string, pattern: '^[A-Z]{2}$' }
            city: { type: string, maxLength: 64 }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
            lodging: { type: string, description: Non-negative lodging per night. }
            mealsIncidentals: { type: string, description: Non-negative M&IE per day. }
        days:
          type: array
          minItems: 1
          maxItems: 60
          items:
            type: object
            required: [date]
            additionalProperties: false
            properties:
              date: { type: string, format: date }
              lodging: { type: boolean, description: Night charged. }
              breakfastProvided: { type: boolean }
              lunchProvided: { type: boolean }
              dinnerProvided: { type: boolean }
    PerDiemResponse:
      type: object
      required: [currency, lines, totals]
      properties:
        currency: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [date, partial, lodging, mie, total]
            properties:
              date: { type: string, format: date }
              partial: { type: boolean, description: First or last day of the trip (75% M&IE). }
              lodging: { type: string }
              mie: { type: string }
              total: { type: string }
        totals:
          type: object
          required: [lodging, mie, total]
          properties:
            lodging: { type: string }
            mie: { type: string }
            total: { type: string }
    AgingRequest:
      type: object
      required: [asOf, advances]
      additionalProperties: false
      properties:
        asOf: { type: string, format: date }
        limitDays: { type: integer, minimum: 1, maximum: 180, default: 30 }
        advances:
          type: array
          maxItems: 500
          items:
            type: object
            required: [id, tripEnd, paid]
            additionalProperties: false
            properties:
              id: { type: string, maxLength: 64 }
              tripEnd: { type: string, format: date }
              paid: { type: string }
              settled: { type: string, description: Applied by expense reports. Default 0. }
              returned: { type: string, description: Cash returned by the worker. Default 0. }
              recovered: { type: string, description: Recovered through payroll. Default 0. }
              writtenOff: { type: string, description: Written off with ExpenseAdmin approval. Default 0. }
    AgingResponse:
      type: object
      required: [newAdvancesBlocked, overdue]
      properties:
        newAdvancesBlocked: { type: boolean }
        code: { type: string, example: EXP-ADV-002, description: Present when new advances are blocked. }
        overdue:
          type: array
          items:
            type: object
            required: [id, dueDate, daysPastDue, open]
            properties:
              id: { type: string }
              dueDate: { type: string, format: date }
              daysPastDue: { type: integer, minimum: 1 }
              open: { type: string }
    RequisitionCheckRequest:
      type: object
      required: [trip, travelDates, asOf]
      additionalProperties: false
      properties:
        trip:
          type: object
          required: [from, to]
          additionalProperties: false
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        travelDates:
          type: array
          maxItems: 366
          items: { type: string, format: date }
        lastTravelDate: { type: string, format: date, description: Defaults to trip.to. }
        asOf: { type: string, format: date }
        reportPosted: { type: boolean }
    RequisitionCheckResponse:
      type: object
      required: [outOfRangeDates, closeDate, closeDue]
      properties:
        outOfRangeDates:
          type: array
          items: { type: string, format: date }
        closeDate: { type: string, format: date }
        closeDue: { type: boolean }
    CardFeedRequest:
      type: object
      required: [format, content]
      additionalProperties: false
      properties:
        format: { type: string, enum: [CSV, OFX, csv, ofx] }
        content: { type: string, minLength: 1, maxLength: 2097152, description: Raw file content as text. }
    CardFeedResponse:
      type: object
      required: [format, fileHash, transactions, rejected]
      properties:
        format: { type: string, enum: [CSV, OFX] }
        fileHash: { type: string, description: SHA-256 hex of the content. }
        transactions:
          type: array
          items:
            type: object
            required: [line, cardLast4, txnDate, postDate, merchant, mcc, amount, currency]
            properties:
              line: { type: integer, description: File line of a CSV row, or the position of an OFX STMTTRN block. }
              cardLast4: { type: string, minLength: 4, maxLength: 4 }
              txnDate: { type: string, format: date }
              postDate: { type: string, format: date }
              merchant: { type: string }
              mcc: { type: string }
              amount: { type: string, description: Spend positive, refunds negative, at the currency minor unit. }
              currency: { type: string }
        rejected:
          type: array
          items:
            type: object
            required: [line, reason]
            properties:
              line: { type: integer }
              reason: { type: string }
    LodgingRequest:
      type: object
      required: [amount, nights, lodgingRate]
      additionalProperties: false
      properties:
        lineId: { type: string, maxLength: 64, description: Echoed in the result. }
        amount: { type: string, description: Non-negative decimal, the whole stay. }
        nights: { type: integer, minimum: 1, maximum: 366 }
        lodgingRate: { type: string, description: Non-negative per-diem lodging rate per night. }
        justification: { type: string, maxLength: 500 }
    LodgingResponse:
      type: object
      required: [capPerNight, cap, overCap, satisfied]
      properties:
        capPerNight: { type: string, description: lodgingRate x 1.5. }
        cap: { type: string, description: capPerNight x nights. }
        overCap: { type: boolean }
        satisfied: { type: boolean, description: True within the cap, or over it with a non-blank justification. }
        result: { $ref: '#/components/schemas/PolicyResult' }
    MileageRequest:
      type: object
      required: [distance, rate]
      additionalProperties: false
      properties:
        distance: { type: string, description: 'Non-negative decimal, at most 100000.' }
        rate: { type: string, description: 'Non-negative decimal per unit, at most 100.' }
    MileageResponse:
      type: object
      required: [amount]
      properties:
        amount: { type: string, example: '70.00' }
    MatchItem:
      type: object
      required: [id, workerId, date, merchant, amount]
      additionalProperties: false
      properties:
        id: { type: string, maxLength: 64 }
        workerId: { type: string, maxLength: 64 }
        date: { type: string, format: date }
        merchant: { type: string, minLength: 1, maxLength: 200 }
        amount: { type: string, description: Non-negative decimal. }
    CardMatchRequest:
      type: object
      additionalProperties: false
      properties:
        cards: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/MatchItem' } }
        receipts: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/MatchItem' } }
        tolerancePct: { type: string, description: 'Percentage 0-10; default 1.' }
        toleranceDays: { type: integer, minimum: 0, maximum: 10, description: Default 2. }
    CardMatchResponse:
      type: object
      required: [matches, unmatchedCards, unmatchedReceipts, autoMatchRate]
      properties:
        matches:
          type: array
          items:
            type: object
            required: [cardId, receiptId]
            properties:
              cardId: { type: string }
              receiptId: { type: string }
        unmatchedCards: { type: array, items: { type: string } }
        unmatchedReceipts: { type: array, items: { type: string } }
        autoMatchRate: { type: string, example: '0.9500', description: Matched cards over all cards, four places; 0.0000 for no cards. }
    CreateReportRequest:
      type: object
      required: [legalEntityId, workerId, purpose, currency]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        purpose: { type: string, minLength: 1, maxLength: 500, description: Trimmed before it is stored. }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: USD }
    NewReportLine:
      type: object
      required: [category, txnDate, amount]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: Generated when omitted. }
        category: { type: string, maxLength: 32, example: MEALS }
        txnDate: { type: string, format: date }
        amount: { type: string, description: Non-negative decimal in the report currency. }
        merchant: { type: string, maxLength: 200 }
        attendees: { type: integer, minimum: 0, maximum: 500 }
        hasReceipt: { type: boolean }
        justification: { type: string, maxLength: 500 }
        paidBy: { type: string, enum: [EMPLOYEE, COMPANY_CARD], default: EMPLOYEE }
    ReportLine:
      type: object
      required: [id, lineNo, category, txnDate, amount, merchant, attendees, hasReceipt, justification, paidBy, policyResults]
      properties:
        id: { type: string, format: uuid }
        lineNo: { type: integer, minimum: 1 }
        category: { type: string }
        txnDate: { type: string, format: date }
        amount: { type: string, description: Decimal with two places. }
        merchant: { type: string }
        attendees: { type: integer }
        hasReceipt: { type: boolean }
        justification: { type: string }
        paidBy: { type: string, enum: [EMPLOYEE, COMPANY_CARD] }
        policyResults: { type: array, items: { $ref: '#/components/schemas/PolicyResult' }, description: Results of the line's last evaluation (commit, delete or submit). }
    ExpenseReport:
      type: object
      required: [id, legalEntityId, workerId, purpose, currency, status, total, reimbursable, companyPaid, submittable, version, createdAt, submittedAt, lines]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        purpose: { type: string }
        currency: { type: string }
        status: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, RETURNED, POSTED, PAID] }
        total: { type: string, description: Sum of the lines; equals reimbursable + companyPaid. }
        reimbursable: { type: string, description: Employee-paid lines. }
        companyPaid: { type: string, description: Company-card lines. }
        submittable: { type: boolean, description: 'DRAFT, at least one line, and no unsatisfied stored result. Always false in list pages, which carry no lines. Submit re-evaluates at its own date.' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
        lines: { type: array, items: { $ref: '#/components/schemas/ReportLine' }, description: Empty in list pages. }
    ReportPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExpenseReport' } }
        nextCursor: { type: string }
    Decision:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision: { type: string, enum: [APPROVE, REJECT] }
    CashAdvanceRequest:
      type: object
      required: [legalEntityId, workerId, amount, currency, purpose, tripEnd]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        amount: { type: string, description: 'Greater than zero, no more decimals than the currency allows.', example: '1000.00' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        purpose: { type: string, minLength: 1, maxLength: 500 }
        travelRequisitionId: { type: string, format: uuid }
        tripEnd: { type: string, format: date }
    PayCashAdvanceRequest:
      type: object
      required: [prepaymentId]
      additionalProperties: false
      properties:
        prepaymentId: { type: string, format: uuid }
    ReturnCashAdvanceRequest:
      type: object
      required: [amount]
      additionalProperties: false
      properties:
        amount: { type: string, description: Greater than zero and at most the open balance. }
    CashAdvance:
      type: object
      required: [id, legalEntityId, workerId, amount, currency, purpose, travelRequisitionId, tripEnd, dueDate, overdue, status, paid, settled, returned, recovered, open, apPrepaymentId, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        amount: { type: string }
        currency: { type: string }
        purpose: { type: string }
        travelRequisitionId: { type: [string, 'null'], format: uuid }
        tripEnd: { type: string, format: date }
        dueDate: { type: string, format: date, description: Settlement due date (trip end + settlement-due days). }
        overdue: { type: boolean, description: An open balance remains after the due date. }
        status: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, PAID, PARTIALLY_SETTLED, SETTLED] }
        paid: { type: string }
        settled: { type: string, description: Applied by expense reports. }
        returned: { type: string, description: Cash returned by the worker. }
        recovered: { type: string, description: Recovered through payroll. }
        open: { type: string, description: 'paid - settled - returned - recovered, never negative.' }
        apPrepaymentId: { type: [string, 'null'], format: uuid }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    CashAdvancePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CashAdvance' } }
        nextCursor: { type: string }
    Destination:
      type: object
      required: [country, city]
      additionalProperties: false
      properties:
        country: { type: string, minLength: 1, maxLength: 128 }
        city: { type: string, minLength: 1, maxLength: 128 }
    Estimate:
      type: object
      required: [category, amount]
      additionalProperties: false
      properties:
        category: { type: string, minLength: 1, maxLength: 32, description: Expense category; stored upper-case. }
        amount: { type: string, description: Non-negative, in the requisition currency. }
    TravelRequisitionRequest:
      type: object
      required: [legalEntityId, workerId, purpose, currency, tripFrom, tripTo, destinations, estimates]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        purpose: { type: string, minLength: 1, maxLength: 500 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        tripFrom: { type: string, format: date }
        tripTo: { type: string, format: date, description: Not before tripFrom. }
        destinations: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/Destination' } }
        estimates: { type: array, minItems: 1, maxItems: 100, description: 'The amounts may add up to at most 1000000000000.', items: { $ref: '#/components/schemas/Estimate' } }
    TravelRequisition:
      type: object
      required: [id, legalEntityId, workerId, purpose, currency, status, tripFrom, tripTo, destinations, estimates, estimatedTotal, version, createdAt, submittedAt, decidedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        purpose: { type: string }
        currency: { type: string }
        status: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, CLOSED] }
        tripFrom: { type: string, format: date }
        tripTo: { type: string, format: date }
        destinations: { type: array, items: { $ref: '#/components/schemas/Destination' } }
        estimates: { type: array, items: { $ref: '#/components/schemas/Estimate' } }
        estimatedTotal: { type: string, description: Sum of the estimate lines. }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    TravelRequisitionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TravelRequisition' } }
        nextCursor: { type: string }
    CardImportRequest:
      type: object
      required: [legalEntityId, format, content, cardholders]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        format: { type: string, enum: [CSV, OFX] }
        content: { type: string, minLength: 1, maxLength: 2097152 }
        cardholders:
          type: object
          description: Last four card digits to the worker id holding the card (1 to 5000 cards).
          propertyNames: { pattern: '^[0-9]{4}$' }
          additionalProperties: { type: string, format: uuid }
    CardImport:
      type: object
      required: [id, legalEntityId, format, fileHash, imported, quarantined, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        format: { type: string, enum: [CSV, OFX] }
        fileHash: { type: string, description: SHA-256 of the file content, hex. }
        imported: { type: integer, minimum: 0 }
        quarantined:
          type: array
          items:
            type: object
            required: [line, reason]
            properties:
              line: { type: integer }
              reason: { type: string }
        createdAt: { type: string, format: date-time }
    CardTransaction:
      type: object
      required: [id, importId, workerId, line, cardLast4, txnDate, postDate, merchant, mcc, amount, currency, status]
      properties:
        id: { type: string, format: uuid }
        importId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        line: { type: integer, description: File line (CSV) or STMTTRN position (OFX). }
        cardLast4: { type: string, pattern: '^[0-9]{4}$' }
        txnDate: { type: string, format: date }
        postDate: { type: string, format: date }
        merchant: { type: string }
        mcc: { type: string }
        amount: { type: string, description: Spend is positive, refunds negative. }
        currency: { type: string }
        status: { type: string, enum: [UNASSIGNED, ASSIGNED, DISPUTED, PERSONAL] }
    CardTransactionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CardTransaction' } }
        nextCursor: { type: string }
