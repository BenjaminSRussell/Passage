image:
  repository: ghcr.io/benjaminsrussell/close
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: close-db
replicaCount: 1
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor:
  enabled: false
config:
  reopenDefaultDays: 3
  reopenApprovers: 2
  lockWaitMs: 5000
  reopenSweepInterval: 1m
