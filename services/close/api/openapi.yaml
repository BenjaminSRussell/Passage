openapi: 3.1.0
info:
  title: close
  version: 0.1.0
  description: Period control, close checklist, allocations and year-end (wave 14). This slice ships the period-control decision endpoint the ledger posting API calls.
servers:
  - url: https://api.passage.dev
paths:
  /v1/close/period-statuses:check:
    post:
      operationId: checkPeriodStatus
      x-passage-duty: period.check
      description: Decides whether a posting from the given source system may enter the fiscal period. Resolution order is the module row, then the ALL row, then never opened (rejected). Read-only; the ledger also checks inside its posting transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeriodCheckRequest' }
      responses:
        '200':
          description: Posting allowed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodCheckResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/close/periods:resolve:
    get:
      operationId: resolveFiscalPeriod
      x-passage-duty: period.check
      description: Maps a posting date to the fiscal period of one ledger and legal entity (the single legal entity of the caller's identity, required) and returns the period id with the status of the requested source system's module (module row, then ALL row, then never_opened). A closed or held period is a normal answer; the caller decides. Only periods with start and end dates registered are resolvable.
      parameters:
        - { name: ledgerId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: postingDate, in: query, required: true, schema: { type: string, format: date } }
        - name: sourceSystem
          in: query
          required: false
          schema: { type: string }
          description: Same values as the check endpoint; any other value, including empty, reads the ALL module.
      responses:
        '200':
          description: The period covering the date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodResolveResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/close/periods/{fiscalPeriodId}:
    put:
      operationId: registerPeriod
      x-passage-duty: period.maintain
      description: Registers the dates of a fiscal period of one ledger and the caller's single legal entity, opening the ALL module when the period is new. Idempotent for the same dates; registered dates never move, and dates that overlap another period of the ledger are refused. The ledger's legal entity is read from the ledger service and must equal the caller's. Never changes a status.
      parameters:
        - { name: fiscalPeriodId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ledgerId, startDate, endDate]
              properties:
                ledgerId: { type: string, format: uuid }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
      responses:
        '200': { description: Already registered with these dates. }
        '201': { description: Registered. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/close/year-end-runs:
    post:
      operationId: runYearEnd
      x-passage-duty: close.yearend.run
      description: "Closes one fiscal year of a ledger and the caller's single legal entity. The request names only the ledger, year and retained-earnings account. Close verifies the ledger belongs to the caller's legal entity, requires the fiscal periods of the year to be contiguous, non-overlapping and to cover 1 January to 31 December, every module closed (general ledger may be on hold) and the last period not permanently closed, reads the balances per account and dimension from the ledger trial balance, takes account classes from the ledger's chart, derives the closing date (last period end) and the proposed opening date (the next day) from its periods, computes the closing and opening proposals, records the run, posts only the closing entry (profit and loss to retained earnings) with service credentials under a key derived from the run, then marks the run completed and queues dev.passage.close.yearend.completed.v1. No opening journal is posted: the ledger's balances are cumulative, so the opening proposal is kept on the run as a verification artifact. Proposals are derived again on a retry until the closing entry has posted. Repeating the same request, including a completed re-run, returns the stored run (200) and resumes an unfinished posting without duplicating entries. A ledger refusal while nothing has posted marks the run abandoned and frees the year. A completed year is redone only by naming that run in supersedesRunId, which reverses its closing entry and posts again from the ledger's current balances. A different request for the same ledger and year is 409 COM-0409; a posting the ledger is still processing is 409 CLOSE-0002 with Retry-After."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/YearEndRequest' }
      responses:
        '200':
          description: The run already existed; completed now or earlier.
          headers:
            Location: { schema: { type: string }, description: The run resource. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearEndRun' }
        '201':
          description: The run was created and completed.
          headers:
            Location: { schema: { type: string }, description: The run resource. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearEndRun' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/close/year-end-runs/{runId}:
    get:
      operationId: getYearEndRun
      x-passage-duty: close.yearend.read
      description: Returns a stored year-end run with its proposals and posted journal ids.
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearEndRun' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/close/periods:
    get:
      operationId: listPeriods
      x-passage-duty: period.maintain
      description: Lists period-status rows of the caller's legal entity for one ledger.
      parameters:
        - { name: ledgerId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Period matrix. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/close/periods/{fiscalPeriodId}/modules/{module}:
    patch:
      operationId: transitionPeriod
      x-passage-duty: period.maintain
      description: Transitions a module of a registered period (open, on_hold, closed, permanently_closed). Closed periods change only through the reopen workflow.
      parameters:
        - { name: fiscalPeriodId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: module, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ledgerId, status]
              properties:
                ledgerId: { type: string, format: uuid }
                status: { type: string, enum: [open, on_hold, closed, permanently_closed] }
                allowedGroupId: { type: string }
                reason: { type: string }
      responses:
        '200': { description: Updated period row. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/close/periods/{fiscalPeriodId}/modules/{module}:request-reopen:
    post:
      operationId: requestReopen
      x-passage-duty: period.reopen
      description: Starts dual-approval reopen of a closed period. Requires Idempotency-Key.
      parameters:
        - { name: fiscalPeriodId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: module, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ledgerId, reason]
              properties:
                ledgerId: { type: string, format: uuid }
                reason: { type: string, minLength: 10 }
                expiresDays: { type: integer, minimum: 1, maximum: 30 }
      responses:
        '201': { description: Reopen request created. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/close/reopen-requests/{requestId}:approve:
    post:
      operationId: approveReopen
      x-passage-duty: period.reopen
      description: Records one distinct approver. The requester cannot approve. Two approvals open the period until expiry.
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Approval recorded, and the period opened when the last required approval lands. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/close/reopen-requests/{requestId}:reject:
    post:
      operationId: rejectReopen
      summary: "Reject a request to reopen a closed period"
      x-passage-duty: period.reopen
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Request rejected. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/close/templates/{templateId}:
    put:
      operationId: putCloseTemplate
      summary: "Create or replace a close checklist template"
      x-passage-duty: close.checklist.write
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, tasks] }
      responses:
        '200': { description: Template stored. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    get:
      operationId: getCloseTemplate
      summary: "Get a close checklist template"
      x-passage-duty: close.checklist.read
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Template. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/close/runs:
    post:
      operationId: createCloseRun
      x-passage-duty: close.checklist.write
      description: Instantiates a template across legal entities. Requires Idempotency-Key.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId, fiscalPeriodId, legalEntityIds]
              properties:
                templateId: { type: string, format: uuid }
                fiscalPeriodId: { type: string, format: uuid }
                legalEntityIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '201': { description: Close run created. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/close/runs/{runId}/tasks:
    get:
      operationId: listCloseTasks
      summary: "List the tasks of a close run"
      x-passage-duty: close.checklist.read
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entity, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: Checklist board. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/close/tasks/{taskId}:start:
    post:
      operationId: startCloseTask
      summary: "Start a close task"
      x-passage-duty: close.checklist.write
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Task started. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/close/tasks/{taskId}:complete:
    post:
      operationId: completeCloseTask
      summary: "Complete a close task"
      x-passage-duty: close.checklist.write
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Task completed. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/close/tasks/{taskId}:skip:
    post:
      operationId: skipCloseTask
      summary: "Skip a close task with a reason"
      x-passage-duty: close.checklist.write
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        '200': { description: Task skipped. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/close/tasks/{taskId}:reassign:
    post:
      operationId: reassignCloseTask
      summary: "Reassign a close task to another user"
      x-passage-duty: close.checklist.write
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [assigneeUserId], properties: { assigneeUserId: { type: string } } }
      responses:
        '200': { description: Task reassigned. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/close/allocation-rules/{ruleId}:
    put:
      operationId: putAllocationRule
      summary: "Create or replace an allocation rule"
      x-passage-duty: close.allocation.write
      parameters:
        - { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Rule stored. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      operationId: getAllocationRule
      summary: "Get an allocation rule"
      x-passage-duty: close.allocation.write
      parameters:
        - { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Rule. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/close/allocation-runs:
    post:
      operationId: runAllocation
      x-passage-duty: close.allocation.run
      description: Proposes an allocation from the ledger trial balance and optionally posts it through ledgerclient without PostClosed. Requires Idempotency-Key.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '201': { description: Allocation run. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/close/allocation-runs/{runId}:post:
    post:
      operationId: postAllocation
      summary: "Post a proposed allocation run to the ledger"
      x-passage-duty: close.allocation.run
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Posted run. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/close/allocation-runs/{runId}:reverse:
    post:
      operationId: reverseAllocation
      summary: "Reverse a posted allocation run"
      x-passage-duty: close.allocation.run
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Reversed run. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/close/accrual-schemes/{code}:
    put:
      operationId: putAccrualScheme
      summary: "Create or replace an accrual scheme"
      x-passage-duty: close.accrual.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Scheme stored. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      operationId: getAccrualScheme
      summary: "Get an accrual scheme"
      x-passage-duty: close.accrual.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: ledgerId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Scheme. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/close/accrual-schemes/{code}:apply:
    post:
      operationId: applyAccrual
      x-passage-duty: close.accrual.run
      description: Spreads the amount stored on the scheme (close.accrual.write sets it; the request carries no amount) across monthly occurrences stepped from month end, in the ledger currency (a different currency is 422 CLOSE-0011). Occurrences and reversals that are due today or earlier post now, each persisted as it posts; later ones are posted by the in-process sweeper with backoff, and a permanent ledger refusal parks the run. Requires Idempotency-Key. Recurring journals stay in the ledger service.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '201': { description: Accrual run stored; status is scheduled until every occurrence and reversal has posted. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/close/accrual-runs/{runId}:cancel:
    post:
      operationId: cancelAccrualRun
      x-passage-duty: close.accrual.run
      description: Cancels a scheduled or parked accrual run so no further occurrence or reversal posts. Entries already posted stay in the ledger. A run copies the scheme's amount, accounts and autoReverse when it is applied, so later scheme edits do not change it; cancel and apply again to pick them up. The user who last changed a scheme cannot apply it.
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cancelled run. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/close/regrouping-rules/{code}:
    put:
      operationId: putRegroupingRule
      summary: "Create or replace a regrouping rule"
      x-passage-duty: close.regrouping.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Rule stored. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      operationId: getRegroupingRule
      summary: "Get a regrouping rule"
      x-passage-duty: close.regrouping.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: ledgerId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Rule. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/close/regroupings:
    post:
      operationId: runRegrouping
      x-passage-duty: close.regrouping.run
      description: Proposes balance-sheet regrouping and optionally posts through ledgerclient without PostClosed. Remaining-term items without a due date fall into the shortest bucket. Requires Idempotency-Key.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '201': { description: Regrouping run. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/close/regroupings/{runId}:post:
    post:
      operationId: postRegrouping
      summary: "Post a proposed regrouping run to the ledger"
      x-passage-duty: close.regrouping.run
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Posted run. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/close/regroupings/{runId}:reverse:
    post:
      operationId: reverseRegrouping
      summary: "Reverse a posted regrouping run"
      x-passage-duty: close.regrouping.run
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Reversed run. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
  /metrics:
    get:
      operationId: metrics
      x-passage-duty: public
      description: Served on the admin port (9090), never through the ingress.
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema: { type: string }
components:
  schemas:
    PeriodCheckRequest:
      type: object
      additionalProperties: false
      required: [ledgerId, fiscalPeriodId, postingDate]
      properties:
        ledgerId: { type: string, format: uuid }
        fiscalPeriodId: { type: string, format: uuid }
        postingDate: { type: string, format: date }
        sourceSystem:
          type: string
          description: manual, gl, ap, ar, inv, fa, proj, tax, bank, payroll, cash or prod. Any other value, including empty, checks the ALL module.
        groupId:
          type: string
          description: User group of the poster; the only way through an on_hold period.
    PeriodCheckResult:
      type: object
      required: [allowed, module, status]
      properties:
        allowed: { type: boolean, const: true }
        module: { type: string, enum: [all, gl, ap, ar, inventory, assets, cash, production, projects, tax, bank, payroll] }
        status: { type: string, enum: [open, on_hold] }
    PeriodResolveResult:
      type: object
      required: [fiscalPeriodId, startDate, endDate, module, status]
      properties:
        fiscalPeriodId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        module: { type: string, enum: [all, gl, ap, ar, inventory, assets, cash, production, projects, tax, bank, payroll] }
        status: { type: string, enum: [open, on_hold, closed, permanently_closed, never_opened] }
    YearEndEntry:
      type: object
      required: [kind, account, dimensions, amount]
      properties:
        kind: { type: string, enum: [closing, opening], description: An opening entry is a stored proposal only and is never posted. }
        account: { type: string }
        dimensions: { type: string }
        amount: { type: string, description: Signed decimal, positive is a debit and negative a credit. }
    YearEndRequest:
      type: object
      additionalProperties: false
      description: Names what to close and where retained earnings go. Amounts, account classes, currency and dates are never accepted from the caller; close reads them from the ledger and its own fiscal periods.
      required: [ledgerId, fiscalYear, retainedEarningsAccount]
      properties:
        ledgerId: { type: string, format: uuid }
        fiscalYear: { type: string, pattern: '^[0-9]{4}$', description: Calendar year whose fiscal periods are all closed (the general ledger module may be on hold). }
        retainedEarningsAccount: { type: string, maxLength: 20, description: A postable equity account of the ledger's chart. }
        retainDimensions: { type: boolean, description: Carry each profit and loss dimension combination into retained earnings instead of combining them. }
        supersedesRunId: { type: string, format: uuid, description: The latest completed run of this ledger and year; its closing entry is reversed before the new one posts. }
    YearEndRun:
      type: object
      required: [id, legalEntityId, ledgerId, fiscalYear, sequence, status, currency, closingDate, openingDate, retainedEarningsAccount, retainDimensions, journals, createdBy]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        fiscalYear: { type: string }
        sequence: { type: integer, minimum: 1 }
        supersedesRunId: { type: string, format: uuid }
        status: { type: string, enum: [pending, completed, abandoned], description: abandoned means a ledger refusal ended the run before any journal posted. }
        currency: { type: string, description: The ledger's accounting currency. }
        closingDate: { type: string, format: date, description: End of the last fiscal period of the year. }
        openingDate: { type: string, format: date, description: The day after the closing date, when the stored opening proposal takes effect; nothing is posted on it. }
        retainedEarningsAccount: { type: string }
        retainDimensions: { type: boolean }
        proposals:
          type: object
          required: [closing, opening]
          properties:
            closing: { type: array, items: { $ref: '#/components/schemas/YearEndEntry' } }
            opening: { type: array, items: { $ref: '#/components/schemas/YearEndEntry' } }
        journals:
          type: object
          description: Ledger journal entry ids by step.
          properties:
            closing: { type: string }
            reverseClosing: { type: string }
        createdBy: { type: string }
    Problem:
      type: object
      required: [type, title, status, code, serviceCode]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        serviceCode: { type: string }
        traceId: { type: string }
        errors: { type: object, additionalProperties: { type: string } }
  responses:
    Problem:
      description: RFC 9457 problem details (application/problem+json). 422 LEDGER-0013 period closed or never opened; 403 LEDGER-0014 period on hold; 400 CLOSE-0004 or COM-0001 validation; 404 CLOSE-0005 no fiscal period covers the date or the year's periods leave a gap; 404 CLOSE-0007 no such year-end run; 422 CLOSE-0008 the ledger rejected a year-end entry; 422 CLOSE-0011 the request does not match the stored rule, ledger, period or currency, or there is nothing to post; 400 CLOSE-0009 the ledger's balances or chart cannot be closed; 409 CLOSE-0006 several periods cover it or overlap.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
