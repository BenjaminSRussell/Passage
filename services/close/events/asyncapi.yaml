asyncapi: 3.0.0
info:
  title: close
  version: 0.1.0
  description: Period status changes, checklist, allocations, accruals, regrouping and year-end close write CloudEvents to the outbox.
channels:
  passage.close.period:
    address: passage.close.period
    messages:
      statusChanged:
        $ref: '#/components/messages/statusChanged'
  passage.close.yearend:
    address: passage.close.yearend
    messages:
      yearEndCompleted:
        $ref: '#/components/messages/yearEndCompleted'
  passage.close.run:
    address: passage.close.run
    messages:
      runCreated:
        $ref: '#/components/messages/runCreated'
  passage.close.task:
    address: passage.close.task
    messages:
      taskCompleted:
        $ref: '#/components/messages/taskCompleted'
  passage.close.allocation:
    address: passage.close.allocation
    messages:
      allocationCompleted:
        $ref: '#/components/messages/allocationCompleted'
  passage.close.accrual:
    address: passage.close.accrual
    messages:
      accrualScheduled:
        $ref: '#/components/messages/accrualScheduled'
  passage.close.regrouping:
    address: passage.close.regrouping
    messages:
      regroupingCompleted:
        $ref: '#/components/messages/regroupingCompleted'
operations:
  onStatusChanged:
    action: send
    channel:
      $ref: '#/channels/passage.close.period'
    messages:
      - $ref: '#/channels/passage.close.period/messages/statusChanged'
  onYearEndCompleted:
    action: send
    channel:
      $ref: '#/channels/passage.close.yearend'
    messages:
      - $ref: '#/channels/passage.close.yearend/messages/yearEndCompleted'
  onRunCreated:
    action: send
    channel:
      $ref: '#/channels/passage.close.run'
    messages:
      - $ref: '#/channels/passage.close.run/messages/runCreated'
  onTaskCompleted:
    action: send
    channel:
      $ref: '#/channels/passage.close.task'
    messages:
      - $ref: '#/channels/passage.close.task/messages/taskCompleted'
  onAllocationCompleted:
    action: send
    channel:
      $ref: '#/channels/passage.close.allocation'
    messages:
      - $ref: '#/channels/passage.close.allocation/messages/allocationCompleted'
  onAccrualScheduled:
    action: send
    channel:
      $ref: '#/channels/passage.close.accrual'
    messages:
      - $ref: '#/channels/passage.close.accrual/messages/accrualScheduled'
  onRegroupingCompleted:
    action: send
    channel:
      $ref: '#/channels/passage.close.regrouping'
    messages:
      - $ref: '#/channels/passage.close.regrouping/messages/regroupingCompleted'
components:
  messages:
    yearEndCompleted:
      name: yearEndCompleted
      title: Year-end close completed
      payload:
        type: object
        required: [runId, legalEntityId, ledgerId, fiscalYear]
        properties:
          runId: { type: string, format: uuid }
          legalEntityId: { type: string, format: uuid }
          ledgerId: { type: string, format: uuid }
          fiscalYear: { type: string }
          closingJournalId: { type: string }
      x-passage-type: dev.passage.close.yearend.completed.v1
    statusChanged:
      name: statusChanged
      title: Period status changed
      payload:
        type: object
        required: [ledgerId, module, fiscalPeriodId, previousStatus, newStatus, changedBy]
        properties:
          ledgerId: { type: string, format: uuid }
          module: { type: string }
          fiscalPeriodId: { type: string, format: uuid }
          previousStatus: { type: string, enum: [open, on_hold, closed, permanently_closed] }
          newStatus: { type: string, enum: [open, on_hold, closed, permanently_closed] }
          changedBy: { type: string }
      x-passage-type: dev.passage.close.period.statuschanged.v1
    runCreated:
      name: runCreated
      title: Close checklist run created
      payload:
        type: object
        required: [runId, templateId, fiscalPeriodId]
        properties:
          runId: { type: string, format: uuid }
          templateId: { type: string, format: uuid }
          fiscalPeriodId: { type: string, format: uuid }
          taskCount: { type: integer }
      x-passage-type: dev.passage.close.run.created.v1
    taskCompleted:
      name: taskCompleted
      title: Close checklist task completed or skipped
      payload:
        type: object
        required: [runId, taskId, status]
        properties:
          runId: { type: string, format: uuid }
          taskId: { type: string, format: uuid }
          status: { type: string }
          actor: { type: string }
          late: { type: boolean }
      x-passage-type: dev.passage.close.task.completed.v1
    allocationCompleted:
      name: allocationCompleted
      title: Allocation posted or reversed
      payload:
        type: object
        required: [runId, ledgerId]
        properties:
          runId: { type: string, format: uuid }
          ledgerId: { type: string, format: uuid }
          entryId: { type: string }
          reversed: { type: boolean }
      x-passage-type: dev.passage.close.allocation.completed.v1
    accrualScheduled:
      name: accrualScheduled
      title: Accrual run stored
      payload:
        type: object
        required: [runId, schemeCode, ledgerId]
        properties:
          runId: { type: string, format: uuid }
          schemeCode: { type: string }
          ledgerId: { type: string, format: uuid }
      x-passage-type: dev.passage.close.accrual.scheduled.v1
    regroupingCompleted:
      name: regroupingCompleted
      title: Regrouping posted or reversed
      payload:
        type: object
        required: [runId, ledgerId, keyDate]
        properties:
          runId: { type: string, format: uuid }
          ledgerId: { type: string, format: uuid }
          keyDate: { type: string, format: date }
          entryId: { type: string }
          reversed: { type: boolean }
      x-passage-type: dev.passage.close.regrouping.completed.v1
