apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: consolidation
spec:
  selector:
    app.kubernetes.io/name: consolidation
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: admin, port: 9090, targetPort: admin }
---
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: consolidation
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: consolidation
  endpoints:
    - port: admin
      path: /metrics
{{- end }}
