openapi: 3.1.0
info:
  title: Passage Consolidation
  version: 0.4.0
  description: |
    Wave 40, slices 1 to 3. Stateless consolidation calculators: the E1–E5
    elimination entries for one parent and subsidiary and the E6 dividend
    elimination with its per-rule rounding line (FR-40.9, BR-40.9), the IAS 21
    unit translation with CTA and its NCI share (FR-40.8, BR-40.6), unrealized
    profit per IC receipt layer (FR-40.16), the equity method and divestiture
    gain (FR-40.18), the two-sided IC elimination with threshold (BR-40.15),
    the unit validation rules with the monitor gate (FR-40.20), the
    reclassification dry run (FR-40.17, BR-40.14) and the top-side group
    journal check (FR-40.19, BR-40.18). The previews store nothing. Runs are
    stored (start, list, get, statements). Groups, collection,
    consolidated trial balances over collected data, posted reclassifications, posted
    top-side journals and the stored monitor are later slices of PSG-40 (see NOT-IMPLEMENTED.md). Browser calls go through the web BFF at
    /api/v1/consol/..., which rewrites to these paths and sets the tenant and
    duty headers.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/consol/eliminations:preview:
    post:
      operationId: previewEliminations
      summary: Build the E1–E5 elimination entries for one parent and subsidiary pair, balanced per rule (AC-40.7)
      x-passage-duty: consolidation.run
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EliminationRequest'
      responses:
        '200':
          description: Entries, totals per rule and overall, and the balance result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EliminationPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: CNS-0920 bargain purchase, CNS-0903 an unbalanced rule
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/consol/translations:preview:
    post:
      operationId: previewTranslation
      summary: Translate a unit's net assets and net income under IAS 21 and derive the CTA with its NCI share (AC-40.6)
      x-passage-duty: consolidation.run
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationRequest'
      responses:
        '200':
          description: Translated amounts and the CTA split, rounded to the group currency minor unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/consol/profit-in-inventory:preview:
    post:
      operationId: previewProfitInInventory
      summary: Unrealized profit in inventory per IC receipt layer by group cost, with the seller-margin fallback (FR-40.16, BR-40.7, AC-40.12)
      x-passage-duty: consolidation.run
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfitInInventoryRequest'
      responses:
        '200':
          description: Profit per layer with its basis, the total, and CNS-0908 when a layer used the fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitInInventoryPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/consol/equity-method:preview:
    post:
      operationId: previewEquityMethod
      summary: Share of profit, dividends and closing carrying amount of an associate under the equity method (FR-40.18, AC-40.14)
      x-passage-duty: consolidation.run
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquityMethodRequest'
      responses:
        '200':
          description: Share of profit, unrecognized loss, closing carrying amount and the EQ entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquityMethodPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/consol/divestitures:preview:
    post:
      operationId: previewDivestiture
      summary: Deconsolidation gain or loss of a full divestiture with CTA recycled from OCI (FR-40.18)
      x-passage-duty: consolidation.run
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DivestitureRequest'
      responses:
        '200':
          description: Group carrying amount disposed and the gain (negative for a loss)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DivestiturePreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/consol/ic-differences:preview:
    post:
      operationId: previewIcDifferences
      summary: Two-sided IC elimination per partner pair with the difference to the IC difference account up to the threshold (BR-40.15)
      x-passage-duty: consolidation.run
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IcDifferenceRequest'
      responses:
        '200':
          description: Entries per pair; a pair above the threshold carries CNS-0905 and the task ends in Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcDifferencePreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/consol/validations:preview:
    post:
      operationId: previewValidations
      summary: Evaluate the seeded validation rules per unit and gate the group translation task (FR-40.20, AC-40.15)
      x-passage-duty: consolidation.run
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequest'
      responses:
        '200':
          description: Rule results and task status per unit; group translation is Blocked when a unit ends in Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/consol/dividends:preview:
    post:
      operationId: previewDividends
      summary: E6 elimination of a dividend within the group, with the per-rule rounding line (FR-40.9, BR-40.9)
      x-passage-duty: consolidation.run
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DividendRequest'
      responses:
        '200':
          description: 'E6 entries: parent dividend income and NCI equity against dividends declared, balanced'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: CNS-0903 a residual beyond rounding (elimination defect)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/consol/reclassification-runs:preview:
    post:
      operationId: previewReclassificationRun
      summary: Dry run of ordered reclassification and regrouping rules at entity and group level (FR-40.17, BR-40.14, AC-40.13)
      x-passage-duty: consolidation.run
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReclassificationRequest'
      responses:
        '200':
          description: Lines per applied rule; entity-level lines reverse on reversalDate, group-level lines are consolidation entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReclassificationPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: CNS-0903 a rule produced unbalanced lines
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/consol/group-journals:preview:
    post:
      operationId: previewGroupJournal
      summary: 'Check a top-side group journal: invariants, approval at the threshold and the periods it applies to (FR-40.19, BR-40.18)'
      x-passage-duty: consolidation.journal.maintain
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupJournalRequest'
      responses:
        '200':
          description: The journal is valid, with approvalRequired with a CNS-0909 warning when the total is at or above the threshold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupJournalPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: CNS-0903 debits differ from credits
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/consol/runs:
    post:
      operationId: startConsolidationRun
      summary: Compute and store a consolidation run for a group, period and currency (FR-40.10)
      description: |
        Translates every unit under IAS 21 and builds its E1–E5 eliminations
        with the same rules as the previews, then stores the header, the unit
        balances, the eliminations and the statements in one transaction. A run
        is immutable. A second run for the same group, period and currency is
        the next version; nothing is overwritten. The IAS 21 treatment of the
        eliminations is an open accountant question (issue 349) and the run
        stores what the engine produces. All run routes need all-entity scope
        (403 CNS-0923 for a legal-entity-scoped caller). Publishes
        dev.passage.consol.run.completed.v1 through the outbox.
      x-passage-duty: consolidation.run
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
      responses:
        '201':
          description: The stored run, or the stored response of an earlier request with the same Idempotency-Key (Idempotent-Replayed true)
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          description: CNS-0922 the Idempotency-Key was used with different inputs
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: CNS-0920 bargain purchase, CNS-0903 an unbalanced rule
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: listConsolidationRuns
      summary: List the tenant's runs, newest first (FR-40.10)
      x-passage-duty: consolidation.view
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - { name: groupId, in: query, schema: { type: string } }
        - { name: period, in: query, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
        - { name: after, in: query, description: nextCursor of the previous page, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page of runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/consol/runs/{id}:
    get:
      operationId: getConsolidationRun
      summary: One run with its unit balances and eliminations (FR-40.11)
      x-passage-duty: consolidation.view
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: The stored run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          description: CNS-0921 no run with this id for the tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/consol/runs/{id}/statements:
    get:
      operationId: getConsolidationRunStatements
      summary: The statements of one run (FR-40.11)
      x-passage-duty: consolidation.view
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: The net assets and income statements of the run, in group currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatements'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          description: CNS-0921 no run with this id for the tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /healthz:
    get:
      operationId: healthz
      x-passage-duty: public
      responses:
        '200':
          description: Liveness
  /readyz:
    get:
      operationId: readyz
      x-passage-duty: public
      responses:
        '200':
          description: Readiness (the stateless slice has no dependency to check)
  /v1/consol/groups:
    post:
      operationId: createConsolidationGroup
      summary: Create a consolidation group with its group currency (FR-40.7)
      description: A retry with the same Idempotency-Key replays the stored group; a second group with the same code is 409 CNS-0925. Group routes need all-entity scope (403 CNS-0923).
      x-passage-duty: consolidation.configure
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupRequest' }
      responses:
        '201':
          description: The group
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listConsolidationGroups
      summary: List the tenant's groups with their unit counts
      x-passage-duty: consolidation.view
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
      responses:
        '200':
          description: Groups ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Group' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/consol/groups/{id}:
    get:
      operationId: getConsolidationGroup
      summary: A group with its units and their ownership history
      x-passage-duty: consolidation.view
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/consol/groups/{id}/units:
    post:
      operationId: addConsolidationUnit
      summary: Add a legal entity to the group with the ledger its balances are collected from
      description: The same legal entity twice is 409 CNS-0926.
      x-passage-duty: consolidation.configure
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnitRequest' }
      responses:
        '201':
          description: The unit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Unit' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/consol/groups/{id}/units/{unitId}:
    patch:
      operationId: updateConsolidationUnit
      summary: Change a unit's ledger, currency or fiscal year
      description: >-
        The currency of a unit that collections were made from cannot change (409 CNS-0931): its stored balances are in it.
        fiscalYearStartMonth is the month the unit's fiscal year starts in; a collection takes the unit's income accounts from the start
        of the fiscal year the period falls in.
      x-passage-duty: consolidation.configure
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                ledgerId: { type: string }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                fiscalYearStartMonth: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: The unit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Unit' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeConsolidationUnit
      summary: Remove a unit with its ownership history and terms
      description: A unit that collections were made from, or that holds a share of another unit, stays (409 CNS-0931).
      x-passage-duty: consolidation.configure
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/consol/groups/{id}/units/{unitId}/terms:
    put:
      operationId: setConsolidationUnitTerms
      summary: Store the group's investment in a unit (acquisition terms)
      description: >-
        What a run cannot read from a trial balance: the cost of the investment (group currency), the share capital and retained earnings at
        acquisition (unit currency), the exchange rate of that day, which way the intercompany goods flow and whether the intercompany balance
        is part of the net investment. Replaces the earlier terms.
      x-passage-duty: consolidation.configure
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnitTermsRequest' }
      responses:
        '200':
          description: The stored terms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnitTerms' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/consol/groups/{id}/unit-terms:
    get:
      operationId: listConsolidationUnitTerms
      summary: The stored acquisition terms of the group's units
      x-passage-duty: consolidation.view
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Terms by unit id
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UnitTerms' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/consol/groups/{id}/units/{unitId}/layers/{period}:
    put:
      operationId: setConsolidationIcLayers
      summary: Replace the IC receipt layers a subsidiary's goods still sit in at the end of a period
      description: >-
        The layers (FR-40.16) are the remaining quantity of each intercompany receipt held by the buyer, with its legal unit cost and,
        when known, the group's unit cost. A run over the collection of that period sums the unrealized profit over them for E3
        (quantity times legal cost less group cost; a layer without a group cost uses the seller's margin and the run answers a
        CNS-0908 warning) instead of taking it from the unsold share. An empty list removes the layers.
      x-passage-duty: consolidation.configure
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: period, in: path, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IcLayers' }
      responses:
        '200':
          description: The stored layers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IcLayers' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/consol/groups/{id}/layers/{period}:
    get:
      operationId: listConsolidationIcLayers
      summary: The IC receipt layers of every unit of the group for a period
      x-passage-duty: consolidation.view
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
        - { name: period, in: path, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: Layers by unit
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/IcLayers' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/consol/groups/{id}/investments:
    get:
      operationId: listConsolidationInvestments
      summary: The investments register of the group's newest run for a period
      x-passage-duty: consolidation.view
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
        - { name: period, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: One line per unit, empty when the group has no run for the period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Investments' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/consol/runs/{id}/investments:
    get:
      operationId: getConsolidationRunInvestments
      summary: The investments register of a run
      description: >-
        One line per unit in the group currency: a consolidated subsidiary at cost, an equity-method unit (terms method equity, up to 50
        percent held) with its opening carrying amount (the register of the previous fiscal year end, else the investment cost), the
        group's share of its profit, the dividends received and the closing carrying amount.
      x-passage-duty: consolidation.view
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: The register
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Investments' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/consol/groups/{id}/units/{unitId}/ownership:
    post:
      operationId: addConsolidationOwnership
      summary: Record an ownership percentage from a date; the holder's open interval is closed on that date
      description: Holders of one unit together never exceed 100.00 percent on any date (422 CNS-0904). Without holderUnitId the group's top parent holds the stake.
      x-passage-duty: consolidation.configure
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnershipRequest' }
      responses:
        '201':
          description: The unit with its history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Unit' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/consol/groups/{id}/account-map:
    put:
      operationId: setConsolidationAccountMap
      summary: Store a new version of the chart mapping from main accounts to consolidation accounts
      description: Every PUT is a new version (the earlier ones are kept, so a collection keeps the mapping it was made with). An account may name the role a run reads it by.
      x-passage-duty: consolidation.configure
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountMap' }
      responses:
        '200':
          description: The stored mapping
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountMap' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    get:
      operationId: getConsolidationAccountMap
      summary: The group's chart mapping (the latest version, or the one named)
      x-passage-duty: consolidation.view
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
        - { name: version, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The mapping ordered by main account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountMap' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/consol/groups/{id}/account-map/versions:
    get:
      operationId: listConsolidationAccountMapVersions
      summary: The stored versions of the chart mapping, newest first
      x-passage-duty: consolidation.view
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: The versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [version, createdBy, createdAt, accounts]
                      properties:
                        version: { type: integer }
                        createdBy: { type: string }
                        createdAt: { type: string, format: date-time }
                        accounts: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/consol/groups/{id}/collections:
    post:
      operationId: collectConsolidationBalances
      summary: Collect each unit's trial balance from its ledger for a period (FR-40.8)
      description: |
        Reads the balances of every unit's ledger (balance sheet cumulative to
        the period, income accounts from January of the period's year), maps
        them to consolidation accounts and translates them to the group
        currency, balance sheet at the closing rate and income at the average
        rate. A unit in another currency needs a rate for it (422 CNS-0927). A
        ledger that cannot be read is 502 CNS-0929. The result is stored as an
        immutable version of the group and period.
      x-passage-duty: consolidation.run
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectRequest' }
      responses:
        '201':
          description: The stored collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listConsolidationCollections
      summary: A group's collections, newest first
      x-passage-duty: consolidation.view
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Collections
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Collection' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/consol/collections/{id}:
    get:
      operationId: getConsolidationCollection
      summary: A collection with every collected line
      x-passage-duty: consolidation.view
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: The collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collection' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/consol/collections/{id}/trial-balance:
    get:
      operationId: getConsolidatedTrialBalance
      summary: The consolidated trial balance of a collection, before eliminations, with each unit's contribution per account
      description: Accounts without a mapping are listed apart. unitDifferences is each unit's translation difference, the amount the run books as CTA.
      x-passage-duty: consolidation.view
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: The trial balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrialBalance' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/consol/collections/{id}/validations:
    get:
      operationId: getCollectionValidations
      summary: The balance sheet rule of the consolidation monitor over each unit's collected balances
      description: >-
        Assets less liabilities and equity (equity including the year's profit), in the unit's currency, must be within 0.01. The accounts are
        read by role (asset, liability, equity in the chart mapping), so a unit with balance sheet accounts that carry no role shows the
        difference they leave. blocked is true when any unit failed: the group translation must not run.
      x-passage-duty: consolidation.view
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DutiesHeader'
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: One entry per unit
          content:
            application/json:
              schema:
                type: object
                required: [units, blocked]
                properties:
                  blocked: { type: boolean }
                  units:
                    type: array
                    items:
                      type: object
                      required: [unit, status, results]
                      properties:
                        unit: { type: string, format: uuid }
                        status: { type: string }
                        results:
                          type: array
                          items:
                            type: object
                            required: [rule, severity, difference, failed]
                            properties:
                              rule: { type: string }
                              severity: { type: string }
                              difference: { type: string }
                              failed: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    TenantHeader:
      name: X-Passage-Tenant
      in: header
      required: true
      description: Set by the gateway; UUIDv7 tenant id
      schema:
        type: string
        format: uuid
    DutiesHeader:
      name: X-Passage-Duties
      in: header
      required: true
      description: Set by the gateway; comma-separated duties of the caller
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client key, at most 255 characters; a retry with the same key and inputs replays the stored response for the tenant
      schema:
        type: string
        maxLength: 255
    RunID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 problem details (COM-0001 validation, AUTH-0001 no tenant, AUTH-0003 missing duty)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    GroupRequest:
      type: object
      required: [code, name, currency]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$' }
        name: { type: string, maxLength: 200 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    Group:
      type: object
      required: [id, code, name, currency, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        currency: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        unitCount: { type: integer, description: Only in the list }
    GroupDetail:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          required: [units]
          properties:
            units: { type: array, items: { $ref: '#/components/schemas/Unit' } }
    UnitRequest:
      type: object
      required: [legalEntityId, ledgerId, currency]
      properties:
        legalEntityId: { type: string, format: uuid }
        ledgerId: { type: string, description: The ledger the unit's balances are collected from }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        fiscalYearStartMonth: { type: integer, minimum: 1, maximum: 12, description: The month the unit's fiscal year starts in; 1 when omitted }
    UnitTermsRequest:
      type: object
      required: [historicalRate]
      additionalProperties: false
      properties:
        investmentCost: { $ref: '#/components/schemas/Decimal' }
        shareCapital: { $ref: '#/components/schemas/Decimal' }
        preAcquisitionRe: { $ref: '#/components/schemas/Decimal' }
        historicalRate: { $ref: '#/components/schemas/Decimal' }
        sellerIsSubsidiary: { type: boolean }
        icNetInvestment: { type: boolean }
        fxGainLossAccount: { type: string }
        method: { type: string, enum: [full, equity], default: full, description: 'full consolidates the unit line by line (E1 to E6); equity takes an associate or joint venture (up to 50 percent held) with the equity method into one line and the investments register, from investmentCost as its opening carrying amount in the first year.' }
        icReceivableAccount: { type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$', description: 'The main account in the unit''s own ledger that holds its receivable from the holder. A run over a collection reads the E2 receivable from it (debit balance, unit currency); an ic.icReceivable for the unit is then refused.' }
        parentPayableAccount: { type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$', description: 'The main account in the holder''s ledger that holds the payable to this unit. A run over a collection reads the E2 payable from it (credit balance, the holder must keep its ledger in the group currency); an ic.payableGroup for the unit is then refused.' }
    IcLayers:
      type: object
      required: [layers]
      properties:
        unit: { type: string, format: uuid }
        period: { type: string }
        layers:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [ref, quantity, legalUnitCost]
            properties:
              ref: { type: string, maxLength: 128, description: The receipt layer, shown for drill }
              quantity: { type: string }
              legalUnitCost: { type: string }
              groupUnitCost: { type: string, description: Without it E3 uses the seller's margin and the run warns CNS-0908 }
    Investments:
      type: object
      required: [items]
      properties:
        runId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        period: { type: string }
        currency: { type: string }
        items:
          type: array
          items:
            type: object
            required: [unit, method, ownershipPct, cost, openingCarrying, shareOfProfit, dividends, closingCarrying, unrecognizedLoss]
            properties:
              unit: { type: string, format: uuid }
              method: { type: string, enum: [full, equity] }
              ownershipPct: { type: string }
              cost: { type: string }
              openingCarrying: { type: string }
              shareOfProfit: { type: string }
              dividends: { type: string }
              closingCarrying: { type: string }
              unrecognizedLoss: { type: string, description: The part of a share of loss above the carrying amount that is not recognized (IAS 28.38) }
              unitCurrency: { type: string, description: 'A foreign associate''s own currency; its carrying amount is retranslated at the closing rate (IAS 21.44, IAS 28)' }
              closingCarryingUnit: { type: string, description: The closing carrying amount in the associate's own currency, the base of the next retranslation }
              fxDifference: { type: string, description: 'The exchange difference of the retranslation (group currency), booked as EQ-FX to ASSOCIATE_TRANSLATION_RESERVE and part of the run''s CTA' }
    UnitTerms:
      allOf:
        - $ref: '#/components/schemas/UnitTermsRequest'
        - type: object
          required: [unitId, updatedBy, updatedAt]
          properties:
            unitId: { type: string, format: uuid }
            updatedBy: { type: string }
            updatedAt: { type: string, format: date-time }
    Holding:
      type: object
      required: [id, effectiveFrom, percent]
      properties:
        id: { type: string, format: uuid }
        holderUnitId: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        percent: { type: string }
    Unit:
      type: object
      required: [id, legalEntityId, ledgerId, currency, currentPercent, ownership]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        ledgerId: { type: string }
        currency: { type: string }
        currentPercent: { type: string, description: Total held on today's date }
        fiscalYearStartMonth: { type: integer, minimum: 1, maximum: 12 }
        ownership: { type: array, items: { $ref: '#/components/schemas/Holding' } }
    OwnershipRequest:
      type: object
      required: [effectiveFrom, percent]
      properties:
        holderUnitId: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        percent: { type: string, description: Decimal from 0 to 100 }
    AccountMap:
      type: object
      required: [accounts]
      properties:
        version: { type: integer, description: The stored version (set by the service) }
        accounts:
          type: array
          items:
            type: object
            required: [mainAccount, consolidationAccount, accountType]
            properties:
              mainAccount: { type: string }
              consolidationAccount: { type: string }
              accountType: { type: string, enum: [balance_sheet, income] }
              role: { type: string, enum: [asset, liability, equity, ic_sales, ic_cost, ic_receivable, ic_payable, dividend_paid], description: 'What a run reads the account for; asset, liability, equity, dividend_paid and the IC balances are balance_sheet accounts, ic_sales and ic_cost income accounts. dividend_paid is where a unit books the dividends it declared (a debit): they come off its net assets, give E6 for a consolidated subsidiary and the dividends received of an equity-method unit.' }
    CollectRequest:
      type: object
      required: [period]
      properties:
        period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        rates:
          description: Optional. A foreign unit currency named here is translated at these rates; every other one is read from the fx rate tables (the average and the closing rate type, valid on the last day of the period). A rate that is in neither place is 422 CNS-0927 naming the currency pair.
          type: array
          maxItems: 100
          items:
            type: object
            required: [currency, average, closing]
            properties:
              currency: { type: string }
              average: { type: string }
              closing: { type: string }
    Collection:
      type: object
      required: [id, groupId, period, version, currency, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        period: { type: string }
        version: { type: integer }
        currency: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        lineCount: { type: integer }
        unmappedCount: { type: integer }
        lines:
          type: array
          items:
            type: object
            properties:
              unit: { type: string }
              mainAccount: { type: string }
              consolidationAccount: { type: string }
              accountType: { type: string }
              unitCurrency: { type: string }
              unitAmount: { type: string }
              rate: { type: string }
              groupAmount: { type: string }
    TrialBalance:
      type: object
      required: [rows, unmapped, total, unitDifferences]
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              account: { type: string }
              accountType: { type: string }
              total: { type: string }
              units: { type: object, additionalProperties: { type: string } }
        unmapped: { type: array, items: { type: object } }
        total: { type: string }
        unitDifferences: { type: object, additionalProperties: { type: string } }
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    Rates:
      type: object
      additionalProperties: false
      properties:
        closing: { $ref: '#/components/schemas/Decimal', description: Subsidiary-to-group closing rate }
        average: { $ref: '#/components/schemas/Decimal', description: Average rate of the period }
        opening: { $ref: '#/components/schemas/Decimal', description: Rate that translated opening net assets (translation only) }
        historical: { $ref: '#/components/schemas/Decimal', description: Rate at acquisition (eliminations only) }
    EliminationRequest:
      type: object
      additionalProperties: false
      required: [currency, ownershipPct, rates]
      description: Missing amounts default to 0. Subsidiary amounts are in its functional currency.
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Group currency }
        ownershipPct: { $ref: '#/components/schemas/Decimal', description: Parent ownership, above 0 and at most 100 }
        rates:
          allOf:
            - $ref: '#/components/schemas/Rates'
          description: closing, average and historical are required
        icSales: { $ref: '#/components/schemas/Decimal', description: Intercompany sales by the seller, not negative }
        icCost: { $ref: '#/components/schemas/Decimal', description: Seller's cost of those sales, not negative }
        unsoldShare: { $ref: '#/components/schemas/Decimal', description: Fraction of the IC goods still held by the buyer, 0 to 1 }
        icReceivable: { $ref: '#/components/schemas/Decimal', description: Subsidiary receivable from the parent }
        payableGroup: { $ref: '#/components/schemas/Decimal', description: Parent payable to the subsidiary as recorded in group currency }
        shareCapital: { $ref: '#/components/schemas/Decimal', description: Subsidiary share capital at acquisition }
        preAcqRe: { $ref: '#/components/schemas/Decimal', description: Subsidiary retained earnings at acquisition }
        investmentCost: { $ref: '#/components/schemas/Decimal', description: Parent's investment in group currency }
        netIncome: { $ref: '#/components/schemas/Decimal', description: Subsidiary current-year net income }
        sellerIsSubsidiary: { type: boolean, description: Upstream sale; its unrealized profit is shared with the NCI }
        icNetInvestment: { type: boolean, default: false, description: IC balance is part of the net investment in the foreign operation; its E2 exchange difference goes to CTA instead of profit or loss (IAS 21.32) }
        fxGainLossAccount: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9._:-]{1,64}$', description: Account for the E2 exchange difference to profit or loss (IAS 21.45); FX_GAIN_LOSS when omitted; CTA and the engine's own accounts are rejected }
    Totals:
      type: object
      required: [debit, credit]
      properties:
        debit: { type: string }
        credit: { type: string }
    EliminationPreview:
      type: object
      required: [currency, entries, rules, totals, balanced]
      properties:
        currency: { type: string }
        entries:
          type: array
          items:
            type: object
            required: [rule, account, debit, credit]
            properties:
              rule: { type: string, enum: [E1, E2, E3, E4, E5] }
              account: { type: string }
              debit: { type: string }
              credit: { type: string }
        rules:
          type: object
          description: Debit and credit totals per rule code
