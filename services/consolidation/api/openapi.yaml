      properties:
        code: { type: string }
        message: { type: string }
    ProfitInInventoryRequest:
      type: object
      additionalProperties: false
      required: [currency, layers]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Receipt currency of the layers }
        sellerMarginPct: { $ref: '#/components/schemas/Decimal', description: 'Seller''s average margin, 0 to 100; required when a layer has no group cost (BR-40.7)' }
        layers:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [quantity, legalUnitCost]
            properties:
              id: { type: string, description: Receipt layer reference for drill; defaults to layer-<n> }
              quantity: { $ref: '#/components/schemas/Decimal', description: Remaining quantity, not negative }
              legalUnitCost: { $ref: '#/components/schemas/Decimal', description: Holder's Legal-view unit cost }
              groupUnitCost: { $ref: '#/components/schemas/Decimal', description: 'Supplier''s Group-view unit cost (FR-39.17); absent means groupCostUnknown' }
    ProfitInInventoryPreview:
      type: object
      required: [currency, layers, total, fallbackCount, warnings]
      properties:
        currency: { type: string }
        layers:
          type: array
          items:
            type: object
            required: [id, basis, profit]
            properties:
              id: { type: string }
              basis: { type: string, enum: [GroupCost, MarginFallback] }
              profit: { type: string, description: 'quantity × (legal − group unit cost), or quantity × legal unit cost × margin' }
        total: { type: string }
        fallbackCount: { type: integer }
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    EquityMethodRequest:
      type: object
      additionalProperties: false
      required: [currency, ownershipPct, openingCarrying, netIncome]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        ownershipPct: { $ref: '#/components/schemas/Decimal', description: Above 0 and at most 50 }
        openingCarrying: { $ref: '#/components/schemas/Decimal', description: Investment carrying amount at the start of the period, not negative }
        netIncome: { $ref: '#/components/schemas/Decimal', description: Associate net income; negative for a loss }
        dividendsReceived: { $ref: '#/components/schemas/Decimal', description: Dividends paid to the investor, not negative }
    EquityMethodPreview:
      type: object
      required: [currency, shareOfProfit, unrecognizedLoss, closingCarrying, entries, balanced]
      properties:
        currency: { type: string }
        shareOfProfit: { type: string, description: 'ownership % × net income, a loss limited to the carrying amount' }
        unrecognizedLoss: { type: string, description: Share of a loss beyond the carrying amount (IAS 28.38) }
        closingCarrying: { type: string }
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
        balanced: { type: boolean }
    DivestitureRequest:
      type: object
      additionalProperties: false
      required: [currency, proceeds, netAssetsCarrying]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Group currency }
        proceeds: { $ref: '#/components/schemas/Decimal', description: Not negative }
        netAssetsCarrying: { $ref: '#/components/schemas/Decimal', description: Group carrying amount of the net assets disposed }
        goodwill: { $ref: '#/components/schemas/Decimal', description: Not negative }
        nciCarrying: { $ref: '#/components/schemas/Decimal', description: Not negative }
        ctaRecycled: { $ref: '#/components/schemas/Decimal', description: CTA recycled from OCI; positive is a gain }
    DivestiturePreview:
      type: object
      required: [currency, carryingAmount, gain]
      properties:
        currency: { type: string }
        carryingAmount: { type: string, description: net assets + goodwill − NCI }
        gain: { type: string, description: proceeds − carrying amount + CTA recycled }
    IcDifferenceRequest:
      type: object
      additionalProperties: false
      required: [currency, pairs]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Group currency }
        threshold: { $ref: '#/components/schemas/Decimal', description: 'consol.icThreshold, not negative; defaults to 1000.00' }
        pairs:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [pair, receivable, payable]
            properties:
              pair: { type: string, minLength: 1, description: Partner pair and FS item group }
              receivable: { $ref: '#/components/schemas/Decimal', description: Σ receivable side after translation }
              payable: { $ref: '#/components/schemas/Decimal', description: Σ payable side after translation }
    IcDifferencePreview:
      type: object
      required: [currency, threshold, taskStatus, pairs]
      properties:
        currency: { type: string }
        threshold: { type: string }
        taskStatus: { type: string, enum: [Completed, Error] }
        pairs:
          type: array
          items:
            type: object
            required: [pair, receivable, payable, difference, status, entries]
            properties:
              pair: { type: string }
              receivable: { type: string }
              payable: { type: string }
              difference: { type: string, description: receivable − payable }
              status: { type: string, enum: [Eliminated, Error] }
              code: { type: string, enum: [CNS-0905] }
              message: { type: string }
              entries:
                type: array
                items:
                  $ref: '#/components/schemas/Entry'
    ValidationRequest:
      type: object
      additionalProperties: false
      required: [units]
      properties:
        units:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            type: object
            additionalProperties: false
            required: [unitId, totalAssets, totalLiabilities, totalEquity, openingRetained, netIncome, closingRetained]
            properties:
              unitId: { type: string, minLength: 1 }
              totalAssets: { $ref: '#/components/schemas/Decimal' }
              totalLiabilities: { $ref: '#/components/schemas/Decimal' }
              totalEquity: { $ref: '#/components/schemas/Decimal' }
              openingRetained: { $ref: '#/components/schemas/Decimal' }
              netIncome: { $ref: '#/components/schemas/Decimal' }
              dividends: { $ref: '#/components/schemas/Decimal' }
              closingRetained: { $ref: '#/components/schemas/Decimal' }
              icItemsWithoutPartner: { type: integer, minimum: 0 }
    ValidationPreview:
      type: object
      required: [units, groupTranslation]
      properties:
        units:
          type: array
          items:
            type: object
            required: [unitId, status, rules]
            properties:
              unitId: { type: string }
              status: { type: string, enum: [Completed, CompletedWithWarnings, Error] }
              rules:
                type: array
                items:
                  type: object
                  required: [rule, severity, tolerance, difference, failed]
                  properties:
                    rule: { type: string, enum: [BS_BALANCES, RE_ROLL, IC_PARTNER_PRESENT] }
                    severity: { type: string, enum: [Error, Warning] }
                    tolerance: { type: string }
                    difference: { type: string }
                    failed: { type: boolean }
                    code: { type: string, enum: [CNS-0906] }
                    message: { type: string }
        groupTranslation: { type: string, enum: [NotStarted, Blocked] }
    DividendRequest:
      type: object
      additionalProperties: false
      required: [currency, ownershipPct, rate, amount]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Group currency }
        ownershipPct: { $ref: '#/components/schemas/Decimal', description: Parent ownership of the paying subsidiary, above 0 and at most 100 }
        rate: { $ref: '#/components/schemas/Decimal', description: Subsidiary-to-group rate on the dividend date, positive }
        amount: { $ref: '#/components/schemas/Decimal', description: Dividend declared in the subsidiary's currency, positive }
    DividendPreview:
      type: object
      required: [currency, entries, totals, rounding, balanced]
      properties:
        currency: { type: string }
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
        totals:
          $ref: '#/components/schemas/Totals'
        rounding: { type: string, description: Signed debit of the ROUNDING line; 0 when none was needed }
        balanced: { type: boolean }
    ReclassificationRule:
      type: object
      additionalProperties: false
      required: [code, level, type, sourceAccount, targetAccount]
      properties:
        code: { type: string, minLength: 1, description: Unique within the request }
        level: { type: string, enum: [Entity, Group], description: SignBased is Group; the other types are Entity }
        type: { type: string, enum: [DebitBalanceVendors, CreditBalanceCustomers, RemainingTerm, SignBased] }
        order: { type: integer, description: Run order; ties keep request order }
        version: { type: integer, minimum: 1, description: Defaults to 1 }
        sourceAccount: { type: string, minLength: 1 }
        targetAccount: { type: string, minLength: 1, description: Must differ from sourceAccount }
        threshold: { $ref: '#/components/schemas/Decimal', description: A balance must exceed it to move; default 0 }
        termMonths: { type: integer, minimum: 0, description: RemainingTerm only; 0 or absent means 12 }
    ReclassificationRequest:
      type: object
      additionalProperties: false
      required: [currency, periodEnd, rules]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        periodEnd: { type: string, format: date }
        rules:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/ReclassificationRule'
        openItems:
          type: array
          maxItems: 100000
          description: One entity's open items, read by Entity rules
          items:
            type: object
            additionalProperties: false
            required: [party, account, amount]
            properties:
              party: { type: string, minLength: 1 }
              account: { type: string, minLength: 1 }
              dueDate: { type: string, format: date, description: Needed by RemainingTerm }
              amount: { $ref: '#/components/schemas/Decimal', description: Signed; positive is a debit balance }
        balances:
          type: array
          maxItems: 100000
          description: Consolidated FS item balances, read by Group rules
          items:
            type: object
            additionalProperties: false
            required: [account, amount]
            properties:
              account: { type: string, minLength: 1 }
              amount: { $ref: '#/components/schemas/Decimal', description: Signed; positive is a debit balance }
    ReclassificationPreview:
      type: object
      required: [currency, periodEnd, dryRun, applied, lines, totals]
      properties:
        currency: { type: string }
        periodEnd: { type: string, format: date }
        dryRun: { type: boolean, const: true }
        applied: { type: array, items: { type: string }, description: Codes of the rules that produced lines, in run order }
        reversalDate: { type: string, format: date, description: First day of the next period; present when an entity-level line was produced (BR-40.14) }
        lines:
          type: array
          items:
            type: object
            required: [rule, level, account, debit, credit, reverses]
            properties:
              rule: { type: string }
              level: { type: string, enum: [Entity, Group] }
              account: { type: string }
              party: { type: string }
              debit: { type: string }
              credit: { type: string }
              reverses: { type: boolean }
        totals:
          $ref: '#/components/schemas/Totals'
    GroupJournalRequest:
      type: object
      additionalProperties: false
      required: [periodKey, documentType, currency, reason, attachmentRef, lines]
      properties:
        periodKey: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        documentType: { type: string, enum: [Adjustment, Reclassification, Elimination, CoI, Cumulative] }
        unitId: { type: string, description: Empty for a group-level journal }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Group currency }
        reason: { type: string, minLength: 1 }
        attachmentRef: { type: string, minLength: 1 }
        carryForward: { type: boolean }
        fiscalYearStartMonth: { type: integer, minimum: 1, maximum: 12, description: Defaults to 1 }
        approvalThreshold: { $ref: '#/components/schemas/Decimal', description: Positive; defaults to 100000.00 }
        lines:
          type: array
          minItems: 2
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [fsItem]
            properties:
              fsItem: { type: string, minLength: 1 }
              debit: { $ref: '#/components/schemas/Decimal', description: Exactly one of debit and credit is positive, at the currency minor unit }
              credit: { $ref: '#/components/schemas/Decimal' }
              partnerUnit: { type: string }
    GroupJournalPreview:
      type: object
      required: [currency, level, total, balanced, approvalThreshold, approvalRequired, periods, continuesPastYearEnd, warnings]
      properties:
        currency: { type: string }
        level: { type: string, enum: [Group, Unit] }
        total: { type: string, description: Debit total, tested against the threshold }
        balanced: { type: boolean }
        approvalThreshold: { type: string }
        approvalRequired: { type: boolean }
        periods: { type: array, items: { type: string }, description: Periods it posts in through the fiscal year end }
        continuesPastYearEnd: { type: boolean, description: A carried-forward Cumulative journal also applies after year end }
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, description: 'https://passage.dev/problems/<code>' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    StartRunRequest:
      type: object
      additionalProperties: false
      description: >-
        Either the units of the run (units) or collectionId, which derives them from a stored collection: the subsidiaries are the units the
        group holds a share of on the last day of the period; each one's net income and net assets come from its collected balances by account
        role (equity; income accounts), its rates from the collection and from the collection at the end of its previous fiscal year (opening
        net assets and rate), its acquisition figures from its stored terms (422 CNS-0930 without), and its intercompany amounts from its
        ic_sales, ic_cost and ic_receivable accounts with the ic overrides applied (the parent's payable and the unsold share cannot be read
        from a trial balance). With collectionId, groupId, period and currency may be left out.
      properties:
        groupId: { type: string, minLength: 1, maxLength: 64 }
        period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Group currency }
        collectionId: { type: string, format: uuid }
        ic:
          type: array
          items:
            type: object
            required: [unit]
            additionalProperties: false
            properties:
              unit: { type: string, format: uuid }
              icSales: { $ref: '#/components/schemas/Decimal' }
              icCost: { $ref: '#/components/schemas/Decimal' }
              unsoldShare: { $ref: '#/components/schemas/Decimal' }
              icReceivable: { $ref: '#/components/schemas/Decimal' }
              payableGroup: { $ref: '#/components/schemas/Decimal' }
        openingRates:
          type: array
          items:
            type: object
            required: [currency, rate]
            additionalProperties: false
            properties:
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              rate: { $ref: '#/components/schemas/Decimal' }
        units:
          type: array
          minItems: 1
          maxItems: 200
          items:
            allOf:
              - $ref: '#/components/schemas/EliminationRequest'
            type: object
            required: [id, openingNetAssets, closingNetAssets]
            description: Each unit takes the elimination inputs; rates.opening is required, currency defaults to the group currency and must equal it, and netIncome is the unit's net income for translation
            properties:
              id: { type: string, minLength: 1, maxLength: 64 }
              openingNetAssets: { $ref: '#/components/schemas/Decimal' }
              closingNetAssets: { $ref: '#/components/schemas/Decimal' }
    Run:
      type: object
      required: [id, groupId, period, currency, version, status, inputsHash, createdBy, unitCount, eliminationCount, ctaAmount, createdAt]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string }
        period: { type: string }
        currency: { type: string }
        version: { type: integer, minimum: 1, description: Per group, period and currency }
        status: { type: string, enum: [completed] }
        collectionId: { type: string, format: uuid, description: The collection the run was derived from; absent for a run computed from the units of the request }
        inputsHash: { type: string, description: SHA-256 of the run inputs }
        createdBy: { type: string }
        unitCount: { type: integer }
        eliminationCount: { type: integer }
        ctaAmount: { $ref: '#/components/schemas/Decimal', description: Sum of the unit CTA in group currency }
        createdAt: { type: string, format: date-time }
    RunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Run' }
        nextCursor: { type: string, format: uuid }
    RunDetail:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          required: [balances, eliminations]
          properties:
            balances:
              type: array
              items:
                type: object
                required: [unit, account, amount]
                properties:
                  unit: { type: string }
                  account: { type: string, enum: [OPENING_NET_ASSETS, NET_INCOME, CTA, CLOSING_NET_ASSETS, CTA_NCI_SHARE, CTA_GROUP_SHARE] }
                  amount: { $ref: '#/components/schemas/Decimal' }
            eliminations:
              type: array
              items:
                type: object
                required: [unit, rule, account, debit, credit]
                properties:
                  unit: { type: string }
                  rule: { type: string, enum: [E1, E2, E3, E4, E5] }
                  account: { type: string }
                  debit: { $ref: '#/components/schemas/Decimal' }
                  credit: { $ref: '#/components/schemas/Decimal' }
    RunStatements:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          required: [statements]
          properties:
            statements:
              type: array
              items:
                type: object
                required: [statement, line, amount]
                properties:
                  statement: { type: string, enum: [net_assets, income] }
                  line: { type: string }
                  amount: { $ref: '#/components/schemas/Decimal' }
