apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: migration
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: migration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migration
    spec:
      securityContext:
        runAsNonRoot: true
        {{- if .Values.fieldCrypt.keysSecret }}
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- if or .Values.fieldCrypt.keysSecret .Values.dropRoot.existingClaim }}
      volumes:
{{- if .Values.fieldCrypt.keysSecret }}
        - name: field-crypt
          secret:
            secretName: {{ .Values.fieldCrypt.keysSecret }}
            defaultMode: 0440
{{- end }}
{{- if .Values.dropRoot.existingClaim }}
        - name: drop-root
          persistentVolumeClaim:
            claimName: {{ .Values.dropRoot.existingClaim }}
            readOnly: true
{{- end }}
      {{- end }}
      containers:
        - name: migration
          image: {{ include "migration.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            # Operator allowlist for private addresses a connection profile may reach (CIDRs or host:port). Loopback,
            # link-local and metadata addresses stay denied whatever it says; tenants cannot change it.
            - name: MIG_EGRESS_ALLOW
              value: {{ concat .Values.egress.allowCidrs .Values.egress.allowHostPorts | join "," | quote }}
{{- if .Values.fieldCrypt.keysSecret }}
            - { name: FIELDCRYPT_KEYS_FILE, value: /var/run/passage/field-crypt/keys }
            - { name: FIELDCRYPT_CURRENT_KEY_ID, value: {{ .Values.fieldCrypt.currentKeyId | quote }} }
{{- end }}
{{- if .Values.dropRoot.path }}
            - { name: MIG_DROP_ROOT, value: {{ .Values.dropRoot.path | quote }} }
{{- end }}
          {{- if or .Values.fieldCrypt.keysSecret .Values.dropRoot.existingClaim }}
          volumeMounts:
{{- if .Values.fieldCrypt.keysSecret }}
            - { name: field-crypt, mountPath: /var/run/passage/field-crypt, readOnly: true }
{{- end }}
{{- if .Values.dropRoot.existingClaim }}
            - { name: drop-root, mountPath: {{ .Values.dropRoot.path | quote }}, readOnly: true }
{{- end }}
          {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
