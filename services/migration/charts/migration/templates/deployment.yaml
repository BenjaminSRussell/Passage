apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: migration
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: migration
  template:
    metadata:
      labels:
        {{- with include "passage.wiLabels" $ }}{{ . | nindent 8 }}{{- end }}
        app.kubernetes.io/name: migration
    spec:
      {{- with include "passage.wiServiceAccount" (dict "root" $ "name" "passage-migration") }}{{ . | nindent 6 }}{{- end }}
      securityContext:
        runAsNonRoot: true
        {{- if or .Values.fieldCrypt.keysSecret .Values.serviceIdentity.signingKeySecret }}
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- if or .Values.fieldCrypt.keysSecret .Values.dropRoot.existingClaim .Values.serviceIdentity.signingKeySecret }}
      volumes:
{{- if .Values.fieldCrypt.keysSecret }}
        - name: field-crypt
          secret:
            secretName: {{ .Values.fieldCrypt.keysSecret }}
            defaultMode: 0440
{{- end }}
{{- if .Values.serviceIdentity.signingKeySecret }}
        - name: service-identity
          secret:
            secretName: {{ .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
{{- end }}
{{- if .Values.dropRoot.existingClaim }}
        - name: drop-root
          persistentVolumeClaim:
            claimName: {{ .Values.dropRoot.existingClaim }}
            readOnly: true
{{- end }}
      {{- end }}
      containers:
        - name: migration
          image: {{ include "migration.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            {{- include "passage.cloudEnv" $ | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            # Operator allowlist for private addresses a connection profile may reach (CIDRs or host:port). Loopback,
            # link-local and metadata addresses stay denied whatever it says; tenants cannot change it.
            - name: MIG_EGRESS_ALLOW
              value: {{ concat .Values.egress.allowCidrs .Values.egress.allowHostPorts | join "," | quote }}
{{- if .Values.fieldCrypt.keysSecret }}
            - { name: FIELDCRYPT_KEYS_FILE, value: /var/run/passage/field-crypt/keys }
            - { name: FIELDCRYPT_CURRENT_KEY_ID, value: {{ .Values.fieldCrypt.currentKeyId | quote }} }
{{- end }}
{{- if .Values.dropRoot.path }}
            - { name: MIG_DROP_ROOT, value: {{ .Values.dropRoot.path | quote }} }
{{- end }}
            # The loader signs its calls to the owning services as the service named "migration". With any address set
            # and a signing key, POST /v1/integration/migration-runs extracts and loads; without them it answers 501.
            - { name: PASSAGE_SERVICE_NAME, value: migration }
{{- if .Values.serviceIdentity.signingKeySecret }}
            - { name: PASSAGE_SERVICE_SIGNING_KEY_FILE, value: /var/run/passage/service-identity/signing-key }
{{- if .Values.serviceIdentity.keyId }}
            - { name: PASSAGE_SERVICE_KEY_ID, value: {{ .Values.serviceIdentity.keyId | quote }} }
{{- end }}
{{- end }}
{{- with .Values.serviceIdentity.publicKeys }}
            # Callers' public keys (name[:kid]=base64,...): the integration hub's key lets it call the outbound render
            # and xref:record routes (integration track S5).
            - { name: PASSAGE_SERVICE_PUBLIC_KEYS, value: {{ . | quote }} }
{{- end }}
{{- with .Values.targets.partyUrl }}
            - { name: MIG_TARGET_PARTY_URL, value: {{ . | quote }} }
{{- end }}
{{- with .Values.targets.productUrl }}
            - { name: MIG_TARGET_PRODUCT_URL, value: {{ . | quote }} }
{{- end }}
{{- with .Values.targets.receivablesUrl }}
            - { name: MIG_TARGET_RECEIVABLES_URL, value: {{ . | quote }} }
{{- end }}
{{- with .Values.targets.engineeringUrl }}
            - { name: MIG_TARGET_ENGINEERING_URL, value: {{ . | quote }} }
{{- end }}
{{- if eq (toString .Values.sync.enabled) "false" }}
            - { name: MIG_SYNC_ENABLED, value: "false" }
{{- end }}
{{- with .Values.sync.interval }}
            - { name: MIG_SYNC_INTERVAL, value: {{ . | quote }} }
{{- end }}
          {{- if or .Values.fieldCrypt.keysSecret .Values.dropRoot.existingClaim .Values.serviceIdentity.signingKeySecret }}
          volumeMounts:
{{- if .Values.fieldCrypt.keysSecret }}
            - { name: field-crypt, mountPath: /var/run/passage/field-crypt, readOnly: true }
{{- end }}
{{- if .Values.serviceIdentity.signingKeySecret }}
            - { name: service-identity, mountPath: /var/run/passage/service-identity, readOnly: true }
{{- end }}
{{- if .Values.dropRoot.existingClaim }}
            - { name: drop-root, mountPath: {{ .Values.dropRoot.path | quote }}, readOnly: true }
{{- end }}
          {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
