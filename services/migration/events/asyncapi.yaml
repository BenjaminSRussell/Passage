asyncapi: 3.0.0
info:
  title: migration
  version: 0.2.0
  description: |
    CloudEvents 1.0 envelope from platform/go/events; payloads below are the data member. The scheduled delta sync
    (integration track S4) publishes one event per sync run through the outbox, in the transaction that ends the run's
    claim and moves (or keeps) the binding's watermark. Target contexts emit their own events when rows are loaded
    through their public APIs.
channels:
  passage.migration.syncrun:
    address: passage.migration.syncrun
    messages:
      completed:
        $ref: '#/components/messages/syncRunCompleted'
      failed:
        $ref: '#/components/messages/syncRunFailed'
  passage.migration.syncabsent:
    address: passage.migration.syncabsent
    messages:
      detected:
        $ref: '#/components/messages/syncAbsentDetected'
operations:
  onSyncRunCompleted:
    action: send
    channel: { $ref: '#/channels/passage.migration.syncrun' }
    messages: [{ $ref: '#/channels/passage.migration.syncrun/messages/completed' }]
  onSyncRunFailed:
    action: send
    channel: { $ref: '#/channels/passage.migration.syncrun' }
    messages: [{ $ref: '#/channels/passage.migration.syncrun/messages/failed' }]
  onSyncAbsentDetected:
    action: send
    channel: { $ref: '#/channels/passage.migration.syncabsent' }
    messages: [{ $ref: '#/channels/passage.migration.syncabsent/messages/detected' }]
components:
  messages:
    syncRunCompleted:
      name: completed
      title: Sync run completed
      description: A scheduled delta run ended succeeded or partial. The watermark in the payload is the one now stored for the binding (unchanged when the source has no cursor). Rejected counts rows refused by the mapping or a target, and conflicted counts legacy rows held back because Passage is the source of truth.
      payload:
        $ref: '#/components/schemas/SyncRunData'
      x-passage-type: dev.passage.migration.syncrun.completed.v1
    syncRunFailed:
      name: failed
      title: Sync run failed
      description: A scheduled delta run failed (source unreachable, mapping missing, or rows a target did not take). The binding's watermark was not moved, so the next run reads the same rows again; consecutiveFailures drives the backoff (15 minutes doubling from the third failure, at most 24 hours) and nextDueAt includes it.
      payload:
        $ref: '#/components/schemas/SyncRunData'
      x-passage-type: dev.passage.migration.syncrun.failed.v1
    syncAbsentDetected:
      name: detected
      title: Legacy rows no longer in the source
      description: A full read of a binding (the periodic key check of a binding with a cursor, or any run of a binding without one) did not find source keys that earlier runs loaded, and at least one of them was not already listed as absent. Nothing is deactivated in Passage; the keys are listed at GET /v1/integration/sync-status/{id}/absent. Published in the transaction that stores the list.
      payload:
        $ref: '#/components/schemas/SyncAbsentData'
      x-passage-type: dev.passage.migration.syncabsent.detected.v1
  schemas:
    SyncAbsentData:
      type: object
      required: [bindingId, entity, absentCount, newlyAbsent, sampleKeys]
      properties:
        bindingId: { type: string, format: uuid }
        entity: { type: string }
        runId: { type: string, format: uuid, description: The run whose full read found the keys missing. }
        absentCount: { type: integer, description: All keys now listed as absent for the binding. }
        newlyAbsent: { type: integer, description: Keys that were not listed before this read. }
        sampleKeys: { type: array, maxItems: 20, items: { type: string }, description: Up to 20 of the newly absent keys, in key order. }
    SyncRunData:
      type: object
      required: [bindingId, entity, status, extracted, loaded, rejected, conflicted, watermark, consecutiveFailures]
      properties:
        bindingId: { type: string, format: uuid }
        entity: { type: string }
        runId: { type: string, format: uuid, description: The migration run row; absent when the run could not be recorded. }
        status: { type: string, enum: [succeeded, partial, failed] }
        extracted: { type: integer }
        loaded: { type: integer, description: Rows created or updated in the target contexts. }
        rejected: { type: integer }
        conflicted: { type: integer }
        watermark: { type: string }
        consecutiveFailures: { type: integer }
        nextDueAt: { type: string, format: date-time }
        error: { type: string, description: Credential-free reason, on failed only. }
