        content: { application/json: { schema: { $ref: '#/components/schemas/CreateLookupTable' } } }
      responses:
        '201':
          description: The table was created at version 1.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LookupTable' } } }
        '200':
          description: The Idempotency-Key was replayed; the stored table is returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/LookupTable' } } }
        '400':
          description: The name or the definition is missing or malformed.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-LOOKUP-NAME-EXISTS, a table with this name already exists.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-LOOKUP-INVALID, the definition is not valid; or idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/lookup-tables/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getLookupTable
      summary: Get a lookup table
      description: Returns the table with the entries of its current version, or of the version named in the query.
      x-passage-duty: migration.run
      parameters:
        - { name: version, in: query, description: A version to read instead of the current one., schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The table and one version's entries.
          content: { application/json: { schema: { $ref: '#/components/schemas/LookupTable' } } }
        '400':
          description: The version is not a positive integer.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: MIG-LOOKUP-NOT-FOUND or MIG-LOOKUP-VERSION-NOT-FOUND.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateLookupTable
      summary: Change a lookup table
      description: Writes the next version under the caller's version (409 MIG-VERSION-CONFLICT when it is stale). A new definition replaces all entries and keeps the table's kind; a rename or an archive carries the current entries into the new version. An archived table does not resolve (renders that need it are unresolved); it can only be reactivated.
      x-passage-duty: migration.project.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateLookupTable' } } }
      responses:
        '200':
          description: The table at its new version.
          content: { application/json: { schema: { $ref: '#/components/schemas/LookupTable' } } }
        '400':
          description: The version, name or status is missing or malformed.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: MIG-LOOKUP-NOT-FOUND.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-VERSION-CONFLICT, MIG-LOOKUP-NAME-EXISTS or MIG-LOOKUP-ARCHIVED.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-LOOKUP-INVALID, the definition is not valid or changes the kind.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/lookup-tables/{id}/versions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listLookupTableVersions
      summary: List the versions of a lookup table
      description: The history of a table, newest first, with each version's entry count, checksum, author and time.
      x-passage-duty: migration.run
      responses:
        '200':
          description: The versions.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LookupVersion' } } } } } }
        '404':
          description: MIG-LOOKUP-NOT-FOUND.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/lookup-tables/{id}:import:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: importLookupTableEntries
      summary: Import entries into a lookup table from CSV
      description: "Reads a CSV file and writes the next version of the table under the caller's version (409 MIG-VERSION-CONFLICT when it is stale). One entry per line: the key parts in the leading cells (up to three) and the value in the last cell, for example from,to,factor for a unit table or item,currency,price for a price list; a key already joined with | reads the same. Mode merge keeps the entries the file does not mention, replace keeps only the file's. A line that is not valid for the table's kind, or a key that appears twice, is reported with its line (at most ten lines, MIG-LOOKUP-INVALID) and nothing is saved. A file that changes nothing writes no version (written is false). The table still holds at most 5000 entries after the import. An archived table is refused."
      x-passage-duty: migration.project.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ImportLookupEntries' } } }
      responses:
        '200':
          description: The table (at its new version when written is true) and what the import did to its entries.
          content: { application/json: { schema: { $ref: '#/components/schemas/LookupImportResult' } } }
        '400':
          description: The version, mode or csv is missing or malformed.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: MIG-LOOKUP-NOT-FOUND.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-VERSION-CONFLICT or MIG-LOOKUP-ARCHIVED.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-LOOKUP-INVALID, the file has no entries, a line is not valid for the kind, or the result exceeds 5000 entries.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/lookup-tables/{id}/entries.csv:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: exportLookupTableEntries
      summary: Export a lookup table as CSV
      description: The entries of the current version, or of the version named in the query, as CSV in key order, one entry per line with the key parts in separate cells and the value last, no header line. A cell that a spreadsheet would run as a formula (starting with = + - @, a tab or a carriage return, after any apostrophes) is written with one more leading apostrophe, which the import removes again, so the file can be edited and imported back unchanged.
      x-passage-duty: migration.run
      parameters:
        - { name: version, in: query, description: A version to export instead of the current one., schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The entries as an attachment named <table>-v<version>.csv.
          content: { text/csv: { schema: { type: string } } }
        '400':
          description: The version is not a positive integer.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: MIG-LOOKUP-NOT-FOUND or MIG-LOOKUP-VERSION-NOT-FOUND.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/parallel-run-diffs:
    post:
      operationId: createParallelRunDiff
      summary: Create a parallel-run diff (deferred)
      description: Reserved for wave 49. Every call answers 501 today.
      x-passage-duty: migration.run
      responses:
        '202':
          description: Reserved. Accepted once the parallel-run harness ships in wave 49; today the service answers 501.
        '501':
          description: MIG-PARALLEL-RUN-DEFERRED, the parallel-run diff harness belongs to wave 49.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      summary: Liveness probe
      description: Answers 200 while the process is running.
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      summary: Readiness probe
      description: Answers 200 when the database is reachable.
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
components:
  responses:
    Problem:
      description: RFC 9457 problem. 400 COM-0001, 401 AUTH-0001, 403 AUTH-0003, 404 AUTH-0404, 409 MIG-VERSION-CONFLICT, 422 idempotency_key_reuse, MIG-MAP-*, MIG-PKG-*, MIG-CONNECTION-UNKNOWN or MIG-SPEC-UNKNOWN, 501 MIG-SECRETS-NOT-CONFIGURED or MIG-EXTRACT-NOT-CONFIGURED.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    CreateMigrationRun:
      type: object
      additionalProperties: false
      description: Exactly one of mapping or mappingSpecId is required.
      required: [sourceSystem, mode]
      properties:
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        mode: { type: string, enum: [rehearsal, cutover, delta] }
        dryRun: { type: boolean }
        mapping: { type: object, description: "Mapping DSL document with entity, version and fields." }
        mappingSpecId: { type: string, format: uuid, description: A published mapping spec to run instead of an inline mapping. }
        dataTemplateId: { type: string, format: uuid, description: A published data template whose defaults fill absent source fields before mapping. It must be for the mapping's entity and default only mapping targets filled from a source column. }
        projectId: { type: string, format: uuid, description: "A migrate project to run under. Its source system must equal sourceSystem, it must be active, and only one run per project executes at a time (409 MIG-RUN-ACTIVE). Omit for a run outside any project." }
    MigrationRunAccepted:
      type: object
      required: [jobId, statusUrl, estimatedCompletionSeconds, run]
      properties:
        jobId: { type: string, format: uuid }
        statusUrl: { type: string }
        estimatedCompletionSeconds: { type: integer }
        run: { $ref: '#/components/schemas/MigrationRun' }
    MigrationRun:
      type: object
      required: [id, sourceSystem, mode, entity, status, dryRun, mappingVersion, counts, rejects, warnings, absent, createdAt]
      properties:
        id: { type: string, format: uuid }
        sourceSystem: { type: string }
        mode: { type: string }
        entity: { type: string }
        status: { type: string, enum: [succeeded, partial, failed] }
        dryRun: { type: boolean }
        mappingVersion: { type: integer }
        parentRunId: { type: string, format: uuid }
        mappingSpecId: { type: string, format: uuid }
        dataTemplateId: { type: string, format: uuid, description: "The data template the run applied, kept on re-runs." }
        projectId: { type: string, format: uuid, description: "The migrate project the run belongs to, kept on re-runs." }
        bindingId: { type: string, format: uuid, description: "The entity binding a scheduled delta sync run read; absent on runs started by a person." }
        watermark: { type: string, description: "The largest change cursor the run read; the sync scheduler stores it only when the run did not fail." }
        counts:
          type: object
          required: [extracted, mapped, created, updated, unchanged, templated, conflicted, rejected, warned]
          properties: { extracted: { type: integer }, mapped: { type: integer }, created: { type: integer }, updated: { type: integer }, unchanged: { type: integer }, templated: { type: integer, description: Mapped rows that took at least one data template default. }, conflicted: { type: integer, description: Legacy rows held back because Passage is the source of truth (each also appears in rejects as MIG-TARGET-DRIFT). }, rejected: { type: integer }, warned: { type: integer, description: Loaded rows that carry at least one warning. } }
        rejects:
          type: array
          items:
            type: object
            required: [sourceKey, rejects]
            properties:
              sourceKey: { type: string }
              rejects: { type: array, items: { type: object, required: [field, code, detail], properties: { field: { type: string }, code: { type: string }, detail: { type: string } } } }
        warnings:
          type: array
          description: Rows still mapped and loaded, with MIG-MAP-ENUM-DEFAULT or MAP-PRECISION-LOSS warnings.
          items:
            type: object
            required: [sourceKey, warnings]
            properties:
              sourceKey: { type: string }
              warnings: { type: array, items: { type: object, required: [field, code, detail], properties: { field: { type: string }, code: { type: string }, detail: { type: string } } } }
        absent: { type: array, items: { type: string }, description: Source keys loaded earlier and missing from this extract; never deleted. }
        reconciliation:
          type: object
          required: [source, target, checks]
          properties:
            source: { type: integer }
            target: { type: integer }
            checks: { type: array, items: { type: object, required: [name, ok, detail], properties: { name: { type: string, enum: [row_count, hash_total, sample_compare] }, ok: { type: boolean }, detail: { type: string } } } }
        createdAt: { type: string, format: date-time }
    LedgerRow:
      type: object
      required: [sourceKey, action, defaultFromTemplate]
      properties:
        sourceKey: { type: string }
        targetId: { type: string, format: uuid, description: Absent on a dry run that created the row. }
        action: { type: string, enum: [created, updated, unchanged] }
        defaultFromTemplate: { type: array, items: { type: string }, description: Mapping targets filled from the data template for this row. }
    PublishDataTemplate:
      type: object
      additionalProperties: false
      required: [name, entity, version, defaults]
      properties:
        name: { type: string, maxLength: 80 }
        entity: { type: string }
        version: { type: integer, minimum: 1 }
        defaults: { type: object, minProperties: 1, maxProperties: 200, additionalProperties: { type: string, maxLength: 500 }, description: Mapping target to default value; each value must satisfy the target's type. }
    XrefEntry:
      type: object
      required: [sourceSystem, entity, sourceKey, targetId, updatedAt]
      properties:
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        entity: { type: string }
        sourceKey: { type: string }
        targetId: { type: string, format: uuid }
        contentHash: { type: string }
        mergedIntoTargetId: { type: string, format: uuid, description: Set when the record was merged into another Passage record. }
        legalEntityId: { type: string, format: uuid, description: "The legal entity of the target record. Absent for tenant-wide master data (party, product, item) and for rows loaded before the legal entity was recorded that no stored data could place. An outbound lookup for a legal entity resolves its own rows and the rows without one, never another legal entity's." }
        updatedAt: { type: string, format: date-time }
    XrefCount:
      type: object
      required: [sourceSystem, entity, count]
      properties:
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        entity: { type: string }
        count: { type: integer, minimum: 1 }
    SourceSystem:
      type: string
      pattern: '^(ax2012|d365fo|sap_ecc|sap_s4|custom_[a-z0-9_]{1,40})$'
      description: ax2012, d365fo, sap_ecc, sap_s4, or custom_<name> (lowercase letters, digits and underscores, 1 to 40 after custom_) for a customer's own ERP.
    EntityBinding:
      type: object
      required: [id, connectionProfileId, entity, source, keyFields, status, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        connectionProfileId: { type: string, format: uuid }
        entity: { type: string, description: The Passage entity this source feeds, for example customer. }
        source: { $ref: '#/components/schemas/BindingSource' }
        keyFields: { type: array, minItems: 1, maxItems: 5, items: { type: string }, description: The columns or JSON paths whose values joined with "|" make the source key used by the cross-reference. }
        cursorField: { type: string, description: The change stamp column or JSON path delta sync will compare. }
        cursorType: { type: string, enum: [timestamp, int, rowversion] }
        mappingSpecId: { type: string, format: uuid, description: The published mapping spec previews use by default. }
        status: { type: string, enum: [active, disabled] }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BindingSource:
      type: object
      additionalProperties: false
      description: Where the rows are. The allowed keys depend on the profile's kind; any other key is refused.
      properties:
        schema: { type: string, description: sql. Optional schema of the table. }
        table: { type: string, description: sql. A plain table or view name; give this or query. }
        columns: { type: array, maxItems: 200, items: { type: string }, description: sql, with table. Must include the key fields and the cursor field. }
        query: { type: string, maxLength: 8000, description: "sql. One read-only SELECT, optionally led by WITH, accepted by the read-only query guard: no second statement, no word that writes, locks, waits or reaches outside the database, and no construct engines read differently (backslashes or prefixes on string literals, # or /*! */ or nested comments, -- without a following space, $ ? @ { }, a call through a quoted name); quote unusual names with double quotes. It may use :watermark once or more as the bind value of the last watermark. Comments are dropped and the query is wrapped as a derived table (or the last CTE after WITH) and paged by keyset on the cursor field and key fields, so do not add ORDER BY or a row limit; a NULL in a key or cursor column fails the extraction. The profile's login must be read-only: on SQL Server it and this guard are the only protection against writes." }
        path: { type: string, description: "rest. Absolute path under the profile's baseUrl, without query or fragment." }
        recordsPath: { type: string, description: "rest and file (json). Dotted path of the record array in the JSON body; omit when the body is the array." }
        params: { type: object, additionalProperties: { type: string }, description: "rest. Plain query parameters, at most 20. Credentials belong in the connection profile." }
        changedSinceParam: { type: string, description: "rest. Query parameter that carries the last watermark so the source filters; without it rows are filtered after reading." }
        paging:
          type: object
          additionalProperties: false
          description: rest. How the endpoint pages.
          properties:
            style: { type: string, enum: [none, page, offset, cursor, link, odata, skiptoken] }
            pageSize: { type: integer, minimum: 1, maximum: 1000 }
            limitParam: { type: string }
            offsetParam: { type: string }
            pageParam: { type: string }
            firstPage: { type: integer, enum: [0, 1] }
            cursorParam: { type: string }
            cursorPath: { type: string, description: Dotted path of the next cursor in the response; required for style cursor. }
        file: { type: string, description: "file. A plain file name in the profile's drop directory." }
        filePattern: { type: string, description: "file. A name pattern with * and ?; the newest match by name is read." }
    CreateEntityBinding:
      type: object
      additionalProperties: false
      required: [connectionProfileId, entity, source, keyFields]
      properties:
        connectionProfileId: { type: string, format: uuid }
        entity: { type: string, pattern: '^[a-z][a-z0-9_.\-]{0,63}$' }
        source: { $ref: '#/components/schemas/BindingSource' }
        keyFields: { type: array, minItems: 1, maxItems: 5, items: { type: string } }
        cursorField: { type: string }
        cursorType: { type: string, enum: [timestamp, int, rowversion] }
        mappingSpecId: { type: string, format: uuid }
    UpdateEntityBinding:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        source: { $ref: '#/components/schemas/BindingSource' }
        keyFields: { type: array, minItems: 1, maxItems: 5, items: { type: string } }
        cursorField: { type: string }
        cursorType: { type: string, enum: ['', timestamp, int, rowversion] }
        mappingSpecId: { type: string, description: "A published spec id (a UUID) for the binding's entity, or empty to clear." }
        status: { type: string, enum: [active, disabled] }
    PreviewEntityBinding:
      type: object
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 1, maximum: 100, default: 10 }
        mappingSpecId: { type: string, format: uuid }
        mapping: { type: object, description: An inline mapping document for the binding's entity. }
        upload:
          type: object
          additionalProperties: false
          required: [name, contentBase64]
          description: file profiles only. Read this content instead of the drop directory.
          properties:
            name: { type: string, description: The file name, which picks the format by its extension. }
            contentBase64: { type: string, description: Base64 content, at most 4 MiB decoded. }
    PreviewDraftEntityBinding:
      type: object
      additionalProperties: false
      required: [connectionProfileId, entity, source, keyFields]
      properties:
        connectionProfileId: { type: string, format: uuid }
        entity: { type: string }
        source: { $ref: '#/components/schemas/BindingSource' }
        keyFields: { type: array, minItems: 1, maxItems: 5, items: { type: string } }
        cursorField: { type: string }
        cursorType: { type: string, enum: [timestamp, int, rowversion] }
        limit: { type: integer, minimum: 1, maximum: 100, default: 10 }
        mappingSpecId: { type: string, format: uuid }
        mapping: { type: object }
        upload:
          type: object
          additionalProperties: false
          required: [name, contentBase64]
          properties:
            name: { type: string }
            contentBase64: { type: string }
    BindingPreview:
      type: object
      required: [ok, durationMs]
      properties:
        ok: { type: boolean }
        durationMs: { type: integer }
        failure:
          type: object
          required: [code, message]
          description: Present when ok is false. Codes are those of a connection test (MIG-EGRESS-DENIED, MIG-CONNECT-FAILED, MIG-AUTH-FAILED, MIG-PROBE-FAILED, MIG-SECRET-MISSING) with the source's own message, which never contains the secret.
          properties:
            code: { type: string }
            message: { type: string }
        mapping:
          type: object
          description: The mapping that was run; absent when the preview ran without one.
          properties:
            entity: { type: string }
            version: { type: integer }
            mappingSpecId: { type: string, format: uuid }
        rows:
          type: array
          items:
            type: object
            required: [index, source]
            properties:
              index: { type: integer, minimum: 1 }
              sourceKey: { type: string, description: Absent when a key field is missing. }
              source: { type: object, description: The row as read, long text cut at 500 bytes. }
              target: { type: object, description: The mapped record; absent when the row is rejected or no mapping ran. }
              warnings:
                type: array
                items: { type: object, properties: { field: { type: string }, code: { type: string }, detail: { type: string } } }
              rejects:
                type: array
                description: Rule errors, or MIG-ROW-NO-KEY when a key field is missing.
                items: { type: object, properties: { field: { type: string }, code: { type: string }, detail: { type: string } } }
        columns: { type: array, items: { type: string }, description: Source column or field names seen in the sample. }
        more: { type: boolean, description: True when the source holds more rows than the sample. }
        mapped: { type: integer, description: Sampled rows with no reject; 0 without a mapping. }
        rejected: { type: integer }
        duplicateKeys: { type: array, items: { type: string }, description: Source keys that repeat inside the sample. }
        watermark: { type: string, description: The largest cursor value in the sample. }
    ConnectionProfile:
      type: object
      required: [id, name, kind, sourceSystem, config, secretSet, status, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        kind: { type: string, enum: [sql, rest, file] }
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        config: { $ref: '#/components/schemas/ConnectionConfig' }
        secretSet: { type: boolean, description: Whether a secret is stored. The secret itself is never returned. }
        secretUpdatedAt: { type: string, format: date-time, description: When the secret was last set. }
        status: { type: string, enum: [active, disabled] }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConnectionConfig:
      type: object
      additionalProperties: false
      description: Non-secret settings only. The allowed keys depend on the kind; a key that looks like a secret is refused with 400 and the value is set with PUT .../secret.
      properties:
        driver: { type: string, enum: [postgres, sqlserver, mysql, oracle], description: "sql. sqlserver is go-mssqldb, mysql is go-sql-driver/mysql, oracle is go-ora (the service name goes in database)." }
        host: { type: string, maxLength: 253, description: sql. A host name or IP address. }
        port: { type: integer, minimum: 1, maximum: 65535, description: sql. Default 5432 (postgres), 1433 (sqlserver), 3306 (mysql), 1521 (oracle). }
        database: { type: string, maxLength: 255, description: sql. }
        user: { type: string, maxLength: 255, description: sql. The password is the secret. }
        sslmode: { type: string, enum: [disable, require, verify-ca, verify-full], description: sql. Default require. }
        baseUrl: { type: string, maxLength: 255, description: "rest. https URL (http only without authentication) with no credentials, query or fragment." }
        authType: { type: string, enum: [none, basic, bearer, header, oauth2_client], description: "rest. The secret is the password, token, header value or OAuth2 client secret." }
        authUrl: { type: string, maxLength: 512, description: "rest, authType oauth2_client. The token endpoint (https)." }
        clientId: { type: string, maxLength: 255, description: "rest, authType oauth2_client." }
        scope: { type: string, maxLength: 255, description: "rest, authType oauth2_client. Space separated." }
        username: { type: string, maxLength: 255, description: "rest, authType basic." }
        headerName: { type: string, maxLength: 64, description: "rest, authType header." }
        pagingStyle: { type: string, enum: [none, offset, page, cursor, link], description: rest. }
        probePath: { type: string, maxLength: 255, description: "rest. Path appended to baseUrl for the test request, for example /health." }
        dropDir: { type: string, maxLength: 255, description: file. A clean relative path under the operator-mounted drop root. }
        format: { type: string, enum: [csv, tsv, json, jsonl], description: file. }
        delimiter: { type: string, minLength: 1, maxLength: 1, description: file. }
        filePattern: { type: string, maxLength: 100, description: "file. Name pattern with * and ?." }
        codepage: { type: string, maxLength: 255, description: "An IANA character set name such as utf-8, windows-1252 or iso-8859-1." }
        timezone: { type: string, maxLength: 255, description: An IANA zone name such as Europe/Berlin. }
    CreateConnectionProfile:
      type: object
      additionalProperties: false
      required: [name, kind, sourceSystem, config]
      properties:
        name: { type: string, maxLength: 80 }
        kind: { type: string, enum: [sql, rest, file] }
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        config: { $ref: '#/components/schemas/ConnectionConfig' }
    UpdateConnectionProfile:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 80 }
        status: { type: string, enum: [active, disabled] }
        config: { $ref: '#/components/schemas/ConnectionConfig' }
    SetConnectionSecret:
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: "The password, token or key value." }
    ConnectionTestResult:
      type: object
      required: [ok, kind, durationMs]
      properties:
        ok: { type: boolean }
        kind: { type: string, enum: [sql, rest, file] }
        durationMs: { type: integer }
        failure:
          type: object
          required: [code, message]
          description: Present when ok is false. Codes are MIG-EGRESS-DENIED, MIG-CONNECT-FAILED, MIG-AUTH-FAILED, MIG-PROBE-FAILED, MIG-SECRET-MISSING, MIG-DROP-NOT-CONFIGURED and MIG-DROP-MISSING.
          properties:
            code: { type: string }
            message: { type: string }
        serverVersion: { type: string, description: sql. }
        schemas: { type: array, items: { type: string }, description: "sql. Non-system schemas, at most 50." }
        tables:
          type: array
          description: sql. At most 200 tables; columns are listed for the first 20.
          items:
            type: object
            required: [schema, name, type]
            properties:
              schema: { type: string }
              name: { type: string }
              type: { type: string }
              columns:
                type: array
                items:
                  type: object
                  required: [name, type, nullable]
                  properties:
                    name: { type: string }
                    type: { type: string }
                    nullable: { type: boolean }
        httpStatus: { type: integer, description: rest. The status the endpoint answered. }
        fileCount: { type: integer, description: file. Files matching filePattern in the drop directory. }
        files:
          type: array
          description: file. The first 20 matching files.
          items:
            type: object
            required: [name, bytes]
            properties:
              name: { type: string }
              bytes: { type: integer }
        truncated: { type: boolean, description: True when a list was cut at its limit. }
    MigrationProject:
      type: object
      required: [id, name, projectType, status, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        projectType: { type: string, enum: [migrate, copy, config_package] }
        sourceSystem: { $ref: '#/components/schemas/SourceSystem', description: Migrate projects only. }
        sourceLegalEntityId: { type: string, format: uuid, description: Copy projects only. }
        targetLegalEntityId: { type: string, format: uuid, description: "The legal entity a copy project copies into, or the legal entity a migrate project lands its data in." }
        connectionProfileId: { type: string, format: uuid, description: Migrate projects only. The connection profile the project reads from. }
        status: { type: string, enum: [active, archived] }
        cutoverAt: { type: string, format: date-time }
        scheduleCron: { type: string, maxLength: 100, description: "Five-field cron expression (numbers, ranges, lists and steps; no names or macros) for recurring incremental imports, at least 15 minutes between runs, or the tenant's recurringMinIntervalMin when that is longer (FR-10.16), read in scheduleTimezone. The delta sync scheduler runs it for the bindings of the project's connection profile." }
        scheduleTimezone: { type: string, maxLength: 64, description: "IANA time zone name the scheduleCron is read in, UTC unless set; a nonexistent local time (02:30 on a spring-forward day) runs once, at the instant it would have shown." }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateMigrationProject:
      type: object
      additionalProperties: false
      description: A migrate project needs sourceSystem; a copy project needs two different legal entities and no source system; a config_package project takes neither.
      required: [name, projectType]
      properties:
        name: { type: string, maxLength: 80 }
        projectType: { type: string, enum: [migrate, copy, config_package] }
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        sourceLegalEntityId: { type: string, format: uuid }
        targetLegalEntityId: { type: string, format: uuid, description: "Required for a copy project (different from the source); optional for a migrate project, which has no source legal entity." }
        connectionProfileId: { type: string, format: uuid, description: Migrate projects only. The connection profile the project reads from; it must be active and have the same source system. }
        cutoverAt: { type: string, format: date-time }
        scheduleCron: { type: string, maxLength: 100, description: Five-field cron expression with at least 15 minutes between runs (FR-10.16). Read in scheduleTimezone. }
        scheduleTimezone: { type: string, maxLength: 64, description: IANA time zone name (Europe/Berlin) the cron is read in; empty is UTC. Daylight saving time never runs a schedule twice. }
    UpdateMigrationProject:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 80 }
        status: { type: string, enum: [active, archived] }
        cutoverAt: { type: string, description: "RFC 3339 timestamp, or empty to clear." }
        scheduleCron: { type: string, maxLength: 100, description: "Five-field cron expression with at least 15 minutes between runs, or empty to clear." }
        scheduleTimezone: { type: string, maxLength: 64, description: IANA time zone name the cron is read in; empty resets it to UTC. }
        connectionProfileId: { type: string, description: "Attaches a connection profile (a UUID, active, with the project's source system) to a migrate project; empty detaches it." }
    KeyRewrite:
      type: object
      additionalProperties: false
      required: [field, from, to]
      properties:
        field: { type: string, maxLength: 100, description: "A field name, or \"@key\" for the record's own natural key." }
        from: { type: string, minLength: 1, maxLength: 100, description: A value of the field starting with this text has it replaced. }
        to: { type: string, maxLength: 100 }
    KeyRewriteRules:
      type: object
      required: [version, items]
      properties:
        version: { type: integer, minimum: 1, description: The project version; send it with the next replacement. }
        items: { type: array, items: { $ref: '#/components/schemas/KeyRewrite' } }
    ReplaceKeyRewriteRules:
      type: object
      additionalProperties: false
      required: [version, rules]
      properties:
        version: { type: integer, minimum: 1 }
        rules: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/KeyRewrite' } }
    PreviewKeyRewrite:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys: { type: array, minItems: 1, maxItems: 200, items: { type: string, maxLength: 200 } }
        rules: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/KeyRewrite' }, description: Rules to try instead of the stored ones. An empty list rewrites nothing. }
    KeyRewritePreview:
      type: object
      required: [key, rewritten, changed]
      properties:
        key: { type: string }
        rewritten: { type: string }
        changed: { type: boolean }
    DataTemplate:
      type: object
      required: [id, entity, name, version, checksum, defaultCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        entity: { type: string }
        name: { type: string }
        version: { type: integer }
        checksum: { type: string, description: SHA-256 of the canonical template JSON. }
        defaultCount: { type: integer }
        defaults: { type: object, additionalProperties: { type: string }, description: Present on the single-template read and on publish. }
        createdAt: { type: string, format: date-time }
    MigrationSettings:
      type: object
      required: [recurringMinIntervalMin, version]
      properties:
        recurringMinIntervalMin: { type: integer, minimum: 15, maximum: 1440, description: "mig.recurring.min_interval_min: the shortest gap, in minutes, between two scheduled runs of a project or binding cron (FR-10.16). 15 until the tenant saves another value." }
        version: { type: integer, minimum: 0, description: 0 for a tenant that never saved settings. }
        updatedBy: { type: string, description: The user who saved the settings. }
        updatedAt: { type: string, format: date-time }
    PutMigrationSettings:
      type: object
      additionalProperties: false
      required: [version, recurringMinIntervalMin]
      properties:
        version: { type: integer, minimum: 0, description: The version read; 0 creates the settings. }
        recurringMinIntervalMin: { type: integer, minimum: 15, maximum: 1440, description: Minutes between two scheduled runs, at least. }
    MappingSpec:
      type: object
      required: [id, entity, version, checksum, fieldCount, testCount, naturalKey, createdAt]
      properties:
        id: { type: string, format: uuid }
        entity: { type: string }
        version: { type: integer }
        checksum: { type: string, description: SHA-256 of the canonical mapping JSON. }
        fieldCount: { type: integer }
        testCount: { type: integer }
        projectId: { type: string, format: uuid, description: The migration project the spec belongs to. Absent for a tenant-wide spec. A run from the spec adopts this project. }
        naturalKey: { type: array, items: { type: string }, description: The mapped columns that identify a record, from the mapping's naturalKey. Empty when the mapping names none. }
        createdAt: { type: string, format: date-time }
        mapping: { type: object, description: Present on the single-spec read only. }
    ConfigPackageRequest:
      type: object
      additionalProperties: false
      required: [package, signature]
      properties:
        package:
          type: object
          required: [version, schemaVersion, manifest, files]
          properties:
            version: { type: string, minLength: 1, maxLength: 20 }
            schemaVersion: { type: integer, minimum: 1 }
            manifest: { type: object, required: [files], properties: { files: { type: array, items: { $ref: '#/components/schemas/ManifestFile' } } } }
            files:
              type: array
              items:
                type: object
                required: [name, entity, records]
                properties:
                  name: { type: string }
                  entity: { type: string }
                  records: { type: array, items: { type: object, required: [key, body], properties: { key: { type: string }, body: { type: object } } } }
        signature: { type: string, format: byte, description: "Base64 signature over the canonical manifest (version, schemaVersion and file hashes)." }
    ManifestFile:
      type: object
      required: [name, sha256, dependsOn]
      properties:
        name: { type: string }
        sha256: { type: string, description: SHA-256 of the file's canonical JSON. }
        dependsOn: { type: array, items: { type: string } }
    PackageCounts:
      type: object
      required: [create, update, unchanged]
      properties: { create: { type: integer }, update: { type: integer }, unchanged: { type: integer } }
    ConfigPackageDiff:
      type: object
      required: [version, schemaVersion, counts, files]
      properties:
        version: { type: string }
        schemaVersion: { type: integer }
        counts: { $ref: '#/components/schemas/PackageCounts' }
        files:
          type: array
          description: In dependency order.
          items:
            type: object
            required: [name, entity, create, update, unchanged]
            properties:
              name: { type: string }
              entity: { type: string }
              create: { type: array, items: { type: string } }
              update: { type: array, items: { type: string } }
              unchanged: { type: array, items: { type: string } }
    ConfigPackageApplied:
      type: object
      required: [packageId, version, schemaVersion, appliedAt, counts]
      properties:
        packageId: { type: string, format: uuid }
        version: { type: string }
        schemaVersion: { type: integer }
        appliedAt: { type: string, format: date-time }
        counts: { $ref: '#/components/schemas/PackageCounts' }
    ConfigPackage:
      type: object
      required: [id, version, schemaVersion, fileCount, applied, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: string }
        schemaVersion: { type: integer }
        fileCount: { type: integer }
        files: { type: array, items: { $ref: '#/components/schemas/ManifestFile' }, description: Present on the single-package read only. }
        applied:
          type: array
          items:
            type: object
            required: [tenantId, appliedAt, diffCounts]
            properties: { tenantId: { type: string, format: uuid }, appliedAt: { type: string, format: date-time }, idempotencyKey: { type: string }, diffCounts: { $ref: '#/components/schemas/PackageCounts' } }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    SyncStatus:
      type: object
      required: [bindingId, entity, connectionProfileId, connectionProfileName, bindingStatus, sourceOfTruth, paused, watermark, running, consecutiveFailures, rowsLoaded, rowsRejected, openConflicts, version]
      properties:
        bindingId: { type: string, format: uuid }
        entity: { type: string }
        connectionProfileId: { type: string, format: uuid }
        connectionProfileName: { type: string }
        bindingStatus: { type: string, enum: [active, disabled] }
        projectId: { type: string, format: uuid, description: The active migrate project the binding runs under (the lowest id with a schedule; one without a schedule only when the binding has its own). }
        scheduleCron: { type: string, description: "The cron the binding runs on: five fields read in scheduleTimezone (UTC by default), at least 15 minutes between runs. It is scheduleOverride when that is set, otherwise the scheduleCron of the migrate project; empty when neither exists." }
        scheduleTimezone: { type: string, description: "The time zone the cron is read in: the zone of the project the binding runs under (UTC by default)." }
        scheduleOverride: { type: string, description: "The binding's own cron, set with updateSyncStatus. Empty when the binding follows the project's scheduleCron." }
        projectScheduleCron: { type: string, description: "The default the binding falls back to without scheduleOverride: the scheduleCron of the lowest-id active migrate project with a schedule on its profile. Empty when there is none; clearing scheduleOverride then leaves the binding unscheduled (scheduleCron and nextDueAt empty) until a project gets a schedule or the binding its own." }
        sourceOfTruth: { type: string, enum: [legacy, passage] }
        paused: { type: boolean }
        watermark: { type: string, description: "The high-water mark of the last run that did not fail. The next run reads from a little before it (5 minutes for a timestamp cursor, the value itself for an integer or row version) so rows committed late with the same or a slightly earlier cursor are not skipped; rows read again are unchanged and not loaded. Empty before the first run, or without a cursor on the binding (every run is then a full read); editing the entity binding discards it." }
        nextDueAt: { type: string, format: date-time, description: "Includes the failure backoff." }
        running: { type: boolean }
        lastRunId: { type: string, format: uuid }
        lastRunAt: { type: string, format: date-time }
        lastSuccessAt: { type: string, format: date-time }
        lastStatus: { type: string, enum: [succeeded, partial, failed, abandoned] }
        lastError: { type: string }
        consecutiveFailures: { type: integer, description: "From 3 the next run waits 15 minutes, doubling per failure up to 24 hours." }
        rowsLoaded: { type: integer, format: int64 }
        rowsRejected: { type: integer, format: int64 }
        openConflicts: { type: integer }
        version: { type: integer }
        keyCheckHours: { type: integer, minimum: 0, maximum: 8760, description: "How often a binding with a cursor is read in full to find rows the legacy system deleted; 0 turns the check off. Default 24. A binding without a cursor is read in full on every run." }
        lastKeyCheckAt: { type: string, format: date-time, description: When a full read last completed and replaced the absent list. }
        keyCheckError: { type: string, description: "Why the last full read produced no absent list: it failed (the next one is still a period away, the runs in between are deltas), another active binding loads the same entity from the same source system into the same keys, it found no rows at all while keys are loaded, or it would list more than half of the loaded keys not listed already as newly absent (send keyCheckAcceptLarge to accept it once). Absent when the last one produced the list." }
        keyCheckAcceptLarge: { type: boolean, description: "True while an operator's one-time acceptance of a large vanish is waiting for the next completed key check." }
        absentCount: { type: integer, minimum: 0, description: Loaded source keys the last full read did not find in the legacy system. See listSyncAbsent. }
    SyncAbsent:
      type: object
      required: [bindingId, sourceKey, firstAbsentAt, lastCheckedAt]
      properties:
        bindingId: { type: string, format: uuid }
        sourceKey: { type: string, description: The legacy key that was loaded earlier and is missing from the source. }
        targetId: { type: string, description: The Passage record the legacy row was loaded into. }
        runId: { type: string, format: uuid, description: The run whose full read last confirmed the key absent. }
        firstAbsentAt: { type: string, format: date-time }
        lastCheckedAt: { type: string, format: date-time }
    UpdateSyncStatus:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 0 }
        paused: { type: boolean }
        scheduleCron: { type: string, maxLength: 100, description: "The binding's own cron: five fields read in the time zone of the project the binding runs under (UTC by default), at least 15 minutes between runs. It replaces the project's scheduleCron for this binding only and does not reset the watermark. An empty string clears it so the project's cron applies again. Not allowed together with runNow. Needs an active migrate project on the profile." }
        sourceOfTruth: { type: string, enum: [legacy, passage] }
        keyCheckHours: { type: integer, minimum: 0, maximum: 8760, description: Period in hours of the full read that finds deleted legacy rows; 0 turns it off. }
        keyCheckNow: { type: boolean, description: "Makes the next run a full read that looks for deleted legacy rows, whatever the period (also after a failed one); combine with runNow to start it at once." }
        keyCheckAcceptLarge: { type: boolean, description: "Accepts, once, a full read that lists more than half of the loaded keys still present as newly absent (an operator confirms the source is healthy); it also makes the next run a full read. A run already reading the source when it is sent does not spend it. Without it such a read keeps the list and sets keyCheckError." }
        runNow: { type: boolean }
    SyncConflict:
      type: object
      required: [id, bindingId, entity, sourceKey, legacyFields, status, detectedAt, version]
      properties:
        id: { type: string, format: uuid }
        bindingId: { type: string, format: uuid }
        entity: { type: string }
        runId: { type: string, format: uuid }
        sourceKey: { type: string }
        targetId: { type: string, description: The Passage record the legacy row was loaded into. }
        legacyFields: { type: object, additionalProperties: true, description: The mapped values the legacy row would have written. }
        status: { type: string, enum: [open, kept, accepted] }
        detectedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        resolvedBy: { type: string }
        version: { type: integer, minimum: 1, description: "Starts at 1; bumped when a run holds different legacy values for the row and when it is resolved." }
    CreateOutboundMapping:
      type: object
      additionalProperties: false
      required: [name, sourceSystem, definition]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        definition: { $ref: '#/components/schemas/OutboundDefinition' }
    UpdateOutboundMapping:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1, description: The mapping version the change is based on. }
        name: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [active, archived] }
        definition: { $ref: '#/components/schemas/OutboundDefinition' }
    OutboundDefinition:
      type: object
      additionalProperties: false
      required: [eventType, mapping]
      properties:
        eventType: { type: string, description: "An exact CloudEvents type or a pattern: * stands for one dotted segment, a trailing ** for the rest (dev.passage.sales.order.*.v1)." }
        subject:
          type: object
          additionalProperties: false
          required: [entity, idPath]
          description: The Passage record an event is about. Its legacy key is recorded against it by xref:record, so a later event about the same record reads it as xref.self (an update).
          properties:
            entity: { type: string }
            idPath: { type: string, description: Dotted path of the record's id in the event, for example data.order_id. }
        xrefs:
          type: array
          maxItems: 8
          description: Passage ids the event carries (a customer, a product), each resolved to the legacy key an earlier load recorded and offered to the mapping as xref.<name>. A lookup that finds nothing fails the render with MIG-XREF-UNRESOLVED unless it is optional.
          items:
            type: object
            additionalProperties: false
            required: [name, entity, idPath]
            properties:
              name: { type: string }
              entity: { type: string, description: The entity name the cross-reference holds, for example customer. }
              idPath: { type: string }
              optional: { type: boolean }
        lookups:
          type: array
          maxItems: 8
          description: "Entries of lookup tables (an enum code, a unit conversion factor, a price) read for the event and offered to the mapping as lookup.<name>, from the table's current version (the render names the versions it read in lookups). The key is the event values at keyPaths, then the keyConstants, joined with |; an event value that contains | matches no entry. An entry that is missing takes the default, is left out when optional, and otherwise fails the render with MIG-XREF-UNRESOLVED naming the table and key. A table that does not exist or is archived always fails the render: default and optional do not cover it. Tables serve every legal entity; a per-legal-entity or per-currency list keys on those event fields (keyPaths [legalentityid, data.currency, data.sku])."
          items:
            type: object
            additionalProperties: false
            required: [name, table, keyPaths]
            properties:
              name: { type: string }
              table: { type: string, description: The name of a lookup table. }
              keyPaths: { type: array, minItems: 1, maxItems: 3, items: { type: string }, description: Dotted paths into the event whose values form the key; with keyConstants at most 3 parts in all. }
              keyConstants: { type: array, maxItems: 2, items: { type: string, minLength: 1, maxLength: 200 }, description: "Fixed key parts after the event values, without |: for a unit conversion to the legacy ERP's unit, keyPaths [data.unit] and keyConstants [KG] read the entry <unit>|KG." }
              quantityPath: { type: string, description: "For a unit conversion table only: the event quantity to convert. lookup.<name> is then the quantity times the factor (exact decimal), the quantity itself between equal units; the mapping field rounds it to its scale. Against another kind of table the render is unresolved." }
              default: { type: string, description: The value used when the table has no entry for the key. Cannot be combined with optional. }
              optional: { type: boolean }
        collections:
          type: array
          maxItems: 4
          description: "Array iteration: each collection maps an array of the event (an order's data.lines) to an array of the request body, element by element, so one push creates a header and all its lines in the legacy ERP. An element's rules read the element itself, parent.* (the whole event), index (from 0), and the collection's own xref.<name> and lookup.<name>, resolved per element (idPath, keyPaths and quantityPath are relative to the element). An unresolved element is listed as Lines[2].item in MIG-XREF-UNRESOLVED (at most 50 per collection); an array that is missing, empty, not an array, or longer than maxItems is MIG-OUTBOUND-REJECTED, never truncated. The render's lookups name the tables read as <collection>.<lookup>. Each xref of a collection is one query for all its elements and each lookup table is read once per render, so every value comes from one table version. A collection's optional subject {entity, idPath} (idPath relative to the element) adds one ref per element to the render's refs, so xref:record can record the key the legacy ERP assigns each line."
          items:
            type: object
            additionalProperties: false
            required: [name, path, fields]
            properties:
              name: { type: string, description: "Body target of the array; dots nest (Header.Lines). Must not collide with a mapping target." }
              path: { type: string, description: Dotted path of the array in the event, for example data.lines. }
              subject:
                type: object
                additionalProperties: false
                required: [entity, idPath]
                description: The Passage record each element creates in the legacy ERP (an order line). The render lists one ref per element (with collection and index) so xref:record can record the key the ERP assigns each line; an element without a Passage id there makes the render MIG-XREF-UNRESOLVED.
                properties:
                  entity: { type: string }
                  idPath: { type: string, description: Dotted path of the element's id, relative to the element. }
              maxItems: { type: integer, minimum: 1, maximum: 1000, description: The most elements one event may carry (default 200). }
              optional: { type: boolean, description: "Leave the array out of the body when the event has none, and send [] when the event's array is empty; otherwise a missing or empty array is refused (MIG-OUTBOUND-REJECTED missing_array, empty_array)." }
              xrefs:
                type: array
                maxItems: 8
                description: Passage ids of each element resolved to legacy keys, as xref.<name> for that element.
                items:
                  type: object
                  additionalProperties: false
                  required: [name, entity, idPath]
                  properties:
                    name: { type: string }
                    entity: { type: string }
                    idPath: { type: string, description: Dotted path of the id inside the element. }
                    optional: { type: boolean }
              lookups:
                type: array
                maxItems: 8
                description: Lookup table entries read for each element, as lookup.<name>. Same shape and rules as the definition's lookups; paths are relative to the element (parent.<path> reads the event).
                items:
                  type: object
                  additionalProperties: false
                  required: [name, table, keyPaths]
                  properties:
                    name: { type: string }
                    table: { type: string }
                    keyPaths: { type: array, minItems: 1, maxItems: 3, items: { type: string } }
                    keyConstants: { type: array, maxItems: 2, items: { type: string } }
                    quantityPath: { type: string }
                    default: { type: string }
                    optional: { type: boolean }
              fields: { type: array, minItems: 1, items: { type: object }, description: "Mapping DSL field rules that build each element's object; a target with dots nests." }
              rejectWhen: { type: array, items: { type: object }, description: Mapping DSL reject conditions, applied to each element. }
        decimalsAsNumbers: { type: boolean, description: Write decimal fields as exact JSON numbers instead of strings. }
        mapping: { type: object, description: "Mapping DSL document: entity is the legacy entity, fields read the event (data.*, id, type, time, subject) and xref.<name> and lookup.<name>; a target with dots nests (Header.CustomerRef). Its version is set by the service." }
    OutboundMapping:
      type: object
      required: [id, name, sourceSystem, eventType, status, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        eventType: { type: string }
        status: { type: string, enum: [active, archived] }
        version: { type: integer, minimum: 1 }
        checksum: { type: string, description: SHA-256 of the version's canonical definition (present with a definition). }
        definition: { $ref: '#/components/schemas/OutboundDefinition' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OutboundVersion:
      type: object
      required: [version, checksum, createdBy, createdAt]
      properties:
        version: { type: integer }
        checksum: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    CreateLookupTable:
      type: object
      additionalProperties: false
      required: [name, definition]
      properties:
        name: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,63}$', description: The name outbound mappings refer to. }
        definition: { $ref: '#/components/schemas/LookupDefinition' }
    UpdateLookupTable:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1, description: The table version the change is based on. }
        name: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,63}$' }
        status: { type: string, enum: [active, archived] }
        definition: { $ref: '#/components/schemas/LookupDefinition' }
    LookupDefinition:
      type: object
      additionalProperties: false
      required: [kind, entries]
      properties:
        kind: { type: string, enum: [enum, uom_conversion, price_list], description: "enum maps a code to a code; uom_conversion keys are FROM|TO with a positive decimal factor (both directions are entered, the service never divides); price_list values are decimals that are not negative. A key of two or three parts joins them with |." }
        description: { type: string, maxLength: 500 }
        entries:
          type: object
          maxProperties: 5000
          description: Key to value. Values are strings; prices are decimal strings with at most 6 decimals and unit conversion factors with at most 12, never floats.
          additionalProperties: { type: string, minLength: 1, maxLength: 512 }
    LookupTable:
      type: object
      required: [id, name, kind, status, version, entryCount, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [enum, uom_conversion, price_list] }
        status: { type: string, enum: [active, archived] }
        version: { type: integer, minimum: 1 }
        entryCount: { type: integer, minimum: 0 }
        checksum: { type: string, description: SHA-256 of the version's canonical definition (present with a definition). }
        definition: { $ref: '#/components/schemas/LookupDefinition' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImportLookupEntries:
      type: object
      additionalProperties: false
      required: [version, mode, csv]
      properties:
        version: { type: integer, minimum: 1, description: The table version the import is based on. }
        mode: { type: string, enum: [merge, replace], description: merge keeps the entries the file does not mention; replace keeps only the entries of the file. }
        hasHeader: { type: boolean, description: Skip the first line of the file. }
        csv: { type: string, description: "The file text, at most 2 MiB of UTF-8. Two to four cells per line: up to three key parts, then the value." }
    LookupImportSummary:
      type: object
      required: [rows, added, changed, unchanged, removed]
      properties:
        rows: { type: integer, description: Entries read from the file. }
        added: { type: integer, description: Entries new to the table. }
        changed: { type: integer, description: Entries whose value changed. }
        unchanged: { type: integer, description: Entries the file repeated with the same value. }
        removed: { type: integer, description: Entries the file left out (replace mode only). }
    LookupImportResult:
      type: object
      required: [table, summary, written]
      properties:
        table: { $ref: '#/components/schemas/LookupTable' }
        summary: { $ref: '#/components/schemas/LookupImportSummary' }
        written: { type: boolean, description: False when the file changed nothing; no version was saved and table is the current one. }
    LookupVersion:
      type: object
      required: [version, entryCount, checksum, createdBy, createdAt]
      properties:
        version: { type: integer }
        entryCount: { type: integer }
        checksum: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    RenderOutboundMapping:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event: { type: object, description: The CloudEvent exactly as the hub received it (id and type are required). }
        version: { type: integer, minimum: 1, description: Render with this version instead of the current one (pinning). }
    PreviewOutboundMapping:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event: { type: object }
        version: { type: integer, minimum: 1 }
    PreviewOutboundDraft:
      type: object
      additionalProperties: false
      required: [sourceSystem, definition, event]
      properties:
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        definition: { $ref: '#/components/schemas/OutboundDefinition' }
        event: { type: object }
        version: { type: integer, minimum: 1 }
    RenderedOutbound:
      type: object
      required: [body, idempotencyKey, refs]
      properties:
        body: { type: object, description: The request body for the legacy ERP. }
        idempotencyKey: { type: string, description: "mig-ob-v1- and the SHA-256 of the mapping id and the event id: the same for every render of one event, whatever the mapping version." }
        refs:
          type: array
          description: The Passage records the legacy key belongs to; the hub passes them back to xref:record.
          items: { $ref: '#/components/schemas/OutboundRef' }
        lookups:
          type: array
          description: The lookup table versions the render read (absent when the mapping has no lookups), so the pushed body can be traced to the entries behind it.
          items: { $ref: '#/components/schemas/LookupUse' }
    LookupUse:
      type: object
      required: [name, table, version]
      properties:
        name: { type: string, description: The lookup name in the mapping definition. }
        table: { type: string }
        version: { type: integer, minimum: 1 }
    OutboundRef:
      type: object
      required: [entity, id]
      properties:
        entity: { type: string }
        id: { type: string, format: uuid }
        collection: { type: string, description: "On a render: the collection an element ref belongs to (absent on the header's ref)." }
        index: { type: integer, minimum: 0, description: "On a render: the element's position in its collection (absent on the header's ref), so the hub pairs it with the key the legacy ERP answers for that element." }
        legacyKey: { type: string, maxLength: 512, description: "On xref:record: the key the legacy ERP assigned this record. At most one ref may omit it; it takes the top-level legacyKey (the header)." }
    UnresolvedRef:
      type: object
      required: [name, entity, reason]
      properties:
        name: { type: string, description: The xref or lookup name in the mapping definition. }
        entity: { type: string }
        id: { type: string, description: "The Passage id that has no legacy key, or for a lookup (entity lookup:<table>) the key that found no entry; absent when the event carried none." }
        reason: { type: string }
    UnresolvedProblem:
      description: A problem; for MIG-XREF-UNRESOLVED the unresolved array lists every reference without a legacy key.
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            unresolved: { type: array, items: { $ref: '#/components/schemas/UnresolvedRef' } }
    OutboundPreview:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unresolved, rejected, invalid] }
        body: { type: object }
        idempotencyKey: { type: string }
        refs: { type: array, items: { $ref: '#/components/schemas/OutboundRef' } }
        warnings: { type: array, items: { type: object, properties: { field: { type: string }, code: { type: string }, detail: { type: string } } } }
        lookups: { type: array, description: The lookup table versions the preview read., items: { $ref: '#/components/schemas/LookupUse' } }
        unresolved: { type: array, items: { $ref: '#/components/schemas/UnresolvedRef' } }
        rejects: { type: array, items: { type: object, properties: { field: { type: string }, code: { type: string }, detail: { type: string } } } }
        code: { type: string }
        detail: { type: string }
    RecordOutboundXref:
      type: object
      additionalProperties: false
      required: [outboundMappingId, refs, eventId]
      properties:
        outboundMappingId: { type: string, format: uuid }
        refs: { type: array, maxItems: 4100, description: "The refs of the render: the header subject and, when the mapping's collections name a subject, one ref per element, each element ref with the legacyKey the legacy ERP assigned that line. Every ref's entity must be the mapping's subject entity or a collection subject entity. None for a mapping without a subject: the event is recorded and the cross-reference is not touched. All refs are recorded in one transaction or none.", items: { $ref: '#/components/schemas/OutboundRef' } }
        legacyKey: { type: string, maxLength: 512, description: "The key the legacy ERP assigned the header: it belongs to the one ref without its own legacyKey (or to the event when refs is empty). Required unless every ref carries its own." }
        eventId: { type: string, maxLength: 256, description: The event whose push produced the key; the call is idempotent on it. }
    Problem:
      type: object
      required: [type, title, status]
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string }, code: { type: string }, serviceCode: { type: string, description: Reserved by the architecture envelope; the platform kernel does not populate it yet. }, traceId: { type: string }, errors: { type: object, additionalProperties: { type: string } } }
