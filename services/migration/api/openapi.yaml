        '404':
          description: AUTH-0404, no entity binding with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-BINDING-DISABLED or MIG-CONNECTION-DISABLED.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
