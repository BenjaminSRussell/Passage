openapi: 3.1.0
info:
  title: migration
  version: 0.1.0
  description: Data migration framework. Runs execute synchronously inside the request until the Temporal worker (wave 4) takes over; the 202 body already carries the job envelope.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/integration/migration-runs:
    get:
      operationId: listMigrationRuns
      summary: List migration runs
      description: Newest first, optionally filtered by entity, status and project. Callers must be tenant-wide.
      x-passage-duty: migration.run
      parameters:
        - { name: entity, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [succeeded, partial, failed] } }
        - { name: projectId, in: query, description: Only runs started under this migration project., schema: { type: string, format: uuid } }
        - { name: bindingId, in: query, description: Only the delta runs the sync scheduler made for this entity binding., schema: { type: string, format: uuid } }
        - { name: cursor, in: query, description: "The nextCursor of the previous page. It holds only the position, so send the same filters again; a cursor from another list is a 400 COM-0001.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Runs with counts, rejects and reconciliation. Pass nextCursor as cursor for the next page; it is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MigrationRun' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createMigrationRun
      summary: Run a migration
      description: |
        Extracts, maps, validates, loads and reconciles one entity from a legacy system. Give the mapping inline or reference a published mapping spec by id. The run executes inside the request.

        When the deployment has target addresses and a signing key (MIG_TARGET_PARTY_URL, MIG_TARGET_PRODUCT_URL, MIG_TARGET_RECEIVABLES_URL, PASSAGE_SERVICE_SIGNING_KEY), rows are read from the active entity binding of the connection profile (the project's, else the one active profile of the source system) and loaded into the owning services' APIs as the service principal migration-loader. Entities with a target: party, customer and vendor (party service), product and item (product service, created as a draft then moved to the lifecycle state the mapping names, so the required-attribute check applies), ar_open_item (receivables, POST /v1/receivables/open-items:batch), bom and route (engineering, created as draft versions; MIG_TARGET_ENGINEERING_URL). A full run (not a delta, dry run or held run) reads every loaded record back through the owning service's detail route and reports the tie-out in reconciliation; a failed tie-out fails the run. Any other entity is rejected row by row with MIG-TARGET-NOT-AVAILABLE. A target's refusal (4xx) rejects that row under the target's own code and is not retried; a 5xx, 429 or timeout is retried with backoff and then rejects the row as MIG-TARGET-UNAVAILABLE. The legal entity of a row is the project's target legal entity (a row whose legalEntityId names another is rejected MIG-LOAD-LEGAL-ENTITY), else the row's legalEntityId field (MIG-LOAD-LEGAL-ENTITY without one). The mapping's targets must be fields of the entity's target API, or start with _ to stay local (rules and change detection).
      x-passage-duty: migration.run
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMigrationRun' } } }
      responses:
        '202':
          description: Run recorded, or the original run on an Idempotency-Key replay. Rejected rows are listed in the exception queue, not failed.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationRunAccepted' } } }
        '501':
          description: MIG-BACKEND-NOT-CONFIGURED, no extract and load backend is wired in this deployment (the service was started without target addresses).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-RUN-ACTIVE, another run holds the project (one active run per project, BR-10.2); the detail names that run's id, which the run is recorded under when it finishes (GET answers 404 until then), and a claim older than 40 minutes counts as abandoned; MIG-PROJECT-ARCHIVED, the project is archived. No backend is called for an archived project and the run is not recorded.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-PROJECT-UNKNOWN, projectId names no migration project; MIG-PROJECT-NOT-MIGRATE, only a migrate project takes runs; MIG-MAP-TEST-FAIL, one or more mapping tests failed (errors maps each failed test name to its reason); MIG-SPEC-UNKNOWN, mappingSpecId names no published spec; MIG-SPEC-PROJECT, the spec belongs to another project than projectId (a run from a project's spec without projectId runs under that project); MIG-TEMPLATE-UNKNOWN, dataTemplateId names no published template; MIG-TEMPLATE-INVALID, the template does not fit the mapping; idempotency_key_reuse, the key was used with a different request; MIG-NO-CONNECTION, no active connection profile reads the source system (or the project's profile reads another); MIG-CONNECTION-AMBIGUOUS, several do and the run is not under a project that names one; MIG-NO-BINDING, the profile has no active entity binding for the mapping's entity; MIG-MAP-TARGET-UNKNOWN, the mapping writes targets the entity's target API does not take (errors names each). No backend is called.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '502':
          description: MIG-EXTRACT-FAILED, the legacy system could not be read; the detail carries the classified, credential-free reason.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/migration-runs/{id}:
    get:
      operationId: getMigrationRun
      summary: Get a migration run
      description: Returns the counts, rejects, warnings, absent keys and reconciliation of one run.
      x-passage-duty: migration.run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Counts, rejects and reconciliation of the run.
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationRun' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/migration-runs/{id}:rerun:
    post:
      operationId: rerunMigrationRun
      summary: Re-run the exception queue of a run
      description: Creates a child run linked by parentRunId that reprocesses only the rows the original run rejected.
      x-passage-duty: migration.run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      responses:
        '202':
          description: A new run, linked by parentRunId, that reprocesses only the exception queue of the original run. Unchanged rows are never reloaded.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationRunAccepted' } } }
        '409':
          description: MIG-RUN-ACTIVE, the original run's project already has a run executing (the detail names it); MIG-PROJECT-ARCHIVED, the project is archived.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/mapping-specs:
    get:
      operationId: listMappingSpecs
      summary: List mapping specs
      description: Published mapping versions, newest version first per entity. The mapping body is returned by the single-spec read. A spec belongs to one migration project or is tenant-wide; projectId narrows the list to one project's specs or, with none, to the tenant-wide ones.
      x-passage-duty: migration.run
      parameters:
        - { name: entity, in: query, schema: { type: string } }
        - { name: projectId, in: query, description: "A migration project id, or none for the tenant-wide specs. Omitted lists every spec. Anything else is a 400 COM-0001.", schema: { type: string } }
        - { name: cursor, in: query, description: "The nextCursor of the previous page. It holds only the position, so send the same filters again; a cursor from another list is a 400 COM-0001.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Specs without their mapping body. Pass nextCursor as cursor for the next page; it is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MappingSpec' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: publishMappingSpec
      summary: Publish a mapping spec version
      description: Parses the mapping and runs its tests (at least one test case is required), then stores it as an immutable version of its entity, in the scope of projectId (tenant-wide when omitted). Re-publishing identical content returns the stored spec; different content under a version used in the same scope is a conflict.
      x-passage-duty: migration.spec.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [mapping], properties: { projectId: { type: string, format: uuid, description: "The active migrate project the spec belongs to. Omitted publishes a tenant-wide spec. A project's specs are versioned on their own: two projects, or one project and the tenant-wide set, can each hold version 1 of an entity." }, mapping: { type: object, description: "Mapping DSL document with entity, version, optional naturalKey (the mapped target columns that identify a record, each produced by a field rule; a row whose key column is empty is rejected MIG-MAP-KEY), fields (a field may name a source format, the codepage_normalize function, or rule expr with an expr expression over source columns: + - * / comparisons && || ! and the functions round, min, max, abs, concat, substr, upper, lower, trim, len, isempty, coalesce, if), optional rejectWhen conditions (field, op, value or values, reason code; op expr takes an expression over mapped targets as value and rejects when it is true) and at least one test." } } } } }
      responses:
        '201':
          description: A new spec version was stored.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MappingSpec' } } }
        '200':
          description: The same content was already stored under this entity and version, or the Idempotency-Key was replayed.
          content: { application/json: { schema: { $ref: '#/components/schemas/MappingSpec' } } }
        '400':
          description: COM-0001, the request is malformed or projectId is not a UUID.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-SPEC-VERSION-EXISTS, this entity and version already hold different content in this scope; or MIG-PROJECT-ARCHIVED, the project is archived.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-MAP-INVALID (including a mapping with no test case or a naturalKey column no field rule produces), MIG-MAP-TEST-FAIL, MIG-PROJECT-UNKNOWN, MIG-PROJECT-NOT-MIGRATE (the project is not a migrate project), or idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/mapping-specs/{id}:
    get:
      operationId: getMappingSpec
      summary: Get a mapping spec
      description: Returns one published version including its mapping document.
      x-passage-duty: migration.run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The spec with its mapping.
          content: { application/json: { schema: { $ref: '#/components/schemas/MappingSpec' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/migration-runs/{id}/ledger:
    get:
      operationId: listMigrationRunLedger
      summary: List the lineage of a run
      description: One row per source key the run created, updated or found unchanged, in source key order, with the targets that took their value from the run's data template (default_from_template).
      x-passage-duty: migration.run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: templated, in: query, description: When true only rows that took at least one template default are returned., schema: { type: boolean } }
        - { name: cursor, in: query, description: "The nextCursor of the previous page. It holds only the position, so send the same filters again; a cursor from another list is a 400 COM-0001.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Lineage rows of the run. Pass nextCursor as cursor for the next page; it is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LedgerRow' } }, nextCursor: { type: string } } } } }
        '404':
          description: AUTH-0404, the run does not exist for this tenant.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/data-templates:
    get:
      operationId: listDataTemplates
      summary: List data templates
      description: Published data templates, newest version first per entity and name. The defaults are returned by the single-template read.
      x-passage-duty: migration.run
      parameters:
        - { name: entity, in: query, schema: { type: string } }
        - { name: cursor, in: query, description: "The nextCursor of the previous page. It holds only the position, so send the same filters again; a cursor from another list is a 400 COM-0001.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Templates without their defaults. Pass nextCursor as cursor for the next page; it is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DataTemplate' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: publishDataTemplate
      summary: Publish a data template version
      description: Stores per-entity default values (FR-10.18) as an immutable version of its entity and name. A default fills a mapping target only when the source row has no value for it. Re-publishing identical content returns the stored template; different content under a used version is a conflict. The template is checked against the mapping when a run uses it.
      x-passage-duty: migration.spec.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublishDataTemplate' } } }
      responses:
        '201':
          description: A new template version was stored.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/DataTemplate' } } }
        '200':
          description: The same content was already stored under this entity, name and version, or the Idempotency-Key was replayed.
          content: { application/json: { schema: { $ref: '#/components/schemas/DataTemplate' } } }
        '409':
          description: MIG-TEMPLATE-VERSION-EXISTS, this entity, name and version already hold different content.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-TEMPLATE-INVALID, or idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/data-templates/{id}:
    get:
      operationId: getDataTemplate
      summary: Get a data template
      description: Returns one published version including its default values.
      x-passage-duty: migration.run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The template with its defaults.
          content: { application/json: { schema: { $ref: '#/components/schemas/DataTemplate' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/xref:
    get:
      operationId: listXref
      summary: Look up legacy keys in the cross-reference
      description: Answers where a legacy record went. Filter by exact legacy key, key prefix (literal, no wildcards) or Passage id (a target id or the survivor a record was merged into), and page in source system, entity and key order with the opaque nextCursor. Callers scoped to one legal entity are refused.
      x-passage-duty: migration.run
      parameters:
        - { name: sourceSystem, in: query, schema: { $ref: '#/components/schemas/SourceSystem' } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: sourceKey, in: query, description: Exact legacy key., schema: { type: string } }
        - { name: keyPrefix, in: query, description: Legacy keys starting with this text., schema: { type: string } }
        - { name: targetId, in: query, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page of mappings; nextCursor is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/XrefEntry' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/xref/summary:
    get:
      operationId: summarizeXref
      summary: Count mapped legacy keys
      description: The number of mapped legacy keys per source system and entity, for checking a cutover against the legacy record counts.
      x-passage-duty: migration.run
      responses:
        '200':
          description: One row per source system and entity.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/XrefCount' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/projects:
    get:
      operationId: listMigrationProjects
      summary: List migration projects
      description: Migration projects (EN-064) in name order, optionally filtered by type and status, paged with the opaque nextCursor. Callers scoped to one legal entity are refused.
      x-passage-duty: migration.run
      parameters:
        - { name: projectType, in: query, schema: { type: string, enum: [migrate, copy, config_package] } }
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page of projects; nextCursor is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MigrationProject' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createMigrationProject
      summary: Create a migration project
      description: Creates a migrate, copy (between two different legal entities of the tenant, FR-10.14) or config_package project. Type, source system and legal entities are fixed once created; name, status, cutover, schedule and connection profile can be changed with the version. Legal entity ids are not checked against the org service.
      x-passage-duty: migration.project.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMigrationProject' } } }
      responses:
        '201':
          description: The project was created.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationProject' } } }
        '200':
          description: The Idempotency-Key was replayed; the stored project is returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationProject' } } }
        '409':
          description: MIG-PROJECT-NAME-EXISTS, a project with this name already exists.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse, the key was used for a different project.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMigrationProject
      summary: Get a migration project
      description: Returns one migration project with its current version.
      x-passage-duty: migration.run
      responses:
        '200':
          description: The project.
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationProject' } } }
        '404':
          description: AUTH-0404, no migration project with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateMigrationProject
      summary: Change a migration project
      description: Changes name, status, cutover time, schedule or connection profile under the project's version. An omitted or null field is unchanged; an empty cutoverAt or scheduleCron clears it. A stale version is a conflict. An archived project takes no change except reactivation (status active), which may carry other edits.
      x-passage-duty: migration.project.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMigrationProject' } } }
      responses:
        '200':
          description: The updated project with its new version.
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationProject' } } }
        '404':
          description: AUTH-0404, no migration project with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-VERSION-CONFLICT, the version is stale; MIG-PROJECT-NAME-EXISTS; or MIG-PROJECT-ARCHIVED, the project is archived and the change does not reactivate it.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/projects/{id}/key-rewrite-rules:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getKeyRewriteRules
      summary: Get a copy project's key rewrite rules
      description: The ordered rules that rewrite legal-entity-scoped keys when a copy runs, with the project version to send back when replacing them. Only copy projects have rules.
      x-passage-duty: migration.run
      responses:
        '200':
          description: The rules in the order they are tried.
          content: { application/json: { schema: { $ref: '#/components/schemas/KeyRewriteRules' } } }
        '404':
          description: AUTH-0404, no migration project with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-PROJECT-NOT-COPY, only copy projects have key rewrite rules.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: replaceKeyRewriteRules
      summary: Replace a copy project's key rewrite rules
      description: Replaces the whole rule set under the project's version and bumps the version; an empty list clears the rules. For one field the first matching rule wins, so a rule whose prefix starts with an earlier rule's prefix for the same field (USMF after US, or a repeat) could never apply and is refused. An archived project's rules cannot be replaced.
      x-passage-duty: migration.project.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceKeyRewriteRules' } } }
      responses:
        '200':
          description: The stored rules and the new project version.
          content: { application/json: { schema: { $ref: '#/components/schemas/KeyRewriteRules' } } }
        '404':
          description: AUTH-0404, no migration project with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-VERSION-CONFLICT, the version is stale, or MIG-PROJECT-ARCHIVED, the project is archived.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-PROJECT-NOT-COPY, only copy projects have key rewrite rules.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/projects/{id}/key-rewrite-rules:preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: previewKeyRewriteRules
      summary: Preview key rewriting on sample keys
      description: Shows what the rules would do to sample record keys, using the rules in the request or, when omitted, the stored ones. Nothing is saved.
      x-passage-duty: migration.run
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PreviewKeyRewrite' } } }
      responses:
        '200':
          description: One row per sample key, in request order.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/KeyRewritePreview' } } } } } }
        '404':
          description: AUTH-0404, no migration project with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-PROJECT-NOT-COPY, only copy projects have key rewrite rules.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/connection-profiles:
    get:
      operationId: listConnectionProfiles
      summary: List connection profiles
      description: Connection profiles in name order, optionally filtered by kind and status, paged with the opaque nextCursor. A profile shows whether its secret is set and when it changed, never the secret. Callers must be tenant-wide.
      x-passage-duty: migration.run
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [sql, rest, file] } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page of connection profiles; nextCursor is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ConnectionProfile' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createConnectionProfile
      summary: Create a connection profile
      description: Stores the non-secret settings for reaching a legacy or custom ERP (a SQL database, a REST API or a file drop directory). The settings are checked against the kind; a key that looks like a secret (password, token, key) is refused, because the one secret is set with PUT .../secret. Kind and source system are fixed once created; the source system may be custom_<name> for a customer's own ERP.
      x-passage-duty: migration.connection.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateConnectionProfile' } } }
      responses:
        '201':
          description: The profile was created, without a secret.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionProfile' } } }
        '200':
          description: The Idempotency-Key was replayed; the stored profile is returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionProfile' } } }
        '409':
          description: MIG-CONNECTION-NAME-EXISTS, a profile with this name already exists.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse, the key was used for a different profile.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/connection-profiles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getConnectionProfile
      summary: Get a connection profile
      description: Returns one connection profile with its current version. The secret is never returned; secretSet and secretUpdatedAt say whether and when it was set.
      x-passage-duty: migration.run
      responses:
        '200':
          description: The profile.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionProfile' } } }
        '404':
          description: AUTH-0404, no connection profile with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateConnectionProfile
      summary: Change a connection profile
      description: Changes name, settings (the whole config object is replaced and checked again) or status under the profile's version. An omitted field is unchanged. Kind and source system cannot change. A change to a setting the secret is bound to (sql driver, host, port, database, user or sslmode; rest baseUrl, authType, username or headerName) clears the stored secret, so the answer has secretSet false and the secret must be set again before a test can use it. A stale version is a conflict.
      x-passage-duty: migration.connection.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateConnectionProfile' } } }
      responses:
        '200':
          description: The updated profile with its new version.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionProfile' } } }
        '404':
          description: AUTH-0404, no connection profile with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-VERSION-CONFLICT, the version is stale; or MIG-CONNECTION-NAME-EXISTS.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/connection-profiles/{id}/secret:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setConnectionProfileSecret
      summary: Set a connection profile's secret
      description: Seals the secret (a database password, API token or key value) with field encryption bound to the tenant and the profile, and stores it. Write-only; nothing returns it, and it is never logged. Replaces any earlier secret and bumps the profile version. Answers 501 MIG-SECRETS-NOT-CONFIGURED when the service has no field-encryption keys.
      x-passage-duty: migration.connection.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SetConnectionSecret' } } }
      responses:
        '200':
          description: The profile, now with secretSet true and secretUpdatedAt.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionProfile' } } }
        '404':
          description: AUTH-0404, no connection profile with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '501':
          description: MIG-SECRETS-NOT-CONFIGURED, the service has no FIELDCRYPT_KEYS_FILE.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/connection-profiles/{id}:test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: testConnectionProfile
      summary: Test a connection profile
      description: Connects the way an extractor will and reports what it found. SQL connects through the driver named in config.driver (postgres, sqlserver, mysql or oracle), inside a read-only transaction with a 5-second statement timeout, and lists at most 50 schemas, 200 tables and the columns of the first 20 tables (no row data); REST sends one GET to baseUrl plus probePath with the configured authentication and reads at most 64 KiB of the answer, which it does not return; file checks the drop directory under the operator-mounted drop root and counts matching files. Every network connection passes the egress guard, which refuses loopback, link-local and metadata addresses always, refuses private addresses unless the operator lists them in MIG_EGRESS_ALLOW, pins the connection to the checked address and never follows redirects. The call answers 200 whether or not the connection worked; read ok and failure in the body. It needs the write duty because it opens the stored secret.
      x-passage-duty: migration.connection.write
      responses:
        '200':
          description: The probe result. It never contains the secret, response bodies or row data.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionTestResult' } } }
        '404':
          description: AUTH-0404, no connection profile with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-SECRET-UNREADABLE, the stored secret cannot be opened with the current keys; set it again.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '501':
          description: MIG-SECRETS-NOT-CONFIGURED, the service has no field-encryption keys and the profile needs a secret (SQL, and REST with authentication), or MIG-PROBE-NOT-CONFIGURED.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/entity-bindings:
    get:
      operationId: listEntityBindings
