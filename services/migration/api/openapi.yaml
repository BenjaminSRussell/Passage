      description: Extracts a few rows (default 10, at most 100) from the binding's source through the connection profile, derives each row's source key and, with a mapping, runs the mapping and its rules to show the target record, rejects and warnings per row. The mapping is the inline mapping, else the published spec named by mappingSpecId, else the binding's own spec; the mapping's own test cases must pass. A file profile may be previewed from an upload (base64, at most 4 MiB) instead of the drop directory. Nothing is loaded, stored or logged beyond the usual request log. The whole preview has a 60-second deadline. The call answers 200 whether or not the source could be read in time; read ok and failure in the body. It needs the write duty because it opens the stored secret.
