openapi: 3.1.0
info:
  title: migration
  version: 0.1.0
  description: Data migration framework. Runs execute synchronously inside the request until the Temporal worker (wave 4) takes over; the 202 body already carries the job envelope.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/integration/migration-runs:
    get:
      operationId: listMigrationRuns
      summary: List migration runs
      description: Newest first, optionally filtered by entity, status and project. Callers must be tenant-wide.
      x-passage-duty: migration.run
      parameters:
        - { name: entity, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [succeeded, partial, failed] } }
        - { name: projectId, in: query, description: Only runs started under this migration project., schema: { type: string, format: uuid } }
        - { name: cursor, in: query, description: "The nextCursor of the previous page. It holds only the position, so send the same filters again; a cursor from another list is a 400 COM-0001.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Runs with counts, rejects and reconciliation. Pass nextCursor as cursor for the next page; it is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MigrationRun' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createMigrationRun
      summary: Run a migration
      description: |
        Extracts, maps, validates, loads and reconciles one entity from a legacy system. Give the mapping inline or reference a published mapping spec by id. The run executes inside the request.

        When the deployment has target addresses and a signing key (MIG_TARGET_PARTY_URL, MIG_TARGET_PRODUCT_URL, MIG_TARGET_RECEIVABLES_URL, PASSAGE_SERVICE_SIGNING_KEY), rows are read from the active entity binding of the connection profile (the project's, else the one active profile of the source system) and loaded into the owning services' APIs as the service principal migration-loader. Entities with a target: party, customer and vendor (party service), product and item (product service, created as a draft then moved to the lifecycle state the mapping names, so the required-attribute check applies), ar_open_item (receivables, POST /v1/receivables/open-items:batch). Any other entity is rejected row by row with MIG-TARGET-NOT-AVAILABLE. A target's refusal (4xx) rejects that row under the target's own code and is not retried; a 5xx, 429 or timeout is retried with backoff and then rejects the row as MIG-TARGET-UNAVAILABLE. The legal entity of a row is the project's target legal entity (a row whose legalEntityId names another is rejected MIG-LOAD-LEGAL-ENTITY), else the row's legalEntityId field (MIG-LOAD-LEGAL-ENTITY without one). The mapping's targets must be fields of the entity's target API, or start with _ to stay local (rules and change detection).
      x-passage-duty: migration.run
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMigrationRun' } } }
      responses:
        '202':
          description: Run recorded, or the original run on an Idempotency-Key replay. Rejected rows are listed in the exception queue, not failed.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationRunAccepted' } } }
        '501':
          description: MIG-BACKEND-NOT-CONFIGURED, no extract and load backend is wired in this deployment (the service was started without target addresses).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-RUN-ACTIVE, another run holds the project (one active run per project, BR-10.2); the detail names that run's id, which the run is recorded under when it finishes (GET answers 404 until then), and a claim older than 40 minutes counts as abandoned; MIG-PROJECT-ARCHIVED, the project is archived. No backend is called for an archived project and the run is not recorded.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-PROJECT-UNKNOWN, projectId names no migration project; MIG-PROJECT-NOT-MIGRATE, only a migrate project takes runs; MIG-MAP-TEST-FAIL, one or more mapping tests failed (errors maps each failed test name to its reason); MIG-SPEC-UNKNOWN, mappingSpecId names no published spec; MIG-TEMPLATE-UNKNOWN, dataTemplateId names no published template; MIG-TEMPLATE-INVALID, the template does not fit the mapping; idempotency_key_reuse, the key was used with a different request; MIG-NO-CONNECTION, no active connection profile reads the source system (or the project's profile reads another); MIG-CONNECTION-AMBIGUOUS, several do and the run is not under a project that names one; MIG-NO-BINDING, the profile has no active entity binding for the mapping's entity; MIG-MAP-TARGET-UNKNOWN, the mapping writes targets the entity's target API does not take (errors names each). No backend is called.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '502':
          description: MIG-EXTRACT-FAILED, the legacy system could not be read; the detail carries the classified, credential-free reason.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/migration-runs/{id}:
    get:
      operationId: getMigrationRun
      summary: Get a migration run
      description: Returns the counts, rejects, warnings, absent keys and reconciliation of one run.
      x-passage-duty: migration.run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Counts, rejects and reconciliation of the run.
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationRun' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/migration-runs/{id}:rerun:
    post:
      operationId: rerunMigrationRun
      summary: Re-run the exception queue of a run
      description: Creates a child run linked by parentRunId that reprocesses only the rows the original run rejected.
      x-passage-duty: migration.run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      responses:
        '202':
          description: A new run, linked by parentRunId, that reprocesses only the exception queue of the original run. Unchanged rows are never reloaded.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationRunAccepted' } } }
        '409':
          description: MIG-RUN-ACTIVE, the original run's project already has a run executing (the detail names it); MIG-PROJECT-ARCHIVED, the project is archived.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/mapping-specs:
    get:
      operationId: listMappingSpecs
      summary: List mapping specs
      description: Published mapping versions, newest version first per entity. The mapping body is returned by the single-spec read.
      x-passage-duty: migration.run
      parameters:
        - { name: entity, in: query, schema: { type: string } }
        - { name: cursor, in: query, description: "The nextCursor of the previous page. It holds only the position, so send the same filters again; a cursor from another list is a 400 COM-0001.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Specs without their mapping body. Pass nextCursor as cursor for the next page; it is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MappingSpec' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: publishMappingSpec
      summary: Publish a mapping spec version
      description: Parses the mapping and runs its tests (at least one test case is required), then stores it as an immutable version of its entity. Re-publishing identical content returns the stored spec; different content under a used version is a conflict.
      x-passage-duty: migration.spec.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [mapping], properties: { mapping: { type: object, description: "Mapping DSL document with entity, version, fields (a field may name a source format or the codepage_normalize function), optional rejectWhen conditions (field, op, value or values, reason code) and at least one test." } } } } }
      responses:
        '201':
          description: A new spec version was stored.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MappingSpec' } } }
        '200':
          description: The same content was already stored under this entity and version, or the Idempotency-Key was replayed.
          content: { application/json: { schema: { $ref: '#/components/schemas/MappingSpec' } } }
        '409':
          description: MIG-SPEC-VERSION-EXISTS, this entity and version already hold different content.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-MAP-INVALID (including a mapping with no test case), MIG-MAP-TEST-FAIL, or idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/mapping-specs/{id}:
    get:
      operationId: getMappingSpec
      summary: Get a mapping spec
      description: Returns one published version including its mapping document.
      x-passage-duty: migration.run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The spec with its mapping.
          content: { application/json: { schema: { $ref: '#/components/schemas/MappingSpec' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/migration-runs/{id}/ledger:
    get:
      operationId: listMigrationRunLedger
      summary: List the lineage of a run
      description: One row per source key the run created, updated or found unchanged, in source key order, with the targets that took their value from the run's data template (default_from_template).
      x-passage-duty: migration.run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: templated, in: query, description: When true only rows that took at least one template default are returned., schema: { type: boolean } }
        - { name: cursor, in: query, description: "The nextCursor of the previous page. It holds only the position, so send the same filters again; a cursor from another list is a 400 COM-0001.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Lineage rows of the run. Pass nextCursor as cursor for the next page; it is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LedgerRow' } }, nextCursor: { type: string } } } } }
        '404':
          description: AUTH-0404, the run does not exist for this tenant.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/data-templates:
    get:
      operationId: listDataTemplates
      summary: List data templates
      description: Published data templates, newest version first per entity and name. The defaults are returned by the single-template read.
      x-passage-duty: migration.run
      parameters:
        - { name: entity, in: query, schema: { type: string } }
        - { name: cursor, in: query, description: "The nextCursor of the previous page. It holds only the position, so send the same filters again; a cursor from another list is a 400 COM-0001.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Templates without their defaults. Pass nextCursor as cursor for the next page; it is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DataTemplate' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: publishDataTemplate
      summary: Publish a data template version
      description: Stores per-entity default values (FR-10.18) as an immutable version of its entity and name. A default fills a mapping target only when the source row has no value for it. Re-publishing identical content returns the stored template; different content under a used version is a conflict. The template is checked against the mapping when a run uses it.
      x-passage-duty: migration.spec.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublishDataTemplate' } } }
      responses:
        '201':
          description: A new template version was stored.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/DataTemplate' } } }
        '200':
          description: The same content was already stored under this entity, name and version, or the Idempotency-Key was replayed.
          content: { application/json: { schema: { $ref: '#/components/schemas/DataTemplate' } } }
        '409':
          description: MIG-TEMPLATE-VERSION-EXISTS, this entity, name and version already hold different content.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-TEMPLATE-INVALID, or idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/data-templates/{id}:
    get:
      operationId: getDataTemplate
      summary: Get a data template
      description: Returns one published version including its default values.
      x-passage-duty: migration.run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The template with its defaults.
          content: { application/json: { schema: { $ref: '#/components/schemas/DataTemplate' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/xref:
    get:
      operationId: listXref
      summary: Look up legacy keys in the cross-reference
      description: Answers where a legacy record went. Filter by exact legacy key, key prefix (literal, no wildcards) or Passage id (a target id or the survivor a record was merged into), and page in source system, entity and key order with the opaque nextCursor. Callers scoped to one legal entity are refused.
      x-passage-duty: migration.run
      parameters:
        - { name: sourceSystem, in: query, schema: { $ref: '#/components/schemas/SourceSystem' } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: sourceKey, in: query, description: Exact legacy key., schema: { type: string } }
        - { name: keyPrefix, in: query, description: Legacy keys starting with this text., schema: { type: string } }
        - { name: targetId, in: query, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page of mappings; nextCursor is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/XrefEntry' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/xref/summary:
    get:
      operationId: summarizeXref
      summary: Count mapped legacy keys
      description: The number of mapped legacy keys per source system and entity, for checking a cutover against the legacy record counts.
      x-passage-duty: migration.run
      responses:
        '200':
          description: One row per source system and entity.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/XrefCount' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/projects:
    get:
      operationId: listMigrationProjects
      summary: List migration projects
      description: Migration projects (EN-064) in name order, optionally filtered by type and status, paged with the opaque nextCursor. Callers scoped to one legal entity are refused.
      x-passage-duty: migration.run
      parameters:
        - { name: projectType, in: query, schema: { type: string, enum: [migrate, copy, config_package] } }
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page of projects; nextCursor is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MigrationProject' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createMigrationProject
      summary: Create a migration project
      description: Creates a migrate, copy (between two different legal entities of the tenant, FR-10.14) or config_package project. Type, source system and legal entities are fixed once created; name, status, cutover, schedule and connection profile can be changed with the version. Legal entity ids are not checked against the org service.
      x-passage-duty: migration.project.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMigrationProject' } } }
      responses:
        '201':
          description: The project was created.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationProject' } } }
        '200':
          description: The Idempotency-Key was replayed; the stored project is returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationProject' } } }
        '409':
          description: MIG-PROJECT-NAME-EXISTS, a project with this name already exists.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse, the key was used for a different project.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMigrationProject
      summary: Get a migration project
      description: Returns one migration project with its current version.
      x-passage-duty: migration.run
      responses:
        '200':
          description: The project.
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationProject' } } }
        '404':
          description: AUTH-0404, no migration project with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateMigrationProject
      summary: Change a migration project
      description: Changes name, status, cutover time, schedule or connection profile under the project's version. An omitted or null field is unchanged; an empty cutoverAt or scheduleCron clears it. A stale version is a conflict. An archived project takes no change except reactivation (status active), which may carry other edits.
      x-passage-duty: migration.project.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMigrationProject' } } }
      responses:
        '200':
          description: The updated project with its new version.
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationProject' } } }
        '404':
          description: AUTH-0404, no migration project with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-VERSION-CONFLICT, the version is stale; MIG-PROJECT-NAME-EXISTS; or MIG-PROJECT-ARCHIVED, the project is archived and the change does not reactivate it.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/projects/{id}/key-rewrite-rules:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getKeyRewriteRules
      summary: Get a copy project's key rewrite rules
      description: The ordered rules that rewrite legal-entity-scoped keys when a copy runs, with the project version to send back when replacing them. Only copy projects have rules.
      x-passage-duty: migration.run
      responses:
        '200':
          description: The rules in the order they are tried.
          content: { application/json: { schema: { $ref: '#/components/schemas/KeyRewriteRules' } } }
        '404':
          description: AUTH-0404, no migration project with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-PROJECT-NOT-COPY, only copy projects have key rewrite rules.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: replaceKeyRewriteRules
      summary: Replace a copy project's key rewrite rules
      description: Replaces the whole rule set under the project's version and bumps the version; an empty list clears the rules. For one field the first matching rule wins, so a rule whose prefix starts with an earlier rule's prefix for the same field (USMF after US, or a repeat) could never apply and is refused. An archived project's rules cannot be replaced.
      x-passage-duty: migration.project.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceKeyRewriteRules' } } }
      responses:
        '200':
          description: The stored rules and the new project version.
          content: { application/json: { schema: { $ref: '#/components/schemas/KeyRewriteRules' } } }
        '404':
          description: AUTH-0404, no migration project with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-VERSION-CONFLICT, the version is stale, or MIG-PROJECT-ARCHIVED, the project is archived.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-PROJECT-NOT-COPY, only copy projects have key rewrite rules.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/projects/{id}/key-rewrite-rules:preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: previewKeyRewriteRules
      summary: Preview key rewriting on sample keys
      description: Shows what the rules would do to sample record keys, using the rules in the request or, when omitted, the stored ones. Nothing is saved.
      x-passage-duty: migration.run
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PreviewKeyRewrite' } } }
      responses:
        '200':
          description: One row per sample key, in request order.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/KeyRewritePreview' } } } } } }
        '404':
          description: AUTH-0404, no migration project with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-PROJECT-NOT-COPY, only copy projects have key rewrite rules.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/connection-profiles:
    get:
      operationId: listConnectionProfiles
      summary: List connection profiles
      description: Connection profiles in name order, optionally filtered by kind and status, paged with the opaque nextCursor. A profile shows whether its secret is set and when it changed, never the secret. Callers must be tenant-wide.
      x-passage-duty: migration.run
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [sql, rest, file] } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page of connection profiles; nextCursor is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ConnectionProfile' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createConnectionProfile
      summary: Create a connection profile
      description: Stores the non-secret settings for reaching a legacy or custom ERP (a SQL database, a REST API or a file drop directory). The settings are checked against the kind; a key that looks like a secret (password, token, key) is refused, because the one secret is set with PUT .../secret. Kind and source system are fixed once created; the source system may be custom_<name> for a customer's own ERP.
      x-passage-duty: migration.connection.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateConnectionProfile' } } }
      responses:
        '201':
          description: The profile was created, without a secret.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionProfile' } } }
        '200':
          description: The Idempotency-Key was replayed; the stored profile is returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionProfile' } } }
        '409':
          description: MIG-CONNECTION-NAME-EXISTS, a profile with this name already exists.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: idempotency_key_reuse, the key was used for a different profile.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/connection-profiles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getConnectionProfile
      summary: Get a connection profile
      description: Returns one connection profile with its current version. The secret is never returned; secretSet and secretUpdatedAt say whether and when it was set.
      x-passage-duty: migration.run
      responses:
        '200':
          description: The profile.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionProfile' } } }
        '404':
          description: AUTH-0404, no connection profile with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateConnectionProfile
      summary: Change a connection profile
      description: Changes name, settings (the whole config object is replaced and checked again) or status under the profile's version. An omitted field is unchanged. Kind and source system cannot change. A change to a setting the secret is bound to (sql driver, host, port, database, user or sslmode; rest baseUrl, authType, username or headerName) clears the stored secret, so the answer has secretSet false and the secret must be set again before a test can use it. A stale version is a conflict.
      x-passage-duty: migration.connection.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateConnectionProfile' } } }
      responses:
        '200':
          description: The updated profile with its new version.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionProfile' } } }
        '404':
          description: AUTH-0404, no connection profile with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-VERSION-CONFLICT, the version is stale; or MIG-CONNECTION-NAME-EXISTS.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/connection-profiles/{id}/secret:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setConnectionProfileSecret
      summary: Set a connection profile's secret
      description: Seals the secret (a database password, API token or key value) with field encryption bound to the tenant and the profile, and stores it. Write-only; nothing returns it, and it is never logged. Replaces any earlier secret and bumps the profile version. Answers 501 MIG-SECRETS-NOT-CONFIGURED when the service has no field-encryption keys.
      x-passage-duty: migration.connection.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SetConnectionSecret' } } }
      responses:
        '200':
          description: The profile, now with secretSet true and secretUpdatedAt.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionProfile' } } }
        '404':
          description: AUTH-0404, no connection profile with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '501':
          description: MIG-SECRETS-NOT-CONFIGURED, the service has no FIELDCRYPT_KEYS_FILE.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/connection-profiles/{id}:test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: testConnectionProfile
      summary: Test a connection profile
      description: Connects the way an extractor will and reports what it found. SQL connects through the driver named in config.driver (postgres, sqlserver, mysql or oracle), inside a read-only transaction with a 5-second statement timeout, and lists at most 50 schemas, 200 tables and the columns of the first 20 tables (no row data); REST sends one GET to baseUrl plus probePath with the configured authentication and reads at most 64 KiB of the answer, which it does not return; file checks the drop directory under the operator-mounted drop root and counts matching files. Every network connection passes the egress guard, which refuses loopback, link-local and metadata addresses always, refuses private addresses unless the operator lists them in MIG_EGRESS_ALLOW, pins the connection to the checked address and never follows redirects. The call answers 200 whether or not the connection worked; read ok and failure in the body. It needs the write duty because it opens the stored secret.
      x-passage-duty: migration.connection.write
      responses:
        '200':
          description: The probe result. It never contains the secret, response bodies or row data.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionTestResult' } } }
        '404':
          description: AUTH-0404, no connection profile with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-SECRET-UNREADABLE, the stored secret cannot be opened with the current keys; set it again.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '501':
          description: MIG-SECRETS-NOT-CONFIGURED, the service has no field-encryption keys and the profile needs a secret (SQL, and REST with authentication), or MIG-PROBE-NOT-CONFIGURED.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/entity-bindings:
    get:
      operationId: listEntityBindings
      summary: List entity bindings
      description: Entity bindings in entity order, optionally filtered by connection profile, entity and status, paged with the opaque nextCursor. Callers must be tenant-wide.
      x-passage-duty: migration.run
      parameters:
        - { name: connectionProfileId, in: query, schema: { type: string, format: uuid } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page of bindings; nextCursor is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/EntityBinding' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createEntityBinding
      summary: Create an entity binding
      description: Says which table or read-only query (sql), endpoint (rest) or file (file) of a connection profile feeds which Passage entity, which fields make up a source row's key, and optionally the change cursor delta sync will read. The source object is checked against the profile's kind; a sql query must be one read-only SELECT. mappingSpecId must be a UUID naming a published spec for the same entity (400 when it is not a UUID or maps another entity, 422 MIG-SPEC-UNKNOWN when there is no such spec). The profile and entity are fixed once created, and a profile has one binding per entity.
      x-passage-duty: migration.connection.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateEntityBinding' } } }
      responses:
        '201':
          description: The binding was created.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/EntityBinding' } } }
        '200':
          description: The Idempotency-Key was replayed; the stored binding is returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/EntityBinding' } } }
        '409':
          description: MIG-BINDING-EXISTS, the profile already has a binding for this entity; or MIG-CONNECTION-DISABLED.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-CONNECTION-UNKNOWN, MIG-SPEC-UNKNOWN, or idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/entity-bindings/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getEntityBinding
      summary: Get an entity binding
      description: Returns one entity binding with its current version.
      x-passage-duty: migration.run
      responses:
        '200':
          description: The binding.
          content: { application/json: { schema: { $ref: '#/components/schemas/EntityBinding' } } }
        '404':
          description: AUTH-0404, no entity binding with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateEntityBinding
      summary: Change an entity binding
      description: Changes the source, key fields, cursor, mapping spec or status under the binding's version; an omitted field is unchanged and the result is checked again against the profile's kind, and a new mappingSpecId must be a UUID naming a spec for the binding's entity. A binding is disabled, never deleted. A stale version is a conflict.
      x-passage-duty: migration.connection.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateEntityBinding' } } }
      responses:
        '200':
          description: The updated binding with its new version.
          content: { application/json: { schema: { $ref: '#/components/schemas/EntityBinding' } } }
        '404':
          description: AUTH-0404, no entity binding with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-VERSION-CONFLICT, the version is stale.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-SPEC-UNKNOWN, mappingSpecId names no published spec.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/entity-bindings/{id}:preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: previewEntityBinding
      summary: Preview a stored entity binding
      description: Extracts a few rows (default 10, at most 100) from the binding's source through the connection profile, derives each row's source key and, with a mapping, runs the mapping and its rules to show the target record, rejects and warnings per row. The mapping is the inline mapping, else the published spec named by mappingSpecId, else the binding's own spec; the mapping's own test cases must pass. A file profile may be previewed from an upload (base64, at most 4 MiB) instead of the drop directory. Nothing is loaded, stored or logged beyond the usual request log. The whole preview has a 60-second deadline. The call answers 200 whether or not the source could be read in time; read ok and failure in the body. It needs the write duty because it opens the stored secret.
      x-passage-duty: migration.connection.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PreviewEntityBinding' } } }
      responses:
        '200':
          description: The sampled rows and what the mapping made of them, or ok false with the failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/BindingPreview' } } }
        '404':
          description: AUTH-0404, no entity binding with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-BINDING-DISABLED or MIG-CONNECTION-DISABLED.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-MAP-INVALID, MIG-MAP-TEST-FAIL, MIG-SPEC-UNKNOWN or MIG-SECRET-UNREADABLE.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '501':
          description: MIG-EXTRACT-NOT-CONFIGURED, or MIG-SECRETS-NOT-CONFIGURED when the profile needs a secret.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/entity-bindings:preview:
    post:
      operationId: previewDraftEntityBinding
      summary: Preview an entity binding before saving it
      description: Same as previewing a stored binding, for a binding that is not saved yet. The request carries the binding's own fields (connectionProfileId, entity, source, keyFields, cursor) next to the preview options. Use it to try a table, query, endpoint or file and its mapping before creating the binding.
      x-passage-duty: migration.connection.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PreviewDraftEntityBinding' } } }
      responses:
        '200':
          description: The sampled rows and what the mapping made of them, or ok false with the failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/BindingPreview' } } }
        '409':
          description: MIG-CONNECTION-DISABLED.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-CONNECTION-UNKNOWN, MIG-MAP-INVALID, MIG-MAP-TEST-FAIL, MIG-SPEC-UNKNOWN or MIG-SECRET-UNREADABLE.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '501':
          description: MIG-EXTRACT-NOT-CONFIGURED, or MIG-SECRETS-NOT-CONFIGURED when the profile needs a secret.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/config-packages:
    get:
      operationId: listConfigPackages
      summary: List applied configuration packages
      description: Packages applied to this tenant, newest first, with their applied history. The manifest files are returned by the single-package read.
      x-passage-duty: migration.run
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Packages without their manifest files.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ConfigPackage' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/config-packages/{id}:
    get:
      operationId: getConfigPackage
      summary: Get a configuration package
      description: Returns one applied package with its manifest files and applied history.
      x-passage-duty: migration.run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The package with its manifest files.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConfigPackage' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/config-packages:diff:
    post:
      operationId: diffConfigPackage
      summary: Diff a configuration package against the target
      description: Verifies the signature, file hashes and schema version, then reports per file, in dependency order, which records apply would create or update. Nothing is written and nothing is recorded.
      x-passage-duty: migration.run
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConfigPackageRequest' } } }
      responses:
        '200':
          description: Counts and record keys per bucket; deletes are never reported because apply never deletes.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConfigPackageDiff' } } }
        '422':
          description: MIG-PKG-SIGNATURE, the signature or a file sha256 does not match; MIG-PKG-SCHEMA-NEWER, the package schema is newer than the target supports; MIG-PKG-INVALID, the manifest is cyclic, lists an unknown file or repeats a record key. Messages never include record bodies.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '501':
          description: MIG-NOT-CONFIGURED, no package target or tenant signing key is wired in this deployment.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/config-packages:apply:
    post:
      operationId: applyConfigPackage
      summary: Apply a configuration package
      description: Verifies the package, writes created and updated records in manifest dependency order, never deletes target records, and appends an applied entry with the diff counts. A second apply of the same package reports no changes. The Idempotency-Key header is required; a replay returns the original response.
      x-passage-duty: migration.package.apply
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConfigPackageRequest' } } }
      responses:
        '200':
          description: Applied counts and the stored package id, or the original response on an Idempotency-Key replay.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConfigPackageApplied' } } }
        '422':
          description: MIG-PKG-SIGNATURE, MIG-PKG-SCHEMA-NEWER or MIG-PKG-INVALID as for diff; idempotency_key_reuse, the key was used with a different package. Nothing is written.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '501':
          description: MIG-NOT-CONFIGURED, no package target or tenant signing key is wired in this deployment.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/parallel-run-diffs:
    post:
      operationId: createParallelRunDiff
      summary: Create a parallel-run diff (deferred)
      description: Reserved for wave 49. Every call answers 501 today.
      x-passage-duty: migration.run
      responses:
        '202':
          description: Reserved. Accepted once the parallel-run harness ships in wave 49; today the service answers 501.
        '501':
          description: MIG-PARALLEL-RUN-DEFERRED, the parallel-run diff harness belongs to wave 49.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      summary: Liveness probe
      description: Answers 200 while the process is running.
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      summary: Readiness probe
      description: Answers 200 when the database is reachable.
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
components:
  responses:
    Problem:
      description: RFC 9457 problem. 400 COM-0001, 401 AUTH-0001, 403 AUTH-0003, 404 AUTH-0404, 409 MIG-VERSION-CONFLICT, 422 idempotency_key_reuse, MIG-MAP-*, MIG-PKG-*, MIG-CONNECTION-UNKNOWN or MIG-SPEC-UNKNOWN, 501 MIG-SECRETS-NOT-CONFIGURED or MIG-EXTRACT-NOT-CONFIGURED.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    CreateMigrationRun:
      type: object
      additionalProperties: false
      description: Exactly one of mapping or mappingSpecId is required.
      required: [sourceSystem, mode]
      properties:
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        mode: { type: string, enum: [rehearsal, cutover, delta] }
        dryRun: { type: boolean }
        mapping: { type: object, description: "Mapping DSL document with entity, version and fields." }
        mappingSpecId: { type: string, format: uuid, description: A published mapping spec to run instead of an inline mapping. }
        dataTemplateId: { type: string, format: uuid, description: A published data template whose defaults fill absent source fields before mapping. It must be for the mapping's entity and default only mapping targets filled from a source column. }
        projectId: { type: string, format: uuid, description: "A migrate project to run under. Its source system must equal sourceSystem, it must be active, and only one run per project executes at a time (409 MIG-RUN-ACTIVE). Omit for a run outside any project." }
    MigrationRunAccepted:
      type: object
      required: [jobId, statusUrl, estimatedCompletionSeconds, run]
      properties:
        jobId: { type: string, format: uuid }
        statusUrl: { type: string }
        estimatedCompletionSeconds: { type: integer }
        run: { $ref: '#/components/schemas/MigrationRun' }
    MigrationRun:
      type: object
      required: [id, sourceSystem, mode, entity, status, dryRun, mappingVersion, counts, rejects, warnings, absent, createdAt]
      properties:
        id: { type: string, format: uuid }
        sourceSystem: { type: string }
        mode: { type: string }
        entity: { type: string }
        status: { type: string, enum: [succeeded, partial, failed] }
        dryRun: { type: boolean }
        mappingVersion: { type: integer }
        parentRunId: { type: string, format: uuid }
        mappingSpecId: { type: string, format: uuid }
        dataTemplateId: { type: string, format: uuid, description: "The data template the run applied, kept on re-runs." }
        projectId: { type: string, format: uuid, description: "The migrate project the run belongs to, kept on re-runs." }
        counts:
          type: object
          required: [extracted, mapped, created, updated, unchanged, templated, rejected, warned]
          properties: { extracted: { type: integer }, mapped: { type: integer }, created: { type: integer }, updated: { type: integer }, unchanged: { type: integer }, templated: { type: integer, description: Mapped rows that took at least one data template default. }, rejected: { type: integer }, warned: { type: integer, description: Loaded rows that carry at least one warning. } }
        rejects:
          type: array
          items:
            type: object
            required: [sourceKey, rejects]
            properties:
              sourceKey: { type: string }
              rejects: { type: array, items: { type: object, required: [field, code, detail], properties: { field: { type: string }, code: { type: string }, detail: { type: string } } } }
        warnings:
          type: array
          description: Rows still mapped and loaded, with MIG-MAP-ENUM-DEFAULT or MAP-PRECISION-LOSS warnings.
          items:
            type: object
            required: [sourceKey, warnings]
            properties:
              sourceKey: { type: string }
              warnings: { type: array, items: { type: object, required: [field, code, detail], properties: { field: { type: string }, code: { type: string }, detail: { type: string } } } }
        absent: { type: array, items: { type: string }, description: Source keys loaded earlier and missing from this extract; never deleted. }
        reconciliation:
          type: object
          required: [source, target, checks]
          properties:
            source: { type: integer }
            target: { type: integer }
            checks: { type: array, items: { type: object, required: [name, ok, detail], properties: { name: { type: string, enum: [row_count, hash_total, sample_compare] }, ok: { type: boolean }, detail: { type: string } } } }
        createdAt: { type: string, format: date-time }
    LedgerRow:
      type: object
      required: [sourceKey, action, defaultFromTemplate]
      properties:
        sourceKey: { type: string }
        targetId: { type: string, format: uuid, description: Absent on a dry run that created the row. }
        action: { type: string, enum: [created, updated, unchanged] }
        defaultFromTemplate: { type: array, items: { type: string }, description: Mapping targets filled from the data template for this row. }
    PublishDataTemplate:
      type: object
      additionalProperties: false
      required: [name, entity, version, defaults]
      properties:
        name: { type: string, maxLength: 80 }
        entity: { type: string }
        version: { type: integer, minimum: 1 }
        defaults: { type: object, minProperties: 1, maxProperties: 200, additionalProperties: { type: string, maxLength: 500 }, description: Mapping target to default value; each value must satisfy the target's type. }
    XrefEntry:
      type: object
      required: [sourceSystem, entity, sourceKey, targetId, updatedAt]
      properties:
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        entity: { type: string }
        sourceKey: { type: string }
        targetId: { type: string, format: uuid }
        contentHash: { type: string }
        mergedIntoTargetId: { type: string, format: uuid, description: Set when the record was merged into another Passage record. }
        updatedAt: { type: string, format: date-time }
    XrefCount:
      type: object
      required: [sourceSystem, entity, count]
      properties:
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        entity: { type: string }
        count: { type: integer, minimum: 1 }
    SourceSystem:
      type: string
      pattern: '^(ax2012|d365fo|sap_ecc|sap_s4|custom_[a-z0-9_]{1,40})$'
      description: ax2012, d365fo, sap_ecc, sap_s4, or custom_<name> (lowercase letters, digits and underscores, 1 to 40 after custom_) for a customer's own ERP.
    EntityBinding:
      type: object
      required: [id, connectionProfileId, entity, source, keyFields, status, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        connectionProfileId: { type: string, format: uuid }
        entity: { type: string, description: The Passage entity this source feeds, for example customer. }
        source: { $ref: '#/components/schemas/BindingSource' }
        keyFields: { type: array, minItems: 1, maxItems: 5, items: { type: string }, description: The columns or JSON paths whose values joined with "|" make the source key used by the cross-reference. }
        cursorField: { type: string, description: The change stamp column or JSON path delta sync will compare. }
        cursorType: { type: string, enum: [timestamp, int, rowversion] }
        mappingSpecId: { type: string, format: uuid, description: The published mapping spec previews use by default. }
        status: { type: string, enum: [active, disabled] }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BindingSource:
      type: object
      additionalProperties: false
      description: Where the rows are. The allowed keys depend on the profile's kind; any other key is refused.
      properties:
        schema: { type: string, description: sql. Optional schema of the table. }
        table: { type: string, description: sql. A plain table or view name; give this or query. }
        columns: { type: array, maxItems: 200, items: { type: string }, description: sql, with table. Must include the key fields and the cursor field. }
        query: { type: string, maxLength: 8000, description: "sql. One read-only SELECT, optionally led by WITH, accepted by the read-only query guard: no second statement, no word that writes, locks, waits or reaches outside the database, and no construct engines read differently (backslashes or prefixes on string literals, # or /*! */ or nested comments, -- without a following space, $ ? @ { }, a call through a quoted name); quote unusual names with double quotes. It may use :watermark once or more as the bind value of the last watermark. Comments are dropped and the query is wrapped as a derived table (or the last CTE after WITH) and paged by keyset on the cursor field and key fields, so do not add ORDER BY or a row limit; a NULL in a key or cursor column fails the extraction. The profile's login must be read-only: on SQL Server it and this guard are the only protection against writes." }
        path: { type: string, description: "rest. Absolute path under the profile's baseUrl, without query or fragment." }
        recordsPath: { type: string, description: "rest and file (json). Dotted path of the record array in the JSON body; omit when the body is the array." }
        params: { type: object, additionalProperties: { type: string }, description: "rest. Plain query parameters, at most 20. Credentials belong in the connection profile." }
        changedSinceParam: { type: string, description: "rest. Query parameter that carries the last watermark so the source filters; without it rows are filtered after reading." }
        paging:
          type: object
          additionalProperties: false
          description: rest. How the endpoint pages.
          properties:
            style: { type: string, enum: [none, page, offset, cursor, link, odata, skiptoken] }
            pageSize: { type: integer, minimum: 1, maximum: 1000 }
            limitParam: { type: string }
            offsetParam: { type: string }
            pageParam: { type: string }
            firstPage: { type: integer, enum: [0, 1] }
            cursorParam: { type: string }
            cursorPath: { type: string, description: Dotted path of the next cursor in the response; required for style cursor. }
        file: { type: string, description: "file. A plain file name in the profile's drop directory." }
        filePattern: { type: string, description: "file. A name pattern with * and ?; the newest match by name is read." }
    CreateEntityBinding:
      type: object
      additionalProperties: false
      required: [connectionProfileId, entity, source, keyFields]
      properties:
        connectionProfileId: { type: string, format: uuid }
        entity: { type: string, pattern: '^[a-z][a-z0-9_.\-]{0,63}$' }
        source: { $ref: '#/components/schemas/BindingSource' }
        keyFields: { type: array, minItems: 1, maxItems: 5, items: { type: string } }
        cursorField: { type: string }
        cursorType: { type: string, enum: [timestamp, int, rowversion] }
        mappingSpecId: { type: string, format: uuid }
    UpdateEntityBinding:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        source: { $ref: '#/components/schemas/BindingSource' }
        keyFields: { type: array, minItems: 1, maxItems: 5, items: { type: string } }
        cursorField: { type: string }
        cursorType: { type: string, enum: ['', timestamp, int, rowversion] }
        mappingSpecId: { type: string, description: "A published spec id (a UUID) for the binding's entity, or empty to clear." }
        status: { type: string, enum: [active, disabled] }
    PreviewEntityBinding:
      type: object
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 1, maximum: 100, default: 10 }
        mappingSpecId: { type: string, format: uuid }
        mapping: { type: object, description: An inline mapping document for the binding's entity. }
        upload:
          type: object
          additionalProperties: false
          required: [name, contentBase64]
          description: file profiles only. Read this content instead of the drop directory.
          properties:
            name: { type: string, description: The file name, which picks the format by its extension. }
            contentBase64: { type: string, description: Base64 content, at most 4 MiB decoded. }
    PreviewDraftEntityBinding:
      type: object
      additionalProperties: false
      required: [connectionProfileId, entity, source, keyFields]
      properties:
        connectionProfileId: { type: string, format: uuid }
        entity: { type: string }
        source: { $ref: '#/components/schemas/BindingSource' }
        keyFields: { type: array, minItems: 1, maxItems: 5, items: { type: string } }
        cursorField: { type: string }
        cursorType: { type: string, enum: [timestamp, int, rowversion] }
        limit: { type: integer, minimum: 1, maximum: 100, default: 10 }
        mappingSpecId: { type: string, format: uuid }
        mapping: { type: object }
        upload:
          type: object
          additionalProperties: false
          required: [name, contentBase64]
          properties:
            name: { type: string }
            contentBase64: { type: string }
    BindingPreview:
      type: object
      required: [ok, durationMs]
      properties:
        ok: { type: boolean }
        durationMs: { type: integer }
        failure:
          type: object
          required: [code, message]
          description: Present when ok is false. Codes are those of a connection test (MIG-EGRESS-DENIED, MIG-CONNECT-FAILED, MIG-AUTH-FAILED, MIG-PROBE-FAILED, MIG-SECRET-MISSING) with the source's own message, which never contains the secret.
          properties:
            code: { type: string }
            message: { type: string }
        mapping:
          type: object
          description: The mapping that was run; absent when the preview ran without one.
          properties:
            entity: { type: string }
            version: { type: integer }
            mappingSpecId: { type: string, format: uuid }
        rows:
          type: array
          items:
            type: object
            required: [index, source]
            properties:
              index: { type: integer, minimum: 1 }
              sourceKey: { type: string, description: Absent when a key field is missing. }
              source: { type: object, description: The row as read, long text cut at 500 bytes. }
              target: { type: object, description: The mapped record; absent when the row is rejected or no mapping ran. }
              warnings:
                type: array
                items: { type: object, properties: { field: { type: string }, code: { type: string }, detail: { type: string } } }
              rejects:
                type: array
                description: Rule errors, or MIG-ROW-NO-KEY when a key field is missing.
                items: { type: object, properties: { field: { type: string }, code: { type: string }, detail: { type: string } } }
        columns: { type: array, items: { type: string }, description: Source column or field names seen in the sample. }
        more: { type: boolean, description: True when the source holds more rows than the sample. }
        mapped: { type: integer, description: Sampled rows with no reject; 0 without a mapping. }
        rejected: { type: integer }
        duplicateKeys: { type: array, items: { type: string }, description: Source keys that repeat inside the sample. }
        watermark: { type: string, description: The largest cursor value in the sample. }
    ConnectionProfile:
      type: object
      required: [id, name, kind, sourceSystem, config, secretSet, status, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        kind: { type: string, enum: [sql, rest, file] }
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        config: { $ref: '#/components/schemas/ConnectionConfig' }
        secretSet: { type: boolean, description: Whether a secret is stored. The secret itself is never returned. }
        secretUpdatedAt: { type: string, format: date-time, description: When the secret was last set. }
        status: { type: string, enum: [active, disabled] }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConnectionConfig:
      type: object
      additionalProperties: false
      description: Non-secret settings only. The allowed keys depend on the kind; a key that looks like a secret is refused with 400 and the value is set with PUT .../secret.
      properties:
        driver: { type: string, enum: [postgres, sqlserver, mysql, oracle], description: "sql. sqlserver is go-mssqldb, mysql is go-sql-driver/mysql, oracle is go-ora (the service name goes in database)." }
        host: { type: string, maxLength: 253, description: sql. A host name or IP address. }
        port: { type: integer, minimum: 1, maximum: 65535, description: sql. Default 5432 (postgres), 1433 (sqlserver), 3306 (mysql), 1521 (oracle). }
        database: { type: string, maxLength: 255, description: sql. }
        user: { type: string, maxLength: 255, description: sql. The password is the secret. }
        sslmode: { type: string, enum: [disable, require, verify-ca, verify-full], description: sql. Default require. }
        baseUrl: { type: string, maxLength: 255, description: "rest. https URL (http only without authentication) with no credentials, query or fragment." }
        authType: { type: string, enum: [none, basic, bearer, header, oauth2_client], description: "rest. The secret is the password, token, header value or OAuth2 client secret." }
        authUrl: { type: string, maxLength: 512, description: "rest, authType oauth2_client. The token endpoint (https)." }
        clientId: { type: string, maxLength: 255, description: "rest, authType oauth2_client." }
        scope: { type: string, maxLength: 255, description: "rest, authType oauth2_client. Space separated." }
        username: { type: string, maxLength: 255, description: "rest, authType basic." }
        headerName: { type: string, maxLength: 64, description: "rest, authType header." }
        pagingStyle: { type: string, enum: [none, offset, page, cursor, link], description: rest. }
        probePath: { type: string, maxLength: 255, description: "rest. Path appended to baseUrl for the test request, for example /health." }
        dropDir: { type: string, maxLength: 255, description: file. A clean relative path under the operator-mounted drop root. }
        format: { type: string, enum: [csv, tsv, json, jsonl], description: file. }
        delimiter: { type: string, minLength: 1, maxLength: 1, description: file. }
        filePattern: { type: string, maxLength: 100, description: "file. Name pattern with * and ?." }
        codepage: { type: string, maxLength: 255, description: "An IANA character set name such as utf-8, windows-1252 or iso-8859-1." }
        timezone: { type: string, maxLength: 255, description: An IANA zone name such as Europe/Berlin. }
    CreateConnectionProfile:
      type: object
      additionalProperties: false
      required: [name, kind, sourceSystem, config]
      properties:
        name: { type: string, maxLength: 80 }
        kind: { type: string, enum: [sql, rest, file] }
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        config: { $ref: '#/components/schemas/ConnectionConfig' }
    UpdateConnectionProfile:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 80 }
        status: { type: string, enum: [active, disabled] }
        config: { $ref: '#/components/schemas/ConnectionConfig' }
    SetConnectionSecret:
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: "The password, token or key value." }
    ConnectionTestResult:
      type: object
      required: [ok, kind, durationMs]
      properties:
        ok: { type: boolean }
        kind: { type: string, enum: [sql, rest, file] }
        durationMs: { type: integer }
        failure:
          type: object
          required: [code, message]
          description: Present when ok is false. Codes are MIG-EGRESS-DENIED, MIG-CONNECT-FAILED, MIG-AUTH-FAILED, MIG-PROBE-FAILED, MIG-SECRET-MISSING, MIG-DROP-NOT-CONFIGURED and MIG-DROP-MISSING.
          properties:
            code: { type: string }
            message: { type: string }
        serverVersion: { type: string, description: sql. }
        schemas: { type: array, items: { type: string }, description: "sql. Non-system schemas, at most 50." }
        tables:
          type: array
          description: sql. At most 200 tables; columns are listed for the first 20.
          items:
            type: object
            required: [schema, name, type]
            properties:
              schema: { type: string }
              name: { type: string }
              type: { type: string }
              columns:
                type: array
                items:
                  type: object
                  required: [name, type, nullable]
                  properties:
                    name: { type: string }
                    type: { type: string }
                    nullable: { type: boolean }
        httpStatus: { type: integer, description: rest. The status the endpoint answered. }
        fileCount: { type: integer, description: file. Files matching filePattern in the drop directory. }
        files:
          type: array
          description: file. The first 20 matching files.
          items:
            type: object
            required: [name, bytes]
            properties:
              name: { type: string }
              bytes: { type: integer }
        truncated: { type: boolean, description: True when a list was cut at its limit. }
    MigrationProject:
      type: object
      required: [id, name, projectType, status, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        projectType: { type: string, enum: [migrate, copy, config_package] }
        sourceSystem: { $ref: '#/components/schemas/SourceSystem', description: Migrate projects only. }
        sourceLegalEntityId: { type: string, format: uuid, description: Copy projects only. }
        targetLegalEntityId: { type: string, format: uuid, description: "The legal entity a copy project copies into, or the legal entity a migrate project lands its data in." }
        connectionProfileId: { type: string, format: uuid, description: Migrate projects only. The connection profile the project reads from. }
        status: { type: string, enum: [active, archived] }
        cutoverAt: { type: string, format: date-time }
        scheduleCron: { type: string, maxLength: 100, description: "Five-field cron expression (numbers, ranges, lists and steps; no names or macros) for recurring incremental imports, at least 15 minutes between runs (FR-10.16); stored, not yet run by a scheduler." }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateMigrationProject:
      type: object
      additionalProperties: false
      description: A migrate project needs sourceSystem; a copy project needs two different legal entities and no source system; a config_package project takes neither.
      required: [name, projectType]
      properties:
        name: { type: string, maxLength: 80 }
        projectType: { type: string, enum: [migrate, copy, config_package] }
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        sourceLegalEntityId: { type: string, format: uuid }
        targetLegalEntityId: { type: string, format: uuid, description: "Required for a copy project (different from the source); optional for a migrate project, which has no source legal entity." }
        connectionProfileId: { type: string, format: uuid, description: Migrate projects only. The connection profile the project reads from; it must be active and have the same source system. }
        cutoverAt: { type: string, format: date-time }
        scheduleCron: { type: string, maxLength: 100, description: Five-field cron expression with at least 15 minutes between runs (FR-10.16). }
    UpdateMigrationProject:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 80 }
        status: { type: string, enum: [active, archived] }
        cutoverAt: { type: string, description: "RFC 3339 timestamp, or empty to clear." }
        scheduleCron: { type: string, maxLength: 100, description: "Five-field cron expression with at least 15 minutes between runs, or empty to clear." }
        connectionProfileId: { type: string, description: "Attaches a connection profile (a UUID, active, with the project's source system) to a migrate project; empty detaches it." }
    KeyRewrite:
      type: object
      additionalProperties: false
      required: [field, from, to]
      properties:
        field: { type: string, maxLength: 100, description: "A field name, or \"@key\" for the record's own natural key." }
        from: { type: string, minLength: 1, maxLength: 100, description: A value of the field starting with this text has it replaced. }
        to: { type: string, maxLength: 100 }
    KeyRewriteRules:
      type: object
      required: [version, items]
      properties:
        version: { type: integer, minimum: 1, description: The project version; send it with the next replacement. }
        items: { type: array, items: { $ref: '#/components/schemas/KeyRewrite' } }
    ReplaceKeyRewriteRules:
      type: object
      additionalProperties: false
      required: [version, rules]
      properties:
        version: { type: integer, minimum: 1 }
        rules: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/KeyRewrite' } }
    PreviewKeyRewrite:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys: { type: array, minItems: 1, maxItems: 200, items: { type: string, maxLength: 200 } }
        rules: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/KeyRewrite' }, description: Rules to try instead of the stored ones. An empty list rewrites nothing. }
    KeyRewritePreview:
      type: object
      required: [key, rewritten, changed]
      properties:
        key: { type: string }
        rewritten: { type: string }
        changed: { type: boolean }
    DataTemplate:
      type: object
      required: [id, entity, name, version, checksum, defaultCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        entity: { type: string }
        name: { type: string }
        version: { type: integer }
        checksum: { type: string, description: SHA-256 of the canonical template JSON. }
        defaultCount: { type: integer }
        defaults: { type: object, additionalProperties: { type: string }, description: Present on the single-template read and on publish. }
        createdAt: { type: string, format: date-time }
    MappingSpec:
      type: object
      required: [id, entity, version, checksum, fieldCount, testCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        entity: { type: string }
        version: { type: integer }
        checksum: { type: string, description: SHA-256 of the canonical mapping JSON. }
        fieldCount: { type: integer }
        testCount: { type: integer }
        createdAt: { type: string, format: date-time }
        mapping: { type: object, description: Present on the single-spec read only. }
    ConfigPackageRequest:
      type: object
      additionalProperties: false
      required: [package, signature]
      properties:
        package:
          type: object
          required: [version, schemaVersion, manifest, files]
          properties:
            version: { type: string, minLength: 1, maxLength: 20 }
            schemaVersion: { type: integer, minimum: 1 }
            manifest: { type: object, required: [files], properties: { files: { type: array, items: { $ref: '#/components/schemas/ManifestFile' } } } }
            files:
              type: array
              items:
                type: object
                required: [name, entity, records]
                properties:
                  name: { type: string }
                  entity: { type: string }
                  records: { type: array, items: { type: object, required: [key, body], properties: { key: { type: string }, body: { type: object } } } }
        signature: { type: string, format: byte, description: "Base64 signature over the canonical manifest (version, schemaVersion and file hashes)." }
    ManifestFile:
      type: object
      required: [name, sha256, dependsOn]
      properties:
        name: { type: string }
        sha256: { type: string, description: SHA-256 of the file's canonical JSON. }
        dependsOn: { type: array, items: { type: string } }
    PackageCounts:
      type: object
      required: [create, update, unchanged]
      properties: { create: { type: integer }, update: { type: integer }, unchanged: { type: integer } }
    ConfigPackageDiff:
      type: object
      required: [version, schemaVersion, counts, files]
      properties:
        version: { type: string }
        schemaVersion: { type: integer }
        counts: { $ref: '#/components/schemas/PackageCounts' }
        files:
          type: array
          description: In dependency order.
          items:
            type: object
            required: [name, entity, create, update, unchanged]
            properties:
              name: { type: string }
              entity: { type: string }
              create: { type: array, items: { type: string } }
              update: { type: array, items: { type: string } }
              unchanged: { type: array, items: { type: string } }
    ConfigPackageApplied:
      type: object
      required: [packageId, version, schemaVersion, appliedAt, counts]
      properties:
        packageId: { type: string, format: uuid }
        version: { type: string }
        schemaVersion: { type: integer }
        appliedAt: { type: string, format: date-time }
        counts: { $ref: '#/components/schemas/PackageCounts' }
    ConfigPackage:
      type: object
      required: [id, version, schemaVersion, fileCount, applied, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: string }
        schemaVersion: { type: integer }
        fileCount: { type: integer }
        files: { type: array, items: { $ref: '#/components/schemas/ManifestFile' }, description: Present on the single-package read only. }
        applied:
          type: array
          items:
            type: object
            required: [tenantId, appliedAt, diffCounts]
            properties: { tenantId: { type: string, format: uuid }, appliedAt: { type: string, format: date-time }, idempotencyKey: { type: string }, diffCounts: { $ref: '#/components/schemas/PackageCounts' } }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string }, code: { type: string }, serviceCode: { type: string, description: Reserved by the architecture envelope; the platform kernel does not populate it yet. }, traceId: { type: string }, errors: { type: object, additionalProperties: { type: string } } }
