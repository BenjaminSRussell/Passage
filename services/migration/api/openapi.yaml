openapi: 3.1.0
info:
  title: migration
  version: 0.1.0
  description: Data migration framework. Runs execute synchronously inside the request until the Temporal worker (wave 4) takes over; the 202 body already carries the job envelope.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/integration/migration-runs:
    get:
      operationId: listMigrationRuns
      summary: List migration runs
      description: Newest first, optionally filtered by entity and status. Callers must be tenant-wide.
      x-passage-duty: migration.run
      parameters:
        - { name: entity, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [succeeded, partial, failed] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Runs with counts, rejects and reconciliation.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MigrationRun' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createMigrationRun
      summary: Run a migration
      description: Extracts, maps, validates, loads and reconciles one entity from a legacy system. Give the mapping inline or reference a published mapping spec by id. The run executes inside the request.
      x-passage-duty: migration.run
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMigrationRun' } } }
      responses:
        '202':
          description: Run recorded, or the original run on an Idempotency-Key replay. Rejected rows are listed in the exception queue, not failed.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationRunAccepted' } } }
        '501':
          description: MIG-BACKEND-NOT-CONFIGURED, no extract and load backend is wired in this deployment.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-MAP-TEST-FAIL, one or more mapping tests failed (errors maps each failed test name to its reason); MIG-SPEC-UNKNOWN, mappingSpecId names no published spec; idempotency_key_reuse, the key was used with a different request. No backend is called.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/migration-runs/{id}:
    get:
      operationId: getMigrationRun
      summary: Get a migration run
      description: Returns the counts, rejects, warnings, absent keys and reconciliation of one run.
      x-passage-duty: migration.run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Counts, rejects and reconciliation of the run.
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationRun' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/migration-runs/{id}:rerun:
    post:
      operationId: rerunMigrationRun
      summary: Re-run the exception queue of a run
      description: Creates a child run linked by parentRunId that reprocesses only the rows the original run rejected.
      x-passage-duty: migration.run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      responses:
        '202':
          description: A new run, linked by parentRunId, that reprocesses only the exception queue of the original run. Unchanged rows are never reloaded.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationRunAccepted' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/mapping-specs:
    get:
      operationId: listMappingSpecs
      summary: List mapping specs
      description: Published mapping versions, newest version first per entity. The mapping body is returned by the single-spec read.
      x-passage-duty: migration.run
      parameters:
        - { name: entity, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Specs without their mapping body.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MappingSpec' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: publishMappingSpec
      summary: Publish a mapping spec version
      description: Parses the mapping and runs its tests (at least one test case is required), then stores it as an immutable version of its entity. Re-publishing identical content returns the stored spec; different content under a used version is a conflict.
      x-passage-duty: migration.spec.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [mapping], properties: { mapping: { type: object, description: Mapping DSL document with entity, version, fields and at least one test. } } } } }
      responses:
        '201':
          description: A new spec version was stored.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MappingSpec' } } }
        '200':
          description: The same content was already stored under this entity and version, or the Idempotency-Key was replayed.
          content: { application/json: { schema: { $ref: '#/components/schemas/MappingSpec' } } }
        '409':
          description: MIG-SPEC-VERSION-EXISTS, this entity and version already hold different content.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-MAP-INVALID (including a mapping with no test case), MIG-MAP-TEST-FAIL, or idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/mapping-specs/{id}:
    get:
      operationId: getMappingSpec
      summary: Get a mapping spec
      description: Returns one published version including its mapping document.
      x-passage-duty: migration.run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The spec with its mapping.
          content: { application/json: { schema: { $ref: '#/components/schemas/MappingSpec' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/parallel-run-diffs:
    post:
      operationId: createParallelRunDiff
      summary: Create a parallel-run diff (deferred)
      description: Reserved for wave 49. Every call answers 501 today.
      x-passage-duty: migration.run
      responses:
        '202':
          description: Reserved. Accepted once the parallel-run harness ships in wave 49; today the service answers 501.
        '501':
          description: MIG-PARALLEL-RUN-DEFERRED, the parallel-run diff harness belongs to wave 49.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      summary: Liveness probe
      description: Answers 200 while the process is running.
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      summary: Readiness probe
      description: Answers 200 when the database is reachable.
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
components:
  responses:
    Problem:
      description: RFC 9457 problem. 400 COM-0001, 401 AUTH-0001, 403 AUTH-0003, 404 AUTH-0404, 422 idempotency_key_reuse or MIG-MAP-*.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    CreateMigrationRun:
      type: object
      additionalProperties: false
      description: Exactly one of mapping or mappingSpecId is required.
      required: [sourceSystem, mode]
      properties:
        sourceSystem: { type: string, enum: [ax2012, d365fo, sap_ecc, sap_s4] }
        mode: { type: string, enum: [rehearsal, cutover, delta] }
        dryRun: { type: boolean }
        mapping: { type: object, description: Mapping DSL document with entity, version and fields. }
        mappingSpecId: { type: string, format: uuid, description: A published mapping spec to run instead of an inline mapping. }
    MigrationRunAccepted:
      type: object
      required: [jobId, statusUrl, estimatedCompletionSeconds, run]
      properties:
        jobId: { type: string, format: uuid }
        statusUrl: { type: string }
        estimatedCompletionSeconds: { type: integer }
        run: { $ref: '#/components/schemas/MigrationRun' }
    MigrationRun:
      type: object
      required: [id, sourceSystem, mode, entity, status, dryRun, mappingVersion, counts, rejects, warnings, absent, createdAt]
      properties:
        id: { type: string, format: uuid }
        sourceSystem: { type: string }
        mode: { type: string }
        entity: { type: string }
        status: { type: string, enum: [succeeded, partial, failed] }
        dryRun: { type: boolean }
        mappingVersion: { type: integer }
        parentRunId: { type: string, format: uuid }
        mappingSpecId: { type: string, format: uuid }
        counts:
          type: object
          required: [extracted, mapped, created, updated, unchanged, rejected, warned]
          properties: { extracted: { type: integer }, mapped: { type: integer }, created: { type: integer }, updated: { type: integer }, unchanged: { type: integer }, rejected: { type: integer }, warned: { type: integer, description: Loaded rows that carry at least one warning. } }
        rejects:
          type: array
          items:
            type: object
            required: [sourceKey, rejects]
            properties:
              sourceKey: { type: string }
              rejects: { type: array, items: { type: object, required: [field, code, detail], properties: { field: { type: string }, code: { type: string }, detail: { type: string } } } }
        warnings:
          type: array
          description: Rows still mapped and loaded, with MIG-MAP-ENUM-DEFAULT or MAP-PRECISION-LOSS warnings.
          items:
            type: object
            required: [sourceKey, warnings]
            properties:
              sourceKey: { type: string }
              warnings: { type: array, items: { type: object, required: [field, code, detail], properties: { field: { type: string }, code: { type: string }, detail: { type: string } } } }
        absent: { type: array, items: { type: string }, description: Source keys loaded earlier and missing from this extract; never deleted. }
        reconciliation:
          type: object
          required: [source, target, checks]
          properties:
            source: { type: integer }
            target: { type: integer }
            checks: { type: array, items: { type: object, required: [name, ok, detail], properties: { name: { type: string, enum: [row_count, hash_total, sample_compare] }, ok: { type: boolean }, detail: { type: string } } } }
        createdAt: { type: string, format: date-time }
    MappingSpec:
      type: object
      required: [id, entity, version, checksum, fieldCount, testCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        entity: { type: string }
        version: { type: integer }
        checksum: { type: string, description: SHA-256 of the canonical mapping JSON. }
        fieldCount: { type: integer }
        testCount: { type: integer }
        createdAt: { type: string, format: date-time }
        mapping: { type: object, description: Present on the single-spec read only. }
    Problem:
      type: object
      required: [type, title, status]
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string }, code: { type: string }, serviceCode: { type: string, description: Reserved by the architecture envelope; the platform kernel does not populate it yet. }, traceId: { type: string }, errors: { type: object, additionalProperties: { type: string } } }
