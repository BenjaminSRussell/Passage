          content: { application/json: { schema: { $ref: '#/components/schemas/BindingPreview' } } }
        '409':
          description: MIG-CONNECTION-DISABLED.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-CONNECTION-UNKNOWN, MIG-MAP-INVALID, MIG-MAP-TEST-FAIL, MIG-SPEC-UNKNOWN or MIG-SECRET-UNREADABLE.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '501':
          description: MIG-EXTRACT-NOT-CONFIGURED, or MIG-SECRETS-NOT-CONFIGURED when the profile needs a secret.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/sync-status:
    get:
      operationId: listSyncStatus
      summary: List delta sync status per entity binding
      description: One row per entity binding that has a schedule (the scheduleCron of a migrate project on its connection profile) or has been configured, in entity order. Shows the last run, the last success, the watermark, when the binding is next due (which already includes the failure backoff), consecutive failures, rows loaded and rejected so far, and open conflicts. Callers must be tenant-wide.
      x-passage-duty: migration.run
      parameters:
        - { name: paused, in: query, description: Only paused (true) or only running (false) schedules., schema: { type: boolean } }
        - { name: failing, in: query, description: Only bindings whose last runs failed (consecutiveFailures above 0)., schema: { type: boolean } }
        - { name: cursor, in: query, description: "The nextCursor of the previous page; a cursor from another list is a 400 COM-0001.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Sync status rows. Pass nextCursor as cursor for the next page; it is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/SyncStatus' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/sync-status/{id}:
    parameters:
      - { name: id, in: path, required: true, description: The entity binding id., schema: { type: string, format: uuid } }
    get:
      operationId: getSyncStatus
      summary: Get the delta sync status of an entity binding
      description: A binding that was never scheduled answers version 0 with no times. Callers must be tenant-wide.
      x-passage-duty: migration.run
      responses:
        '200':
          description: The sync status.
          content: { application/json: { schema: { $ref: '#/components/schemas/SyncStatus' } } }
        '404':
          description: AUTH-0404, no entity binding with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateSyncStatus
      summary: Pause, resume or configure the delta sync of an entity binding
      description: Pauses or resumes the schedule, gives the binding its own cron (scheduleCron; the project's scheduleCron stays the default for bindings without one), sets which system wins when both changed a record (sourceOfTruth legacy or passage), sets how often a binding with a cursor is read in full to find rows the legacy system deleted (keyCheckHours), asks for the next run to be a full read that looks for deleted rows (keyCheckNow), accepts once a full read that would list more than half of the loaded keys still present as newly absent (keyCheckAcceptLarge; refused with keyCheckError otherwise), or makes the binding due now (runNow; the scheduler starts it on its next pass). Master data flows legacy to Passage (decision B4); with passage as the source of truth a legacy row that differs from the loaded record is held as a conflict and not applied. Needs the version from the status (0 for a binding never scheduled). A paused binding is skipped, keeps its watermark and resumes where it stopped.
      x-passage-duty: migration.project.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSyncStatus' } } }
      responses:
        '200':
          description: The updated status with its new version.
          content: { application/json: { schema: { $ref: '#/components/schemas/SyncStatus' } } }
        '400':
          description: COM-0001, the version is missing, sourceOfTruth is not legacy or passage, scheduleCron is not a five-field cron with at least 15 minutes between runs or is sent with runNow, keyCheckHours is outside 0 to 8760, or nothing to change was sent.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: AUTH-0404, no entity binding with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-VERSION-CONFLICT, the version is stale.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-SYNC-NO-PROJECT, scheduleCron was set but no active migrate project uses the binding's connection profile, so there is nothing to run the binding under.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/sync-status/{id}/absent:
    parameters:
      - { name: id, in: path, required: true, description: The entity binding id., schema: { type: string, format: uuid } }
    get:
      operationId: listSyncAbsent
      summary: List source keys the legacy system no longer has
      description: A delta over a cursor cannot see a row the legacy system deleted, so a binding with a cursor is read in full once its key check is due (keyCheckHours, 24 by default, 0 turns it off), and a binding without a cursor is read in full on every run. The keys a full read did not find but an earlier run loaded are listed here in source key order, with the Passage record they were loaded into; only keys of the project's source system and, for an entity scoped to a legal entity, of the project's target legal entity are listed, and keyCheckError on the status says when a full read could not produce the list. Nothing is deactivated in Passage; the list is for the operator. A key that comes back leaves the list at the next full read. Callers must be tenant-wide.
      x-passage-duty: migration.run
      parameters:
        - { name: cursor, in: query, description: "The nextCursor of the previous page; a cursor from another list is a 400 COM-0001.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Absent keys. Pass nextCursor as cursor for the next page; it is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/SyncAbsent' } }, nextCursor: { type: string } } } } }
        '400':
          description: COM-0001, the cursor or the limit is not valid.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: AUTH-0404, no entity binding with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/sync-conflicts:
    get:
      operationId: listSyncConflicts
      summary: List sync conflicts
      description: Legacy rows held back because Passage is the source of truth of their binding, newest first, with the legacy values that were not applied. Callers must be tenant-wide.
      x-passage-duty: migration.run
      parameters:
        - { name: bindingId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [open, kept, accepted] } }
        - { name: cursor, in: query, description: "The nextCursor of the previous page.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Conflicts. Pass nextCursor as cursor for the next page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/SyncConflict' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/sync-conflicts/{id}:resolve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: resolveSyncConflict
      summary: Resolve a sync conflict
      description: Send the conflict's version as read; a run that replaced the held legacy values since makes it stale (409 MIG-VERSION-CONFLICT), so nothing is decided on values the operator did not see. keep_passage closes the conflict and remembers the legacy row's content hash, so the same row is not reported again until legacy changes it again. accept_legacy writes the held legacy values into the Passage record through the loader, under the version recorded at the last load, and closes the conflict only when the owning service accepted them; if the record changed in Passage after that load the owning service refuses (409 MIG-SYNC-ACCEPT-FAILED) and the conflict stays open, because the loader cannot yet read the current version to overwrite it.
      x-passage-duty: migration.run
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [resolution, version], properties: { resolution: { type: string, enum: [accept_legacy, keep_passage] }, version: { type: integer, minimum: 1, description: The conflict version the decision was made on. } } } } }
      responses:
        '200':
          description: The resolved conflict.
          content: { application/json: { schema: { $ref: '#/components/schemas/SyncConflict' } } }
        '400':
          description: COM-0001, resolution is not accept_legacy or keep_passage, or the version is missing.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: AUTH-0404, no conflict with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-CONFLICT-RESOLVED, the conflict is already resolved; MIG-VERSION-CONFLICT, a run replaced the held legacy values after the version sent; MIG-SYNC-ACCEPT-FAILED, the owning service refused the legacy values.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '501':
          description: MIG-SYNC-ACCEPT-UNAVAILABLE, the deployment has no loader wiring (target addresses and signing key).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '502':
          description: MIG-SYNC-ACCEPT-FAILED, the owning service could not be reached.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/config-packages:
    get:
      operationId: listConfigPackages
      summary: List applied configuration packages
      description: Packages applied to this tenant, newest first, with their applied history. The manifest files are returned by the single-package read.
      x-passage-duty: migration.run
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Packages without their manifest files.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ConfigPackage' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/config-packages/{id}:
    get:
      operationId: getConfigPackage
      summary: Get a configuration package
      description: Returns one applied package with its manifest files and applied history.
      x-passage-duty: migration.run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The package with its manifest files.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConfigPackage' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/config-packages:diff:
    post:
      operationId: diffConfigPackage
      summary: Diff a configuration package against the target
      description: Verifies the signature, file hashes and schema version, then reports per file, in dependency order, which records apply would create or update. Nothing is written and nothing is recorded.
      x-passage-duty: migration.run
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConfigPackageRequest' } } }
      responses:
        '200':
          description: Counts and record keys per bucket; deletes are never reported because apply never deletes.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConfigPackageDiff' } } }
        '422':
          description: MIG-PKG-SIGNATURE, the signature or a file sha256 does not match; MIG-PKG-SCHEMA-NEWER, the package schema is newer than the target supports; MIG-PKG-INVALID, the manifest is cyclic, lists an unknown file or repeats a record key. Messages never include record bodies.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '501':
          description: MIG-NOT-CONFIGURED, no package target or tenant signing key is wired in this deployment.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/config-packages:apply:
    post:
      operationId: applyConfigPackage
      summary: Apply a configuration package
      description: Verifies the package, writes created and updated records in manifest dependency order, never deletes target records, and appends an applied entry with the diff counts. A second apply of the same package reports no changes. The Idempotency-Key header is required; a replay returns the original response.
      x-passage-duty: migration.package.apply
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConfigPackageRequest' } } }
      responses:
        '200':
          description: Applied counts and the stored package id, or the original response on an Idempotency-Key replay.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConfigPackageApplied' } } }
        '422':
          description: MIG-PKG-SIGNATURE, MIG-PKG-SCHEMA-NEWER or MIG-PKG-INVALID as for diff; idempotency_key_reuse, the key was used with a different package. Nothing is written.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '501':
          description: MIG-NOT-CONFIGURED, no package target or tenant signing key is wired in this deployment.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/outbound-mappings:
    get:
      operationId: listOutboundMappings
      summary: List outbound mappings
      description: Outbound mappings (Passage events pushed to a legacy ERP) in name order, optionally filtered by status, paged with the opaque nextCursor. Each row is the header of the current version; the definition is read with the single-mapping route. Callers must be tenant-wide.
      x-passage-duty: migration.run
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page of outbound mappings; nextCursor is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/OutboundMapping' } }, nextCursor: { type: string } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createOutboundMapping
      summary: Create an outbound mapping
      description: Defines how one Passage CloudEvent type (an exact type or a pattern such as dev.passage.sales.order.*.v1) becomes the request body the integration hub pushes to the customer's legacy ERP. The definition reuses the mapping DSL in the Passage-to-legacy direction. Version 1 is stored; every later change writes a new immutable version. The legacy source system is fixed at creation.
      x-passage-duty: migration.project.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOutboundMapping' } } }
      responses:
        '201':
          description: The mapping was created at version 1.
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/OutboundMapping' } } }
        '200':
          description: The Idempotency-Key was replayed; the stored mapping is returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/OutboundMapping' } } }
        '409':
          description: MIG-OUTBOUND-NAME-EXISTS, a mapping with this name already exists.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-OUTBOUND-INVALID or MIG-MAP-*, the definition is not valid; or idempotency_key_reuse.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/outbound-mappings/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOutboundMapping
      summary: Get an outbound mapping
      description: Returns the mapping with the definition of its current version, or of the version named in the query.
      x-passage-duty: migration.run
      parameters:
        - { name: version, in: query, description: A version to read instead of the current one., schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The mapping and one version's definition.
          content: { application/json: { schema: { $ref: '#/components/schemas/OutboundMapping' } } }
        '404':
          description: MIG-OUTBOUND-NOT-FOUND or MIG-OUTBOUND-VERSION-NOT-FOUND.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateOutboundMapping
      summary: Change an outbound mapping
      description: Writes the next version under the caller's version (409 MIG-VERSION-CONFLICT when it is stale). A new definition replaces the whole mapping; a rename or an archive carries the current definition into the new version. An archived mapping is not rendered; it can only be reactivated.
      x-passage-duty: migration.project.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOutboundMapping' } } }
      responses:
        '200':
          description: The mapping at its new version.
          content: { application/json: { schema: { $ref: '#/components/schemas/OutboundMapping' } } }
        '404':
          description: MIG-OUTBOUND-NOT-FOUND.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-VERSION-CONFLICT, MIG-OUTBOUND-NAME-EXISTS or MIG-OUTBOUND-ARCHIVED.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-OUTBOUND-INVALID or MIG-MAP-*, the definition is not valid.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/outbound-mappings/{id}/versions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listOutboundMappingVersions
      summary: List the versions of an outbound mapping
      description: The history of a mapping, newest first, with each version's checksum, author and time.
      x-passage-duty: migration.run
      responses:
        '200':
          description: The versions.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/OutboundVersion' } } } } } }
        '404':
          description: MIG-OUTBOUND-NOT-FOUND.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/outbound-mappings/{id}:preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: previewOutboundMapping
      summary: Preview a stored outbound mapping
      description: Renders a sample event through the mapping (current version, or the one named) and shows the result, or why there is none. It reads the cross-reference and writes nothing. A problem with the sample (an unresolved reference, a rejected field) is a 200 with status unresolved or rejected.
      x-passage-duty: migration.run
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PreviewOutboundMapping' } } }
      responses:
        '200':
          description: The preview.
          content: { application/json: { schema: { $ref: '#/components/schemas/OutboundPreview' } } }
        '404':
          description: MIG-OUTBOUND-NOT-FOUND or MIG-OUTBOUND-VERSION-NOT-FOUND.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/outbound-mappings:preview:
    post:
      operationId: previewOutboundDraft
      summary: Preview an outbound mapping draft
      description: Renders a sample event through a definition that is not saved, so a mapping can be tried before it is created. An invalid definition is a 200 with status invalid.
      x-passage-duty: migration.run
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PreviewOutboundDraft' } } }
      responses:
        '200':
          description: The preview.
          content: { application/json: { schema: { $ref: '#/components/schemas/OutboundPreview' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/outbound-mappings/{id}:render:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: renderOutboundMapping
      summary: Render an event for the legacy ERP
      description: "Called by the integration hub (service token, issuer integration-hub). Builds the request body for one CloudEvent through the mapping. It is pure: the same mapping version and event give the same answer, nothing is written and nothing is sent. The event's legalentityid extension must be the legal entity of the service token. The idempotencyKey is derived from the mapping id and the event id only, so it is the same for every render of one event whatever the mapping version. A reference the event carries that has no legacy key yet is 422 MIG-XREF-UNRESOLVED, listing each one. Legacy keys are resolved for the token's legal entity only: a record whose cross-reference row belongs to another legal entity is unresolved too, with the same answer as an id that was never loaded, so the response never shows that it exists elsewhere. Rows of tenant-wide master data (party, product, item) resolve in every legal entity."
      x-passage-duty: migration.outbound.render
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RenderOutboundMapping' } } }
      responses:
        '200':
          description: The request body, the idempotency key and the Passage records the legacy key of the push belongs to (passed back to xref:record).
          content: { application/json: { schema: { $ref: '#/components/schemas/RenderedOutbound' } } }
        '404':
          description: MIG-OUTBOUND-NOT-FOUND or MIG-OUTBOUND-VERSION-NOT-FOUND (always with a problem code; a 404 without one means the route is not deployed).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403':
          description: AUTH-0003, the caller is not the integration hub; or MIG-OUTBOUND-LEGAL-ENTITY, the event's legalentityid is missing or is not the legal entity of the service token.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-OUTBOUND-ARCHIVED, the mapping is archived.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-XREF-UNRESOLVED (the unresolved array lists every reference with no legacy key), MIG-OUTBOUND-REJECTED, MIG-OUTBOUND-EVENT-INVALID or MIG-OUTBOUND-EVENT-MISMATCH.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/UnresolvedProblem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/xref:record:
    post:
      operationId: recordOutboundXref
      summary: Record the legacy key of a pushed record
      description: "Called by the integration hub (service token, issuer integration-hub) after the legacy ERP accepted a push and answered with the key it assigned. Stores the key in the cross-reference so later events about the record resolve it, and the record resolves in both directions. Only the subject entities of the mapping (the header's and its collections') are recorded, every ref in one transaction (one conflict undoes the call), and an existing cross-reference row is never repointed. A subject the owning service keeps per legal entity (everything except party, product and item) is recorded with the token's legal entity, which later lookups from other legal entities do not resolve. An existing row is never changed, its legal entity included: one already tagged with another legal entity is 409 MIG-XREF-CONFLICT, an untagged one is accepted and stays untagged. Idempotent on eventId: a repeat of the same call is 204 again; the same event with another key is 409."
      x-passage-duty: migration.xref.record
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecordOutboundXref' } } }
      responses:
        '204': { description: The legacy key is recorded (or was already, for the same event). }
        '400':
          description: COM-0001, a field is missing or malformed (more than one ref without its own legacyKey, a ref id that is not a UUID, an empty legacy key or event id).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '403':
          description: AUTH-0003, the caller is not the integration hub.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '404':
          description: MIG-OUTBOUND-NOT-FOUND, no outbound mapping with this id.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-XREF-EVENT-CONFLICT (the event already recorded another key or record) or MIG-XREF-CONFLICT (the legacy key belongs to another Passage record).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: MIG-XREF-REF-MISMATCH, a ref's entity is neither the subject entity nor a collection subject entity of the mapping.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/xref:resolve:
    get:
      operationId: resolveXref
      summary: Resolve legacy keys to the Passage ids this service loaded
      description: "For a loading service (service token; duty migration.xref.read, granted to migration-factory): the Passage id of each legacy key of one entity from one source system, following a party merge to the surviving record (#49, H-S8-6: the migration factory resolves an open item's legacy customer). Keys the cross-reference does not hold are left out. The token's legal-entity scope applies, so a customer row of another legal entity is not found; a customer key is the legacy company and account joined by |, such as USMF|C-1001."
      x-passage-duty: migration.xref.read
      parameters:
        - { name: sourceSystem, in: query, required: true, schema: { type: string, maxLength: 64 }, description: "ax2012, d365fo, sap_ecc, sap_s4 or a custom system" }
        - { name: entity, in: query, required: true, schema: { type: string, maxLength: 64 }, description: such as customer }
        - { name: keys, in: query, required: true, schema: { type: string }, description: 1 to 500 legacy keys separated by commas }
      responses:
        '200':
          description: The keys the cross-reference holds, in the order asked.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [sourceKey, targetId]
                      properties:
                        sourceKey: { type: string }
                        targetId: { type: string, format: uuid }
        '400':
          description: COM-0001, a parameter is missing or there are more than 500 keys.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/migration-settings:
    get:
      operationId: getMigrationSettings
      summary: Read the tenant's migration settings
      description: The tenant-wide migration settings. A tenant that never saved them reads the defaults (recurringMinIntervalMin 15) with version 0 and no updatedAt.
      x-passage-duty: migration.run
      responses:
        '200':
          description: The settings.
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationSettings' } } }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: putMigrationSettings
      summary: Save the tenant's migration settings
      description: Sets mig.recurring.min_interval_min, the shortest gap a project or binding cron may leave between two scheduled runs (15 to 1,440 minutes). It governs schedules saved afterwards; schedules already stored keep running. Send the version you read (0 when the tenant never saved settings).
      x-passage-duty: migration.project.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PutMigrationSettings' } } }
      responses:
        '200':
          description: The saved settings with the next version.
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationSettings' } } }
        '400':
          description: COM-0001, the version is missing or negative, or recurringMinIntervalMin is missing or outside 15 to 1,440.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409':
          description: MIG-VERSION-CONFLICT, the version is stale; the detail names the current one.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/integration/lookup-tables:
    get:
      operationId: listLookupTables
      summary: List lookup tables
      description: Lookup tables (keyed values an outbound mapping reads while it renders) in name order, optionally filtered by status and kind, paged with the opaque nextCursor. Each row is the header of the current version; the entries are read with the single-table route. Callers must be tenant-wide.
      x-passage-duty: migration.run
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
        - { name: kind, in: query, schema: { type: string, enum: [enum, uom_conversion, price_list] } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page of lookup tables; nextCursor is absent on the last page.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LookupTable' } }, nextCursor: { type: string } } } } }
        '400':
          description: A filter or the cursor is not valid.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createLookupTable
      summary: Create a lookup table
      description: Defines a tenant lookup table of a kind (enum codes, unit-of-measure conversion factors keyed FROM|TO, or a price list). Version 1 is stored; every later change writes a new immutable version. Outbound mappings refer to a table by name in their lookups and render with its current version; the outbound preview routes show the result.
      x-passage-duty: migration.project.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
