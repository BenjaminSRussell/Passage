apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: org
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: org
  template:
    metadata:
      labels:
        app.kubernetes.io/name: org
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: org
          image: {{ include "org.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            {{- if .Values.migrateDatabaseSecret }}
            - name: MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migrateDatabaseSecret }}
                  key: DATABASE_URL
            {{- end }}
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            - name: ORG_HIERARCHY_MAX_NODES
              value: {{ .Values.hierarchy.maxNodes | quote }}
            - name: ORG_HIERARCHY_MAX_DEPTH
              value: {{ .Values.hierarchy.maxDepth | quote }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
