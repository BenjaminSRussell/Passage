# Same-namespace pods reach the API; Prometheus reaches the admin port. A caller or
# ingress controller in another namespace is denied until it is listed in
# networkPolicy.ingressNamespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: org
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: org
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.metricsNamespace }}
      ports:
        - { protocol: TCP, port: 9090 }
