asyncapi: 3.0.0
info:
  title: org
  version: 0.8.0
  description: CloudEvents 1.0 envelope from platform/go/events; payloads below are the data member.
channels:
  passage.org.legalentity:
    address: passage.org.legalentity
    messages:
      created:
        $ref: '#/components/messages/legalEntityCreated'
      updated:
        $ref: '#/components/messages/legalEntityUpdated'
  passage.org.operatingunit:
    address: passage.org.operatingunit
    messages:
      created:
        $ref: '#/components/messages/operatingUnitCreated'
      updated:
        $ref: '#/components/messages/operatingUnitUpdated'
  passage.org.site:
    address: passage.org.site
    messages:
      created:
        $ref: '#/components/messages/siteCreated'
      updated:
        $ref: '#/components/messages/siteUpdated'
  passage.org.warehouse:
    address: passage.org.warehouse
    messages:
      created:
        $ref: '#/components/messages/warehouseCreated'
      updated:
        $ref: '#/components/messages/warehouseUpdated'
  passage.org.fiscalcalendar:
    address: passage.org.fiscalcalendar
    messages:
      generated:
        $ref: '#/components/messages/fiscalCalendarGenerated'
  passage.org.hierarchyversion:
    address: passage.org.hierarchyversion
    messages:
      activated:
        $ref: '#/components/messages/hierarchyVersionActivated'
  passage.org.location:
    address: passage.org.location
    messages:
      created:
        $ref: '#/components/messages/locationCreated'
      updated:
        $ref: '#/components/messages/locationUpdated'
  passage.org.address:
    address: passage.org.address
    messages:
      changed:
        $ref: '#/components/messages/addressChanged'
  passage.org.currencyrounding:
    address: passage.org.currencyrounding
    messages:
      changed:
        $ref: '#/components/messages/currencyRoundingChanged'
operations:
  onLegalEntityCreated:
    action: send
    channel: { $ref: '#/channels/passage.org.legalentity' }
    messages: [{ $ref: '#/channels/passage.org.legalentity/messages/created' }]
  onLegalEntityUpdated:
    action: send
    channel: { $ref: '#/channels/passage.org.legalentity' }
    messages: [{ $ref: '#/channels/passage.org.legalentity/messages/updated' }]
  onOperatingUnitCreated:
    action: send
    channel: { $ref: '#/channels/passage.org.operatingunit' }
    messages: [{ $ref: '#/channels/passage.org.operatingunit/messages/created' }]
  onOperatingUnitUpdated:
    action: send
    channel: { $ref: '#/channels/passage.org.operatingunit' }
    messages: [{ $ref: '#/channels/passage.org.operatingunit/messages/updated' }]
  onSiteCreated:
    action: send
    channel: { $ref: '#/channels/passage.org.site' }
    messages: [{ $ref: '#/channels/passage.org.site/messages/created' }]
  onSiteUpdated:
    action: send
    channel: { $ref: '#/channels/passage.org.site' }
    messages: [{ $ref: '#/channels/passage.org.site/messages/updated' }]
  onWarehouseCreated:
    action: send
    channel: { $ref: '#/channels/passage.org.warehouse' }
    messages: [{ $ref: '#/channels/passage.org.warehouse/messages/created' }]
  onWarehouseUpdated:
    action: send
    channel: { $ref: '#/channels/passage.org.warehouse' }
    messages: [{ $ref: '#/channels/passage.org.warehouse/messages/updated' }]
  onFiscalCalendarGenerated:
    action: send
    channel: { $ref: '#/channels/passage.org.fiscalcalendar' }
    messages: [{ $ref: '#/channels/passage.org.fiscalcalendar/messages/generated' }]
  onHierarchyVersionActivated:
    action: send
    channel: { $ref: '#/channels/passage.org.hierarchyversion' }
    messages: [{ $ref: '#/channels/passage.org.hierarchyversion/messages/activated' }]
  onLocationCreated:
    action: send
    channel: { $ref: '#/channels/passage.org.location' }
    messages: [{ $ref: '#/channels/passage.org.location/messages/created' }]
  onLocationUpdated:
    action: send
    channel: { $ref: '#/channels/passage.org.location' }
    messages: [{ $ref: '#/channels/passage.org.location/messages/updated' }]
  onAddressChanged:
    action: send
    channel: { $ref: '#/channels/passage.org.address' }
    messages: [{ $ref: '#/channels/passage.org.address/messages/changed' }]
  onCurrencyRoundingChanged:
    action: send
    channel: { $ref: '#/channels/passage.org.currencyrounding' }
    messages: [{ $ref: '#/channels/passage.org.currencyrounding/messages/changed' }]
components:
  messages:
    legalEntityCreated:
      name: created
      title: Legal entity created
      payload:
        type: object
        required: [id, code, name, country_code, accounting_currency, time_zone]
        properties:
          id: { type: string, format: uuid }
          code: { type: string }
          name: { type: string }
          country_code: { type: string }
          accounting_currency: { type: string }
          time_zone: { type: string }
      x-passage-type: dev.passage.org.legalentity.created.v1
    legalEntityUpdated:
      name: updated
      title: Legal entity updated
      payload:
        type: object
        required: [id, changed_fields, version]
        properties:
          id: { type: string, format: uuid }
          changed_fields: { type: array, items: { type: string } }
          version: { type: integer }
      x-passage-type: dev.passage.org.legalentity.updated.v1
    operatingUnitCreated:
      name: created
      title: Operating unit created
      payload:
        type: object
        required: [id, type, code, name]
        properties:
          id: { type: string, format: uuid }
          type: { type: string }
          code: { type: string }
          name: { type: string }
      x-passage-type: dev.passage.org.operatingunit.created.v1
    operatingUnitUpdated:
      name: updated
      title: Operating unit updated
      payload:
        type: object
        required: [id, changed_fields, version]
        properties:
          id: { type: string, format: uuid }
          changed_fields: { type: array, items: { type: string } }
          version: { type: integer }
      x-passage-type: dev.passage.org.operatingunit.updated.v1
    siteCreated:
      name: created
      title: Site created
      payload:
        type: object
        required: [id, legal_entity_id, parent_id, type, address_id]
        properties:
          id: { type: string, format: uuid }
          legal_entity_id: { type: string, format: uuid }
          parent_id: { type: [string, 'null'], format: uuid }
          type: { type: [string, 'null'] }
          address_id: { type: [string, 'null'], format: uuid, description: Null until the address slice. }
      x-passage-type: dev.passage.org.site.created.v1
    siteUpdated:
      name: updated
      title: Site updated
      payload:
        type: object
        required: [id, changed_fields, version]
        properties:
          id: { type: string, format: uuid }
          changed_fields: { type: array, items: { type: string } }
          version: { type: integer }
      x-passage-type: dev.passage.org.site.updated.v1
    warehouseCreated:
      name: created
      title: Warehouse created
      payload:
        type: object
        required: [id, legal_entity_id, parent_id, type, address_id]
        properties:
          id: { type: string, format: uuid }
          legal_entity_id: { type: string, format: uuid }
          parent_id: { type: [string, 'null'], format: uuid, description: The site id. }
          type: { type: [string, 'null'], description: 'standard, transit, quarantine or subcontractor' }
          address_id: { type: [string, 'null'], format: uuid, description: Null until the address slice. }
      x-passage-type: dev.passage.org.warehouse.created.v1
    warehouseUpdated:
      name: updated
      title: Warehouse updated
      payload:
        type: object
        required: [id, changed_fields, version]
        properties:
          id: { type: string, format: uuid }
          changed_fields: { type: array, items: { type: string } }
          version: { type: integer }
      x-passage-type: dev.passage.org.warehouse.updated.v1
    locationCreated:
      name: created
      title: Location created
      payload:
        type: object
        required: [id, legal_entity_id, parent_id, type, address_id]
        properties:
          id: { type: string, format: uuid }
          legal_entity_id: { type: string, format: uuid }
          parent_id: { type: [string, 'null'], format: uuid, description: The warehouse id. }
          type: { type: [string, 'null'], description: 'storage, receiving, shipping or quarantine' }
          address_id: { type: [string, 'null'], format: uuid, description: Null until the address slice. }
      x-passage-type: dev.passage.org.location.created.v1
    locationUpdated:
      name: updated
      title: Location updated
      payload:
        type: object
        required: [id, changed_fields, version]
        properties:
          id: { type: string, format: uuid }
          changed_fields: { type: array, items: { type: string } }
          version: { type: integer }
      x-passage-type: dev.passage.org.location.updated.v1
    addressChanged:
      name: changed
      title: Address changed
      description: Emitted for every new address version, on create and on every PATCH.
      payload:
        type: object
        required: [address_id, version_id, owner_type, owner_id, purposes, valid_from]
        properties:
          address_id: { type: string, format: uuid, description: Stable across versions. }
          version_id: { type: string, format: uuid, description: The postal_address row that documents hold. }
          owner_type: { type: string, enum: [legal_entity, operating_unit, site, warehouse, location, party] }
          owner_id: { type: string, format: uuid }
          purposes: { type: array, items: { type: string, enum: [business, delivery, invoice, remit_to, service, home, other] } }
          valid_from: { type: string, format: date }
      x-passage-type: dev.passage.org.address.changed.v1
    fiscalCalendarGenerated:
      name: generated
      title: Fiscal year generated
      description: Emitted when a fiscal year's periods are first generated and again on every forced regeneration; an idempotent replay emits nothing.
      payload:
        type: object
        required: [calendar_id, fiscal_year, periods]
        properties:
          calendar_id: { type: string, format: uuid }
          fiscal_year: { type: integer }
          periods:
            type: array
            items:
              type: object
              required: [period_no, name, start_date, end_date, type, week53]
              properties:
                period_no: { type: integer }
                name: { type: string }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                type: { type: string, enum: [opening, operating, closing, adjustment] }
                week53: { type: boolean }
      x-passage-type: dev.passage.org.fiscalcalendar.generated.v1
    hierarchyVersionActivated:
      name: activated
      title: Hierarchy version activated
      description: Emitted when a draft hierarchy version is published, also for a future effective_from; the activation timer at effective_from is not built.
      payload:
        type: object
        required: [hierarchy_type_id, purposes, version_id, version_no, effective_from, node_count, superseded_version_id, backdate_reason]
        properties:
          hierarchy_type_id: { type: string, format: uuid }
          purposes: { type: array, items: { type: string } }
          version_id: { type: string, format: uuid }
          version_no: { type: integer }
          effective_from: { type: string, format: date }
          node_count: { type: integer }
          superseded_version_id: { type: [string, 'null'], format: uuid }
          backdate_reason: { type: [string, 'null'], description: The audit reason of a backdated publish. }
      x-passage-type: dev.passage.org.hierarchyversion.activated.v1
    currencyRoundingChanged:
      name: changed
      title: Currency rounding rule changed
      description: Emitted by a PUT of a currency rounding rule that creates a row or changes its unit or method; an identical repeat emits nothing. Also emitted by a DELETE of a rule, carrying the rule now in force (the tenant row, or the currency's minor unit with half_even). legal_entity_id is null for a tenant row.
      payload:
        type: object
        required: [currency_code, purpose, unit, method]
        properties:
          currency_code: { type: string }
          purpose: { type: string }
          legal_entity_id: { type: [string, 'null'], format: uuid }
          unit: { type: string }
          method: { type: string }
      x-passage-type: dev.passage.org.currencyrounding.changed.v1
