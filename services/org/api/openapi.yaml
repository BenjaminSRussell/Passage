        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: pattern, in: query, schema: { type: string, enum: [calendar, 4-4-5, 4-5-4, 5-4-4, 13-period, custom] } }
      responses:
        '200':
          description: Fiscal calendars ordered by code, each with generatedYears, the ascending fiscal years that have periods; a calendar with at least one generated year can be assigned to a legal entity. 400 COM-0001 for an invalid status, pattern, limit or cursor.
          content: { application/json: { schema: { $ref: '#/components/schemas/FiscalCalendarList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/fiscal-calendars/{id}:
    patch:
      operationId: updateFiscalCalendar
      x-passage-duty: org.fiscal-calendar.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateFiscalCalendar' } } }
      responses:
        '200':
          description: The calendar. A stale version is 409 ORG-VERSION-CONFLICT. A request that changes no value returns the stored calendar with the same version. 400 COM-0001 for a field error or for code, pattern, startMonth, weekStart, openingClosing or specialPeriods, which are immutable. 404 ORG-CAL-NOT-FOUND. 409 ORG-CAL-IN-USE when status inactive is requested while active legal entities or active sites are assigned to the calendar; the detail reads "Fiscal calendar {code} is assigned to N active legal entities." or, when sites hold it, "... N active legal entities and M active sites.". 403 AUTH-0003 without the duty or for a legal-entity-scoped caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/FiscalCalendar' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: getFiscalCalendar
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One fiscal calendar. A malformed id, an unknown id and another tenant's id are all 404 ORG-CAL-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/FiscalCalendar' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/fiscal-calendars/{id}:generate:
    post:
      operationId: generateFiscalYear
      x-passage-duty: org.fiscal-calendar.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GenerateFiscalYear' } } }
      responses:
        '200':
          description: Idempotent replay. The year already exists and force was not set, so the stored periods are returned with generated false, nothing is written and no event is emitted.
          content: { application/json: { schema: { $ref: '#/components/schemas/FiscalYear' } } }
        '201':
          description: The year was generated, or regenerated with force, and one fiscalcalendar.generated event was emitted. 400 COM-0001 for a missing or non-integer fiscalYear or a malformed date. 404 ORG-CAL-NOT-FOUND. 409 ORG-CAL-LOCKED when force is set and the ledger reports postings in the year. 422 ORG-CAL-PATTERN when periods are missing on a custom calendar or sent to another pattern; 422 ORG-CAL-GAP or ORG-CAL-OVERLAP when custom periods do not tile the year. 422 ORG-CAL-INACTIVE when the calendar is inactive and the year is not already generated. 503 COM-0503 when the ledger posting check fails. 403 AUTH-0003 without the duty or for a legal-entity-scoped caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/FiscalYear' } } }
        default: { $ref: '#/components/responses/Problem' }
