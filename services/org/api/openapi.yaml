          description: Quantity converted over the caller's visible, active units and conversions. quantity is rounded to 12 decimals; displayQuantity is rounded to the target unit's decimal precision. An unknown or inactive unit, or a pair with no path, returns 422 ORG-UOM-NO-PATH.
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversion' } } }
        default: { $ref: '#/components/responses/Problem' }
