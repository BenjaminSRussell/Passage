openapi: 3.1.0
info:
  title: org
  version: 0.13.0
  description: Organization service. Covers legal entities, operating units, sites, warehouses, locations, postal addresses with purposes, fiscal calendars with idempotent year generation and the period read, hierarchy types and draft hierarchy versions with validated node sets (error codes ORG-HIER-CYCLE, ORG-HIER-MULTI-ROOT, ORG-HIER-DUPLICATE-NODE, ORG-HIER-PARENT-UNKNOWN, ORG-HIER-DEPTH, ORG-HIER-SIZE, ORG-HIER-NODE-UNKNOWN, ORG-HIER-TYPE-NOT-FOUND, ORG-HIER-TYPE-CODE-DUPLICATE, ORG-HIER-VERSION-NOT-FOUND, ORG-HIER-DRAFT-EXISTS, ORG-HIER-VERSION-IMMUTABLE, ORG-HIER-OVERLAP, ORG-HIER-BACKDATE-DUTY, ORG-HIER-NO-VERSION, ORG-HIER-NODE-ABSENT, ORG-HIER-MAKER-CHECKER) with the version list, publish, supersede, the closure table, the as-of query and the version comparison, unit-of-measure conversion, the platform-owned reference sets (countries, currencies, regions, languages) with tenant-level deactivation, currency rounding rules with the round route and the rule delete (error codes ORG-CUR-ROUNDING-UNIT, ORG-CUR-ROUNDING-NOT-FOUND), and the unit conversions report with tenant-owned conversions (error codes ORG-UOM-CLASS-MISMATCH, ORG-UOM-CONVERSION-DUPLICATE, ORG-UOM-UNIT-INACTIVE).
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/org/legal-entities:
    post:
      operationId: createLegalEntity
      x-passage-duty: org.legal-entity.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateLegalEntity' } } }
      responses:
        '201':
          description: Legal entity created, or the original entity on an Idempotency-Key replay.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegalEntity' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listLegalEntities
      x-passage-duty: org.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: country, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: currency, in: query, schema: { type: string, pattern: '^[A-Z]{3}$' } }
      responses:
        '200':
          description: One page of legal entities of the caller's tenant visible to the caller's legal-entity scope, ordered by code. Pass nextCursor as cursor for the next page.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LegalEntity' } }, nextCursor: { type: string } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/legal-entities/{id}:
    get:
      operationId: getLegalEntity
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One legal entity. A malformed id, an unknown id and an id outside the caller's legal-entity scope are all ORG-LE-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegalEntity' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateLegalEntity
      x-passage-duty: org.legal-entity.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateLegalEntity' } } }
      responses:
        '200':
          description: The legal entity. A stale version is 409 ORG-VERSION-CONFLICT. A request that changes no value returns the stored entity with the same version and emits no event. 422 ORG-LE-CALENDAR-INVALID, field fiscalCalendarId, when the calendar is unknown, inactive or has no generated year. Changing the default language to an unknown or inactive language is 422 ORG-LE-REFERENCE-INACTIVE. 400 COM-0001 for a field error. 404 ORG-LE-NOT-FOUND. 422 ORG-ADDR-NOT-OWNED, naming the field in errors, when the address pointer is not a current address owned by this record; an old version id, another owner's address and an address outside the caller's scope all fail. 403 AUTH-0003 without the duty.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegalEntity' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/legal-entities/{id}/fiscal-period:
    get:
      operationId: resolveLegalEntityFiscalPeriod
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The operating period of the legal entity's fiscal calendar that contains the date, with source legalEntity. Opening, closing and adjustment periods are never returned. An inactive calendar still resolves. 400 COM-0001 naming date when it is missing or not YYYY-MM-DD. 404 ORG-LE-NOT-FOUND for a malformed, unknown or out-of-scope id. 404 ORG-CAL-PERIOD-NOT-FOUND when no generated period of the calendar contains the date. 422 ORG-LE-NO-CALENDAR when the legal entity has no calendar. 403 AUTH-0003 without the duty.
          content: { application/json: { schema: { $ref: '#/components/schemas/FiscalPeriodResolution' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/legal-entities/{id}/names:
    get:
      operationId: listLegalEntityNames
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Name history of the legal entity, newest first. The current name has no validTo.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LegalEntityName' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/operating-units:
    post:
      operationId: createOperatingUnit
      x-passage-duty: org.operating-unit.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOperatingUnit' } } }
      responses:
        '201':
          description: Operating unit created, or the original unit on an Idempotency-Key replay. 400 COM-0001 for a field error. 409 ORG-OU-CODE-DUPLICATE when the code exists for the type. 422 ORG-OU-LEGAL-ENTITY-INVALID when the default legal entity is unknown, inactive or outside the caller's scope. 422 idempotency_key_reuse when the key was used with a different body.
          content: { application/json: { schema: { $ref: '#/components/schemas/OperatingUnit' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listOperatingUnits
      x-passage-duty: org.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [department, cost_center, business_unit, value_stream] } }
        - { name: defaultLegalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: hierarchyTypeId, in: query, schema: { type: string, format: uuid }, description: Return only operating units that are nodes of the version of this hierarchy type in force on asOf (published or superseded, never a draft) }
        - { name: asOf, in: query, schema: { type: string, format: date }, description: Allowed only together with hierarchyTypeId; defaults to today (UTC) }
      responses:
        '200':
          description: One page of the tenant's operating units, ordered by type then code; legal-entity-scoped callers see every unit. Pass nextCursor as cursor for the next page. A bad filter or cursor is 400 COM-0001, including a malformed hierarchyTypeId or asOf and asOf without hierarchyTypeId. A type with no version in force on asOf gives an empty list.
          content: { application/json: { schema: { $ref: '#/components/schemas/OperatingUnitList' } } }
        '404':
          description: ORG-HIER-TYPE-NOT-FOUND when hierarchyTypeId names no hierarchy type of the tenant.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/operating-units/{id}:
    get:
      operationId: getOperatingUnit
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One operating unit. A malformed id and an unknown id are both 404 ORG-OU-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/OperatingUnit' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateOperatingUnit
      x-passage-duty: org.operating-unit.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOperatingUnit' } } }
      responses:
        '200':
          description: The operating unit. A stale version is 409 ORG-VERSION-CONFLICT. A request that changes no value returns the stored unit with the same version and emits no event. An empty defaultLegalEntityId or managerPartyId clears it. 400 COM-0001 for a field error or managerPartyId on a unit that is not a cost_center. 404 ORG-OU-NOT-FOUND. 422 ORG-OU-LEGAL-ENTITY-INVALID for an unknown, inactive or out-of-scope default legal entity.
          content: { application/json: { schema: { $ref: '#/components/schemas/OperatingUnit' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/team-types:
    get:
      operationId: listTeamTypes
      x-passage-duty: org.read
      parameters:
        - { name: memberKind, in: query, schema: { type: string, enum: [user, party] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of team types ordered by code; memberKind matches types that allow that kind. Team types are tenant-wide, so a legal-entity-scoped caller reads them too. Pass nextCursor as cursor for the next page. 400 COM-0001 naming memberKind, limit or cursor. 403 AUTH-0003 without org.read.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeamTypePage' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createTeamType
      x-passage-duty: org.operating-unit.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTeamType' } } }
      responses:
        '201':
          description: Team type created, or the original type on an Idempotency-Key replay (no second row, counter not incremented). A replay must repeat memberKinds in the same order. 400 COM-0001 naming code, name or memberKinds. 409 ORG-TEAM-TYPE-CODE-DUPLICATE. 422 idempotency_key_reuse when the key was used with a different body. 403 AUTH-0003 without the duty or for a legal-entity-scoped caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeamType' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/team-types/{id}:
    get:
      operationId: getTeamType
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The team type. A legal-entity-scoped caller may read it. 403 AUTH-0003 without org.read. 404 ORG-TEAM-TYPE-NOT-FOUND for a malformed, unknown or other tenant's id.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeamType' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/teams:
    get:
      operationId: listTeams
      x-passage-duty: org.read
      parameters:
        - { name: teamTypeId, in: query, schema: { type: string, format: uuid } }
        - { name: operatingUnitId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: asOf, in: query, description: Keeps teams in force on this date; both the first and last day count. With memberId the member row must also be in force on this date, schema: { type: string, format: date } }
        - { name: memberId, in: query, description: Keeps teams that have a member row for this member id (a team appears once however many validity rows the member has), schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of teams ordered by code. Teams are tenant-wide, so a legal-entity-scoped caller reads them too. Pass nextCursor as cursor for the next page. 400 COM-0001 naming teamTypeId, operatingUnitId, status, memberId, asOf, limit or cursor. 403 AUTH-0003 without org.read.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeamPage' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createTeam
      x-passage-duty: org.operating-unit.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTeam' } } }
      responses:
        '201':
          description: Team created, or the original team on an Idempotency-Key replay (no second row, counter not incremented). 400 COM-0001 naming code, name, description, teamTypeId, operatingUnitId, effectiveFrom or effectiveTo (effectiveTo before effectiveFrom is a field error on effectiveTo). 409 ORG-TEAM-CODE-DUPLICATE. 422 ORG-TEAM-TYPE-INVALID for an unknown team type, ORG-TEAM-OPERATING-UNIT-INVALID for an unknown or inactive operating unit, ORG-TEAM-LIMIT at 5,000 teams in the tenant, idempotency_key_reuse when the key was used with a different body. 403 AUTH-0003 without the duty or for a legal-entity-scoped caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/teams/{id}:
    get:
      operationId: getTeam
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The team. A legal-entity-scoped caller may read it. 403 AUTH-0003 without org.read. 404 ORG-TEAM-NOT-FOUND for a malformed, unknown or other tenant's id.
          content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateTeam
      x-passage-duty: org.operating-unit.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTeam' } } }
      responses:
        '200':
          description: The team. A stale version is 409 ORG-VERSION-CONFLICT. A request that changes no value returns the stored team with the same version. status inactive deactivates the team (adding a member is then 422 ORG-TEAM-INACTIVE) and active reactivates it. An empty description, operatingUnitId or effectiveTo clears it. 400 COM-0001 naming version, name, description, operatingUnitId, effectiveTo or status, a body carrying code, teamTypeId or effectiveFrom, or an effectiveTo before effectiveFrom. 404 ORG-TEAM-NOT-FOUND. 422 ORG-TEAM-OPERATING-UNIT-INVALID for an unknown or inactive operating unit, ORG-TEAM-MEMBER-RANGE on effectiveTo when members are valid after it. 403 AUTH-0003 without the duty or for a legal-entity-scoped caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/teams/{id}/members:
    get:
      operationId: listTeamMembers
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, description: Keeps members valid on this date; both the first and last day count, schema: { type: string, format: date } }
        - { name: memberKind, in: query, schema: { type: string, enum: [user, party] } }
        - { name: memberRole, in: query, schema: { type: string, enum: [member, lead] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of the team's members in insertion order. A legal-entity-scoped caller may read them. Pass nextCursor as cursor for the next page. 400 COM-0001 naming asOf, memberKind, memberRole, limit or cursor. 403 AUTH-0003 without org.read. 404 ORG-TEAM-NOT-FOUND for a malformed, unknown or other tenant's team.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeamMemberPage' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: addTeamMember
      x-passage-duty: org.operating-unit.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddTeamMember' } } }
      responses:
        '201':
          description: Member added (source manual), or the original member on an Idempotency-Key replay (no second row, no second event, counter not incremented). Emits dev.passage.org.teammembership.changed.v1. 400 COM-0001 naming memberKind, memberId, memberRole, validFrom or validTo. 404 ORG-TEAM-NOT-FOUND for a malformed, unknown or other tenant's team. 409 ORG-TEAM-MEMBER-DUPLICATE for the same member and validFrom. 422 ORG-TEAM-MEMBER-KIND-INVALID when the team type does not allow the kind, ORG-TEAM-EXPIRED when the team has ended, ORG-TEAM-MEMBER-RANGE when the validity is not inside the team's effective range (a bounded team needs a bounded validTo), ORG-TEAM-MEMBER-LIMIT at 2,000 members in force, idempotency_key_reuse when the key was used with a different body. 403 AUTH-0003 without the duty or for a legal-entity-scoped caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeamMember' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/teams/{id}/members/{memberId}:end:
    post:
      operationId: endTeamMember
      x-passage-duty: org.operating-unit.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: memberId, in: path, required: true, description: The member row id from the member list, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EndTeamMember' } } }
      responses:
        '200':
          description: The member with its new validTo. Re-sending the current validTo returns the member unchanged with no event and no count. Emits dev.passage.org.teammembership.changed.v1 with empty added, one removed entry and as_of the day after validTo. Allowed on an inactive team. 400 COM-0001 naming validTo. 404 ORG-TEAM-NOT-FOUND or ORG-TEAM-MEMBER-NOT-FOUND. 422 ORG-TEAM-MEMBER-RANGE on validTo before validFrom or after the current validTo. 403 AUTH-0003 without the duty or for a legal-entity-scoped caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeamMember' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/teams/{id}/members/{memberId}:
    delete:
      operationId: removeTeamMember
      x-passage-duty: org.operating-unit.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: memberId, in: path, required: true, description: The member row id from the member list, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: A member entered in error is deleted. Emits dev.passage.org.teammembership.changed.v1 with empty added, one removed entry and as_of the row's validFrom. Allowed on an inactive team. 404 ORG-TEAM-NOT-FOUND or ORG-TEAM-MEMBER-NOT-FOUND. 422 ORG-TEAM-MEMBER-RULE-SOURCED for a rule-sourced row. 403 AUTH-0003 without the duty or for a legal-entity-scoped caller.
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/sites:
    post:
      operationId: createSite
      x-passage-duty: org.site.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSite' } } }
      responses:
        '201':
          description: Site created, or the original site on an Idempotency-Key replay. The time zone defaults to the legal entity's. 400 COM-0001 for a field error. 409 ORG-SITE-CODE-DUPLICATE when the code exists in the legal entity. 422 ORG-SITE-LEGAL-ENTITY-INVALID when the legal entity is unknown, inactive or outside the caller's scope. 422 ORG-SITE-CALENDAR-INVALID, field fiscalCalendarId, when the calendar is unknown, inactive or has no generated year. 422 idempotency_key_reuse when the key was used with a different body.
          content: { application/json: { schema: { $ref: '#/components/schemas/Site' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listSites
      x-passage-duty: org.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: One page of sites ordered by code then id; a legal-entity-scoped caller sees only that legal entity's sites. Pass nextCursor as cursor for the next page. A bad filter or cursor is 400 COM-0001.
          content: { application/json: { schema: { $ref: '#/components/schemas/SiteList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/sites/{id}:
    get:
      operationId: getSite
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One site. A malformed id, an unknown id and a site outside the caller's legal-entity scope are all 404 ORG-SITE-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/Site' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateSite
      x-passage-duty: org.site.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSite' } } }
      responses:
        '200':
          description: The site. A stale version is 409 ORG-VERSION-CONFLICT. A request that changes no value returns the stored site with the same version and emits no event. 400 COM-0001 for a field error, or for legalEntityId or code, which are immutable. 404 ORG-SITE-NOT-FOUND. 409 ORG-SITE-IN-USE when the patch sets status inactive while an active warehouse references the site. 422 ORG-SITE-CALENDAR-INVALID, field fiscalCalendarId, when the calendar is unknown, inactive or has no generated year. 422 ORG-ADDR-NOT-OWNED, naming the field in errors, when the address pointer is not a current address owned by this record; an old version id, another owner's address and an address outside the caller's scope all fail. 403 AUTH-0003 without the duty.
          content: { application/json: { schema: { $ref: '#/components/schemas/Site' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/sites/{id}/fiscal-period:
    get:
      operationId: resolveSiteFiscalPeriod
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The operating period containing the date, from the site's own calendar (source site) or, when the site has none, its legal entity's (source legalEntity). Opening, closing and adjustment periods are never returned. An inactive calendar still resolves. 400 COM-0001 naming date when it is missing or not YYYY-MM-DD. 404 ORG-SITE-NOT-FOUND for a malformed, unknown or out-of-scope id. 404 ORG-CAL-PERIOD-NOT-FOUND when no generated period of the calendar contains the date. 422 ORG-LE-NO-CALENDAR when neither the site nor its legal entity has a calendar. 403 AUTH-0003 without the duty.
