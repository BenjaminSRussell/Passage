      properties: { status: { type: string, enum: [active, inactive] } }
    Country:
      type: object
      required: [code, name, status]
      properties: { code: { type: string }, name: { type: string }, status: { type: string, enum: [active, inactive] }, regionRequired: { type: boolean }, postalRegex: { type: string } }
    Currency:
      type: object
      required: [code, name, status, numericCode, minorUnits]
      properties: { code: { type: string }, name: { type: string }, status: { type: string, enum: [active, inactive] }, numericCode: { type: string }, minorUnits: { type: integer, minimum: 0, maximum: 4 } }
    PutCurrencyRounding:
      type: object
      required: [unit, method]
      properties:
        unit: { type: string, description: 'A positive decimal with at most 6 decimal places, such as "0.05".' }
        method: { type: string, enum: [half_even, half_up, down, up] }
        legalEntityId: { type: [string, 'null'], format: uuid, description: Absent or null stores a tenant row. }
    CurrencyRounding:
      type: object
      required: [id, currencyCode, purpose, legalEntityId, unit, method, updatedAt]
      properties:
        id: { type: string, format: uuid }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        purpose: { type: string, enum: [general, price, purchase, sales, tax, cash] }
        legalEntityId: { type: [string, 'null'], format: uuid }
        unit: { type: string }
        method: { type: string, enum: [half_even, half_up, down, up] }
        updatedAt: { type: string, format: date-time }
    RoundResult:
      type: object
      required: [currency, purpose, legalEntityId, amount, rounded, unit, method, source]
      properties:
        currency: { type: string }
        purpose: { type: string, enum: [general, price, purchase, sales, tax, cash] }
        legalEntityId: { type: [string, 'null'], format: uuid }
        amount: { type: string, description: The input echoed. }
        rounded: { type: string, description: The rounded amount with exactly the unit's decimal places. }
        unit: { type: string, description: The unit with trailing zeros stripped. }
        method: { type: string, enum: [half_even, half_up, down, up] }
        source: { type: string, enum: [legal_entity, tenant, default] }
    Region:
      type: object
      required: [code, name, status, countryCode]
      properties: { code: { type: string }, name: { type: string }, status: { type: string, enum: [active, inactive] }, countryCode: { type: string } }
    Language:
      type: object
      required: [code, name, status]
      properties: { code: { type: string }, name: { type: string }, status: { type: string, enum: [active, inactive] } }
    Conversion:
      type: object
      required: [from, to, quantity, displayQuantity]
      properties: { from: { type: string }, to: { type: string }, quantity: { type: string, description: Decimal string rounded to 12 decimals }, displayQuantity: { type: string, description: Decimal string rounded to the target unit's decimal precision } }
    UomConversion:
      type: object
      required: [id, fromCode, toCode, class, factor, offset, inverseFactor, inverseOffset, roundTrip, system, productId, status]
      properties:
        id: { type: string, format: uuid }
        fromCode: { type: string }
        toCode: { type: string }
        class: { type: string }
        factor: { type: string, description: Decimal string, numeric(28,12) }
        offset: { type: string, description: Decimal string, numeric(28,12) }
        inverseFactor: { type: string, description: 1/factor rounded to 12 decimals, for display only }
        inverseOffset: { type: string, description: -offset/factor rounded to 12 decimals, for display only }
        roundTrip: { type: boolean, description: True when converting 1 from the first to the second unit and back equals 1 at 12 decimals }
        system: { type: boolean }
        productId: { type: [string, 'null'], description: Always null; product-specific conversions belong to the product wave }
        status: { type: string, enum: [active, inactive] }
    CreateUomConversion:
      type: object
      additionalProperties: false
      required: [fromCode, toCode, factor]
      properties:
        fromCode: { type: string, pattern: '^[A-Za-z0-9/%]{1,10}$' }
        toCode: { type: string, pattern: '^[A-Za-z0-9/%]{1,10}$', description: Must differ from fromCode. }
        factor: { type: string, pattern: '^[0-9]{1,16}(\.[0-9]{1,12})?$', description: Greater than 0. }
        offset: { type: [string, 'null'], pattern: '^-?[0-9]{1,16}(\.[0-9]{1,12})?$', description: Defaults to "0". }
    Unit:
      type: object
      required: [code, name, class, decimalPrecision, system, status]
      properties: { code: { type: string }, name: { type: string }, class: { type: string }, decimalPrecision: { type: integer, minimum: 0, maximum: 6 }, system: { type: boolean }, status: { type: string, enum: [active, inactive] } }
    CreateUnit:
      type: object
      additionalProperties: false
      required: [code, name, class, decimalPrecision]
      properties: { code: { type: string, pattern: '^[A-Za-z0-9/%]{1,10}$' }, name: { type: string, minLength: 1, maxLength: 120 }, class: { type: string, enum: [quantity, each, mass, length, volume, area, time, temperature, energy, pressure, power, speed] }, decimalPrecision: { type: integer, minimum: 0, maximum: 6 } }
    UnitStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties: { status: { type: string, enum: [active, inactive] } }
    Problem:
      type: object
      required: [type, title, status]
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string }, code: { type: string }, traceId: { type: string }, errors: { type: object, additionalProperties: { type: string } } }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
