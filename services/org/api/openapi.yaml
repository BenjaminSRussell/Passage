openapi: 3.1.0
info:
  title: org
  version: 0.6.0
  description: Organization service. Covers legal entities, operating units, sites, warehouses, unit-of-measure conversion, and the platform-owned reference sets (countries, currencies, regions, languages) with tenant-level deactivation.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/org/legal-entities:
    post:
      operationId: createLegalEntity
      x-passage-duty: org.legal-entity.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateLegalEntity' } } }
      responses:
        '201':
          description: Legal entity created, or the original entity on an Idempotency-Key replay.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegalEntity' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listLegalEntities
      x-passage-duty: org.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: country, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: currency, in: query, schema: { type: string, pattern: '^[A-Z]{3}$' } }
      responses:
        '200':
          description: One page of legal entities of the caller's tenant visible to the caller's legal-entity scope, ordered by code. Pass nextCursor as cursor for the next page.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LegalEntity' } }, nextCursor: { type: string } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/legal-entities/{id}:
    get:
      operationId: getLegalEntity
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One legal entity. A malformed id, an unknown id and an id outside the caller's legal-entity scope are all ORG-LE-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegalEntity' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateLegalEntity
      x-passage-duty: org.legal-entity.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateLegalEntity' } } }
      responses:
        '200':
          description: The legal entity. A stale version is 409 ORG-VERSION-CONFLICT. A request that changes no value returns the stored entity with the same version and emits no event. Changing the default language to an unknown or inactive language is 422 ORG-LE-REFERENCE-INACTIVE.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegalEntity' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/legal-entities/{id}/names:
    get:
      operationId: listLegalEntityNames
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Name history of the legal entity, newest first. The current name has no validTo.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LegalEntityName' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/operating-units:
    post:
      operationId: createOperatingUnit
      x-passage-duty: org.operating-unit.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOperatingUnit' } } }
      responses:
        '201':
          description: Operating unit created, or the original unit on an Idempotency-Key replay. 400 COM-0001 for a field error. 409 ORG-OU-CODE-DUPLICATE when the code exists for the type. 422 ORG-OU-LEGAL-ENTITY-INVALID when the default legal entity is unknown, inactive or outside the caller's scope. 422 idempotency_key_reuse when the key was used with a different body.
          content: { application/json: { schema: { $ref: '#/components/schemas/OperatingUnit' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listOperatingUnits
      x-passage-duty: org.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [department, cost_center, business_unit, value_stream] } }
        - { name: defaultLegalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: One page of the tenant's operating units, ordered by type then code; legal-entity-scoped callers see every unit. Pass nextCursor as cursor for the next page. A bad filter or cursor is 400 COM-0001.
          content: { application/json: { schema: { $ref: '#/components/schemas/OperatingUnitList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/operating-units/{id}:
    get:
      operationId: getOperatingUnit
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One operating unit. A malformed id and an unknown id are both 404 ORG-OU-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/OperatingUnit' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateOperatingUnit
      x-passage-duty: org.operating-unit.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOperatingUnit' } } }
      responses:
        '200':
          description: The operating unit. A stale version is 409 ORG-VERSION-CONFLICT. A request that changes no value returns the stored unit with the same version and emits no event. An empty defaultLegalEntityId or managerPartyId clears it. 400 COM-0001 for a field error or managerPartyId on a unit that is not a cost_center. 404 ORG-OU-NOT-FOUND. 422 ORG-OU-LEGAL-ENTITY-INVALID for an unknown, inactive or out-of-scope default legal entity.
          content: { application/json: { schema: { $ref: '#/components/schemas/OperatingUnit' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/sites:
    post:
      operationId: createSite
      x-passage-duty: org.site.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSite' } } }
      responses:
        '201':
          description: Site created, or the original site on an Idempotency-Key replay. The time zone defaults to the legal entity's. 400 COM-0001 for a field error. 409 ORG-SITE-CODE-DUPLICATE when the code exists in the legal entity. 422 ORG-SITE-LEGAL-ENTITY-INVALID when the legal entity is unknown, inactive or outside the caller's scope. 422 idempotency_key_reuse when the key was used with a different body.
          content: { application/json: { schema: { $ref: '#/components/schemas/Site' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listSites
      x-passage-duty: org.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: One page of sites ordered by code then id; a legal-entity-scoped caller sees only that legal entity's sites. Pass nextCursor as cursor for the next page. A bad filter or cursor is 400 COM-0001.
          content: { application/json: { schema: { $ref: '#/components/schemas/SiteList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/sites/{id}:
    get:
      operationId: getSite
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One site. A malformed id, an unknown id and a site outside the caller's legal-entity scope are all 404 ORG-SITE-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/Site' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateSite
      x-passage-duty: org.site.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSite' } } }
      responses:
        '200':
          description: The site. A stale version is 409 ORG-VERSION-CONFLICT. A request that changes no value returns the stored site with the same version and emits no event. 400 COM-0001 for a field error, or for legalEntityId or code, which are immutable. 404 ORG-SITE-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/Site' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/warehouses:
    post:
      operationId: createWarehouse
      x-passage-duty: org.site.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateWarehouse' } } }
      responses:
        '201':
          description: Warehouse created, or the original warehouse on an Idempotency-Key replay. The legal entity is the site's; the time zone defaults to the site's and the type to standard. 400 COM-0001 for a field error. 409 ORG-WH-CODE-DUPLICATE when the code exists in the legal entity. 422 ORG-WH-SITE-INVALID when the site is unknown, inactive or outside the caller's scope. 422 idempotency_key_reuse when the key was used with a different body.
          content: { application/json: { schema: { $ref: '#/components/schemas/Warehouse' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listWarehouses
      x-passage-duty: org.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, enum: [standard, transit, quarantine, subcontractor] } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: One page of warehouses ordered by code then id; a legal-entity-scoped caller sees only that legal entity's warehouses. Pass nextCursor as cursor for the next page. A bad filter or cursor is 400 COM-0001.
          content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/warehouses/{id}:
    get:
      operationId: getWarehouse
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One warehouse. A malformed id, an unknown id and a warehouse outside the caller's legal-entity scope are all 404 ORG-WH-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/Warehouse' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateWarehouse
      x-passage-duty: org.site.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateWarehouse' } } }
      responses:
        '200':
          description: The warehouse. A stale version is 409 ORG-VERSION-CONFLICT. A request that changes no value returns the stored warehouse with the same version and emits no event. 400 COM-0001 for a field error, or for legalEntityId or code, which are immutable. 404 ORG-WH-NOT-FOUND. 422 ORG-WH-SITE-INVALID when the new site is unknown, inactive or outside the caller's scope; 422 ORG-WH-LE-MISMATCH when the new site belongs to another legal entity.
          content: { application/json: { schema: { $ref: '#/components/schemas/Warehouse' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/countries:
    get:
      operationId: listCountries
      x-passage-duty: org.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: Every country with its status for the caller's tenant, ordered by code.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Country' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/countries/{code}:
    get:
      operationId: getCountry
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One country with its status for the caller's tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/Country' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: setCountryStatus
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceStatusChange' } } }
      responses:
        '200':
          description: The country with its new status for the caller's tenant; repeating the current status changes nothing. Rejected for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/Country' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/currencies:
    get:
      operationId: listCurrencies
      x-passage-duty: org.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: Every currency with its status for the caller's tenant, ordered by code.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Currency' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/currencies/{code}:
    get:
      operationId: getCurrency
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One currency with its status for the caller's tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/Currency' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: setCurrencyStatus
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceStatusChange' } } }
      responses:
        '200':
          description: The currency with its new status for the caller's tenant; repeating the current status changes nothing. Rejected for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/Currency' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/regions:
    get:
      operationId: listRegions
      x-passage-duty: org.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: country, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }
      responses:
        '200':
          description: Every region with its status for the caller's tenant, ordered by code.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Region' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/regions/{code}:
    get:
      operationId: getRegion
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One region with its status for the caller's tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/Region' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: setRegionStatus
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceStatusChange' } } }
      responses:
        '200':
          description: The region with its new status for the caller's tenant; repeating the current status changes nothing. Rejected for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/Region' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/languages:
    get:
      operationId: listLanguages
      x-passage-duty: org.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: Every language with its status for the caller's tenant, ordered by code.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Language' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/languages/{code}:
    get:
      operationId: getLanguage
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One language with its status for the caller's tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/Language' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: setLanguageStatus
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceStatusChange' } } }
      responses:
        '200':
          description: The language with its new status for the caller's tenant; repeating the current status changes nothing. Rejected for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/Language' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/uom/convert:
    get:
      operationId: convertUnit
      x-passage-duty: authenticated
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - { name: qty, in: query, required: true, schema: { type: string, description: Finite decimal } }
      responses:
        '200':
          description: Quantity converted, rounded to 12 decimals.
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversion' } } }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
components:
  schemas:
    CreateLegalEntity:
      type: object
      additionalProperties: false
      required: [code, name, country, currency, timeZone]
      properties: { defaultLanguage: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$', default: en-US }, registrationNumber: { type: string, maxLength: 40 }, code: { type: string, pattern: '^[A-Z0-9]{2,8}$', description: Upper-cased on save. DAT SYS and ALL are rejected with ORG-LE-CODE-RESERVED }, name: { type: string, minLength: 1, maxLength: 120 }, country: { type: string, pattern: '^[A-Z]{2}$' }, currency: { type: string, pattern: '^[A-Z]{3}$' }, timeZone: { type: string, description: IANA time zone name } }
    LegalEntity:
      type: object
      required: [id, code, name, country, currency, timeZone, defaultLanguage, status, version, createdAt, updatedAt]
      properties: { defaultLanguage: { type: string }, registrationNumber: { type: string }, updatedAt: { type: string, format: date-time }, id: { type: string, format: uuid }, code: { type: string }, name: { type: string }, country: { type: string }, currency: { type: string }, timeZone: { type: string }, status: { type: string, enum: [active, inactive] }, version: { type: integer }, createdAt: { type: string, format: date-time } }
    UpdateLegalEntity:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, name: { type: string, minLength: 1, maxLength: 120 }, timeZone: { type: string, description: IANA time zone name }, defaultLanguage: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }, registrationNumber: { type: string, maxLength: 40 }, status: { type: string, enum: [active, inactive] } }
    LegalEntityName:
      type: object
      required: [name, validFrom]
      properties: { name: { type: string }, validFrom: { type: string, format: date-time }, validTo: { type: string, format: date-time } }
    CreateOperatingUnit:
      type: object
      additionalProperties: false
      required: [type, code, name]
      properties: { type: { type: string, enum: [department, cost_center, business_unit, value_stream] }, code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$', description: Upper-cased on save; unique within the tenant and type }, name: { type: string, minLength: 1, maxLength: 120 }, defaultLegalEntityId: { type: string, format: uuid }, managerPartyId: { type: string, format: uuid, description: Allowed for cost_center only } }
    OperatingUnit:
      type: object
      required: [id, type, code, name, status, version, createdAt, updatedAt]
      properties: { id: { type: string, format: uuid }, type: { type: string, enum: [department, cost_center, business_unit, value_stream] }, code: { type: string }, name: { type: string }, defaultLegalEntityId: { type: string, format: uuid }, managerPartyId: { type: string, format: uuid }, status: { type: string, enum: [active, inactive] }, version: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    UpdateOperatingUnit:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, name: { type: string, minLength: 1, maxLength: 120 }, status: { type: string, enum: [active, inactive] }, defaultLegalEntityId: { type: string, description: A UUID, or an empty string to clear }, managerPartyId: { type: string, description: A UUID for a cost_center, or an empty string to clear } }
    OperatingUnitList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/OperatingUnit' } }, nextCursor: { type: string } }
    CreateSite:
      type: object
      additionalProperties: false
      required: [legalEntityId, code, name]
      properties: { legalEntityId: { type: string, format: uuid }, code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,9}$', description: Upper-cased on save; unique within the legal entity }, name: { type: string, minLength: 1, maxLength: 120 }, timeZone: { type: string, description: IANA time zone name; defaults to the legal entity's } }
    Site:
      type: object
      required: [id, legalEntityId, code, name, timeZone, status, version, createdAt, updatedAt]
      properties: { id: { type: string, format: uuid }, legalEntityId: { type: string, format: uuid }, code: { type: string }, name: { type: string }, timeZone: { type: string }, status: { type: string, enum: [active, inactive] }, version: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    UpdateSite:
      type: object
      additionalProperties: false
      required: [version]
