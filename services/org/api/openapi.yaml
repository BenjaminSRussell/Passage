      operationId: convertUnit
      x-passage-duty: authenticated
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - { name: qty, in: query, required: true, schema: { type: string, description: Finite decimal } }
      responses:
        '200':
          description: Quantity converted, rounded to 12 decimals.
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversion' } } }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
components:
  schemas:
    CreateLegalEntity:
      type: object
      additionalProperties: false
      required: [code, name, country, currency, timeZone]
      properties: { defaultLanguage: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$', default: en-US }, registrationNumber: { type: string, maxLength: 40 }, code: { type: string, pattern: '^[A-Z0-9]{2,8}$', description: Upper-cased on save. DAT SYS and ALL are rejected with ORG-LE-CODE-RESERVED }, name: { type: string, minLength: 1, maxLength: 120 }, country: { type: string, pattern: '^[A-Z]{2}$' }, currency: { type: string, pattern: '^[A-Z]{3}$' }, timeZone: { type: string, description: IANA time zone name } }
    LegalEntity:
      type: object
      required: [id, code, name, country, currency, timeZone, defaultLanguage, status, version, createdAt, updatedAt]
      properties: { primaryAddressId: { type: [string, 'null'], format: uuid, description: The stable address_id of the legal entity's primary address; follows address revisions. }, defaultLanguage: { type: string }, registrationNumber: { type: string }, updatedAt: { type: string, format: date-time }, id: { type: string, format: uuid }, code: { type: string }, name: { type: string }, country: { type: string }, currency: { type: string }, timeZone: { type: string }, status: { type: string, enum: [active, inactive] }, version: { type: integer }, createdAt: { type: string, format: date-time } }
    UpdateLegalEntity:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, name: { type: string, minLength: 1, maxLength: 120 }, timeZone: { type: string, description: IANA time zone name }, defaultLanguage: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }, registrationNumber: { type: string, maxLength: 40 }, status: { type: string, enum: [active, inactive] }, primaryAddressId: { type: string, description: A UUID of a current address owned by the legal entity, or an empty string to clear } }
    LegalEntityName:
      type: object
      required: [name, validFrom]
      properties: { name: { type: string }, validFrom: { type: string, format: date-time }, validTo: { type: string, format: date-time } }
    CreateOperatingUnit:
      type: object
      additionalProperties: false
      required: [type, code, name]
      properties: { type: { type: string, enum: [department, cost_center, business_unit, value_stream] }, code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$', description: Upper-cased on save; unique within the tenant and type }, name: { type: string, minLength: 1, maxLength: 120 }, defaultLegalEntityId: { type: string, format: uuid }, managerPartyId: { type: string, format: uuid, description: Allowed for cost_center only } }
    OperatingUnit:
      type: object
      required: [id, type, code, name, status, version, createdAt, updatedAt]
      properties: { id: { type: string, format: uuid }, type: { type: string, enum: [department, cost_center, business_unit, value_stream] }, code: { type: string }, name: { type: string }, defaultLegalEntityId: { type: string, format: uuid }, managerPartyId: { type: string, format: uuid }, status: { type: string, enum: [active, inactive] }, version: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    UpdateOperatingUnit:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, name: { type: string, minLength: 1, maxLength: 120 }, status: { type: string, enum: [active, inactive] }, defaultLegalEntityId: { type: string, description: A UUID, or an empty string to clear }, managerPartyId: { type: string, description: A UUID for a cost_center, or an empty string to clear } }
    OperatingUnitList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/OperatingUnit' } }, nextCursor: { type: string } }
    CreateSite:
      type: object
      additionalProperties: false
      required: [legalEntityId, code, name]
      properties: { legalEntityId: { type: string, format: uuid }, code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,9}$', description: Upper-cased on save; unique within the legal entity }, name: { type: string, minLength: 1, maxLength: 120 }, timeZone: { type: string, description: IANA time zone name; defaults to the legal entity's } }
    Site:
      type: object
      required: [id, legalEntityId, code, name, timeZone, status, version, createdAt, updatedAt]
      properties: { id: { type: string, format: uuid }, legalEntityId: { type: string, format: uuid }, code: { type: string }, name: { type: string }, timeZone: { type: string }, status: { type: string, enum: [active, inactive] }, addressId: { type: [string, 'null'], format: uuid, description: The stable address_id of a current address owned by the site; follows address revisions. }, version: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    UpdateSite:
      type: object
      additionalProperties: false
      required: [version]
