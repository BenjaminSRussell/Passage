      additionalProperties: false
      required: [status]
      properties: { status: { type: string, enum: [active, inactive] } }
    PutNameTranslation:
      type: object
      additionalProperties: false
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 120, description: Trimmed; counted in characters. } }
    NameTranslation:
      type: object
      required: [ownerType, ownerId, language, name, createdAt, updatedAt]
      properties:
        ownerType: { type: string, enum: [legal_entity, operating_unit, site, warehouse] }
        ownerId: { type: string, format: uuid }
        language: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NameTranslationList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/NameTranslation' } } }
    NameResolution:
      type: object
      required: [ownerType, ownerId, name, source]
      properties:
        ownerType: { type: string, enum: [legal_entity, operating_unit, site, warehouse] }
        ownerId: { type: string, format: uuid }
        language: { type: string, description: The tag that matched; omitted when the base name is returned. }
        name: { type: string }
        source: { type: string, enum: [translation, base] }
    Problem:
      type: object
      required: [type, title, status]
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string }, code: { type: string }, traceId: { type: string }, errors: { type: object, additionalProperties: { type: string } } }
    OrgPackage:
      type: object
      required: [schemaVersion]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        legalEntities:
          type: array
          items:
            type: object
            required: [code, name, country, currency, timeZone]
            properties:
              code: { type: string, pattern: '^[A-Z0-9]{2,8}$' }
              name: { type: string, maxLength: 120 }
              country: { type: string, pattern: '^[A-Z]{2}$' }
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              timeZone: { type: string }
              defaultLanguage: { type: string }
              registrationNumber: { type: string, maxLength: 40 }
              fiscalCalendar: { type: string, description: Code of the assigned fiscal calendar; it must be in the package with a generated year or already exist active with one. Import assigns it only while the legal entity has none, and reports another calendar under differences. }
        operatingUnits:
          type: array
          items:
            type: object
            required: [type, code, name]
            properties:
              type: { type: string, enum: [department, cost_center, business_unit, value_stream] }
              code: { type: string }
              name: { type: string, maxLength: 120 }
              legalEntity: { type: string, description: Code of the default legal entity; it must be in the package or already exist. }
        sites:
          type: array
          items:
            type: object
            required: [legalEntity, code, name, warehouses]
            properties:
              legalEntity: { type: string }
              code: { type: string }
              name: { type: string }
              timeZone: { type: string }
              fiscalCalendar: { type: string, description: Code of the site's own fiscal calendar, omitted when the site follows its legal entity; assigned on import under the same rules as a legal entity's. }
              warehouses:
                type: array
                minItems: 1
                description: The first warehouse becomes the default warehouse of a site created by the import.
                items:
                  type: object
                  required: [code, name]
                  properties:
                    code: { type: string }
                    name: { type: string }
                    type: { type: string, enum: [standard, transit, quarantine, subcontractor] }
                    timeZone: { type: string }
                    locations:
                      type: array
                      items:
                        type: object
                        required: [code, name]
                        properties:
                          code: { type: string }
                          name: { type: string }
                          type: { type: string, enum: [storage, receiving, shipping, quarantine] }
        hierarchyTypes:
          type: array
          items:
            type: object
            required: [code, name, purposes]
            properties:
              code: { type: string }
              name: { type: string }
              purposes: { type: array, minItems: 1, items: { type: string, enum: [reporting, procurement, expenditure, security, centralized_payments, custom] } }
              backdateAllowed: { type: boolean }
              versions:
                type: array
                description: Published versions, oldest first. The effectiveFrom of a version is its key within the type.
                items:
                  type: object
                  required: [effectiveFrom, nodes]
                  properties:
                    effectiveFrom: { type: string, format: date }
                    nodes:
                      type: array
                      description: One node per org unit; exactly one has no parent.
                      items:
                        type: object
                        required: [unit]
                        properties:
                          unit: { $ref: '#/components/schemas/OrgPackageNodeRef' }
                          parent: { $ref: '#/components/schemas/OrgPackageNodeRef' }
                          sortOrder: { type: integer, minimum: 0 }
        fiscalCalendars:
          type: array
          items:
            type: object
            required: [code, name, pattern]
            properties:
              code: { type: string }
              name: { type: string }
              pattern: { type: string, enum: [calendar, 4-4-5, 4-5-4, 5-4-4, 13-period, custom] }
              startMonth: { type: integer, minimum: 1, maximum: 12, description: Defaults to 1. }
              weekStart: { type: string, description: 'Lower-case day name; defaults to monday.' }
              openingClosing: { type: boolean, description: Defaults to true. }
              specialPeriods: { type: integer, minimum: 0, maximum: 4 }
              years:
                type: array
                items:
                  type: object
                  required: [fiscalYear]
                  properties:
                    fiscalYear: { type: integer, minimum: 1900, maximum: 2999 }
                    periods:
                      type: array
                      description: The operating period ranges of a custom calendar's year; required for a custom calendar and refused for every other pattern.
                      items:
                        type: object
                        required: [start, end]
                        properties:
                          start: { type: string, format: date }
                          end: { type: string, format: date }
        teamTypes:
          type: array
          items:
            type: object
            required: [code, name, memberKinds]
            properties:
              code: { type: string }
              name: { type: string, maxLength: 60 }
              memberKinds: { type: array, minItems: 1, items: { type: string, enum: [user, party] } }
        teams:
          type: array
          items:
            type: object
            required: [code, name, teamType, effectiveFrom]
            properties:
              code: { type: string }
              name: { type: string, maxLength: 60 }
              description: { type: string, maxLength: 500 }
              teamType: { type: string, description: Code of a team type in the package or already in the tenant. }
              operatingUnit:
                type: object
                required: [type, code]
                properties:
                  type: { type: string, enum: [department, cost_center, business_unit, value_stream] }
                  code: { type: string }
              effectiveFrom: { type: string, format: date }
              effectiveTo: { type: string, format: date }
        units:
          type: array
          description: Tenant units of measure (the system units are not exported). Optional.
          items:
            type: object
            required: [code, name, class, decimalPrecision]
            properties:
              code: { type: string, description: 1 to 10 characters of A-Z, a-z, 0-9, / or %. }
              name: { type: string, maxLength: 120 }
              class: { type: string, enum: [quantity, each, mass, length, volume, area, time, temperature, energy, pressure, power, speed] }
              decimalPrecision: { type: integer, minimum: 0, maximum: 6 }
        conversions:
          type: array
          description: Tenant conversions between two units of one class, in the package or already in the tenant (system conversions are not exported). Optional; a pair already converted in either direction is unchanged.
          items:
            type: object
            required: [fromCode, toCode, factor]
            properties:
              fromCode: { type: string }
              toCode: { type: string }
              factor: { type: string, description: Decimal greater than 0, at most 16 integer digits and 12 decimals. }
              offset: { type: string, description: Decimal, empty or absent for zero. }
        currencyRoundingRules:
          type: array
          description: Currency rounding rules (FR-6.16). Optional.
          items:
            type: object
            required: [currency, purpose, unit, method]
            properties:
              currency: { type: string, description: ISO 4217 code of a currency active in the tenant. }
              purpose: { type: string, enum: [general, price, purchase, sales, tax, cash] }
              legalEntity: { type: string, description: Code of a legal entity in the package or the tenant; absent for the tenant-wide rule. }
              unit: { type: string, description: Rounding unit, a power of ten no finer than the currency minor unit or 5 or 25 times one. }
              method: { type: string, enum: [half_even, half_up, down, up] }
        nameTranslations:
          type: array
          description: Names of legal entities, operating units, sites and warehouses in other languages (FR-6.17). Optional.
          items:
            type: object
            required: [ownerType, owner, language, name]
            properties:
              ownerType: { type: string, enum: [legal_entity, operating_unit, site, warehouse] }
              owner: { type: string, description: The owner's natural key, the code of a legal entity, type/code of an operating unit, LEGAL-ENTITY/CODE of a site or warehouse. It must be in the package or the tenant. }
              language: { type: string, description: A language tag such as fr or fr-CA whose language is active in the tenant. }
              name: { type: string, minLength: 1, maxLength: 120 }
        exportedAt: { type: string, format: date-time, description: Written by export; ignored by import. }
    OrgPackageNodeRef:
      type: object
      required: [kind, code]
      description: An org unit named by code; it must be in the package or already exist.
      properties:
        kind: { type: string, enum: [legalEntity, operatingUnit] }
        type: { type: string, enum: [department, cost_center, business_unit, value_stream], description: Required for an operating unit. }
        code: { type: string }
    OrgPackageExport:
      allOf:
        - $ref: '#/components/schemas/OrgPackage'
        - type: object
          required: [exportedAt]
          properties:
            exportedAt: { type: string, format: date-time }
    OrgImportCounts:
      type: object
      required: [created, unchanged]
      properties:
        created: { type: integer }
        unchanged: { type: integer }
    OrgImportReport:
      type: object
      required: [dryRun, created, unchanged, kinds, differences, skipped]
      properties:
        dryRun: { type: boolean }
        created: { type: integer, description: Records created, or that a dry run would create. }
        unchanged: { type: integer, description: Records that already existed. }
        kinds:
          type: object
          description: Counts per kind (legalEntities, operatingUnits, sites, warehouses, locations, hierarchyTypes, hierarchyVersions, fiscalCalendars, fiscalYears, teamTypes, teams, units, conversions, currencyRoundingRules, nameTranslations, fiscalCalendarAssignments).
          additionalProperties: { $ref: '#/components/schemas/OrgImportCounts' }
        differences:
          type: array
          description: Existing records of any kind whose name (or, for a fiscal calendar, pattern or settings; for a hierarchy version, node set) differs from the package; they are left as they are. The code is the record's natural key (for example USMF, department/FIN, USMF/DET, USMF/DET-MAIN/RCV-01, REPORTING/2026-01-01 for a version).
          items:
            type: object
            required: [kind, code, field]
            properties:
              kind: { type: string }
              code: { type: string }
              field: { type: string }
        skipped:
          type: array
          description: Records left alone on purpose, for example each new version (code <type>/<effectiveFrom>) of a security-purpose hierarchy type, which needs a second person to publish.
          items:
            type: object
            required: [kind, code, reason]
            properties:
              kind: { type: string }
              code: { type: string }
              reason: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
