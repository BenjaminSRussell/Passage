          description: Custom unit created, or the original unit on an Idempotency-Key replay. Rejected with 403 AUTH-0003 for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/Unit' } } }
        '409': { description: ORG-UOM-CODE-DUPLICATE when the code is a platform unit or one of the tenant's units., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/uom/units/{code}:
    get:
      operationId: getUnit
      summary: Get a unit
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, description: Case-sensitive. }
      responses:
        '200':
          description: One unit with its status for the caller's tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/Unit' } } }
        '404': { description: ORG-UOM-UNIT-NOT-FOUND., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: setUnitStatus
      summary: Activate or deactivate a unit of measure
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnitStatus' } } }
      responses:
        '200':
          description: The unit with its new status for the caller's tenant; platform units change for the tenant only. Rejected for legal-entity-scoped callers. Units are never deleted.
          content: { application/json: { schema: { $ref: '#/components/schemas/Unit' } } }
        '404': { description: ORG-UOM-UNIT-NOT-FOUND., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/uom/conversions:
    get:
      operationId: listUomConversions
      summary: List unit of measure conversions
      x-passage-duty: org.read
      parameters:
        - { name: class, in: query, schema: { type: string, enum: [quantity, each, mass, length, volume, area, time, temperature, energy, pressure, power, speed] } }
        - { name: unit, in: query, schema: { type: string }, description: Matches either side; case-sensitive. }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: The unit conversions report - every platform and tenant conversion visible to the caller, ordered by from code then to code. status is inactive when either unit is inactive for the caller; such rows are not used by convert. Inverse values are display values rounded to 12 decimals; the stored row is never rewritten.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/UomConversion' } } } }
        '400': { description: COM-0001 naming class or status., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createUomConversion
      summary: Create a tenant unit of measure conversion
      x-passage-duty: org.reference.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUomConversion' } } }
      responses:
        '201':
          description: Tenant-owned conversion created, or the original conversion on an Idempotency-Key replay. Rejected with 403 AUTH-0003 for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/UomConversion' } } }
        '400': { description: COM-0001 naming fromCode, toCode, factor or offset., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: ORG-UOM-UNIT-NOT-FOUND., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: ORG-UOM-CONVERSION-DUPLICATE when the unordered pair is already converted by a platform or tenant row., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: ORG-UOM-UNIT-INACTIVE with a field error on the unit; ORG-UOM-CLASS-MISMATCH when the units are in different classes; idempotency_key_reuse when the key was used with a different body., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      summary: Liveness probe
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      summary: Readiness probe
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: At most 200 bytes. A key that starts with "seed:" is refused with 400 COM-0001, because that prefix marks the records the demo company loader created.
      schema: { type: string, maxLength: 200 }
    Language:
      name: language
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
      description: BCP 47 tag of the form fr or fr-CA.
  schemas:
    CreateLegalEntity:
      type: object
      additionalProperties: false
      required: [code, name, country, currency, timeZone]
      properties: { defaultLanguage: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$', default: en-US }, registrationNumber: { type: string, maxLength: 40 }, code: { type: string, pattern: '^[A-Z0-9]{2,8}$', description: Upper-cased on save. DAT SYS and ALL are rejected with ORG-LE-CODE-RESERVED }, name: { type: string, minLength: 1, maxLength: 120 }, country: { type: string, pattern: '^[A-Z]{2}$' }, currency: { type: string, pattern: '^[A-Z]{3}$' }, timeZone: { type: string, description: IANA time zone name } }
    LegalEntity:
      type: object
      required: [id, code, name, country, currency, timeZone, defaultLanguage, status, version, createdAt, updatedAt]
      properties: { fiscalCalendarId: { type: string, format: uuid, description: The assigned fiscal calendar; omitted while unassigned. }, primaryAddressId: { type: [string, 'null'], format: uuid, description: The stable address_id of the legal entity's primary address; follows address revisions. }, defaultLanguage: { type: string }, registrationNumber: { type: string }, updatedAt: { type: string, format: date-time }, id: { type: string, format: uuid }, code: { type: string }, name: { type: string }, country: { type: string }, currency: { type: string }, timeZone: { type: string }, status: { type: string, enum: [active, inactive] }, version: { type: integer }, createdAt: { type: string, format: date-time } }
    UpdateLegalEntity:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, name: { type: string, minLength: 1, maxLength: 120 }, timeZone: { type: string, description: IANA time zone name }, defaultLanguage: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }, registrationNumber: { type: string, maxLength: 40 }, status: { type: string, enum: [active, inactive] }, primaryAddressId: { type: string, description: A UUID of a current address owned by the legal entity, or an empty string to clear }, fiscalCalendarId: { type: string, description: A UUID of an active fiscal calendar with at least one generated year (422 ORG-LE-CALENDAR-INVALID otherwise), or an empty string to clear } }
    CopyLegalEntity:
      type: object
      additionalProperties: false
      required: [code, name, country, currency]
      properties:
        code: { type: string, pattern: '^[A-Z0-9]{2,8}$', description: Upper-cased on save. DAT SYS and ALL are rejected with ORG-LE-CODE-RESERVED }
        name: { type: string, minLength: 1, maxLength: 120 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        timeZone: { type: string, description: IANA time zone name; defaults to the source's }
        defaultLanguage: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$', description: Defaults to the source's }
        registrationNumber: { type: string, maxLength: 40, description: Never copied from the source }
        include:
          type: object
          additionalProperties: false
          description: What to copy besides the legal entity itself; every flag defaults to true.
          properties:
            sites: { type: boolean, description: Active sites with their default warehouses and active warehouses }
            locations: { type: boolean, description: Active locations of the copied warehouses; needs sites }
            roundingRules: { type: boolean, description: Currency rounding rules the source entity overrides }
    LegalEntityCopy:
      type: object
      required: [legalEntity, sourceId, sites, warehouses, locations, roundingRules, calendarCopied]
      properties:
        legalEntity: { $ref: '#/components/schemas/LegalEntity' }
        sourceId: { type: string, format: uuid }
        sites: { type: integer, description: Sites created }
        warehouses: { type: integer, description: Warehouses created }
        locations: { type: integer, description: Locations created }
        roundingRules: { type: integer, description: Currency rounding rules created }
        calendarCopied: { type: boolean, description: True when the source's fiscal calendar was assigned to the new entity }
    LegalEntityName:
      type: object
      required: [name, validFrom]
      properties: { name: { type: string }, validFrom: { type: string, format: date-time }, validTo: { type: string, format: date-time } }
    CreateOperatingUnit:
      type: object
      additionalProperties: false
      required: [type, code, name]
      properties: { type: { type: string, enum: [department, cost_center, business_unit, value_stream] }, code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$', description: Upper-cased on save; unique within the tenant and type }, name: { type: string, minLength: 1, maxLength: 120 }, defaultLegalEntityId: { type: string, format: uuid }, managerPartyId: { type: string, format: uuid, description: Allowed for cost_center only } }
    OperatingUnit:
      type: object
      required: [id, type, code, name, status, version, createdAt, updatedAt]
      properties: { id: { type: string, format: uuid }, type: { type: string, enum: [department, cost_center, business_unit, value_stream] }, code: { type: string }, name: { type: string }, defaultLegalEntityId: { type: string, format: uuid }, managerPartyId: { type: string, format: uuid }, status: { type: string, enum: [active, inactive] }, version: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    UpdateOperatingUnit:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, name: { type: string, minLength: 1, maxLength: 120 }, status: { type: string, enum: [active, inactive] }, defaultLegalEntityId: { type: string, description: A UUID, or an empty string to clear }, managerPartyId: { type: string, description: A UUID for a cost_center, or an empty string to clear } }
    ImportOperatingUnits:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [type, code, name]
            properties: { type: { type: string, enum: [department, cost_center, business_unit, value_stream] }, code: { type: string, description: Upper-cased; 2 to 20 characters of A-Z, 0-9, _ or - }, name: { type: string, minLength: 1, maxLength: 120 }, legalEntity: { type: string, description: Code of the default legal entity; empty for none } }
    OperatingUnitImportReport:
      type: object
      required: [dryRun, applied, created, unchanged, failed, rows]
      properties:
        dryRun: { type: boolean }
        applied: { type: boolean, description: True when the units were written. }
        created: { type: integer, description: Units created, or that a dry run or a failed file would create. }
        unchanged: { type: integer, description: Rows that match an existing unit. }
        failed: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [line, type, code, status]
            properties: { line: { type: integer, minimum: 1, description: 1-based position of the row in the request }, type: { type: string }, code: { type: string }, status: { type: string, enum: [created, unchanged, failed] }, id: { type: string, format: uuid, description: Present for a created row once applied, and for an unchanged row }, errors: { type: object, additionalProperties: { type: string }, description: Field to problem, for a failed row } }
    OperatingUnitList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/OperatingUnit' } }, nextCursor: { type: string } }
    CreateSite:
      type: object
      additionalProperties: false
      required: [legalEntityId, code, name]
      properties: { legalEntityId: { type: string, format: uuid }, code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,9}$', description: Upper-cased on save; unique within the legal entity }, name: { type: string, minLength: 1, maxLength: 120 }, timeZone: { type: string, description: IANA time zone name; defaults to the legal entity's }, fiscalCalendarId: { type: string, format: uuid, description: An active fiscal calendar with at least one generated year (422 ORG-SITE-CALENDAR-INVALID otherwise); omit to follow the legal entity's calendar }, defaultWarehouse: { $ref: '#/components/schemas/CreateDefaultWarehouse' } }
    CreateDefaultWarehouse:
      type: object
      additionalProperties: false
      required: [code, name]
      description: A warehouse created with the site in the same transaction, in the site's legal entity; omit for a site without one.
      properties: { code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,9}$', description: Upper-cased on save; unique within the legal entity }, name: { type: string, minLength: 1, maxLength: 120 }, type: { type: string, enum: [standard, transit, quarantine, subcontractor], default: standard }, timeZone: { type: string, description: IANA time zone name; defaults to the site's } }
    Site:
      type: object
      required: [id, legalEntityId, code, name, timeZone, status, version, createdAt, updatedAt]
      properties: { id: { type: string, format: uuid }, legalEntityId: { type: string, format: uuid }, code: { type: string }, name: { type: string }, timeZone: { type: string }, status: { type: string, enum: [active, inactive] }, addressId: { type: [string, 'null'], format: uuid, description: The stable address_id of a current address owned by the site; follows address revisions. }, fiscalCalendarId: { type: [string, 'null'], format: uuid, description: The site's own fiscal calendar; absent while the site follows its legal entity's }, defaultWarehouseId: { type: [string, 'null'], format: uuid, description: The site's default warehouse; absent when none }, version: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    UpdateSite:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, name: { type: string, minLength: 1, maxLength: 120 }, timeZone: { type: string, description: IANA time zone name }, status: { type: string, enum: [active, inactive] }, addressId: { type: string, description: A UUID of a current address owned by the site, or an empty string to clear }, fiscalCalendarId: { type: string, description: A UUID of an active fiscal calendar with at least one generated year (422 ORG-SITE-CALENDAR-INVALID otherwise), or an empty string to clear }, defaultWarehouseId: { type: string, description: A UUID of an active warehouse of this site (422 ORG-SITE-DEFAULT-WAREHOUSE-INVALID otherwise), or an empty string to clear } }
    SiteList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Site' } }, nextCursor: { type: string } }
    CreateWarehouse:
      type: object
      additionalProperties: false
      required: [siteId, code, name]
      properties: { siteId: { type: string, format: uuid }, code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,9}$', description: Upper-cased on save; unique within the legal entity }, name: { type: string, minLength: 1, maxLength: 120 }, type: { type: string, enum: [standard, transit, quarantine, subcontractor], default: standard }, timeZone: { type: string, description: IANA time zone name; defaults to the site's } }
    Warehouse:
      type: object
      required: [id, legalEntityId, siteId, code, name, type, timeZone, status, version, createdAt, updatedAt]
      properties: { id: { type: string, format: uuid }, legalEntityId: { type: string, format: uuid }, siteId: { type: string, format: uuid }, code: { type: string }, name: { type: string }, type: { type: string, enum: [standard, transit, quarantine, subcontractor] }, timeZone: { type: string }, status: { type: string, enum: [active, inactive] }, addressId: { type: [string, 'null'], format: uuid, description: The stable address_id of a current address owned by the warehouse; follows address revisions. }, version: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    UpdateWarehouse:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, siteId: { type: string, format: uuid, description: A site in the same legal entity }, name: { type: string, minLength: 1, maxLength: 120 }, type: { type: string, enum: [standard, transit, quarantine, subcontractor] }, timeZone: { type: string, description: IANA time zone name }, status: { type: string, enum: [active, inactive] }, addressId: { type: string, description: A UUID of a current address owned by the warehouse, or an empty string to clear } }
    WarehouseList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Warehouse' } }, nextCursor: { type: string } }
    CreateFiscalCalendar:
      type: object
      additionalProperties: false
      required: [code, name, pattern]
      properties: { code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,9}$', description: Upper-cased on save; unique within the tenant }, name: { type: string, minLength: 1, maxLength: 120 }, pattern: { type: string, enum: [calendar, 4-4-5, 4-5-4, 5-4-4, 13-period, custom] }, startMonth: { type: integer, minimum: 1, maximum: 12, default: 1 }, weekStart: { type: string, enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday], default: monday }, openingClosing: { type: boolean, default: true }, specialPeriods: { type: integer, minimum: 0, maximum: 4, default: 0 } }
    FiscalCalendar:
      type: object
      required: [id, code, name, pattern, startMonth, weekStart, openingClosing, specialPeriods, status, version, createdAt, updatedAt, generatedYears]
      properties: { id: { type: string, format: uuid }, code: { type: string }, name: { type: string }, pattern: { type: string, enum: [calendar, 4-4-5, 4-5-4, 5-4-4, 13-period, custom] }, startMonth: { type: integer }, weekStart: { type: string, enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday] }, openingClosing: { type: boolean }, specialPeriods: { type: integer }, status: { type: string, enum: [active, inactive] }, version: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time }, generatedYears: { type: array, items: { type: integer }, description: Ascending fiscal years that have generated periods } }
    UpdateFiscalCalendar:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, name: { type: string, minLength: 1, maxLength: 120 }, status: { type: string, enum: [active, inactive] } }
    FiscalCalendarList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/FiscalCalendar' } }, nextCursor: { type: string } }
    GenerateFiscalYear:
      type: object
      additionalProperties: false
      required: [fiscalYear]
      properties: { fiscalYear: { type: integer, minimum: 1900, maximum: 2999 }, force: { type: boolean, default: false, description: Replace an existing year; refused with ORG-CAL-LOCKED when the ledger reports postings }, periods: { type: array, description: 'Required for a custom calendar, rejected for any other pattern', items: { type: object, additionalProperties: false, required: [start, end], properties: { start: { type: string, format: date }, end: { type: string, format: date } } } } }
    FiscalPeriod:
      type: object
      required: [fiscalYear, periodNo, name, startDate, endDate, type, week53]
      properties: { fiscalYear: { type: integer }, periodNo: { type: integer }, name: { type: string }, startDate: { type: string, format: date }, endDate: { type: string, format: date }, type: { type: string, enum: [opening, operating, closing, adjustment] }, week53: { type: boolean } }
    FiscalPeriodResolution:
      type: object
      required: [legalEntityId, calendarId, source, period]
      properties: { siteId: { type: string, format: uuid }, legalEntityId: { type: string, format: uuid }, calendarId: { type: string, format: uuid }, source: { type: string, enum: [site, legalEntity] }, period: { $ref: '#/components/schemas/FiscalPeriod' } }
    FiscalYear:
      type: object
      required: [calendarId, fiscalYear, generated, periods]
      properties: { calendarId: { type: string, format: uuid }, fiscalYear: { type: integer }, generated: { type: boolean }, periods: { type: array, items: { $ref: '#/components/schemas/FiscalPeriod' } } }
    FiscalPeriodList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/FiscalPeriod' } } }
    CreateHierarchyType:
      type: object
      additionalProperties: false
      required: [code, name, purposes]
      properties: { code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$', description: Upper-cased on save; unique within the tenant }, name: { type: string, minLength: 1, maxLength: 120 }, purposes: { type: array, minItems: 1, maxItems: 6, uniqueItems: true, items: { type: string, enum: [reporting, procurement, expenditure, security, centralized_payments, custom] } }, backdateAllowed: { type: boolean, default: false } }
    HierarchyType:
      type: object
      required: [id, code, name, purposes, backdateAllowed, status, version, createdAt, updatedAt]
      properties: { id: { type: string, format: uuid }, code: { type: string }, name: { type: string }, purposes: { type: array, items: { type: string, enum: [reporting, procurement, expenditure, security, centralized_payments, custom] } }, backdateAllowed: { type: boolean }, status: { type: string, enum: [active, inactive] }, version: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    HierarchyTypePage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/HierarchyType' } }, nextCursor: { type: string } }
    CreateTeamType:
      type: object
      additionalProperties: false
      required: [code, name, memberKinds]
      properties: { code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$', description: Upper-cased on save; unique within the tenant }, name: { type: string, minLength: 1, maxLength: 60 }, memberKinds: { type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: { type: string, enum: [user, party] } } }
    TeamType:
      type: object
      required: [id, code, name, memberKinds, createdAt, updatedAt]
      properties: { id: { type: string, format: uuid }, code: { type: string }, name: { type: string }, memberKinds: { type: array, items: { type: string, enum: [user, party] } }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    TeamTypePage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/TeamType' } }, nextCursor: { type: string } }
    CreateTeam:
      type: object
      additionalProperties: false
      required: [code, name, teamTypeId, effectiveFrom]
      properties: { code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$', description: Upper-cased on save; unique within the tenant }, name: { type: string, minLength: 1, maxLength: 60 }, description: { type: [string, 'null'], maxLength: 500 }, teamTypeId: { type: string, format: uuid }, operatingUnitId: { type: [string, 'null'], format: uuid, description: Must be an active operating unit of the tenant }, effectiveFrom: { type: string, format: date }, effectiveTo: { type: [string, 'null'], format: date, description: Last day in force; not before effectiveFrom } }
    Team:
      type: object
      required: [id, code, name, teamTypeId, effectiveFrom, status, version, createdAt, updatedAt]
      properties: { id: { type: string, format: uuid }, code: { type: string }, name: { type: string }, description: { type: string }, teamTypeId: { type: string, format: uuid }, operatingUnitId: { type: string, format: uuid }, effectiveFrom: { type: string, format: date }, effectiveTo: { type: string, format: date }, status: { type: string, enum: [active, inactive] }, version: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    UpdateTeam:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, name: { type: string, minLength: 1, maxLength: 60 }, description: { type: string, maxLength: 500, description: An empty string clears it }, operatingUnitId: { type: string, description: An active operating unit UUID, or an empty string to clear }, effectiveTo: { type: string, description: A date as YYYY-MM-DD not before effectiveFrom, or an empty string for open-ended }, status: { type: string, enum: [active, inactive] } }
    EndTeamMember:
      type: object
      additionalProperties: false
      required: [validTo]
      properties: { validTo: { type: string, format: date, description: The last day the member is in force; it can only be moved earlier than the current validTo } }
    TeamPage:
      type: object
