  /v1/org/export:
    post:
      operationId: exportOrgPackage
      summary: Export the organization model as a package
      description: Reads every legal entity, operating unit, site with its warehouses and locations, hierarchy type, team type, team, tenant unit of measure and conversion, currency rounding rule and name translation of the caller's tenant into one versioned JSON package whose records name each other by code. A POST because the export is an administrative action; it changes nothing. Each hierarchy type carries its published and superseded versions (a draft is not exported) and the package carries the fiscal calendars with their generated years. Addresses, calendar assignments and team members are not part of the package.
      x-passage-duty: org.package.manage
      responses:
        '200':
          description: The package, sent as an attachment named org-package.json. The default warehouse of every site is listed first. 403 AUTH-0003 unless the caller holds tenant.administer and has no legal-entity claim. 422 ORG-PKG-TOO-LARGE when a kind has more than 10000 rows.
          content: { application/json: { schema: { $ref: '#/components/schemas/OrgPackageExport' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/import:
    post:
      operationId: importOrgPackage
      summary: Import an organization model package
      description: Creates the records of the package that the tenant does not have yet, matched by natural code (legal entity code; operating unit type and code; legal entity and site, warehouse or location code; hierarchy type, team type and team code; hierarchy version by type code and effectiveFrom; fiscal calendar by code; fiscal year by calendar code and year; unit by code; conversion by its two unit codes in either direction; rounding rule by currency, purpose and legal entity; name translation by owner and language). Existing records are never updated or deleted; their differing names (and, for units, conversions, rounding rules and translations, the differing fields) are listed. Before the first write the package is validated, every code reference resolved and every rule the creates apply checked against the tenant's rows (active parent records, active country, currency and language, the legal entity and team limits, warehouse codes unique per legal entity, units of a conversion known, active and of one class, rounding units valid for the currency, translation owners and languages known), so a package that fails any of them imports nothing. A hierarchy version is created as a draft of its type, given its nodes and published with its effectiveFrom, oldest first, each published before the next is drafted, so each must be later than the latest version the type already has and the tree must fit the configured depth and node limits. A date before today is a backdate (the org.hierarchy.backdate duty and a type with backdateAllowed) only when the type already holds a version that no package import made; loading a history into an empty type, or finishing one an earlier import started, changes no as-of answer anyone else wrote, and the publish keeps the reason 'Imported from an organization package'. A type with an open draft takes no new version, except the draft an earlier run of the same import left open (its key is orgpkg:hier-draft:<type>/<effectiveFrom>), which the import fills and publishes. New versions of a security-purpose type are not imported (publishing needs a second person) and each is listed under skipped. A fiscal year is generated for its calendar from the calendar's settings (a custom calendar from the listed periods). Each record is then created in its own transaction and raises its own event through the outbox where its kind has one (units, conversions and name translations have no event). Rounding rules and name translations are written with the same upsert as their PUT routes, so one someone else sets after that check is overwritten with the package's value. A change someone else commits after that check can still fail a create; the records created before it stay, and importing the package again creates only what is missing. A second import of the same package reports no creates. The exportedAt field of an exported file is accepted and ignored.
      x-passage-duty: org.package.manage
      parameters:
        - { name: dryRun, in: query, schema: { type: boolean, default: false }, description: When true nothing is written and the report shows what a real import would create. }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrgPackage' } } }
      responses:
        '200':
          description: The import report with created and unchanged counts per kind. 400 COM-0001 for a malformed body or dryRun. 403 AUTH-0003 unless the caller holds tenant.administer and has no legal-entity claim. A store error part-way (409 or 422 with the store's code) leaves the earlier records created; importing again resumes.
          content: { application/json: { schema: { $ref: '#/components/schemas/OrgImportReport' } } }
        '422':
          description: ORG-PKG-VERSION-UNSUPPORTED when schemaVersion is not 1. ORG-PKG-INVALID with a path-to-message errors map (at most 50 entries) for a field error, a duplicate code in the package, an unknown or inactive referenced record, a version tree with a cycle, several roots, too many levels or nodes, a version dated at or before the type's latest, an open draft the import did not make, a backdated version without the duty or on a type without backdateAllowed, a fiscal year that does not generate or belongs to an existing calendar with other settings, inactive reference data, a warehouse code already used at another site of the legal entity, or a tenant limit. ORG-PKG-TOO-LARGE when the package or the tenant holds more than 10000 rows of one kind.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '413':
          description: COM-0413 when the body exceeds 8 MiB; the limit applies while the body is read.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/demo-company:
    post:
      operationId: loadDemoCompany
      summary: Load the demo company
      description: Loads the demo manufacturer (three legal entities with their sites, warehouses, operating units and teams) into the caller's tenant, the same package ORG_SEED_PACKAGE seeds at start. Rows that exist are left alone and missing ones are added; nothing is deleted, so it can be repeated and does not wipe data. 403 ORG-0403 unless the caller holds tenant.administer and has no legal-entity claim.
      x-passage-duty: org.demo-company.manage
      responses:
        '200':
          description: How many rows were created and how many were already there.
          content:
            application/json:
              schema:
                type: object
                required: [package, created, present]
                properties:
                  package: { type: string }
                  created: { type: integer }
                  present: { type: integer }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/demo-company:reset:
    post:
      operationId: resetDemoCompany
      summary: Reset the demo company
      description: Removes the records the demo company created in the caller's tenant and loads it again, so a trial or demo can start over. Demo records are the ones whose idempotency key is in the namespace only the demo loader writes (seed:demo-manufacturer:), plus each demo site's default warehouse; nothing else is deleted. Details that belong to a demo record alone (name history, translations, addresses, rounding rules, team memberships) go with it. If any other record hangs off a demo record (a site, warehouse, location, operating unit or team someone added under it, a hierarchy version or node, a legal entity copy) the reset is refused with 409 ORG-DEMO-IN-USE before anything is deleted. The removal is one transaction and emits dev.passage.org.democompany.removed.v1 naming the caller; the load after it is the same idempotent load as POST /v1/org/demo-company, so a repeat completes a load that stopped part way. Records other services keep about the demo company are not removed by this call. 403 ORG-0403 unless the caller holds tenant.administer and has no legal-entity claim.
      x-passage-duty: org.demo-company.manage
      responses:
        '200':
          description: How many demo records were removed, then created again, and how many were already there.
          content:
            application/json:
              schema:
                type: object
                required: [package, removed, created, present]
                properties:
                  package: { type: string }
                  removed: { type: integer }
                  created: { type: integer }
                  present: { type: integer }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/uom/convert:
    get:
      operationId: convertUnit
      summary: Convert a quantity between two units of measure
      x-passage-duty: authenticated
