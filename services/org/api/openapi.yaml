        method: { type: string, enum: [half_even, half_up, down, up] }
        legalEntityId: { type: [string, 'null'], format: uuid, description: Absent or null stores a tenant row. }
    CurrencyRounding:
      type: object
      required: [id, currencyCode, purpose, legalEntityId, unit, method, updatedAt]
      properties:
        id: { type: string, format: uuid }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        purpose: { type: string, enum: [general, price, purchase, sales, tax, cash] }
        legalEntityId: { type: [string, 'null'], format: uuid }
        unit: { type: string }
        method: { type: string, enum: [half_even, half_up, down, up] }
        updatedAt: { type: string, format: date-time }
    RoundResult:
      type: object
      required: [currency, purpose, legalEntityId, amount, rounded, unit, method, source]
      properties:
        currency: { type: string }
        purpose: { type: string, enum: [general, price, purchase, sales, tax, cash] }
        legalEntityId: { type: [string, 'null'], format: uuid }
        amount: { type: string, description: The input echoed. }
        rounded: { type: string, description: The rounded amount with exactly the unit's decimal places. }
        unit: { type: string, description: The unit with trailing zeros stripped. }
        method: { type: string, enum: [half_even, half_up, down, up] }
        source: { type: string, enum: [legal_entity, tenant, default] }
