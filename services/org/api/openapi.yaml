          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyType' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/hierarchy-types/{id}/versions:
    get:
      operationId: listHierarchyVersions
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, superseded] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of the type's versions without nodes, newest versionNo first; an empty items array for a type with no versions. A legal-entity-scoped caller reads them too. Pass nextCursor as cursor for the next page. 400 COM-0001 naming status, limit or cursor (the cursor must be a positive version number). 403 AUTH-0003 without org.read. 404 ORG-HIER-TYPE-NOT-FOUND for a malformed, unknown or other tenant's id.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyVersionPage' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createHierarchyDraft
      x-passage-duty: org.hierarchy.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      responses:
        '201':
          description: A draft version numbered one above the type's highest version, with the node set copied from the published version with the latest effective_from, or empty when none is published. The request has no body. Replaying the key for the same type returns the same draft. 404 ORG-HIER-TYPE-NOT-FOUND for a malformed, unknown or other tenant's id. 409 ORG-HIER-DRAFT-EXISTS when the type already has an open draft. 422 idempotency_key_reuse when the key belongs to another type. 403 AUTH-0003 without the duty or for a legal-entity-scoped caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyVersion' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/hierarchy-versions/{id}:
    get:
      operationId: getHierarchyVersion
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The version with its nodes ordered by sortOrder, in the same representation publish returns; a published version carries publishedAt and publishedBy. 403 AUTH-0003 without org.read. 404 ORG-HIER-VERSION-NOT-FOUND for a malformed, unknown or other tenant's id.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyVersion' } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteHierarchyDraft
      x-passage-duty: org.hierarchy.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer }, description: The draft's current optimistic-lock version }
      responses:
        '204':
          description: The draft and its nodes are deleted; no body and no event. Deleting the open draft frees the type's draft slot, and the next draft's versionNo is one above the highest remaining, so a deleted draft's versionNo may be reused. 400 COM-0001 naming version when it is missing or not an integer. 403 AUTH-0003 without org.hierarchy.write or for a legal-entity-scoped caller. 404 ORG-HIER-VERSION-NOT-FOUND for a malformed, unknown or other tenant's id. 409 ORG-HIER-VERSION-IMMUTABLE for a version that is not a draft, left unchanged; 409 ORG-VERSION-CONFLICT for a stale version.
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/hierarchy-versions/{id}/nodes:
    put:
      operationId: replaceHierarchyNodes
      x-passage-duty: org.hierarchy.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceHierarchyNodes' } } }
      responses:
        '200':
          description: The draft with its full node set replaced, nodes ordered by sortOrder, the kind of each node resolved and version incremented. 400 COM-0001 naming version or nodes[i].orgUnitId, nodes[i].parentOrgUnitId or nodes[i].sortOrder (at most 20 node errors). 404 ORG-HIER-VERSION-NOT-FOUND for a malformed, unknown or other tenant's id. 409 ORG-HIER-VERSION-IMMUTABLE for a published or superseded version; 409 ORG-VERSION-CONFLICT for a stale version. 422 ORG-HIER-SIZE, ORG-HIER-DUPLICATE-NODE, ORG-HIER-PARENT-UNKNOWN, ORG-HIER-CYCLE, ORG-HIER-MULTI-ROOT or ORG-HIER-DEPTH, or ORG-HIER-NODE-UNKNOWN when an org unit is neither a legal entity nor an operating unit. A rejected request leaves the stored nodes unchanged. 403 AUTH-0003 without the duty or for a legal-entity-scoped caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyVersion' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/hierarchy-versions/{id}:publish:
    post:
      operationId: publishHierarchyVersion
      x-passage-duty: org.hierarchy.publish
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublishHierarchyVersion' } } }
      responses:
        '200':
          description: The published version with its nodes, or the original on an Idempotency-Key replay. Superseding the latest earlier version closes its range at effectiveFrom. 400 COM-0001 naming version, effectiveFrom or reason (a reason of a non-backdated publish must be 10 to 500 characters). 403 AUTH-0003 without the duty or for a legal-entity-scoped caller. 403 ORG-HIER-MAKER-CHECKER when the type has the security purpose and the caller is the draft's last editor (editedBy); the version stays a draft, no closure rows are written and no event is emitted; a draft whose editedBy is null, created before this rule, is not blocked, and types without the security purpose are unaffected. 403 ORG-HIER-BACKDATE-DUTY when effectiveFrom is before today (UTC) and the caller lacks org.hierarchy.backdate, the type forbids backdating or the reason is not 10 to 500 characters; no version changes state. 404 ORG-HIER-VERSION-NOT-FOUND for a malformed, unknown or other tenant's id. 409 ORG-HIER-VERSION-IMMUTABLE for a version that is not a draft; 409 ORG-VERSION-CONFLICT for a stale version; 409 ORG-HIER-OVERLAP when effectiveFrom is not after the latest published version's. 422 ORG-HIER-MULTI-ROOT, ORG-HIER-CYCLE, ORG-HIER-DUPLICATE-NODE, ORG-HIER-DEPTH or ORG-HIER-SIZE when the stored node set is invalid, including an empty one. 422 idempotency_key_reuse when the key belongs to another version or date. Emits dev.passage.org.hierarchyversion.activated.v1 in the same transaction, also for a future effectiveFrom.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyVersion' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/hierarchy-types/{id}/as-of:
    get:
      operationId: getHierarchyAsOf
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: node, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The node's position in the non-draft version in force on date; superseded versions answer for dates inside their closed range. ancestors run nearest first, descendants by depth then orgUnitId. 400 COM-0001 naming date or node. 404 ORG-HIER-TYPE-NOT-FOUND for a malformed, unknown or other tenant's id. 404 ORG-HIER-NO-VERSION when no version is in force on date. 404 ORG-HIER-NODE-ABSENT when the node is not in that version.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyAsOf' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/hierarchy-types/{id}/compare:
    get:
      operationId: compareHierarchyVersions
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: to, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The nodes added, removed and moved between version numbers from and to, each list ordered by orgUnitId and never null. Any statuses may be compared, including a draft, and from may equal to. A moved subtree reports only its root. 400 COM-0001 naming from or to. 403 AUTH-0003 without org.read. 404 ORG-HIER-TYPE-NOT-FOUND for a malformed, unknown or other tenant's id. 404 ORG-HIER-VERSION-NOT-FOUND when the type has no version with that number.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyComparison' } } }
        default: { $ref: '#/components/responses/Problem' }
