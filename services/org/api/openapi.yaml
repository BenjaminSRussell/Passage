        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAddress' } } }
      responses:
        '201':
          description: Address created (first version), or the original address on an Idempotency-Key replay. Country and region rules come from the seeded country rows; coordinates are set only when the geocoder finds the address, otherwise geoStatus is unverified. 400 COM-0001 for a field error. 409 ORG-ADDR-PRIMARY-DUPLICATE when the owner already has a primary address for a purpose. 422 ORG-ADDR-OWNER-INVALID, ORG-ADDR-COUNTRY-INVALID, ORG-ADDR-REGION-UNKNOWN, ORG-ADDR-REGION-REQUIRED or ORG-ADDR-POSTAL-FORMAT, with the failing fields in errors; 422 idempotency_key_reuse when the key was used with a different body.
          content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listAddresses
      x-passage-duty: org.read
      parameters:
        - { name: ownerType, in: query, required: true, schema: { type: string, enum: [legal_entity, operating_unit, site, warehouse, location, party] } }
        - { name: ownerId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: purpose, in: query, schema: { type: string, enum: [business, delivery, invoice, remit_to, service, home, other] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: The owner's current address versions ordered by address id, filtered by purpose when given. An owner outside the caller's legal-entity scope yields an empty page. Pass nextCursor as cursor for the next page. 400 COM-0001 for a bad owner, purpose, limit or cursor.
          content: { application/json: { schema: { $ref: '#/components/schemas/AddressList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/address-versions/{id}:
    get:
      operationId: getAddressVersion
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid, description: The versionId of an address } }
      responses:
        '200':
          description: Any version of an address, current or closed, so documents can read the version they hold. Purposes belong to the address, so a closed version reports the current purposes. A malformed id, an unknown id and a version outside the caller's legal-entity scope are all 404 ORG-ADDR-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/addresses/{id}:
    get:
      operationId: getAddress
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The current version of the address with its purposes. A malformed id, an unknown id and an address outside the caller's legal-entity scope are all 404 ORG-ADDR-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateAddress
      x-passage-duty: org.address.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAddress' } } }
      responses:
        '200':
          description: The new current version. The edit closes the current version, inserts the next one, replaces the purposes and emits address.changed for the new version. A request that changes nothing and has no validFrom returns the current version and writes nothing. 400 COM-0001 for a field error, or for ownerType or ownerId, which are immutable. 404 ORG-ADDR-NOT-FOUND. 409 ORG-VERSION-CONFLICT when versionId is stale, or ORG-ADDR-PRIMARY-DUPLICATE. 422 ORG-ADDR-VALID-FROM-INVALID when validFrom precedes the current version or is in the future, or one of ORG-ADDR-COUNTRY-INVALID, ORG-ADDR-REGION-UNKNOWN, ORG-ADDR-REGION-REQUIRED or ORG-ADDR-POSTAL-FORMAT.
          content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/countries:
    get:
      operationId: listCountries
      x-passage-duty: org.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: Every country with its status for the caller's tenant, ordered by code.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Country' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/countries/{code}:
    get:
      operationId: getCountry
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One country with its status for the caller's tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/Country' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: setCountryStatus
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceStatusChange' } } }
      responses:
        '200':
          description: The country with its new status for the caller's tenant; repeating the current status changes nothing. Rejected for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/Country' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/currencies:
    get:
      operationId: listCurrencies
      x-passage-duty: org.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: Every currency with its status for the caller's tenant, ordered by code.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Currency' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/currencies/{code}:
    get:
      operationId: getCurrency
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One currency with its status for the caller's tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/Currency' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: setCurrencyStatus
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceStatusChange' } } }
      responses:
        '200':
          description: The currency with its new status for the caller's tenant; repeating the current status changes nothing. Rejected for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/Currency' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/currencies/{code}/rounding-rules:
    get:
      operationId: listCurrencyRoundingRules
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
      responses:
        '200':
          description: The tenant's stored rounding rules for the currency, ordered by purpose, tenant rows before legal-entity rows, then by legal entity id. A currency with no rows returns an empty list; the platform default (the currency's minor unit, half_even) has no row.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/CurrencyRounding' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: ORG-REF-NOT-FOUND for an unknown currency., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/currencies/{code}/rounding-rules/{purpose}:
    put:
      operationId: putCurrencyRoundingRule
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: purpose, in: path, required: true, schema: { type: string, enum: [general, price, purchase, sales, tax, cash] } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PutCurrencyRounding' } } }
      responses:
        '200':
          description: The stored rule. Repeating an identical PUT returns the same body, leaves updatedAt unchanged and emits no event. Rejected with 403 AUTH-0003 for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/CurrencyRounding' } } }
        '400': { description: COM-0001 naming purpose, method, unit or legalEntityId., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: ORG-REF-NOT-FOUND for an unknown currency; ORG-LE-NOT-FOUND for a legal entity the tenant does not have., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: ORG-CUR-ROUNDING-UNIT when the unit is not a power of ten no finer than the currency minor unit or 5 or 25 times one; ORG-LE-REFERENCE-INACTIVE when the currency is inactive for the tenant., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteCurrencyRoundingRule
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: purpose, in: path, required: true, schema: { type: string, enum: [general, price, purchase, sales, tax, cash] } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid }, description: Deletes the legal-entity row instead of the tenant row. }
      responses:
        '204': { description: The row is removed, so the next fallback applies - legal entity, then tenant, then the currency's minor unit with half_even. One currencyrounding.changed event carries the rule now in force. Rejected with 403 AUTH-0003 for legal-entity-scoped callers. }
        '400': { description: COM-0001 naming purpose or legalEntityId., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: ORG-CUR-ROUNDING-NOT-FOUND when no such rule exists; ORG-REF-NOT-FOUND for an unknown currency; ORG-LE-NOT-FOUND for an unknown legal entity., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/currencies/{code}/round:
    get:
      operationId: roundCurrencyAmount
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: amount, in: query, required: true, schema: { type: string }, description: A finite decimal of at most 1e18 in magnitude. }
        - { name: purpose, in: query, schema: { type: string, enum: [general, price, purchase, sales, tax, cash], default: general } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid }, description: Defaults to the caller's legal-entity scope. A scoped caller asking for another entity is refused with 403 AUTH-0003. }
      responses:
        '200':
          description: The amount rounded by the first matching rule - legal entity, then tenant, then the currency's minor unit with half_even.
          content: { application/json: { schema: { $ref: '#/components/schemas/RoundResult' } } }
        '400': { description: COM-0001 naming amount, purpose or legalEntityId., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: ORG-REF-NOT-FOUND for an unknown currency; ORG-LE-NOT-FOUND for an unknown legal entity., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/regions:
    get:
      operationId: listRegions
      x-passage-duty: org.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: country, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }
      responses:
        '200':
          description: Every region with its status for the caller's tenant, ordered by code.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Region' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/regions/{code}:
    get:
      operationId: getRegion
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One region with its status for the caller's tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/Region' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: setRegionStatus
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceStatusChange' } } }
      responses:
        '200':
          description: The region with its new status for the caller's tenant; repeating the current status changes nothing. Rejected for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/Region' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/languages:
    get:
      operationId: listLanguages
      x-passage-duty: org.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: Every language with its status for the caller's tenant, ordered by code.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Language' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/languages/{code}:
    get:
      operationId: getLanguage
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One language with its status for the caller's tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/Language' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: setLanguageStatus
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceStatusChange' } } }
      responses:
        '200':
          description: The language with its new status for the caller's tenant; repeating the current status changes nothing. Rejected for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/Language' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/uom/convert:
    get:
      operationId: convertUnit
      x-passage-duty: authenticated
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - { name: qty, in: query, required: true, schema: { type: string, description: Finite decimal } }
      responses:
        '200':
          description: Quantity converted over the caller's visible, active units and conversions. quantity is rounded to 12 decimals; displayQuantity is rounded to the target unit's decimal precision. An unknown or inactive unit, or a pair with no path, returns 422 ORG-UOM-NO-PATH.
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversion' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/uom/units:
    get:
      operationId: listUnits
      x-passage-duty: org.read
      parameters:
        - { name: class, in: query, schema: { type: string, enum: [quantity, each, mass, length, volume, area, time, temperature, energy, pressure, power, speed] } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: The platform units plus the tenant's own units with their status for the caller's tenant, ordered by code.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Unit' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createUnit
      x-passage-duty: org.reference.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUnit' } } }
      responses:
        '201':
          description: Custom unit created, or the original unit on an Idempotency-Key replay. Rejected with 403 AUTH-0003 for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/Unit' } } }
        '409': { description: ORG-UOM-CODE-DUPLICATE when the code is a platform unit or one of the tenant's units., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/uom/units/{code}:
    get:
      operationId: getUnit
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, description: Case-sensitive. }
      responses:
        '200':
          description: One unit with its status for the caller's tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/Unit' } } }
        '404': { description: ORG-UOM-UNIT-NOT-FOUND., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: setUnitStatus
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnitStatus' } } }
      responses:
        '200':
          description: The unit with its new status for the caller's tenant; platform units change for the tenant only. Rejected for legal-entity-scoped callers. Units are never deleted.
          content: { application/json: { schema: { $ref: '#/components/schemas/Unit' } } }
        '404': { description: ORG-UOM-UNIT-NOT-FOUND., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/uom/conversions:
    get:
      operationId: listUomConversions
      x-passage-duty: org.read
      parameters:
        - { name: class, in: query, schema: { type: string, enum: [quantity, each, mass, length, volume, area, time, temperature, energy, pressure, power, speed] } }
        - { name: unit, in: query, schema: { type: string }, description: Matches either side; case-sensitive. }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: The unit conversions report - every platform and tenant conversion visible to the caller, ordered by from code then to code. status is inactive when either unit is inactive for the caller; such rows are not used by convert. Inverse values are display values rounded to 12 decimals; the stored row is never rewritten.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/UomConversion' } } } }
        '400': { description: COM-0001 naming class or status., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createUomConversion
      x-passage-duty: org.reference.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUomConversion' } } }
      responses:
        '201':
          description: Tenant-owned conversion created, or the original conversion on an Idempotency-Key replay. Rejected with 403 AUTH-0003 for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/UomConversion' } } }
        '400': { description: COM-0001 naming fromCode, toCode, factor or offset., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: ORG-UOM-UNIT-NOT-FOUND., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: ORG-UOM-CONVERSION-DUPLICATE when the unordered pair is already converted by a platform or tenant row., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: ORG-UOM-UNIT-INACTIVE with a field error on the unit; ORG-UOM-CLASS-MISMATCH when the units are in different classes; idempotency_key_reuse when the key was used with a different body., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
components:
  schemas:
    CreateLegalEntity:
      type: object
      additionalProperties: false
      required: [code, name, country, currency, timeZone]
      properties: { defaultLanguage: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$', default: en-US }, registrationNumber: { type: string, maxLength: 40 }, code: { type: string, pattern: '^[A-Z0-9]{2,8}$', description: Upper-cased on save. DAT SYS and ALL are rejected with ORG-LE-CODE-RESERVED }, name: { type: string, minLength: 1, maxLength: 120 }, country: { type: string, pattern: '^[A-Z]{2}$' }, currency: { type: string, pattern: '^[A-Z]{3}$' }, timeZone: { type: string, description: IANA time zone name } }
    LegalEntity:
      type: object
      required: [id, code, name, country, currency, timeZone, defaultLanguage, status, version, createdAt, updatedAt]
      properties: { fiscalCalendarId: { type: string, format: uuid, description: The assigned fiscal calendar; omitted while unassigned. }, primaryAddressId: { type: [string, 'null'], format: uuid, description: The stable address_id of the legal entity's primary address; follows address revisions. }, defaultLanguage: { type: string }, registrationNumber: { type: string }, updatedAt: { type: string, format: date-time }, id: { type: string, format: uuid }, code: { type: string }, name: { type: string }, country: { type: string }, currency: { type: string }, timeZone: { type: string }, status: { type: string, enum: [active, inactive] }, version: { type: integer }, createdAt: { type: string, format: date-time } }
    UpdateLegalEntity:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, name: { type: string, minLength: 1, maxLength: 120 }, timeZone: { type: string, description: IANA time zone name }, defaultLanguage: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }, registrationNumber: { type: string, maxLength: 40 }, status: { type: string, enum: [active, inactive] }, primaryAddressId: { type: string, description: A UUID of a current address owned by the legal entity, or an empty string to clear }, fiscalCalendarId: { type: string, description: A UUID of an active fiscal calendar with at least one generated year (422 ORG-LE-CALENDAR-INVALID otherwise), or an empty string to clear } }
    LegalEntityName:
      type: object
      required: [name, validFrom]
      properties: { name: { type: string }, validFrom: { type: string, format: date-time }, validTo: { type: string, format: date-time } }
    CreateOperatingUnit:
      type: object
