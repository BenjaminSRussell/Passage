openapi: 3.1.0
info:
  title: org
  version: 0.13.0
  description: Organization service. Covers legal entities, operating units, sites, warehouses, locations, postal addresses with purposes, fiscal calendars with idempotent year generation and the period read, hierarchy types and draft hierarchy versions with validated node sets (error codes ORG-HIER-CYCLE, ORG-HIER-MULTI-ROOT, ORG-HIER-DUPLICATE-NODE, ORG-HIER-PARENT-UNKNOWN, ORG-HIER-DEPTH, ORG-HIER-SIZE, ORG-HIER-NODE-UNKNOWN, ORG-HIER-TYPE-NOT-FOUND, ORG-HIER-TYPE-CODE-DUPLICATE, ORG-HIER-VERSION-NOT-FOUND, ORG-HIER-DRAFT-EXISTS, ORG-HIER-VERSION-IMMUTABLE, ORG-HIER-OVERLAP, ORG-HIER-BACKDATE-DUTY, ORG-HIER-NO-VERSION, ORG-HIER-NODE-ABSENT, ORG-HIER-MAKER-CHECKER) with the version list, publish, supersede, the closure table, the as-of query and the version comparison, unit-of-measure conversion, and the platform-owned reference sets (countries, currencies, regions, languages) with tenant-level deactivation.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/org/legal-entities:
    post:
      operationId: createLegalEntity
      x-passage-duty: org.legal-entity.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateLegalEntity' } } }
      responses:
        '201':
          description: Legal entity created, or the original entity on an Idempotency-Key replay.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegalEntity' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listLegalEntities
      x-passage-duty: org.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: country, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: currency, in: query, schema: { type: string, pattern: '^[A-Z]{3}$' } }
      responses:
        '200':
          description: One page of legal entities of the caller's tenant visible to the caller's legal-entity scope, ordered by code. Pass nextCursor as cursor for the next page.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LegalEntity' } }, nextCursor: { type: string } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/legal-entities/{id}:
    get:
      operationId: getLegalEntity
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One legal entity. A malformed id, an unknown id and an id outside the caller's legal-entity scope are all ORG-LE-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegalEntity' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateLegalEntity
      x-passage-duty: org.legal-entity.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateLegalEntity' } } }
      responses:
        '200':
          description: The legal entity. A stale version is 409 ORG-VERSION-CONFLICT. A request that changes no value returns the stored entity with the same version and emits no event. Changing the default language to an unknown or inactive language is 422 ORG-LE-REFERENCE-INACTIVE. 400 COM-0001 for a field error. 404 ORG-LE-NOT-FOUND. 422 ORG-ADDR-NOT-OWNED, naming the field in errors, when the address pointer is not a current address owned by this record; an old version id, another owner's address and an address outside the caller's scope all fail. 403 AUTH-0003 without the duty.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegalEntity' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/legal-entities/{id}/names:
    get:
      operationId: listLegalEntityNames
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Name history of the legal entity, newest first. The current name has no validTo.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LegalEntityName' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/operating-units:
    post:
      operationId: createOperatingUnit
      x-passage-duty: org.operating-unit.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOperatingUnit' } } }
      responses:
        '201':
          description: Operating unit created, or the original unit on an Idempotency-Key replay. 400 COM-0001 for a field error. 409 ORG-OU-CODE-DUPLICATE when the code exists for the type. 422 ORG-OU-LEGAL-ENTITY-INVALID when the default legal entity is unknown, inactive or outside the caller's scope. 422 idempotency_key_reuse when the key was used with a different body.
          content: { application/json: { schema: { $ref: '#/components/schemas/OperatingUnit' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listOperatingUnits
      x-passage-duty: org.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [department, cost_center, business_unit, value_stream] } }
        - { name: defaultLegalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: hierarchyTypeId, in: query, schema: { type: string, format: uuid }, description: Return only operating units that are nodes of the version of this hierarchy type in force on asOf (published or superseded, never a draft) }
        - { name: asOf, in: query, schema: { type: string, format: date }, description: Allowed only together with hierarchyTypeId; defaults to today (UTC) }
      responses:
        '200':
          description: One page of the tenant's operating units, ordered by type then code; legal-entity-scoped callers see every unit. Pass nextCursor as cursor for the next page. A bad filter or cursor is 400 COM-0001, including a malformed hierarchyTypeId or asOf and asOf without hierarchyTypeId. A type with no version in force on asOf gives an empty list.
          content: { application/json: { schema: { $ref: '#/components/schemas/OperatingUnitList' } } }
        '404':
          description: ORG-HIER-TYPE-NOT-FOUND when hierarchyTypeId names no hierarchy type of the tenant.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/operating-units/{id}:
    get:
      operationId: getOperatingUnit
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One operating unit. A malformed id and an unknown id are both 404 ORG-OU-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/OperatingUnit' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateOperatingUnit
      x-passage-duty: org.operating-unit.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOperatingUnit' } } }
      responses:
        '200':
          description: The operating unit. A stale version is 409 ORG-VERSION-CONFLICT. A request that changes no value returns the stored unit with the same version and emits no event. An empty defaultLegalEntityId or managerPartyId clears it. 400 COM-0001 for a field error or managerPartyId on a unit that is not a cost_center. 404 ORG-OU-NOT-FOUND. 422 ORG-OU-LEGAL-ENTITY-INVALID for an unknown, inactive or out-of-scope default legal entity.
          content: { application/json: { schema: { $ref: '#/components/schemas/OperatingUnit' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/sites:
    post:
      operationId: createSite
      x-passage-duty: org.site.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSite' } } }
      responses:
        '201':
          description: Site created, or the original site on an Idempotency-Key replay. The time zone defaults to the legal entity's. 400 COM-0001 for a field error. 409 ORG-SITE-CODE-DUPLICATE when the code exists in the legal entity. 422 ORG-SITE-LEGAL-ENTITY-INVALID when the legal entity is unknown, inactive or outside the caller's scope. 422 idempotency_key_reuse when the key was used with a different body.
          content: { application/json: { schema: { $ref: '#/components/schemas/Site' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listSites
      x-passage-duty: org.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: One page of sites ordered by code then id; a legal-entity-scoped caller sees only that legal entity's sites. Pass nextCursor as cursor for the next page. A bad filter or cursor is 400 COM-0001.
          content: { application/json: { schema: { $ref: '#/components/schemas/SiteList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/sites/{id}:
    get:
      operationId: getSite
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One site. A malformed id, an unknown id and a site outside the caller's legal-entity scope are all 404 ORG-SITE-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/Site' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateSite
      x-passage-duty: org.site.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSite' } } }
      responses:
        '200':
          description: The site. A stale version is 409 ORG-VERSION-CONFLICT. A request that changes no value returns the stored site with the same version and emits no event. 400 COM-0001 for a field error, or for legalEntityId or code, which are immutable. 404 ORG-SITE-NOT-FOUND. 409 ORG-SITE-IN-USE when the patch sets status inactive while an active warehouse references the site. 422 ORG-ADDR-NOT-OWNED, naming the field in errors, when the address pointer is not a current address owned by this record; an old version id, another owner's address and an address outside the caller's scope all fail. 403 AUTH-0003 without the duty.
          content: { application/json: { schema: { $ref: '#/components/schemas/Site' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/warehouses:
    post:
      operationId: createWarehouse
      x-passage-duty: org.site.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateWarehouse' } } }
      responses:
        '201':
          description: Warehouse created, or the original warehouse on an Idempotency-Key replay. The legal entity is the site's; the time zone defaults to the site's and the type to standard. 400 COM-0001 for a field error. 409 ORG-WH-CODE-DUPLICATE when the code exists in the legal entity. 422 ORG-WH-SITE-INVALID when the site is unknown, inactive or outside the caller's scope. 422 idempotency_key_reuse when the key was used with a different body.
          content: { application/json: { schema: { $ref: '#/components/schemas/Warehouse' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listWarehouses
      x-passage-duty: org.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, enum: [standard, transit, quarantine, subcontractor] } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: One page of warehouses ordered by code then id; a legal-entity-scoped caller sees only that legal entity's warehouses. Pass nextCursor as cursor for the next page. A bad filter or cursor is 400 COM-0001.
          content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/warehouses/{id}:
    get:
      operationId: getWarehouse
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One warehouse. A malformed id, an unknown id and a warehouse outside the caller's legal-entity scope are all 404 ORG-WH-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/Warehouse' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateWarehouse
      x-passage-duty: org.site.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateWarehouse' } } }
      responses:
        '200':
          description: The warehouse. A stale version is 409 ORG-VERSION-CONFLICT. A request that changes no value returns the stored warehouse with the same version and emits no event. 400 COM-0001 for a field error, or for legalEntityId or code, which are immutable. 404 ORG-WH-NOT-FOUND. 422 ORG-WH-SITE-INVALID when the new site is unknown, inactive or outside the caller's scope; 422 ORG-WH-LE-MISMATCH when the new site belongs to another legal entity. 422 ORG-ADDR-NOT-OWNED, naming the field in errors, when the address pointer is not a current address owned by this record; an old version id, another owner's address and an address outside the caller's scope all fail. 403 AUTH-0003 without the duty.
          content: { application/json: { schema: { $ref: '#/components/schemas/Warehouse' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/fiscal-calendars:
    post:
      operationId: createFiscalCalendar
      x-passage-duty: org.fiscal-calendar.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateFiscalCalendar' } } }
      responses:
        '201':
          description: Fiscal calendar created, or the original calendar on an Idempotency-Key replay. Calendars are tenant-level. 400 COM-0001 naming code, name, pattern, startMonth, weekStart or specialPeriods. 409 ORG-CAL-CODE-DUPLICATE. 422 idempotency_key_reuse when the key was used with a different body. 403 AUTH-0003 without the duty or for a legal-entity-scoped caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/FiscalCalendar' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/fiscal-calendars/{id}:
    get:
      operationId: getFiscalCalendar
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One fiscal calendar. A malformed id, an unknown id and another tenant's id are all 404 ORG-CAL-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/FiscalCalendar' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/fiscal-calendars/{id}:generate:
    post:
      operationId: generateFiscalYear
      x-passage-duty: org.fiscal-calendar.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GenerateFiscalYear' } } }
      responses:
        '200':
          description: Idempotent replay. The year already exists and force was not set, so the stored periods are returned with generated false, nothing is written and no event is emitted.
          content: { application/json: { schema: { $ref: '#/components/schemas/FiscalYear' } } }
        '201':
          description: The year was generated, or regenerated with force, and one fiscalcalendar.generated event was emitted. 400 COM-0001 for a missing or non-integer fiscalYear or a malformed date. 404 ORG-CAL-NOT-FOUND. 409 ORG-CAL-LOCKED when force is set and the ledger reports postings in the year. 422 ORG-CAL-PATTERN when periods are missing on a custom calendar or sent to another pattern; 422 ORG-CAL-GAP or ORG-CAL-OVERLAP when custom periods do not tile the year. 503 COM-0503 when the ledger posting check fails. 403 AUTH-0003 without the duty or for a legal-entity-scoped caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/FiscalYear' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/fiscal-calendars/{id}/periods:
    get:
      operationId: listFiscalPeriods
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fiscalYear, in: query, schema: { type: integer, minimum: 1900, maximum: 2999 } }
      responses:
        '200':
          description: Periods ordered by fiscal year then period number (0, operating, adjustment, 99); every generated year when fiscalYear is omitted, an empty list when none is generated. 400 COM-0001 for a fiscalYear outside 1900 to 2999. 404 ORG-CAL-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/FiscalPeriodList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/hierarchy-types:
    get:
      operationId: listHierarchyTypes
      x-passage-duty: org.read
      parameters:
        - { name: purpose, in: query, schema: { type: string, enum: [reporting, procurement, expenditure, security, centralized_payments, custom] } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of hierarchy types ordered by code; purpose matches types whose purposes contain it. Types are tenant-wide, so a legal-entity-scoped caller reads them too. Pass nextCursor as cursor for the next page. 400 COM-0001 naming purpose, status, limit or cursor. 403 AUTH-0003 without org.read.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyTypePage' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createHierarchyType
      x-passage-duty: org.hierarchy.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateHierarchyType' } } }
      responses:
        '201':
          description: Hierarchy type created, or the original type on an Idempotency-Key replay. Types are tenant-level. 400 COM-0001 naming code, name or purposes. 409 ORG-HIER-TYPE-CODE-DUPLICATE. 422 idempotency_key_reuse when the key was used with a different body. 403 AUTH-0003 without the duty or for a legal-entity-scoped caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyType' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/hierarchy-types/{id}:
    get:
      operationId: getHierarchyType
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The hierarchy type. A legal-entity-scoped caller may read it. 403 AUTH-0003 without org.read. 404 ORG-HIER-TYPE-NOT-FOUND for a malformed, unknown or other tenant's id.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyType' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/hierarchy-types/{id}/versions:
    get:
      operationId: listHierarchyVersions
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, superseded] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of the type's versions without nodes, newest versionNo first; an empty items array for a type with no versions. A legal-entity-scoped caller reads them too. Pass nextCursor as cursor for the next page. 400 COM-0001 naming status, limit or cursor (the cursor must be a positive version number). 403 AUTH-0003 without org.read. 404 ORG-HIER-TYPE-NOT-FOUND for a malformed, unknown or other tenant's id.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyVersionPage' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createHierarchyDraft
      x-passage-duty: org.hierarchy.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      responses:
        '201':
          description: A draft version numbered one above the type's highest version, with the node set copied from the published version with the latest effective_from, or empty when none is published. The request has no body. Replaying the key for the same type returns the same draft. 404 ORG-HIER-TYPE-NOT-FOUND for a malformed, unknown or other tenant's id. 409 ORG-HIER-DRAFT-EXISTS when the type already has an open draft. 422 idempotency_key_reuse when the key belongs to another type. 403 AUTH-0003 without the duty or for a legal-entity-scoped caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyVersion' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/hierarchy-versions/{id}:
    get:
      operationId: getHierarchyVersion
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The version with its nodes ordered by sortOrder, in the same representation publish returns; a published version carries publishedAt and publishedBy. 403 AUTH-0003 without org.read. 404 ORG-HIER-VERSION-NOT-FOUND for a malformed, unknown or other tenant's id.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyVersion' } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteHierarchyDraft
      x-passage-duty: org.hierarchy.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer }, description: The draft's current optimistic-lock version }
      responses:
        '204':
          description: The draft and its nodes are deleted; no body and no event. Deleting the open draft frees the type's draft slot, and the next draft's versionNo is one above the highest remaining, so a deleted draft's versionNo may be reused. 400 COM-0001 naming version when it is missing or not an integer. 403 AUTH-0003 without org.hierarchy.write or for a legal-entity-scoped caller. 404 ORG-HIER-VERSION-NOT-FOUND for a malformed, unknown or other tenant's id. 409 ORG-HIER-VERSION-IMMUTABLE for a version that is not a draft, left unchanged; 409 ORG-VERSION-CONFLICT for a stale version.
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/hierarchy-versions/{id}/nodes:
    put:
      operationId: replaceHierarchyNodes
      x-passage-duty: org.hierarchy.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceHierarchyNodes' } } }
      responses:
        '200':
          description: The draft with its full node set replaced, nodes ordered by sortOrder, the kind of each node resolved and version incremented. 400 COM-0001 naming version or nodes[i].orgUnitId, nodes[i].parentOrgUnitId or nodes[i].sortOrder (at most 20 node errors). 404 ORG-HIER-VERSION-NOT-FOUND for a malformed, unknown or other tenant's id. 409 ORG-HIER-VERSION-IMMUTABLE for a published or superseded version; 409 ORG-VERSION-CONFLICT for a stale version. 422 ORG-HIER-SIZE, ORG-HIER-DUPLICATE-NODE, ORG-HIER-PARENT-UNKNOWN, ORG-HIER-CYCLE, ORG-HIER-MULTI-ROOT or ORG-HIER-DEPTH, or ORG-HIER-NODE-UNKNOWN when an org unit is neither a legal entity nor an operating unit. A rejected request leaves the stored nodes unchanged. 403 AUTH-0003 without the duty or for a legal-entity-scoped caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyVersion' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/hierarchy-versions/{id}:publish:
    post:
      operationId: publishHierarchyVersion
      x-passage-duty: org.hierarchy.publish
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublishHierarchyVersion' } } }
      responses:
        '200':
          description: The published version with its nodes, or the original on an Idempotency-Key replay. Superseding the latest earlier version closes its range at effectiveFrom. 400 COM-0001 naming version, effectiveFrom or reason (a reason of a non-backdated publish must be 10 to 500 characters). 403 AUTH-0003 without the duty or for a legal-entity-scoped caller. 403 ORG-HIER-MAKER-CHECKER when the type has the security purpose and the caller is the draft's last editor (editedBy); the version stays a draft, no closure rows are written and no event is emitted; a draft whose editedBy is null, created before this rule, is not blocked, and types without the security purpose are unaffected. 403 ORG-HIER-BACKDATE-DUTY when effectiveFrom is before today (UTC) and the caller lacks org.hierarchy.backdate, the type forbids backdating or the reason is not 10 to 500 characters; no version changes state. 404 ORG-HIER-VERSION-NOT-FOUND for a malformed, unknown or other tenant's id. 409 ORG-HIER-VERSION-IMMUTABLE for a version that is not a draft; 409 ORG-VERSION-CONFLICT for a stale version; 409 ORG-HIER-OVERLAP when effectiveFrom is not after the latest published version's. 422 ORG-HIER-MULTI-ROOT, ORG-HIER-CYCLE, ORG-HIER-DUPLICATE-NODE, ORG-HIER-DEPTH or ORG-HIER-SIZE when the stored node set is invalid, including an empty one. 422 idempotency_key_reuse when the key belongs to another version or date. Emits dev.passage.org.hierarchyversion.activated.v1 in the same transaction, also for a future effectiveFrom.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyVersion' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/hierarchy-types/{id}/as-of:
    get:
      operationId: getHierarchyAsOf
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: node, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The node's position in the non-draft version in force on date; superseded versions answer for dates inside their closed range. ancestors run nearest first, descendants by depth then orgUnitId. 400 COM-0001 naming date or node. 404 ORG-HIER-TYPE-NOT-FOUND for a malformed, unknown or other tenant's id. 404 ORG-HIER-NO-VERSION when no version is in force on date. 404 ORG-HIER-NODE-ABSENT when the node is not in that version.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyAsOf' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/hierarchy-types/{id}/compare:
    get:
      operationId: compareHierarchyVersions
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: to, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The nodes added, removed and moved between version numbers from and to, each list ordered by orgUnitId and never null. Any statuses may be compared, including a draft, and from may equal to. A moved subtree reports only its root. 400 COM-0001 naming from or to. 403 AUTH-0003 without org.read. 404 ORG-HIER-TYPE-NOT-FOUND for a malformed, unknown or other tenant's id. 404 ORG-HIER-VERSION-NOT-FOUND when the type has no version with that number.
          content: { application/json: { schema: { $ref: '#/components/schemas/HierarchyComparison' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/locations:
    post:
      operationId: createLocation
      x-passage-duty: org.site.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateLocation' } } }
      responses:
        '201':
          description: Location created, or the original location on an Idempotency-Key replay. The legal entity is the warehouse's and the type defaults to storage. 400 COM-0001 for a field error. 409 ORG-LOC-CODE-DUPLICATE when the code exists in the warehouse. 422 ORG-LOC-WAREHOUSE-INVALID when the warehouse is unknown, inactive or outside the caller's scope. 422 idempotency_key_reuse when the key was used with a different body.
          content: { application/json: { schema: { $ref: '#/components/schemas/Location' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listLocations
      x-passage-duty: org.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, enum: [storage, receiving, shipping, quarantine] } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: One page of locations ordered by code then id; a legal-entity-scoped caller sees only that legal entity's locations. Pass nextCursor as cursor for the next page. A bad filter or cursor is 400 COM-0001.
          content: { application/json: { schema: { $ref: '#/components/schemas/LocationList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/locations/{id}:
    get:
      operationId: getLocation
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One location. A malformed id, an unknown id and a location outside the caller's legal-entity scope are all 404 ORG-LOC-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/Location' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateLocation
      x-passage-duty: org.site.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateLocation' } } }
      responses:
        '200':
          description: The location. A stale version is 409 ORG-VERSION-CONFLICT. A request that changes no value returns the stored location with the same version and emits no event. 400 COM-0001 for a field error, or for warehouseId or code, which are immutable. 404 ORG-LOC-NOT-FOUND for a malformed, unknown or out-of-scope id. 422 ORG-ADDR-NOT-OWNED, naming the field in errors, when the address pointer is not a current address owned by this record; an old version id, another owner's address and an address outside the caller's scope all fail. 403 AUTH-0003 without the duty.
          content: { application/json: { schema: { $ref: '#/components/schemas/Location' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/addresses:
    post:
      operationId: createAddress
      x-passage-duty: org.address.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAddress' } } }
      responses:
        '201':
          description: Address created (first version), or the original address on an Idempotency-Key replay. Country and region rules come from the seeded country rows; coordinates are set only when the geocoder finds the address, otherwise geoStatus is unverified. 400 COM-0001 for a field error. 409 ORG-ADDR-PRIMARY-DUPLICATE when the owner already has a primary address for a purpose. 422 ORG-ADDR-OWNER-INVALID, ORG-ADDR-COUNTRY-INVALID, ORG-ADDR-REGION-UNKNOWN, ORG-ADDR-REGION-REQUIRED or ORG-ADDR-POSTAL-FORMAT, with the failing fields in errors; 422 idempotency_key_reuse when the key was used with a different body.
          content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listAddresses
      x-passage-duty: org.read
      parameters:
        - { name: ownerType, in: query, required: true, schema: { type: string, enum: [legal_entity, operating_unit, site, warehouse, location, party] } }
        - { name: ownerId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: purpose, in: query, schema: { type: string, enum: [business, delivery, invoice, remit_to, service, home, other] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: The owner's current address versions ordered by address id, filtered by purpose when given. An owner outside the caller's legal-entity scope yields an empty page. Pass nextCursor as cursor for the next page. 400 COM-0001 for a bad owner, purpose, limit or cursor.
          content: { application/json: { schema: { $ref: '#/components/schemas/AddressList' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/address-versions/{id}:
    get:
      operationId: getAddressVersion
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid, description: The versionId of an address } }
      responses:
        '200':
          description: Any version of an address, current or closed, so documents can read the version they hold. Purposes belong to the address, so a closed version reports the current purposes. A malformed id, an unknown id and a version outside the caller's legal-entity scope are all 404 ORG-ADDR-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/addresses/{id}:
    get:
      operationId: getAddress
      x-passage-duty: org.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The current version of the address with its purposes. A malformed id, an unknown id and an address outside the caller's legal-entity scope are all 404 ORG-ADDR-NOT-FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateAddress
      x-passage-duty: org.address.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAddress' } } }
      responses:
        '200':
          description: The new current version. The edit closes the current version, inserts the next one, replaces the purposes and emits address.changed for the new version. A request that changes nothing and has no validFrom returns the current version and writes nothing. 400 COM-0001 for a field error, or for ownerType or ownerId, which are immutable. 404 ORG-ADDR-NOT-FOUND. 409 ORG-VERSION-CONFLICT when versionId is stale, or ORG-ADDR-PRIMARY-DUPLICATE. 422 ORG-ADDR-VALID-FROM-INVALID when validFrom precedes the current version or is in the future, or one of ORG-ADDR-COUNTRY-INVALID, ORG-ADDR-REGION-UNKNOWN, ORG-ADDR-REGION-REQUIRED or ORG-ADDR-POSTAL-FORMAT.
          content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/countries:
    get:
      operationId: listCountries
      x-passage-duty: org.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: Every country with its status for the caller's tenant, ordered by code.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Country' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/countries/{code}:
    get:
      operationId: getCountry
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One country with its status for the caller's tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/Country' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: setCountryStatus
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceStatusChange' } } }
      responses:
        '200':
          description: The country with its new status for the caller's tenant; repeating the current status changes nothing. Rejected for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/Country' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/currencies:
    get:
      operationId: listCurrencies
      x-passage-duty: org.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: Every currency with its status for the caller's tenant, ordered by code.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Currency' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/currencies/{code}:
    get:
      operationId: getCurrency
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One currency with its status for the caller's tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/Currency' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: setCurrencyStatus
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceStatusChange' } } }
      responses:
        '200':
          description: The currency with its new status for the caller's tenant; repeating the current status changes nothing. Rejected for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/Currency' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/regions:
    get:
      operationId: listRegions
      x-passage-duty: org.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: country, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }
      responses:
        '200':
          description: Every region with its status for the caller's tenant, ordered by code.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Region' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/regions/{code}:
    get:
      operationId: getRegion
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One region with its status for the caller's tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/Region' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: setRegionStatus
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceStatusChange' } } }
      responses:
        '200':
          description: The region with its new status for the caller's tenant; repeating the current status changes nothing. Rejected for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/Region' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/languages:
    get:
      operationId: listLanguages
      x-passage-duty: org.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: Every language with its status for the caller's tenant, ordered by code.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Language' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/languages/{code}:
    get:
      operationId: getLanguage
      x-passage-duty: org.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One language with its status for the caller's tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/Language' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: setLanguageStatus
      x-passage-duty: org.reference.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferenceStatusChange' } } }
      responses:
        '200':
          description: The language with its new status for the caller's tenant; repeating the current status changes nothing. Rejected for legal-entity-scoped callers.
          content: { application/json: { schema: { $ref: '#/components/schemas/Language' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/org/uom/convert:
