openapi: 3.1.0
info:
  title: Passage print service
  version: 0.1.0
  description: Printer registry, queues and ZPL print jobs (wave 32, FR-32.7 and FR-32.13). Every mutating call requires Idempotency-Key.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env: { default: dev }
paths:
  /print/v1/printers:
    get:
      operationId: listPrinters
      summary: List printers of the tenant
      x-passage-duty: print.job.submit
      responses:
        '200':
          description: Printers ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Printer' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createPrinter
      summary: Register a printer and its queue membership
      x-passage-duty: print.admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrinterRequest' }
      responses:
        '201':
          description: Printer registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Printer' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: PRN-0003 when the printer code is taken, PRN-0006 when the queue already has a device at this failover rank
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /print/v1/routing-rules:
    get:
      operationId: listRoutingRules
      summary: List document routing rules in resolution order
      x-passage-duty: print.job.submit
      responses:
        '200':
          description: Rules ordered by sequence
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RoutingRule' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createRoutingRule
      summary: Create a document routing rule
      x-passage-duty: print.admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutingRuleRequest' }
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingRule' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /print/v1/jobs:
    get:
      operationId: listPrintJobs
      summary: Print job log, newest first (§6.32.14)
      x-passage-duty: print.job.submit
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [QUEUED, PRINTED, FAILED] }
        - name: queueCode
          in: query
          schema: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,39}$' }
        - name: printerCode
          in: query
          schema: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,39}$' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Jobs ordered by creation time, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PrintJob' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createPrintJob
      summary: Render a built-in template and print it on the first reachable ZPL device of the queue
      description: >-
        A job that no device accepts is recorded as FAILED with lastError MOB-0111 (unreachable), MOB-0112 (empty queue) or PRN-0007 (the label does not fit the media of any device in the queue) and returned with 201. Each ZPL label is sized at dispatch for the device that prints it (FR-32.13): the layout is scaled from 203 dpi to the device's dpi and ^PW/^LL are set from its media size; on 2X1_IN and 3X1_IN devices LP_LABEL, LOCATION_LABEL and ITEM_LABEL print a compact 1 in layout. A label whose fields or bar code width (with quiet zones) do not fit a device's media is not sent to it, and the next device in the queue is tried without retries. A documentType with no matching routing rule is refused with 422 MOB-0112 before anything is stored. A repeated key returns the stored job with Idempotent-Replayed true and prints nothing. reprintOf reuses the stored ZPL. ITEM_LABEL and GS1_CARTON_LABEL compose their GS1-128 element string (AI 00, 01, 10, 17, 21, 400, 420) from the data fields; a bad check digit, date, length or set-82 character is refused with 400 PRN-0001 before anything is stored.
      x-passage-duty: print.job.submit
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJobRequest' }
      responses:
        '201':
          description: Job completed (PRINTED or FAILED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintJob' }
        '200':
          description: Idempotent replay of a stored job
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintJob' }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /print/v1/documents:render:
    post:
      operationId: renderBusinessDocument
      summary: Render a purchase order, customer invoice, packing slip or remittance advice as a PDF (issues #530, #528)
      description: >-
        The caller sends the document as data (legal entity name and address, document number, the counterparty with its
        address, up to two additional parties such as a delivery address, header fields, a table and totals). The answer is
        an A4 PDF: the letterhead, the parties and header fields, the line table (right-aligned columns keep their width,
        left-aligned columns wrap; a row is never split across pages and each page repeats the table header), the totals
        block, the notes, and "Page n of m" on every page. The output is deterministic, so the same request returns the same
        bytes. Text is Unicode and is put in NFC. The PDF embeds subsets of the Go Regular and Go Bold fonts (Identity-H
        with a ToUnicode map, so text can be selected and searched), which cover Latin with its extended letters, Greek and
        Cyrillic. A character the fonts lack (Chinese, Japanese, Korean, Arabic, Hebrew, emoji and others) prints as the
        replacement character U+FFFD, the original text is kept as ActualText, and X-Passage-Unprintable-Characters counts
        them; the document is still rendered. Nothing is stored and no printer is used. A document that cannot be rendered
        is refused with 422 PRN-0008 and a detail that names the field (an empty required value, a text over its length
        limit, a control character, a line with the wrong number of cells), or with 422 PRN-0009 when it has more than 500
        lines. Fields added since the first release are optional, so earlier callers are unaffected.
      x-passage-duty: print.document.render
      x-passage-duty-alternatives: [print.customer-portal.render]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentRequest' }
      responses:
        '200':
          description: The PDF
          headers:
            X-Passage-Document-Pages: { description: The number of pages., schema: { type: integer, minimum: 1 } }
            X-Passage-Unprintable-Characters: { description: 'Present only when the document has characters the fonts lack: how many were printed as U+FFFD.', schema: { type: integer, minimum: 1 } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /print/v1/document-templates:
    get:
      operationId: listDocumentTemplates
      summary: List the tenant's document templates (46-1)
      x-passage-duty: print.job.submit
      parameters:
        - { name: documentType, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Templates by code
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DocumentTemplate' } } } }
  /print/v1/document-templates/{code}:
    get:
      operationId: getDocumentTemplate
      summary: Read one document template
      x-passage-duty: print.job.submit
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The template, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentTemplate' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: putDocumentTemplate
      summary: Create or replace a document template (46-1)
      description: >-
        A template changes the title, footer line, column names and visible columns of a document type, and names the text
        blocks that supply the letter body and form notes. Every save raises the version. At most one template of a document
        type is the default; saving one as the default clears the flag on the previous one. The document type of an
        existing template cannot change. Replacing an existing template needs the version you edited as If-Match (the
        read's ETag, for example "3"): without it 428 PRN-0018, and a save based on an older version than the current
        one is 412 PRN-0017; nothing is stored either way. A new template is created without If-Match. Every saved
        version is kept with who saved it (GET .../versions).
      x-passage-duty: print.admin
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: '^[A-Z][A-Z0-9_-]{1,39}$' } }
        - { name: If-Match, in: header, required: false, schema: { type: string }, description: 'The template version as an entity tag, for example "3".' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentTemplateRequest' }
      responses:
        '200': { description: Template saved; the ETag header is its new version., content: { application/json: { schema: { $ref: '#/components/schemas/DocumentTemplate' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /print/v1/document-templates/{code}/versions:
    get:
      operationId: listDocumentTemplateVersions
      summary: Every saved version of a document template, newest first (46-1)
      x-passage-duty: print.job.submit
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The versions, each with what it held, who saved it and when
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/DocumentTemplate'
                        - type: object
                          properties:
                            savedBy: { type: string }
                            savedAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Problem' }
  /print/v1/text-blocks:
    get:
      operationId: listTextBlocks
      summary: List every language version of every text block (46-4)
      x-passage-duty: print.job.submit
      responses:
        '200':
          description: Text blocks by code and language
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/TextBlock' } } } }
  /print/v1/text-blocks/{code}/{language}:
    put:
      operationId: putTextBlock
      summary: Create or replace one language version of a standard text (46-4)
      description: The body may hold placeholders written {{name}}. A render that gives no value for a placeholder is refused with PRN-0014, so a letter never prints a raw placeholder.
      x-passage-duty: print.admin
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: '^[A-Z][A-Z0-9_-]{1,39}$' } }
        - { name: language, in: path, required: true, schema: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string, minLength: 1, maxLength: 4000 } } }
      responses:
        '200': { description: Text block saved, content: { application/json: { schema: { $ref: '#/components/schemas/TextBlock' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /print/v1/output-rules:
    get:
      operationId: listOutputRules
      summary: List the output rules (46-2)
      x-passage-duty: print.job.submit
      responses:
        '200':
          description: Rules by sequence
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/OutputRule' } } } }
    post:
      operationId: createOutputRule
      summary: Add an output rule (46-2)
      description: >-
        Every rule is for one legal entity, which must be in the caller's scope (403 otherwise; row-level security enforces it too), or for
        every legal entity, which only a tenant administrator (no legal-entity claim, tenant.administer, print.admin) may add or delete.
        A rule sends one kind of copy (ORIGINAL or COPY) of a document type to a destination channel: a print queue of the
        site print agent, an e-mail address, the e-invoice network, the archive or the portal. It may be limited to a legal
        entity, an account (customer or vendor) or both. The rule says where; delivery is done by the caller or a later
        slice (see NOT-IMPLEMENTED.md).
      x-passage-duty: print.admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutputRuleRequest' }
      responses:
        '201': { description: Rule created, content: { application/json: { schema: { $ref: '#/components/schemas/OutputRule' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /print/v1/output-rules/{id}:
    delete:
      operationId: deleteOutputRule
      summary: Delete an output rule
      x-passage-duty: print.admin
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Rule deleted }
        '404': { $ref: '#/components/responses/Problem' }
  /print/v1/output-plan:
    get:
      operationId: resolveOutputPlan
      summary: Where the original and the copies of one document go (46-2)
      description: For each copy kind (original, copy), every rule of the most specific matching scope that has a rule for it (legal entity and account, then account, then legal entity, then the document type's default), whatever its channel, so an account's own original replaces the default original instead of adding to it. Original first.
      x-passage-duty: print.job.submit
      parameters:
        - { name: documentType, in: query, required: true, schema: { type: string } }
        - { name: legalEntityId, in: query, required: false, schema: { type: string } }
        - { name: accountId, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: The destinations
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/OutputRule' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /print/v1/jobs:purge:
    post:
      operationId: purgePrintJobs
      summary: Delete the tenant's finished job log rows older than the retention window (§6.32.19)
      description: Removes the tenant's PRINTED and FAILED jobs created before now minus PRINT_JOB_RETENTION_DAYS (default 30). QUEUED jobs are kept. The key is required but not stored; calling it again deletes nothing new. The service also runs this purge daily at 01:00 UTC for each tenant in PRINT_PURGE_TENANT_IDS.
      x-passage-duty: print.admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Purge completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurgeResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /print/v1/printers/{id}:
    patch:
      operationId: updatePrinter
      summary: Edit an active printer, or move it to another queue or failover rank (FR-32.13)
      description: Omitted fields keep their value. The code and device type never change. A queue and rank already held by an active printer is PRN-0006; a retired or unknown printer is PRN-0010.
      x-passage-duty: print.admin
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                dpi: { type: integer, enum: [203, 300, 600] }
                mediaSize: { type: string }
                host: { type: string }
                port: { type: integer }
                queueCode: { type: string }
                failoverRank: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Printer updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Printer' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /print/v1/printers/{id}:retire:
    post:
      operationId: retirePrinter
      summary: Take a printer out of its queue
      description: The row stays so the job log still names the printer, and its failover rank is free again. Later jobs fail over past it. List retired printers with includeRetired=true on GET /printers.
      x-passage-duty: print.admin
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Printer retired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Printer' }
        '404': { $ref: '#/components/responses/Problem' }
  /print/v1/routing-rules/{id}:
    put:
      operationId: updateRoutingRule
      summary: Replace a document routing rule
      x-passage-duty: print.admin
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutingRuleRequest' }
      responses:
        '200':
          description: Rule replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingRule' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteRoutingRule
      summary: Delete a document routing rule
      x-passage-duty: print.admin
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Rule deleted }
        '404': { $ref: '#/components/responses/Problem' }
  /print/v1/jobs:sweep:
    post:
      operationId: sweepPrintJobs
      summary: Dispatch the tenant's jobs left QUEUED (§6.32.16)
      description: Finds jobs QUEUED for more than a minute (the process died between insert and completion), stamps them so a second sweep skips them, and dispatches each through its queue in failover order. A swept job prints the stored layout, like a reprint. The service also runs this every 15 s for each tenant in PRINT_PURGE_TENANT_IDS.
      x-passage-duty: print.admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Sweep completed
          content:
            application/json:
              schema:
                type: object
                required: [claimed, printed, failed]
                properties:
                  claimed: { type: integer }
                  printed: { type: integer }
                  failed: { type: integer }
  /print/v1/printers/status:
    get:
      operationId: listPrinterStatus
      summary: Operational status of every printer of the tenant (§6.32.14)
      description: State is derived from the printer's most recent job (IDLE with no job, BUSY while QUEUED, READY when PRINTED, ERROR when FAILED). No device probe is made, so the state is what the service last observed.
      x-passage-duty: print.job.submit
      responses:
        '200':
          description: Printers ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PrinterStatus' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /print/v1/jobs/{id}:
    get:
      operationId: getPrintJob
      summary: Read a print job
      x-passage-duty: print.job.submit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintJob' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors: { type: object, additionalProperties: { type: string } }
    DocumentParty:
      type: object
      required: [name]
      properties:
        label: { type: string, maxLength: 200, description: 'For example Vendor, Bill to, Ship to. The counterparty defaults to Vendor on a purchase order or remittance advice, Bill to on an invoice and Ship to on a packing slip.' }
        name: { type: string, minLength: 1, maxLength: 200 }
        address: { type: array, maxItems: 8, items: { type: string, maxLength: 200 }, description: One entry per printed line. }
    DocumentField:
      type: object
      required: [label, value]
      properties:
        label: { type: string, minLength: 1, maxLength: 200 }
        value: { type: string, maxLength: 200 }
    DocumentRequest:
      type: object
      required: [documentType, number, legalEntity, columns, lines]
      description: Text is Unicode. Control characters are refused; only table cells and notes may hold line breaks.
      properties:
        documentType: { type: string, enum: [PURCHASE_ORDER, CUSTOMER_INVOICE, PACKING_SLIP, REMITTANCE_ADVICE, PERIODIC_STATEMENT, PAYMENT_NOTICE, BALANCE_CONFIRMATION], description: 'PERIODIC_STATEMENT, PAYMENT_NOTICE and BALANCE_CONFIRMATION are correspondence (46-4): a letter whose body comes from a text block, with an optional table. REMITTANCE_ADVICE (#528) is one payment of a payment run: the vendor as counterparty, one line per invoice the payment settled (invoice, date, amount open, discount, tax withheld, paid) and the total paid.' }
        number: { type: string, minLength: 1, maxLength: 200 }
        legalEntity: { $ref: '#/components/schemas/DocumentParty' }
        counterparty:
          allOf: [{ $ref: '#/components/schemas/DocumentParty' }]
          description: The vendor of a purchase order or remittance advice, or the customer of an invoice or packing slip, with its address.
        additionalParties:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/DocumentParty' }
          description: Further parties printed beside the counterparty, each with its label, for example Deliver to or Ship from.
        fields: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/DocumentField' } }
        columns:
          type: array
          minItems: 0
          maxItems: 8
          description: At least one column, except for correspondence documents, which may have none.
          items:
            type: object
            required: [header]
            properties:
              header: { type: string, minLength: 1, maxLength: 200 }
              align: { type: string, enum: [L, R], description: 'L (default) wraps long text; R is for numbers and keeps the column as wide as its widest value.' }
        lines:
          type: array
          maxItems: 500
          description: One array per line with one cell per column. More than 500 lines is refused with PRN-0009.
          items: { type: array, items: { type: string, maxLength: 500 } }
        totals:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/DocumentField' }
          description: Printed at the right below the table; the last entry is the grand total, in bold under a rule.
        notes: { type: string, maxLength: 2000 }
        title: { type: string, maxLength: 60, description: Replaces the standard title; a template sets it. }
        body: { type: string, maxLength: 4000, description: The letter text of a correspondence document (required for them, refused for the others); a text block can supply it. }
        footerText: { type: string, maxLength: 200, description: A line at the foot of every page. }
        templateCode: { type: string, description: 'A saved document template (46-1). Without one, the default template of the document type is used, if there is one.' }
        language: { type: string, description: 'Language tag of the text blocks, such as en or de-CH. A block falls back to its base language, then to English.' }
        bodyBlock: { type: string, description: The text block that is the letter body; overrides the template's body block. }
        values: { type: object, additionalProperties: { type: string }, description: 'Values of the text blocks'' placeholders. documentNumber, legalEntityName and counterpartyName are filled in.' }
    DocumentTemplateConfig:
      type: object
      properties:
        title: { type: string, maxLength: 60 }
        footerText: { type: string, maxLength: 200 }
        renameColumns: { type: object, additionalProperties: { type: string }, description: 'Column header the caller sends to the header to print.' }
        hideColumns: { type: array, items: { type: string }, description: Column headers to leave out, with their cells. }
        bodyBlock: { type: string, description: Text block code; correspondence documents only. }
        noteBlocks: { type: array, maxItems: 8, items: { type: string }, description: Text blocks appended to the notes (form notes). }
    DocumentTemplateRequest:
      type: object
      required: [name, documentType]
      properties:
        name: { type: string, maxLength: 200 }
        documentType: { type: string }
        default: { type: boolean }
        config: { $ref: '#/components/schemas/DocumentTemplateConfig' }
    DocumentTemplate:
      type: object
      required: [code, name, documentType, default, version, config]
      properties:
        code: { type: string }
        name: { type: string }
        documentType: { type: string }
        default: { type: boolean }
        version: { type: integer, minimum: 1 }
        config: { $ref: '#/components/schemas/DocumentTemplateConfig' }
    TextBlock:
      type: object
      required: [code, language, body, placeholders, version]
      properties:
        code: { type: string }
        language: { type: string }
        body: { type: string }
        placeholders: { type: array, items: { type: string } }
        version: { type: integer, minimum: 1 }
    OutputRuleRequest:
      type: object
      required: [documentType, copyKind, channel, sequence]
      properties:
        documentType: { type: string }
        legalEntityId: { type: string, format: uuid, description: 'Only within the caller''s legal-entity scope (403 otherwise).' }
        accountId: { type: string, format: uuid, description: The customer or vendor party. }
        copyKind: { type: string, enum: [ORIGINAL, COPY] }
        channel: { type: string, enum: [PRINTER, EMAIL, EINVOICE, ARCHIVE, PORTAL] }
        destination: { type: string, description: 'A queue code for PRINTER, one address for EMAIL; empty for the other channels.' }
        copies: { type: integer, minimum: 1, maximum: 9, default: 1, description: Only a printer takes more than one. }
        sequence: { type: integer, minimum: 1 }
    OutputRule:
      allOf:
        - { $ref: '#/components/schemas/OutputRuleRequest' }
        - type: object
          required: [id, copies]
          properties:
            id: { type: string, format: uuid }
    PrinterRequest:
      type: object
      required: [code, name, deviceType, dpi, host, queueCode, failoverRank]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,39}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        deviceType: { type: string, enum: [ZPL_II, PDF_IPP, PCL_6] }
        dpi: { type: integer, enum: [203, 300, 600] }
        mediaSize:
          type: string
          enum: [2X1_IN, 3X1_IN, 4X2_IN, 4X6_IN, A4, LETTER]
          description: Label sizes (2X1_IN, 3X1_IN, 4X2_IN, 4X6_IN) for ZPL_II; sheet sizes (A4, LETTER) for PDF_IPP and PCL_6. Defaults to 4X6_IN for ZPL_II and A4 otherwise (FR-32.13).
        host: { type: string, minLength: 1, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535, description: Defaults to 9100 (raw TCP) for ZPL_II and PCL_6 and to 631 (IPP) for PDF_IPP. }
        queueCode: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,39}$' }
        failoverRank: { type: integer, minimum: 1, description: Unique within the queue; jobs try devices in rank order. }
    Printer:
      type: object
      required: [id, code, name, deviceType, dpi, mediaSize, host, port, queueCode, failoverRank, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        deviceType: { type: string, enum: [ZPL_II, PDF_IPP, PCL_6] }
        dpi: { type: integer, enum: [203, 300, 600] }
        mediaSize: { type: string, enum: [2X1_IN, 3X1_IN, 4X2_IN, 4X6_IN, A4, LETTER] }
        host: { type: string }
        port: { type: integer }
        queueCode: { type: string }
        failoverRank: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateJobRequest:
      type: object
      description: Give queueCode, or documentType (with optional zone and warehouseId) to resolve the queue by routing rule (BR-32.12).
      additionalProperties: false
      properties:
        templateCode:
          type: string
          enum: [LP_LABEL, LOCATION_LABEL, ITEM_LABEL, GS1_CARTON_LABEL]
          description: >-
            Required for a ZPL label unless reprintOf is set; must be empty for a PDF document. LP_LABEL needs lp, item, lot, expiry and sscc; LOCATION_LABEL needs location;
            ITEM_LABEL needs gtin and takes optional lot, expiry (YYMMDD, DD=00 is month end) and serial;
            GS1_CARTON_LABEL needs sscc and shipToName and takes optional poNumber and shipToPostal.
        format:
          type: string
          enum: [ZPL, PDF]
          description: >-
            Defaults to ZPL (a label rendered from templateCode, sent to ZPL_II devices only). PDF sends the document in
            documentBase64 (a pick list, count sheet, CoA or bill of lading) to PDF_IPP devices only; a queue without one
            fails the job with MOB-0112. Omit it on a reprint, which keeps the original job's format.
        documentBase64:
          type: string
          contentEncoding: base64
          contentMediaType: application/pdf
          maxLength: 2796204
          description: Required with format PDF and refused otherwise. The decoded document must start with %PDF- and be at most 2 MiB.
        queueCode: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,39}$' }
        documentType: { $ref: '#/components/schemas/DocumentType' }
        zone: { type: string }
        warehouseId: { type: string }
        data: { type: object, additionalProperties: { type: string } }
        reprintOf: { type: string, format: uuid }
    DocumentType:
      type: string
      enum: [LP_LABEL, LOCATION_LABEL, ITEM_LABEL, GS1_CARTON_LABEL, PICK_LIST, COUNT_SHEET, COA, BOL]
    RoutingRuleRequest:
      type: object
      required: [documentType, queueCode, sequence]
      additionalProperties: false
      description: At most one of userId, zone or warehouseId. Resolution order is user, zone, warehouse, then document-type default; ties go to the lowest sequence.
      properties:
        documentType: { $ref: '#/components/schemas/DocumentType' }
        userId: { type: string }
        zone: { type: string }
        warehouseId: { type: string }
        queueCode: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,39}$' }
        sequence: { type: integer, minimum: 1 }
    RoutingRule:
      type: object
      required: [id, documentType, queueCode, sequence]
      description: A stored rule. Scope fields are omitted when empty.
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: '#/components/schemas/DocumentType' }
        userId: { type: string }
        zone: { type: string }
        warehouseId: { type: string }
        queueCode: { type: string }
        sequence: { type: integer }
    PrintJob:
      type: object
      required: [id, templateCode, queueCode, format, status, attempts, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        templateCode: { type: string, description: PDF_DOCUMENT for a PDF job. }
        queueCode: { type: string }
        format: { type: string, enum: [ZPL, PDF] }
        printerId: { type: string, format: uuid }
        printerCode: { type: string }
        status: { type: string, enum: [QUEUED, PRINTED, FAILED] }
        attempts: { type: integer }
        lastError: { type: string, description: MOB-0111, MOB-0112 or PRN-0007 when FAILED. }
        reprintOf: { type: string, format: uuid }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PurgeResult:
      type: object
      required: [deleted, cutoff, retentionDays]
      properties:
        deleted: { type: integer, minimum: 0 }
        cutoff: { type: string, format: date-time, description: Jobs created before this instant were eligible. }
        retentionDays: { type: integer, minimum: 1 }
    PrinterStatus:
      type: object
      required: [printerId, code, queueCode, state, queueDepth]
      properties:
        printerId: { type: string, format: uuid }
        code: { type: string }
        queueCode: { type: string }
        state: { type: string, enum: [IDLE, BUSY, READY, ERROR] }
        queueDepth: { type: integer, minimum: 0, description: QUEUED jobs on the printer's queue. }
        lastError: { type: string }
        lastJobAt: { type: string, format: date-time }
