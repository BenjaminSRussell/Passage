image: { repository: ghcr.io/benjaminsrussell/print, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: print-db
migrateOnStart: false
replicaCount: 2
# PRINT_RETRY (print_retry_count): retries on a printer after its first attempt, before
# the queue fails over to the next printer (0-10). 1 gives the two attempts of FR-32.13.
printRetry: 1
# PRINT_JOB_RETENTION_DAYS: job log retention before purge, in days (1-365).
jobRetentionDays: 30
# PRINT_PURGE_TENANT_IDS: tenants whose job log is purged daily at 01:00 UTC. Empty
# disables the schedule; POST /print/v1/jobs:purge still works on demand.
purgeTenantIds: []
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor: { enabled: false, interval: 30s }
