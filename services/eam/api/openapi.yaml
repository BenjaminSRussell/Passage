openapi: 3.1.0
info:
  title: Passage EAM API
  version: 0.1.0
  description: Enterprise asset management (wave 44, slices 1-5). Errors are RFC 9457 problem details with a stable code.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
security: []
x-passage-slice: "PSG-44 slices 1-5; remaining deliverables are listed in NOT-IMPLEMENTED.md"
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200": { description: alive }
  /readyz:
    get:
      operationId: readyz
      responses:
        "200": { description: ready }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/eam/workspace:
    get:
      operationId: getWorkspace
      description: Asset management workspace tiles (8.44.6), counted at request time.
      x-passage-duty: eam.inquire
      responses:
        "200": { description: tiles, content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } } }
  /v1/eam/assets:
    get:
      operationId: listAssets
      x-passage-duty: eam.inquire
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: status, in: query, schema: { type: string, enum: [CREATED, ACTIVE, INACTIVE, DISPOSED] } }
      responses:
        "200": { description: page, content: { application/json: { schema: { $ref: "#/components/schemas/AssetPage" } } } }
        "400": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAsset
      x-passage-duty: eam.asset.maintain
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AssetIn" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/eam/assets/{id}:
    get:
      operationId: getAsset
      x-passage-duty: eam.inquire
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: asset, content: { application/json: { schema: { $ref: "#/components/schemas/AssetDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/eam/assets/{id}/activate:
    post:
      operationId: activateAsset
      x-passage-duty: eam.asset.maintain
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IfMatch" }]
      responses:
        "200": { description: active, content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/eam/assets/{id}/counters:
    post:
      operationId: createCounter
      x-passage-duty: eam.asset.maintain
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CounterIn" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Counter" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/eam/assets/{id}/lifecycle:
    post:
      operationId: changeAssetLifecycle
      description: >-
        Retires an asset (FR-44.2): ACTIVE to INACTIVE, INACTIVE or CREATED to DISPOSED. DISPOSED is final, and an
        asset with open work orders cannot be disposed (EAM-AST-001). Disposal removes the asset from its functional
        location (REMOVE in its location history). Use /activate to return an INACTIVE asset to ACTIVE.
      x-passage-duty: eam.asset.maintain
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LifecycleIn" } } }
      responses:
        "200": { description: changed, content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/eam/assets/{id}/criticality:
    get:
      operationId: listCriticalityAssessments
      description: The asset's criticality assessments, newest version first.
      x-passage-duty: eam.inquire
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: assessments
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/CriticalityAssessment" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: assessCriticality
      description: >-
        Records a new assessment version (FR-44.22). risk_score = max(consequences) x likelihood; criticality is 5 when
        risk >= 20 or SAFETY = 5, 4 when >= 15, 3 when >= 10, 2 when >= 5, else 1 (BR-44.15). The asset takes the new
        criticality and its version moves on; new CORRECTIVE orders default to priority 6 - criticality.
      x-passage-duty: eam.asset.maintain
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CriticalityIn" } } }
      responses:
        "201": { description: recorded (or replayed for a repeated Idempotency-Key), content: { application/json: { schema: { $ref: "#/components/schemas/CriticalityAssessment" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/eam/assets/{id}/warranties:
    get:
      operationId: listWarranties
      x-passage-duty: eam.inquire
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: warranties, newest start first
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Warranty" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createWarranty
      description: >-
        Records a vendor or manufacturer warranty (FR-44.17). Work orders created afterwards whose date (due date, or
        now) falls in [startsOn, endsOn) and whose job type is not excluded are flagged warrantyCovered (BR-44.14).
      x-passage-duty: eam.asset.maintain
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WarrantyIn" } } }
      responses:
        "201": { description: recorded (or replayed for a repeated Idempotency-Key), content: { application/json: { schema: { $ref: "#/components/schemas/Warranty" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/eam/fault-catalogs:
    get:
      operationId: listFaultCatalogs
      description: Every asset type that has a fault catalog, by type.
      x-passage-duty: eam.inquire
      responses:
        "200":
          description: catalogs
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/FaultCatalogSummary" } } } }
  /v1/eam/fault-catalogs/{assetType}:
    get:
      operationId: getFaultCatalog
      x-passage-duty: eam.inquire
      parameters: [{ $ref: "#/components/parameters/AssetType" }]
      responses:
        "200":
          description: catalog
          headers: { ETag: { description: the catalog version, quoted, schema: { type: string } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/FaultCatalog" } } }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: putFaultCatalog
      description: >-
        Replaces the asset type's fault catalog (FR-44.16). If-Match carries the version read with GET, "0" when the
        type has no catalog yet. Codes match ^[A-Z0-9_]{1,20}$ and are unique per kind; every allowed combination
        uses listed symptom, area and type codes.
      x-passage-duty: eam.plan.admin
      parameters: [{ $ref: "#/components/parameters/AssetType" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FaultCatalogIn" } } }
      responses:
        "200":
          description: stored
          headers: { ETag: { description: the new catalog version, quoted, schema: { type: string } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/FaultCatalog" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/eam/counters/{id}/rules:
    post:
      operationId: createRule
      x-passage-duty: eam.asset.maintain
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RuleIn" } } }
      responses:
        "201": { description: created (or replayed for a repeated Idempotency-Key), content: { application/json: { schema: { $ref: "#/components/schemas/Rule" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/eam/counters/{id}/readings:
    get:
      operationId: listReadings
      description: The counter's latest readings, newest first (8.44.14 Measurement documents).
      x-passage-duty: eam.inquire
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: readings
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Reading" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: recordReading
      description: >-
        Replays with the same Idempotency-Key or messageId return the stored reading (200, Idempotent-Replayed: true).
        A cumulative reading must not be below the reading before it in time, nor above the reading after it, unless
        reset is set (EAM-CTR-001). The counter's average daily usage is recomputed over the last 30 days.
      x-passage-duty: eam.counter.register
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReadingIn" } } }
      responses:
        "200": { description: replayed, content: { application/json: { schema: { $ref: "#/components/schemas/Reading" } } } }
        "201": { description: recorded, content: { application/json: { schema: { $ref: "#/components/schemas/Reading" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/plans:
    get:
      operationId: listPlans
      x-passage-duty: eam.inquire
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: asset, in: query, description: only plans with a line on this asset, schema: { type: string, format: uuid } }
      responses:
        "200": { description: page, content: { application/json: { schema: { $ref: "#/components/schemas/PlanPage" } } } }
    post:
      operationId: createPlan
      description: Creates a plan with its lines and schedules the lines at once (BR-44.1).
      x-passage-duty: eam.plan.admin
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlanIn" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/plans/schedule:
    post:
      operationId: schedulePlans
      description: Nightly sweep over every active plan line. Idempotent by construction (one open work order per line).
      x-passage-duty: eam.plan.admin
      responses:
        "200": { description: run, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleResult" } } } }
  /v1/eam/requests:
    get:
      operationId: listRequests
      x-passage-duty: eam.inquire
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: status, in: query, schema: { type: string, enum: [NEW, TRIAGED, CONVERTED, REJECTED, DEFERRED] } }
        - { name: asset, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: page, content: { application/json: { schema: { $ref: "#/components/schemas/RequestPage" } } } }
        "400": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createRequest
      x-passage-duty: eam.request.create
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RequestIn" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Request" } } } }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/eam/requests/{id}/convert:
    post:
      operationId: convertRequest
      x-passage-duty: eam.work.plan
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/ConvertIn" } } }
      responses:
        "201": { description: work order, content: { application/json: { schema: { $ref: "#/components/schemas/WorkOrder" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/requests/{id}/triage:
    post:
      operationId: triageRequest
      description: >-
        Applies a triage action (FR-44.6): TRIAGE (from NEW or DEFERRED), DEFER (from NEW or TRIAGED) or REJECT (from
        NEW, TRIAGED or DEFERRED). CONVERTED and REJECTED requests are final (EAM-REQ-001). Repeating the action a
        request already reflects changes nothing; a note replaces the triage note.
      x-passage-duty: eam.work.plan
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TriageIn" } } }
      responses:
        "200": { description: triaged, content: { application/json: { schema: { $ref: "#/components/schemas/Request" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/work-orders:
    get:
      operationId: listWorkOrders
      x-passage-duty: eam.inquire
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: status, in: query, schema: { type: string, enum: [CREATED, SCHEDULED, RELEASED, IN_PROGRESS, ON_HOLD, COMPLETED, CLOSED, CANCELED] } }
        - { name: asset, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: page, content: { application/json: { schema: { $ref: "#/components/schemas/WorkOrderPage" } } } }
        "400": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createWorkOrder
      description: >-
        The asset must be ACTIVE (EAM-AST-001). Without a priority, EMERGENCY gets 1, CORRECTIVE gets 6 - criticality
        (BR-44.15) and the other types 3. CAPITAL orders are rejected with EAM-WO-005 until a fixed asset or CIP
        project can be linked (wave 37).
      x-passage-duty: eam.work.plan
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkOrderIn" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/WorkOrder" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/work-orders/{id}:
    get:
      operationId: getWorkOrder
      x-passage-duty: eam.inquire
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: work order, content: { application/json: { schema: { $ref: "#/components/schemas/WorkOrderDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/eam/work-orders/{id}/status:
    post:
      operationId: transitionWorkOrder
      description: >-
        A repeated Idempotency-Key returns the work order as it is now, without a second transition. Completion of a
        CORRECTIVE or EMERGENCY order needs a registered fault (EAM-FLT-001); completing a warranty-covered order with
        a covered cost above zero emits dev.passage.eam.warranty.claimable.v1 (BR-44.14). A ROUND order completes only
        when every stop is DONE or SKIPPED (EAM-RND-001), and cannot start while a stop's job type requires a permit to
        work (EAM-PMT-001).
      x-passage-duty: eam.work.plan | eam.work-order.execute
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StatusIn" } } }
      responses:
        "200": { description: transitioned, content: { application/json: { schema: { $ref: "#/components/schemas/WorkOrder" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/eam/work-orders/{id}/labor:
    post:
      operationId: recordLabor
      x-passage-duty: eam.work-order.execute
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LaborIn" } } }
      responses:
        "201": { description: booked, content: { application/json: { schema: { $ref: "#/components/schemas/WorkOrder" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/work-orders/{id}/faults:
    post:
      operationId: registerFault
      description: >-
        Registers the fault on an open work order (FR-44.16). The symptom/area/type combination must be allowed for the
        asset's type and the cause and remedy must be catalog codes (EAM-FLT-002). A later registration supersedes the
        earlier one. CORRECTIVE and EMERGENCY orders cannot complete without one (EAM-FLT-001).
      x-passage-duty: eam.work-order.execute
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FaultIn" } } }
      responses:
        "201": { description: registered, content: { application/json: { schema: { $ref: "#/components/schemas/WorkOrderDetail" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/work-orders/{id}/downtime:
    post:
      operationId: recordDowntime
      description: >-
        Books a window of production resource downtime on an open work order (BR-44.5) and emits
        dev.passage.eam.downtime.recorded.v1 for wave-23 capacity. The window's whole minutes add to the order's
        downtime. resourceId defaults to the asset's production resource. Windows on one order must not overlap
        (EAM-DT-001). A completion's downtimeMinutes may not be below the recorded windows.
      x-passage-duty: eam.work.plan | eam.work-order.execute
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DowntimeIn" } } }
      responses:
        "201": { description: recorded, content: { application/json: { schema: { $ref: "#/components/schemas/WorkOrderDetail" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/kpis:
    get:
      operationId: getKpis
      x-passage-duty: eam.inquire
      parameters:
        - { name: asset, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200": { description: kpis, content: { application/json: { schema: { $ref: "#/components/schemas/Kpi" } } } }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/eam/permit-types:
    get:
      operationId: listPermitTypes
      x-passage-duty: eam.inquire
      responses:
        "200":
          description: permit types by code
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/PermitType" } } } }
    post:
      operationId: upsertPermitType
      x-passage-duty: eam.setup.admin
      description: Creates or replaces a permit type (FR-44.19). Saving the same definition again changes nothing.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PermitTypeIn" } } }
      responses:
        "200": { description: saved, content: { application/json: { schema: { $ref: "#/components/schemas/PermitType" } } } }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/eam/job-types/{jobType}/permits:
    get:
      operationId: getJobPermits
      x-passage-duty: eam.inquire
      description: The permit types a job type requires before its work orders may start (BR-44.11); empty when none.
      parameters:
        - { name: jobType, in: path, required: true, schema: { type: string, pattern: "^[A-Z0-9_]{2,20}$" } }
      responses:
        "200": { description: requirement, content: { application/json: { schema: { $ref: "#/components/schemas/JobPermits" } } } }
        "400": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setJobPermits
      x-passage-duty: eam.setup.admin
      description: Replaces the permit types a job type requires (BR-44.11). An empty list clears the requirement. Idempotent replace; no If-Match because the set is administered as a whole.
      parameters:
        - { name: jobType, in: path, required: true, schema: { type: string, pattern: "^[A-Z0-9_]{2,20}$" } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/JobPermitsIn" } } }
      responses:
        "200": { description: replaced, content: { application/json: { schema: { $ref: "#/components/schemas/JobPermits" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/eam/assets/{id}/isolation-points:
    get:
      operationId: listIsolationPoints
      x-passage-duty: eam.inquire
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: isolation points by tag code
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/IsolationPoint" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createIsolationPoint
      x-passage-duty: eam.setup.admin
      description: Adds an energy isolation point to the asset. The tag code is unique per asset (EAM-DUP-001).
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IsolationPointIn" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/IsolationPoint" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/eam/permits:
    get:
      operationId: listPermits
      x-passage-duty: eam.inquire
      description: Permit register (8.44.12), newest first.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/PermitStatus" } }
        - { name: asset, in: query, schema: { type: string, format: uuid } }
        - { name: workOrder, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: permits, content: { application/json: { schema: { $ref: "#/components/schemas/PermitPage" } } } }
        "400": { $ref: "#/components/responses/Problem" }
    post:
      operationId: requestPermit
      x-passage-duty: eam.work.plan
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      description: >-
        Opens a REQUESTED permit for an open work order (EAM-PMT-006 otherwise). The validity window must fit the
        permit type maximum (EAM-VAL-001). Only one permit of a type may be in force on a work order (EAM-DUP-001).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PermitIn" } } }
      responses:
        "201": { description: requested, content: { application/json: { schema: { $ref: "#/components/schemas/Permit" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/permits/expire:
    post:
      operationId: expirePermits
      x-passage-duty: eam.permit.issue
      description: >-
        The eam-permit-expiry job (8.44.20), run every 5 minutes: ISSUED permits past validTo move to SUSPENDED and are
        listed with EAM-PMT-004; workOrderInProgress flags jobs still running. Running it again suspends nothing more.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: permits suspended by this run
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ExpiredPermit" } } } }
  /v1/eam/permits/{id}:
    get:
      operationId: getPermit
      x-passage-duty: eam.inquire
      description: The permit with the asset's isolation points, its locks and its history. ETag is the permit version.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: permit with locks, content: { application/json: { schema: { $ref: "#/components/schemas/PermitDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/eam/permits/{id}/transition:
    post:
      operationId: transitionPermit
      x-passage-duty: eam.permit.issue
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/IfMatch" }]
      description: >-
        Approve, issue, suspend, close or cancel (BR-44.11). Approval needs an approver other than the requester
        (EAM-PMT-005). Issue needs the permit still valid (EAM-PMT-004) and, for an isolation permit, isolation points
        on the asset each with a verified lock (EAM-PMT-002) held by someone besides the issuer (EAM-PMT-005). Close
        and cancel need every lock removed (EAM-PMT-003); close needs the work order not IN_PROGRESS (EAM-PMT-008).
        A repeated Idempotency-Key returns the permit without a second transition.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PermitTransitionIn" } } }
      responses:
        "200": { description: transitioned, content: { application/json: { schema: { $ref: "#/components/schemas/Permit" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/eam/permits/{id}/locks:
    post:
      operationId: recordLock
      x-passage-duty: eam.work-order.execute
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      description: >-
        Applies, verifies (the zero-energy check) or removes the caller's own personal lock on an isolation point of
        the permit's asset (BR-44.11). One open lock per technician per point (EAM-PMT-007). Locks need an APPROVED,
        ISSUED or SUSPENDED permit (EAM-PMT-006). A repeated Idempotency-Key returns the lock as it is now.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LockIn" } } }
      responses:
        "200": { description: lock verified or removed, content: { application/json: { schema: { $ref: "#/components/schemas/LotoLock" } } } }
        "201": { description: lock applied, content: { application/json: { schema: { $ref: "#/components/schemas/LotoLock" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/functional-locations:
    get:
      operationId: listFunctionalLocations
      x-passage-duty: eam.inquire
      description: >-
        Functional locations (FR-44.1) in path order, so the plant structure reads top-down. site narrows to one site;
        under narrows to one location's subtree (the location included).
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: site, in: query, schema: { type: string, format: uuid } }
        - { name: under, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: page, content: { application/json: { schema: { $ref: "#/components/schemas/FunctionalLocationPage" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createFunctionalLocation
      x-passage-duty: eam.structure.maintain
      description: >-
        Adds a root location of a site, or a child of a parent in the same site (EAM-FL-002). Depth is at most 12
        (EAM-FL-001); the path (codes joined by "/") is unique per site (EAM-DUP-001).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FunctionalLocationIn" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/FunctionalLocation" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/functional-locations/{id}:
    get:
      operationId: getFunctionalLocation
      x-passage-duty: eam.inquire
      description: The location with its direct children and the assets installed at it.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: location, content: { application/json: { schema: { $ref: "#/components/schemas/LocationDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/eam/assets/{id}/location:
    post:
      operationId: placeAsset
      x-passage-duty: eam.structure.maintain
      description: >-
        Installs, moves or removes (functionalLocationId null) the asset and appends the change to its location history
        (FR-44.2). The location must be in the asset's site and differ from the current one (EAM-FL-002); a DISPOSED
        asset cannot be placed (EAM-AST-001). The asset version moves on. A repeated Idempotency-Key returns the asset.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlacementIn" } } }
      responses:
        "200": { description: placed, content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/eam/assets/{id}/location-history:
    get:
      operationId: listAssetLocationHistory
      x-passage-duty: eam.inquire
      description: The asset's install, move and remove history, newest first.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: history
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/LocationHistory" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/eam/sequences:
    get:
      operationId: listSequences
      x-passage-duty: eam.inquire
      description: Maintenance sequences (FR-44.15), newest first; asset narrows to one asset's sequences.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: asset, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: page, content: { application/json: { schema: { $ref: "#/components/schemas/SequencePage" } } } }
        "400": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSequence
      x-passage-duty: eam.plan.admin
      description: >-
        Defines a maintenance sequence on one asset or one asset type, over a base interval in a time unit or on a
        counter of the asset. Steps need unique codes and hierarchies, multiples of 1 to 1000, and may include only
        lower-hierarchy steps (EAM-SEQ-001). The code is unique (EAM-DUP-001).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SequenceIn" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/MaintenanceSequence" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/sequences/{id}:
    get:
      operationId: getSequence
      x-passage-duty: eam.inquire
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: sequence, content: { application/json: { schema: { $ref: "#/components/schemas/MaintenanceSequence" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/eam/sequences/{id}/simulation:
    get:
      operationId: simulateSequence
      x-passage-duty: eam.inquire
      description: The next occurrences after lastOccurrenceNumber with the steps BR-44.10 selects, generating nothing.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: occurrences, in: query, schema: { type: integer, minimum: 1, maximum: 120, default: 12 } }
      responses:
        "200":
          description: simulated occurrences
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/SimulatedOccurrence" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/eam/sequences/{id}/occurrences:
    get:
      operationId: listSequenceOccurrences
      x-passage-duty: eam.inquire
      description: Generated occurrences, newest first.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: occurrences
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/SequenceOccurrence" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: generateSequenceOccurrence
      x-passage-duty: eam.plan.admin
      description: >-
        Generates occurrence lastOccurrenceNumber + 1 of an asset sequence (BR-44.10) and opens a PREVENTIVE work
        order (event workorder.created) for the selected step's job type; extra due steps are listed in jobTypes. The
        asset must be ACTIVE (EAM-AST-001) and the previous occurrence's order completed, closed or canceled
        (EAM-SEQ-002); asset type sequences are templates (EAM-SEQ-001). A repeated Idempotency-Key returns the
        stored occurrence.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/OccurrenceIn" } } }
      responses:
        "201": { description: generated, content: { application/json: { schema: { $ref: "#/components/schemas/SequenceOccurrence" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/rounds:
    get:
      operationId: listRounds
      x-passage-duty: eam.inquire
      description: Maintenance rounds (FR-44.14), newest first, each with its stops.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: page, content: { application/json: { schema: { $ref: "#/components/schemas/RoundPage" } } } }
        "400": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createRound
      x-passage-duty: eam.plan.admin
      description: >-
        Defines a round: 1 to 50 stops numbered 1..n in order, each an asset of the round's site with a job type code,
        a mandatory flag and the travel minutes from the previous stop (EAM-RND-003). A stop job type that requires a
        permit to work is refused (EAM-RND-003): a round work order cannot carry one permit per stop. The code is
        unique (EAM-DUP-001). A repeated Idempotency-Key returns the stored round. Schedule it with a ROUND plan line.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoundIn" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/MaintenanceRound" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/rounds/{id}:
    get:
      operationId: getRound
      x-passage-duty: eam.inquire
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: round, content: { application/json: { schema: { $ref: "#/components/schemas/MaintenanceRound" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/eam/rounds/{id}/work-orders:
    post:
      operationId: createRoundWorkOrder
      x-passage-duty: eam.work.plan
      description: >-
        Opens a ROUND work order for one extra occurrence of the round (ROUND plan lines generate the scheduled ones):
        booked on the first stop's asset, with every stop copied in stop order (BR-44.9), event workorder.created.
        Every stop asset must be ACTIVE (EAM-AST-001). A repeated Idempotency-Key returns the same order.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/OccurrenceIn" } } }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/WorkOrder" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/work-orders/{id}/stops/{seq}:
    post:
      operationId: recordStopOutcome
      x-passage-duty: eam.work-order.execute
      description: >-
        Records one stop of an IN_PROGRESS ROUND work order as DONE or SKIPPED, once (EAM-RND-002). SKIPPED needs a
        reason; a skipped mandatory stop raises a maintenance request with source ROUND for the stop's asset (event
        request.created) in the same transaction (BR-44.9). The order completes only when every stop has an outcome
        (EAM-RND-001 on the status transition). A repeated Idempotency-Key returns the stop as recorded.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: seq, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StopOutcomeIn" } } }
      responses:
        "200": { description: recorded, content: { application/json: { schema: { $ref: "#/components/schemas/WorkOrderStop" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/eam/work-orders/emergency-overdue:
    get:
      operationId: listEmergencyOverdue
      x-passage-duty: eam.inquire
      description: >-
        Emergency regularization (BR-44.7): open priority 1 work orders that were never SCHEDULED or RELEASED and
        were created at least the window ago, oldest first, each with the warning EAM-WO-003.
      parameters:
        - { name: hours, in: query, schema: { type: integer, minimum: 1, maximum: 72, default: 24 } }
      responses:
        "200":
          description: overdue orders
          content:
            application/json:
              schema:
                type: object
                required: [items, windowHours]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RegularizationAlert" } }
                  windowHours: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/eam/assets/plan-reviews:
    get:
      operationId: listPlanReviews
      x-passage-duty: eam.inquire
      description: >-
        Plan review reminder (BR-44.15): assets of criticality 4 or 5, not disposed, never assessed or last assessed
        12 months ago or more, most overdue first.
      responses:
        "200":
          description: assets due for review
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/PlanReview" } } } }
  /v1/eam/kpis/cost:
    get:
      operationId: getCostByAsset
      x-passage-duty: eam.inquire
      description: Parts, labor and total cost of the work orders completed in [from, to), per asset and currency, highest first (FR-44.13).
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: assetType, in: query, schema: { type: string, pattern: "^[A-Z0-9_]{2,20}$" } }
      responses:
        "200":
          description: cost per asset
          content:
            application/json:
              schema:
                type: object
                required: [items, from, to]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AssetCost" } }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/eam/kpis/backlog:
    get:
      operationId: getBacklog
      x-passage-duty: eam.inquire
      description: Open work orders per priority with the overdue count and the oldest due date (FR-44.13), optionally on one site.
      parameters:
        - { name: site, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: backlog per priority
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/BacklogRow" } } } }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/eam/assets/{id}/legal-entity:
    put:
      operationId: setAssetLegalEntity
      x-passage-duty: eam.asset.maintain
      description: |
        Gives an asset without a legal entity the one named in the body, which must be in the caller's scope. Set once: the same entity again is a no-op and
        another entity is EAM-GL-005 (409). The asset's work orders without an entity take it too, so their cost can be booked. New assets take the creating
        caller's single entity scope, or the legalEntityId of the create request (required for a caller with several entities or the all-entity scope).
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId]
              properties:
                legalEntityId: { type: string, format: uuid }
      responses:
        "200": { description: the asset, content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/eam/posting-profiles:
    get:
      operationId: listPostingProfiles
      x-passage-duty: eam.inquire
      description: |
        The posting profiles of a legal entity (default the caller's) and the built-in placeholder profile that applies when a legal
        entity has none (accounts 6500, 6510, 1400 and 6590, to be replaced by the accountant).
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: profiles and the placeholder
          content:
            application/json:
              schema:
                type: object
                required: [items, placeholder]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PostingProfile" } }
                  placeholder: { $ref: "#/components/schemas/PostingProfile" }
        "400": { $ref: "#/components/responses/Problem" }
    put:
      operationId: savePostingProfile
      x-passage-duty: eam.setup.admin
      description: |
        Creates (no If-Match) or replaces (If-Match with the version) the profile of a legal entity and work order type; ALL is the
        wildcard. The response carries the new version as its ETag. Work order cost is booked as parts expense / parts offset and labor expense / labor offset.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostingProfileInput" }
      responses:
        "200": { description: replaced, content: { application/json: { schema: { $ref: "#/components/schemas/PostingProfile" } } } }
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/PostingProfile" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/eam/gl-postings:
    post:
      operationId: postWorkOrderCostsToGL
      x-passage-duty: eam.gl.post
      description: |
        Books the parts and labor cost of completed and closed work orders of one currency (optionally one site or one work order) in the
        general ledger: one balanced entry per order for the cost not yet booked, keyed by order and booking number so a retry returns the same
        entry. A cost that changed after booking is booked as a delta. An order the ledger refuses (a closed period, for one) is listed under
        failed with the ledger's problem code and is retried by the next run. At most 200 orders per run (more is true when others wait).
        legalEntityId defaults to the caller's entity and must be in the caller's scope. A work order takes its legal entity from its asset when it is
        created (the asset takes the creating caller's single entity scope; creating an order for an asset without one is refused with EAM-GL-004), and only
        orders of that entity are booked. Each booking is stored as a pending booking before the ledger is called and resent unchanged until the ledger confirms
        it; a rejection other than a closed period drops it so the next run rebuilds it from the current profile. Signs only ledger.entry.post.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ledgerId, currency]
              properties:
                legalEntityId: { type: string, format: uuid }
                ledgerId: { type: string, format: uuid }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
                siteId: { type: string, format: uuid }
                workOrderId: { type: string, format: uuid }
      responses:
        "200":
          description: what was booked and what the ledger refused
          content:
            application/json:
              schema:
                type: object
                required: [booked, failed, more]
                properties:
                  booked:
                    type: array
                    items:
                      type: object
                      properties:
                        workOrder: { type: string }
                        entryId: { type: string, format: uuid }
                        lines: { type: integer }
                        placeholderProfile: { type: boolean, description: True when the entry used the built-in placeholder accounts. }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        workOrder: { type: string }
                        code: { type: string, description: "The ledger's problem code, or EAM-GL-001." }
                  more: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/eam/gl-reconciliation:
    get:
      operationId: getGLReconciliation
      x-passage-duty: eam.inquire
      description: |
        Per account the service booked on (up to periodTo, YYYY-MM): the net of its GL subledger, the general ledger's balance of the
        account and the difference (GL minus subledger). unbookedWorkOrders counts (and numbers the first 100 of) the entity's completed or closed orders whose cost
        is not fully booked; workOrdersWithoutEntity does the same for orders with no legal entity, which no ledger receives. reconciled is true when every
        difference is zero and both lists are empty.
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: ledgerId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: currency, in: query, required: true, schema: { type: string, pattern: "^[A-Z]{3}$" } }
        - { name: periodTo, in: query, schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" } }
      responses:
        "200":
          description: the reconciliation
          content:
            application/json:
              schema:
                type: object
                required: [currency, reconciled, accounts]
                properties:
                  currency: { type: string }
                  reconciled: { type: boolean }
                  unbookedWorkOrders: { $ref: "#/components/schemas/OrderList" }
                  workOrdersWithoutEntity: { $ref: "#/components/schemas/OrderList" }
                  assetsWithoutEntity: { $ref: "#/components/schemas/OrderList" }
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        account: { type: string }
                        subledger: { type: string }
                        gl: { type: string }
                        difference: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: nextCursor of the previous page.
      schema: { type: string, format: uuid }
    AssetType:
      name: assetType
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Z0-9_]{2,20}$" }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Expected aggregate version, quoted (for example "3").
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    OrderList:
      type: object
      properties:
        count: { type: integer }
        numbers: { type: array, items: { type: string } }
    PostingProfileInput:
      type: object
      required: [partsExpenseAccount, laborExpenseAccount, partsOffsetAccount, laborOffsetAccount]
      properties:
        legalEntityId: { type: string, format: uuid }
        workOrderType: { type: string, default: ALL }
        partsExpenseAccount: { type: string, maxLength: 40 }
        laborExpenseAccount: { type: string, maxLength: 40 }
        partsOffsetAccount: { type: string, maxLength: 40 }
        laborOffsetAccount: { type: string, maxLength: 40 }
    PostingProfile:
      type: object
      properties:
        legalEntityId: { type: string }
        workOrderType: { type: string }
        partsExpenseAccount: { type: string }
        laborExpenseAccount: { type: string }
        partsOffsetAccount: { type: string }
        laborOffsetAccount: { type: string }
        version: { type: integer }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        placeholder: { type: boolean }
    RoundStop:
      type: object
      required: [sequence, assetId, jobType]
      properties:
        sequence: { type: integer, minimum: 1, maximum: 50 }
        assetId: { type: string, format: uuid }
        jobType: { type: string, pattern: "^[A-Z0-9_]{2,20}$" }
        mandatory: { type: boolean, default: false, description: a SKIPPED mandatory stop raises a ROUND request }
        travelMinutes: { type: integer, minimum: 0, maximum: 480, default: 0, description: from the previous stop }
    RoundIn:
      type: object
      required: [code, name, siteId, stops]
      properties:
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,29}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        siteId: { type: string, format: uuid }
        stops: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/RoundStop" } }
    MaintenanceRound:
      type: object
      required: [id, code, name, siteId, active, stops, travelMinutes, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        siteId: { type: string, format: uuid }
        active: { type: boolean }
        stops: { type: array, items: { $ref: "#/components/schemas/RoundStop" } }
        travelMinutes: { type: integer, description: total travel between stops }
        createdAt: { type: string, format: date-time }
    RoundPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MaintenanceRound" } }
        nextCursor: { type: string, format: uuid }
    StopOutcomeIn:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [DONE, SKIPPED] }
        reason: { type: string, maxLength: 120, description: required for SKIPPED; an optional remark for DONE }
    WorkOrderStop:
      type: object
      required: [sequence, assetId, jobType, mandatory, travelMinutes]
      properties:
        sequence: { type: integer }
        assetId: { type: string, format: uuid }
        jobType: { type: string }
        mandatory: { type: boolean }
        travelMinutes: { type: integer }
        outcome: { type: string, enum: [DONE, SKIPPED], description: absent until recorded }
        reason: { type: string }
        requestId: { type: string, format: uuid, description: the ROUND request a skipped mandatory stop raised }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
    RegularizationAlert:
      allOf:
        - $ref: "#/components/schemas/WorkOrder"
        - type: object
          required: [code, detail]
          properties:
            code: { type: string, enum: [EAM-WO-003] }
            detail: { type: string }
    PlanReview:
      type: object
      required: [assetId, assetNumber, name, criticality]
      properties:
        assetId: { type: string, format: uuid }
        assetNumber: { type: string }
        name: { type: string }
        criticality: { type: integer, minimum: 4, maximum: 5 }
        lastReviewedAt: { type: string, format: date-time, description: the latest criticality assessment; absent when never assessed }
        dueAt: { type: string, format: date-time }
    AssetCost:
      type: object
      required: [assetId, assetNumber, name, assetType, currency, workOrders, partsCost, laborCost, total]
      properties:
        assetId: { type: string, format: uuid }
        assetNumber: { type: string }
        name: { type: string }
        assetType: { type: string }
        currency: { type: string }
        workOrders: { type: integer }
        partsCost: { type: string, description: decimal string, two places }
        laborCost: { type: string, description: decimal string, two places }
        total: { type: string, description: decimal string, two places }
    BacklogRow:
      type: object
      required: [priority, openCount, overdueCount]
      properties:
        priority: { type: integer, minimum: 1, maximum: 5 }
        openCount: { type: integer }
        overdueCount: { type: integer }
        oldestDueAt: { type: string, format: date-time }
    FunctionalLocationIn:
      type: object
      required: [code, name, siteId]
      properties:
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9_.-]{0,39}$", description: one path segment }
        name: { type: string, minLength: 1, maxLength: 120 }
        siteId: { type: string, format: uuid }
        parentId: { type: [string, "null"], format: uuid, description: omitted for a root location }
        locationType: { type: [string, "null"], pattern: "^[A-Z0-9_]{2,20}$" }
    FunctionalLocation:
      type: object
      required: [id, code, name, siteId, depth, path, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        siteId: { type: string, format: uuid }
        parentId: { type: string, format: uuid }
        locationType: { type: string }
        depth: { type: integer, minimum: 1, maximum: 12 }
        path: { type: string, description: codes from the root joined by "/" }
        createdAt: { type: string, format: date-time }
    FunctionalLocationPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FunctionalLocation" } }
        nextCursor: { type: string, format: uuid }
    LocationDetail:
      allOf:
        - $ref: "#/components/schemas/FunctionalLocation"
        - type: object
          properties:
            children: { type: array, items: { $ref: "#/components/schemas/FunctionalLocation" } }
            assets: { type: array, items: { $ref: "#/components/schemas/Asset" } }
    PlacementIn:
      type: object
      required: [functionalLocationId]
      properties:
        functionalLocationId: { type: [string, "null"], format: uuid, description: null removes the asset from its location }
    LocationHistory:
      type: object
      required: [id, assetId, action, actor, at]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        action: { type: string, enum: [INSTALL, MOVE, REMOVE] }
        fromLocationId: { type: string, format: uuid }
        fromPath: { type: string }
        toLocationId: { type: string, format: uuid }
        toPath: { type: string }
        actor: { type: string }
        at: { type: string, format: date-time }
    SequenceStep:
      type: object
      required: [code, jobType, multiple, hierarchy]
      properties:
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{0,19}$" }
        jobType: { type: string, pattern: "^[A-Z0-9_]{2,20}$" }
        multiple: { type: integer, minimum: 1, maximum: 1000, description: due on every occurrence k with k mod multiple = 0 }
        hierarchy: { type: integer, minimum: 1, maximum: 32767, description: the highest due hierarchy is performed }
        includes: { type: array, items: { type: string }, description: lower-hierarchy step codes this step covers }
    SequenceIn:
      type: object
      required: [code, name, baseIntervalValue, steps]
      description: Exactly one of assetId and assetType, and exactly one of baseIntervalUnit and counterId (counter needs assetId).
      properties:
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,29}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        assetId: { type: string, format: uuid }
        assetType: { type: string, pattern: "^[A-Z0-9_]{2,20}$" }
        baseIntervalValue: { type: integer, minimum: 1, maximum: 100000 }
        baseIntervalUnit: { type: string, enum: [DAYS, WEEKS, MONTHS, YEARS] }
        counterId: { type: string, format: uuid }
        steps: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/SequenceStep" } }
    MaintenanceSequence:
      type: object
      required: [id, code, name, baseIntervalValue, steps, lastOccurrenceNumber, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        assetId: { type: string, format: uuid }
        assetType: { type: string }
        baseIntervalValue: { type: integer }
        baseIntervalUnit: { type: string, enum: [DAYS, WEEKS, MONTHS, YEARS] }
        counterId: { type: string, format: uuid }
        steps: { type: array, items: { $ref: "#/components/schemas/SequenceStep" } }
        lastOccurrenceNumber: { type: integer, minimum: 0 }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    SequencePage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MaintenanceSequence" } }
        nextCursor: { type: string, format: uuid }
    SimulatedOccurrence:
      type: object
      properties:
        occurrenceNumber: { type: integer, minimum: 1 }
        stepCodes: { type: array, items: { type: string }, description: selected step first, then extra due steps }
        jobTypes: { type: array, items: { type: string } }
    OccurrenceIn:
      type: object
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$", default: USD, description: the work order currency }
        dueAt: { type: string, format: date-time }
    SequenceOccurrence:
      type: object
      required: [id, sequenceId, occurrenceNumber, stepCodes, jobTypes, actor, createdAt]
      properties:
        id: { type: string, format: uuid }
        sequenceId: { type: string, format: uuid }
        occurrenceNumber: { type: integer, minimum: 1 }
        stepCodes: { type: array, items: { type: string } }
        jobTypes: { type: array, items: { type: string } }
        workOrderId: { type: string, format: uuid, description: absent when no step is due on the occurrence }
        actor: { type: string }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "https://passage.dev/problems/EAM-CTR-001" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        serviceCode: { type: string }
        traceId: { type: string }
        errors: { type: array, items: { type: object } }
    AssetIn:
      type: object
      required: [name, assetType, siteId, criticality]
      properties:
        name: { type: string, maxLength: 120 }
        assetType: { type: string, pattern: "^[A-Z0-9_]{2,20}$" }
        siteId: { type: string, format: uuid }
        criticality: { type: integer, minimum: 1, maximum: 5 }
        productionResourceId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's single legal entity scope; required for a caller with several entities or the all-entity scope. }
    Asset:
