asyncapi: 3.0.0
info:
  title: Passage EAM events
  version: 0.1.0
  description: CloudEvents published through the transactional outbox (Debezium relay). Budget events arrive in later slices.
defaultContentType: application/cloudevents+json
channels:
  requestCreated:
    address: passage.eam.request
    messages:
      requestCreated:
        $ref: "#/components/messages/RequestCreated"
  workOrderCreated:
    address: passage.eam.workorder
    messages:
      workOrderCreated:
        $ref: "#/components/messages/WorkOrderCreated"
  workOrderCompleted:
    address: passage.eam.workorder
    messages:
      workOrderCompleted:
        $ref: "#/components/messages/WorkOrderCompleted"
  workOrderStatusChanged:
    address: passage.eam.workorderstatus
    messages:
      workOrderStatusChanged:
        $ref: "#/components/messages/WorkOrderStatusChanged"
  counterReadingRegistered:
    address: passage.eam.counterreading
    messages:
      counterReadingRegistered:
        $ref: "#/components/messages/CounterReadingRegistered"
  downtimeRecorded:
    address: passage.eam.downtime
    messages:
      downtimeRecorded:
        $ref: "#/components/messages/DowntimeRecorded"
  requestTriaged:
    address: passage.eam.request
    messages:
      requestTriaged:
        $ref: "#/components/messages/RequestTriaged"
  warrantyClaimable:
    address: passage.eam.warranty
    messages:
      warrantyClaimable:
        $ref: "#/components/messages/WarrantyClaimable"
  permitStatusChanged:
    address: passage.eam.permitstatus
    messages:
      permitStatusChanged:
        $ref: "#/components/messages/PermitStatusChanged"
operations:
  publishPermitStatusChanged:
    action: send
    channel: { $ref: "#/channels/permitStatusChanged" }
  publishRequestCreated:
    action: send
    channel: { $ref: "#/channels/requestCreated" }
  publishWorkOrderCreated:
    action: send
    channel: { $ref: "#/channels/workOrderCreated" }
  publishWorkOrderCompleted:
    action: send
    channel: { $ref: "#/channels/workOrderCompleted" }
  publishWorkOrderStatusChanged:
    action: send
    channel: { $ref: "#/channels/workOrderStatusChanged" }
  publishCounterReadingRegistered:
    action: send
    channel: { $ref: "#/channels/counterReadingRegistered" }
  publishDowntimeRecorded:
    action: send
    channel: { $ref: "#/channels/downtimeRecorded" }
  publishRequestTriaged:
    action: send
    channel: { $ref: "#/channels/requestTriaged" }
  publishWarrantyClaimable:
    action: send
    channel: { $ref: "#/channels/warrantyClaimable" }
components:
  messages:
    DowntimeRecorded:
      name: dev.passage.eam.downtime.recorded.v1
      payload:
        $ref: "#/components/schemas/DowntimeRecorded"
    RequestTriaged:
      name: dev.passage.eam.request.triaged.v1
      payload:
        $ref: "#/components/schemas/RequestTriaged"
    WarrantyClaimable:
      name: dev.passage.eam.warranty.claimable.v1
      payload:
        $ref: "#/components/schemas/WarrantyClaimable"
    PermitStatusChanged:
      name: dev.passage.eam.permitstatus.changed.v1
      payload:
        $ref: "#/components/schemas/PermitStatusChanged"
    RequestCreated:
      name: dev.passage.eam.request.created.v1
      payload:
        $ref: "#/components/schemas/RequestCreated"
    WorkOrderCreated:
      name: dev.passage.eam.workorder.created.v1
      payload:
        $ref: "#/components/schemas/WorkOrderCreated"
    WorkOrderCompleted:
      name: dev.passage.eam.workorder.completed.v1
      payload:
        $ref: "#/components/schemas/WorkOrderCompleted"
    WorkOrderStatusChanged:
      name: dev.passage.eam.workorderstatus.changed.v1
      payload:
        $ref: "#/components/schemas/WorkOrderStatusChanged"
    CounterReadingRegistered:
      name: dev.passage.eam.counterreading.registered.v1
      payload:
        $ref: "#/components/schemas/CounterReadingRegistered"
  schemas:
    RequestCreated:
      type: object
      required: [requestId, assetId, source, severity]
      properties:
        requestId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        source: { type: string, enum: [USER, MOBILE, IOT, QUALITY, ROUND] }
        severity: { type: integer, minimum: 1, maximum: 5 }
        dedupeKey: { type: string }
    WorkOrderCreated:
      type: object
      required: [workOrderId, assetId, type]
      properties:
        workOrderId: { type: string, format: uuid }
        assetId: { type: string, format: uuid, description: for a ROUND order the first stop's asset }
        type: { type: string, enum: [PREVENTIVE, CORRECTIVE, INSPECTION, EMERGENCY, CAPITAL, ROUND] }
        planLineId: { type: string, format: uuid }
    WorkOrderCompleted:
      type: object
      required: [workOrderId, assetId, currency, partsCost, laborCost, downtimeMinutes, completedAt]
      properties:
        workOrderId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        currency: { type: string }
        partsCost: { type: string }
        laborCost: { type: string }
        downtimeMinutes: { type: integer }
        completedAt: { type: string, format: date-time }
    WorkOrderStatusChanged:
      type: object
      required: [workOrderId, from, to, at]
      properties:
        workOrderId: { type: string, format: uuid }
        from: { type: string }
        to: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string, description: user who made the transition }
    CounterReadingRegistered:
      type: object
      required: [counterId, assetId, value, at, source]
      properties:
        counterId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        value: { type: number }
        at: { type: string, format: date-time }
        source: { type: string, enum: [MANUAL, IOT] }
    DowntimeRecorded:
      type: object
      description: A production resource stop booked on a work order (BR-44.5); wave 23 makes it a capacity exception for [from, to).
      required: [downtimeId, resourceId, workOrderId, assetId, from, to, minutes]
      properties:
        downtimeId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        workOrderId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        minutes: { type: integer, minimum: 1 }
    RequestTriaged:
      type: object
      description: A triage action on a maintenance request (FR-44.6).
      required: [requestId, assetId, action, from, to, at]
      properties:
        requestId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        action: { type: string, enum: [TRIAGE, REJECT, DEFER] }
        from: { type: string, enum: [NEW, TRIAGED, DEFERRED] }
        to: { type: string, enum: [TRIAGED, REJECTED, DEFERRED] }
        at: { type: string, format: date-time }
        actor: { type: string }
    WarrantyClaimable:
      type: object
      description: A warranty-covered work order completed with a covered amount above zero (BR-44.14); consumed by wave 45 supplier claims (FR-45.15).
      required: [workOrderId, assetId, warrantyId, vendorPartyId, currency, coveredParts, coveredLabor]
      properties:
        workOrderId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        warrantyId: { type: string, format: uuid }
        vendorPartyId: { type: string, format: uuid }
        currency: { type: string }
        coveredParts: { type: string, description: decimal string }
        coveredLabor: { type: string, description: decimal string }
    PermitStatusChanged:
      type: object
      required: [permitId, workOrderId, from, to, at, actor]
      description: Emitted on every permit transition, including the initial REQUESTED state (from is empty then). No personal data beyond the acting user id.
      properties:
        permitId: { type: string, format: uuid }
        workOrderId: { type: string, format: uuid }
        from: { type: string, enum: ["", REQUESTED, APPROVED, ISSUED, SUSPENDED, CLOSED, CANCELED] }
        to: { type: string, enum: [REQUESTED, APPROVED, ISSUED, SUSPENDED, CLOSED, CANCELED] }
        at: { type: string, format: date-time }
        actor: { type: string }
