apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-assets
  labels:
    app.kubernetes.io/name: assets
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: assets
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
