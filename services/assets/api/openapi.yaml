  /v1/assets/insurance-report:
    get:
      summary: Insurance report of a legal entity (7.37.14)
      description: |
        Policies in force on asOf (coverageFrom <= asOf <= coverageTo), ordered
        by asset number and policy number, with the sum insured, the indexed
        replacement value, the NBV of every Open book of the asset and the
        under-insured flag (sum insured below 90% of the indexed value,
        AST-0532). expiringSoon marks cover that ends within 30 days of asOf.
      operationId: insuranceReport
      x-passage-duty: AssetView or AssetInsuranceMaintain
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, description: "Report date; default today (UTC)", schema: { type: string, format: date } }
        - { name: insuranceType, in: query, schema: { type: string, enum: [Property, MachineryBreakdown, Transit, Fleet] } }
        - { name: expiringWithinDays, in: query, description: "Only cover ending within this many days of asOf", schema: { type: integer, minimum: 0, maximum: 366 } }
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of the report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsuranceReport"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/assets/mid-quarter-test:
    get:
      summary: Run the mid-quarter test for one tax book and year (BR-37.5)
      description: |
        The mid-quarter-test job (7.37.16) run on demand. Adds the current cost
        of every book with bookCode placed in service in the year (a calendar
        year) by quarter, leaving out books placed in service and fully disposed
        of in that year. When the Q4 basis is more than 40% of the year's basis,
        applies is true with the AST-0511 warning. review lists (up to 500 of
        reviewCount) the books whose convention does not follow the result: a
        DecliningBalance book not on MidQuarter when the test applies, or a
        MidQuarter book when it does not. Nothing is switched or posted. Books
        in more than one currency are 422 AST-0029.
      operationId: midQuarterTest
      x-passage-duty: AssetView or AssetDepreciate
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: bookCode, in: query, required: true, schema: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{0,19}$" } }
        - { name: year, in: query, required: true, schema: { type: integer, minimum: 1900, maximum: 2200 } }
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MidQuarterReport"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/assets/{id}/dispose:
    post:
      summary: Dispose (sale or scrap) a percentage of the asset on every Open book
      description: |
        Each Open book records its own DisposalSale or DisposalScrap transaction
        with the disposed share of cost and accumulated depreciation (rounded
        once; residual cents stay on the asset, BR-37.7) and its own gain or loss
        against the proceeds. 100% closes the asset and its books as Sold or
        Scrapped (BR-37.2). Requires If-Match with the asset ETag.
      operationId: disposeAsset
      x-passage-duty: AssetDispose
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/IdempotencyKey"
