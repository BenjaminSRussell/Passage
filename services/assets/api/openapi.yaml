openapi: 3.1.0
info:
  title: Passage Assets (fixed assets and leases)
  version: 1.0.0
  description: |
    Wave 37 slices 1 to 3. Asset register, depreciation books, the schedule
    preview, asset transactions and adjustments (acquisition and depreciation
    adjustments, revaluation, impairment), additions and components,
    depreciation runs (propose and post), disposals, insurance policies with
    insured-value index series and the insurance report, physical inventory
    count sessions, capital appropriation (capex) requests, and IFRS 16 lease
    recognition and remeasurement. Money and
    rates are decimal strings; calendar dates are YYYY-MM-DD. Errors are
    RFC 9457 problem details with a stable `code` (see README). Every command
    takes an Idempotency-Key: a retry with the same key and body replays the
    first response, the same key with another body is 422
    `idempotency_key_reuse`. Browser calls use /api/v1/..., which the web BFF
    rewrites to these /v1/... paths.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /readyz:
    get:
      summary: Readiness (own Postgres reachable)
      operationId: ready
      x-passage-duty: none
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ready] }
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [unavailable] }
  /v1/assets:
    get:
      summary: Asset register, ordered by asset number
      operationId: listAssets
      x-passage-duty: AssetView
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AssetStatus" } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetPage"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      summary: Create an asset in the register (status NotYetAcquired)
      operationId: createAsset
      x-passage-duty: AssetMaintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: Asset created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/assets/{id}:
    get:
      summary: Read an asset with its books
      operationId: getAsset
      x-passage-duty: AssetView
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: The asset
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/assets/{id}/books:
    post:
      summary: Attach a depreciation book; posts the acquisition transaction
      description: At most 10 books per asset (AST-0013). The asset moves from NotYetAcquired to Open.
      operationId: addAssetBook
      x-passage-duty: AssetMaintain
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBookRequest"
      responses:
        "201":
          description: Book attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/assets/{id}/schedule:
    get:
      summary: Projected depreciation schedule for one book (computed on read)
      description: A Sold or Scrapped book has no lines.
      operationId: getAssetSchedule
      x-passage-duty: AssetView
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - name: book
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Schedule lines, amounts in the book currency's minor unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/assets/{id}/transactions:
    get:
      summary: Every transaction on every book of the asset, oldest first
      operationId: listAssetTransactions
      x-passage-duty: AssetView
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Transaction" }
        "404":
          $ref: "#/components/responses/Problem"
    post:
      summary: Post an adjustment, revaluation or impairment on one Open book
      description: |
        AcquisitionAdj and Revaluation change cost; DepreciationAdj changes
        accumulated depreciation; Impairment is a write-down when positive and a
        reversal when negative. Every kind keeps 0 <= accumulated <= cost. A
        reversal is capped at the impairment still recorded and at the carrying
        amount the book would have had without impairment (FR-37.9); a capped
        reversal answers with limited = true and an AST-0512 warning. Sold or
        Scrapped assets and books are refused (AST-0509). Later depreciation
        runs spread the new depreciable basis over the remaining periods
        (BR-37.4). Emits dev.passage.assets.asset.adjusted.v1.
      operationId: adjustAssetBook
      x-passage-duty: AssetPostJournal
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustRequest"
      responses:
        "201":
          description: Adjustment posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustResult"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/assets/{id}/additions:
    get:
      summary: Additions and components of the asset, oldest first
      operationId: listAssetAdditions
      x-passage-duty: AssetView
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Additions with the transactions each posted
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Addition" }
        "404":
          $ref: "#/components/responses/Problem"
    post:
      summary: Record an improvement, component or accessory (FR-37.14)
      description: |
        A financial addition posts an AcquisitionAdj of its cost on the
        selected Open books (bookIds), or on every Open book when bookIds is
        omitted, in the same transaction (AC-37.12); the books must be in the
        addition's currency. A non-financial addition is descriptive only and
        may be recorded before the asset is acquired. At most 500 additions per
        asset (AST-0020).
      operationId: addAssetAddition
      x-passage-duty: AssetMaintain
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdditionRequest"
      responses:
        "201":
          description: Addition recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Addition"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/assets/{id}/insurance-policies:
    get:
      summary: Insurance policies of the asset, ordered by coverage start
      operationId: listInsurancePolicies
      x-passage-duty: AssetView or AssetInsuranceMaintain
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Policies with indexed value and under-insured flag
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InsurancePolicy" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      summary: Record an insurance policy on an asset (FR-37.15)
      description: |
        With an index series, indexedValue = baseValue x index(valuationYear) /
        index(indexBaseYear), rounded half-up to the currency minor unit
        (BR-37.10, AC-37.9). valuationYear defaults to the coverage start
        year; when the series has no value for it the latest loaded year is
        used with an AST-0531 warning. sumInsured below 90% of indexedValue
        sets underInsured with an AST-0532 warning. The base year must have an
        index value (AST-0015). Sold or Scrapped assets are refused (AST-0509).
      operationId: addInsurancePolicy
      x-passage-duty: AssetInsuranceMaintain
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsurancePolicyRequest"
      responses:
        "201":
          description: Policy recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsurancePolicy"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/assets/depreciation-runs:
    get:
      summary: Depreciation runs, newest first (without lines)
      operationId: listDepreciationRuns
      x-passage-duty: AssetView or AssetDepreciate
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      summary: Propose depreciation for one book code of a legal entity and one period (FR-37.5)
      description: |
        Decides every Open book with the book code: Due when the period is the
        book's next unposted schedule line, Exception when an earlier period
        is not depreciated (AST-0503, BR-37.3) or the period is already
        depreciated (AST-0502); exceptions stay out of the run and the other
        books still post. Monthly (straight-line) books take YYYY-MM periods,
        yearly (declining-balance) books YYYY. Proposing again refreshes a run
        that is still Proposed (new version); a Posted run for the same book
        and period is 409 AST-0502; a concurrent request for the same book and
        period is 409 AST-0504 (advisory lock, BR-37.9).
      operationId: proposeDepreciationRun
      x-passage-duty: AssetDepreciate
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "201":
          description: Proposal stored
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepreciationRun"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/assets/depreciation-runs/{id}:
    get:
      summary: Read a run with its per-book lines
      operationId: getDepreciationRun
      x-passage-duty: AssetView or AssetDepreciate
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepreciationRun"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/assets/depreciation-runs/{id}/post:
    post:
      summary: Post the reviewed proposal
      description: |
        Requires If-Match with the run ETag of the proposal the caller reviewed.
        Each Due book is decided again under a row lock; a book that changed
        since the proposal becomes an exception (AST-0018) and the others still
        post a Depreciation transaction dated the period end. Posting twice is
        409 AST-0502. Emits dev.passage.assets.depreciation.posted.v1.
      operationId: postDepreciationRun
      x-passage-duty: AssetPostJournal
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Run posted
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepreciationRun"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /v1/assets/index-series:
    get:
      summary: Insured-value index series of the tenant with their yearly values
      operationId: listIndexSeries
      x-passage-duty: AssetView or AssetInsuranceMaintain
      responses:
        "200":
          description: Series ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/IndexSeries" }
        "403":
          $ref: "#/components/responses/Problem"
  /v1/assets/index-series/{code}:
    put:
      summary: Create or replace an index series and upsert its yearly values
      description: Years not in the request keep their value. PUT is idempotent, so no Idempotency-Key is taken.
      operationId: putIndexSeries
      x-passage-duty: AssetInsuranceMaintain
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{0,31}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexSeriesRequest"
      responses:
        "200":
          description: The series with every loaded year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexSeries"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/assets/capex-requests:
    get:
      summary: Capital appropriation requests ordered by number (without variants)
      operationId: listCapexRequests
      x-passage-duty: AssetView or CapexRequestCreate or CapexRequestApprove
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/CapexStatus" } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapexPage"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      summary: Create a capex request in Draft with one to ten variants (FR-37.17)
      description: Numbers are unique per legal entity (409 AST-0023). Each variant's totalAmount is the sum of its amountsByYear.
      operationId: createCapexRequest
      x-passage-duty: CapexRequestCreate
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapexRequestCreate"
      responses:
        "201":
          description: Request created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapexRequest"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/assets/capex-requests/{id}:
    get:
      summary: Read a capex request with its variants
      operationId: getCapexRequest
      x-passage-duty: AssetView or CapexRequestCreate or CapexRequestApprove
      parameters:
        - $ref: "#/components/parameters/CapexId"
      responses:
        "200":
          description: The request
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapexRequest"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/assets/capex-requests/{id}/submit:
    post:
      summary: Submit a Draft request for approval with the selected variant
      description: |
        Moves Draft through Submitted to InApproval (BR-37.12) and routes the
        request by the selected variant's total: up to 50,000 PlantManager, up
        to 500,000 CFO, above that Board (capex.approvalLevels defaults,
        AC-37.11). The approval itself runs in the wave-4 workflow (not yet
        wired). Any other status is 422 AST-0016. Requires If-Match.
      operationId: submitCapexRequest
      x-passage-duty: CapexRequestCreate
      parameters:
        - $ref: "#/components/parameters/CapexId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [variantId]
              properties:
                variantId: { type: string, format: uuid }
      responses:
        "200":
          description: Request in approval
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapexRequest"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /v1/assets/capex-requests/{id}/approve:
    post:
      summary: Approve a request in approval (InApproval → Approved)
      description: |
        Freezes the selected variant's total as approvedAmount and publishes
        dev.passage.assets.capexrequest.approved.v1 with the variant's amounts per
        year in the same transaction (FR-37.17, AC-37.11). The user who created or
        requested the request may not approve it (403 AST-0028). Which approver
        may act at which approval level is the wave-4 workflow's job (not yet
        wired): any holder of CapexRequestApprove can decide.
        Every decision requires If-Match with the request's ETag, is recorded in
        the request's decision trail and returns the request with it. Any other
        status is 422 AST-0016.
      operationId: approveCapexRequest
      x-passage-duty: CapexRequestApprove
      parameters:
        - $ref: "#/components/parameters/CapexId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapexDecisionRequest"
      responses:
        "200":
          description: Request after the decision
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapexRequest"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /v1/assets/capex-requests/{id}/reject:
    post:
      summary: Reject a request in approval (InApproval → Rejected, terminal)
      description: |
        A comment giving the reason is required. The user who created or
        requested the request may not reject it (403 AST-0028).
        Every decision requires If-Match with the request's ETag, is recorded in
        the request's decision trail and returns the request with it. Any other
        status is 422 AST-0016.
      operationId: rejectCapexRequest
      x-passage-duty: CapexRequestApprove
      parameters:
        - $ref: "#/components/parameters/CapexId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapexDecisionRequest"
      responses:
        "200":
          description: Request after the decision
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapexRequest"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /v1/assets/capex-requests/{id}/postpone:
    post:
      summary: Postpone a request in approval (InApproval → Postponed)
      description: |
        A comment giving the reason is required. The requester can reopen a
        postponed request to Draft. The user who created or requested the
        request may not postpone it (403 AST-0028).
        Every decision requires If-Match with the request's ETag, is recorded in
        the request's decision trail and returns the request with it. Any other
        status is 422 AST-0016.
      operationId: postponeCapexRequest
      x-passage-duty: CapexRequestApprove
      parameters:
        - $ref: "#/components/parameters/CapexId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapexDecisionRequest"
      responses:
        "200":
          description: Request after the decision
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapexRequest"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /v1/assets/capex-requests/{id}/reopen:
    post:
      summary: Return a postponed request to Draft (Postponed → Draft)
      description: |
