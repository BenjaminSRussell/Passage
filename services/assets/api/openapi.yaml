  /v1/leases/{id}/modify:
    post:
      summary: Remeasure a lease on modification (FR-37.10, BR-37.8)
      description: |
        Recomputes the liability as the present value of the remaining
        payments from effectivePeriod on: at the lease's rate for a payment
        change, at the revised ibrRate for a scope change (a revised term is
        always a scope change). The schedule lines from effectivePeriod are
        replaced, earlier lines are kept; the ROU asset moves by the same
        adjustment, and any part that would take it below zero goes to profit
        or loss. The lease becomes Modified and the response carries the
        AST-0516 info message. A period already posted to the ledger cannot be
        remeasured (AST-0027). Publishes dev.passage.assets.lease.remeasured.v1.
        Requires If-Match with the lease ETag.
      operationId: modifyLease
      x-passage-duty: LeaseMaintain
      parameters:
        - $ref: "#/components/parameters/LeaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyLeaseRequest"
      responses:
        "201":
          description: Lease remeasured
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseModificationResult"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /v1/assets/gl-postings:
    post:
      summary: Book asset transactions and depreciation runs in the general ledger (D2j)
      operationId: postAssetsToGL
      x-passage-duty: AssetPostJournal
      description: |
        Books the transactions of one book code and currency that are not in the general ledger yet: one entry per depreciation run (all its books)
        and one per other transaction (acquisition, adjustment, revaluation, impairment, disposal, transfer or split). Cost and accumulated depreciation
        move on the class accounts of the posting profile; the counter account is the acquisition clearing, depreciation expense, impairment,
        revaluation or transfer clearing account, and a disposal books the proceeds with the remainder as gain or loss. Entries are keyed by run or
        transaction, so a retry returns the same entry. A group the ledger refuses (a closed period, for one) is listed under failed with the
        ledger's problem code and retried by the next run. At most 200 groups per run (more is true when others wait). Signs only ledger.entry.post.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, ledgerId, bookCode, currency]
              properties:
                legalEntityId: { type: string, format: uuid }
                ledgerId: { type: string, format: uuid }
                bookCode: { type: string }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
      responses:
        "200":
          description: What was booked and what the ledger refused
          content:
            application/json:
              schema:
                type: object
                required: [booked, failed, more]
                properties:
                  booked:
                    type: array
                    items:
                      type: object
                      properties:
                        document: { type: string, description: The run id or the transaction id. }
                        entryId: { type: string, format: uuid }
                        lines: { type: integer }
                        transactions: { type: integer }
                        placeholderProfile: { type: boolean }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        document: { type: string }
                        code: { type: string, description: "The ledger's problem code, or AST-0601." }
                  more: { type: boolean }
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/assets/gl-reconciliation:
    get:
      summary: Reconcile the register to the general ledger (AC4)
      operationId: getAssetsGLReconciliation
      x-passage-duty: AssetView
      description: |
        For one book code, per class cost and accumulated depreciation account: the register's balance (accumulated depreciation enters negative),
        the general ledger's balance of the account and the difference (GL minus register). unposted counts the transactions not booked yet.
        reconciled is true when every difference is zero.
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: ledgerId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: bookCode, in: query, required: true, schema: { type: string } }
        - { name: currency, in: query, required: true, schema: { type: string, pattern: "^[A-Z]{3}$" } }
      responses:
        "200":
          description: The reconciliation
          content:
            application/json:
              schema:
                type: object
                required: [currency, bookCode, reconciled, unposted, accounts]
                properties:
                  currency: { type: string }
                  bookCode: { type: string }
                  reconciled: { type: boolean }
                  unposted: { type: integer }
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        account: { type: string }
                        subledger: { type: string }
                        gl: { type: string }
                        difference: { type: string }
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/assets/posting-profiles:
    get:
      summary: Posting profiles of a legal entity and the placeholder default
      operationId: listAssetPostingProfiles
      x-passage-duty: AssetView
      description: |
        The profiles by asset class (ALL is the wildcard) and the built-in placeholder that applies when a legal entity has none
        (cost 1500, accumulated depreciation 1590, depreciation expense 6800, impairment 6810, revaluation 3300, acquisition clearing 2190,
        proceeds 1190, gain 7100, loss 7110, transfer clearing 1595), to be replaced by the accountant.
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Profiles and the placeholder
          content:
            application/json:
              schema:
                type: object
                required: [items, placeholder]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AssetPostingProfile" } }
                  placeholder: { $ref: "#/components/schemas/AssetPostingProfile" }
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    put:
      summary: Create or replace a posting profile
      operationId: saveAssetPostingProfile
      x-passage-duty: AssetConfigure
      description: Creates the profile (no If-Match) or replaces it (If-Match with the version) for a legal entity and class.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetPostingProfile" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetPostingProfile" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetPostingProfile" }
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
components:
  headers:
    ETag:
      description: Strong ETag of the resource version (asset, run, capex request or lease), for example "3"
      schema: { type: string }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on every command. Max 255 characters.
      schema: { type: string, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag from the last read of the resource. Missing is 428, stale is 412 (AST-0006).
      schema: { type: string }
    AssetId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CapexId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LeaseId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CountSessionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupAssetId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    After:
      name: after
      in: query
      description: The nextCursor of the previous page
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    AssetPostingProfile:
      type: object
      required: [costAccount, accumulatedDepreciationAccount, depreciationExpenseAccount, impairmentAccount, revaluationAccount, acquisitionClearingAccount, proceedsAccount, gainAccount, lossAccount, transferClearingAccount]
      properties:
        legalEntityId: { type: string, format: uuid }
        classCode: { type: string, default: ALL }
        costAccount: { type: string }
        accumulatedDepreciationAccount: { type: string }
        depreciationExpenseAccount: { type: string }
        impairmentAccount: { type: string }
        revaluationAccount: { type: string }
        acquisitionClearingAccount: { type: string }
        proceedsAccount: { type: string }
        gainAccount: { type: string }
        lossAccount: { type: string }
        transferClearingAccount: { type: string }
        version: { type: integer }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        placeholder: { type: boolean }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: "https://passage.dev/problems/AST-0001" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, example: "AST-0001" }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    AssetStatus:
      type: string
      enum: [NotYetAcquired, Open, Sold, Scrapped, Transferred]
    CreateAssetRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, assetNumber, name, classCode]
      properties:
        legalEntityId: { type: string, format: uuid }
        assetNumber: { type: string, minLength: 1, maxLength: 40 }
        name: { type: string, minLength: 1, maxLength: 120 }
        classCode: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{0,19}$" }
        barcode: { type: [string, "null"], minLength: 1, maxLength: 64, description: "Unique per legal entity" }
        quantity: { type: string, description: "Positive decimal with at most 4 places; default 1" }
    Asset:
      type: object
      required: [id, legalEntityId, assetNumber, name, classCode, barcode, quantity, status, acquiredDate, bookCount, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        assetNumber: { type: string }
        name: { type: string }
        classCode: { type: string }
        barcode: { type: [string, "null"] }
        quantity: { type: string }
        status: { $ref: "#/components/schemas/AssetStatus" }
        acquiredDate: { type: [string, "null"], format: date, description: "Earliest in-service date of its books" }
        bookCount: { type: integer }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    AssetDetail:
      allOf:
        - $ref: "#/components/schemas/Asset"
        - type: object
          required: [books]
          properties:
            books:
              type: array
              items: { $ref: "#/components/schemas/Book" }
    AssetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
        nextCursor: { type: string, format: uuid }
    AddBookRequest:
      type: object
      additionalProperties: false
      required: [bookCode, currency, method, convention, inServiceDate, cost, serviceLifePeriods]
      properties:
        bookCode: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{0,19}$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        method: { type: string, enum: [StraightLine, DecliningBalance, MACRS] }
        factor: { type: string, description: "Declining-balance multiplier 1 to 3, 2 = 200%" }
        switchToStraightLine: { type: boolean }
        serviceLifePeriods:
          type: integer
          minimum: 1
          maximum: 1200
          description: Months for StraightLine (1 to 1200); years for DecliningBalance (1 to 100); the recovery period for MACRS (3, 5, 7, 10, 15 or 20 years, IRS Pub. 946 Tables A-1 to A-5, salvage 0, factor ignored)
        salvageValue: { type: string }
        convention:
          type: string
          enum: [None, FullMonth, MidMonth15, HalfYear, MidQuarter]
          description: None, FullMonth and MidMonth15 apply to StraightLine; None, HalfYear and MidQuarter to DecliningBalance (MidQuarter charges 10.5, 7.5, 4.5 or 1.5 months of the first year by in-service quarter, IRS Pub. 946); HalfYear (Table A-1) and MidQuarter (Tables A-2 to A-5 by in-service quarter) to MACRS
        inServiceDate: { type: string, format: date }
        cost: { type: string }
    Book:
      type: object
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        bookCode: { type: string }
        currency: { type: string }
        method: { type: string, enum: [StraightLine, DecliningBalance, MACRS] }
        factor: { type: string }
        switchToStraightLine: { type: boolean }
        serviceLifePeriods: { type: integer }
        salvageValue: { type: string }
        convention: { type: string }
        inServiceDate: { type: string, format: date }
        cost: { type: string }
        accumulatedDepreciation: { type: string }
        nbv: { type: string }
        status: { type: string, enum: [Open, Sold, Scrapped, Transferred] }
        lastDepreciatedPeriod: { type: [string, "null"], description: "Last period a posted run charged (YYYY-MM or YYYY)" }
        groupAssetId: { type: string, format: uuid, description: "Set on the asset read when a group asset depreciates this book (FR-37.16)" }
        groupCode: { type: string, description: "The code of that group asset" }
    Schedule:
      type: object
      required: [bookId, bookCode, currency, total, lines]
      properties:
        bookId: { type: string, format: uuid }
        bookCode: { type: string }
        currency: { type: string }
        total: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              period: { type: string, description: "YYYY-MM for monthly lines, YYYY for annual" }
              amount: { type: string }
              accumulated: { type: string }
              nbv: { type: string }
    DisposeRequest:
      type: object
      additionalProperties: false
      required: [kind, percentage]
      properties:
        kind: { type: string, enum: [sale, scrap] }
        percentage: { type: string, description: "In (0, 100]" }
        proceeds: { type: string, description: "Sale proceeds, zero or more; must be 0 or omitted for a scrap" }
        transactionDate: { type: string, format: date, description: "Default today (UTC); not before any book's in-service date" }
    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        assetBookId: { type: string, format: uuid }
        bookCode: { type: string }
        currency: { type: string }
        type: { type: string, enum: [Acquisition, AcquisitionAdj, Depreciation, DepreciationAdj, Revaluation, Impairment, DisposalSale, DisposalScrap, Transfer, Split] }
        transactionDate: { type: string, format: date }
        costAmount: { type: string, description: "Signed; disposals are negative" }
        accumulatedAmount: { type: string, description: "Signed; disposals are negative" }
        proceedsAmount: { type: [string, "null"] }
        gainLoss: { type: [string, "null"] }
        impairmentAmount: { type: string, description: "Impairment share of accumulatedAmount (negative for a reversal)" }
        sourceType: { type: string, enum: [manual, addition, depreciation_run, transfer, split] }
        sourceId: { type: [string, "null"], format: uuid }
        runId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
    Disposal:
      type: object
      properties:
        asset: { $ref: "#/components/schemas/Asset" }
        books:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        transactions:
          type: array
          description: One per book, in the order of books
          items: { $ref: "#/components/schemas/Transaction" }
    CreateLeaseRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, leaseNumber, commencementDate, termMonths, paymentsPerYear, paymentAmount, paymentTiming, ibrRate, currency]
      properties:
        legalEntityId: { type: string, format: uuid }
        leaseNumber: { type: string, minLength: 1, maxLength: 40 }
        commencementDate: { type: string, format: date }
        termMonths: { type: integer, minimum: 1, maximum: 600, description: "A whole number of payment periods" }
        paymentsPerYear: { type: integer, enum: [1, 2, 4, 12] }
        paymentAmount: { type: string }
        paymentTiming: { type: string, enum: [arrears, advance] }
        ibrRate: { type: string, description: "Annual rate in (0, 0.5]; AST-0515 outside" }
        rateMethod:
          type: string
          enum: [Nominal, Effective]
          default: Nominal
          description: "lease.periodicRateMethod: Nominal is ibrRate / paymentsPerYear, Effective is (1 + ibrRate)^(1 / paymentsPerYear) - 1"
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    ModifyLeaseRequest:
      type: object
      additionalProperties: false
      required: [effectivePeriod, paymentAmount]
      properties:
        effectivePeriod: { type: integer, minimum: 1, description: "First schedule period under the revised terms; earlier periods are kept" }
        paymentAmount: { type: string, description: "Revised payment per period, rounded to the currency minor unit" }
        termMonths: { type: integer, minimum: 1, maximum: 600, description: "Revised full term from commencement; needs scopeChange. Omit to keep the term" }
        scopeChange: { type: boolean, default: false, description: "A change in scope: remeasure at the revised ibrRate" }
        ibrRate: { type: string, description: "Revised annual rate in (0, 0.5]; required with scopeChange and refused without it" }
    LeaseModification:
      type: object
      properties:
        id: { type: string, format: uuid }
        leaseId: { type: string, format: uuid }
        effectivePeriod: { type: integer }
        termMonths: { type: integer }
        paymentAmount: { type: string }
        ibrRate: { type: string }
        scopeChange: { type: boolean }
        liabilityBefore: { type: string, description: "Carrying liability at the start of the effective period" }
        liabilityAfter: { type: string, description: "Present value of the remaining payments under the revised terms" }
        adjustment: { type: string, description: "liabilityAfter - liabilityBefore" }
        rouBefore: { type: string }
        rouAfter: { type: string, description: "Never negative" }
        rouAdjustment: { type: string, description: "rouAfter - rouBefore; equals adjustment unless the ROU reached zero" }
        profitLossExcess: { type: string, description: "Part of a negative adjustment beyond the ROU carrying amount, recognized in P&L" }
        createdAt: { type: string, format: date-time }
    LeaseModificationResult:
      type: object
      required: [modification, lease, messages]
      properties:
        modification: { $ref: "#/components/schemas/LeaseModification" }
        lease: { $ref: "#/components/schemas/Lease" }
        messages: { type: array, items: { type: string }, description: "The AST-0516 info message" }
    LeaseLine:
      type: object
      properties:
        periodNo: { type: integer }
        opening: { type: string }
        remeasurement: { type: string, description: "Modification adjustment added to opening before the period's payment and interest" }
        interest: { type: string }
        payment: { type: string }
        closing: { type: string }
        rouDepreciation: { type: string }
    Lease:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        leaseNumber: { type: string }
        commencementDate: { type: string, format: date }
        termMonths: { type: integer }
        paymentsPerYear: { type: integer }
        paymentAmount: { type: string }
        paymentTiming: { type: string, enum: [arrears, advance] }
        ibrRate: { type: string, description: "Rate in force (the revised rate after a scope change)" }
        rateMethod: { type: string, enum: [Nominal, Effective] }
        currency: { type: string }
        liability: { type: string, description: "Liability at initial recognition" }
        rouAsset: { type: string, description: "ROU asset at initial recognition" }
        status: { type: string, enum: [Draft, Active, Modified, Terminated] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        schedule:
          type: array
          description: Present on GET /v1/leases/{id} and on create; omitted from the list
          items: { $ref: "#/components/schemas/LeaseLine" }
        modifications:
          type: array
          description: Remeasurements in order; present on GET /v1/leases/{id} once the lease was modified
          items: { $ref: "#/components/schemas/LeaseModification" }
    LeasePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Lease" }
        nextCursor: { type: string, format: uuid }
    AdjustRequest:
      type: object
      additionalProperties: false
      required: [bookId, type, transactionDate, amount]
      properties:
        bookId: { type: string, format: uuid }
        type: { type: string, enum: [AcquisitionAdj, DepreciationAdj, Revaluation, Impairment] }
        transactionDate: { type: string, format: date, description: "Not before the book's in-service date" }
        amount: { type: string, description: "Signed, non-zero, at most the currency minor unit; negative Impairment is a reversal" }
    AdjustResult:
      type: object
      required: [book, transaction, limited, requested, warnings]
      properties:
        book: { $ref: "#/components/schemas/Book" }
        transaction: { $ref: "#/components/schemas/Transaction" }
        limited: { type: boolean, description: "An impairment reversal was capped (AST-0512)" }
        requested: { type: string }
        warnings: { type: array, items: { type: string } }
    AdditionRequest:
      type: object
      additionalProperties: false
      required: [type, description, addedDate]
      properties:
        type: { type: string, enum: [Improvement, Component, Accessory] }
        description: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: string, description: "Positive, at most 4 places; default 1" }
        serialNumber: { type: [string, "null"], minLength: 1, maxLength: 64 }
        addedDate: { type: string, format: date }
        financial: { type: boolean, default: false }
        cost: { type: string, description: "Required and positive when financial" }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "Required when financial" }
        bookIds: { type: array, items: { type: string, format: uuid }, description: "Default: every Open book" }
    Addition:
      type: object
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        type: { type: string, enum: [Improvement, Component, Accessory] }
        description: { type: string }
        quantity: { type: string }
        serialNumber: { type: [string, "null"] }
        addedDate: { type: string, format: date }
        financial: { type: boolean }
        cost: { type: string }
        currency: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        transactions:
          type: array
          description: The AcquisitionAdj transactions a financial addition posted, one per book
          items: { $ref: "#/components/schemas/Transaction" }
    RunRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, bookCode, period]
      properties:
        legalEntityId: { type: string, format: uuid }
        bookCode: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{0,19}$" }
        period: { type: string, description: "YYYY-MM for monthly books, YYYY for yearly books" }
    RunLine:
      type: object
      properties:
        assetBookId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        assetNumber: { type: string }
        status: { type: string, enum: [Due, Posted, Exception] }
        amount: { type: string, description: "Charge from the book's current balances" }
        scheduledAmount: { type: string, description: "The original schedule line" }
        exceptionCode: { type: [string, "null"] }
        detail: { type: [string, "null"] }
    DepreciationRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        bookCode: { type: string }
        period: { type: string }
        currency: { type: [string, "null"] }
        status: { type: string, enum: [Proposed, Posted] }
        assetCount: { type: integer, description: "Due books on a proposal; posted books on a posted run" }
        exceptionCount: { type: integer }
        totalAmount: { type: string }
        journalEntryId: { type: [string, "null"], format: uuid, description: "Null until the ledger integration posts the journal" }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        postedAt: { type: [string, "null"], format: date-time }
        lines:
          type: array
          description: Present on create, read and post; omitted from the list
          items: { $ref: "#/components/schemas/RunLine" }
    RunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DepreciationRun" }
        nextCursor: { type: string, format: uuid }
    IndexSeriesRequest:
      type: object
      additionalProperties: false
      required: [country, classCode, values]
      properties:
        country: { type: string, pattern: "^[A-Z]{2}$" }
        classCode: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{0,19}$" }
        values:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [year, value]
            properties:
              year: { type: integer, minimum: 1900, maximum: 2999 }
              value: { type: string, description: "Positive, at most 4 places" }
    IndexSeries:
      type: object
      properties:
        code: { type: string }
        country: { type: string }
        classCode: { type: string }
        values:
          type: array
          items:
            type: object
            properties:
              year: { type: integer }
              value: { type: string }
        updatedAt: { type: string, format: date-time }
    InsurancePolicyRequest:
      type: object
      additionalProperties: false
      required: [insurerPartyId, policyNumber, insuranceType, coverageFrom, coverageTo, currency, basis, baseValue, sumInsured]
      properties:
        insurerPartyId: { type: string, format: uuid }
        policyNumber: { type: string, minLength: 1, maxLength: 60, description: "Unique per asset (409 AST-0025)" }
        insuranceType: { type: string, enum: [Property, MachineryBreakdown, Transit, Fleet] }
        coverageFrom: { type: string, format: date }
        coverageTo: { type: string, format: date, description: "After coverageFrom" }
        premium: { type: string, description: "Default 0" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        basis: { type: string, enum: [Replacement, NBV, Agreed] }
        baseValue: { type: string, description: "Replacement value at the index base year" }
        sumInsured: { type: string, description: "The policy's cover" }
        indexSeriesCode: { type: [string, "null"] }
        indexBaseYear: { type: [integer, "null"], description: "Required with indexSeriesCode" }
        valuationYear: { type: [integer, "null"], description: "Default the coverage start year" }
    InsurancePolicy:
      type: object
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        insurerPartyId: { type: string, format: uuid }
        policyNumber: { type: string }
        insuranceType: { type: string }
        coverageFrom: { type: string, format: date }
        coverageTo: { type: string, format: date }
        premium: { type: string }
        currency: { type: string }
        basis: { type: string }
        baseValue: { type: string }
        sumInsured: { type: string }
        indexSeriesCode: { type: [string, "null"] }
        indexBaseYear: { type: [integer, "null"] }
        valuationYear: { type: [integer, "null"] }
        indexYearUsed: { type: [integer, "null"], description: "Differs from valuationYear when it fell back (AST-0531)" }
        indexedValue: { type: [string, "null"] }
        underInsured: { type: boolean, description: "sumInsured below 90% of indexedValue (AST-0532)" }
        warnings: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    InsuranceReportRow:
      allOf:
        - $ref: "#/components/schemas/InsurancePolicy"
        - type: object
          properties:
            assetNumber: { type: string }
            assetName: { type: string }
            assetStatus: { $ref: "#/components/schemas/AssetStatus" }
            books:
              type: array
              description: NBV of every Open book of the asset
              items:
                type: object
                properties:
                  bookCode: { type: string }
                  currency: { type: string }
                  nbv: { type: string }
            expiringSoon: { type: boolean, description: "Cover ends within 30 days of asOf" }
    InsuranceReport:
      type: object
      required: [asOf, items]
      properties:
        asOf: { type: string, format: date }
        items:
          type: array
          items: { $ref: "#/components/schemas/InsuranceReportRow" }
        nextCursor: { type: string, format: uuid }
    CountSessionRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, location, barcodes]
      properties:
        legalEntityId: { type: string, format: uuid }
        location: { type: string, minLength: 1, maxLength: 80, description: "Where the count took place" }
        countedDate: { type: string, format: date, description: "Default today (UTC)" }
        barcodes:
          type: array
          maxItems: 5000
          description: Scans in order; each is trimmed and 1 to 64 characters; repeats are allowed
          items: { type: string, minLength: 1, maxLength: 64 }
    CountLine:
      type: object
      properties:
        barcode: { type: string }
        outcome: { type: string, enum: [Found, Missing, Unknown] }
        assetId: { type: [string, "null"], format: uuid }
        assetNumber: { type: [string, "null"] }
        assetName: { type: [string, "null"] }
    CountSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        location: { type: string }
        countedDate: { type: string, format: date }
        expectedCount: { type: integer, description: "Open assets of the entity with a barcode" }
        foundCount: { type: integer }
        missingCount: { type: integer }
        unknownCount: { type: integer }
        duplicateCount: { type: integer, description: "Repeated scans of a barcode already counted" }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          description: On create and GET /v1/assets/count-sessions/{id}; omitted from the list
          items: { $ref: "#/components/schemas/CountLine" }
        warnings: { type: array, items: { type: string }, description: "AST-0525 per unknown barcode" }
    CountSessionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CountSession" }
        nextCursor: { type: string, format: uuid }
    CapexStatus:
      type: string
      enum: [Draft, Submitted, InApproval, Approved, Released, Closed, Rejected, Postponed]
    CapexVariantRequest:
      type: object
      additionalProperties: false
      required: [description, amountsByYear, inServiceDate, profileAssumption]
      properties:
        description: { type: string, minLength: 1, maxLength: 200 }
        amountsByYear:
          type: object
          description: Four-digit year to positive decimal amount; 1 to 30 years
          additionalProperties: { type: string }
        inServiceDate: { type: string, format: date }
        profileAssumption: { type: string, minLength: 1, maxLength: 60 }
    CapexRequestCreate:
      type: object
      additionalProperties: false
      required: [legalEntityId, number, title, requesterId, currency, variants]
      properties:
        legalEntityId: { type: string, format: uuid }
        number: { type: string, minLength: 1, maxLength: 40 }
        title: { type: string, minLength: 1, maxLength: 200 }
        requesterId: { type: string, minLength: 1, maxLength: 200 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        variants:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/CapexVariantRequest" }
    CapexVariant:
      type: object
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        description: { type: string }
        amountsByYear: { type: object, additionalProperties: { type: string } }
        totalAmount: { type: string }
        inServiceDate: { type: string, format: date }
        profileAssumption: { type: string }
    CapexRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        number: { type: string }
        title: { type: string }
        requesterId: { type: string }
        status: { $ref: "#/components/schemas/CapexStatus" }
        currency: { type: string }
        selectedVariantId: { type: [string, "null"], format: uuid }
        approvalLevel: { type: [string, "null"], enum: [PlantManager, CFO, Board, null] }
        requestedAmount: { type: [string, "null"] }
        approvedAmount: { type: [string, "null"], description: "The selected variant's total, set on approve" }
        createdBy: { type: [string, "null"], description: "User that created the request; null for requests created before slice 4" }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        variants:
          type: array
          description: Present on create, read, submit and decisions; omitted from the list
          items: { $ref: "#/components/schemas/CapexVariant" }
        decisions:
          type: array
          description: Decision trail, oldest first; present on read and decisions once a decision exists
          items: { $ref: "#/components/schemas/CapexDecisionRecord" }
    CapexDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        comment: { type: string, maxLength: 1000, description: "Reason for the decision; required to reject or postpone" }
    CapexDecisionRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        decision: { type: string, enum: [approve, reject, postpone, reopen, release, close] }
        fromStatus: { $ref: "#/components/schemas/CapexStatus" }
        toStatus: { $ref: "#/components/schemas/CapexStatus" }
        approvalLevel: { type: [string, "null"], enum: [PlantManager, CFO, Board, null] }
        amount: { type: [string, "null"], description: "Requested amount at the decision" }
        comment: { type: [string, "null"] }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
    MidQuarterReport:
      type: object
      properties:
        legalEntityId: { type: string, format: uuid }
        bookCode: { type: string }
        currency: { type: [string, "null"], description: "Null when no book was placed in service in the year" }
        year: { type: integer }
        bookCount: { type: integer }
        totalBasis: { type: string }
        quarterBasis:
          type: array
          minItems: 4
          maxItems: 4
          description: Basis placed in service in Q1 to Q4
          items: { type: string }
        q4Share: { type: string, description: "Q4 basis / total basis, four decimals" }
        applies: { type: boolean }
        warnings: { type: array, items: { type: string, enum: [AST-0511] } }
        reviewCount: { type: integer }
        review:
          type: array
          items:
            type: object
            properties:
              assetId: { type: string, format: uuid }
              assetNumber: { type: string }
              bookId: { type: string, format: uuid }
              method: { type: string, enum: [StraightLine, DecliningBalance, MACRS] }
              convention: { type: string }
              inServiceDate: { type: string, format: date }
              quarter: { type: integer, minimum: 1, maximum: 4 }
              cost: { type: string }
    CapexPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CapexRequest" }
        nextCursor: { type: string, format: uuid }
    TransferRequest:
      type: object
      additionalProperties: false
      required: [kind, parts]
      properties:
        kind: { type: string, enum: [transfer, split] }
        transferDate: { type: string, format: date, description: "Defaults to today" }
        parts:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [assetNumber, name, percentage]
            properties:
              assetNumber: { type: string, minLength: 1, maxLength: 40, description: "Unique in the target legal entity" }
              name: { type: string, minLength: 1, maxLength: 120 }
              percentage: { type: string, description: "Share of every book, above 0 with at most two decimals" }
              legalEntityId: { type: string, format: uuid, description: "Transfer only; defaults to the source legal entity" }
              classCode: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{0,19}$", description: "Defaults to the source class" }
              barcode: { type: string, minLength: 1, maxLength: 64 }
              quantity: { type: string, description: "Defaults to the source quantity (times the share for a split)" }
    TransferTarget:
      type: object
      required: [lineNo, percentage, asset, books]
      properties:
        lineNo: { type: integer }
        percentage: { type: string }
        asset: { $ref: "#/components/schemas/Asset" }
        books:
          type: array
          items: { $ref: "#/components/schemas/Book" }
    Transfer:
      type: object
      required: [id, kind, transferDate, legalEntityId, sourceAssetId, sourceAssetNumber, createdBy, createdAt, targets]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [transfer, split] }
        transferDate: { type: string, format: date }
        legalEntityId: { type: string, format: uuid, description: "The source asset's legal entity" }
        sourceAssetId: { type: string, format: uuid }
        sourceAssetNumber: { type: string }
        createdBy: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/Asset", description: "On the command response: the source asset after the transfer" }
        targets:
          type: array
          items: { $ref: "#/components/schemas/TransferTarget" }
        transactions:
          type: array
          description: On the command response, the Transfer / Split transactions on the source and target books
          items: { $ref: "#/components/schemas/Transaction" }
    GroupAssetRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, groupCode, name, classCode, bookCode, taxYear, method, serviceLifePeriods, convention, memberAssetIds]
      properties:
        legalEntityId: { type: string, format: uuid }
        groupCode: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{0,19}$", description: "Unique in the legal entity" }
        name: { type: string, minLength: 1, maxLength: 120 }
        classCode: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{0,19}$" }
        bookCode: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{0,19}$", description: "The tax book the group depreciates" }
        taxYear: { type: integer, minimum: 1900, maximum: 2200 }
        method: { type: string, enum: [StraightLine, DecliningBalance, MACRS] }
        factor: { type: string, description: "Declining-balance factor, 1 to 3" }
        switchToStraightLine: { type: boolean }
        serviceLifePeriods: { type: integer, minimum: 1, maximum: 1200, description: "Months for StraightLine, years for DecliningBalance and MACRS" }
        convention: { type: string, enum: [None, FullMonth, MidMonth15, HalfYear, MidQuarter] }
        memberAssetIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { type: string, format: uuid }
    GroupAsset:
      type: object
      required: [id, legalEntityId, groupCode, name, classCode, bookCode, taxYear, currency, method, factor, switchToStraightLine,
        serviceLifePeriods, convention, inServiceDate, status, basis, memberCount, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        groupCode: { type: string }
        name: { type: string }
        classCode: { type: string }
        bookCode: { type: string }
        taxYear: { type: integer }
        currency: { type: string }
        method: { type: string, enum: [StraightLine, DecliningBalance, MACRS] }
        factor: { type: string }
        switchToStraightLine: { type: boolean }
        serviceLifePeriods: { type: integer }
        convention: { type: string }
        inServiceDate: { type: string, format: date, description: "1 January of the tax year" }
        status: { type: string, enum: [Open] }
        basis: { type: string, description: "Sum of the members' cost on the group's book" }
        memberCount: { type: integer }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        members:
          type: array
          description: On the read and the create
          items:
            type: object
            required: [assetId, assetNumber, name, assetBookId, bookStatus, inServiceDate, cost]
            properties:
              assetId: { type: string, format: uuid }
              assetNumber: { type: string }
              name: { type: string }
              assetBookId: { type: string, format: uuid }
              bookStatus: { type: string, enum: [Open, Sold, Scrapped, Transferred] }
              inServiceDate: { type: string, format: date }
              cost: { type: string }
        schedule:
          type: array
          description: The projected group depreciation by year on the current basis (AC-37.10)
          items:
            type: object
            required: [year, amount, accumulated, nbv]
            properties:
              year: { type: string }
              amount: { type: string }
              accumulated: { type: string }
              nbv: { type: string }
    GroupAssetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GroupAsset" }
        nextCursor: { type: string, format: uuid }
