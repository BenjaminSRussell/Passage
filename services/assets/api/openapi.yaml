        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisposeRequest"
      responses:
        "201":
          description: Disposal recorded
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Disposal"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /v1/assets/{id}/transfer:
    post:
      summary: Transfer the asset to one new asset or split it into several (FR-37.7)
      description: |
        Every Open book moves. kind transfer has one target taking 100% (it may
        name another legal entity of the tenant); kind split has 2 to 50
        targets in the source legal entity whose percentages (two decimals)
        total 100.00% (AST-0507). Cost, accumulated depreciation, the
        impairment share, salvage and the schedule basis are allocated by
        percentage with the residual cents on the last target (BR-37.7); each
        target book keeps the source profile, in-service date and last
        depreciated period. Each source book is emptied by a Transfer or Split
        transaction and ends Transferred, and the source asset becomes
        Transferred (BR-37.2). A transfer dated before the end of a book's last
        depreciated period is AST-0508. Requires If-Match with the asset ETag;
        the response ETag is the source asset's new version. Publishes
        dev.passage.assets.asset.transferred.v1 or .split.v1.
      operationId: transferAsset
      x-passage-duty: AssetMaintain
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "201":
          description: Transfer or split recorded
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
