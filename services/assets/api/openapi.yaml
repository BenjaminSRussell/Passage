  /v1/assets/group-assets:
    get:
      summary: Group assets ordered by code (without members)
      operationId: listGroupAssets
      x-passage-duty: AssetView or AssetConfigure
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of group assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupAssetPage"
        "400":
          $ref: "#/components/responses/Problem"
    post:
      summary: Create a group asset and assign its members (FR-37.16)
      description: |
        Pools the books with bookCode of the member assets into a group asset
        for pooled tax depreciation (US general asset account, DE
        Sammelposten, UK pools). Every member must be an Open book of the
        group's legal entity and class, placed in service in the tax year, in
        one currency (AST-0031); a book belongs to at most one group asset
        (BR-37.11, AST-0535, 409). The group depreciates its basis (the sum of
        the members' cost, read live) with its own profile from 1 January of
        the tax year; a depreciation run gives member books an AST-0035
        exception and no own charge.
      operationId: createGroupAsset
      x-passage-duty: AssetConfigure
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
