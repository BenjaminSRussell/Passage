    post:
      summary: Reconcile a physical inventory scan against the register (FR-37.11)
      description: |
        Classifies the scanned barcodes against the Open assets of the legal
        entity that carry a barcode: Found, Missing (expected, not scanned) and
        Unknown (scanned, not in the register; one AST-0525 warning each). A
        barcode scanned more than once counts once and adds to duplicateCount.
        The register is not changed: a counter cannot adjust it (PRD 7.37.17).
      operationId: createCountSession
      x-passage-duty: AssetCount
      parameters:
