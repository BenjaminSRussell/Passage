      summary: Read a lease with its schedule
      operationId: getLease
      x-passage-duty: LeaseMaintain
      parameters:
        - $ref: "#/components/parameters/LeaseId"
      responses:
        "200":
          description: The lease
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
