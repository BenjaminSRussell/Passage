asyncapi: 3.0.0
info:
  title: Passage Assets events
  version: 1.0.0
  description: |
    Events published by the assets service through the outbox (same transaction
    as the state change). CloudEvents 1.0 envelope; type
    dev.passage.assets.<entity>.<verb>.v1; source /passage/assets/assets.
defaultContentType: application/cloudevents+json
channels:
  assetAcquired:
    address: passage.assets.asset
    messages:
      assetAcquired:
        $ref: "#/components/messages/AssetAcquired"
  assetDisposed:
    address: passage.assets.asset
    messages:
      assetDisposed:
        $ref: "#/components/messages/AssetDisposed"
  leaseRecognized:
    address: passage.assets.lease
    messages:
      leaseRecognized:
        $ref: "#/components/messages/LeaseRecognized"
  assetAdjusted:
    address: passage.assets.asset
    messages:
      assetAdjusted:
        $ref: "#/components/messages/AssetAdjusted"
  depreciationPosted:
    address: passage.assets.depreciation
    messages:
      depreciationPosted:
        $ref: "#/components/messages/DepreciationPosted"
  leaseRemeasured:
    address: passage.assets.lease
    messages:
      leaseRemeasured:
        $ref: "#/components/messages/LeaseRemeasured"
  leasePosted:
    address: passage.assets.lease
    messages:
      leasePosted:
        $ref: "#/components/messages/LeasePosted"
  capexApproved:
    address: passage.assets.capexrequest
    messages:
      capexApproved:
        $ref: "#/components/messages/CapexApproved"
  assetTransferred:
    address: passage.assets.asset
    messages:
      assetTransferred:
        $ref: "#/components/messages/AssetTransferred"
  assetSplit:
    address: passage.assets.asset
    messages:
      assetSplit:
        $ref: "#/components/messages/AssetSplit"
operations:
  publishAssetAcquired:
    action: send
    summary: Publishes the asset acquired event through the outbox.
    channel: { $ref: "#/channels/assetAcquired" }
  publishAssetDisposed:
    action: send
    summary: Publishes the asset disposed event through the outbox.
    channel: { $ref: "#/channels/assetDisposed" }
  publishLeaseRecognized:
    action: send
    summary: Publishes the lease recognized event through the outbox.
    channel: { $ref: "#/channels/leaseRecognized" }
  publishAssetAdjusted:
    action: send
    summary: Publishes the asset adjusted event through the outbox.
    channel: { $ref: "#/channels/assetAdjusted" }
  publishDepreciationPosted:
    action: send
    summary: Publishes the depreciation posted event through the outbox.
    channel: { $ref: "#/channels/depreciationPosted" }
  publishLeaseRemeasured:
    action: send
    summary: Publishes the lease remeasured event through the outbox.
    channel: { $ref: "#/channels/leaseRemeasured" }
  publishLeasePosted:
    action: send
    summary: Publishes the lease posted event through the outbox.
    channel: { $ref: "#/channels/leasePosted" }
  publishCapexApproved:
    action: send
    summary: Publishes the capex approved event through the outbox.
    channel: { $ref: "#/channels/capexApproved" }
  publishAssetTransferred:
    action: send
    summary: Publishes the asset transferred event through the outbox.
    channel: { $ref: "#/channels/assetTransferred" }
  publishAssetSplit:
    action: send
    summary: Publishes the asset split event through the outbox.
    channel: { $ref: "#/channels/assetSplit" }
components:
  messages:
    AssetAdjusted:
      name: dev.passage.assets.asset.adjusted.v1
      summary: A book's balances changed by an acquisition adjustment, depreciation adjustment, revaluation or impairment.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/AssetAdjustedData"
    DepreciationPosted:
      name: dev.passage.assets.depreciation.posted.v1
      summary: A depreciation run was posted for one book code and period.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/DepreciationPostedData"
    AssetAcquired:
      name: dev.passage.assets.asset.acquired.v1
      summary: "An asset book was acquired: cost recognized on one or more books of the asset."
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/AssetAcquiredData"
    AssetDisposed:
      name: dev.passage.assets.asset.disposed.v1
      summary: A book was sold or scrapped, in full or in part, with its gain or loss.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/AssetDisposedData"
    LeaseRecognized:
      name: dev.passage.assets.lease.recognized.v1
      summary: An IFRS 16 lease was recognized with its liability, ROU asset and schedule.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/LeaseRecognizedData"
    LeaseRemeasured:
      name: dev.passage.assets.lease.remeasured.v1
      summary: A lease was remeasured on modification; the liability and ROU asset moved.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/LeaseRemeasuredData"
    LeasePosted:
      name: dev.passage.assets.lease.posted.v1
      summary: A lease journal (recognition or schedule period) was accepted by the general ledger.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/LeasePostedData"
    CapexApproved:
      name: dev.passage.assets.capexrequest.approved.v1
      summary: A capex appropriation request was approved with its selected variant's amounts per year.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/CapexApprovedData"
    AssetTransferred:
      name: dev.passage.assets.asset.transferred.v1
      summary: An asset was transferred to a new asset, possibly in another legal entity of the tenant.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/AssetTransferredData"
    AssetSplit:
      name: dev.passage.assets.asset.split.v1
      summary: An asset was split into several new assets; cost and accumulated depreciation moved to the targets.
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/AssetTransferredData"
  schemas:
    AssetTransferredData:
      type: object
      description: |
        Published in the same transaction as a transfer (one target) or split
        (two or more targets) of an asset (FR-37.7, POST /v1/assets/{id}/transfer).
        Not in the PRD event table; added so the ledger (intercompany
        settlement, wave 40) and analytics see every move of cost and
        accumulated depreciation between assets. books lists each source
        book's balances at the transfer (all of it moves; the source ends
        Transferred); targets lists the new assets with the share each took.
        Aggregate key is the source asset id.
      required: [transferId, sourceAssetId, legalEntityId, kind, transferDate, books, targets]
      properties:
        transferId: { type: string, format: uuid }
        sourceAssetId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid, description: "The source asset's legal entity" }
        kind: { type: string, enum: [transfer, split] }
        transferDate: { type: string, format: date }
        books:
          type: array
          items:
            type: object
            required: [bookCode, currency, cost, accumulatedDepreciation, nbv]
            properties:
              bookCode: { type: string }
              currency: { type: string, pattern: "^[A-Z]{3}$" }
              cost: { type: string, description: "Decimal string" }
              accumulatedDepreciation: { type: string, description: "Decimal string" }
              nbv: { type: string, description: "Decimal string" }
        targets:
          type: array
          items:
            type: object
            required: [assetId, assetNumber, legalEntityId, percentage]
            properties:
              assetId: { type: string, format: uuid }
              assetNumber: { type: string }
              legalEntityId: { type: string, format: uuid, description: "Differs from the source for a transfer to another legal entity" }
              percentage: { type: string, description: "Two decimals; the targets total 100.00" }
    CapexApprovedData:
      type: object
      description: |
        Published in the same transaction as the approval of a capex request
        (FR-37.17, AC-37.11). Consumers are budget-svc (wave 38) and the
        depreciation forecast (FR-37.12). Aggregate key is the request id.
      required: [requestId, legalEntityId, number, variantId, amountsByYear, approvedAmount, currency, inServiceDate, profileAssumption, programPositionId]
      properties:
        requestId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        number: { type: string }
        variantId: { type: string, format: uuid }
        amountsByYear:
          type: object
          description: The approved variant's amounts keyed by four-digit year; decimal strings
          additionalProperties: { type: string }
        approvedAmount: { type: string, description: "Decimal string; the variant total" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        inServiceDate: { type: string, format: date }
        profileAssumption: { type: string }
        programPositionId: { type: [string, "null"], format: uuid, description: "Null until the investment program (FR-38.21) links the request" }
    AssetAcquiredData:
      type: object
      description: One event per acquisition posted to a book. Aggregate key is the asset id.
      required: [assetId, bookIds, cost, currency, sourceType]
      properties:
        assetId: { type: string, format: uuid }
        bookIds: { type: array, items: { type: string, format: uuid } }
        cost: { type: string, description: "Decimal string" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        sourceType: { type: string, enum: [manual, apInvoice, project, inventory] }
        sourceId: { type: [string, "null"], format: uuid }
    AssetDisposedData:
      type: object
      description: |
        One event per book a disposal touched (a disposal applies to every Open
        book of the asset). nbv is the NBV of the disposed share; gainLoss is
        proceeds minus that NBV. Aggregate key is the asset id.
      required: [assetId, bookId, kind, transactionDate, percentage, proceeds, nbv, gainLoss, currency]
      properties:
        assetId: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        kind: { type: string, enum: [sale, scrap] }
        transactionDate: { type: string, format: date }
        percentage: { type: string, description: "In (0, 100]" }
        proceeds: { type: string }
        nbv: { type: string }
        gainLoss: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    LeaseRecognizedData:
      type: object
      required: [leaseId, liability, rouAsset, currency, termMonths, rate]
      properties:
        leaseId: { type: string, format: uuid }
        liability: { type: string }
        rouAsset: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        termMonths: { type: integer }
        rate: { type: string }
    AssetAdjustedData:
      type: object
      description: |
        One event per AcquisitionAdj, DepreciationAdj, Revaluation or Impairment
        posted on a book (POST /v1/assets/{id}/transactions, or a financial
        addition with sourceType addition). Not in the PRD event table; added so
        consumers see every change of a book's balances. Aggregate key is the
        asset id.
      required: [assetId, bookId, transactionId, type, transactionDate, costDelta, accumulatedDelta, impairmentDelta, currency, sourceType]
      properties:
        assetId: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        type: { type: string, enum: [AcquisitionAdj, DepreciationAdj, Revaluation, Impairment] }
        transactionDate: { type: string, format: date }
        costDelta: { type: string, description: "Signed decimal string" }
        accumulatedDelta: { type: string, description: "Signed decimal string" }
        impairmentDelta: { type: string, description: "Signed decimal string; negative for a reversal" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        sourceType: { type: string, enum: [manual, addition] }
        sourceId: { type: [string, "null"], format: uuid, description: "The addition id when sourceType is addition" }
    DepreciationPostedData:
      type: object
      description: |
        One event per posted depreciation run. bookCode stands in for the PRD's
        bookDefinitionId until book definitions exist. Aggregate key is the run id.
      required: [runId, legalEntityId, bookCode, period, assetCount, totalAmount, currency, journalEntryId]
      properties:
        runId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        bookCode: { type: string }
        period: { type: string, description: "YYYY or YYYY-MM" }
        assetCount: { type: integer, description: "Books that posted" }
        totalAmount: { type: string, description: "Decimal string" }
        currency: { type: [string, "null"], pattern: "^[A-Z]{3}$", description: "Null when the run had no book" }
        journalEntryId: { type: [string, "null"], format: uuid, description: "Null until the journal integration links the run." }
    LeasePostedData:
      type: object
      description: |
        One event per lease journal the ledger accepted (POST /v1/leases/gl-postings, D4d).
        Not in the PRD event table; added so the ledger's consumers and analytics know which entry
        carries which period of the liability and ROU asset. kind Recognition (period 0) sets
        liability and rouAsset; kind Period sets interest, payment, rouDepreciation and remeasurement.
        Aggregate key is the lease id.
      required: [leaseId, legalEntityId, kind, period, postingDate, journalEntryId, ledgerId, currency]
      properties:
        leaseId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        kind: { type: string, enum: [Recognition, Period] }
        period: { type: integer, description: "0 for the recognition journal, otherwise the schedule period" }
        postingDate: { type: string, format: date }
        journalEntryId: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        liability: { type: string, description: "Recognition only" }
        rouAsset: { type: string, description: "Recognition only" }
        interest: { type: string, description: "Period only" }
        payment: { type: string, description: "Period only" }
        rouDepreciation: { type: string, description: "Period only" }
        remeasurement: { type: string, description: "Period only; signed, zero unless a modification takes effect in the period" }
    LeaseRemeasuredData:
      type: object
      description: |
        One event per lease modification (POST /v1/leases/{id}/modify, BR-37.8).
        Not in the PRD event table; added so the ledger and analytics see every
        change of the lease liability and ROU asset. adjustment is
        liabilityAfter - liabilityBefore; the ROU moves by rouAdjustment, which
        equals adjustment unless the ROU reached zero and profitLossExcess went
        to profit or loss. Aggregate key is the lease id.
      required: [leaseId, modificationId, effectivePeriod, termMonths, rate, liabilityBefore, liabilityAfter, adjustment, rouAdjustment, profitLossExcess, currency]
      properties:
        leaseId: { type: string, format: uuid }
        modificationId: { type: string, format: uuid }
        effectivePeriod: { type: integer, description: "First schedule period under the revised terms" }
        termMonths: { type: integer, description: "Full lease term after the modification" }
        rate: { type: string, description: "Annual discount rate used for the remeasurement" }
        liabilityBefore: { type: string }
        liabilityAfter: { type: string }
        adjustment: { type: string, description: "Signed decimal string" }
        rouAdjustment: { type: string, description: "Signed decimal string" }
        profitLossExcess: { type: string, description: "Non-negative decimal string" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
