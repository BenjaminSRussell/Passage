image:
  repository: ghcr.io/benjaminsrussell/passage-analytics
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 8080

# DATABASE_URL is read from this secret key (Vault via External Secrets).
database:
  secretName: analytics-db
  secretKey: DATABASE_URL

migrateOnStart: false

# Nightly 02:00 revenue-to-GL reconciliation (FR-46.13). Off while tenantId is empty.
# ledgers is legalEntityId=ledgerId pairs, revenueAccounts is FROM-TO account numbers.
reconciliation:
  tenantId: ""
  timezone: UTC
  ledgers: ""
  revenueAccounts: ""
  cubeUrl: ""
  cubeTokenSecret:
    name: analytics-cube
    key: CUBE_API_TOKEN
  ledgerUrl: ""

serviceIdentity:
  signingKeySecret: ""
  keyId: ""

serviceMonitor:
  enabled: false
  interval: 30s

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
