apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-analytics
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        {{- if .Values.serviceIdentity.signingKeySecret }}
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
{{- if .Values.serviceIdentity.signingKeySecret }}
      volumes:
        - name: service-identity
          secret:
            secretName: {{ .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
{{- end }}
      containers:
        - name: analytics
          image: "{{ (include "passage.imageRepository" $) }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: admin
              containerPort: 9090
          env:
            {{- include "passage.cloudEnv" $ | nindent 12 }}
            - name: SERVICE_NAME
              value: analytics
            - name: HTTP_ADDR
              value: ":{{ .Values.service.port }}"
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
{{- if .Values.semanticLayer.url }}
            - name: SEMANTIC_LAYER_URL
              value: {{ .Values.semanticLayer.url | quote }}
            - name: SEMANTIC_LAYER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.semanticLayer.secret.name }}
                  key: {{ .Values.semanticLayer.secret.key }}
{{- end }}
{{- if .Values.reconciliation.tenantId }}
            - name: PASSAGE_SERVICE_NAME
              value: analytics
            - name: ANALYTICS_RECON_TENANT_ID
              value: {{ .Values.reconciliation.tenantId | quote }}
            - name: ANALYTICS_RECON_TZ
              value: {{ .Values.reconciliation.timezone | quote }}
            - name: ANALYTICS_RECON_LEDGERS
              value: {{ .Values.reconciliation.ledgers | quote }}
            - name: ANALYTICS_RECON_REVENUE_ACCOUNTS
              value: {{ .Values.reconciliation.revenueAccounts | quote }}
            - name: CUBE_URL
              value: {{ .Values.reconciliation.cubeUrl | quote }}
            - name: CUBE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.reconciliation.cubeTokenSecret.name }}
                  key: {{ .Values.reconciliation.cubeTokenSecret.key }}
            - name: LEDGER_URL
              value: {{ .Values.reconciliation.ledgerUrl | quote }}
{{- if .Values.serviceIdentity.signingKeySecret }}
            - name: PASSAGE_SERVICE_SIGNING_KEY_FILE
              value: /var/run/passage/service-identity/signing-key
{{- if .Values.serviceIdentity.keyId }}
            - name: PASSAGE_SERVICE_KEY_ID
              value: {{ .Values.serviceIdentity.keyId | quote }}
{{- end }}
{{- end }}
{{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
{{- if .Values.serviceIdentity.signingKeySecret }}
          volumeMounts:
            - { name: service-identity, mountPath: /var/run/passage/service-identity, readOnly: true }
{{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
