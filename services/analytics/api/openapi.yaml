openapi: 3.1.0
info:
  title: Passage Analytics API
  version: 1.0.0
  description: Governed metric catalog, row-scoped query planning, daily metric reconciliation, data-quality rules, archive partitions and report schedules (wave 46).
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/analytics/metrics:
    get:
      operationId: listMetrics
      summary: List published governed metrics with their formulas
      x-passage-duty: analytics.view
      responses:
        "200":
          description: Published metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/analytics/query:
    post:
      operationId: planQuery
      summary: Validate a metric query and return the Cube plan with the caller's scope filters applied
      description: Read-only. Measures must be published and share one grain. Ranges are day grain, at most five years.
      x-passage-duty: analytics.view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Compiled plan. An empty result with reason NO_SCOPE when the caller has no legal-entity scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          description: Duty missing, or the model has no security mapping (ANA-0103)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/analytics/query:execute:
    post:
      operationId: executeQuery
      summary: Run a metric query on the semantic layer in the caller's scope (46-3)
      description: >-
        Planned exactly like POST /v1/analytics/query (published metrics, one grain, the caller's legal-entity scope as filters),
        then run on Cube with a short-lived token that carries the tenant and the same scope. Only metrics the Cube model has a
        measure for can run; another published metric is a 400 naming it. A caller with no scope gets an empty result and Cube is
        not called. Amounts are in each ledger's own currency, so the query must include the currency dimension (400 otherwise) and rows come back per currency. Measures come back as decimal strings. Cube not configured or not answering is 503 ANA-0120. At most 10,000 rows.
      x-passage-duty: analytics.view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: The plan that ran and its rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/analytics/reconciliation:
    get:
      operationId: listReconciliations
      summary: Reconciliation results for one day
      x-passage-duty: analytics.finance.view
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: metric
          in: query
          required: false
          description: Restrict to one metric id. Malformed ids are rejected with COM-0001.
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{1,62}$"
      responses:
        "200":
          description: Results for the day, ordered by metric and legal entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/catalog/dq-rules:
    get:
      operationId: listDQRules
      summary: List data-quality rules, filtered by catalog asset, rule type and owner
      x-passage-duty: analytics.catalog.steward
      parameters:
        - name: asset
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*){1,3}$"
        - name: ruleType
          in: query
          required: false
          schema:
            type: string
            enum: [COMPLETENESS, VALIDITY, UNIQUENESS, REFERENTIAL, FRESHNESS]
        - name: owner
          in: query
          required: false
          description: Owner user id; matched case-insensitively.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rules ordered by asset and rule id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DQRulesResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/catalog/dq-rules/scores:
    get:
      operationId: listDQScores
      summary: Data-quality score history, newest first (one row per rule and day)
      x-passage-duty: analytics.catalog.steward
      parameters:
        - name: asset
          in: query
          required: false
          schema:
            type: string
        - name: rule
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{1,62}$"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 366
            default: 90
      responses:
        "200":
          description: Score history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DQScoresResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/catalog/dq-rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/RuleId"
    get:
      operationId: getDQRule
      summary: One data-quality rule; the ETag is its version
      x-passage-duty: analytics.catalog.steward
      responses:
        "200":
          description: The rule
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DQRule"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: putDQRule
      summary: Create a rule (no If-Match) or replace it (If-Match with the current version)
      description: muted=true opens a 7-day mute window (or keeps an open one); a muted rule still scores but does not notify (BR-46.15).
      x-passage-duty: analytics.catalog.steward
      parameters:
        - name: If-Match
          in: header
          required: false
          description: The rule version as an entity tag, for example "3". Required to replace an existing rule.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DQRuleRequest"
      responses:
        "200":
          description: Replaced
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DQRule"
        "201":
          description: Created
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DQRule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "412":
          description: If-Match does not name the current version (ANA-0113)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          description: If-Match missing on a replace (COM-0428)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/archive/partitions:
    get:
      operationId: listArchivePartitions
      summary: Archive partitions, newest period first
      x-passage-duty: analytics.archive.admin
      parameters:
        - name: domain
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{1,62}$"
        - name: period
          in: query
          required: false
          description: Calendar month of the partition.
          schema:
            type: string
            pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, VERIFIED, DROPPED, RESTORED]
      responses:
        "200":
          description: Partitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartitionsResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/archive/partitions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getArchivePartition
      summary: One archive partition with counts, hashes and restore state
      x-passage-duty: analytics.archive.admin
      responses:
        "200":
          description: The partition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchivePartition"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/archive/partitions/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: restoreArchivePartition
      summary: Restore a DROPPED partition into a side table for 30 days
      description: Idempotent by partition id; repeating the request while the restore is live returns the same partition.
      x-passage-duty: analytics.archive.admin
      responses:
        "200":
          description: The restored partition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchivePartition"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: The partition is not DROPPED (ANA-0111)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/analytics/schedules:
    get:
      operationId: listSchedules
      summary: Report schedules by next run
      x-passage-duty: analytics.author
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulesResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSchedule
      summary: Create a schedule; the first run is computed in its time zone
      x-passage-duty: analytics.author
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Replays within 24 hours return the stored response with Idempotency-Replayed true.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequest"
      responses:
        "201":
          description: Created, or the stored response of an earlier identical request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          description: Idempotency-Key reused with a different request (ANA-0114)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/analytics/schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSchedule
      summary: One report schedule
      x-passage-duty: analytics.author
      responses:
        "200":
          description: The schedule
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/analytics/schedules/{id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listScheduleDeliveries
      summary: Delivery attempts of one schedule, newest first (schedule deliveries inquiry)
      description: One row per attempt. The attempts of one scheduled run share runId; a failed attempt is retried after 1, 4 and 16 minutes and the fourth failure is FAILED.
      x-passage-duty: analytics.author
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DELIVERED, RETRY, FAILED]
      responses:
        "200":
          description: Deliveries (at most 200)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveriesResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/analytics/dashboards:
    get:
      operationId: listDashboards
      summary: Dashboard definitions by title
      x-passage-duty: analytics.view
      responses:
        "200":
          description: Dashboards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardsResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/analytics/dashboards/{id}/values:
    parameters:
      - $ref: "#/components/parameters/DashboardId"
    get:
      operationId: getDashboardValues
      summary: The current value of every tile of a dashboard, in the caller's scope (46-3)
      description: >-
        Each tile's metric over its period (MTD, QTD, YTD or the trailing 12 months up to today). A tile that cannot be
        computed does not fail the dashboard: its status says why, OK (value may be null when there are no rows),
        NO_SCOPE (the caller has no legal-entity scope), NOT_MODELLED (the metric has no Cube measure yet) or UNAVAILABLE
        (Cube is not configured or did not answer) or MIXED_CURRENCY (the scope holds amounts in more than one currency, which are never added; no value).
      x-passage-duty: analytics.view
      responses:
        "200":
          description: The tiles with their values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardValues"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/analytics/dashboards/{id}:
    parameters:
      - $ref: "#/components/parameters/DashboardId"
    get:
      operationId: getDashboard
      summary: Dashboard definition and tiles; the ETag is its version
      x-passage-duty: analytics.view
      responses:
        "200":
          description: The dashboard
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: putDashboard
      summary: Create a dashboard (no If-Match) or replace it (If-Match with the current version)
      description: Every tile must name a published governed metric.
      x-passage-duty: analytics.author
      parameters:
        - name: If-Match
          in: header
          required: false
          description: The dashboard version as an entity tag, for example "3". Required to replace an existing dashboard.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardRequest"
      responses:
        "200":
          description: Replaced
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "201":
          description: Created
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "412":
          description: If-Match does not name the current version (ANA-0113)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          description: If-Match missing on a replace (COM-0428)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/analytics/exports:
    get:
      operationId: listExports
      summary: Export log, newest first, filtered by user, format and creation day
      x-passage-duty: analytics.export
      parameters:
        - name: user
          in: query
          required: false
          description: Requesting user id
          schema:
            type: string
            maxLength: 255
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [XLSX, CSV]
        - name: from
          in: query
          required: false
          description: First creation day (UTC), inclusive
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Last creation day (UTC), inclusive
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Export jobs (at most 500)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportsResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createExport
      summary: Start an explorer export job
      description: The query is planned with the caller's data scope exactly like POST /v1/analytics/query. Above 100,000 rows the job runs as a Temporal job; above 1,000,000 rows it is refused (ANA-0101). An identical request by the same user within one hour returns the existing job (BR-46.7); files are deleted 24 hours after creation.
      x-passage-duty: analytics.export
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Replays within 24 hours return the stored response with Idempotency-Replayed true.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: An identical export from the last hour (reused true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          description: Missing duty, or no data scope for the model (ANA-0102)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Over the export row cap (ANA-0101), or Idempotency-Key reused with a different request (ANA-0114)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/catalog/lineage/{asset_fqn}:
    parameters:
      - name: asset_fqn
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*){1,3}$"
    get:
      operationId: getLineage
      summary: Upstream and downstream assets of a catalog asset, nearest first
      x-passage-duty: analytics.catalog.view
      parameters:
        - name: depth
          in: query
          required: false
          description: Hops in each direction; 0 or omitted means 20.
          schema:
            type: integer
            minimum: 0
            maximum: 20
      responses:
        "200":
          description: Lineage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lineage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/catalog/lineage/edges:
    post:
      operationId: addLineageEdges
      summary: Record lineage edges (source feeds target)
      description: Idempotent by edge. Existing edges are kept, so re-sending a batch answers added 0.
      x-passage-duty: analytics.catalog.steward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineageEdgesRequest"
      responses:
        "200":
          description: How many edges were new
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineageEdgesResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/analytics/ux-events:
    post:
      operationId: addUxEvents
      summary: Record UX events from the web app (#510)
      description: >-
        A batch of 1 to 50 events about how people move through a flow. Events carry a random per-tab
        session id and the release, never a user or record id. A search query that looks personal
        (an at sign or seven or more digits) is not kept and is counted in dropped.
      x-passage-duty: analytics.ux.record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UxEventsRequest"
      responses:
        "202":
          description: Events stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UxEventsResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/analytics/ux-funnels:
    get:
      operationId: getUxFunnel
      summary: Sessions by step of a flow, with conversion
      x-passage-duty: analytics.ux.view
      parameters:
        - name: flow
          in: query
          required: true
          schema:
            type: string
            enum: [procure_to_pay, onboarding]
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: release
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The funnel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UxFunnel"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/analytics/ux-signals:
    get:
      operationId: getUxSignals
      summary: Most frequent validation errors, searches with no results and abandoned forms
      x-passage-duty: analytics.ux.view
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: release
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UxSignals"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /healthz:
    get:
      operationId: healthz
      summary: Liveness, no dependency checks
      responses:
        "200":
          description: Alive
  /readyz:
    get:
      operationId: readyz
      summary: Readiness, checks the analytics database
      responses:
        "200":
          description: Ready
        "503":
          description: Database unavailable
components:
  parameters:
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]{1,62}$"
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DashboardId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_-]{1,62}$"
  headers:
    ETag:
      description: The resource version as an entity tag, for example "3"
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: https://passage.dev/problems/COM-0001
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        serviceCode:
          type: string
        traceId:
          type: string
        errors:
          type: object
          description: Field-level messages keyed by request field (measures, dimensions, from, to).
          additionalProperties:
            type: string
    Metric:
      type: object
      required: [metricId, version, name, formula, grain, allowedDimensions, nonFinancial, status]
      properties:
        metricId:
          type: string
        version:
          type: integer
        name:
          type: string
        formula:
          type: string
        grain:
          type: string
          enum: [journal_line, sales_line, resource_shift]
        allowedDimensions:
          type: array
          items:
            type: string
        reconciliationSource:
          type: string
        nonFinancial:
          type: boolean
        status:
          type: string
          enum: [DRAFT, PUBLISHED, DEPRECATED]
    MetricsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
    QueryRequest:
      type: object
      required: [measures, from, to]
      properties:
        measures:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
        dimensions:
          type: array
          maxItems: 8
          items:
            type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    Filter:
      type: object
      required: [member, operator, values]
      properties:
        member:
          type: string
        operator:
          type: string
        values:
          type: array
          items:
            type: string
    Plan:
      type: object
      required: [model, grain, measures, dimensions, from, to, filters]
      properties:
        model:
          type: string
        grain:
          type: string
        measures:
          type: array
          items:
            type: string
        dimensions:
          type: array
          items:
            type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Filter"
        reason:
          type: string
          enum: [NO_SCOPE]
    QueryResponse:
      type: object
      required: [plan]
      properties:
        plan:
          $ref: "#/components/schemas/Plan"
    ExecuteResponse:
      type: object
      required: [plan, rows, rowCount]
      properties:
        plan:
          $ref: "#/components/schemas/Plan"
        rows:
          type: array
          description: One object per row, keyed by measure and dimension name without the model. Measures are decimal strings or null.
          items:
            type: object
            additionalProperties: true
        rowCount:
          type: integer
    TileValue:
      type: object
      required: [title, metric, metricName, period, from, to, status, value]
      properties:
        title:
          type: string
        metric:
          type: string
        metricName:
          type: string
        period:
          type: string
          enum: [MTD, QTD, YTD, TRAILING_12M]
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        status:
          type: string
          enum: [OK, NO_SCOPE, NOT_MODELLED, UNAVAILABLE, MIXED_CURRENCY]
        value:
          type: [string, "null"]
          description: A decimal string; null without a value.
        unit:
          type: string
          enum: [REPORTING_CURRENCY, RATIO]
        currency:
          type: string
          description: The ledger currency of value; absent for a ratio and when there is no value.
    DashboardValues:
      type: object
      required: [dashboardId, title, refreshSeconds, computedAt, tiles]
      properties:
        dashboardId:
          type: string
        title:
          type: string
        refreshSeconds:
          type: integer
        computedAt:
          type: string
          format: date-time
        tiles:
          type: array
          items:
            $ref: "#/components/schemas/TileValue"
    Reconciliation:
      type: object
      description: One metric compared with its source for one legal entity on one day. Amounts are decimal strings.
      required: [metricId, legalEntityId, date, currency, semanticValue, sourceValue, delta, tolerance, status, consecutiveOkDays, trusted]
      properties:
        metricId:
          type: string
        legalEntityId:
          type: string
        date:
          type: string
          format: date
        currency:
          type: string
        semanticValue:
          type: string
        sourceValue:
          type: string
        delta:
          type: string
        tolerance:
          type: string
        status:
          type: string
          enum: [OK, FAILED, BLOCKED]
        consecutiveOkDays:
          type: integer
        trusted:
          type: boolean
    ReconciliationResponse:
      type: object
      required: [date, failedCount, items]
      properties:
        date:
          type: string
          format: date
        failedCount:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Reconciliation"
    DQRule:
      type: object
      required: [ruleId, assetFqn, ruleType, expression, thresholdPct, severity, ownerUserId, status, version]
      properties:
        ruleId:
          type: string
        assetFqn:
          type: string
        ruleType:
          type: string
          enum: [COMPLETENESS, VALIDITY, UNIQUENESS, REFERENTIAL, FRESHNESS]
        expression:
          type: string
          maxLength: 2048
        thresholdPct:
          type: string
          description: Decimal string, 0 to 100 with at most two decimals
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        ownerUserId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, RETIRED]
        muteUntil:
          type: string
          format: date-time
        version:
          type: integer
    DQRuleRequest:
      type: object
      required: [assetFqn, ruleType, expression, severity, ownerUserId]
      properties:
        assetFqn:
          type: string
        ruleType:
          type: string
          enum: [COMPLETENESS, VALIDITY, UNIQUENESS, REFERENTIAL, FRESHNESS]
        expression:
          type: string
          maxLength: 2048
        thresholdPct:
          type: string
          default: "98"
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        ownerUserId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, RETIRED]
          default: ACTIVE
        muted:
          type: boolean
    DQRulesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DQRule"
    DQScore:
      type: object
      required: [assetFqn, ruleId, date, passPct, failedRows, totalRows, below, belowStreak]
      properties:
        assetFqn:
          type: string
        ruleId:
          type: string
        date:
          type: string
          format: date
        passPct:
          type: string
          description: Decimal string, rounded half-even to two decimals
        failedRows:
          type: integer
        totalRows:
          type: integer
        below:
          type: boolean
          description: The exact pass rate is under the rule threshold
        belowStreak:
          type: integer
          description: Consecutive below-threshold evaluations; 3 escalates to the steward
    DQScoresResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DQScore"
    ArchivePartition:
      type: object
      required: [partitionId, domain, tableName, period, rowsOltp, rowsArchive, contentHashOltp, contentHashArchive, status, legalHold, openPeriod]
      properties:
        partitionId:
          type: string
          format: uuid
        domain:
          type: string
        tableName:
          type: string
        period:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        rowsOltp:
          type: integer
        rowsArchive:
          type: integer
        contentHashOltp:
          type: string
        contentHashArchive:
          type: string
        status:
          type: string
          enum: [PENDING, VERIFIED, DROPPED, RESTORED]
        legalHold:
          type: boolean
        openPeriod:
          type: boolean
        movedAt:
          type: string
          format: date-time
        restoreUntil:
          type: string
          format: date-time
    PartitionsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArchivePartition"
    Destination:
      type: object
      required: [type, targets]
      properties:
        type:
          type: string
          enum: [EMAIL, SFTP, INBOX]
        targets:
          type: array
          minItems: 1
          maxItems: 50
          description: E-mail addresses (EMAIL), one sftp:// URL (SFTP) or user ids (INBOX)
          items:
            type: string
    ScheduleRequest:
      type: object
      required: [name, targetType, targetId, cron, timezone, format, destination]
      properties:
        name:
          type: string
          maxLength: 120
        targetType:
          type: string
          enum: [DASHBOARD, QUERY]
        targetId:
          type: string
        cron:
          type: string
          description: Five fields (minute hour day-of-month month day-of-week); L is the last day of the month
          example: 0 6 * * 1
        timezone:
          type: string
          example: Europe/Berlin
        format:
          type: string
          enum: [PDF, XLSX]
        destination:
          $ref: "#/components/schemas/Destination"
    Schedule:
      type: object
      required: [scheduleId, name, targetType, targetId, cron, timezone, format, destination, failureCount, version]
      properties:
        scheduleId:
          type: string
          format: uuid
        name:
          type: string
        targetType:
          type: string
          enum: [DASHBOARD, QUERY]
        targetId:
          type: string
        cron:
          type: string
        timezone:
          type: string
        format:
          type: string
          enum: [PDF, XLSX]
        destination:
          $ref: "#/components/schemas/Destination"
        lastRunAt:
          type: string
          format: date-time
        nextRunAt:
          type: string
          format: date-time
        failureCount:
          type: integer
        version:
          type: integer
    SchedulesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
    Tile:
      type: object
      required: [title, metric, period]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        metric:
          type: string
          description: A published governed metric id
        period:
          type: string
          enum: [MTD, QTD, YTD, TRAILING_12M]
    Dashboard:
      type: object
      required: [dashboardId, title, tiles, refreshSeconds, version]
      properties:
        dashboardId:
          type: string
        title:
          type: string
        tiles:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/Tile"
        refreshSeconds:
          type: integer
          minimum: 15
          maximum: 600
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time
    DashboardRequest:
      type: object
      additionalProperties: false
      required: [title, tiles]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        tiles:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/Tile"
        refreshSeconds:
          type: integer
          minimum: 15
          maximum: 600
          default: 60
    DashboardsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Dashboard"
    Delivery:
      type: object
      required: [deliveryId, scheduleId, runId, attempt, status, format, destinationType, rowCount, bytes, runAt]
      properties:
        deliveryId:
          type: string
          format: uuid
        scheduleId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [DELIVERED, RETRY, FAILED]
        format:
          type: string
          enum: [PDF, XLSX]
        destinationType:
          type: string
          enum: [EMAIL, SFTP, INBOX]
        rowCount:
          type: integer
        bytes:
          type: integer
        error:
          type: string
          maxLength: 500
        runAt:
          type: string
          format: date-time
        retryAt:
          type: string
          format: date-time
    DeliveriesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"
    ExportRequest:
      type: object
      additionalProperties: false
      required: [measures, from, to, format, rowCount]
      properties:
        measures:
          type: array
          items:
            type: string
        dimensions:
          type: array
          items:
            type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        format:
          type: string
          enum: [XLSX, CSV]
        rowCount:
          type: integer
          minimum: 0
          description: Rows the query returns, from the explorer's count
        linkTtlHours:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
    Export:
      type: object
      required: [exportId, requestedBy, queryHash, plan, format, mode, rowCount, linkTtlHours, status, createdAt, linkExpiresAt, deleteAt, reused]
      properties:
        exportId:
          type: string
          format: uuid
        requestedBy:
          type: string
        queryHash:
          type: string
          description: SHA-256 of the user, format and scope-filtered plan
        plan:
          $ref: "#/components/schemas/Plan"
        format:
          type: string
          enum: [XLSX, CSV]
        mode:
          type: string
          enum: [INLINE, TEMPORAL_JOB]
        rowCount:
          type: integer
        linkTtlHours:
          type: integer
        status:
          type: string
          enum: [QUEUED, READY, DELETED]
        createdAt:
          type: string
          format: date-time
        linkExpiresAt:
          type: string
          format: date-time
          description: createdAt plus linkTtlHours, but never after deleteAt (the file is deleted 24 hours after creation, BR-46.7)
        deleteAt:
          type: string
          format: date-time
        reused:
          type: boolean
    ExportsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Export"
    LineageAsset:
      type: object
      required: [fqn, distance]
      properties:
        fqn:
          type: string
        distance:
          type: integer
          minimum: 1
          description: Fewest hops from the asset
    Lineage:
      type: object
      required: [asset, depth, upstream, downstream]
      properties:
        asset:
          type: string
        depth:
          type: integer
        upstream:
          type: array
          items:
            $ref: "#/components/schemas/LineageAsset"
        downstream:
          type: array
          items:
            $ref: "#/components/schemas/LineageAsset"
    Edge:
      type: object
      required: [source, target]
      properties:
        source:
          type: string
        target:
          type: string
    LineageEdgesRequest:
      type: object
      additionalProperties: false
      required: [edges]
      properties:
        edges:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/Edge"
    LineageEdgesResponse:
      type: object
      required: [added]
      properties:
        added:
          type: integer
    UxEvent:
      type: object
      additionalProperties: false
      required: [sessionId, release, type]
      properties:
        sessionId:
          type: string
          pattern: "^[A-Za-z0-9-]{8,64}$"
        release:
          type: string
        type:
          type: string
          enum: [funnel_step, validation_error, search_no_results, form_abandoned]
        flow:
          type: string
          enum: [procure_to_pay, onboarding]
          description: Required for funnel_step
        step:
          type: string
          description: Required for funnel_step; one of the flow's steps
        route:
          type: string
          description: Page path template without a query string; required for validation_error and form_abandoned
        field:
          type: string
          description: Field name, never its value; required for validation_error
        query:
          type: string
          description: Search text; required for search_no_results
        durationMs:
          type: integer
          minimum: 0
        occurredAt:
          type: string
          format: date-time
          description: Used when within the last 24 hours, otherwise the server time
    UxEventsRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/UxEvent"
    UxEventsResponse:
      type: object
      required: [accepted, dropped]
      properties:
        accepted:
          type: integer
        dropped:
          type: integer
    UxFunnelStep:
      type: object
      required: [step, sessions, conversionFromPrevious]
      properties:
        step:
          type: string
        sessions:
          type: integer
        conversionFromPrevious:
          type: number
    UxFunnel:
      type: object
      required: [flow, from, to, steps]
      properties:
        flow:
          type: string
        from:
          type: string
        to:
          type: string
        release:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/UxFunnelStep"
        secondsToLastStep:
          type: number
          description: Median seconds from a session's first event to its last step
    UxSignals:
      type: object
      required: [from, to, validationErrors, noResultSearches, abandonedForms]
      properties:
        from:
          type: string
        to:
          type: string
        release:
          type: string
        validationErrors:
          type: array
          items:
            type: object
            required: [route, field, count]
            properties:
              route:
                type: string
              field:
                type: string
              count:
                type: integer
        noResultSearches:
          type: array
          items:
            type: object
            required: [query, count]
            properties:
              query:
                type: string
              count:
                type: integer
        abandonedForms:
          type: array
          items:
            type: object
            required: [route, count]
            properties:
              route:
                type: string
              count:
                type: integer
