apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-purchasing
  labels:
    app.kubernetes.io/name: purchasing
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: purchasing
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: purchasing
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.serviceIdentity.signingKeySecret }}
      volumes:
        - name: service-identity
          secret:
            secretName: {{ .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
      {{- end }}
      containers:
        - name: purchasing
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          env:
            - name: SERVICE_NAME
              value: purchasing
            - name: HTTP_ADDR
              value: {{ .Values.env.httpAddr | quote }}
            - name: ADMIN_ADDR
              value: {{ .Values.env.adminAddr | quote }}
            - name: MIGRATE_ON_START
              value: {{ .Values.env.migrateOnStart | quote }}
            - name: PASSAGE_SERVICE_NAME
              value: purchasing
            {{- if .Values.serviceIdentity.publicKeys }}
            - name: PASSAGE_SERVICE_PUBLIC_KEYS
              value: {{ .Values.serviceIdentity.publicKeys | quote }}
            {{- end }}
            {{- if .Values.serviceUrls.budgeting }}
            - name: BUDGETING_URL
              value: {{ .Values.serviceUrls.budgeting | quote }}
            {{- end }}
            {{- if .Values.serviceIdentity.signingKeySecret }}
            - name: PASSAGE_SERVICE_SIGNING_KEY_FILE
              value: /var/run/passage/service-identity/signing-key
            {{- if .Values.serviceIdentity.keyId }}
            - name: PASSAGE_SERVICE_KEY_ID
              value: {{ .Values.serviceIdentity.keyId | quote }}
            {{- end }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
          {{- if .Values.serviceIdentity.signingKeySecret }}
          volumeMounts:
            - { name: service-identity, mountPath: /var/run/passage/service-identity, readOnly: true }
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
