apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-purchasing
  labels:
    app.kubernetes.io/name: purchasing
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: purchasing
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: admin
      port: 9090
      targetPort: admin
