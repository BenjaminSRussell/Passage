image:
  repository: ghcr.io/benjaminsrussell/passage/purchasing
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 3

# DATABASE_URL is read from this secret (key "url"); never inline credentials.
database:
  secretName: purchasing-db
  secretKey: url

env:
  httpAddr: ":8080"
  adminAddr: ":9090"
  migrateOnStart: "false"

service:
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceMonitor:
  enabled: false
  interval: 30s
