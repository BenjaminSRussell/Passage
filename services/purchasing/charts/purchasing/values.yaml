image:
  repository: ghcr.io/benjaminsrussell/passage/purchasing
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 3

# DATABASE_URL is read from this secret (key "url"); never inline credentials.
database:
  secretName: purchasing-db
  secretKey: url

# Public keys of the services that call purchasing with a signed service token
# (caller[:kid]=base64 Ed25519 public key, comma separated; not secret). receiving
# reports settled invoicing-plan rows this way (#289).
serviceIdentity:
  publicKeys: ""
  # purchasing signs its calls to budgeting (budget.encumbrance.convert, budget.requisition.check) with this Secret's key "signing-key", mounted at
  # /var/run/passage/service-identity. Add purchasing's public key to budgeting's serviceIdentity.publicKeys first.
  signingKeySecret: ""
  keyId: ""

# Base URLs of the services purchasing calls. budgeting checks an approved requisition and reserves its lines as pre-encumbrances,
# gives them back when it is cancelled, and converts a line's pre-encumbrance when a PO line is created from it (FR-38.5). Unset,
# requisitions are approved unchecked, nothing is converted and purchasing logs a warning at start.
serviceUrls:
  budgeting: ""

env:
  httpAddr: ":8080"
  adminAddr: ":9090"
  migrateOnStart: "false"

service:
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceMonitor:
  enabled: false
  interval: 30s

# The inbound consumer (slice 18): follows fulfillment's dropship.closed.v1 and
# dropship.cancelled.v1 (slice 19) and planning's message.applied.v1 and changes the purchase orders they name. It exits at start until
# service:purchasing-inbound is seeded in the service principal table.
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: purchasing-inbound
    username: purchasing-consumer
    secret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# CronJob running `purchasing budget-calls-retry <tenant-id>...` (FR-38.5): repeats the calls to budgeting that failed (a requisition
# line's pre-encumbrance converted into its PO line's encumbrance, or given back when a requisition was cancelled), the same work as
# POST /v1/procurement/budget-calls:retry. Needs serviceUrls.budgeting and serviceIdentity.signingKeySecret. Tenants are listed
# because the app role cannot enumerate them. The job fails while a tenant still has calls budgeting did not accept.
budgetCallsRetry:
  enabled: false
  schedule: "*/15 * * * *"
  tenantIds: []
