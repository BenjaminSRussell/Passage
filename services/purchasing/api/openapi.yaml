        '404': { description: Not found (PRC-AGR-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/agreements/{id}:activate:
    post:
      operationId: activatePurchaseAgreement
