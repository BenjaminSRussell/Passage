openapi: 3.1.0
info:
  title: Passage Purchasing API
  version: 0.9.0
  description: |
    Wave 17 (PSG-17) slices 1 to 9: purchase requisitions with policy-routed approval,
    consolidation of approved requisition lines into purchase orders, purchase orders
    with agreement and trade-agreement pricing, the purchase order lifecycle (submit,
    approve, reject, confirm, cancel) with versioned change management, purchase
    agreements with release tracking, trade agreements and price lookup, the request
    for quotation cycle (create, send, replies, compare, award to purchase orders) with
    sealed bids and weighted scoring, invoicing plans on purchase order lines, and the
    subsequent price change (reprice) of confirmed purchase orders, and scheduling
    agreements with firm and trade-off zones and FRC/JIT releases with cumulative quantities, and
    the purchasing policy per legal entity (change management default, PO four-eyes, invoice before receipt).
    Slice 13 adds signing limits (FR-17.17): requests, approval, recertification, and the spending and approval
    limit rules on requisition submit and PO approval.
    Slice 15 adds charge codes and auto charges (FR-17.9): a PO charge may name a charge code that supplies its
    calculation, value and debit and credit sides, and applyAutoCharges adds the charges the auto charges give the order.
    Mounted at /v1/procurement. The browser reaches the same paths under /api/v1/procurement
    through the web BFF. Errors are RFC 9457 problem details; see README for codes.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    LegalEntityId:
      name: legalEntityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted version number read from the ETag of the resource.
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LineNo:
      name: lineNo
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 9999 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: The nextCursor of the previous page (the id of its last row). Lists are newest first.
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 problem; `code` names the rule (see README)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    SigningLimit:
      type: object
      required: [id, legalEntityId, workerId, documentType, currency, spendingLimit, approvalLimit, recertifyBy, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        documentType: { type: string, enum: [REQUISITION, PURCHASE_ORDER, INVOICE, EXPENSE] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        spendingLimit: { type: string, description: "Decimal string. What the worker may request before one more approval level is added." }
        approvalLimit: { type: string, description: "Decimal string. What the worker may approve." }
        recertifyBy: { $ref: '#/components/schemas/Day' }
        lastRecertifiedOn: { $ref: '#/components/schemas/Day' }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    SigningLimitPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SigningLimit' } }
        nextCursor: { type: string, format: uuid }
    SigningLimitRequest:
      type: object
      required: [id, legalEntityId, workerId, documentType, currency, spendingLimit, approvalLimit, status, requestedBy, requestedAt, version]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        documentType: { type: string, enum: [REQUISITION, PURCHASE_ORDER, INVOICE, EXPENSE] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        spendingLimit: { type: string }
        approvalLimit: { type: string }
        reason: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        requestedBy: { type: string, format: uuid }
        requestedAt: { type: string, format: date-time }
        decidedBy: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }
        decisionNote: { type: string }
        signingLimitId: { type: string, format: uuid, description: "The limit written by an approval" }
        version: { type: integer, minimum: 1 }
    SigningLimitRequestInput:
      type: object
      required: [legalEntityId, workerId, documentType, currency, spendingLimit, approvalLimit]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        documentType: { type: string, enum: [REQUISITION, PURCHASE_ORDER, INVOICE, EXPENSE] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        spendingLimit: { type: string, description: "Decimal string, zero or more, at most 6 decimals." }
        approvalLimit: { type: string, description: "Decimal string, zero or more, at most 6 decimals." }
        reason: { type: string, maxLength: 1000 }
    SigningLimitRequestPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SigningLimitRequest' } }
        nextCursor: { type: string, format: uuid }
    SigningLimitDecision:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 1000 }
    SigningLimitEvaluation:
      type: object
      required: [expired, requesterEscalates, approverAllowed]
      properties:
        limit: { $ref: '#/components/schemas/SigningLimit' }
        expired: { type: boolean }
        requesterEscalates: { type: boolean, description: "A document of this amount raised by the worker gets one more approval level" }
        approverAllowed: { type: boolean, description: "The worker may approve a document of this amount" }
        code: { type: string, description: "PRC-SL-001 or PRC-SL-002 when approverAllowed is false" }
        detail: { type: string }
    PurchasingPolicy:
      type: object
      required: [legalEntityId, changeManagementDefault, poFourEyes, allowInvoiceBeforeReceipt, categoryAccessMode, version]
      properties:
        legalEntityId: { type: string, format: uuid }
        changeManagementDefault: { type: boolean, description: "changeManagement of a new PO that does not say (default true)" }
        poFourEyes: { type: boolean, description: "a user who created, submitted or last changed a PO cannot approve or confirm it (PRC-POL-002, 403)" }
        allowInvoiceBeforeReceipt: { type: boolean, description: "a PO line quantity may drop below invoiced, never below received (BR-17.7)" }
        categoryAccessMode: { type: string, enum: [HARD, SOFT, OFF], description: "what a vendor with no valid assignment on a restricted procurement category meets: HARD refuses the requisition or PO (PRC-CAT-002), SOFT warns, OFF does not check (FR-17.20; default SOFT)" }
        version: { type: integer, minimum: 0, description: "0 when no policy is saved yet" }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    PurchasingPolicyInput:
      type: object
      required: [changeManagementDefault, poFourEyes, allowInvoiceBeforeReceipt]
      additionalProperties: false
      properties:
        changeManagementDefault: { type: boolean }
        poFourEyes: { type: boolean }
        allowInvoiceBeforeReceipt: { type: boolean }
        categoryAccessMode: { type: string, enum: [HARD, SOFT, OFF], description: "Optional: left out, the saved mode (SOFT for a new policy) stays." }
    CategoryVendorAssignment:
      type: object
      required: [id, legalEntityId, category, vendorId, status, validFrom, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        category: { type: string, maxLength: 200, description: "The procurement category as written on requisition lines and catalog entries" }
        vendorId: { type: string, format: uuid }
        status: { type: string, enum: [APPROVED, PROVISIONAL, BLOCKED] }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        notes: { type: string }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    CategoryVendorAssignmentInput:
      type: object
      required: [legalEntityId, category, vendorId, status]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        category: { type: string, maxLength: 200 }
        vendorId: { type: string, format: uuid }
        status: { type: string, enum: [APPROVED, PROVISIONAL, BLOCKED] }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        notes: { type: string }
    CategoryVendorAssignmentChange:
      type: object
      required: [status]
      additionalProperties: false
      description: Replaces status, window and notes; a left-out validFrom keeps the stored start, a left-out validTo makes the window open.
      properties:
        status: { type: string, enum: [APPROVED, PROVISIONAL, BLOCKED] }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        notes: { type: string }
    CategoryVendorAssignmentPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CategoryVendorAssignment' } }
        nextCursor: { type: string, format: uuid }
    ChargeCode:
      type: object
      required: [id, legalEntityId, code, name, calc, defaultValue, debitType, creditType, allocationRule, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9_-]{1,20}$' }
        name: { type: string, maxLength: 200 }
        calc: { type: string, enum: [FIXED, PER_UNIT, PERCENT] }
        defaultValue: { $ref: '#/components/schemas/Money' }
        debitType: { type: string, enum: [ITEM, LEDGER, VENDOR], description: "ITEM capitalizes into inventory cost, LEDGER books to debitAccountId, VENDOR charges vendorId." }
        creditType: { type: string, enum: [LEDGER, VENDOR], description: "LEDGER credits creditAccountId; VENDOR is payable to vendorId, or to the PO vendor when none." }
        debitAccountId: { type: string, format: uuid }
        creditAccountId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        allocationRule: { type: string, enum: [QTY, AMOUNT, LINES] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    ChargeCodeInput:
      type: object
      required: [legalEntityId, code, name, calc]
      additionalProperties: false
      description: On PUT only name, calc, defaultValue, the sides, allocationRule and status are read; legalEntityId and code are ignored because a code does not change. Left-out fields take the defaults below, so a PUT replaces them.
      properties:
        legalEntityId: { type: string, format: uuid }
        code: { type: string, description: "Trimmed and upper-cased; 1 to 20 characters of A-Z, 0-9, _ and -." }
        name: { type: string, maxLength: 200 }
        calc: { type: string, enum: [FIXED, PER_UNIT, PERCENT] }
        defaultValue: { $ref: '#/components/schemas/Money', description: "Default 0; at most 100 for PERCENT." }
        debitType: { type: string, enum: [ITEM, LEDGER, VENDOR], default: ITEM }
        creditType: { type: string, enum: [LEDGER, VENDOR], default: VENDOR }
        debitAccountId: { type: string, format: uuid, description: "A wave 11 ledger account; required for a LEDGER debit and refused for another debit. Not checked against the chart of accounts yet." }
        creditAccountId: { type: string, format: uuid, description: "A wave 11 ledger account; required for a LEDGER credit and refused for a VENDOR credit. Not checked against the chart of accounts yet." }
        vendorId: { type: string, format: uuid, description: "Required for a VENDOR debit (which then needs a LEDGER credit); optional for a VENDOR credit, which is payable to this vendor instead of the PO vendor; refused when neither side is VENDOR." }
        allocationRule: { type: string, enum: [QTY, AMOUNT, LINES], default: AMOUNT }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
    InboundChange:
      type: object
      description: >-
        One change another service asked of a purchase order (slice 18): a planning message a planner applied, or the closed
        remainder or cancellation of a drop-ship. APPLIED means the line moved (as version versionNo, waiting for re-approval when
        reapprovalRequired); REFUSED means a purchasing rule stopped it and reason says which, for a buyer to settle (slice 19:
        acknowledge it, or retry it once the cause is fixed); IGNORED means there was nothing to change.
      required: [id, legalEntityId, source, sourceKey, eventId, action, status, reapprovalRequired, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        source: { type: string, enum: [PLANNING_MESSAGE, DROPSHIP_CLOSED, DROPSHIP_CANCELLED] }
        sourceKey: { type: string, description: 'The planning message id; the drop-ship id and its running closed total (<drop-ship id>:<qty_closed>) for a closing; the drop-ship id for a cancellation. The idempotency key.' }
        eventId: { type: string, description: Id of the event that carried the request. }
        action: { type: string, description: 'postpone, advance, cancel, decrease or increase for a planning message; close-remainder for a closed drop-ship; cancel-dropship for a cancelled one.' }
        purchaseOrderId: { type: string, format: uuid }
        poNumber: { type: string, example: PO-00000001 }
        lineNo: { type: integer, minimum: 1 }
        lineId: { type: string, format: uuid, description: The id of the PO line. }
        productId: { type: string, format: uuid }
        status: { type: string, enum: [APPLIED, REFUSED, IGNORED] }
        reasonCode: { type: string, description: 'Why the change was refused or ignored: a PRC-PO-* or PRC-AGR-* code of the PO edit, or PRC-INB-001 to PRC-INB-007 (not applicable, no line, ambiguous line, quantity, date, order state, no change).' }
        reason: { type: string }
        requestedQty: { $ref: '#/components/schemas/Money', description: 'The message quantity of a planning message; for a closed drop-ship, the quantity this closing adds to the closings already recorded; for a cancelled one, the ordered quantity less what was confirmed or closed before.' }
        requestedDate: { type: string, format: date }
        qtyBefore: { $ref: '#/components/schemas/Money' }
        qtyAfter: { $ref: '#/components/schemas/Money' }
        dateBefore: { type: string, format: date }
        dateAfter: { type: string, format: date }
        versionNo: { type: integer, minimum: 1, description: The PO version the change went into. }
        reapprovalRequired: { type: boolean }
        requestedBy: { type: string, description: The planner who applied the message. }
        note: { type: string, description: "The planner's reason, or the drop-ship number." }
        createdAt: { type: string, format: date-time }
        warehouseId: { type: string, format: uuid, description: The planning scope of a planning message; kept so a retry plans the same lines. }
        attempts: { type: integer, minimum: 1, description: "The runs of the request so far, the consumer's first run and every retry." }
        resolution: { type: string, enum: [ACKNOWLEDGED, RETRIED], description: 'How a refused change was settled; absent while it waits. A retried change shows the retry''s outcome in status.' }
        resolvedBy: { type: string, description: The user who acknowledged or retried the change. }
        resolvedAt: { type: string, format: date-time }
        resolutionNote: { type: string, description: "The buyer's note, at most 1000 characters." }
    InboundChangeDecision:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 1000, description: "Why the buyer acknowledged the change, or what was fixed before the retry." }
    InboundChangePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InboundChange' } }
        nextCursor: { type: string, format: uuid }
    ChargeCodePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ChargeCode' } }
        nextCursor: { type: string, format: uuid }
    AutoCharge:
      type: object
      required: [id, legalEntityId, chargeCodeId, accountCode, validFrom, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        chargeCodeId: { type: string, format: uuid }
        accountCode: { type: string, enum: [VENDOR, GROUP, ALL] }
        accountId: { type: string, format: uuid, description: "The vendor or vendor group; absent for ALL." }
        value: { $ref: '#/components/schemas/Money', description: "Overrides the charge code's default value." }
        minOrderAmount: { $ref: '#/components/schemas/Money', description: "Applies only to POs in currency whose lines total at least this after discount and before any charge." }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    AutoChargeInput:
      type: object
      required: [legalEntityId, chargeCodeId, accountCode]
      additionalProperties: false
      description: On PUT only value, minOrderAmount, currency, validFrom, validTo and status are read and replace the stored ones; the charge code and the key do not change.
      properties:
        legalEntityId: { type: string, format: uuid }
        chargeCodeId: { type: string, format: uuid, description: "An ACTIVE charge code of the same legal entity (PRC-CHG-004)." }
        accountCode: { type: string, enum: [VENDOR, GROUP, ALL] }
        accountId: { type: string, format: uuid, description: "Required for VENDOR and GROUP, empty for ALL." }
        value: { $ref: '#/components/schemas/Money' }
        minOrderAmount: { $ref: '#/components/schemas/Money', description: "Needs currency." }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: "Required for a FIXED or PER_UNIT charge code (an amount of money) and with minOrderAmount." }
        validFrom: { $ref: '#/components/schemas/Day', description: "Defaults to today." }
        validTo: { $ref: '#/components/schemas/Day' }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
    AutoChargePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AutoCharge' } }
        nextCursor: { type: string, format: uuid }
    CategoryManager:
      type: object
      required: [id, legalEntityId, category, workerId, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        category: { type: string, maxLength: 200 }
        workerId: { type: string, format: uuid }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    CategoryManagerInput:
      type: object
      required: [legalEntityId, category, workerId]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        category: { type: string, maxLength: 200 }
        workerId: { type: string, format: uuid }
    CategoryManagerPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CategoryManager' } }
        nextCursor: { type: string, format: uuid }
    Money:
      type: string
      description: Decimal string, never a float.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    Day:
      type: string
      format: date
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: "https://passage.dev/problems/PRC-PRICE-001" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    RequisitionLineInput:
      type: object
      required: [qty, unit, requestedDate]
      properties:
        productId: { type: string, format: uuid }
        description: { type: string }
        category: { type: string }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        estimatedUnitPrice: { $ref: '#/components/schemas/Money' }
        requestedDate: { $ref: '#/components/schemas/Day' }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid, description: "Warehouse the line is wanted in. Consolidation puts lines of different sites or warehouses on different POs, and the PO line is delivered there." }
        preferredVendorId: { type: string, format: uuid, description: "With productId and no estimate, the estimate defaults from this vendor's trade agreement." }
        catalogEntryId: { type: string, format: uuid, description: "Pick the line from a PUBLISHED catalog entry (FR-17.18): blank product, description, category, unit, estimate and preferred vendor take the entry's values; a different unit, product or category is refused (COM-0001). 422 PRC-CAT-004 when the catalog is not published to the legal entity and unit today, PRC-CAT-006 when its currency differs." }
    RequisitionInput:
      type: object
      required: [legalEntityId, currency, lines]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        operatingUnitId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/RequisitionLineInput' }
    RequisitionLine:
      type: object
      properties:
        id: { type: string, format: uuid, description: "Referenced by PO lines as requisitionLineId." }
        lineNo: { type: integer }
        productId: { type: string, format: uuid }
        description: { type: string }
        category: { type: string }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        estimatedUnitPrice: { $ref: '#/components/schemas/Money' }
        amount: { $ref: '#/components/schemas/Money' }
        requestedDate: { $ref: '#/components/schemas/Day' }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        preferredVendorId: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, CONSOLIDATED, CANCELLED] }
        purchaseOrderId: { type: string, format: uuid, description: "Set when CONSOLIDATED: the PO that orders the line." }
        purchaseOrderLineNo: { type: integer, description: "Set when CONSOLIDATED: the PO line that orders the line." }
        catalogEntryId: { type: string, format: uuid, description: "The catalog entry the line was picked from; absent on a non-catalog line." }
        splitFromLineId: { type: string, format: uuid, description: "The line this one was cut out of by a split (FR-17.3); absent on a line as entered." }
    RequisitionLineSplitInput:
      type: object
      required: [quantities]
      properties:
        quantities:
          type: array
          minItems: 1
          maxItems: 20
          description: "One new line per quantity, each above zero with at most 6 decimals; together they must leave a quantity above zero on the original line."
          items: { type: string, description: "Decimal quantity string in the line's unit, never a float.", pattern: '^[0-9]+(\.[0-9]{1,6})?$', example: "40" }
    Requisition:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: "PR-000001" }
        legalEntityId: { type: string, format: uuid }
        operatingUnitId: { type: string, format: uuid }
        requesterId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CLOSED, CANCELLED] }
        currency: { type: string }
        total: { $ref: '#/components/schemas/Money' }
        approverChain:
          type: array
          items: { type: string, enum: [MANAGER, CATEGORY_OWNER, CFO] }
        policyVersion: { type: string }
        version: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/RequisitionLine' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        warnings:
          type: array
          description: PRC-REQ-003 on create when a line's estimate stayed 0; on submit, PRC-CAT-002 (SOFT category access) and PRC-CAT-010 (PROVISIONAL vendor assignment) per line.
          items:
            type: object
            properties:
              code: { type: string, example: PRC-REQ-003 }
              lineNo: { type: integer }
              detail: { type: string }
    RequisitionSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        legalEntityId: { type: string, format: uuid }
        requesterId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CLOSED, CANCELLED] }
        currency: { type: string }
        total: { $ref: '#/components/schemas/Money' }
        lineCount: { type: integer }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    RequisitionPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RequisitionSummary' } }
        nextCursor: { type: string, format: uuid }
    PriceChargeInput:
      type: object
      description: A header charge. Give calc and value, or a chargeCodeId whose calc and default value apply (a value given then overrides the default; a calc given must be the code's).
      properties:
        chargeCodeId: { type: string, format: uuid, description: "An ACTIVE charge code of the PO's legal entity (PRC-CHG-004 otherwise). The code's debit and credit sides, vendor and allocation rule are copied to the charge." }
        calc: { type: string, enum: [FIXED, PER_UNIT, PERCENT] }
        value: { $ref: '#/components/schemas/Money' }
    PurchaseOrderLineInput:
      type: object
      required: [qty, unit, deliveryDate]
      properties:
        lineNo: { type: integer, minimum: 1, description: "PATCH only: the existing line this entry changes; omit for a new line. Ignored on create." }
        productId: { type: string, format: uuid }
        description: { type: string }
        category: { type: string, maxLength: 200, description: "Procurement category the category access rule checks against the PO vendor (FR-17.20, PRC-CAT-002). A line that orders a requisition line takes that line's category (another value is refused); on PATCH an existing line keeps its category (another value is refused) and only added lines are checked. Under HARD a line with neither productId nor category is refused (COM-0001); a product line without a category is not checked." }
        siteId: { type: string, format: uuid, description: "Site the line is delivered to. Omitted, a new line goes where the PO header does; on PATCH an existing line keeps its destination (and follows the header if it did). Changing it on a line with receipts is refused (COM-0001)." }
        warehouseId: { type: string, format: uuid, description: "Warehouse the line is delivered to; same defaults as siteId. Versioned: a change on a confirmed PO shows in the version patch as /lines/<i>/warehouseId." }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        unitPrice: { $ref: '#/components/schemas/Money', description: "Omit to take the trade agreement price (on PATCH, an existing line with the same product and unit keeps its price)." }
        priceUnit: { $ref: '#/components/schemas/Money' }
        discountPct: { $ref: '#/components/schemas/Money' }
        taxAmount: { $ref: '#/components/schemas/Money', description: "Tax from the wave 13 engine; supplied by the caller in this slice." }
        deliveryDate: { $ref: '#/components/schemas/Day' }
        requisitionLineId: { type: string, format: uuid, description: "An OPEN line of an APPROVED requisition of the same legal entity; it becomes CONSOLIDATED." }
        agreementLineId: { type: string, format: uuid, description: "Releases the line against this purchase agreement line (FR-17.5, BR-17.10). Its price is used when the agreement line has priceOverride." }
    PurchaseOrderInput:
      type: object
      required: [legalEntityId, vendorId, currency, lines]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        changeManagement: { type: boolean, default: true }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PurchaseOrderLineInput' }
        charges:
          type: array
          items: { $ref: '#/components/schemas/PriceChargeInput' }
        applyAutoCharges:
          type: boolean
          default: false
          description: "Adds, after the charges given, the charge of every ACTIVE auto charge valid today that applies to the vendor (or its group), the PO currency (an auto charge in another currency is skipped) and the minimum order amount (compared with the lines after discount, before any charge), once per charge code and at most 20 (FR-17.9). A code already among the charges, or one an auto charge added to the PO before (autoChargeCodes), is not added again, so a charge the buyer removed stays removed. The charges count towards the total that approval and signing limits check."
    PurchaseOrderLine:
      type: object
      properties:
        id: { type: string, format: uuid, description: "The line's stable id (slice 18): the purchase_order_line_id a drop-ship names. Set by the service; ignored on a write." }
        lineNo: { type: integer }
        productId: { type: string, format: uuid }
        description: { type: string }
        category: { type: string, description: "Procurement category of the line (FR-17.20); absent when none." }
        siteId: { type: string, format: uuid, description: "Site the line is delivered to: its own, else the PO's." }
        warehouseId: { type: string, format: uuid, description: "Warehouse the line is delivered to: its own, else the PO's." }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        unitPrice: { $ref: '#/components/schemas/Money' }
        priceUnit: { $ref: '#/components/schemas/Money' }
        discountPct: { $ref: '#/components/schemas/Money' }
        grossAmount: { $ref: '#/components/schemas/Money' }
        discountAmount: { $ref: '#/components/schemas/Money' }
        lineAmount: { $ref: '#/components/schemas/Money' }
        taxAmount: { $ref: '#/components/schemas/Money' }
        deliveryDate: { $ref: '#/components/schemas/Day' }
        priceSource: { type: string, description: "MANUAL, AGREEMENT:<agreement line id>, TRADE_AGREEMENT:<id> or REQUISITION_ESTIMATE" }
        requisitionLineId: { type: string, format: uuid }
        agreementLineId: { type: string, format: uuid }
        receivedQty: { $ref: '#/components/schemas/Money', description: "Written by receiving (wave 18); a quantity cannot drop below it (PRC-PO-007)." }
        invoicedQty: { $ref: '#/components/schemas/Money', description: "Written by payables (wave 18)." }
        status: { type: string, enum: [OPEN, RECEIVED, INVOICED, CANCELLED] }
        invoicedRepriceSource: { type: string, description: "TRADE_AGREEMENT:<id> a reprice run last handed to payables for this invoiced line (FR-17.22, BR-17.18); absent when none." }
    PatchOp:
      type: object
      required: [op, path]
      properties:
        op: { type: string, enum: [add, remove, replace] }
        path: { type: string, example: /lines/0/qty }
        value: {}
    PurchaseOrderVersion:
      type: object
      required: [versionNo, reapprovalRequired, createdAt, patch, snapshot]
      properties:
        versionNo: { type: integer, minimum: 1 }
        confirmedAt: { type: string, format: date-time, description: "Absent while the version waits for re-approval." }
        confirmedBy: { type: string, format: uuid }
        reapprovalRequired: { type: boolean }
        createdAt: { type: string, format: date-time }
        patch:
          type: array
          description: RFC 6902 diff from the previous version's snapshot; empty for version 1.
          items: { $ref: '#/components/schemas/PatchOp' }
        snapshot:
          type: object
          description: The commercial content at this version. Lines are in line number order and keep cancelled lines, so /lines/n names the same line in every version.
          properties:
            currency: { type: string }
            total: { $ref: '#/components/schemas/Money' }
            lines:
              type: array
              items:
                type: object
                properties:
                  lineNo: { type: integer }
                  productId: { type: string, format: uuid }
                  description: { type: string }
                  qty: { $ref: '#/components/schemas/Money' }
                  unit: { type: string }
                  unitPrice: { $ref: '#/components/schemas/Money' }
                  priceUnit: { $ref: '#/components/schemas/Money' }
                  discountPct: { $ref: '#/components/schemas/Money' }
                  lineAmount: { $ref: '#/components/schemas/Money' }
                  taxAmount: { $ref: '#/components/schemas/Money' }
                  deliveryDate: { $ref: '#/components/schemas/Day' }
                  status: { type: string, enum: [OPEN, CANCELLED] }
            charges:
              type: array
              items:
                type: object
                properties:
                  calc: { type: string, enum: [FIXED, PER_UNIT, PERCENT] }
                  value: { $ref: '#/components/schemas/Money' }
                  amount: { $ref: '#/components/schemas/Money' }
    PurchaseOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: "PO-000001" }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        currency: { type: string }
        approvalStatus: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CONFIRMED, FINALIZED, CANCELLED] }
        documentStatus: { type: string, enum: [NONE, RECEIVED_PARTIAL, RECEIVED, INVOICED_PARTIAL, INVOICED] }
        versionNo: { type: integer }
        changeManagement: { type: boolean }
        subtotal: { $ref: '#/components/schemas/Money' }
        discountTotal: { $ref: '#/components/schemas/Money' }
        chargesTotal: { $ref: '#/components/schemas/Money' }
        taxTotal: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money', description: "Equals subtotal − discountTotal + chargesTotal + taxTotal." }
        rowVersion: { type: integer }
        createdBy: { type: string, format: uuid, description: "user who created the PO; absent on POs from before it was recorded" }
        submittedBy: { type: string, format: uuid, description: "user who last submitted the PO" }
        changedBy: { type: string, format: uuid, description: "user who last edited or repriced the PO's content" }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PurchaseOrderLine' }
        charges:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              calc: { type: string }
              value: { $ref: '#/components/schemas/Money' }
              amount: { $ref: '#/components/schemas/Money' }
              chargeCodeId: { type: string, format: uuid }
              chargeCode: { type: string, description: "The code string the charge was entered with; absent for a charge without a code." }
              debitType: { type: string, enum: [ITEM, LEDGER, VENDOR], description: "Copied from the charge code when entered; ITEM for a charge without one." }
              creditType: { type: string, enum: [LEDGER, VENDOR] }
              debitAccountId: { type: string, format: uuid }
              creditAccountId: { type: string, format: uuid }
              vendorId: { type: string, format: uuid, description: "The vendor a VENDOR side is payable to; the PO vendor when absent." }
              allocationRule: { type: string, enum: [QTY, AMOUNT, LINES], description: "How wave 18 allocates the charge to lines at invoice time." }
              auto: { type: boolean, description: "True when an auto charge added the charge." }
        autoChargeCodes:
          type: array
          description: The charge codes auto charges have added to the PO (FR-17.9); applyAutoCharges does not add them again. The set only grows.
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        warnings:
          type: array
          description: "Returned on create and PATCH only: PRC-AGR-004 (create) when a release takes an agreement line to the threshold or over a SOFT limit; PRC-CAT-002 under SOFT category access and PRC-CAT-010 for a PROVISIONAL vendor (FR-17.20) for the lines checked."
          items: { $ref: '#/components/schemas/Warning' }
    Warning:
      type: object
      properties:
        code: { type: string, example: PRC-AGR-004 }
        lineNo: { type: integer }
        detail: { type: string }
    PurchaseOrderSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        currency: { type: string }
        approvalStatus: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CONFIRMED, FINALIZED, CANCELLED] }
        documentStatus: { type: string, enum: [NONE, RECEIVED_PARTIAL, RECEIVED, INVOICED_PARTIAL, INVOICED] }
        total: { $ref: '#/components/schemas/Money' }
        lineCount: { type: integer }
        rowVersion: { type: integer }
        createdAt: { type: string, format: date-time }
    PurchaseOrderPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PurchaseOrderSummary' } }
        nextCursor: { type: string, format: uuid }
    SourcingLine:
      description: An OPEN line of an APPROVED requisition, with the header facts consolidation needs.
      allOf:
        - $ref: '#/components/schemas/RequisitionLine'
        - type: object
          properties:
            requisitionId: { type: string, format: uuid }
            requisitionNumber: { type: string }
            requisitionStatus: { type: string }
            legalEntityId: { type: string, format: uuid }
            currency: { type: string }
            requisitionVersion: { type: integer, description: "The requisition's version, the If-Match value of a split." }
    OpenOrderLine:
      type: object
      description: "Open supply: a line of a CONFIRMED purchase order with quantity still to receive."
      required: [purchaseOrderId, number, lineNo, legalEntityId, vendorId, unit, qty, receivedQty, openQty, deliveryDate]
      properties:
        purchaseOrderId: { type: string, format: uuid }
        number: { type: string, example: "PO-00000001" }
        lineNo: { type: integer }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        description: { type: string }
        siteId: { type: string, format: uuid, description: "Effective delivery site of the line." }
        warehouseId: { type: string, format: uuid, description: "Effective delivery warehouse of the line." }
        unit: { type: string }
        qty: { $ref: '#/components/schemas/Money' }
        receivedQty: { $ref: '#/components/schemas/Money' }
        openQty: { $ref: '#/components/schemas/Money', description: "qty - receivedQty, always positive." }
        deliveryDate: { $ref: '#/components/schemas/Day' }
        confirmedDate: { $ref: '#/components/schemas/Day', description: "Earliest vendor-confirmed date among the line's delivery schedule rows, when any is confirmed." }
    OpenOrderLinePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OpenOrderLine' } }
        nextCursor: { type: string, description: "Opaque cursor of the last row, '<date>|<po id>|<line no>'; pass it back as cursor." }
    VendorOpenOrders:
      type: object
      description: "Open CONFIRMED purchase orders of one vendor in one currency."
      required: [vendorId, currency, orderCount, lineCount, openValue, overdueLines, overdueValue, earliestDue]
      properties:
        vendorId: { type: string, format: uuid }
        currency: { type: string, example: USD }
        orderCount: { type: integer, description: Purchase orders with an open line }
        lineCount: { type: integer, description: Open lines }
        openValue: { type: string, description: "Line amount pro rata to the quantity still to receive, in the order currency, the sum rounded half to even to the currency's minor units", example: "1250.00" }
        overdueLines: { type: integer, description: Open lines with a due date before asOf }
        overdueValue: { type: string, description: "Open value of the overdue lines, rounded like openValue", example: "300.00" }
        earliestDue: { $ref: '#/components/schemas/Day', description: "Earliest due date of the open lines (the vendor-confirmed date, else the requested date)" }
    VendorOpenOrdersPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VendorOpenOrders' } }
        nextCursor: { type: string, description: "Opaque cursor, '<vendor id>|<currency>'; pass it back as cursor." }
    OverdueLine:
      description: "An open line past its due date: every OpenOrderLine field (deliveryDate is the requested date; confirmedDate is the vendor's confirmed date of the schedule row the line waits on) plus due date, currency, days late and open value."
      allOf:
        - { $ref: '#/components/schemas/OpenOrderLine' }
        - type: object
          required: [dueDate, currency, daysLate, openValue]
          properties:
            dueDate: { $ref: '#/components/schemas/Day', description: "The date the line is due: with a delivery schedule, the first row the received quantity does not cover, at its vendor-confirmed date or else its own date; without one, the line's delivery date" }
            currency: { type: string, example: USD }
            daysLate: { type: integer, description: Days between the due date and asOf }
            openValue: { type: string, description: "Line amount pro rata to the open quantity, rounded half to even to the currency's minor units", example: "300.00" }
    OverdueLinePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OverdueLine' } }
        nextCursor: { type: string, description: "Opaque cursor, '<due date>|<po id>|<line no>'; pass it back as cursor." }
    PriceHistoryEntry:
      type: object
      description: "A priced line of an approved purchase order for one product."
      required: [purchaseOrderId, number, lineNo, orderDate, vendorId, currency, unit, qty, unitPrice, priceUnit, discountPct, priceSource]
      properties:
        purchaseOrderId: { type: string, format: uuid }
        number: { type: string, example: "PO-00000001" }
        lineNo: { type: integer }
        orderDate: { $ref: '#/components/schemas/Day' }
        vendorId: { type: string, format: uuid }
        currency: { type: string, example: USD }
        unit: { type: string, example: EA }
        qty: { type: string, example: "100" }
        unitPrice: { type: string, example: "9.50" }
        priceUnit: { type: string, description: Quantity the unit price is quoted for, example: "1" }
        discountPct: { type: string, example: "0" }
        priceSource: { type: string, description: "Where the price came from (for example TRADE_AGREEMENT, AGREEMENT, MANUAL)" }
        agreementLineId: { type: string, format: uuid, description: "Purchase agreement line the quantity was drawn against, when any" }
    PriceHistoryPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PriceHistoryEntry' } }
        nextCursor: { type: string, description: "Opaque cursor, '<created at>|<po id>|<line no>'; pass it back as cursor." }
    SourcingLinePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SourcingLine' } }
        nextCursor: { type: string, format: uuid }
    ConsolidationInput:
      type: object
      required: [lines]
      additionalProperties: false
      properties:
        windowDays: { type: integer, minimum: 1, maximum: 60, default: 7, description: "Delivery window: a PO holds lines requested less than windowDays after its earliest line." }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [requisitionLineId]
            additionalProperties: false
            properties:
              requisitionLineId: { type: string, format: uuid }
              vendorId: { type: string, format: uuid, description: "Buyer override; defaults to the line's preferred vendor." }
              agreementLineId: { type: string, format: uuid }
    ConsolidationResult:
      type: object
      properties:
        purchaseOrders:
          type: array
          items: { $ref: '#/components/schemas/PurchaseOrder' }
        warnings:
          type: array
          description: SOFT category access findings (PRC-CAT-002) and PROVISIONAL vendor assignments (PRC-CAT-010); lineNo is the position in the request.
          items: { $ref: '#/components/schemas/Warning' }
    PurchaseAgreementLineInput:
      type: object
      required: [commitmentType]
      additionalProperties: false
      properties:
        commitmentType: { type: string, enum: [QUANTITY, VALUE, CATEGORY_VALUE, TOTAL_VALUE] }
        productId: { type: string, format: uuid, description: "Required for QUANTITY and VALUE." }
        category: { type: string, description: "Required for CATEGORY_VALUE." }
        unit: { type: string, description: "Required for QUANTITY." }
        committedQty: { $ref: '#/components/schemas/Money', description: "Positive for QUANTITY." }
        committedAmount: { $ref: '#/components/schemas/Money', description: "Positive for VALUE, CATEGORY_VALUE and TOTAL_VALUE." }
        unitPrice: { $ref: '#/components/schemas/Money' }
        discountPct: { $ref: '#/components/schemas/Money' }
        maxEnforced: { type: string, enum: [HARD, SOFT, NONE], default: HARD }
        priceOverride: { type: boolean, description: "QUANTITY or VALUE only; the unit price then replaces trade agreement prices on releases." }
    PurchaseAgreementInput:
      type: object
      required: [legalEntityId, vendorId, currency, validFrom, lines]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { type: string, enum: [DRAFT, EFFECTIVE], default: EFFECTIVE }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/PurchaseAgreementLineInput' }
    PurchaseAgreementLine:
      type: object
      properties:
        id: { type: string, format: uuid, description: "Referenced by PO lines as agreementLineId." }
        lineNo: { type: integer }
        commitmentType: { type: string, enum: [QUANTITY, VALUE, CATEGORY_VALUE, TOTAL_VALUE] }
        productId: { type: string, format: uuid }
        category: { type: string }
        unit: { type: string }
        committedQty: { $ref: '#/components/schemas/Money' }
        committedAmount: { $ref: '#/components/schemas/Money' }
        unitPrice: { $ref: '#/components/schemas/Money' }
        discountPct: { $ref: '#/components/schemas/Money' }
        maxEnforced: { type: string, enum: [HARD, SOFT, NONE] }
        priceOverride: { type: boolean }
        releasedQty: { $ref: '#/components/schemas/Money' }
        releasedAmount: { $ref: '#/components/schemas/Money' }
        pctReleased: { $ref: '#/components/schemas/Money', description: "Released as a percentage of committed, on the quantity for QUANTITY and the amount otherwise." }
        remaining: { $ref: '#/components/schemas/Money', description: "Committed minus released on the same measure; negative after a SOFT or NONE overrun." }
    AgreementRelease:
      type: object
      properties:
        agreementLineId: { type: string, format: uuid }
        purchaseOrderId: { type: string, format: uuid }
        purchaseOrderNumber: { type: string }
        lineNo: { type: integer }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        lineAmount: { $ref: '#/components/schemas/Money' }
        deliveryDate: { $ref: '#/components/schemas/Day' }
        approvalStatus: { type: string }
        createdAt: { type: string, format: date-time }
    PurchaseAgreement:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: "PA-00000001" }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        currency: { type: string }
        status: { type: string, enum: [DRAFT, EFFECTIVE, ON_HOLD, CLOSED] }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        version: { type: integer }
        lines: { type: array, items: { $ref: '#/components/schemas/PurchaseAgreementLine' } }
        releases: { type: array, items: { $ref: '#/components/schemas/AgreementRelease' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PurchaseAgreementSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        currency: { type: string }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        status: { type: string, enum: [DRAFT, EFFECTIVE, ON_HOLD, CLOSED] }
        lineCount: { type: integer }
        maxPctReleased: { $ref: '#/components/schemas/Money', description: "Highest release percentage across the lines." }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    SchedulingAgreementProfile:
      type: object
      additionalProperties: false
      description: Release profile (PRD 3.17.13 sa_release_profile). Omitted fields take the default FRC 90 / JIT 14 / firm 14 / trade-off 28 days, WEEKLY.
      properties:
        frcHorizonDays: { type: integer, minimum: 0, maximum: 3660 }
        jitHorizonDays: { type: integer, minimum: 0, maximum: 3660 }
