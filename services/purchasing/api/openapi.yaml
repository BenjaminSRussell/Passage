        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        currency: { type: string }
        unit: { type: string }
        unitPrice: { $ref: '#/components/schemas/Money' }
        targetQty: { $ref: '#/components/schemas/Money' }
        scheduledQty: { $ref: '#/components/schemas/Money', description: "Σ schedule quantity." }
        receivedQty: { $ref: '#/components/schemas/Money', description: "Σ received quantity." }
