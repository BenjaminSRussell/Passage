          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoicingPlanResult' }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND) or the line has no plan (PRC-IP-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Bad id or line number (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    put:
      operationId: putInvoicingPlan
      x-passage-duty: PurchaseOrderMaintain
      summary: Replace the invoicing plan of one PO line, rows generated from the line amount (FR-17.21, BR-17.17; duty PurchaseOrderMaintain)
      description: >-
        If-Match is the PO row version; the write bumps it and the answer's ETag is the new one. A later PO edit
        that changes the line amount reproportions the open rows (BR-17.17) and cancelling the line removes the plan.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/LineNo' }
        - { $ref: '#/components/parameters/IfMatch' }
