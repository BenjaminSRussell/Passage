        '422': { description: Bad id or line number (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    put:
      operationId: putInvoicingPlan
      x-passage-duty: procurement.purchase-order.maintain
      summary: Replace the invoicing plan of one PO line, rows generated from the line amount (FR-17.21, BR-17.17; duty procurement.purchase-order.maintain)
      description: >-
        If-Match is the PO row version; the write bumps it and the answer's ETag is the new one. A later PO edit
