        candidates:
          type: array
          items:
            type: object
            properties:
              agreementId: { type: string, format: uuid }
              specificity: { type: integer }
              matched: { type: boolean }
              rank: { type: integer }
              reason: { type: string }
    RFQLineInput:
      type: object
      required: [qty, unit]
      description: A product, a description, or both.
      properties:
        productId: { type: string, format: uuid }
        description: { type: string }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        requiredDate: { $ref: '#/components/schemas/Day' }
    RFQInput:
      type: object
      required: [legalEntityId, replyDeadline, lines]
      properties:
        legalEntityId: { type: string, format: uuid }
        replyDeadline: { type: string, format: date-time, description: Must lie in the future. }
        rankingRule: { type: string, enum: [LOWEST_PRICE, LEAD_TIME, WEIGHTED_SCORE], default: LOWEST_PRICE, description: WEIGHTED_SCORE needs criteria. }
        sealed: { type: boolean, default: false, description: Replies stay unreadable until the reply deadline and a late reply is rejected (BR-17.16). }
        criteria:
          type: array
          maxItems: 20
          description: The scoring group (FR-17.19); names unique, weights positive with at most 4 decimals.
          items:
            type: object
            required: [name, weight]
            properties:
              name: { type: string, minLength: 1, maxLength: 100 }
              weight: { $ref: '#/components/schemas/Money' }
        lines: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/RFQLineInput' } }
    RFQFromRequisitionsInput:
      type: object
      required: [requisitionLineIds, replyDeadline]
      properties:
        requisitionLineIds: { type: array, minItems: 1, maxItems: 500, items: { type: string, format: uuid }, description: OPEN lines of APPROVED requisitions of one legal entity }
        replyDeadline: { type: string, format: date-time, description: Must lie in the future. }
        rankingRule: { type: string, enum: [LOWEST_PRICE, LEAD_TIME, WEIGHTED_SCORE], default: LOWEST_PRICE, description: WEIGHTED_SCORE needs criteria. }
        sealed: { type: boolean, default: false }
        criteria:
          type: array
          maxItems: 20
          items:
            type: object
            required: [name, weight]
            properties:
              name: { type: string, minLength: 1, maxLength: 100 }
              weight: { $ref: '#/components/schemas/Money' }
    ScoringCriterion:
      type: object
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, minimum: 1 }
        name: { type: string }
        weight: { $ref: '#/components/schemas/Money' }
    VendorScore:
      type: object
      properties:
        vendorId: { type: string, format: uuid }
        criterionId: { type: string, format: uuid }
        score: { type: integer, minimum: 1, maximum: 10 }
    RFQScoresInput:
      type: object
      required: [scores]
      properties:
        scores:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [criterionId, score]
            properties:
              criterionId: { type: string, format: uuid, description: "A criterion of this RFQ, at most once" }
              score: { type: integer, minimum: 1, maximum: 10 }
    RFQLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        lineNo: { type: integer }
        productId: { type: string, format: uuid }
        description: { type: string }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        requiredDate: { $ref: '#/components/schemas/Day' }
        requisitionLineId: { type: string, format: uuid, description: The requisition line the RFQ line was raised for; an award orders it. }
    RFQInvitation:
      type: object
      properties:
        vendorId: { type: string, format: uuid }
        status: { type: string, enum: [INVITED, REPLIED] }
        sentAt: { type: string, format: date-time }
    RFQReply:
      type: object
      properties:
        id: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        unitPrice: { $ref: '#/components/schemas/Money' }
        priceUnit: { $ref: '#/components/schemas/Money' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        leadTimeDays: { type: integer, minimum: 0 }
        validUntil: { $ref: '#/components/schemas/Day' }
        notes: { type: string }
        receivedAt: { type: string, format: date-time }
        late: { type: boolean, description: Received after the reply deadline; excluded from ranking (BR-17.11). }
        awarded: { type: boolean }
        overrideReason: { type: string, description: Why a late reply was awarded. }
    RFQ:
      type: object
      description: Request for quotation (FR-17.4).
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: RFQ-00000001 }
        legalEntityId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, SENT, REPLIES_OPEN, CLOSED, AWARDED, CANCELLED] }
        replyDeadline: { type: string, format: date-time }
        rankingRule: { type: string, enum: [LOWEST_PRICE, LEAD_TIME, WEIGHTED_SCORE] }
        sealed: { type: boolean }
        repliesSealed: { type: boolean, description: True while a sealed RFQ is before its deadline; replies and scores are then empty (BR-17.16). }
        replyCount: { type: integer, description: "Reply lines recorded, counted even while sealed" }
        openedAt: { type: string, format: date-time, description: When the sealed replies were first shown after the deadline (AC-17.14) }
        openedBy: { type: string, format: uuid, description: Who they were first shown to }
        version: { type: integer, minimum: 1 }
        lines: { type: array, items: { $ref: '#/components/schemas/RFQLine' } }
        invitations: { type: array, items: { $ref: '#/components/schemas/RFQInvitation' } }
        replies: { type: array, items: { $ref: '#/components/schemas/RFQReply' } }
        criteria: { type: array, items: { $ref: '#/components/schemas/ScoringCriterion' } }
        scores: { type: array, items: { $ref: '#/components/schemas/VendorScore' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RFQSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        legalEntityId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, SENT, REPLIES_OPEN, CLOSED, AWARDED, CANCELLED] }
        replyDeadline: { type: string, format: date-time }
        rankingRule: { type: string, enum: [LOWEST_PRICE, LEAD_TIME, WEIGHTED_SCORE] }
        sealed: { type: boolean }
        lineCount: { type: integer }
        vendorCount: { type: integer, description: Vendors invited }
        replyCount: { type: integer, description: Reply lines recorded }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    RFQPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RFQSummary' } }
        nextCursor: { type: string, format: uuid }
    RFQReplyInput:
      type: object
      required: [vendorId, currency, replies]
      properties:
        vendorId: { type: string, format: uuid, description: An invited vendor }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        replies:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [lineId, unitPrice]
            properties:
              lineId: { type: string, format: uuid, description: At most once per request }
              unitPrice: { $ref: '#/components/schemas/Money' }
              priceUnit: { $ref: '#/components/schemas/Money' }
              leadTimeDays: { type: integer, minimum: 0, maximum: 3650 }
              validUntil: { $ref: '#/components/schemas/Day' }
              notes: { type: string, maxLength: 2000 }
    RFQReplyResult:
      allOf:
        - $ref: '#/components/schemas/RFQ'
        - type: object
          properties:
            warnings:
              type: array
              description: PRC-RFQ-003 for each line replied to after the deadline.
              items: { $ref: '#/components/schemas/Warning' }
    RFQAward:
      type: object
      required: [lineId, replyId]
      properties:
        lineId: { type: string, format: uuid }
        replyId: { type: string, format: uuid, description: "A reply to that line, valid on the award day" }
        overrideReason: { type: string, description: Required to award a late reply (BR-17.11) }
    RFQAwardResult:
      type: object
      properties:
        rfq: { $ref: '#/components/schemas/RFQ' }
        purchaseOrders: { type: array, items: { $ref: '#/components/schemas/PurchaseOrder' } }
    RankedReply:
      type: object
      properties:
        rank: { type: integer, minimum: 1 }
        replyId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        unitPrice: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        leadTimeDays: { type: integer }
        validUntil: { $ref: '#/components/schemas/Day' }
        total: { $ref: '#/components/schemas/Money' }
        weightedScore: { $ref: '#/components/schemas/Money', description: "The vendor's Σ(weight × score) / Σ weight, 4 decimals; absent when the vendor is not scored (FR-17.19)" }
    RFQComparison:
      type: object
      properties:
        rfqId: { type: string, format: uuid }
        rankingRule: { type: string, enum: [LOWEST_PRICE, LEAD_TIME, WEIGHTED_SCORE] }
        lines:
          type: array
          items:
            type: object
            properties:
              lineId: { type: string, format: uuid }
              lineNo: { type: integer }
              productId: { type: string, format: uuid }
              description: { type: string }
              qty: { $ref: '#/components/schemas/Money' }
              unit: { type: string }
              ranked: { type: array, items: { $ref: '#/components/schemas/RankedReply' } }
              excluded:
                type: array
                items:
                  type: object
                  properties:
                    replyId: { type: string, format: uuid }
                    vendorId: { type: string, format: uuid }
                    reason: { type: string, enum: [LATE] }
    InvoicingPlanInput:
      type: object
      required: [kind]
      description: >-
        FR-17.21. PERIODIC sets start, frequency, periods and amountPerPeriod (billingDay defaults to start's day; a
        day past a month's end falls on its last day); periods × amountPerPeriod must equal the line amount
        (PRC-IP-001). PARTIAL sets milestones, all by percent (Σ = 100, amounts shared to the cent) or all by
        amount (Σ = line amount).
      properties:
        kind: { type: string, enum: [PERIODIC, PARTIAL] }
        start: { $ref: '#/components/schemas/Day' }
        frequency: { type: string, enum: [MONTHLY, QUARTERLY] }
        periods: { type: integer, minimum: 1, maximum: 120 }
        billingDay: { type: integer, minimum: 1, maximum: 31 }
        amountPerPeriod: { $ref: '#/components/schemas/Money' }
        milestones:
          type: array
          minItems: 1
          maxItems: 120
          items:
            type: object
            required: [date]
            description: Dates must not decrease; exactly one of percent and amount.
            properties:
              date: { $ref: '#/components/schemas/Day' }
              percent: { $ref: '#/components/schemas/Money' }
              amount: { $ref: '#/components/schemas/Money' }
        settleWithoutReceipt: { type: boolean, default: true, description: Wave 18 invoices each due row without waiting for a receipt (FR-18.17). }
    InvoicingPlanRow:
      type: object
      properties:
        seq: { type: integer, minimum: 1 }
        dueDate: { $ref: '#/components/schemas/Day' }
        amount: { $ref: '#/components/schemas/Money' }
        percent: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [OPEN, INVOICED] }
    InvoicingPlan:
      type: object
      description: The plan of one PO line; Σ rows.amount = lineAmount (BR-17.17).
      properties:
        purchaseOrderId: { type: string, format: uuid }
        lineNo: { type: integer }
        kind: { type: string, enum: [PERIODIC, PARTIAL] }
        frequency: { type: string, enum: [MONTHLY, QUARTERLY] }
        billingDay: { type: integer }
        settleWithoutReceipt: { type: boolean }
        lineAmount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        rows: { type: array, items: { $ref: '#/components/schemas/InvoicingPlanRow' } }
        updatedAt: { type: string, format: date-time }
    InvoicingPlanResult:
      allOf:
        - $ref: '#/components/schemas/InvoicingPlan'
        - type: object
          properties:
            poRowVersion: { type: integer, description: The PO row version (its ETag) after the call }
    DeliverySchedule:
      type: object
      description: The delivery schedule of one PO line (FR-17.10). The row quantities add up to lineQty.
      required: [purchaseOrderId, lineNo, unit, lineQty, rows]
      properties:
        purchaseOrderId: { type: string, format: uuid }
        lineNo: { type: integer }
        unit: { type: string }
        lineQty: { type: string, description: "Decimal string, the line quantity" }
        rows:
          type: array
          items:
            type: object
            required: [seq, qty, deliveryDate]
            properties:
              seq: { type: integer, minimum: 1 }
              qty: { type: string, description: Decimal string }
              deliveryDate: { type: string, format: date, description: The date the PO asks for. }
              confirmedDate: { type: string, format: date, description: "The date the vendor confirmed, when it has." }
              confirmedBy: { type: string, format: uuid }
              confirmedAt: { type: string, format: date-time }
    OutlineRow:
      type: object
      description: A stored node of a service outline in depth-first order. A LEVEL's amount is the sum of its children (BR-17.19).
      required: [seq, depth, kind, qty, unitPrice, amount]
      properties:
        seq: { type: integer, minimum: 1 }
        parentSeq: { type: integer, minimum: 1, description: Absent on a top-level node. }
        depth: { type: integer, minimum: 1, maximum: 5 }
        kind: { type: string, enum: [LEVEL, ITEM] }
        description: { type: string }
        productId: { type: string, format: uuid, description: The service product of an item. }
        qty: { type: string, description: Decimal string; 0 on a level. }
        unit: { type: string }
        unitPrice: { type: string, description: Decimal string; 0 on a level. }
        amount: { type: string, description: Decimal string. }
    OutlineNodeInput:
      type: object
      description: >-
        A node of a service outline in the request. A LEVEL needs a description and at least one child and may state the total
        its children must add up to (PRC-SRV-004). An ITEM needs a productId or a description, a positive qty, a unit and a unitPrice.
        An outline holds at most 200 nodes in at most 5 levels.
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [LEVEL, ITEM] }
        description: { type: string, maxLength: 500 }
        productId: { type: string, format: uuid }
        qty: { type: string, description: "Decimal string, positive, at most six decimal places." }
        unit: { type: string, maxLength: 20 }
        unitPrice: { type: string, description: "Decimal string, not negative, at most six decimal places." }
        total: { type: string, description: Decimal string. The amount the caller expects a LEVEL to add up to. }
        children:
          type: array
          items: { $ref: '#/components/schemas/OutlineNodeInput' }
    ServiceSpec:
      type: object
      description: The service specification of one SERVICE PO line (FR-17.23).
      required: [purchaseOrderId, lineNo, currency, lineAmount, valueLimit, expectedValue, plannedTotal, outline, updatedAt]
      properties:
        purchaseOrderId: { type: string, format: uuid }
        lineNo: { type: integer }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        lineAmount: { type: string, description: "Decimal string, the PO line amount." }
        valueLimit: { type: string, description: Decimal string. The limit for unplanned services. }
        expectedValue: { type: string, description: Decimal string. The value of unplanned services expected. }
        plannedTotal: { type: string, description: Decimal string. The sum of the top-level outline amounts; never above lineAmount. }
        contractAgreementLineId: { type: string, format: uuid }
        contractRemaining: { type: string, description: Decimal string. The remaining value of the contract line now; present with contractAgreementLineId. }
        modelId: { type: string, format: uuid, description: The model service specification the outline was copied from. }
        outline: { type: array, items: { $ref: '#/components/schemas/OutlineRow' } }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    ServiceSpecResult:
      allOf:
        - $ref: '#/components/schemas/ServiceSpec'
        - type: object
          required: [poRowVersion]
          properties:
            poRowVersion: { type: integer, description: The PO row version (its ETag) after the call }
    ServiceSpecPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ServiceSpec' } }
    ServiceSpecInput:
      type: object
      description: >-
        The limits and either an outline or a modelId whose outline is copied (not both). An empty outline is a limit item with no planned services.
      required: [valueLimit]
      additionalProperties: false
      properties:
        valueLimit: { type: string, description: "Decimal string, not negative. The limit for unplanned services; 0 allows none." }
        expectedValue: { type: string, description: "Decimal string, not above valueLimit. Defaults to 0." }
        contractAgreementLineId: { type: string, format: uuid, description: "An agreement line of an EFFECTIVE agreement of the same legal entity, vendor and currency whose remaining value also bounds unplanned services." }
        modelId: { type: string, format: uuid }
        outline:
          type: array
          items: { $ref: '#/components/schemas/OutlineNodeInput' }
    LimitCheck:
      type: object
      description: The answer to an unplanned services check (BR-17.19). A refused entry has allowed false, code PRC-SRV-003 and detail.
      required: [lineNo, currency, valueLimit, unplannedEntered, entry, valueRemaining, remaining, allowed]
      properties:
        lineNo: { type: integer, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        valueLimit: { type: string, description: Decimal string. }
        contractRemaining: { type: string, description: "Decimal string. The remaining value of the contract line, when the specification names one." }
        unplannedEntered: { type: string, description: Decimal string. What is already entered. }
        entry: { type: string, description: Decimal string. The entry checked. }
        valueRemaining: { type: string, description: 'Decimal string. valueLimit minus unplannedEntered, never negative.' }
        remaining: { type: string, description: 'Decimal string. What unplanned services may still add before this entry: the smaller of valueRemaining and contractRemaining minus unplannedEntered, never negative.' }
        allowed: { type: boolean }
        code: { type: string, enum: [PRC-SRV-003], description: Present when allowed is false. }
        detail: { type: string, description: 'Present when allowed is false, e.g. "Unplanned services 2100 exceed limit 2000 on PO line 1".' }
    ModelServiceSpec:
      type: object
      description: A reusable service outline of a legal entity (SAP ML10-ML12) that fills the outline of a service line.
      required: [id, legalEntityId, code, name, currency, status, plannedTotal, outline, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        plannedTotal: { type: string, description: Decimal string. }
        outline: { type: array, items: { $ref: '#/components/schemas/OutlineRow' }, description: Empty in a list. }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    ModelServiceSpecPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ModelServiceSpec' } }
        nextCursor: { type: string, format: uuid }
    ModelServiceSpecInput:
      type: object
      required: [name, currency]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid, description: Required on create; ignored on change. }
        code: { type: string, pattern: '^[A-Z0-9_-]{1,20}$', description: Required on create; ignored on change. }
        name: { type: string, maxLength: 200 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { type: string, enum: [ACTIVE, INACTIVE], description: Defaults to ACTIVE. }
        outline:
          type: array
          items: { $ref: '#/components/schemas/OutlineNodeInput' }
    DeliveryScheduleInput:
      type: object
      required: [rows]
      additionalProperties: false
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [qty, deliveryDate]
            additionalProperties: false
            properties:
              qty: { type: string, description: "Decimal string, positive, at most six decimal places" }
              deliveryDate: { type: string, format: date }
    DeliveryScheduleResult:
      allOf:
        - $ref: '#/components/schemas/DeliverySchedule'
        - type: object
          properties:
            poRowVersion: { type: integer, description: The PO row version (its ETag) after the call }
    RepriceChange:
      type: object
      description: One line priced at its current and at the winning trade agreement price. Amounts are for qty, after discount, rounded to the currency; delta = newAmount − oldAmount.
      required: [lineNo, qty, oldPrice, oldPriceUnit, newPrice, newPriceUnit, oldAmount, newAmount, delta, oldPriceSource, newPriceSource]
      properties:
        lineNo: { type: integer }
        qty: { $ref: '#/components/schemas/Money', description: "The line quantity for a moved line; the invoiced quantity for an invoiced line." }
        oldPrice: { $ref: '#/components/schemas/Money' }
        oldPriceUnit: { $ref: '#/components/schemas/Money' }
        newPrice: { $ref: '#/components/schemas/Money' }
        newPriceUnit: { $ref: '#/components/schemas/Money' }
        oldAmount: { $ref: '#/components/schemas/Money' }
        newAmount: { $ref: '#/components/schemas/Money' }
        delta: { $ref: '#/components/schemas/Money' }
        oldPriceSource: { type: string, description: "TRADE_AGREEMENT:<id> the line was priced from" }
        newPriceSource: { type: string, description: "TRADE_AGREEMENT:<id> that wins now" }
    RepriceSkip:
      type: object
      required: [lineNo, reason]
      properties:
        lineNo: { type: integer }
        reason:
          type: string
          enum: [MANUAL_PRICE, AGREEMENT_LINE, NOT_TRADE_AGREEMENT, NO_CURRENT_PRICE, UNCHANGED, INVOICED, HANDED_OVER]
          description: "MANUAL_PRICE: priced by hand, never moved (BR-17.18). AGREEMENT_LINE: drawn against a purchase agreement, whose release amount cannot change (PRC-PO-010). NOT_TRADE_AGREEMENT: priced from an agreement, an RFQ reply or a requisition estimate, or has no product. NO_CURRENT_PRICE: no trade agreement row wins now. UNCHANGED: already at the winning price. INVOICED: invoiced, kept at the old price and listed in invoiced. HANDED_OVER: invoiced, and an earlier run already handed this price row to payables."
    RepriceResult:
      type: object
      required: [purchaseOrderId, number, currency, applied, versionNo, reapprovalRequired, pricingDate, totalDelta, changes, invoiced, skipped]
      properties:
        purchaseOrderId: { type: string, format: uuid }
        number: { type: string }
        currency: { type: string }
        applied: { type: boolean, description: "True when this request (or the first request with its Idempotency-Key) wrote the run." }
        replayed: { type: boolean, description: "The Idempotency-Key was used before; changes then show what a run would still move." }
        versionNo: { type: integer, description: "The current version on a preview; the version written on apply (pending when reapprovalRequired)." }
        reapprovalRequired: { type: boolean, description: "The moved prices fired a reapproval rule (FR-17.8): the PO is IN_REVIEW with the version pending." }
        pricingDate: { $ref: '#/components/schemas/Day', description: "The order date the trade agreements were resolved on (BR-17.3)." }
        totalDelta: { $ref: '#/components/schemas/Money', description: "Sum of the deltas of changes (invoiced lines excluded)." }
        changes: { type: array, items: { $ref: '#/components/schemas/RepriceChange' }, description: "Open, un-invoiced lines that move to the new price." }
        invoiced: { type: array, items: { $ref: '#/components/schemas/RepriceChange' }, description: "Invoiced lines whose price changed; they keep the old price and are handed to payables for a subsequent debit or credit (wave 18 FR-18.18)." }
        skipped: { type: array, items: { $ref: '#/components/schemas/RepriceSkip' } }
        error:
          type: object
          description: Set only in a run over many POs, when this PO could not be planned or applied; the other POs are not affected.
          required: [code, detail]
          properties:
            code: { type: string }
            detail: { type: string }
    RepriceRunInput:
      type: object
      additionalProperties: false
      properties:
        apply: { type: boolean, default: false }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        tradeAgreementId: { type: string, format: uuid, description: "Only POs with an open line priced from this trade agreement row." }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
        cursor: { type: string, format: uuid, description: "nextCursor of the previous page." }
    RepriceRunResult:
      type: object
      required: [applied, visited, items]
      properties:
        applied: { type: boolean }
        visited: { type: integer, description: "POs this page planned, listed or not." }
        items: { type: array, items: { $ref: '#/components/schemas/RepriceResult' }, description: "POs with a line to move or hand over, or that failed." }
        nextCursor: { type: string }
    CatalogEntryInput:
      type: object
      required: [vendorId, name, category, unit, unitPrice, currency]
      additionalProperties: false
      properties:
        vendorId: { type: string, format: uuid }
        vendorPartNo: { type: string }
        productId: { type: string, format: uuid, description: "Set when the entry is a stocked product; a requisition line picked from the entry carries it." }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        unit: { type: string, example: EA }
        unitPrice: { $ref: '#/components/schemas/Money' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        leadTimeDays: { type: integer, minimum: 0, maximum: 3650 }
        preferred: { type: boolean }
        imageUrl: { type: string, format: uri, maxLength: 2000, description: "http(s) reference to an image in the object store." }
    CatalogEntry:
      allOf:
        - $ref: '#/components/schemas/CatalogEntryInput'
        - type: object
          required: [id, entryNo]
          properties:
            id: { type: string, format: uuid, description: "Referenced by requisition lines as catalogEntryId." }
            entryNo: { type: integer, minimum: 1 }
    CatalogInput:
      type: object
      required: [legalEntityId, name, validFrom]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        orgUnitIds: { type: array, items: { type: string, format: uuid }, description: "Operating units the catalog is published to; empty means every unit." }
        entries: { type: array, maxItems: 50000, items: { $ref: '#/components/schemas/CatalogEntryInput' } }
    CatalogEntriesInput:
      type: object
      required: [entries]
      additionalProperties: false
      properties:
        entries: { type: array, minItems: 1, maxItems: 50000, items: { $ref: '#/components/schemas/CatalogEntryInput' } }
    Catalog:
      type: object
      required: [id, number, legalEntityId, name, status, validFrom, orgUnitIds, version, entryCount, entries]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: "CAT-00000001" }
        legalEntityId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, RETIRED] }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        orgUnitIds: { type: array, items: { type: string, format: uuid } }
        version: { type: integer, description: "Also the ETag; If-Match for entries and actions." }
        entryCount: { type: integer, minimum: 0, maximum: 50000 }
        entries: { type: array, maxItems: 200, description: "The first 200 entries in entry order; page on with GET /catalogs/{id}/entries from entriesNextCursor.", items: { $ref: '#/components/schemas/CatalogEntry' } }
        entriesNextCursor: { type: string, description: "Set when the catalog has more entries than the first page: the last entry number; pass it as cursor to GET /catalogs/{id}/entries." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CatalogSummary:
      type: object
      required: [id, number, legalEntityId, name, status, validFrom, entryCount, version]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        legalEntityId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, RETIRED] }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        entryCount: { type: integer }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    CatalogPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogSummary' } }
        nextCursor: { type: string, format: uuid }
    CatalogHit:
      allOf:
        - $ref: '#/components/schemas/CatalogEntry'
        - type: object
          required: [catalogId, catalogNumber, catalogName]
          properties:
            catalogId: { type: string, format: uuid }
            catalogNumber: { type: string }
            catalogName: { type: string }
    CatalogEntryPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogEntry' } }
        nextCursor: { type: string, description: "The last entry number of this page; pass it as cursor." }
    CatalogHitPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogHit' } }
        nextCursor: { type: string, format: uuid }
    VendorImportInput:
      type: object
      required: [vendorId, format]
      additionalProperties: false
      description: >-
        The vendor's file. Format CSV carries the file text in csv (first record is the header; columns are matched by
        name, so "Vendor part number", "UOM" and "Price" work; name, category, unit, unitPrice and currency must be
        present); format JSON carries rows. At most 50,000 rows.
      properties:
        vendorId: { type: string, format: uuid, description: "The vendor of every row." }
        format: { type: string, enum: [CSV, JSON] }
        fileName: { type: string, maxLength: 255 }
        csv: { type: string, description: "CSV text, for format CSV." }
        rows:
          type: array
          maxItems: 50000
          description: "Rows for format JSON; vendorId is not read from a row."
          items:
            type: object
            additionalProperties: false
            required: [name, category, unit, unitPrice, currency]
            properties:
              vendorPartNo: { type: string }
              productId: { type: string, format: uuid }
              name: { type: string }
              description: { type: string }
              category: { type: string }
              unit: { type: string }
              unitPrice: { $ref: '#/components/schemas/Money' }
              currency: { type: string }
              leadTimeDays: { type: integer, minimum: 0, maximum: 3650 }
              imageUrl: { type: string }
    ImportDecisionsInput:
      type: object
      additionalProperties: false
      description: "The buyer's choices; acceptAll runs first, then accept and reject by row number (a row in both lists is refused)."
      properties:
        acceptAll: { type: boolean, description: "Accept every ACCEPTABLE row." }
        accept: { type: array, items: { type: integer, minimum: 1, maximum: 50000 } }
        reject: { type: array, items: { type: integer, minimum: 1, maximum: 50000 } }
    CatalogImport:
      type: object
      required: [id, catalogId, legalEntityId, vendorId, format, status, totalRows, acceptableRows, errorRows, acceptedRows, rejectedRows, entriesAdded, version]
      properties:
        id: { type: string, format: uuid }
        catalogId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        format: { type: string, enum: [CSV, JSON] }
        fileName: { type: string }
        status: { type: string, enum: [STAGED, COMMITTED, CANCELLED] }
        totalRows: { type: integer }
        acceptableRows: { type: integer, description: "Rows that passed validation and await a decision." }
        errorRows: { type: integer, description: "Rows that failed validation or repeat a vendor part number (PRC-CAT-005)." }
        acceptedRows: { type: integer }
        rejectedRows: { type: integer }
        entriesAdded: { type: integer, description: "Entries the commit added to the catalog." }
        version: { type: integer, description: "Also the ETag; If-Match for decisions and actions." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CatalogImportPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogImport' } }
        nextCursor: { type: string, format: uuid }
    ImportRow:
      type: object
      required: [rowNo, status, raw]
      properties:
        rowNo: { type: integer, minimum: 1, description: "Position in the file, header excluded." }
        status: { type: string, enum: [ACCEPTABLE, ERROR, ACCEPTED, REJECTED] }
        reason: { type: string, description: "Why an ERROR row failed." }
        raw: { type: object, additionalProperties: { type: string }, description: "What the file said, under the canonical column names." }
        entry: { $ref: '#/components/schemas/CatalogEntryInput' }
    ImportRowPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ImportRow' } }
        nextCursor: { type: string, description: "The last row number of this page; pass it as cursor." }
paths:
  /v1/procurement/requisitions:
    post:
      operationId: createRequisition
      x-passage-duty: procurement.requisition.create
      summary: Create a DRAFT requisition (duty procurement.requisition.create)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequisitionInput' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisition' }
        '400': { description: Malformed body or missing Idempotency-Key, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty or legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation (COM-0001, including a catalogEntryId the caller cannot see or a unit or product that differs from the entry), PRC-REQ-002 (more than 500 lines), PRC-CAT-004 (catalog not published to the legal entity and unit today), PRC-CAT-006 (catalog currency differs) or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      operationId: listRequisitions
      x-passage-duty: procurement.requisition.create
      summary: List requisitions newest first (duty procurement.requisition.create)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CLOSED, CANCELLED] } }
        - { name: mine, in: query, required: false, description: "true limits the list to the caller's requisitions", schema: { type: boolean } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequisitionPage' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/requisitions/{id}:
    get:
      operationId: getRequisition
      x-passage-duty: procurement.requisition.create
      summary: Read a requisition (ETag = version; duty procurement.requisition.create)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisition' }
        '404': { description: Not found, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/requisitions/{id}:submit:
    post:
      operationId: submitRequisition
      x-passage-duty: procurement.requisition.create
      summary: Submit for approval; routes by amount and category; APPROVED when the chain is empty. A replayed Idempotency-Key returns the requisition as it is now.
      description: >-
        A requester whose REQUISITION spending limit in the requisition currency is below the total, or whose limit is past its recertification date
        (warning PRC-SL-001), gets one more approval level, NEXT_APPROVER, at the end of the chain (FR-17.17, BR-17.15). A requester whose REQUISITION limits are all in other currencies gets the level too (amounts are not converted yet); a requester with no REQUISITION limit at all gets none until default signing limits exist.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Submitted
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisition' }
        '403': { description: Caller is not the requester (PRC-REQ-004), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: Version changed (PRC-VERSION-CONFLICT) or not DRAFT, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: A line's preferred vendor is not assigned to its restricted category and the legal entity's category access mode is HARD (PRC-CAT-002), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/requisition-lines:
    get:
      operationId: listOpenRequisitionLines
      x-passage-duty: procurement.purchase-order.maintain
      summary: Consolidation queue - OPEN lines of APPROVED requisitions, newest first (FR-17.3; duty procurement.purchase-order.maintain)
      parameters:
        - { name: sourcing, in: query, required: false, description: "NEEDS_SOURCING keeps lines with no preferred vendor; HAS_VENDOR those with one.", schema: { type: string, enum: [NEEDS_SOURCING, HAS_VENDOR] } }
        - { name: vendorId, in: query, required: false, description: Preferred vendor, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourcingLinePage' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/requisition-lines/{id}:split:
    post:
      operationId: splitRequisitionLine
      x-passage-duty: procurement.purchase-order.maintain
      summary: Split an OPEN requisition line into several lines so the parts can be ordered separately (FR-17.3; duty procurement.purchase-order.maintain)
      description: >-
        Cuts one new OPEN line out of the line for each quantity in the body; the original keeps what is left, which must stay
        above zero. The new lines are numbered after the requisition's last line and keep the original's product, category,
        unit, estimated unit price, vendor, site, warehouse, requested date and catalog entry; each carries splitFromLineId.
        Line amounts are shares of the original amount (half to even to the currency's minor units, by cumulative share), so
        quantities and amounts add up exactly and the requisition total does not change. Only an OPEN line of an APPROVED
        requisition can be split, and not while a running RFQ holds it (PRC-REQ-006). If-Match is the requisition version, which
        moves on with the split; requisition.split.v1 is written in the same transaction. A replayed Idempotency-Key returns the
        requisition as it is now, with the same new lines. A consolidation or RFQ built from the line as it was before the split
        is refused with PRC-REQ-STATE; reload the queue and retry.
      parameters:
        - { name: id, in: path, required: true, description: Requisition line id, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequisitionLineSplitInput' }
      responses:
        '200':
          description: The requisition with the original and the new lines
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisition' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: Missing duty or legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Requisition line not found (PRC-REQ-LINE-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: "Requisition version changed or the requisition is being ordered at the same time (PRC-VERSION-CONFLICT), line not OPEN on an APPROVED requisition (PRC-REQ-STATE) or held by a running RFQ (PRC-REQ-006)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation (COM-0001): no quantity, more than 20, not above zero, more than 6 decimals; quantities that leave nothing on the original line (PRC-REQ-007); or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-order-lines:
    get:
      operationId: listOpenOrderLines
      x-passage-duty: procurement.purchase-order.inquire
      summary: Open supply - lines of CONFIRMED purchase orders with quantity left to receive, by delivery date (duty procurement.purchase-order.inquire)
      description: |
        Returns the lines of CONFIRMED purchase orders that are OPEN and not fully received, with the
        effective delivery site and warehouse of each (the line's own, else the PO's), the open quantity
        and the delivery date, ordered by delivery date, PO and line number. Master planning (wave 22)
        reads it per warehouse to net purchases against that warehouse's demand.
      parameters:
        - { name: warehouseId, in: query, required: false, description: Effective delivery warehouse, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, required: false, description: Effective delivery site, schema: { type: string, format: uuid } }
        - { name: productId, in: query, required: false, description: Product, schema: { type: string, format: uuid } }
        - { name: legalEntityId, in: query, required: false, description: Legal entity of the PO; must be in the caller's scope, schema: { type: string, format: uuid } }
        - { name: dueFrom, in: query, required: false, description: Earliest delivery date (inclusive), schema: { $ref: '#/components/schemas/Day' } }
        - { name: dueTo, in: query, required: false, description: Latest delivery date (inclusive), schema: { $ref: '#/components/schemas/Day' } }
        - { $ref: '#/components/parameters/Limit' }
        - { name: cursor, in: query, required: false, description: The nextCursor of the previous page, schema: { type: string } }
      responses:
        '200':
          description: One page of open order lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenOrderLinePage' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: Missing duty or legalEntityId outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/inquiries/open-orders-by-vendor:
    get:
      operationId: listOpenOrdersByVendor
      x-passage-duty: procurement.purchase-order.inquire
      summary: Open orders by vendor and currency - count, open value and overdue share of CONFIRMED purchase orders (PRD 3.17.14; duty procurement.purchase-order.inquire)
      description: |
        One row per vendor and currency over the lines of CONFIRMED purchase orders that are OPEN and not
        fully received. Open value is the line amount pro rata to the quantity still to receive; amounts of
        different currencies are never added. A line is due on the vendor-confirmed date when there is one,
        else the requested date (with a delivery schedule, on the first row the received quantity does not
        cover); it is overdue when that date is before asOf.
      parameters:
        - { name: legalEntityId, in: query, required: false, description: Legal entity of the PO; must be in the caller's scope, schema: { type: string, format: uuid } }
        - { name: vendorId, in: query, required: false, description: Only this vendor, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, required: false, description: Date overdue is measured against (default today UTC), schema: { $ref: '#/components/schemas/Day' } }
        - { $ref: '#/components/parameters/Limit' }
        - { name: cursor, in: query, required: false, description: The nextCursor of the previous page, schema: { type: string } }
      responses:
        '200':
          description: One page of vendor rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOpenOrdersPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: Missing duty or legalEntityId outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/inquiries/overdue-lines:
    get:
      operationId: listOverdueLines
      x-passage-duty: procurement.purchase-order.inquire
      summary: Overdue purchase order lines - open lines of CONFIRMED orders past their due date, oldest due first (PRD 3.17.14; duty procurement.purchase-order.inquire)
      description: |
        Lines of CONFIRMED purchase orders that are OPEN with quantity still to receive and a due date before
        asOf, with the days late and the open value. The due date is the vendor-confirmed date when there is
        one, else the requested date; for a line with a delivery schedule the received quantity covers the
        rows in order and the line is due on the first row not covered.
      parameters:
        - { name: legalEntityId, in: query, required: false, description: Legal entity of the PO; must be in the caller's scope, schema: { type: string, format: uuid } }
        - { name: vendorId, in: query, required: false, description: Only this vendor, schema: { type: string, format: uuid } }
        - { name: productId, in: query, required: false, description: Only this product, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, required: false, description: Date overdue is measured against (default today UTC), schema: { $ref: '#/components/schemas/Day' } }
        - { $ref: '#/components/parameters/Limit' }
        - { name: cursor, in: query, required: false, description: The nextCursor of the previous page, schema: { type: string } }
      responses:
        '200':
          description: One page of overdue lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverdueLinePage' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: Missing duty or legalEntityId outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/inquiries/price-history:
    get:
      operationId: listPriceHistory
      x-passage-duty: procurement.purchase-order.inquire
      summary: Order price history of a product - priced lines of approved purchase orders, newest first (PRD 3.17.14; duty procurement.purchase-order.inquire)
      description: |
        The lines of one product on purchase orders that reached approval (APPROVED, CONFIRMED, FINALIZED),
        cancelled lines left out, with vendor, currency, unit price, price unit, discount, price source and
        the agreement line behind it. The order date is the day the order was created (UTC).
      parameters:
        - { name: productId, in: query, required: true, description: Product, schema: { type: string, format: uuid } }
        - { name: legalEntityId, in: query, required: false, description: Legal entity of the PO; must be in the caller's scope, schema: { type: string, format: uuid } }
        - { name: vendorId, in: query, required: false, description: Only this vendor, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, description: Earliest order date (inclusive), schema: { $ref: '#/components/schemas/Day' } }
        - { name: to, in: query, required: false, description: Latest order date (inclusive), schema: { $ref: '#/components/schemas/Day' } }
        - { $ref: '#/components/parameters/Limit' }
        - { name: cursor, in: query, required: false, description: The nextCursor of the previous page, schema: { type: string } }
      responses:
        '200':
          description: One page of priced lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceHistoryPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: Missing duty or legalEntityId outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/requisitions:consolidate:
    post:
      operationId: consolidateRequisitions
      x-passage-duty: procurement.purchase-order.maintain
      summary: Create DRAFT purchase orders from approved requisition lines, one per legal entity, vendor, currency, site, warehouse and delivery window (FR-17.3; duty procurement.purchase-order.maintain). A replayed Idempotency-Key returns the POs the lines went into.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsolidationInput' }
      responses:
        '201':
          description: The purchase orders created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsolidationResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: Missing duty or a line's legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Requisition line not found (PRC-REQ-LINE-NOT-FOUND) or agreement line not found (PRC-AGR-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: "A line is not OPEN on an APPROVED requisition, or was split since it was read (PRC-REQ-STATE)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation, no vendor for a line (PRC-CONS-002), window outside 1-60 (PRC-CONS-001), agreement rules (PRC-AGR-003/005/006/007/008), a vendor not assigned to a restricted category under HARD (PRC-CAT-002) or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders:reprice:
    post:
      operationId: repricePurchaseOrders
      x-passage-duty: procurement.purchase-order.inquire or procurement.purchase-order.confirm
      summary: Preview or apply the subsequent price change run over a page of CONFIRMED POs (FR-17.22, AC-17.16)
      description: |
        Visits, in id order, CONFIRMED POs with an open line priced from a trade agreement and not drawn
        against a purchase agreement, optionally only for one legal entity, vendor or trade agreement row,
        and plans each as POST /purchase-orders/{id}:reprice does. Preview needs procurement.purchase-order.inquire.
        Apply needs procurement.purchase-order.confirm and an Idempotency-Key; each PO is written in its own transaction
        at the row version the run read, so a PO that fails (changed meanwhile, outside the caller's scope,
        an edit rule) is reported in its item and the others still apply. Retrying a page with the same key
        does not write a PO twice. Follow nextCursor for the next page.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Required when apply is true.
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepriceRunInput' }
      responses:
        '200':
          description: One page of the run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepriceRunResult' }
        '400': { description: Malformed body (COM-0001) or Idempotency-Key missing on apply (PRC-IDEM-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing procurement.purchase-order.inquire (preview) or procurement.purchase-order.confirm (apply) (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation (COM-0001): an id that is not a UUID, or limit outside 1-100", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders:
    post:
      operationId: createPurchaseOrder
      x-passage-duty: procurement.purchase-order.maintain
      summary: Create a DRAFT purchase order, pricing lines from trade agreements when unitPrice is omitted
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: Missing duty or legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: "Requisition line (PRC-REQ-LINE-NOT-FOUND), agreement line (PRC-AGR-NOT-FOUND) or charge code (PRC-CHG-NOT-FOUND) not found", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: A requisition line is not OPEN on an APPROVED requisition (PRC-REQ-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation, missing price (PRC-PRICE-001), requisition of another legal entity (PRC-REQ-005), a PO line whose quantity or unit differs from the requisition line it names (PRC-REQ-008), agreement rules (PRC-AGR-003 HARD limit, PRC-AGR-005 validity, PRC-AGR-006 party, PRC-AGR-007 not EFFECTIVE, PRC-AGR-008 product or unit), vendor not assigned to (or BLOCKED for) the category of a line under HARD category access (PRC-CAT-002), a category that differs from the requisition line's (COM-0001), a charge code that is inactive or of another legal entity (PRC-CHG-004) or a charge calc that differs from its code's (PRC-CHG-005)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      operationId: listPurchaseOrders
      x-passage-duty: procurement.purchase-order.inquire
      summary: List purchase orders newest first (duty procurement.purchase-order.inquire)
      parameters:
        - { name: approvalStatus, in: query, required: false, schema: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CONFIRMED, FINALIZED, CANCELLED] } }
        - { name: vendorId, in: query, required: false, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrderPage' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/purchase-orders/{id}:
    get:
      operationId: getPurchaseOrder
      x-passage-duty: procurement.purchase-order.inquire or procurement.purchase-order.lookup
      summary: Read a purchase order (ETag = row version; duty procurement.purchase-order.inquire)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '404': { description: Not found, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    patch:
      operationId: editPurchaseOrder
      x-passage-duty: procurement.purchase-order.maintain
      summary: Replace the lines and charges of a PO (FR-17.8, BR-17.8; duty procurement.purchase-order.maintain)
      description: |
        The body is the whole order as on create. A line with lineNo changes that existing line; a line
        without lineNo is new and is numbered after the highest line on the PO; a live line left out is
        cancelled (BR-17.9) and returns what it held (agreement release, requisition line). An existing
        line that omits unitPrice keeps its price and price source while its product and unit stay the
        same. Vendor, currency and legal entity cannot change; site and warehouse cannot change after
        the first confirmation. Lines drawn against a purchase agreement keep their quantity and amount,
        and a new delivery date must stay within the agreement validity (PRC-AGR-005).
        Before the first confirmation the edit returns the PO to DRAFT. After it, the change is the next
        version: when change management is on and a reapproval rule fires (quantity or price up more
        than 5 %, or a new line) the PO goes to IN_REVIEW with the version pending; otherwise the version
        is confirmed at once and po.confirmed and poversion.created are written. Editing a pending change
        back to the confirmed content drops it. APPROVED, FINALIZED and CANCELLED orders cannot be edited.
        Category access (FR-17.20): an existing line keeps its category, and the lines the edit adds are
        checked against the vendor (HARD refuses with PRC-CAT-002, SOFT and PROVISIONAL warn in warnings).
        Charges (FR-17.9): a charge that names a chargeCodeId the PO already carries keeps the calculation, value (unless one is given)
        and debit and credit sides it was entered with, even if the code has since been changed or deactivated; applyAutoCharges adds
        only the codes that are not among the charges and that no auto charge added to the PO before, so a removed auto charge stays removed.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '200':
          description: Edited
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { description: If-Match not a number (PRC-IFMATCH-002), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Legal entity outside the caller's scope, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Not found (PRC-PO-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation (COM-0001), PRC-PO-STATE (status does not allow edits or the line is cancelled), PRC-PO-007 (below received or invoiced), PRC-PO-010 (requisition or agreement link changed, or an agreement line's quantity or amount changed), PRC-AGR-005, PRC-PRICE-001, PRC-CAT-002 (an added line's category does not admit the vendor under HARD)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}:submit:
    post:
      operationId: submitPurchaseOrder
      x-passage-duty: procurement.purchase-order.maintain
      summary: DRAFT or REJECTED to IN_REVIEW (duty procurement.purchase-order.maintain). A replayed Idempotency-Key returns the PO as it is now.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Submitted
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { description: Idempotency-Key missing (PRC-IDEM-001) or If-Match not a number (PRC-IFMATCH-002), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Not DRAFT or REJECTED (PRC-PO-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}:approve:
    post:
      operationId: approvePurchaseOrder
      x-passage-duty: procurement.purchase-order.confirm
      summary: IN_REVIEW to APPROVED (duty procurement.purchase-order.confirm; stands in for the wave 4 approval task)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Approved
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { description: Idempotency-Key missing (PRC-IDEM-001) or If-Match not a number (PRC-IFMATCH-002), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: "Missing procurement.purchase-order.confirm duty (AUTH-0003), or the purchasing policy has poFourEyes on and the caller created, submitted or last changed the PO (PRC-POL-002), or the caller's PURCHASE_ORDER approval limit in the PO currency is below the PO total (PRC-SL-002; a caller with no limit in the PO currency, or that is not a named user, has a limit of zero and approves only a zero total) or past its recertification date (PRC-SL-001)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Not IN_REVIEW (PRC-PO-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}:reject:
    post:
      operationId: rejectPurchaseOrder
      x-passage-duty: procurement.purchase-order.confirm
      summary: IN_REVIEW to REJECTED (duty procurement.purchase-order.confirm). A rejected PO is edited and submitted again; a rejected change to a confirmed PO can also be edited back to the confirmed content.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Rejected
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { description: Idempotency-Key missing (PRC-IDEM-001) or If-Match not a number (PRC-IFMATCH-002), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing procurement.purchase-order.confirm duty, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Not IN_REVIEW (PRC-PO-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}:confirm:
    post:
      operationId: confirmPurchaseOrder
      x-passage-duty: procurement.purchase-order.confirm
      summary: APPROVED to CONFIRMED (duty procurement.purchase-order.confirm). Confirms version 1, or the pending change version, and writes po.confirmed (and poversion.created above version 1).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
