        '409': { description: Version changed (PRC-VERSION-CONFLICT) or transition not allowed (PRC-AGR-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/scheduling-agreements:
