    TradeAgreementPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TradeAgreement' } }
        nextCursor: { type: string, format: uuid }
    TradeAgreementInput:
      type: object
      required: [relation, accountCode, itemCode, currency, unit, price, validFrom]
      additionalProperties: false
      properties:
        relation: { type: string, enum: [PRICE] }
        accountCode: { type: string, enum: [VENDOR, GROUP, ALL] }
        accountId: { type: string, format: uuid }
        itemCode: { type: string, enum: [PRODUCT, GROUP, ALL] }
        itemId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        unit: { type: string }
