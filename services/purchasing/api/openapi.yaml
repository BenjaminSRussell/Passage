        '412': { description: If-Match is not the current PO row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'Validation (COM-0001), quantities do not add up to the line quantity (PRC-DS-001), PO not DRAFT or REJECTED or line cancelled (PRC-DS-002), the PO''s schedules would hold more than 1,000 rows (PRC-DS-003)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    delete:
      operationId: deleteDeliverySchedule
      x-passage-duty: procurement.purchase-order.maintain
      summary: Remove the delivery schedule of one PO line (duty procurement.purchase-order.maintain)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/LineNo' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204':
          description: Removed; the ETag is the new PO row version
          headers:
            ETag: { schema: { type: string } }
        '404': { description: "Purchase order, line or schedule not found", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current PO row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'Bad id or line number (COM-0001), PO not DRAFT or REJECTED or line cancelled (PRC-DS-002)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}/lines/{lineNo}/delivery-schedule/rows/{seq}/confirmation:
    put:
      operationId: confirmDeliveryDate
