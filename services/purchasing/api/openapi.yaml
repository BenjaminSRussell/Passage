        lastReleaseKind: { type: string, enum: [FRC, JIT] }
        lastRunDate: { $ref: '#/components/schemas/Day' }
        nextReleaseDue: { $ref: '#/components/schemas/Day', description: "validFrom before any release, else the last run plus one release period; absent after validTo." }
        version: { type: integer }
    SchedulingAgreementPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SchedulingAgreementMonitorRow' } }
        nextCursor: { type: string, format: uuid }
    SchedulingReleaseInput:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [FRC, JIT] }
        runDate: { $ref: '#/components/schemas/Day', description: "Defaults to today (UTC)." }
        cumulativeReset: { type: boolean, description: "Record a cumulative reset (new agreement year) so cumulative released may go below the previous release (BR-17.13)." }
    SchedulingReleaseLine:
      type: object
      properties:
        lineNo: { type: integer, description: "Position in delivery-date order." }
        scheduleLineNo: { type: integer }
        deliveryDate: { $ref: '#/components/schemas/Day' }
        zone: { type: string, enum: [FIRM, TRADEOFF, FORECAST] }
        inHorizon: { type: boolean, description: "Inside the FRC or JIT horizon of the kind." }
        qty: { $ref: '#/components/schemas/Money' }
        cumulativeReleased: { $ref: '#/components/schemas/Money' }
        cumulativeReceived: { $ref: '#/components/schemas/Money' }
    SchedulingRelease:
      type: object
      properties:
        id: { type: string, format: uuid }
        agreementId: { type: string, format: uuid }
        releaseNo: { type: integer }
        number: { type: string, example: "REL-SA-00000001-1" }
        kind: { type: string, enum: [FRC, JIT] }
        runDate: { $ref: '#/components/schemas/Day' }
        agreementVersion: { type: integer, description: "Agreement version the release snapshots." }
        cumulativeReset: { type: boolean }
        cumulativeReleased: { $ref: '#/components/schemas/Money' }
        cumulativeReceived: { $ref: '#/components/schemas/Money' }
