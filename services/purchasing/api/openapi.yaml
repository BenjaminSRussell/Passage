        zonesAsOf: { $ref: '#/components/schemas/Day' }
        version: { type: integer }
        lines: { type: array, items: { $ref: '#/components/schemas/ScheduleLine' } }
        warnings: { type: array, items: { type: string }, description: "On a schedule replacement: one per reduction inside the trade-off zone." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SchedulingAgreementMonitorRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        unit: { type: string }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        releaseFrequency: { type: string, enum: [DAILY, WEEKLY, MONTHLY] }
        scheduledQty: { $ref: '#/components/schemas/Money' }
        receivedQty: { $ref: '#/components/schemas/Money' }
        openQty: { $ref: '#/components/schemas/Money', description: "Open cumulative quantity: scheduled minus received." }
        releaseCount: { type: integer }
