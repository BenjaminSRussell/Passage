        '422': { description: Bad id (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}/lines/{lineNo}/delivery-schedule:
    get:
      operationId: getDeliverySchedule
      x-passage-duty: procurement.purchase-order.inquire
      summary: The delivery schedule of one PO line (ETag = PO row version; duty procurement.purchase-order.inquire)
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/LineNo' }]
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryScheduleResult' }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND) or the line has no schedule (PRC-DS-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Bad id or line number (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    put:
      operationId: putDeliverySchedule
      x-passage-duty: procurement.purchase-order.maintain
      summary: Replace the delivery schedule of one PO line; the rows add up to the line quantity (FR-17.10; duty procurement.purchase-order.maintain)
      description: >-
        Rows are numbered in delivery date order. Allowed on a DRAFT or REJECTED PO only; a confirmed PO changes
        quantities and dates through change management (PATCH). If-Match is the PO row version; the write bumps
