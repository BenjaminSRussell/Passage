          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoicingPlanResult' }
        '404': { description: Purchase order (PRC-PO-NOT-FOUND) or line (PRC-PO-LINE-NOT-FOUND) not found, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current PO row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'Validation (COM-0001), plan total ≠ line amount (PRC-IP-001), invoiced rows (PRC-IP-002), cancelled or finalized PO or cancelled line (PRC-IP-003)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    delete:
      operationId: deleteInvoicingPlan
      x-passage-duty: PurchaseOrderMaintain
      summary: Remove the invoicing plan of one PO line (duty PurchaseOrderMaintain)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/LineNo' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204':
          description: Removed; the ETag is the new PO row version
          headers:
            ETag: { schema: { type: string } }
        '404': { description: Purchase order, line or plan not found, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current PO row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: The plan has invoiced rows (PRC-IP-002), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}/lines/{lineNo}/invoicing-plan/rows/{seq}/settlement:
    put:
      operationId: settleInvoicingPlanRow
      x-passage-duty: procurement.invoicing-plan.settle
      summary: Receiving reports that it settled a plan row; the row becomes INVOICED (#289; duty procurement.invoicing-plan.settle, held only by receiving's service grant)
      description: >-
        Service-only: 403 unless the call carries a verified service token from receiving. Idempotent per row and
        settlementRef; the same reference and amount again answers 200 with replayed true once the row is INVOICED.
        The settlement is the truth: if a reprice changed the row's amount in between, the row becomes INVOICED at
        the settled amount and the difference is shared over the remaining OPEN rows; 409 only when the line cannot
        absorb it (logged and counted for a person to resolve). An INVOICED row is never re-split by a later
        line amount change (BR-17.17). The record keeps the settlement reference, amount and actor.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/LineNo' }
        - { name: seq, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 120 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settlementRef, amount]
              additionalProperties: false
              properties:
                settlementRef: { type: string, maxLength: 255, description: The receiving settlement id }
                amount: { type: string, description: Decimal string, the amount receiving settled }
      responses:
        '200':
          description: The row is INVOICED
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchaseOrderId: { type: string, format: uuid }
                  lineNo: { type: integer }
                  seq: { type: integer }
                  status: { type: string, enum: [INVOICED] }
                  settlementRef: { type: string }
                  amount: { type: string }
                  replayed: { type: boolean }
        '403': { description: Not called by the receiving service (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Purchase order (PRC-PO-NOT-FOUND) or plan row (PRC-IP-NOT-FOUND) not found, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: The row is settled under another reference or amount, or the line cannot absorb the settled amount (PRC-IP-004), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Validation (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/pricing/lookup:
    get:
      operationId: lookupPrice
      x-passage-duty: PurchaseOrderMaintain
      summary: Resolve the trade agreement price with explain (FR-17.6; duty PurchaseOrderMaintain)
      parameters:
        - { name: vendor, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: product, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: qty, in: query, required: true, schema: { $ref: '#/components/schemas/Money' } }
        - { name: date, in: query, required: true, schema: { $ref: '#/components/schemas/Day' } }
        - { name: currency, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: unit, in: query, required: true, schema: { type: string } }
        - { name: vendorGroup, in: query, required: false, description: "Vendor groups the vendor belongs to (repeat or comma-separate); added to the wave 7 memberships.", schema: { type: array, items: { type: string, format: uuid } }, explode: true }
        - { name: productGroup, in: query, required: false, description: "Product groups the product belongs to (repeat or comma-separate); added to the wave 8 memberships.", schema: { type: array, items: { type: string, format: uuid } }, explode: true }
        - { name: tie, in: query, required: false, description: "After specificity: LATEST_FROM_DATE orders by latest valid_from then lowest price; LOWEST_PRICE the other way round.", schema: { type: string, enum: [LATEST_FROM_DATE, LOWEST_PRICE], default: LATEST_FROM_DATE } }
      responses:
        '200':
          description: Winner (or null) and candidate explain list
