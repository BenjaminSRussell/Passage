openapi: 3.1.0
info:
  title: Passage Purchasing API
  version: 0.3.0
  description: |
    Wave 17 (PSG-17) slices 1 to 3: purchase requisitions with policy-routed approval,
    consolidation of approved requisition lines into purchase orders, purchase orders
    with agreement and trade-agreement pricing, the purchase order lifecycle (submit,
    approve, reject, confirm, cancel) with versioned change management, purchase
    agreements with release tracking, trade agreements and price lookup.
    Mounted at /v1/procurement. The browser reaches the same paths under /api/v1/procurement
    through the web BFF. Errors are RFC 9457 problem details; see README for codes.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted version number read from the ETag of the resource.
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: The nextCursor of the previous page (the id of its last row). Lists are newest first.
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 problem; `code` names the rule (see README)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Money:
      type: string
      description: Decimal string, never a float.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    Day:
      type: string
      format: date
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: "https://passage.dev/problems/PRC-PRICE-001" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    RequisitionLineInput:
      type: object
      required: [qty, unit, requestedDate]
      properties:
        productId: { type: string, format: uuid }
        description: { type: string }
        category: { type: string }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        estimatedUnitPrice: { $ref: '#/components/schemas/Money' }
        requestedDate: { $ref: '#/components/schemas/Day' }
        siteId: { type: string, format: uuid }
        preferredVendorId: { type: string, format: uuid, description: "With productId and no estimate, the estimate defaults from this vendor's trade agreement." }
    RequisitionInput:
      type: object
      required: [legalEntityId, currency, lines]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        operatingUnitId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/RequisitionLineInput' }
    RequisitionLine:
      type: object
      properties:
        id: { type: string, format: uuid, description: "Referenced by PO lines as requisitionLineId." }
        lineNo: { type: integer }
        productId: { type: string, format: uuid }
        description: { type: string }
        category: { type: string }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        estimatedUnitPrice: { $ref: '#/components/schemas/Money' }
        amount: { $ref: '#/components/schemas/Money' }
        requestedDate: { $ref: '#/components/schemas/Day' }
        siteId: { type: string, format: uuid }
        preferredVendorId: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, CONSOLIDATED, CANCELLED] }
        purchaseOrderId: { type: string, format: uuid, description: "Set when CONSOLIDATED: the PO that orders the line." }
        purchaseOrderLineNo: { type: integer, description: "Set when CONSOLIDATED: the PO line that orders the line." }
    Requisition:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: "PR-000001" }
        legalEntityId: { type: string, format: uuid }
        operatingUnitId: { type: string, format: uuid }
        requesterId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CLOSED, CANCELLED] }
        currency: { type: string }
        total: { $ref: '#/components/schemas/Money' }
        approverChain:
          type: array
          items: { type: string, enum: [MANAGER, CATEGORY_OWNER, CFO] }
        policyVersion: { type: string }
        version: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/RequisitionLine' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        warnings:
          type: array
          description: Returned on create only; PRC-REQ-003 when a line's estimate stayed 0.
          items:
            type: object
            properties:
              code: { type: string, example: PRC-REQ-003 }
              lineNo: { type: integer }
              detail: { type: string }
    RequisitionSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        legalEntityId: { type: string, format: uuid }
        requesterId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CLOSED, CANCELLED] }
        currency: { type: string }
        total: { $ref: '#/components/schemas/Money' }
        lineCount: { type: integer }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    RequisitionPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RequisitionSummary' } }
        nextCursor: { type: string, format: uuid }
    PriceChargeInput:
      type: object
      required: [calc, value]
      properties:
        calc: { type: string, enum: [FIXED, PER_UNIT, PERCENT] }
        value: { $ref: '#/components/schemas/Money' }
    PurchaseOrderLineInput:
      type: object
      required: [qty, unit, deliveryDate]
      properties:
        lineNo: { type: integer, minimum: 1, description: "PATCH only: the existing line this entry changes; omit for a new line. Ignored on create." }
        productId: { type: string, format: uuid }
        description: { type: string }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        unitPrice: { $ref: '#/components/schemas/Money', description: "Omit to take the trade agreement price (on PATCH, an existing line with the same product and unit keeps its price)." }
        priceUnit: { $ref: '#/components/schemas/Money' }
        discountPct: { $ref: '#/components/schemas/Money' }
        taxAmount: { $ref: '#/components/schemas/Money', description: "Tax from the wave 13 engine; supplied by the caller in this slice." }
        deliveryDate: { $ref: '#/components/schemas/Day' }
        requisitionLineId: { type: string, format: uuid, description: "An OPEN line of an APPROVED requisition of the same legal entity; it becomes CONSOLIDATED." }
        agreementLineId: { type: string, format: uuid, description: "Releases the line against this purchase agreement line (FR-17.5, BR-17.10). Its price is used when the agreement line has priceOverride." }
    PurchaseOrderInput:
      type: object
      required: [legalEntityId, vendorId, currency, lines]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        changeManagement: { type: boolean, default: true }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PurchaseOrderLineInput' }
        charges:
          type: array
          items: { $ref: '#/components/schemas/PriceChargeInput' }
    PurchaseOrderLine:
      type: object
      properties:
        lineNo: { type: integer }
        productId: { type: string, format: uuid }
        description: { type: string }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        unitPrice: { $ref: '#/components/schemas/Money' }
        priceUnit: { $ref: '#/components/schemas/Money' }
        discountPct: { $ref: '#/components/schemas/Money' }
        grossAmount: { $ref: '#/components/schemas/Money' }
        discountAmount: { $ref: '#/components/schemas/Money' }
        lineAmount: { $ref: '#/components/schemas/Money' }
        taxAmount: { $ref: '#/components/schemas/Money' }
        deliveryDate: { $ref: '#/components/schemas/Day' }
        priceSource: { type: string, description: "MANUAL, AGREEMENT:<agreement line id>, TRADE_AGREEMENT:<id> or REQUISITION_ESTIMATE" }
        requisitionLineId: { type: string, format: uuid }
        agreementLineId: { type: string, format: uuid }
        receivedQty: { $ref: '#/components/schemas/Money', description: "Written by receiving (wave 18); a quantity cannot drop below it (PRC-PO-007)." }
        invoicedQty: { $ref: '#/components/schemas/Money', description: "Written by payables (wave 18)." }
        status: { type: string, enum: [OPEN, RECEIVED, INVOICED, CANCELLED] }
    PatchOp:
      type: object
      required: [op, path]
      properties:
        op: { type: string, enum: [add, remove, replace] }
        path: { type: string, example: /lines/0/qty }
        value: {}
    PurchaseOrderVersion:
      type: object
      required: [versionNo, reapprovalRequired, createdAt, patch, snapshot]
      properties:
        versionNo: { type: integer, minimum: 1 }
        confirmedAt: { type: string, format: date-time, description: "Absent while the version waits for re-approval." }
        confirmedBy: { type: string, format: uuid }
        reapprovalRequired: { type: boolean }
        createdAt: { type: string, format: date-time }
        patch:
          type: array
          description: RFC 6902 diff from the previous version's snapshot; empty for version 1.
          items: { $ref: '#/components/schemas/PatchOp' }
        snapshot:
          type: object
          description: The commercial content at this version. Lines are in line number order and keep cancelled lines, so /lines/n names the same line in every version.
          properties:
            currency: { type: string }
            total: { $ref: '#/components/schemas/Money' }
            lines:
              type: array
              items:
                type: object
                properties:
                  lineNo: { type: integer }
                  productId: { type: string, format: uuid }
                  description: { type: string }
                  qty: { $ref: '#/components/schemas/Money' }
                  unit: { type: string }
                  unitPrice: { $ref: '#/components/schemas/Money' }
                  priceUnit: { $ref: '#/components/schemas/Money' }
                  discountPct: { $ref: '#/components/schemas/Money' }
                  lineAmount: { $ref: '#/components/schemas/Money' }
                  taxAmount: { $ref: '#/components/schemas/Money' }
                  deliveryDate: { $ref: '#/components/schemas/Day' }
                  status: { type: string, enum: [OPEN, CANCELLED] }
            charges:
              type: array
              items:
                type: object
                properties:
                  calc: { type: string, enum: [FIXED, PER_UNIT, PERCENT] }
                  value: { $ref: '#/components/schemas/Money' }
                  amount: { $ref: '#/components/schemas/Money' }
    PurchaseOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: "PO-000001" }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        currency: { type: string }
        approvalStatus: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CONFIRMED, FINALIZED, CANCELLED] }
        documentStatus: { type: string, enum: [NONE, RECEIVED_PARTIAL, RECEIVED, INVOICED_PARTIAL, INVOICED] }
        versionNo: { type: integer }
        changeManagement: { type: boolean }
        subtotal: { $ref: '#/components/schemas/Money' }
        discountTotal: { $ref: '#/components/schemas/Money' }
        chargesTotal: { $ref: '#/components/schemas/Money' }
        taxTotal: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money', description: "Equals subtotal − discountTotal + chargesTotal + taxTotal." }
        rowVersion: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PurchaseOrderLine' }
        charges:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              calc: { type: string }
              value: { $ref: '#/components/schemas/Money' }
              amount: { $ref: '#/components/schemas/Money' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        warnings:
          type: array
          description: Returned on create only; PRC-AGR-004 when a release takes an agreement line to the threshold or over a SOFT limit.
          items: { $ref: '#/components/schemas/Warning' }
    Warning:
      type: object
      properties:
        code: { type: string, example: PRC-AGR-004 }
        lineNo: { type: integer }
        detail: { type: string }
    PurchaseOrderSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        currency: { type: string }
        approvalStatus: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CONFIRMED, FINALIZED, CANCELLED] }
        documentStatus: { type: string, enum: [NONE, RECEIVED_PARTIAL, RECEIVED, INVOICED_PARTIAL, INVOICED] }
        total: { $ref: '#/components/schemas/Money' }
        lineCount: { type: integer }
        rowVersion: { type: integer }
        createdAt: { type: string, format: date-time }
    PurchaseOrderPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PurchaseOrderSummary' } }
        nextCursor: { type: string, format: uuid }
    SourcingLine:
      description: An OPEN line of an APPROVED requisition, with the header facts consolidation needs.
      allOf:
        - $ref: '#/components/schemas/RequisitionLine'
        - type: object
          properties:
            requisitionId: { type: string, format: uuid }
            requisitionNumber: { type: string }
            requisitionStatus: { type: string }
            legalEntityId: { type: string, format: uuid }
            currency: { type: string }
    SourcingLinePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SourcingLine' } }
        nextCursor: { type: string, format: uuid }
    ConsolidationInput:
      type: object
      required: [lines]
      additionalProperties: false
      properties:
        windowDays: { type: integer, minimum: 1, maximum: 60, default: 7, description: "Delivery window: a PO holds lines requested less than windowDays after its earliest line." }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [requisitionLineId]
            additionalProperties: false
            properties:
              requisitionLineId: { type: string, format: uuid }
              vendorId: { type: string, format: uuid, description: "Buyer override; defaults to the line's preferred vendor." }
              agreementLineId: { type: string, format: uuid }
    ConsolidationResult:
      type: object
      properties:
        purchaseOrders:
          type: array
          items: { $ref: '#/components/schemas/PurchaseOrder' }
    PurchaseAgreementLineInput:
      type: object
      required: [commitmentType]
      additionalProperties: false
      properties:
        commitmentType: { type: string, enum: [QUANTITY, VALUE, CATEGORY_VALUE, TOTAL_VALUE] }
        productId: { type: string, format: uuid, description: "Required for QUANTITY and VALUE." }
        category: { type: string, description: "Required for CATEGORY_VALUE." }
        unit: { type: string, description: "Required for QUANTITY." }
        committedQty: { $ref: '#/components/schemas/Money', description: "Positive for QUANTITY." }
        committedAmount: { $ref: '#/components/schemas/Money', description: "Positive for VALUE, CATEGORY_VALUE and TOTAL_VALUE." }
        unitPrice: { $ref: '#/components/schemas/Money' }
        discountPct: { $ref: '#/components/schemas/Money' }
        maxEnforced: { type: string, enum: [HARD, SOFT, NONE], default: HARD }
        priceOverride: { type: boolean, description: "QUANTITY or VALUE only; the unit price then replaces trade agreement prices on releases." }
    PurchaseAgreementInput:
      type: object
      required: [legalEntityId, vendorId, currency, validFrom, lines]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { type: string, enum: [DRAFT, EFFECTIVE], default: EFFECTIVE }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/PurchaseAgreementLineInput' }
    PurchaseAgreementLine:
      type: object
      properties:
        id: { type: string, format: uuid, description: "Referenced by PO lines as agreementLineId." }
        lineNo: { type: integer }
        commitmentType: { type: string, enum: [QUANTITY, VALUE, CATEGORY_VALUE, TOTAL_VALUE] }
        productId: { type: string, format: uuid }
        category: { type: string }
        unit: { type: string }
        committedQty: { $ref: '#/components/schemas/Money' }
        committedAmount: { $ref: '#/components/schemas/Money' }
        unitPrice: { $ref: '#/components/schemas/Money' }
        discountPct: { $ref: '#/components/schemas/Money' }
        maxEnforced: { type: string, enum: [HARD, SOFT, NONE] }
        priceOverride: { type: boolean }
        releasedQty: { $ref: '#/components/schemas/Money' }
        releasedAmount: { $ref: '#/components/schemas/Money' }
        pctReleased: { $ref: '#/components/schemas/Money', description: "Released as a percentage of committed, on the quantity for QUANTITY and the amount otherwise." }
        remaining: { $ref: '#/components/schemas/Money', description: "Committed minus released on the same measure; negative after a SOFT or NONE overrun." }
    AgreementRelease:
      type: object
      properties:
        agreementLineId: { type: string, format: uuid }
        purchaseOrderId: { type: string, format: uuid }
        purchaseOrderNumber: { type: string }
        lineNo: { type: integer }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        lineAmount: { $ref: '#/components/schemas/Money' }
        deliveryDate: { $ref: '#/components/schemas/Day' }
        approvalStatus: { type: string }
        createdAt: { type: string, format: date-time }
    PurchaseAgreement:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: "PA-00000001" }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        currency: { type: string }
        status: { type: string, enum: [DRAFT, EFFECTIVE, ON_HOLD, CLOSED] }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        version: { type: integer }
        lines: { type: array, items: { $ref: '#/components/schemas/PurchaseAgreementLine' } }
        releases: { type: array, items: { $ref: '#/components/schemas/AgreementRelease' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PurchaseAgreementSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        currency: { type: string }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        status: { type: string, enum: [DRAFT, EFFECTIVE, ON_HOLD, CLOSED] }
        lineCount: { type: integer }
        maxPctReleased: { $ref: '#/components/schemas/Money', description: "Highest release percentage across the lines." }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    PurchaseAgreementPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PurchaseAgreementSummary' } }
        nextCursor: { type: string, format: uuid }
    TradeAgreementPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TradeAgreement' } }
        nextCursor: { type: string, format: uuid }
    TradeAgreementInput:
      type: object
      required: [relation, accountCode, itemCode, currency, unit, price, validFrom]
      additionalProperties: false
      properties:
        relation: { type: string, enum: [PRICE] }
        accountCode: { type: string, enum: [VENDOR, GROUP, ALL] }
        accountId: { type: string, format: uuid }
        itemCode: { type: string, enum: [PRODUCT, GROUP, ALL] }
        itemId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        unit: { type: string }
        fromQty: { $ref: '#/components/schemas/Money' }
        toQty: { $ref: '#/components/schemas/Money' }
        price: { $ref: '#/components/schemas/Money' }
        priceUnit: { $ref: '#/components/schemas/Money' }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        consignment: { type: boolean }
    TradeAgreement:
      type: object
      properties:
        id: { type: string, format: uuid }
        relation: { type: string }
        accountCode: { type: string }
        accountId: { type: string, format: uuid }
        itemCode: { type: string }
        itemId: { type: string, format: uuid }
        currency: { type: string }
        unit: { type: string }
        fromQty: { $ref: '#/components/schemas/Money' }
        toQty: { $ref: '#/components/schemas/Money' }
        price: { $ref: '#/components/schemas/Money' }
        priceUnit: { $ref: '#/components/schemas/Money' }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        consignment: { type: boolean }
        status: { type: string, enum: [DRAFT, ACTIVE, EXPIRED] }
    PriceLookup:
      type: object
      properties:
        winner:
          oneOf:
            - $ref: '#/components/schemas/TradeAgreement'
            - type: 'null'
        candidates:
          type: array
          items:
            type: object
            properties:
              agreementId: { type: string, format: uuid }
              specificity: { type: integer }
              matched: { type: boolean }
              rank: { type: integer }
              reason: { type: string }
paths:
  /v1/procurement/requisitions:
    post:
      operationId: createRequisition
      summary: Create a DRAFT requisition (duty RequisitionCreate)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequisitionInput' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisition' }
        '400': { description: Malformed body or missing Idempotency-Key, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty or legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Validation, PRC-REQ-002 (more than 500 lines) or idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      operationId: listRequisitions
      summary: List requisitions newest first (duty RequisitionCreate)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CLOSED, CANCELLED] } }
        - { name: mine, in: query, required: false, description: "true limits the list to the caller's requisitions", schema: { type: boolean } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequisitionPage' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/requisitions/{id}:
    get:
      operationId: getRequisition
      summary: Read a requisition (ETag = version; duty RequisitionCreate)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisition' }
        '404': { description: Not found, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/requisitions/{id}:submit:
    post:
      operationId: submitRequisition
      summary: Submit for approval; routes by amount and category; APPROVED when the chain is empty. A replayed Idempotency-Key returns the requisition as it is now.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Submitted
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisition' }
        '403': { description: Caller is not the requester (PRC-REQ-004), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: Version changed (PRC-VERSION-CONFLICT) or not DRAFT, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/requisition-lines:
    get:
      operationId: listOpenRequisitionLines
      summary: Consolidation queue - OPEN lines of APPROVED requisitions, newest first (FR-17.3; duty PurchaseOrderMaintain)
      parameters:
        - { name: sourcing, in: query, required: false, description: "NEEDS_SOURCING keeps lines with no preferred vendor; HAS_VENDOR those with one.", schema: { type: string, enum: [NEEDS_SOURCING, HAS_VENDOR] } }
        - { name: vendorId, in: query, required: false, description: Preferred vendor, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourcingLinePage' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/requisitions:consolidate:
    post:
      operationId: consolidateRequisitions
      summary: Create DRAFT purchase orders from approved requisition lines, one per legal entity, vendor, currency, site and delivery window (FR-17.3; duty PurchaseOrderMaintain). A replayed Idempotency-Key returns the POs the lines went into.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsolidationInput' }
      responses:
        '201':
          description: The purchase orders created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsolidationResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: Missing duty or a line's legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Requisition line not found (PRC-REQ-LINE-NOT-FOUND) or agreement line not found (PRC-AGR-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: A line is not OPEN on an APPROVED requisition (PRC-REQ-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation, no vendor for a line (PRC-CONS-002), window outside 1-60 (PRC-CONS-001), agreement rules (PRC-AGR-003/005/006/007/008) or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders:
    post:
      operationId: createPurchaseOrder
      summary: Create a DRAFT purchase order, pricing lines from trade agreements when unitPrice is omitted
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: Missing duty or legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Requisition line (PRC-REQ-LINE-NOT-FOUND) or agreement line (PRC-AGR-NOT-FOUND) not found, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: A requisition line is not OPEN on an APPROVED requisition (PRC-REQ-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation, missing price (PRC-PRICE-001), requisition of another legal entity (PRC-REQ-005), agreement rules (PRC-AGR-003 HARD limit, PRC-AGR-005 validity, PRC-AGR-006 party, PRC-AGR-007 not EFFECTIVE, PRC-AGR-008 product or unit)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      operationId: listPurchaseOrders
      summary: List purchase orders newest first (duty PurchaseOrderInquire)
      parameters:
        - { name: approvalStatus, in: query, required: false, schema: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CONFIRMED, FINALIZED, CANCELLED] } }
        - { name: vendorId, in: query, required: false, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrderPage' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/purchase-orders/{id}:
    get:
      operationId: getPurchaseOrder
      summary: Read a purchase order (ETag = row version; duty PurchaseOrderInquire)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '404': { description: Not found, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    patch:
      operationId: editPurchaseOrder
      summary: Replace the lines and charges of a PO (FR-17.8, BR-17.8; duty PurchaseOrderMaintain)
      description: |
        The body is the whole order as on create. A line with lineNo changes that existing line; a line
        without lineNo is new and is numbered after the highest line on the PO; a live line left out is
        cancelled (BR-17.9) and returns what it held (agreement release, requisition line). An existing
        line that omits unitPrice keeps its price and price source while its product and unit stay the
        same. Vendor, currency and legal entity cannot change; site and warehouse cannot change after
        the first confirmation. Lines drawn against a purchase agreement keep their quantity and amount,
        and a new delivery date must stay within the agreement validity (PRC-AGR-005).
        Before the first confirmation the edit returns the PO to DRAFT. After it, the change is the next
        version: when change management is on and a reapproval rule fires (quantity or price up more
        than 5 %, or a new line) the PO goes to IN_REVIEW with the version pending; otherwise the version
        is confirmed at once and po.confirmed and poversion.created are written. Editing a pending change
        back to the confirmed content drops it. APPROVED, FINALIZED and CANCELLED orders cannot be edited.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '200':
          description: Edited
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { description: If-Match not a number (PRC-IFMATCH-002), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Legal entity outside the caller's scope, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Not found (PRC-PO-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Validation (COM-0001), PRC-PO-STATE (status does not allow edits or the line is cancelled), PRC-PO-007 (below received or invoiced), PRC-PO-010 (requisition or agreement link changed, or an agreement line's quantity or amount changed), PRC-AGR-005, PRC-PRICE-001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}:submit:
    post:
      operationId: submitPurchaseOrder
      summary: DRAFT or REJECTED to IN_REVIEW (duty PurchaseOrderMaintain). A replayed Idempotency-Key returns the PO as it is now.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Submitted
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { description: Idempotency-Key missing (PRC-IDEM-001) or If-Match not a number (PRC-IFMATCH-002), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Not DRAFT or REJECTED (PRC-PO-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}:approve:
    post:
      operationId: approvePurchaseOrder
      summary: IN_REVIEW to APPROVED (duty PurchaseOrderConfirm; stands in for the wave 4 approval task)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Approved
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { description: Idempotency-Key missing (PRC-IDEM-001) or If-Match not a number (PRC-IFMATCH-002), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing PurchaseOrderConfirm duty, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Not IN_REVIEW (PRC-PO-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}:reject:
    post:
      operationId: rejectPurchaseOrder
      summary: IN_REVIEW to REJECTED (duty PurchaseOrderConfirm). A rejected PO is edited and submitted again; a rejected change to a confirmed PO can also be edited back to the confirmed content.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Rejected
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { description: Idempotency-Key missing (PRC-IDEM-001) or If-Match not a number (PRC-IFMATCH-002), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing PurchaseOrderConfirm duty, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Not IN_REVIEW (PRC-PO-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}:confirm:
    post:
      operationId: confirmPurchaseOrder
      summary: APPROVED to CONFIRMED (duty PurchaseOrderConfirm). Confirms version 1, or the pending change version, and writes po.confirmed (and poversion.created above version 1).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Confirmed
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { description: Idempotency-Key missing (PRC-IDEM-001) or If-Match not a number (PRC-IFMATCH-002), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing PurchaseOrderConfirm duty, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Not APPROVED or no pending change (PRC-PO-008), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}:cancel:
    post:
      operationId: cancelPurchaseOrder
      summary: Cancel every open line of a PO with nothing received or invoiced (BR-17.2; duty PurchaseOrderMaintain). Returns agreement releases and requisition lines and writes po.cancelled.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Cancelled
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { description: Idempotency-Key missing (PRC-IDEM-001) or If-Match not a number (PRC-IFMATCH-002), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Received or invoiced quantity exists, or FINALIZED or CANCELLED (PRC-PO-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}/versions:
    get:
      operationId: listPurchaseOrderVersions
      summary: Every stored version of a PO, oldest first, a pending change included (FR-17.8; duty PurchaseOrderInquire)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PurchaseOrderVersion' }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}/versions/{n}/diff:
    get:
      operationId: getPurchaseOrderVersionDiff
      summary: JSON Patch (RFC 6902) from version n-1 to version n (duty PurchaseOrderInquire)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Patch and version state
          content:
            application/json:
              schema:
                type: object
                required: [purchaseOrderId, fromVersion, toVersion, confirmed, reapprovalRequired, patch]
                properties:
                  purchaseOrderId: { type: string, format: uuid }
                  fromVersion: { type: integer }
                  toVersion: { type: integer }
                  confirmed: { type: boolean }
                  confirmedAt: { type: string, format: date-time }
                  reapprovalRequired: { type: boolean }
                  patch:
                    type: array
                    items: { $ref: '#/components/schemas/PatchOp' }
        '404': { description: Version not found (PRC-PO-VERSION-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Version number not an integer of at least 1 (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/pricing/lookup:
    get:
      operationId: lookupPrice
      summary: Resolve the trade agreement price with explain (FR-17.6; duty PurchaseOrderMaintain)
      parameters:
        - { name: vendor, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: product, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: qty, in: query, required: true, schema: { $ref: '#/components/schemas/Money' } }
        - { name: date, in: query, required: true, schema: { $ref: '#/components/schemas/Day' } }
        - { name: currency, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: unit, in: query, required: true, schema: { type: string } }
        - { name: vendorGroup, in: query, required: false, description: "Vendor groups the vendor belongs to (repeat or comma-separate); added to the wave 7 memberships.", schema: { type: array, items: { type: string, format: uuid } }, explode: true }
        - { name: productGroup, in: query, required: false, description: "Product groups the product belongs to (repeat or comma-separate); added to the wave 8 memberships.", schema: { type: array, items: { type: string, format: uuid } }, explode: true }
        - { name: tie, in: query, required: false, description: "After specificity: LATEST_FROM_DATE orders by latest valid_from then lowest price; LOWEST_PRICE the other way round.", schema: { type: string, enum: [LATEST_FROM_DATE, LOWEST_PRICE], default: LATEST_FROM_DATE } }
      responses:
        '200':
          description: Winner (or null) and candidate explain list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceLookup' }
        '422': { description: Validation or bad tie rule (PRC-PRICE-002), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/trade-agreements:
    post:
      operationId: createTradeAgreement
      summary: Create an ACTIVE PRICE trade agreement row (duty TradeAgreementMaintain)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TradeAgreementInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeAgreement' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { description: "PRC-TA-002: an ACTIVE row with the same account, item, currency, unit and valid_from overlaps the quantity break", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Validation or idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      operationId: listTradeAgreements
      summary: List trade agreement rows newest first (duty TradeAgreementMaintain)
      parameters:
        - { name: accountId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: itemId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [DRAFT, ACTIVE, EXPIRED] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeAgreementPage' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/trade-agreements/{id}:
    get:
      operationId: getTradeAgreement
      summary: Read a trade agreement row (duty TradeAgreementMaintain)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeAgreement' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/procurement/agreements:
    post:
      operationId: createPurchaseAgreement
      summary: Create a purchase agreement, EFFECTIVE unless DRAFT is asked for (FR-17.5; duty AgreementMaintain)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseAgreementInput' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseAgreement' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: Missing duty or legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Validation, more than 500 lines (PRC-AGR-002) or idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      operationId: listPurchaseAgreements
      summary: List purchase agreements newest first with their highest release level (duty AgreementMaintain)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [DRAFT, EFFECTIVE, ON_HOLD, CLOSED] } }
        - { name: vendorId, in: query, required: false, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseAgreementPage' }
        '422': { $ref: '#/components/responses/Problem' }
