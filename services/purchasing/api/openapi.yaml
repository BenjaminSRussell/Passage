        '404': { description: "Purchase order (PRC-PO-NOT-FOUND), line or schedule row (PRC-DS-NOT-FOUND) not found", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current PO row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'Validation (COM-0001), PO not CONFIRMED or line cancelled (PRC-DS-002)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/pricing/lookup:
    get:
      operationId: lookupPrice
