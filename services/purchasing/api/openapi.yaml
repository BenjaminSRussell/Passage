openapi: 3.1.0
info:
  title: Passage Purchasing API
  version: 0.9.0
  description: |
    Wave 17 (PSG-17) slices 1 to 9: purchase requisitions with policy-routed approval,
    consolidation of approved requisition lines into purchase orders, purchase orders
    with agreement and trade-agreement pricing, the purchase order lifecycle (submit,
    approve, reject, confirm, cancel) with versioned change management, purchase
    agreements with release tracking, trade agreements and price lookup, the request
    for quotation cycle (create, send, replies, compare, award to purchase orders) with
    sealed bids and weighted scoring, invoicing plans on purchase order lines, and the
    subsequent price change (reprice) of confirmed purchase orders, and scheduling
    agreements with firm and trade-off zones and FRC/JIT releases with cumulative quantities, and
    the purchasing policy per legal entity (change management default, PO four-eyes, invoice before receipt).
    Mounted at /v1/procurement. The browser reaches the same paths under /api/v1/procurement
    through the web BFF. Errors are RFC 9457 problem details; see README for codes.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    LegalEntityId:
      name: legalEntityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted version number read from the ETag of the resource.
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LineNo:
      name: lineNo
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 9999 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: The nextCursor of the previous page (the id of its last row). Lists are newest first.
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 problem; `code` names the rule (see README)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    PurchasingPolicy:
      type: object
      required: [legalEntityId, changeManagementDefault, poFourEyes, allowInvoiceBeforeReceipt, version]
      properties:
        legalEntityId: { type: string, format: uuid }
        changeManagementDefault: { type: boolean, description: "changeManagement of a new PO that does not say (default true)" }
        poFourEyes: { type: boolean, description: "a user who created, submitted or last changed a PO cannot approve or confirm it (PRC-POL-002, 403)" }
        allowInvoiceBeforeReceipt: { type: boolean, description: "a PO line quantity may drop below invoiced, never below received (BR-17.7)" }
        version: { type: integer, minimum: 0, description: "0 when no policy is saved yet" }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    PurchasingPolicyInput:
      type: object
      required: [changeManagementDefault, poFourEyes, allowInvoiceBeforeReceipt]
      additionalProperties: false
      properties:
        changeManagementDefault: { type: boolean }
        poFourEyes: { type: boolean }
        allowInvoiceBeforeReceipt: { type: boolean }
    Money:
      type: string
      description: Decimal string, never a float.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    Day:
      type: string
      format: date
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: "https://passage.dev/problems/PRC-PRICE-001" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    RequisitionLineInput:
      type: object
      required: [qty, unit, requestedDate]
      properties:
        productId: { type: string, format: uuid }
        description: { type: string }
        category: { type: string }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        estimatedUnitPrice: { $ref: '#/components/schemas/Money' }
        requestedDate: { $ref: '#/components/schemas/Day' }
        siteId: { type: string, format: uuid }
        preferredVendorId: { type: string, format: uuid, description: "With productId and no estimate, the estimate defaults from this vendor's trade agreement." }
        catalogEntryId: { type: string, format: uuid, description: "Pick the line from a PUBLISHED catalog entry (FR-17.18): blank product, description, category, unit, estimate and preferred vendor take the entry's values; a different unit or product is refused (COM-0001). 422 PRC-CAT-004 when the catalog is not published to the legal entity and unit today, PRC-CAT-006 when its currency differs." }
    RequisitionInput:
      type: object
      required: [legalEntityId, currency, lines]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        operatingUnitId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/RequisitionLineInput' }
    RequisitionLine:
      type: object
      properties:
        id: { type: string, format: uuid, description: "Referenced by PO lines as requisitionLineId." }
        lineNo: { type: integer }
        productId: { type: string, format: uuid }
        description: { type: string }
        category: { type: string }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        estimatedUnitPrice: { $ref: '#/components/schemas/Money' }
        amount: { $ref: '#/components/schemas/Money' }
        requestedDate: { $ref: '#/components/schemas/Day' }
        siteId: { type: string, format: uuid }
        preferredVendorId: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, CONSOLIDATED, CANCELLED] }
        purchaseOrderId: { type: string, format: uuid, description: "Set when CONSOLIDATED: the PO that orders the line." }
        purchaseOrderLineNo: { type: integer, description: "Set when CONSOLIDATED: the PO line that orders the line." }
        catalogEntryId: { type: string, format: uuid, description: "The catalog entry the line was picked from; absent on a non-catalog line." }
    Requisition:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: "PR-000001" }
        legalEntityId: { type: string, format: uuid }
        operatingUnitId: { type: string, format: uuid }
        requesterId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CLOSED, CANCELLED] }
        currency: { type: string }
        total: { $ref: '#/components/schemas/Money' }
        approverChain:
          type: array
          items: { type: string, enum: [MANAGER, CATEGORY_OWNER, CFO] }
        policyVersion: { type: string }
        version: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/RequisitionLine' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        warnings:
          type: array
          description: Returned on create only; PRC-REQ-003 when a line's estimate stayed 0.
          items:
            type: object
            properties:
              code: { type: string, example: PRC-REQ-003 }
              lineNo: { type: integer }
              detail: { type: string }
    RequisitionSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        legalEntityId: { type: string, format: uuid }
        requesterId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CLOSED, CANCELLED] }
        currency: { type: string }
        total: { $ref: '#/components/schemas/Money' }
        lineCount: { type: integer }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    RequisitionPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RequisitionSummary' } }
        nextCursor: { type: string, format: uuid }
    PriceChargeInput:
      type: object
      required: [calc, value]
      properties:
        calc: { type: string, enum: [FIXED, PER_UNIT, PERCENT] }
        value: { $ref: '#/components/schemas/Money' }
    PurchaseOrderLineInput:
      type: object
      required: [qty, unit, deliveryDate]
      properties:
        lineNo: { type: integer, minimum: 1, description: "PATCH only: the existing line this entry changes; omit for a new line. Ignored on create." }
        productId: { type: string, format: uuid }
        description: { type: string }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        unitPrice: { $ref: '#/components/schemas/Money', description: "Omit to take the trade agreement price (on PATCH, an existing line with the same product and unit keeps its price)." }
        priceUnit: { $ref: '#/components/schemas/Money' }
        discountPct: { $ref: '#/components/schemas/Money' }
        taxAmount: { $ref: '#/components/schemas/Money', description: "Tax from the wave 13 engine; supplied by the caller in this slice." }
        deliveryDate: { $ref: '#/components/schemas/Day' }
        requisitionLineId: { type: string, format: uuid, description: "An OPEN line of an APPROVED requisition of the same legal entity; it becomes CONSOLIDATED." }
        agreementLineId: { type: string, format: uuid, description: "Releases the line against this purchase agreement line (FR-17.5, BR-17.10). Its price is used when the agreement line has priceOverride." }
    PurchaseOrderInput:
      type: object
      required: [legalEntityId, vendorId, currency, lines]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        changeManagement: { type: boolean, default: true }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PurchaseOrderLineInput' }
        charges:
          type: array
          items: { $ref: '#/components/schemas/PriceChargeInput' }
    PurchaseOrderLine:
      type: object
      properties:
        lineNo: { type: integer }
        productId: { type: string, format: uuid }
        description: { type: string }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        unitPrice: { $ref: '#/components/schemas/Money' }
        priceUnit: { $ref: '#/components/schemas/Money' }
        discountPct: { $ref: '#/components/schemas/Money' }
        grossAmount: { $ref: '#/components/schemas/Money' }
        discountAmount: { $ref: '#/components/schemas/Money' }
        lineAmount: { $ref: '#/components/schemas/Money' }
        taxAmount: { $ref: '#/components/schemas/Money' }
        deliveryDate: { $ref: '#/components/schemas/Day' }
        priceSource: { type: string, description: "MANUAL, AGREEMENT:<agreement line id>, TRADE_AGREEMENT:<id> or REQUISITION_ESTIMATE" }
        requisitionLineId: { type: string, format: uuid }
        agreementLineId: { type: string, format: uuid }
        receivedQty: { $ref: '#/components/schemas/Money', description: "Written by receiving (wave 18); a quantity cannot drop below it (PRC-PO-007)." }
        invoicedQty: { $ref: '#/components/schemas/Money', description: "Written by payables (wave 18)." }
        status: { type: string, enum: [OPEN, RECEIVED, INVOICED, CANCELLED] }
        invoicedRepriceSource: { type: string, description: "TRADE_AGREEMENT:<id> a reprice run last handed to payables for this invoiced line (FR-17.22, BR-17.18); absent when none." }
    PatchOp:
      type: object
      required: [op, path]
      properties:
        op: { type: string, enum: [add, remove, replace] }
        path: { type: string, example: /lines/0/qty }
        value: {}
    PurchaseOrderVersion:
      type: object
      required: [versionNo, reapprovalRequired, createdAt, patch, snapshot]
      properties:
        versionNo: { type: integer, minimum: 1 }
        confirmedAt: { type: string, format: date-time, description: "Absent while the version waits for re-approval." }
        confirmedBy: { type: string, format: uuid }
        reapprovalRequired: { type: boolean }
        createdAt: { type: string, format: date-time }
        patch:
          type: array
          description: RFC 6902 diff from the previous version's snapshot; empty for version 1.
          items: { $ref: '#/components/schemas/PatchOp' }
        snapshot:
          type: object
          description: The commercial content at this version. Lines are in line number order and keep cancelled lines, so /lines/n names the same line in every version.
          properties:
            currency: { type: string }
            total: { $ref: '#/components/schemas/Money' }
            lines:
              type: array
              items:
                type: object
                properties:
                  lineNo: { type: integer }
                  productId: { type: string, format: uuid }
                  description: { type: string }
                  qty: { $ref: '#/components/schemas/Money' }
                  unit: { type: string }
                  unitPrice: { $ref: '#/components/schemas/Money' }
                  priceUnit: { $ref: '#/components/schemas/Money' }
                  discountPct: { $ref: '#/components/schemas/Money' }
                  lineAmount: { $ref: '#/components/schemas/Money' }
                  taxAmount: { $ref: '#/components/schemas/Money' }
                  deliveryDate: { $ref: '#/components/schemas/Day' }
                  status: { type: string, enum: [OPEN, CANCELLED] }
            charges:
              type: array
              items:
                type: object
                properties:
                  calc: { type: string, enum: [FIXED, PER_UNIT, PERCENT] }
                  value: { $ref: '#/components/schemas/Money' }
                  amount: { $ref: '#/components/schemas/Money' }
    PurchaseOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: "PO-000001" }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        currency: { type: string }
        approvalStatus: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CONFIRMED, FINALIZED, CANCELLED] }
        documentStatus: { type: string, enum: [NONE, RECEIVED_PARTIAL, RECEIVED, INVOICED_PARTIAL, INVOICED] }
        versionNo: { type: integer }
        changeManagement: { type: boolean }
        subtotal: { $ref: '#/components/schemas/Money' }
        discountTotal: { $ref: '#/components/schemas/Money' }
        chargesTotal: { $ref: '#/components/schemas/Money' }
        taxTotal: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money', description: "Equals subtotal − discountTotal + chargesTotal + taxTotal." }
        rowVersion: { type: integer }
        createdBy: { type: string, format: uuid, description: "user who created the PO; absent on POs from before it was recorded" }
        submittedBy: { type: string, format: uuid, description: "user who last submitted the PO" }
        changedBy: { type: string, format: uuid, description: "user who last edited or repriced the PO's content" }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PurchaseOrderLine' }
        charges:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              calc: { type: string }
              value: { $ref: '#/components/schemas/Money' }
              amount: { $ref: '#/components/schemas/Money' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        warnings:
          type: array
          description: Returned on create only; PRC-AGR-004 when a release takes an agreement line to the threshold or over a SOFT limit.
          items: { $ref: '#/components/schemas/Warning' }
    Warning:
      type: object
      properties:
        code: { type: string, example: PRC-AGR-004 }
        lineNo: { type: integer }
        detail: { type: string }
    PurchaseOrderSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        currency: { type: string }
        approvalStatus: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CONFIRMED, FINALIZED, CANCELLED] }
        documentStatus: { type: string, enum: [NONE, RECEIVED_PARTIAL, RECEIVED, INVOICED_PARTIAL, INVOICED] }
        total: { $ref: '#/components/schemas/Money' }
        lineCount: { type: integer }
        rowVersion: { type: integer }
        createdAt: { type: string, format: date-time }
    PurchaseOrderPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PurchaseOrderSummary' } }
        nextCursor: { type: string, format: uuid }
    SourcingLine:
      description: An OPEN line of an APPROVED requisition, with the header facts consolidation needs.
      allOf:
        - $ref: '#/components/schemas/RequisitionLine'
        - type: object
          properties:
            requisitionId: { type: string, format: uuid }
            requisitionNumber: { type: string }
            requisitionStatus: { type: string }
            legalEntityId: { type: string, format: uuid }
            currency: { type: string }
    SourcingLinePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SourcingLine' } }
        nextCursor: { type: string, format: uuid }
    ConsolidationInput:
      type: object
      required: [lines]
      additionalProperties: false
      properties:
        windowDays: { type: integer, minimum: 1, maximum: 60, default: 7, description: "Delivery window: a PO holds lines requested less than windowDays after its earliest line." }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [requisitionLineId]
            additionalProperties: false
            properties:
              requisitionLineId: { type: string, format: uuid }
              vendorId: { type: string, format: uuid, description: "Buyer override; defaults to the line's preferred vendor." }
              agreementLineId: { type: string, format: uuid }
    ConsolidationResult:
      type: object
      properties:
        purchaseOrders:
          type: array
          items: { $ref: '#/components/schemas/PurchaseOrder' }
    PurchaseAgreementLineInput:
      type: object
      required: [commitmentType]
      additionalProperties: false
      properties:
        commitmentType: { type: string, enum: [QUANTITY, VALUE, CATEGORY_VALUE, TOTAL_VALUE] }
        productId: { type: string, format: uuid, description: "Required for QUANTITY and VALUE." }
        category: { type: string, description: "Required for CATEGORY_VALUE." }
        unit: { type: string, description: "Required for QUANTITY." }
        committedQty: { $ref: '#/components/schemas/Money', description: "Positive for QUANTITY." }
        committedAmount: { $ref: '#/components/schemas/Money', description: "Positive for VALUE, CATEGORY_VALUE and TOTAL_VALUE." }
        unitPrice: { $ref: '#/components/schemas/Money' }
        discountPct: { $ref: '#/components/schemas/Money' }
        maxEnforced: { type: string, enum: [HARD, SOFT, NONE], default: HARD }
        priceOverride: { type: boolean, description: "QUANTITY or VALUE only; the unit price then replaces trade agreement prices on releases." }
    PurchaseAgreementInput:
      type: object
      required: [legalEntityId, vendorId, currency, validFrom, lines]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { type: string, enum: [DRAFT, EFFECTIVE], default: EFFECTIVE }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/PurchaseAgreementLineInput' }
    PurchaseAgreementLine:
      type: object
      properties:
        id: { type: string, format: uuid, description: "Referenced by PO lines as agreementLineId." }
        lineNo: { type: integer }
        commitmentType: { type: string, enum: [QUANTITY, VALUE, CATEGORY_VALUE, TOTAL_VALUE] }
        productId: { type: string, format: uuid }
        category: { type: string }
        unit: { type: string }
        committedQty: { $ref: '#/components/schemas/Money' }
        committedAmount: { $ref: '#/components/schemas/Money' }
        unitPrice: { $ref: '#/components/schemas/Money' }
        discountPct: { $ref: '#/components/schemas/Money' }
        maxEnforced: { type: string, enum: [HARD, SOFT, NONE] }
        priceOverride: { type: boolean }
        releasedQty: { $ref: '#/components/schemas/Money' }
        releasedAmount: { $ref: '#/components/schemas/Money' }
        pctReleased: { $ref: '#/components/schemas/Money', description: "Released as a percentage of committed, on the quantity for QUANTITY and the amount otherwise." }
        remaining: { $ref: '#/components/schemas/Money', description: "Committed minus released on the same measure; negative after a SOFT or NONE overrun." }
    AgreementRelease:
      type: object
      properties:
        agreementLineId: { type: string, format: uuid }
        purchaseOrderId: { type: string, format: uuid }
        purchaseOrderNumber: { type: string }
        lineNo: { type: integer }
        qty: { $ref: '#/components/schemas/Money' }
        unit: { type: string }
        lineAmount: { $ref: '#/components/schemas/Money' }
        deliveryDate: { $ref: '#/components/schemas/Day' }
        approvalStatus: { type: string }
        createdAt: { type: string, format: date-time }
    PurchaseAgreement:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: "PA-00000001" }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        currency: { type: string }
        status: { type: string, enum: [DRAFT, EFFECTIVE, ON_HOLD, CLOSED] }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        version: { type: integer }
        lines: { type: array, items: { $ref: '#/components/schemas/PurchaseAgreementLine' } }
        releases: { type: array, items: { $ref: '#/components/schemas/AgreementRelease' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PurchaseAgreementSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        currency: { type: string }
        validFrom: { $ref: '#/components/schemas/Day' }
        validTo: { $ref: '#/components/schemas/Day' }
        status: { type: string, enum: [DRAFT, EFFECTIVE, ON_HOLD, CLOSED] }
        lineCount: { type: integer }
        maxPctReleased: { $ref: '#/components/schemas/Money', description: "Highest release percentage across the lines." }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    SchedulingAgreementProfile:
      type: object
      additionalProperties: false
      description: Release profile (PRD 3.17.13 sa_release_profile). Omitted fields take the default FRC 90 / JIT 14 / firm 14 / trade-off 28 days, WEEKLY.
      properties:
        frcHorizonDays: { type: integer, minimum: 0, maximum: 3660 }
        jitHorizonDays: { type: integer, minimum: 0, maximum: 3660 }
        firmZoneDays: { type: integer, minimum: 0, maximum: 3660 }
        tradeoffZoneDays: { type: integer, minimum: 0, maximum: 3660, description: "Not shorter than firmZoneDays." }
        releaseFrequency: { type: string, enum: [DAILY, WEEKLY, MONTHLY] }
    ScheduleLineInput:
      type: object
      required: [deliveryDate, qty]
      additionalProperties: false
      properties:
        lineNo: { type: integer, minimum: 1, description: "On a schedule replacement, the line to change; omit to add a line." }
        deliveryDate: { $ref: '#/components/schemas/Day' }
        qty: { $ref: '#/components/schemas/Money', description: "Quantity in the agreement unit; above zero, or zero on a replacement to remove that existing line (with its reason in the firm zone)." }
        reason: { type: string, maxLength: 64, description: "Reason code; required to reduce, move or remove a line in the firm zone (PRC-SA-001, BR-17.13)." }
    SchedulingAgreementInput:
      type: object
      required: [legalEntityId, vendorId, productId, siteId, currency, unit, unitPrice, validFrom, lines]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
