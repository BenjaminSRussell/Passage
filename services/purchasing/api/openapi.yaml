  /v1/procurement/scheduling-agreements/{id}:release:
    post:
      operationId: releaseSchedulingAgreement
      x-passage-duty: procurement.agreement.maintain
      summary: >-
        Run a release (SAP ME84): snapshot the schedule as the next FRC or JIT release with cumulative
        quantities and write sarelease.created.v1 (FR-17.15; duty procurement.agreement.maintain). A run with the same
        kind and run date on an unchanged schedule, or a replayed Idempotency-Key, returns the existing release with 200.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulingReleaseInput' }
      responses:
        '201':
          description: Release created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulingRelease' }
        '200':
          description: The existing release for this kind, run date and schedule version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulingRelease' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { description: Agreement not found (PRC-SA-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation or a run date outside the validity (COM-0001), cumulative released would decrease without cumulativeReset (PRC-SA-003), idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/scheduling-agreements/{id}/schedule:
    put:
      operationId: replaceSchedule
      x-passage-duty: procurement.agreement.maintain
      summary: >-
        Replace the release schedule (FR-17.15, BR-17.13; duty procurement.agreement.maintain). Zones are judged on today:
        reducing, moving or removing a FIRM line needs a reason code, a TRADEOFF reduction comes back as a warning.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '200':
          description: The agreement at its new version, with warnings
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulingAgreement' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { description: Not found (PRC-SA-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: Version changed (PRC-VERSION-CONFLICT), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation (COM-0001), firm-zone change without a reason (PRC-SA-001), a line below its receipts (PRC-SA-002)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/scheduling-agreements/{id}/releases:
    get:
