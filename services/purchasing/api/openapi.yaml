      x-passage-duty: procurement.signing-limit.approve or procurement.purchase-order.inquire
      summary: List signing limits, newest first (FR-17.17)
      parameters:
        - { name: legalEntityId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: workerId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: documentType, in: query, required: false, schema: { type: string, enum: [REQUISITION, PURCHASE_ORDER, INVOICE, EXPENSE] } }
        - { name: expired, in: query, required: false, description: "true keeps limits past their recertification date", schema: { type: boolean } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningLimitPage' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: A filter is malformed (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/signing-limits/evaluation:
    get:
      operationId: evaluateSigningLimit
      x-passage-duty: procurement.signing-limit.approve or procurement.purchase-order.inquire
      summary: What a worker's limit does to a document of an amount, as requester and as approver (FR-17.17, BR-17.15)
      description: >-
        Compares the amount with the worker's limit for the document type in the currency. Limits are not converted between currencies. As approver the rule fails closed: no limit in the currency (none at all, or only in other currencies) is an approval limit of zero (PRC-SL-002). As requester, limits only in other currencies add the level; no limit at all adds none.
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: workerId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: documentType, in: query, required: true, schema: { type: string, enum: [REQUISITION, PURCHASE_ORDER, INVOICE, EXPENSE] } }
        - { name: currency, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: amount, in: query, required: true, description: Decimal amount, schema: { type: string } }
      responses:
        '200':
          description: The evaluation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningLimitEvaluation' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty or legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: A parameter is missing or malformed (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/signing-limits/{id}:
    get:
      operationId: getSigningLimit
      x-passage-duty: procurement.signing-limit.approve or procurement.purchase-order.inquire
      summary: Read one signing limit (FR-17.17)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: The limit
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningLimit' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Limit not found (PRC-SL-LIMIT-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: id is not a UUID (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/signing-limits/{id}:recertify:
    post:
      operationId: recertifySigningLimit
      x-passage-duty: procurement.signing-limit.approve
      summary: Recertify a signing limit for another 12 months (FR-17.17; duty procurement.signing-limit.approve)
      description: >-
        Moves recertifyBy to 12 months after today and writes signinglimit.changed.v1. The worker cannot recertify their own limit (PRC-SL-003). An expired limit cannot approve, and escalates the worker's own documents, until it is recertified.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: The result at its new version
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningLimit' }
        '400': { description: Idempotency-Key missing (PRC-IDEM-001) or If-Match not a number (PRC-IFMATCH-002), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: "Missing duty procurement.signing-limit.approve or legal entity outside the caller's scope (AUTH-0003), or the caller is the worker (PRC-SL-003)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Not found (PRC-SL-REQUEST-NOT-FOUND or PRC-SL-LIMIT-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the stored version (PRC-SL-005), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: id is not a UUID (COM-0001) or idempotency_key_reuse, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}/service-lines:
    get:
      operationId: listServiceSpecs
      x-passage-duty: procurement.purchase-order.inquire or procurement.purchase-order.lookup
      summary: The service lines of a purchase order with their outlines and limits (FR-17.23)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: The specifications in line order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceSpecPage' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: id is not a UUID (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}/lines/{lineNo}/service:
    get:
      operationId: getServiceSpec
      x-passage-duty: procurement.purchase-order.inquire or procurement.purchase-order.lookup
      summary: The service specification of one PO line (ETag = PO row version)
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/LineNo' }]
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceSpecResult' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND) or the line has no specification (PRC-SRV-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Bad id or line number (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    put:
      operationId: putServiceSpec
      x-passage-duty: procurement.purchase-order.maintain
      summary: Save the service specification of one PO line, which makes it a SERVICE line (FR-17.23; duty procurement.purchase-order.maintain)
      description: >-
        Replaces any earlier specification: the value limit and expected value for unplanned services, the optional contract limit (an
        agreement line) and the outline, given as a tree or copied from a model service specification. Item amounts are quantity times
        unit price rounded to the currency, a level's amount is the sum of its children (PRC-SRV-004 when a stated total differs), and the
        planned total may not exceed the line amount (PRC-SRV-002, checked again at confirmation). Allowed on a DRAFT or REJECTED PO only.
        If-Match is the PO row version; the write bumps it and the answer's ETag is the new one. Writes servicespec.changed.v1.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/LineNo' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceSpecInput' }
      responses:
        '200':
          description: Specification stored
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceSpecResult' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty procurement.purchase-order.maintain (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: "Purchase order (PRC-PO-NOT-FOUND), line (PRC-PO-LINE-NOT-FOUND), model (PRC-SRV-MODEL-NOT-FOUND) or contract agreement line not found", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current PO row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'Validation (COM-0001), PO not DRAFT or REJECTED or line cancelled (PRC-SRV-001), planned outline above the line amount, expected value above the limit or unusable contract line (PRC-SRV-002), outline total mismatch (PRC-SRV-004), model inactive, of another legal entity or currency (PRC-SRV-005)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    delete:
      operationId: deleteServiceSpec
      x-passage-duty: procurement.purchase-order.maintain
      summary: Remove the service specification of one PO line, which becomes a plain line again (duty procurement.purchase-order.maintain)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/LineNo' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204':
          description: Removed; the ETag is the new PO row version
          headers:
            ETag: { schema: { type: string } }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty procurement.purchase-order.maintain (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: "Purchase order, line or specification not found", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current PO row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'Bad id or line number (COM-0001), PO not DRAFT or REJECTED or line cancelled (PRC-SRV-001)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}/lines/{lineNo}/service/limit-check:
    get:
      operationId: checkServiceLimit
      x-passage-duty: procurement.purchase-order.inquire or procurement.purchase-order.lookup
      summary: Whether an entry of unplanned services fits the line's limits (BR-17.19, AC-17.17)
      description: >-
        Wave 18 asks for a service entry sheet. The unplanned services already entered (unplanned, which the caller keeps) plus the
        entry may not exceed the value limit, nor the remaining value of the contract line when the specification names one. A refused
        entry is an answer, not an error: 200 with allowed false, code PRC-SRV-003 and the message in detail, so the caller keeps the
        figures (remaining is what can still be entered) and raises PRC-SRV-003 on its own sheet. It changes nothing and holds no lock:
        a caller that must be race free enforces remaining under its own lock. A line without a specification allows no unplanned
        services (404 PRC-SRV-NOT-FOUND). Receiving reaches it with a signed service token carrying procurement.purchase-order.lookup.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/LineNo' }
        - { name: unplanned, in: query, required: false, description: "Decimal string, the unplanned amount already entered (default 0)", schema: { type: string } }
        - { name: entry, in: query, required: true, description: "Decimal string, the unplanned amount of the entry to check", schema: { type: string } }
      responses:
        '200':
          description: The answer; allowed false with code PRC-SRV-003 when the entry exceeds the value limit or the contract limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LimitCheck' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND) or the line has no specification (PRC-SRV-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'Bad id, line number or amount (COM-0001), the order or line is cancelled (PRC-SRV-001)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/model-service-specs:
    post:
      operationId: createModelServiceSpec
      x-passage-duty: procurement.policy.maintain
      summary: Create a model service specification of a legal entity (FR-17.23; duty procurement.policy.maintain)
      description: >-
        A model is a reusable outline (SAP ML10-ML12) priced in one currency; a service line takes a copy by modelId and the model can
        change afterwards without moving the line. Writes modelservicespec.created.v1. A replayed Idempotency-Key returns the first row.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelServiceSpecInput' }
      responses:
        '201':
          description: The model at version 1
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelServiceSpec' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty procurement.policy.maintain or legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: The legal entity already has a model with this code (PRC-SRV-006), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation - code, currency, outline (COM-0001), outline total mismatch (PRC-SRV-004) or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      operationId: listModelServiceSpecs
      x-passage-duty: procurement.policy.maintain or procurement.purchase-order.inquire
      summary: List model service specifications, newest first, without outlines (FR-17.23)
      parameters:
        - { name: legalEntityId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACTIVE, INACTIVE] } }
        - { name: q, in: query, required: false, description: Text found in the code or the name, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelServiceSpecPage' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: A filter is malformed (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/model-service-specs/{id}:
    get:
      operationId: getModelServiceSpec
      x-passage-duty: procurement.policy.maintain or procurement.purchase-order.inquire
      summary: Read one model service specification with its outline (FR-17.23)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: The model
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelServiceSpec' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Model not found (PRC-SRV-MODEL-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: id is not a UUID (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    put:
      operationId: changeModelServiceSpec
      x-passage-duty: procurement.policy.maintain
      summary: Change a model service specification under If-Match (FR-17.23; duty procurement.policy.maintain)
      description: >-
        PUT is idempotent, so no Idempotency-Key is taken. It replaces name, currency, status and outline; the code and the legal entity
        do not change. A PO line that already took a copy keeps it. Writes modelservicespec.changed.v1.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelServiceSpecInput' }
      responses:
        '200':
          description: The model at its new version
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelServiceSpec' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty procurement.policy.maintain (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Model not found (PRC-SRV-MODEL-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the stored version (PRC-SRV-007), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Validation (COM-0001) or outline total mismatch (PRC-SRV-004), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
