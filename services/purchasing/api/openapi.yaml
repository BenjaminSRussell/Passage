        '422': { description: Received or invoiced quantity exists, or FINALIZED or CANCELLED (PRC-PO-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current row version (PRC-PO-009), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}:reprice:
    post:
      operationId: repricePurchaseOrder
      x-passage-duty: PurchaseOrderInquire or PurchaseOrderConfirm
      summary: Preview or apply a subsequent price change on one CONFIRMED PO (FR-17.22, BR-17.18, AC-17.16)
      description: |
        Moves open, un-invoiced lines priced from a trade agreement (price_source TRADE_AGREEMENT:<id>) to
        the trade agreement row that wins now for the PO's vendor, product, quantity, currency and unit on
        the order date (BR-17.3), with the same ranking as PO creation (FR-17.6). Manually priced lines and
        lines drawn against a purchase agreement never move; invoiced lines keep the old price and are
        listed under invoiced for payables. A preview (apply false, the default) writes nothing and needs
        PurchaseOrderInquire; its ETag is the PO row version to send as If-Match. Apply needs
        PurchaseOrderConfirm, If-Match and an Idempotency-Key and goes through the PO edit (FR-17.8): the
        moved prices become the next version, confirmed at once or IN_REVIEW when a reapproval rule fires,
        invoicing plans follow the new line amounts (BR-17.17), and po.repriced is written in the same
        transaction. A replayed Idempotency-Key returns the PO's current state with applied and replayed true.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: If-Match
          in: header
          required: false
          description: Required when apply is true. The ETag of the preview.
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: false
          description: Required when apply is true.
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                apply: { type: boolean, default: false }
      responses:
        '200':
          description: The preview, or the applied run
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepriceResult' }
        '400': { description: Malformed body (COM-0001), Idempotency-Key missing on apply (PRC-IDEM-001) or If-Match not a number (PRC-IFMATCH-002), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing PurchaseOrderInquire (preview) or PurchaseOrderConfirm (apply), or the PO's legal entity is outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the current row version (PRC-PO-009); preview again, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Not CONFIRMED (PRC-PO-STATE), idempotency_key_reuse, or a PO edit rule, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent on apply (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}/versions:
    get:
      operationId: listPurchaseOrderVersions
      x-passage-duty: PurchaseOrderInquire
      summary: Every stored version of a PO, oldest first, a pending change included (FR-17.8; duty PurchaseOrderInquire)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PurchaseOrderVersion' }
        '404': { description: Purchase order not found (PRC-PO-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}/versions/{n}/diff:
    get:
      operationId: getPurchaseOrderVersionDiff
      x-passage-duty: PurchaseOrderInquire
      summary: JSON Patch (RFC 6902) from version n-1 to version n (duty PurchaseOrderInquire)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Patch and version state
          content:
            application/json:
              schema:
                type: object
                required: [purchaseOrderId, fromVersion, toVersion, confirmed, reapprovalRequired, patch]
                properties:
                  purchaseOrderId: { type: string, format: uuid }
                  fromVersion: { type: integer }
                  toVersion: { type: integer }
                  confirmed: { type: boolean }
                  confirmedAt: { type: string, format: date-time }
                  reapprovalRequired: { type: boolean }
                  patch:
                    type: array
                    items: { $ref: '#/components/schemas/PatchOp' }
        '404': { description: Version not found (PRC-PO-VERSION-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Version number not an integer of at least 1 (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchase-orders/{id}/invoicing-plans:
    get:
