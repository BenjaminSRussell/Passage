  /v1/procurement/purchase-orders/{id}/lines/{lineNo}/invoicing-plan:
    get:
      operationId: getInvoicingPlan
      x-passage-duty: PurchaseOrderInquire
      summary: The invoicing plan of one PO line (ETag = PO row version; duty PurchaseOrderInquire)
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/LineNo' }]
      responses:
        '200':
          description: OK
