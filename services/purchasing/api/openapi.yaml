      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulingReleaseList' }
        '404': { description: Not found (PRC-SA-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/scheduling-agreements/{id}/releases/{releaseNo}:
    get:
      operationId: getSchedulingRelease
      x-passage-duty: procurement.agreement.maintain or procurement.purchase-order.inquire
      summary: Release documentation for one release number (SAP ME86; duty procurement.agreement.maintain or procurement.purchase-order.inquire)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: releaseNo, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulingRelease' }
        '404': { description: Agreement (PRC-SA-NOT-FOUND) or release (PRC-SA-REL-NOT-FOUND) not found, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/rfqs:
    post:
      operationId: createRFQ
      x-passage-duty: procurement.rfq.maintain
      summary: Create a DRAFT request for quotation with lines and a reply deadline (FR-17.4; duty procurement.rfq.maintain)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RFQInput' }
      responses:
        '201':
          description: Created as DRAFT
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RFQ' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: Missing duty or legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation (COM-0001): deadline not in the future, unknown ranking rule, WEIGHTED_SCORE without criteria, bad criteria, no lines or more than 500, line without product or description; or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      operationId: listRFQs
      x-passage-duty: procurement.rfq.maintain or procurement.rfq.award
      summary: List RFQs newest first with line, vendor and reply counts (duty procurement.rfq.maintain or procurement.rfq.award)
      parameters:
        - { name: status, in: query, required: false, description: 'Comma-separated statuses, e.g. SENT,REPLIES_OPEN', schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RFQPage' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/rfqs:from-requisitions:
    post:
      operationId: createRFQFromRequisitions
      x-passage-duty: procurement.rfq.maintain
      summary: Start a DRAFT request for quotation from approved requisition lines that need sourcing (FR-17.3, FR-17.4; duty procurement.rfq.maintain)
      description: >-
        Each requisition line becomes one RFQ line with its product, description, quantity, unit and requested date; the
        RFQ takes the legal entity of the requisitions. While the RFQ is DRAFT, SENT, REPLIES_OPEN or CLOSED its
        requisition lines leave the consolidation queue and cannot be consolidated (PRC-REQ-006); cancelling the RFQ
        returns them, and awarding a line orders its requisition line through the PO line.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RFQFromRequisitionsInput' }
      responses:
        '201':
          description: Created as DRAFT, each line carrying requisitionLineId
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RFQ' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: Missing duty or legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Requisition line not found (PRC-REQ-LINE-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: "A line is not OPEN on an APPROVED requisition or was split since it was read (PRC-REQ-STATE), or is already on a running RFQ (PRC-REQ-006)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation (COM-0001): deadline not in the future, bad ranking rule or criteria, no lines or more than 500, lines of different legal entities (PRC-REQ-005); or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/rfqs/{id}:
    get:
      operationId: getRFQ
      x-passage-duty: procurement.rfq.maintain or procurement.rfq.award
      summary: Read an RFQ with lines, invitations, replies, criteria and scores (ETag = version; duty procurement.rfq.maintain or procurement.rfq.award)
      description: >-
        A sealed RFQ before its deadline is answered with repliesSealed=true and no replies or scores (BR-17.16);
        the first read or comparison after the deadline logs the opening (openedAt, openedBy).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RFQ' }
        '404': { description: Not found (PRC-RFQ-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/rfqs/{id}:send:
    post:
      operationId: sendRFQ
      x-passage-duty: procurement.rfq.maintain
      summary: Invite vendors and move a DRAFT RFQ to SENT; writes rfq.sent.v1 (duty procurement.rfq.maintain). A replayed Idempotency-Key returns the RFQ as it is now.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendorIds]
              properties:
                vendorIds: { type: array, minItems: 1, items: { type: string, format: uuid }, description: Repeats are dropped }
      responses:
        '200':
          description: Now SENT
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RFQ' }
        '400': { description: Missing Idempotency-Key (PRC-IDEM-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: RFQ not found (PRC-RFQ-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: Version changed (PRC-VERSION-CONFLICT) or transition not allowed (PRC-RFQ-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: vendorIds empty or not UUIDs (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/rfqs/{id}:close:
    post:
      operationId: closeRFQ
      x-passage-duty: procurement.rfq.maintain
      summary: Stop taking replies, SENT or REPLIES_OPEN to CLOSED (duty procurement.rfq.maintain). A replayed Idempotency-Key returns the RFQ as it is now.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Now CLOSED
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RFQ' }
        '400': { description: Missing Idempotency-Key (PRC-IDEM-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: RFQ not found (PRC-RFQ-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: Version changed (PRC-VERSION-CONFLICT) or transition not allowed (PRC-RFQ-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/rfqs/{id}:cancel:
    post:
      operationId: cancelRFQ
      x-passage-duty: procurement.rfq.maintain
      summary: Cancel an RFQ that is not yet awarded (duty procurement.rfq.maintain). A replayed Idempotency-Key returns the RFQ as it is now.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Now CANCELLED
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RFQ' }
        '400': { description: Missing Idempotency-Key (PRC-IDEM-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: RFQ not found (PRC-RFQ-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: Version changed (PRC-VERSION-CONFLICT) or transition not allowed (PRC-RFQ-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/rfqs/{id}:award:
    post:
      operationId: awardRFQ
      x-passage-duty: procurement.rfq.award
      summary: Award lines to replies and create one DRAFT purchase order per winning vendor and currency (FR-17.4; duty procurement.rfq.award)
      description: >-
        Each awarded line becomes a PO line with the RFQ quantity and unit, the reply price and price unit
        (priceSource RFQ_REPLY:<replyId>), due today plus the reply lead time or on the line's required date
        when later. A late reply needs overrideReason (PRC-RFQ-003, BR-17.11); an expired reply, a reply of
        another line or a line awarded twice is PRC-RFQ-005. Lines left out stay unawarded; the RFQ becomes
        AWARDED. Writes rfq.awarded.v1 in the same transaction. A replayed Idempotency-Key returns the RFQ
        and the purchase orders the first request created.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [awards]
              properties:
                awards: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RFQAward' } }
      responses:
        '200':
          description: Awarded; the RFQ and the purchase orders created
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RFQAwardResult' }
        '400': { description: Missing Idempotency-Key (PRC-IDEM-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: RFQ not found (PRC-RFQ-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: Version changed (PRC-VERSION-CONFLICT) or the RFQ is not REPLIES_OPEN or CLOSED (PRC-RFQ-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: "Missing duty procurement.rfq.award (AUTH-0003), or a sealed RFQ before its deadline (PRC-RFQ-004)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Late reply without override reason (PRC-RFQ-003), award rule (PRC-RFQ-005) or validation (COM-0001)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/rfqs/{id}/replies:
    post:
      operationId: recordRFQReplies
      x-passage-duty: procurement.rfq.maintain
      summary: Record an invited vendor's prices for lines of a SENT or REPLIES_OPEN RFQ (FR-17.4; duty procurement.rfq.maintain)
      description: >-
        A reply received after the deadline is stored with late=true and answered with a PRC-RFQ-003 warning
        (BR-17.11). Replying again to a line replaces the vendor's earlier reply, except that a late reply cannot
        replace an on-time one (PRC-RFQ-006). A late reply to a sealed RFQ is rejected (PRC-RFQ-007, BR-17.16).
        The first reply moves a SENT RFQ to REPLIES_OPEN. A sealed RFQ is answered without its replies before
        the deadline.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RFQReplyInput' }
      responses:
        '201':
          description: Replies stored
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RFQReplyResult' }
        '400': { description: Missing Idempotency-Key (PRC-IDEM-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: RFQ not found (PRC-RFQ-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: The RFQ does not take replies in its status (PRC-RFQ-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation (COM-0001), vendor not invited (PRC-RFQ-002), late revision of an on-time reply (PRC-RFQ-006), late reply to a sealed RFQ (PRC-RFQ-007) or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/rfqs/{id}/compare:
    get:
      operationId: compareRFQ
      x-passage-duty: procurement.rfq.maintain or procurement.rfq.award
      summary: Rank the replies per line by the RFQ's rule or ?rule=; late replies are listed as excluded (FR-17.4, BR-17.11, FR-17.19; duty procurement.rfq.maintain or procurement.rfq.award)
      description: >-
        A sealed RFQ is refused before its deadline (403 PRC-RFQ-004); the first comparison or read after the
        deadline logs the opening (openedAt, openedBy; AC-17.14).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: rule, in: query, required: false, schema: { type: string, enum: [LOWEST_PRICE, LEAD_TIME, WEIGHTED_SCORE] } }
      responses:
        '200':
          description: Ranking per line
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RFQComparison' }
        '403': { description: A sealed RFQ before its deadline (PRC-RFQ-004), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: RFQ not found (PRC-RFQ-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Unknown rule, or WEIGHTED_SCORE on an RFQ without criteria (COM-0001)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/rfqs/{id}/scores/{vendorId}:
    put:
      operationId: scoreRFQVendor
      x-passage-duty: procurement.rfq.award
      summary: Record the buyer's 1–10 scores of an invited vendor on the RFQ's criteria (FR-17.19; duty procurement.rfq.award)
      description: >-
        Replaces the vendor's earlier score on each criterion named and bumps the RFQ version. The RFQ must be SENT,
        REPLIES_OPEN or CLOSED; a sealed RFQ is scored only after its deadline (403 PRC-RFQ-004).
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: vendorId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RFQScoresInput' }
      responses:
        '200':
          description: Scores stored
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RFQ' }
        '403': { description: "Missing duty procurement.rfq.award (AUTH-0003), or a sealed RFQ before its deadline (PRC-RFQ-004)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: RFQ not found (PRC-RFQ-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: Version changed (PRC-VERSION-CONFLICT) or the RFQ cannot be scored in its status (PRC-RFQ-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation, unknown or repeated criterion, RFQ without criteria (COM-0001), or vendor not invited (PRC-RFQ-002)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchasing-policies:
    get:
      operationId: listPurchasingPolicies
      x-passage-duty: procurement.policy.maintain or procurement.purchase-order.inquire
      summary: List the saved purchasing policies of the caller's legal entities (FR-17.13)
      responses:
        '200':
          description: The saved policies; a legal entity with none is not listed and has the defaults
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PurchasingPolicy' } }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/purchasing-policies/{legalEntityId}:
    get:
      operationId: getPurchasingPolicy
      x-passage-duty: procurement.policy.maintain or procurement.purchase-order.inquire
      summary: Read the purchasing policy of a legal entity (FR-17.13)
      description: A legal entity with no saved policy answers the defaults at version 0. The ETag is the version PUT takes as If-Match.
      parameters:
        - { $ref: '#/components/parameters/LegalEntityId' }
      responses:
        '200':
          description: The policy
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchasingPolicy' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty or legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: legalEntityId is not a UUID (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    put:
      operationId: putPurchasingPolicy
      x-passage-duty: procurement.policy.maintain
      summary: Save the purchasing policy of a legal entity (FR-17.13, BR-17.7, PO four-eyes)
      description: >-
        Replaces the three settings under If-Match: 0 creates the policy, n replaces version n. PUT is idempotent, so no
        Idempotency-Key is taken. Writes policy.changed.v1.
      parameters:
        - { $ref: '#/components/parameters/LegalEntityId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchasingPolicyInput' }
      responses:
        '200':
          description: The saved policy at its new version
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchasingPolicy' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty procurement.policy.maintain or legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the saved version (PRC-POL-003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: A setting is missing (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/catalogs:
    post:
      operationId: createCatalog
      x-passage-duty: procurement.catalog.maintain
      summary: Create a DRAFT procurement catalog with optional entries (FR-17.18; duty procurement.catalog.maintain)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogInput' }
      responses:
        '201':
          description: Created as DRAFT; the ETag is the version
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: Missing duty or legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation (COM-0001), too many entries (PRC-CAT-007) or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      operationId: listCatalogs
      x-passage-duty: procurement.catalog.maintain or procurement.purchase-order.inquire
      summary: List procurement catalogs, newest first (FR-17.18; duty procurement.catalog.maintain or procurement.purchase-order.inquire)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [DRAFT, PUBLISHED, RETIRED] } }
        - { name: legalEntityId, in: query, required: false, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/catalogs/{id}:
    get:
      operationId: getCatalog
      x-passage-duty: procurement.catalog.maintain or procurement.purchase-order.inquire
      summary: Read a catalog with its entries (ETag = version; duty procurement.catalog.maintain or procurement.purchase-order.inquire)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Not found (PRC-CAT-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/catalogs/{id}:publish:
    post:
      operationId: publishCatalog
      x-passage-duty: procurement.catalog.maintain
      summary: Publish a DRAFT catalog with at least one entry to its operating units (FR-17.18; duty procurement.catalog.maintain). Writes catalog.published.v1. A replayed Idempotency-Key returns the catalog as it is now.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Now PUBLISHED
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
        '403': { description: Missing duty procurement.catalog.maintain (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Catalog not found (PRC-CAT-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: Version changed (PRC-VERSION-CONFLICT) or transition not allowed (PRC-CAT-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: The catalog has no entries (PRC-CAT-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/catalogs/{id}:retire:
    post:
      operationId: retireCatalog
      x-passage-duty: procurement.catalog.maintain
      summary: Retire a PUBLISHED catalog; requesters stop seeing its entries (FR-17.18; duty procurement.catalog.maintain). Writes catalog.retired.v1. A replayed Idempotency-Key returns the catalog as it is now.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Now RETIRED
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
        '403': { description: Missing duty procurement.catalog.maintain (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Catalog not found (PRC-CAT-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: Version changed (PRC-VERSION-CONFLICT) or transition not allowed (PRC-CAT-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/catalogs/{id}/entries:
    get:
      operationId: listCatalogEntries
      x-passage-duty: procurement.catalog.maintain or procurement.purchase-order.inquire
      summary: Page the entries of a catalog in entry order (FR-17.18; duty procurement.catalog.maintain or procurement.purchase-order.inquire)
      description: >-
        A catalog holds up to 50,000 entries, so reads return them a page at a time; GET /catalogs/{id} carries the first page.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: cursor, in: query, required: false, description: "The nextCursor of the previous page (or the catalog's entriesNextCursor): an entry number.", schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: One page of entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogEntryPage' }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Catalog not found (PRC-CAT-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      operationId: addCatalogEntries
      x-passage-duty: procurement.catalog.maintain
      summary: Add entries to a DRAFT catalog (FR-17.18; duty procurement.catalog.maintain). A replayed Idempotency-Key returns the catalog as it is now.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogEntriesInput' }
      responses:
        '200':
          description: The catalog at its new version
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
        '403': { description: Missing duty procurement.catalog.maintain (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Catalog not found (PRC-CAT-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: Version changed (PRC-VERSION-CONFLICT) or the catalog is not a draft (PRC-CAT-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation (COM-0001), too many entries (PRC-CAT-007) or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/catalogs/{id}/entries/{entryId}:
    delete:
      operationId: removeCatalogEntry
      x-passage-duty: procurement.catalog.maintain
      summary: Remove an entry from a DRAFT catalog (FR-17.18; duty procurement.catalog.maintain)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: The catalog at its new version
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
        '403': { description: Missing duty procurement.catalog.maintain (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Catalog (PRC-CAT-NOT-FOUND) or entry (PRC-CAT-ENTRY-NOT-FOUND) not found, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: Version changed (PRC-VERSION-CONFLICT) or the catalog is not a draft (PRC-CAT-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/catalog-entries:
    get:
      operationId: searchCatalogEntries
      x-passage-duty: procurement.requisition.create or procurement.catalog.maintain
      summary: Search the requisition picker (FR-17.18; duty procurement.requisition.create or procurement.catalog.maintain)
      description: >-
        Entries of PUBLISHED catalogs valid on the date (default today) and published to the operating unit, or
        to every unit, of the legal entity. Newest entries first. Text matches name, description and vendor part number.
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: operatingUnitId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: vendorId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: false, schema: { $ref: '#/components/schemas/Day' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of entries with their catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogHitPage' }
        '403': { description: Missing duty or legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/catalogs/{id}/vendor-import:
    post:
      operationId: stageVendorCatalogImport
      x-passage-duty: procurement.catalog.maintain
      summary: Stage a vendor catalog file against a DRAFT or PUBLISHED catalog (FR-17.18, AC-17.13; duty procurement.catalog.maintain)
      description: >-
        Every row is validated like a catalog entry and staged as ACCEPTABLE, or ERROR with its reason (PRC-CAT-005); a vendor
        part number repeated in the file or already in the catalog for the vendor is an ERROR. The same file (same vendor and
        rows) is staged once per catalog unless its import was cancelled. The body is at most 32 MiB (about 20 MB for 50,000 JSON rows). Nothing reaches the catalog
        until the buyer accepts rows and commits. Used by the buyer and, later, by the supplier portal upload (FR-20.19).
        A replayed Idempotency-Key returns the import created by the first request.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorImportInput' }
      responses:
        '201':
          description: Staged; the ETag is the import version
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogImport' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: Missing duty procurement.catalog.maintain (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Catalog not found (PRC-CAT-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: "The catalog is retired (PRC-CAT-STATE), or the same vendor file is already staged or committed for the catalog (PRC-CAT-IMPORT-DUPLICATE)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '413': { description: Request body over the size limit (COM-0413), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation (COM-0001), the file has no header, lacks a required column or has no rows (PRC-CAT-005), more than 50,000 rows (PRC-CAT-008) or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/catalog-imports:
    get:
      operationId: listCatalogImports
      x-passage-duty: procurement.catalog.maintain or procurement.purchase-order.inquire
      summary: List staged vendor catalog imports, newest first (FR-17.18; duty procurement.catalog.maintain or procurement.purchase-order.inquire)
      parameters:
        - { name: catalogId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [STAGED, COMMITTED, CANCELLED] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogImportPage' }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/catalog-imports/{id}:
    get:
      operationId: getCatalogImport
      x-passage-duty: procurement.catalog.maintain or procurement.purchase-order.inquire
      summary: Read a vendor catalog import with its row counts (ETag = version; duty procurement.catalog.maintain or procurement.purchase-order.inquire)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogImport' }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Import not found (PRC-CAT-IMPORT-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/catalog-imports/{id}/rows:
    get:
      operationId: listCatalogImportRows
      x-passage-duty: procurement.catalog.maintain or procurement.purchase-order.inquire
      summary: List the staged rows of an import in file order (FR-17.18; duty procurement.catalog.maintain or procurement.purchase-order.inquire)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACCEPTABLE, ERROR, ACCEPTED, REJECTED] } }
        - { $ref: '#/components/parameters/Limit' }
        - { name: cursor, in: query, required: false, description: "The nextCursor of the previous page: a row number.", schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: One page of rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportRowPage' }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Import not found (PRC-CAT-IMPORT-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/procurement/catalog-imports/{id}/decisions:
    post:
      operationId: decideCatalogImportRows
      x-passage-duty: procurement.catalog.maintain
      summary: Accept or reject staged rows of an import (FR-17.18, AC-17.13; duty procurement.catalog.maintain)
      description: >-
        Allowed while the import is STAGED. An ERROR row cannot be accepted (PRC-CAT-005). A rejected row can be accepted
        again before the commit. A replayed Idempotency-Key returns the import as it is now.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportDecisionsInput' }
      responses:
        '200':
          description: The import at its new version
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogImport' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { description: Missing duty procurement.catalog.maintain (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Import (PRC-CAT-IMPORT-NOT-FOUND) or row (PRC-CAT-IMPORT-ROW-NOT-FOUND) not found, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: Version changed (PRC-VERSION-CONFLICT) or the import is not staged (PRC-CAT-IMPORT-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation (COM-0001), an ERROR row named in accept (PRC-CAT-005) or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/catalog-imports/{id}:commit:
    post:
      operationId: commitCatalogImport
      x-passage-duty: procurement.catalog.maintain
      summary: Add the accepted rows of an import to the catalog (FR-17.18, AC-17.13; duty procurement.catalog.maintain). Writes catalogimport.committed.v1.
      description: >-
        Rows still ACCEPTABLE (undecided), rejected and ERROR rows stay out. The catalog may be DRAFT or PUBLISHED, so the entries are visible in the requisition picker at once when it is published; the catalog version rises by one. A replayed Idempotency-Key returns the import as it is now.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Now COMMITTED
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogImport' }
        '403': { description: Missing duty procurement.catalog.maintain (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Import not found (PRC-CAT-IMPORT-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: "Version changed (PRC-VERSION-CONFLICT), the import is not staged (PRC-CAT-IMPORT-STATE) or the catalog is retired (PRC-CAT-STATE)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "No row is accepted (PRC-CAT-009), the catalog would hold more than 50,000 entries (PRC-CAT-007), or an accepted row's vendor part number reached the catalog after staging (PRC-CAT-005)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/catalog-imports/{id}:cancel:
    post:
      operationId: cancelCatalogImport
      x-passage-duty: procurement.catalog.maintain
      summary: Cancel a staged import; the catalog is untouched (FR-17.18; duty procurement.catalog.maintain)
      description: >-
        The import stays as the record. A replayed Idempotency-Key returns the import as it is now.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Now CANCELLED
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogImport' }
        '403': { description: Missing duty procurement.catalog.maintain (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Import not found (PRC-CAT-IMPORT-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: Version changed (PRC-VERSION-CONFLICT) or the import is not staged (PRC-CAT-IMPORT-STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/category-vendors:
    post:
      operationId: createCategoryVendorAssignment
      x-passage-duty: procurement.category.maintain
      summary: Assign a vendor to a procurement category with a status and validity window (FR-17.20; duty procurement.category.maintain)
      description: >-
        A category with at least one APPROVED or PROVISIONAL assignment (any window) is restricted: under the legal entity's HARD category
        access mode a requisition or PO line in it needs a vendor with an APPROVED or PROVISIONAL assignment valid on the day (PRC-CAT-002).
        A BLOCKED assignment refuses its vendor in any category while its window holds the day, without restricting the category for
        other vendors; before or after its window the vendor counts as unassigned. One assignment exists per vendor and
        category; change it with PUT. validFrom defaults to today. Writes categoryvendor.assigned.v1. A replayed Idempotency-Key returns the first row.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryVendorAssignmentInput' }
      responses:
        '201':
          description: The assignment at version 1
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryVendorAssignment' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty procurement.category.maintain or legal entity outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: The vendor already has an assignment for the category (PRC-CAT-011), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Validation - status, window, category or ids (COM-0001) or idempotency_key_reuse", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      operationId: listCategoryVendorAssignments
      x-passage-duty: procurement.category.maintain or procurement.purchase-order.inquire
      summary: List category vendor assignments, newest first (FR-17.20)
      parameters:
        - { name: legalEntityId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: category, in: query, required: false, description: Exact category, schema: { type: string } }
        - { name: vendorId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [APPROVED, PROVISIONAL, BLOCKED] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryVendorAssignmentPage' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: A filter is malformed (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/category-vendors/{id}:
    get:
      operationId: getCategoryVendorAssignment
      x-passage-duty: procurement.category.maintain or procurement.purchase-order.inquire
      summary: Read one category vendor assignment (FR-17.20)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: The assignment
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryVendorAssignment' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Assignment not found (PRC-CAT-VENDOR-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: id is not a UUID (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    put:
      operationId: changeCategoryVendorAssignment
      x-passage-duty: procurement.category.maintain
      summary: Change the status, validity window and notes of an assignment under If-Match (FR-17.20; duty procurement.category.maintain)
      description: PUT is idempotent, so no Idempotency-Key is taken. The vendor and category of an assignment do not change. Writes categoryvendor.changed.v1.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryVendorAssignmentChange' }
      responses:
        '200':
          description: The assignment at its new version
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryVendorAssignment' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty procurement.category.maintain (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Assignment not found (PRC-CAT-VENDOR-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match is not the stored version (PRC-CAT-013), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Validation - status or window (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match absent (PRC-IFMATCH-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/inbound-changes:
    get:
      operationId: listInboundChanges
      x-passage-duty: procurement.purchase-order.inquire
      summary: List the changes other services asked of purchase orders, newest first (slice 18)
      description: >-
        One row per planning message a planner applied to a purchase order (message.applied.v1) and per closed drop-ship remainder
        (dropship.closed.v1) or cancelled drop-ship (dropship.cancelled.v1) the purchasing consumer handled, applied or not.
        Filter by source, status, resolution (status REFUSED with resolution NONE is the buyer's queue), purchase order and legal entity.
      parameters:
        - { name: source, in: query, required: false, schema: { type: string, enum: [PLANNING_MESSAGE, DROPSHIP_CLOSED, DROPSHIP_CANCELLED] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [APPLIED, REFUSED, IGNORED] } }
        - { name: resolution, in: query, required: false, description: 'NONE lists changes nobody has settled.', schema: { type: string, enum: [NONE, ACKNOWLEDGED, RETRIED] } }
        - { name: purchaseOrderId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: legalEntityId, in: query, required: false, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundChangePage' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty procurement.purchase-order.inquire (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: A filter is malformed (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/inbound-changes/{id}:
    get:
      operationId: getInboundChange
      x-passage-duty: procurement.purchase-order.inquire
      summary: Read one change another service asked of a purchase order (slice 18)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: The change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundChange' }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty procurement.purchase-order.inquire (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Change not found (PRC-INB-NOT-FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: id is not a UUID (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/inbound-changes/{id}:acknowledge:
    post:
      operationId: acknowledgeInboundChange
      x-passage-duty: procurement.purchase-order.maintain
      summary: Acknowledge a refused inbound change the buyer dealt with by hand (slice 19)
      description: >-
        Settles a REFUSED change nobody has settled as ACKNOWLEDGED, with an optional note, so it leaves the buyer's queue. The purchase order is not touched and the status stays REFUSED. Writes inboundchange.resolved.v1. 409 PRC-INB-008 for a change that is not REFUSED or already settled. A replayed Idempotency-Key returns the change as it is now.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundChangeDecision' }
      responses:
        '200':
          description: The change as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundChange' }
        '400': { description: Idempotency-Key missing (PRC-IDEM-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty procurement.purchase-order.maintain or the change's legal entity is outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Change not found (PRC-INB-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: The change is not a refused one waiting for a buyer (PRC-INB-008), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "id is not a UUID, the note is too long or idempotency_key_reuse (COM-0001)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/procurement/inbound-changes/{id}:retry:
    post:
      operationId: retryInboundChange
      x-passage-duty: procurement.purchase-order.maintain
      summary: Run a refused inbound change again against the purchase order as it is now (slice 19)
      description: >-
        Plans the original request again (the message, or the drop-ship quantity) against the current order and applies it through the PO change management path as the caller, who needs procurement.purchase-order.maintain. The change keeps its row and idempotency key: it becomes APPLIED or IGNORED and RETRIED (inboundchange.resolved.v1, with the order's own po.confirmed.v1 and poversion.created.v1 when a line moved), or stays REFUSED with the new reason and one more attempt. 409 PRC-INB-008 for a change that is not REFUSED or already settled. A replayed Idempotency-Key returns the change as it is now.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundChangeDecision' }
      responses:
        '200':
          description: The change as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundChange' }
        '400': { description: Idempotency-Key missing (PRC-IDEM-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { description: Unauthenticated, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: Missing duty procurement.purchase-order.maintain or the change's legal entity is outside the caller's scope (AUTH-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: Change not found (PRC-INB-NOT-FOUND) or unknown action (PRC-ACTION-001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: The change is not a refused one waiting for a buyer (PRC-INB-008), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
