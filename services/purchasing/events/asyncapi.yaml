asyncapi: 3.0.0
info:
  title: Passage Purchasing events
  version: 0.9.0
  description: |
    Events published by the purchasing service in wave 17 slices 1 to 9. Each is written to the
    outbox in the same transaction as the state change and relayed by Debezium to the topic
    passage.<context>.<entity>. Payload structs live in internal/events. Schema evolution is
    additive only (BACKWARD_TRANSITIVE).
defaultContentType: application/cloudevents+json
channels:
  requisition:
    address: passage.procurement.requisition
    description: Requisition lifecycle; the Kafka key is the requisition id so events stay ordered.
    messages:
      requisitionSubmitted:
        $ref: '#/components/messages/RequisitionSubmitted'
      requisitionApproved:
        $ref: '#/components/messages/RequisitionApproved'
  agreement:
    address: passage.procurement.agreement
    description: Purchase agreement release alerts; the Kafka key is the agreement id.
    messages:
      agreementThreshold:
        $ref: '#/components/messages/AgreementThreshold'
  po:
    address: passage.procurement.po
    description: Purchase order confirmation, cancellation and subsequent price change; the Kafka key is the PO id so events stay ordered.
    messages:
      poConfirmed:
        $ref: '#/components/messages/POConfirmed'
      poCancelled:
        $ref: '#/components/messages/POCancelled'
      poRepriced:
        $ref: '#/components/messages/PORepriced'
  poversion:
    address: passage.procurement.poversion
    description: Confirmed purchase order versions above 1 (change orders); the Kafka key is the PO id.
    messages:
      poVersionCreated:
        $ref: '#/components/messages/POVersionCreated'
  rfq:
    address: passage.procurement.rfq
    description: Request for quotation send and award; the Kafka key is the RFQ id so events stay ordered.
    messages:
      rfqSent:
        $ref: '#/components/messages/RFQSent'
      rfqAwarded:
        $ref: '#/components/messages/RFQAwarded'
  policy:
    address: passage.procurement.policy
    description: Purchasing policy changes (FR-17.13); the Kafka key is the legal entity id.
    messages:
      policyChanged:
        $ref: '#/components/messages/PolicyChanged'
  catalog:
    address: passage.procurement.catalog
    description: Procurement catalog publication and retirement (FR-17.18); the Kafka key is the catalog id so changes stay ordered.
    messages:
      catalogPublished:
        $ref: '#/components/messages/CatalogPublished'
      catalogRetired:
        $ref: '#/components/messages/CatalogRetired'
  categoryvendor:
    address: passage.procurement.categoryvendor
    description: Vendor assignments to procurement categories (FR-17.20); the Kafka key is the assignment id.
    messages:
      categoryVendorAssigned:
        $ref: '#/components/messages/CategoryVendorAssigned'
      categoryVendorChanged:
        $ref: '#/components/messages/CategoryVendorChanged'
  categorymanager:
    address: passage.procurement.categorymanager
    description: Category manager assignments (FR-17.20); the Kafka key is the manager row id.
    messages:
      categoryManagerAssigned:
        $ref: '#/components/messages/CategoryManagerAssigned'
      categoryManagerRemoved:
        $ref: '#/components/messages/CategoryManagerRemoved'
  catalogimport:
    address: passage.procurement.catalogimport
    description: Vendor catalog imports committed to a catalog (FR-17.18); the Kafka key is the import id.
    messages:
      catalogImportCommitted:
        $ref: '#/components/messages/CatalogImportCommitted'
  sarelease:
    address: passage.procurement.sarelease
    description: Scheduling agreement releases (FR-17.15); the Kafka key is the scheduling agreement id so releases stay ordered.
    messages:
      saReleaseCreated:
        $ref: '#/components/messages/SAReleaseCreated'
operations:
  publishRequisitionSubmitted:
    action: send
    channel:
      $ref: '#/channels/requisition'
    messages:
      - $ref: '#/channels/requisition/messages/requisitionSubmitted'
  publishRequisitionApproved:
    action: send
    channel:
      $ref: '#/channels/requisition'
    messages:
      - $ref: '#/channels/requisition/messages/requisitionApproved'
  publishAgreementThreshold:
    action: send
    channel:
      $ref: '#/channels/agreement'
    messages:
      - $ref: '#/channels/agreement/messages/agreementThreshold'
  publishPOConfirmed:
    action: send
    channel:
      $ref: '#/channels/po'
    messages:
      - $ref: '#/channels/po/messages/poConfirmed'
  publishPOCancelled:
    action: send
    channel:
      $ref: '#/channels/po'
    messages:
      - $ref: '#/channels/po/messages/poCancelled'
  publishPORepriced:
    action: send
    channel:
      $ref: '#/channels/po'
    messages:
      - $ref: '#/channels/po/messages/poRepriced'
  publishPOVersionCreated:
    action: send
    channel:
      $ref: '#/channels/poversion'
    messages:
      - $ref: '#/channels/poversion/messages/poVersionCreated'
  publishRFQSent:
    action: send
    channel:
      $ref: '#/channels/rfq'
    messages:
      - $ref: '#/channels/rfq/messages/rfqSent'
  publishRFQAwarded:
    action: send
    channel:
      $ref: '#/channels/rfq'
    messages:
      - $ref: '#/channels/rfq/messages/rfqAwarded'
  publishSAReleaseCreated:
    action: send
    channel:
      $ref: '#/channels/sarelease'
    messages:
      - $ref: '#/channels/sarelease/messages/saReleaseCreated'
  publishPolicyChanged:
    action: send
    channel:
      $ref: '#/channels/policy'
    messages:
      - $ref: '#/channels/policy/messages/policyChanged'
  publishCategoryVendorAssigned:
    action: send
    channel:
      $ref: '#/channels/categoryvendor'
    messages:
      - $ref: '#/channels/categoryvendor/messages/categoryVendorAssigned'
  publishCategoryVendorChanged:
    action: send
    channel:
      $ref: '#/channels/categoryvendor'
    messages:
      - $ref: '#/channels/categoryvendor/messages/categoryVendorChanged'
  publishCategoryManagerAssigned:
    action: send
    channel:
      $ref: '#/channels/categorymanager'
    messages:
      - $ref: '#/channels/categorymanager/messages/categoryManagerAssigned'
  publishCategoryManagerRemoved:
    action: send
    channel:
      $ref: '#/channels/categorymanager'
    messages:
      - $ref: '#/channels/categorymanager/messages/categoryManagerRemoved'
  publishCatalogPublished:
    action: send
    channel:
      $ref: '#/channels/catalog'
    messages:
      - $ref: '#/channels/catalog/messages/catalogPublished'
  publishCatalogRetired:
    action: send
    channel:
      $ref: '#/channels/catalog'
    messages:
      - $ref: '#/channels/catalog/messages/catalogRetired'
  publishCatalogImportCommitted:
    action: send
    channel:
      $ref: '#/channels/catalogimport'
    messages:
      - $ref: '#/channels/catalogimport/messages/catalogImportCommitted'
components:
  messages:
    CatalogImportCommitted:
      name: CatalogImportCommitted
      title: catalogimport.committed.v1
      x-passage-type: dev.passage.procurement.catalogimport.committed.v1
      summary: The accepted rows of a staged vendor catalog file were added to a catalog (FR-17.18, AC-17.13); a PUBLISHED catalog shows them in the requisition picker at once.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.catalogimport.committed.v1 }
              subject: { type: string, format: uuid, description: import id }
              data: { $ref: '#/components/schemas/CatalogImportData' }
    CatalogPublished:
      name: CatalogPublished
      title: catalog.published.v1
      x-passage-type: dev.passage.procurement.catalog.published.v1
      summary: A DRAFT procurement catalog was published (FR-17.18); requesters of the listed operating units can pick its entries from its validity start.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.catalog.published.v1 }
              subject: { type: string, format: uuid, description: catalog id }
              data: { $ref: '#/components/schemas/CatalogData' }
    CatalogRetired:
      name: CatalogRetired
      title: catalog.retired.v1
      x-passage-type: dev.passage.procurement.catalog.retired.v1
      summary: A PUBLISHED procurement catalog was retired (FR-17.18); its entries leave the requisition picker.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.catalog.retired.v1 }
              subject: { type: string, format: uuid, description: catalog id }
              data: { $ref: '#/components/schemas/CatalogData' }
    CategoryVendorAssigned:
      name: CategoryVendorAssigned
      title: categoryvendor.assigned.v1
      x-passage-type: dev.passage.procurement.categoryvendor.assigned.v1
      summary: A vendor was assigned to a procurement category with a status and validity window (FR-17.20). Requisition and PO checks read the assignments.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.categoryvendor.assigned.v1 }
              subject: { type: string, format: uuid, description: assignment id }
              data: { $ref: '#/components/schemas/CategoryVendorData' }
    CategoryVendorChanged:
      name: CategoryVendorChanged
      title: categoryvendor.changed.v1
      x-passage-type: dev.passage.procurement.categoryvendor.changed.v1
      summary: The status or validity window of a category vendor assignment changed (FR-17.20); carries the assignment at its new version.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.categoryvendor.changed.v1 }
              subject: { type: string, format: uuid, description: assignment id }
              data: { $ref: '#/components/schemas/CategoryVendorData' }
    CategoryManagerAssigned:
      name: CategoryManagerAssigned
      title: categorymanager.assigned.v1
      x-passage-type: dev.passage.procurement.categorymanager.assigned.v1
      summary: A worker became manager of a procurement category (FR-17.20).
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.categorymanager.assigned.v1 }
              subject: { type: string, format: uuid, description: manager row id }
              data: { $ref: '#/components/schemas/CategoryManagerData' }
    CategoryManagerRemoved:
      name: CategoryManagerRemoved
      title: categorymanager.removed.v1
      x-passage-type: dev.passage.procurement.categorymanager.removed.v1
      summary: A worker stopped managing a procurement category (FR-17.20).
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.categorymanager.removed.v1 }
              subject: { type: string, format: uuid, description: manager row id }
              data: { $ref: '#/components/schemas/CategoryManagerData' }
    PolicyChanged:
      name: PolicyChanged
      title: policy.changed.v1
      x-passage-type: dev.passage.procurement.policy.changed.v1
      summary: The purchasing policy of a legal entity was saved (FR-17.13); carries the full policy at its new version. Audit and workflow consumers read it.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.policy.changed.v1 }
              subject: { type: string, format: uuid, description: legal entity id }
              data: { $ref: '#/components/schemas/PolicyChangedData' }
    SAReleaseCreated:
      name: SAReleaseCreated
      title: sarelease.created.v1
      x-passage-type: dev.passage.procurement.sarelease.created.v1
      summary: >-
        A scheduling agreement release run created release REL-<agreement>-<n> of kind FRC or JIT
        (FR-17.15). The PRD's sa.release.created.v1, renamed to one entity segment. A run on an
        unchanged schedule with the same kind and run date returns the existing release and writes no event.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.sarelease.created.v1 }
              data: { $ref: '#/components/schemas/SAReleaseCreatedData' }
    RequisitionSubmitted:
      name: RequisitionSubmitted
      title: requisition.submitted.v1
      x-passage-type: dev.passage.procurement.requisition.submitted.v1
      summary: A DRAFT requisition was submitted; status is IN_REVIEW, or APPROVED when the policy chain is empty.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.requisition.submitted.v1 }
              data: { $ref: '#/components/schemas/RequisitionData' }
    RequisitionApproved:
      name: RequisitionApproved
      title: requisition.approved.v1
      x-passage-type: dev.passage.procurement.requisition.approved.v1
      summary: A requisition reached APPROVED. In this slice that is the auto-approval band on submit (written right after requisition.submitted in the same transaction).
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.requisition.approved.v1 }
              data: { $ref: '#/components/schemas/RequisitionData' }
    AgreementThreshold:
      name: AgreementThreshold
      title: agreement.threshold.v1
      x-passage-type: dev.passage.procurement.agreement.threshold.v1
      summary: A PO line released against a purchase agreement line took it to the threshold (90 % of the commitment) or over a SOFT limit (FR-17.5, BR-17.10). Written in the PO's transaction; the threshold fires once per line, a SOFT overrun on every release that exceeds.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.agreement.threshold.v1 }
              subject: { type: string, format: uuid, description: agreement id }
              data: { $ref: '#/components/schemas/AgreementThresholdData' }
    POConfirmed:
      name: POConfirmed
      title: po.confirmed.v1
      x-passage-type: dev.passage.procurement.po.confirmed.v1
      summary: A version of a purchase order was confirmed, by :confirm or by a post-confirmation change that needed no re-approval (FR-17.7, FR-17.8). Carries the whole order at that version.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.po.confirmed.v1 }
              subject: { type: string, format: uuid, description: purchase order id }
              data: { $ref: '#/components/schemas/POConfirmedData' }
    POVersionCreated:
      name: POVersionCreated
      title: poversion.created.v1
      x-passage-type: dev.passage.procurement.poversion.created.v1
      summary: A confirmed purchase order version above 1 (change order, FR-17.8), written right after po.confirmed in the same transaction. The PRD calls it po.version.created; the platform type grammar allows one entity segment.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.poversion.created.v1 }
              subject: { type: string, format: uuid, description: purchase order id }
              data: { $ref: '#/components/schemas/POVersionCreatedData' }
    POCancelled:
      name: POCancelled
      title: po.cancelled.v1
      x-passage-type: dev.passage.procurement.po.cancelled.v1
      summary: A purchase order with nothing received or invoiced was cancelled (BR-17.2); its open lines are CANCELLED and their remaining quantity is released.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.po.cancelled.v1 }
              subject: { type: string, format: uuid, description: purchase order id }
              data: { $ref: '#/components/schemas/POCancelledData' }
    PORepriced:
      name: PORepriced
      title: po.repriced.v1
      x-passage-type: dev.passage.procurement.po.repriced.v1
      summary: A subsequent price change was applied to a CONFIRMED purchase order (FR-17.22, BR-17.18). Consumed by payables (wave 18 FR-18.18 subsequent debit/credit for invoiced_lines) and analytics.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.po.repriced.v1 }
              subject: { type: string, format: uuid, description: purchase order id }
              data: { $ref: '#/components/schemas/PORepricedData' }
    RFQSent:
      name: RFQSent
      title: rfq.sent.v1
      x-passage-type: dev.passage.procurement.rfq.sent.v1
      summary: A DRAFT RFQ was sent; carries the invited vendors, the deadline and the lines to quote (FR-17.4). Consumed by the supplier portal (wave 20) and notifications.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.rfq.sent.v1 }
              subject: { type: string, format: uuid, description: RFQ id }
              data: { $ref: '#/components/schemas/RFQSentData' }
    RFQAwarded:
      name: RFQAwarded
      title: rfq.awarded.v1
      x-passage-type: dev.passage.procurement.rfq.awarded.v1
      summary: RFQ lines were awarded and their DRAFT purchase orders created in the same transaction (FR-17.4); one entry per awarded line with the winning vendor, price and purchase order.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.rfq.awarded.v1 }
              subject: { type: string, format: uuid, description: RFQ id }
              data: { $ref: '#/components/schemas/RFQAwardedData' }
  schemas:
    Envelope:
      type: object
      description: CloudEvents 1.0 structured envelope with Passage extensions.
      required: [specversion, id, source, type, time, datacontenttype, tenantid, subject, data]
      properties:
        specversion: { type: string, const: "1.0" }
        id: { type: string, format: uuid }
        source: { type: string, const: /passage/procurement/purchasing }
        type: { type: string }
        subject: { type: string, format: uuid, description: id of the aggregate (requisition, agreement, purchase order or RFQ) }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, const: application/json }
        tenantid: { type: string, format: uuid }
    RequisitionData:
      type: object
      required: [requisition_id, number, legal_entity_id, requester_id, currency, lines, total, approver_chain, policy_version, status]
      additionalProperties: false
      properties:
        requisition_id: { type: string, format: uuid }
        number: { type: string, example: PR-00000001 }
        legal_entity_id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        lines:
          type: array
          items:
            type: object
            required: [line_no, line_id, qty, amount]
            additionalProperties: false
            properties:
              line_no: { type: integer }
              line_id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              category: { type: string }
              qty: { type: string, description: decimal string }
              amount: { type: string, description: decimal string in the requisition currency }
        total: { type: string, description: decimal string in the requisition currency }
        approver_chain:
          type: array
          items: { type: string, enum: [MANAGER, CATEGORY_OWNER, CFO] }
        policy_version: { type: string, example: builtin-1 }
        status: { type: string, enum: [IN_REVIEW, APPROVED] }
    AgreementThresholdData:
      type: object
      required: [agreement_id, number, vendor_id, line, line_id, commitment_type, pct, overrun]
      additionalProperties: false
      properties:
        agreement_id: { type: string, format: uuid }
        number: { type: string, example: PA-00000001 }
        vendor_id: { type: string, format: uuid }
        line: { type: integer, description: agreement line number }
        line_id: { type: string, format: uuid }
        commitment_type: { type: string, enum: [QUANTITY, VALUE, CATEGORY_VALUE, TOTAL_VALUE] }
        pct: { type: string, description: decimal string, released percentage of the commitment after the release }
        overrun: { type: boolean, description: true when a SOFT limit was exceeded }
        expiry: { type: string, format: date, description: the agreement valid_to; absent when open-ended }
    POConfirmedData:
      type: object
      required: [po_id, number, version_no, legal_entity_id, vendor_id, currency, subtotal, discount_total, charges_total, tax_total, total, lines]
      additionalProperties: false
      properties:
        po_id: { type: string, format: uuid }
        number: { type: string, example: PO-00000001 }
        version_no: { type: integer, minimum: 1 }
        legal_entity_id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        subtotal: { type: string, description: decimal string }
        discount_total: { type: string, description: decimal string }
        charges_total: { type: string, description: decimal string }
        tax_total: { type: string, description: decimal string }
        total: { type: string, description: decimal string; subtotal − discount_total + charges_total + tax_total }
        lines:
          type: array
          description: Every line, cancelled ones included with status CANCELLED so consumers can close what they hold.
          items:
            type: object
            required: [line_no, qty, unit, unit_price, price_unit, line_amount, delivery_date, status]
            additionalProperties: false
            properties:
              line_no: { type: integer }
              product_id: { type: string, format: uuid }
              description: { type: string }
              qty: { type: string, description: decimal string }
              unit: { type: string }
              unit_price: { type: string, description: decimal string }
              price_unit: { type: string, description: decimal string }
              line_amount: { type: string, description: decimal string }
              delivery_date: { type: string, format: date }
              status: { type: string, enum: [OPEN, RECEIVED, INVOICED, CANCELLED] }
    POVersionCreatedData:
      type: object
      required: [po_id, number, version_no, patch, reapproval_required]
      additionalProperties: false
      properties:
        po_id: { type: string, format: uuid }
        number: { type: string, example: PO-00000001 }
        version_no: { type: integer, minimum: 2 }
        patch:
          type: array
          description: RFC 6902 operations turning the previous version's snapshot into this one; paths such as /lines/0/qty index lines by line number order.
          items:
            type: object
            required: [op, path]
            properties:
              op: { type: string, enum: [add, remove, replace] }
              path: { type: string }
              value: {}
        reapproval_required: { type: boolean, description: true when the change went back through approval before this confirmation }
    POCancelledData:
      type: object
      required: [po_id, number, version_no, prior_status, lines]
      additionalProperties: false
      properties:
        po_id: { type: string, format: uuid }
        number: { type: string, example: PO-00000001 }
        version_no: { type: integer, description: confirmed version at cancellation; 0 when never confirmed }
        prior_status: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CONFIRMED] }
        lines:
          type: array
          items:
            type: object
            required: [line_no, unit, remaining_qty]
            additionalProperties: false
            properties:
              line_no: { type: integer }
              product_id: { type: string, format: uuid }
              unit: { type: string }
              remaining_qty: { type: string, description: decimal string still to be received when cancelled }
    PORepricedData:
      type: object
      required: [po_id, number, version_no, reapproval_required, currency, total_delta, lines, invoiced_lines]
      additionalProperties: false
      properties:
        po_id: { type: string, format: uuid }
        number: { type: string, example: PO-00000001 }
        version_no: { type: integer, description: "version holding the moved prices; the current confirmed version when only invoiced lines were handed over" }
        reapproval_required: { type: boolean, description: "true when the version waits for re-approval; po.confirmed follows when it is confirmed" }
        currency: { type: string }
        total_delta: { type: string, description: decimal string, sum of the deltas of lines }
        lines:
          type: array
          description: Open, un-invoiced lines moved to the new price in version_no.
          items:
            type: object
            required: [line_no, qty, old_price, old_price_unit, new_price, new_price_unit, old_amount, new_amount, delta, old_price_source, new_price_source]
            additionalProperties: false
            properties:
              line_no: { type: integer }
              qty: { type: string, description: decimal string; the line quantity for lines, the invoiced quantity for invoiced_lines }
              old_price: { type: string, description: decimal string }
              old_price_unit: { type: string, description: decimal string }
              new_price: { type: string, description: decimal string }
              new_price_unit: { type: string, description: decimal string }
              old_amount: { type: string, description: decimal string, amount of qty at the old price after discount }
              new_amount: { type: string, description: decimal string, amount of qty at the new price after discount }
              delta: { type: string, description: decimal string, new_amount minus old_amount }
              old_price_source: { type: string, description: "TRADE_AGREEMENT:<id> the line was priced from" }
              new_price_source: { type: string, description: "TRADE_AGREEMENT:<id> that wins now" }
        invoiced_lines:
          type: array
          description: Invoiced lines whose trade agreement price changed. They keep the old price; payables raises a subsequent debit or credit for the invoiced quantity (wave 18 FR-18.18). Each price row is handed over once per line.
          items:
            type: object
            required: [line_no, qty, old_price, old_price_unit, new_price, new_price_unit, old_amount, new_amount, delta, old_price_source, new_price_source]
            additionalProperties: false
            properties:
              line_no: { type: integer }
              qty: { type: string, description: decimal string; the line quantity for lines, the invoiced quantity for invoiced_lines }
              old_price: { type: string, description: decimal string }
              old_price_unit: { type: string, description: decimal string }
              new_price: { type: string, description: decimal string }
              new_price_unit: { type: string, description: decimal string }
              old_amount: { type: string, description: decimal string, amount of qty at the old price after discount }
              new_amount: { type: string, description: decimal string, amount of qty at the new price after discount }
              delta: { type: string, description: decimal string, new_amount minus old_amount }
              old_price_source: { type: string, description: "TRADE_AGREEMENT:<id> the line was priced from" }
              new_price_source: { type: string, description: "TRADE_AGREEMENT:<id> that wins now" }
    RFQSentData:
      type: object
      required: [rfq_id, number, legal_entity_id, vendor_ids, reply_deadline, lines]
      additionalProperties: false
      properties:
        rfq_id: { type: string, format: uuid }
        number: { type: string, example: RFQ-00000001 }
        legal_entity_id: { type: string, format: uuid }
        vendor_ids: { type: array, items: { type: string, format: uuid } }
        reply_deadline: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [line_no, line_id, qty, unit]
            additionalProperties: false
            properties:
              line_no: { type: integer }
              line_id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              description: { type: string }
              qty: { type: string, description: decimal string }
              unit: { type: string }
              required_date: { type: string, format: date }
    RFQAwardedData:
      type: object
      required: [rfq_id, number, legal_entity_id, awards]
      additionalProperties: false
      properties:
        rfq_id: { type: string, format: uuid }
        number: { type: string, example: RFQ-00000001 }
        legal_entity_id: { type: string, format: uuid }
        awards:
          type: array
          items:
            type: object
            required: [line_no, line_id, reply_id, vendor_id, unit_price, price_unit, currency, lead_time_days, purchase_order_id]
            additionalProperties: false
            properties:
              line_no: { type: integer }
              line_id: { type: string, format: uuid }
              reply_id: { type: string, format: uuid }
              vendor_id: { type: string, format: uuid }
              unit_price: { type: string, description: decimal string }
              price_unit: { type: string, description: decimal string }
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              lead_time_days: { type: integer, minimum: 0 }
              purchase_order_id: { type: string, format: uuid }
              override_reason: { type: string, description: present when a late reply was awarded (BR-17.11) }
    SAReleaseCreatedData:
      type: object
      required: [agreement_id, agreement_number, legal_entity_id, release_number, release_no, kind, run_date, vendor_id, product_id, site_id, unit, cumulative_reset, cumulative_released, cumulative_received, lines]
      additionalProperties: false
      properties:
        agreement_id: { type: string, format: uuid }
        agreement_number: { type: string, example: SA-00000001 }
        legal_entity_id: { type: string, format: uuid }
        release_number: { type: string, example: REL-SA-00000001-1 }
        release_no: { type: integer, minimum: 1 }
        kind: { type: string, enum: [FRC, JIT], description: "FRC goes out as EDI DELFOR and JIT as DELJIT (wave 35)" }
        run_date: { type: string, format: date }
        vendor_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        unit: { type: string }
        cumulative_reset: { type: boolean, description: "true when the release recorded a cumulative reset, so cumulative_released may be below the previous release (BR-17.13)" }
        cumulative_released: { type: string, description: "decimal string; Σ scheduled quantity" }
        cumulative_received: { type: string, description: "decimal string; Σ received quantity (wave 18 receipts)" }
        lines:
          type: array
          items:
            type: object
            required: [line_no, schedule_line_no, product_id, delivery_date, qty, cumulative_released, cumulative_received, zone, in_horizon]
            additionalProperties: false
            properties:
              line_no: { type: integer, description: "position in delivery-date order" }
              schedule_line_no: { type: integer }
              product_id: { type: string, format: uuid }
              delivery_date: { type: string, format: date }
              qty: { type: string, description: decimal string }
              cumulative_released: { type: string, description: "decimal string; running Σ qty up to this line" }
              cumulative_received: { type: string, description: "decimal string; running Σ received up to this line" }
              zone: { type: string, enum: [FIRM, TRADEOFF, FORECAST], description: "zone on the run date (BR-17.13)" }
              in_horizon: { type: boolean, description: "inside the FRC or JIT horizon of the kind" }
    CatalogData:
      type: object
      required: [catalog_id, number, legal_entity_id, name, status, valid_from, org_unit_ids, entry_count, version]
      additionalProperties: false
      properties:
        catalog_id: { type: string, format: uuid }
