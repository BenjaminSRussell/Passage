asyncapi: 3.0.0
info:
  title: Passage Purchasing events
  version: 0.5.0
  description: |
    Events published by the purchasing service in wave 17 slices 1 to 4. Each is written to the
    outbox in the same transaction as the state change and relayed by Debezium to the topic
    passage.<context>.<entity>. Payload structs live in internal/events. Schema evolution is
    additive only (BACKWARD_TRANSITIVE).
defaultContentType: application/cloudevents+json
channels:
  requisition:
    address: passage.procurement.requisition
    description: Requisition lifecycle; the Kafka key is the requisition id so events stay ordered.
    messages:
      requisitionSubmitted:
        $ref: '#/components/messages/RequisitionSubmitted'
      requisitionApproved:
        $ref: '#/components/messages/RequisitionApproved'
  agreement:
    address: passage.procurement.agreement
    description: Purchase agreement release alerts; the Kafka key is the agreement id.
    messages:
      agreementThreshold:
        $ref: '#/components/messages/AgreementThreshold'
  po:
    address: passage.procurement.po
    description: Purchase order confirmation and cancellation; the Kafka key is the PO id so events stay ordered.
    messages:
      poConfirmed:
        $ref: '#/components/messages/POConfirmed'
      poCancelled:
        $ref: '#/components/messages/POCancelled'
  poversion:
    address: passage.procurement.poversion
    description: Confirmed purchase order versions above 1 (change orders); the Kafka key is the PO id.
    messages:
      poVersionCreated:
        $ref: '#/components/messages/POVersionCreated'
  rfq:
    address: passage.procurement.rfq
    description: Request for quotation send and award; the Kafka key is the RFQ id so events stay ordered.
    messages:
      rfqSent:
        $ref: '#/components/messages/RFQSent'
      rfqAwarded:
        $ref: '#/components/messages/RFQAwarded'
operations:
  publishRequisitionSubmitted:
    action: send
    channel:
      $ref: '#/channels/requisition'
    messages:
      - $ref: '#/channels/requisition/messages/requisitionSubmitted'
  publishRequisitionApproved:
    action: send
    channel:
      $ref: '#/channels/requisition'
    messages:
      - $ref: '#/channels/requisition/messages/requisitionApproved'
  publishAgreementThreshold:
    action: send
    channel:
      $ref: '#/channels/agreement'
    messages:
      - $ref: '#/channels/agreement/messages/agreementThreshold'
  publishPOConfirmed:
    action: send
    channel:
      $ref: '#/channels/po'
    messages:
      - $ref: '#/channels/po/messages/poConfirmed'
  publishPOCancelled:
    action: send
    channel:
      $ref: '#/channels/po'
    messages:
      - $ref: '#/channels/po/messages/poCancelled'
  publishPOVersionCreated:
    action: send
    channel:
      $ref: '#/channels/poversion'
    messages:
      - $ref: '#/channels/poversion/messages/poVersionCreated'
  publishRFQSent:
    action: send
    channel:
      $ref: '#/channels/rfq'
    messages:
      - $ref: '#/channels/rfq/messages/rfqSent'
  publishRFQAwarded:
    action: send
    channel:
      $ref: '#/channels/rfq'
    messages:
      - $ref: '#/channels/rfq/messages/rfqAwarded'
components:
  messages:
    RequisitionSubmitted:
      name: RequisitionSubmitted
      title: requisition.submitted.v1
      summary: A DRAFT requisition was submitted; status is IN_REVIEW, or APPROVED when the policy chain is empty.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.requisition.submitted.v1 }
              data: { $ref: '#/components/schemas/RequisitionData' }
    RequisitionApproved:
      name: RequisitionApproved
      title: requisition.approved.v1
      summary: A requisition reached APPROVED. In this slice that is the auto-approval band on submit (written right after requisition.submitted in the same transaction).
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.requisition.approved.v1 }
              data: { $ref: '#/components/schemas/RequisitionData' }
    AgreementThreshold:
      name: AgreementThreshold
      title: agreement.threshold.v1
      summary: A PO line released against a purchase agreement line took it to the threshold (90 % of the commitment) or over a SOFT limit (FR-17.5, BR-17.10). Written in the PO's transaction; the threshold fires once per line, a SOFT overrun on every release that exceeds.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.agreement.threshold.v1 }
              subject: { type: string, format: uuid, description: agreement id }
              data: { $ref: '#/components/schemas/AgreementThresholdData' }
    POConfirmed:
      name: POConfirmed
      title: po.confirmed.v1
      summary: A version of a purchase order was confirmed, by :confirm or by a post-confirmation change that needed no re-approval (FR-17.7, FR-17.8). Carries the whole order at that version.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.po.confirmed.v1 }
              subject: { type: string, format: uuid, description: purchase order id }
              data: { $ref: '#/components/schemas/POConfirmedData' }
    POVersionCreated:
      name: POVersionCreated
      title: poversion.created.v1
      summary: A confirmed purchase order version above 1 (change order, FR-17.8), written right after po.confirmed in the same transaction. The PRD calls it po.version.created; the platform type grammar allows one entity segment.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.poversion.created.v1 }
              subject: { type: string, format: uuid, description: purchase order id }
              data: { $ref: '#/components/schemas/POVersionCreatedData' }
    POCancelled:
      name: POCancelled
      title: po.cancelled.v1
      summary: A purchase order with nothing received or invoiced was cancelled (BR-17.2); its open lines are CANCELLED and their remaining quantity is released.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.po.cancelled.v1 }
              subject: { type: string, format: uuid, description: purchase order id }
              data: { $ref: '#/components/schemas/POCancelledData' }
    RFQSent:
      name: RFQSent
      title: rfq.sent.v1
      summary: A DRAFT RFQ was sent; carries the invited vendors, the deadline and the lines to quote (FR-17.4). Consumed by the supplier portal (wave 20) and notifications.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.rfq.sent.v1 }
              subject: { type: string, format: uuid, description: RFQ id }
              data: { $ref: '#/components/schemas/RFQSentData' }
    RFQAwarded:
      name: RFQAwarded
      title: rfq.awarded.v1
      summary: RFQ lines were awarded and their DRAFT purchase orders created in the same transaction (FR-17.4); one entry per awarded line with the winning vendor, price and purchase order.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { type: string, const: dev.passage.procurement.rfq.awarded.v1 }
              subject: { type: string, format: uuid, description: RFQ id }
              data: { $ref: '#/components/schemas/RFQAwardedData' }
  schemas:
    Envelope:
      type: object
      description: CloudEvents 1.0 structured envelope with Passage extensions.
      required: [specversion, id, source, type, time, datacontenttype, tenantid, subject, data]
      properties:
        specversion: { type: string, const: "1.0" }
        id: { type: string, format: uuid }
        source: { type: string, const: /passage/procurement/purchasing }
        type: { type: string }
        subject: { type: string, format: uuid, description: id of the aggregate (requisition, agreement, purchase order or RFQ) }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, const: application/json }
        tenantid: { type: string, format: uuid }
    RequisitionData:
      type: object
      required: [requisition_id, number, legal_entity_id, requester_id, currency, lines, total, approver_chain, policy_version, status]
      additionalProperties: false
      properties:
        requisition_id: { type: string, format: uuid }
        number: { type: string, example: PR-00000001 }
        legal_entity_id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        lines:
          type: array
          items:
            type: object
            required: [line_no, line_id, qty, amount]
            additionalProperties: false
            properties:
              line_no: { type: integer }
              line_id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              category: { type: string }
              qty: { type: string, description: decimal string }
              amount: { type: string, description: decimal string in the requisition currency }
        total: { type: string, description: decimal string in the requisition currency }
        approver_chain:
          type: array
          items: { type: string, enum: [MANAGER, CATEGORY_OWNER, CFO] }
        policy_version: { type: string, example: builtin-1 }
        status: { type: string, enum: [IN_REVIEW, APPROVED] }
    AgreementThresholdData:
      type: object
      required: [agreement_id, number, vendor_id, line, line_id, commitment_type, pct, overrun]
      additionalProperties: false
      properties:
        agreement_id: { type: string, format: uuid }
        number: { type: string, example: PA-00000001 }
        vendor_id: { type: string, format: uuid }
        line: { type: integer, description: agreement line number }
        line_id: { type: string, format: uuid }
        commitment_type: { type: string, enum: [QUANTITY, VALUE, CATEGORY_VALUE, TOTAL_VALUE] }
        pct: { type: string, description: decimal string, released percentage of the commitment after the release }
        overrun: { type: boolean, description: true when a SOFT limit was exceeded }
        expiry: { type: string, format: date, description: the agreement valid_to; absent when open-ended }
    POConfirmedData:
      type: object
      required: [po_id, number, version_no, legal_entity_id, vendor_id, currency, subtotal, discount_total, charges_total, tax_total, total, lines]
      additionalProperties: false
      properties:
        po_id: { type: string, format: uuid }
        number: { type: string, example: PO-00000001 }
        version_no: { type: integer, minimum: 1 }
        legal_entity_id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        subtotal: { type: string, description: decimal string }
        discount_total: { type: string, description: decimal string }
        charges_total: { type: string, description: decimal string }
        tax_total: { type: string, description: decimal string }
        total: { type: string, description: decimal string; subtotal − discount_total + charges_total + tax_total }
        lines:
          type: array
          description: Every line, cancelled ones included with status CANCELLED so consumers can close what they hold.
          items:
            type: object
            required: [line_no, qty, unit, unit_price, price_unit, line_amount, delivery_date, status]
            additionalProperties: false
            properties:
              line_no: { type: integer }
              product_id: { type: string, format: uuid }
              description: { type: string }
              qty: { type: string, description: decimal string }
              unit: { type: string }
              unit_price: { type: string, description: decimal string }
              price_unit: { type: string, description: decimal string }
              line_amount: { type: string, description: decimal string }
              delivery_date: { type: string, format: date }
              status: { type: string, enum: [OPEN, RECEIVED, INVOICED, CANCELLED] }
    POVersionCreatedData:
      type: object
      required: [po_id, number, version_no, patch, reapproval_required]
      additionalProperties: false
      properties:
        po_id: { type: string, format: uuid }
        number: { type: string, example: PO-00000001 }
        version_no: { type: integer, minimum: 2 }
        patch:
          type: array
          description: RFC 6902 operations turning the previous version's snapshot into this one; paths such as /lines/0/qty index lines by line number order.
          items:
            type: object
            required: [op, path]
            properties:
              op: { type: string, enum: [add, remove, replace] }
              path: { type: string }
              value: {}
        reapproval_required: { type: boolean, description: true when the change went back through approval before this confirmation }
    POCancelledData:
      type: object
      required: [po_id, number, version_no, prior_status, lines]
      additionalProperties: false
      properties:
        po_id: { type: string, format: uuid }
        number: { type: string, example: PO-00000001 }
        version_no: { type: integer, description: confirmed version at cancellation; 0 when never confirmed }
        prior_status: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, CONFIRMED] }
        lines:
          type: array
          items:
            type: object
            required: [line_no, unit, remaining_qty]
            additionalProperties: false
            properties:
              line_no: { type: integer }
              product_id: { type: string, format: uuid }
              unit: { type: string }
              remaining_qty: { type: string, description: decimal string still to be received when cancelled }
    RFQSentData:
      type: object
      required: [rfq_id, number, legal_entity_id, vendor_ids, reply_deadline, lines]
      additionalProperties: false
      properties:
        rfq_id: { type: string, format: uuid }
        number: { type: string, example: RFQ-00000001 }
        legal_entity_id: { type: string, format: uuid }
        vendor_ids: { type: array, items: { type: string, format: uuid } }
        reply_deadline: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [line_no, line_id, qty, unit]
            additionalProperties: false
            properties:
              line_no: { type: integer }
              line_id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              description: { type: string }
              qty: { type: string, description: decimal string }
              unit: { type: string }
              required_date: { type: string, format: date }
    RFQAwardedData:
      type: object
      required: [rfq_id, number, legal_entity_id, awards]
      additionalProperties: false
      properties:
        rfq_id: { type: string, format: uuid }
        number: { type: string, example: RFQ-00000001 }
        legal_entity_id: { type: string, format: uuid }
        awards:
          type: array
          items:
            type: object
            required: [line_no, line_id, reply_id, vendor_id, unit_price, price_unit, currency, lead_time_days, purchase_order_id]
            additionalProperties: false
            properties:
              line_no: { type: integer }
              line_id: { type: string, format: uuid }
              reply_id: { type: string, format: uuid }
              vendor_id: { type: string, format: uuid }
              unit_price: { type: string, description: decimal string }
              price_unit: { type: string, description: decimal string }
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              lead_time_days: { type: integer, minimum: 0 }
              purchase_order_id: { type: string, format: uuid }
              override_reason: { type: string, description: present when a late reply was awarded (BR-17.11) }
