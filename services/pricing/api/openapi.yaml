    post:
      operationId: attributeFund
      summary: >
        Attribute usage (campaign or rebate accrual, claim, deduction) to the fund in a period
        (BR-26.15). 409 PRC-0011 when the fund is closed; 422 PRC-0012 when usage would exceed the
        period budget and overspend is off. Writes dev.passage.pricing.fundusage.recorded.v1.
      x-passage-duty: pricing.fund.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
