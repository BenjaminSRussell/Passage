    post:
      operationId: createCommissionRule
      summary: Create a commission rule for a sales group and customer/item commission group (BR-26.12).
      description: The rule takes the sales group's legal entity. One rule per (sales group, customer group, item group); a second is 409 PRC-0038.
      x-passage-duty: pricing.commission.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
