  /v1/pricing/rebates/vendor-claims/{id}:approve:
    post:
      operationId: approveVendorRebateClaim
      summary: Approve an OPEN claim for settlement through w19 AP (duty VendorRebateClaimApprove).
      description: >
        Checks the body version (412 conflict_version), requires OPEN (409 PRC-0031) and refuses the
        user who created the claim (403 PRC-0046). Writes vendorrebateclaim.approved.
      x-passage-duty: pricing.rebate.claim.approve
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
