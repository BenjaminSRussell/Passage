openapi: 3.1.0
info:
  title: Passage Pricing API
  version: 0.1.0
  description: >
    Slices 1-4 of wave 26 (PSG-26). Deterministic price resolution with explain, simulation,
    condition-record lifecycle, atomic price journals with reversal, customer rebate
    agreements with accrual and retroactive recompute, sales commissions, trade promotion
    funds with budget and usage tracking, and promotion planning with baseline, lift and
    actuals. The browser reaches these paths as /api/v1/pricing/...;
    the BFF rewrites them to /v1/pricing/... on this service.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/pricing/workspace:
    get:
      operationId: getPricingWorkspace
      summary: Pricing workspace tiles (§5.26.6) - expiring in 30 days, draft journals, campaigns and accrual this period.
      description: >
        Exact counts for one legal entity, or for every legal entity in the caller's scope when
        legalEntityId is omitted. Accruals are the rebate accrued on invoices dated in the
        calendar month of asOf, per party role and currency (customer rebates and vendor rebates
        are never added together).
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: asOf, in: query, required: false, description: "Defaults to today (UTC).", schema: {type: string, format: date}}
      responses:
        "200":
          description: The tiles.
          content:
            application/json:
              schema:
                type: object
                required: [asOf, month, activeRecords, draftRecords, expiringIn30Days, journalsToPost, liveCampaigns, claimsAwaitingApproval, accrualsThisMonth]
                properties:
                  legalEntityId: {type: string, format: uuid}
                  asOf: {type: string, format: date}
                  month: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}
                  activeRecords: {type: integer}
                  draftRecords: {type: integer}
                  expiringIn30Days: {type: integer, description: "ACTIVE records whose valid_to is asOf to asOf + 30 days."}
                  journalsToPost: {type: integer, description: "Price journals OPEN or VALIDATED."}
                  liveCampaigns: {type: integer, description: "Campaigns valid on asOf and not killed."}
                  claimsAwaitingApproval: {type: integer, description: "Vendor rebate claims OPEN."}
                  accrualsThisMonth:
                    type: array
                    items:
                      type: object
                      required: [partyRole, currency, amount]
                      properties:
                        partyRole: {type: string, enum: [CUSTOMER, VENDOR]}
                        currency: {type: string, pattern: "^[A-Z]{3}$"}
                        amount: {type: string, description: "Decimal string."}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/resolve:
    post:
      operationId: resolvePrice
      summary: Resolve net prices and discounts for a document header and up to 500 lines.
      description: >
        Stateless with respect to the request. Loads ACTIVE condition records of the legal
        entity valid on pricingDate for the currency, then applies the pricing procedure: the
        ACTIVE version of the procedure named in the request, else the one assigned to the
        salesChannel, else the legal entity's default assignment (PRD 5.26.13
        reference_procedure; see /v1/pricing/procedure-assignments). The result names the
        procedure and version in procedure. Steps run in step order; the members of an exclusion
        group keep one condition (BEST the lowest net, FIRST the lowest step, FR-26.8; a member
        that lost carries the reason in the trace); a statistical step is reported in applied
        with its amount and does not change the net. Step requirements (CEL) are stored but not
        yet evaluated. Without any procedure the reference order runs (PRICE, LINE_DISC,
        MULTILINE_DISC, TOTAL_DISC, SURCHARGE). A procedure the request names or the assignment
        points to that has no ACTIVE version is 422 PRC-0063. MULTILINE_DISC matches on the
        summed quantity of the lines sharing a product group and unit (BR-26.4). SURCHARGE applies
        when the subtotal is below the small-order threshold (250 USD, 200 EUR; none for other
        currencies) and is reported in surcharge as well as added to orderNet. A line without a price carries errorCode PRC-0001 and
        is left out of the totals; the request itself still answers 200. The explain trace is returned only when ?explain=true; traces above
        PRICING_EXPLAIN_MAX_BYTES are replaced by explainTruncated=true. explainRef is the
        sha256 content address of the trace body.
      parameters:
        - name: explain
          in: query
          required: false
          schema: {type: string, enum: ["true", "false"]}
      x-passage-duty: pricing.view
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResolveRequest"}
      responses:
        "200":
          description: Priced document.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResolveResponse"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/pricing/simulate:
    post:
      operationId: simulatePrice
      summary: Price a tuple against inline condition records without storing anything.
      description: >
        Explains by default; pass ?explain=false to omit the trace. The body's legalEntityId (and
        salesChannel or procedure) chooses the procedure exactly as resolve does, so a simulation
        shows what the assigned procedure would do to the inline records.
      parameters:
        - name: explain
          in: query
          required: false
          schema: {type: string, enum: ["true", "false"]}
      x-passage-duty: pricing.view
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SimulateRequest"}
      responses:
        "200":
          description: Priced document with trace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResolveResponse"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/compare:
    post:
      operationId: comparePrices
      summary: Price one request under two procedure versions and report what differs (FR-26.13).
      description: >
        Both versions are stored procedure versions of the request's legal entity, DRAFT included, so a
        draft can be tried against the active version before it is activated. The request is priced against
        the inline `records` when they are present and against the legal entity's ACTIVE records as of the
        pricing date otherwise. Nothing is stored. Explains by default; pass ?explain=false to omit the traces.
        The deltas are version B minus version A. A version outside the caller's legal entities is 404 PRC-0042;
        one of another legal entity the caller may read is 422.
      parameters:
        - name: explain
          in: query
          required: false
          schema: {type: string, enum: ["true", "false"]}
      x-passage-duty: pricing.view
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompareRequest"}
      responses:
        "200":
          description: Both priced documents and their line-by-line comparison.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompareResponse"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/price-list:
    get:
      operationId: getCustomerPriceList
      summary: Price list by customer, the ACTIVE condition records that apply to a customer on a date (PRD 5.26.14).
      description: >
        Returns the records keyed to the customer, to the customer's group (when customerGroupId is
        given) or to all customers, ordered by product, variant, unit, condition type, scope (CUSTOMER,
        GROUP, ALL) and from-quantity. Records of a killed, expired or non-targeted campaign are left out,
        as in resolve. It is an inquiry: POST /resolve decides which condition wins a given line.
        At most 1000 items are returned, in that order; `truncated` is true when more apply (narrow with type).
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: customerId, in: query, required: true, schema: {type: string}}
        - {name: customerGroupId, in: query, required: false, schema: {type: string}}
        - {name: currency, in: query, required: true, schema: {type: string, pattern: "^[A-Z]{3}$"}}
        - {name: asOf, in: query, required: true, description: "Pricing date, YYYY-MM-DD.", schema: {type: string, format: date}}
        - {name: type, in: query, required: false, description: "Comma-separated condition types; all types when omitted.", schema: {type: string}}
      responses:
        "200":
          description: The applicable records, most specific agreement first.
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    items: {$ref: "#/components/schemas/PriceListItem"}
                  truncated: {type: boolean, description: "True when more than 1000 records apply and the list was cut."}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/price-list/net-prices:
    get:
      operationId: getCustomerNetPriceList
      summary: Price list by customer with the net price at each quantity break (PRD 5.26.14).
      description: >
        Batch resolve over the customer's price list. Each product row of the applicable PRICE records
        (see getCustomerPriceList) is priced as a one-line sale at its quantity breaks: the from-quantities
        of the price, line discount and multiline discount records that can price a line of the row (its own,
        its product's for a variant row, and the all-products ones, with the row's unit or none), from its
        lowest price break up, at most 20 per row. Each break is priced exactly as the line of a
        POST /v1/pricing/resolve of that one line, under the procedure the sales channel is assigned or the
        named one; `priceRecordId` is the winning PRICE record and `applied` every condition the line
        applied, so a client can mark the winning records. Rows are product, variant, unit combinations in
        the order of the price list. A record keyed to a product group is priced as a line of that group,
        a product row as a line with no product group. Order-level conditions (total discount, small-order
        surcharge) and free goods are not part of a break: `lineNet` is the quantity times the net unit
        price, and an INCLUSIVE free goods rule lowers the charged quantity only on an order.
        One response resolves at most 500 rows and 2,000 breaks in all; rows are taken whole in order and
        `truncated` is true when more apply (narrow with productId or productGroupId).
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: customerId, in: query, required: true, schema: {type: string}}
        - {name: customerGroupId, in: query, required: false, schema: {type: string}}
        - {name: currency, in: query, required: true, schema: {type: string, pattern: "^[A-Z]{3}$"}}
        - {name: asOf, in: query, required: true, description: "Pricing date, YYYY-MM-DD.", schema: {type: string, format: date}}
        - {name: productId, in: query, required: false, description: "Only rows keyed to this product or one of its variants (with productGroupId, rows matching either).", schema: {type: string}}
        - {name: productGroupId, in: query, required: false, description: "Only rows keyed to this product group (with productId, rows matching either).", schema: {type: string}}
        - {name: salesChannel, in: query, required: false, description: "Channel whose procedure assignment prices the breaks.", schema: {type: string}}
        - {name: procedure, in: query, required: false, description: "Procedure name to price with instead of the assigned one.", schema: {type: string}}
      responses:
        "200":
          description: The net price rows.
          content:
            application/json:
              schema:
                type: object
                required: [rows, truncated]
                properties:
                  rows:
                    type: array
                    maxItems: 500
                    items: {$ref: "#/components/schemas/NetPriceRow"}
                  truncated: {type: boolean, description: "True when more rows apply than the 500 rows or 2,000 breaks one response resolves."}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {description: "A query field is invalid, or PRC-0063 when the named or assigned procedure has no ACTIVE version.", content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
  /v1/pricing/condition-records:
    get:
      operationId: listConditionRecords
      summary: List condition records.
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [DRAFT, ACTIVE, EXPIRED, WITHDRAWN]}}
        - {name: type, in: query, required: false, schema: {type: string, enum: [PRICE, LINE_DISC, MULTILINE_DISC, TOTAL_DISC, SURCHARGE]}}
        - {name: customer, in: query, required: false, description: "Exact customer or customer-group key.", schema: {type: string}}
        - {name: product, in: query, required: false, description: "Exact product or product-group key.", schema: {type: string}}
        - {name: campaignId, in: query, required: false, description: "Records of one campaign (FR-26.10).", schema: {type: string, format: uuid}}
        - {name: asOf, in: query, required: false, description: "Records valid on this date (YYYY-MM-DD).", schema: {type: string, format: date}}
        - {name: validToFrom, in: query, required: false, description: "Records whose last valid day is on or after this date. With validToFrom or validToTo the list is ordered by validTo, then id (the workspace's expiring list).", schema: {type: string, format: date}}
        - {name: validToTo, in: query, required: false, description: "Records whose last valid day is on or before this date; must not be before validToFrom.", schema: {type: string, format: date}}
        - {name: limit, in: query, required: false, description: "Page size, ordered by id unless a validTo range is given.", schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        "200":
          description: Matching records.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ConditionRecord"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createConditionRecord
      summary: Create a condition record in DRAFT.
      description: Overlap is checked at activation, not at creation (BR-26.6).
      x-passage-duty: pricing.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConditionRecordInput"}
      responses:
        "201":
          description: Created as DRAFT.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConditionRecord"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {description: "campaignId names no campaign the caller can see (PRC-0041).", content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/condition-records/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getConditionRecord
      summary: Read one condition record.
      x-passage-duty: pricing.view
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConditionRecord"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/condition-records/{id}:activate:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: activateConditionRecord
      summary: Activate a DRAFT record after the overlap check.
      description: >
        Locks the key hash, rejects an overlapping ACTIVE record with 409 PRC-0002 naming
        its id, and writes dev.passage.pricing.conditionrecord.activated.v1 to the outbox in the
        same transaction. The version in the body must match the stored version (412
        conflict_version otherwise). A retry with the same Idempotency-Key replays the first response.
      x-passage-duty: pricing.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Activated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConditionRecord"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/condition-records/{id}:withdraw:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: withdrawConditionRecord
      summary: Withdraw an ACTIVE record.
      description: >
        Writes dev.passage.pricing.conditionrecord.withdrawn.v1 in the same transaction. The
        version in the body must match the stored version (412 conflict_version otherwise).
        A retry with the same Idempotency-Key replays the first response.
      x-passage-duty: pricing.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Withdrawn.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConditionRecord"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/condition-records:expire:
    post:
      operationId: expireConditionRecords
      summary: Record expiry job (BR-26.9, §5.26.16) for one legal entity, called by the scheduler at 00:10 entity-local.
      description: >
        ACTIVE records of the legal entity whose valid_to is before asOf become EXPIRED with the
        next version; a record whose valid_to equals asOf stays ACTIVE (validity is inclusive).
        Each expired record writes dev.passage.pricing.conditionrecord.withdrawn.v1 with reason
        EXPIRED in the same transaction. Running it again for the same day expires nothing more.
        asOf may be at most one day after today (UTC), so validity that is still running is never ended.
      x-passage-duty: pricing.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, asOf]
              properties:
                legalEntityId: {type: string, format: uuid}
                asOf: {type: string, format: date, description: "The entity-local day the job runs for."}
      responses:
        "200":
          description: The records this run expired.
          content:
            application/json:
              schema:
                type: object
                required: [legalEntityId, asOf, expired, recordIds]
                properties:
                  legalEntityId: {type: string, format: uuid}
                  asOf: {type: string, format: date}
                  expired: {type: integer}
                  recordIds: {type: array, items: {type: string, format: uuid}}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/journals:
    get:
      operationId: listPriceJournals
      summary: Price journal log (PRD 5.26.14), newest first, without lines.
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [OPEN, VALIDATED, POSTED, REVERSED]}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        "200":
          description: Journal headers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Journal"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createPriceJournal
      summary: Create an OPEN price journal of up to 100,000 mass create, update or delete lines.
      description: >
        Each line is checked when the journal is created. Field errors are keyed lines[i].field.
        Nothing is written to condition records until :post (FR-26.9).
      x-passage-duty: pricing.journal.post
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JournalRequest"}
      responses:
        "201":
          description: Created as OPEN.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Journal"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/journals:import-csv:
    post:
      operationId: importPriceJournalCsv
      summary: Create an OPEN price journal from a CSV file of up to 100,000 rows (FR-26.9, §5.26.6 "import CSV").
      description: >
        The first row is the header and must name the op column; the other columns are any of
        recordId, expectedVersion, adjustPct, type, customerKind, customerKey, productKind,
        productKey, variant, currency, unit, fromQuantity, amount, discPct1, discPct2, validFrom,
        validTo, searchNext, exclusive and campaignId, in any order. An unknown or repeated column
        is refused (csv.header). Data row n becomes journal line n; record columns are read for
        CREATE and for UPDATE without adjustPct, as in the JSON route. Faults found while reading
        a row are keyed rows[n].column (at most 100 rows are listed, csv says how many have
        faults); faults of the journal itself use the JSON route's keys (lines[n-1].field). The
        journal is then validated and posted like any other.
      x-passage-duty: pricing.journal.post
      parameters:
        - {name: legalEntityId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: name, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 120}}
        - {name: smartRound, in: query, required: false, schema: {type: boolean, default: false}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, maxLength: 33554432}
      responses:
        "201":
          description: Created as OPEN.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Journal"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/journals/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getPriceJournal
      summary: Read a price journal with its lines (op, before and after snapshots) and per-line errors.
      description: At most 1,000 lines are returned (linesTruncated=true when there are more); errors are always complete.
      x-passage-duty: pricing.view
      responses:
        "200":
          description: The journal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Journal"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/journals/{id}:validate:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: validatePriceJournal
      summary: Validate every line of an OPEN journal against the stored record versions.
      x-passage-duty: pricing.journal.post
      responses:
        "200":
          description: Validated, or still OPEN with errors listed per line.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Journal"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/pricing/procedure-assignments:
    get:
      operationId: listProcedureAssignments
      summary: List which pricing procedure a legal entity uses per sales channel.
      description: >
        Procedure determination (PRD 5.26.13, reference_procedure). Returns the default
        assignment (empty salesChannel) first, then the channel rows. A legal entity with none
        prices in the reference order. A legal entity outside the caller's scope is 403 AUTH-0003.
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The assignments of the legal entity.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ProcedureAssignment"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    put:
      operationId: setProcedureAssignment
      summary: Set the procedure a legal entity and sales channel price with.
      description: >
        version is the version read (0 when the channel has no assignment); a different stored
        version is 412 conflict_version. The procedure must have an ACTIVE version (422
        PRC-0063); later activations of a new version take effect without changing the
        assignment. Writes dev.passage.pricing.procedureassignment.changed.v1 to the outbox in the
        same transaction. A legal entity outside the caller's scope is 403 AUTH-0003. A retry with
        the same Idempotency-Key replays the first response.
      x-passage-duty: pricing.admin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, procedureName, version]
              properties:
                legalEntityId: {type: string, format: uuid}
                salesChannel: {type: string, pattern: "^([A-Z0-9][A-Z0-9_-]{0,31})?$", description: "Empty for the legal entity's default."}
                procedureName: {type: string, pattern: "^[A-Z0-9][A-Z0-9_-]*$", maxLength: 64}
                version: {type: integer, minimum: 0}
      responses:
        "200":
          description: The stored assignment.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProcedureAssignment"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: clearProcedureAssignment
      summary: Remove the procedure assignment of a legal entity and sales channel.
      description: >
        version is the version read; a different or missing assignment is 412 conflict_version.
        The channel then falls back to the legal entity's default assignment, or to the
        reference order when there is none. Writes
        dev.passage.pricing.procedureassignment.changed.v1 (cleared) to the outbox in the same
        transaction. A retry with the same Idempotency-Key replays the first success.
      x-passage-duty: pricing.admin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: legalEntityId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: salesChannel, in: query, required: false, schema: {type: string, pattern: "^([A-Z0-9][A-Z0-9_-]{0,31})?$"}, description: "Empty for the legal entity's default."}
        - {name: version, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "204":
          description: The assignment was removed.
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/parameters:
    get:
      operationId: getPricingParameters
      summary: Read the pricing parameters of a legal entity.
      description: >
        Returns the stored parameters, or the defaults at version 0 when none are stored
        (PRD 5.26.13). Today the parameter is journalFourEyes (default false): when true, the
        user who created a price journal cannot post it (403 PRC-0057). A legal entity outside
        the caller's scope is 403 AUTH-0003.
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The parameters.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricingParameters"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    put:
      operationId: setPricingParameters
      summary: Set the pricing parameters of a legal entity at the expected version.
      description: >
        version is the version read (0 when none was stored); a different stored version is
        412 conflict_version. The change writes dev.passage.pricing.parameters.changed.v1 to the
        outbox in the same transaction (the audit record: value, version and the user). Every
        value is required, since the PUT replaces them all. A legal entity outside the caller's
        scope is 403 AUTH-0003. A retry with the same Idempotency-Key replays the first response.
      x-passage-duty: pricing.admin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, journalFourEyes, version]
              properties:
                legalEntityId: {type: string, format: uuid}
                journalFourEyes: {type: boolean}
                version: {type: integer, minimum: 0}
      responses:
        "200":
          description: The stored parameters.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricingParameters"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/journals/{id}:post:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: postPriceJournal
      summary: Post a VALIDATED journal in one transaction.
      description: >
        Requires status VALIDATED (409 otherwise). Validates again under the legal entity's
        journal lock and refuses with 422 PRC-0005 naming the failing lines if anything changed
        since validation; nothing is written then. Otherwise writes every line in one transaction
        with dev.passage.pricing.conditionrecord.activated.v1 (or .withdrawn.v1) per record plus
        dev.passage.pricing.journal.posted.v1 to the outbox (FR-26.9). A journal created by a
        commodity calculation run cannot be posted by the user who ran it (403 PRC-0056,
        CommodityPriceRun / PricingJournalPost segregation). When the legal entity's
        journalFourEyes parameter is on, the user who created a journal cannot post it, nor can
        a caller without a user identity (403 PRC-0057, maker/checker); PRC-0056 is checked
        first, so a commodity run's runner (its journal's creator) gets PRC-0056. A journal
        with no recorded creator (created before parameters existed) may be posted by any
        identified user. A retry with the same
        Idempotency-Key replays the first response.
      x-passage-duty: pricing.journal.post
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Posted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Journal"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/journals/{id}:reverse:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: reversePriceJournal
      summary: Reverse a POSTED journal into a new journal that references the original.
      description: >
        Restores the content every line replaced, in one transaction (AC4, AC-26.7); records created
        by the journal are withdrawn. A record changed since the post fails the reversal with 422
        PRC-0005 and nothing is written. A retry with the same Idempotency-Key replays the first response.
      x-passage-duty: pricing.journal.post
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: The new reversing journal (POSTED).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Journal"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/rebates/agreements:
    get:
      operationId: listRebateAgreements
      summary: List customer and vendor rebate agreements.
      x-passage-duty: pricing.rebate.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: partyRole, in: query, required: false, schema: {type: string, enum: [CUSTOMER, VENDOR]}}
      responses:
        "200":
          description: Agreements, oldest validity first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/RebateAgreement"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createRebateAgreement
      summary: Create a customer (FR-26.11) or vendor (FR-26.15) rebate agreement with tiers.
      x-passage-duty: pricing.rebate.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RebateAgreementInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RebateAgreement"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/rebates/agreements/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getRebateAgreement
      summary: Read one rebate agreement with its tiers.
      x-passage-duty: pricing.rebate.view
      responses:
        "200":
          description: The agreement.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RebateAgreement"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/rebates/agreements/{id}:revise:
    post:
      operationId: reviseRebateAgreement
      summary: Change the name, end date or tiers of an ACTIVE rebate agreement (FR-26.11).
      description: >
        Send only the fields to change, with the version read. The end date may not fall before an
        invoice already accrued (422 PRC-0048) and the tiers may not change once the agreement has
        accruals (422 PRC-0049: close it and create a new one). 409 PRC-0031 when the agreement is CLOSED;
        412 on a stale version. Writes dev.passage.pricing.rebateagreement.revised.v1 in the same
        transaction; a repeated Idempotency-Key replays the first response.
      x-passage-duty: pricing.rebate.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RebateAgreementRevision"}
      responses:
        "200":
          description: The revised agreement; version incremented.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RebateAgreement"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/rebates/agreements/{id}:close:
    post:
      operationId: closeRebateAgreement
      summary: End an ACTIVE rebate agreement early on a close date (FR-26.11).
      description: >
        validTo becomes the close date and the status CLOSED, so invoices dated later no longer accrue;
        accruals already booked stay. The close date must lie within the validity and not before an invoice
        already accrued (422 PRC-0048). 409 PRC-0031 when already closed; 412 on a stale version. Writes
        dev.passage.pricing.rebateagreement.closed.v1 in the same transaction; a repeated Idempotency-Key
        replays the first response.
      x-passage-duty: pricing.rebate.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RebateAgreementClose"}
      responses:
        "200":
          description: The closed agreement; version incremented.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RebateAgreement"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/rebates/accruals:
    get:
      operationId: listRebateAccruals
      summary: List accruals by agreement and period.
      x-passage-duty: pricing.rebate.view
      parameters:
        - {name: agreementId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: period, in: query, required: false, description: "Period key such as 2027-03, 2027-Q1 or 2027.", schema: {type: string, pattern: "^[0-9]{4}(-(0[1-9]|1[0-2])|-Q[1-4])?$"}}
      responses:
        "200":
          description: Accrual rows.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/RebateAccrual"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: accrueRebateInvoiceLine
      summary: Accrue one posted invoice line against an agreement (invoice.posted consumer).
      description: >
        Stand-in for the invoice.posted consumer (w30). Locks the (agreement, period) row, moves the
        period to its target at the new cumulative basis and accrues the difference on this line, so a
        tier crossing recomputes the whole period (BR-26.8). 201 when a new accrual posted, 200 when the
        invoice line was already accrued with the same date, value and quantity, 422
        idempotency_key_reuse when it was accrued with different ones.
      x-passage-duty: pricing.rebate.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RebateAccrualInput"}
      responses:
        "200":
          description: Already accrued (redelivery).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RebateAccrual"}
        "201":
          description: Accrued; dev.passage.pricing.rebateaccrual.posted.v1 written to the outbox.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RebateAccrual"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/rebates/agreements/{id}:retro-recompute:
    post:
      operationId: retroRecomputeRebateAgreement
      summary: Re-accrue the invoices posted before a retroactive activation and post the delta per period (FR-26.23).
      description: >
        The agreement is activated when it is created; when its validFrom is earlier, the invoices posted
        between validFrom and the activation day are replayed (SAP VBOF). Until the w29/w30 invoice ledger
        exists the caller supplies those posted invoice lines. Each line not accrued before joins its
        period's cumulative basis (recorded as a zero-amount accrual with retroactive=true); each period is
        then recomputed at its tier and the difference against what it already accrued posts once, with
        retroactive=true and a rebateaccrual.posted event (BR-26.7, BR-26.14, AC-26.14). Posted invoices are
        never re-priced. The Idempotency-Key names the run: a repeated key returns the stored deltas with
        replayed=true. 422 when the agreement is not retroactive or a line is outside validFrom..activation.
      x-passage-duty: pricing.rebate.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RetroRecomputeRequest"}
      responses:
        "200":
          description: The deltas posted (none when every period was already at its target).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RetroRecomputeResult"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/rebates/agreements/{id}/claim-preview:
    get:
      operationId: previewVendorRebateClaim
      summary: Preview the claim one period of a VENDOR agreement would produce (FR-26.15, AC-26.11).
      description: >
        amount = the period's accruals - the period's earlier claims (BR-26.11). Nothing is written.
        422 PRC-0045 for a CUSTOMER agreement.
      x-passage-duty: pricing.rebate.view
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: period, in: query, required: true, description: "Period key such as 2027-03, 2027-Q1 or 2027.", schema: {type: string, pattern: "^[0-9]{4}(-(0[1-9]|1[0-2])|-Q[1-4])?$"}}
      responses:
        "200":
          description: The claim the period would produce now.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VendorClaimPreview"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/rebates/vendor-accruals:
    post:
      operationId: accrueVendorRebateInvoiceLine
      summary: Accrue one posted vendor invoice line against a VENDOR agreement (vendor-invoice.posted consumer, FR-26.15).
      description: >
        Stand-in for the w19 vendor-invoice.posted consumer. value is the vendor invoice net and
        quantity the received quantity (BR-26.11). Same period lock, tier recompute and redelivery
        rules as /rebates/accruals; the accrual posts Dr 2160 / Cr 5100 (AC-26.11) through
        rebateaccrual.posted with party_role VENDOR. 422 PRC-0045 for a CUSTOMER agreement.
      x-passage-duty: pricing.rebate.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RebateAccrualInput"}
      responses:
        "200":
          description: Already accrued (redelivery).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RebateAccrual"}
        "201":
          description: Accrued; dev.passage.pricing.rebateaccrual.posted.v1 written to the outbox.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RebateAccrual"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/rebates/vendor-claims:
    get:
      operationId: listVendorRebateClaims
      summary: Vendor rebate claims inquiry (§5.26.14), newest first.
      x-passage-duty: pricing.rebate.view
      parameters:
        - {name: agreementId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: vendorId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: period, in: query, required: false, schema: {type: string, pattern: "^[0-9]{4}(-(0[1-9]|1[0-2])|-Q[1-4])?$"}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [OPEN, APPROVED]}}
      responses:
        "200":
          description: At most 100 claims.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/VendorClaim"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createVendorRebateClaim
      summary: Claim one period of a VENDOR agreement (FR-26.15, BR-26.11).
      description: >
        Creates claim RC-n (sequence per legal entity) OPEN for the period's accruals less its
        earlier claims, under the period lock, and writes vendorrebateclaim.created. A negative
        amount (over-accrual) settles by VENDOR_INVOICE whatever settlementMode says. 422 PRC-0043
        when nothing was accrued in the period, 409 PRC-0015 when its accruals are fully claimed,
        422 PRC-0045 for a CUSTOMER agreement.
      x-passage-duty: pricing.rebate.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VendorClaimInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VendorClaim"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/rebates/vendor-claims/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getVendorRebateClaim
      summary: Read one vendor rebate claim.
      x-passage-duty: pricing.rebate.view
      responses:
        "200":
          description: The claim.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VendorClaim"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/rebates/vendor-claims/{id}:approve:
    post:
      operationId: approveVendorRebateClaim
      summary: Approve an OPEN claim for settlement through w19 AP (duty VendorRebateClaimApprove).
      description: >
        Checks the body version (412 conflict_version), requires OPEN (409 PRC-0031) and refuses the
        user who created the claim (403 PRC-0046). Writes vendorrebateclaim.approved.
      x-passage-duty: pricing.rebate.claim.approve
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VendorClaim"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/broker-contracts:
    get:
      operationId: listBrokerContracts
      summary: List broker contracts, latest start first (at most 100).
      x-passage-duty: pricing.rebate.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: brokerVendorId, in: query, required: false, schema: {type: string, format: uuid}}
