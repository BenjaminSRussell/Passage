      summary: Commission inquiry by rep, sales group, period, customer and invoice line (§5.26.14).
      x-passage-duty: pricing.commission.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: salesGroupId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: repId, in: query, required: false, schema: {type: string}}
        - {name: customerId, in: query, required: false, schema: {type: string}}
        - {name: invoiceLineId, in: query, required: false, description: "Matches the line and the credit notes that reverse it.", schema: {type: string}}
        - {name: period, in: query, required: false, description: "Invoice month such as 2027-03.", schema: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}}
      responses:
        "200":
          description: Newest invoice first (at most 100).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommissionTransactionList"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commission/settlement-export:
    get:
      operationId: exportCommissionSettlement
      summary: Commission settlement export per rep and currency for payroll (w43) or AP (w19) (FR-26.18, §5.26.15).
      description: >
        Sums the commission transactions of invoices dated from..to (inclusive, at most 366
        days), credit notes included, per rep and currency, ordered by rep then currency. Only
        rep ids are exported, never names. A rep id a spreadsheet would read as a formula is
        written with a leading apostrophe.
      x-passage-duty: pricing.commission.view
      parameters:
        - {name: legalEntityId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: target, in: query, required: false, description: "commission_settlement_target; NONE has no export.", schema: {type: string, enum: [AP, PAYROLL], default: AP}}
      responses:
        "200":
          description: >
            CSV with the header target,rep_id,currency,amount,transactions,from,to; amount has the
            currency's minor units (300.00 USD). A period without commission has only the header.
          content:
            text/csv:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/funds:
    get:
      operationId: listFunds
      summary: List trade promotion funds (FR-26.19).
      x-passage-duty: pricing.view or pricing.fund.maintain
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Funds by id (at most 100).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Fund"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createFund
      summary: Create an open trade promotion fund with a budget per period (FR-26.19).
      x-passage-duty: pricing.fund.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FundInput"}
      responses:
        "201":
          description: Created at version 1.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fund"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/funds/{id}:
    get:
      operationId: getFund
      summary: Read one trade fund.
      x-passage-duty: pricing.view or pricing.fund.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The fund.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fund"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/funds/{id}:attribute:
    post:
      operationId: attributeFund
      summary: >
        Attribute usage (campaign or rebate accrual, claim, deduction) to the fund in a period
        (BR-26.15). 409 PRC-0011 when the fund is closed; 422 PRC-0012 when usage would exceed the
        period budget and overspend is off. Writes dev.passage.pricing.fundusage.recorded.v1.
      x-passage-duty: pricing.fund.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FundAttribution"}
      responses:
        "201":
          description: Usage recorded; the period position after it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FundPosition"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/funds/{id}:revise:
    post:
      operationId: reviseFund
      summary: >
        Change the budget per period and the overspend flag at the expected version (the PRC-0012
        remedy). Without overspend the budget must cover every period's usage (422 PRC-0012); a closed
        fund is frozen (409 PRC-0011); a stale version is 412 conflict_version.
      x-passage-duty: pricing.fund.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FundRevision"}
      responses:
        "200":
          description: Revised; version incremented.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fund"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/funds/{id}:close:
    post:
      operationId: closeFund
      summary: >
        Close the fund: usage is frozen and new attribution fails with PRC-0011 (BR-26.15). 409
        PRC-0031 when already closed; 412 on a stale version. Writes dev.passage.pricing.fund.closed.v1.
      x-passage-duty: pricing.fund.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Closed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fund"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/funds/{id}:reopen:
    post:
      operationId: reopenFund
      summary: >
        Reopen a closed fund (the PRC-0011 remedy). 409 PRC-0031 when already open; 412 on a stale
        version. Writes dev.passage.pricing.fund.reopened.v1.
      x-passage-duty: pricing.fund.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Reopened.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fund"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/funds/{id}/usage:
    get:
      operationId: fundUsage
      summary: Fund usage inquiry (§5.26.14) - usage per period and source, and budget, used and remaining per period.
      x-passage-duty: pricing.view or pricing.fund.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Usage, oldest period first.
          content:
            application/json:
              schema:
                type: object
                required: [fund, items, periods]
                properties:
                  fund: {$ref: "#/components/schemas/Fund"}
                  items:
                    type: array
                    items:
                      type: object
                      required: [period, source, amount]
                      properties:
                        period: {type: string}
                        source: {type: string, enum: [CAMPAIGN_ACCRUAL, REBATE_ACCRUAL, CLAIM, DEDUCTION]}
                        amount: {type: string}
                  periods:
                    type: array
                    items: {$ref: "#/components/schemas/FundPosition"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/promotions:
    get:
      operationId: listPromotions
      summary: List promotion plans with baseline, forecast and effectiveness (FR-26.20).
      x-passage-duty: pricing.view or pricing.fund.maintain
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Promotion plans by id (at most 100).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Promotion"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createPromotion
      summary: >
        Plan a promotion with a 13-week baseline, forecast lift and planned spend (FR-26.20). A fund,
        when named, must be open (409 PRC-0011) and in the same legal entity and currency (422).
      x-passage-duty: pricing.fund.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PromotionInput"}
      responses:
        "201":
          description: Planned.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Promotion"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/promotions/{id}:
    get:
      operationId: getPromotion
      summary: Read one promotion plan.
      x-passage-duty: pricing.view or pricing.fund.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The promotion plan.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Promotion"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/promotions/{id}:actuals:
    post:
      operationId: recordPromotionActuals
      summary: >
        Record the units and spend posted in the promotion window (overwrites; the nightly actuals
        job writes the same way) and return the effectiveness (FR-26.20).
      x-passage-duty: pricing.fund.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [units, weeks]
              properties:
                units: {type: string, description: "Units invoiced in the window, at least 0."}
                weeks: {type: integer, minimum: 1, maximum: 260}
                spend: {type: string, description: "Spend in the window, at least 0; default 0."}
      responses:
        "200":
          description: The promotion with actuals and effectiveness.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Promotion"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/free-goods-rules:
    get:
      operationId: listFreeGoodsRules
      summary: List free goods rules, latest start first, withdrawn included (FR-26.22).
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: false, description: "Only rules of this legal entity.", schema: {type: string, format: uuid}}
        - {name: productId, in: query, required: false, description: "Only rules for this product.", schema: {type: string}}
      responses:
        "200":
          description: Free goods rules (at most 100).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/FreeGoodsRule"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createFreeGoodsRule
      summary: >
        Create a live free goods rule (FR-26.22, condition type FREE_GOODS): free units for
        every N ordered of one product and unit, inclusive or exclusive, from a minimum quantity.
        409 PRC-0002 when a live rule for the same customer, product and unit overlaps in time.
        Writes dev.passage.pricing.freegoodsrule.created.v1.
      x-passage-duty: pricing.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FreeGoodsRuleInput"}
      responses:
        "201":
          description: Created live at version 1.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeGoodsRule"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/free-goods-rules/{id}:
    get:
      operationId: getFreeGoodsRule
      summary: Read one free goods rule. 404 PRC-0047 when unknown.
      x-passage-duty: pricing.view
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The free goods rule.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeGoodsRule"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/free-goods-rules/{id}:withdraw:
    post:
      operationId: withdrawFreeGoodsRule
      summary: >
        Withdraw a free goods rule: it takes no part in the next resolve. 409 PRC-0031 when
        already withdrawn; 412 on a stale version. Writes dev.passage.pricing.freegoodsrule.withdrawn.v1.
      x-passage-duty: pricing.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Withdrawn; version incremented.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeGoodsRule"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commodity/bases:
    get:
      operationId: listCommodityBases
      summary: List commodity cost basis types ordered by code (FR-26.21).
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: false, description: "Only rows of this legal entity.", schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Cost basis types (at most 100).
          content:
            application/json:
              schema: 
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/CommodityBasis"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createCommodityBasis
      summary: >
        Create a cost basis type, the thing a commodity index is quoted for, in a currency and unit
        (FR-26.21). 409 PRC-0054 when the legal entity already has that code.
        Writes dev.passage.pricing.commoditybasis.created.v1.
      x-passage-duty: pricing.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommodityBasisInput"}
      responses:
        "201":
          description: Created at version 1.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommodityBasis"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commodity/bases/{id}:
    get:
      operationId: getCommodityBasis
      summary: Read one cost basis type. 404 PRC-0050 when unknown.
      x-passage-duty: pricing.view
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The cost basis type.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommodityBasis"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commodity/bases/{id}/index-values:
    get:
      operationId: listCommodityIndexValues
      summary: >
        List the index quotes of a cost basis type, newest day first and highest revision first
        within a day (the Commodity prices inquiry, FR-26.21). 404 PRC-0050 when the basis is unknown.
      x-passage-duty: pricing.view
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Index quotes (at most 100).
          content:
            application/json:
              schema: 
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/CommodityIndexValue"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    post:
      operationId: recordCommodityIndexValue
      summary: >
        Record an index quote for a day (FR-26.21). Quotes are never overwritten: a second quote for
        the same day is the next revision, and a run reads the highest. Writes
        dev.passage.pricing.commodityindex.recorded.v1.
      x-passage-duty: pricing.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommodityIndexValueInput"}
      responses:
        "201":
          description: Recorded; the revision is assigned by the service.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommodityIndexValue"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commodity/calculations:
    get:
      operationId: listCommodityCalculations
      summary: List commodity price calculations ordered by name, withdrawn included (FR-26.21).
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: false, description: "Only rows of this legal entity.", schema: {type: string, format: uuid}}
        - {name: basisId, in: query, required: false, description: "Only calculations of this cost basis type.", schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Calculations (at most 100).
          content:
            application/json:
              schema: 
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/CommodityCalculation"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createCommodityCalculation
      summary: >
        Create a price calculation: price = index x factor rounded half to even to 2 to 6 decimals
        (rounding), plus a percentage or amount margin, rounded half to even to the 6-decimal unit price,
        for the ACTIVE PRICE records on one customer scope, product, unit and currency (quantity break 0,
        no variant, no campaign). The factor converts the basis unit to the price unit; the currency must
        be the basis currency (422 PRC-0055, no cross-currency conversion). 404 PRC-0050 when the basis is
        unknown in the legal entity. Writes dev.passage.pricing.commoditycalculation.created.v1.
      x-passage-duty: pricing.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommodityCalculationInput"}
      responses:
        "201":
          description: Created at version 1.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommodityCalculation"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commodity/calculations/{id}:
    get:
      operationId: getCommodityCalculation
      summary: Read one price calculation. 404 PRC-0051 when unknown.
      x-passage-duty: pricing.view
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The calculation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommodityCalculation"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commodity/calculations/{id}:withdraw:
    post:
      operationId: withdrawCommodityCalculation
      summary: >
        Withdraw a calculation; it takes no further runs. 409 PRC-0031 when already withdrawn; 412 on a
        stale version. Writes dev.passage.pricing.commoditycalculation.withdrawn.v1.
      x-passage-duty: pricing.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Withdrawn; version incremented.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommodityCalculation"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commodity/calculations/{id}:preview:
    post:
      operationId: previewCommodityRun
      summary: >
        Preview a run without writing anything: the index used, the price and the ACTIVE records that
        would change. 422 PRC-0052 when no index value exists on or before asOf, 422 PRC-0053 when the
        price is not above 0 or too large for a unit price; PRC-0016 comes back as a warning when the
        index is older than the calculation allows.
      x-passage-duty: pricing.view
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommodityRunRequest"}
      responses:
        "200":
          description: The planned run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommodityRunPreview"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commodity/calculations/{id}:run:
    post:
      operationId: runCommodityCalculation
      summary: >
        Run a calculation (FR-26.21): reads the latest index on or before asOf, prices the key and, when
        ACTIVE records differ, creates a price journal of UPDATE lines that stays VALIDATED for review
        (OPEN with line errors when a line no longer validates). The journal is posted by the normal
        journal post, which takes pricing.journal.post and refuses the user who ran it (403 PRC-0056).
        The run keeps the index day, revision and value it used. 422 PRC-0052 / PRC-0053 as for the
        preview. A repeated Idempotency-Key replays the first run.
        Writes dev.passage.pricing.commodityrun.completed.v1.
      x-passage-duty: pricing.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommodityRunRequest"}
      responses:
        "201":
          description: The run; journalId is absent when no record changed price.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommodityRun"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commodity/calculations/{id}/runs:
    get:
      operationId: listCommodityRuns
      summary: List the runs of one calculation, newest first. 404 PRC-0051 when unknown.
      x-passage-duty: pricing.view
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Runs (at most 100).
          content:
            application/json:
              schema: 
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/CommodityRun"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/campaigns:
    get:
      operationId: listCampaigns
      summary: List campaigns, latest start first (FR-26.10).
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Campaigns (at most 100).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Campaign"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createCampaign
      summary: >
        Create a live campaign with validity, target customer group, budget and currency
        (FR-26.10). Condition records join it through their campaignId.
      x-passage-duty: pricing.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CampaignInput"}
      responses:
        "201":
          description: Created live at version 1.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Campaign"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/campaigns/{id}:
    get:
      operationId: getCampaign
      summary: Read one campaign. 404 PRC-0041 when unknown.
      x-passage-duty: pricing.view
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The campaign.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Campaign"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/campaigns/{id}:kill:
    post:
      operationId: killCampaign
      summary: >
        Set the kill switch: the campaign's records drop out of the next resolve
        (campaign_kill_switch_effect NEXT_RESOLVE). 409 PRC-0031 when already killed; 412 on a
        stale version. Writes dev.passage.pricing.campaign.killed.v1.
      x-passage-duty: pricing.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Killed; version incremented.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Campaign"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/campaigns/{id}:restore:
    post:
      operationId: restoreCampaign
      summary: >
        Clear the kill switch: the records rejoin the next resolve inside the campaign validity.
        409 PRC-0031 when not killed; 412 on a stale version. Writes dev.passage.pricing.campaign.restored.v1.
      x-passage-duty: pricing.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Restored; version incremented.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Campaign"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/procedures:
    get:
      operationId: listProcedures
      summary: List procedure versions by name, newest version first (FR-26.1).
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Procedure versions (at most 100).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Procedure"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createProcedure
      summary: Save a DRAFT version; its version number is the next one for the legal entity and name (FR-26.1).
      x-passage-duty: pricing.admin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProcedureInput"}
      responses:
        "201":
          description: Created DRAFT version at revision 1.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Procedure"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/procedures/{id}:
    get:
      operationId: getProcedure
      summary: Read one procedure version. 404 PRC-0042 when unknown.
      x-passage-duty: pricing.view
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The procedure version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Procedure"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/procedures/{id}:revise:
    post:
      operationId: reviseProcedure
      summary: >
        Replace the steps of a DRAFT version at the expected revision (the Procedure designer's
        save). 409 PRC-0008 when the version is ACTIVE or SUPERSEDED; 412 on a stale revision.
      x-passage-duty: pricing.admin
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProcedureRevision"}
      responses:
        "200":
          description: Revised; revision incremented.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Procedure"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/procedures/{id}:activate:
    post:
      operationId: activateProcedure
      summary: >
        Activate a DRAFT version and supersede the ACTIVE version of the same legal entity and
        name. 409 PRC-0008 when the version is not DRAFT. Writes dev.passage.pricing.procedure.activated.v1.
      x-passage-duty: pricing.admin
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Activated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Procedure"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Replays the stored response when the same key is sent again with the same request; a different request with a used key is 422 idempotency_key_reuse.
      schema: {type: string, maxLength: 255}
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Campaign:
      allOf:
        - $ref: "#/components/schemas/CampaignInput"
        - type: object
          required: [id, killed, version]
          properties:
            id: {type: string, format: uuid}
            killed: {type: boolean, description: "Kill switch; a killed campaign's records take no part in resolve."}
            version: {type: integer, minimum: 1}
    CampaignInput:
      type: object
      required: [legalEntityId, name, validFrom, validTo, budget, currency]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date, description: "Inclusive; not before validFrom."}
        targetCustomerGroup: {type: string, maxLength: 64, description: "Customer group the campaign is for; empty means every customer. Resolve keeps the campaign's records only for a request with this customerGroupId."}
        budget: {type: string, description: "Planned spend, decimal at least 0, in currency. Recorded; not enforced in resolve."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
    ProcedureStep:
      type: object
      required: [stepNo, conditionType]
      properties:
        stepNo: {type: integer, minimum: 10, maximum: 990, description: "Strictly increasing within a procedure."}
        conditionType: {type: string, enum: [PRICE, LINE_DISC, MULTILINE_DISC, TOTAL_DISC, SURCHARGE, FREIGHT, REBATE_ACCRUAL, ROUNDING, FREE_GOODS], description: "Exactly one PRICE step per procedure; every other condition type at most once."}
        requirementCel: {type: string, maxLength: 512, description: "CEL requirement; stored, not yet evaluated."}
        exclusionGroup: {type: string, maxLength: 64, description: "Exclusion group (FR-26.8); not allowed on the PRICE step."}
        exclusionMode: {type: string, enum: [BEST, FIRST], description: "Required with an exclusion group; the same for every step of one group."}
        statistical: {type: boolean}
        accountKey: {type: string, maxLength: 32}
    ProcedureInput:
      type: object
      required: [legalEntityId, name, steps]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, pattern: "^[A-Z0-9][A-Z0-9_-]*$", maxLength: 64, description: "For example AX_STANDARD or SAP_RVAA01."}
        steps:
          type: array
          minItems: 1
          maxItems: 99
          items: {$ref: "#/components/schemas/ProcedureStep"}
    ProcedureRevision:
      type: object
      required: [revision, steps]
      properties:
        revision: {type: integer, minimum: 1}
        steps:
          type: array
          minItems: 1
          maxItems: 99
          items: {$ref: "#/components/schemas/ProcedureStep"}
    Procedure:
      type: object
      required: [id, legalEntityId, name, version, status, revision, steps]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        name: {type: string}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [DRAFT, ACTIVE, SUPERSEDED]}
        revision: {type: integer, minimum: 1, description: "Optimistic version of a DRAFT's steps."}
        steps:
          type: array
          items: {$ref: "#/components/schemas/ProcedureStep"}
    Fund:
      type: object
      required: [id, legalEntityId, name, type, currency, customerScope, owner, budgetPerPeriod, allowOverspend, closed, version]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        name: {type: string, maxLength: 120}
        type: {type: string, maxLength: 32}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        customerScope: {type: string, maxLength: 64, description: "Customer or customer group the fund serves; empty means all."}
        owner: {type: string, maxLength: 64}
        budgetPerPeriod: {type: string, description: "Decimal budget applied to each period (YYYY-MM)."}
        allowOverspend: {type: boolean}
        closed: {type: boolean, description: "A closed fund rejects attribution with PRC-0011."}
        version: {type: integer, minimum: 1}
    FundInput:
      type: object
      required: [legalEntityId, name, type, currency, owner, budgetPerPeriod]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, maxLength: 120}
        type: {type: string, maxLength: 32}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        customerScope: {type: string, maxLength: 64}
        owner: {type: string, maxLength: 64}
        budgetPerPeriod: {type: string, description: "Decimal, at least 0."}
        allowOverspend: {type: boolean, default: false}
    FundRevision:
      type: object
      required: [version, budgetPerPeriod]
      properties:
        version: {type: integer, minimum: 1}
        budgetPerPeriod: {type: string, description: "Decimal, at least 0."}
        allowOverspend: {type: boolean, default: false}
    FundAttribution:
      type: object
      required: [period, source, reference, amount]
      properties:
        period: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}
        source: {type: string, enum: [CAMPAIGN_ACCRUAL, REBATE_ACCRUAL, CLAIM, DEDUCTION]}
        reference: {type: string, minLength: 1, maxLength: 128, description: "The accrual, claim or deduction the usage came from."}
        amount: {type: string, description: "Decimal greater than zero, in the fund currency."}
    FundPosition:
      type: object
      required: [fundId, period, budget, used, remaining, closed]
      properties:
        fundId: {type: string, format: uuid}
        period: {type: string}
        budget: {type: string}
        used: {type: string}
        remaining: {type: string, description: "Negative only when overspend is allowed."}
        closed: {type: boolean}
    PromotionInput:
      type: object
      required: [legalEntityId, name, productId, currency, startDate, endDate, baselineWeeklyUnits]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, maxLength: 120}
        eventCategory: {type: string, maxLength: 64, description: "Merchandising event category."}
        eventType: {type: string, maxLength: 64, description: "Merchandising event type."}
        customerScope: {type: string, maxLength: 64, description: "Customer or customer group; empty means all."}
        fundId: {type: string, format: uuid}
        productId: {type: string, maxLength: 64}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        baselineWeeklyUnits:
          type: array
          minItems: 13
          maxItems: 13
          items: {type: string}
          description: Units sold in each of the prior 13 weeks, oldest first.
        liftPct: {type: string, description: "Forecast lift in percent, at least -100; default 0."}
        plannedSpend: {type: string, description: "Decimal, at least 0; default 0."}
    Promotion:
      type: object
      required: [id, legalEntityId, name, eventCategory, eventType, customerScope, productId, currency, startDate, endDate, baselineWeeklyUnits, baseline, liftPct, plannedSpend, forecastUnits]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        name: {type: string}
        eventCategory: {type: string}
        eventType: {type: string}
        customerScope: {type: string}
        fundId: {type: string, format: uuid}
        productId: {type: string}
        currency: {type: string}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        baselineWeeklyUnits: {type: array, items: {type: string}}
        baseline: {type: string, description: "Average weekly units over the 13-week history."}
        liftPct: {type: string}
        plannedSpend: {type: string}
        forecastUnits: {type: string, description: "baseline × started weeks in the window × (1 + lift%)."}
        actuals:
          type: object
          required: [units, weeks, spend]
          properties:
            units: {type: string}
            weeks: {type: integer}
            spend: {type: string}
        effectivenessPct: {type: string, description: "(actual weekly average − baseline) / baseline in percent; present once actuals exist and the baseline is above zero."}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, example: "https://passage.dev/problems/PRC-0002"}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string, description: "Stable snake or service code, e.g. PRC-0002 or COM-0001."}
        errors:
          type: object
          additionalProperties: {type: string}
    LineInput:
      type: object
      required: [productId, unit, quantity]
      properties:
        productId: {type: string, description: "Product id (w8); matched exactly against record product keys."}
        productGroupId: {type: string, description: "Product pricing group of the line, if any."}
        variant: {type: string}
        unit: {type: string, description: "Must be a unit known to the pricing condition records (w6 conversion is later)."}
        quantity: {type: string, description: "Decimal string greater than 0."}
    ResolveRequest:
      type: object
      required: [legalEntityId, customerId, currency, pricingDate, lines]
      properties:
        legalEntityId: {type: string, format: uuid}
        customerId: {type: string, description: "Customer id (w7); matched exactly against record customer keys."}
        customerGroupId: {type: string, description: "Customer pricing group of the document, if any."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        pricingDate: {type: string, format: date}
        salesChannel: {type: string, pattern: "^([A-Z0-9][A-Z0-9_-]{0,31})?$", description: "Selects the channel's procedure assignment; empty uses the legal entity's default (PRD 5.26.13)."}
        procedure: {type: string, description: "Name of a procedure to price with; its ACTIVE version is used instead of the assigned one (422 PRC-0063 when it has none)."}
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: "#/components/schemas/LineInput"}
    RecordInput:
      type: object
      description: Condition record as sent for simulation (no legalEntityId required).
      required: [type, customerKind, productKind, currency, validFrom, validTo]
      properties:
        id: {type: string}
        type: {type: string, enum: [PRICE, LINE_DISC, MULTILINE_DISC, TOTAL_DISC, SURCHARGE]}
        customerKind: {type: string, enum: [customer, customer_group, all]}
        customerKey: {type: string}
        productKind:
          type: string
          enum: [product, product_group, variant, all]
          description: "Must be all for TOTAL_DISC and SURCHARGE (order-level conditions); product_group or all for MULTILINE_DISC."
        productKey: {type: string}
        variant: {type: string}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        unit: {type: string}
        fromQuantity: {type: string}
        amount: {type: string}
        discPct1: {type: string, description: "0-100. For SURCHARGE, the percentage of the order net added."}
        discPct2: {type: string, description: "0-100; must be 0 for SURCHARGE."}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date}
        searchNext: {type: boolean}
        exclusive: {type: boolean}
        campaignId: {type: string, format: uuid, description: "Optional campaign (FR-26.2, FR-26.10). On create the campaign must exist in the record's legal entity (404 PRC-0041, 422). In resolve the record applies only while the campaign is live and targets the customer's group; at one access a campaign record outranks a plain one (BR-26.1 step 4)."}
    SimulateRequest:
      allOf:
        - $ref: "#/components/schemas/ResolveRequest"
        - type: object
          properties:
            records:
              type: array
              maxItems: 1000
              description: "Inline condition records, at most 1000 (422 with a records field error beyond that)."
              items: {$ref: "#/components/schemas/RecordInput"}
    CompareRequest:
      allOf:
        - $ref: "#/components/schemas/SimulateRequest"
        - type: object
          required: [procedureIdA, procedureIdB]
          properties:
            procedureIdA: {type: string, format: uuid, description: "The baseline procedure version."}
            procedureIdB: {type: string, format: uuid, description: "The version compared with the baseline; must differ from A and belong to the same legal entity."}
          description: "procedure and salesChannel choose a procedure for resolve and are rejected here (422): the versions are named by procedureIdA and procedureIdB."
    LineComparison:
      type: object
      required: [lineNo, netUnitPriceA, netUnitPriceB, netUnitPriceDelta, lineNetA, lineNetB, lineNetDelta, appliedOnlyA, appliedOnlyB, changed]
      properties:
        lineNo: {type: integer}
        netUnitPriceA: {type: string}
        netUnitPriceB: {type: string}
        netUnitPriceDelta: {type: string, description: "B minus A."}
        lineNetA: {type: string}
        lineNetB: {type: string}
        lineNetDelta: {type: string, description: "B minus A."}
        errorCodeA: {type: string, description: "Set when version A found no price for the line."}
        errorCodeB: {type: string, description: "Set when version B found no price for the line."}
        appliedOnlyA:
          type: array
          description: "Conditions (TYPE:record) that version A applied and B did not."
          items: {type: string}
        appliedOnlyB:
          type: array
          description: "Conditions (TYPE:record) that version B applied and A did not."
          items: {type: string}
        changed: {type: boolean}
    Comparison:
      type: object
      required: [identical, subtotalDelta, totalDiscountDelta, surchargeDelta, orderNetDelta, changedLines, lines]
      properties:
        identical: {type: boolean}
        subtotalDelta: {type: string}
        totalDiscountDelta: {type: string}
        surchargeDelta: {type: string}
        orderNetDelta: {type: string}
        changedLines: {type: integer}
        lines:
          type: array
          items: {$ref: "#/components/schemas/LineComparison"}
    CompareResponse:
      type: object
      required: [a, b, comparison]
      properties:
        a: {$ref: "#/components/schemas/ResolveResponse"}
        b: {$ref: "#/components/schemas/ResolveResponse"}
        comparison: {$ref: "#/components/schemas/Comparison"}
    NetPriceRow:
      type: object
      required: [productKind, productKey, variant, unit, breaks]
      properties:
        productKind: {type: string, enum: [product, product_group, variant, all]}
        productKey: {type: string}
        variant: {type: string}
        unit: {type: string, description: "Empty when the records apply to any unit."}
        breaks:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/NetPriceBreak"}
    NetPriceBreak:
      type: object
      required: [quantity, unitPrice, netUnitPrice, lineNet, applied]
      properties:
        quantity: {type: string, description: "Decimal quantity of the one-line sale."}
        unitPrice: {type: string, description: "PRICE before discounts; zero when errorCode is set."}
        netUnitPrice: {type: string}
        lineNet: {type: string, description: "Quantity times the net unit price, rounded to the currency's minor units."}
        priceRecordId: {type: string, format: uuid, description: "The PRICE record that won this break; absent when errorCode is set."}
        applied:
          type: array
          items: {$ref: "#/components/schemas/Applied"}
        errorCode: {type: string, description: "PRC-0001 when no price applies at this quantity."}
    PriceListItem:
      allOf:
        - $ref: "#/components/schemas/ConditionRecord"
        - type: object
          required: [scope]
          properties:
            scope: {type: string, enum: [CUSTOMER, GROUP, ALL], description: "Why the record applies to the customer."}
    ConditionRecordInput:
      allOf:
        - $ref: "#/components/schemas/RecordInput"
        - type: object
          required: [legalEntityId]
          properties:
            legalEntityId: {type: string, format: uuid}
    ConditionRecord:
      allOf:
        - $ref: "#/components/schemas/ConditionRecordInput"
        - type: object
          required: [id, status, version]
          properties:
            id: {type: string, format: uuid}
            status: {type: string, enum: [DRAFT, ACTIVE, EXPIRED, WITHDRAWN]}
            version: {type: integer, minimum: 1}
    VersionRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, minimum: 1}
        reason: {type: string, description: "Optional, recorded on withdraw."}
    CommodityBasisInput:
      type: object
      required: [legalEntityId, code, name, currency, unit]
      properties:
        legalEntityId: {type: string, format: uuid}
        code: {type: string, pattern: "^[A-Z0-9_-]{1,32}$", description: "Unique in the legal entity, for example CU-LME."}
        name: {type: string, maxLength: 120}
        currency: {type: string, pattern: "^[A-Z]{3}$", description: "Currency the index is quoted in."}
        unit: {type: string, maxLength: 16, description: "Unit the index is quoted per."}
    CommodityBasis:
      allOf:
        - $ref: "#/components/schemas/CommodityBasisInput"
        - type: object
          required: [id, version]
          properties:
            id: {type: string, format: uuid}
            version: {type: integer, minimum: 1}
    CommodityIndexValueInput:
      type: object
      required: [asOf, value]
      properties:
        asOf: {type: string, format: date, description: "The day the quote is for."}
        value: {type: string, description: "Decimal greater than 0 with at most 6 decimals."}
        source: {type: string, maxLength: 120, description: "Where the quote came from."}
    CommodityIndexValue:
      allOf:
        - $ref: "#/components/schemas/CommodityIndexValueInput"
        - type: object
          required: [basisId, revision]
          properties:
            basisId: {type: string, format: uuid}
            revision: {type: integer, minimum: 1, description: "1 for the first quote of a day; a correction is the next revision."}
    CommodityCalculationInput:
      type: object
      required: [legalEntityId, name, basisId, factor, marginKind, customerKind, productId, unit, currency]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, maxLength: 120}
        basisId: {type: string, format: uuid}
        factor: {type: string, description: "Conversion factor from the index to the price unit, decimal greater than 0 with at most 6 decimals."}
        marginKind: {type: string, enum: [PERCENT, AMOUNT]}
        margin: {type: string, description: "Decimal of at least 0 (a percentage is at most 1000); default 0."}
        rounding: {type: integer, minimum: 2, maximum: 6, default: 6, description: "Decimals for index x factor (commodity_index_rounding); the margin is added after this rounding and the price is kept at 6 decimals."}
        maxIndexAgeDays: {type: integer, minimum: 1, maximum: 365, default: 7, description: "A newer index than this many days before the run date is not stale (PRC-0016)."}
        customerKind: {type: string, enum: [customer, customer_group, all]}
        customerKey: {type: string, maxLength: 64, description: "Empty when customerKind is all."}
        productId: {type: string, maxLength: 64}
        unit: {type: string, maxLength: 16}
        currency: {type: string, pattern: "^[A-Z]{3}$", description: "Must be the currency the cost basis is quoted in (PRC-0055)."}
    CommodityCalculation:
      allOf:
        - $ref: "#/components/schemas/CommodityCalculationInput"
        - type: object
          required: [id, rounding, maxIndexAgeDays, withdrawn, version]
          properties:
            id: {type: string, format: uuid}
            withdrawn: {type: boolean}
            version: {type: integer, minimum: 1}
    CommodityRunRequest:
      type: object
      required: [asOf]
      properties:
        asOf: {type: string, format: date, description: "Run date: the latest index on or before it is used, and only records valid on it are repriced."}
    CommodityWarning:
      type: object
      required: [code, detail]
      properties:
        code: {type: string, example: PRC-0016}
        detail: {type: string}
    CommodityRunPreview:
      type: object
      required: [calculationId, asOf, index, price, stale, indexAgeDays, warnings, changes, unchangedCount]
      properties:
        calculationId: {type: string, format: uuid}
        asOf: {type: string, format: date}
        index: {$ref: "#/components/schemas/CommodityIndexValue"}
        price: {type: string, description: "index x factor plus margin, rounded."}
        stale: {type: boolean}
        indexAgeDays: {type: integer}
        warnings:
          type: array
          items: {$ref: "#/components/schemas/CommodityWarning"}
        changes:
          type: array
          items:
            type: object
            required: [recordId, version, currentAmount, newAmount]
            properties:
              recordId: {type: string, format: uuid}
              version: {type: integer, minimum: 1}
              currentAmount: {type: string}
              newAmount: {type: string}
        unchangedCount: {type: integer, minimum: 0, description: "Targeted records already at the price."}
    CommodityRun:
      type: object
      required: [id, legalEntityId, calculationId, asOf, indexAsOf, indexRevision, indexValue, price, changedCount, unchangedCount, stale, runBy, warnings, createdAt]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        calculationId: {type: string, format: uuid}
        asOf: {type: string, format: date}
        indexAsOf: {type: string, format: date}
        indexRevision: {type: integer, minimum: 1}
        indexValue: {type: string}
        price: {type: string}
        changedCount: {type: integer, minimum: 0}
        unchangedCount: {type: integer, minimum: 0}
        stale: {type: boolean}
        journalId: {type: string, format: uuid, description: "The price journal awaiting review; absent when no record changed price."}
        runBy: {type: string, description: "The user who ran it (empty for a service call); that user cannot post the journal (PRC-0056)."}
        warnings:
          type: array
          items: {$ref: "#/components/schemas/CommodityWarning"}
        createdAt: {type: string, format: date-time}
    FreeGoodsRule:
      allOf:
        - $ref: "#/components/schemas/FreeGoodsRuleInput"
        - type: object
          required: [id, withdrawn, version]
          properties:
            id: {type: string, format: uuid}
            withdrawn: {type: boolean, description: "A withdrawn rule takes no part in resolve."}
            version: {type: integer, minimum: 1}
    FreeGoodsRuleInput:
      type: object
      required: [legalEntityId, customerKind, productId, unit, kind, everyQuantity, freeQuantity, validFrom, validTo]
      properties:
        legalEntityId: {type: string, format: uuid}
        customerKind: {type: string, enum: [customer, customer_group, all]}
        customerKey: {type: string, maxLength: 64, description: "Customer or customer group id; empty when customerKind is all."}
        productId: {type: string, maxLength: 64}
        unit: {type: string, maxLength: 16, description: "The rule applies to lines ordered in this unit."}
        kind: {type: string, enum: [INCLUSIVE, EXCLUSIVE], description: "INCLUSIVE gives the free units out of the ordered quantity (1 free within every 10); EXCLUSIVE adds them on top (1 extra per 10)."}
        calcRule: {type: string, enum: [PROPORTIONAL, UNIT_REFERENCE, WHOLE_UNITS], default: WHOLE_UNITS, description: "Defaults to WHOLE_UNITS (free_goods_calc_rule). PROPORTIONAL gives fractional free units (6 decimals); UNIT_REFERENCE rounds the proportional quantity down to whole units; WHOLE_UNITS counts only whole multiples of everyQuantity."}
        everyQuantity: {type: string, description: "Ordered quantity that earns freeQuantity, decimal greater than 0."}
        freeQuantity: {type: string, description: "Free units per everyQuantity, decimal greater than 0 (less than everyQuantity when INCLUSIVE)."}
        minQuantity: {type: string, description: "Smallest ordered quantity that earns free goods; default 0."}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date, description: "Inclusive; not before validFrom."}
    FreeGoodsProposal:
      type: object
      description: >
        A zero-priced supplementary line proposal (FR-26.22) that w27 adds to the order (FR-27.14).
        For INCLUSIVE the free units are part of orderedQuantity and pricedQuantity is what is charged
        (25 ordered, 1 free per 10, WHOLE_UNITS: 23 priced, 2 free); the resolved line then carries
        quantity = pricedQuantity and its net covers those units only, at the quantity break of the
        ordered quantity. For EXCLUSIVE pricedQuantity equals orderedQuantity and the free units are extra.
      required: [lineNo, productId, unit, ruleId, kind, orderedQuantity, pricedQuantity, freeQuantity]
      properties:
        lineNo: {type: integer}
        productId: {type: string}
        unit: {type: string}
        ruleId: {type: string, format: uuid}
        kind: {type: string, enum: [INCLUSIVE, EXCLUSIVE]}
        orderedQuantity: {type: string}
        pricedQuantity: {type: string}
        freeQuantity: {type: string}
        warning: {type: string, enum: [PRC-0014], description: "PRC-0014 when the line is already priced at nothing, so free goods would give the goods twice."}
    ResolveResponse:
      type: object
      required: [currency, lines, subtotal, totalDiscount, surcharge, orderNet, applied, explainRef, freeGoods]
      properties:
        currency: {type: string}
        lines:
          type: array
          items:
            type: object
            required: [lineNo, unit, quantity, unitPrice, netUnitPrice, lineNet, applied]
            properties:
              lineNo: {type: integer}
              unit: {type: string}
              quantity: {type: string, description: "The charged quantity: the ordered quantity less the free units of an INCLUSIVE free goods proposal for this line (BR-26.13)."}
              unitPrice: {type: string}
              netUnitPrice: {type: string}
              lineNet: {type: string}
              exclusive: {type: boolean, description: "An exclusive winner suppressed later discount steps, including the total discount, for this line (BR-26.1 step 8)."}
              applied:
                type: array
                items: {$ref: "#/components/schemas/Applied"}
              errorCode: {type: string, description: "PRC-0001 when no price exists for the line."}
              errorDetail: {type: string}
              trace:
                type: array
                items: {$ref: "#/components/schemas/TraceStep"}
        subtotal: {type: string}
        totalDiscount: {type: string}
        surcharge: {type: string, description: "Small-order surcharge included in orderNet (FR-26.6); 0 when none applied."}
        orderNet: {type: string, description: "subtotal - totalDiscount + surcharge."}
        applied:
          type: array
          items: {$ref: "#/components/schemas/Applied"}
        procedure:
          type: object
          description: "The procedure version the prices came from (FR-26.4); absent under the reference order."
          required: [id, name, version]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
            version: {type: integer, minimum: 1}
        explainRef: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        explainTruncated: {type: boolean}
        freeGoods:
          type: array
          description: "Free goods proposals for priced lines (FR-26.22); empty when no live rule applies. Always empty on simulate."
          items: {$ref: "#/components/schemas/FreeGoodsProposal"}
        trace:
          type: array
          items: {$ref: "#/components/schemas/TraceStep"}
    Applied:
      type: object
      required: [type, recordId, access]
      properties:
        type: {type: string, enum: [PRICE, LINE_DISC, MULTILINE_DISC, TOTAL_DISC, SURCHARGE]}
        recordId: {type: string}
        access: {type: integer, description: "Access sequence number that produced the winner."}
        stepNo: {type: integer, description: "Procedure step that applied the condition; absent under the reference order."}
        accountKey: {type: string, description: "Account key of the procedure step."}
        statistical: {type: boolean, description: "A statistical step: reported with amount, not added to the net."}
        amount: {type: string, description: "Statistical steps only: the change the step would make to the line net (negative for a discount) or to the order net."}
    TraceStep:
      type: object
      required: [condition, accesses]
      properties:
        condition: {type: string}
        selected: {type: string}
        stepNo: {type: integer, description: "Procedure step of the condition; absent under the reference order."}
        reason: {type: string, description: "Why a condition that found a record did not apply: an exclusion group (FR-26.8) kept another member."}
        accesses:
          type: array
          items:
            type: object
            required: [seq, access, evaluated, candidates, reason]
            properties:
              seq: {type: integer}
              access: {type: string, example: "customer x product"}
              evaluated: {type: boolean}
              candidates: {type: array, items: {type: string}}
              winner: {type: string}
              reason: {type: string}
    JournalLineInput:
      type: object
      required: [op]
      description: "CREATE takes record; UPDATE takes recordId, expectedVersion and either record or adjustPct; DELETE takes recordId and expectedVersion. RESTORE is internal to reversal."
      properties:
        op: {type: string, enum: [CREATE, UPDATE, DELETE]}
        recordId: {type: string, format: uuid}
        expectedVersion: {type: integer, minimum: 0}
        adjustPct: {type: string, description: "Percentage change applied to the stored amount; greater than -100."}
        record: {$ref: "#/components/schemas/ConditionRecordInput"}
    JournalRequest:
      type: object
      required: [legalEntityId, name, lines]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        smartRound: {type: boolean, description: "Apply smart rounding bands to adjusted amounts (FR-26.7)."}
        lines:
          type: array
          minItems: 1
          maxItems: 100000
          items: {$ref: "#/components/schemas/JournalLineInput"}
    JournalLineError:
      type: object
      required: [lineNo, code, detail]
      properties:
        lineNo: {type: integer}
        code: {type: string}
        detail: {type: string}
    ProcedureAssignment:
      type: object
      required: [legalEntityId, salesChannel, procedureName, version]
      properties:
        legalEntityId: {type: string, format: uuid}
        salesChannel: {type: string, description: "Empty for the legal entity's default."}
        procedureName: {type: string, description: "The ACTIVE version of this procedure is used at resolve time."}
        version: {type: integer, minimum: 1}
        updatedBy: {type: string}
        updatedAt: {type: string, format: date-time}
    PricingParameters:
      type: object
      required: [legalEntityId, journalFourEyes, version]
      properties:
        legalEntityId: {type: string, format: uuid}
        journalFourEyes: {type: boolean}
        version: {type: integer, minimum: 0, description: "0 when the legal entity has no stored parameters."}
        updatedBy: {type: string}
        updatedAt: {type: string, format: date-time}
    Journal:
      type: object
      required: [id, legalEntityId, name, status, smartRound, lineCount, errorCount, createdAt, errors]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, enum: [OPEN, VALIDATED, POSTED, REVERSED]}
        smartRound: {type: boolean}
        lineCount: {type: integer}
        errorCount: {type: integer}
        reversesJournalId: {type: string, format: uuid}
        reversedByJournalId: {type: string, format: uuid}
        postedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        createdBy: {type: string, description: "The user who created the journal (maker); the runner for a commodity run's journal, the reverser for a reversal; absent when not recorded."}
        postedBy: {type: string, description: "The user who posted the journal (checker); absent until posted."}
        errors:
          type: array
          items: {$ref: "#/components/schemas/JournalLineError"}
        lines:
          type: array
          description: Set on GET /journals/{id} only.
          items: {$ref: "#/components/schemas/JournalLine"}
        linesTruncated: {type: boolean}
    JournalLine:
      type: object
      required: [lineNo, op, recordId, expectedVersion, adjustPct, errors]
      properties:
        lineNo: {type: integer}
        op: {type: string, enum: [CREATE, UPDATE, DELETE, RESTORE]}
        recordId: {type: string, format: uuid}
        expectedVersion: {type: integer}
        adjustPct: {type: string}
        before: {$ref: "#/components/schemas/ConditionRecord"}
        after: {$ref: "#/components/schemas/ConditionRecord"}
        errors:
          type: array
          items: {$ref: "#/components/schemas/JournalLineError"}
    Tier:
      type: object
      required: [from]
      properties:
        from: {type: string, description: "Threshold: cumulative basis value or quantity."}
        ratePct: {type: string, description: "NET_AMOUNT tiers: percent of net value."}
        amountPerUnit: {type: string, description: "QUANTITY tiers: amount per unit."}
    RebateAgreementInput:
      type: object
      required: [legalEntityId, name, basis, period, tiers, currency, validFrom, validTo]
      description: >
        A CUSTOMER agreement (default) takes exactly one of customerId or customerGroupId; a VENDOR
        agreement (FR-26.15) takes vendorId and neither customer field. Accounts default to 2150 / 4150
        (customer) or 2160 / 5100 (vendor).
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        partyRole: {type: string, enum: [CUSTOMER, VENDOR], default: CUSTOMER}
        customerId: {type: string, format: uuid}
        customerGroupId: {type: string, format: uuid}
        vendorId: {type: string, format: uuid}
        basis: {type: string, enum: [NET_AMOUNT, QUANTITY]}
        period: {type: string, enum: [MONTH, QUARTER, YEAR]}
        tiers:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Tier"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date}
        accrualAccount: {type: string, description: "Balance-sheet side: 2150 rebate accrual (customer) or 2160 vendor rebate receivable (vendor) by default."}
        expenseAccount: {type: string, description: "P&L side: 4150 rebate expense (customer) or 5100 purchase rebate income (vendor) by default."}
    RebateAgreement:
      allOf:
        - $ref: "#/components/schemas/RebateAgreementInput"
        - type: object
          required: [id, partyRole, accrualAccount, expenseAccount, status, version]
          properties:
            id: {type: string, format: uuid}
            status: {type: string, enum: [ACTIVE, CLOSED]}
            version: {type: integer, minimum: 1, description: "Optimistic lock: 1 on create, incremented by every revise and close."}
    RebateAgreementRevision:
      type: object
      required: [version]
      description: Send at least one of name, validTo or tiers.
      properties:
        version: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 120}
        validTo: {type: string, format: date}
        tiers:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Tier"}
    RebateAgreementClose:
      type: object
      required: [version, closeDate]
      properties:
        version: {type: integer, minimum: 1}
        closeDate: {type: string, format: date, description: "Last day on which invoices accrue."}
    RebateAccrualInput:
      type: object
      required: [agreementId, invoiceLineId, invoiceDate, value, quantity, currency]
      properties:
        agreementId: {type: string, format: uuid}
        invoiceLineId: {type: string, minLength: 1, maxLength: 128}
        invoiceDate: {type: string, format: date}
        value: {type: string, description: "Invoice line net value."}
        quantity: {type: string}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
    RebateAccrual:
      type: object
      required: [id, agreementId, periodId, invoiceLineId, invoiceDate, basisValue, basisQuantity, amount, currency, status]
      properties:
        id: {type: string, format: uuid}
        agreementId: {type: string, format: uuid}
        periodId: {type: string}
        invoiceLineId: {type: string}
        invoiceDate: {type: string, format: date}
        basisValue: {type: string}
        basisQuantity: {type: string}
        amount: {type: string, description: "Accrued amount; posts Dr 4150 / Cr 2150 (customer) or Dr 2160 / Cr 5100 (vendor) by default."}
        currency: {type: string}
        status: {type: string, enum: [ACCRUED, ADJUSTED, SETTLED, REVERSED]}
        retroactive: {type: boolean, description: "True for an invoice line replayed by a retroactive recompute (amount 0) and for its per-period delta (invoiceLineId retro:<run key>:<period>)."}
    VendorClaimInput:
      type: object
      required: [agreementId, period]
      properties:
        agreementId: {type: string, format: uuid}
        period: {type: string, pattern: "^[0-9]{4}(-(0[1-9]|1[0-2])|-Q[1-4])?$"}
        settlementMode: {type: string, enum: [CREDIT_NOTE, PAYMENT_DEDUCTION], default: CREDIT_NOTE, description: "vendor_rebate_claim_mode; a negative claim settles by VENDOR_INVOICE."}
    VendorClaimPreview:
      type: object
      required: [agreementId, vendorId, periodId, accrued, priorClaimed, amount, currency, settlementMode, claims]
      properties:
        agreementId: {type: string, format: uuid}
        vendorId: {type: string, format: uuid}
        periodId: {type: string}
        accrued: {type: string, description: "The period's accruals."}
        priorClaimed: {type: string, description: "What the period's claims already claimed."}
        amount: {type: string, description: "accrued - priorClaimed; 0 when fully claimed."}
        currency: {type: string}
        settlementMode: {type: string, enum: [CREDIT_NOTE, VENDOR_INVOICE]}
        claims: {type: integer, description: "Claims already created for the period."}
    VendorClaim:
      type: object
      required: [id, number, legalEntityId, agreementId, vendorId, periodId, accruedTotal, priorClaimed, amount, currency, settlementMode, status, version, createdAt]
      properties:
        id: {type: string, format: uuid}
        number: {type: string, pattern: "^RC-[0-9]{6,}$"}
        legalEntityId: {type: string, format: uuid}
        agreementId: {type: string, format: uuid}
        vendorId: {type: string, format: uuid}
        periodId: {type: string}
        accruedTotal: {type: string}
        priorClaimed: {type: string}
        amount: {type: string, description: "Negative for an over-accrued period."}
        currency: {type: string}
        settlementMode: {type: string, enum: [CREDIT_NOTE, PAYMENT_DEDUCTION, VENDOR_INVOICE]}
        status: {type: string, enum: [OPEN, APPROVED]}
        version: {type: integer, minimum: 1}
        createdBy: {type: string}
        approvedBy: {type: string}
        createdAt: {type: string, format: date-time}
        approvedAt: {type: string, format: date-time}
    BrokerContractInput:
      type: object
      required: [legalEntityId, name, brokerVendorId, rateKind, rate, currency, validFrom, validTo]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        brokerVendorId: {type: string, format: uuid}
        customerId: {type: string, format: uuid, description: "At most one of customerId and customerGroupId; neither means all customers."}
        customerGroupId: {type: string, format: uuid}
        productId: {type: string, maxLength: 64, description: "At most one of productId and productGroupId; neither means all products."}
        productGroupId: {type: string, maxLength: 64}
        rateKind: {type: string, enum: [PERCENT_NET, PER_UNIT]}
        rate: {type: string, description: "Decimal above 0: a percentage of net (at most 100), or an amount per unit in currency."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date, description: "Inclusive; not before validFrom."}
        payableAccount: {type: string, pattern: "^[0-9]{4,8}$", description: "Default 2175."}
        expenseAccount: {type: string, pattern: "^[0-9]{4,8}$", description: "Default 6210."}
    BrokerContract:
      allOf:
        - $ref: "#/components/schemas/BrokerContractInput"
        - type: object
          required: [id, payableAccount, expenseAccount, status, version]
          properties:
            id: {type: string, format: uuid}
            status: {type: string, enum: [ACTIVE, CLOSED]}
            version: {type: integer, minimum: 1}
    RoyaltyAgreementInput:
      type: object
      required: [legalEntityId, name, licensorVendorId, basis, period, tiers, currency, validFrom, validTo]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        licensorVendorId: {type: string, format: uuid}
        productId: {type: string, maxLength: 64, description: "Exactly one of productId and productGroupId."}
        productGroupId: {type: string, maxLength: 64}
        basis: {type: string, enum: [NET_SALES, QUANTITY]}
        period: {type: string, enum: [MONTH, QUARTER, YEAR]}
        tiers:
          type: array
          minItems: 1
          description: "Strictly increasing thresholds; NET_SALES tiers take ratePct, QUANTITY tiers amountPerUnit."
          items: {$ref: "#/components/schemas/Tier"}
        minimumRoyalty: {type: string, description: "Decimal at least 0 with no more decimals than the currency's minor unit: the least a period pays; default 0."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date, description: "Inclusive; not before validFrom."}
        payableAccount: {type: string, pattern: "^[0-9]{4,8}$", description: "Default 2176."}
        expenseAccount: {type: string, pattern: "^[0-9]{4,8}$", description: "Default 6220."}
    RoyaltyAgreement:
      allOf:
        - $ref: "#/components/schemas/RoyaltyAgreementInput"
        - type: object
          required: [id, minimumRoyalty, payableAccount, expenseAccount, status, version]
          properties:
            id: {type: string, format: uuid}
            status: {type: string, enum: [ACTIVE, CLOSED]}
            version: {type: integer, minimum: 1}
    ContractAccrualInput:
      type: object
      required: [invoiceLineId, invoiceDate, currency]
      properties:
        invoiceLineId: {type: string, minLength: 1, maxLength: 128}
        invoiceDate: {type: string, format: date}
        customerId: {type: string, format: uuid}
        customerGroupId: {type: string, format: uuid}
        productId: {type: string, maxLength: 64}
        productGroupId: {type: string, maxLength: 64}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        netAmount: {type: string, description: "Line net value, decimal at least 0; default 0. Positive on a credit note line too."}
        quantity: {type: string, description: "Decimal at least 0; default 0."}
        reversesInvoiceLineId: {type: string, maxLength: 128, description: "Set on a credit note line: the invoice line it reverses."}
    ContractAccrual:
      type: object
      required: [id, contractKind, contractId, periodId, lineKey, kind, invoiceDate, basisValue, basisQuantity, amount, currency]
      properties:
        id: {type: string, format: uuid}
        contractKind: {type: string, enum: [BROKER, ROYALTY]}
        contractId: {type: string, format: uuid}
        periodId: {type: string, description: "2027-03, 2027-Q1 or 2027."}
        lineKey: {type: string, description: "The invoice line id, or MIN:period for a minimum royalty shortfall."}
        kind: {type: string, enum: [ACCRUAL, CREDIT, SHORTFALL]}
        invoiceDate: {type: string, format: date}
        basisValue: {type: string, description: "Negative on a credit."}
        basisQuantity: {type: string, description: "Negative on a credit."}
        amount: {type: string, description: "Decimal; negative on a credit."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        reversesLineKey: {type: string}
    RoyaltyPeriodCloseInput:
      type: object
      required: [period]
      properties:
        period: {type: string, pattern: "^[0-9]{4}(-(0[1-9]|1[0-2])|-Q[1-4])?$", description: "A period of the agreement granularity inside its validity."}
    RoyaltyPeriodClose:
      type: object
      required: [agreementId, periodId, accrued, minimumRoyalty, shortfall, currency, alreadyClosed]
      properties:
        agreementId: {type: string, format: uuid}
        periodId: {type: string}
        accrued: {type: string, description: "The period royalty before the shortfall."}
        minimumRoyalty: {type: string}
        shortfall: {type: string, description: "Minimum less accrued, never negative."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        alreadyClosed: {type: boolean}
        notice: {type: string, description: "PRC-0017 when a shortfall posted."}
        accrual: {$ref: "#/components/schemas/ContractAccrual"}
    ContractClaimInput:
      type: object
      required: [contractKind, contractId, period]
      properties:
        contractKind: {type: string, enum: [BROKER, ROYALTY]}
        contractId: {type: string, format: uuid}
        period: {type: string, pattern: "^[0-9]{4}(-(0[1-9]|1[0-2])|-Q[1-4])?$"}
    ContractClaim:
      type: object
      required: [id, number, legalEntityId, contractKind, contractId, vendorId, periodId, accruedTotal, priorClaimed, amount, currency, status, version, createdAt]
      properties:
        id: {type: string, format: uuid}
        number: {type: string, pattern: "^(BC|RY)-[0-9]{6,}$"}
        legalEntityId: {type: string, format: uuid}
        contractKind: {type: string, enum: [BROKER, ROYALTY]}
        contractId: {type: string, format: uuid}
        vendorId: {type: string, format: uuid}
        periodId: {type: string}
        accruedTotal: {type: string, description: "The period accruals and shortfall when the claim was created."}
        priorClaimed: {type: string}
        amount: {type: string, description: "Negative for an over-accrued period."}
        currency: {type: string}
        status: {type: string, enum: [OPEN, APPROVED]}
        version: {type: integer, minimum: 1}
        createdBy: {type: string}
        approvedBy: {type: string}
        createdAt: {type: string, format: date-time}
        approvedAt: {type: string, format: date-time}
    ContractClaimPreview:
      type: object
      required: [contractKind, contractId, vendorId, periodId, accrued, shortfall, priorClaimed, amount, currency, claims, closed]
      properties:
        contractKind: {type: string, enum: [BROKER, ROYALTY]}
        contractId: {type: string, format: uuid}
        vendorId: {type: string, format: uuid}
        periodId: {type: string}
        accrued: {type: string}
        shortfall: {type: string}
        priorClaimed: {type: string}
        amount: {type: string, description: "accrued + shortfall - priorClaimed."}
        currency: {type: string}
        claims: {type: integer, minimum: 0}
        closed: {type: boolean, description: "A royalty period can be claimed only when closed."}
    RetroLine:
      type: object
      required: [invoiceLineId, invoiceDate, currency]
      properties:
        invoiceLineId: {type: string, minLength: 1, maxLength: 128}
        invoiceDate: {type: string, format: date, description: "Between the agreement's validFrom and its activation day."}
        value: {type: string, description: "Invoice line net value; default 0."}
        quantity: {type: string, description: "Default 0."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
    RetroRecomputeRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          maxItems: 5000
          description: The invoice lines posted in the agreement's scope before its activation.
          items: {$ref: "#/components/schemas/RetroLine"}
    RetroDelta:
      type: object
      required: [periodId, target, posted, delta]
      properties:
        periodId: {type: string}
        target: {type: string, description: "Accrual the period owes at its cumulative basis."}
        posted: {type: string, description: "Accrual the period had before the recompute."}
        delta: {type: string, description: "target - posted; posts Dr expense / Cr accrual (negative reverses)."}
    RetroRecomputeResult:
      type: object
      required: [agreementId, activatedOn, reaccruedLines, replayed, deltas]
      properties:
        agreementId: {type: string, format: uuid}
        activatedOn: {type: string, format: date}
        reaccruedLines: {type: integer, description: "Replayed invoice lines that were not accrued before."}
        replayed: {type: boolean, description: "True when the Idempotency-Key was used before and the stored deltas are returned."}
        deltas:
          type: array
          items: {$ref: "#/components/schemas/RetroDelta"}
        notice:
          type: object
          description: PRC-0006 when posted invoices were re-accrued.
          required: [code, message]
          properties:
            code: {type: string, example: PRC-0006}
            message: {type: string}
    RepShare:
      type: object
      required: [repId, sharePct]
      properties:
        repId: {type: string, minLength: 1, maxLength: 64, description: "Worker id (w42)."}
        sharePct: {type: string, description: "Decimal above 0 and at most 100; the shares of a group sum to 100."}
    SalesGroupInput:
      type: object
      required: [legalEntityId, name, reps]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        reps:
          type: array
          minItems: 1
          maxItems: 20
          description: In order; the first rep takes the rounding residual.
          items: {$ref: "#/components/schemas/RepShare"}
    SalesGroup:
      allOf:
        - $ref: "#/components/schemas/SalesGroupInput"
        - type: object
          required: [id]
          properties:
            id: {type: string, format: uuid}
    CommissionRuleInput:
      type: object
      required: [salesGroupId, basis, ratePct]
      properties:
        salesGroupId: {type: string, format: uuid}
        customerGroup: {type: string, maxLength: 64, description: "Customer commission group; empty means all customers."}
        itemGroup: {type: string, maxLength: 64, description: "Item commission group; empty means all items."}
        basis: {type: string, enum: [REVENUE, MARGIN]}
        ratePct: {type: string, description: "Decimal from 0 to 100."}
    CommissionRule:
      allOf:
        - $ref: "#/components/schemas/CommissionRuleInput"
        - type: object
          required: [id, legalEntityId]
          properties:
            id: {type: string, format: uuid}
            legalEntityId: {type: string, format: uuid}
    CommissionPostingInput:
      type: object
      required: [legalEntityId, salesGroupId, invoiceLineId, invoiceDate, currency, lineNet]
      properties:
        legalEntityId: {type: string, format: uuid, description: "Must be the sales group's legal entity."}
        salesGroupId: {type: string, format: uuid, description: "From the order header (w27); a credit note names the original line's group."}
        invoiceLineId: {type: string, minLength: 1, maxLength: 128}
        reversesInvoiceLineId: {type: string, maxLength: 128, description: "Set on a credit note line; lineNet is then negative."}
        invoiceDate: {type: string, format: date}
        customerId: {type: string, maxLength: 128}
        customerGroup: {type: string, maxLength: 64, description: "Customer commission group."}
        itemGroup: {type: string, maxLength: 64, description: "Item commission group."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        lineNet: {type: string, description: "Invoice line net; zero or more on an invoice, negative on a credit note."}
        costSnapshot: {type: string, description: "Line cost (w20) with the sign of lineNet; required when the rule pays on MARGIN."}
    CommissionTransaction:
      type: object
      required: [id, legalEntityId, invoiceLineId, invoiceDate, periodId, customerGroup, itemGroup, salesGroupId, repId, sharePct, basis, lineNet, basisAmount, ratePct, amount, currency, debitAccount, creditAccount, status]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        invoiceLineId: {type: string}
        reversesInvoiceLineId: {type: string}
        invoiceDate: {type: string, format: date}
        periodId: {type: string, description: "Invoice month, such as 2027-03."}
        customerId: {type: string}
        customerGroup: {type: string}
        itemGroup: {type: string}
        salesGroupId: {type: string, format: uuid}
        repId: {type: string}
        sharePct: {type: string}
        basis: {type: string, enum: [REVENUE, MARGIN]}
        lineNet: {type: string}
        costSnapshot: {type: string}
        basisAmount: {type: string}
        ratePct: {type: string}
        amount: {type: string, description: "The rep's share; negative on a credit note."}
        currency: {type: string}
        debitAccount: {type: string, example: "6200"}
        creditAccount: {type: string, example: "2170"}
        status: {type: string, enum: [POSTED]}
    CommissionTransactionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CommissionTransaction"}
