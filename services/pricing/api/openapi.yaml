      operationId: createPromotion
      summary: >
        Plan a promotion with a 13-week baseline, forecast lift and planned spend (FR-26.20). A fund,
        when named, must be open (409 PRC-0011) and in the same legal entity and currency (422).
      x-passage-duty: pricing.fund.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PromotionInput"}
      responses:
        "201":
          description: Planned.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Promotion"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/promotions/{id}:
    get:
      operationId: getPromotion
      summary: Read one promotion plan.
      x-passage-duty: pricing.view or pricing.fund.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The promotion plan.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Promotion"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/promotions/{id}:actuals:
    post:
      operationId: recordPromotionActuals
      summary: >
        Record the units and spend posted in the promotion window (overwrites; the nightly actuals
        job writes the same way) and return the effectiveness (FR-26.20).
      x-passage-duty: pricing.fund.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [units, weeks]
              properties:
                units: {type: string, description: "Units invoiced in the window, at least 0."}
                weeks: {type: integer, minimum: 1, maximum: 260}
                spend: {type: string, description: "Spend in the window, at least 0; default 0."}
      responses:
        "200":
          description: The promotion with actuals and effectiveness.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Promotion"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/free-goods-rules:
    get:
      operationId: listFreeGoodsRules
      summary: List free goods rules, latest start first, withdrawn included (FR-26.22).
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: false, description: "Only rules of this legal entity.", schema: {type: string, format: uuid}}
        - {name: productId, in: query, required: false, description: "Only rules for this product.", schema: {type: string}}
      responses:
        "200":
          description: Free goods rules (at most 100).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/FreeGoodsRule"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createFreeGoodsRule
      summary: >
        Create a live free goods rule (FR-26.22, condition type FREE_GOODS): free units for
        every N ordered of one product and unit, inclusive or exclusive, from a minimum quantity.
        409 PRC-0002 when a live rule for the same customer, product and unit overlaps in time.
        Writes dev.passage.pricing.freegoodsrule.created.v1.
      x-passage-duty: pricing.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FreeGoodsRuleInput"}
      responses:
        "201":
          description: Created live at version 1.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeGoodsRule"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/free-goods-rules/{id}:
    get:
      operationId: getFreeGoodsRule
      summary: Read one free goods rule. 404 PRC-0047 when unknown.
      x-passage-duty: pricing.view
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The free goods rule.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeGoodsRule"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/free-goods-rules/{id}:withdraw:
    post:
      operationId: withdrawFreeGoodsRule
      summary: >
        Withdraw a free goods rule: it takes no part in the next resolve. 409 PRC-0031 when
        already withdrawn; 412 on a stale version. Writes dev.passage.pricing.freegoodsrule.withdrawn.v1.
      x-passage-duty: pricing.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Withdrawn; version incremented.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreeGoodsRule"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/campaigns:
    get:
      operationId: listCampaigns
      summary: List campaigns, latest start first (FR-26.10).
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Campaigns (at most 100).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Campaign"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createCampaign
      summary: >
        Create a live campaign with validity, target customer group, budget and currency
        (FR-26.10). Condition records join it through their campaignId.
      x-passage-duty: pricing.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CampaignInput"}
      responses:
        "201":
          description: Created live at version 1.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Campaign"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/campaigns/{id}:
    get:
      operationId: getCampaign
      summary: Read one campaign. 404 PRC-0041 when unknown.
      x-passage-duty: pricing.view
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The campaign.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Campaign"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/campaigns/{id}:kill:
    post:
      operationId: killCampaign
      summary: >
        Set the kill switch: the campaign's records drop out of the next resolve
        (campaign_kill_switch_effect NEXT_RESOLVE). 409 PRC-0031 when already killed; 412 on a
        stale version. Writes dev.passage.pricing.campaign.killed.v1.
      x-passage-duty: pricing.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Killed; version incremented.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Campaign"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/campaigns/{id}:restore:
    post:
      operationId: restoreCampaign
      summary: >
        Clear the kill switch: the records rejoin the next resolve inside the campaign validity.
        409 PRC-0031 when not killed; 412 on a stale version. Writes dev.passage.pricing.campaign.restored.v1.
      x-passage-duty: pricing.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Restored; version incremented.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Campaign"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/procedures:
    get:
      operationId: listProcedures
      summary: List procedure versions by name, newest version first (FR-26.1).
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Procedure versions (at most 100).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Procedure"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createProcedure
      summary: Save a DRAFT version; its version number is the next one for the legal entity and name (FR-26.1).
      x-passage-duty: pricing.admin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProcedureInput"}
      responses:
        "201":
          description: Created DRAFT version at revision 1.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Procedure"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/procedures/{id}:
    get:
      operationId: getProcedure
      summary: Read one procedure version. 404 PRC-0042 when unknown.
      x-passage-duty: pricing.view
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The procedure version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Procedure"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/procedures/{id}:revise:
    post:
      operationId: reviseProcedure
      summary: >
        Replace the steps of a DRAFT version at the expected revision (the Procedure designer's
        save). 409 PRC-0008 when the version is ACTIVE or SUPERSEDED; 412 on a stale revision.
      x-passage-duty: pricing.admin
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProcedureRevision"}
      responses:
        "200":
          description: Revised; revision incremented.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Procedure"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/procedures/{id}:activate:
    post:
      operationId: activateProcedure
      summary: >
        Activate a DRAFT version and supersede the ACTIVE version of the same legal entity and
        name. 409 PRC-0008 when the version is not DRAFT. Writes dev.passage.pricing.procedure.activated.v1.
      x-passage-duty: pricing.admin
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Activated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Procedure"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Replays the stored response when the same key is sent again with the same request; a different request with a used key is 422 idempotency_key_reuse.
      schema: {type: string, maxLength: 255}
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Campaign:
      allOf:
        - $ref: "#/components/schemas/CampaignInput"
        - type: object
          required: [id, killed, version]
          properties:
            id: {type: string, format: uuid}
            killed: {type: boolean, description: "Kill switch; a killed campaign's records take no part in resolve."}
            version: {type: integer, minimum: 1}
    CampaignInput:
      type: object
      required: [legalEntityId, name, validFrom, validTo, budget, currency]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date, description: "Inclusive; not before validFrom."}
        targetCustomerGroup: {type: string, maxLength: 64, description: "Customer group the campaign is for; empty means every customer. Resolve keeps the campaign's records only for a request with this customerGroupId."}
        budget: {type: string, description: "Planned spend, decimal at least 0, in currency. Recorded; not enforced in resolve."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
    ProcedureStep:
      type: object
      required: [stepNo, conditionType]
      properties:
        stepNo: {type: integer, minimum: 10, maximum: 990, description: "Strictly increasing within a procedure."}
        conditionType: {type: string, enum: [PRICE, LINE_DISC, MULTILINE_DISC, TOTAL_DISC, SURCHARGE, FREIGHT, REBATE_ACCRUAL, ROUNDING, FREE_GOODS], description: "Exactly one PRICE step per procedure."}
        requirementCel: {type: string, maxLength: 512, description: "CEL requirement; stored, not yet evaluated."}
        exclusionGroup: {type: string, maxLength: 64, description: "Exclusion group (FR-26.8); not allowed on the PRICE step."}
        exclusionMode: {type: string, enum: [BEST, FIRST], description: "Required with an exclusion group; the same for every step of one group."}
        statistical: {type: boolean}
        accountKey: {type: string, maxLength: 32}
    ProcedureInput:
      type: object
      required: [legalEntityId, name, steps]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, pattern: "^[A-Z0-9][A-Z0-9_-]*$", maxLength: 64, description: "For example AX_STANDARD or SAP_RVAA01."}
        steps:
          type: array
          minItems: 1
          maxItems: 99
          items: {$ref: "#/components/schemas/ProcedureStep"}
    ProcedureRevision:
      type: object
      required: [revision, steps]
      properties:
        revision: {type: integer, minimum: 1}
        steps:
          type: array
          minItems: 1
          maxItems: 99
          items: {$ref: "#/components/schemas/ProcedureStep"}
    Procedure:
      type: object
      required: [id, legalEntityId, name, version, status, revision, steps]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        name: {type: string}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [DRAFT, ACTIVE, SUPERSEDED]}
        revision: {type: integer, minimum: 1, description: "Optimistic version of a DRAFT's steps."}
        steps:
          type: array
          items: {$ref: "#/components/schemas/ProcedureStep"}
    Fund:
      type: object
      required: [id, legalEntityId, name, type, currency, customerScope, owner, budgetPerPeriod, allowOverspend, closed, version]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        name: {type: string, maxLength: 120}
        type: {type: string, maxLength: 32}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        customerScope: {type: string, maxLength: 64, description: "Customer or customer group the fund serves; empty means all."}
        owner: {type: string, maxLength: 64}
        budgetPerPeriod: {type: string, description: "Decimal budget applied to each period (YYYY-MM)."}
        allowOverspend: {type: boolean}
        closed: {type: boolean, description: "A closed fund rejects attribution with PRC-0011."}
        version: {type: integer, minimum: 1}
    FundInput:
      type: object
      required: [legalEntityId, name, type, currency, owner, budgetPerPeriod]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, maxLength: 120}
        type: {type: string, maxLength: 32}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        customerScope: {type: string, maxLength: 64}
        owner: {type: string, maxLength: 64}
        budgetPerPeriod: {type: string, description: "Decimal, at least 0."}
        allowOverspend: {type: boolean, default: false}
    FundRevision:
      type: object
      required: [version, budgetPerPeriod]
      properties:
        version: {type: integer, minimum: 1}
        budgetPerPeriod: {type: string, description: "Decimal, at least 0."}
        allowOverspend: {type: boolean, default: false}
    FundAttribution:
      type: object
      required: [period, source, reference, amount]
      properties:
        period: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}
        source: {type: string, enum: [CAMPAIGN_ACCRUAL, REBATE_ACCRUAL, CLAIM, DEDUCTION]}
        reference: {type: string, minLength: 1, maxLength: 128, description: "The accrual, claim or deduction the usage came from."}
        amount: {type: string, description: "Decimal greater than zero, in the fund currency."}
    FundPosition:
      type: object
      required: [fundId, period, budget, used, remaining, closed]
      properties:
        fundId: {type: string, format: uuid}
        period: {type: string}
        budget: {type: string}
        used: {type: string}
        remaining: {type: string, description: "Negative only when overspend is allowed."}
        closed: {type: boolean}
    PromotionInput:
      type: object
      required: [legalEntityId, name, productId, currency, startDate, endDate, baselineWeeklyUnits]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, maxLength: 120}
        eventCategory: {type: string, maxLength: 64, description: "Merchandising event category."}
        eventType: {type: string, maxLength: 64, description: "Merchandising event type."}
        customerScope: {type: string, maxLength: 64, description: "Customer or customer group; empty means all."}
        fundId: {type: string, format: uuid}
        productId: {type: string, maxLength: 64}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        baselineWeeklyUnits:
          type: array
          minItems: 13
          maxItems: 13
          items: {type: string}
          description: Units sold in each of the prior 13 weeks, oldest first.
        liftPct: {type: string, description: "Forecast lift in percent, at least -100; default 0."}
        plannedSpend: {type: string, description: "Decimal, at least 0; default 0."}
    Promotion:
      type: object
      required: [id, legalEntityId, name, eventCategory, eventType, customerScope, productId, currency, startDate, endDate, baselineWeeklyUnits, baseline, liftPct, plannedSpend, forecastUnits]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        name: {type: string}
        eventCategory: {type: string}
        eventType: {type: string}
        customerScope: {type: string}
        fundId: {type: string, format: uuid}
        productId: {type: string}
        currency: {type: string}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        baselineWeeklyUnits: {type: array, items: {type: string}}
        baseline: {type: string, description: "Average weekly units over the 13-week history."}
        liftPct: {type: string}
        plannedSpend: {type: string}
        forecastUnits: {type: string, description: "baseline × started weeks in the window × (1 + lift%)."}
        actuals:
          type: object
          required: [units, weeks, spend]
          properties:
            units: {type: string}
            weeks: {type: integer}
            spend: {type: string}
        effectivenessPct: {type: string, description: "(actual weekly average − baseline) / baseline in percent; present once actuals exist and the baseline is above zero."}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, example: "https://passage.dev/problems/PRC-0002"}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string, description: "Stable snake or service code, e.g. PRC-0002 or COM-0001."}
        errors:
          type: object
          additionalProperties: {type: string}
    LineInput:
      type: object
      required: [productId, unit, quantity]
      properties:
        productId: {type: string, description: "Product id (w8); matched exactly against record product keys."}
        productGroupId: {type: string, description: "Product pricing group of the line, if any."}
        variant: {type: string}
        unit: {type: string, description: "Must be a unit known to the pricing condition records (w6 conversion is later)."}
        quantity: {type: string, description: "Decimal string greater than 0."}
    ResolveRequest:
      type: object
      required: [legalEntityId, customerId, currency, pricingDate, lines]
      properties:
        legalEntityId: {type: string, format: uuid}
        customerId: {type: string, description: "Customer id (w7); matched exactly against record customer keys."}
        customerGroupId: {type: string, description: "Customer pricing group of the document, if any."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        pricingDate: {type: string, format: date}
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: "#/components/schemas/LineInput"}
    RecordInput:
      type: object
      description: Condition record as sent for simulation (no legalEntityId required).
      required: [type, customerKind, productKind, currency, validFrom, validTo]
      properties:
        id: {type: string}
        type: {type: string, enum: [PRICE, LINE_DISC, MULTILINE_DISC, TOTAL_DISC, SURCHARGE]}
        customerKind: {type: string, enum: [customer, customer_group, all]}
        customerKey: {type: string}
        productKind:
          type: string
          enum: [product, product_group, variant, all]
          description: "Must be all for TOTAL_DISC and SURCHARGE (order-level conditions); product_group or all for MULTILINE_DISC."
        productKey: {type: string}
        variant: {type: string}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        unit: {type: string}
        fromQuantity: {type: string}
        amount: {type: string}
        discPct1: {type: string, description: "0-100. For SURCHARGE, the percentage of the order net added."}
        discPct2: {type: string, description: "0-100; must be 0 for SURCHARGE."}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date}
        searchNext: {type: boolean}
        exclusive: {type: boolean}
        campaignId: {type: string, format: uuid, description: "Optional campaign (FR-26.2, FR-26.10). On create the campaign must exist in the record's legal entity (404 PRC-0041, 422). In resolve the record applies only while the campaign is live and targets the customer's group; at one access a campaign record outranks a plain one (BR-26.1 step 4)."}
    SimulateRequest:
      allOf:
        - $ref: "#/components/schemas/ResolveRequest"
        - type: object
          properties:
            records:
              type: array
              items: {$ref: "#/components/schemas/RecordInput"}
    ConditionRecordInput:
      allOf:
        - $ref: "#/components/schemas/RecordInput"
        - type: object
          required: [legalEntityId]
          properties:
            legalEntityId: {type: string, format: uuid}
    ConditionRecord:
      allOf:
        - $ref: "#/components/schemas/ConditionRecordInput"
        - type: object
          required: [id, status, version]
          properties:
            id: {type: string, format: uuid}
            status: {type: string, enum: [DRAFT, ACTIVE, EXPIRED, WITHDRAWN]}
            version: {type: integer, minimum: 1}
    VersionRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, minimum: 1}
        reason: {type: string, description: "Optional, recorded on withdraw."}
    FreeGoodsRule:
      allOf:
        - $ref: "#/components/schemas/FreeGoodsRuleInput"
        - type: object
          required: [id, withdrawn, version]
          properties:
            id: {type: string, format: uuid}
            withdrawn: {type: boolean, description: "A withdrawn rule takes no part in resolve."}
            version: {type: integer, minimum: 1}
    FreeGoodsRuleInput:
      type: object
      required: [legalEntityId, customerKind, productId, unit, kind, everyQuantity, freeQuantity, validFrom, validTo]
      properties:
        legalEntityId: {type: string, format: uuid}
        customerKind: {type: string, enum: [customer, customer_group, all]}
        customerKey: {type: string, maxLength: 64, description: "Customer or customer group id; empty when customerKind is all."}
        productId: {type: string, maxLength: 64}
        unit: {type: string, maxLength: 16, description: "The rule applies to lines ordered in this unit."}
        kind: {type: string, enum: [INCLUSIVE, EXCLUSIVE], description: "INCLUSIVE gives the free units out of the ordered quantity (1 free within every 10); EXCLUSIVE adds them on top (1 extra per 10)."}
        calcRule: {type: string, enum: [PROPORTIONAL, UNIT_REFERENCE, WHOLE_UNITS], default: WHOLE_UNITS, description: "Defaults to WHOLE_UNITS (free_goods_calc_rule). PROPORTIONAL gives fractional free units (6 decimals); UNIT_REFERENCE rounds the proportional quantity down to whole units; WHOLE_UNITS counts only whole multiples of everyQuantity."}
        everyQuantity: {type: string, description: "Ordered quantity that earns freeQuantity, decimal greater than 0."}
        freeQuantity: {type: string, description: "Free units per everyQuantity, decimal greater than 0 (less than everyQuantity when INCLUSIVE)."}
        minQuantity: {type: string, description: "Smallest ordered quantity that earns free goods; default 0."}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date, description: "Inclusive; not before validFrom."}
    FreeGoodsProposal:
      type: object
      description: >
        A zero-priced supplementary line proposal (FR-26.22) that w27 adds to the order (FR-27.14).
        For INCLUSIVE the free units are part of orderedQuantity and pricedQuantity is what is charged
        (25 ordered, 1 free per 10, WHOLE_UNITS: 23 priced, 2 free); the resolved line then carries
        quantity = pricedQuantity and its net covers those units only, at the quantity break of the
        ordered quantity. For EXCLUSIVE pricedQuantity equals orderedQuantity and the free units are extra.
      required: [lineNo, productId, unit, ruleId, kind, orderedQuantity, pricedQuantity, freeQuantity]
      properties:
        lineNo: {type: integer}
        productId: {type: string}
        unit: {type: string}
        ruleId: {type: string, format: uuid}
        kind: {type: string, enum: [INCLUSIVE, EXCLUSIVE]}
        orderedQuantity: {type: string}
        pricedQuantity: {type: string}
        freeQuantity: {type: string}
        warning: {type: string, enum: [PRC-0014], description: "PRC-0014 when the line is already priced at nothing, so free goods would give the goods twice."}
    ResolveResponse:
      type: object
      required: [currency, lines, subtotal, totalDiscount, surcharge, orderNet, applied, explainRef, freeGoods]
      properties:
        currency: {type: string}
        lines:
          type: array
          items:
            type: object
            required: [lineNo, unit, quantity, unitPrice, netUnitPrice, lineNet, applied]
            properties:
              lineNo: {type: integer}
              unit: {type: string}
              quantity: {type: string, description: "The charged quantity: the ordered quantity less the free units of an INCLUSIVE free goods proposal for this line (BR-26.13)."}
              unitPrice: {type: string}
              netUnitPrice: {type: string}
              lineNet: {type: string}
              exclusive: {type: boolean, description: "An exclusive winner suppressed later discount steps, including the total discount, for this line (BR-26.1 step 8)."}
              applied:
                type: array
                items: {$ref: "#/components/schemas/Applied"}
              errorCode: {type: string, description: "PRC-0001 when no price exists for the line."}
              errorDetail: {type: string}
              trace:
                type: array
                items: {$ref: "#/components/schemas/TraceStep"}
        subtotal: {type: string}
        totalDiscount: {type: string}
        surcharge: {type: string, description: "Small-order surcharge included in orderNet (FR-26.6); 0 when none applied."}
        orderNet: {type: string, description: "subtotal - totalDiscount + surcharge."}
        applied:
          type: array
          items: {$ref: "#/components/schemas/Applied"}
        explainRef: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        explainTruncated: {type: boolean}
        freeGoods:
          type: array
          description: "Free goods proposals for priced lines (FR-26.22); empty when no live rule applies. Always empty on simulate."
          items: {$ref: "#/components/schemas/FreeGoodsProposal"}
        trace:
          type: array
          items: {$ref: "#/components/schemas/TraceStep"}
    Applied:
      type: object
      required: [type, recordId, access]
      properties:
        type: {type: string, enum: [PRICE, LINE_DISC, MULTILINE_DISC, TOTAL_DISC, SURCHARGE]}
        recordId: {type: string}
        access: {type: integer, description: "Access sequence number that produced the winner."}
    TraceStep:
      type: object
      required: [condition, accesses]
      properties:
        condition: {type: string}
        selected: {type: string}
        accesses:
          type: array
          items:
            type: object
            required: [seq, access, evaluated, candidates, reason]
            properties:
              seq: {type: integer}
              access: {type: string, example: "customer x product"}
              evaluated: {type: boolean}
              candidates: {type: array, items: {type: string}}
              winner: {type: string}
              reason: {type: string}
    JournalLineInput:
      type: object
      required: [op]
      description: "CREATE takes record; UPDATE takes recordId, expectedVersion and either record or adjustPct; DELETE takes recordId and expectedVersion. RESTORE is internal to reversal."
      properties:
        op: {type: string, enum: [CREATE, UPDATE, DELETE]}
        recordId: {type: string, format: uuid}
        expectedVersion: {type: integer, minimum: 0}
        adjustPct: {type: string, description: "Percentage change applied to the stored amount; greater than -100."}
        record: {$ref: "#/components/schemas/ConditionRecordInput"}
    JournalRequest:
      type: object
      required: [legalEntityId, name, lines]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        smartRound: {type: boolean, description: "Apply smart rounding bands to adjusted amounts (FR-26.7)."}
        lines:
          type: array
          minItems: 1
          maxItems: 100000
          items: {$ref: "#/components/schemas/JournalLineInput"}
    JournalLineError:
      type: object
      required: [lineNo, code, detail]
      properties:
        lineNo: {type: integer}
        code: {type: string}
        detail: {type: string}
    Journal:
      type: object
      required: [id, legalEntityId, name, status, smartRound, lineCount, errorCount, createdAt, errors]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, enum: [OPEN, VALIDATED, POSTED, REVERSED]}
        smartRound: {type: boolean}
        lineCount: {type: integer}
        errorCount: {type: integer}
        reversesJournalId: {type: string, format: uuid}
        reversedByJournalId: {type: string, format: uuid}
        postedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        errors:
          type: array
          items: {$ref: "#/components/schemas/JournalLineError"}
        lines:
          type: array
          description: Set on GET /journals/{id} only.
          items: {$ref: "#/components/schemas/JournalLine"}
        linesTruncated: {type: boolean}
    JournalLine:
      type: object
      required: [lineNo, op, recordId, expectedVersion, adjustPct, errors]
      properties:
        lineNo: {type: integer}
        op: {type: string, enum: [CREATE, UPDATE, DELETE, RESTORE]}
        recordId: {type: string, format: uuid}
        expectedVersion: {type: integer}
        adjustPct: {type: string}
        before: {$ref: "#/components/schemas/ConditionRecord"}
        after: {$ref: "#/components/schemas/ConditionRecord"}
        errors:
          type: array
          items: {$ref: "#/components/schemas/JournalLineError"}
    Tier:
      type: object
      required: [from]
      properties:
        from: {type: string, description: "Threshold: cumulative basis value or quantity."}
        ratePct: {type: string, description: "NET_AMOUNT tiers: percent of net value."}
        amountPerUnit: {type: string, description: "QUANTITY tiers: amount per unit."}
    RebateAgreementInput:
      type: object
      required: [legalEntityId, name, basis, period, tiers, currency, validFrom, validTo]
      description: >
        A CUSTOMER agreement (default) takes exactly one of customerId or customerGroupId; a VENDOR
        agreement (FR-26.15) takes vendorId and neither customer field. Accounts default to 2150 / 4150
        (customer) or 2160 / 5100 (vendor).
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        partyRole: {type: string, enum: [CUSTOMER, VENDOR], default: CUSTOMER}
        customerId: {type: string, format: uuid}
        customerGroupId: {type: string, format: uuid}
        vendorId: {type: string, format: uuid}
        basis: {type: string, enum: [NET_AMOUNT, QUANTITY]}
        period: {type: string, enum: [MONTH, QUARTER, YEAR]}
        tiers:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Tier"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date}
        accrualAccount: {type: string, description: "Balance-sheet side: 2150 rebate accrual (customer) or 2160 vendor rebate receivable (vendor) by default."}
        expenseAccount: {type: string, description: "P&L side: 4150 rebate expense (customer) or 5100 purchase rebate income (vendor) by default."}
    RebateAgreement:
      allOf:
        - $ref: "#/components/schemas/RebateAgreementInput"
        - type: object
          required: [id, partyRole, accrualAccount, expenseAccount, status]
          properties:
            id: {type: string, format: uuid}
            status: {type: string, enum: [ACTIVE]}
    RebateAccrualInput:
      type: object
      required: [agreementId, invoiceLineId, invoiceDate, value, quantity, currency]
      properties:
        agreementId: {type: string, format: uuid}
        invoiceLineId: {type: string, minLength: 1, maxLength: 128}
        invoiceDate: {type: string, format: date}
        value: {type: string, description: "Invoice line net value."}
        quantity: {type: string}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
    RebateAccrual:
      type: object
      required: [id, agreementId, periodId, invoiceLineId, invoiceDate, basisValue, basisQuantity, amount, currency, status]
      properties:
        id: {type: string, format: uuid}
        agreementId: {type: string, format: uuid}
        periodId: {type: string}
        invoiceLineId: {type: string}
        invoiceDate: {type: string, format: date}
        basisValue: {type: string}
        basisQuantity: {type: string}
        amount: {type: string, description: "Accrued amount; posts Dr 4150 / Cr 2150 (customer) or Dr 2160 / Cr 5100 (vendor) by default."}
        currency: {type: string}
        status: {type: string, enum: [ACCRUED, ADJUSTED, SETTLED, REVERSED]}
        retroactive: {type: boolean, description: "True for an invoice line replayed by a retroactive recompute (amount 0) and for its per-period delta (invoiceLineId retro:<run key>:<period>)."}
    VendorClaimInput:
      type: object
      required: [agreementId, period]
      properties:
        agreementId: {type: string, format: uuid}
        period: {type: string, pattern: "^[0-9]{4}(-(0[1-9]|1[0-2])|-Q[1-4])?$"}
        settlementMode: {type: string, enum: [CREDIT_NOTE, PAYMENT_DEDUCTION], default: CREDIT_NOTE, description: "vendor_rebate_claim_mode; a negative claim settles by VENDOR_INVOICE."}
    VendorClaimPreview:
      type: object
      required: [agreementId, vendorId, periodId, accrued, priorClaimed, amount, currency, settlementMode, claims]
      properties:
        agreementId: {type: string, format: uuid}
        vendorId: {type: string, format: uuid}
        periodId: {type: string}
        accrued: {type: string, description: "The period's accruals."}
        priorClaimed: {type: string, description: "What the period's claims already claimed."}
        amount: {type: string, description: "accrued - priorClaimed; 0 when fully claimed."}
        currency: {type: string}
        settlementMode: {type: string, enum: [CREDIT_NOTE, VENDOR_INVOICE]}
        claims: {type: integer, description: "Claims already created for the period."}
    VendorClaim:
      type: object
      required: [id, number, legalEntityId, agreementId, vendorId, periodId, accruedTotal, priorClaimed, amount, currency, settlementMode, status, version, createdAt]
      properties:
        id: {type: string, format: uuid}
        number: {type: string, pattern: "^RC-[0-9]{6,}$"}
        legalEntityId: {type: string, format: uuid}
        agreementId: {type: string, format: uuid}
        vendorId: {type: string, format: uuid}
        periodId: {type: string}
        accruedTotal: {type: string}
        priorClaimed: {type: string}
        amount: {type: string, description: "Negative for an over-accrued period."}
        currency: {type: string}
        settlementMode: {type: string, enum: [CREDIT_NOTE, PAYMENT_DEDUCTION, VENDOR_INVOICE]}
        status: {type: string, enum: [OPEN, APPROVED]}
        version: {type: integer, minimum: 1}
        createdBy: {type: string}
        approvedBy: {type: string}
        createdAt: {type: string, format: date-time}
        approvedAt: {type: string, format: date-time}
    RetroLine:
      type: object
      required: [invoiceLineId, invoiceDate, currency]
      properties:
        invoiceLineId: {type: string, minLength: 1, maxLength: 128}
        invoiceDate: {type: string, format: date, description: "Between the agreement's validFrom and its activation day."}
        value: {type: string, description: "Invoice line net value; default 0."}
        quantity: {type: string, description: "Default 0."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
    RetroRecomputeRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          maxItems: 5000
          description: The invoice lines posted in the agreement's scope before its activation.
          items: {$ref: "#/components/schemas/RetroLine"}
    RetroDelta:
      type: object
      required: [periodId, target, posted, delta]
      properties:
        periodId: {type: string}
        target: {type: string, description: "Accrual the period owes at its cumulative basis."}
        posted: {type: string, description: "Accrual the period had before the recompute."}
        delta: {type: string, description: "target - posted; posts Dr expense / Cr accrual (negative reverses)."}
    RetroRecomputeResult:
      type: object
      required: [agreementId, activatedOn, reaccruedLines, replayed, deltas]
      properties:
        agreementId: {type: string, format: uuid}
        activatedOn: {type: string, format: date}
        reaccruedLines: {type: integer, description: "Replayed invoice lines that were not accrued before."}
        replayed: {type: boolean, description: "True when the Idempotency-Key was used before and the stored deltas are returned."}
        deltas:
          type: array
          items: {$ref: "#/components/schemas/RetroDelta"}
        notice:
          type: object
          description: PRC-0006 when posted invoices were re-accrued.
          required: [code, message]
          properties:
            code: {type: string, example: PRC-0006}
            message: {type: string}
    RepShare:
      type: object
      required: [repId, sharePct]
      properties:
        repId: {type: string, minLength: 1, maxLength: 64, description: "Worker id (w42)."}
        sharePct: {type: string, description: "Decimal above 0 and at most 100; the shares of a group sum to 100."}
    SalesGroupInput:
      type: object
      required: [legalEntityId, name, reps]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        reps:
          type: array
          minItems: 1
          maxItems: 20
          description: In order; the first rep takes the rounding residual.
          items: {$ref: "#/components/schemas/RepShare"}
    SalesGroup:
      allOf:
        - $ref: "#/components/schemas/SalesGroupInput"
        - type: object
          required: [id]
          properties:
            id: {type: string, format: uuid}
    CommissionRuleInput:
      type: object
      required: [salesGroupId, basis, ratePct]
      properties:
        salesGroupId: {type: string, format: uuid}
        customerGroup: {type: string, maxLength: 64, description: "Customer commission group; empty means all customers."}
        itemGroup: {type: string, maxLength: 64, description: "Item commission group; empty means all items."}
        basis: {type: string, enum: [REVENUE, MARGIN]}
        ratePct: {type: string, description: "Decimal from 0 to 100."}
    CommissionRule:
      allOf:
        - $ref: "#/components/schemas/CommissionRuleInput"
        - type: object
          required: [id, legalEntityId]
          properties:
            id: {type: string, format: uuid}
            legalEntityId: {type: string, format: uuid}
    CommissionPostingInput:
      type: object
      required: [legalEntityId, salesGroupId, invoiceLineId, invoiceDate, currency, lineNet]
      properties:
        legalEntityId: {type: string, format: uuid, description: "Must be the sales group's legal entity."}
        salesGroupId: {type: string, format: uuid, description: "From the order header (w27); a credit note names the original line's group."}
        invoiceLineId: {type: string, minLength: 1, maxLength: 128}
        reversesInvoiceLineId: {type: string, maxLength: 128, description: "Set on a credit note line; lineNet is then negative."}
        invoiceDate: {type: string, format: date}
        customerId: {type: string, maxLength: 128}
        customerGroup: {type: string, maxLength: 64, description: "Customer commission group."}
        itemGroup: {type: string, maxLength: 64, description: "Item commission group."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        lineNet: {type: string, description: "Invoice line net; zero or more on an invoice, negative on a credit note."}
        costSnapshot: {type: string, description: "Line cost (w20) with the sign of lineNet; required when the rule pays on MARGIN."}
    CommissionTransaction:
      type: object
      required: [id, legalEntityId, invoiceLineId, invoiceDate, periodId, customerGroup, itemGroup, salesGroupId, repId, sharePct, basis, lineNet, basisAmount, ratePct, amount, currency, debitAccount, creditAccount, status]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        invoiceLineId: {type: string}
        reversesInvoiceLineId: {type: string}
        invoiceDate: {type: string, format: date}
        periodId: {type: string, description: "Invoice month, such as 2027-03."}
        customerId: {type: string}
        customerGroup: {type: string}
        itemGroup: {type: string}
        salesGroupId: {type: string, format: uuid}
        repId: {type: string}
        sharePct: {type: string}
        basis: {type: string, enum: [REVENUE, MARGIN]}
        lineNet: {type: string}
        costSnapshot: {type: string}
        basisAmount: {type: string}
        ratePct: {type: string}
        amount: {type: string, description: "The rep's share; negative on a credit note."}
        currency: {type: string}
        debitAccount: {type: string, example: "6200"}
        creditAccount: {type: string, example: "2170"}
        status: {type: string, enum: [POSTED]}
    CommissionTransactionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CommissionTransaction"}
