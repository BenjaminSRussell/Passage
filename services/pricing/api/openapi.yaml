              schema: {$ref: "#/components/schemas/CommissionRule"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commission/postings:
    post:
      operationId: postCommission
      summary: Post the commission of one posted invoice line or credit note line (FR-26.18, BR-26.12).
      description: >
        Stand-in for the invoice.posted consumer (w29/w30). Resolves the sales group's rule specific to
        general (PRC-0013 when none matches), applies REVENUE (line net) or MARGIN (line net less
        costSnapshot, which is then required) basis, splits by rep share (half-even per rep, residual to
        the first rep) and writes one transaction per rep, Dr 6200 / Cr 2170, each with a
        dev.passage.pricing.commission.calculated.v1 event in the same transaction. A credit note line
        (negative lineNet, reversesInvoiceLineId set) reverses with the original line's basis, rate and
        shares; credits of one line may not exceed its invoiced net (PRC-0037). The invoice line id is the
        idempotency key: 201 when posted, 200 when the same line was already posted with the same content,
        422 idempotency_key_reuse when it was posted with different content.
      x-passage-duty: pricing.commission.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommissionPostingInput"}
      responses:
        "200":
          description: Already posted (redelivery); the stored transactions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommissionTransactionList"}
        "201":
          description: Posted; one transaction per rep.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommissionTransactionList"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commission/transactions:
    get:
      operationId: listCommissionTransactions
      summary: Commission inquiry by rep, sales group, period, customer and invoice line (§5.26.14).
      x-passage-duty: pricing.commission.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: salesGroupId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: repId, in: query, required: false, schema: {type: string}}
        - {name: customerId, in: query, required: false, schema: {type: string}}
        - {name: invoiceLineId, in: query, required: false, description: "Matches the line and the credit notes that reverse it.", schema: {type: string}}
        - {name: period, in: query, required: false, description: "Invoice month such as 2027-03.", schema: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}}
      responses:
        "200":
          description: Newest invoice first (at most 100).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommissionTransactionList"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commission/settlement-export:
    get:
      operationId: exportCommissionSettlement
      summary: Commission settlement export per rep and currency for payroll (w43) or AP (w19) (FR-26.18, §5.26.15).
      description: >
        Sums the commission transactions of invoices dated from..to (inclusive, at most 366
        days), credit notes included, per rep and currency, ordered by rep then currency. Only
        rep ids are exported, never names. A rep id a spreadsheet would read as a formula is
        written with a leading apostrophe.
      x-passage-duty: pricing.commission.view
      parameters:
        - {name: legalEntityId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: target, in: query, required: false, description: "commission_settlement_target; NONE has no export.", schema: {type: string, enum: [AP, PAYROLL], default: AP}}
      responses:
        "200":
          description: >
            CSV with the header target,rep_id,currency,amount,transactions,from,to; amount has the
            currency's minor units (300.00 USD). A period without commission has only the header.
          content:
            text/csv:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
