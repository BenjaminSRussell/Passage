openapi: 3.1.0
info:
  title: Passage Pricing API
  version: 0.1.0
  description: >
    Slices 1-2 of wave 26 (PSG-26). Deterministic price resolution with explain, simulation,
    condition-record lifecycle, atomic price journals with reversal, and customer rebate
    agreements with accrual. The browser reaches these paths as /api/v1/pricing/...;
    the BFF rewrites them to /v1/pricing/... on this service.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/pricing/resolve:
    post:
      operationId: resolvePrice
      summary: Resolve net prices and discounts for a document header and up to 500 lines.
      description: >
        Stateless with respect to the request. Loads ACTIVE condition records of the legal
        entity valid on pricingDate for the currency, then applies the reference procedure
        (PRICE, LINE_DISC, MULTILINE_DISC, TOTAL_DISC, SURCHARGE). MULTILINE_DISC matches on the
        summed quantity of the lines sharing a product group and unit (BR-26.4). SURCHARGE applies
        when the subtotal is below the small-order threshold (250 USD, 200 EUR; none for other
        currencies) and is reported in surcharge as well as added to orderNet. A line without a price carries errorCode PRC-0001 and
        is left out of the totals; the request itself still answers 200. The explain trace is returned only when ?explain=true; traces above
        PRICING_EXPLAIN_MAX_BYTES are replaced by explainTruncated=true. explainRef is the
        sha256 content address of the trace body.
      parameters:
        - name: explain
          in: query
          required: false
          schema: {type: string, enum: ["true", "false"]}
      x-passage-duty: pricing.view
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResolveRequest"}
      responses:
        "200":
          description: Priced document.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResolveResponse"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "500": {$ref: "#/components/responses/Problem"}
  /v1/pricing/simulate:
    post:
      operationId: simulatePrice
      summary: Price a tuple against inline condition records without storing anything.
      description: Explains by default; pass ?explain=false to omit the trace.
      parameters:
        - name: explain
          in: query
          required: false
          schema: {type: string, enum: ["true", "false"]}
      x-passage-duty: pricing.view
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SimulateRequest"}
      responses:
        "200":
          description: Priced document with trace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResolveResponse"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/condition-records:
    get:
      operationId: listConditionRecords
      summary: List condition records.
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [DRAFT, ACTIVE, EXPIRED, WITHDRAWN]}}
        - {name: type, in: query, required: false, schema: {type: string, enum: [PRICE, LINE_DISC, MULTILINE_DISC, TOTAL_DISC, SURCHARGE]}}
        - {name: customer, in: query, required: false, description: "Exact customer or customer-group key.", schema: {type: string}}
        - {name: product, in: query, required: false, description: "Exact product or product-group key.", schema: {type: string}}
        - {name: asOf, in: query, required: false, description: "Records valid on this date (YYYY-MM-DD).", schema: {type: string, format: date}}
        - {name: limit, in: query, required: false, description: "Page size, ordered by id.", schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        "200":
          description: Matching records.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ConditionRecord"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createConditionRecord
      summary: Create a condition record in DRAFT.
      description: Overlap is checked at activation, not at creation (BR-26.6).
      x-passage-duty: pricing.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConditionRecordInput"}
      responses:
        "201":
          description: Created as DRAFT.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConditionRecord"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/condition-records/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getConditionRecord
      summary: Read one condition record.
      x-passage-duty: pricing.view
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConditionRecord"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/condition-records/{id}:activate:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: activateConditionRecord
      summary: Activate a DRAFT record after the overlap check.
      description: >
        Locks the key hash, rejects an overlapping ACTIVE record with 409 PRC-0002 naming
        its id, and writes dev.passage.pricing.conditionrecord.activated.v1 to the outbox in the
        same transaction. The version in the body must match the stored version (412
        conflict_version otherwise). A retry with the same Idempotency-Key replays the first response.
      x-passage-duty: pricing.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Activated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConditionRecord"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/condition-records/{id}:withdraw:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: withdrawConditionRecord
      summary: Withdraw an ACTIVE record.
      description: >
        Writes dev.passage.pricing.conditionrecord.withdrawn.v1 in the same transaction. The
        version in the body must match the stored version (412 conflict_version otherwise).
        A retry with the same Idempotency-Key replays the first response.
      x-passage-duty: pricing.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionRequest"}
      responses:
        "200":
          description: Withdrawn.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConditionRecord"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/journals:
    get:
      operationId: listPriceJournals
      summary: Price journal log (PRD 5.26.14), newest first, without lines.
      x-passage-duty: pricing.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [OPEN, VALIDATED, POSTED, REVERSED]}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        "200":
          description: Journal headers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Journal"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createPriceJournal
      summary: Create an OPEN price journal of up to 100,000 mass create, update or delete lines.
      description: >
        Each line is checked when the journal is created. Field errors are keyed lines[i].field.
        Nothing is written to condition records until :post (FR-26.9).
      x-passage-duty: pricing.journal.post
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JournalRequest"}
      responses:
        "201":
          description: Created as OPEN.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Journal"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/journals/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getPriceJournal
      summary: Read a price journal with its lines (op, before and after snapshots) and per-line errors.
      description: At most 1,000 lines are returned (linesTruncated=true when there are more); errors are always complete.
      x-passage-duty: pricing.view
      responses:
        "200":
          description: The journal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Journal"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/journals/{id}:validate:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: validatePriceJournal
      summary: Validate every line of an OPEN journal against the stored record versions.
      x-passage-duty: pricing.journal.post
      responses:
        "200":
          description: Validated, or still OPEN with errors listed per line.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Journal"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/pricing/journals/{id}:post:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: postPriceJournal
      summary: Post a VALIDATED journal in one transaction.
      description: >
        Requires status VALIDATED (409 otherwise). Validates again under the legal entity's
        journal lock and refuses with 422 PRC-0005 naming the failing lines if anything changed
        since validation; nothing is written then. Otherwise writes every line in one transaction
        with dev.passage.pricing.conditionrecord.activated.v1 (or .withdrawn.v1) per record plus
        dev.passage.pricing.journal.posted.v1 to the outbox (FR-26.9). A retry with the same
        Idempotency-Key replays the first response.
      x-passage-duty: pricing.journal.post
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Posted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Journal"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/journals/{id}:reverse:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: reversePriceJournal
      summary: Reverse a POSTED journal into a new journal that references the original.
      description: >
        Restores the content every line replaced, in one transaction (AC4, AC-26.7); records created
        by the journal are withdrawn. A record changed since the post fails the reversal with 422
        PRC-0005 and nothing is written. A retry with the same Idempotency-Key replays the first response.
      x-passage-duty: pricing.journal.post
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: The new reversing journal (POSTED).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Journal"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/rebates/agreements:
    get:
      operationId: listRebateAgreements
      summary: List customer rebate agreements.
      x-passage-duty: pricing.rebate.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Agreements, oldest validity first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/RebateAgreement"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createRebateAgreement
      summary: Create a customer rebate agreement with tiers (FR-26.11).
      x-passage-duty: pricing.rebate.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RebateAgreementInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RebateAgreement"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/rebates/agreements/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getRebateAgreement
      summary: Read one rebate agreement with its tiers.
      x-passage-duty: pricing.rebate.view
      responses:
        "200":
          description: The agreement.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RebateAgreement"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/rebates/accruals:
    get:
      operationId: listRebateAccruals
      summary: List accruals by agreement and period.
      x-passage-duty: pricing.rebate.view
      parameters:
        - {name: agreementId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: period, in: query, required: false, description: "Period key such as 2027-03, 2027-Q1 or 2027.", schema: {type: string, pattern: "^[0-9]{4}(-(0[1-9]|1[0-2])|-Q[1-4])?$"}}
      responses:
        "200":
          description: Accrual rows.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/RebateAccrual"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: accrueRebateInvoiceLine
      summary: Accrue one posted invoice line against an agreement (invoice.posted consumer).
      description: >
        Stand-in for the invoice.posted consumer (w30). Locks the (agreement, period) row, moves the
        period to its target at the new cumulative basis and accrues the difference on this line, so a
        tier crossing recomputes the whole period (BR-26.8). 201 when a new accrual posted, 200 when the
        invoice line was already accrued with the same date, value and quantity, 422
        idempotency_key_reuse when it was accrued with different ones.
      x-passage-duty: pricing.rebate.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RebateAccrualInput"}
      responses:
        "200":
          description: Already accrued (redelivery).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RebateAccrual"}
        "201":
          description: Accrued; dev.passage.pricing.rebateaccrual.posted.v1 written to the outbox.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RebateAccrual"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/rebates/agreements/{id}:retro-recompute:
    post:
      operationId: retroRecomputeRebateAgreement
      summary: Re-accrue the invoices posted before a retroactive activation and post the delta per period (FR-26.23).
      description: >
        The agreement is activated when it is created; when its validFrom is earlier, the invoices posted
        between validFrom and the activation day are replayed (SAP VBOF). Until the w29/w30 invoice ledger
        exists the caller supplies those posted invoice lines. Each line not accrued before joins its
        period's cumulative basis (recorded as a zero-amount accrual with retroactive=true); each period is
        then recomputed at its tier and the difference against what it already accrued posts once, with
        retroactive=true and a rebateaccrual.posted event (BR-26.7, BR-26.14, AC-26.14). Posted invoices are
        never re-priced. The Idempotency-Key names the run: a repeated key returns the stored deltas with
        replayed=true. 422 when the agreement is not retroactive or a line is outside validFrom..activation.
      x-passage-duty: pricing.rebate.maintain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RetroRecomputeRequest"}
      responses:
        "200":
          description: The deltas posted (none when every period was already at its target).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RetroRecomputeResult"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commission/sales-groups:
    get:
      operationId: listSalesGroups
      summary: List sales groups with their reps and shares (FR-26.18).
      x-passage-duty: pricing.commission.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Sales groups by name (at most 100).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/SalesGroup"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createSalesGroup
      summary: Create a sales group whose rep shares sum to 100 (FR-26.18). The first rep takes the rounding residual.
      x-passage-duty: pricing.commission.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SalesGroupInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesGroup"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commission/sales-groups/{id}:
    get:
      operationId: getSalesGroup
      summary: Read one sales group with its reps.
      x-passage-duty: pricing.commission.view
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The sales group.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalesGroup"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commission/rules:
    get:
      operationId: listCommissionRules
      summary: List commission rules, optionally of one sales group, from most specific to most general.
      x-passage-duty: pricing.commission.view
      parameters:
        - {name: salesGroupId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Rules (at most 100).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/CommissionRule"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createCommissionRule
      summary: Create a commission rule for a sales group and customer/item commission group (BR-26.12).
      description: The rule takes the sales group's legal entity. One rule per (sales group, customer group, item group); a second is 409 PRC-0038.
      x-passage-duty: pricing.commission.maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommissionRuleInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommissionRule"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commission/postings:
    post:
      operationId: postCommission
      summary: Post the commission of one posted invoice line or credit note line (FR-26.18, BR-26.12).
      description: >
        Stand-in for the invoice.posted consumer (w29/w30). Resolves the sales group's rule specific to
        general (PRC-0013 when none matches), applies REVENUE (line net) or MARGIN (line net less
        costSnapshot, which is then required) basis, splits by rep share (half-even per rep, residual to
        the first rep) and writes one transaction per rep, Dr 6200 / Cr 2170, each with a
        dev.passage.pricing.commission.calculated.v1 event in the same transaction. A credit note line
        (negative lineNet, reversesInvoiceLineId set) reverses with the original line's basis, rate and
        shares; credits of one line may not exceed its invoiced net (PRC-0037). The invoice line id is the
        idempotency key: 201 when posted, 200 when the same line was already posted with the same content,
        422 idempotency_key_reuse when it was posted with different content.
      x-passage-duty: pricing.commission.maintain
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommissionPostingInput"}
      responses:
        "200":
          description: Already posted (redelivery); the stored transactions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommissionTransactionList"}
        "201":
          description: Posted; one transaction per rep.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommissionTransactionList"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/pricing/commission/transactions:
    get:
      operationId: listCommissionTransactions
      summary: Commission inquiry by rep, sales group, period, customer and invoice line (§5.26.14).
      x-passage-duty: pricing.commission.view
      parameters:
        - {name: legalEntityId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: salesGroupId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: repId, in: query, required: false, schema: {type: string}}
        - {name: customerId, in: query, required: false, schema: {type: string}}
        - {name: invoiceLineId, in: query, required: false, description: "Matches the line and the credit notes that reverse it.", schema: {type: string}}
        - {name: period, in: query, required: false, description: "Invoice month such as 2027-03.", schema: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}}
      responses:
        "200":
          description: Newest invoice first (at most 100).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommissionTransactionList"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Replays the stored response when the same key is sent again with the same request; a different request with a used key is 422 idempotency_key_reuse.
      schema: {type: string, maxLength: 255}
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, example: "https://passage.dev/problems/PRC-0002"}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string, description: "Stable snake or service code, e.g. PRC-0002 or COM-0001."}
        errors:
          type: object
          additionalProperties: {type: string}
    LineInput:
      type: object
      required: [productId, unit, quantity]
      properties:
        productId: {type: string, description: "Product id (w8); matched exactly against record product keys."}
        productGroupId: {type: string, description: "Product pricing group of the line, if any."}
        variant: {type: string}
        unit: {type: string, description: "Must be a unit known to the pricing condition records (w6 conversion is later)."}
        quantity: {type: string, description: "Decimal string greater than 0."}
    ResolveRequest:
      type: object
      required: [legalEntityId, customerId, currency, pricingDate, lines]
      properties:
        legalEntityId: {type: string, format: uuid}
        customerId: {type: string, description: "Customer id (w7); matched exactly against record customer keys."}
        customerGroupId: {type: string, description: "Customer pricing group of the document, if any."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        pricingDate: {type: string, format: date}
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: "#/components/schemas/LineInput"}
    RecordInput:
      type: object
      description: Condition record as sent for simulation (no legalEntityId required).
      required: [type, customerKind, productKind, currency, validFrom, validTo]
      properties:
        id: {type: string}
        type: {type: string, enum: [PRICE, LINE_DISC, MULTILINE_DISC, TOTAL_DISC, SURCHARGE]}
        customerKind: {type: string, enum: [customer, customer_group, all]}
        customerKey: {type: string}
        productKind:
          type: string
          enum: [product, product_group, variant, all]
          description: "Must be all for TOTAL_DISC and SURCHARGE (order-level conditions); product_group or all for MULTILINE_DISC."
        productKey: {type: string}
        variant: {type: string}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        unit: {type: string}
        fromQuantity: {type: string}
        amount: {type: string}
        discPct1: {type: string, description: "0-100. For SURCHARGE, the percentage of the order net added."}
        discPct2: {type: string, description: "0-100; must be 0 for SURCHARGE."}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date}
        searchNext: {type: boolean}
        exclusive: {type: boolean}
    SimulateRequest:
      allOf:
        - $ref: "#/components/schemas/ResolveRequest"
        - type: object
          properties:
            records:
              type: array
              items: {$ref: "#/components/schemas/RecordInput"}
    ConditionRecordInput:
      allOf:
        - $ref: "#/components/schemas/RecordInput"
        - type: object
          required: [legalEntityId]
          properties:
            legalEntityId: {type: string, format: uuid}
    ConditionRecord:
      allOf:
        - $ref: "#/components/schemas/ConditionRecordInput"
        - type: object
          required: [id, status, version]
          properties:
            id: {type: string, format: uuid}
            status: {type: string, enum: [DRAFT, ACTIVE, EXPIRED, WITHDRAWN]}
            version: {type: integer, minimum: 1}
    VersionRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, minimum: 1}
        reason: {type: string, description: "Optional, recorded on withdraw."}
    ResolveResponse:
      type: object
      required: [currency, lines, subtotal, totalDiscount, surcharge, orderNet, applied, explainRef]
      properties:
        currency: {type: string}
        lines:
          type: array
          items:
            type: object
            required: [lineNo, unit, quantity, unitPrice, netUnitPrice, lineNet, applied]
            properties:
              lineNo: {type: integer}
              unit: {type: string}
              quantity: {type: string}
              unitPrice: {type: string}
              netUnitPrice: {type: string}
              lineNet: {type: string}
              exclusive: {type: boolean, description: "An exclusive winner suppressed later discount steps, including the total discount, for this line (BR-26.1 step 8)."}
              applied:
                type: array
                items: {$ref: "#/components/schemas/Applied"}
              errorCode: {type: string, description: "PRC-0001 when no price exists for the line."}
              errorDetail: {type: string}
              trace:
                type: array
                items: {$ref: "#/components/schemas/TraceStep"}
        subtotal: {type: string}
        totalDiscount: {type: string}
        surcharge: {type: string, description: "Small-order surcharge included in orderNet (FR-26.6); 0 when none applied."}
        orderNet: {type: string, description: "subtotal - totalDiscount + surcharge."}
        applied:
          type: array
          items: {$ref: "#/components/schemas/Applied"}
        explainRef: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        explainTruncated: {type: boolean}
        trace:
          type: array
          items: {$ref: "#/components/schemas/TraceStep"}
    Applied:
      type: object
      required: [type, recordId, access]
      properties:
        type: {type: string, enum: [PRICE, LINE_DISC, MULTILINE_DISC, TOTAL_DISC, SURCHARGE]}
        recordId: {type: string}
        access: {type: integer, description: "Access sequence number that produced the winner."}
    TraceStep:
      type: object
      required: [condition, accesses]
      properties:
        condition: {type: string}
        selected: {type: string}
        accesses:
          type: array
          items:
            type: object
            required: [seq, access, evaluated, candidates, reason]
            properties:
              seq: {type: integer}
              access: {type: string, example: "customer x product"}
              evaluated: {type: boolean}
              candidates: {type: array, items: {type: string}}
              winner: {type: string}
              reason: {type: string}
    JournalLineInput:
      type: object
      required: [op]
      description: "CREATE takes record; UPDATE takes recordId, expectedVersion and either record or adjustPct; DELETE takes recordId and expectedVersion. RESTORE is internal to reversal."
      properties:
        op: {type: string, enum: [CREATE, UPDATE, DELETE]}
        recordId: {type: string, format: uuid}
        expectedVersion: {type: integer, minimum: 0}
        adjustPct: {type: string, description: "Percentage change applied to the stored amount; greater than -100."}
        record: {$ref: "#/components/schemas/ConditionRecordInput"}
    JournalRequest:
      type: object
      required: [legalEntityId, name, lines]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        smartRound: {type: boolean, description: "Apply smart rounding bands to adjusted amounts (FR-26.7)."}
        lines:
          type: array
          minItems: 1
          maxItems: 100000
          items: {$ref: "#/components/schemas/JournalLineInput"}
    JournalLineError:
      type: object
      required: [lineNo, code, detail]
      properties:
        lineNo: {type: integer}
        code: {type: string}
        detail: {type: string}
    Journal:
      type: object
      required: [id, legalEntityId, name, status, smartRound, lineCount, errorCount, createdAt, errors]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, enum: [OPEN, VALIDATED, POSTED, REVERSED]}
        smartRound: {type: boolean}
        lineCount: {type: integer}
        errorCount: {type: integer}
        reversesJournalId: {type: string, format: uuid}
        reversedByJournalId: {type: string, format: uuid}
        postedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        errors:
          type: array
          items: {$ref: "#/components/schemas/JournalLineError"}
        lines:
          type: array
          description: Set on GET /journals/{id} only.
          items: {$ref: "#/components/schemas/JournalLine"}
        linesTruncated: {type: boolean}
    JournalLine:
      type: object
      required: [lineNo, op, recordId, expectedVersion, adjustPct, errors]
      properties:
        lineNo: {type: integer}
        op: {type: string, enum: [CREATE, UPDATE, DELETE, RESTORE]}
        recordId: {type: string, format: uuid}
        expectedVersion: {type: integer}
        adjustPct: {type: string}
        before: {$ref: "#/components/schemas/ConditionRecord"}
        after: {$ref: "#/components/schemas/ConditionRecord"}
        errors:
          type: array
          items: {$ref: "#/components/schemas/JournalLineError"}
    Tier:
      type: object
      required: [from]
      properties:
        from: {type: string, description: "Threshold: cumulative basis value or quantity."}
        ratePct: {type: string, description: "NET_AMOUNT tiers: percent of net value."}
        amountPerUnit: {type: string, description: "QUANTITY tiers: amount per unit."}
    RebateAgreementInput:
      type: object
      required: [legalEntityId, name, basis, period, tiers, currency, validFrom, validTo]
      description: Exactly one of customerId or customerGroupId is required.
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        customerId: {type: string, format: uuid}
        customerGroupId: {type: string, format: uuid}
        basis: {type: string, enum: [NET_AMOUNT, QUANTITY]}
        period: {type: string, enum: [MONTH, QUARTER, YEAR]}
        tiers:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Tier"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        validFrom: {type: string, format: date}
        validTo: {type: string, format: date}
        accrualAccount: {type: string, default: "2150"}
        expenseAccount: {type: string, default: "4150"}
    RebateAgreement:
      allOf:
        - $ref: "#/components/schemas/RebateAgreementInput"
        - type: object
          required: [id, status]
          properties:
            id: {type: string, format: uuid}
            status: {type: string, enum: [ACTIVE]}
    RebateAccrualInput:
      type: object
      required: [agreementId, invoiceLineId, invoiceDate, value, quantity, currency]
      properties:
        agreementId: {type: string, format: uuid}
        invoiceLineId: {type: string, minLength: 1, maxLength: 128}
        invoiceDate: {type: string, format: date}
        value: {type: string, description: "Invoice line net value."}
        quantity: {type: string}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
    RebateAccrual:
      type: object
      required: [id, agreementId, periodId, invoiceLineId, invoiceDate, basisValue, basisQuantity, amount, currency, status]
      properties:
        id: {type: string, format: uuid}
        agreementId: {type: string, format: uuid}
        periodId: {type: string}
        invoiceLineId: {type: string}
        invoiceDate: {type: string, format: date}
        basisValue: {type: string}
        basisQuantity: {type: string}
        amount: {type: string, description: "Accrued amount; posts Dr 4150 / Cr 2150."}
        currency: {type: string}
        status: {type: string, enum: [ACCRUED, ADJUSTED, SETTLED, REVERSED]}
        retroactive: {type: boolean, description: "True for an invoice line replayed by a retroactive recompute (amount 0) and for its per-period delta (invoiceLineId retro:<run key>:<period>)."}
    RetroLine:
      type: object
      required: [invoiceLineId, invoiceDate, currency]
      properties:
        invoiceLineId: {type: string, minLength: 1, maxLength: 128}
        invoiceDate: {type: string, format: date, description: "Between the agreement's validFrom and its activation day."}
        value: {type: string, description: "Invoice line net value; default 0."}
        quantity: {type: string, description: "Default 0."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
    RetroRecomputeRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          maxItems: 5000
          description: The invoice lines posted in the agreement's scope before its activation.
          items: {$ref: "#/components/schemas/RetroLine"}
    RetroDelta:
      type: object
      required: [periodId, target, posted, delta]
      properties:
        periodId: {type: string}
        target: {type: string, description: "Accrual the period owes at its cumulative basis."}
        posted: {type: string, description: "Accrual the period had before the recompute."}
        delta: {type: string, description: "target - posted; posts Dr expense / Cr accrual (negative reverses)."}
    RetroRecomputeResult:
      type: object
      required: [agreementId, activatedOn, reaccruedLines, replayed, deltas]
      properties:
        agreementId: {type: string, format: uuid}
        activatedOn: {type: string, format: date}
        reaccruedLines: {type: integer, description: "Replayed invoice lines that were not accrued before."}
        replayed: {type: boolean, description: "True when the Idempotency-Key was used before and the stored deltas are returned."}
        deltas:
          type: array
          items: {$ref: "#/components/schemas/RetroDelta"}
        notice:
          type: object
          description: PRC-0006 when posted invoices were re-accrued.
          required: [code, message]
          properties:
            code: {type: string, example: PRC-0006}
            message: {type: string}
    RepShare:
      type: object
      required: [repId, sharePct]
      properties:
        repId: {type: string, minLength: 1, maxLength: 64, description: "Worker id (w42)."}
        sharePct: {type: string, description: "Decimal above 0 and at most 100; the shares of a group sum to 100."}
    SalesGroupInput:
      type: object
      required: [legalEntityId, name, reps]
      properties:
        legalEntityId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        reps:
          type: array
          minItems: 1
          maxItems: 20
          description: In order; the first rep takes the rounding residual.
          items: {$ref: "#/components/schemas/RepShare"}
    SalesGroup:
      allOf:
        - $ref: "#/components/schemas/SalesGroupInput"
        - type: object
          required: [id]
          properties:
            id: {type: string, format: uuid}
    CommissionRuleInput:
      type: object
      required: [salesGroupId, basis, ratePct]
      properties:
        salesGroupId: {type: string, format: uuid}
        customerGroup: {type: string, maxLength: 64, description: "Customer commission group; empty means all customers."}
        itemGroup: {type: string, maxLength: 64, description: "Item commission group; empty means all items."}
        basis: {type: string, enum: [REVENUE, MARGIN]}
        ratePct: {type: string, description: "Decimal from 0 to 100."}
    CommissionRule:
      allOf:
        - $ref: "#/components/schemas/CommissionRuleInput"
        - type: object
          required: [id, legalEntityId]
          properties:
            id: {type: string, format: uuid}
            legalEntityId: {type: string, format: uuid}
    CommissionPostingInput:
      type: object
      required: [legalEntityId, salesGroupId, invoiceLineId, invoiceDate, currency, lineNet]
      properties:
        legalEntityId: {type: string, format: uuid, description: "Must be the sales group's legal entity."}
        salesGroupId: {type: string, format: uuid, description: "From the order header (w27); a credit note names the original line's group."}
        invoiceLineId: {type: string, minLength: 1, maxLength: 128}
        reversesInvoiceLineId: {type: string, maxLength: 128, description: "Set on a credit note line; lineNet is then negative."}
        invoiceDate: {type: string, format: date}
        customerId: {type: string, maxLength: 128}
        customerGroup: {type: string, maxLength: 64, description: "Customer commission group."}
        itemGroup: {type: string, maxLength: 64, description: "Item commission group."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        lineNet: {type: string, description: "Invoice line net; zero or more on an invoice, negative on a credit note."}
        costSnapshot: {type: string, description: "Line cost (w20) with the sign of lineNet; required when the rule pays on MARGIN."}
    CommissionTransaction:
      type: object
      required: [id, legalEntityId, invoiceLineId, invoiceDate, periodId, customerGroup, itemGroup, salesGroupId, repId, sharePct, basis, lineNet, basisAmount, ratePct, amount, currency, debitAccount, creditAccount, status]
      properties:
        id: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        invoiceLineId: {type: string}
        reversesInvoiceLineId: {type: string}
        invoiceDate: {type: string, format: date}
        periodId: {type: string, description: "Invoice month, such as 2027-03."}
        customerId: {type: string}
        customerGroup: {type: string}
        itemGroup: {type: string}
        salesGroupId: {type: string, format: uuid}
        repId: {type: string}
        sharePct: {type: string}
        basis: {type: string, enum: [REVENUE, MARGIN]}
        lineNet: {type: string}
        costSnapshot: {type: string}
        basisAmount: {type: string}
        ratePct: {type: string}
        amount: {type: string, description: "The rep's share; negative on a credit note."}
        currency: {type: string}
        debitAccount: {type: string, example: "6200"}
        creditAccount: {type: string, example: "2170"}
        status: {type: string, enum: [POSTED]}
    CommissionTransactionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CommissionTransaction"}
