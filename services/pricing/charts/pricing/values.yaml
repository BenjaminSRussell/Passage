image:
  repository: ghcr.io/benjaminsrussell/passage-pricing
  tag: "0.1.0"
  # Prefer digest pinning from Argo CD; when set it takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 3

service:
  port: 8080
  adminPort: 9090

# Apply migrations/ at start-up (dbx.Migrate). Turn off when a migration job owns the schema.
migrateOnStart: true

# DATABASE_URL is read from this secret (Vault via External Secrets), never from values.
databaseSecret:
  name: pricing-db-app
  key: uri

config:
  pricingCacheTtl: 60s
  pricingMaxLines: "500"
  pricingExplainMaxBytes: "65536"
  otelEndpoint: ""

# Cache invalidation across replicas (FR-26.14): every replica follows campaign.killed,
# campaign.restored, parameters.changed and tenantparameter.changed on the topics
# passage.pricing.campaign and passage.pricing.parameters, under a Kafka group of its own.
# Off by default: without it a replica's caches follow other replicas' changes within the
# snapshot lifetime. Needs the service principal pricing-cache with the flag duty
# pricing.cache.invalidate (see NOT-IMPLEMENTED.md).
cacheConsumer:
  enabled: false
  brokers: ""
  username: pricing-cache
  # Secret holding the SCRAM password under the key "password".
  secret: ""

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

serviceMonitor:
  enabled: false
  interval: 30s

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
