asyncapi: 3.0.0
info:
  title: Passage Pricing Events
  version: 0.1.0
  description: >
    Events published by the pricing service through the transactional outbox. Each event is
    written in the same transaction as the state change (outbox.Enqueue). CloudEvents 1.0
    envelope; type dev.passage.<context>.<entity>.<verb>.v<n>; source /passage/pricing/pricing.
defaultContentType: application/cloudevents+json
channels:
  conditionRecordActivated:
    address: passage.pricing.conditionrecord
    description: Topic for condition-record lifecycle events (kernel topic rule passage.<context>.<entity>).
    messages:
      conditionRecordActivated:
        $ref: "#/components/messages/ConditionRecordActivated"
      conditionRecordWithdrawn:
        $ref: "#/components/messages/ConditionRecordWithdrawn"
  journal:
    address: passage.pricing.journal
    description: Price journal post and reversal (FR-26.9).
    messages:
      journalPosted:
        $ref: "#/components/messages/JournalPosted"
  rebateAccrual:
    address: passage.pricing.rebateaccrual
    description: Rebate accrual posted on a sales invoice line (FR-26.11) or a vendor invoice line (FR-26.15).
    messages:
      rebateAccrualPosted:
        $ref: "#/components/messages/RebateAccrualPosted"
  commission:
    address: passage.pricing.commission
    description: Commission calculated per rep on a posted invoice line or its credit note (FR-26.12, FR-26.18).
    messages:
      commissionCalculated:
        $ref: "#/components/messages/CommissionCalculated"
  fund:
    address: passage.pricing.fund
    description: Trade promotion fund closed or reopened (FR-26.19, BR-26.15).
    messages:
      fundClosed:
        $ref: "#/components/messages/FundClosed"
      fundReopened:
        $ref: "#/components/messages/FundReopened"
  fundUsage:
    address: passage.pricing.fundusage
    description: Usage attributed to a trade promotion fund in a period (FR-26.19).
    messages:
      fundUsageRecorded:
        $ref: "#/components/messages/FundUsageRecorded"
  campaign:
    address: passage.pricing.campaign
    description: Campaign kill switch set or cleared (FR-26.10).
    messages:
      campaignKilled:
        $ref: "#/components/messages/CampaignKilled"
      campaignRestored:
        $ref: "#/components/messages/CampaignRestored"
  procedure:
    address: passage.pricing.procedure
    description: Pricing procedure version activated (FR-26.1).
    messages:
      procedureActivated:
        $ref: "#/components/messages/ProcedureActivated"
  vendorRebateClaim:
    address: passage.pricing.vendorrebateclaim
    description: Vendor rebate period claims created and approved for settlement through w19 AP (FR-26.15, BR-26.11).
    messages:
      vendorRebateClaimCreated:
        $ref: "#/components/messages/VendorRebateClaimCreated"
      vendorRebateClaimApproved:
        $ref: "#/components/messages/VendorRebateClaimApproved"
operations:
  publishJournalPosted:
    action: send
    channel: {$ref: "#/channels/journal"}
    summary: A price journal posted or reversed.
    messages:
      - {$ref: "#/channels/journal/messages/journalPosted"}
  publishRebateAccrualPosted:
    action: send
    channel: {$ref: "#/channels/rebateAccrual"}
    summary: A rebate accrual posted; the ledger books Dr 4150 / Cr 2150 (customer) or Dr 2160 / Cr 5100 (vendor).
    messages:
      - {$ref: "#/channels/rebateAccrual/messages/rebateAccrualPosted"}
  publishCommissionCalculated:
    action: send
    channel: {$ref: "#/channels/commission"}
    summary: One rep's commission on an invoice line; the ledger books Dr 6200 / Cr 2170 and Phase 8 settles it.
    messages:
      - {$ref: "#/channels/commission/messages/commissionCalculated"}
  publishConditionRecordActivated:
    action: send
    channel: {$ref: "#/channels/conditionRecordActivated"}
    summary: A condition record became ACTIVE.
    messages:
      - {$ref: "#/channels/conditionRecordActivated/messages/conditionRecordActivated"}
  publishConditionRecordWithdrawn:
    action: send
    channel: {$ref: "#/channels/conditionRecordActivated"}
    summary: A condition record was withdrawn.
    messages:
      - {$ref: "#/channels/conditionRecordActivated/messages/conditionRecordWithdrawn"}
  publishFundClosed:
    action: send
    channel: {$ref: "#/channels/fund"}
    summary: A fund was closed; its usage is frozen and new attribution fails with PRC-0011.
    messages:
      - {$ref: "#/channels/fund/messages/fundClosed"}
  publishFundReopened:
    action: send
    channel: {$ref: "#/channels/fund"}
    summary: A closed fund was reopened (FundMaintain).
    messages:
      - {$ref: "#/channels/fund/messages/fundReopened"}
  publishFundUsageRecorded:
    action: send
    channel: {$ref: "#/channels/fundUsage"}
    summary: Usage was attributed to a fund within its period budget (or with overspend allowed).
    messages:
      - {$ref: "#/channels/fundUsage/messages/fundUsageRecorded"}
  publishCampaignKilled:
    action: send
    channel: {$ref: "#/channels/campaign"}
    summary: A campaign's kill switch was set; its records leave the next resolve (NEXT_RESOLVE).
    messages:
      - {$ref: "#/channels/campaign/messages/campaignKilled"}
  publishCampaignRestored:
    action: send
    channel: {$ref: "#/channels/campaign"}
    summary: A killed campaign was restored; its records rejoin the next resolve within its validity.
    messages:
      - {$ref: "#/channels/campaign/messages/campaignRestored"}
  publishVendorRebateClaimCreated:
    action: send
    channel: {$ref: "#/channels/vendorRebateClaim"}
    summary: A vendor rebate claim RC-n was created OPEN for one agreement period.
    messages:
      - {$ref: "#/channels/vendorRebateClaim/messages/vendorRebateClaimCreated"}
  publishVendorRebateClaimApproved:
    action: send
    channel: {$ref: "#/channels/vendorRebateClaim"}
    summary: A vendor rebate claim was approved; w19 AP settles it by credit note, payment deduction or vendor invoice.
    messages:
      - {$ref: "#/channels/vendorRebateClaim/messages/vendorRebateClaimApproved"}
  publishProcedureActivated:
    action: send
    channel: {$ref: "#/channels/procedure"}
    summary: A procedure version became ACTIVE and the previous ACTIVE version of the same name was superseded.
    messages:
      - {$ref: "#/channels/procedure/messages/procedureActivated"}
components:
  messages:
    ConditionRecordActivated:
      name: dev.passage.pricing.conditionrecord.activated.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [id, legal_entity_id, type, customer_kind, product_kind, currency, valid_from, valid_to, version, retroactive]
        properties:
          id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          type: {type: string, enum: [PRICE, LINE_DISC, MULTILINE_DISC, TOTAL_DISC, SURCHARGE]}
          customer_kind: {type: string, enum: [customer, customer_group, all]}
          customer_key: {type: string}
          product_kind: {type: string, enum: [product, product_group, variant, all]}
          product_key: {type: string}
          variant: {type: string}
          currency: {type: string}
          unit: {type: string}
          from_quantity: {type: string}
          valid_from: {type: string, format: date}
          valid_to: {type: string, format: date}
          version: {type: integer}
          journal_id: {type: string, format: uuid, description: "Price journal that posted or reversed the record; absent for a single-record activation."}
          campaign_id: {type: string, format: uuid, description: "Campaign the record belongs to (FR-26.10); absent when it stands alone."}
          retroactive: {type: boolean, description: "valid_from is before the activation or posting day (BR-26.7); consumers never re-price posted documents."}
    ConditionRecordWithdrawn:
      name: dev.passage.pricing.conditionrecord.withdrawn.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [id, version]
        properties:
          id: {type: string, format: uuid}
          version: {type: integer}
          reason: {type: string}
    JournalPosted:
      name: dev.passage.pricing.journal.posted.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [journal_id, legal_entity_id, line_count]
        properties:
          journal_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          line_count: {type: integer}
          reversed_journal_id: {type: string, format: uuid, description: "Set when this journal reverses another."}
    RebateAccrualPosted:
      name: dev.passage.pricing.rebateaccrual.posted.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        description: >
          One invoice line's accrual. The ledger (w11) posts Dr debit_account / Cr credit_account
          for amount: 4150 / 2150 by default for a CUSTOMER agreement, 2160 / 5100 for a VENDOR
          agreement (FR-26.15). amount is negative when a credit note or a tier
          recompute lowers the period. journal_posting_id (PRD 5.26.5) is assigned by the ledger.
          A retroactive recompute (FR-26.23) posts one event per changed period with
          retroactive=true; its invoice_line_id is the synthetic id retro:<run key>:<period>.
        required: [accrual_id, legal_entity_id, agreement_id, party_role, period_id, invoice_line_id, amount, currency, debit_account, credit_account, retroactive]
        properties:
          accrual_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          agreement_id: {type: string, format: uuid}
          party_role: {type: string, enum: [CUSTOMER, VENDOR], description: "CUSTOMER for a sales invoice accrual, VENDOR for a vendor invoice accrual."}
          period_id: {type: string, description: "2027-03, 2027-Q1 or 2027."}
          invoice_line_id: {type: string}
          amount: {type: string, description: "Decimal string in the agreement currency's minor units."}
          currency: {type: string, pattern: "^[A-Z]{3}$"}
          debit_account: {type: string, description: "Rebate expense 4150 (customer) or vendor rebate receivable 2160 (vendor) by default."}
          credit_account: {type: string, description: "Rebate accrual 2150 (customer) or purchase rebate income 5100 (vendor) by default."}
          retroactive: {type: boolean, description: "True for the per-period delta of a retroactive recompute (BR-26.7, BR-26.14)."}
    CommissionCalculated:
      name: dev.passage.pricing.commission.calculated.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        description: >
          One rep's commission transaction on one invoice line (BR-26.12). The ledger (w11) posts
          Dr debit_account / Cr credit_account for amount; amount is negative on a credit note,
          which names the line it reverses. Rep names never appear (PRD 5.26.20).
        required: [transaction_id, legal_entity_id, invoice_line_id, sales_group_id, sales_rep_id, basis, basis_amount, rate, amount, currency, period_id, debit_account, credit_account]
        properties:
          transaction_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          invoice_line_id: {type: string}
          reverses_invoice_line_id: {type: string, description: "Set on a credit note: the invoice line whose commission it reverses."}
          sales_group_id: {type: string, format: uuid}
          sales_rep_id: {type: string, description: "Worker id (w42); never a name."}
          basis: {type: string, enum: [REVENUE, MARGIN]}
          basis_amount: {type: string, description: "Line net (REVENUE) or line net less cost (MARGIN)."}
          rate: {type: string, description: "Commission rate in percent."}
          amount: {type: string, description: "The rep's share, in the currency's minor units."}
          currency: {type: string, pattern: "^[A-Z]{3}$"}
          period_id: {type: string, description: "Invoice month, such as 2027-03."}
          debit_account: {type: string, description: "Commission expense (6200)."}
          credit_account: {type: string, description: "Commission payable (2170)."}
    FundClosed:
      name: dev.passage.pricing.fund.closed.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/FundStatus"
    FundReopened:
      name: dev.passage.pricing.fund.reopened.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/FundStatus"
    FundUsageRecorded:
      name: dev.passage.pricing.fundusage.recorded.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        description: >
          One usage attribution to a trade promotion fund (BR-26.15) with the period's usage and
          budget after it. Amounts are decimal strings in the fund currency.
        required: [usage_id, fund_id, legal_entity_id, period, source, reference, amount, currency, period_usage, budget]
        properties:
          usage_id: {type: string, format: uuid}
          fund_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          period: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}
          source: {type: string, enum: [CAMPAIGN_ACCRUAL, REBATE_ACCRUAL, CLAIM, DEDUCTION]}
          reference: {type: string, description: "The accrual, claim or deduction the usage came from."}
          amount: {type: string}
          currency: {type: string, pattern: "^[A-Z]{3}$"}
          period_usage: {type: string, description: "Usage in the period including this attribution."}
          budget: {type: string, description: "Budget per period at the time of attribution."}
    CampaignKilled:
      name: dev.passage.pricing.campaign.killed.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/CampaignStatus"
    CampaignRestored:
      name: dev.passage.pricing.campaign.restored.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/CampaignStatus"
    ProcedureActivated:
      name: dev.passage.pricing.procedure.activated.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        description: >
          A procedure version became ACTIVE (FR-26.1). Activated versions are immutable; the
          ACTIVE version it replaced, if any, is now SUPERSEDED.
        required: [procedure_id, legal_entity_id, name, version]
        properties:
          procedure_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          name: {type: string, description: "For example AX_STANDARD or SAP_RVAA01."}
          version: {type: integer, minimum: 1}
          superseded_id: {type: string, format: uuid, description: "The version this activation superseded; absent for the first."}
    VendorRebateClaimCreated:
      name: dev.passage.pricing.vendorrebateclaim.created.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/VendorRebateClaim"
    VendorRebateClaimApproved:
      name: dev.passage.pricing.vendorrebateclaim.approved.v1
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/VendorRebateClaim"
  schemas:
    VendorRebateClaim:
      type: object
      description: >
        A vendor rebate claim for one agreement period (FR-26.15). amount = accrued_total -
        prior_claimed (BR-26.11). w19 AP settles an APPROVED claim: a positive amount by credit
        note or payment deduction (settlement_mode), a negative one by a vendor invoice
        (VENDOR_INVOICE). Ids only; vendor names never appear in events.
      required: [claim_id, number, legal_entity_id, agreement_id, vendor_id, period_id, accrued_total, prior_claimed, amount, currency, settlement_mode, status, version]
      properties:
        claim_id: {type: string, format: uuid}
        number: {type: string, pattern: "^RC-[0-9]{6,}$", description: "Claim number, sequence RC- per legal entity."}
        legal_entity_id: {type: string, format: uuid}
        agreement_id: {type: string, format: uuid}
        vendor_id: {type: string, format: uuid}
        period_id: {type: string, description: "2027-03, 2027-Q1 or 2027."}
        accrued_total: {type: string, description: "The period's accruals when the claim was created."}
        prior_claimed: {type: string, description: "Sum of the period's earlier claims."}
        amount: {type: string, description: "Decimal string; negative for an over-accrued period."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        settlement_mode: {type: string, enum: [CREDIT_NOTE, PAYMENT_DEDUCTION, VENDOR_INVOICE]}
        status: {type: string, enum: [OPEN, APPROVED]}
        version: {type: integer, minimum: 1}
    CampaignStatus:
      type: object
      description: >
        A campaign's kill switch after kill or restore (FR-26.10). Records of a killed campaign
        drop out of the next resolve; caches drop their snapshot for the legal entity.
      required: [campaign_id, legal_entity_id, killed, version]
      properties:
        campaign_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        killed: {type: boolean}
        version: {type: integer, minimum: 1}
    FundStatus:
      type: object
      description: A trade promotion fund's open/closed state after close or reopen (BR-26.15).
      required: [fund_id, legal_entity_id, closed, version]
      properties:
        fund_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        closed: {type: boolean}
        version: {type: integer, minimum: 1}
