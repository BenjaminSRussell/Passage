asyncapi: 3.0.0
info:
  title: Passage Pricing Events
  version: 0.1.0
  description: >
    Events published by the pricing service through the transactional outbox. Each event is
    written in the same transaction as the state change (outbox.Enqueue). CloudEvents 1.0
    envelope; type dev.passage.<context>.<entity>.<verb>.v<n>; source /passage/pricing/pricing.
defaultContentType: application/cloudevents+json
channels:
  conditionRecordActivated:
    address: passage.pricing.conditionrecord
    description: Topic for condition-record lifecycle events (kernel topic rule passage.<context>.<entity>).
    messages:
      conditionRecordActivated:
        $ref: "#/components/messages/ConditionRecordActivated"
      conditionRecordWithdrawn:
        $ref: "#/components/messages/ConditionRecordWithdrawn"
  journal:
    address: passage.pricing.journal
    description: Price journal post and reversal (FR-26.9).
    messages:
      journalPosted:
        $ref: "#/components/messages/JournalPosted"
  rebateAccrual:
    address: passage.pricing.rebateaccrual
    description: Rebate accrual posted on a sales invoice line (FR-26.11) or a vendor invoice line (FR-26.15).
    messages:
      rebateAccrualPosted:
        $ref: "#/components/messages/RebateAccrualPosted"
  commission:
    address: passage.pricing.commission
    description: Commission calculated per rep on a posted invoice line or its credit note (FR-26.12, FR-26.18).
    messages:
      commissionCalculated:
        $ref: "#/components/messages/CommissionCalculated"
  commissionExport:
    address: passage.pricing.commissionexport
    description: A commission settlement export was recorded for AP or payroll, or voided (FR-26.18).
    messages:
      commissionExportIssued:
        $ref: "#/components/messages/CommissionExportIssued"
      commissionExportVoided:
        $ref: "#/components/messages/CommissionExportVoided"
  fund:
    address: passage.pricing.fund
    description: Trade promotion fund closed or reopened (FR-26.19, BR-26.15).
    messages:
      fundClosed:
        $ref: "#/components/messages/FundClosed"
      fundReopened:
        $ref: "#/components/messages/FundReopened"
  fundUsage:
    address: passage.pricing.fundusage
    description: Usage attributed to a trade promotion fund in a period (FR-26.19).
    messages:
      fundUsageRecorded:
        $ref: "#/components/messages/FundUsageRecorded"
  parameters:
    address: passage.pricing.parameters
    description: A legal entity's or a tenant's pricing parameters changed (PRD 5.26.13).
    messages:
      parametersChanged:
        $ref: "#/components/messages/ParametersChanged"
      tenantParametersChanged:
        $ref: "#/components/messages/TenantParametersChanged"
  procedureAssignment:
    address: passage.pricing.procedureassignment
    description: The pricing procedure of a legal entity and sales channel was set or cleared (PRD 5.26.13).
    messages:
      procedureAssignmentChanged:
        $ref: "#/components/messages/ProcedureAssignmentChanged"
  campaign:
    address: passage.pricing.campaign
    description: Campaign kill switch set or cleared, or its terms revised (FR-26.10).
    messages:
      campaignKilled:
        $ref: "#/components/messages/CampaignKilled"
      campaignRestored:
        $ref: "#/components/messages/CampaignRestored"
      campaignRevised:
        $ref: "#/components/messages/CampaignRevised"
  freeGoodsRule:
    address: passage.pricing.freegoodsrule
    description: Free goods rule created or withdrawn (FR-26.22).
    messages:
      freeGoodsRuleCreated:
        $ref: "#/components/messages/FreeGoodsRuleCreated"
      freeGoodsRuleWithdrawn:
        $ref: "#/components/messages/FreeGoodsRuleWithdrawn"
  commodity:
    address: passage.pricing.commodity
    description: Commodity pricing set-up and runs (FR-26.21).
    messages:
      commodityBasisCreated:
        $ref: "#/components/messages/CommodityBasisCreated"
      commodityIndexRecorded:
        $ref: "#/components/messages/CommodityIndexRecorded"
      commodityCalculationCreated:
        $ref: "#/components/messages/CommodityCalculationCreated"
      commodityCalculationWithdrawn:
        $ref: "#/components/messages/CommodityCalculationWithdrawn"
      commodityRunCompleted:
        $ref: "#/components/messages/CommodityRunCompleted"
  rebateAgreement:
    address: passage.pricing.rebateagreement
    description: Rebate agreement revised, closed early or reopened (FR-26.11).
    messages:
      rebateAgreementRevised:
        $ref: "#/components/messages/RebateAgreementRevised"
      rebateAgreementClosed:
        $ref: "#/components/messages/RebateAgreementClosed"
      rebateAgreementReopened:
        $ref: "#/components/messages/RebateAgreementReopened"
  procedure:
    address: passage.pricing.procedure
    description: Pricing procedure version activated (FR-26.1).
    messages:
      procedureActivated:
        $ref: "#/components/messages/ProcedureActivated"
  vendorRebateClaim:
    address: passage.pricing.vendorrebateclaim
    description: Vendor rebate period claims created and approved for settlement through w19 AP (FR-26.15, BR-26.11).
    messages:
      vendorRebateClaimCreated:
        $ref: "#/components/messages/VendorRebateClaimCreated"
      vendorRebateClaimApproved:
        $ref: "#/components/messages/VendorRebateClaimApproved"
  brokerContract:
    address: passage.pricing.brokercontract
    description: Broker contracts created and closed (FR-26.16).
    messages:
      brokerContractCreated:
        $ref: "#/components/messages/BrokerContractCreated"
      brokerContractClosed:
        $ref: "#/components/messages/BrokerContractClosed"
  royaltyAgreement:
    address: passage.pricing.royaltyagreement
    description: Royalty agreements created and closed (FR-26.17).
    messages:
      royaltyAgreementCreated:
        $ref: "#/components/messages/RoyaltyAgreementCreated"
      royaltyAgreementClosed:
        $ref: "#/components/messages/RoyaltyAgreementClosed"
  contractAccrual:
    address: passage.pricing.contractaccrual
    description: Broker and royalty accruals posted for the ledger (FR-26.16, FR-26.17).
    messages:
      contractAccrualPosted:
        $ref: "#/components/messages/ContractAccrualPosted"
  contractClaim:
    address: passage.pricing.contractclaim
    description: Broker and royalty period claims created and approved for settlement through w19 AP (FR-26.16, FR-26.17).
    messages:
      contractClaimCreated:
        $ref: "#/components/messages/ContractClaimCreated"
      contractClaimApproved:
        $ref: "#/components/messages/ContractClaimApproved"
operations:
  publishJournalPosted:
    action: send
    channel: {$ref: "#/channels/journal"}
    summary: A price journal posted or reversed.
    messages:
      - {$ref: "#/channels/journal/messages/journalPosted"}
  publishRebateAccrualPosted:
    action: send
    channel: {$ref: "#/channels/rebateAccrual"}
    summary: A rebate accrual posted; the ledger books Dr 4150 / Cr 2150 (customer) or Dr 2160 / Cr 5100 (vendor).
    messages:
      - {$ref: "#/channels/rebateAccrual/messages/rebateAccrualPosted"}
  publishCommissionCalculated:
    action: send
    channel: {$ref: "#/channels/commission"}
    summary: One rep's commission on an invoice line; the ledger books Dr 6200 / Cr 2170 and Phase 8 settles it.
    messages:
      - {$ref: "#/channels/commission/messages/commissionCalculated"}
  publishConditionRecordActivated:
    action: send
    channel: {$ref: "#/channels/conditionRecordActivated"}
    summary: A condition record became ACTIVE.
    messages:
      - {$ref: "#/channels/conditionRecordActivated/messages/conditionRecordActivated"}
  publishConditionRecordWithdrawn:
    action: send
    channel: {$ref: "#/channels/conditionRecordActivated"}
    summary: A condition record left the ACTIVE set - withdrawn by a user or a journal, or expired by the nightly job (reason EXPIRED).
    messages:
      - {$ref: "#/channels/conditionRecordActivated/messages/conditionRecordWithdrawn"}
  publishCommissionExportIssued:
    action: send
    channel: {$ref: "#/channels/commissionExport"}
    summary: A commission settlement export was recorded; the period cannot be exported again to the same target until it is voided.
    messages:
      - {$ref: "#/channels/commissionExport/messages/commissionExportIssued"}
  publishCommissionExportVoided:
    action: send
    channel: {$ref: "#/channels/commissionExport"}
    summary: A recorded commission settlement export was voided with a reason, so the period can be exported again.
    messages:
      - {$ref: "#/channels/commissionExport/messages/commissionExportVoided"}
  publishFundClosed:
    action: send
    channel: {$ref: "#/channels/fund"}
    summary: A fund was closed; its usage is frozen and new attribution fails with PRC-0011.
    messages:
      - {$ref: "#/channels/fund/messages/fundClosed"}
  publishFundReopened:
    action: send
    channel: {$ref: "#/channels/fund"}
    summary: A closed fund was reopened (FundMaintain).
    messages:
      - {$ref: "#/channels/fund/messages/fundReopened"}
  publishFundUsageRecorded:
    action: send
    channel: {$ref: "#/channels/fundUsage"}
    summary: Usage was attributed to a fund within its period budget (or with overspend allowed).
    messages:
      - {$ref: "#/channels/fundUsage/messages/fundUsageRecorded"}
  publishBrokerContractCreated:
    action: send
    channel: {$ref: "#/channels/brokerContract"}
    summary: A broker contract was created.
    messages:
      - {$ref: "#/channels/brokerContract/messages/brokerContractCreated"}
  publishBrokerContractClosed:
    action: send
    channel: {$ref: "#/channels/brokerContract"}
    summary: A broker contract was closed; it takes no further accruals.
    messages:
      - {$ref: "#/channels/brokerContract/messages/brokerContractClosed"}
  publishRoyaltyAgreementCreated:
    action: send
    channel: {$ref: "#/channels/royaltyAgreement"}
    summary: A royalty agreement was created.
    messages:
      - {$ref: "#/channels/royaltyAgreement/messages/royaltyAgreementCreated"}
  publishRoyaltyAgreementClosed:
    action: send
    channel: {$ref: "#/channels/royaltyAgreement"}
    summary: A royalty agreement was closed; it takes no further accruals.
    messages:
      - {$ref: "#/channels/royaltyAgreement/messages/royaltyAgreementClosed"}
  publishContractAccrualPosted:
    action: send
    channel: {$ref: "#/channels/contractAccrual"}
    summary: A broker or royalty accrual posted; the ledger books Dr 6210 / Cr 2175 (broker) or Dr 6220 / Cr 2176 (royalty).
    messages:
      - {$ref: "#/channels/contractAccrual/messages/contractAccrualPosted"}
  publishContractClaimCreated:
    action: send
    channel: {$ref: "#/channels/contractClaim"}
    summary: A broker or royalty period claim was created.
    messages:
      - {$ref: "#/channels/contractClaim/messages/contractClaimCreated"}
  publishContractClaimApproved:
    action: send
    channel: {$ref: "#/channels/contractClaim"}
    summary: A broker or royalty period claim was approved; w19 AP settles it.
    messages:
      - {$ref: "#/channels/contractClaim/messages/contractClaimApproved"}
  publishParametersChanged:
    action: send
    channel: {$ref: "#/channels/parameters"}
    summary: A legal entity's pricing parameters (journal_four_eyes, pricing_date_basis, total_discount_basis, smart_rounding_bands, price_search_mode, small_order_thresholds) were changed (PricingAdmin).
    messages:
      - {$ref: "#/channels/parameters/messages/parametersChanged"}
  publishTenantParametersChanged:
    action: send
    channel: {$ref: "#/channels/parameters"}
    summary: A tenant's pricing parameters (cache_ttl_seconds, campaign_kill_switch_effect) were changed (PricingAdmin).
    messages:
      - {$ref: "#/channels/parameters/messages/tenantParametersChanged"}
  publishProcedureAssignmentChanged:
    action: send
    channel: {$ref: "#/channels/procedureAssignment"}
    summary: The procedure a legal entity and sales channel price with was set or cleared (PricingAdmin).
    messages:
      - {$ref: "#/channels/procedureAssignment/messages/procedureAssignmentChanged"}
  publishCampaignKilled:
    action: send
    channel: {$ref: "#/channels/campaign"}
    summary: A campaign's kill switch was set; its records leave the next resolve (NEXT_RESOLVE).
    messages:
      - {$ref: "#/channels/campaign/messages/campaignKilled"}
  publishCampaignRestored:
    action: send
    channel: {$ref: "#/channels/campaign"}
    summary: A killed campaign was restored; its records rejoin the next resolve within its validity.
    messages:
      - {$ref: "#/channels/campaign/messages/campaignRestored"}
  publishCampaignRevised:
    action: send
    channel: {$ref: "#/channels/campaign"}
    summary: A campaign's name, validity, target customer group or budget changed; the next resolve uses the new terms.
    messages:
      - {$ref: "#/channels/campaign/messages/campaignRevised"}
  publishFreeGoodsRuleCreated:
    action: send
    channel: {$ref: "#/channels/freeGoodsRule"}
    summary: A free goods rule was created live; the sales cache drops its free goods snapshot for the legal entity.
    messages:
      - {$ref: "#/channels/freeGoodsRule/messages/freeGoodsRuleCreated"}
  publishFreeGoodsRuleWithdrawn:
    action: send
    channel: {$ref: "#/channels/freeGoodsRule"}
    summary: A free goods rule was withdrawn; it leaves the next resolve.
    messages:
      - {$ref: "#/channels/freeGoodsRule/messages/freeGoodsRuleWithdrawn"}
  publishCommodityBasisCreated:
    action: send
    channel: {$ref: "#/channels/commodity"}
    summary: A commodity cost basis type was created.
    messages:
      - {$ref: "#/channels/commodity/messages/commodityBasisCreated"}
  publishCommodityIndexRecorded:
    action: send
    channel: {$ref: "#/channels/commodity"}
    summary: An index value was recorded for a day; a correction is a new revision, never an overwrite.
    messages:
      - {$ref: "#/channels/commodity/messages/commodityIndexRecorded"}
  publishCommodityCalculationCreated:
    action: send
    channel: {$ref: "#/channels/commodity"}
    summary: A commodity price calculation was created.
    messages:
      - {$ref: "#/channels/commodity/messages/commodityCalculationCreated"}
  publishCommodityCalculationWithdrawn:
    action: send
    channel: {$ref: "#/channels/commodity"}
    summary: A commodity price calculation was withdrawn; it takes no further runs.
    messages:
      - {$ref: "#/channels/commodity/messages/commodityCalculationWithdrawn"}
  publishCommodityRunCompleted:
    action: send
    channel: {$ref: "#/channels/commodity"}
    summary: A commodity price calculation run finished; journal_id names the VALIDATED price journal awaiting review, absent when no price changed.
    messages:
      - {$ref: "#/channels/commodity/messages/commodityRunCompleted"}
  publishRebateAgreementRevised:
    action: send
    channel: {$ref: "#/channels/rebateAgreement"}
    summary: A rebate agreement's name, end date or (before its first accrual) tiers changed; the version moved on.
    messages:
      - {$ref: "#/channels/rebateAgreement/messages/rebateAgreementRevised"}
  publishRebateAgreementClosed:
    action: send
    channel: {$ref: "#/channels/rebateAgreement"}
    summary: A rebate agreement was closed early; invoices dated after valid_to no longer accrue.
    messages:
      - {$ref: "#/channels/rebateAgreement/messages/rebateAgreementClosed"}
  publishRebateAgreementReopened:
    action: send
    channel: {$ref: "#/channels/rebateAgreement"}
    summary: A closed rebate agreement was reopened with a later valid_to; invoices up to it accrue again.
    messages:
      - {$ref: "#/channels/rebateAgreement/messages/rebateAgreementReopened"}
  publishVendorRebateClaimCreated:
    action: send
    channel: {$ref: "#/channels/vendorRebateClaim"}
    summary: A vendor rebate claim RC-n was created OPEN for one agreement period.
    messages:
      - {$ref: "#/channels/vendorRebateClaim/messages/vendorRebateClaimCreated"}
  publishVendorRebateClaimApproved:
    action: send
    channel: {$ref: "#/channels/vendorRebateClaim"}
    summary: A vendor rebate claim was approved; w19 AP settles it by credit note, payment deduction or vendor invoice.
    messages:
      - {$ref: "#/channels/vendorRebateClaim/messages/vendorRebateClaimApproved"}
  publishProcedureActivated:
    action: send
    channel: {$ref: "#/channels/procedure"}
    summary: A procedure version became ACTIVE and the previous ACTIVE version of the same name was superseded.
    messages:
      - {$ref: "#/channels/procedure/messages/procedureActivated"}
components:
  messages:
    ConditionRecordActivated:
      name: dev.passage.pricing.conditionrecord.activated.v1
      title: Condition record activated
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [id, legal_entity_id, type, customer_kind, product_kind, currency, valid_from, valid_to, version, retroactive]
        properties:
          id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          type: {type: string, enum: [PRICE, LINE_DISC, MULTILINE_DISC, TOTAL_DISC, SURCHARGE]}
          customer_kind: {type: string, enum: [customer, customer_group, all]}
          customer_key: {type: string}
          product_kind: {type: string, enum: [product, product_group, variant, all]}
          product_key: {type: string}
          variant: {type: string}
          currency: {type: string}
          unit: {type: string}
          from_quantity: {type: string}
          valid_from: {type: string, format: date}
          valid_to: {type: string, format: date}
          version: {type: integer}
          journal_id: {type: string, format: uuid, description: "Price journal that posted or reversed the record; absent for a single-record activation."}
          campaign_id: {type: string, format: uuid, description: "Campaign the record belongs to (FR-26.10); absent when it stands alone."}
          retroactive: {type: boolean, description: "valid_from is before the activation or posting day (BR-26.7); consumers never re-price posted documents."}
    ConditionRecordWithdrawn:
      name: dev.passage.pricing.conditionrecord.withdrawn.v1
      title: Condition record withdrawn or expired
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [id, version]
        properties:
          id: {type: string, format: uuid}
          version: {type: integer}
          reason: {type: string, description: "The withdrawal reason; EXPIRED when the record expiry job (BR-26.9) ended it."}
    JournalPosted:
      name: dev.passage.pricing.journal.posted.v1
      title: Price journal posted or reversed
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [journal_id, legal_entity_id, line_count]
        properties:
          journal_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          line_count: {type: integer}
          reversed_journal_id: {type: string, format: uuid, description: "Set when this journal reverses another."}
    RebateAccrualPosted:
      name: dev.passage.pricing.rebateaccrual.posted.v1
      title: Rebate accrual posted
      contentType: application/cloudevents+json
      payload:
        type: object
        description: >
          One invoice line's accrual. The ledger (w11) posts Dr debit_account / Cr credit_account
          for amount: 4150 / 2150 by default for a CUSTOMER agreement, 2160 / 5100 for a VENDOR
          agreement (FR-26.15). amount is negative when a credit note or a tier
          recompute lowers the period. journal_posting_id (PRD 5.26.5) is assigned by the ledger.
          A retroactive recompute (FR-26.23) posts one event per changed period with
          retroactive=true; its invoice_line_id is the synthetic id retro:<run key>:<period>.
        required: [accrual_id, legal_entity_id, agreement_id, party_role, period_id, invoice_line_id, amount, currency, debit_account, credit_account, retroactive]
        properties:
          accrual_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          agreement_id: {type: string, format: uuid}
          party_role: {type: string, enum: [CUSTOMER, VENDOR], description: "CUSTOMER for a sales invoice accrual, VENDOR for a vendor invoice accrual."}
          period_id: {type: string, description: "2027-03, 2027-Q1 or 2027."}
          invoice_line_id: {type: string}
          amount: {type: string, description: "Decimal string in the agreement currency's minor units."}
          currency: {type: string, pattern: "^[A-Z]{3}$"}
          debit_account: {type: string, description: "Rebate expense 4150 (customer) or vendor rebate receivable 2160 (vendor) by default."}
          credit_account: {type: string, description: "Rebate accrual 2150 (customer) or purchase rebate income 5100 (vendor) by default."}
          retroactive: {type: boolean, description: "True for the per-period delta of a retroactive recompute (BR-26.7, BR-26.14)."}
    CommissionCalculated:
      name: dev.passage.pricing.commission.calculated.v1
      title: Commission calculated for a rep
      contentType: application/cloudevents+json
      payload:
        type: object
        description: >
          One rep's commission transaction on one invoice line (BR-26.12). The ledger (w11) posts
          Dr debit_account / Cr credit_account for amount; amount is negative on a credit note,
          which names the line it reverses. Rep names never appear (PRD 5.26.20).
        required: [transaction_id, legal_entity_id, invoice_line_id, sales_group_id, sales_rep_id, basis, basis_amount, rate, amount, currency, period_id, debit_account, credit_account]
        properties:
          transaction_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          invoice_line_id: {type: string}
          reverses_invoice_line_id: {type: string, description: "Set on a credit note: the invoice line whose commission it reverses."}
          sales_group_id: {type: string, format: uuid}
          sales_rep_id: {type: string, description: "Worker id (w42); never a name."}
          basis: {type: string, enum: [REVENUE, MARGIN]}
          basis_amount: {type: string, description: "Line net (REVENUE) or line net less cost (MARGIN)."}
          rate: {type: string, description: "Commission rate in percent."}
          amount: {type: string, description: "The rep's share, in the currency's minor units."}
          currency: {type: string, pattern: "^[A-Z]{3}$"}
          period_id: {type: string, description: "Invoice month, such as 2027-03."}
          debit_account: {type: string, description: "Commission expense (6200)."}
          credit_account: {type: string, description: "Commission payable (2170)."}
    CommissionExportIssued:
      name: dev.passage.pricing.commissionexport.issued.v1
      title: Commission settlement export recorded
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/CommissionExport"
    CommissionExportVoided:
      name: dev.passage.pricing.commissionexport.voided.v1
      title: Commission settlement export voided
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/CommissionExport"
    FundClosed:
      name: dev.passage.pricing.fund.closed.v1
      title: Trade fund closed
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/FundStatus"
    FundReopened:
      name: dev.passage.pricing.fund.reopened.v1
      title: Trade fund reopened
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/FundStatus"
    FundUsageRecorded:
      name: dev.passage.pricing.fundusage.recorded.v1
      title: Trade fund usage recorded
      contentType: application/cloudevents+json
      payload:
        type: object
        description: >
          One usage attribution to a trade promotion fund (BR-26.15) with the period's usage and
          budget after it. Amounts are decimal strings in the fund currency.
        required: [usage_id, fund_id, legal_entity_id, period, source, reference, amount, currency, period_usage, budget]
        properties:
          usage_id: {type: string, format: uuid}
          fund_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          period: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}
          source: {type: string, enum: [CAMPAIGN_ACCRUAL, REBATE_ACCRUAL, CLAIM, DEDUCTION]}
          reference: {type: string, description: "The accrual, claim or deduction the usage came from."}
          amount: {type: string}
          currency: {type: string, pattern: "^[A-Z]{3}$"}
          period_usage: {type: string, description: "Usage in the period including this attribution."}
          budget: {type: string, description: "Budget per period at the time of attribution."}
    ParametersChanged:
      name: dev.passage.pricing.parameters.changed.v1
      title: Pricing parameters changed
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ParametersChanged"
    TenantParametersChanged:
      name: dev.passage.pricing.tenantparameter.changed.v1
      title: Pricing tenant parameters changed
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/TenantParametersChanged"
    ProcedureAssignmentChanged:
      name: dev.passage.pricing.procedureassignment.changed.v1
      title: Pricing procedure assignment changed
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ProcedureAssignmentChanged"
    CampaignKilled:
      name: dev.passage.pricing.campaign.killed.v1
      title: Campaign killed
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/CampaignStatus"
    CampaignRestored:
      name: dev.passage.pricing.campaign.restored.v1
      title: Campaign restored
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/CampaignStatus"
    CampaignRevised:
      name: dev.passage.pricing.campaign.revised.v1
      title: Campaign revised
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/CampaignRevised"
    FreeGoodsRuleCreated:
      name: dev.passage.pricing.freegoodsrule.created.v1
      title: Free goods rule created
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/FreeGoodsRuleEvent"
    FreeGoodsRuleWithdrawn:
      name: dev.passage.pricing.freegoodsrule.withdrawn.v1
      title: Free goods rule withdrawn
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/FreeGoodsRuleEvent"
    CommodityBasisCreated:
      name: dev.passage.pricing.commoditybasis.created.v1
      title: Commodity cost basis type created
      contentType: application/cloudevents+json
      payload:
        type: object
        description: "A cost basis type (FR-26.21): what an index is quoted for, in a currency and unit."
        required: [basis_id, legal_entity_id, code, currency, unit]
        properties:
          basis_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          code: {type: string, description: "Short code unique in the legal entity, for example CU-LME."}
          currency: {type: string, pattern: "^[A-Z]{3}$"}
          unit: {type: string}
    CommodityIndexRecorded:
      name: dev.passage.pricing.commodityindex.recorded.v1
      title: Commodity index value recorded
      contentType: application/cloudevents+json
      payload:
        type: object
        description: >
          One dated index quote (FR-26.21). Quotes are versioned: a correction for the same day is the
          next revision and a run reads the highest.
        required: [basis_id, legal_entity_id, as_of, revision, value, source]
        properties:
          basis_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          as_of: {type: string, format: date}
          revision: {type: integer, minimum: 1}
          value: {type: string, description: "Decimal string in the basis currency per basis unit."}
          source: {type: string, description: "Where the quote came from; may be empty."}
    CommodityCalculationCreated:
      name: dev.passage.pricing.commoditycalculation.created.v1
      title: Commodity price calculation created
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/CommodityCalculation"
    CommodityCalculationWithdrawn:
      name: dev.passage.pricing.commoditycalculation.withdrawn.v1
      title: Commodity price calculation withdrawn
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/CommodityCalculation"
    CommodityRunCompleted:
      name: dev.passage.pricing.commodityrun.completed.v1
      title: Commodity price calculation run completed
      contentType: application/cloudevents+json
      payload:
        type: object
        description: >
          A run read the latest index on or before as_of, priced the calculation's key and, when ACTIVE
          records differed, created a price journal of UPDATE lines (VALIDATED when clean, otherwise OPEN
          with line errors). The journal is posted separately by the journal post (FR-26.9).
        required: [run_id, calculation_id, legal_entity_id, as_of, index_as_of, index_revision, index_value, price, changed_count, unchanged_count, stale]
        properties:
          run_id: {type: string, format: uuid}
          calculation_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          as_of: {type: string, format: date}
          index_as_of: {type: string, format: date, description: "Day of the index value the run used."}
          index_revision: {type: integer, minimum: 1}
          index_value: {type: string}
          price: {type: string, description: "index x factor plus margin, rounded to the calculation's decimals."}
          changed_count: {type: integer, minimum: 0}
          unchanged_count: {type: integer, minimum: 0}
          stale: {type: boolean, description: "The index was older than the calculation allows (PRC-0016)."}
          journal_id: {type: string, format: uuid, description: "Absent when no record changed price."}
    RebateAgreementRevised:
      name: dev.passage.pricing.rebateagreement.revised.v1
      title: Rebate agreement revised
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/RebateAgreementEvent"
    RebateAgreementClosed:
      name: dev.passage.pricing.rebateagreement.closed.v1
      title: Rebate agreement closed
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/RebateAgreementEvent"
    RebateAgreementReopened:
      name: dev.passage.pricing.rebateagreement.reopened.v1
      title: Rebate agreement reopened
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/RebateAgreementEvent"
    ProcedureActivated:
      name: dev.passage.pricing.procedure.activated.v1
      title: Pricing procedure version activated
      contentType: application/cloudevents+json
      payload:
        type: object
        description: >
          A procedure version became ACTIVE (FR-26.1). Activated versions are immutable; the
          ACTIVE version it replaced, if any, is now SUPERSEDED.
        required: [procedure_id, legal_entity_id, name, version]
        properties:
          procedure_id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          name: {type: string, description: "For example AX_STANDARD or SAP_RVAA01."}
          version: {type: integer, minimum: 1}
          superseded_id: {type: string, format: uuid, description: "The version this activation superseded; absent for the first."}
    VendorRebateClaimCreated:
      name: dev.passage.pricing.vendorrebateclaim.created.v1
      title: Vendor rebate claim created
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/VendorRebateClaim"
    VendorRebateClaimApproved:
      name: dev.passage.pricing.vendorrebateclaim.approved.v1
      title: Vendor rebate claim approved
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/VendorRebateClaim"
    BrokerContractCreated:
      name: dev.passage.pricing.brokercontract.created.v1
      title: Broker contract created
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/BrokerContract"
    BrokerContractClosed:
      name: dev.passage.pricing.brokercontract.closed.v1
      title: Broker contract closed
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/BrokerContract"
    RoyaltyAgreementCreated:
      name: dev.passage.pricing.royaltyagreement.created.v1
      title: Royalty agreement created
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/RoyaltyAgreement"
    RoyaltyAgreementClosed:
      name: dev.passage.pricing.royaltyagreement.closed.v1
      title: Royalty agreement closed
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/RoyaltyAgreement"
    ContractAccrualPosted:
      name: dev.passage.pricing.contractaccrual.posted.v1
      title: Broker or royalty accrual posted
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ContractAccrual"
    ContractClaimCreated:
      name: dev.passage.pricing.contractclaim.created.v1
      title: Broker or royalty claim created
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ContractClaim"
    ContractClaimApproved:
      name: dev.passage.pricing.contractclaim.approved.v1
      title: Broker or royalty claim approved
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ContractClaim"
  schemas:
    BrokerContract:
      type: object
      description: A broker contract after create or close (FR-26.16). Ids only; vendor names never appear in events.
      required: [contract_id, legal_entity_id, broker_vendor_id, rate_kind, rate, currency, valid_from, valid_to, status, version]
      properties:
        contract_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        broker_vendor_id: {type: string, format: uuid}
        rate_kind: {type: string, enum: [PERCENT_NET, PER_UNIT]}
        rate: {type: string, description: "A percentage of net, or an amount per unit in the contract currency."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        valid_from: {type: string, format: date}
        valid_to: {type: string, format: date}
        status: {type: string, enum: [ACTIVE, CLOSED]}
        version: {type: integer, minimum: 1}
    RoyaltyAgreement:
      type: object
      description: A royalty agreement after create or close (FR-26.17). Ids only; vendor names never appear in events.
      required: [agreement_id, legal_entity_id, licensor_vendor_id, basis, period, minimum_royalty, currency, valid_from, valid_to, status, version]
      properties:
        agreement_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        licensor_vendor_id: {type: string, format: uuid}
        basis: {type: string, enum: [NET_SALES, QUANTITY]}
        period: {type: string, enum: [MONTH, QUARTER, YEAR]}
        minimum_royalty: {type: string, description: "The least a period pays; 0 for none."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        valid_from: {type: string, format: date}
        valid_to: {type: string, format: date}
        status: {type: string, enum: [ACTIVE, CLOSED]}
        version: {type: integer, minimum: 1}
    ContractAccrual:
      type: object
      description: >
        One broker or royalty accrual for the ledger (FR-26.16, FR-26.17). Amount is negative for a
        credit note line. SHORTFALL is the minimum royalty top-up posted when a period closes below
        its minimum (PRC-0017). The accounts default to Dr 6210 / Cr 2175 (broker) and Dr 6220 /
        Cr 2176 (royalty). Withholding on royalties is applied by the w19 AP claim.
      required: [accrual_id, legal_entity_id, contract_kind, contract_id, vendor_id, period_id, line_key, kind, posting_date, amount, currency, debit_account, credit_account]
      properties:
        accrual_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        contract_kind: {type: string, enum: [BROKER, ROYALTY]}
        contract_id: {type: string, format: uuid}
        vendor_id: {type: string, format: uuid}
        period_id: {type: string, description: "2027-03, 2027-Q1 or 2027."}
        line_key: {type: string, description: "The invoice line id, or MIN:<period> for a shortfall."}
        kind: {type: string, enum: [ACCRUAL, CREDIT, SHORTFALL]}
        posting_date: {type: string, format: date, description: "The invoice or credit note date; the last day of the period for a shortfall."}
        amount: {type: string, description: "Decimal string; negative for a credit note line."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        debit_account: {type: string}
        credit_account: {type: string}
    ContractClaim:
      type: object
      description: >
        A broker or royalty claim for one contract period. amount = accrued_total - prior_claimed.
        w19 AP pays an APPROVED positive claim to the vendor and offsets a negative one. Numbers run
        BC- (broker) and RY- (royalty) per legal entity. Ids only.
      required: [claim_id, number, legal_entity_id, contract_kind, contract_id, vendor_id, period_id, accrued_total, prior_claimed, amount, currency, status, version]
      properties:
        claim_id: {type: string, format: uuid}
        number: {type: string, pattern: "^(BC|RY)-[0-9]{6,}$"}
        legal_entity_id: {type: string, format: uuid}
        contract_kind: {type: string, enum: [BROKER, ROYALTY]}
        contract_id: {type: string, format: uuid}
        vendor_id: {type: string, format: uuid}
        period_id: {type: string, description: "2027-03, 2027-Q1 or 2027."}
        accrued_total: {type: string, description: "The period's accruals when the claim was created."}
        prior_claimed: {type: string, description: "Sum of the period's earlier claims."}
        amount: {type: string, description: "Decimal string; negative for an over-accrued period."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        status: {type: string, enum: [OPEN, APPROVED]}
        version: {type: integer, minimum: 1}
    VendorRebateClaim:
      type: object
      description: >
        A vendor rebate claim for one agreement period (FR-26.15). amount = accrued_total -
        prior_claimed (BR-26.11). w19 AP settles an APPROVED claim: a positive amount by credit
        note or payment deduction (settlement_mode), a negative one by a vendor invoice
        (VENDOR_INVOICE). Ids only; vendor names never appear in events.
      required: [claim_id, number, legal_entity_id, agreement_id, vendor_id, period_id, accrued_total, prior_claimed, amount, currency, settlement_mode, status, version]
      properties:
        claim_id: {type: string, format: uuid}
        number: {type: string, pattern: "^RC-[0-9]{6,}$", description: "Claim number, sequence RC- per legal entity."}
        legal_entity_id: {type: string, format: uuid}
        agreement_id: {type: string, format: uuid}
        vendor_id: {type: string, format: uuid}
        period_id: {type: string, description: "2027-03, 2027-Q1 or 2027."}
        accrued_total: {type: string, description: "The period's accruals when the claim was created."}
        prior_claimed: {type: string, description: "Sum of the period's earlier claims."}
        amount: {type: string, description: "Decimal string; negative for an over-accrued period."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        settlement_mode: {type: string, enum: [CREDIT_NOTE, PAYMENT_DEDUCTION, VENDOR_INVOICE]}
        status: {type: string, enum: [OPEN, APPROVED]}
        version: {type: integer, minimum: 1}
    CommodityCalculation:
      type: object
      description: >
        A commodity price calculation (FR-26.21) after create or withdraw: round(index x factor) plus the
        margin, repricing the ACTIVE PRICE records on the named key.
      required: [calculation_id, legal_entity_id, basis_id, product_id, customer_kind, customer_key, unit, currency, factor, margin_kind, margin, withdrawn, version]
      properties:
        calculation_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        basis_id: {type: string, format: uuid}
        product_id: {type: string}
        customer_kind: {type: string, enum: [customer, customer_group, all]}
        customer_key: {type: string}
        unit: {type: string}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        factor: {type: string}
        margin_kind: {type: string, enum: [PERCENT, AMOUNT]}
        margin: {type: string}
        withdrawn: {type: boolean}
        version: {type: integer, minimum: 1}
    FreeGoodsRuleEvent:
      type: object
      description: >
        A free goods rule (FR-26.22) after create or withdraw. Sales (w27) proposes supplementary
        free goods lines from the live rules (FR-27.14) and drops its snapshot on either event.
      required: [rule_id, legal_entity_id, customer_kind, customer_key, product_id, unit, kind, calc_rule, every_quantity, free_quantity, min_quantity, valid_from, valid_to, withdrawn, version]
      properties:
        rule_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        customer_kind: {type: string, enum: [customer, customer_group, all]}
        customer_key: {type: string}
        product_id: {type: string}
        unit: {type: string}
        kind: {type: string, enum: [INCLUSIVE, EXCLUSIVE]}
        calc_rule: {type: string, enum: [PROPORTIONAL, UNIT_REFERENCE, WHOLE_UNITS]}
        every_quantity: {type: string}
        free_quantity: {type: string}
        min_quantity: {type: string}
        valid_from: {type: string, format: date}
        valid_to: {type: string, format: date}
        withdrawn: {type: boolean}
        version: {type: integer, minimum: 1}
    RebateAgreementEvent:
      type: object
      description: >
        A rebate agreement after a revise (name, end date, tiers before the first accrual), an early
        close or a reopen (FR-26.11). After a close, valid_to is the close date and no invoice dated later
        accrues; after a reopen, status is ACTIVE and valid_to the new last day.
        Ids only.
      required: [agreement_id, legal_entity_id, party_role, status, valid_from, valid_to, version]
      properties:
        agreement_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        party_role: {type: string, enum: [CUSTOMER, VENDOR]}
        status: {type: string, enum: [ACTIVE, CLOSED]}
        valid_from: {type: string, format: date}
        valid_to: {type: string, format: date}
        version: {type: integer, minimum: 1}
    ParametersChanged:
      type: object
      description: A legal entity's pricing parameters after a change (PRD 5.26.13).
      required: [legal_entity_id, journal_four_eyes, pricing_date_basis, total_discount_basis, smart_rounding_bands, price_search_mode, small_order_thresholds, version, updated_by]
      properties:
        legal_entity_id: {type: string, format: uuid}
        journal_four_eyes: {type: boolean, description: "True when the user who created a price journal cannot post it."}
        pricing_date_basis: {type: string, enum: [SHIP_DATE, ORDER_DATE, DELIVERY_DATE], description: "Document date used as the pricing date when the caller sends none (BR-26.2)."}
        total_discount_basis: {type: string, enum: [AFTER_LINE_DISC, GROSS], description: "Amount TOTAL_DISC applies to."}
        smart_rounding_bands: {$ref: "#/components/schemas/SmartRoundingBands"}
        price_search_mode: {type: string, enum: [FIRST_MATCH, SEARCH_NEXT], description: "Default of search_next on a new condition record (BR-26.1 step 5)."}
        small_order_thresholds: {type: object, additionalProperties: {type: string}, description: "Small order surcharge threshold per currency (FR-26.6), decimal strings. Empty means the reference table (250 USD, 200 EUR)."}
        version: {type: integer, minimum: 1}
        updated_by: {type: string}
    TenantParametersChanged:
      type: object
      description: >
        A tenant's pricing parameters after a change (PRD 5.26.13). Replicas read it to drop the
        parameters and snapshots they hold for the tenant.
      required: [cache_ttl_seconds, campaign_kill_switch_effect, version, updated_by]
      properties:
        cache_ttl_seconds: {type: integer, minimum: 0, maximum: 600, description: "Record snapshot lifetime, 10 to 600; 0 when the tenant follows the deployment's PRICING_CACHE_TTL."}
        campaign_kill_switch_effect: {type: string, enum: [NEXT_RESOLVE, IMMEDIATE_CACHE_FLUSH], description: "IMMEDIATE_CACHE_FLUSH has every replica empty its snapshots when it reads campaign.killed or campaign.restored."}
        version: {type: integer, minimum: 1}
        updated_by: {type: string}
    SmartRoundingBands:
      type: array
      description: The smart rounding table in force for price journal adjustments (FR-26.7), lowest band first.
      items:
        type: object
        required: [ending]
        properties:
          up_to: {type: string, description: "Decimal string; amounts below it use this band. Absent on the last band."}
          ending: {type: string, description: "Decimal string from 0 up to 1: the value the rounded price ends in."}
    ProcedureAssignmentChanged:
      type: object
      description: >
        The procedure assignment of a legal entity and sales channel after a change, or as it
        was when cleared (PRD 5.26.13). Sales caches key their price lookups by procedure name.
      required: [legal_entity_id, sales_channel, procedure_name, cleared, version, updated_by]
      properties:
        legal_entity_id: {type: string, format: uuid}
        sales_channel: {type: string, description: "Empty for the legal entity's default."}
        procedure_name: {type: string}
        cleared: {type: boolean, description: "True when the assignment was removed."}
        version: {type: integer, minimum: 1}
        updated_by: {type: string}
    CampaignStatus:
      type: object
      description: >
        A campaign's kill switch after kill or restore (FR-26.10). Records of a killed campaign
        drop out of the next resolve; caches drop their snapshot for the legal entity.
      required: [campaign_id, legal_entity_id, killed, version]
      properties:
        campaign_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        killed: {type: boolean}
        version: {type: integer, minimum: 1}
    CampaignRevised:
      type: object
      description: >
        A campaign's terms after a revise (FR-26.10). Validity and target group gate resolve, so caches
        drop their snapshot for the legal entity.
      required: [campaign_id, legal_entity_id, name, valid_from, valid_to, target_customer_group, budget, currency, killed, version]
      properties:
        campaign_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        name: {type: string}
        valid_from: {type: string, format: date}
        valid_to: {type: string, format: date}
        target_customer_group: {type: string, description: "Empty means every customer."}
        budget: {type: string, description: "Planned spend, decimal."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        killed: {type: boolean}
        version: {type: integer, minimum: 1}
    CommissionExport:
      type: object
      description: >
        A recorded commission settlement export (FR-26.18): the period of invoice dates handed
        to AP (w19) or payroll (w43), with totals per currency and the digest of the file. Rep
        ids and names never appear; the file is fetched through the API.
      required: [export_id, legal_entity_id, target, period_from, period_to, line_count, totals, csv_sha256, version, user_id]
      properties:
        export_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        target: {type: string, enum: [AP, PAYROLL]}
        period_from: {type: string, format: date}
        period_to: {type: string, format: date}
        line_count: {type: integer, minimum: 1, description: "Rows of the file (rep and currency)."}
        totals: {type: array, description: "One entry per currency of the file, ordered by currency.", items: {type: object, required: [currency, amount], properties: {currency: {type: string, pattern: "^[A-Z]{3}$"}, amount: {type: string, description: "Decimal string in the currency's minor units."}}}}
        csv_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        version: {type: integer, minimum: 1, description: "1 when issued, 2 when voided."}
        user_id: {type: string, description: "The user who recorded the export, or who voided it."}
        void_reason: {type: string, description: "Set on voided only."}
    FundStatus:
      type: object
      description: A trade promotion fund's open/closed state after close or reopen (BR-26.15).
      required: [fund_id, legal_entity_id, closed, version]
      properties:
        fund_id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        closed: {type: boolean}
        version: {type: integer, minimum: 1}
