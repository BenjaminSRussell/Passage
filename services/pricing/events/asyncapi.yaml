asyncapi: 3.0.0
info:
  title: Passage Pricing Events
  version: 0.1.0
  description: >
    Events published by the pricing service through the transactional outbox. Each event is
    written in the same transaction as the state change (outbox.Enqueue). CloudEvents 1.0
    envelope; type dev.passage.<context>.<entity>.<verb>.v<n>; source /passage/pricing/pricing.
defaultContentType: application/cloudevents+json
channels:
  conditionRecordActivated:
    address: passage.pricing.conditionrecord
    description: Topic for condition-record lifecycle events (kernel topic rule passage.<context>.<entity>).
    messages:
      conditionRecordActivated:
        $ref: "#/components/messages/ConditionRecordActivated"
      conditionRecordWithdrawn:
        $ref: "#/components/messages/ConditionRecordWithdrawn"
operations:
  publishConditionRecordActivated:
    action: send
    channel: {$ref: "#/channels/conditionRecordActivated"}
    summary: A condition record became ACTIVE.
    messages:
      - {$ref: "#/channels/conditionRecordActivated/messages/conditionRecordActivated"}
  publishConditionRecordWithdrawn:
    action: send
    channel: {$ref: "#/channels/conditionRecordActivated"}
    summary: A condition record was withdrawn.
    messages:
      - {$ref: "#/channels/conditionRecordActivated/messages/conditionRecordWithdrawn"}
components:
  messages:
    ConditionRecordActivated:
      name: dev.passage.pricing.conditionrecord.activated.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [id, legal_entity_id, type, customer_kind, product_kind, currency, valid_from, valid_to, version, retroactive]
        properties:
          id: {type: string, format: uuid}
          legal_entity_id: {type: string, format: uuid}
          type: {type: string, enum: [PRICE, LINE_DISC, TOTAL_DISC]}
          customer_kind: {type: string, enum: [customer, customer_group, all]}
          customer_key: {type: string}
          product_kind: {type: string, enum: [product, product_group, variant, all]}
          product_key: {type: string}
          variant: {type: string}
          currency: {type: string}
          unit: {type: string}
          from_quantity: {type: string}
          valid_from: {type: string, format: date}
          valid_to: {type: string, format: date}
          version: {type: integer}
          retroactive: {type: boolean, description: "valid_from is before the activation day (BR-26.7); consumers never re-price posted documents."}
    ConditionRecordWithdrawn:
      name: dev.passage.pricing.conditionrecord.withdrawn.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [id, version]
        properties:
          id: {type: string, format: uuid}
          version: {type: integer}
          reason: {type: string}
