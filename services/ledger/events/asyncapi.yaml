asyncapi: 3.0.0
info:
  title: Passage Ledger events
  version: 0.1.0
  description: |
    Events published by the ledger service through the transactional outbox (Debezium relays
    outbox rows to Kafka). Every event is a CloudEvents 1.0 envelope with source
    /passage/ledger/ledger and the tenant in `tenantid`. Schema evolution is additive only.
defaultContentType: application/cloudevents+json
channels:
  journalPosted:
    address: passage.ledger.journal
    description: Journal entries committed (posting and reversal entries are both posted entries).
    messages:
      journalPosted:
        $ref: "#/components/messages/JournalPosted"
  journalReversed:
    address: passage.ledger.journal
    description: Reversal committed; the reversing entry is also announced as journal.posted.
    messages:
      journalReversed:
        $ref: "#/components/messages/JournalReversed"
  balanceRebuilt:
    address: passage.ledger.balance
    description: Balance projection rebuild finished.
    messages:
      balanceRebuilt:
        $ref: "#/components/messages/BalanceRebuilt"
  batchStatusChanged:
    address: passage.ledger.batch
    description: |
      A manual journal batch changed status (BR-11.10), written to the outbox in the transaction
      that changed it (aggregate type journal_batch). The PRD's batch.status-changed is spelled
      statuschanged because the platform naming rule allows only letters and digits in the verb.
    messages:
      batchStatusChanged:
        $ref: "#/components/messages/BatchStatusChanged"
  recurringGenerated:
    address: passage.ledger.recurring
    description: |
      A recurring journal (FR-11.10) created a draft batch for a scheduled date, written to the outbox
      in the transaction that created the batch (aggregate type recurring_journal).
    messages:
      recurringGenerated:
        $ref: "#/components/messages/RecurringGenerated"
  openItemCleared:
    address: passage.ledger.openitem
    description: |
      A clearing document (FR-11.19) was committed or reset, written to the outbox in the transaction
      that changed it (aggregate type clearing). The PRD's open-item.cleared is spelled openitem
      because the platform naming rule allows only letters and digits in the entity.
    messages:
      openItemCleared:
        $ref: "#/components/messages/OpenItemCleared"
operations:
  publishOpenItemCleared:
    action: send
    channel: { $ref: "#/channels/openItemCleared" }
    summary: Open items were cleared or a clearing was reset.
  publishRecurringGenerated:
    action: send
    channel: { $ref: "#/channels/recurringGenerated" }
    summary: A recurring journal generated a draft batch.
  publishBatchStatusChanged:
    action: send
    channel: { $ref: "#/channels/batchStatusChanged" }
    summary: A manual journal batch moved to another status.
  publishJournalPosted:
    action: send
    channel: { $ref: "#/channels/journalPosted" }
    summary: A journal entry was committed.
  publishJournalReversed:
    action: send
    channel: { $ref: "#/channels/journalReversed" }
    summary: A journal entry was reversed.
  publishBalanceRebuilt:
    action: send
    channel: { $ref: "#/channels/balanceRebuilt" }
    summary: A balance rebuild finished.
components:
  messages:
    JournalPosted:
      name: dev.passage.ledger.journal.posted.v1
      title: Journal entry posted
      summary: Journal entry posted.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, tenantid, subject, data]
        properties:
          type: { const: dev.passage.ledger.journal.posted.v1 }
          source: { const: /passage/ledger/ledger }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: Entry id }
          data:
            type: object
            required: [entryId, ledgerId, documentId, voucher, postingSequence, postingDate, periodKey, lineCount, totals, source, traceId]
            properties:
              entryId: { type: string, format: uuid }
              ledgerId: { type: string, format: uuid }
              documentId: { type: string, format: uuid }
              voucher: { type: string }
              postingSequence: { type: integer, format: int64, description: Gap-free per ledger }
              postingDate: { type: string, format: date }
              periodKey: { type: string, example: "2026-03" }
              lineCount: { type: integer }
              totals:
                type: object
                properties:
                  currency: { type: string }
                  debit: { type: string }
                  credit: { type: string }
              source:
                type: object
                properties:
                  system: { type: string }
                  type: { type: string }
                  id: { type: string }
                  uri: { type: string }
              traceId: { type: string, minLength: 32, maxLength: 32 }
    JournalReversed:
      name: dev.passage.ledger.journal.reversed.v1
      title: Journal entry reversed
      summary: Journal entry reversed.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, tenantid, subject, data]
        properties:
          type: { const: dev.passage.ledger.journal.reversed.v1 }
          source: { const: /passage/ledger/ledger }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: Original entry id }
          data:
            type: object
            required: [originalEntryId, reversingEntryId, ledgerId, postingDate]
            properties:
              originalEntryId: { type: string, format: uuid }
              reversingEntryId: { type: string, format: uuid }
              ledgerId: { type: string, format: uuid }
              postingDate: { type: string, format: date }
              reasonCode: { type: string, description: Shared reason code (FR-11.15); present when the reversal carried one }
              reasonComment: { type: string, maxLength: 255 }
    BatchStatusChanged:
      name: dev.passage.ledger.batch.statuschanged.v1
      title: Journal batch changed status
      summary: Journal batch changed status.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, tenantid, subject, data]
        properties:
          type: { const: dev.passage.ledger.batch.statuschanged.v1 }
          source: { const: /passage/ledger/ledger }
          tenantid: { type: string, format: uuid }
          subject: { type: string, format: uuid, description: Batch id }
          data:
            type: object
            required: [batchId, ledgerId, journalName, from, to, actor]
            properties:
              batchId: { type: string, format: uuid }
              ledgerId: { type: string, format: uuid }
              journalName: { type: string }
              from: { type: string, enum: [draft, validated, in_approval, approved, rejected, posted, cancelled] }
              to: { type: string, enum: [draft, validated, in_approval, approved, rejected, posted, cancelled] }
              actor: { type: string, description: User who caused the transition }
              postedEntryId: { type: string, format: uuid, description: Set when to = posted }
    RecurringGenerated:
      name: dev.passage.ledger.recurring.generated.v1
      title: Recurring journal generated
      summary: Recurring journal generated a draft batch.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, tenantid, subject, data]
        properties:
          type: { const: dev.passage.ledger.recurring.generated.v1 }
          source: { const: /passage/ledger/ledger }
          tenantid: { type: string, format: uuid }
          subject: { type: string, format: uuid, description: Recurring journal id }
          data:
            type: object
            required: [recurringId, batchId, ledgerId, journalName, scheduledDate, actor]
            properties:
              recurringId: { type: string, format: uuid }
              batchId: { type: string, format: uuid }
              ledgerId: { type: string, format: uuid }
              journalName: { type: string }
              scheduledDate: { type: string, format: date, description: Run date, also the posting date of the draft batch }
              actor: { type: string, description: User who generated the batch }
    OpenItemCleared:
      name: dev.passage.ledger.openitem.cleared.v1
      title: Open items cleared
      summary: A clearing document was committed or reset.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, tenantid, subject, data]
        properties:
          type: { const: dev.passage.ledger.openitem.cleared.v1 }
          source: { const: /passage/ledger/ledger }
          tenantid: { type: string, format: uuid }
          subject: { type: string, format: uuid, description: Clearing document id }
          data:
            type: object
            required: [clearingDocumentId, ledgerId, account, mode, itemIds, differenceAmount, status, actor]
            properties:
              clearingDocumentId: { type: string, format: uuid }
              ledgerId: { type: string, format: uuid }
              account: { type: string, description: Account number of the cleared items }
              mode: { type: string, enum: [manual] }
              itemIds: { type: array, items: { type: string, format: uuid }, description: The items the user selected }
              differenceAmount: { type: string, description: Residual written off to the tolerance difference account, decimal string, signed (debit positive); 0 when none }
              differenceEntryId: { type: string, format: uuid, description: Journal entry of the difference lines }
              residualItemId: { type: string, format: uuid, description: New open item carrying a residual outside tolerance }
              status: { type: string, enum: [cleared, reset] }
              reasonCode: { type: string, description: Reset reason code }
              actor: { type: string }
    BalanceRebuilt:
      name: dev.passage.ledger.balance.rebuilt.v1
      title: Balance projection rebuilt
      summary: Balance projection rebuilt.
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, tenantid, subject, data]
        properties:
          type: { const: dev.passage.ledger.balance.rebuilt.v1 }
          source: { const: /passage/ledger/ledger }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: Ledger id }
          data:
            type: object
            required: [ledgerId, highWaterSequence, rowsWritten, rowsDiffering, durationMs]
            properties:
              ledgerId: { type: string, format: uuid }
              highWaterSequence: { type: integer, format: int64 }
              rowsWritten: { type: integer, format: int64 }
              rowsDiffering: { type: integer, format: int64, description: Greater than zero raises a P1 alert }
              durationMs: { type: integer, format: int64 }
