  /v1/ledger/ledgers/{ledger}/tolerance-groups/{code}:
    get:
      tags: [clearing]
      operationId: getToleranceGroup
      summary: Get a tolerance group
      x-passage-duty: ledger.journal.read
      parameters:
        - name: ledger
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z0-9_]{1,10}$' }
      responses:
        "200":
          description: The tolerance group; its version is in the ETag header
          headers:
            ETag: { $ref: "#/components/headers/ToleranceETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToleranceGroup" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    put:
      tags: [clearing]
      operationId: putToleranceGroup
      summary: Create or replace a tolerance group
      x-passage-duty: ledger.clearing.rules
      description: |
        A tolerance group is the largest residual a manual clearing may write off to its difference
        account (OBA0 semantics, BR-11.12): a debit residual up to the debit limit, a credit residual
        up to the credit limit and, when a percentage limit is set, up to that share of the selection's
        absolute total (debit plus credit). Groups are deactivated, never deleted. A
        replace is checked against If-Match when sent (412 LEDGER_VERSION_CONFLICT).
      parameters:
        - name: ledger
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z0-9_]{1,10}$' }
        - name: If-Match
          in: header
          required: false
          description: The tolerance group version last read, as an entity tag ("3"); when sent and stale, 412 and nothing changes
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToleranceGroupBody" }
      responses:
        "200":
          description: Group replaced
          headers:
            ETag: { $ref: "#/components/headers/ToleranceETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToleranceGroup" }
        "201":
          description: Group created
          headers:
            ETag: { $ref: "#/components/headers/ToleranceETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToleranceGroup" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "412": { $ref: "#/components/responses/Problem412" }
