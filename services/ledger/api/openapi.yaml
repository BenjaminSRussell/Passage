openapi: 3.1.0
info:
  title: Passage Ledger API
  version: 0.1.0
  description: |
    Universal journal, chart of accounts and balance projection (wave 11, PSG-11).
    Every route is mounted under /v1/ledger except /readyz. Errors are RFC 9457
    problem details (application/problem+json) with a stable `code`; rule rejections
    are 422 with a `violations[]` array of {code, lineIndex, field, message}.
    Each operation names the duty it requires in `x-passage-duty` (enforced with
    the platform's authz.RequireDuty; 403 AUTH-0003 without it). Money amounts are
    decimal strings at the currency's ISO 4217 minor-unit scale, never numbers.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env: { default: dev }
tags:
  - name: charts
  - name: ledgers
  - name: journal
  - name: balances
  - name: structures
  - name: recurring
  - name: clearing
  - name: derivation
  - name: validation
  - name: advanced-rules
  - name: attachments
  - name: ops
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1 to 128 characters after trimming surrounding whitespace, scoped to tenant and legal entity. Same key and payload replays the stored response; a different payload returns 409 LEDGER_IDEMPOTENCY_CONFLICT; a request racing another one with the same key returns 409 LEDGER_IDEMPOTENCY_IN_PROGRESS with Retry-After 1.
      schema: { type: string, minLength: 1, maxLength: 128 }
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C traceparent; its trace id is copied to the entry. A 32-character id is minted when absent.
      schema: { type: string }
    ChartCode:
      name: chart
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z0-9]{1,10}$' }
    AccountNumber:
      name: number
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$' }
    EntryId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LedgerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LedgerSetId:
      name: setId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JournalNameCode:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,20}$' }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: Chosen by the client; repeating a request with the same id and content is a no-op
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The batch version the caller last read, as an entity tag ("3"). When sent and stale, 412 LEDGER_VERSION_CONFLICT and nothing changes; when absent, no check is made.
      schema: { type: string }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: "https://passage.dev/problems/LEDGER_UNBALANCED" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    Violation:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: LEDGER_UNBALANCED }
        lineIndex: { type: integer, description: "Absent for entry-level violations" }
        field: { type: string }
        message: { type: string }
    ViolationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [violations]
          properties:
            violations:
              type: array
              items: { $ref: "#/components/schemas/Violation" }
    Amount:
      type: object
      required: [currency, value]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        value: { type: string, description: Decimal string with at most the currency's minor-unit scale }
    Source:
      type: object
      required: [system, type, id]
      properties:
        system: { type: string, maxLength: 128 }
        type: { type: string, maxLength: 128 }
        id: { type: string, maxLength: 128 }
        uri: { type: string }
    PostLine:
      type: object
      required: [account, debitCredit, amount]
      properties:
        account: { type: string, maxLength: 20 }
        dimensions:
          type: object
          additionalProperties: { type: string }
        debitCredit: { type: string, enum: [D, C] }
        amount: { $ref: "#/components/schemas/Amount" }
        text: { type: string, maxLength: 255 }
        sourceLineRef: { type: string, maxLength: 200 }
    PostEntryRequest:
      type: object
      required: [ledgerId, documentId, postingDate, source, lines]
      properties:
        ledgerId: { type: string, format: uuid }
        documentId: { type: string, format: uuid, description: Groups entries across ledgers and split documents }
        postingDate: { type: string, format: date }
        documentDate: { type: string, format: date }
        description: { type: string, maxLength: 255 }
        source: { $ref: "#/components/schemas/Source" }
        lines:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: "#/components/schemas/PostLine" }
    SetEntryRequest:
      type: object
      required: [documentId, postingDate, source]
      description: |
        PostEntryRequest without ledgerId; the ledger set in the path chooses the ledgers. A ledgerId is rejected with 400.
        lines are the common lines, posted to every ledger of the set through that ledger's account mappings.
        ledgerLines add lines to single ledgers of the set (BR-12.6 ledger_lines): they are posted to that ledger
        only, in that ledger's own accounts, with no mapping. lines may be omitted or empty when ledgerLines is present;
        a request with neither is rejected with 400 (field lines). A ledger whose entry ends up with no lines, or only
        zero-amount lines without text, is rejected with 422 LEDGER_LINE_EMPTY. The idempotency payload hash orders
        ledgerLines groups by ledger id, so group order does not matter on a retry.
      properties:
        documentId: { type: string, format: uuid }
        postingDate: { type: string, format: date }
        documentDate: { type: string, format: date }
        description: { type: string, maxLength: 255 }
        source: { $ref: "#/components/schemas/Source" }
        lines:
          type: array
          minItems: 0
          maxItems: 10000
          items: { $ref: "#/components/schemas/PostLine" }
        ledgerLines:
          type: array
          description: At most one group per ledger of the set; a ledger outside the set is rejected with 422 LEDGER_LINES_LEDGER_NOT_IN_SET.
          items: { $ref: "#/components/schemas/LedgerLines" }
    LedgerLines:
      type: object
      required: [ledgerId, lines]
      properties:
        ledgerId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: "#/components/schemas/PostLine" }
    Totals:
      type: object
      properties:
        currency: { type: string }
        debit: { type: string }
        credit: { type: string }
    EntryLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        lineNumber: { type: integer }
        account: { type: string }
        dimensionCombinationId: { type: string, description: Lowercase hex of the SHA-256 combination id }
        displayName: { type: string, example: "1010-D100-C200" }
        dimensions:
          type: object
          additionalProperties: { type: string }
        debitCredit: { type: string, enum: [D, C] }
        amount: { type: string }
        text: { type: string }
        sourceLineRef: { type: string }
        reversalOfLineId: { type: string, format: uuid }
        negativePosting: { type: boolean, description: Storno line; the projection reduces the original side (BR-11.16) }
        derivedByStepIds: { type: array, items: { type: string, format: uuid }, description: Derivation steps that filled dimensions on the line (FR-11.22) }
    LedgerLine:
      type: object
      description: A posted journal line with its entry context (ledger transactions inquiry, FR-11.14).
      required: [id, entryId, voucher, postingSequence, postingDate, lineNumber, account, displayName, debitCredit, amount, amountAcct, currency, negativePosting, sourceSystem, sourceType, sourceId, traceId]
      properties:
        id: { type: string, format: uuid }
        entryId: { type: string, format: uuid }
        voucher: { type: string }
        postingSequence: { type: integer, format: int64 }
        postingDate: { type: string, format: date }
        lineNumber: { type: integer }
        account: { type: string }
        displayName: { type: string, example: "6010-D100-C1" }
        dimensions:
          type: object
          additionalProperties: { type: string }
        debitCredit: { type: string, enum: [D, C] }
        amount: { type: string, description: Decimal at the currency's minor-unit scale }
        amountAcct: { type: string, description: Amount in the ledger's accounting currency at that currency's scale, always positive (the sign is debitCredit) }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        negativePosting: { type: boolean }
        text: { type: string, description: Line text }
        description: { type: string, description: Entry description }
        sourceSystem: { type: string }
        sourceType: { type: string }
        sourceId: { type: string }
        sourceUri: { type: string }
        sourceLineRef: { type: string }
        reversalOfEntryId: { type: string, format: uuid, description: Set on the lines of a reversing entry }
        isRealignment: { type: boolean, description: The line belongs to a dimension realignment entry or its reversal (FR-11.24) }
        traceId: { type: string, description: W3C trace id of the posting request }
    Entry:
      type: object
      properties:
        id: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        voucher: { type: string }
        postingSequence: { type: integer, format: int64 }
        postingDate: { type: string, format: date }
        periodKey: { type: string, example: "2026-03" }
        documentDate: { type: string, format: date }
        description: { type: string }
        source: { $ref: "#/components/schemas/Source" }
        reversalOfEntryId: { type: string, format: uuid }
        reasonCode: { type: string }
        reasonComment: { type: string }
        isRealignment:
          type: boolean
          description: |
            A reclassification entry of a dimension realignment run, or its reversal (FR-11.24). It counts in
            balances and the trial balance like any entry; it is reversed only through its run.
        realignmentRunId: { type: string, format: uuid, description: The realignment run, when isRealignment is true }
        postedAt: { type: string, format: date-time }
        postedBy: { type: string }
        traceId: { type: string }
        totals: { $ref: "#/components/schemas/Totals" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/EntryLine" }
    EntryResult:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
        idempotency:
          type: object
          properties:
            key: { type: string }
            replayed: { type: boolean }
        traceId: { type: string }
        notices:
          type: array
          description: |
            Info and warning messages on an accepted posting, such as LEDGER_DESCRIPTION_TRUNCATED when an
            expanded default description was cut to 255 characters (FR-11.17, LEDGER-0031), or
            LEDGER_VALIDATION_RULE_FAILED from a validation rule with severity warning (FR-11.21, LEDGER-0024).
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string, example: LEDGER_DESCRIPTION_TRUNCATED }
              message: { type: string }
    Ledger:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9]{1,10}$' }
        name: { type: string }
        chartCode: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        dimensionAttributes:
          type: array
          maxItems: 20
          items: { type: string }
        firstOpenDate: { type: string, format: date }
        futurePostingDays: { type: integer, minimum: 0, maximum: 730 }
        reversalReasonRequired: { type: boolean }
        negativePostingEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    LedgerSetRequest:
      type: object
      required: [code, name, leadingLedgerId, parallelLedgerIds]
      properties:
        code: { type: string, pattern: '^[A-Z0-9]{1,10}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        leadingLedgerId: { type: string, format: uuid }
        parallelLedgerIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: uuid }
    LedgerSet:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        leadingLedgerId: { type: string, format: uuid }
        ledgerIds:
          type: array
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    AccountMappingRequest:
      type: object
      required: [sourceAccount, targetAccount, effectiveFrom]
      properties:
        sourceAccount: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$' }
        targetAccount: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$' }
        effectiveFrom: { type: string, format: date }
    AccountMapping:
      allOf:
        - $ref: "#/components/schemas/AccountMappingRequest"
        - type: object
          properties:
            id: { type: string, format: uuid }
            ledgerId: { type: string, format: uuid }
    ReasonCode:
      type: object
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{1,10}$' }
        name: { type: string, maxLength: 60 }
        appliesTo:
          type: array
          minItems: 1
          items:
            type: string
            enum: [ledger, bank, customer, vendor, fixed_asset, inventory_counting, tax, project]
        requiresComment: { type: boolean }
        negativePostingAllowed: { type: boolean }
        alternativePostingDateAllowed: { type: boolean }
        active: { type: boolean }
        updatedAt: { type: string, format: date-time }
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        chartCode: { type: string }
        accountNumber: { type: string }
        name: { type: string }
        accountType:
          type: string
          enum: [asset, liability, equity, revenue, expense, profit_and_loss_total, balance_sheet_total, reporting]
        isPostable: { type: boolean }
        suspendedFrom: { type: string, format: date }
        reconciliationAccountType:
          type: string
          enum: [none, customer, vendor, bank, inventory, fixed_asset]
    ValidateResponse:
      type: object
      properties:
        valid: { type: boolean }
        violations:
          type: array
          items: { $ref: "#/components/schemas/Violation" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Violation" }
          description: Failures of validation rules with severity warning (FR-11.21); they do not make the entry invalid
        lines:
          type: array
          items:
            type: object
            properties:
              lineIndex: { type: integer }
              account: { type: string }
              displayName: { type: string }
              dimensionCombinationId: { type: string }
              dimensions:
                type: object
                additionalProperties: { type: string }
                description: The line's dimension values after derivation (FR-11.22)
              derivedByStepIds:
                type: array
                items: { type: string, format: uuid }
                description: Derivation steps that changed a value on this line
              derivation:
                type: array
                items: { $ref: "#/components/schemas/DerivationTrace" }
        currency: { type: string }
        debit: { type: string }
        credit: { type: string }
        splitting:
          type: array
          items: { $ref: "#/components/schemas/SplitTrace" }
          description: Lines document splitting changed or created (FR-11.23); empty when no rule applies
    TrialBalance:
      type: object
      properties:
        ledgerId: { type: string, format: uuid }
        currency: { type: string }
        rows:
          type: array
          items:
            type: object
            properties:
              account: { type: string }
              name: { type: string }
              debit: { type: string }
              credit: { type: string }
              net: { type: string }
              lineCount: { type: integer, format: int64 }
        debit: { type: string }
        credit: { type: string }
        net: { type: string }
        balanced: { type: boolean }
    RebuildResult:
      type: object
      properties:
        ledgerId: { type: string, format: uuid }
        highWaterSequence: { type: integer, format: int64 }
        rowsWritten: { type: integer, format: int64 }
        rowsDiffering: { type: integer, format: int64 }
        durationMs: { type: integer, format: int64 }
    StructureConstraint:
      type: object
      description: |
        One constraint row (FR-11.3). Of the rows for a segment whose `under` conditions match
        the line, the most specific (most conditions other than `*`) governs; a segment with no
        matching row is free. A blank the row does not allow is LEDGER_DIMENSION_REQUIRED; a value
        outside `allowed` is LEDGER_DIMENSION_INVALID.
      required: [segment, allowed]
      properties:
        segment: { type: string, description: Dimension attribute (a listed segment) the row constrains }
        under:
          type: object
          additionalProperties: { type: string }
          description: |
            Conditions on MAIN_ACCOUNT or earlier segments: an exact value, a `from..to` range,
            `blank`, or `*` (any value, blank included). The row applies only when all match.
        allowed:
          type: array
          minItems: 1
          items: { type: string, description: "An exact value, a from..to range, * (any non-blank value) or blank" }
    StructureBody:
      type: object
      required: [name, version, effectiveFrom]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9_.-]{1,60}$' }
        version: { type: integer, minimum: 1, description: "Unique per (ledger, name)" }
        priority: { type: integer, minimum: 0, default: 0, description: Structures are tried by priority (lowest first), then name }
        effectiveFrom: { type: string, format: date, description: "Of a structure's active versions, the one with the latest effectiveFrom on or before the posting date applies" }
        status: { type: string, enum: [draft, active, retired], default: draft }
        segments:
          type: array
          maxItems: 20
          description: Dimension segments after the implicit MAIN_ACCOUNT; a line may carry only these dimensions
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,19}$' }
        accountFilter:
          type: array
          description: Main accounts the structure covers; empty covers every account
          items: { type: string, description: "Account number, range from..to, or *" }
        constraints:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/StructureConstraint" }
    AdvancedRuleBody:
      type: object
      description: |
        An advanced rule structure (FR-11.16). When a line's main account matches `accounts` and every
        `dimensions` condition matches the line, `segments` and `constraints` are appended to the account
        structure governing the line, in `priority` order (lowest first, then name), up to 20 segments in all.
        When several matching rules carry rows for the same segment, the most specific row governs; on a
        tie the structure's own row wins, then the row of the rule applied first.
      required: [structureId, name, segments]
      properties:
        structureId: { type: string, format: uuid, description: The account structure version the rule belongs to; it must be a draft, and the rule governs postings once that version is active }
        name: { type: string, pattern: '^[A-Za-z0-9_.-]{1,60}$', description: Unique within the structure version }
        priority: { type: integer, minimum: 0, default: 0 }
        accounts:
          type: array
          maxItems: 50
          description: Main account tokens that admit a line (account number, from..to range or *); empty admits every account, but then `dimensions` must not be empty
          items: { type: string }
        dimensions:
          type: object
          description: Conditions per dimension attribute of the ledger that must all match the line (an exact value, a from..to range, `*` for any value or `blank`)
          additionalProperties: { type: string }
        segments:
          type: array
          minItems: 1
          maxItems: 20
          description: Dimension attributes added after the structure's own segments; none may already be a segment of the structure
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,19}$' }
        constraints:
          type: array
          maxItems: 500
          description: Constraint rows over the added segments, with the semantics of the structure's rows
          items: { $ref: "#/components/schemas/StructureConstraint" }
    AttachmentBody:
      type: object
      required: [kind]
      additionalProperties: false
      description: A file reference (kind attachment) or a note (kind note); a note carries only its text
      properties:
        kind: { type: string, enum: [attachment, note] }
        name: { type: string, maxLength: 200, description: File name without a path }
        documentType: { type: string, enum: [invoice_image, approval_evidence, supporting_calculation, correspondence, other], default: other }
        retentionClass: { type: string, enum: [financial_record_10y, financial_record_7y, financial_record_6y, working_paper_2y], default: financial_record_10y }
        storeRef:
          type: string
          maxLength: 1024
          description: >-
            Where the document service stored the file. Either an object-storage key under the caller's tenant
            prefix ({tenant-id}/segment/..., letters, digits and . _ = + - per segment, no empty, . or .. segment)
            or dms://{connector}/{document} for an external DMS, resolved by the tenant's configured connector.
            http(s) URLs, other schemes and another tenant's prefix are refused (422). The ledger never fetches it.
        contentType: { type: string, description: "One of the allowed content types, for example application/pdf. Asserted by the caller; the document service verifies the stored bytes." }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 26214400, description: "File size in bytes, asserted by the caller; the document service verifies it." }
        note: { type: string, maxLength: 2000 }
    Attachment:
      allOf:
        - $ref: "#/components/schemas/AttachmentBody"
        - type: object
          required: [id, batchId, createdBy, createdAt]
          properties:
            id: { type: string, format: uuid }
            batchId: { type: string, format: uuid }
            retainedUntil: { type: string, format: date, description: Set on a file of a posted batch; the posting date plus the retention class }
            createdBy: { type: string }
            createdAt: { type: string, format: date-time }
    AdvancedRule:
      allOf:
        - $ref: "#/components/schemas/AdvancedRuleBody"
        - type: object
          required: [id, ledgerId, lockVersion]
          properties:
            id: { type: string, format: uuid }
            ledgerId: { type: string, format: uuid }
            lockVersion: { type: integer, minimum: 1, description: Counts the changes; it is the entity tag }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Structure:
      allOf:
        - $ref: "#/components/schemas/StructureBody"
        - type: object
          properties:
            id: { type: string, format: uuid }
            ledgerId: { type: string, format: uuid }
    DescriptionTemplateBody:
      type: object
      required: [scope, sourceType, template]
      properties:
        scope: { type: string, enum: [tenant, legal_entity] }
        legalEntityId: { type: string, format: uuid, description: Required for legal_entity scope; omitted for tenant scope }
        sourceType: { type: string, pattern: '^[a-z][a-z0-9_]{0,59}$', example: manual_journal }
        language: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$', default: en }
        template: { type: string, minLength: 1, maxLength: 255, example: "Journal %1 of %2" }
        fieldBindings:
          type: object
          description: Placeholder key (1 to 9) to field name
          additionalProperties:
            type: string
            enum: [voucher, party_name, document_date, amount_txn, currency_txn, source_id, period]
          example: { "1": voucher, "2": document_date }
    DescriptionTemplate:
      type: object
      required: [id, scope, legalEntityId, sourceType, language, template, fieldBindings, updatedAt]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [tenant, legal_entity] }
        legalEntityId: { type: [string, "null"], format: uuid }
        sourceType: { type: string }
        language: { type: string }
        template: { type: string }
        fieldBindings:
          type: object
          additionalProperties: { type: string }
        updatedAt: { type: string, format: date-time }
    DimensionValueBody:
      type: object
      required: [name, suspended]
      properties:
        name: { type: string, maxLength: 60 }
        activeFrom: { type: [string, "null"], format: date }
        activeTo: { type: [string, "null"], format: date }
        suspended: { type: boolean }
    DimensionValue:
      allOf:
        - $ref: "#/components/schemas/DimensionValueBody"
        - type: object
          required: [attribute, value]
          properties:
            attribute: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,19}$' }
            value: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$' }
    JournalNameBody:
      type: object
      required: [name]
      description: Setup of a kind of manual journal (FR-11.9, AX LedgerJournalName).
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        requiresApproval: { type: boolean, default: false, description: Submitted batches go to in_approval (the approval workflow of the journal name). }
        selfApprovalAllowed: { type: boolean, default: false, description: The submitter may approve; only with requiresApproval. }
        reversalReasonRequired: { type: boolean, default: false, description: Reversing an entry posted from a batch of this name needs a reason code (FR-11.15). }
        allowReconAccounts: { type: boolean, default: false, description: Lines may hit reconciliation accounts (BR-11.8; migration and correction use). }
        linesLimit: { type: integer, minimum: 1, maximum: 10000, default: 5000 }
        active: { type: boolean, default: true, description: Inactive names keep their batches but take no new or submitted batches. }
    JournalName:
      allOf:
        - $ref: "#/components/schemas/JournalNameBody"
        - type: object
          required: [code, name, requiresApproval, selfApprovalAllowed, reversalReasonRequired, allowReconAccounts, linesLimit, active, updatedAt]
          properties:
            code: { type: string, pattern: '^[A-Za-z0-9_-]{1,20}$' }
            updatedAt: { type: string, format: date-time }
    BatchStatus:
      type: string
      description: BR-11.10 state machine. `posting` is held as the batch row lock inside the posting transaction and is never returned.
      enum: [draft, validated, in_approval, approved, rejected, posting, posted, cancelled]
    BatchLineBody:
      type: object
      required: [account, debitCredit, amount]
      properties:
        account: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$' }
        dimensions:
          type: object
          additionalProperties: { type: string, minLength: 1, maxLength: 20 }
        debitCredit: { type: string, enum: [D, C] }
        amount: { $ref: "#/components/schemas/Amount" }
        text: { type: string, maxLength: 255, description: Omitted text is filled from the default description template at posting (FR-11.17). }
        sourceLineRef: { type: string, maxLength: 200 }
    JournalBatchBody:
      type: object
      required: [ledgerId, journalName, postingDate, lines]
      properties:
        ledgerId: { type: string, format: uuid }
        journalName: { type: string, pattern: '^[A-Za-z0-9_-]{1,20}$', description: An active journal name (422 LEDGER_JOURNAL_NAME_INVALID otherwise). }
        description: { type: string, maxLength: 255, description: Empty means the default description template applies at posting (FR-11.17, AC-11.19). }
        postingDate: { type: string, format: date }
        documentDate: { type: string, format: date, description: Defaults to the posting date when the batch is posted. }
        lines:
          type: array
          minItems: 1
          maxItems: 10000
          description: At most the journal name's linesLimit (422 LEDGER_LINE_LIMIT).
          items: { $ref: "#/components/schemas/BatchLineBody" }
    JournalBatchPatch:
      type: object
      description: Absent fields keep their value; `lines` replaces every line; an empty documentDate clears it.
      properties:
        description: { type: string, maxLength: 255 }
        postingDate: { type: string, format: date }
        documentDate: { type: string, description: A date as YYYY-MM-DD, or empty to clear }
        lines:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: "#/components/schemas/BatchLineBody" }
    BatchLine:
      type: object
      required: [lineNumber, account, debitCredit, amount, currency]
      properties:
        lineNumber: { type: integer, minimum: 1 }
        account: { type: string }
        dimensions:
          type: object
          additionalProperties: { type: string }
        debitCredit: { type: string, enum: [D, C] }
        amount: { type: string, description: Decimal string at the currency's minor-unit scale }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        text: { type: string }
        sourceLineRef: { type: string }
    RecurringLine:
      type: object
      required: [lineNumber, account, debitCredit, amountKind, amount, currency]
      properties:
        lineNumber: { type: integer, minimum: 1 }
        account: { type: string }
        dimensions:
          type: object
          additionalProperties: { type: string }
        debitCredit: { type: string, enum: [D, C] }
        amountKind: { type: string, enum: [fixed, percent] }
        amount: { type: string, description: "A decimal string at the currency's minor-unit scale for fixed lines; a percentage of the base amount (0 to 1000) for percent lines" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        text: { type: string }
    RecurringLineBody:
      type: object
      required: [account, debitCredit, amountKind, amount]
      properties:
        account: { type: string }
        dimensions:
          type: object
          additionalProperties: { type: string }
        debitCredit: { type: string, enum: [D, C] }
        amountKind: { type: string, enum: [fixed, percent] }
        amount:
          type: object
          required: [currency, value]
          properties:
            currency: { type: string, pattern: '^[A-Z]{3}$' }
            value: { type: string, description: Decimal string; a percentage when amountKind is percent }
        text: { type: string, maxLength: 255 }
    RecurringJournalBody:
      type: object
      required: [ledgerId, journalName, name, frequency, dayOfMonth, startDate, lines]
      properties:
        ledgerId: { type: string, format: uuid, description: Cannot change after creation }
        journalName: { type: string, description: Active journal name that the generated batches use }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 255, description: Description of every generated batch }
        frequency: { type: string, enum: [monthly, quarterly, yearly] }
        dayOfMonth: { type: integer, minimum: 0, maximum: 31, description: 0 is the last day of the month; a day beyond the month's length is clipped to its last day }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: No run is scheduled after this date }
        baseAmount: { type: string, description: Base for percent lines; a generation can override it }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RecurringLineBody" }
    RecurringJournal:
      type: object
      required: [id, ledgerId, legalEntityId, journalName, name, description, frequency, dayOfMonth, startDate, status, version,
        lineCount, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        journalName: { type: string }
        name: { type: string }
        description: { type: string }
        frequency: { type: string, enum: [monthly, quarterly, yearly] }
        dayOfMonth: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        baseAmount: { type: string }
        status: { type: string, enum: [active, paused] }
        nextRunDate: { type: string, format: date, description: Absent when the schedule is past its end date }
        lastRunDate: { type: string, format: date }
        version: { type: integer, minimum: 1, description: Optimistic concurrency token, also sent as the ETag }
        lineCount: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lines:
          type: array
          description: Present on single reads, absent in lists
          items: { $ref: "#/components/schemas/RecurringLine" }
    RecurringRun:
      type: object
      required: [id, recurringId, scheduledDate, batchId, generatedBy, generatedAt]
      properties:
        id: { type: string, format: uuid }
        recurringId: { type: string, format: uuid }
        scheduledDate: { type: string, format: date, description: The run date, also the posting date of the batch }
        batchId: { type: string, format: uuid, description: The draft journal batch that the run created }
        generatedBy: { type: string }
        generatedAt: { type: string, format: date-time }
    JournalBatch:
      type: object
      required: [id, ledgerId, legalEntityId, journalName, description, postingDate, currency, status, version,
        requiresApproval, selfApprovalAllowed, totalDebit, totalCredit, lineCount, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        journalName: { type: string }
        description: { type: string }
        postingDate: { type: string, format: date }
        documentDate: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Ledger currency }
        status: { $ref: "#/components/schemas/BatchStatus" }
        version: { type: integer, minimum: 1, description: Optimistic concurrency token, also sent as the ETag; every change increments it. }
        requiresApproval: { type: boolean, description: Current setting of the journal name }
        selfApprovalAllowed: { type: boolean, description: Current setting of the journal name }
        submittedBy: { type: string }
        decidedBy: { type: string, description: User who approved or rejected }
        postedBy: { type: string }
        postedAt: { type: string, format: date-time }
        postedEntryId: { type: string, format: uuid }
        lastError: { type: string, description: Why the last post failed; cleared by the next change }
        totalDebit: { type: string }
        totalCredit: { type: string }
        lineCount: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lines:
          type: array
          description: Present on single-batch reads, absent in lists
          items: { $ref: "#/components/schemas/BatchLine" }
    OpenItemAccountBody:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, description: Whether every line posted on the account in this ledger creates an open item }
    OpenItemAccount:
      type: object
      required: [ledgerId, account, name, enabled, openItems, changedBy, changedAt]
      properties:
        ledgerId: { type: string, format: uuid }
        account: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        openItems: { type: integer, description: Items still open or reset_open on the account }
        changedBy: { type: string }
        changedAt: { type: string, format: date-time }
    ToleranceGroupBody:
      type: object
      required: [name, debitLimit, creditLimit, differenceAccount]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        debitLimit: { type: string, description: "Largest debit residual (debits exceed credits) that may be written off, decimal string with at most 6 decimals (BR-11.12 abs_debit)" }
        creditLimit: { type: string, description: "Largest credit residual (credits exceed debits) that may be written off, decimal string with at most 6 decimals (BR-11.12 abs_credit)" }
        percentLimit: { type: string, description: "Optional share (0 to 100) of the selection's absolute total (debit plus credit) the residual may not exceed; 0 or absent means no percentage limit" }
        differenceAccount: { type: string, description: Postable account in the ledger's chart that receives the write-off }
        active: { type: boolean, default: true }
    ToleranceGroup:
      type: object
      required: [ledgerId, code, name, debitLimit, creditLimit, percentLimit, differenceAccount, active, version, createdAt, updatedAt]
      properties:
        ledgerId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9_]{1,10}$' }
        name: { type: string }
        debitLimit: { type: string }
        creditLimit: { type: string }
        percentLimit: { type: string }
        differenceAccount: { type: string }
        active: { type: boolean }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OpenItem:
      type: object
      required: [id, ledgerId, account, accountName, dimensions, sourceType, amount, debitCredit, currency, postingDate, status]
      properties:
        id: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        account: { type: string }
        accountName: { type: string }
        dimensions: { type: object, additionalProperties: { type: string } }
        sourceType: { type: string, enum: [gl_line, residual] }
        amount: { type: string, description: Absolute amount in the ledger currency at its minor-unit scale }
        debitCredit: { type: string, enum: [D, C] }
        currency: { type: string }
        assignment: { type: string, maxLength: 50, description: Matching key; starts as the first 50 characters of the line's sourceLineRef }
        postingDate: { type: string, format: date }
        status: { type: string, enum: [open, cleared, reset_open, voided] }
        clearingDocumentId: { type: string, format: uuid }
        residualOfItemId: { type: string, format: uuid }
        entryId: { type: string, format: uuid, description: Journal entry of the source line; absent on residual items }
        voucher: { type: string }
        lineNumber: { type: integer }
    OpenItemPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/OpenItem" } }
        nextCursor: { type: string, description: Pass as cursor for the next page; absent on the last page }
    ClearingRequest:
      type: object
      required: [ledgerId, itemIds, clearingDate]
      properties:
        ledgerId: { type: string, format: uuid }
        itemIds: { type: array, minItems: 2, maxItems: 10000, uniqueItems: true, items: { type: string, format: uuid }, description: Open items of one open-item managed account }
        clearingDate: { type: string, format: date, description: Posting date of a difference entry; not before the latest posting date of the items }
        toleranceGroup: { type: string, description: Tolerance group whose limit may write off the residual }
        residualItem: { type: boolean, default: false, description: When the residual is above tolerance, carry it as a new open item instead of refusing }
    ClearingPreview:
      type: object
      required: [ledgerId, account, currency, itemCount, debit, credit, net, outcome, differenceAmount, residualAmount]
      properties:
        ledgerId: { type: string, format: uuid }
        account: { type: string }
        currency: { type: string }
        itemCount: { type: integer }
        debit: { type: string }
        credit: { type: string }
        net: { type: string, description: Debit minus credit of the selection }
        toleranceGroup: { type: string }
        outcome: { type: string, enum: [balanced, difference, residual, unbalanced], description: "balanced: net is zero; difference: written off to the difference account; residual: carried as a new item; unbalanced: a clearing would be refused" }
        differenceAmount: { type: string }
        residualAmount: { type: string }
    ClearingDocument:
      type: object
      required: [id, ledgerId, account, clearingDate, mode, itemIds, differenceAmount, status, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        account: { type: string }
        clearingDate: { type: string, format: date }
        mode: { type: string, enum: [manual, auto], description: auto for documents made by an automatic clearing run }
        itemIds: { type: array, items: { type: string, format: uuid }, description: The items the user selected }
        toleranceGroup: { type: string }
        differenceAmount: { type: string, description: Residual written off, debit minus credit; 0 when none }
        differenceEntryId: { type: string, format: uuid }
        residualItemId: { type: string, format: uuid }
        status: { type: string, enum: [cleared, reset] }
        resetReasonCode: { type: string }
        resetComment: { type: string }
        resetBy: { type: string }
        resetAt: { type: string, format: date-time }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: "#/components/schemas/OpenItem" }, description: Set on single reads }
    ResetClearingRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode: { type: string, pattern: '^[A-Z0-9_]{1,10}$', description: "Active shared reason code that applies to ledger (FR-11.15); also the reason of the reversal of the difference entry when the clearing posted one" }
        comment: { type: string, maxLength: 255 }
    AutoClearingRuleBody:
      type: object
      required: [name, accountFrom, accountTo, criteria]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        accountFrom: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$', description: First account number of the range, compared as text }
        accountTo: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$', description: Last account number of the range, compared as text; not before accountFrom }
        criteria:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, description: "assignment, source_line_ref, document_id (the documentId of the posting request), amount_txn (absolute amount in the ledger currency), posting_date (month) or dim.{ATTRIBUTE}" }
          description: Ordered fields that group the open items of one account; an item with no value for a field is never grouped
        allowTolerance: { type: boolean, default: false, description: A group within the tolerance group also clears, the residual going to its difference account }
        toleranceGroup: { type: string, pattern: '^[A-Z0-9_]{1,10}$', description: Required with allowTolerance and refused without }
        sequence: { type: integer, minimum: 1, maximum: 9999, default: 100, description: Rules run in ascending sequence, then name }
        active: { type: boolean, default: true }
    AutoClearingRule:
      type: object
      required: [id, ledgerId, name, accountFrom, accountTo, criteria, allowTolerance, sequence, active, version, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        name: { type: string }
        accountFrom: { type: string }
        accountTo: { type: string }
        criteria: { type: array, items: { type: string } }
        allowTolerance: { type: boolean }
        toleranceGroup: { type: string }
        sequence: { type: integer }
        active: { type: boolean }
        version: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AutoClearingRunRequest:
      type: object
      required: [ledgerId, mode]
      properties:
        ledgerId: { type: string, format: uuid }
        ruleId: { type: string, format: uuid, description: Run only this active rule; every active rule of the ledger when absent }
        mode: { type: string, enum: [simulate, clear], description: simulate returns the proposed groups and writes nothing }
        clearingDate: { type: string, format: date, description: Defaults to today; a group whose latest item posted later clears on that date }
    AutoClearingGroup:
      type: object
      required: [no, ruleId, account, itemCount, net, status]
      properties:
        no: { type: integer, description: Position in the run log }
        ruleId: { type: string, format: uuid }
        account: { type: string }
        itemCount: { type: integer }
        net: { type: string, description: Debit minus credit of the group }
        status: { type: string, enum: [proposed, cleared, skipped] }
        reasonCode: { type: string, description: Why a group was skipped, for example LEDGER_CLEARING_UNBALANCED }
        reason: { type: string }
        clearingDocumentId: { type: string, format: uuid, description: The document a cleared group made }
        itemIds: { type: array, items: { type: string, format: uuid }, description: Members of a proposed or skipped group in a simulation }
    AutoClearingRun:
      type: object
      required: [ledgerId, mode, clearingDate, groupsFound, groupsCleared, groupsSkipped, itemsCleared, unmatchedItems, truncated]
      properties:
        id: { type: string, format: uuid, description: Absent on a simulation }
        ledgerId: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        mode: { type: string, enum: [simulate, clear] }
        clearingDate: { type: string, format: date }
        groupsFound: { type: integer, description: Groups of two or more items }
        groupsCleared: { type: integer, description: Groups cleared, or proposed in a simulation }
        groupsSkipped: { type: integer }
        itemsCleared: { type: integer }
        unmatchedItems: { type: integer, description: Items that no group of two or more took }
        truncated: { type: boolean, description: A rule had more than 100,000 open items; the rest wait for the next run }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        groups: { type: array, items: { $ref: "#/components/schemas/AutoClearingGroup" }, description: The first 1,000 groups }
    DerivationStepCondition:
      type: object
      required: [field, op]
      properties:
        field: { type: string, description: "ACCOUNT, ACCOUNT_TYPE or a dimension attribute of the ledger; never the step's own target" }
        op: { type: string, enum: [eq, ne, in, blank, notblank] }
        values: { type: array, maxItems: 20, items: { type: string }, description: "One value for eq and ne, 1 to 20 for in, none for blank and notblank" }
    DerivationStep:
      type: object
      required: [sequence, kind, target]
      properties:
        id: { type: string, format: uuid, description: "Assigned by the service; replacing a draft keeps the ids of its own steps, any other id is replaced so step ids stay unique across versions" }
        sequence: { type: integer, minimum: 1, description: Steps run in ascending sequence; must be strictly increasing }
        kind: { type: string, enum: [table_lookup, move, clear, constant], description: "expression (CEL) is not built" }
        condition: { $ref: "#/components/schemas/DerivationStepCondition" }
        sourceFields: { type: array, items: { type: string }, description: "table_lookup: equals the table's source fields; move: one field; clear and constant: none" }
        target: { type: string, description: Dimension attribute of the ledger that the step writes }
        lookupTableId: { type: string, format: uuid, description: Required for table_lookup }
        value: { type: string, description: Required for constant }
        overwrite: { type: boolean, default: false, description: "With overwrite a step may replace a value set by an earlier step; no step ever changes a value the posting request carries; clear needs overwrite" }
    DerivationStrategyBody:
      type: object
      required: [name, steps]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        steps:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/DerivationStep" }
    DerivationStrategy:
      type: object
      required: [id, ledgerId, version, lockVersion, name, status, steps]
      properties:
        id: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        version: { type: integer, minimum: 1, description: Strategy version number, dense per ledger }
        lockVersion: { type: integer, description: Optimistic-concurrency counter, also the ETag }
        name: { type: string }
        status: { type: string, enum: [draft, active, retired] }
        steps:
          type: array
          items: { $ref: "#/components/schemas/DerivationStep" }
        activatedBy: { type: string }
        activatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DerivationTrace:
      type: object
      required: [stepId, sequence, kind, target, before, after]
      properties:
        stepId: { type: string, format: uuid }
        sequence: { type: integer }
        kind: { type: string, enum: [table_lookup, move, clear, constant] }
        target: { type: string }
        before: { type: string }
        after: { type: string }
        matchedRow: { type: array, items: { type: string }, description: The lookup row source tuple that matched, for table_lookup }
    LookupRow:
      type: object
      required: [source, target, validFrom]
      properties:
        source: { type: array, minItems: 1, maxItems: 5, items: { type: string }, description: "Exact values or * per source field; a blank source value matches only *" }
        target: { type: string, maxLength: 20 }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date, description: Inclusive; absent means open-ended }
    LookupTableBody:
      type: object
      required: [name, sourceFields, target]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        sourceFields: { type: array, minItems: 1, maxItems: 5, items: { type: string }, description: ACCOUNT, ACCOUNT_TYPE or dimension attributes of the ledger }
        target: { type: string, description: Dimension attribute of the ledger that rows fill; not a source field }
        rows: { type: array, maxItems: 5000, items: { $ref: "#/components/schemas/LookupRow" }, description: Replaces all rows of the table }
    LookupTable:
      type: object
      required: [id, ledgerId, name, sourceFields, target, rowCount, version]
      properties:
        id: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        name: { type: string }
        sourceFields: { type: array, items: { type: string } }
        target: { type: string }
        rowCount: { type: integer }
        version: { type: integer, description: Counts replacements; also the ETag }
        rows: { type: array, items: { $ref: "#/components/schemas/LookupRow" }, description: Present on GET of one table only }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RuleCondition:
      type: object
      required: [field, op]
      properties:
        field:
          type: string
          description: |
            Header fields SOURCE_SYSTEM, SOURCE_TYPE, POSTING_DATE, DOCUMENT_DATE, TOTAL_DEBIT, LINE_COUNT; line fields
            ACCOUNT, ACCOUNT_TYPE, AMOUNT (absolute amount), SIDE (D or C), TEXT and the ledger's dimension attributes.
            A header rule reads header fields only.
        op: { type: string, enum: [eq, ne, in, gt, gte, lt, lte, between, blank, notblank] }
        values:
          type: array
          items: { type: string }
          description: "eq, ne, gt, gte, lt, lte: one value; in: 1 to 20; between: lower and upper bound (inclusive); blank and notblank: none. Numbers and dates compare as such, other text as text."
    ValidationRuleBody:
      type: object
      required: [sequence, name, level, severity, checks, message]
      properties:
        sequence: { type: integer, minimum: 1, maximum: 9999, description: Rules are evaluated in ascending sequence }
        name: { type: string, minLength: 1, maxLength: 80, description: Unique per ledger }
        level: { type: string, enum: [line, header], description: A line rule is evaluated per line, a header rule once per entry }
        severity: { type: string, enum: [error, warning], description: An error refuses the posting; a warning is returned as a notice }
        prerequisite:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/RuleCondition" }
          description: All conditions must hold for the rule to apply; none means it always applies
        checks:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/RuleCondition" }
          description: All conditions must hold, otherwise the rule fails
        message: { type: string, minLength: 1, maxLength: 200 }
        active: { type: boolean, default: false }
    ValidationRule:
      type: object
      required: [id, ledgerId, sequence, name, level, severity, prerequisite, checks, message, active, lockVersion]
      properties:
        id: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        sequence: { type: integer }
        name: { type: string }
        level: { type: string, enum: [line, header] }
        severity: { type: string, enum: [error, warning] }
        prerequisite: { type: array, items: { $ref: "#/components/schemas/RuleCondition" } }
        checks: { type: array, items: { $ref: "#/components/schemas/RuleCondition" } }
        message: { type: string }
        active: { type: boolean }
        lockVersion: { type: integer, description: Optimistic-concurrency counter, also the ETag }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SplittingRuleBody:
      type: object
      required: [sourceType, splittingDimensions, active]
      properties:
        sourceType: { type: string, minLength: 1, maxLength: 60, description: The source type of the entries the rule applies to, for example vendor_invoice }
        splittingDimensions: { type: array, minItems: 1, maxItems: 5, items: { type: string }, description: Dimension attributes of the ledger that lines inherit }
        zeroBalanceClearingAccount: { type: string, description: "Postable balance-sheet account (asset, liability or equity, not a reconciliation account) that takes the zero-balance clearing lines; required for entries whose splitting keys do not net to zero" }
        defaultSplittingValue: { type: object, additionalProperties: { type: string }, description: Value per splitting dimension for lines when no line carries one }
        active: { type: boolean, description: An inactive rule is kept but not applied }
    SplittingRule:
      type: object
      required: [id, ledgerId, sourceType, splittingDimensions, defaultSplittingValue, active, version]
      properties:
        id: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        sourceType: { type: string }
        splittingDimensions: { type: array, items: { type: string } }
        zeroBalanceClearingAccount: { type: string }
        defaultSplittingValue: { type: object, additionalProperties: { type: string } }
        active: { type: boolean }
        version: { type: integer, description: Counts replacements; also the ETag }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SplitTrace:
      type: object
      required: [lineIndex, sourceIndex, kind, dimensions, amount]
      properties:
        lineIndex: { type: integer, description: Index of the line after splitting; the first part of a split line keeps its original index }
        sourceIndex: { type: integer, description: Index of the requested line it came from; -1 for a clearing line }
        kind: { type: string, enum: [inherited, default, clearing], description: inherited from carrying lines, set from the default value, or a zero-balance clearing line }
        dimensions: { type: object, additionalProperties: { type: string }, description: The splitting dimension values the line received }
        amount: { type: string, description: Decimal string in the ledger currency }
    RealignmentFilter:
      type: object
      required: [periodFrom, periodTo]
      properties:
        accountFrom: { type: string, description: First account number of the range; blank is open }
        accountTo: { type: string, description: Last account number of the range; blank is open }
        periodFrom: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', description: First period, YYYY-MM }
        periodTo: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', description: Last period, YYYY-MM; a run spans at most 60 periods }
    RealignmentRequest:
      type: object
      required: [filter, mapping]
      properties:
        filter: { $ref: "#/components/schemas/RealignmentFilter" }
        mapping:
          type: object
          description: Per dimension attribute of the ledger, the old value and the new value that replaces it; at most 200 pairs
          additionalProperties:
            type: object
            additionalProperties: { type: string }
    RealignmentRow:
      type: object
      required: [account, period, oldDimensions, newDimensions, oldCombination, newCombination, net, lineCount]
      properties:
        account: { type: string }
        period: { type: string }
        oldDimensions: { type: object, additionalProperties: { type: string } }
        newDimensions: { type: object, additionalProperties: { type: string } }
        oldCombination: { type: string, description: Display name of the combination the balance moves from }
        newCombination: { type: string, description: Display name of the combination the balance moves to }
        net: { type: string, description: Debit minus credit of the period balance being moved, decimal string in the ledger currency }
        lineCount: { type: integer, format: int64, description: Posted lines behind the balance }
    RealignmentRun:
      type: object
      required: [id, ledgerId, status, filter, mapping, combinationsAffected, lineCount, amountMoved, currency, preview, previewTruncated, entryIds, reversalEntryIds, version]
      properties:
        id: { type: string, format: uuid }
        ledgerId: { type: string, format: uuid }
        status: { type: string, enum: [proposed, posted, reversed, cancelled] }
        filter: { $ref: "#/components/schemas/RealignmentFilter" }
        mapping: { type: object, additionalProperties: { type: object, additionalProperties: { type: string } } }
        reasonCode: { type: string, description: Set when the run is posted }
        reasonComment: { type: string }
        combinationsAffected: { type: integer, description: Number of (account, period, old combination) rows moved }
        lineCount: { type: integer, format: int64 }
        amountMoved: { type: string, description: Sum of the absolute nets moved, decimal string in the ledger currency }
        currency: { type: string }
        preview: { type: array, items: { $ref: "#/components/schemas/RealignmentRow" }, description: The affected rows, at most 1,000; empty in the list }
        previewTruncated: { type: boolean }
        entryIds: { type: array, items: { type: string, format: uuid }, description: The reclassification entries, one per period }
        reversalEntryIds: { type: array, items: { type: string, format: uuid } }
        version: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        postedBy: { type: string }
        postedAt: { type: string, format: date-time }
        reversedBy: { type: string }
        reversedAt: { type: string, format: date-time }
    RealignmentActionBody:
      type: object
      properties:
        reasonCode: { type: string, description: Reason code of the shared catalogue; required to post and to reverse }
        reasonComment: { type: string, maxLength: 255, description: Required when the reason code says so }
        postingDate:
          type: string
          format: date
          description: |
            Read by :reverse only. Dates every reversing entry that day instead of its original posting date,
            for example when a period of the run was closed since it was posted; needs a reason code with
            alternativePostingDateAllowed and may not precede an original date.
  responses:
    Problem400:
      description: Validation failed (COM-0001 with errors map)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem401:
      description: Missing or malformed tenant (AUTH-0001)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem500:
      description: Unexpected server error (COM-0500); no internal detail is returned
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem403:
      description: Forbidden (duty missing, or caller scoped to another legal entity)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem404:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem409:
      description: Idempotency conflict (LEDGER_IDEMPOTENCY_CONFLICT), in-progress duplicate (LEDGER_IDEMPOTENCY_IN_PROGRESS, with Retry-After) or, on a reversal, an entry whose open items are cleared (LEDGER_OPEN_ITEM_ALREADY_CLEARED)
      headers:
        Retry-After:
          description: Seconds to wait; set to 1 on LEDGER_IDEMPOTENCY_IN_PROGRESS only
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem422:
      description: Posting rule rejection; nothing was written. violations[] lists every failed rule.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ViolationProblem" }
    BatchProblem409:
      description: LEDGER_BATCH_STATE (the batch's status does not allow the action), LEDGER_BATCH_APPROVAL_REQUIRED, or an idempotency conflict on posting
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    DerivationProblem409:
      description: LEDGER_LOOKUP_TABLE_NAME_DUPLICATE, LEDGER_LOOKUP_TABLE_IN_USE (a strategy step uses the table, so its definition cannot change) or LEDGER_DERIVATION_STRATEGY_NOT_DRAFT (only a draft is replaced or activated)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AdvancedRuleProblem409:
      description: LEDGER_STRUCTURE_LOCKED (the structure version is not a draft), LEDGER_ADVANCED_RULE_NAME_DUPLICATE (the name is used by another rule of the structure version) or LEDGER_ADVANCED_RULE_LIMIT (a structure version has at most 100 rules)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AttachmentProblem409:
      description: LEDGER_BATCH_STATE (a posted or cancelled batch is immutable), LEDGER_ATTACHMENT_LIMIT (50 files and 200 notes per batch), LEDGER_ATTACHMENT_CONFLICT (the id holds other content) or LEDGER_ATTACHMENT_RETAINED (the file is retained until its retention class expires)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationRuleProblem409:
      description: LEDGER_VALIDATION_RULE_NAME_DUPLICATE (the name is used by another rule of the ledger) or LEDGER_VALIDATION_RULE_LIMIT (a ledger has at most 200 rules)
    SplittingProblem409:
      description: LEDGER_SPLITTING_RULE_DUPLICATE, a rule for this source type already exists on the ledger
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem412:
      description: LEDGER_VERSION_CONFLICT, the If-Match version is stale; reload and retry
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RecurringProblem409:
      description: LEDGER_RECURRING_PAUSED (the template is paused and the date has no run yet)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RecurringProblem422:
      description: LEDGER_RECURRING_DATE_INVALID (outside the start and end dates, or not a date of the schedule), LEDGER_RECURRING_BASE_REQUIRED (percent lines without a base amount), LEDGER_RECURRING_LEDGER_FIXED, LEDGER_JOURNAL_NAME_INVALID or LEDGER_LINE_LIMIT; nothing changed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BatchProblem422:
      description: Rule violations (violations[]), LEDGER_JOURNAL_NAME_INVALID or LEDGER_LINE_LIMIT; nothing changed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ViolationProblem" }
    ClearingProblem409:
      description: LEDGER_OPEN_ITEM_ALREADY_CLEARED, LEDGER_CLEARING_ALREADY_RESET, LEDGER_CLEARING_RESIDUAL_USED, LEDGER_OI_OPEN_ITEMS_EXIST or LEDGER_IDEMPOTENCY_CONFLICT; nothing changed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ClearingProblem422:
      description: LEDGER_CLEARING_UNBALANCED, LEDGER_CLEARING_ACCOUNT_MIXED, LEDGER_CLEARING_DATE_INVALID, LEDGER_CLEARING_RESIDUAL_DEPTH, LEDGER_CLEARING_DIFFERENCE_ACCOUNT, LEDGER_OPEN_ITEM_ACCOUNT_REQUIRED, LEDGER_TOLERANCE_GROUP_INACTIVE, LEDGER_REASON_REQUIRED or LEDGER_REASON_INVALID_MODULE on a reset, LEDGER_OI_ACCOUNT_INVALID, LEDGER_OI_ACTIVATION_BALANCE or a posting or reversal rule violation of the difference entry; nothing changed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ViolationProblem" }
    AutoRuleProblem409:
      description: LEDGER_AUTO_CLEARING_RULE_ID_CONFLICT, the id is used by another rule (a concurrent create, or a rule outside the caller's legal entities); nothing changed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AutoRuleProblem422:
      description: LEDGER_TOLERANCE_GROUP_NOT_FOUND or LEDGER_TOLERANCE_GROUP_INACTIVE, the named tolerance group is not an active group of the ledger; nothing changed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ViolationProblem" }
    AutoRunProblem409:
      description: LEDGER_IDEMPOTENCY_CONFLICT, the Idempotency-Key was used with another body; nothing changed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AutoRunProblem422:
      description: LEDGER_AUTO_CLEARING_RULE_INACTIVE, the ruleId names an inactive rule; nothing changed. Groups that cannot clear do not fail the run, they are logged as skipped.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ViolationProblem" }
  headers:
    RecurringETag:
      description: The recurring journal version as an entity tag, for If-Match on the next change
      schema: { type: string, example: '"2"' }
    BatchETag:
      description: The batch version as an entity tag, for If-Match on the next change
      schema: { type: string, example: '"3"' }
    AutoRuleETag:
      description: The automatic clearing rule version as an entity tag, for If-Match on the next change
      schema: { type: string, example: '"2"' }
    ToleranceETag:
      description: The tolerance group version as an entity tag, for If-Match on the next change
      schema: { type: string, example: '"2"' }
    LookupETag:
      description: The lookup table version as an entity tag, for If-Match on the next replacement
      schema: { type: string, example: '"2"' }
    SplittingETag:
      description: The splitting rule version as an entity tag, for If-Match on the next replacement
      schema: { type: string, example: '"2"' }
    StrategyETag:
      description: The derivation strategy lockVersion as an entity tag, for If-Match on the next change
      schema: { type: string, example: '"2"' }
    AdvancedRuleETag:
      description: The advanced rule lockVersion as an entity tag, for If-Match on the next change
      schema: { type: string, example: '"2"' }
    ValidationRuleETag:
      description: The validation rule lockVersion as an entity tag, for If-Match on the next change
      schema: { type: string, example: '"2"' }
paths:
  /v1/ledger/journal-names:
    get:
      tags: [journal]
      operationId: listJournalNames
      summary: List journal names
      x-passage-duty: ledger.journal.read
      responses:
        "200":
          description: Every journal name of the tenant, by code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/JournalName" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
  /v1/ledger/journal-names/{code}:
    get:
      tags: [journal]
      operationId: getJournalName
      summary: Get a journal name
      x-passage-duty: ledger.journal.read
      parameters:
        - $ref: "#/components/parameters/JournalNameCode"
      responses:
        "200":
          description: Journal name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalName" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    put:
      tags: [journal]
      operationId: putJournalName
      x-passage-duty: ledger.setup.write
      description: |
        Creates (201) or replaces (200) a journal name; naturally idempotent. Names are deactivated,
        never deleted. A change applies to the next action on each batch: submit reads requiresApproval,
        approve reads selfApprovalAllowed, post reads allowReconAccounts, reversal reads reversalReasonRequired.
      parameters:
        - $ref: "#/components/parameters/JournalNameCode"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalNameBody" }
      responses:
        "200":
          description: Journal name replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalName" }
        "201":
          description: Journal name created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalName" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
  /v1/ledger/journal-batches:
    get:
      tags: [journal]
      operationId: listJournalBatches
      summary: List manual journal batches
      x-passage-duty: ledger.journal.read
      parameters:
        - { name: ledger, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/BatchStatus" } }
        - { name: journalName, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,20}$' } }
      responses:
        "200":
          description: Newest 200 batches (headers and side totals, no lines)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/JournalBatch" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
    post:
      tags: [journal]
      operationId: createJournalBatch
      x-passage-duty: ledger.journal.write
      description: |
        Creates a draft batch (FR-11.9). Line shape and amount scale are checked here (400); posting rules
        (accounts, dimensions, currency, balance, dates) run at submit and post. The journal name must be
        active (422 LEDGER_JOURNAL_NAME_INVALID) and its linesLimit holds (422 LEDGER_LINE_LIMIT); an
        unknown ledger is 404 LEDGER_NOT_FOUND.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalBatchBody" }
      responses:
        "201":
          description: Draft batch with its lines
          headers:
            ETag: { $ref: "#/components/headers/BatchETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalBatch" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "422": { $ref: "#/components/responses/BatchProblem422" }
  /v1/ledger/journal-batches/{id}:
    get:
      tags: [journal]
      operationId: getJournalBatch
      summary: Get a manual journal batch with its lines
      x-passage-duty: ledger.journal.read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Batch with its lines
          headers:
            ETag: { $ref: "#/components/headers/BatchETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalBatch" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    patch:
      tags: [journal]
      operationId: patchJournalBatch
      x-passage-duty: ledger.journal.write
      description: |
        Edits the header and, when `lines` is present, replaces every line. Any edit of a validated,
        approved or rejected batch returns it to draft and clears its submit and approval (BR-11.10);
        409 LEDGER_BATCH_STATE while in_approval, posted or cancelled.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalBatchPatch" }
      responses:
        "200":
          description: Edited draft batch
          headers:
            ETag: { $ref: "#/components/headers/BatchETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalBatch" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/BatchProblem409" }
        "412": { $ref: "#/components/responses/Problem412" }
        "422": { $ref: "#/components/responses/BatchProblem422" }
  /v1/ledger/journal-batches/{id}/submit:
    post:
      tags: [journal]
      operationId: submitJournalBatch
      x-passage-duty: ledger.journal.write
      description: |
        Validates every line with the posting rules (the journal name's allowReconAccounts applies). Success
        moves a draft to validated, and on to in_approval when the journal name requires approval; a validated
        batch is re-submitted only when its journal name gained a workflow. On violations the batch stays where
        it was and 422 lists them. An inactive journal name is 422 LEDGER_JOURNAL_NAME_INVALID.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Validated or in_approval batch
          headers:
            ETag: { $ref: "#/components/headers/BatchETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalBatch" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/BatchProblem409" }
        "412": { $ref: "#/components/responses/Problem412" }
        "422": { $ref: "#/components/responses/BatchProblem422" }
  /v1/ledger/journal-batches/{id}/approve:
    post:
      tags: [journal]
      operationId: approveJournalBatch
      x-passage-duty: ledger.journal.approve
      description: |
        in_approval to approved. The approver may not be the submitter unless the journal name allows
        self-approval (403 LEDGER_SELF_APPROVAL). Approval runs here until the wave 4 Temporal workflow
        template is bound (see NOT-IMPLEMENTED.md).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Approved batch
          headers:
            ETag: { $ref: "#/components/headers/BatchETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalBatch" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/BatchProblem409" }
        "412": { $ref: "#/components/responses/Problem412" }
  /v1/ledger/journal-batches/{id}/reject:
    post:
      tags: [journal]
      operationId: rejectJournalBatch
      x-passage-duty: ledger.journal.approve
      description: |
        in_approval to rejected.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Rejected batch (edit it to return it to draft, or cancel it)
          headers:
            ETag: { $ref: "#/components/headers/BatchETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalBatch" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/BatchProblem409" }
