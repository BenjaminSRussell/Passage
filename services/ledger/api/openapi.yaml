  /v1/ledger/ledgers/{ledger}/lookup-tables/{id}:
    get:
      tags: [derivation]
      operationId: getLookupTable
      summary: Get a lookup table with its rows
      x-passage-duty: ledger.journal.read
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The lookup table and its rows; its version is in the ETag header
          headers:
            ETag: { $ref: "#/components/headers/LookupETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LookupTable" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    put:
      tags: [derivation]
      operationId: putLookupTable
      summary: Create or replace a lookup table and its rows
      x-passage-duty: ledger.rules.write
      description: |
        A lookup table maps a source tuple to one target dimension value (FR-11.22). Rows match on
        the full tuple with * wildcards; the row with the fewest wildcards wins, then the latest
        validFrom, and only rows valid on the posting date apply (BR-11.14). The call replaces all
        rows (at most 5,000; CSV import is not built). A replace is checked against If-Match when
        sent (412 LEDGER_VERSION_CONFLICT). The definition cannot change while a strategy step
        uses the table. Announces dev.passage.ledger.rules.changed.v1.
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: If-Match
          in: header
          required: false
          description: The table version last read, as an entity tag ("3"); when sent and stale, 412 and nothing changes
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LookupTableBody" }
      responses:
        "200":
          description: Table replaced
          headers:
            ETag: { $ref: "#/components/headers/LookupETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LookupTable" }
        "201":
          description: Table created
          headers:
            ETag: { $ref: "#/components/headers/LookupETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LookupTable" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/DerivationProblem409" }
        "412": { $ref: "#/components/responses/Problem412" }
        "422": { $ref: "#/components/responses/Problem422" }
