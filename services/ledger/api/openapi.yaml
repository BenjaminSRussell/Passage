          description: Account replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
  /v1/ledger/journal-entries:
    post:
      tags: [journal]
      operationId: postEntry
      x-passage-duty: ledger.journal.post
      description: |
        Posts one balanced entry atomically or rejects it entirely. Pipeline: schema,
        ledger resolution, posting-date window, account existence, postability and suspension,
        reconciliation-account protection for manual journals (source ledger/manual_journal),
        currency and scale, dimension attributes, account structure and dimension value register
        checks, combination interning, balance check, default descriptions (FR-11.17: the
        source.type template fills an omitted description and omitted line texts), sequence
        assignment, insert, balance upsert, outbox. Fiscal periods and FX are not yet applied
        (NOT-IMPLEMENTED.md). The database re-checks the balance at commit.
        Retries with the same Idempotency-Key and payload replay the stored response (200 with
        idempotency.replayed = true). Idempotency records are kept 400 days; replays after expiry
        are new requests.

        Period control: with CLOSE_URL configured, every posting path (this one, validate, reversal,
        batch submit and post, ledger-set post) asks the close service for the posting date's period status
        and answers 422 LEDGER_PERIOD_CLOSED unless the status is open. Flag duty ledger.period.postclosed
        overrides a closed or on_hold period only; permanently_closed and never_opened always refuse. A close
        service that cannot confirm the status gives 503 LEDGER_PERIOD_STATUS_UNAVAILABLE and nothing is posted.

        Posting to a ledger that is a non-leading member of a ledger set also needs the duty
        ledger.journal.postledger (FB50L); without it the response is 403 AUTH-0003. POST
        /ledger/validate applies the same check, and reversing an entry of such a ledger needs the
        duty on top of ledger.journal.reverse.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostEntryRequest" }
      responses:
        "201":
          description: Entry posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryResult" }
        "200":
          description: Replay of an identical request (idempotency.replayed = true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryResult" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
        "422": { $ref: "#/components/responses/Problem422" }
  /v1/ledger/ledger-sets:
    get:
      tags: [journal]
      operationId: listLedgerSets
      x-passage-duty: ledger.journal.read
      description: Ledger sets visible to the caller's legal-entity scope, ordered by legal entity then code, 100 per page; pass nextCursor back as cursor for the next page.
      parameters:
        - { name: cursor, in: query, required: false, description: The nextCursor of the previous page, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Ledger sets with their member ledgers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LedgerSet" }
                  nextCursor: { type: string, description: Present only when more sets follow }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "500": { $ref: "#/components/responses/Problem500" }
    post:
      tags: [journal]
      operationId: createLedgerSet
      x-passage-duty: ledger.setup.write
      description: |
        Creates a set of one leading ledger and at least one parallel ledger (FR-12.7). Every ledger of a set
        belongs to one legal entity and has the same accounting currency; a set is immutable. Set codes are unique
        per legal entity (409 on a duplicate). A legal entity has one leading ledger, so a set whose leading ledger
        differs from the entity's existing sets is rejected (422). A leading ledger that already has account
        mappings is rejected with 422 LEDGER_MAPPING_ON_LEADING_LEDGER, because mappings are never applied to it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LedgerSetRequest" }
      responses:
        "201":
          description: Ledger set created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerSet" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
        "422": { $ref: "#/components/responses/Problem422" }
  /v1/ledger/ledger-sets/{setId}:
    get:
      tags: [journal]
      operationId: getLedgerSet
      summary: Get a ledger set with its members
      x-passage-duty: ledger.journal.read
      parameters:
        - $ref: "#/components/parameters/LedgerSetId"
      responses:
        "200":
          description: Ledger set with its member ledgers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerSet" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "500": { $ref: "#/components/responses/Problem500" }
  /v1/ledger/ledger-sets/{setId}/journal-entries:
    post:
      tags: [journal]
      operationId: postSetEntry
      x-passage-duty: ledger.journal.post
      description: |
        Posts one source document to every ledger of the set in one transaction: all ledgers receive a balanced
        entry sharing documentId, or none does. Each ledger applies its own account mappings (valid on the posting
        date) to the request lines, then the ordinary posting pipeline; a violation on any ledger rejects the whole
        request with 422, its message prefixed with the ledger code. The Idempotency-Key covers the whole set:
        a retry with the same payload replays the stored response (200).

        ledgerLines: each ledger's entry is its mapped common lines plus its own ledgerLines, and each entry must
        balance by itself. A ledger that does not balance rejects the whole request with 422 LEDGER_UNBALANCED whose
        message names it ("ledger TAX: entry does not balance in USD: debits ..., credits ..."); nothing is written.
        Line indexes in violations count the common lines first, then that ledger's own lines. Ledger lines for a
        non-leading ledger need ledger.journal.postledger (FB50L) on top of ledger.journal.post, else 403 AUTH-0003
        before anything is written; ledger lines for the leading ledger and common lines alone do not.
      parameters:
        - $ref: "#/components/parameters/LedgerSetId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetEntryRequest" }
      responses:
        "201":
          description: One entry posted per ledger of the set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryResult" }
        "200":
          description: Replay of an identical request (idempotency.replayed = true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryResult" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
        "422": { $ref: "#/components/responses/Problem422" }
  /v1/ledger/ledgers/{id}/account-mappings:
    get:
      tags: [journal]
      operationId: listAccountMappings
      x-passage-duty: ledger.journal.read
      description: Every account mapping of this ledger, ordered by source account then effectiveFrom, 100 per page; pass nextCursor back as cursor for the next page. 404 LEDGER_NOT_FOUND for a ledger outside the caller's scope.
      parameters:
        - $ref: "#/components/parameters/LedgerId"
        - { name: cursor, in: query, required: false, description: The nextCursor of the previous page, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Account mappings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AccountMapping" }
                  nextCursor: { type: string, description: Present only when more mappings follow }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "500": { $ref: "#/components/responses/Problem500" }
    post:
      tags: [journal]
      operationId: createAccountMapping
      x-passage-duty: ledger.setup.write
      description: |
        Remaps a source account to a target account of this ledger's chart for set postings dated on or after
        effectiveFrom (BR-12.6). The latest mapping per source account valid on the posting date applies.
        Mappings are append-only; a later effectiveFrom supersedes an earlier one. The target account must exist
        and be postable in the ledger's chart (422). Mappings are never applied to a set's leading ledger, which
        always keeps the original accounts, so a mapping on a ledger that leads a set is rejected with 422
        LEDGER_MAPPING_ON_LEADING_LEDGER.
      parameters:
        - $ref: "#/components/parameters/LedgerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountMappingRequest" }
      responses:
        "201":
          description: Mapping created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountMapping" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
        "422": { $ref: "#/components/responses/Problem422" }
  /v1/ledger/journal-entries/{id}:
    get:
      tags: [journal]
      operationId: getEntry
      summary: Get a posted journal entry with its lines
      x-passage-duty: ledger.journal.read
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: Entry with lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/journal-entries/{id}/reverse:
    post:
      tags: [journal]
      operationId: reverseEntry
      x-passage-duty: ledger.journal.reverse
      description: |
        Creates an exact negating entry linked to the original (reversalOfEntryId; lines carry
        reversalOfLineId). An entry can be reversed once (LEDGER_REVERSAL_ALREADY_REVERSED); a
        reversal can itself be reversed to re-instate the original. The reversal date defaults to
        the original posting date and may not precede it (LEDGER_DATE_INVALID).
        Reversing an entry of a non-leading ledger of a ledger set also needs ledger.journal.postledger
        (FB50L, 403 AUTH-0003). An entry with an open item in an active clearing document (including a
        clearing's own difference entry) is refused with 409 LEDGER_OPEN_ITEM_ALREADY_CLEARED until that
        clearing is reset. An entry of a dimension realignment run (isRealignment) is reversed only
        through its run (409 LEDGER_REALIGNMENT_ENTRY).
        A reason code (FR-11.15) is required when the ledger's reversalReasonRequired is true; it must
        be active and apply to the ledger module, and a comment is required when the code says so. A
        code with alternativePostingDateAllowed = false refuses any date other than the original. A code
        flagged negativePostingAllowed posts storno lines (negativePosting = true, BR-11.16) when the
        ledger's negativePostingEnabled is true. Violations (422): LEDGER_REASON_REQUIRED,
        LEDGER_REASON_INVALID_MODULE, LEDGER_DATE_INVALID, LEDGER_NEGATIVE_POSTING_DISABLED.
      parameters:
        - $ref: "#/components/parameters/EntryId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                postingDate: { type: string, format: date, description: Defaults to the original posting date }
                description: { type: string, maxLength: 255 }
                reasonCode: { type: string, pattern: '^[A-Z0-9_]{1,10}$', description: Shared reason code (ledger applies_to) }
                reasonComment: { type: string, maxLength: 255 }
      responses:
        "201":
          description: Reversal posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryResult" }
        "200":
          description: Replay of an identical request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryResult" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
        "422": { $ref: "#/components/responses/Problem422" }
  /v1/ledger/validate:
    post:
      tags: [journal]
      operationId: validateEntry
      x-passage-duty: ledger.journal.post
      description: Dry run of the posting rules. Returns every violation in one response; writes nothing. A dry run against a non-leading ledger of a ledger set also needs ledger.journal.postledger (FB50L, 403 AUTH-0003), as the real post does.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostEntryRequest" }
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidateResponse" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/journal-lines:
    get:
      tags: [journal]
      operationId: listJournalLines
      x-passage-duty: ledger.journal.read
      description: |
        Ledger transactions inquiry (FR-11.14): posted lines of one ledger in posting order
        (posting sequence, line number). account_from/account_to compare account numbers as text
        (inclusive); date_from/date_to bound the posting date (inclusive); voucher and source_system
        match exactly; each dim.{ATTRIBUTE}=value (for example dim.DEPT=D100) must match the line's
        combination, all of them together (each attribute once, values 1 to 20 characters; OpenAPI
        cannot declare a dotted parameter family, so dim.* parameters are described here only).
        Pages are keyset: pass nextCursor back as cursor with the
        same filters. An unknown ledger, or one outside the caller's legal-entity scope, is 404.
      parameters:
        - { name: ledger, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: account_from, in: query, required: false, schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$' } }
        - { name: account_to, in: query, required: false, schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$' } }
        - { name: date_from, in: query, required: false, schema: { type: string, format: date } }
        - { name: date_to, in: query, required: false, schema: { type: string, format: date } }
        - { name: voucher, in: query, required: false, schema: { type: string, maxLength: 30 } }
        - { name: source_system, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: documentId, in: query, required: false, description: Only the lines of the entry posted for this source document, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, required: false, description: The nextCursor of the previous page, schema: { type: string, pattern: '^[0-9]{1,18}\.[0-9]{1,5}$' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: One page of lines
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LedgerLine" }
                  nextCursor: { type: string, description: Present only when more lines follow }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/balances:
    get:
      tags: [balances]
      operationId: trialBalance
      x-passage-duty: ledger.balance.read
      description: Trial balance per account from the balance projection, for a period range and account range.
      parameters:
        - name: ledger
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: period_from
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        - name: period_to
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        - name: account_from
          in: query
          required: false
          schema: { type: string }
        - name: account_to
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Trial balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrialBalance" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/balances:rebuild:
    post:
      tags: [ops]
      operationId: rebuildBalances
      x-passage-duty: ledger.balance.rebuild
      description: Rebuilds the balance projection of one ledger from the journal and reports differing rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ledgerId]
              properties:
                ledgerId: { type: string, format: uuid }
      responses:
        "200":
          description: Rebuild result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RebuildResult" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/reason-codes:
    get:
      tags: [reasons]
      operationId: listReasonCodes
      x-passage-duty: ledger.journal.read
      description: Shared financial reason codes of the tenant (FR-11.15), ordered by code.
      responses:
        "200":
          description: Reason codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReasonCode" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
  /v1/ledger/reason-codes/{code}:
    get:
      tags: [reasons]
      operationId: getReasonCode
      summary: Get a reason code
      x-passage-duty: ledger.journal.read
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z0-9_]{1,10}$' }
      responses:
        "200":
          description: Reason code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReasonCode" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    put:
      tags: [reasons]
      operationId: putReasonCode
      x-passage-duty: ledger.reason.write
      description: |
        Creates (201) or replaces (200) a reason code. Naturally idempotent. Codes are deactivated
        with active = false, never deleted, because journal entries reference them.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z0-9_]{1,10}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, appliesTo]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                appliesTo:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [ledger, bank, customer, vendor, fixed_asset, inventory_counting, tax, project]
                requiresComment: { type: boolean, default: false }
                negativePostingAllowed: { type: boolean, default: false }
                alternativePostingDateAllowed: { type: boolean, default: true }
                active: { type: boolean, default: true }
      responses:
        "200":
          description: Reason code replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReasonCode" }
        "201":
          description: Reason code created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReasonCode" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
  /v1/ledger/description-templates:
    get:
      tags: [templates]
      operationId: listDescriptionTemplates
      x-passage-duty: ledger.journal.read
      description: |
        Default description templates (FR-11.17): the tenant templates and the legal entity templates
        inside the caller's legal-entity scope, ordered by sourceType, language, tenant first.
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DescriptionTemplate" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
  /v1/ledger/description-templates/{id}:
    get:
      tags: [templates]
      operationId: getDescriptionTemplate
      summary: Get a default description template
      x-passage-duty: ledger.journal.read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DescriptionTemplate" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    put:
      tags: [templates]
      operationId: putDescriptionTemplate
      x-passage-duty: ledger.setup.write
      description: |
        Creates (201) or replaces (200) a default description template (FR-11.17). Naturally
        idempotent. Every placeholder %1..%9 in the template must be bound in fieldBindings and every
        binding must appear in the template. A legal entity template overrides the tenant template
        for the same sourceType and language. A second template for the same scope, legal entity,
        sourceType and language is 409 LEDGER_DESCRIPTION_TEMPLATE_DUPLICATE. A caller scoped to one
        legal entity may write only that entity's templates (403 AUTH-0003 otherwise). Posting applies
        the template when the request omits its description or a line omits its text.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DescriptionTemplateBody" }
      responses:
        "200":
          description: Template replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DescriptionTemplate" }
        "201":
          description: Template created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DescriptionTemplate" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "409": { $ref: "#/components/responses/Problem409" }
  /v1/ledger/recurring-journals:
    get:
      tags: [recurring]
      operationId: listRecurringJournals
      summary: List recurring journals
      x-passage-duty: ledger.journal.read
      description: Recurring journal templates (FR-11.10) in the caller's legal-entity scope, by next run date then name.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, paused] }
      responses:
        "200":
          description: Recurring journals without their lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RecurringJournal" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
  /v1/ledger/recurring-journals/{id}:
    get:
      tags: [recurring]
      operationId: getRecurringJournal
      summary: Get a recurring journal with its lines
      x-passage-duty: ledger.journal.read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Recurring journal
          headers:
            ETag: { $ref: "#/components/headers/RecurringETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringJournal" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    put:
      tags: [recurring]
      operationId: putRecurringJournal
      summary: Create or replace a recurring journal
      x-passage-duty: ledger.journal.write
      description: |
        Creates (201) or replaces (200) a recurring journal (FR-11.10): a journal template with a calendar
        schedule. Lines are fixed amounts or percentages of the base amount. Naturally idempotent. A
        replace sends If-Match when the caller read the template first (412 LEDGER_VERSION_CONFLICT when
        stale), replaces every line, and recomputes the next run date from the last run. The ledger cannot
        change (422 LEDGER_RECURRING_LEDGER_FIXED). Generated batches use the journal name's approval
        rules; a template never posts by itself.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringJournalBody" }
      responses:
        "200":
          description: Recurring journal replaced
          headers:
            ETag: { $ref: "#/components/headers/RecurringETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringJournal" }
        "201":
          description: Recurring journal created
          headers:
            ETag: { $ref: "#/components/headers/RecurringETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringJournal" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409":
          description: LEDGER_RECURRING_ID_CONFLICT (a concurrent create took the id, or the id belongs to a template outside the caller's legal entities)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "412": { $ref: "#/components/responses/Problem412" }
        "422": { $ref: "#/components/responses/RecurringProblem422" }
  /v1/ledger/recurring-journals/{id}/pause:
    post:
      tags: [recurring]
      operationId: pauseRecurringJournal
      summary: Pause a recurring journal
      x-passage-duty: ledger.journal.write
      description: A paused template generates nothing until it is resumed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Paused recurring journal
          headers:
            ETag: { $ref: "#/components/headers/RecurringETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringJournal" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "412": { $ref: "#/components/responses/Problem412" }
  /v1/ledger/recurring-journals/{id}/resume:
    post:
      tags: [recurring]
      operationId: resumeRecurringJournal
      summary: Resume a recurring journal
      x-passage-duty: ledger.journal.write
      description: Resumes a paused template. Runs missed while paused are skipped; the next run date moves to the first scheduled date on or after today.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Active recurring journal
          headers:
            ETag: { $ref: "#/components/headers/RecurringETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringJournal" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "412": { $ref: "#/components/responses/Problem412" }
  /v1/ledger/recurring-journals/{id}/generate:
    post:
      tags: [recurring]
      operationId: generateRecurringJournal
      summary: Generate the draft batch of a scheduled date
      x-passage-duty: ledger.journal.write
      description: |
        Creates one draft journal batch for the scheduled date, with the date as posting date, and
        records the run, in one transaction. The date is required (send the template's nextRunDate for
        the next run) and must be one of the schedule's dates between the start and end dates, so a
        period has at most one run and a retried call never generates the following period. Percent
        lines are base amount times percentage, rounded half up to the currency's minor units. A date
        that already has a run returns that run with 200 and creates nothing, so a scheduler that fires
        twice is safe. A run at or after the next run date advances the schedule to the next date after
        it; an earlier (catch-up) date leaves it. The batch then follows the normal lifecycle (submit,
        approve, post). Emits dev.passage.ledger.recurring.generated.v1.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledDate]
              properties:
                scheduledDate: { type: string, format: date, description: A date of the schedule, such as the template's nextRunDate }
                baseAmount: { type: string, description: Overrides the template's base amount for this run }
      responses:
        "200":
          description: The date already had a run; nothing was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringRun" }
        "201":
          description: Draft batch created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringRun" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/RecurringProblem409" }
        "422": { $ref: "#/components/responses/RecurringProblem422" }
  /v1/ledger/recurring-journals/{id}/runs:
    get:
      tags: [recurring]
      operationId: listRecurringJournalRuns
      summary: List the generated batches of a recurring journal
      x-passage-duty: ledger.journal.read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Runs, newest scheduled date first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RecurringRun" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /readyz:
    get:
      tags: [ops]
      operationId: readyz
      description: |
        Served on the admin port (9090), not under the API base URL: readiness is a database
        ping. The main port's /healthz and /readyz are the platform router's static probes;
        /metrics is also on the admin port.
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ready] }
        "503":
          description: Database not reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [unavailable] }
  /v1/ledger/ledgers/{ledger}/open-item-accounts:
    get:
      tags: [clearing]
      operationId: listOpenItemAccounts
      summary: List open-item account settings of a ledger
      x-passage-duty: ledger.journal.read
      description: Every account that was switched on or off for open-item management in the ledger, with the count of its items still open.
      parameters:
        - name: ledger
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The settings by account number
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/OpenItemAccount" } }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/ledgers/{ledger}/open-item-accounts/{account}:
    put:
      tags: [clearing]
      operationId: putOpenItemAccount
      summary: Switch open-item management of an account on or off
      x-passage-duty: ledger.account.write
      description: |
        When on, every non-zero line posted on the account in this ledger creates an open item
        (FR-11.19). Only postable balance-sheet accounts that are not customer or vendor
        reconciliation accounts qualify (LEDGER_OI_ACCOUNT_INVALID, 422). Switching on an account
        that has a non-zero balance in the ledger is refused with LEDGER_OI_ACTIVATION_BALANCE (422)
        because that needs an activation run, which is not built yet. Switching off needs zero open
        items (LEDGER_OI_OPEN_ITEMS_EXIST, 409). Setting the current value again is a no-op.
      parameters:
        - name: ledger
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: account
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenItemAccountBody" }
      responses:
        "200":
          description: The account already had a setting; it now holds the requested value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenItemAccount" }
        "201":
          description: First setting of the account in this ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenItemAccount" }
