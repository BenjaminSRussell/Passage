      tags: [derivation]
      operationId: putSplittingRule
      summary: Create or replace a document splitting rule
      x-passage-duty: ledger.rules.write
      description: |
        Document splitting (FR-11.23, BR-11.15) for entries of one source type. Lines that carry none of
        the splitting dimensions inherit them from the carrying lines in proportion to the carrying lines'
        absolute net amounts per dimension tuple, rounded to the currency's minor units so the parts add up
        to the line (the units left by rounding go to the largest remainders); a line that carries only some of the dimensions takes the rest from
        defaultSplittingValue (LEDGER_SPLIT_NO_SOURCE when there is none). Zero-balance clearing lines on
        zeroBalanceClearingAccount then make every dimension tuple net to zero
        (LEDGER_SPLIT_CLEARING_ACCOUNT_MISSING when one is needed and none is set). Splitting runs after
        derivation and before account, structure and validation-rule checks, only on entries that balance and
        whose amounts fit the currency's minor unit, in posting, validation, ledger-set postings, clearing
        difference entries and batch submit; reversals copy the posted lines. The clearing account must be a
        postable asset, liability or equity account that is not a reconciliation account.
        One rule exists per ledger and source type. A replace is checked against If-Match when sent
        (412 LEDGER_VERSION_CONFLICT); repeating a PUT with the same content returns 200 with the version
        unchanged and announces nothing. Otherwise announces dev.passage.ledger.rules.changed.v1 with kind
        splitting_rule.
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: If-Match
          in: header
          required: false
          description: The rule version last read, as an entity tag ("3"); when sent and stale, 412 and nothing changes
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SplittingRuleBody" }
      responses:
        "200":
          description: Rule replaced, or unchanged when the content is the same
          headers:
            ETag: { $ref: "#/components/headers/SplittingETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SplittingRule" }
        "201":
          description: Rule created
          headers:
            ETag: { $ref: "#/components/headers/SplittingETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SplittingRule" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/SplittingProblem409" }
        "412": { $ref: "#/components/responses/Problem412" }
        "422": { $ref: "#/components/responses/Problem422" }
  /v1/ledger/ledgers/{ledger}/realignments:
    get:
      tags: [derivation]
      operationId: listRealignments
      summary: List the dimension realignment runs of a ledger
      x-passage-duty: ledger.journal.read
      description: Runs newest first, without their previews (get one run for its affected rows).
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The runs of the ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RealignmentRun" } }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    post:
      tags: [derivation]
      operationId: createRealignment
      summary: Simulate a dimension realignment run
      x-passage-duty: ledger.realignment.run
      description: |
        Dimension realignment (FR-11.24) restates posted balances without touching a posted line. The filter
        (account range, period range of at most 60 periods) and the mapping (per dimension attribute, old
        value to new value) select the period balances whose combination holds an old value; the response
        lists them with the combination they would move to, their line counts and amounts. Balances with a
        zero net, combinations the mapping does not change and open-item managed accounts are left out. The
        run is stored as proposed and nothing is posted. A repeat with the same Idempotency-Key and body
        returns the stored run with 200.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealignmentRequest" }
      responses:
        "200":
          description: The stored run of a repeated Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealignmentRun" }
        "201":
          description: The run was simulated and stored as proposed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealignmentRun" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
        "422": { $ref: "#/components/responses/Problem422" }
  /v1/ledger/ledgers/{ledger}/realignments/{id}:
    get:
      tags: [derivation]
      operationId: getRealignment
      summary: Get a dimension realignment run
      x-passage-duty: ledger.journal.read
      description: One run with its affected rows, status, reason and the entries it posted and reversed.
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealignmentRun" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/ledgers/{ledger}/realignments/{id}:post:
    post:
      tags: [derivation]
      operationId: postRealignment
      summary: Post a proposed dimension realignment run
      x-passage-duty: ledger.realignment.run
      description: |
        Re-reads the balances under the ledger lock and posts one reclassification entry per period (a period
        with more than 5,000 moved balances posts several), dated the period's last day (today while the
        period is running), with source ledger/realignment, the reason code, and isRealignment set: for each
        moved balance the old combination is credited (or debited, for a credit balance) and the new one
        takes the opposite side, so the old combination's period balance returns to zero. Amounts are in the
        ledger's accounting currency (the ledger is single-currency until wave 12). Derivation and document
        splitting do not run: the old side is the stored combination and the new side the explicit mapping.
        The new side is validated like any posting (account structures, registered and active dimension
        values, and the ledger's active validation rules: line rules on the new side, header rules on the
        whole entry with source type realignment); the old side is exempt. Every period must be open, or on
        hold or closed with duty ledger.period.postclosed, else 422 LEDGER_REALIGNMENT_PERIOD_CLOSED and
        nothing is posted. Needs an active reason code of the shared catalogue that applies to ledger, with
        a comment when the code requires one. The stored preview is replaced by the posted rows. A repeat on
        a posted run returns it unchanged. Announces dev.passage.ledger.realignment.completed.v1.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealignmentActionBody" }
      responses:
        "200":
          description: The run, posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealignmentRun" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
        "422": { $ref: "#/components/responses/Problem422" }
  /v1/ledger/ledgers/{ledger}/realignments/{id}:reverse:
    post:
      tags: [derivation]
      operationId: reverseRealignment
      summary: Reverse a posted dimension realignment run
      x-passage-duty: ledger.realignment.run
      description: |
        Reverses every reclassification entry of a posted run in one transaction, with the given reason
        code and the normal reversal rules, so the balance of every combination returns to its value
        before the run. Each reversing entry is dated like its original unless postingDate is given; a
        period closed since the post is 422 LEDGER_REALIGNMENT_PERIOD_CLOSED (nothing is reversed), and
        postingDate moves every reversal into an open period instead (the cumulative balances return,
        the closed periods keep the restatement). The reversing entries carry the run and isRealignment too. A run that is not
        posted is 409 LEDGER_REALIGNMENT_STATE; a repeat on a reversed run returns it unchanged.
        Announces dev.passage.ledger.realignment.completed.v1 with reversal true.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealignmentActionBody" }
      responses:
        "200":
          description: The run, reversed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealignmentRun" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
        "422": { $ref: "#/components/responses/Problem422" }
  /v1/ledger/ledgers/{ledger}/realignments/{id}:cancel:
    post:
      tags: [derivation]
      operationId: cancelRealignment
      summary: Cancel a proposed dimension realignment run
      x-passage-duty: ledger.realignment.run
      description: Drops a proposed run; nothing was posted by it. A run in any other status is 409 LEDGER_REALIGNMENT_STATE; a repeat on a cancelled run returns it unchanged.
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealignmentActionBody" }
      responses:
        "200":
          description: The run, cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealignmentRun" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/Problem409" }
  /v1/ledger/ledgers/{ledger}/derivation-strategies:
    get:
      tags: [derivation]
      operationId: listDerivationStrategies
      summary: List the derivation strategy versions of a ledger
      x-passage-duty: ledger.journal.read
      description: Versions newest first, each with its steps and status (draft, active, retired).
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The strategy versions of the ledger
          content:
            application/json:
              schema:
                type: object
