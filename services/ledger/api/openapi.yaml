              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReasonCode" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
  /v1/ledger/reason-codes/{code}:
    get:
      tags: [reasons]
      operationId: getReasonCode
      summary: Get a reason code
      x-passage-duty: ledger.journal.read
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z0-9_]{1,10}$' }
      responses:
        "200":
          description: Reason code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReasonCode" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    put:
      tags: [reasons]
      operationId: putReasonCode
      x-passage-duty: ledger.reason.write
      description: |
        Creates (201) or replaces (200) a reason code. Naturally idempotent. Codes are deactivated
        with active = false, never deleted, because journal entries reference them.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z0-9_]{1,10}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, appliesTo]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                appliesTo:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [ledger, bank, customer, vendor, fixed_asset, inventory_counting, tax, project]
                requiresComment: { type: boolean, default: false }
                negativePostingAllowed: { type: boolean, default: false }
                alternativePostingDateAllowed: { type: boolean, default: true }
                active: { type: boolean, default: true }
      responses:
        "200":
          description: Reason code replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReasonCode" }
        "201":
          description: Reason code created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReasonCode" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
  /v1/ledger/description-templates:
    get:
      tags: [templates]
      operationId: listDescriptionTemplates
      x-passage-duty: ledger.journal.read
      description: |
        Default description templates (FR-11.17): the tenant templates and the legal entity templates
        inside the caller's legal-entity scope, ordered by sourceType, language, tenant first.
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DescriptionTemplate" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
  /v1/ledger/description-templates/{id}:
    get:
      tags: [templates]
      operationId: getDescriptionTemplate
      summary: Get a default description template
      x-passage-duty: ledger.journal.read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DescriptionTemplate" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    put:
      tags: [templates]
      operationId: putDescriptionTemplate
      x-passage-duty: ledger.setup.write
      description: |
        Creates (201) or replaces (200) a default description template (FR-11.17). Naturally
        idempotent. Every placeholder %1..%9 in the template must be bound in fieldBindings and every
        binding must appear in the template. A legal entity template overrides the tenant template
        for the same sourceType and language. A second template for the same scope, legal entity,
        sourceType and language is 409 LEDGER_DESCRIPTION_TEMPLATE_DUPLICATE. A caller scoped to one
        legal entity may write only that entity's templates (403 AUTH-0003 otherwise). Posting applies
        the template when the request omits its description or a line omits its text.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DescriptionTemplateBody" }
      responses:
        "200":
          description: Template replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DescriptionTemplate" }
        "201":
          description: Template created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DescriptionTemplate" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "409": { $ref: "#/components/responses/Problem409" }
  /v1/ledger/recurring-journals:
    get:
      tags: [recurring]
      operationId: listRecurringJournals
      summary: List recurring journals
      x-passage-duty: ledger.journal.read
      description: Recurring journal templates (FR-11.10) in the caller's legal-entity scope, by next run date then name.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, paused] }
      responses:
        "200":
          description: Recurring journals without their lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RecurringJournal" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
  /v1/ledger/recurring-journals/{id}:
    get:
      tags: [recurring]
      operationId: getRecurringJournal
      summary: Get a recurring journal with its lines
      x-passage-duty: ledger.journal.read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Recurring journal
          headers:
            ETag: { $ref: "#/components/headers/RecurringETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringJournal" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    put:
      tags: [recurring]
      operationId: putRecurringJournal
      summary: Create or replace a recurring journal
      x-passage-duty: ledger.journal.write
      description: |
        Creates (201) or replaces (200) a recurring journal (FR-11.10): a journal template with a calendar
        schedule. Lines are fixed amounts or percentages of the base amount. Naturally idempotent. A
        replace sends If-Match when the caller read the template first (412 LEDGER_VERSION_CONFLICT when
        stale), replaces every line, and recomputes the next run date from the last run. The ledger cannot
        change (422 LEDGER_RECURRING_LEDGER_FIXED). Generated batches use the journal name's approval
        rules; a template never posts by itself.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringJournalBody" }
      responses:
        "200":
          description: Recurring journal replaced
          headers:
            ETag: { $ref: "#/components/headers/RecurringETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringJournal" }
        "201":
          description: Recurring journal created
          headers:
            ETag: { $ref: "#/components/headers/RecurringETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringJournal" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409":
          description: LEDGER_RECURRING_ID_CONFLICT (a concurrent create took the id, or the id belongs to a template outside the caller's legal entities)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "412": { $ref: "#/components/responses/Problem412" }
        "422": { $ref: "#/components/responses/RecurringProblem422" }
  /v1/ledger/recurring-journals/{id}/pause:
    post:
      tags: [recurring]
      operationId: pauseRecurringJournal
      summary: Pause a recurring journal
      x-passage-duty: ledger.journal.write
      description: A paused template generates nothing until it is resumed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Paused recurring journal
          headers:
            ETag: { $ref: "#/components/headers/RecurringETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringJournal" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "412": { $ref: "#/components/responses/Problem412" }
  /v1/ledger/recurring-journals/{id}/resume:
    post:
      tags: [recurring]
      operationId: resumeRecurringJournal
      summary: Resume a recurring journal
      x-passage-duty: ledger.journal.write
      description: Resumes a paused template. Runs missed while paused are skipped; the next run date moves to the first scheduled date on or after today.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Active recurring journal
          headers:
            ETag: { $ref: "#/components/headers/RecurringETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringJournal" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "412": { $ref: "#/components/responses/Problem412" }
  /v1/ledger/recurring-journals/{id}/generate:
    post:
      tags: [recurring]
      operationId: generateRecurringJournal
      summary: Generate the draft batch of a scheduled date
      x-passage-duty: ledger.journal.write
      description: |
        Creates one draft journal batch for the scheduled date, with the date as posting date, and
        records the run, in one transaction. The date is required (send the template's nextRunDate for
        the next run) and must be one of the schedule's dates between the start and end dates, so a
        period has at most one run and a retried call never generates the following period. Percent
        lines are base amount times percentage, rounded half up to the currency's minor units. A date
        that already has a run returns that run with 200 and creates nothing, so a scheduler that fires
        twice is safe. A run at or after the next run date advances the schedule to the next date after
        it; an earlier (catch-up) date leaves it. The batch then follows the normal lifecycle (submit,
        approve, post). Emits dev.passage.ledger.recurring.generated.v1.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledDate]
              properties:
                scheduledDate: { type: string, format: date, description: A date of the schedule, such as the template's nextRunDate }
                baseAmount: { type: string, description: Overrides the template's base amount for this run }
      responses:
        "200":
          description: The date already had a run; nothing was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringRun" }
        "201":
          description: Draft batch created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringRun" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/RecurringProblem409" }
        "422": { $ref: "#/components/responses/RecurringProblem422" }
  /v1/ledger/recurring-journals/{id}/runs:
    get:
      tags: [recurring]
      operationId: listRecurringJournalRuns
      summary: List the generated batches of a recurring journal
      x-passage-duty: ledger.journal.read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Runs, newest scheduled date first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RecurringRun" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /readyz:
    get:
      tags: [ops]
      operationId: readyz
      description: |
        Served on the admin port (9090), not under the API base URL: readiness is a database
        ping. The main port's /healthz and /readyz are the platform router's static probes;
        /metrics is also on the admin port.
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ready] }
        "503":
          description: Database not reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [unavailable] }
  /v1/ledger/ledgers/{ledger}/open-item-accounts:
    get:
      tags: [clearing]
      operationId: listOpenItemAccounts
      summary: List open-item account settings of a ledger
      x-passage-duty: ledger.journal.read
      description: Every account that was switched on or off for open-item management in the ledger, with the count of its items still open.
      parameters:
        - name: ledger
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The settings by account number
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/OpenItemAccount" } }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/ledgers/{ledger}/open-item-accounts/{account}:
    put:
      tags: [clearing]
      operationId: putOpenItemAccount
      summary: Switch open-item management of an account on or off
      x-passage-duty: ledger.account.write
      description: |
        When on, every non-zero line posted on the account in this ledger creates an open item
        (FR-11.19). Only postable balance-sheet accounts that are not customer or vendor
        reconciliation accounts qualify (LEDGER_OI_ACCOUNT_INVALID, 422). Switching on an account
        that has a non-zero balance in the ledger is refused with LEDGER_OI_ACTIVATION_BALANCE (422)
        because that needs an activation run, which is not built yet. Switching off needs zero open
        items (LEDGER_OI_OPEN_ITEMS_EXIST, 409). Setting the current value again is a no-op.
      parameters:
        - name: ledger
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: account
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenItemAccountBody" }
      responses:
        "200":
          description: The account already had a setting; it now holds the requested value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenItemAccount" }
        "201":
          description: First setting of the account in this ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenItemAccount" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/ClearingProblem409" }
        "422": { $ref: "#/components/responses/ClearingProblem422" }
  /v1/ledger/ledgers/{ledger}/tolerance-groups:
    get:
      tags: [clearing]
      operationId: listToleranceGroups
      summary: List tolerance groups of a ledger
      x-passage-duty: ledger.journal.read
      parameters:
        - name: ledger
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The tolerance groups by code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ToleranceGroup" } }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/ledgers/{ledger}/tolerance-groups/{code}:
    get:
      tags: [clearing]
      operationId: getToleranceGroup
      summary: Get a tolerance group
      x-passage-duty: ledger.journal.read
      parameters:
        - name: ledger
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z0-9_]{1,10}$' }
      responses:
        "200":
          description: The tolerance group; its version is in the ETag header
          headers:
            ETag: { $ref: "#/components/headers/ToleranceETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToleranceGroup" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    put:
      tags: [clearing]
      operationId: putToleranceGroup
      summary: Create or replace a tolerance group
      x-passage-duty: ledger.clearing.rules
      description: |
        A tolerance group is the largest residual a manual clearing may write off to its difference
        account (OBA0 semantics, BR-11.12): a debit residual up to the debit limit, a credit residual
        up to the credit limit and, when a percentage limit is set, up to that share of the selection's
        absolute total (debit plus credit). Groups are deactivated, never deleted. A
        replace is checked against If-Match when sent (412 LEDGER_VERSION_CONFLICT).
      parameters:
        - name: ledger
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z0-9_]{1,10}$' }
        - name: If-Match
          in: header
          required: false
          description: The tolerance group version last read, as an entity tag ("3"); when sent and stale, 412 and nothing changes
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToleranceGroupBody" }
      responses:
        "200":
          description: Group replaced
          headers:
            ETag: { $ref: "#/components/headers/ToleranceETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToleranceGroup" }
        "201":
          description: Group created
          headers:
            ETag: { $ref: "#/components/headers/ToleranceETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToleranceGroup" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "412": { $ref: "#/components/responses/Problem412" }
        "422": { $ref: "#/components/responses/ClearingProblem422" }
  /v1/ledger/open-items:
    get:
      tags: [clearing]
      operationId: listOpenItems
      summary: List open items of a ledger
      x-passage-duty: ledger.journal.read
      description: |
        Open items of open-item managed accounts, oldest first, one keyset page at a time. Status
        open also returns reset_open items, which can be cleared again. Dimension filters are exact
        matches written dim.{ATTRIBUTE}.
      parameters:
        - { name: ledger, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: account, in: query, required: false, schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$' } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, cleared, reset_open, voided] } }
        - { name: assignment, in: query, required: false, schema: { type: string, maxLength: 50 } }
        - { name: cursor, in: query, required: false, description: The nextCursor of the previous page, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: One page of open items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenItemPage" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/clearings:simulate:
    post:
      tags: [clearing]
      operationId: simulateClearing
      summary: Preview the residual and outcome of a clearing
      x-passage-duty: ledger.clearing.write
      description: Stateless. Applies the same checks as POST /clearings and reports the residual and what would happen to it, without writing anything.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClearingRequest" }
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClearingPreview" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/ClearingProblem409" }
        "422": { $ref: "#/components/responses/ClearingProblem422" }
  /v1/ledger/clearings:
    get:
      tags: [clearing]
      operationId: listClearings
      summary: List clearing documents of a ledger
      x-passage-duty: ledger.journal.read
      description: Newest first, at most 200.
      parameters:
        - { name: ledger, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [cleared, reset] } }
      responses:
        "200":
          description: The clearing documents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ClearingDocument" } }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    post:
      tags: [clearing]
      operationId: createClearing
      summary: Clear open items
      x-passage-duty: ledger.clearing.write
      description: |
        Manual clearing (F-03 semantics) of 2 to 10,000 open items of one open-item managed account,
        in one transaction. A zero net clears them. A residual within the named tolerance group (its
        debit limit for a debit residual, its credit limit for a credit residual, and its percentage of
        the selection's absolute total when set) is posted to its difference account and cleared with
        them; the difference account may not itself be open-item managed
        (LEDGER_CLEARING_DIFFERENCE_ACCOUNT). A residual above tolerance becomes a
        new open item when residualItem is true and is otherwise refused (LEDGER_CLEARING_UNBALANCED,
        422). An item already in a clearing is LEDGER_OPEN_ITEM_ALREADY_CLEARED (409). The clearing
        date may not precede the latest posting date of the items. A repeated Idempotency-Key returns
        the same document with 200. Emits dev.passage.ledger.openitem.cleared.v1.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClearingRequest" }
      responses:
        "200":
          description: The Idempotency-Key was used before with the same request; the stored document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClearingDocument" }
        "201":
          description: Items cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClearingDocument" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/ClearingProblem409" }
        "422": { $ref: "#/components/responses/ClearingProblem422" }
  /v1/ledger/clearings/{id}:
    get:
      tags: [clearing]
      operationId: getClearing
      summary: Get a clearing document with its items
      x-passage-duty: ledger.journal.read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The clearing document and the items it holds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClearingDocument" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/clearings/{id}/reset:
    post:
      tags: [clearing]
      operationId: resetClearing
      summary: Reset a clearing document
      x-passage-duty: ledger.clearing.reset
      description: |
        Resets the clearing as a whole (BR-11.13) with a required reason code: an active shared reason
        code that applies to ledger (LEDGER_REASON_REQUIRED, 422, when unknown, inactive or missing a
        required comment). Its items are reset_open and clearable again, the difference entry is
        reversed with the reason code and its two items are voided, and a residual
        item is voided, which needs it to be still open (LEDGER_CLEARING_RESIDUAL_USED, 409).
        Resetting a reset document is LEDGER_CLEARING_ALREADY_RESET (409) unless the Idempotency-Key
        is the one that reset it, which returns the document. Emits dev.passage.ledger.openitem.cleared.v1
        with status reset.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetClearingRequest" }
      responses:
        "200":
          description: The reset document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClearingDocument" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/ClearingProblem409" }
        "422": { $ref: "#/components/responses/ClearingProblem422" }
