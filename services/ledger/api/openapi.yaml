  /v1/ledger/ledgers/{ledger}/account-structures/{id}:
    parameters:
      - name: ledger
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [structures]
      operationId: getAccountStructure
      summary: Get an account structure
      x-passage-duty: ledger.journal.read
      responses:
        "200":
          description: One structure version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Structure" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    put:
      tags: [structures]
      operationId: putAccountStructure
      x-passage-duty: ledger.structure.write
      description: |
        Creates (201) or replaces (200) a version. Drafts change freely; setting status to
        active activates the version. An active version is immutable except that it may be
        retired with identical content; a retired version is final (409 LEDGER_STRUCTURE_LOCKED).
        A duplicate (name, version) on the ledger is 409 LEDGER_STRUCTURE_VERSION_EXISTS.
        Segments are checked against the ledger's dimension attributes; every violation is
        returned together (422 LEDGER_STRUCTURE_INVALID).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StructureBody" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Structure" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Structure" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409":
          description: LEDGER_STRUCTURE_LOCKED or LEDGER_STRUCTURE_VERSION_EXISTS
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/Problem422" }
  /v1/ledger/ledgers/{ledger}/dimension-values:
    parameters:
