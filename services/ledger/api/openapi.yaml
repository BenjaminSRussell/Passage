          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        - name: period_to
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        - name: account_from
          in: query
          required: false
          schema: { type: string }
        - name: account_to
          in: query
