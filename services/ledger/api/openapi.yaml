    get:
      tags: [clearing]
      operationId: listAutoClearingRules
      summary: List automatic clearing rules of a ledger
      x-passage-duty: ledger.journal.read
      description: In run order (sequence, then name).
      parameters:
        - name: ledger
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
