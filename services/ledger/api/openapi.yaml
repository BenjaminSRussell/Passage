        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/ledgers/{ledger}/auto-clearing-rules/{id}:
    get:
      tags: [clearing]
      operationId: getAutoClearingRule
      summary: Get an automatic clearing rule
      x-passage-duty: ledger.journal.read
      parameters:
        - name: ledger
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The rule; its version is in the ETag header
          headers:
            ETag: { $ref: "#/components/headers/AutoRuleETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoClearingRule" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    put:
      tags: [clearing]
      operationId: putAutoClearingRule
      summary: Create or replace an automatic clearing rule
      x-passage-duty: ledger.clearing.rules
      description: |
        A rule (OB74 semantics, FR-11.20) names an account range and up to five ordered criteria that
        group the open items of each account. The id is chosen by the caller. A group that nets to zero
        clears as one document; with allowTolerance the named active tolerance group also lets a
        group with a small net clear. Rules are deactivated, never deleted. A replace is checked
        against If-Match when sent (412 LEDGER_VERSION_CONFLICT).
      parameters:
        - name: ledger
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          required: false
          description: The rule version last read, as an entity tag ("3"); when sent and stale, 412 and nothing changes
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoClearingRuleBody" }
      responses:
        "200":
          description: Rule replaced
          headers:
            ETag: { $ref: "#/components/headers/AutoRuleETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoClearingRule" }
        "201":
          description: Rule created
          headers:
            ETag: { $ref: "#/components/headers/AutoRuleETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoClearingRule" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/AutoRuleProblem409" }
        "412": { $ref: "#/components/responses/Problem412" }
        "422": { $ref: "#/components/responses/AutoRuleProblem422" }
  /v1/ledger/auto-clearing:run:
    post:
      tags: [clearing]
      operationId: runAutoClearing
      summary: Run automatic clearing
      x-passage-duty: ledger.clearing.run
      description: |
        Groups the open items of every active rule (or one rule) and clears each group that nets to
        zero, or within the rule's tolerance, as its own clearing document (mode auto, idempotency key
        auto:{rule}:{group hash}, suffixed when the same group was cleared and reset before). It never makes a residual item. A group that cannot clear, for
        example because another clearing took an item meanwhile, is logged as skipped with the reason
        and the run continues. simulate writes nothing and returns the proposed and skipped groups
        (200). clear stores the run and its group log under the Idempotency-Key (201; a repeat with the
        same body returns the stored run with 200, another body is LEDGER_IDEMPOTENCY_CONFLICT, 409).
        Each cleared group emits dev.passage.ledger.openitem.cleared.v1.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Required for mode clear; trimmed, 1 to 128 characters
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoClearingRunRequest" }
      responses:
        "200":
          description: A simulation, or the stored run of a repeated Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoClearingRun" }
        "201":
          description: The run was stored; groups are cleared or skipped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoClearingRun" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/AutoRunProblem409" }
        "422": { $ref: "#/components/responses/AutoRunProblem422" }
