                  items: { type: array, items: { $ref: "#/components/schemas/DerivationStrategy" } }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/ledgers/{ledger}/derivation-strategies/{version}:
    get:
      tags: [derivation]
      operationId: getDerivationStrategy
      summary: Get one derivation strategy version
      x-passage-duty: ledger.journal.read
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: The strategy version; its lockVersion is in the ETag header
          headers:
            ETag: { $ref: "#/components/headers/StrategyETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DerivationStrategy" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    put:
      tags: [derivation]
      operationId: putDerivationStrategy
      summary: Create the next draft version or replace a draft
      x-passage-duty: ledger.rules.write
      description: |
        A new version number must be the highest existing one plus one. Only a draft is replaced
        (409 LEDGER_DERIVATION_STRATEGY_NOT_DRAFT); a replace is checked against If-Match when sent.
        Steps run in sequence before account structure validation (FR-11.22, BR-11.14). Precedence:
        a value the posting request carries is never changed; a step with overwrite replaces a value
        set by an earlier step; a step without overwrite only fills a blank.
        Shape problems (unknown field, a step reading its own target, clear without overwrite,
        more than 50 steps) are 422 LEDGER_DERIVATION_INVALID.
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - name: If-Match
          in: header
          required: false
          description: The lockVersion last read, as an entity tag ("3"); when sent and stale, 412 and nothing changes
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DerivationStrategyBody" }
      responses:
        "200":
          description: Draft replaced
          headers:
            ETag: { $ref: "#/components/headers/StrategyETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DerivationStrategy" }
        "201":
          description: Draft created
          headers:
            ETag: { $ref: "#/components/headers/StrategyETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DerivationStrategy" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/DerivationProblem409" }
        "412": { $ref: "#/components/responses/Problem412" }
        "422": { $ref: "#/components/responses/Problem422" }
  /v1/ledger/ledgers/{ledger}/derivation-strategies/{version}/activate:
    post:
      tags: [derivation]
      operationId: activateDerivationStrategy
      summary: Activate a draft derivation strategy
      x-passage-duty: ledger.rules.write
      description: |
        Validates the draft against the ledger's dimension attributes and lookup tables (422
        LEDGER_DERIVATION_INVALID), retires the active version and activates this one in one
        transaction, and announces dev.passage.ledger.rules.changed.v1. Activating the active
        version again changes nothing. Postings from then on run the steps and record the
        step ids on each line they changed.
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - name: If-Match
          in: header
          required: false
          description: The lockVersion last read, as an entity tag ("3"); when sent and stale, 412
          schema: { type: string }
      responses:
        "200":
          description: The active strategy version
          headers:
            ETag: { $ref: "#/components/headers/StrategyETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DerivationStrategy" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/DerivationProblem409" }
        "412": { $ref: "#/components/responses/Problem412" }
        "422": { $ref: "#/components/responses/Problem422" }
  /v1/ledger/ledgers/{ledger}/advanced-rules:
    get:
      tags: [advanced-rules]
      operationId: listAdvancedRules
      summary: List the advanced rules of a ledger
      x-passage-duty: ledger.journal.read
      description: Every advanced rule of the ledger, by structure version, priority and name; structureId narrows the list to one structure version.
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: structureId, in: query, required: false, description: Only the rules of this account structure version, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The advanced rules of the ledger
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdvancedRule" } }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/ledgers/{ledger}/advanced-rules/{id}:
    get:
      tags: [advanced-rules]
      operationId: getAdvancedRule
      summary: Get one advanced rule
      x-passage-duty: ledger.journal.read
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The rule; its lockVersion is in the ETag header
          headers:
            ETag: { $ref: "#/components/headers/AdvancedRuleETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdvancedRule" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    put:
      tags: [advanced-rules]
      operationId: putAdvancedRule
      summary: Create or replace an advanced rule
      x-passage-duty: ledger.structure.write
      description: |
        Creates (201) or replaces (200) an advanced rule of a draft account structure version (FR-11.16,
        AC-11.18). When a line matches the filter, the rule's segments and constraint rows are appended to
        the structure that governs the line; for example "accounts 5000..5999 and DEPT = D100 add PROJECT
        (required)" makes a line on 5100/D100 without PROJECT fail with LEDGER_DIMENSION_REQUIRED, while a
        line on 5100/D200 posts without it. Rules share the structure version's activation: a version that
        is active or retired is 409 LEDGER_STRUCTURE_LOCKED, so change a rule by creating a new structure
        version. A replace is checked against If-Match when sent and cannot move the rule to another
        structure version. Re-sending the stored content changes nothing (same lockVersion, no event), also
        once the version is active. Definition problems (unknown attribute, a segment the structure already has,
        a malformed token, more than 20 segments in all) are 422 with every violation, under
        LEDGER_ADVANCED_RULE_INVALID or LEDGER_ADVANCED_RULE_SEGMENT_LIMIT. Announces
        dev.passage.ledger.rules.changed.v1 with kind advanced_rule.
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: If-Match
          in: header
          required: false
          description: The lockVersion last read, as an entity tag ("3"); when sent and stale, 412 and nothing changes
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdvancedRuleBody" }
      responses:
        "200":
          description: Rule replaced
          headers:
            ETag: { $ref: "#/components/headers/AdvancedRuleETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdvancedRule" }
        "201":
          description: Rule created
          headers:
            ETag: { $ref: "#/components/headers/AdvancedRuleETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdvancedRule" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/AdvancedRuleProblem409" }
        "412": { $ref: "#/components/responses/Problem412" }
        "422": { $ref: "#/components/responses/Problem422" }
  /v1/ledger/journal-batches/{id}/attachments:
    get:
      tags: [attachments]
      operationId: listBatchAttachments
      summary: List the attachments and notes of a journal batch
      x-passage-duty: ledger.journal.read
      description: |
        The files and notes of the batch, oldest first (FR-11.11, FR-11.18). For a posted batch every file
        carries retainedUntil, the posting date plus its retention class.
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: The attachments and notes of the batch
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/journal-batches/{id}/attachments/{attachmentId}:
    put:
      tags: [attachments]
      operationId: putBatchAttachment
      summary: Add an attachment or a note to a journal batch
      x-passage-duty: ledger.journal.write
      description: |
        Adds a file reference or a note under an id the client chooses (FR-11.11, FR-11.18); the request is
        idempotent on that id. The ledger stores the metadata and the store reference (an object-storage key under the
        caller's tenant prefix or a dms:// URI), not the bytes; the content type and size are the caller's assertion. A file has a document type (default other), a retention class
        (default financial_record_10y), an allowed content type and 1 byte to 25 MB; a batch holds at most 50
        files and 200 notes. Re-sending the stored content answers 200 and changes nothing; other content under
        the id is 409 LEDGER_ATTACHMENT_CONFLICT. A posted or cancelled batch is immutable (409 LEDGER_BATCH_STATE).
        Malformed content is 422 LEDGER_ATTACHMENT_INVALID with every violation. Announces
        dev.passage.ledger.batch.attachmentchanged.v1 with action added.
      parameters:
        - $ref: "#/components/parameters/EntryId"
        - $ref: "#/components/parameters/AttachmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachmentBody" }
      responses:
        "200":
          description: The same content was already stored under the id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "201":
          description: Attachment or note added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/AttachmentProblem409" }
        "422": { $ref: "#/components/responses/Problem422" }
    delete:
      tags: [attachments]
      operationId: deleteBatchAttachment
      summary: Remove an attachment or a note from a journal batch
      x-passage-duty: ledger.journal.write
      description: |
        Before the batch is posted an attachment or note can be removed freely. After posting a file is retained
        for its retention class from the posting date: removing it earlier is 409 LEDGER_ATTACHMENT_RETAINED,
        and a note of a posted batch is 409 LEDGER_BATCH_STATE. Announces
        dev.passage.ledger.batch.attachmentchanged.v1 with action removed.
      parameters:
        - $ref: "#/components/parameters/EntryId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "204":
          description: Removed
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/AttachmentProblem409" }
  /v1/ledger/journal-entries/{id}/attachments:
    get:
      tags: [attachments]
      operationId: listEntryAttachments
      summary: List the attachments and notes of the batch that was posted as an entry
      x-passage-duty: ledger.journal.read
      description: |
        The voucher's attachments stay readable from the posted entry (FR-11.18). An entry that did not come
        from a journal batch has none.
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: The attachments and notes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/ledgers/{ledger}/validation-rules:
    get:
      tags: [validation]
      operationId: listValidationRules
      summary: List the validation rules of a ledger
      x-passage-duty: ledger.journal.read
      description: Every rule, active or not, in evaluation order (sequence, then name).
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The validation rules of the ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ValidationRule" } }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
  /v1/ledger/ledgers/{ledger}/validation-rules/{id}:
    get:
      tags: [validation]
      operationId: getValidationRule
      summary: Get one validation rule
      x-passage-duty: ledger.journal.read
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The rule; its lockVersion is in the ETag header
          headers:
            ETag: { $ref: "#/components/headers/ValidationRuleETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationRule" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
    put:
      tags: [validation]
      operationId: putValidationRule
      summary: Create or replace a validation rule
      x-passage-duty: ledger.rules.write
      description: |
        A rule has a prerequisite and a check, each a list of conditions that must all hold. It fails on a
        line (level line) or on the entry (level header) when its prerequisite holds and its check does not
        (FR-11.21, AC-11.14). An active rule runs in the posting pipeline after account structure validation,
        in `POST /v1/ledger/validate`, and when a journal batch is submitted. An error rule refuses the entry
        with 422 LEDGER_VALIDATION_RULE_FAILED naming the rule and `lineIndex`; a warning rule returns the same
        problem in `warnings` of the dry run and as a notice on the posted entry. A replace is checked against
        If-Match when sent. Shape problems (unknown field, wrong number of values, a header rule reading a line
        field) are 422 LEDGER_VALIDATION_RULE_INVALID. Announces dev.passage.ledger.rules.changed.v1.
      parameters:
        - { name: ledger, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: If-Match
          in: header
          required: false
          description: The lockVersion last read, as an entity tag ("3"); when sent and stale, 412 and nothing changes
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidationRuleBody" }
      responses:
        "200":
          description: Rule replaced
          headers:
            ETag: { $ref: "#/components/headers/ValidationRuleETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationRule" }
        "201":
          description: Rule created
          headers:
            ETag: { $ref: "#/components/headers/ValidationRuleETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationRule" }
        "400": { $ref: "#/components/responses/Problem400" }
        "401": { $ref: "#/components/responses/Problem401" }
        "403": { $ref: "#/components/responses/Problem403" }
        "404": { $ref: "#/components/responses/Problem404" }
        "409": { $ref: "#/components/responses/ValidationRuleProblem409" }
        "412": { $ref: "#/components/responses/Problem412" }
        "422": { $ref: "#/components/responses/Problem422" }
