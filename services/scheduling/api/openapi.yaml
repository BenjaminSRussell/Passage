                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LateOrder' }
                  truncated: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/order-imports:
    get:
      operationId: listOrderImports
      summary: Production orders received from wave 21 and what became of their operations
      description: >
        Scheduling consumes `dev.passage.production.order.scheduled.v1` and registers each route operation of the
        order as an operation to schedule (process hours as minutes, rounded up; setup hours as route setup; the
        resources of the process jobs as candidates; the delivery date as the due date). This lists the latest
        event of each order, most recent first, with the operations that could not be registered and why.
      x-passage-duty: scheduling.read
      parameters:
        - name: status
          in: query
          required: false
