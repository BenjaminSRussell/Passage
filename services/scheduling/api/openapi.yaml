      x-passage-duty: scheduling.read
      parameters:
        - name: period
          in: query
          required: false
          description: Bucket size. `week` (default) buckets by Monday-start UTC weeks and flags bottlenecks; `day` buckets by local day of each resource's calendar time zone (BR-23.7) and never flags (FR-23.9).
          schema: { type: string, enum: [week, day], default: week }
        - name: from
          in: query
          required: false
          description: Date (YYYY-MM-DD); defaults to today. Weeks start on the Monday of this date, days on this date.
          schema: { type: string, format: date }
        - name: weeks
          in: query
