openapi: 3.1.0
info:
  title: Passage Scheduling
  version: 0.1.0
  description: >
    Finite capacity scheduling (wave 23, PSG-23). Routes match the handlers in
    internal/api. Errors are RFC 9457 problem details (application/problem+json)
    with a stable `code`; see README.md for the error codes.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/scheduling/resources:
    post:
      operationId: createResource
      summary: Create a resource with its weekly calendar
      x-passage-duty: scheduling.capacity.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceRequest' }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listResources
      summary: Resources ordered by code
      x-passage-duty: scheduling.read
      responses:
        '200':
          description: Resources
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Resource' }
  /v1/scheduling/resources/{id}:
    get:
      operationId: getResource
      summary: One resource with its weekly calendar
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The resource
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/resources/{id}/capacity:
    get:
      operationId: getResourceCapacity
      summary: Open capacity intervals (UTC) of a resource in a window of at most 62 days (FR-23.1)
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Open intervals clipped to the window
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Interval' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/operations:
    post:
      operationId: createOperation
      summary: Add a schedulable operation of an order
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationRequest' }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listOperations
      summary: Operations ordered by order and operation number
      x-passage-duty: scheduling.read
      parameters:
        - name: orderId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, scheduled, unplaced] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Operations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/runs:
    post:
      operationId: createRun
      summary: Run the forward heuristic over the site or a selection of operations
      x-passage-duty: scheduling.run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunRequest' }
      responses:
        '201':
          description: 'Run completed. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listRuns
      summary: Schedule runs, newest first
      x-passage-duty: scheduling.read
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/runs/{id}:
    get:
      operationId: getRun
      summary: Run status and metrics
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/gantt:
    get:
      operationId: listGantt
      summary: Scheduled segments for a Gantt window (at most 5,000 bars)
      x-passage-duty: scheduling.read
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: resourceIds
          in: query
          required: false
          description: Comma-separated resource UUIDs.
          schema: { type: string }
      responses:
        '200':
          description: Bars in the window
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Bar' }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/jobs/{id}:move:
    post:
      operationId: moveJob
      summary: Move or reassign a job; dryRun previews violations and dependents
      description: >
        A commit (dryRun false) requires Idempotency-Key; a replay returns the
        stored outcome with Idempotent-Replayed: true. A preview writes nothing
        and needs no key. Firmed jobs cannot be moved (SCHED-0008).
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: false
          description: Required when dryRun is false.
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveRequest' }
      responses:
        '200':
          description: Preview or committed move. Infeasible dry runs return feasible=false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/jobs/{id}:firm:
    post:
      operationId: firmJob
      summary: Firm or unfirm a placement; firmed placements are frozen against later runs
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firmed]
              properties:
                firmed: { type: boolean }
      responses:
        '200':
          description: 'Updated placement. A replay carries Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Firm' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/capacity-load:
    get:
      operationId: listCapacityLoad
      summary: Booked versus open minutes per resource and week, with bottleneck flags
      x-passage-duty: scheduling.read
      parameters:
        - name: from
          in: query
          required: false
          description: Date (YYYY-MM-DD); defaults to today.
          schema: { type: string, format: date }
        - name: weeks
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 53, default: 4 }
        - name: resourceIds
          in: query
          required: false
          description: Comma-separated resource UUIDs; all resources when omitted.
          schema: { type: string }
      responses:
        '200':
          description: Weekly load (weeks start Monday 00:00 UTC)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LoadItem' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/networks:
    post:
      operationId: createNetwork
      summary: Create a resource network with its allowed transitions (FR-23.13)
      x-passage-duty: scheduling.setup.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkRequest' }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listNetworks
      summary: Resource networks ordered by code, with their edges
      x-passage-duty: scheduling.read
      responses:
        '200':
          description: Networks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Network' }
  /v1/scheduling/networks/{id}:
    get:
      operationId: getNetwork
      summary: One resource network with its edges
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The network
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/setup-matrices:
    post:
      operationId: createSetupMatrix
      summary: Create the next version of a resource's setup matrix (FR-23.15)
      x-passage-duty: scheduling.setup.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupMatrixRequest' }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupMatrix' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listSetupMatrices
      summary: Setup matrices, newest version first
      x-passage-duty: scheduling.read
      parameters:
        - name: resourceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Setup matrices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SetupMatrix' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/setup-matrices/{id}:
    get:
      operationId: getSetupMatrix
      summary: One setup matrix with its changeover entries
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupMatrix' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/cleanout-rules:
    post:
      operationId: createCleanoutRule
      summary: Create the cleanout rule of a setup group (FR-23.15, BR-23.13)
      x-passage-duty: scheduling.setup.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CleanoutRuleRequest' }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanoutRule' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCleanoutRules
      summary: Cleanout rules ordered by setup group
      x-passage-duty: scheduling.read
      responses:
        '200':
          description: Cleanout rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CleanoutRule' }
  /v1/scheduling/capacity-blocks:
    post:
      operationId: createCapacityBlock
      summary: Create a capacity block restricted to an attribute condition (FR-23.17)
      x-passage-duty: scheduling.capacity.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapacityBlockRequest' }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityBlock' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCapacityBlocks
      summary: Capacity blocks by resource, highest priority first
      x-passage-duty: scheduling.read
      parameters:
        - name: resourceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Capacity blocks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CapacityBlock' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns:
    post:
      operationId: createCampaign
      summary: Create a proposed campaign with its orders (FR-23.14)
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignRequest' }
      responses:
        '201':
          description: 'Created, with ETag "<version>". An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCampaigns
      summary: Campaigns, newest first (without their orders)
      x-passage-duty: scheduling.read
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [proposed, planned, started, completed, cancelled] }
        - name: resourceId
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Campaigns
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Campaign' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}:
    get:
      operationId: getCampaign
      summary: One campaign with its orders in run order; ETag carries the version
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}/orders:
    post:
      operationId: addCampaignOrder
      summary: Add an order to a campaign that has not started; clears its sequence (SCHED-0011 when started)
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignOrderRequest' }
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}/orders/{orderId}:
    delete:
      operationId: removeCampaignOrder
      summary: Take an order out of a campaign that has not started; clears its sequence
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}:sequence:
    post:
      operationId: sequenceCampaign
      summary: >
        Sequence the campaign with the setup matrix in force on its planned start
        (BR-23.12) and insert cleanouts (BR-23.13); the campaign becomes planned and
        campaign.sequenced is published. SCHED-0012 warnings list pairs without a matrix entry.
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}:start:
    post:
      operationId: startCampaign
      summary: Start a planned campaign; it is frozen afterwards and campaign.started is published
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}:allocate-cost:
    post:
      operationId: allocateCampaignCost
      summary: >
        Compute the allocation of a campaign's setup and cleanout cost to its orders
        (FR-23.16, BR-23.14). Nothing is posted or stored, so no Idempotency-Key is needed.
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllocationRequest' }
      responses:
        '200':
          description: The allocation; amounts sum exactly to the cost
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Allocation' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: healthz
      summary: Liveness
      security: []
      responses:
        '200': { description: Process is up }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness (Postgres reachable)
      security: []
      responses:
        '200': { description: Ready }
        '503': { description: Database unreachable }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The campaign version from its ETag, for example "3". A stale version gets 412 SCHED-0115.
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Campaign:
      description: 'The changed campaign with ETag "<version>". A replay of the same Idempotency-Key returns the first answer with Idempotent-Replayed: true.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Campaign' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: 'https://passage.dev/problems/SCHED-0001' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          description: Field name to message for validation failures (COM-0001).
          additionalProperties: { type: string }
    Interval:
      type: object
      required: [start, end, minutes]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        minutes: { type: integer }
    ResourceRequest:
      type: object
      required: [code, name, timeZone, shifts]
      properties:
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        name: { type: string }
        finite: { type: boolean, default: true }
        timeZone: { type: string, description: IANA zone of the site calendar }
        shifts:
          type: array
          minItems: 1
          maxItems: 14
          items: { $ref: '#/components/schemas/Shift' }
    Shift:
      type: object
      required: [weekday, startMinute, endMinute]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: Go time.Weekday, 0 = Sunday }
        startMinute: { type: integer, minimum: 0, maximum: 1440 }
        endMinute: { type: integer, minimum: 0, maximum: 1440 }
    Resource:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        finite: { type: boolean }
        timeZone: { type: string }
        shifts:
          type: array
          items: { $ref: '#/components/schemas/Shift' }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    OperationRequest:
      type: object
      required: [orderId, operNumber, minutes, resourceIds]
      properties:
        orderId: { type: string, format: uuid }
        operNumber: { type: integer, minimum: 1 }
        minutes: { type: integer, minimum: 1, maximum: 100000 }
        dueAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time }
        priority: { type: integer, minimum: 0, maximum: 1000, default: 100, description: Lower runs first among orders with the same due date. }
        resourceIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
          description: Candidate resources, named resource first (FR-23.2).
    Operation:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        minutes: { type: integer }
        dueAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time }
        priority: { type: integer }
        resourceIds:
          type: array
          items: { type: string, format: uuid }
        status: { type: string, enum: [open, scheduled, unplaced] }
        createdAt: { type: string, format: date-time }
    RunRequest:
      type: object
      description: >
        Heuristic run, always forward from start (backward direction and the
        cp-sat algorithm are later slices; see NOT-IMPLEMENTED.md). finite
        false is an infinite-capacity run: jobs stay inside open calendar time
        but may overlap and do not reserve capacity.
      required: [scope]
      properties:
        scope: { type: string, enum: [site, selection], description: 'site (every operation) or selection (operationIds)' }
        mode: { type: string, enum: [operations, jobs], default: jobs, description: Recorded on the run; both modes place at minute granularity in this slice. }
        finite: { type: boolean, default: true }
        operationIds:
          type: array
          maxItems: 5000
          description: Required for selection scope, omitted for site scope.
          items: { type: string, format: uuid }
        start: { type: string, format: date-time, description: Defaults to now; must not be before today (UTC). }
        horizonDays: { type: integer, minimum: 30, maximum: 730, default: 365 }
    Run:
      type: object
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [site, selection, move] }
        mode: { type: string }
        direction: { type: string }
        finite: { type: boolean }
        algorithm: { type: string, enum: [heuristic] }
        status: { type: string }
        operationsCount: { type: integer }
        makespanMinutes: { type: integer }
        totalLatenessMinutes: { type: integer }
        solverStatus:
          type: [string, 'null']
          description: Set for cp-sat runs (OPTIMAL, FEASIBLE, UNKNOWN).
        messages:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    Bar:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        resourceId: { type: string, format: uuid }
        segment: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        lateMinutes: { type: integer }
        firmed: { type: boolean }
    MoveRequest:
      type: object
      required: [start]
      properties:
        resourceId: { type: string, format: uuid, description: Reassign within the capability set. }
        start: { type: string, format: date-time }
        dryRun: { type: boolean, default: false }
    MoveResponse:
      type: object
      required: [dryRun, feasible, violations, changes]
      properties:
        dryRun: { type: boolean }
        feasible: { type: boolean }
        violations:
          type: array
          items:
            type: object
            required: [code, detail]
            properties:
              code: { type: string }
              detail: { type: string }
              jobId: { type: string, format: uuid }
        changes:
          type: array
          items:
            type: object
            properties:
              operationId: { type: string, format: uuid }
              orderId: { type: string, format: uuid }
              resourceId: { type: string, format: uuid }
              oldStart: { type: string, format: date-time }
              oldEnd: { type: string, format: date-time }
              newStart: { type: string, format: date-time }
              newEnd: { type: string, format: date-time }
              lateMinutes: { type: integer }
        orderId: { type: string, format: uuid }
        orderStart: { type: string, format: date-time }
        orderEnd: { type: string, format: date-time }
        run: { $ref: '#/components/schemas/Run' }
    Firm:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        firmed: { type: boolean }
    LoadItem:
      type: object
      properties:
        resourceId: { type: string, format: uuid }
        weekStart: { type: string, format: date }
        openMinutes: { type: integer }
        bookedMinutes: { type: integer }
        loadPct: { type: number }
        bottleneck: { type: boolean }
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: Exact decimal as a string (numbers are accepted on input).
    NetworkEdge:
      type: object
      required: [fromResourceId, toResourceId]
      properties:
        fromResourceId: { type: string, format: uuid }
        toResourceId: { type: string, format: uuid }
        transferMinutes: { type: integer, minimum: 0, maximum: 10080, default: 0 }
        maxWaitMinutes: { type: [integer, 'null'], minimum: 0, maximum: 10080 }
        secondaryResourceId: { type: string, format: uuid }
    NetworkRequest:
      type: object
      required: [code, name, activeFrom, edges]
      properties:
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        activeFrom: { type: string, format: date }
        activeTo: { type: [string, 'null'], format: date }
        edges:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/NetworkEdge' }
    Network:
      allOf:
        - $ref: '#/components/schemas/NetworkRequest'
        - type: object
          required: [id, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
    SetupEntry:
      type: object
      required: [fromGroup, toGroup, minutes]
      properties:
        fromGroup: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        toGroup: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        minutes: { type: integer, minimum: 0, maximum: 10080 }
        cost: { $ref: '#/components/schemas/Decimal' }
        cleaningSetId: { type: string, maxLength: 64 }
    SetupMatrixRequest:
      type: object
      required: [resourceId, activeFrom, currency, entries]
      properties:
        resourceId: { type: string, format: uuid }
        activeFrom: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        entries:
          type: array
          minItems: 1
          maxItems: 2500
          items: { $ref: '#/components/schemas/SetupEntry' }
    SetupMatrix:
      allOf:
        - $ref: '#/components/schemas/SetupMatrixRequest'
        - type: object
          required: [id, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, description: Next version per resource; the active matrix is the highest version with activeFrom on or before the day }
            createdAt: { type: string, format: date-time }
    CleanoutRuleRequest:
      type: object
      required: [setupGroup, durationMinutes]
      properties:
        setupGroup: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        durationMinutes: { type: integer, minimum: 1, maximum: 10080 }
        operationSetId: { type: string, maxLength: 64 }
        afterBatches: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
        afterHours: { type: [integer, 'null'], minimum: 1, maximum: 8760 }
        atCampaignEnd: { type: boolean, default: true }
    CleanoutRule:
      allOf:
        - $ref: '#/components/schemas/CleanoutRuleRequest'
        - type: object
          required: [id, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
    Predicate:
      type: object
      required: [attribute, op, value]
      properties:
        attribute: { type: string, minLength: 1, maxLength: 64 }
        op: { type: string, enum: ['=', '!=', '>=', '<=', '>', '<'] }
        value: { type: string, maxLength: 64, description: Ordering operators need a decimal value }
    CapacityBlockRequest:
      type: object
      required: [resourceId, code]
      description: Either weekly windows (site-local, in the resource's time zone) or startAt and endAt.
      properties:
        resourceId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        windows:
          type: array
          minItems: 1
          maxItems: 14
          items: { $ref: '#/components/schemas/Shift' }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        condition:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Predicate' }
        priority: { type: integer, minimum: 0, maximum: 1000, default: 0 }
        active: { type: boolean, default: true }
    CapacityBlock:
      allOf:
        - $ref: '#/components/schemas/CapacityBlockRequest'
        - type: object
          required: [id, condition, priority, active, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
    CampaignOrderRequest:
      type: object
      required: [orderId, setupGroup, quantity]
      properties:
        orderId: { type: string, format: uuid }
        setupGroup: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        quantity: { $ref: '#/components/schemas/Decimal' }
        runMinutes: { type: integer, minimum: 0, maximum: 100000 }
        routeSetupMinutes: { type: integer, minimum: 0, maximum: 10080, description: Used as the changeover when the matrix has no entry (SCHED-0012) }
        dueAt: { type: string, format: date-time }
    CampaignOrder:
      allOf:
        - $ref: '#/components/schemas/CampaignOrderRequest'
        - type: object
          required: [position, sequence]
          properties:
            position: { type: integer, description: Order in which it was added (the manual sequence) }
            sequence: { type: [integer, 'null'], description: Run position once sequenced }
    CampaignRequest:
      type: object
      required: [resourceId, campaignKey, plannedStart]
      properties:
        resourceId: { type: string, format: uuid }
        campaignKey: { type: string, minLength: 1, maxLength: 64 }
        plannedStart: { type: string, format: date-time }
        maxOrders: { type: [integer, 'null'], minimum: 1, maximum: 1000 }
        maxQty: { $ref: '#/components/schemas/Decimal' }
        maxMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1000000, description: Run, changeover and cleanout minutes together }
        sequenceRule: { type: string, enum: [nearest-neighbor, manual], default: nearest-neighbor }
        currentSetupGroup: { type: [string, 'null'], description: The resource's setup group before the campaign (leading setup) }
        orders:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/CampaignOrderRequest' }
    Changeover:
      type: object
      required: [afterOrderId, fromGroup, toGroup, minutes, cost, missing]
      properties:
        beforeOrderId: { type: string, format: uuid, description: Absent for the leading setup }
        afterOrderId: { type: string, format: uuid }
        fromGroup: { type: string }
        toGroup: { type: string }
        minutes: { type: integer }
        cost: { $ref: '#/components/schemas/Decimal' }
        cleaningSetId: { type: string }
        missing: { type: boolean, description: No matrix entry; route setup minutes used (SCHED-0012) }
    PlannedCleanout:
      type: object
      required: [afterOrderId, setupGroup, minutes, reason]
      properties:
        afterOrderId: { type: string, format: uuid }
        setupGroup: { type: string }
        minutes: { type: integer }
        reason: { type: string, enum: [batches, run-time, campaign-end] }
        cleaningSetId: { type: string }
    Campaign:
      type: object
      required: [id, resourceId, campaignKey, status, plannedStart, sequenceRule, orderCount, runMinutes, changeoverMinutes, cleanoutMinutes, plan, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        campaignKey: { type: string }
        status: { type: string, enum: [proposed, planned, started, completed, cancelled] }
        plannedStart: { type: string, format: date-time }
        maxOrders: { type: [integer, 'null'] }
        maxQty: { type: [string, 'null'] }
        maxMinutes: { type: [integer, 'null'] }
        sequenceRule: { type: string, enum: [nearest-neighbor, manual] }
        currentSetupGroup: { type: [string, 'null'] }
        orderCount: { type: integer }
        runMinutes: { type: integer }
        changeoverMinutes: { type: integer }
        cleanoutMinutes: { type: integer }
        plan:
          type: [object, 'null']
          required: [changeovers, cleanouts, warnings]
          properties:
            changeovers:
              type: array
              items: { $ref: '#/components/schemas/Changeover' }
            cleanouts:
              type: array
              items: { $ref: '#/components/schemas/PlannedCleanout' }
            warnings:
              type: array
              items:
                type: object
                required: [code, detail]
                properties:
                  code: { type: string }
                  detail: { type: string }
            matrixId: { type: string, format: uuid }
        sequencedAt: { type: [string, 'null'], format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        orders:
          type: array
          description: Present on the single-campaign read and command responses, in run order
          items: { $ref: '#/components/schemas/CampaignOrder' }
    AllocationRequest:
      type: object
      required: [amount, currency]
      properties:
        amount: { $ref: '#/components/schemas/Decimal' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        basis: { type: string, enum: [quantity, equal, run-minutes], default: quantity }
        actuals:
          type: array
          description: Actual RAF quantity or run minutes per order; the planned values are used otherwise
          items:
            type: object
            required: [orderId]
            properties:
              orderId: { type: string, format: uuid }
              quantity: { $ref: '#/components/schemas/Decimal' }
              runMinutes: { type: integer, minimum: 0 }
    Allocation:
      type: object
      required: [campaignId, basis, currency, amount, lines]
      properties:
        campaignId: { type: string, format: uuid }
        basis: { type: string }
        currency: { type: string }
        amount: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [orderId, weight, amount]
            properties:
              orderId: { type: string, format: uuid }
              weight: { $ref: '#/components/schemas/Decimal' }
              amount: { type: string, description: Rounded to the currency's minor unit }
