          description: Resource UUID.
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          description: Range start, RFC 3339.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: Range end (exclusive), RFC 3339, after `from` and at most 93 days later.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Booked segments in the range
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
