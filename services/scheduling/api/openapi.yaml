        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/bottlenecks:
    get:
      operationId: listBottlenecks
      summary: Bottleneck episodes, newest first
      description: >
        An episode opens when a resource gets a bottleneck week (load above
        `SCHED_BOTTLENECK_PCT` for `SCHED_BOTTLENECK_WEEKS` weeks in a row) from
        the current week on, and closes when it has none left. The materialized
        weekly load behind it is rewritten in the transaction of every run, move,
        rollback, order import or withdrawal, operation change or delete,
        unschedule, capacity override and resource change, so the answer is never
        behind committed bookings. An episode whose flagged weeks have all
        passed is reported closed at the end of its last flagged week, even
        before the next change to the resource records that.
      x-passage-duty: scheduling.read
      parameters:
        - name: status
          in: query
          required: false
          description: Only open or only closed episodes; all by default.
          schema: { type: string, enum: [open, closed, all], default: all }
        - name: resourceId
          in: query
          required: false
          description: Only the episodes of this resource.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          description: Most episodes to return.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Episodes, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BottleneckEpisode' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/bottlenecks/{id}:
    get:
      operationId: getBottleneck
      summary: One bottleneck episode with the weekly load of its resource
      description: The episode and the materialized weeks of its resource from the episode's first week on, at most 104. A week with no booking has no row.
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The episode and its weeks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BottleneckDetail' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/capacity-load:refresh:
    post:
      operationId: refreshCapacityLoad
      summary: Rebuild the materialized capacity load of every resource
      description: >
        Recomputes the weekly load and the bottleneck episodes of all resources
        from the bookings, 50 resources per transaction so runs and moves wait
        for one batch at most. Normal writes keep the table current; use this for
        bookings made before the table existed or to repair it. It changes
        nothing the bookings do not already say, so repeating it is harmless, and
        it needs no Idempotency-Key. `bottleneck.detected` is published for an
        episode it opens.
      x-passage-duty: scheduling.run
      responses:
        '200':
          description: What was rebuilt
          content:
            application/json:
              schema:
                type: object
                required: [resources, loadRows, openEpisodes]
                properties:
                  resources: { type: integer, description: Resources rebuilt. }
                  loadRows: { type: integer, description: Weeks with a booking now held for the tenant. }
                  openEpisodes: { type: integer, description: Open bottleneck episodes after the rebuild. }
  /v1/scheduling/dispatch-list:
    get:
      operationId: getDispatchList
      summary: Dispatch list of a resource for a day or shift
      description: >
        The jobs booked on one resource in a window of its own local calendar
        (PRD 4.23.15), in start order and numbered from 1. The window runs from
        `startMinute` of `date` to `endMinute` of the last of `days` days, in the
        resource's time zone, so a night shift is asked as `startMinute=1320`
        and `endMinute=1800`. Both ends are wall-clock times: across a
        daylight-saving change the window holds the hours the clock showed
        (a 22:00 to 06:00 shift is 7 hours on the spring night, 9 on the
        autumn night); a time skipped by the change maps to the instant of the
        change, and a repeated time to its first occurrence. A window that lies
        wholly inside a skipped hour is refused with 400. Start and end of each
        line are UTC instants. Primary and secondary bookings (BR-23.4) are listed;
        `minutesInWindow` is the part of each segment inside the window and
        `totalMinutes` their sum. At most 1,000 lines (then `truncated` is true).
      x-passage-duty: scheduling.read
      parameters:
        - name: resourceId
          in: query
          required: true
          description: Resource UUID.
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: true
          description: First local calendar date of the window, YYYY-MM-DD.
          schema: { type: string, format: date }
        - name: days
          in: query
          required: false
          description: Number of local days covered.
          schema: { type: integer, minimum: 1, maximum: 7, default: 1 }
        - name: startMinute
          in: query
          required: false
          description: Local minute of the day the window starts, on the first day.
          schema: { type: integer, minimum: 0, maximum: 1439, default: 0 }
        - name: endMinute
          in: query
          required: false
          description: Local minute after midnight of the last day the window ends; above 1440 it runs into the next day. Must exceed `startMinute` for a one-day window.
          schema: { type: integer, minimum: 1, maximum: 2880, default: 1440 }
      responses:
        '200':
          description: The numbered dispatch lines of the window
          content:
            application/json:
              schema:
                type: object
                required: [resource, date, days, windowStart, windowEnd, totalMinutes, lines, truncated]
                properties:
                  resource:
                    type: object
                    required: [id, code, name, timeZone]
                    properties:
                      id: { type: string, format: uuid }
                      code: { type: string }
                      name: { type: string }
                      timeZone: { type: string }
                  date: { type: string, format: date }
                  days: { type: integer }
                  windowStart: { type: string, format: date-time }
                  windowEnd: { type: string, format: date-time }
                  totalMinutes: { type: integer }
                  lines:
                    type: array
                    items: { $ref: '#/components/schemas/DispatchLine' }
                  truncated: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/runs/{id}/kpis:
    get:
      operationId: getRunKpis
      summary: Lateness, changeover and per-resource utilization of the jobs a run holds
      description: >
        Measures the jobs that still carry the run's id (a later run or a move
        replaces jobs, so `placedJobs` against the run's `operationsCount` shows
        how much of the run is current). `resources` lists each resource the run
        booked (primary or secondary) with its booked minutes and the open
        minutes of its calendar, read in the resource's time zone with capacity
        overrides applied, between the first start and last end of the run's
        jobs, most used first.
        A run with no current jobs answers zeros and an empty list.
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The run's measures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunKpis' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/runs/{id}/compare:
    get:
      operationId: compareRuns
      summary: Compare the jobs two runs placed
      description: >
        Diffs the job snapshots of two schedule runs: the run in the path is the
        base and `to` the other run. `added` lists jobs only the other run
        placed, `removed` jobs only the base run placed, and `changed` jobs both
        placed on another resource or at another time, with the start and end
        shifts and the change of lateness in minutes (the other run minus the
        base run). Each side carries its snapshot figures (jobs, orders, late
        jobs, lateness, changeover, makespan) and its utilization: the minutes
        it booked on its resources (primary and secondary) over their open
        minutes between its first start and last end, calendars as they are
        now. Two runs of a different scope or horizon are compared as they are,
        so a job only one of them selected shows as added or removed; each side
        carries its run. The counts are exact; each list is cut at 500 entries
        and `truncated` is true when one was. A move run, or a run from before
        snapshots, has no snapshot and is refused with SCHED-0143.
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: to
          in: query
          required: true
          description: The run to compare with; it must differ from the run in the path.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The difference between the two runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunComparison' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/runs/{id}:rollback:
    post:
      operationId: rollbackRun
      summary: Roll the plan back to a previous run
      description: >
        Restores the jobs the run placed as the current plan, in one transaction,
        under a new run of scope `rollback` that points back at it
        (`rollbackOf`) and keeps its own snapshot. The current non-firmed jobs of
        those operations are replaced. A job is skipped and listed in `skipped`
        when it is firmed, its operation was deleted, or changed or re-imported
        since the run (`operation_changed`: the placement is out of date), or a
        resource it used no longer exists; operations the run did not place keep
        their jobs. The plan the rest would leave is then checked as it is now,
        and any break refuses the whole rollback with nothing changed: a
        restored job that overlaps a booking made since (409 SCHED-0144), or
        (409 SCHED-0146, `errors` maps each job to the first rule it breaks, at
        most 50) a restored segment outside open capacity or in a capacity
        block the job does not match, a restored job out of sequence with the
        job of a neighbouring operation of its order (queue times and overlap
        included), a peg to or from a restored order whose dependent would
        start before its parent ends or behind an unplaced parent, or a
        changeover that no longer covers the step into or out of a restored
        job. SCHED-0145 means no job could be restored; SCHED-0143 means the
        run kept no snapshot. The operations are locked in the same order as a
        run, so a rollback and a concurrent run serialize. Order dates and
        `job.scheduled` events follow like those of a run.
      x-passage-duty: scheduling.run
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201':
          description: The rollback run and what was restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunRollback' }
        '200':
          description: 'A replay of the same Idempotency-Key; carries Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunRollback' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/late-orders:
    get:
      operationId: listLateOrders
      summary: Orders planned past their due date or holding an unplaced operation
      description: >
        Orders whose latest job is at least `minLateMinutes` late, plus every
        order with an operation the scheduler could not place, the most late
        first and unplaced-only orders after them. A job is late when it ends
        after its operation's due date (an instant); lateness is that of the
