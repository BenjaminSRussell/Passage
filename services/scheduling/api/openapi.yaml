openapi: 3.1.0
info:
  title: Passage Scheduling
  version: 0.1.0
  description: >
    Finite capacity scheduling (wave 23, PSG-23). Routes match the handlers in
    internal/api. Errors are RFC 9457 problem details (application/problem+json)
    with a stable `code`; see README.md for the error codes.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/scheduling/resources:
    post:
      operationId: createResource
      summary: Create a resource with its weekly calendar
      description: >
        `engineeringResourceId` optionally maps the resource to the engineering (wave 09) resource it stands for. Production
        orders name that id on their jobs, and the order intake resolves it to this resource. Another resource that already
        stands for the engineering resource gets 409 SCHED-0132.
      x-passage-duty: scheduling.capacity.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceRequest' }
      responses:
        '201':
          description: 'Created, with ETag "<version>". An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listResources
      summary: Resources ordered by code
      x-passage-duty: scheduling.read
      responses:
        '200':
          description: Resources
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Resource' }
  /v1/scheduling/resources/{id}:
    get:
      operationId: getResource
      summary: One resource with its weekly calendar
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 'The resource, with ETag "<version>" for the If-Match of an update'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateResource
      summary: Change a resource's name, time zone, weekly calendar, efficiency or engineering resource mapping and list the jobs it no longer covers (FR-23.1, AC-23.7)
      description: >
        Send at least one of name, timeZone, shifts, efficiencyPct or engineeringResourceId;
        shifts replace the whole weekly calendar and an empty
        engineeringResourceId removes the mapping (another resource already
        mapped to it gets 409 SCHED-0132). A changed mapping does not touch
        operations already registered: they keep their candidates until the
        order's next event or a re-import. The code and the finite flag never change. The change
        needs the resource version in If-Match (the ETag of a read) so a stale
        screen cannot overwrite another planner. Booked jobs whose booking after
        the request time now lies outside the resource's open capacity (calendar
        and downtimes applied), as the primary or as a secondary resource, are
        returned in affectedJobs and listed in resource.updated; hours a running
        job has already used do not count. The jobs stay where they are until
        they are moved or the schedule is run again.
      x-passage-duty: scheduling.capacity.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          description: The resource version from its ETag, for example "3". A stale version gets 412 SCHED-0124.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourcePatch' }
      responses:
        '200':
          description: 'The updated resource with ETag "<version>" and its affected jobs. A replay of the same Idempotency-Key returns the first answer with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceUpdate' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/resources/{id}/capacity:
    get:
      operationId: getResourceCapacity
      summary: Open capacity intervals (UTC) of a resource in a window of at most 62 days (FR-23.1)
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Open intervals clipped to the window
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Interval' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/resources/{id}/capacity-overrides:
    post:
      operationId: createCapacityOverride
      summary: Close a span of a resource calendar (downtime) or open one (extra shift) (FR-23.1)
      description: >
        A downtime removes the span from the resource's open capacity and
        wins over an overlapping extra shift; an extra shift adds it. Runs,
        moves, the capacity inquiry, block utilization and the weekly load all
        read the calendar with overrides applied. The booked jobs a downtime
        overlaps are returned in affectedJobs and stay where they are until
        they are moved or the schedule is run again (AC-23.7). A span is at
        most 31 days.
      x-passage-duty: scheduling.capacity.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapacityOverrideRequest' }
      responses:
        '201':
          description: 'Created. A replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityOverrideResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCapacityOverrides
      summary: Downtimes and extra shifts of a resource, optionally those overlapping a window
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Overrides by start (at most 1,000)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CapacityOverride' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/resources/{id}/capacity-overrides/{overrideId}:
    delete:
      operationId: deleteCapacityOverride
      summary: Remove a downtime or extra shift; later runs and moves see the plain calendar again
      x-passage-duty: scheduling.capacity.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: overrideId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/operations:
    post:
      operationId: createOperation
      summary: Add a schedulable operation of an order
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationRequest' }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listOperations
      summary: Operations ordered by order and operation number
      x-passage-duty: scheduling.read
      parameters:
        - name: orderId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, scheduled, unplaced] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Operations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/runs:
    post:
      operationId: createRun
      summary: Run the forward or backward heuristic over the site or a selection of operations
      description: >
        The run applies resource networks (FR-23.13: an operation naming a
        network runs only on a resource with an edge from its predecessor's,
        within the transfer time and maximum wait, delaying the predecessor up
        to 7 days, else the order is unplaced with SCHED-0009
        NETWORK_INFEASIBLE), setup matrix changeovers (FR-23.15: laid in front
        of the process minutes from the group the resource is in; a missing
        entry uses the route setup and warns SCHED-0012) and capacity blocks
        (FR-23.17: a job runs in a block only if it matches; a job matching no
        block on its resource warns SCHED-0014). The run honours order pegs
        (FR-23.8): an order is placed after its parent orders, and its first
        operation starts no earlier than the last end of its parents, whether
        the parent is scheduled in this run or already holds jobs; an order
        whose parent could not be placed (in this run, or holding an unplaced
        operation outside it) is unplaced too. Secondary resources (BR-23.4)
        are booked for the same segments as the primary: a finite secondary is
        never held by two jobs at once, and when one is not free, or closed,
        the primary slot is skipped and the next start tried (an operation
        with no such slot in the horizon is unplaced with a SCHED-0005
        message). An infinite run
        books no capacity on secondaries either, but each segment must still
        lie in the secondary's open time.
      x-passage-duty: scheduling.run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunRequest' }
      responses:
        '201':
          description: 'Run completed. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listRuns
      summary: Schedule runs, newest first
      x-passage-duty: scheduling.read
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/orders/{orderId}:schedule:
    post:
      operationId: scheduleOrder
      summary: Schedule every operation of one order
      description: >
        Runs the heuristic over all operations of the order (run scope order),
        with the same rules as createRun: firmed jobs stay, pegs, networks,
        setup matrices, capacity blocks and secondary resources apply. An
        order with no operations in scheduling answers 404 SCHED-0135.
        Idempotent per Idempotency-Key and order. Takes the run duty, like
        createRun.
      x-passage-duty: scheduling.run
      parameters:
        - name: orderId
          in: path
          required: true
          description: The production order id (UUID).
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: All fields are optional; send an empty object for the defaults.
              properties:
                finite: { type: boolean, description: 'Left out, it takes defaultFinite of the scheduling parameters.' }
                direction: { type: string, enum: [forward, backward], description: 'Left out, it takes defaultDirection of the scheduling parameters.' }
                mode: { type: string, enum: [jobs, operations], description: 'As on createRun (FR-23.2). Left out, it takes defaultMode of the scheduling parameters, so on a site whose default is operations the command schedules in daily buckets.' }
                start: { type: string, format: date-time, description: Defaults to now; must not be before today (UTC). }
                horizonDays: { type: integer, minimum: 30, maximum: 730, default: 365 }
      responses:
        '201':
          description: 'Run completed. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/operations/{id}:
    get:
      operationId: getOperation
      summary: One operation with its version
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 'The operation, with ETag "<version>" for the If-Match of an update or delete'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateOperation
      summary: Change an operation's duration, dates, priority, setup minutes, queue times, quantities or candidate resources (FR-23.4)
      description: >
        Send at least one of minutes, dueAt, readyAt, priority, setupMinutes,
        queueBeforeMinutes, queueAfterMinutes, quantity, overlapQuantity (0 clears the overlap; an overlap
        above the quantity, or without one, is 422 SCHED-0142) or resourceIds (the candidates, replacing the list, in priority order and
        none of them a secondary resource of the operation: 422 SCHED-0139).
        The order, operation number, secondary resources, setup group, network
        and attributes are fixed when the operation is created. A change to
        anything but the priority makes the placement stale: the operation's
        non-firmed jobs are removed, its status is open again (jobsRemoved is
        true) and the next run or order schedule places it. An operation a
        firmed job holds is refused with 409 SCHED-0138. The priority alone
        leaves the jobs where they are and only orders the next run. The
        change needs the operation version in If-Match (the ETag of a read); a
        stale version gets 412 SCHED-0137. An operation registered from a
        production order is overwritten by that order's next event or re-import.
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          description: The operation version from its ETag, for example "3". A stale version gets 412 SCHED-0137.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationPatch' }
      responses:
        '200':
          description: 'The changed operation with ETag "<version>" and jobsRemoved. A replay of the same Idempotency-Key returns the first answer with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationUpdate' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteOperation
      summary: Remove an operation and its non-firmed jobs (FR-23.4)
      description: >
        Deletes the operation and takes its jobs off the schedule. An operation
        a firmed job holds is refused with 409 SCHED-0138; unfirm it first.
        Needs the operation version in If-Match (stale: 412 SCHED-0137). A
        replay of the same Idempotency-Key answers as the first request did.
        An operation registered from a production order comes back with that
        order's next event or re-import.
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          description: The operation version from its ETag. A stale version gets 412 SCHED-0137.
          schema: { type: string }
      responses:
        '200':
          description: 'The operation was removed. A replay of the same Idempotency-Key returns the first answer with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationRemoval' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/orders/{orderId}:unschedule:
    post:
      operationId: unscheduleOrder
      summary: Take an order off the schedule
      description: >
        Removes the non-firmed jobs of every operation of the order and opens
        the operations again, so the next run or order schedule can place the
        order afresh. Operations a firmed job holds stay where they are and are
        listed in keptFirmed. The operations themselves are kept. An order with
        no operations in scheduling answers 404 SCHED-0135. Needs no body;
        idempotent per Idempotency-Key and order.
      x-passage-duty: scheduling.schedule.write
      parameters:
        - name: orderId
          in: path
          required: true
          description: The production order id (UUID).
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 'The order is off the schedule. A replay of the same Idempotency-Key returns the first answer with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderUnschedule' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/runs/{id}:
    get:
      operationId: getRun
      summary: Run status and metrics
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/gantt:
    get:
      operationId: listGantt
      summary: Scheduled segments for a Gantt window (at most 5,000 bars)
      x-passage-duty: scheduling.read
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: resourceIds
          in: query
          required: false
          description: Comma-separated resource UUIDs.
          schema: { type: string }
      responses:
        '200':
          description: Bars in the window
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Bar' }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/jobs/{id}:move:
    post:
      operationId: moveJob
      summary: Move or reassign a job; dryRun previews violations and dependents
      description: >
        A commit (dryRun false) requires Idempotency-Key; a replay returns the
        stored outcome with Idempotent-Replayed: true. A preview writes nothing
        and needs no key. Firmed jobs cannot be moved (SCHED-0008). A job
        placed by a run in operations mode (FR-23.2) is moved in that mode: the
        moved operation, its successors and propagated dependents (beyond their
        first operation) start no earlier than the next local midnight of their
        resource after the operation before them; a floor in closed time moves
        to the first open minute of that day, and the move's run records the
        mode. A move keeps the run constraints: the start must not fall in a capacity block
        the job does not match (SCHED-0002), changeovers are repriced and a
        later job on a touched resource left too short a changeover is a
        SCHED-0001 violation, and a changed network step needs an edge
        (SCHED-0009) within its maximum wait (SCHED-0010). A changeover is
        never split across closed time (BR-23.3): a start that would split it
        is SCHED-0002. With propagate, the orders pegged to the moved order
        (order-pegs) that would start before a parent ends are pushed forward
        with their successors, parents first, up to the propagation limits of
        the scheduling parameters (BR-23.10; 500 orders or 5 pegging levels
        until changed); truncated reports a walk cut at a limit
        (SCHED-0007), and a conflict in any dependent refuses the whole move.
        A move also needs each secondary resource of the operation (and of every
        job it pushes) free for the same segments, otherwise SCHED-0005.
        With overrideConstraints (preview or commit) the moved job is placed at
        the asked start although that start is outside open capacity or inside
        a block it does not match (SCHED-0002), or a secondary resource is
        closed (SCHED-0005); the job becomes one continuous span over the
        closed time, the Gantt flags it outsideCapacity (or blockBreach), and
        the response lists what was committed over in violations with
        overridden true; a commit also writes the violations into the move
        run's messages. The flag needs the scheduling.constraints.override duty
        on top of this route's duty (403 SCHED-0141 without it). Double booking
        (SCHED-0001), a secondary resource booked by another job (SCHED-0005),
        a slot ending beyond the planning horizon, a firmed job, a resource that
        is not a candidate, and conflicts of the jobs the move pushes are never
        overridden.
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: false
          description: Required when dryRun is false.
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveRequest' }
      responses:
        '200':
          description: Preview or committed move. Infeasible dry runs return feasible=false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/jobs/{id}:firm:
    post:
      operationId: firmJob
      summary: Firm or unfirm a placement; firmed placements are frozen against later runs
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firmed]
              properties:
                firmed: { type: boolean }
      responses:
        '200':
          description: 'Updated placement. A replay carries Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Firm' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/order-pegs:
    post:
      operationId: createOrderPeg
      summary: Peg a dependent order to the parent order whose output it consumes (FR-23.8)
      description: >
        Both orders need operations in scheduling (SCHED-0120), and a peg that
        would make an order depend on itself is refused (SCHED-0121). Pegging a
        pair that is already pegged returns the existing peg with 200. Pegs are
        entered here until wave 22 pegging publishes them.
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PegRequest' }
      responses:
        '201':
