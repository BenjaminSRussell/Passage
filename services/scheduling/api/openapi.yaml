      description: Primary and secondary bookings (BR-23.4) of one resource that overlap the range, earliest first, at most 1,000 (then `truncated` is true). `minutesInRange` is the part of each segment inside the range.
      x-passage-duty: scheduling.read
      parameters:
        - name: resourceId
          in: query
