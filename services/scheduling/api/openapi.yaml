            application/json:
              schema: { $ref: '#/components/schemas/CleanoutRule' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCleanoutRules
      summary: Cleanout rules ordered by setup group
      x-passage-duty: scheduling.read
      responses:
        '200':
          description: Cleanout rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CleanoutRule' }
  /v1/scheduling/capacity-blocks:
    post:
      operationId: createCapacityBlock
      summary: Create a capacity block restricted to an attribute condition (FR-23.17)
      x-passage-duty: scheduling.capacity.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapacityBlockRequest' }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityBlock' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCapacityBlocks
      summary: Capacity blocks by resource, highest priority first
      x-passage-duty: scheduling.read
      parameters:
        - name: resourceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Capacity blocks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CapacityBlock' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/capacity-blocks/{id}:
    get:
      operationId: getCapacityBlock
      summary: One capacity block
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 'The block, with ETag "<version>" for the If-Match of an update'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityBlock' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateCapacityBlock
      summary: Change a capacity block's priority, condition or active flag (FR-23.17)
      description: >
        Send at least one of priority, active or condition; a condition
        replaces the whole list. Set active to false to retire a block. The
        resource, code and window never change. Schedule runs and moves read
        the active blocks when they start, so the change applies to the next
        run or move. Jobs already placed stay where they are; the answer lists
        in affectedJobs those booked from now on the block's resource that the
        active blocks now keep out (BR-23.15), for the planner to move or
        reschedule. Needs the block version in If-Match.
      x-passage-duty: scheduling.capacity.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          description: The block version from its ETag, for example "3". A stale version gets 412 SCHED-0127.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapacityBlockPatch' }
      responses:
        '200':
          description: 'The updated block with ETag "<version>" and the jobs it affects. A replay of the same Idempotency-Key returns the first answer with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityBlockUpdate' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/resources/{id}/block-utilization:
    get:
      operationId: getBlockUtilization
      summary: Capacity block windows of a resource in a window of at most 62 days, with held, matched and unused minutes (FR-23.17, PRD 4.23.14 Block utilization)
      description: >
        Every window of the resource's active capacity blocks that overlaps [from, to), expanded in the
        resource's time zone (weekly windows, recurrences or the dated window) and clipped to the range.
        blockMinutes counts the open calendar minutes the window holds once higher-priority blocks have
        taken theirs (BR-23.15); matchedMinutes counts the finite booked minutes of jobs whose attributes
        match the block condition inside them; unusedMinutes is the difference. Sorted by start, then
        priority (highest first).
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Block windows clipped to the range
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BlockWindow' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaign-proposals:
    get:
      operationId: proposeCampaigns
      summary: Propose campaigns from scheduled orders that share a campaign key within a window (FR-23.14)
      description: >
        Reads the jobs that start in [from, from + windowDays) and whose operation has a setup group, of
        orders that belong to no campaign (planned and firmed jobs alike). An order is offered once, with
        its earliest such job. Orders are grouped by resource and campaign key: the operation attribute
        campaignKey when set, otherwise the setup group. A group of two or more orders is a proposal, in
        the order the jobs start; a group of more than 1000 orders is split into consecutive proposals.
        Nothing is stored: a planner creates the campaign from a proposal with POST /campaigns, entering
        each order's quantity. Proposals are sorted by planned start, then key, then resource.
      x-passage-duty: scheduling.read
      parameters:
        - name: from
          in: query
          description: Window start; defaults to the current minute.
          schema: { type: string, format: date-time }
        - name: windowDays
          in: query
          description: Window length in days (site parameter "Campaign proposal window days").
          schema: { type: integer, minimum: 1, maximum: 90, default: 14 }
        - name: resourceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Proposed campaigns
          content:
            application/json:
              schema:
                type: object
                required: [from, to, windowDays, items]
                properties:
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  windowDays: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProposedCampaign' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns:
    post:
      operationId: createCampaign
      summary: Create a proposed campaign with its orders (FR-23.14)
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignRequest' }
      responses:
        '201':
          description: 'Created, with ETag "<version>". An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCampaigns
      summary: Campaigns, newest first (without their orders)
      x-passage-duty: scheduling.read
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [proposed, planned, started, completed, cancelled] }
        - name: resourceId
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Campaigns
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Campaign' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}:
    get:
      operationId: getCampaign
      summary: One campaign with its orders in run order; ETag carries the version
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}/orders:
    post:
      operationId: addCampaignOrder
      summary: Add an order to a campaign that has not started; clears its sequence (SCHED-0011 when started)
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignOrderRequest' }
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}/orders/{orderId}:
    delete:
      operationId: removeCampaignOrder
      summary: Take an order out of a campaign that has not started; clears its sequence
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}:sequence:
    post:
      operationId: sequenceCampaign
      summary: >
        Sequence the campaign with the setup matrix in force on its planned start
        (BR-23.12) and insert cleanouts (BR-23.13); the campaign becomes planned and
        campaign.sequenced is published. SCHED-0012 warnings list pairs without a matrix entry.
        A cp-sat campaign first asks scheduler-opt for its order (BR-23.9) and reports the
        outcome as SCHED-0006; solver trouble never fails the command. Cleanouts count on
        from the resource's cleanout counter (carryIn).
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}:start:
    post:
      operationId: startCampaign
      summary: >
        Start a planned campaign; it is frozen afterwards, the resource's cleanout counter
        becomes the plan's carryOut and campaign.started is published. 409 SCHED-0123 when
        the counter moved after the campaign was sequenced.
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}:complete:
    post:
      operationId: completeCampaign
      summary: >
        Complete a started campaign (FR-23.14); its orders stay on it and campaign.completed is
        published. 422 SCHED-0125 when it has not started, SCHED-0011 when it is already completed or cancelled.
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}:cancel:
    post:
      operationId: cancelCampaign
      summary: >
        Cancel a campaign that is not completed or cancelled. Its orders are released and can join
        another campaign; a started campaign gives back the resource's cleanout counter while nothing
        has moved it since. campaign.cancelled is published. The body is optional. 422 SCHED-0011
        when it is already completed or cancelled.
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}:allocate-cost:
    post:
      operationId: allocateCampaignCost
      summary: >
        Compute the allocation of a campaign's setup and cleanout cost to its orders
        (FR-23.16, BR-23.14). Nothing is posted or stored, so no Idempotency-Key is needed.
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllocationRequest' }
      responses:
        '200':
          description: The allocation; amounts sum exactly to the cost
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Allocation' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: healthz
      summary: Liveness
      security: []
      responses:
        '200': { description: Process is up }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness (Postgres reachable)
      security: []
      responses:
        '200': { description: Ready }
        '503': { description: Database unreachable }
  /v1/scheduling/parameters:
    get:
      operationId: getParameters
      summary: The tenant's scheduling parameters (PRD 4.23.13)
      description: >
        The defaults a run takes when its request leaves mode, direction or
        finite out, the Gantt drag snap, and the BR-23.10 limits of a propagated
        move. A tenant that never changed them gets the built-in defaults at
        version 1 with a null updatedAt.
      x-passage-duty: scheduling.read
      responses:
        '200':
          description: 'The parameters, with ETag "<version>" for the If-Match of a change'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parameters' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateParameters
      summary: Change the scheduling parameters
      description: >
        Send at least one field; fields left out stay as they are. The change
        needs the version in If-Match (the ETag of a read) so a stale screen
        cannot overwrite another planner. It applies to runs and moves started
        after it: jobs already placed are not re-planned. The first change
        stores the row, so a tenant on the built-in defaults sends If-Match "1".
        The duty is Maintain scheduling setup (PRD 4.23.17). Publishes
        parameters.updated.
      x-passage-duty: scheduling.setup.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          description: The parameters version from their ETag, for example "1". A stale version gets 412 SCHED-0140.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParametersPatch' }
      responses:
        '200':
          description: 'The changed parameters with ETag "<version>". A replay of the same Idempotency-Key returns the first answer with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parameters' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The campaign version from its ETag, for example "3". A stale version gets 412 SCHED-0115.
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Campaign:
      description: 'The changed campaign with ETag "<version>". A replay of the same Idempotency-Key returns the first answer with Idempotent-Replayed: true.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Campaign' }
  schemas:
    Parameters:
      type: object
      required: [defaultMode, defaultDirection, defaultFinite, dragSnapMinutes, propagationOrders, propagationLevels, version, updatedAt]
      properties:
        defaultMode: { type: string, enum: [jobs, operations] }
        defaultDirection: { type: string, enum: [forward, backward] }
        defaultFinite: { type: boolean }
        dragSnapMinutes: { type: integer, minimum: 1, maximum: 60, description: Grid a Gantt drag snaps to, in minutes. }
        propagationOrders: { type: integer, minimum: 1, maximum: 5000, description: 'Most dependent orders a propagated move re-plans (BR-23.10)' }
        propagationLevels: { type: integer, minimum: 1, maximum: 20, description: 'Deepest peg level a propagated move reaches (BR-23.10)' }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: [string, 'null'], format: date-time }
    ParametersPatch:
      type: object
      minProperties: 1
      properties:
        defaultMode: { type: string, enum: [jobs, operations] }
        defaultDirection: { type: string, enum: [forward, backward] }
        defaultFinite: { type: boolean }
        dragSnapMinutes: { type: integer, minimum: 1, maximum: 60 }
        propagationOrders: { type: integer, minimum: 1, maximum: 5000 }
        propagationLevels: { type: integer, minimum: 1, maximum: 20 }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: 'https://passage.dev/problems/SCHED-0001' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          description: Field name to message for validation failures (COM-0001).
          additionalProperties: { type: string }
    Interval:
      type: object
      required: [start, end, minutes]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        minutes: { type: integer }
    ResourceRequest:
      type: object
      required: [code, name, timeZone, shifts]
      properties:
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        name: { type: string }
        finite: { type: boolean, default: true }
        timeZone: { type: string, description: IANA zone of the site calendar }
        shifts:
          type: array
          minItems: 1
          maxItems: 14
          items: { $ref: '#/components/schemas/Shift' }
        engineeringResourceId: { type: string, format: uuid, description: The engineering resource this one stands for; production orders name it on their jobs. }
        efficiencyPct: { type: integer, minimum: 1, maximum: 500, default: 100, description: 'Efficiency in whole percent (BR-23.1). A job of N process minutes books ceil(N x 100 / efficiencyPct) minutes of this resource, so 80 takes a quarter longer and 125 less; the route setup time used when the setup matrix has no entry is stretched the same way and rounded up apart (a matrix entry is this resource''s own changeover time and is used as is).' }
    Shift:
      type: object
      required: [weekday, startMinute, endMinute]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: Go time.Weekday, 0 = Sunday }
        startMinute: { type: integer, minimum: 0, maximum: 1440 }
        endMinute: { type: integer, minimum: 0, maximum: 1440 }
    Resource:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        finite: { type: boolean }
        timeZone: { type: string }
        shifts:
          type: array
          items: { $ref: '#/components/schemas/Shift' }
        efficiencyPct: { type: integer, minimum: 1, maximum: 500, description: Efficiency in whole percent (BR-23.1). }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        engineeringResourceId: { type: string, format: uuid, nullable: true, description: The engineering resource this one stands for; null when unmapped. }
    ResourcePatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        timeZone: { type: string, description: IANA time zone name. }
        shifts:
          type: array
          minItems: 1
          maxItems: 14
          items: { $ref: '#/components/schemas/Shift' }
        efficiencyPct: { type: integer, minimum: 1, maximum: 500, description: 'New efficiency in whole percent (BR-23.1); applies to runs and moves after the change, jobs already placed keep their length.' }
        engineeringResourceId: { type: string, description: 'The engineering resource this one stands for (a UUID), or an empty string to remove the mapping. Another resource already mapped to it gets 409 SCHED-0132.' }
    CapacityBlockUpdate:
      allOf:
        - $ref: '#/components/schemas/CapacityBlock'
        - type: object
          required: [affectedJobs]
          properties:
            affectedJobs:
              type: array
              description: Booked jobs from now on the block's resource that lie in open capacity but outside the capacity the active blocks leave them, by start (at most 500), each with the span of all its segments.
              items: { $ref: '#/components/schemas/AffectedJob' }
    ResourceUpdate:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          required: [affectedJobs]
          properties:
            affectedJobs:
              type: array
              description: Booked jobs outside the new open capacity, by start (at most 500), each with the span of all its segments.
              items: { $ref: '#/components/schemas/AffectedJob' }
    OperationRequest:
      type: object
      required: [orderId, operNumber, minutes, resourceIds]
      properties:
        orderId: { type: string, format: uuid }
        operNumber: { type: integer, minimum: 1 }
        minutes: { type: integer, minimum: 1, maximum: 100000 }
        dueAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time }
        priority: { type: integer, minimum: 0, maximum: 1000, default: 100, description: Lower runs first among orders with the same due date. }
        resourceIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
          description: Candidate resources, named resource first (FR-23.2).
        secondaryResourceIds:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
          description: >
            Secondary resources (tools, crews) booked for the same segments as
            the primary resource (BR-23.4). Distinct, existing, and not among
            the candidates. A finite secondary is never held by two jobs at once;
            when one is not free the primary slot is skipped. Unknown resources
            are refused with SCHED-0107 (422).
        setupGroup: { type: string, minLength: 1, maxLength: 32, description: "Setup group that drives changeovers against the resource's setup matrix (FR-23.15)." }
        setupMinutes: { type: integer, minimum: 0, maximum: 10080, default: 0, description: 'Route setup time, used when the matrix has no entry for a pair (SCHED-0012).' }
        queueBeforeMinutes: { type: integer, minimum: 0, maximum: 10080, default: 0, description: "Elapsed wait in front of the operation (FR-23.3). No resource is booked while it waits; the next operation of the order starts no earlier than this one's end plus its queue after plus the next one's queue before." }
        queueAfterMinutes: { type: integer, minimum: 0, maximum: 10080, default: 0, description: "Elapsed wait behind the operation (FR-23.3). No resource is booked while it waits; the next operation of the order starts no earlier than this one's end plus its queue after plus the next one's queue before." }
        quantity: { type: string, pattern: '^[0-9]+(\.[0-9]{1,4})?$', description: "Order quantity the operation works on, a decimal string with at most 4 decimals. Needed for an overlap." }
        overlapQuantity: { type: string, pattern: '^[0-9]+(\.[0-9]{1,4})?$', description: "Part of the quantity that must be through this operation before the next operation of the order may start (BR-23.5): the next one starts once the changeover and that share of the process minutes are done, instead of at the end, plus the queue times, and never ends before this one's end plus the queue times (its last units wait them too). A network step still counts its transfer time from this operation's end. At most the quantity." }
        attributes:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 120 }
          description: Product or order attributes capacity block conditions match on (FR-23.17); names 1 to 64 characters. The campaignKey attribute (at most 64 characters) is the key campaign proposals group the order by instead of its setup group (FR-23.14).
        networkId: { type: string, format: uuid, description: "Resource network governing the step from the order's previous operation into this one (FR-23.13). Unknown networks are refused with SCHED-0109 (422)." }
    Operation:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        minutes: { type: integer }
        dueAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time }
        priority: { type: integer }
        resourceIds:
          type: array
          items: { type: string, format: uuid }
        secondaryResourceIds:
          type: array
          items: { type: string, format: uuid }
        setupGroup: { type: [string, 'null'] }
        setupMinutes: { type: integer }
        queueBeforeMinutes: { type: integer, description: Elapsed wait in front of the operation, in minutes. }
        queueAfterMinutes: { type: integer, description: Elapsed wait behind the operation, in minutes. }
        quantity: { type: [string, 'null'], description: Order quantity the operation works on, a decimal string with 4 decimals; null when not set. }
        overlapQuantity: { type: [string, 'null'], description: Part of the quantity that must be through before the next operation may start (BR-23.5); null when there is no overlap. }
        attributes:
          type: object
          additionalProperties: { type: string }
        networkId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [open, scheduled, unplaced] }
        createdAt: { type: string, format: date-time }
        version: { type: integer, description: Starts at 1; the If-Match of a change or delete. }
        updatedAt: { type: string, format: date-time }
    OperationPatch:
      type: object
      description: Send at least one field; fields left out stay as they are.
      properties:
        minutes: { type: integer, minimum: 1, maximum: 100000 }
        dueAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time }
        priority: { type: integer, minimum: 0, maximum: 1000 }
        setupMinutes: { type: integer, minimum: 0, maximum: 10080 }
        queueBeforeMinutes: { type: integer, minimum: 0, maximum: 10080, description: Elapsed wait in front of the operation, in minutes. }
        queueAfterMinutes: { type: integer, minimum: 0, maximum: 10080, description: Elapsed wait behind the operation, in minutes. }
        quantity: { type: string, pattern: '^[0-9]+(\.[0-9]{1,4})?$', description: Order quantity the operation works on, a decimal string with at most 4 decimals; it cannot go below an existing overlap quantity. }
        overlapQuantity: { type: string, pattern: '^[0-9]+(\.[0-9]{1,4})?$', description: Part of the quantity that must be through before the next operation may start (BR-23.5); 0 clears the overlap; above the quantity or without a quantity is 422 SCHED-0142. }
        resourceIds:
          type: array
          minItems: 1
          maxItems: 50
          description: The candidate resources in priority order; they replace the list.
          items: { type: string, format: uuid }
    OperationUpdate:
      description: The changed operation.
      allOf:
        - $ref: '#/components/schemas/Operation'
        - type: object
          required: [jobsRemoved]
          properties:
            jobsRemoved: { type: boolean, description: The non-firmed jobs were removed and the operation is open again. }
    OperationRemoval:
      type: object
      required: [operationId, orderId, operNumber, jobsRemoved]
      properties:
        operationId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        jobsRemoved: { type: boolean }
    OrderUnschedule:
      type: object
      required: [orderId, operations, jobsRemoved, keptFirmed]
      properties:
        orderId: { type: string, format: uuid }
        operations:
          type: array
          description: Operation numbers that are open again.
          items: { type: integer }
        jobsRemoved: { type: integer, description: How many operations lost jobs. }
        keptFirmed:
          type: array
          description: Operation numbers a firmed job holds; they stay where they are.
          items: { type: integer }
    RunRequest:
      type: object
      description: >
        Heuristic run, forward from start or backward from each order's due
        date (the cp-sat algorithm is a later slice; see NOT-IMPLEMENTED.md).
        A backward run starts each order with a due date as late as it can
        while ending by that date; an order that cannot (or whose latest start
        is within an hour of the run start) is scheduled forward and, when
        late, reported with a SCHED-0003 warning (BR-23.2). Orders without a
        due date are scheduled forward. finite
        false is an infinite-capacity run: jobs stay inside open calendar time
        but may overlap and do not reserve capacity.
      required: [scope]
      properties:
        scope: { type: string, enum: [site, selection], description: 'site (every operation) or selection (operationIds)' }
        mode: { type: string, enum: [operations, jobs], description: 'jobs places every operation to the minute. operations (FR-23.2) schedules in daily buckets: an operation that follows another in its order (placed in the run, fixed or firmed) starts no earlier than the next local midnight, in its candidate resource''s time zone, at or after the time its predecessor allows (end, queue times, overlap share, network transfer; a predecessor ending exactly at midnight lets it start then), and never before the run start, so the plan steps in whole days between operations. The first operation of an order is placed as in jobs, and the minutes still book exactly. POST /orders/{id}:schedule takes the same mode (or the default); a move keeps the mode of the run that placed the job (its own run records it); campaign sequencing is placed as in jobs. Left out, it takes defaultMode of the scheduling parameters (jobs until changed).' }
        finite: { type: boolean, description: 'Left out, it takes defaultFinite of the scheduling parameters (true until changed).' }
        direction: { type: string, enum: [forward, backward], description: 'backward schedules from each order''s due date (FR-23.2, BR-23.2). Left out, it takes defaultDirection of the scheduling parameters (forward until changed).' }
        operationIds:
          type: array
          maxItems: 5000
          description: Required for selection scope, omitted for site scope.
          items: { type: string, format: uuid }
        start: { type: string, format: date-time, description: Defaults to now; must not be before today (UTC). }
        horizonDays: { type: integer, minimum: 30, maximum: 730, default: 365 }
    Run:
      type: object
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [site, selection, order, move, rollback] }
        mode: { type: string }
        direction: { type: string, enum: [forward, backward] }
        finite: { type: boolean }
        algorithm: { type: string, enum: [heuristic] }
        status: { type: string }
        operationsCount: { type: integer }
        makespanMinutes: { type: integer }
        totalLatenessMinutes: { type: integer }
        solverStatus:
          type: [string, 'null']
          description: Set for cp-sat runs (OPTIMAL, FEASIBLE, UNKNOWN).
        messages:
          type: array
          description: 'One entry per unplaced operation: "operationId: reason".'
          items: { type: string }
        warnings:
          type: array
          description: Findings on placed operations (SCHED-0003, SCHED-0010, SCHED-0012, SCHED-0014).
          items: { $ref: '#/components/schemas/RunWarning' }
        createdAt: { type: string, format: date-time }
        snapshot:
          type: boolean
          description: True when the run kept the jobs it placed, so it can be compared and rolled back to. Move runs and runs from before slice 29 have none.
        rollbackOf:
          type: [string, 'null']
          format: uuid
          description: The run a rollback restored; null for other runs.
    RunCompareJob:
      type: object
      description: A job only one of the two runs placed.
      properties:
        jobId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        resourceId: { type: string, format: uuid }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        lateMinutes: { type: integer }
    RunCompareChange:
      type: object
      description: A job both runs placed differently. From is the base run, to the other run.
      properties:
        jobId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        fromResourceId: { type: string, format: uuid }
        toResourceId: { type: string, format: uuid }
        fromStart: { type: string, format: date-time }
        toStart: { type: string, format: date-time }
        fromEnd: { type: string, format: date-time }
        toEnd: { type: string, format: date-time }
        startShiftMinutes: { type: integer, description: Other run minus base run; negative when earlier. }
        endShiftMinutes: { type: integer }
        lateDeltaMinutes: { type: integer, description: Lateness of the other run minus that of the base run. }
    RunMeasures:
      type: object
      description: The figures of one run's snapshot.
      properties:
        jobs: { type: integer }
        orders: { type: integer }
        lateJobs: { type: integer }
        totalLateMinutes: { type: integer }
        maxLateMinutes: { type: integer }
        changeoverMinutes: { type: integer }
        makespanMinutes: { type: integer }
        bookedMinutes: { type: integer, description: Minutes the run booked on its resources, primary and secondary. }
        openMinutes: { type: integer, description: Open minutes of those resources between the run's first start and last end, calendars as they are now. }
        utilizationPct: { type: number, description: Booked over open minutes in percent, one decimal; 0 without open minutes. }
    RunSide:
      type: object
      properties:
        run: { $ref: '#/components/schemas/Run' }
        measures: { $ref: '#/components/schemas/RunMeasures' }
    RunComparison:
      type: object
      properties:
        base: { $ref: '#/components/schemas/RunSide' }
        other: { $ref: '#/components/schemas/RunSide' }
        addedCount: { type: integer }
        removedCount: { type: integer }
        changedCount: { type: integer }
        unchangedCount: { type: integer }
        added:
          type: array
          items: { $ref: '#/components/schemas/RunCompareJob' }
        removed:
          type: array
          items: { $ref: '#/components/schemas/RunCompareJob' }
        changed:
          type: array
          items: { $ref: '#/components/schemas/RunCompareChange' }
        truncated: { type: boolean, description: True when a list was cut at 500 entries. }
    RunRollback:
      type: object
      properties:
        run: { $ref: '#/components/schemas/Run' }
        restored: { type: integer, description: Jobs written back as the current plan. }
        skipped:
          type: array
          items:
            type: object
            properties:
              jobId: { type: string, format: uuid }
              reason: { type: string, enum: [firmed, operation_missing, operation_changed, resource_missing] }
    RunWarning:
      type: object
      properties:
        code: { type: string, enum: [SCHED-0003, SCHED-0010, SCHED-0012, SCHED-0014] }
        operationId: { type: string, format: uuid }
        detail: { type: string }
    Bar:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        orderRef: { type: string, description: 'Shop floor key: the production order id.' }
        operationRef: { type: string, description: 'Shop floor key: the operation number as text without leading zeros.' }
        resourceId: { type: string, format: uuid }
        segment: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        lateMinutes: { type: integer }
        firmed: { type: boolean }
        setupGroup: { type: [string, 'null'] }
        changeoverMinutes: { type: integer, description: 'Changeover at the start of the job (first segment only; 0 on later segments).' }
        changeoverCost:
          description: 'Cost of the changeover from the setup matrix entry that priced it, in changeoverCurrency (FR-23.15). Null when no entry priced the job (same setup group, or the route setup was used, SCHED-0012) and on later segments.'
          oneOf:
            - { $ref: '#/components/schemas/Decimal' }
            - { type: 'null' }
        changeoverCurrency: { type: [string, 'null'], pattern: '^[A-Z]{3}$', description: 'ISO 4217 currency of changeoverCost (the setup matrix currency); null with it.' }
        cleaningSetId: { type: [string, 'null'], description: 'Cleaning standard operation set the matrix entry requires (recipe-dependent cleaning); null when none.' }
        outsideCapacity: { type: boolean, description: 'True when part of the segment lies outside the resource''s open capacity as it is now, calendar and overrides applied, such as inside a downtime added after the job was booked (SCHED-0002, AC-23.7). Also true when a secondary resource booked with the job is closed for the segment.' }
        blockBreach: { type: boolean, description: 'True when the segment lies in open capacity but in time the resource''s active capacity blocks do not leave a job with the operation''s attributes (BR-23.15), for example after a block was added or its condition changed. The job stays where it is until the next run or move. Never true together with outsideCapacity, nor for infinite-run jobs.' }
        secondaryResourceIds:
          type: array
          items: { type: string, format: uuid }
          description: Resources booked for the same segments as the primary resource (BR-23.4); empty when the operation needs none.
    MoveRequest:
      type: object
      required: [start]
      properties:
        resourceId: { type: string, format: uuid, description: Reassign within the capability set. }
        start: { type: string, format: date-time }
        dryRun: { type: boolean, default: false }
        propagate:
          type: boolean
          default: false
          description: Also push the orders pegged to the moved order forward behind their parents (FR-23.8, BR-23.10).
        overrideConstraints:
          type: boolean
          default: false
          description: Commit (or preview) the move over capacity violations of the moved job (SCHED-0002; SCHED-0005 for a closed secondary resource, never a booked one). Needs the scheduling.constraints.override duty (403 SCHED-0141 without it).
    MoveResponse:
      type: object
      required: [dryRun, feasible, overridden, violations, changes, dependents, truncated]
      properties:
        dryRun: { type: boolean }
        feasible: { type: boolean }
        overridden: { type: boolean, description: 'True when overrideConstraints was set and the move went over at least one violation; violations then lists them.' }
        violations:
          type: array
          description: Why a dry run is infeasible, or, with overridden true, what a feasible move went over.
          items:
            type: object
            required: [code, detail]
            properties:
              code: { type: string }
              detail: { type: string }
              jobId: { type: string, format: uuid }
        changes:
          type: array
          items:
            type: object
            properties:
              operationId: { type: string, format: uuid }
              orderId: { type: string, format: uuid }
              resourceId: { type: string, format: uuid }
              oldStart: { type: string, format: date-time }
              oldEnd: { type: string, format: date-time }
              newStart: { type: string, format: date-time }
              newEnd: { type: string, format: date-time }
              lateMinutes: { type: integer }
        orderId: { type: string, format: uuid }
        orderStart: { type: string, format: date-time }
        orderEnd: { type: string, format: date-time }
        dependents:
          type: array
          description: Pegged orders whose dates move with this move (propagate only), parents first.
          items:
            type: object
            required: [orderId, oldStart, oldEnd, newStart, newEnd]
            properties:
              orderId: { type: string, format: uuid }
              oldStart: { type: string, format: date-time }
              oldEnd: { type: string, format: date-time }
              newStart: { type: string, format: date-time }
              newEnd: { type: string, format: date-time }
        truncated: { type: boolean, description: 'The dependent walk stopped at the propagation limit of the scheduling parameters (SCHED-0007).' }
        run: { $ref: '#/components/schemas/Run' }
    PegRequest:
      type: object
      required: [parentOrderId, dependentOrderId]
      properties:
        parentOrderId: { type: string, format: uuid, description: Order whose output is consumed. }
        dependentOrderId: { type: string, format: uuid, description: Order that consumes it; must differ from the parent. }
    CapacityOverrideRequest:
      type: object
      required: [kind, start, end]
      properties:
        kind: { type: string, enum: [downtime, extra] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time, description: After start, at most 31 days later. }
        reason: { type: string, maxLength: 200 }
    CapacityOverride:
      allOf:
        - $ref: '#/components/schemas/CapacityOverrideRequest'
        - type: object
          required: [id, resourceId, reason, createdAt]
          properties:
            id: { type: string, format: uuid }
            resourceId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    AffectedJob:
      type: object
      required: [jobId, orderId, operNumber, start, end, firmed]
      properties:
        jobId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        firmed: { type: boolean }
    CapacityOverrideResult:
      allOf:
        - $ref: '#/components/schemas/CapacityOverride'
        - type: object
          required: [affectedJobs]
          properties:
            affectedJobs:
              type: array
              description: Booked jobs a downtime overlaps (empty for extra shifts); at most 500.
              items: { $ref: '#/components/schemas/AffectedJob' }
    Peg:
      allOf:
        - $ref: '#/components/schemas/PegRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    Firm:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        firmed: { type: boolean }
    RunKpis:
      type: object
      required: [runId, placedJobs, orders, lateJobs, lateOrders, maxLateMinutes, changeoverMinutes, bookedMinutes, spanStart, spanEnd, resources]
      properties:
        runId: { type: string, format: uuid }
        placedJobs: { type: integer, description: Operations whose jobs still carry this run. }
        orders: { type: integer }
        lateJobs: { type: integer }
        lateOrders: { type: integer }
        maxLateMinutes: { type: integer }
        changeoverMinutes: { type: integer }
        bookedMinutes: { type: integer, description: "Minutes of the run's job segments on their primary resources." }
        spanStart: { type: string, format: date-time, nullable: true, description: First start of the run's current jobs. }
        spanEnd: { type: string, format: date-time, nullable: true, description: Last end of the run's current jobs. }
        resources:
          type: array
          items: { $ref: '#/components/schemas/RunResourceKpi' }
    RunResourceKpi:
      type: object
      required: [resourceId, resourceCode, jobs, bookedMinutes, openMinutes, utilizationPct]
      properties:
        resourceId: { type: string, format: uuid }
        resourceCode: { type: string }
        jobs: { type: integer }
        bookedMinutes: { type: integer, description: Minutes the run booked on the resource, as primary or as a secondary resource held with a job. }
        openMinutes: { type: integer, description: "Open minutes of the resource's calendar, in its own time zone with overrides applied, inside the span." }
        utilizationPct: { type: number }
    LateOrder:
      type: object
      required: [orderId, dueAt, plannedStart, plannedEnd, lateMinutes, lateOperations, unplacedOperations, operations, firmed, dependentOrders]
      properties:
        orderId: { type: string, format: uuid }
        dueAt: { type: string, format: date-time, nullable: true, description: "The order's delivery date: the latest due date of its operations." }
        plannedStart: { type: string, format: date-time, nullable: true }
        plannedEnd: { type: string, format: date-time, nullable: true }
        lateMinutes: { type: integer, description: Lateness of the most late job. }
        lateOperations: { type: integer }
        unplacedOperations: { type: integer }
        operations: { type: integer }
        firmed: { type: boolean, description: True when any job of the order is firmed. }
        dependentOrders: { type: integer, description: "Pegged demand: orders pegged to consume this order's output, which its lateness delays in turn." }
    OrderImport:
      type: object
      required: [orderId, orderNumber, orderVersion, reason, eventId, status, operationsTotal, created, updated, unchanged, removed, keptFirmed, skipped, replanRequired, orderStart, orderEnd, receivedAt, reimportable, withdrawnAt, withdrawnTo]
      properties:
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        orderVersion: { type: integer, description: The production order version of the latest event; an older event is ignored. }
        reason: { type: string, enum: [schedule, redate], description: The reason of the latest schedule event; a withdrawal keeps it. }
        eventId: { type: string }
        status: { type: string, enum: [imported, partial, rejected, withdrawn], description: 'imported: every operation registered; partial: some left out; rejected: none registered; withdrawn: production took the order out of schedule (reset, cancel or merge) and its operations were removed.' }
        operationsTotal: { type: integer, description: Operations in the event. }
        created: { type: integer }
        updated: { type: integer, description: Operations whose minutes, setup, resources or dates changed; their jobs were dropped. }
        unchanged: { type: integer }
        removed: { type: integer, description: Operations that left the route and were deleted. }
        keptFirmed: { type: integer, description: Operations a firmed job holds, left as they were. }
        skipped:
          type: array
          items:
            type: object
            required: [operNumber, code, detail]
            properties:
              operNumber: { type: integer }
              code: { type: string, enum: [no-process-job, too-long, setup-too-long, unknown-resource, bad-hours, firmed] }
              detail: { type: string }
        replanRequired: { type: boolean, description: True when a changed operation lost its jobs and the next schedule run must place it. }
        orderStart: { type: string, format: date-time, nullable: true, description: The baseline start from production. }
        orderEnd: { type: string, format: date-time, nullable: true }
        receivedAt: { type: string, format: date-time }
        reimportable: { type: boolean, description: True when the received order is kept so `:reimport` can run it again. }
        withdrawnAt: { type: string, format: date-time, nullable: true, description: When production took the order out of schedule; null unless status is withdrawn. }
        withdrawnTo: { type: string, nullable: true, description: The production status the order moved to when it was withdrawn. }
    LoadJob:
      type: object
      required: [jobId, orderId, operNumber, segment, role, start, end, minutesInRange, finite, firmed, lateMinutes]
      properties:
        jobId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        segment: { type: integer }
        role: { type: string, enum: [primary, secondary] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        minutesInRange: { type: integer }
        finite: { type: boolean }
        firmed: { type: boolean }
        lateMinutes: { type: integer }
    DispatchLine:
      type: object
      required: [sequence, jobId, orderId, operNumber, segment, role, start, end, minutesInWindow, changeoverMinutes, finite, firmed, lateMinutes]
      properties:
        sequence: { type: integer, minimum: 1 }
        jobId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        segment: { type: integer }
        role: { type: string, enum: [primary, secondary] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        minutesInWindow: { type: integer }
        setupGroup: { type: string, description: Setup group of the operation; absent on secondary bookings and when none is set. }
        changeoverMinutes: { type: integer, description: Changeover laid in front of the job, on its first segment. }
        finite: { type: boolean }
        firmed: { type: boolean }
        lateMinutes: { type: integer }
    BottleneckEpisode:
      type: object
      required: [id, resourceId, resourceCode, firstWeek, flaggedWeeks, peakLoadPct, thresholdPct, consecutiveWeeks, detectedAt, closedAt, currentFlaggedWeeks, currentPeakLoadPct]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        resourceCode: { type: string }
        firstWeek: { type: string, format: date, description: Monday of the first flagged week when the episode opened. }
        flaggedWeeks: { type: integer, description: Flagged weeks when the episode opened. }
        peakLoadPct: { type: number, description: Highest flagged week when the episode opened, in percent. }
        thresholdPct: { type: integer }
        consecutiveWeeks: { type: integer }
        detectedAt: { type: string, format: date-time }
        closedAt: { type: [string, 'null'], format: date-time, description: Null while the episode is open; the end of its last flagged week when those weeks passed with no change to the resource. }
        currentFlaggedWeeks: { type: integer, description: Flagged weeks from the current week on that the materialized load holds now; 0 once closed. }
        currentPeakLoadPct: { type: number, description: Highest of those weeks, in percent; 0 once closed. }
    LoadWeek:
      type: object
      required: [weekStart, openMinutes, bookedMinutes, loadPct, bottleneck]
      properties:
        weekStart: { type: string, format: date }
        openMinutes: { type: integer }
        bookedMinutes: { type: integer }
        loadPct: { type: number }
        bottleneck: { type: boolean }
    BottleneckDetail:
      allOf:
        - $ref: '#/components/schemas/BottleneckEpisode'
        - type: object
          required: [weeks]
          properties:
            weeks:
              type: array
              items: { $ref: '#/components/schemas/LoadWeek' }
    LoadItem:
      type: object
      properties:
        resourceId: { type: string, format: uuid }
        period: { type: string, enum: [week, day] }
        periodStart: { type: string, format: date, description: "First day of the bucket: a Monday for weeks, the local date of the resource for days." }
        weekStart: { type: string, format: date, description: Present on week items only; equals periodStart. }
        start: { type: string, format: date-time, description: 'First instant of the bucket in UTC; with `end`, the range to pass to capacity-load/jobs.' }
        end: { type: string, format: date-time, description: Instant after the bucket in UTC (a DST day is 23 or 25 hours). }
        openMinutes: { type: integer }
        bookedMinutes: { type: integer }
        loadPct: { type: number }
        bottleneck: { type: boolean }
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: Exact decimal as a string (numbers are accepted on input).
    NetworkEdge:
      type: object
      required: [fromResourceId, toResourceId]
      properties:
        fromResourceId: { type: string, format: uuid }
        toResourceId: { type: string, format: uuid }
        transferMinutes: { type: integer, minimum: 0, maximum: 10080, default: 0 }
        maxWaitMinutes: { type: [integer, 'null'], minimum: 0, maximum: 10080 }
        secondaryResourceId: { type: string, format: uuid }
    NetworkRequest:
      type: object
      required: [code, name, activeFrom, edges]
      properties:
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        activeFrom: { type: string, format: date }
        activeTo: { type: [string, 'null'], format: date }
        edges:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/NetworkEdge' }
    Network:
      allOf:
        - $ref: '#/components/schemas/NetworkRequest'
        - type: object
          required: [id, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
    SetupEntry:
      type: object
      required: [fromGroup, toGroup, minutes]
      properties:
        fromGroup: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        toGroup: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        minutes: { type: integer, minimum: 0, maximum: 10080 }
        cost: { $ref: '#/components/schemas/Decimal' }
        cleaningSetId: { type: string, maxLength: 64 }
    SetupMatrixRequest:
      type: object
      required: [resourceId, activeFrom, currency, entries]
      properties:
        resourceId: { type: string, format: uuid }
        activeFrom: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        entries:
          type: array
          minItems: 1
          maxItems: 2500
          items: { $ref: '#/components/schemas/SetupEntry' }
    SetupMatrix:
      allOf:
        - $ref: '#/components/schemas/SetupMatrixRequest'
        - type: object
          required: [id, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, description: Next version per resource; the active matrix is the highest version with activeFrom on or before the day }
            createdAt: { type: string, format: date-time }
    CleanoutRuleRequest:
      type: object
      required: [setupGroup, durationMinutes]
      properties:
        setupGroup: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        durationMinutes: { type: integer, minimum: 1, maximum: 10080 }
        operationSetId: { type: string, maxLength: 64 }
        afterBatches: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
        afterHours: { type: [integer, 'null'], minimum: 1, maximum: 8760 }
        atCampaignEnd: { type: boolean, default: true }
    CleanoutRule:
      allOf:
        - $ref: '#/components/schemas/CleanoutRuleRequest'
        - type: object
          required: [id, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
    Predicate:
      type: object
      required: [attribute, op, value]
      properties:
        attribute: { type: string, minLength: 1, maxLength: 64 }
        op: { type: string, enum: ['=', '!=', '>=', '<=', '>', '<'] }
        value: { type: string, maxLength: 64, description: Ordering operators need a decimal value }
    NetworkPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        activeTo: { type: string, format: date, description: Last day the network applies; on or after its start date. }
    CapacityBlockPatch:
      type: object
      minProperties: 1
      properties:
        priority: { type: integer, minimum: 0, maximum: 1000 }
        active: { type: boolean }
        condition:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Predicate' }
    CapacityBlockRequest:
      type: object
      required: [resourceId, code]
      description: >
        Exactly one of: weekly windows (site-local, in the resource's time
        zone), startAt and endAt, or a recurrence.
      properties:
        resourceId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        windows:
          type: array
          minItems: 1
          maxItems: 14
          items: { $ref: '#/components/schemas/Shift' }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        recurrence: { $ref: '#/components/schemas/BlockRecurrence' }
        condition:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Predicate' }
        priority: { type: integer, minimum: 0, maximum: 1000, default: 0 }
        active: { type: boolean, default: true }
    BlockRecurrence:
      type: object
      required: [rule, startDate, startMinute, endMinute]
      description: >
        A recurring window, for example every Monday 06:00-14:00. Runs and
        moves expand it over their horizon in the resource's time zone, so a
        DST day keeps its true length.
      properties:
        rule:
          type: string
          maxLength: 200
          description: >
            RRULE subset (RFC 5545): FREQ=DAILY or WEEKLY (required),
            INTERVAL, BYDAY (weekly only, plain weekday codes), and COUNT or
            UNTIL=YYYYMMDD. Anything else is refused.
          examples: ['FREQ=WEEKLY;BYDAY=MO,WE', 'FREQ=DAILY;INTERVAL=2;COUNT=10']
        startDate: { type: string, format: date, description: First local date (DTSTART). }
        startMinute: { type: integer, minimum: 0, maximum: 1439, description: Site-local minutes after midnight. }
        endMinute: { type: integer, minimum: 1, maximum: 1440, description: After startMinute, within the same day. }
    CapacityBlock:
      allOf:
        - $ref: '#/components/schemas/CapacityBlockRequest'
        - type: object
          required: [id, condition, priority, active, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
    BlockWindow:
      type: object
      required: [blockId, code, priority, condition, start, end, blockMinutes, matchedMinutes, unusedMinutes]
      properties:
        blockId: { type: string, format: uuid }
        code: { type: string }
        priority: { type: integer }
        condition:
          type: array
          items: { $ref: '#/components/schemas/Predicate' }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        blockMinutes: { type: integer, minimum: 0, description: Open calendar minutes the window holds after higher-priority blocks }
        matchedMinutes: { type: integer, minimum: 0, description: Finite booked minutes of matching jobs in those minutes }
        unusedMinutes: { type: integer, minimum: 0 }
    ProposedCampaign:
      type: object
      required: [campaignKey, resourceId, plannedStart, runMinutes, orders]
      properties:
        campaignKey: { type: string, description: The campaignKey operation attribute, or the setup group }
        resourceId: { type: string, format: uuid }
        plannedStart: { type: string, format: date-time, description: Start of the earliest job in the proposal }
        runMinutes: { type: integer, minimum: 0 }
        orders:
          type: array
          minItems: 2
          maxItems: 1000
          items: { $ref: '#/components/schemas/ProposedCampaignOrder' }
    ProposedCampaignOrder:
      type: object
      required: [orderId, operationId, operNumber, resourceId, setupGroup, runMinutes, routeSetupMinutes, start, firmed]
      properties:
        orderId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        operNumber: { type: integer }
        resourceId: { type: string, format: uuid }
        setupGroup: { type: string }
        runMinutes: { type: integer, minimum: 1 }
        routeSetupMinutes: { type: integer, minimum: 0 }
        start: { type: string, format: date-time, description: Start of the operation's scheduled job }
        dueAt: { type: string, format: date-time }
        firmed: { type: boolean }
    CampaignOrderRequest:
      type: object
      required: [orderId, setupGroup, quantity]
      properties:
        orderId: { type: string, format: uuid }
        setupGroup: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        quantity: { $ref: '#/components/schemas/Decimal' }
        runMinutes: { type: integer, minimum: 0, maximum: 100000 }
        routeSetupMinutes: { type: integer, minimum: 0, maximum: 10080, description: Used as the changeover when the matrix has no entry (SCHED-0012) }
        dueAt: { type: string, format: date-time }
    CampaignOrder:
      allOf:
        - $ref: '#/components/schemas/CampaignOrderRequest'
        - type: object
          required: [position, sequence]
          properties:
            position: { type: integer, description: Order in which it was added (the manual sequence) }
            sequence: { type: [integer, 'null'], description: Run position once sequenced }
    CampaignRequest:
      type: object
      required: [resourceId, campaignKey, plannedStart]
      properties:
        resourceId: { type: string, format: uuid }
        campaignKey: { type: string, minLength: 1, maxLength: 64 }
        plannedStart: { type: string, format: date-time }
        maxOrders: { type: [integer, 'null'], minimum: 1, maximum: 1000 }
        maxQty: { $ref: '#/components/schemas/Decimal' }
        maxMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1000000, description: Run, changeover and cleanout minutes together }
        sequenceRule:
          type: string
          enum: [nearest-neighbor, manual, cp-sat]
          default: nearest-neighbor
          description: cp-sat asks scheduler-opt for the minimum-changeover order (at most 50 orders) and keeps nearest-neighbour unless that order is certified and cheaper
        currentSetupGroup: { type: [string, 'null'], description: The resource's setup group before the campaign (leading setup) }
        orders:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/CampaignOrderRequest' }
    Changeover:
      type: object
      required: [afterOrderId, fromGroup, toGroup, minutes, cost, missing]
      properties:
        beforeOrderId: { type: string, format: uuid, description: Absent for the leading setup }
        afterOrderId: { type: string, format: uuid }
        fromGroup: { type: string }
        toGroup: { type: string }
        minutes: { type: integer }
        cost: { $ref: '#/components/schemas/Decimal' }
        cleaningSetId: { type: string }
        missing: { type: boolean, description: No matrix entry; route setup minutes used (SCHED-0012) }
    PlannedCleanout:
      type: object
      required: [afterOrderId, setupGroup, minutes, reason]
      properties:
        afterOrderId: { type: string, format: uuid }
        setupGroup: { type: string }
        minutes: { type: integer }
        reason: { type: string, enum: [batches, run-time, campaign-end] }
        cleaningSetId: { type: string }
    CleanoutCounter:
      type: object
      description: Batches and run minutes since the resource's last cleanout (BR-23.13)
      required: [batches, minutes]
      properties:
        batches: { type: integer, minimum: 0 }
        minutes: { type: integer, minimum: 0 }
    Campaign:
      type: object
      required: [id, resourceId, campaignKey, status, plannedStart, sequenceRule, orderCount, runMinutes, changeoverMinutes, cleanoutMinutes, plan, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        campaignKey: { type: string }
        status: { type: string, enum: [proposed, planned, started, completed, cancelled] }
        plannedStart: { type: string, format: date-time }
        maxOrders: { type: [integer, 'null'] }
        maxQty: { type: [string, 'null'] }
        maxMinutes: { type: [integer, 'null'] }
        sequenceRule: { type: string, enum: [nearest-neighbor, manual, cp-sat] }
        currentSetupGroup: { type: [string, 'null'] }
        orderCount: { type: integer }
        runMinutes: { type: integer }
        changeoverMinutes: { type: integer }
        cleanoutMinutes: { type: integer }
        plan:
          type: [object, 'null']
          required: [changeovers, cleanouts, warnings, carryIn, carryOut, optimized]
          properties:
            changeovers:
              type: array
              items: { $ref: '#/components/schemas/Changeover' }
            cleanouts:
              type: array
              items: { $ref: '#/components/schemas/PlannedCleanout' }
            warnings:
              type: array
              items:
                type: object
                required: [code, detail]
                properties:
                  code: { type: string }
                  detail: { type: string }
            matrixId: { type: string, format: uuid }
            carryIn: { $ref: '#/components/schemas/CleanoutCounter' }
            carryOut: { $ref: '#/components/schemas/CleanoutCounter' }
            solverStatus:
              type: string
              description: cp-sat campaigns only (SCHED-0006)
              enum: [OPTIMAL, FEASIBLE, UNKNOWN, INFEASIBLE, MODEL_INVALID, UNAVAILABLE, TOO_LARGE]
            optimized: { type: boolean, description: The solver's order was kept }
        sequencedAt: { type: [string, 'null'], format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        cancelReason: { type: [string, 'null'] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        orders:
          type: array
          description: Present on the single-campaign read and command responses, in run order
          items: { $ref: '#/components/schemas/CampaignOrder' }
    AllocationRequest:
      type: object
      required: [amount, currency]
      properties:
        amount: { $ref: '#/components/schemas/Decimal' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        basis: { type: string, enum: [quantity, equal, run-minutes], default: quantity }
        actuals:
          type: array
          description: Actual RAF quantity or run minutes per order; the planned values are used otherwise
          items:
            type: object
            required: [orderId]
            properties:
              orderId: { type: string, format: uuid }
              quantity: { $ref: '#/components/schemas/Decimal' }
              runMinutes: { type: integer, minimum: 0 }
    Allocation:
      type: object
      required: [campaignId, basis, currency, amount, lines]
      properties:
        campaignId: { type: string, format: uuid }
        basis: { type: string }
        currency: { type: string }
        amount: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [orderId, weight, amount]
            properties:
              orderId: { type: string, format: uuid }
              weight: { $ref: '#/components/schemas/Decimal' }
              amount: { type: string, description: Rounded to the currency's minor unit }
