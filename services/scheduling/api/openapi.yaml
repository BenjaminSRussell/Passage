        - name: limit
          in: query
          required: false
          description: At most this many orders.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Received production orders, most recent first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrderImport' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/order-imports/{orderId}:
    get:
      operationId: getOrderImport
      summary: One received production order with its skipped operations
      description: What scheduling did with the latest `order.scheduled.v1` of the production order, including each skipped operation and its reason.
      x-passage-duty: scheduling.read
      parameters:
        - name: orderId
          in: path
          required: true
          description: The production order id.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The received production order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderImport' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/order-imports/{orderId}:reimport:
    post:
      operationId: reimportOrder
      summary: Import a received production order again with the resources and mappings that exist now
      description: >
        Runs the latest received `order.scheduled.v1` of the order through the intake again, at its own version. Use it
        after mapping a resource (`engineeringResourceId`) so operations that were left out as `unknown-resource` are
        registered without waiting for production to send a new event. Operations already registered stay unchanged; a
        newer event that arrived meanwhile wins and nothing changes. It needs no body and is naturally idempotent. An order
        received before scheduling kept events gets 409 SCHED-0133 and is imported again on its next event; a withdrawn order
        gets 409 SCHED-0134 and returns with production's next schedule event.
      x-passage-duty: scheduling.schedule.write
      parameters:
        - name: orderId
          in: path
          required: true
          description: The production order id.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The order's import record after the new import (an `orderimport.recorded` event is written)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderImport' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
