openapi: 3.1.0
info:
  title: Passage Scheduling
  version: 0.1.0
  description: >
    Finite capacity scheduling (wave 23, PSG-23). Routes match the handlers in
    internal/api. Errors are RFC 9457 problem details (application/problem+json)
    with a stable `code`; see README.md for the error codes.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/scheduling/resources:
    post:
      operationId: createResource
      summary: Create a resource with its weekly calendar
      x-passage-duty: scheduling.capacity.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceRequest' }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listResources
      summary: Resources ordered by code
      x-passage-duty: scheduling.read
      responses:
        '200':
          description: Resources
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Resource' }
  /v1/scheduling/resources/{id}:
    get:
      operationId: getResource
      summary: One resource with its weekly calendar
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The resource
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/resources/{id}/capacity:
    get:
      operationId: getResourceCapacity
      summary: Open capacity intervals (UTC) of a resource in a window of at most 62 days (FR-23.1)
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Open intervals clipped to the window
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Interval' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/resources/{id}/capacity-overrides:
    post:
      operationId: createCapacityOverride
      summary: Close a span of a resource calendar (downtime) or open one (extra shift) (FR-23.1)
      description: >
        A downtime removes the span from the resource's open capacity and
        wins over an overlapping extra shift; an extra shift adds it. Runs,
        moves, the capacity inquiry, block utilization and the weekly load all
        read the calendar with overrides applied. The booked jobs a downtime
        overlaps are returned in affectedJobs and stay where they are until
        they are moved or the schedule is run again (AC-23.7). A span is at
        most 31 days.
      x-passage-duty: scheduling.capacity.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapacityOverrideRequest' }
      responses:
        '201':
          description: 'Created. A replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityOverrideResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCapacityOverrides
      summary: Downtimes and extra shifts of a resource, optionally those overlapping a window
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Overrides by start (at most 1,000)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CapacityOverride' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/resources/{id}/capacity-overrides/{overrideId}:
    delete:
      operationId: deleteCapacityOverride
      summary: Remove a downtime or extra shift; later runs and moves see the plain calendar again
      x-passage-duty: scheduling.capacity.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: overrideId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/operations:
    post:
      operationId: createOperation
      summary: Add a schedulable operation of an order
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationRequest' }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listOperations
      summary: Operations ordered by order and operation number
      x-passage-duty: scheduling.read
      parameters:
        - name: orderId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, scheduled, unplaced] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Operations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/runs:
    post:
      operationId: createRun
      summary: Run the forward heuristic over the site or a selection of operations
      description: >
        The run applies resource networks (FR-23.13: an operation naming a
        network runs only on a resource with an edge from its predecessor's,
        within the transfer time and maximum wait, delaying the predecessor up
        to 7 days, else the order is unplaced with SCHED-0009
        NETWORK_INFEASIBLE), setup matrix changeovers (FR-23.15: laid in front
        of the process minutes from the group the resource is in; a missing
        entry uses the route setup and warns SCHED-0012) and capacity blocks
        (FR-23.17: a job runs in a block only if it matches; a job matching no
        block on its resource warns SCHED-0014).
      x-passage-duty: scheduling.run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunRequest' }
      responses:
        '201':
          description: 'Run completed. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listRuns
      summary: Schedule runs, newest first
      x-passage-duty: scheduling.read
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/runs/{id}:
    get:
      operationId: getRun
      summary: Run status and metrics
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/gantt:
    get:
      operationId: listGantt
      summary: Scheduled segments for a Gantt window (at most 5,000 bars)
      x-passage-duty: scheduling.read
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: resourceIds
          in: query
          required: false
          description: Comma-separated resource UUIDs.
          schema: { type: string }
      responses:
        '200':
          description: Bars in the window
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Bar' }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/jobs/{id}:move:
    post:
      operationId: moveJob
      summary: Move or reassign a job; dryRun previews violations and dependents
      description: >
        A commit (dryRun false) requires Idempotency-Key; a replay returns the
        stored outcome with Idempotent-Replayed: true. A preview writes nothing
        and needs no key. Firmed jobs cannot be moved (SCHED-0008). A move
        keeps the run constraints: the start must not fall in a capacity block
        the job does not match (SCHED-0002), changeovers are repriced and a
        later job on a touched resource left too short a changeover is a
        SCHED-0001 violation, and a changed network step needs an edge
        (SCHED-0009) within its maximum wait (SCHED-0010). A changeover is
        never split across closed time (BR-23.3): a start that would split it
        is SCHED-0002. With propagate, the orders pegged to the moved order
        (order-pegs) that would start before a parent ends are pushed forward
        with their successors, parents first, up to 500 orders or 5 pegging
        levels (BR-23.10); truncated reports a walk cut at a limit
        (SCHED-0007), and a conflict in any dependent refuses the whole move.
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: false
          description: Required when dryRun is false.
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveRequest' }
      responses:
        '200':
          description: Preview or committed move. Infeasible dry runs return feasible=false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/jobs/{id}:firm:
    post:
      operationId: firmJob
      summary: Firm or unfirm a placement; firmed placements are frozen against later runs
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firmed]
              properties:
                firmed: { type: boolean }
      responses:
        '200':
          description: 'Updated placement. A replay carries Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Firm' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/order-pegs:
    post:
      operationId: createOrderPeg
      summary: Peg a dependent order to the parent order whose output it consumes (FR-23.8)
      description: >
        Both orders need operations in scheduling (SCHED-0120), and a peg that
        would make an order depend on itself is refused (SCHED-0121). Pegging a
        pair that is already pegged returns the existing peg with 200. Pegs are
        entered here until wave 22 pegging publishes them.
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PegRequest' }
      responses:
        '201':
          description: 'Created. A replay or an existing pair returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Peg' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listOrderPegs
      summary: Order pegs, optionally those where an order is the parent or the dependent
      x-passage-duty: scheduling.read
      parameters:
        - name: orderId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Pegs by parent then dependent (at most 1,000)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Peg' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/order-pegs/{id}:
    delete:
      operationId: deleteOrderPeg
      summary: Remove a peg; later moves no longer push its dependent
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/capacity-load:
    get:
      operationId: listCapacityLoad
      summary: Booked versus open minutes per resource and week, with bottleneck flags
      x-passage-duty: scheduling.read
      parameters:
        - name: from
          in: query
          required: false
          description: Date (YYYY-MM-DD); defaults to today.
          schema: { type: string, format: date }
        - name: weeks
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 53, default: 4 }
        - name: resourceIds
          in: query
          required: false
          description: Comma-separated resource UUIDs; all resources when omitted.
          schema: { type: string }
      responses:
        '200':
          description: Weekly load (weeks start Monday 00:00 UTC)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LoadItem' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/networks:
    post:
      operationId: createNetwork
      summary: Create a resource network with its allowed transitions (FR-23.13)
      x-passage-duty: scheduling.setup.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkRequest' }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listNetworks
      summary: Resource networks ordered by code, with their edges
      x-passage-duty: scheduling.read
      responses:
        '200':
          description: Networks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Network' }
  /v1/scheduling/networks/{id}:
    get:
      operationId: getNetwork
      summary: One resource network with its edges
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The network
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/setup-matrices:
    post:
      operationId: createSetupMatrix
      summary: Create the next version of a resource's setup matrix (FR-23.15)
      x-passage-duty: scheduling.setup.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupMatrixRequest' }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupMatrix' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listSetupMatrices
      summary: Setup matrices, newest version first
      x-passage-duty: scheduling.read
      parameters:
        - name: resourceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Setup matrices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SetupMatrix' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/setup-matrices/{id}:
    get:
      operationId: getSetupMatrix
      summary: One setup matrix with its changeover entries
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupMatrix' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/cleanout-rules:
    post:
      operationId: createCleanoutRule
      summary: Create the cleanout rule of a setup group (FR-23.15, BR-23.13)
      x-passage-duty: scheduling.setup.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CleanoutRuleRequest' }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanoutRule' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCleanoutRules
      summary: Cleanout rules ordered by setup group
      x-passage-duty: scheduling.read
      responses:
        '200':
          description: Cleanout rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CleanoutRule' }
  /v1/scheduling/capacity-blocks:
    post:
      operationId: createCapacityBlock
      summary: Create a capacity block restricted to an attribute condition (FR-23.17)
      x-passage-duty: scheduling.capacity.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapacityBlockRequest' }
      responses:
        '201':
          description: 'Created. An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityBlock' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCapacityBlocks
      summary: Capacity blocks by resource, highest priority first
      x-passage-duty: scheduling.read
      parameters:
        - name: resourceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Capacity blocks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CapacityBlock' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/resources/{id}/block-utilization:
    get:
      operationId: getBlockUtilization
      summary: Capacity block windows of a resource in a window of at most 62 days, with held, matched and unused minutes (FR-23.17, PRD 4.23.14 Block utilization)
      description: >
        Every window of the resource's active capacity blocks that overlaps [from, to), expanded in the
        resource's time zone (weekly windows, recurrences or the dated window) and clipped to the range.
        blockMinutes counts the open calendar minutes the window holds once higher-priority blocks have
        taken theirs (BR-23.15); matchedMinutes counts the finite booked minutes of jobs whose attributes
        match the block condition inside them; unusedMinutes is the difference. Sorted by start, then
        priority (highest first).
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Block windows clipped to the range
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BlockWindow' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaign-proposals:
    get:
      operationId: proposeCampaigns
      summary: Propose campaigns from scheduled orders that share a campaign key within a window (FR-23.14)
      description: >
        Reads the jobs that start in [from, from + windowDays) and whose operation has a setup group, of
        orders that belong to no campaign (planned and firmed jobs alike). An order is offered once, with
        its earliest such job. Orders are grouped by resource and campaign key: the operation attribute
        campaignKey when set, otherwise the setup group. A group of two or more orders is a proposal, in
        the order the jobs start; a group of more than 1000 orders is split into consecutive proposals.
        Nothing is stored: a planner creates the campaign from a proposal with POST /campaigns, entering
        each order's quantity. Proposals are sorted by planned start, then key, then resource.
      x-passage-duty: scheduling.read
      parameters:
        - name: from
          in: query
          description: Window start; defaults to the current minute.
          schema: { type: string, format: date-time }
        - name: windowDays
          in: query
          description: Window length in days (site parameter "Campaign proposal window days").
          schema: { type: integer, minimum: 1, maximum: 90, default: 14 }
        - name: resourceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Proposed campaigns
          content:
            application/json:
              schema:
                type: object
                required: [from, to, windowDays, items]
                properties:
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  windowDays: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProposedCampaign' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns:
    post:
      operationId: createCampaign
      summary: Create a proposed campaign with its orders (FR-23.14)
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignRequest' }
      responses:
        '201':
          description: 'Created, with ETag "<version>". An idempotent replay returns 200 with Idempotent-Replayed: true.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCampaigns
      summary: Campaigns, newest first (without their orders)
      x-passage-duty: scheduling.read
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [proposed, planned, started, completed, cancelled] }
        - name: resourceId
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Campaigns
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Campaign' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}:
    get:
      operationId: getCampaign
      summary: One campaign with its orders in run order; ETag carries the version
      x-passage-duty: scheduling.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}/orders:
    post:
      operationId: addCampaignOrder
      summary: Add an order to a campaign that has not started; clears its sequence (SCHED-0011 when started)
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignOrderRequest' }
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}/orders/{orderId}:
    delete:
      operationId: removeCampaignOrder
      summary: Take an order out of a campaign that has not started; clears its sequence
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}:sequence:
    post:
      operationId: sequenceCampaign
      summary: >
        Sequence the campaign with the setup matrix in force on its planned start
        (BR-23.12) and insert cleanouts (BR-23.13); the campaign becomes planned and
        campaign.sequenced is published. SCHED-0012 warnings list pairs without a matrix entry.
        A cp-sat campaign first asks scheduler-opt for its order (BR-23.9) and reports the
        outcome as SCHED-0006; solver trouble never fails the command. Cleanouts count on
        from the resource's cleanout counter (carryIn).
      x-passage-duty: scheduling.schedule.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}:start:
    post:
      operationId: startCampaign
      summary: >
        Start a planned campaign; it is frozen afterwards, the resource's cleanout counter
        becomes the plan's carryOut and campaign.started is published. 409 SCHED-0123 when
        the counter moved after the campaign was sequenced.
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/scheduling/campaigns/{id}:allocate-cost:
    post:
      operationId: allocateCampaignCost
      summary: >
        Compute the allocation of a campaign's setup and cleanout cost to its orders
        (FR-23.16, BR-23.14). Nothing is posted or stored, so no Idempotency-Key is needed.
      x-passage-duty: scheduling.campaign.write
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllocationRequest' }
      responses:
        '200':
          description: The allocation; amounts sum exactly to the cost
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Allocation' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: healthz
      summary: Liveness
      security: []
      responses:
        '200': { description: Process is up }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness (Postgres reachable)
      security: []
      responses:
        '200': { description: Ready }
        '503': { description: Database unreachable }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The campaign version from its ETag, for example "3". A stale version gets 412 SCHED-0115.
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Campaign:
      description: 'The changed campaign with ETag "<version>". A replay of the same Idempotency-Key returns the first answer with Idempotent-Replayed: true.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Campaign' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: 'https://passage.dev/problems/SCHED-0001' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          description: Field name to message for validation failures (COM-0001).
          additionalProperties: { type: string }
    Interval:
      type: object
      required: [start, end, minutes]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        minutes: { type: integer }
    ResourceRequest:
      type: object
      required: [code, name, timeZone, shifts]
      properties:
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        name: { type: string }
        finite: { type: boolean, default: true }
        timeZone: { type: string, description: IANA zone of the site calendar }
        shifts:
          type: array
          minItems: 1
          maxItems: 14
          items: { $ref: '#/components/schemas/Shift' }
    Shift:
      type: object
      required: [weekday, startMinute, endMinute]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: Go time.Weekday, 0 = Sunday }
        startMinute: { type: integer, minimum: 0, maximum: 1440 }
        endMinute: { type: integer, minimum: 0, maximum: 1440 }
    Resource:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        finite: { type: boolean }
        timeZone: { type: string }
        shifts:
          type: array
          items: { $ref: '#/components/schemas/Shift' }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    OperationRequest:
      type: object
      required: [orderId, operNumber, minutes, resourceIds]
      properties:
        orderId: { type: string, format: uuid }
        operNumber: { type: integer, minimum: 1 }
        minutes: { type: integer, minimum: 1, maximum: 100000 }
        dueAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time }
        priority: { type: integer, minimum: 0, maximum: 1000, default: 100, description: Lower runs first among orders with the same due date. }
        resourceIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
          description: Candidate resources, named resource first (FR-23.2).
        setupGroup: { type: string, minLength: 1, maxLength: 32, description: "Setup group that drives changeovers against the resource's setup matrix (FR-23.15)." }
        setupMinutes: { type: integer, minimum: 0, maximum: 10080, default: 0, description: 'Route setup time, used when the matrix has no entry for a pair (SCHED-0012).' }
        attributes:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 120 }
          description: Product or order attributes capacity block conditions match on (FR-23.17); names 1 to 64 characters. The campaignKey attribute (at most 64 characters) is the key campaign proposals group the order by instead of its setup group (FR-23.14).
        networkId: { type: string, format: uuid, description: "Resource network governing the step from the order's previous operation into this one (FR-23.13). Unknown networks are refused with SCHED-0109 (422)." }
    Operation:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        minutes: { type: integer }
        dueAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time }
        priority: { type: integer }
        resourceIds:
          type: array
          items: { type: string, format: uuid }
        setupGroup: { type: [string, 'null'] }
        setupMinutes: { type: integer }
        attributes:
          type: object
          additionalProperties: { type: string }
        networkId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [open, scheduled, unplaced] }
        createdAt: { type: string, format: date-time }
    RunRequest:
      type: object
      description: >
        Heuristic run, always forward from start (backward direction and the
        cp-sat algorithm are later slices; see NOT-IMPLEMENTED.md). finite
        false is an infinite-capacity run: jobs stay inside open calendar time
        but may overlap and do not reserve capacity.
      required: [scope]
      properties:
        scope: { type: string, enum: [site, selection], description: 'site (every operation) or selection (operationIds)' }
        mode: { type: string, enum: [operations, jobs], default: jobs, description: Recorded on the run; both modes place at minute granularity in this slice. }
        finite: { type: boolean, default: true }
        operationIds:
          type: array
          maxItems: 5000
          description: Required for selection scope, omitted for site scope.
          items: { type: string, format: uuid }
        start: { type: string, format: date-time, description: Defaults to now; must not be before today (UTC). }
        horizonDays: { type: integer, minimum: 30, maximum: 730, default: 365 }
    Run:
      type: object
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [site, selection, move] }
        mode: { type: string }
        direction: { type: string }
        finite: { type: boolean }
        algorithm: { type: string, enum: [heuristic] }
        status: { type: string }
        operationsCount: { type: integer }
        makespanMinutes: { type: integer }
        totalLatenessMinutes: { type: integer }
        solverStatus:
          type: [string, 'null']
          description: Set for cp-sat runs (OPTIMAL, FEASIBLE, UNKNOWN).
        messages:
          type: array
          description: 'One entry per unplaced operation: "operationId: reason".'
          items: { type: string }
        warnings:
          type: array
          description: Findings on placed operations (SCHED-0010, SCHED-0012, SCHED-0014).
          items: { $ref: '#/components/schemas/RunWarning' }
        createdAt: { type: string, format: date-time }
    RunWarning:
      type: object
      properties:
        code: { type: string, enum: [SCHED-0010, SCHED-0012, SCHED-0014] }
        operationId: { type: string, format: uuid }
        detail: { type: string }
    Bar:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        resourceId: { type: string, format: uuid }
        segment: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        lateMinutes: { type: integer }
        firmed: { type: boolean }
        setupGroup: { type: [string, 'null'] }
        changeoverMinutes: { type: integer, description: 'Changeover at the start of the job (first segment only; 0 on later segments).' }
        changeoverCost:
          description: 'Cost of the changeover from the setup matrix entry that priced it, in changeoverCurrency (FR-23.15). Null when no entry priced the job (same setup group, or the route setup was used, SCHED-0012) and on later segments.'
          oneOf:
            - { $ref: '#/components/schemas/Decimal' }
            - { type: 'null' }
        changeoverCurrency: { type: [string, 'null'], pattern: '^[A-Z]{3}$', description: 'ISO 4217 currency of changeoverCost (the setup matrix currency); null with it.' }
        cleaningSetId: { type: [string, 'null'], description: 'Cleaning standard operation set the matrix entry requires (recipe-dependent cleaning); null when none.' }
        outsideCapacity: { type: boolean, description: 'True when part of the segment lies outside the resource''s open capacity as it is now, calendar and overrides applied, such as inside a downtime added after the job was booked (SCHED-0002, AC-23.7).' }
    MoveRequest:
      type: object
      required: [start]
      properties:
        resourceId: { type: string, format: uuid, description: Reassign within the capability set. }
        start: { type: string, format: date-time }
        dryRun: { type: boolean, default: false }
        propagate:
          type: boolean
          default: false
          description: Also push the orders pegged to the moved order forward behind their parents (FR-23.8, BR-23.10).
    MoveResponse:
      type: object
      required: [dryRun, feasible, violations, changes, dependents, truncated]
      properties:
        dryRun: { type: boolean }
        feasible: { type: boolean }
        violations:
          type: array
          items:
            type: object
            required: [code, detail]
            properties:
              code: { type: string }
              detail: { type: string }
              jobId: { type: string, format: uuid }
        changes:
          type: array
          items:
            type: object
            properties:
              operationId: { type: string, format: uuid }
              orderId: { type: string, format: uuid }
              resourceId: { type: string, format: uuid }
              oldStart: { type: string, format: date-time }
              oldEnd: { type: string, format: date-time }
              newStart: { type: string, format: date-time }
              newEnd: { type: string, format: date-time }
              lateMinutes: { type: integer }
        orderId: { type: string, format: uuid }
        orderStart: { type: string, format: date-time }
        orderEnd: { type: string, format: date-time }
        dependents:
          type: array
          description: Pegged orders whose dates move with this move (propagate only), parents first.
          items:
            type: object
            required: [orderId, oldStart, oldEnd, newStart, newEnd]
            properties:
              orderId: { type: string, format: uuid }
              oldStart: { type: string, format: date-time }
              oldEnd: { type: string, format: date-time }
              newStart: { type: string, format: date-time }
              newEnd: { type: string, format: date-time }
        truncated: { type: boolean, description: The dependent walk stopped at 500 orders or 5 levels (SCHED-0007). }
        run: { $ref: '#/components/schemas/Run' }
    PegRequest:
      type: object
      required: [parentOrderId, dependentOrderId]
      properties:
        parentOrderId: { type: string, format: uuid, description: Order whose output is consumed. }
        dependentOrderId: { type: string, format: uuid, description: Order that consumes it; must differ from the parent. }
    CapacityOverrideRequest:
      type: object
      required: [kind, start, end]
      properties:
        kind: { type: string, enum: [downtime, extra] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time, description: After start, at most 31 days later. }
        reason: { type: string, maxLength: 200 }
    CapacityOverride:
      allOf:
        - $ref: '#/components/schemas/CapacityOverrideRequest'
        - type: object
          required: [id, resourceId, reason, createdAt]
          properties:
            id: { type: string, format: uuid }
            resourceId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    AffectedJob:
      type: object
      required: [jobId, orderId, operNumber, start, end, firmed]
      properties:
        jobId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        firmed: { type: boolean }
    CapacityOverrideResult:
      allOf:
        - $ref: '#/components/schemas/CapacityOverride'
        - type: object
          required: [affectedJobs]
          properties:
            affectedJobs:
              type: array
              description: Booked jobs a downtime overlaps (empty for extra shifts); at most 500.
              items: { $ref: '#/components/schemas/AffectedJob' }
    Peg:
      allOf:
        - $ref: '#/components/schemas/PegRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    Firm:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        firmed: { type: boolean }
    LoadItem:
      type: object
      properties:
        resourceId: { type: string, format: uuid }
        weekStart: { type: string, format: date }
        openMinutes: { type: integer }
        bookedMinutes: { type: integer }
        loadPct: { type: number }
        bottleneck: { type: boolean }
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: Exact decimal as a string (numbers are accepted on input).
    NetworkEdge:
      type: object
      required: [fromResourceId, toResourceId]
      properties:
        fromResourceId: { type: string, format: uuid }
        toResourceId: { type: string, format: uuid }
        transferMinutes: { type: integer, minimum: 0, maximum: 10080, default: 0 }
        maxWaitMinutes: { type: [integer, 'null'], minimum: 0, maximum: 10080 }
        secondaryResourceId: { type: string, format: uuid }
    NetworkRequest:
      type: object
      required: [code, name, activeFrom, edges]
      properties:
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        activeFrom: { type: string, format: date }
        activeTo: { type: [string, 'null'], format: date }
        edges:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/NetworkEdge' }
    Network:
      allOf:
        - $ref: '#/components/schemas/NetworkRequest'
        - type: object
          required: [id, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
    SetupEntry:
      type: object
      required: [fromGroup, toGroup, minutes]
      properties:
        fromGroup: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        toGroup: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        minutes: { type: integer, minimum: 0, maximum: 10080 }
        cost: { $ref: '#/components/schemas/Decimal' }
        cleaningSetId: { type: string, maxLength: 64 }
    SetupMatrixRequest:
      type: object
      required: [resourceId, activeFrom, currency, entries]
      properties:
        resourceId: { type: string, format: uuid }
        activeFrom: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        entries:
          type: array
          minItems: 1
          maxItems: 2500
          items: { $ref: '#/components/schemas/SetupEntry' }
    SetupMatrix:
      allOf:
        - $ref: '#/components/schemas/SetupMatrixRequest'
        - type: object
          required: [id, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, description: Next version per resource; the active matrix is the highest version with activeFrom on or before the day }
            createdAt: { type: string, format: date-time }
    CleanoutRuleRequest:
      type: object
      required: [setupGroup, durationMinutes]
      properties:
        setupGroup: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        durationMinutes: { type: integer, minimum: 1, maximum: 10080 }
        operationSetId: { type: string, maxLength: 64 }
        afterBatches: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
        afterHours: { type: [integer, 'null'], minimum: 1, maximum: 8760 }
        atCampaignEnd: { type: boolean, default: true }
    CleanoutRule:
      allOf:
        - $ref: '#/components/schemas/CleanoutRuleRequest'
        - type: object
          required: [id, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
    Predicate:
      type: object
      required: [attribute, op, value]
      properties:
        attribute: { type: string, minLength: 1, maxLength: 64 }
        op: { type: string, enum: ['=', '!=', '>=', '<=', '>', '<'] }
        value: { type: string, maxLength: 64, description: Ordering operators need a decimal value }
    CapacityBlockRequest:
      type: object
      required: [resourceId, code]
      description: >
        Exactly one of: weekly windows (site-local, in the resource's time
        zone), startAt and endAt, or a recurrence.
      properties:
        resourceId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        windows:
          type: array
          minItems: 1
          maxItems: 14
          items: { $ref: '#/components/schemas/Shift' }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        recurrence: { $ref: '#/components/schemas/BlockRecurrence' }
        condition:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Predicate' }
        priority: { type: integer, minimum: 0, maximum: 1000, default: 0 }
        active: { type: boolean, default: true }
    BlockRecurrence:
      type: object
      required: [rule, startDate, startMinute, endMinute]
      description: >
        A recurring window, for example every Monday 06:00-14:00. Runs and
        moves expand it over their horizon in the resource's time zone, so a
        DST day keeps its true length.
      properties:
        rule:
          type: string
          maxLength: 200
          description: >
            RRULE subset (RFC 5545): FREQ=DAILY or WEEKLY (required),
            INTERVAL, BYDAY (weekly only, plain weekday codes), and COUNT or
            UNTIL=YYYYMMDD. Anything else is refused.
          examples: ['FREQ=WEEKLY;BYDAY=MO,WE', 'FREQ=DAILY;INTERVAL=2;COUNT=10']
        startDate: { type: string, format: date, description: First local date (DTSTART). }
        startMinute: { type: integer, minimum: 0, maximum: 1439, description: Site-local minutes after midnight. }
        endMinute: { type: integer, minimum: 1, maximum: 1440, description: After startMinute, within the same day. }
    CapacityBlock:
      allOf:
        - $ref: '#/components/schemas/CapacityBlockRequest'
        - type: object
          required: [id, condition, priority, active, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
    BlockWindow:
      type: object
      required: [blockId, code, priority, condition, start, end, blockMinutes, matchedMinutes, unusedMinutes]
      properties:
        blockId: { type: string, format: uuid }
        code: { type: string }
        priority: { type: integer }
        condition:
          type: array
          items: { $ref: '#/components/schemas/Predicate' }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        blockMinutes: { type: integer, minimum: 0, description: Open calendar minutes the window holds after higher-priority blocks }
        matchedMinutes: { type: integer, minimum: 0, description: Finite booked minutes of matching jobs in those minutes }
        unusedMinutes: { type: integer, minimum: 0 }
    ProposedCampaign:
      type: object
      required: [campaignKey, resourceId, plannedStart, runMinutes, orders]
      properties:
        campaignKey: { type: string, description: The campaignKey operation attribute, or the setup group }
        resourceId: { type: string, format: uuid }
        plannedStart: { type: string, format: date-time, description: Start of the earliest job in the proposal }
        runMinutes: { type: integer, minimum: 0 }
        orders:
          type: array
          minItems: 2
          maxItems: 1000
          items: { $ref: '#/components/schemas/ProposedCampaignOrder' }
    ProposedCampaignOrder:
      type: object
      required: [orderId, operationId, operNumber, resourceId, setupGroup, runMinutes, routeSetupMinutes, start, firmed]
      properties:
        orderId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        operNumber: { type: integer }
        resourceId: { type: string, format: uuid }
        setupGroup: { type: string }
        runMinutes: { type: integer, minimum: 1 }
        routeSetupMinutes: { type: integer, minimum: 0 }
        start: { type: string, format: date-time, description: Start of the operation's scheduled job }
        dueAt: { type: string, format: date-time }
        firmed: { type: boolean }
    CampaignOrderRequest:
      type: object
      required: [orderId, setupGroup, quantity]
      properties:
        orderId: { type: string, format: uuid }
        setupGroup: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$' }
        quantity: { $ref: '#/components/schemas/Decimal' }
        runMinutes: { type: integer, minimum: 0, maximum: 100000 }
        routeSetupMinutes: { type: integer, minimum: 0, maximum: 10080, description: Used as the changeover when the matrix has no entry (SCHED-0012) }
        dueAt: { type: string, format: date-time }
    CampaignOrder:
      allOf:
        - $ref: '#/components/schemas/CampaignOrderRequest'
        - type: object
          required: [position, sequence]
          properties:
            position: { type: integer, description: Order in which it was added (the manual sequence) }
            sequence: { type: [integer, 'null'], description: Run position once sequenced }
    CampaignRequest:
      type: object
      required: [resourceId, campaignKey, plannedStart]
      properties:
        resourceId: { type: string, format: uuid }
        campaignKey: { type: string, minLength: 1, maxLength: 64 }
        plannedStart: { type: string, format: date-time }
        maxOrders: { type: [integer, 'null'], minimum: 1, maximum: 1000 }
        maxQty: { $ref: '#/components/schemas/Decimal' }
        maxMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1000000, description: Run, changeover and cleanout minutes together }
        sequenceRule:
          type: string
          enum: [nearest-neighbor, manual, cp-sat]
          default: nearest-neighbor
          description: cp-sat asks scheduler-opt for the minimum-changeover order (at most 50 orders) and keeps nearest-neighbour unless that order is certified and cheaper
        currentSetupGroup: { type: [string, 'null'], description: The resource's setup group before the campaign (leading setup) }
        orders:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/CampaignOrderRequest' }
    Changeover:
      type: object
      required: [afterOrderId, fromGroup, toGroup, minutes, cost, missing]
      properties:
        beforeOrderId: { type: string, format: uuid, description: Absent for the leading setup }
        afterOrderId: { type: string, format: uuid }
        fromGroup: { type: string }
        toGroup: { type: string }
        minutes: { type: integer }
        cost: { $ref: '#/components/schemas/Decimal' }
        cleaningSetId: { type: string }
        missing: { type: boolean, description: No matrix entry; route setup minutes used (SCHED-0012) }
    PlannedCleanout:
      type: object
      required: [afterOrderId, setupGroup, minutes, reason]
      properties:
        afterOrderId: { type: string, format: uuid }
        setupGroup: { type: string }
        minutes: { type: integer }
        reason: { type: string, enum: [batches, run-time, campaign-end] }
        cleaningSetId: { type: string }
    CleanoutCounter:
      type: object
      description: Batches and run minutes since the resource's last cleanout (BR-23.13)
      required: [batches, minutes]
      properties:
        batches: { type: integer, minimum: 0 }
        minutes: { type: integer, minimum: 0 }
    Campaign:
      type: object
      required: [id, resourceId, campaignKey, status, plannedStart, sequenceRule, orderCount, runMinutes, changeoverMinutes, cleanoutMinutes, plan, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        campaignKey: { type: string }
        status: { type: string, enum: [proposed, planned, started, completed, cancelled] }
        plannedStart: { type: string, format: date-time }
        maxOrders: { type: [integer, 'null'] }
        maxQty: { type: [string, 'null'] }
        maxMinutes: { type: [integer, 'null'] }
        sequenceRule: { type: string, enum: [nearest-neighbor, manual, cp-sat] }
        currentSetupGroup: { type: [string, 'null'] }
        orderCount: { type: integer }
        runMinutes: { type: integer }
        changeoverMinutes: { type: integer }
        cleanoutMinutes: { type: integer }
        plan:
          type: [object, 'null']
          required: [changeovers, cleanouts, warnings, carryIn, carryOut, optimized]
          properties:
            changeovers:
              type: array
              items: { $ref: '#/components/schemas/Changeover' }
            cleanouts:
              type: array
              items: { $ref: '#/components/schemas/PlannedCleanout' }
            warnings:
              type: array
              items:
                type: object
                required: [code, detail]
                properties:
                  code: { type: string }
                  detail: { type: string }
            matrixId: { type: string, format: uuid }
            carryIn: { $ref: '#/components/schemas/CleanoutCounter' }
            carryOut: { $ref: '#/components/schemas/CleanoutCounter' }
            solverStatus:
              type: string
              description: cp-sat campaigns only (SCHED-0006)
              enum: [OPTIMAL, FEASIBLE, UNKNOWN, INFEASIBLE, MODEL_INVALID, UNAVAILABLE, TOO_LARGE]
            optimized: { type: boolean, description: The solver's order was kept }
        sequencedAt: { type: [string, 'null'], format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        orders:
          type: array
          description: Present on the single-campaign read and command responses, in run order
          items: { $ref: '#/components/schemas/CampaignOrder' }
    AllocationRequest:
      type: object
      required: [amount, currency]
      properties:
        amount: { $ref: '#/components/schemas/Decimal' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        basis: { type: string, enum: [quantity, equal, run-minutes], default: quantity }
        actuals:
          type: array
          description: Actual RAF quantity or run minutes per order; the planned values are used otherwise
          items:
            type: object
            required: [orderId]
            properties:
              orderId: { type: string, format: uuid }
              quantity: { $ref: '#/components/schemas/Decimal' }
              runMinutes: { type: integer, minimum: 0 }
    Allocation:
      type: object
      required: [campaignId, basis, currency, amount, lines]
      properties:
        campaignId: { type: string, format: uuid }
        basis: { type: string }
        currency: { type: string }
        amount: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [orderId, weight, amount]
            properties:
              orderId: { type: string, format: uuid }
              weight: { $ref: '#/components/schemas/Decimal' }
              amount: { type: string, description: Rounded to the currency's minor unit }
