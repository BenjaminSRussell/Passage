{{- if .Values.consumer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-consumer
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: consumer
spec:
  replicas: {{ .Values.consumer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: consumer
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: kafka
          secret:
            secretName: {{ required "consumer.kafka.secret is required" .Values.consumer.kafka.secret }}
            defaultMode: 0440
      containers:
        - name: {{ .Chart.Name }}-consumer
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [consume]
          ports:
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            - name: ADMIN_ADDR
              value: ":{{ .Values.service.adminPort }}"
            - name: KAFKA_BROKERS
              value: {{ required "consumer.kafka.brokers is required" .Values.consumer.kafka.brokers | quote }}
            - name: KAFKA_GROUP
              value: {{ .Values.consumer.kafka.group | quote }}
            - name: KAFKA_USERNAME
              value: {{ .Values.consumer.kafka.username | quote }}
            - name: KAFKA_PASSWORD_FILE
              value: /var/run/passage/kafka/password
            - name: KAFKA_TLS_CA_FILE
              value: /var/run/passage/kafka/ca.crt
          volumeMounts:
            - { name: kafka, mountPath: /var/run/passage/kafka, readOnly: true }
          startupProbe:
            httpGet: { path: /healthz, port: admin }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
          resources:
            {{- toYaml .Values.consumer.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
