asyncapi: 3.0.0
info:
  title: Passage Scheduling events
  version: 0.1.0
  description: >
    CloudEvents 1.0 published through the transactional outbox (Debezium
    outbox router). Event types follow dev.passage.<context>.<entity>.<verb>.v<n>.
    Payloads match internal/events/events.go.
defaultContentType: application/cloudevents+json
channels:
  runCompleted:
    address: passage.scheduling.run
    messages:
      runCompleted:
        $ref: '#/components/messages/RunCompleted'
  jobScheduled:
    address: passage.scheduling.job
    messages:
      jobScheduled:
        $ref: '#/components/messages/JobScheduled'
  orderDatesChanged:
    address: passage.scheduling.orderdates
    messages:
      orderDatesChanged:
        $ref: '#/components/messages/OrderDatesChanged'
  campaign:
    address: passage.scheduling.campaign
    messages:
      campaignSequenced:
        $ref: '#/components/messages/CampaignSequenced'
      campaignStarted:
        $ref: '#/components/messages/CampaignStarted'
  resource:
    address: passage.scheduling.resource
    messages:
      resourceUpdated:
        $ref: '#/components/messages/ResourceUpdated'
  capacityOverride:
    address: passage.scheduling.capacityoverride
    messages:
      capacityOverrideCreated:
        $ref: '#/components/messages/CapacityOverrideCreated'
      capacityOverrideDeleted:
        $ref: '#/components/messages/CapacityOverrideDeleted'
operations:
  publishRunCompleted:
    action: send
    channel: { $ref: '#/channels/runCompleted' }
    summary: A schedule run finished (production and planning consume it)
  publishJobScheduled:
    action: send
    channel: { $ref: '#/channels/jobScheduled' }
    summary: A job was placed or moved (production and shop floor consume it)
  publishOrderDatesChanged:
    action: send
    channel: { $ref: '#/channels/orderDatesChanged' }
    summary: An order start or end changed, including pegged orders a propagated move pushed (production, planning, sales consume it)
  publishCampaignSequenced:
    action: send
    channel: { $ref: '#/channels/campaign' }
    messages:
      - $ref: '#/channels/campaign/messages/campaignSequenced'
    summary: A campaign was sequenced by the setup matrix (production consumes the order sequence and cleanouts)
  publishCampaignStarted:
    action: send
    channel: { $ref: '#/channels/campaign' }
    messages:
      - $ref: '#/channels/campaign/messages/campaignStarted'
    summary: A campaign started and is frozen (production and planning consume it)
  publishCapacityOverrideCreated:
    action: send
    channel: { $ref: '#/channels/capacityOverride' }
    messages:
      - $ref: '#/channels/capacityOverride/messages/capacityOverrideCreated'
    summary: A downtime or extra shift was added to a resource calendar (production and the planner consume the affected jobs)
  publishCapacityOverrideDeleted:
    action: send
    channel: { $ref: '#/channels/capacityOverride' }
    messages:
      - $ref: '#/channels/capacityOverride/messages/capacityOverrideDeleted'
    summary: A downtime or extra shift was removed from a resource calendar
  publishResourceUpdated:
    action: send
    channel: { $ref: '#/channels/resource' }
    messages:
      - $ref: '#/channels/resource/messages/resourceUpdated'
    summary: A resource name, time zone or weekly calendar changed, with the booked jobs it no longer covers
components:
  messages:
    ResourceUpdated:
      title: Resource updated
      summary: A resource name, time zone or weekly calendar changed; lists the booked jobs the new calendar no longer covers.
      name: dev.passage.scheduling.resource.updated.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/ResourceUpdatedData'
    CapacityOverrideCreated:
      title: Capacity override created
      summary: A downtime or extra shift was added to a resource calendar; lists the booked jobs a downtime overlaps.
      name: dev.passage.scheduling.capacityoverride.created.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CapacityOverrideData'
    CapacityOverrideDeleted:
      title: Capacity override deleted
      summary: A downtime or extra shift was removed from a resource calendar.
      name: dev.passage.scheduling.capacityoverride.deleted.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CapacityOverrideData'
    RunCompleted:
      title: Schedule run completed
      summary: A schedule run finished; carries the counts, makespan and total lateness.
      name: dev.passage.scheduling.run.completed.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/RunCompletedData'
    JobScheduled:
      title: Job scheduled
      summary: A job was placed or moved on a resource, with its changeover.
      name: dev.passage.scheduling.job.scheduled.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/JobScheduledData'
    OrderDatesChanged:
      title: Order dates changed
      summary: An order start or end changed, including pegged orders pushed by a propagated move.
      name: dev.passage.scheduling.orderdates.changed.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/OrderDatesChangedData'
    CampaignSequenced:
      title: Campaign sequenced
      summary: A campaign was sequenced; carries the order sequence and cleanouts.
      name: dev.passage.scheduling.campaign.sequenced.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CampaignSequencedData'
    CampaignStarted:
      title: Campaign started
      summary: A campaign started and is frozen.
      name: dev.passage.scheduling.campaign.started.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CampaignStartedData'
  schemas:
    RunCompletedData:
      type: object
      required: [runId, scope, operations, makespanMinutes, totalLatenessMinutes]
      properties:
        runId: { type: string, format: uuid }
        scope: { type: string, enum: [site, selection] }
        operations: { type: integer }
        makespanMinutes: { type: integer }
        totalLatenessMinutes: { type: integer }
        solverStatus: { type: [string, 'null'] }
    JobScheduledData:
      type: object
      required: [jobId, orderId, operNumber, resourceId, start, end, changeoverMinutes, runId, firmed]
      properties:
        jobId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        resourceId: { type: string, format: uuid }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        changeoverMinutes: { type: integer, minimum: 0, description: 'Changeover at the start of the job, inside [start, end) (FR-23.15).' }
        changeoverCost: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$', description: 'Exact decimal cost of the changeover from the setup matrix entry that priced it. Omitted when no entry priced the job.' }
        changeoverCurrency: { type: string, pattern: '^[A-Z]{3}$', description: 'ISO 4217 currency of changeoverCost (the matrix currency); present exactly when changeoverCost is.' }
        cleaningSetId: { type: string, description: 'Cleaning standard operation set the matrix entry requires (recipe-dependent cleaning). Omitted when none.' }
        secondaryResourceIds: { type: array, items: { type: string, format: uuid }, description: "Resources booked for the same segments as the primary resource (BR-23.4). Omitted when none." }
        runId: { type: string, format: uuid }
        firmed: { type: boolean }
    OrderDatesChangedData:
      type: object
      required: [orderId, start, end, lateMinutes]
      properties:
        orderId: { type: string, format: uuid }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        lateMinutes: { type: integer }
    CampaignSequencedData:
      type: object
      required: [campaignId, resourceId, campaignKey, plannedStart, orders, changeoverMinutes, cleanouts, version]
      properties:
        campaignId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        campaignKey: { type: string }
        plannedStart: { type: string, format: date-time }
        orders:
          type: array
          items:
            type: object
            required: [orderId, sequence]
            properties:
              orderId: { type: string, format: uuid }
              sequence: { type: integer, minimum: 1 }
        changeoverMinutes: { type: integer }
        cleanouts:
          type: array
          items:
            type: object
            required: [afterOrderId, setupGroup, minutes, reason]
            properties:
              afterOrderId: { type: string, format: uuid }
              setupGroup: { type: string }
              minutes: { type: integer }
              reason: { type: string, enum: [batches, run-time, campaign-end] }
        version: { type: integer }
    ResourceUpdatedData:
      type: object
      required: [resourceId, code, name, timeZone, shifts, version, affectedJobs]
      properties:
        resourceId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        timeZone: { type: string }
        shifts:
          type: array
          items:
            type: object
            required: [weekday, startMinute, endMinute]
            properties:
              weekday: { type: integer, minimum: 0, maximum: 6, description: 0 is Sunday. }
              startMinute: { type: integer }
              endMinute: { type: integer }
        version: { type: integer }
        affectedJobs:
          type: array
          description: Booked jobs the new calendar no longer covers.
          items: { type: string, format: uuid }
    CapacityOverrideData:
      type: object
      required: [overrideId, resourceId, kind, start, end, reason, affectedJobs]
      properties:
        overrideId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        kind: { type: string, enum: [downtime, extra] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        reason: { type: string }
        affectedJobs:
          type: array
          description: Booked jobs a downtime overlaps when it is created (empty for extra shifts and on delete).
          items: { type: string, format: uuid }
    CampaignStartedData:
      type: object
      required: [campaignId, resourceId, startedAt, version]
      properties:
        campaignId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        version: { type: integer }
