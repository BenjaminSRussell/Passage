asyncapi: 3.0.0
info:
  title: Passage Scheduling events
  version: 0.1.0
  description: >
    CloudEvents 1.0 published through the transactional outbox (Debezium
    outbox router). Event types follow dev.passage.<context>.<entity>.<verb>.v<n>.
    Payloads match internal/events/events.go.
defaultContentType: application/cloudevents+json
channels:
  runCompleted:
    address: passage.scheduling.run
    messages:
      runCompleted:
        $ref: '#/components/messages/RunCompleted'
  jobScheduled:
    address: passage.scheduling.job
    messages:
      jobScheduled:
        $ref: '#/components/messages/JobScheduled'
  orderDatesChanged:
    address: passage.scheduling.orderdates
    messages:
      orderDatesChanged:
        $ref: '#/components/messages/OrderDatesChanged'
  campaign:
    address: passage.scheduling.campaign
    messages:
      campaignSequenced:
        $ref: '#/components/messages/CampaignSequenced'
      campaignStarted:
        $ref: '#/components/messages/CampaignStarted'
      campaignCompleted:
        $ref: '#/components/messages/CampaignCompleted'
      campaignCancelled:
        $ref: '#/components/messages/CampaignCancelled'
      campaignPlaced:
        $ref: '#/components/messages/CampaignPlaced'
      campaignUnplaced:
        $ref: '#/components/messages/CampaignUnplaced'
  cleanoutCounter:
    address: passage.scheduling.cleanoutcounter
    messages:
      cleanoutCounterReset:
        $ref: '#/components/messages/CleanoutCounterReset'
  resource:
    address: passage.scheduling.resource
    messages:
      resourceUpdated:
        $ref: '#/components/messages/ResourceUpdated'
  capacityOverride:
    address: passage.scheduling.capacityoverride
    messages:
      capacityOverrideCreated:
        $ref: '#/components/messages/CapacityOverrideCreated'
      capacityOverrideDeleted:
        $ref: '#/components/messages/CapacityOverrideDeleted'
  capacityBlock:
    address: passage.scheduling.capacityblock
    messages:
      capacityBlockUpdated:
        $ref: '#/components/messages/CapacityBlockUpdated'
  network:
    address: passage.scheduling.network
    messages:
      networkUpdated:
        $ref: '#/components/messages/NetworkUpdated'
  orderImport:
    address: passage.scheduling.orderimport
    messages:
      orderImportRecorded:
        $ref: '#/components/messages/OrderImportRecorded'
  operation:
    address: passage.scheduling.operation
    messages:
      operationUpdated:
        $ref: '#/components/messages/OperationUpdated'
      operationDeleted:
        $ref: '#/components/messages/OperationDeleted'
  order:
    address: passage.scheduling.order
    messages:
      orderUnscheduled:
        $ref: '#/components/messages/OrderUnscheduled'
  parameters:
    address: passage.scheduling.parameters
    messages:
      parametersUpdated:
        $ref: '#/components/messages/ParametersUpdated'
  bottleneck:
    address: passage.scheduling.bottleneck
    messages:
      bottleneckDetected:
        $ref: '#/components/messages/BottleneckDetected'
operations:
  publishRunCompleted:
    action: send
    channel: { $ref: '#/channels/runCompleted' }
    summary: A schedule run finished (production and planning consume it)
  publishJobScheduled:
    action: send
    channel: { $ref: '#/channels/jobScheduled' }
    summary: A job was placed or moved (production and shop floor consume it)
  publishOrderDatesChanged:
    action: send
    channel: { $ref: '#/channels/orderDatesChanged' }
    summary: An order start or end changed, including pegged orders a propagated move pushed (production, planning, sales consume it)
  publishCampaignSequenced:
    action: send
    channel: { $ref: '#/channels/campaign' }
    messages:
      - $ref: '#/channels/campaign/messages/campaignSequenced'
    summary: A campaign was sequenced by the setup matrix (production consumes the order sequence and cleanouts)
  publishCampaignStarted:
    action: send
    channel: { $ref: '#/channels/campaign' }
    messages:
      - $ref: '#/channels/campaign/messages/campaignStarted'
    summary: A campaign started and is frozen (production and planning consume it)
  publishCampaignCompleted:
    action: send
    channel: { $ref: '#/channels/campaign' }
    messages:
      - $ref: '#/channels/campaign/messages/campaignCompleted'
    summary: A started campaign was completed (production and costing consume it)
  publishCampaignCancelled:
    action: send
    channel: { $ref: '#/channels/campaign' }
    messages:
      - $ref: '#/channels/campaign/messages/campaignCancelled'
    summary: A campaign was cancelled and its orders released (production and planning consume it)
  publishCampaignPlaced:
    action: send
    channel: { $ref: '#/channels/campaign' }
    messages:
      - $ref: '#/channels/campaign/messages/campaignPlaced'
    summary: A sequenced campaign was laid on its resource with its job times and cleanout windows (production and planning consume it)
  publishCampaignUnplaced:
    action: send
    channel: { $ref: '#/channels/campaign' }
    messages:
      - $ref: '#/channels/campaign/messages/campaignUnplaced'
    summary: A placed campaign was taken off the schedule (production and planning consume it)
  publishCleanoutCounterReset:
    action: send
    channel: { $ref: '#/channels/cleanoutCounter' }
    messages:
      - $ref: '#/channels/cleanoutCounter/messages/cleanoutCounterReset'
    summary: A planner reset a resource's cleanout counter after a cleanout outside the plan (production and planning consume it)
  publishCapacityOverrideCreated:
    action: send
    channel: { $ref: '#/channels/capacityOverride' }
    messages:
      - $ref: '#/channels/capacityOverride/messages/capacityOverrideCreated'
    summary: A downtime or extra shift was added to a resource calendar (production and the planner consume the affected jobs)
  publishCapacityOverrideDeleted:
    action: send
    channel: { $ref: '#/channels/capacityOverride' }
    messages:
      - $ref: '#/channels/capacityOverride/messages/capacityOverrideDeleted'
    summary: A downtime or extra shift was removed from a resource calendar
  publishResourceUpdated:
    action: send
    channel: { $ref: '#/channels/resource' }
    messages:
      - $ref: '#/channels/resource/messages/resourceUpdated'
    summary: A resource name, time zone or weekly calendar changed, with the booked jobs it no longer covers
  publishCapacityBlockUpdated:
    action: send
    channel: { $ref: '#/channels/capacityBlock' }
    messages:
      - $ref: '#/channels/capacityBlock/messages/capacityBlockUpdated'
    summary: A capacity block's priority, condition or active flag changed
  publishNetworkUpdated:
    action: send
    channel: { $ref: '#/channels/network' }
    messages:
      - $ref: '#/channels/network/messages/networkUpdated'
    summary: A resource network was renamed or ended
  publishOrderImportRecorded:
    action: send
    channel: { $ref: '#/channels/orderImport' }
    messages:
      - $ref: '#/channels/orderImport/messages/orderImportRecorded'
    summary: A production order dated by wave 21 was received and its operations registered for scheduling
  publishOperationUpdated:
    action: send
    channel: { $ref: '#/channels/operation' }
    messages:
      - $ref: '#/channels/operation/messages/operationUpdated'
    summary: A planner changed an operation's duration, dates, priority or candidate resources
  publishOperationDeleted:
    action: send
    channel: { $ref: '#/channels/operation' }
    messages:
      - $ref: '#/channels/operation/messages/operationDeleted'
    summary: A planner removed an operation from scheduling
  publishOrderUnscheduled:
    action: send
    channel: { $ref: '#/channels/order' }
    messages:
      - $ref: '#/channels/order/messages/orderUnscheduled'
    summary: A planner took an order off the schedule
  publishParametersUpdated:
    action: send
    channel: { $ref: '#/channels/parameters' }
    messages:
      - $ref: '#/channels/parameters/messages/parametersUpdated'
    summary: The tenant's scheduling parameters changed
  publishBottleneckDetected:
    action: send
    channel: { $ref: '#/channels/bottleneck' }
    messages:
      - $ref: '#/channels/bottleneck/messages/bottleneckDetected'
    summary: A resource entered a bottleneck episode
components:
  messages:
    BottleneckDetected:
      title: Bottleneck detected
      summary: >-
        A resource has weeks loaded above the bottleneck threshold for the configured number of consecutive weeks.
        Published once when the episode opens; it is not repeated by later runs while the resource stays overloaded,
        and a new event follows only after the episode has closed (no flagged week left, or its last flagged week
        has passed) and the resource is overloaded again.
      name: dev.passage.scheduling.bottleneck.detected.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/BottleneckDetectedData'
    ParametersUpdated:
      title: Scheduling parameters updated
      summary: >-
        The tenant's scheduling parameters (default mode, direction and finite, drag snap, propagation limits)
        changed; runs and moves after the event use the new values.
      name: dev.passage.scheduling.parameters.updated.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/ParametersUpdatedData'
    OperationUpdated:
      title: Operation updated
      summary: >-
        An operation's duration, dates, priority, setup minutes, queue times or candidate resources changed. When jobsRemoved is true
        its non-firmed jobs left the schedule and the operation is open again; consumers holding its dates from
        job.scheduled drop them until the next run places it.
      name: dev.passage.scheduling.operation.updated.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/OperationUpdatedData'
    OperationDeleted:
      title: Operation deleted
      summary: An operation was removed from scheduling, with its non-firmed jobs when jobsRemoved is true.
      name: dev.passage.scheduling.operation.deleted.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/OperationDeletedData'
    OrderUnscheduled:
      title: Order unscheduled
      summary: >-
        A planner took an order off the schedule: the listed operations lost their non-firmed jobs and are open again;
        operations a firmed job holds stay where they are.
      name: dev.passage.scheduling.order.unscheduled.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/OrderUnscheduledData'
    OrderImportRecorded:
      title: Production order imported
      summary: >-
        Scheduling received a production order.scheduled.v1 event and registered, updated or removed the order's
        operations; lists the operations it could not register and whether the next run must place the order again.
        Events with reason `schedule` or `redate` are imported; an event with reason `finite` (production applying
        scheduling's own finite-capacity dates back onto the order, wave 21) is ignored and publishes nothing, so the
        two services do not loop.
        A production order.statuschanged.v1 to Estimated, Created or Cancelled with no dates (reset, cancel or merge)
        withdraws the order's operations and publishes this event with status `withdrawn`, reason `withdraw` and
        `withdrawnTo`. Other statuschanged events (release, start, report as finished, end) publish nothing, and so does
        one older than the order's last applied production event.
      name: dev.passage.scheduling.orderimport.recorded.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/OrderImportRecordedData'
    CapacityBlockUpdated:
      title: Capacity block updated
      summary: A capacity block's priority, condition or active flag changed; runs and moves after the event use the new values, and it lists the booked jobs the resource's blocks now keep out.
      name: dev.passage.scheduling.capacityblock.updated.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CapacityBlockUpdatedData'
    NetworkUpdated:
      title: Resource network updated
      summary: A resource network was renamed or ended on a date.
      name: dev.passage.scheduling.network.updated.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/NetworkUpdatedData'
    ResourceUpdated:
      title: Resource updated
      summary: A resource name, time zone, weekly calendar or engineering resource mapping changed; lists the booked jobs the new calendar no longer covers.
      name: dev.passage.scheduling.resource.updated.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/ResourceUpdatedData'
    CleanoutCounterReset:
      title: Cleanout counter reset
      summary: >-
        A planner told the scheduler a resource was cleaned out outside the plan; its batches and run minutes since the last
        cleanout are zero. Campaigns sequenced from the old counter are listed and must be sequenced again before they start.
      name: dev.passage.scheduling.cleanoutcounter.reset.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CleanoutCounterResetData'
    CapacityOverrideCreated:
      title: Capacity override created
      summary: A downtime or extra shift was added to a resource calendar; lists the booked jobs a downtime overlaps.
      name: dev.passage.scheduling.capacityoverride.created.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CapacityOverrideData'
    CapacityOverrideDeleted:
      title: Capacity override deleted
      summary: A downtime or extra shift was removed from a resource calendar.
      name: dev.passage.scheduling.capacityoverride.deleted.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CapacityOverrideData'
    RunCompleted:
      title: Schedule run completed
      summary: A schedule run finished; carries the counts, makespan and total lateness.
      name: dev.passage.scheduling.run.completed.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/RunCompletedData'
    JobScheduled:
      title: Job scheduled
      summary: A job was placed or moved on a resource, with its changeover.
      name: dev.passage.scheduling.job.scheduled.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/JobScheduledData'
    OrderDatesChanged:
      title: Order dates changed
      summary: An order start or end changed, including pegged orders pushed by a propagated move.
      name: dev.passage.scheduling.orderdates.changed.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/OrderDatesChangedData'
    CampaignSequenced:
      title: Campaign sequenced
      summary: A campaign was sequenced; carries the order sequence and cleanouts.
      name: dev.passage.scheduling.campaign.sequenced.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CampaignSequencedData'
    CampaignStarted:
      title: Campaign started
      summary: A campaign started and is frozen.
      name: dev.passage.scheduling.campaign.started.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CampaignStartedData'
    CampaignCompleted:
      title: Campaign completed
      summary: A started campaign was completed.
      name: dev.passage.scheduling.campaign.completed.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CampaignCompletedData'
    CampaignCancelled:
      title: Campaign cancelled
      summary: A campaign was cancelled; its orders are released and can join another campaign.
      name: dev.passage.scheduling.campaign.cancelled.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CampaignCancelledData'
    CampaignPlaced:
      title: Campaign placed
      summary: A sequenced campaign was laid on its resource; carries every job time and cleanout window.
      name: dev.passage.scheduling.campaign.placed.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CampaignPlacedData'
    CampaignUnplaced:
      title: Campaign unplaced
      summary: A placed campaign was taken off the schedule; its jobs are removed and its cleanout windows are open again.
      name: dev.passage.scheduling.campaign.unplaced.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CampaignUnplacedData'
  schemas:
    RunCompletedData:
      type: object
      required: [runId, scope, operations, makespanMinutes, totalLatenessMinutes]
      properties:
        runId: { type: string, format: uuid }
        scope: { type: string, enum: [site, selection, order, rollback, campaign] }
        operations: { type: integer }
        makespanMinutes: { type: integer }
        totalLatenessMinutes: { type: integer }
        solverStatus: { type: [string, 'null'] }
        rolledBackToRunId: { type: string, format: uuid, description: The run a rollback restored; present for scope rollback only. }
    JobScheduledData:
      type: object
      required: [jobId, orderId, operNumber, orderRef, operationRef, resourceId, start, end, changeoverMinutes, runId, firmed]
      properties:
        jobId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        orderRef: { type: string, description: 'Key shop floor execution (wave 25) expects: the production order id.' }
        operationRef: { type: string, description: 'Key shop floor execution expects: the operation number as text without leading zeros.' }
        resourceId: { type: string, format: uuid }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        changeoverMinutes: { type: integer, minimum: 0, description: 'Changeover at the start of the job, inside [start, end) (FR-23.15).' }
        changeoverCost: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$', description: 'Exact decimal cost of the changeover from the setup matrix entry that priced it. Omitted when no entry priced the job.' }
        changeoverCurrency: { type: string, pattern: '^[A-Z]{3}$', description: 'ISO 4217 currency of changeoverCost (the matrix currency); present exactly when changeoverCost is.' }
        cleaningSetId: { type: string, description: 'Cleaning standard operation set the matrix entry requires (recipe-dependent cleaning). Omitted when none.' }
        secondaryResourceIds: { type: array, items: { type: string, format: uuid }, description: "Resources booked for the same segments as the primary resource (BR-23.4). Omitted when none." }
        runId: { type: string, format: uuid }
        firmed: { type: boolean }
    OrderDatesChangedData:
      type: object
      required: [orderId, start, end, lateMinutes]
      properties:
        orderId: { type: string, format: uuid }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        lateMinutes: { type: integer }
    CampaignSequencedData:
      type: object
      required: [campaignId, resourceId, campaignKey, plannedStart, orders, changeoverMinutes, cleanouts, version]
      properties:
        campaignId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        campaignKey: { type: string }
        plannedStart: { type: string, format: date-time }
        orders:
          type: array
          items:
            type: object
            required: [orderId, sequence]
            properties:
              orderId: { type: string, format: uuid }
              sequence: { type: integer, minimum: 1 }
        changeoverMinutes: { type: integer }
        cleanouts:
          type: array
          items:
            type: object
            required: [afterOrderId, setupGroup, minutes, reason]
            properties:
              afterOrderId: { type: string, format: uuid }
              setupGroup: { type: string }
              minutes: { type: integer }
              reason: { type: string, enum: [batches, run-time, campaign-end] }
        version: { type: integer }
    CapacityBlockUpdatedData:
      type: object
      required: [blockId, resourceId, code, priority, active, condition, version, affectedJobs]
      properties:
        blockId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        code: { type: string }
        priority: { type: integer, minimum: 0, maximum: 1000 }
        active: { type: boolean }
        condition:
          type: array
          items:
            type: object
            required: [attribute, op, value]
            properties:
              attribute: { type: string }
              op: { type: string }
              value: { type: string }
        version: { type: integer }
        affectedJobs:
          type: array
          description: Booked jobs from the change on that lie inside a block they may not use; they stay where they are until moved or rescheduled.
          items: { type: string, format: uuid }
    OrderImportRecordedData:
      type: object
      required: [orderId, orderNumber, orderVersion, reason, status, operations, skipped, removedOperNumbers, keptFirmedOperNumbers, replanRequired]
      properties:
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        orderVersion: { type: integer, description: The production order version of the event that was imported. }
        reason: { type: string, enum: [schedule, redate, withdraw] }
        status: { type: string, enum: [imported, partial, rejected, withdrawn], description: 'imported: every operation registered; partial: some were left out; rejected: none could be registered; withdrawn: production took the order out of schedule and its operations were removed.' }
        withdrawnTo: { type: string, description: The production status the order moved to; present only when status is withdrawn. }
        operations:
          type: array
          items:
            type: object
            required: [operationId, operNumber, minutes, resourceIds, change]
            properties:
              operationId: { type: string, format: uuid }
              operNumber: { type: integer }
              minutes: { type: integer }
              resourceIds: { type: array, items: { type: string, format: uuid } }
              change: { type: string, enum: [created, updated, unchanged] }
        skipped:
          type: array
          items:
            type: object
            required: [operNumber, code, detail]
            properties:
              operNumber: { type: integer }
              code: { type: string, enum: [no-process-job, too-long, setup-too-long, unknown-resource, bad-hours] }
              detail: { type: string }
        removedOperNumbers: { type: array, items: { type: integer }, description: Operations that left the route and were deleted with their jobs. }
        keptFirmedOperNumbers: { type: array, items: { type: integer }, description: Operations a firmed job holds; the event did not change them. }
        replanRequired: { type: boolean, description: True when a changed operation lost its jobs and the next run must place it again. }
    NetworkUpdatedData:
      type: object
      required: [networkId, code, name, activeFrom, activeTo, version]
      properties:
        networkId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        activeFrom: { type: string, format: date }
        activeTo: { type: [string, 'null'], format: date }
        version: { type: integer }
    ResourceUpdatedData:
      type: object
      required: [resourceId, code, name, timeZone, shifts, efficiencyPct, version, affectedJobs, engineeringResourceId]
      properties:
        resourceId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        timeZone: { type: string }
        shifts:
          type: array
          items:
            type: object
            required: [weekday, startMinute, endMinute]
            properties:
              weekday: { type: integer, minimum: 0, maximum: 6, description: 0 is Sunday. }
              startMinute: { type: integer }
              endMinute: { type: integer }
        efficiencyPct: { type: integer, minimum: 1, maximum: 500, description: 'Efficiency in whole percent (BR-23.1); runs and moves after the change book process and route setup minutes at it, jobs already placed keep their length.' }
        version: { type: integer }
        affectedJobs:
          type: array
          description: Booked jobs the new calendar no longer covers.
          items: { type: string, format: uuid }
        engineeringResourceId: { type: string, format: uuid, nullable: true, description: The engineering resource this one stands for; null when unmapped. }
    CleanoutCounterResetData:
      type: object
      required: [resetId, resourceId, previousBatches, previousMinutes, reason, staleCampaignIds]
      properties:
        resetId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        previousBatches: { type: integer, minimum: 0 }
        previousMinutes: { type: integer, minimum: 0 }
        reason: { type: string }
        staleCampaignIds:
          type: array
          description: Planned campaigns on the resource sequenced from the non-zero counter the reset cleared; they must be sequenced again before they start (SCHED-0123).
          items: { type: string, format: uuid }
    CapacityOverrideData:
      type: object
      required: [overrideId, resourceId, kind, start, end, reason, affectedJobs]
      properties:
        overrideId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        kind: { type: string, enum: [downtime, extra] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        reason: { type: string }
        affectedJobs:
          type: array
          description: Booked jobs a downtime overlaps when it is created (empty for extra shifts and on delete).
          items: { type: string, format: uuid }
    CampaignStartedData:
      type: object
      required: [campaignId, resourceId, startedAt, version]
      properties:
        campaignId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        version: { type: integer }
    CampaignCompletedData:
      type: object
      required: [campaignId, resourceId, completedAt, version]
      properties:
        campaignId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        completedAt: { type: string, format: date-time }
        version: { type: integer }
    CampaignCancelledData:
      type: object
      required: [campaignId, resourceId, cancelledAt, reason, orderIds, counterRestored, version]
      properties:
        campaignId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        cancelledAt: { type: string, format: date-time }
        reason: { type: string, description: Empty when none was given }
        orderIds:
          type: array
          description: Orders released from the campaign
          items: { type: string, format: uuid }
        counterRestored: { type: boolean, description: A started campaign gave back the resource's cleanout counter }
        version: { type: integer }
    OperationUpdatedData:
      type: object
      required: [operationId, orderId, operNumber, minutes, dueAt, readyAt, priority, resourceIds, version, jobsRemoved, queueBeforeMinutes, queueAfterMinutes, quantity, overlapQuantity]
      properties:
        operationId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        minutes: { type: integer }
        dueAt: { type: [string, 'null'], format: date-time }
        readyAt: { type: [string, 'null'], format: date-time }
        priority: { type: integer }
        resourceIds:
          type: array
          description: Candidate resources in priority order.
          items: { type: string, format: uuid }
        version: { type: integer }
        jobsRemoved: { type: boolean }
        queueBeforeMinutes: { type: integer, minimum: 0, maximum: 10080, description: Elapsed wait in front of the operation in minutes (FR-23.3); no resource is booked. }
        queueAfterMinutes: { type: integer, minimum: 0, maximum: 10080, description: Elapsed wait behind the operation in minutes (FR-23.3); no resource is booked. }
        quantity: { type: [string, 'null'], description: Order quantity the operation works on as a decimal string; null when not set. }
        overlapQuantity: { type: [string, 'null'], description: Part of the quantity that must be through before the next operation may start (BR-23.5); null when there is no overlap. }
    OperationDeletedData:
      type: object
      required: [operationId, orderId, operNumber, jobsRemoved]
      properties:
        operationId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        jobsRemoved: { type: boolean }
    OrderUnscheduledData:
      type: object
      required: [orderId, operations, keptFirmed]
      properties:
        orderId: { type: string, format: uuid }
        operations:
          type: array
          description: Operation numbers that are open again.
          items: { type: integer }
        keptFirmed:
          type: array
          description: Operation numbers a firmed job holds; they stay where they are.
          items: { type: integer }
    BottleneckDetectedData:
      type: object
      required: [episodeId, resourceId, resourceCode, firstWeek, flaggedWeeks, periods, peakLoadPct, thresholdPct, consecutiveWeeks]
      properties:
        episodeId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        resourceCode: { type: string, description: Code of the resource, for the SCHED-0015 message. }
        firstWeek: { type: string, format: date, description: Monday (UTC) of the first flagged week. }
        flaggedWeeks: { type: integer, description: Flagged weeks when the episode opened. }
        periods:
          type: array
          description: The flagged weeks from the current week on, in order.
          items:
            type: object
            required: [weekStart, loadPct]
            properties:
              weekStart: { type: string, format: date, description: Monday (UTC) of the week. }
              loadPct: { type: number, description: Booked over open minutes of the week, in percent. }
        peakLoadPct: { type: number, description: Load of the most loaded flagged week, in percent. }
        thresholdPct: { type: integer, description: The load percentage a week must exceed. }
        consecutiveWeeks: { type: integer, description: Consecutive weeks above the threshold that make a bottleneck. }
    ParametersUpdatedData:
      type: object
      required: [defaultMode, defaultDirection, defaultFinite, dragSnapMinutes, propagationOrders, propagationLevels, version]
      properties:
        defaultMode: { type: string, enum: [jobs, operations] }
        defaultDirection: { type: string, enum: [forward, backward] }
        defaultFinite: { type: boolean }
        dragSnapMinutes: { type: integer }
        propagationOrders: { type: integer }
        propagationLevels: { type: integer }
        version: { type: integer }
    CampaignPlacedData:
      type: object
      required: [campaignId, resourceId, runId, start, end, jobs, cleanouts, version]
      properties:
        campaignId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        runId: { type: string, format: uuid, description: The schedule run (scope campaign) that wrote the jobs. }
        start: { type: string, format: date-time, description: Start of the first job, its leading setup included. }
        end: { type: string, format: date-time, description: End of the last job or cleanout window. }
        jobs:
          type: array
          description: One entry per campaign order, in sequence.
          items:
            type: object
            required: [orderId, jobId, start, end, changeoverMinutes]
            properties:
              orderId: { type: string, format: uuid }
              jobId: { type: string, format: uuid, description: The scheduling operation that was placed. }
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
              changeoverMinutes: { type: integer, minimum: 0, description: 'Changeover at the start of the job, inside [start, end).' }
        cleanouts:
          type: array
          description: Closed windows the plan's cleanouts hold on the resource, never split (BR-23.13).
          items:
            type: object
            required: [afterOrderId, setupGroup, minutes, reason, start, end]
            properties:
              afterOrderId: { type: string, format: uuid }
              setupGroup: { type: string }
              minutes: { type: integer, minimum: 1 }
              reason: { type: string }
              cleaningSetId: { type: string, description: Cleaning standard operation set of the rule. Omitted when none. }
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
        version: { type: integer }
    CampaignUnplacedData:
      type: object
      required: [campaignId, resourceId, orderIds, version]
      properties:
        campaignId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        orderIds:
          type: array
          description: Orders whose jobs were removed.
          items: { type: string, format: uuid }
        version: { type: integer }
