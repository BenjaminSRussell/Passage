asyncapi: 3.0.0
info:
  title: Passage Projects events
  version: 0.2.0
  description: |
    CloudEvents 1.0 published through the outbox in the same transaction as the
    state change (Debezium outbox router relays to Kafka). Consumers: analytics,
    budget control (wave 38), resource planning. Slice 1 publishes project master
    events; slice 2 adds the CPM scheduler run (wbs.scheduled).
defaultContentType: application/cloudevents+json
channels:
  projectCreated:
    address: passage.projects.project
    messages:
      projectCreated:
        $ref: '#/components/messages/ProjectCreated'
  projectUpdated:
    address: passage.projects.project
    messages:
      projectUpdated:
        $ref: '#/components/messages/ProjectUpdated'
  wbsScheduled:
    address: passage.projects.wbs
    messages:
      wbsScheduled:
        $ref: '#/components/messages/WbsScheduled'
operations:
  publishProjectCreated:
    action: send
    channel:
      $ref: '#/channels/projectCreated'
  publishProjectUpdated:
    action: send
    channel:
      $ref: '#/channels/projectUpdated'
  publishWbsScheduled:
    action: send
    channel:
      $ref: '#/channels/wbsScheduled'
components:
  messages:
    ProjectCreated:
      name: dev.passage.projects.project.created.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/ProjectCreatedEvent'
    ProjectUpdated:
      name: dev.passage.projects.project.updated.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/ProjectUpdatedEvent'
    WbsScheduled:
      name: dev.passage.projects.wbs.scheduled.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/WbsScheduledEvent'
  schemas:
    WbsScheduledEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              description: Written by each scheduler run over a non-empty plan version (PRD §8.41.5).
              required: [projectId, planVersionId, criticalPath, finishDate]
              properties:
                projectId:
                  type: string
                planVersionId:
                  type: string
                  format: uuid
                criticalPath:
                  type: array
                  description: Critical WBS task ids in dependency order.
                  items:
                    type: string
                    format: uuid
                finishDate:
                  type: string
                  format: date
                  description: Project finish (latest early finish of the plan's tasks).
    CloudEventEnvelope:
      type: object
      description: The platform envelope (platform/go/events.Event), structured mode.
      required: [specversion, id, source, type, subject, time, datacontenttype, data, tenantid]
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          description: Event id (UUID v7), unique per event; consumers de-duplicate on it.
        source:
          type: string
          const: projects
        type:
          type: string
        subject:
          type: string
          description: The aggregate id; the project id for project events, the plan version id for wbs events.
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        tenantid:
          type: string
          format: uuid
        actor:
          type: string
          description: User id of the caller that made the change.
        correlationid:
          type: string
        causationid:
          type: string
    ProjectCreatedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [id, legalEntityId, projectType, stage, currency, version]
              properties:
                id:
                  type: string
                legalEntityId:
                  type: string
                  format: uuid
                parentProjectId:
                  type: string
                  description: Set for a sub-project.
                projectType:
                  type: string
                  enum: [TIME_MATERIAL, FIXED_PRICE, INTERNAL, COST, INVESTMENT, TIME]
                stage:
                  type: string
                  enum: [CREATED]
                currency:
                  type: string
                version:
                  type: integer
    ProjectUpdatedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [id, changedFields, stage, version]
              properties:
                id:
                  type: string
                changedFields:
                  type: array
                  items:
                    type: string
                stage:
                  type: string
                  enum: [CREATED, IN_PROCESS, ON_HOLD, FINISHED]
                version:
                  type: integer
