  /v1/projects/gl-postings:
    post:
      operationId: postProjectsToGL
      summary: Book project costs and estimates in the general ledger (D2b, D4c)
      description: |
        Books the cost of every due, unposted project transaction of the legal entity and currency as one balanced entry (Dr WIP account, Cr the offset
        account of the resolved posting profile: payroll allocation, expense clearing or inventory), keyed `projects:txn:{transactionId}:1`. With `period`
        (YYYY-MM) it also books, for each fixed-price project that is not CREATED, the movement of its cost-to-cost position at the month end: revenue
        earned (Dr accrued revenue, Cr invoiced revenue), the amount billed on approved invoice proposals (Dr on-account, Cr accrued revenue), the cost
        incurred to date moved out of WIP (Dr cost of sales, Cr WIP) and the loss provision, which is the expected contract loss less the loss the margin
        already shows (Dr loss expense, Cr loss provision; released when the estimate improves), keyed `projects:wip:{projectId}:{period}`. The estimate to
        complete is the cost after the period of the project's active forecast model. Amounts and accounts come from stored data and posting profiles,
        never from the request. A booking is stored before the ledger is called and resent unchanged until the ledger confirms it. A transaction that
        fails backs off (1, 2, 4 minutes and so on up to 6 hours) and is parked after 5 failed runs (shown by the reconciliation with its reason);
        `retryParked` puts the entity's parked transactions back. A failure is listed under failed with the ledger's problem code or PROJ-POST-001,
        PROJ-POST-002 (profile account missing), PROJ-GL-001, PROJ-GL-002 (no active forecast model), PROJ-GL-003 (earlier period unconfirmed or later
        period booked) or PROJ-GL-007 (forecast model currency differs). The legal entity is pinned to the ledger of its first posting: another ledger is
        409 PROJ-GL-005, and a ledger the entity does not own is 422 PROJ-GL-006. At most 200 transactions and 200 projects per run (`more`). Signs only
        ledger.entry.post.
      x-passage-duty: ProjGlPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ledgerId, currency]
              properties:
                legalEntityId:
                  type: string
                  format: uuid
                ledgerId:
                  type: string
                  format: uuid
                currency:
                  type: string
                  pattern: '^[A-Z]{3}$'
                period:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
                projectId:
                  type: string
                  maxLength: 20
                retryParked:
                  type: boolean
      responses:
        '200':
          description: What was booked and what failed
          content:
            application/json:
              schema:
                type: object
                required: [booked, failed, more]
                properties:
                  booked:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                          enum: [TXN, WIP]
                        ref:
                          type: string
                        entryId:
                          type: string
                          format: uuid
                        lines:
                          type: integer
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                          enum: [TXN, WIP]
                        ref:
                          type: string
                        code:
                          type: string
                  more:
                    type: boolean
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/projects/gl-reconciliation:
    get:
      operationId: getProjectsGLReconciliation
      summary: Reconcile the project GL subledger to the ledger's accounts (AC4)
      description: |
        Per account the service booked on (up to periodTo, YYYY-MM) the net of its posted bookings. The control accounts (WIP, accrued revenue, invoiced
        revenue, loss provision), which only project postings feed, are compared with the general ledger's balance (`compared`, `gl`, difference = GL
        minus subledger); the other accounts are shared with other modules and show only the subledger. unpostedTransactions counts (and lists the first
        100 of, with the reason of the last failure, the attempts and whether parked) the entity's transactions whose cost no ledger entry holds.
        pendingEstimates are estimate bookings the ledger has not confirmed; unbookedEstimates (with periodTo) are fixed-price projects with cost whose
        estimate for that period or a later one is not booked. reconciled is true when every compared difference is zero and all three are empty. The
        ledger must be the one the entity is pinned to (409 PROJ-GL-005); a ledger balance in another currency is 422 PROJ-GL-008.
      x-passage-duty: ProjInquire
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: ledgerId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: currency, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: periodTo, in: query, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: The reconciliation
          content:
            application/json:
              schema:
                type: object
                required: [currency, reconciled, unpostedTransactions, accounts]
                properties:
                  currency:
                    type: string
                  reconciled:
                    type: boolean
                  pendingEstimates:
                    type: integer
                  unbookedEstimates:
                    type: integer
                  unpostedTransactions:
                    type: object
                    properties:
                      count:
                        type: integer
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            reason:
                              type: string
                            attempts:
                              type: integer
                            parked:
                              type: boolean
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        account:
                          type: string
                        compared:
                          type: boolean
                        subledger:
                          type: string
                        gl:
                          type: string
                        difference:
                          type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    ProposalId:
      name: proposalId
      in: path
      required: true
      description: Invoice proposal id (UUID).
      schema:
        type: string
        format: uuid
    TransactionId:
      name: txnId
      in: path
      required: true
      description: Project transaction id (UUID).
      schema:
        type: string
        format: uuid
    ChangeOrderId:
      name: coId
      in: path
      required: true
      description: Change order id (UUID).
      schema:
        type: string
        format: uuid
    ForecastModelId:
      name: modelId
      in: path
      required: true
      description: Forecast model id (UUID).
      schema:
        type: string
        format: uuid
    PlanVersionId:
      name: ver
      in: path
      required: true
      description: Plan version id (UUID).
      schema:
        type: string
        format: uuid
    OptionalIfMatch:
      name: If-Match
      in: header
      required: false
      description: Optional version precondition, for example `"3"`. Absent means no precondition.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version (of the project or plan version) as an ETag, for example `"3"`.
      schema:
        type: string
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        maxLength: 20
  headers:
    ETag:
      description: Row version (project, group, posting profile, plan version, change order, risk, forecast model, category or invoice proposal), quoted.
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Stage:
      type: string
      enum: [CREATED, IN_PROCESS, ON_HOLD, FINISHED]
    ProjectType:
      type: string
      enum: [TIME_MATERIAL, FIXED_PRICE, INTERNAL, COST, INVESTMENT, TIME]
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [id, legalEntityId, projectType, currency, startDate]
      description: |
        A sub-project (parentProjectId set) inherits projectGroupId, customerPartyId and
        contractId from its parent when they are omitted (FR-41.1). It must be in the
        parent's legal entity and cannot name a different customer (422 PROJ-PARENT-002).
        A parent the caller cannot see, or that does not exist, is 422 PROJ-PARENT-001.
      properties:
        id:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9-]{0,19}$'
          description: Project id. Will come from number sequence PROJ once the kernel sequence package lands.
        legalEntityId:
          type: string
          format: uuid
        parentProjectId:
          type: string
          maxLength: 20
        projectGroupId:
          type: string
          minLength: 1
          maxLength: 10
          description: Required unless parentProjectId is set (then inherited when omitted).
        projectType:
          $ref: '#/components/schemas/ProjectType'
        customerPartyId:
          type: string
          format: uuid
          description: Required for external types (TIME_MATERIAL, FIXED_PRICE) unless inherited from the parent.
        contractId:
          type: string
          format: uuid
          description: Inherited from the parent when omitted on a sub-project.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        contractValue:
          type: string
          pattern: '^\d{1,14}(\.\d{1,6})?$'
          description: Contract value in the project currency (default 0), rounded half-even to its minor unit. Applied change orders adjust it (BR-41.13).
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Must be on or after startDate.
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to:
          $ref: '#/components/schemas/Stage'
    Project:
      type: object
      required: [id, legalEntityId, projectGroupId, projectType, currency, contractValue, stage, startDate, version]
      properties:
        id:
          type: string
        legalEntityId:
          type: string
          format: uuid
        parentProjectId:
          type: string
        projectGroupId:
          type: string
        projectType:
          $ref: '#/components/schemas/ProjectType'
        customerPartyId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        currency:
          type: string
        contractValue:
          type: string
          description: Decimal string in the currency's minor unit, for example "550000.00".
        stage:
          $ref: '#/components/schemas/Stage'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectGroup:
      type: object
      required: [id, name, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9-]{0,9}$'
        name:
          type: string
          maxLength: 120
        defaultProjectType:
          $ref: '#/components/schemas/ProjectType'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          description: Optional; when present it must equal the path id.
        name:
          type: string
          minLength: 1
          maxLength: 120
        defaultProjectType:
          $ref: '#/components/schemas/ProjectType'
    PostingProfile:
      type: object
      description: Accounts a project posting uses for one key (FR-41.5).
      required: [projectGroup, category, lineProperty, costAccount, wipAccount, accruedRevenueAccount, invoicedRevenueAccount, onAccountAccount, version]
      properties:
        projectGroup:
          type: string
          description: Project group id, or "*" for the catch-all row.
        category:
          type: string
          description: Category id, or "*" for a group fallback or the catch-all.
        lineProperty:
          type: string
          enum: [CHARGEABLE, NON_CHARGEABLE, '*']
        costAccount:
          type: string
          maxLength: 40
        wipAccount:
          type: string
          maxLength: 40
        accruedRevenueAccount:
          type: string
          maxLength: 40
        invoicedRevenueAccount:
          type: string
          maxLength: 40
        onAccountAccount:
          type: string
          maxLength: 40
        offsetAccount:
          type: string
          maxLength: 40
          description: Credit of a transaction posting (payroll allocation, expense clearing or inventory, by category). Needed by POST /gl-postings.
        costOfSalesAccount:
          type: string
          maxLength: 40
        lossProvisionAccount:
          type: string
          maxLength: 40
          description: Liability carrying the part of an expected contract loss not yet shown in the margin.
        lossExpenseAccount:
          type: string
          maxLength: 40
        version:
          type: integer
          minimum: 1
    PostingProfileRequest:
      type: object
      additionalProperties: false
      description: >-
        Category and line property are both "*" or both concrete; a "*" project group needs "*" for both.
      required: [projectGroup, category, lineProperty, costAccount, wipAccount, accruedRevenueAccount, invoicedRevenueAccount, onAccountAccount]
      properties:
        projectGroup:
          type: string
          pattern: '^(\*|[A-Z0-9][A-Z0-9-]{0,9})$'
        category:
          type: string
          minLength: 1
          maxLength: 20
        lineProperty:
          type: string
          enum: [CHARGEABLE, NON_CHARGEABLE, '*']
        costAccount:
          type: string
          minLength: 1
          maxLength: 40
        wipAccount:
          type: string
          minLength: 1
          maxLength: 40
        accruedRevenueAccount:
          type: string
          minLength: 1
          maxLength: 40
        invoicedRevenueAccount:
          type: string
          minLength: 1
          maxLength: 40
        onAccountAccount:
          type: string
          minLength: 1
          maxLength: 40
        offsetAccount:
          type: string
          maxLength: 40
        costOfSalesAccount:
          type: string
          maxLength: 40
        lossProvisionAccount:
          type: string
          maxLength: 40
        lossExpenseAccount:
          type: string
          maxLength: 40
    ResolveRequest:
      type: object
      additionalProperties: false
      required: [projectGroup, category, lineProperty]
      properties:
        projectGroup:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9-]{0,9}$'
        category:
          type: string
          minLength: 1
          maxLength: 20
          description: Concrete category id (no wildcard).
        lineProperty:
          type: string
          enum: [CHARGEABLE, NON_CHARGEABLE]
    PlanKind:
      type: string
      enum: [BASELINE, WORKING, SIMULATION]
    PlanVersion:
      type: object
      required: [id, projectId, kind, sequence, locked, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
        kind:
          $ref: '#/components/schemas/PlanKind'
        sequence:
          type: integer
          minimum: 1
        copiedFromVersionId:
          type: string
          format: uuid
        supersededByVersionId:
          type: string
          format: uuid
          description: Set on a BASELINE replaced by the BASELINE an applied change order created (BR-41.13). One BASELINE per project has none.
        transferredAt:
          type: string
          format: date-time
          description: Set on a SIMULATION transferred into WORKING (BR-41.14).
        locked:
          type: boolean
          description: True for a BASELINE and a transferred SIMULATION; a locked plan's WBS cannot be replaced, rescheduled or transferred.
        version:
          type: integer
          minimum: 1
          description: Optimistic concurrency token of the WBS; the ETag of this plan version.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PlanVersionRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/PlanKind'
        copyFromVersionId:
          type: string
          format: uuid
          description: >-
            Plan version of the same project whose WBS is copied. Required for BASELINE (from WORKING) and
            SIMULATION (from WORKING or BASELINE; at most 20 per project, PROJ-PLAN-001). A SIMULATION
            records its source's nodes as the common ancestor of a later transfer.
    WbsNodeRequest:
      type: object
      additionalProperties: false
      required: [wbsCode, name]
      properties:
        wbsCode:
          type: string
          pattern: '^[0-9]{1,4}(\.[0-9]{1,4}){0,7}$'
        parentWbsCode:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 120
        effortHours:
          type: string
          pattern: '^[0-9]{1,10}(\.[0-9]{1,2})?$'
          description: Decimal string, at most two places, >= 0.
        durationDays:
          type: integer
          minimum: 0
          maximum: 100000
          description: Working days; 0 is a milestone. Ignored on a summary node (one with children).
        constraintType:
          type: string
          enum: [ASAP, SNET]
          default: ASAP
          description: FNLT and MSO are not scheduled yet and are refused.
        constraintDate:
          type: string
          format: date
          description: Required for SNET, absent for ASAP.
        roleId:
          type: string
          format: uuid
        isBillableMilestone:
          type: boolean
    WbsDependencyRequest:
      type: object
      additionalProperties: false
      description: Links two tasks (nodes without children); each pair at most once.
      required: [predecessorWbsCode, successorWbsCode, type]
      properties:
        predecessorWbsCode:
          type: string
        successorWbsCode:
          type: string
        type:
          type: string
          enum: [FS, SS, FF, SF]
        lagDays:
          type: integer
          minimum: -3650
          maximum: 3650
          description: Calendar days.
    WbsRequest:
      type: object
      additionalProperties: false
      required: [nodes]
      properties:
        nodes:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/WbsNodeRequest'
        dependencies:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/WbsDependencyRequest'
    WbsNode:
      type: object
      required: [id, planVersionId, wbsCode, name, durationDays, constraintType, isBillableMilestone]
      properties:
        id:
          type: string
          format: uuid
        planVersionId:
          type: string
          format: uuid
        wbsCode:
          type: string
        parentId:
          type: string
          format: uuid
        name:
          type: string
        effortHours:
          type: string
        durationDays:
          type: integer
        constraintType:
          type: string
          enum: [ASAP, SNET]
        constraintDate:
          type: string
          format: date
        roleId:
          type: string
          format: uuid
        isBillableMilestone:
          type: boolean
        earlyStart:
          type: string
          format: date
          description: Scheduler output; absent until the plan is scheduled (and after a WBS replace).
        earlyFinish:
          type: string
          format: date
        lateStart:
          type: string
          format: date
        lateFinish:
          type: string
          format: date
        slackDays:
          type: integer
          description: Total float in working days.
        critical:
          type: boolean
    WbsDependency:
      type: object
      required: [predecessorId, successorId, type, lagDays]
      properties:
        predecessorId:
          type: string
          format: uuid
        successorId:
          type: string
          format: uuid
        type:
          type: string
          enum: [FS, SS, FF, SF]
        lagDays:
          type: integer
    WbsView:
      type: object
      required: [planVersion, nodes, dependencies]
      properties:
        planVersion:
          $ref: '#/components/schemas/PlanVersion'
        nodes:
          type: array
          description: In WBS-code order (1, 1.2, 1.10).
          items:
            $ref: '#/components/schemas/WbsNode'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/WbsDependency'
    ScheduleView:
      allOf:
        - $ref: '#/components/schemas/WbsView'
        - type: object
          required: [criticalPath]
          properties:
            finishDate:
              type: string
              format: date
              description: Project finish; absent for an empty plan.
            criticalPath:
              type: array
              description: Critical task ids in dependency order.
              items:
                type: string
                format: uuid
    ChangeOrderType:
      type: string
      enum: [SCOPE_CHANGE, CLAIM_CUSTOMER, CLAIM_VENDOR, INTERNAL]
    ChangeOrderStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, APPLIED]
    ChangeOrderLineRequest:
      type: object
      additionalProperties: false
      required: [costImpact, revenueImpact]
      properties:
        wbsNodeId:
          type: string
          format: uuid
          description: A node of one of the project's plan versions; required when the line changes effort or schedule.
        costImpact:
          type: string
          pattern: '^-?\d{1,14}(\.\d{1,6})?$'
        revenueImpact:
          type: string
          pattern: '^-?\d{1,14}(\.\d{1,6})?$'
        effortHoursDelta:
          type: string
          pattern: '^-?\d{1,10}(\.\d{1,2})?$'
          default: '0'
        scheduleDaysDelta:
          type: integer
          default: 0
          description: Working days added to (or removed from) the node's duration.
    ChangeOrderRequest:
      type: object
      additionalProperties: false
      required: [projectId, type, title, lines]
      properties:
        projectId:
          type: string
          maxLength: 20
        type:
          $ref: '#/components/schemas/ChangeOrderType'
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        customerApprovalRef:
          type: string
          minLength: 1
          maxLength: 200
        vendorPartyId:
          type: string
          format: uuid
          description: Required for, and only allowed on, a CLAIM_VENDOR.
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/ChangeOrderLineRequest'
    ChangeOrderDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        customerApprovalRef:
          type: string
          minLength: 1
          maxLength: 200
          description: Customer approval evidence, required to approve a CLAIM_CUSTOMER (PROJ-CO-002).
    ChangeOrderLine:
      type: object
      required: [lineNo, costImpact, revenueImpact, effortHoursDelta, scheduleDaysDelta]
      properties:
        lineNo:
          type: integer
          minimum: 1
        wbsNodeId:
          type: string
          format: uuid
        wbsCode:
          type: string
          description: The WBS code of wbsNodeId when the change order was created; apply finds the node in the current baseline by it.
        costImpact:
          type: string
        revenueImpact:
          type: string
        effortHoursDelta:
          type: string
        scheduleDaysDelta:
          type: integer
    ChangeOrder:
      type: object
      required: [id, number, projectId, type, title, description, status, createdBy, costImpact, revenueImpact, lines, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          example: CO-0001
        projectId:
          type: string
        type:
          $ref: '#/components/schemas/ChangeOrderType'
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ChangeOrderStatus'
        customerApprovalRef:
          type: string
        vendorPartyId:
          type: string
          format: uuid
        createdBy:
          type: string
        decidedBy:
          type: string
          description: Who approved or rejected.
        appliedBy:
          type: string
        appliedBaselineVersionId:
          type: string
          format: uuid
        appliedAt:
          type: string
          format: date-time
        costImpact:
          type: string
          description: Σ cost impact in the project currency.
        revenueImpact:
          type: string
          description: Σ revenue impact in the project currency.
        lines:
          type: array
          description: Empty in list responses.
          items:
            $ref: '#/components/schemas/ChangeOrderLine'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplyChangeOrderResponse:
      type: object
      required: [changeOrder, effect, baseline]
      properties:
        changeOrder:
          $ref: '#/components/schemas/ChangeOrder'
        effect:
          type: object
          required: [contractValueDelta, budgetDelta, contractValue, effortHoursDelta, scheduleDaysDelta]
          properties:
            contractValueDelta:
              type: string
            budgetDelta:
              type: string
            contractValue:
              type: string
            effortHoursDelta:
              type: string
            scheduleDaysDelta:
              type: integer
        baseline:
          $ref: '#/components/schemas/PlanVersion'
    RiskKind:
      type: string
      enum: [RISK, ISSUE]
    RiskStatus:
      type: string
      enum: [OPEN, MITIGATED, CLOSED]
    RiskRequest:
      type: object
      additionalProperties: false
      required: [kind, title, probability, impact]
      properties:
        kind:
          $ref: '#/components/schemas/RiskKind'
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        probability:
          type: integer
          minimum: 1
          maximum: 5
        impact:
          type: integer
          minimum: 1
          maximum: 5
        ownerWorkerId:
          type: string
          format: uuid
          description: Worker id (wave 42); not checked against a worker table yet.
        mitigation:
          type: string
          maxLength: 2000
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/RiskStatus'
          description: Required on PUT; must be omitted on POST (entries start OPEN).
    RiskIssue:
      type: object
      required: [id, projectId, kind, title, description, probability, impact, score, mitigation, status, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
        kind:
          $ref: '#/components/schemas/RiskKind'
        title:
          type: string
        description:
          type: string
        probability:
          type: integer
        impact:
          type: integer
        score:
          type: integer
          description: probability × impact (1 to 25).
        ownerWorkerId:
          type: string
          format: uuid
        mitigation:
          type: string
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/RiskStatus'
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TxnType:
      type: string
      enum: [HOUR, COST, ITEM, FEE, ON_ACCOUNT]
    LineProperty:
      type: string
      enum: [CHARGEABLE, NON_CHARGEABLE]
    CategoryRequest:
      type: object
      additionalProperties: false
      required: [name, txnType]
      properties:
        id:
          type: string
          description: Optional; must equal the path id.
        name:
          type: string
          minLength: 1
          maxLength: 120
        txnType:
          $ref: '#/components/schemas/TxnType'
    Category:
      type: object
      required: [id, name, txnType, version, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        txnType:
          $ref: '#/components/schemas/TxnType'
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TransactionRequest:
      type: object
      additionalProperties: false
      required: [projectId, txnType, categoryId, lineProperty, txnDate, quantity, costPrice, salesPrice, currency]
      description: workerId is required for HOUR and itemId for ITEM. salesPrice may be negative only on ON_ACCOUNT (retainer applied, BR-41.4).
      properties:
        projectId:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9-]{0,19}$'
        wbsNodeId:
          type: string
          format: uuid
          description: A node of one of the project's plan versions; its WBS code is stored with the transaction.
        txnType:
          $ref: '#/components/schemas/TxnType'
        categoryId:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,19}$'
        lineProperty:
          $ref: '#/components/schemas/LineProperty'
        txnDate:
          type: string
          format: date
        quantity:
          type: string
          description: Decimal, at least 0, at most 3 places.
          example: '7.5'
        costPrice:
          type: string
          description: Unit cost price, decimal, at least 0, at most 6 places.
        salesPrice:
          type: string
          description: Unit sales price, decimal, at most 6 places.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Must equal the project currency.
        workerId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        vendorPartyId:
          type: string
          format: uuid
        sourceDocType:
          type: string
          enum: [TIMESHEET, EXPENSE, PO_RECEIPT, INV_JOURNAL, MANUAL]
          default: MANUAL
        sourceDocId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 500
    Transaction:
      type: object
      required: [id, projectId, txnType, categoryId, lineProperty, txnDate, quantity, costPrice, salesPrice, currency, costAmount, salesAmount, sourceDocType, description, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
        wbsNodeId:
          type: string
          format: uuid
        wbsCode:
          type: string
        txnType:
          $ref: '#/components/schemas/TxnType'
        categoryId:
          type: string
        lineProperty:
          $ref: '#/components/schemas/LineProperty'
        txnDate:
          type: string
          format: date
        quantity:
          type: string
          example: '7.500'
        costPrice:
          type: string
          example: '50.000000'
        salesPrice:
          type: string
        currency:
          type: string
        costAmount:
          type: string
          description: quantity × costPrice, rounded half-even to the minor unit.
          example: '375.00'
        salesAmount:
          type: string
          description: quantity × salesPrice, rounded half-even to the minor unit.
        workerId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        vendorPartyId:
          type: string
          format: uuid
        sourceDocType:
          type: string
        sourceDocId:
          type: string
          format: uuid
        description:
          type: string
        journalId:
          type: string
          format: uuid
          description: Empty until the wave-11 posting API posts the line.
        proposalId:
          type: string
          format: uuid
          description: The DRAFT, APPROVED or POSTED proposal the transaction is on.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    BillingStatus:
      type: object
      required: [transactionId, billable]
      properties:
        transactionId:
          type: string
          format: uuid
        billable:
          type: boolean
        reason:
          type: string
          enum: [NOT_CHARGEABLE, ALREADY_PROPOSED, OUT_OF_RANGE, PROJECT_STAGE, TXN_TYPE, PROJECT_NOT_IN_SCOPE, MILESTONE_NOT_DUE, PROJECT_TYPE]
    ProposalStatus:
      type: string
      enum: [DRAFT, APPROVED, POSTED, CANCELED]
    ProposalRequest:
      type: object
      additionalProperties: false
      required: [projectId, from, to]
      properties:
        projectId:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9-]{0,19}$'
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        txnTypes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TxnType'
    ProposalLine:
      type: object
      required: [lineNo, transactionId, txnType, txnDate, categoryId, description, quantity, unitPrice, costAmount, amount]
      properties:
        lineNo:
          type: integer
        transactionId:
          type: string
          format: uuid
        txnType:
          $ref: '#/components/schemas/TxnType'
        txnDate:
          type: string
          format: date
        categoryId:
          type: string
        description:
          type: string
        quantity:
          type: string
        unitPrice:
          type: string
        costAmount:
          type: string
        amount:
          type: string
    InvoiceProposal:
      type: object
      required: [id, projectId, status, currency, fromDate, toDate, txnTypes, totalCost, totalSales, lineCount, lines, createdBy, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
        customerPartyId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ProposalStatus'
        currency:
          type: string
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        txnTypes:
          type: array
          items:
            $ref: '#/components/schemas/TxnType'
        totalCost:
          type: string
          example: '500.00'
        totalSales:
          type: string
          description: Sum of the rounded line amounts.
          example: '900.05'
        lineCount:
          type: integer
        lines:
          type: array
          description: Empty in list responses.
          items:
            $ref: '#/components/schemas/ProposalLine'
        createdBy:
          type: string
        approvedBy:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NodeChange:
      type: object
      required: [wbsCode, change]
      properties:
        wbsCode:
          type: string
        change:
          type: string
          enum: [ADDED, CHANGED, REMOVED]
          description: What the simulation's side does to WORKING.
        working:
          $ref: '#/components/schemas/WbsNodeRequest'
        simulation:
          $ref: '#/components/schemas/WbsNodeRequest'
        resolution:
          type: string
          enum: [KEEP_WORKING, TAKE_SIMULATION]
          description: Set on a conflict the request resolved.
    TransferRequest:
      type: object
      additionalProperties: false
      properties:
        resolutions:
          type: object
          description: WBS code of each conflict → KEEP_WORKING or TAKE_SIMULATION. Codes that are not conflicts are ignored.
          additionalProperties:
            type: string
            enum: [KEEP_WORKING, TAKE_SIMULATION]
        workingVersion:
          type: integer
          minimum: 1
          description: The WORKING plan version the diff was read at; 412 when WORKING changed since.
    TransferView:
      type: object
      required: [simulation, working, applied, conflicts]
      properties:
        simulation:
          $ref: '#/components/schemas/PlanVersion'
        working:
          $ref: '#/components/schemas/PlanVersion'
        applied:
          type: array
          description: Nodes changed only in the simulation, and conflicts resolved TAKE_SIMULATION.
          items:
            $ref: '#/components/schemas/NodeChange'
        conflicts:
          type: array
          description: Nodes changed differently in both since the copy (PROJ-SIM-001 until resolved).
          items:
            $ref: '#/components/schemas/NodeChange'
    ForecastLine:
      type: object
      additionalProperties: false
      required: [period, txnType, quantity, costAmount, salesAmount]
      properties:
        lineNo:
          type: integer
          minimum: 1
          description: Assigned in request order; ignored on input.
        period:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          description: Calendar month YYYY-MM (fiscal periods are wave 14).
        wbsCode:
          type: string
          description: A node of the project's WORKING plan, by WBS code.
        txnType:
          $ref: '#/components/schemas/TxnType'
        quantity:
          type: string
          description: Non-negative decimal, at most 3 fraction digits.
        costAmount:
          type: string
          description: Non-negative decimal in the project currency, rounded half-even to its minor unit.
        salesAmount:
          type: string
          description: Decimal in the project currency; negative only on ON_ACCOUNT.
    ForecastRequest:
      type: object
      additionalProperties: false
      required: [name, lines]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        lines:
          type: array
          maxItems: 2000
          description: Unique per (period, txnType, wbsCode).
          items:
            $ref: '#/components/schemas/ForecastLine'
    ForecastModel:
      type: object
      required: [id, projectId, name, currency, active, version, lineCount, totalCost, totalSales, createdBy, createdAt, updatedAt]
      properties:
        active:
          type: boolean
          description: The one model per project whose lines after a period are the estimate to complete for GL revenue recognition.
        id:
          type: string
          format: uuid
        projectId:
          type: string
        name:
          type: string
        currency:
          type: string
        version:
          type: integer
          minimum: 1
        lineCount:
          type: integer
        totalCost:
          type: string
        totalSales:
          type: string
        lines:
          type: array
          description: Present on create, replace and read of one model.
          items:
            $ref: '#/components/schemas/ForecastLine'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ForecastRow:
      type: object
      required: [period, txnType, forecastQuantity, forecastCost, forecastSales, actualQuantity, actualCost, actualSales, quantityVariance, costVariance, salesVariance]
      properties:
        period:
          type: string
        txnType:
          $ref: '#/components/schemas/TxnType'
        forecastQuantity:
          type: string
        forecastCost:
          type: string
        forecastSales:
          type: string
        actualQuantity:
          type: string
        actualCost:
          type: string
        actualSales:
          type: string
        quantityVariance:
          type: string
        costVariance:
          type: string
          description: Actual minus forecast; positive is overspend.
        salesVariance:
          type: string
    ForecastView:
      type: object
      required: [model, comparison]
      properties:
        model:
          $ref: '#/components/schemas/ForecastModel'
        comparison:
          type: array
          description: One row per (period, txnType) on either side, by period then type.
          items:
            $ref: '#/components/schemas/ForecastRow'
    Problem:
      type: object
      description: RFC 9457 with Passage extensions (code, traceId, errors).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: https://passage.dev/problems/PROJ-STAGE-001
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
