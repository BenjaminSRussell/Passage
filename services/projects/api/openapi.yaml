openapi: 3.1.0
info:
  title: Passage Projects API
  version: 0.3.0
  description: |
    Wave 41 (PSG-41). Slice 1: project master and hierarchy (FR-41.1) with stage
    transitions. Slice 2: project groups (FR-41.1), posting profiles and fallback
    resolution (FR-41.5), plan versions, WBS replace/read and the CPM scheduler (FR-41.2).
    Slice 3: contract value, change orders and claims with apply (FR-41.18, BR-41.13)
    and the risk and issue register (FR-41.20).
    Journals, billing, estimates, timesheets and the rest of wave 41 are later
    slices (see NOT-IMPLEMENTED.md).
    Browser calls use `/api/v1/projects/...`; the BFF rewrites them to `/v1/projects/...`.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/projects:
    post:
      operationId: createProject
      summary: Create a project (stage CREATED)
      x-passage-duty: ProjMaintain
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '200':
          description: Idempotent replay of an earlier create with the same key and body
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    get:
      operationId: listProjects
      summary: List projects (cursor pagination)
      x-passage-duty: ProjInquire
      parameters:
        - name: stage
          in: query
          schema:
            $ref: '#/components/schemas/Stage'
        - name: projectType
          in: query
          schema:
            $ref: '#/components/schemas/ProjectType'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: One page of projects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  nextCursor:
                    type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/projects/{id}:
    get:
      operationId: getProject
      summary: Read a project
      x-passage-duty: ProjInquire
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The project
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/projects/{id}/transitions:
    post:
      operationId: transitionProject
      summary: Move a project to another stage (CREATED → IN_PROCESS → FINISHED, IN_PROCESS ⇄ ON_HOLD)
      x-passage-duty: ProjManage
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Stage changed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/projects/groups:
    get:
      operationId: listProjectGroups
      summary: List project groups
      x-passage-duty: ProjInquire
      responses:
        '200':
          description: All project groups of the tenant
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectGroup'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/projects/groups/{groupId}:
    put:
      operationId: putProjectGroup
      summary: Create a project group (no If-Match) or replace it (If-Match with its version)
      x-passage-duty: ProjSetupAdmin
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z0-9][A-Z0-9-]{0,9}$'
        - $ref: '#/components/parameters/OptionalIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectGroupRequest'
      responses:
        '201':
          description: Group created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroup'
        '200':
          description: Group replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroup'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/projects/posting-profiles:
    get:
      operationId: listPostingProfiles
      summary: List posting profiles (FR-41.5)
      x-passage-duty: ProjInquire
      responses:
        '200':
          description: All posting profiles of the tenant
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostingProfile'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    put:
      operationId: putPostingProfile
      summary: >-
        Create (no If-Match) or replace (If-Match) the posting profile of one key. The key is concrete
        (group, category, property), the group fallback (group, *, *) or the catch-all (*, *, *).
      x-passage-duty: ProjSetupAdmin
      parameters:
        - $ref: '#/components/parameters/OptionalIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostingProfileRequest'
      responses:
        '201':
          description: Profile created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingProfile'
        '200':
          description: Profile replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingProfile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/projects/posting-profiles/resolve:
    post:
      operationId: resolvePostingProfile
      summary: Resolve the profile for a concrete key with the fallback order (group,category,property) → (group,*,*) → (*,*,*)
      x-passage-duty: ProjInquire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
      responses:
        '200':
          description: The profile that applies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingProfile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: No profile at any fallback level (PROJ-POST-001)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/projects/{id}/plans:
    get:
      operationId: listPlanVersions
      summary: List the plan versions of a project in sequence order
      x-passage-duty: ProjInquire
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Plan versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlanVersion'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPlanVersion
      summary: >-
        Add a plan version: an empty or copied WORKING plan (one per project), a BASELINE copied from
        WORKING (one per project, locked), or a SIMULATION copied from WORKING or BASELINE. A wrong
        kind or source is PROJ-PLAN-001.
      x-passage-duty: ProjPlan
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanVersionRequest'
      responses:
        '201':
          description: Plan version created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersion'
        '200':
          description: Idempotent replay with the same key and body
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersion'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/projects/{id}/plans/{ver}/wbs:
    get:
      operationId: getWbs
      summary: Read a plan version with its WBS nodes and dependencies
      x-passage-duty: ProjInquire
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PlanVersionId'
      responses:
        '200':
          description: The plan version with its WBS
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WbsView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      operationId: replaceWbs
      summary: >-
        Replace every node and dependency of a plan version (bulk). Malformed nodes are 400,
        a duplicate code PROJ-WBS-002, a cycle PROJ-WBS-001, a locked plan PROJ-PLAN-002.
        Scheduled dates are cleared.
      x-passage-duty: ProjPlan
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PlanVersionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WbsRequest'
      responses:
        '200':
          description: WBS replaced; the plan version is bumped
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WbsView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/projects/{id}/plans/{ver}/schedule:
    post:
      operationId: schedulePlanVersion
      summary: >-
        Run the CPM scheduler (forward and backward pass, standard Monday-to-Friday calendar) and
        store early and late dates, slack and the critical flag per node; emits wbs.scheduled.
        A locked plan is PROJ-PLAN-002. Rerunning on an unchanged WBS gives the same result.
      x-passage-duty: ProjPlan
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PlanVersionId'
      responses:
        '200':
          description: The scheduled WBS
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/projects/change-orders:
    post:
      operationId: createChangeOrder
      summary: Create a DRAFT change order or claim with impact lines (FR-41.18)
      x-passage-duty: ProjMaintain
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOrderRequest'
      responses:
        '201':
          description: Change order created (number CO-0001, CO-0002, ... per project)
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOrder'
        '200':
          description: Idempotent replay of an earlier create with the same key and body
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOrder'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          description: idempotency_key_reuse, or COM-0001 when a wbsNodeId is not a node of the project's plan versions
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: listChangeOrders
      summary: Change order log of one project, in number order, without lines (§8.41.14)
      x-passage-duty: ProjInquire
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            maxLength: 20
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ChangeOrderType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ChangeOrderStatus'
      responses:
        '200':
          description: Change orders with their cost and revenue totals
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChangeOrder'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/projects/change-orders/{coId}:
    get:
      operationId: getChangeOrder
      summary: One change order with its impact lines
      x-passage-duty: ProjInquire
      parameters:
        - $ref: '#/components/parameters/ChangeOrderId'
      responses:
        '200':
          description: The change order
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOrder'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/projects/change-orders/{coId}/submit:
    post:
      operationId: submitChangeOrder
      summary: Submit a DRAFT change order (optionally attaching the customer approval reference)
      x-passage-duty: ProjMaintain
      parameters:
        - $ref: '#/components/parameters/ChangeOrderId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOrderDecisionRequest'
      responses:
        '200':
          description: The change order after the move
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOrder'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          description: PROJ-CO-001 (already APPLIED), PROJ-CO-002 (customer claim without approval reference), PROJ-CO-003 (move not allowed), PROJ-CO-004 (creator decides)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/projects/change-orders/{coId}/approve:
    post:
      operationId: approveChangeOrder
      summary: Approve a SUBMITTED change order; the approver must not be its creator
      x-passage-duty: ProjChangeOrderApprove
      parameters:
        - $ref: '#/components/parameters/ChangeOrderId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOrderDecisionRequest'
      responses:
        '200':
          description: The change order after the move
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOrder'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          description: PROJ-CO-001 (already APPLIED), PROJ-CO-002 (customer claim without approval reference), PROJ-CO-003 (move not allowed), PROJ-CO-004 (creator decides)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/projects/change-orders/{coId}/reject:
    post:
      operationId: rejectChangeOrder
      summary: Reject a SUBMITTED change order; the decider must not be its creator
      x-passage-duty: ProjChangeOrderApprove
      parameters:
        - $ref: '#/components/parameters/ChangeOrderId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The change order after the move
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOrder'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          description: PROJ-CO-001 (already APPLIED), PROJ-CO-002 (customer claim without approval reference), PROJ-CO-003 (move not allowed), PROJ-CO-004 (creator decides)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/projects/change-orders/{coId}/apply:
    post:
      operationId: applyChangeOrder
      summary: Apply an APPROVED change order (BR-41.13)
      description: |
        Atomically: contract value += Σ revenue impact; a new locked BASELINE is copied
        from the current baseline with each line's effort and schedule delta on the node
        of its WBS code and rescheduled, and the old baseline is superseded; the change
        order becomes APPLIED and immutable; changeorder.applied (budget delta for wave-38
        budget control) and project.updated are written to the outbox. A second apply is
        PROJ-CO-001 whatever If-Match carries, so a retry after a lost response is safe.
      x-passage-duty: ProjChangeOrderApprove
      parameters:
        - $ref: '#/components/parameters/ChangeOrderId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Applied
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyChangeOrderResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          description: PROJ-CO-001 (already APPLIED), PROJ-CO-002, PROJ-CO-003 (not APPROVED), PROJ-CO-004 (creator applies), PROJ-CO-005 (no current baseline), PROJ-CO-006 (a line cannot be applied)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/projects/{id}/risks:
    get:
      operationId: listRisks
      summary: Risk and issue register of a project, highest score first (FR-41.20)
      x-passage-duty: ProjInquire
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/RiskKind'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RiskStatus'
      responses:
        '200':
          description: Register entries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskIssue'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createRisk
      summary: Add an OPEN risk or issue
      x-passage-duty: ProjPlan
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskRequest'
      responses:
        '201':
          description: Entry created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskIssue'
        '200':
          description: Idempotent replay
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskIssue'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/projects/{id}/risks/{riskId}:
    put:
      operationId: updateRisk
      summary: Replace a risk or issue (fields and status)
      description: OPEN → MITIGATED | CLOSED, MITIGATED → OPEN | CLOSED; a CLOSED entry is final (PROJ-RISK-001).
      x-passage-duty: ProjPlan
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: riskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RiskRequest'
                - type: object
                  required: [status]
      responses:
        '200':
          description: Updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskIssue'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    ChangeOrderId:
      name: coId
      in: path
      required: true
      description: Change order id (UUID).
      schema:
        type: string
        format: uuid
    PlanVersionId:
      name: ver
      in: path
      required: true
      description: Plan version id (UUID).
      schema:
        type: string
        format: uuid
    OptionalIfMatch:
      name: If-Match
      in: header
      required: false
      description: Optional version precondition, for example `"3"`. Absent means no precondition.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version (of the project or plan version) as an ETag, for example `"3"`.
      schema:
        type: string
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        maxLength: 20
  headers:
    ETag:
      description: Row version (project, group, posting profile, plan version, change order or risk), quoted.
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Stage:
      type: string
      enum: [CREATED, IN_PROCESS, ON_HOLD, FINISHED]
    ProjectType:
      type: string
      enum: [TIME_MATERIAL, FIXED_PRICE, INTERNAL, COST, INVESTMENT, TIME]
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [id, legalEntityId, projectType, currency, startDate]
      description: |
        A sub-project (parentProjectId set) inherits projectGroupId, customerPartyId and
        contractId from its parent when they are omitted (FR-41.1). It must be in the
        parent's legal entity and cannot name a different customer (422 PROJ-PARENT-002).
        A parent the caller cannot see, or that does not exist, is 422 PROJ-PARENT-001.
      properties:
        id:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9-]{0,19}$'
          description: Project id. Will come from number sequence PROJ once the kernel sequence package lands.
        legalEntityId:
          type: string
          format: uuid
        parentProjectId:
          type: string
          maxLength: 20
        projectGroupId:
          type: string
          minLength: 1
          maxLength: 10
          description: Required unless parentProjectId is set (then inherited when omitted).
        projectType:
          $ref: '#/components/schemas/ProjectType'
        customerPartyId:
          type: string
          format: uuid
          description: Required for external types (TIME_MATERIAL, FIXED_PRICE) unless inherited from the parent.
        contractId:
          type: string
          format: uuid
          description: Inherited from the parent when omitted on a sub-project.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        contractValue:
          type: string
          pattern: '^\d{1,14}(\.\d{1,6})?$'
          description: Contract value in the project currency (default 0), rounded half-even to its minor unit. Applied change orders adjust it (BR-41.13).
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Must be on or after startDate.
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to:
          $ref: '#/components/schemas/Stage'
    Project:
      type: object
      required: [id, legalEntityId, projectGroupId, projectType, currency, contractValue, stage, startDate, version]
      properties:
        id:
          type: string
        legalEntityId:
          type: string
          format: uuid
        parentProjectId:
          type: string
        projectGroupId:
          type: string
        projectType:
          $ref: '#/components/schemas/ProjectType'
        customerPartyId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        currency:
          type: string
        contractValue:
          type: string
          description: Decimal string in the currency's minor unit, for example "550000.00".
        stage:
          $ref: '#/components/schemas/Stage'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectGroup:
      type: object
      required: [id, name, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9-]{0,9}$'
        name:
          type: string
          maxLength: 120
        defaultProjectType:
          $ref: '#/components/schemas/ProjectType'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          description: Optional; when present it must equal the path id.
        name:
          type: string
          minLength: 1
          maxLength: 120
        defaultProjectType:
          $ref: '#/components/schemas/ProjectType'
    PostingProfile:
      type: object
      description: Accounts a project posting uses for one key (FR-41.5).
      required: [projectGroup, category, lineProperty, costAccount, wipAccount, accruedRevenueAccount, invoicedRevenueAccount, onAccountAccount, version]
      properties:
        projectGroup:
          type: string
          description: Project group id, or "*" for the catch-all row.
        category:
          type: string
          description: Category id, or "*" for a group fallback or the catch-all.
        lineProperty:
          type: string
          enum: [CHARGEABLE, NON_CHARGEABLE, '*']
        costAccount:
          type: string
          maxLength: 40
        wipAccount:
          type: string
          maxLength: 40
        accruedRevenueAccount:
          type: string
          maxLength: 40
        invoicedRevenueAccount:
          type: string
          maxLength: 40
        onAccountAccount:
          type: string
          maxLength: 40
        version:
          type: integer
          minimum: 1
    PostingProfileRequest:
      type: object
      additionalProperties: false
      description: >-
        Category and line property are both "*" or both concrete; a "*" project group needs "*" for both.
      required: [projectGroup, category, lineProperty, costAccount, wipAccount, accruedRevenueAccount, invoicedRevenueAccount, onAccountAccount]
      properties:
        projectGroup:
          type: string
          pattern: '^(\*|[A-Z0-9][A-Z0-9-]{0,9})$'
        category:
          type: string
          minLength: 1
          maxLength: 20
        lineProperty:
          type: string
          enum: [CHARGEABLE, NON_CHARGEABLE, '*']
        costAccount:
          type: string
          minLength: 1
          maxLength: 40
        wipAccount:
          type: string
          minLength: 1
          maxLength: 40
        accruedRevenueAccount:
          type: string
          minLength: 1
          maxLength: 40
        invoicedRevenueAccount:
          type: string
          minLength: 1
          maxLength: 40
        onAccountAccount:
          type: string
          minLength: 1
          maxLength: 40
    ResolveRequest:
      type: object
      additionalProperties: false
      required: [projectGroup, category, lineProperty]
      properties:
        projectGroup:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9-]{0,9}$'
        category:
          type: string
          minLength: 1
          maxLength: 20
          description: Concrete category id (no wildcard).
        lineProperty:
          type: string
          enum: [CHARGEABLE, NON_CHARGEABLE]
    PlanKind:
      type: string
      enum: [BASELINE, WORKING, SIMULATION]
    PlanVersion:
      type: object
      required: [id, projectId, kind, sequence, locked, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
        kind:
          $ref: '#/components/schemas/PlanKind'
        sequence:
          type: integer
          minimum: 1
        copiedFromVersionId:
          type: string
          format: uuid
        supersededByVersionId:
          type: string
          format: uuid
          description: Set on a BASELINE replaced by the BASELINE an applied change order created (BR-41.13). One BASELINE per project has none.
        locked:
          type: boolean
          description: True for a BASELINE; a locked plan's WBS cannot be replaced or rescheduled.
        version:
          type: integer
          minimum: 1
          description: Optimistic concurrency token of the WBS; the ETag of this plan version.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PlanVersionRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/PlanKind'
        copyFromVersionId:
          type: string
          format: uuid
          description: Plan version of the same project whose WBS is copied. Required for BASELINE (from WORKING) and SIMULATION.
    WbsNodeRequest:
      type: object
      additionalProperties: false
      required: [wbsCode, name]
      properties:
        wbsCode:
          type: string
          pattern: '^[0-9]{1,4}(\.[0-9]{1,4}){0,7}$'
        parentWbsCode:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 120
        effortHours:
          type: string
          pattern: '^[0-9]{1,10}(\.[0-9]{1,2})?$'
          description: Decimal string, at most two places, >= 0.
        durationDays:
          type: integer
          minimum: 0
          maximum: 100000
          description: Working days; 0 is a milestone. Ignored on a summary node (one with children).
        constraintType:
          type: string
          enum: [ASAP, SNET]
          default: ASAP
          description: FNLT and MSO are not scheduled yet and are refused.
        constraintDate:
          type: string
          format: date
          description: Required for SNET, absent for ASAP.
        roleId:
          type: string
          format: uuid
        isBillableMilestone:
          type: boolean
    WbsDependencyRequest:
      type: object
      additionalProperties: false
      description: Links two tasks (nodes without children); each pair at most once.
      required: [predecessorWbsCode, successorWbsCode, type]
      properties:
        predecessorWbsCode:
          type: string
        successorWbsCode:
          type: string
        type:
          type: string
          enum: [FS, SS, FF, SF]
        lagDays:
          type: integer
          minimum: -3650
          maximum: 3650
          description: Calendar days.
    WbsRequest:
      type: object
      additionalProperties: false
      required: [nodes]
      properties:
        nodes:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/WbsNodeRequest'
        dependencies:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/WbsDependencyRequest'
    WbsNode:
      type: object
      required: [id, planVersionId, wbsCode, name, durationDays, constraintType, isBillableMilestone]
      properties:
        id:
          type: string
          format: uuid
        planVersionId:
          type: string
          format: uuid
        wbsCode:
          type: string
        parentId:
          type: string
          format: uuid
        name:
          type: string
        effortHours:
          type: string
        durationDays:
          type: integer
        constraintType:
          type: string
          enum: [ASAP, SNET]
        constraintDate:
          type: string
          format: date
        roleId:
          type: string
          format: uuid
        isBillableMilestone:
          type: boolean
        earlyStart:
          type: string
          format: date
          description: Scheduler output; absent until the plan is scheduled (and after a WBS replace).
        earlyFinish:
          type: string
          format: date
        lateStart:
          type: string
          format: date
        lateFinish:
          type: string
          format: date
        slackDays:
          type: integer
          description: Total float in working days.
        critical:
          type: boolean
    WbsDependency:
      type: object
      required: [predecessorId, successorId, type, lagDays]
      properties:
        predecessorId:
          type: string
          format: uuid
        successorId:
          type: string
          format: uuid
        type:
          type: string
          enum: [FS, SS, FF, SF]
        lagDays:
          type: integer
    WbsView:
      type: object
      required: [planVersion, nodes, dependencies]
      properties:
        planVersion:
          $ref: '#/components/schemas/PlanVersion'
        nodes:
          type: array
          description: In WBS-code order (1, 1.2, 1.10).
          items:
            $ref: '#/components/schemas/WbsNode'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/WbsDependency'
    ScheduleView:
      allOf:
        - $ref: '#/components/schemas/WbsView'
        - type: object
          required: [criticalPath]
          properties:
            finishDate:
              type: string
              format: date
              description: Project finish; absent for an empty plan.
            criticalPath:
              type: array
              description: Critical task ids in dependency order.
              items:
                type: string
                format: uuid
    ChangeOrderType:
      type: string
      enum: [SCOPE_CHANGE, CLAIM_CUSTOMER, CLAIM_VENDOR, INTERNAL]
    ChangeOrderStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, APPLIED]
    ChangeOrderLineRequest:
      type: object
      additionalProperties: false
      required: [costImpact, revenueImpact]
      properties:
        wbsNodeId:
          type: string
          format: uuid
          description: A node of one of the project's plan versions; required when the line changes effort or schedule.
        costImpact:
          type: string
          pattern: '^-?\d{1,14}(\.\d{1,6})?$'
        revenueImpact:
          type: string
          pattern: '^-?\d{1,14}(\.\d{1,6})?$'
        effortHoursDelta:
          type: string
          pattern: '^-?\d{1,10}(\.\d{1,2})?$'
          default: '0'
        scheduleDaysDelta:
          type: integer
          default: 0
          description: Working days added to (or removed from) the node's duration.
    ChangeOrderRequest:
      type: object
      additionalProperties: false
      required: [projectId, type, title, lines]
      properties:
        projectId:
          type: string
          maxLength: 20
        type:
          $ref: '#/components/schemas/ChangeOrderType'
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        customerApprovalRef:
          type: string
          minLength: 1
          maxLength: 200
        vendorPartyId:
          type: string
          format: uuid
          description: Required for, and only allowed on, a CLAIM_VENDOR.
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/ChangeOrderLineRequest'
    ChangeOrderDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        customerApprovalRef:
          type: string
          minLength: 1
          maxLength: 200
          description: Customer approval evidence, required to approve a CLAIM_CUSTOMER (PROJ-CO-002).
    ChangeOrderLine:
      type: object
      required: [lineNo, costImpact, revenueImpact, effortHoursDelta, scheduleDaysDelta]
      properties:
        lineNo:
          type: integer
          minimum: 1
        wbsNodeId:
          type: string
          format: uuid
        wbsCode:
          type: string
          description: The WBS code of wbsNodeId when the change order was created; apply finds the node in the current baseline by it.
        costImpact:
          type: string
        revenueImpact:
          type: string
        effortHoursDelta:
          type: string
        scheduleDaysDelta:
          type: integer
    ChangeOrder:
      type: object
      required: [id, number, projectId, type, title, description, status, createdBy, costImpact, revenueImpact, lines, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          example: CO-0001
        projectId:
          type: string
        type:
          $ref: '#/components/schemas/ChangeOrderType'
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ChangeOrderStatus'
        customerApprovalRef:
          type: string
        vendorPartyId:
          type: string
          format: uuid
        createdBy:
          type: string
        decidedBy:
          type: string
          description: Who approved or rejected.
        appliedBy:
          type: string
        appliedBaselineVersionId:
          type: string
          format: uuid
        appliedAt:
          type: string
          format: date-time
        costImpact:
          type: string
          description: Σ cost impact in the project currency.
        revenueImpact:
          type: string
          description: Σ revenue impact in the project currency.
        lines:
          type: array
          description: Empty in list responses.
          items:
            $ref: '#/components/schemas/ChangeOrderLine'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplyChangeOrderResponse:
      type: object
      required: [changeOrder, effect, baseline]
      properties:
        changeOrder:
          $ref: '#/components/schemas/ChangeOrder'
        effect:
          type: object
          required: [contractValueDelta, budgetDelta, contractValue, effortHoursDelta, scheduleDaysDelta]
          properties:
            contractValueDelta:
              type: string
            budgetDelta:
              type: string
            contractValue:
              type: string
            effortHoursDelta:
              type: string
            scheduleDaysDelta:
              type: integer
        baseline:
          $ref: '#/components/schemas/PlanVersion'
    RiskKind:
      type: string
      enum: [RISK, ISSUE]
    RiskStatus:
      type: string
      enum: [OPEN, MITIGATED, CLOSED]
    RiskRequest:
      type: object
      additionalProperties: false
      required: [kind, title, probability, impact]
      properties:
        kind:
          $ref: '#/components/schemas/RiskKind'
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        probability:
          type: integer
          minimum: 1
          maximum: 5
        impact:
          type: integer
          minimum: 1
          maximum: 5
        ownerWorkerId:
          type: string
          format: uuid
          description: Worker id (wave 42); not checked against a worker table yet.
        mitigation:
          type: string
          maxLength: 2000
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/RiskStatus'
          description: Required on PUT; must be omitted on POST (entries start OPEN).
    RiskIssue:
      type: object
      required: [id, projectId, kind, title, description, probability, impact, score, mitigation, status, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
        kind:
          $ref: '#/components/schemas/RiskKind'
        title:
          type: string
        description:
          type: string
        probability:
          type: integer
        impact:
          type: integer
        score:
          type: integer
          description: probability × impact (1 to 25).
        ownerWorkerId:
          type: string
          format: uuid
        mitigation:
          type: string
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/RiskStatus'
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Problem:
      type: object
      description: RFC 9457 with Passage extensions (code, traceId, errors).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: https://passage.dev/problems/PROJ-STAGE-001
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
