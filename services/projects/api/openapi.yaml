openapi: 3.1.0
info:
  title: Passage Projects API
  version: 0.4.0
  description: |
    Wave 41 (PSG-41). Slice 1: project master and hierarchy (FR-41.1) with stage
    transitions. Slice 2: project groups (FR-41.1), posting profiles and fallback
    resolution (FR-41.5), plan versions, WBS replace/read and the CPM scheduler (FR-41.2).
    Slice 3: contract value, change orders and claims with apply (FR-41.18, BR-41.13)
    and the risk and issue register (FR-41.20).
    Slice 4: project categories, project transactions priced per line (FR-41.4,
    BR-41.5) and invoice proposals built from billable transactions with the
    "why not billed" explanation (FR-41.6, BR-41.3, BR-41.8).
    Journal posting, billing rules, funding, estimates, timesheets and the rest of
    wave 41 are later slices (see NOT-IMPLEMENTED.md).
    Browser calls use `/api/v1/projects/...`; the BFF rewrites them to `/v1/projects/...`.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/projects:
    post:
      operationId: createProject
      summary: Create a project (stage CREATED)
      x-passage-duty: ProjMaintain
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '200':
          description: Idempotent replay of an earlier create with the same key and body
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    get:
      operationId: listProjects
      summary: List projects (cursor pagination)
      x-passage-duty: ProjInquire
      parameters:
        - name: stage
          in: query
          schema:
            $ref: '#/components/schemas/Stage'
        - name: projectType
          in: query
          schema:
            $ref: '#/components/schemas/ProjectType'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: One page of projects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  nextCursor:
                    type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/projects/{id}:
    get:
      operationId: getProject
      summary: Read a project
      x-passage-duty: ProjInquire
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The project
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/projects/{id}/transitions:
    post:
      operationId: transitionProject
      summary: Move a project to another stage (CREATED → IN_PROCESS → FINISHED, IN_PROCESS ⇄ ON_HOLD)
      x-passage-duty: ProjManage
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Stage changed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/projects/groups:
    get:
      operationId: listProjectGroups
      summary: List project groups
      x-passage-duty: ProjInquire
      responses:
        '200':
          description: All project groups of the tenant
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectGroup'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/projects/groups/{groupId}:
    put:
      operationId: putProjectGroup
      summary: Create a project group (no If-Match) or replace it (If-Match with its version)
      x-passage-duty: ProjSetupAdmin
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z0-9][A-Z0-9-]{0,9}$'
        - $ref: '#/components/parameters/OptionalIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectGroupRequest'
      responses:
        '201':
          description: Group created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroup'
        '200':
          description: Group replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroup'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/projects/posting-profiles:
    get:
      operationId: listPostingProfiles
      summary: List posting profiles (FR-41.5)
      x-passage-duty: ProjInquire
      responses:
        '200':
          description: All posting profiles of the tenant
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostingProfile'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    put:
      operationId: putPostingProfile
      summary: >-
        Create (no If-Match) or replace (If-Match) the posting profile of one key. The key is concrete
        (group, category, property), the group fallback (group, *, *) or the catch-all (*, *, *).
      x-passage-duty: ProjSetupAdmin
      parameters:
        - $ref: '#/components/parameters/OptionalIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostingProfileRequest'
      responses:
        '201':
          description: Profile created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingProfile'
        '200':
          description: Profile replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingProfile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/projects/posting-profiles/resolve:
    post:
      operationId: resolvePostingProfile
      summary: Resolve the profile for a concrete key with the fallback order (group,category,property) → (group,*,*) → (*,*,*)
      x-passage-duty: ProjInquire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
      responses:
        '200':
          description: The profile that applies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingProfile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          description: No profile at any fallback level (PROJ-POST-001)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/projects/{id}/plans:
    get:
      operationId: listPlanVersions
      summary: List the plan versions of a project in sequence order
      x-passage-duty: ProjInquire
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Plan versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlanVersion'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPlanVersion
      summary: >-
        Add a plan version: an empty or copied WORKING plan (one per project), a BASELINE copied from
        WORKING (one per project, locked), or a SIMULATION copied from WORKING or BASELINE. A wrong
        kind or source is PROJ-PLAN-001.
      x-passage-duty: ProjPlan
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanVersionRequest'
      responses:
        '201':
          description: Plan version created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersion'
        '200':
          description: Idempotent replay with the same key and body
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersion'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/projects/{id}/plans/{ver}/wbs:
    get:
      operationId: getWbs
      summary: Read a plan version with its WBS nodes and dependencies
      x-passage-duty: ProjInquire
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PlanVersionId'
      responses:
        '200':
          description: The plan version with its WBS
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WbsView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      operationId: replaceWbs
      summary: >-
        Replace every node and dependency of a plan version (bulk). Malformed nodes are 400,
        a duplicate code PROJ-WBS-002, a cycle PROJ-WBS-001, a locked plan PROJ-PLAN-002.
        Scheduled dates are cleared.
      x-passage-duty: ProjPlan
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PlanVersionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WbsRequest'
      responses:
        '200':
          description: WBS replaced; the plan version is bumped
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WbsView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/projects/{id}/plans/{ver}/schedule:
    post:
      operationId: schedulePlanVersion
      summary: >-
        Run the CPM scheduler (forward and backward pass, standard Monday-to-Friday calendar) and
        store early and late dates, slack and the critical flag per node; emits wbs.scheduled.
        A locked plan is PROJ-PLAN-002. Rerunning on an unchanged WBS gives the same result.
      x-passage-duty: ProjPlan
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PlanVersionId'
      responses:
        '200':
          description: The scheduled WBS
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/projects/{id}/plans/{ver}/transfer:
    get:
      operationId: previewSimulationTransfer
      summary: >-
        Three-way diff of a SIMULATION against the WORKING plan (BR-41.14): the nodes a transfer
        would apply and the nodes changed on both sides since the copy (conflicts). Changes nothing.
      description: |
        The common ancestor is the version the simulation was copied from, as recorded at copy
        time. A node changed only in the simulation is applied; a node changed only in WORKING,
        or changed alike on both sides, is kept; a node changed differently on both sides is a
        conflict. A node's content is its fields and its incoming dependencies (scheduled dates
        are not content). Not a SIMULATION, a simulation copied before ancestors were recorded,
        or a project without a WORKING plan is PROJ-PLAN-001; a transferred simulation is
        PROJ-PLAN-002.
      x-passage-duty: ProjInquire
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PlanVersionId'
      responses:
        '200':
          description: The diff. The ETag is the simulation's version, to send as If-Match on the transfer.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    post:
      operationId: transferSimulation
      summary: >-
        Transfer a SIMULATION into WORKING (FR-41.17, BR-41.14). Every conflict needs a resolution
        (KEEP_WORKING or TAKE_SIMULATION); unresolved conflicts, or a merge that is not a valid WBS,
        are 422 PROJ-SIM-001 and nothing changes. The WORKING plan's WBS is replaced by the merge
        (scheduled dates are cleared) and its version bumped; the simulation is locked.
      description: |
        If-Match carries the simulation's version (412 when stale). `workingVersion`, when given,
        is the WORKING version the diff was read at (412 when WORKING changed since). A replay
        finds the simulation locked (PROJ-PLAN-002), so the transfer is idempotent by state and
        takes no Idempotency-Key (see NOT-IMPLEMENTED.md). A merged dependency cycle is
        PROJ-WBS-001. No event is published.
      x-passage-duty: ProjPlan
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PlanVersionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: Transferred. The ETag is the WORKING plan's new version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/projects/change-orders:
    post:
      operationId: createChangeOrder
      summary: Create a DRAFT change order or claim with impact lines (FR-41.18)
      x-passage-duty: ProjMaintain
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOrderRequest'
      responses:
        '201':
          description: Change order created (number CO-0001, CO-0002, ... per project)
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOrder'
        '200':
          description: Idempotent replay of an earlier create with the same key and body
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOrder'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          description: idempotency_key_reuse, or COM-0001 when a wbsNodeId is not a node of the project's plan versions
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: listChangeOrders
      summary: Change order log of one project, in number order, without lines (§8.41.14)
      x-passage-duty: ProjInquire
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            maxLength: 20
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ChangeOrderType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ChangeOrderStatus'
      responses:
        '200':
          description: Change orders with their cost and revenue totals
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChangeOrder'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/projects/change-orders/{coId}:
    get:
      operationId: getChangeOrder
      summary: One change order with its impact lines
      x-passage-duty: ProjInquire
      parameters:
        - $ref: '#/components/parameters/ChangeOrderId'
      responses:
        '200':
          description: The change order
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOrder'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/projects/change-orders/{coId}/submit:
    post:
      operationId: submitChangeOrder
      summary: Submit a DRAFT change order (optionally attaching the customer approval reference)
      x-passage-duty: ProjMaintain
      parameters:
        - $ref: '#/components/parameters/ChangeOrderId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOrderDecisionRequest'
      responses:
        '200':
          description: The change order after the move
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOrder'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          description: PROJ-CO-001 (already APPLIED), PROJ-CO-002 (customer claim without approval reference), PROJ-CO-003 (move not allowed), PROJ-CO-004 (creator decides)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/projects/change-orders/{coId}/approve:
    post:
      operationId: approveChangeOrder
      summary: Approve a SUBMITTED change order; the approver must not be its creator
      x-passage-duty: ProjChangeOrderApprove
      parameters:
        - $ref: '#/components/parameters/ChangeOrderId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOrderDecisionRequest'
      responses:
        '200':
          description: The change order after the move
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOrder'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          description: PROJ-CO-001 (already APPLIED), PROJ-CO-002 (customer claim without approval reference), PROJ-CO-003 (move not allowed), PROJ-CO-004 (creator decides)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /v1/projects/change-orders/{coId}/reject:
    post:
      operationId: rejectChangeOrder
      summary: Reject a SUBMITTED change order; the decider must not be its creator
      x-passage-duty: ProjChangeOrderApprove
      parameters:
        - $ref: '#/components/parameters/ChangeOrderId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The change order after the move
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeOrder'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
