openapi: 3.1.0
info:
  title: audit
  version: 0.1.0
  description: Append-only field-level audit log with a hash chain. CDC ingest is the wave-4 seam.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/audit/changes:
    post:
      operationId: ingestChange
      summary: "Record a change to an audited record"
      x-passage-duty: audit.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Change' } } }
      responses:
        '202':
          description: Change recorded on the hash chain.
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/records/{entity}/{recordId}:
    get:
      operationId: queryRecord
      summary: "Get the audit history of one record"
      x-passage-duty: audit.read
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string } }
        - { name: recordId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Field changes for the record, oldest first.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Record' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/alert-rules:
    post:
      operationId: createAlertRule
      summary: "Create an audit alert rule"
      x-passage-duty: audit.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AlertRule' } } }
      responses:
        '201': { description: Rule created. }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/alerts:
    get:
      operationId: listAlerts
      summary: "List raised audit alerts"
      x-passage-duty: audit.read
      responses:
        '200': { description: Alert inbox. }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/reads:
    post:
      operationId: recordPhiRead
      summary: "Record a read of protected health information"
      description: >-
        Appends one row to the tenant's PHI read-access log (HIPAA audit controls, #606): who read which record and fields,
        when, and why. The reader is the verified caller of the request (the end user in a service token), never a body value;
        a body that names userId is refused with AUD-0002. Called by the service that returned the data, not by a person.
      x-passage-duty: audit.read-log.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PhiReadInput' } } }
      responses:
        '201':
          description: Read appended to the hash chain.
          content: { application/json: { schema: { $ref: '#/components/schemas/PhiRead' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listPhiReads
      summary: "List PHI reads in chain order"
      x-passage-duty: audit.read-log.view
      parameters:
        - { name: entity, in: query, schema: { type: string } }
        - { name: recordId, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
        - { name: from, in: query, description: Inclusive start, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Exclusive end, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
      responses:
        '200':
          description: One page of reads, oldest first. nextCursor is present when more rows follow.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/PhiRead' } }, nextCursor: { type: string } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/reads:export:
    get:
      operationId: exportPhiReads
      summary: "Export the tenant's PHI read log for an auditor"
      description: >-
        Streams the filtered rows as CSV or NDJSON in chain order. The whole chain is verified first and the verdict is in the
        X-Passage-Read-Chain-* response headers. Keep the head hash: a later export whose chain does not contain it was cut
        short. CSV neutralises cells that start with a formula character; NDJSON is lossless, so recompute hashes from it.
        The trailers X-Passage-Read-Export-Rows and X-Passage-Read-Export-Complete (true) follow the last row; a failure
        while rows are streaming aborts the connection, so a body without the completion trailer is incomplete.
      x-passage-duty: audit.read-log.export
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, ndjson], default: csv } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: recordId, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: The read log. Cache-Control is no-store.
          headers:
            X-Passage-Read-Chain-Verified: { description: "true when every row links to the one before it from the genesis hash.", schema: { type: string, enum: ['true', 'false'] } }
            X-Passage-Read-Chain-Entries: { description: Rows in the whole chain., schema: { type: integer } }
            X-Passage-Read-Chain-Head: { description: Hash of the last verified row., schema: { type: string } }
            X-Passage-Read-Chain-Broken-At: { description: 0-based position of the first row that does not link; only when verified is false., schema: { type: integer } }
          content:
            text/csv: { schema: { type: string } }
            application/x-ndjson: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/reads:verify:
    get:
      operationId: verifyPhiReads
      summary: "Verify the tenant's PHI read-log hash chain"
      x-passage-duty: audit.read-log.export
      responses:
        '200':
          description: The verification result.
          content: { application/json: { schema: { $ref: '#/components/schemas/PhiReadChain' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/reads:break-glass:
    get:
      operationId: listBreakGlassReads
      summary: "List break-glass PHI reads with their review"
      description: >-
        Reads recorded with the reserved reason code BREAK-GLASS (a purpose that is "BREAK-GLASS" or starts with
        "BREAK-GLASS:" or "BREAK-GLASS "): emergency access to protected health information under a duty kept for
        emergencies (#606). Oldest first. status pending (the default) lists the ones nobody has reviewed yet.
      x-passage-duty: audit.read-log.review
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, reviewed, all], default: pending } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
      responses:
        '200':
          description: One page of break-glass reads. nextCursor is present when more rows follow.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BreakGlassRead' } }, nextCursor: { type: string } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/reads/{id}:review:
    post:
      operationId: reviewBreakGlassRead
      summary: "Review one break-glass PHI read"
      description: >-
        A second person's review of a break-glass read, made once: APPROVED, or FLAGGED with a note. The reviewer is the
        verified caller and may not be the person who read the record (AUD-0005, as for a read that is not break-glass or
        is already reviewed). The read-log row is not changed, so the hash chain still verifies.
      x-passage-duty: audit.read-log.review
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome]
              properties:
                outcome: { type: string, enum: [APPROVED, FLAGGED] }
                note: { type: string, maxLength: 1000, description: Required when the outcome is FLAGGED. }
      responses:
        '200':
          description: The read with its review.
          content: { application/json: { schema: { $ref: '#/components/schemas/BreakGlassRead' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/texts/expand:
    post:
      operationId: expandText
      summary: "Replace placeholders in a text with the given values"
      x-passage-duty: authenticated
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string }, vars: { type: object, additionalProperties: { type: string } } } } } }
      responses:
        '200': { description: Placeholders replaced. }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      x-passage-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
components:
  schemas:
    Change:
      type: object
      additionalProperties: false
      required: [entity, recordId, field]
      properties:
        entity: { type: string }
        recordId: { type: string }
        field: { type: string }
        oldValue: { type: string }
        newValue: { type: string }
        userId: { type: string }
        traceId: { type: string }
        occurredAt: { type: string, format: date-time }
    Record:
      type: object
      required: [entity, recordId, field, userId, traceId, occurredAt]
      properties:
        id: { type: string }
        entity: { type: string }
        recordId: { type: string }
        field: { type: string }
        oldValue: { type: string }
        newValue: { type: string }
        userId: { type: string }
        traceId: { type: string }
        occurredAt: { type: string, format: date-time }
        hash: { type: string }
    PhiReadInput:
      type: object
      additionalProperties: false
      required: [entity, recordId, fields, purpose]
      properties:
        entity: { type: string, maxLength: 128 }
        recordId: { type: string, maxLength: 128 }
        fields: { type: array, minItems: 1, maxItems: 64, items: { type: string, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_.\[\]-]*$' } }
        purpose: { type: string, minLength: 1, maxLength: 500, description: A reason code or a short reason for reading the data. }
        traceId: { type: string, maxLength: 128, description: Defaults to the request id. }
        occurredAt: { type: string, format: date-time, description: Defaults to now; not more than five minutes ahead. }
        userId: { type: string, description: Never accepted. The reader is the verified caller; sending it is refused with AUD-0002. }
    PhiRead:
      type: object
      required: [id, seq, entity, recordId, fields, purpose, userId, traceId, occurredAt, prevHash, hash]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, format: int64 }
        entity: { type: string }
        recordId: { type: string }
        fields: { type: array, items: { type: string } }
        purpose: { type: string }
        userId: { type: string, description: The verified caller who read the data. }
        sourceService: { type: string, description: The service that recorded the read. }
        traceId: { type: string }
        occurredAt: { type: string, format: date-time }
        prevHash: { type: string }
        hash: { type: string }
    BreakGlassRead:
      allOf:
        - { $ref: '#/components/schemas/PhiRead' }
        - type: object
          properties:
            review:
              type: object
              description: Absent while the read is pending review.
              required: [outcome, reviewerId, reviewedAt]
              properties:
                outcome: { type: string, enum: [APPROVED, FLAGGED] }
                note: { type: string }
                reviewerId: { type: string }
                reviewedAt: { type: string, format: date-time }
    PhiReadChain:
      type: object
      required: [verified, entries, head]
      properties:
        verified: { type: boolean }
        entries: { type: integer, format: int64 }
        head: { type: string }
        brokenAt: { type: integer, format: int64, description: 0-based position of the first row that does not link. }
    AlertRule:
      type: object
      additionalProperties: false
      required: [entity]
      properties:
        entity: { type: string }
        field: { type: string }
        kind: { type: string, enum: [change, due_date] }
    Problem:
      type: object
      required: [type, title, status]
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string }, code: { type: string }, traceId: { type: string }, errors: { type: object, additionalProperties: { type: string } } }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
