image: { repository: ghcr.io/benjaminsrussell/audit, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: audit-db
migrateOnStart: false
replicaCount: 2
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor: { enabled: false }
# Service tokens from hr (and engineering) for POST /v1/audit/reads and /v1/audit/changes; publicKeys is the
# PASSAGE_SERVICE_PUBLIC_KEYS value, name[:kid]=base64 Ed25519 public keys, comma separated.
serviceIdentity:
  publicKeys: ""
