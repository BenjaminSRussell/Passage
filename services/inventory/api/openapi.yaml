  /v1/inventory/consignment-orders:
    post:
      operationId: createConsignmentOrder
      summary: Create a vendor consignment replenishment order (FR-16.17)
      description: |
        Stores a CREATED order (number CRO- plus 12 hex digits) for vendor-owned stock at a site
        and warehouse. Lines name the product, unit, quantity, consignment price (in currency) and
        optional location / batch / serial / config / size / color / style; site, warehouse and
        owner come from the order. Creating it posts nothing. A repeated Idempotency-Key with the
        same body returns the order (200, Idempotent-Replayed: true); with a different body it is
        idempotency_key_reuse (422).
      x-passage-duty: inventory.consignment.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConsignmentRequest' }
      responses:
        '201':
          description: Order created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsignmentOrder' }
        '200':
          description: Idempotent replay of a previous create
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsignmentOrder' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listConsignmentOrders
      summary: List replenishment orders, newest first (at most 500)
      x-passage-duty: inventory.read
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ConsignmentStatus' } }
        - { name: vendor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Orders with their lines
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ConsignmentOrder' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/inventory/consignment-orders/{id}:
    get:
      operationId: getConsignmentOrder
      summary: Get a replenishment order with its lines
      x-passage-duty: inventory.read
      parameters:
        - $ref: '#/components/parameters/ConsignmentId'
      responses:
        '200':
          description: The order
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsignmentOrder' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/inventory/consignment-orders/{id}:receive:
    post:
      operationId: receiveConsignmentOrder
      summary: Receive vendor-owned stock against a replenishment order (FR-16.17, BR-16.14)
      description: |
        Each receipt line is a RECEIVED transaction (origin CONSIGNMENT_LINE, reference = the order
        id) at the line's dimensions with owner = the vendor: quantity only, posted value 0, no
        financial date, no GL entry and no GR/IR. Rows are locked in ascending order; a serial already
        in physical stock is INV-SER-001. A line cannot receive beyond its ordered quantity
        (INV-CNS-002); an unknown line is INV-CNS-001, a fully received order INV-CNS-003. The order
        becomes PARTIALLY_RECEIVED or RECEIVED. receiptDate defaults to today. Requires If-Match.
      x-passage-duty: inventory.consignment.write
      parameters:
        - $ref: '#/components/parameters/ConsignmentId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiveConsignmentRequest' }
      responses:
        '200':
          description: Order after the receipt
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsignmentOrder' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/inventory/consignment/stock:
    get:
      operationId: listConsignmentStock
      summary: Consignment stock by vendor (PRD 3.16.14, SAP MB54)
      description: |
        Vendor-owned physical stock by vendor and dimension set, oldest first receipt first (at
        most 500 rows). consignmentPrice is the price of the vendor's latest replenishment line for
        the product and statisticalValue qty x price in its currency: a statistic, not posted value
        (vendor-owned stock is never valued). Both are null when no order carries a price.
      x-passage-duty: inventory.read
      parameters:
        - { name: vendor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Vendor-owned stock rows
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ConsignmentStockItem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /internal/v1/inventory/onhand:rebuild:
    post:
      operationId: rebuildInventoryOnHand
      summary: Rebuild the on-hand projection from the ledger and compare (FR-16.3, AC2)
      description: |
        Recomputes every on-hand row the caller can see from the inventory transactions (sums per
        status through the posting arithmetic) and the ACTIVE reservations (reserved_physical),
        compares it with the stored row in one snapshot, and reports the differing rows (at most
        100 listed; diffCount is exact). With repair=true each differing row is locked in posting
        lock order, rebuilt again under the lock and overwritten. Internal path: not exposed by
        the web BFF.
      x-passage-duty: inventory.admin
      parameters:
        - { name: repair, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Comparison (and repair) result
          content:
            application/json:
              schema:
                type: object
                required: [checked, diffCount, repaired, diffs]
                properties:
                  checked: { type: integer, description: Projection rows compared }
                  diffCount: { type: integer }
                  repaired: { type: boolean }
                  diffs:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [legalEntityId, productId, dimensionSetHash, fields]
                      properties:
                        legalEntityId: { type: string, format: uuid }
                        productId: { type: string, format: uuid }
                        dimensionSetHash: { type: string, description: Hex SHA-256 of the dimension set }
                        fields: { type: array, items: { type: string }, description: 'Buckets that differ (posted_qty, posted_value, reserved_physical, ...)' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/inventory/transactions/{id}:unpick:
    post:
      operationId: unpickInventoryTransaction
      summary: Unpick - named backward move PICKED to RESERVED_PHYSICAL (FR-16.2, BR-16.1)
      description: |
        Moves the whole transaction quantity, updates the on-hand buckets under the row lock with the
        negative policy checked (INV-NEG-001 / INV-NEG-002), writes a status-change audit row and
        emits transaction.posted and onhand.changed in the same database transaction. A transaction
        at another status is INV-STP-001.
        Refused with 409 INV-CNT-002 while the row is held by an unfinished sheet of a freezeStock count plan.
      x-passage-duty: inventory.transaction.step
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedStepRequest' }
      responses:
        '201':
          description: Move applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChange' }
        '200':
          description: Idempotent replay of the same move (Idempotent-Replayed true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/inventory/transactions/{id}:unregister:
    post:
      operationId: unregisterInventoryTransaction
      summary: Unregister - named backward move REGISTERED to ARRIVED (FR-16.2, AC-16.8)
      description: |
        Moves the whole transaction quantity, updates the on-hand buckets under the row lock with the
        negative policy checked (INV-NEG-001 / INV-NEG-002), writes a status-change audit row and
        emits transaction.posted and onhand.changed in the same database transaction. A transaction
        at another status is INV-STP-001.
        Refused with 409 INV-CNT-002 while the row is held by an unfinished sheet of a freezeStock count plan.
      x-passage-duty: inventory.transaction.step
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedStepRequest' }
      responses:
        '201':
          description: Move applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChange' }
        '200':
          description: Idempotent replay of the same move (Idempotent-Replayed true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/inventory/transactions/{id}:cancel-reservation:
    post:
      operationId: cancelInventoryTransactionReservation
      summary: CancelReservation - named backward move RESERVED_PHYSICAL or RESERVED_ORDERED to ON_ORDER (FR-16.2)
      description: |
        Moves the whole transaction quantity, updates the on-hand buckets under the row lock with the
        negative policy checked (INV-NEG-001 / INV-NEG-002), writes a status-change audit row and
        emits transaction.posted and onhand.changed in the same database transaction. A transaction
        at another status is INV-STP-001.
      x-passage-duty: inventory.transaction.step
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedStepRequest' }
      responses:
        '201':
          description: Move applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChange' }
        '200':
          description: Idempotent replay of the same move (Idempotent-Replayed true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/inventory/transactions/{id}:
    get:
      operationId: getInventoryTransaction
      summary: One transaction with its origin and status history (FR-16.13)
      x-passage-duty: inventory.read
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: The transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/inventory/status-changes:
    get:
      operationId: listInventoryStatusChanges
      summary: Status-change inquiry, newest first (FR-16.1, BR-16.1)
      x-passage-duty: inventory.read
      parameters:
        - { name: transaction, in: query, schema: { type: string, format: uuid } }
        - { name: command, in: query, schema: { $ref: '#/components/schemas/StatusCommand' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of status changes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/StatusChange' }
                  nextCursor: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /internal/v1/inventory/transactions:apply:
    post:
      operationId: applyInventoryTransaction
      summary: Service-to-service registration or forward status step of a transaction (FR-16.2, BR-16.1; waves 17-20)
      description: |
        With origin, registers one transaction for an external origin (purchase, receipt, sales or
        production line) at an expected or physical status; one origin registers one transaction
        (INV-STP-002). With transactionId, moves it forward to toStatus (skips allowed, never
        backward: INV-STP-001); fromStatus must match the current status (412 conflict_version).
        A move into SOLD / PURCHASED sets the financial date and the posted cost amount (issues at
        the running average, receipts at costAmount or their physical cost); vendor-owned stock
        never reaches a financial status (INV-OWN-001). The move applies to the whole quantity
        (splitting, BR-16.2, is not built). The projection, the audit row and the events are
        written in one database transaction. No GL entry is produced here: the calling document
        posts its own ledger entry. Internal path: not exposed by the web BFF.
        A move that changes the physical quantity of a row held by an unfinished sheet of a freezeStock count plan is refused (409 INV-CNT-002).
      x-passage-duty: inventory.transaction.apply
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyTransactionRequest' }
      responses:
        '201':
          description: Registration or move applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChange' }
        '200':
          description: Idempotent replay (Idempotent-Replayed true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Cursor:
      name: cursor
      in: query
      description: nextCursor of the previous page
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Version (journal, blocking, count sheet or transfer order) from the ETag of the last read
      schema: { type: string }
    JournalId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransferId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransactionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConsignmentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    ETag:
      description: Resource version, quoted
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    JournalType:
      type: string
      description: |
        COUNT journals are created by count-sheet posting, never by POST /journals. An
        OWNERSHIP_CHANGE journal (FR-16.17) also needs inventory.consignment.write to create; each
        line names vendor-owned stock (dimension owner = the vendor, one vendor per journal), a
        positive quantity and the consignment price as costPrice. It posts a DEDUCTED issue of the
        vendor-owned stock at value 0 and a PURCHASED receipt at the same dimensions without owner
        at quantity x price, Dr inventory / Cr consignment accrual, and emits
        dev.passage.inventory.ownership.changed.v1. More than the available vendor-owned quantity
        is INV-OWN-002; it cannot be reversed. A TRANSFER journal moves stock between two
        dimension sets of the legal entity (location to location, warehouse to warehouse, segment
        to segment): each line names the source (dimensions), the destination (toDimensions) and a
        positive quantity. It posts a SOLD issue at the source at its running average and a
        PURCHASED receipt of the same value at the destination, so the inventory account does not
        move and the GL entry is empty. The destination must differ from the source and carry a
        site, batch, serial and the product dimensions (config, size, color, style) cannot change, blocked or quarantined status is moved by a
        blocking (INV-JNL-006), a row cannot be both source and destination in one journal, and a
        transfer cannot be reversed (post one back). It takes no offset account.
      enum: [MOVEMENT, ADJUSTMENT, OPENING_BALANCE, COUNT, OWNERSHIP_CHANGE, TRANSFER]
    JournalStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, POSTING, POSTED, REJECTED, CANCELLED]
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    CreateJournalRequest:
      type: object
      additionalProperties: false
      required: [journalType, legalEntityId, postingDate, currency]
      properties:
        journalType: { $ref: '#/components/schemas/JournalType' }
        legalEntityId: { type: string, format: uuid }
        postingDate: { type: string, format: date }
        offsetAccountId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          description: Ledger account id. Required for MOVEMENT, rejected for the other types.
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Accounting currency of the legal entity }
    AddLinesRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: '#/components/schemas/JournalLineRequest' }
    Dimensions:
      type: object
      description: |
        Dimension values by name (site, warehouse, location, batch, serial, inventory_status, config,
        size, color, style, owner, segment). site is mandatory. owner (a vendor id) is set only by
        consignment receipts and read only by OWNERSHIP_CHANGE lines; on any other document it is
        INV-OWN-001. segment is SALES_ORDER:<ref> or PROJECT:<ref> (FR-16.20). license_plate is
        reserved.
      additionalProperties: { type: string, maxLength: 60 }
    JournalLineRequest:
      type: object
      additionalProperties: false
      required: [productId, qty, enteredUnit]
      properties:
        clientKey: { type: string, maxLength: 255, description: Per-line idempotency key }
        productId: { type: string, format: uuid }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        toDimensions: { $ref: '#/components/schemas/Dimensions', description: 'Destination dimension set of a TRANSFER journal line; refused on any other journal type' }
        qty: { $ref: '#/components/schemas/Decimal', description: 'Signed quantity in the inventory unit (receipt > 0, issue < 0); the positive quantity moved on a TRANSFER line' }
        enteredQty: { $ref: '#/components/schemas/Decimal', description: 'Quantity as keyed; defaults to qty and must have its sign' }
        enteredUnit: { type: string, pattern: '^[A-Z0-9_-]{1,12}$' }
        costPrice: { $ref: '#/components/schemas/Decimal', description: 'Non-negative cost per inventory unit, up to 6 decimals; receipts are valued at it, issues at the running average (it is the fallback when none exists)' }
    JournalLine:
      type: object
      required: [id, lineNo, productId, dimensions, qty, enteredQty, enteredUnit, costPrice]
      properties:
        id: { type: string, format: uuid }
        lineNo: { type: integer }
        clientKey: { type: string }
        reversesLineId: { type: string, format: uuid, description: On a reversal journal, the line this one negates }
        productId: { type: string, format: uuid }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        toDimensions: { $ref: '#/components/schemas/Dimensions', description: Destination dimension set of a TRANSFER journal line }
        qty: { $ref: '#/components/schemas/Decimal' }
        enteredQty: { $ref: '#/components/schemas/Decimal' }
        enteredUnit: { type: string }
        costPrice: { $ref: '#/components/schemas/Decimal' }
    GLEntry:
      type: object
      required: [currency, lines, ledgerEntryId]
      properties:
        currency: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [account, debit, credit]
            properties:
              account: { type: string }
              debit: { $ref: '#/components/schemas/Decimal' }
              credit: { $ref: '#/components/schemas/Decimal' }
        ledgerEntryId: { type: [string, 'null'], format: uuid, description: Null until the wave 11 ledger Post exists }
    JournalSummary:
      type: object
      required: [id, legalEntityId, journalType, status, postingDate, currency, version, lineCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        journalType: { $ref: '#/components/schemas/JournalType' }
        status: { $ref: '#/components/schemas/JournalStatus' }
        postingDate: { type: string, format: date }
        offsetAccountId: { type: string }
        currency: { type: string }
        version: { type: integer }
        lineCount: { type: integer }
        createdAt: { type: string, format: date-time }
        postedAt: { type: string, format: date-time }
        reversesJournalId: { type: string, format: uuid, description: Set on a reversal journal (BR-16.12) }
        reversedByJournalId: { type: string, format: uuid, description: Set on a journal that has a reversal }
    Journal:
      allOf:
        - $ref: '#/components/schemas/JournalSummary'
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              items: { $ref: '#/components/schemas/JournalLine' }
            glEntry: { $ref: '#/components/schemas/GLEntry' }
    OnHandItem:
      type: object
      required: [group, physicalInvent, availPhysical, availOrdered, postedValue, reservedPhysical, blocked, currency, negative]
      properties:
        group: { type: object, additionalProperties: { type: string } }
        physicalInvent: { $ref: '#/components/schemas/Decimal' }
        availPhysical: { $ref: '#/components/schemas/Decimal' }
        availOrdered: { $ref: '#/components/schemas/Decimal' }
        postedValue: { $ref: '#/components/schemas/Decimal' }
        reservedPhysical: { $ref: '#/components/schemas/Decimal' }
        blocked: { $ref: '#/components/schemas/Decimal', description: 'Physical quantity with inventory_status BLOCKED or QUARANTINE; part of physicalInvent, left out of availPhysical and availOrdered (FR-16.8)' }
        currency: { type: string }
        negative: { type: boolean, description: True when any row in the group has negative physical stock }
    TransactionStatus:
      type: string
      enum: [ON_ORDER, RESERVED_ORDERED, RESERVED_PHYSICAL, PICKED, DEDUCTED, SOLD, ORDERED, ARRIVED, REGISTERED, RECEIVED, PURCHASED]
    Transaction:
      type: object
      required: [id, legalEntityId, originId, sourceType, sourceId, productId, dimensions, qty, enteredQty, enteredUnit, physicalDate, currency, costAmountPhysical, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        originId: { type: string, format: uuid }
        sourceType: { type: string, enum: [INVENT_JOURNAL_LINE, BLOCKING, TRANSFER_LINE, CONSIGNMENT_LINE, OWNERSHIP_CHANGE, TRANSFER_IN, PURCH_LINE, RECEIPT_LINE, SALES_LINE, PROD_LINE], description: 'PURCH_LINE, RECEIPT_LINE, SALES_LINE and PROD_LINE are registered by other services through transactions:apply' }
        sourceId: { type: string, format: uuid }
        journalId: { type: string, format: uuid, description: 'Set for journal lines, the receipt leg of an ownership change and the destination leg (TRANSFER_IN) of a transfer journal line' }
        reference: { type: string, description: 'Source document of other origins (blocking, transfer or replenishment order id, or the reference given to transactions:apply)' }
        productId: { type: string, format: uuid }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        qty: { $ref: '#/components/schemas/Decimal' }
        enteredQty: { $ref: '#/components/schemas/Decimal' }
        enteredUnit: { type: string }
        issueStatus: { $ref: '#/components/schemas/TransactionStatus' }
        receiptStatus: { $ref: '#/components/schemas/TransactionStatus' }
        physicalDate: { type: string, format: date }
        financialDate: { type: string, format: date, description: Absent until the transaction reaches a financial status (SOLD, PURCHASED) }
        currency: { type: string }
        costAmountPhysical: { $ref: '#/components/schemas/Decimal' }
        costAmountPosted: { $ref: '#/components/schemas/Decimal' }
        createdAt: { type: string, format: date-time }
    StatusCommand:
      type: string
      enum: [CREATE, STEP, UNPICK, UNREGISTER, CANCEL_RESERVATION]
      description: 'CREATE registers a transaction for an external origin; STEP moves it forward; UNPICK, UNREGISTER and CANCEL_RESERVATION are the named backward moves (BR-16.1)'
    StatusChange:
      type: object
      description: Status-change audit row (InventoryTransactionStatusChange, FR-16.1); append-only
      required: [id, legalEntityId, transactionId, command, toStatus, qty, date, occurredAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        command: { $ref: '#/components/schemas/StatusCommand' }
        fromStatus: { $ref: '#/components/schemas/TransactionStatus', description: Absent for CREATE }
        toStatus: { $ref: '#/components/schemas/TransactionStatus' }
        qty: { $ref: '#/components/schemas/Decimal', description: Quantity moved (the whole signed transaction quantity) }
        date: { type: string, format: date, description: Physical or financial date the change set }
        createdBy: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
    TransactionDetail:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          required: [statusChanges]
          properties:
            statusChanges:
              type: array
              description: Status history, oldest first
              items: { $ref: '#/components/schemas/StatusChange' }
    NamedStepRequest:
      type: object
      additionalProperties: false
      properties:
        date: { type: string, format: date, description: 'Date of the move; default today (UTC)' }
    ApplyTransactionRequest:
      type: object
      additionalProperties: false
      description: |
        Either origin (register a new transaction for an external origin at toStatus) or
        transactionId with fromStatus (step an existing transaction forward to toStatus).
      required: [toStatus]
      properties:
        transactionId: { type: string, format: uuid, description: STEP only }
        fromStatus: { $ref: '#/components/schemas/TransactionStatus', description: 'STEP only: the status the caller read; a mismatch is 412 conflict_version' }
        costAmount: { $ref: '#/components/schemas/Decimal', description: 'STEP of a receipt to PURCHASED only: the posted value (default its physical cost amount)' }
        origin:
          type: object
          required: [sourceType, sourceId]
          additionalProperties: false
          properties:
            sourceType: { type: string, enum: [PURCH_LINE, RECEIPT_LINE, SALES_LINE, PROD_LINE] }
            sourceId: { type: string, format: uuid, description: 'Source document line; one origin registers one transaction' }
            reference: { type: string, maxLength: 60, description: Document number shown in the inquiry }
        legalEntityId: { type: string, format: uuid, description: Registration only }
        productId: { type: string, format: uuid, description: Registration only }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        qty: { $ref: '#/components/schemas/Decimal', description: 'Registration only: positive for a receipt, negative for an issue; at most 6 decimals' }
        enteredQty: { $ref: '#/components/schemas/Decimal', description: 'Registration only: default qty' }
        enteredUnit: { type: string, pattern: '^[A-Z0-9_-]{1,12}$', description: Registration only }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Registration only }
        costPrice: { $ref: '#/components/schemas/Decimal', description: 'Registration only: unit cost of a receipt, or the fallback unit cost of an issue from a row with no posted stock; vendor-owned stock is never valued' }
        toStatus: { $ref: '#/components/schemas/TransactionStatus', description: 'Registration: a physical or expected status matching the sign of qty (never SOLD or PURCHASED). STEP: a later status of the same direction' }
        date: { type: string, format: date, description: 'Physical date of a registration or of a move into a physical status, financial date of a move into SOLD or PURCHASED; default today (UTC)' }
    ReserveRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, productId, qty, demandType, demandId]
      properties:
        legalEntityId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        qty: { $ref: '#/components/schemas/Decimal' }
        demandType: { type: string, enum: [MANUAL, SALES_ORDER, PRODUCTION_ORDER, TRANSFER_ORDER] }
        demandId: { type: string, minLength: 1, maxLength: 60 }
        policy: { type: string, enum: [MANUAL, FIFO, FEFO, LIFO], default: FIFO }
        requiredDate: { type: string, format: date, description: Defaults to today (UTC) }
        shelfLifeMarginDays: { type: integer, minimum: 0, maximum: 365, default: 0 }
        allowPartial: { type: boolean, default: false }
        dimensions: { $ref: '#/components/schemas/Dimensions', description: 'MANUAL: the exact dimension set. Policies: a filter (every named dimension must match; no segment, which comes from segmentType). Vendor-owned stock (owner) is INV-OWN-001.' }
        segmentType: { type: string, enum: [NONE, SALES_ORDER, PROJECT], default: NONE, description: 'Segment of the demand (FR-16.20). A policy reservation takes stock of this segment first, then unsegmented stock when segmentFallback; never another segment. An unsegmented demand never takes segmented stock. MANUAL stock of an ineligible segment is INV-SEG-001.' }
        segmentRef: { type: string, maxLength: 48, description: Sales order or project reference; required with SALES_ORDER and PROJECT }
        segmentFallback: { type: boolean, default: true }
    Reservation:
      type: object
      required: [id, legalEntityId, productId, dimensions, qty, demandType, demandId, policy, status, allocationNo, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        qty: { $ref: '#/components/schemas/Decimal' }
        demandType: { type: string }
        demandId: { type: string }
        demandSegment: { type: string, description: 'Segment of the demand (SALES_ORDER:<ref> or PROJECT:<ref>); absent when unsegmented' }
        policy: { type: string, enum: [MANUAL, FIFO, FEFO, LIFO] }
        status: { type: string, enum: [ACTIVE, RELEASED, CONSUMED] }
        allocationNo: { type: integer, description: Position of this allocation within its request }
        createdAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time }
    ReserveResponse:
      type: object
      required: [items, shortfall]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Reservation' }
        shortfall: { $ref: '#/components/schemas/Decimal', description: Quantity that could not be reserved (allowPartial) }
    BlockingRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, productId, dimensions, qty, unit, targetStatus, reason]
      properties:
        legalEntityId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensions: { $ref: '#/components/schemas/Dimensions', description: Unrestricted source dimensions (site required, no inventory_status) }
        qty: { $ref: '#/components/schemas/Decimal' }
        unit: { type: string, pattern: '^[A-Z0-9_-]{1,12}$' }
        targetStatus: { type: string, enum: [BLOCKED, QUARANTINE] }
        reason: { type: string, enum: [QUALITY, DAMAGE, RECALL, LEGAL, OTHER] }
        note: { type: string, maxLength: 500 }
        physicalDate: { type: string, format: date, description: Defaults to today (UTC) }
    Blocking:
      type: object
      required: [id, legalEntityId, productId, dimensions, qty, unit, targetStatus, reason, state, physicalDate, version]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        qty: { $ref: '#/components/schemas/Decimal' }
        unit: { type: string }
        targetStatus: { type: string, enum: [BLOCKED, QUARANTINE] }
        reason: { type: string }
        note: { type: string }
        state: { type: string, enum: [ACTIVE, RELEASED] }
        disposition: { type: string, enum: [RELEASE, SCRAP, RETURN] }
        physicalDate: { type: string, format: date }
        version: { type: integer }
    CountPlanRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, name, currency, unit]
      properties:
        legalEntityId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        warehouse: { type: string, maxLength: 60 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        unit: { type: string, pattern: '^[A-Z0-9_-]{1,12}$' }
        tolerancePct: { $ref: '#/components/schemas/Decimal' }
        toleranceValue: { $ref: '#/components/schemas/Decimal' }
        blind: { type: boolean, default: false }
        freezeStock: { type: boolean, default: false, description: 'While a sheet of the plan is OPEN, COUNTED or APPROVED, refuse movements of its rows (409 INV-CNT-002): journal postings (including other COUNT journals), transfer ship / receive, blocking and release, and status steps that change physical stock. Reservations are not refused.' }
        fourEyes: { type: boolean, default: false, description: 'The sheet needs :submit and a separate :approve by someone who did not count before it posts (INV-CNT-007)' }
        locationFrom: { type: string, maxLength: 60, description: 'Inclusive lower bound of the location dimension, compared byte-wise (C collation)' }
        locationTo: { type: string, maxLength: 60, description: Inclusive upper bound of the location dimension }
        abcClass: { type: string, enum: [A, B, C], description: 'Select only rows whose product x site has this class in the latest ABC run of the legal entity' }
        samplePct: { $ref: '#/components/schemas/Decimal', description: 'Count only this percent (0 to 100, rounded up) of the selected rows; the rows are chosen by a hash seeded with the sheet id, so each sheet draws a different, reproducible sample. 0 counts all' }
    CountPlan:
      type: object
      required: [id, legalEntityId, name, currency, unit, tolerancePct, toleranceValue, blind, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        name: { type: string }
        warehouse: { type: string }
        currency: { type: string }
        unit: { type: string }
        tolerancePct: { $ref: '#/components/schemas/Decimal' }
        toleranceValue: { $ref: '#/components/schemas/Decimal' }
        blind: { type: boolean }
        freezeStock: { type: boolean }
        fourEyes: { type: boolean }
        locationFrom: { type: string }
        locationTo: { type: string }
        abcClass: { type: string, enum: [A, B, C] }
        samplePct: { type: string, description: Sample percent; absent when every selected row is counted }
        createdAt: { type: string, format: date-time }
    CountSheetSummary:
      type: object
      required: [id, legalEntityId, planId, planName, number, status, blind, fourEyes, freezeStock, recountLines, version, lineCount, countedCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        planName: { type: string }
        number: { type: string, description: 'CNT- number (the wave 5 sequence replaces it)' }
        status: { type: string, enum: [OPEN, COUNTED, APPROVED, POSTED, CANCELLED] }
        blind: { type: boolean }
        approvedBy: { type: string, description: User who approved the sheet, or a variance above tolerance at posting }
        submittedBy: { type: string, description: User who submitted the sheet for review }
        fourEyes: { type: boolean }
        freezeStock: { type: boolean }
        recountLines: { type: integer, description: Lines with an outstanding recount request }
        journalId: { type: string, format: uuid, description: COUNT journal of a posted sheet with variances }
        version: { type: integer }
        lineCount: { type: integer }
        countedCount: { type: integer }
        createdAt: { type: string, format: date-time }
        postedAt: { type: string, format: date-time }
    CountSheet:
      allOf:
        - $ref: '#/components/schemas/CountSheetSummary'
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              items:
                type: object
                required: [id, lineNo, productId, dimensions, expectedQty, countedQty, postedVariance, recountRequested, recountRounds]
                properties:
                  id: { type: string, format: uuid }
                  lineNo: { type: integer }
                  productId: { type: string, format: uuid }
                  dimensions: { $ref: '#/components/schemas/Dimensions' }
                  expectedQty: { type: [string, 'null'], description: 'Book quantity at generation; null until a blind sheet is POSTED or CANCELLED (unless approver)' }
                  countedQty: { type: [string, 'null'] }
                  countedBy: { type: string }
                  countedAt: { type: string, format: date-time }
                  postedVariance: { type: [string, 'null'], description: Counted minus book at posting }
                  recountRequested: { type: boolean, description: A supervisor asked for this line to be counted again; enter it again to clear }
                  recountReason: { type: string }
                  recountRounds: { type: integer }
    TransferStatus:
      type: string
      enum: [CREATED, SHIPPED, PARTIALLY_RECEIVED, RECEIVED, CANCELLED]
    CreateTransferRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, fromWarehouseId, toWarehouseId, shipDate, lines]
      properties:
        legalEntityId: { type: string, format: uuid }
        fromWarehouseId: { type: string, maxLength: 60 }
        toWarehouseId: { type: string, maxLength: 60 }
        toSiteId: { type: string, maxLength: 60, description: Receiving site when it differs from the lines' site }
        transitWarehouseId: { type: string, maxLength: 60, description: Required when useTransit is true; ignored otherwise }
        useTransit: { type: boolean, default: true }
        shipDate: { type: string, format: date, description: Planned ship date }
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [productId, unit, qty]
            properties:
              productId: { type: string, format: uuid }
              dimensions: { $ref: '#/components/schemas/Dimensions' }
              unit: { type: string, pattern: '^[A-Z0-9_-]{1,12}$' }
              qty: { $ref: '#/components/schemas/Decimal' }
              underdeliveryPct: { $ref: '#/components/schemas/Decimal' }
              overdeliveryPct: { $ref: '#/components/schemas/Decimal' }
    ReceiveTransferRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        receiptDate: { type: string, format: date, description: Default today }
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [lineId, qty]
            properties:
              lineId: { type: string, format: uuid }
              qty: { $ref: '#/components/schemas/Decimal' }
              closeShort: { type: boolean, default: false }
    TransferLine:
      type: object
      required: [id, lineNo, productId, dimensions, unit, qty, shippedQty, receivedQty, inTransit, underdeliveryPct, overdeliveryPct, closed]
      properties:
        id: { type: string, format: uuid }
        lineNo: { type: integer }
        productId: { type: string, format: uuid }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        unit: { type: string }
        qty: { $ref: '#/components/schemas/Decimal' }
        shippedQty: { $ref: '#/components/schemas/Decimal' }
        receivedQty: { $ref: '#/components/schemas/Decimal' }
        inTransit: { $ref: '#/components/schemas/Decimal' }
        underdeliveryPct: { $ref: '#/components/schemas/Decimal' }
        overdeliveryPct: { $ref: '#/components/schemas/Decimal' }
        closed: { type: boolean }
    TransferOrder:
      type: object
      required: [id, legalEntityId, number, status, fromWarehouseId, toWarehouseId, useTransit, shipDate, version, createdAt, lines]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        number: { type: string, example: TO-1A2B3C4D5E6F }
        status: { $ref: '#/components/schemas/TransferStatus' }
        fromWarehouseId: { type: string }
        toWarehouseId: { type: string }
        toSiteId: { type: string }
        transitWarehouseId: { type: string }
        useTransit: { type: boolean }
        shipDate: { type: string, format: date, description: Planned until shipped, then the actual ship date }
        receiptDate: { type: string, format: date, description: Set when every line is closed }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/TransferLine' }
    InTransitItem:
      type: object
      required: [orderId, number, lineId, productId, dimensions, unit, fromWarehouseId, toWarehouseId, transitWarehouseId, shipDate, daysInTransit, inTransitQty, closedShort]
      properties:
        orderId: { type: string, format: uuid }
        number: { type: string }
        lineId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        unit: { type: string }
        fromWarehouseId: { type: string }
        toWarehouseId: { type: string }
        transitWarehouseId: { type: string }
        shipDate: { type: string, format: date }
        daysInTransit: { type: integer }
        inTransitQty: { $ref: '#/components/schemas/Decimal' }
        closedShort: { type: boolean, description: The line was closed short; the quantity is left in transit for investigation }
    TransferLineInquiryItem:
      type: object
      required: [orderId, legalEntityId, number, orderStatus, fromWarehouseId, toWarehouseId, shipDate, lineId, lineNo, productId, dimensions, unit, qty, shippedQty, receivedQty, remainingQty, inTransit, daysInTransit, closed, daysLate]
      properties:
        orderId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        number: { type: string }
        orderStatus: { type: string, enum: [CREATED, SHIPPED, PARTIALLY_RECEIVED, RECEIVED, CANCELLED] }
        fromWarehouseId: { type: string }
        toWarehouseId: { type: string }
        shipDate: { type: string, format: date, description: Planned until the order ships, then the actual ship date }
        lineId: { type: string, format: uuid }
        lineNo: { type: integer }
        productId: { type: string, format: uuid }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        unit: { type: string }
        qty: { $ref: '#/components/schemas/Decimal' }
        shippedQty: { $ref: '#/components/schemas/Decimal' }
        receivedQty: { $ref: '#/components/schemas/Decimal' }
        remainingQty: { $ref: '#/components/schemas/Decimal' }
        inTransit: { $ref: '#/components/schemas/Decimal' }
        daysInTransit: { type: integer, description: Days since the ship date while quantity is in transit, otherwise 0 }
        closed: { type: boolean, description: The line was closed short }
        late: { type: string, enum: [LATE_SHIPMENT, LATE_RECEIPT], description: Absent when the line is on time }
        daysLate: { type: integer, description: Days past the due date for a late line, otherwise 0 }
    CountVarianceLine:
      type: object
      required: [sheetId, sheetNumber, sheetStatus, planId, planName, legalEntityId, lineId, lineNo, productId, dimensions, unit, currency, expectedQty, countedQty, varianceQty, unitCost, varianceValue, valueBasis, countedAt]
      properties:
        sheetId: { type: string, format: uuid }
        sheetNumber: { type: string }
        sheetStatus: { type: string, enum: [OPEN, COUNTED, APPROVED, POSTED] }
        planId: { type: string, format: uuid }
        planName: { type: string }
        warehouseId: { type: string, description: Warehouse of the plan, when it has one }
        legalEntityId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        lineNo: { type: integer }
        productId: { type: string, format: uuid }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        unit: { type: string }
        currency: { type: string }
        expectedQty: { $ref: '#/components/schemas/Decimal' }
        countedQty: { $ref: '#/components/schemas/Decimal' }
        varianceQty: { $ref: '#/components/schemas/Decimal' }
        unitCost: { $ref: '#/components/schemas/Decimal' }
        varianceValue: { $ref: '#/components/schemas/Decimal' }
        valueBasis: { type: string, enum: [JOURNAL, ESTIMATE], description: JOURNAL for a POSTED sheet (the cost of its COUNT journal line; a zero variance values at zero); ESTIMATE the running average today }
        countedBy: { type: string }
        countedAt: { type: string, format: date-time }
    CountVarianceTotals:
      type: object
      required: [counter, currency, lines, absVarianceQty, gainValue, lossValue, netValue]
      properties:
        counter: { type: string, description: Empty for lines with no recorded counter }
        currency: { type: string }
        lines: { type: integer }
        absVarianceQty: { $ref: '#/components/schemas/Decimal' }
        gainValue: { $ref: '#/components/schemas/Decimal' }
        lossValue: { $ref: '#/components/schemas/Decimal', description: Value of negative variances as a positive number }
        netValue: { $ref: '#/components/schemas/Decimal' }
    NegativeOnHandLine:
      type: object
      required: [legalEntityId, productId, dimensions, physicalInvent, shortfallQty, postedValue]
      properties:
        legalEntityId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        physicalInvent: { $ref: '#/components/schemas/Decimal' }
        shortfallQty: { $ref: '#/components/schemas/Decimal' }
        postedValue: { $ref: '#/components/schemas/Decimal' }
        currency: { type: string }
        firstNegativeDate: { type: string, format: date }
    TraceLine:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          properties:
            running: { $ref: '#/components/schemas/Decimal', description: Traced physical balance of the legal entity and product after this movement; BOTH direction and physical movements only }
    DimensionCombination:
      type: object
      required: [legalEntityId, productId, dimensionSetHash, dimensions, activeDimensions, firstUse, lastUse, transactionCount]
      properties:
        legalEntityId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensionSetHash: { type: string, description: Hex of the dimension-set hash }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        activeDimensions: { type: array, items: { type: string } }
        firstUse: { type: string, format: date }
        lastUse: { type: string, format: date }
        transactionCount: { type: integer }
    AbcRunRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId]
      properties:
        legalEntityId: { type: string, format: uuid }
        criterion: { type: string, enum: [VALUE], default: VALUE }
        zeroClass: { type: string, enum: [C, N], default: C }
        thresholds:
          type: object
          additionalProperties: false
          required: [a, b, c]
          properties:
            a: { $ref: '#/components/schemas/Decimal' }
            b: { $ref: '#/components/schemas/Decimal' }
            c: { $ref: '#/components/schemas/Decimal' }
    Reconciliation:
      type: object
      required: [id, legalEntityId, account, currency, runDate, inventoryValue, ledgerBalance, diff, status, ledgerSource, negativeRows, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        account: { type: string, description: Inventory posting account code }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        runDate: { type: string, format: date }
        inventoryValue: { type: string, description: Decimal string rounded to the minor unit }
        ledgerBalance: { type: string, description: Decimal string rounded to the minor unit }
        diff: { type: string, description: inventoryValue minus ledgerBalance }
        status: { type: string, enum: [MATCHED, DIFFERENCE] }
        ledgerSource: { type: string, enum: [GL_JOURNALS, LEDGER_OVERRIDE] }
        negativeRows: { type: integer, minimum: 0, description: On-hand rows with negative physical stock at the run (FR-16.4) }
        createdAt: { type: string, format: date-time, description: When the row was last computed }
    AbcRun:
      type: object
      required: [id, legalEntityId, criterion, thresholds, zeroClass, createdAt, classCounts]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        criterion: { type: string, enum: [VALUE] }
        thresholds:
          type: object
          properties:
            a: { $ref: '#/components/schemas/Decimal' }
            b: { $ref: '#/components/schemas/Decimal' }
            c: { $ref: '#/components/schemas/Decimal' }
        zeroClass: { type: string, enum: [C, N] }
        createdAt: { type: string, format: date-time }
        classCounts:
          type: object
          additionalProperties: { type: integer }
          description: Items per class (A, B, C, N)
        items:
          type: array
          description: Present on create and read, absent in the list
          items:
            type: object
            required: [productId, site, value, cumPct, class]
            properties:
              productId: { type: string, format: uuid }
              site: { type: string }
              value: { $ref: '#/components/schemas/Decimal' }
              cumPct: { type: string, description: Cumulative share of the value up to and including the item, percent with 2 decimals }
              class: { type: string, enum: [A, B, C, N] }
    ConsignmentStatus:
      type: string
      enum: [CREATED, PARTIALLY_RECEIVED, RECEIVED]
    CreateConsignmentRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, vendorId, siteId, warehouseId, requestedDate, currency, lines]
      properties:
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, minLength: 1, maxLength: 60, description: 'Vendor id; becomes the owner dimension of the received stock' }
        siteId: { type: string, minLength: 1, maxLength: 60 }
        warehouseId: { type: string, minLength: 1, maxLength: 60 }
        requestedDate: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Currency of the consignment prices }
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [productId, unit, qty]
            properties:
              productId: { type: string, format: uuid }
              dimensions: { $ref: '#/components/schemas/Dimensions', description: 'Only location, batch, serial, config, size, color, style' }
              unit: { type: string, pattern: '^[A-Z0-9_-]{1,12}$' }
              qty: { $ref: '#/components/schemas/Decimal', description: 'Positive, at most 6 decimals; 1 for a serial' }
              consignmentPrice: { $ref: '#/components/schemas/Decimal', description: 'Non-negative, default 0' }
    ReceiveConsignmentRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        receiptDate: { type: string, format: date, description: Defaults to today (UTC) }
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [lineId, qty]
            properties:
              lineId: { type: string, format: uuid }
              qty: { $ref: '#/components/schemas/Decimal' }
    ConsignmentLine:
      type: object
      required: [id, lineNo, productId, dimensions, unit, qty, receivedQty, openQty, consignmentPrice]
      properties:
        id: { type: string, format: uuid }
        lineNo: { type: integer }
        productId: { type: string, format: uuid }
        dimensions: { $ref: '#/components/schemas/Dimensions', description: 'The vendor-owned dimension set received into (site, warehouse and owner included)' }
        unit: { type: string }
        qty: { $ref: '#/components/schemas/Decimal' }
        receivedQty: { $ref: '#/components/schemas/Decimal' }
        openQty: { $ref: '#/components/schemas/Decimal' }
        consignmentPrice: { $ref: '#/components/schemas/Decimal' }
    ConsignmentOrder:
      type: object
      required: [id, legalEntityId, number, vendorId, siteId, warehouseId, requestedDate, currency, status, version, createdAt, lines]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        number: { type: string, description: CRO- plus 12 hex digits }
        vendorId: { type: string }
        siteId: { type: string }
        warehouseId: { type: string }
        requestedDate: { type: string, format: date }
        currency: { type: string }
        status: { $ref: '#/components/schemas/ConsignmentStatus' }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ConsignmentLine' }
    ConsignmentStockItem:
      type: object
      required: [legalEntityId, vendorId, productId, dimensions, qty, consignmentPrice, statisticalValue, oldestReceipt, ageDays]
      properties:
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string }
        productId: { type: string, format: uuid }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        qty: { $ref: '#/components/schemas/Decimal' }
        consignmentPrice: { type: [string, 'null'] }
        currency: { type: string }
        statisticalValue: { type: [string, 'null'], description: 'qty x consignmentPrice, rounded to the currency minor unit; not posted' }
        oldestReceipt: { type: [string, 'null'], format: date }
        ageDays: { type: [integer, 'null'] }
    CountTagStatus:
      type: string
      enum: [OPEN, USED, VOID, MISSING]
    CountTag:
      type: object
      required: [id, tagNumber, planId, status, dimensions, countedQty, version]
      properties:
        id: { type: string, format: uuid }
        tagNumber: { type: string, description: 'TAG- number from the legal entity sequence' }
        planId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/CountTagStatus' }
        productId: { type: string, format: uuid }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        countedQty: { type: [string, 'null'], description: Counted quantity of a USED tag (zero is a count); null while open }
        countedBy: { type: string }
        sheetId: { type: string, format: uuid, description: Count sheet the tag was transferred to; the tag is then final }
        version: { type: integer }
    CountTagList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CountTag' }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: 'https://passage.dev/problems/INV-NEG-001' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, example: INV-NEG-001 }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
