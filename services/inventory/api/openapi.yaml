        - { name: productId, in: query, schema: { type: string, format: uuid }, description: Product }
        - { name: siteId, in: query, schema: { type: string }, description: Site dimension }
        - { name: warehouseId, in: query, schema: { type: string }, description: Warehouse dimension }
      responses:
        '200':
          description: Rows with negative physical stock
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/NegativeOnHandLine' }
                  truncated: { type: boolean, description: More than 1,000 rows matched }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/inventory/reports/tracking-trace:
    get:
      operationId: traceTrackingDimension
      summary: Batch and serial trace through time (3.16.14)
      description: |
        Every inventory transaction that carries the batch or serial, oldest physical date first, at most
        1,000, with its origin document. One of batchId and serialId is required (INV-TRC-001 with field
        errors otherwise). direction FORWARD lists the issues (where the stock went), BACKWARD the receipts
        (where it came from), BOTH (the default) every movement. With BOTH each movement that changes
        physical stock carries running, the traced physical balance of its legal entity and product after it.
      x-passage-duty: inventory.read
      parameters:
        - { name: batchId, in: query, schema: { type: string }, description: Batch to trace }
        - { name: serialId, in: query, schema: { type: string }, description: Serial number to trace }
        - { name: productId, in: query, schema: { type: string, format: uuid }, description: Restrict to one product }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid }, description: Legal entity }
        - { name: direction, in: query, schema: { type: string, enum: [BOTH, FORWARD, BACKWARD], default: BOTH }, description: Which movements to list (case-insensitive) }
      responses:
        '200':
          description: Traced movements
          content:
            application/json:
              schema:
                type: object
                required: [items, direction, truncated]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TraceLine' }
                  direction: { type: string, enum: [BOTH, FORWARD, BACKWARD] }
                  truncated: { type: boolean, description: More than 1,000 movements matched }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/inventory/reports/dimension-combinations:
    get:
      operationId: listDimensionCombinations
      summary: Dimension combinations a product has used, with first and last use (3.16.14)
      description: |
        One row per product and dimension set that has inventory transactions, ordered by product and first
        use, at most 1,000. activeDimensions names the dimensions the set carries.
      x-passage-duty: inventory.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid }, description: Legal entity }
        - { name: productId, in: query, schema: { type: string, format: uuid }, description: Product }
      responses:
        '200':
          description: Dimension combinations
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DimensionCombination' }
                  truncated: { type: boolean, description: More than 1,000 combinations matched }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/inventory/abc-runs:
    post:
      operationId: runAbcClassification
      summary: Classify a legal entity's products per site by on-hand value (FR-16.19)
      description: |
        Ranks product x site by posted on-hand value and assigns A, B and C by cumulative
        percentage (default 80 / 15 / 5; they must sum to 100, INV-ABC-001). An item whose
        cumulative share before it is at or below a boundary takes the higher class (BR-16.16);
        zero-value items take zeroClass (C, or N for not classified). Runs are immutable. Only
        criterion VALUE is available. A repeated Idempotency-Key returns the stored run (200); with a
        different body it is idempotency_key_reuse (422).
      x-passage-duty: inventory.abc.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AbcRunRequest' }
      responses:
        '201':
          description: Run stored with its items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbcRun' }
        '200':
          description: Idempotent replay
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbcRun' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listAbcRuns
      summary: Latest ABC runs, newest first, with class counts and no items (at most 100)
      x-passage-duty: inventory.read
      responses:
        '200':
          description: ABC runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AbcRun' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/inventory/abc-runs/{id}:
    get:
      operationId: getAbcRun
      summary: Read an ABC run with its items, highest value first (ABC classification report)
      x-passage-duty: inventory.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: ABC run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbcRun' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/inventory/reconciliations:
    post:
      operationId: runInventoryReconciliation
      summary: Run the inventory-to-ledger reconciliation for a legal entity now (FR-16.12)
      description: |
        Compares the inventory value (sum of on-hand posted value of the legal entity in the
        currency) with the ledger balance (debit minus credit) of the configured inventory
        account, both rounded to the currency's minor unit. Without ledgerBalance the ledger side
        is the net of the inventory account over the GL entries of the POSTED inventory journals
        (GL_JOURNALS); with it, the balance read from the wave 11 ledger, which also carries
        manual journals (LEDGER_OVERRIDE, AC-16.9). The run also counts the on-hand rows with
        negative physical stock (FR-16.4). The run date is today (UTC); a re-run on the same day
        recomputes and overwrites that day's row (the run id stays), so no Idempotency-Key is
        needed. A non-zero difference publishes dev.passage.inventory.reconciliation.diff.v1 in the
        same transaction. 422 INV-JNL-005 when no inventory account is configured; 403 AUTH-0003
        for a legal entity outside the caller's scope.
      x-passage-duty: inventory.admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, currency]
              additionalProperties: false
              properties:
                legalEntityId: { type: string, format: uuid }
                currency: { type: string, pattern: '^[A-Z]{3}$', description: Accounting currency (ISO 4217 alpha-3) }
                ledgerBalance: { type: [string, 'null'], description: 'Decimal string, at most 6 decimals: the inventory account balance from the ledger; replaces the GL-derived balance' }
      responses:
        '200':
          description: The run as stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reconciliation' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listInventoryReconciliations
      summary: Reconciliation runs, newest run date first (at most 200); the inventory-to-ledger reconciliation report
      x-passage-duty: inventory.read
      parameters:
        - { name: legalEntityId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [MATCHED, DIFFERENCE] } }
      responses:
        '200':
          description: Reconciliation runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Reconciliation' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/inventory/reconciliations/{id}:
    get:
      operationId: getInventoryReconciliation
      summary: Read one reconciliation run (404 INV-REC-001 when unknown or outside the caller's scope)
      x-passage-duty: inventory.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Reconciliation run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reconciliation' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/inventory/journals/{id}:reverse:
    post:
      operationId: reverseInventoryJournal
      summary: Create the DRAFT reversal of a POSTED journal (BR-16.12)
      description: |
        The reversal has the original's type, legal entity, offset account and currency, and one
        line per original line with negated quantities, each linked to the line it reverses
        (reversesLineId). The original is never changed. Post the reversal with :post (duty
        inventory.journal.post and If-Match): each line is then valued at the negated value of
        the transaction it corrects, its transaction carries correctsTransactionId, and the GL
        entry mirrors the original. The negative-stock policy applies, so stock already issued
        cannot be reversed out (INV-NEG-001). A reversal takes no extra lines. A journal has one
        reversal: repeating the request returns it (200, Idempotent-Replayed). 409 INV-JNL-004
        when the journal is not POSTED.
      x-passage-duty: inventory.journal.write
      parameters:
        - $ref: '#/components/parameters/JournalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [postingDate]
              properties:
                postingDate: { type: string, format: date, description: Posting date of the reversal }
      responses:
        '201':
          description: Reversal created (DRAFT)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '200':
          description: The journal's existing reversal
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/inventory/count-plans/{id}:generate-tags:
    post:
      operationId: generateInventoryCountTags
      summary: Generate a range of pre-numbered OPEN count tags for a plan (FR-16.18)
      description: |
        Numbers come from the legal entity's TAG- sequence (TAG-000001, ...), so a tag number is
        used once (BR-16.15). The Idempotency-Key makes a retry return the same range; the same key
        for another plan or count is idempotency_key_reuse.
      x-passage-duty: inventory.count.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [count]
              properties:
                count: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '201':
          description: Tags generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountTagList' }
        '200':
          description: Idempotent replay
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountTagList' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/inventory/count-plans/{id}/tags:
    get:
      operationId: listInventoryCountTags
      summary: List a plan's count tags in number order, optionally of one status
      description: Lists the missing and void tags before a transfer (FR-16.18).
      x-passage-duty: inventory.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CountTagStatus' } }
      responses:
        '200':
          description: Tags of the plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountTagList' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/inventory/count-plans/{id}:transfer-tags:
    post:
      operationId: transferInventoryCountTags
      summary: Transfer the plan's USED tags to a new count sheet (FR-16.18, AC-16.13)
      description: |
        Aggregates the untransferred USED tags by product x dimension set into an OPEN count sheet:
        counted = the sum of the tags (a zero count is a count), expected = the book quantity now.
        The sheet is entered and posted like any count sheet, so the COUNT journal holds counted
        minus book at posting and the plan tolerance approval applies. Open tags block the
        transfer (INV-TAG-002) unless markOpenMissing, which marks them MISSING and needs the
        supervisor duty inventory.count.approve (403 INV-TAG-006 without it, BR-16.15). No used
        tag is INV-TAG-004. The Idempotency-Key makes a retry return the same sheet.
      x-passage-duty: inventory.count.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                markOpenMissing: { type: boolean, default: false }
      responses:
        '201':
          description: Count sheet created from the tags
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSheet' }
        '200':
          description: Idempotent replay
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSheet' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/inventory/count-tags/{id}:use:
    post:
      operationId: useInventoryCountTag
      summary: Enter the count of one OPEN tag
      description: |
        Records product, dimensions and counted quantity; the tag becomes USED. Requires If-Match
        with the tag version. A used tag is INV-TAG-001, a void, missing or transferred tag
        INV-TAG-003. site is mandatory (INV-DIM-001); a plan's warehouse is filled in when absent
        and another warehouse is refused; a serial counts 0 or 1 (INV-SER-002).
      x-passage-duty: inventory.count.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productId, countedQty]
              properties:
                productId: { type: string, format: uuid }
                dimensions: { $ref: '#/components/schemas/Dimensions' }
                countedQty: { $ref: '#/components/schemas/Decimal', description: Zero or more, up to 6 decimals }
      responses:
        '200':
          description: Tag counted
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountTag' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/inventory/count-tags/{id}:void:
    post:
      operationId: voidInventoryCountTag
      summary: Void an OPEN or USED tag that has not been transferred
      x-passage-duty: inventory.count.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Tag voided
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountTag' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/inventory/journals/{id}:validate:
    post:
      operationId: validateInventoryJournal
      summary: Dry-run the posting of a journal (FR-16.6)
      description: |
        Runs the posting of a DRAFT, SUBMITTED or APPROVED journal in a transaction that is always
        rolled back: the same line rules, offset account, negative-stock policy and vendor-owned
        quantity under the row locks, serial uniqueness and currency checks as :post, and nothing is
        written. 200 with valid=true when the post would succeed now; otherwise the problem the post
        would return (for example INV-NEG-001, INV-OWN-002, INV-SER-001). Any other status is
        INV-JNL-004 (409). The result holds for the stock at the time of the call.
        A row held by an unfinished sheet of a freezeStock count plan answers 409 INV-CNT-002.
      x-passage-duty: inventory.journal.write
      parameters:
        - $ref: '#/components/parameters/JournalId'
      responses:
        '200':
          description: The journal would post
          content:
            application/json:
              schema:
                type: object
                required: [valid, journalId, status, version, lineCount]
                properties:
                  valid: { type: boolean, enum: [true] }
                  journalId: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/JournalStatus' }
                  version: { type: integer }
                  lineCount: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/inventory/journals/{id}:submit:
    post:
      operationId: submitInventoryJournal
      summary: Submit a DRAFT journal for approval (BR-16.11)
      description: |
        DRAFT -> SUBMITTED. The line rules are checked again (a journal without lines or with an
        invalid line cannot be submitted). A SUBMITTED journal takes no lines and cannot be posted
        until approved. Any other status is INV-JNL-004 (409). Requires If-Match.
      x-passage-duty: inventory.journal.write
      parameters:
        - $ref: '#/components/parameters/JournalId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Journal after the step
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/inventory/journals/{id}:approve:
    post:
      operationId: approveInventoryJournal
      summary: Approve a SUBMITTED journal (BR-16.11)
      description: |
        SUBMITTED -> APPROVED, the approval task of InventoryJournalPost. An APPROVED journal is
        posted with :post. Any other status is INV-JNL-004 (409). Requires If-Match.
      x-passage-duty: inventory.journal.post
      parameters:
        - $ref: '#/components/parameters/JournalId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Journal after the step
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/inventory/journals/{id}:reject:
    post:
      operationId: rejectInventoryJournal
      summary: Reject a SUBMITTED journal (BR-16.11)
      description: |
        SUBMITTED -> REJECTED. A rejected journal is reopened to DRAFT (:reopen) or cancelled.
        Any other status is INV-JNL-004 (409). Requires If-Match.
      x-passage-duty: inventory.journal.post
      parameters:
        - $ref: '#/components/parameters/JournalId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Journal after the step
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/inventory/journals/{id}:reopen:
    post:
      operationId: reopenInventoryJournal
      summary: Reopen a REJECTED journal as DRAFT (BR-16.11)
      description: |
        REJECTED -> DRAFT, so lines can be corrected and the journal submitted again. Any other
        status is INV-JNL-004 (409). Requires If-Match.
      x-passage-duty: inventory.journal.write
      parameters:
        - $ref: '#/components/parameters/JournalId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Journal after the step
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/inventory/journals/{id}:cancel:
    post:
      operationId: cancelInventoryJournal
      summary: Cancel a DRAFT or REJECTED journal (BR-16.11)
      description: |
        DRAFT or REJECTED -> CANCELLED; nothing was posted, so nothing is reversed. A reversal
        draft cannot be cancelled (it is its original's one reversal). Any other status is
        INV-JNL-004 (409). Requires If-Match.
      x-passage-duty: inventory.journal.write
      parameters:
        - $ref: '#/components/parameters/JournalId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Journal after the step
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
