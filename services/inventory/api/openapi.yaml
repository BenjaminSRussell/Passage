  /v1/inventory/count-sheets/{id}:post:
    post:
      operationId: postInventoryCountSheet
      summary: Post the counted variances as a COUNT journal (FR-16.9, BR-16.8)
      description: |
        Variance = counted minus the book quantity at posting (read under the row lock). A variance
        above the plan tolerance (percent of book or value at the running average) needs a caller with
        inventory.count.approve; otherwise 403 INV-CNT-001 and nothing is written. Uncounted lines are
        skipped; a sheet with no counted line is INV-CNT-005. The COUNT journal posts like an
        ADJUSTMENT (inventory against the adjustment account) with the negative policy applied.
        Requires If-Match. Posting a POSTED sheet returns it unchanged. A sheet with an outstanding
        recount is refused (409 INV-CNT-006); a plan with fourEyes needs the sheet APPROVED first
        (409 INV-CNT-008); an APPROVED sheet posts its above-tolerance variances without the
        posting caller holding inventory.count.approve.
        Its COUNT journal is exempt from the sheet's own freeze but not from another unfinished freezeStock sheet on the same rows (409 INV-CNT-002). Emits countsheet.changed (POSTED).
      x-passage-duty: inventory.count.post
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Sheet posted (or already posted)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSheet' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/inventory/count-sheets/{id}:submit:
    post:
      operationId: submitInventoryCountSheet
      summary: Submit an OPEN count sheet for review (FR-16.9)
      description: |
        Closes counting: the sheet becomes COUNTED and takes no further entries. Needs at least one
        counted line (INV-CNT-005) and no outstanding recount (INV-CNT-006). Requires If-Match.
        Emits countsheet.changed (SUBMITTED).
      x-passage-duty: inventory.count.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Sheet after the action (or unchanged when it was already there)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSheet' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/inventory/count-sheets/{id}:approve:
    post:
      operationId: approveInventoryCountSheet
      summary: Approve a COUNTED count sheet (FR-16.9)
      description: |
        A supervisor accepts the counted quantities, including variances above tolerance, which then
        post without a further approval. On a four-eyes plan the approver must not be one of the
        counters (403 INV-CNT-007). Requires If-Match. Emits countsheet.changed (APPROVED).
      x-passage-duty: inventory.count.approve
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Sheet after the action (or unchanged when it was already there)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSheet' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/inventory/count-sheets/{id}:cancel:
    post:
      operationId: cancelInventoryCountSheet
      summary: Cancel an unposted count sheet and lift its freeze
      description: |
        A sheet that is OPEN, COUNTED or APPROVED becomes CANCELLED; a POSTED sheet cannot be
        cancelled. Requires If-Match. Emits countsheet.changed (CANCELLED).
      x-passage-duty: inventory.count.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Sheet after the action (or unchanged when it was already there)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSheet' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/inventory/count-sheets/{id}/lines/{lineId}:recount:
    post:
      operationId: requestInventoryCountRecount
      summary: Ask for one counted line to be counted again
      description: |
        A supervisor flags a counted line with a reason. The sheet returns to OPEN, any approval is
        cleared, and the line must be entered again before the sheet can be submitted or posted
        (INV-CNT-006). Requires If-Match. Emits countsheet.changed (RECOUNT_REQUESTED).
      x-passage-duty: inventory.count.approve
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Sheet after the action (or unchanged when it was already there)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSheet' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/inventory/transfer-orders:
    post:
      operationId: createTransferOrder
      summary: Create a transfer order (CREATED); nothing is posted until it ships (FR-16.15)
      description: |
        useTransit (default true) routes the order through transitWarehouseId, which is then
        required (INV-TRF-001); false makes a one-step transfer. Lines follow the journal line rules
        at the shipping warehouse: site required (INV-DIM-001), at most 6 decimals (INV-UOM-002),
        serial quantity 1 (INV-SER-002), owner and license_plate reserved; a warehouse dimension
        other than fromWarehouseId is rejected. toSiteId sets the receiving site when it differs
        from the lines' site. A repeated Idempotency-Key with the same body returns the stored order
        (200, Idempotent-Replayed: true); with a different body it is idempotency_key_reuse (422). A
        legal entity outside the caller's scope is AUTH-0003 (403).
      x-passage-duty: inventory.transfer.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransferRequest' }
      responses:
        '201':
          description: Transfer order created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOrder' }
        '200':
          description: Idempotent replay
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOrder' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listTransferOrders
      summary: Transfer orders with their lines, newest first (at most 200)
      x-passage-duty: inventory.read
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TransferStatus' } }
      responses:
        '200':
          description: Transfer orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TransferOrder' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/inventory/transfer-orders/{id}:
    get:
      operationId: getTransferOrder
      summary: Read a transfer order with its lines
      x-passage-duty: inventory.read
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Transfer order
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOrder' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/inventory/transfer-orders/{id}:ship:
    post:
      operationId: shipTransferOrder
      summary: Ship a CREATED order in full
      description: |
        Moves every line from the shipping warehouse to the transit warehouse (two-step) or to the
        receiving warehouse (one-step, which also receives and closes the lines) in one transaction:
        a SOLD issue valued at the source's running average and a PURCHASED receipt carrying the
        same value (BR-16.3), so there is no GL entry. Every on-hand row is locked in ascending order
        first. The shipping warehouse follows the negative-stock policy (INV-NEG-001). shipDate
        (default today) becomes the order's ship date and the transactions' date. Emits
        dev.passage.inventory.transfer.shipped.v1. Requires If-Match (428 when absent, 412 on
        mismatch); an order not CREATED is INV-TRF-006.
        A row held by an unfinished sheet of a freezeStock count plan is refused (409 INV-CNT-002).
      x-passage-duty: inventory.transfer.post
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                shipDate: { type: string, format: date }
      responses:
        '200':
          description: Order after shipment
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOrder' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/inventory/transfer-orders/{id}:receive:
    post:
      operationId: receiveTransferOrder
      summary: Book receipts against a shipped order
      description: |
        Each receipt moves its quantity from the transit warehouse to the receiving warehouse as a
        valued pair. A line closes when its shipped quantity is reached, or short with closeShort
        when the shortfall is within underdeliveryPct (INV-TRF-005 otherwise); the shortfall stays
        in transit for investigation. Receiving more than shipped plus overdeliveryPct is
        INV-TRF-002; an allowed over-delivery moves straight from the shipping warehouse and raises
        the line's shipped quantity. A closed line is INV-TRF-006, an unknown line INV-TRF-004.
        Emits dev.passage.inventory.transfer.received.v1. Requires If-Match.
        A row held by an unfinished sheet of a freezeStock count plan is refused (409 INV-CNT-002).
      x-passage-duty: inventory.transfer.post
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiveTransferRequest' }
      responses:
        '200':
          description: Order after the receipt
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOrder' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/inventory/transfer-orders/{id}:cancel:
    post:
      operationId: cancelTransferOrder
      summary: Cancel a CREATED order (BR-16.13)
      description: |
        Nothing has moved, so nothing is reversed. A shipped order with quantity in transit is
        INV-TRF-003; a received or cancelled order is INV-TRF-006. Requires If-Match.
      x-passage-duty: inventory.transfer.write
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Cancelled order
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOrder' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/inventory/transfers/in-transit:
    get:
      operationId: listStockInTransit
      summary: Stock in transit by transfer order line, oldest shipment first (FR-16.16, SAP MB5T)
      description: Two-step lines with shipped quantity not yet received, including lines closed short (closedShort, for investigation). At most 1,000 rows.
      x-passage-duty: inventory.read
      responses:
        '200':
          description: Lines in transit
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/InTransitItem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/inventory/transfer-order-lines:
    get:
      operationId: listTransferOrderLines
      summary: Transfer order line inquiry with late-shipment and late-receipt overview (FR-16.15)
      description: |
        Lines of every transfer order in the caller's legal entities, oldest planned or actual ship date
        first, at most 1,000 (truncated is true when more matched). from and to bound the ship date
        (inclusive). A line is late once its due date is before asOf: a line of an order still CREATED is
        due on its planned ship date (LATE_SHIPMENT); a line of a SHIPPED or PARTIALLY_RECEIVED order with
        quantity still in transit and not closed short is due lateReceiptDays after its ship date
        (LATE_RECEIPT). daysLate counts the days past the due date and is 0 for a line on time. With
        late=true only late lines are returned.
      x-passage-duty: inventory.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid }, description: Legal entity owning the order }
        - { name: status, in: query, schema: { type: string, enum: [CREATED, SHIPPED, PARTIALLY_RECEIVED, RECEIVED, CANCELLED] }, description: Order status }
        - { name: productId, in: query, schema: { type: string, format: uuid }, description: Product }
        - { name: fromWarehouseId, in: query, schema: { type: string }, description: Shipping warehouse }
        - { name: toWarehouseId, in: query, schema: { type: string }, description: Receiving warehouse }
        - { name: from, in: query, schema: { type: string, format: date }, description: Earliest planned or actual ship date }
        - { name: to, in: query, schema: { type: string, format: date }, description: Latest planned or actual ship date; not before from }
        - { name: late, in: query, schema: { type: boolean }, description: Return only late lines }
        - { name: lateReceiptDays, in: query, schema: { type: integer, minimum: 0, maximum: 3650, default: 7 }, description: Days a shipment may stay in transit before its receipt is late }
        - { name: asOf, in: query, schema: { type: string, format: date }, description: Date lateness is measured at (default today, UTC) }
      responses:
        '200':
          description: Transfer order lines
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TransferLineInquiryItem' }
                  truncated: { type: boolean, description: More than 1,000 lines matched; narrow the filters to see the rest }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/inventory/reports/count-variance:
    get:
      operationId: getCountVarianceReport
      summary: Count variance report by plan, sheet, warehouse, date and counter (3.16.14)
      description: |
        Counted lines of cycle count sheets that are not CANCELLED, newest count first, at most 1,000
        (truncated is true when more matched). varianceQty is the posted variance once the sheet is POSTED
        (measured against the book at posting, BR-16.8) and counted minus expected before that.
        varianceValue is varianceQty times unitCost: for a posted sheet the cost of the COUNT journal line
        (valueBasis JOURNAL), otherwise the running average of the on-hand row today rounded to 6 decimals
        as posting rounds it (valueBasis ESTIMATE). totalsByCounter sums gain, loss and net value
        per counter and currency over the returned lines. from and to bound the day the line was counted (UTC).
      x-passage-duty: inventory.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid }, description: Legal entity owning the sheet }
        - { name: planId, in: query, schema: { type: string, format: uuid }, description: Count plan }
        - { name: sheetId, in: query, schema: { type: string, format: uuid }, description: Count sheet }
        - { name: warehouseId, in: query, schema: { type: string }, description: Warehouse of the plan or of the counted stock }
        - { name: counter, in: query, schema: { type: string }, description: User who entered the count }
        - { name: from, in: query, schema: { type: string, format: date }, description: Earliest count day }
        - { name: to, in: query, schema: { type: string, format: date }, description: Latest count day; not before from }
      responses:
        '200':
          description: Variance lines with totals per counter
          content:
            application/json:
              schema:
                type: object
                required: [items, totalsByCounter, truncated]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CountVarianceLine' }
                  totalsByCounter:
                    type: array
                    items: { $ref: '#/components/schemas/CountVarianceTotals' }
                  truncated: { type: boolean, description: More than 1,000 lines matched; narrow the filters to see the rest }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/inventory/reports/negative-onhand:
    get:
      operationId: listNegativeOnHand
      summary: Negative on-hand list with shortfall and first negative date (3.16.14)
      description: |
        Projection rows whose physical stock (posted + received + registered - deducted - picked) is below
        zero, largest shortfall first, at most 1,000. firstNegativeDate is the first physical date of the
