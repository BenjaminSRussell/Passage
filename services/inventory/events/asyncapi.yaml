asyncapi: 3.0.0
info:
  title: Passage Inventory events
  version: 0.16.7
  description: |
    Published through the transactional outbox in the same database transaction as the
    posting, relayed by Debezium. CloudEvents 1.0 envelope (tenantid, correlationid,
    causationid, traceparent, actor, sequence, dataschema). Additive-only evolution.
defaultContentType: application/json
channels:
  transactionPosted:
    address: passage.inventory.transaction
    messages:
      transactionPosted:
        $ref: '#/components/messages/TransactionPosted'
  onhandChanged:
    address: passage.inventory.onhand
    messages:
      onhandChanged:
        $ref: '#/components/messages/OnhandChanged'
  journalPosted:
    address: passage.inventory.journal
    messages:
      journalPosted:
        $ref: '#/components/messages/JournalPosted'
  reservation:
    address: passage.inventory.reservation
    messages:
      reservationCreated:
        $ref: '#/components/messages/ReservationCreated'
      reservationReleased:
        $ref: '#/components/messages/ReservationReleased'
  blocking:
    address: passage.inventory.blocking
    messages:
      blockingCreated:
        $ref: '#/components/messages/BlockingCreated'
      blockingReleased:
        $ref: '#/components/messages/BlockingReleased'
  transfer:
    address: passage.inventory.transfer
    messages:
      transferShipped:
        $ref: '#/components/messages/TransferShipped'
      transferReceived:
        $ref: '#/components/messages/TransferReceived'
  ownershipChanged:
    address: passage.inventory.ownership
    messages:
      ownershipChanged:
        $ref: '#/components/messages/OwnershipChanged'
  reconciliationDiff:
    address: passage.inventory.reconciliation
    messages:
      reconciliationDiff:
        $ref: '#/components/messages/ReconciliationDiff'
operations:
  publishTransactionPosted:
    action: send
    channel: { $ref: '#/channels/transactionPosted' }
    summary: One inventory transaction inserted by a posting or registration, or moved to a new status (transactions:apply, Unpick, Unregister, CancelReservation)
  publishOnhandChanged:
    action: send
    channel: { $ref: '#/channels/onhandChanged' }
    summary: On-hand projection row changed by a posting, a reservation or a status change
  publishJournalPosted:
    action: send
    channel: { $ref: '#/channels/journalPosted' }
    summary: Journal reached POSTED with its balanced GL lines (a posted count sheet posts a COUNT journal)
  publishReservation:
    action: send
    channel: { $ref: '#/channels/reservation' }
    summary: One reservation allocation was created or released (FR-16.7)
  publishBlocking:
    action: send
    channel: { $ref: '#/channels/blocking' }
    summary: Stock was blocked or quarantined, or a blocking was released (FR-16.8)
  publishTransfer:
    action: send
    channel: { $ref: '#/channels/transfer' }
    summary: A transfer order was shipped, or a receipt was booked against it (FR-16.15)
  publishOwnershipChanged:
    action: send
    channel: { $ref: '#/channels/ownershipChanged' }
    summary: An OWNERSHIP_CHANGE journal posted, moving vendor-owned stock to the legal entity (FR-16.17); wave 18 settles it
  publishReconciliationDiff:
    action: send
    channel: { $ref: '#/channels/reconciliationDiff' }
    summary: A daily inventory-to-ledger run found a non-zero difference (FR-16.12, AC-16.9); a matched run publishes nothing, a same-day re-run that still differs publishes again for the same run id
components:
  messages:
    TransactionPosted:
      name: dev.passage.inventory.transaction.posted.v1
      x-passage-type: dev.passage.inventory.transaction.posted.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TransactionPostedData'
    OnhandChanged:
      name: dev.passage.inventory.onhand.changed.v1
      x-passage-type: dev.passage.inventory.onhand.changed.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OnhandChangedData'
    JournalPosted:
      name: dev.passage.inventory.journal.posted.v1
      x-passage-type: dev.passage.inventory.journal.posted.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/JournalPostedData'
    ReservationCreated:
      name: dev.passage.inventory.reservation.created.v1
      x-passage-type: dev.passage.inventory.reservation.created.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReservationData'
    ReservationReleased:
      name: dev.passage.inventory.reservation.released.v1
      x-passage-type: dev.passage.inventory.reservation.released.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReservationData'
    BlockingCreated:
      name: dev.passage.inventory.blocking.created.v1
      x-passage-type: dev.passage.inventory.blocking.created.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BlockingData'
    BlockingReleased:
      name: dev.passage.inventory.blocking.released.v1
      x-passage-type: dev.passage.inventory.blocking.released.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BlockingData'
    TransferShipped:
      name: dev.passage.inventory.transfer.shipped.v1
      x-passage-type: dev.passage.inventory.transfer.shipped.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TransferData'
    TransferReceived:
      name: dev.passage.inventory.transfer.received.v1
      x-passage-type: dev.passage.inventory.transfer.received.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TransferData'
    OwnershipChanged:
      name: dev.passage.inventory.ownership.changed.v1
      x-passage-type: dev.passage.inventory.ownership.changed.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OwnershipChangedData'
    ReconciliationDiff:
      name: dev.passage.inventory.reconciliation.diff.v1
      x-passage-type: dev.passage.inventory.reconciliation.diff.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReconciliationDiffData'
  schemas:
    OwnershipChangedData:
      type: object
      required: [journalId, legalEntityId, vendorId, postingDate, currency, totalAmount, ledgerEntryId, lines]
      description: |
        Emitted in the posting transaction of an OWNERSHIP_CHANGE journal, after journal.posted. The
        journal's GL entry is Dr inventory / Cr consignment accrual for totalAmount. One vendor per
        journal; wave 18 (FR-18.16) creates the consignment settlement invoice from it.
      properties:
        journalId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, description: The vendor (owner) the stock was taken from }
        postingDate: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        totalAmount: { type: string, description: Sum of the line amounts }
        ledgerEntryId: { type: [string, 'null'], format: uuid, description: Null until the wave 11 ledger Post exists }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OwnershipLineData' }
    OwnershipLineData:
      type: object
      required: [journalLineId, productId, dimensionSet, qty, unit, consignmentPrice, amountAcct]
      properties:
        journalLineId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensionSet: { type: object, additionalProperties: { type: string }, description: The dimensions the stock now has (legal-entity owned; the owner key removed) }
        qty: { type: string }
        unit: { type: string }
        consignmentPrice: { type: string }
        amountAcct: { type: string, description: 'qty x consignmentPrice in currency, rounded to its minor unit' }
    TransferData:
      type: object
      required: [transferOrderId, legalEntityId, number, status, fromWarehouse, toWarehouse, transitWarehouse, shipDate, receiptDate, lines]
      description: |
        Lines are the lines this event moved; qty is the quantity moved on the line by this event,
        shippedQty and receivedQty the line totals after it. Each movement is also a valued SOLD /
        PURCHASED transaction pair (sourceType TRANSFER_LINE) with no GL effect.
      properties:
        transferOrderId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        number: { type: string }
        status: { type: string, enum: [CREATED, SHIPPED, PARTIALLY_RECEIVED, RECEIVED, CANCELLED], description: Order status after the event }
        fromWarehouse: { type: string }
        toWarehouse: { type: string }
        transitWarehouse: { type: [string, 'null'], description: Null for a one-step transfer }
        shipDate: { type: string, format: date }
        receiptDate: { type: [string, 'null'], format: date, description: Date of this receipt; the ship date of a one-step shipment; null on a two-step shipment }
        lines:
          type: array
          items:
            type: object
            required: [lineId, productId, dimensionSet, unit, qty, shippedQty, receivedQty, closed]
            properties:
              lineId: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              dimensionSet: { type: object, additionalProperties: { type: string }, description: Source dimensions (shipping warehouse) }
              unit: { type: string }
              qty: { type: string }
              shippedQty: { type: string }
              receivedQty: { type: string }
              closed: { type: boolean }
    TransactionPostedData:
      type: object
      required: [transactionId, legalEntityId, sourceType, journalId, referenceId, originId, productId, dimensionSet, qty, issueStatus, receiptStatus, physicalDate, financialDate, currency, costAmountPhysical, costAmountPosted, correctsTransactionId, statusChangeId, previousStatus]
      properties:
        transactionId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        sourceType: { type: string, enum: [INVENT_JOURNAL_LINE, BLOCKING, TRANSFER_LINE, CONSIGNMENT_LINE, OWNERSHIP_CHANGE, PURCH_LINE, RECEIPT_LINE, SALES_LINE, PROD_LINE], description: 'Origin type of the transaction; OWNERSHIP_CHANGE is the receipt leg of an ownership-change line; PURCH_LINE, RECEIPT_LINE, SALES_LINE and PROD_LINE are registered by other services through transactions:apply' }
        journalId: { type: [string, 'null'], format: uuid, description: 'Inventory journal of a journal line (both legs of an ownership change); null for other origins' }
        referenceId: { type: [string, 'null'], description: 'Source document of a non-journal origin: the blocking, transfer or replenishment order id, or the document reference a caller of transactions:apply gave; null for journal lines' }
        originId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensionSet: { type: object, additionalProperties: { type: string } }
        qty: { type: string, description: Signed quantity; negative for issues }
        issueStatus: { type: [string, 'null'], enum: [ON_ORDER, RESERVED_ORDERED, RESERVED_PHYSICAL, PICKED, DEDUCTED, SOLD, null], description: 'Set for issues; journals, blocking and transfer legs post SOLD; the vendor-owned leg of an ownership change DEDUCTED; transactions:apply and the named backward commands any status' }
        receiptStatus: { type: [string, 'null'], enum: [ORDERED, ARRIVED, REGISTERED, RECEIVED, PURCHASED, null], description: 'Set for receipts; journals, blocking and transfer legs post PURCHASED; vendor-owned consignment receipts RECEIVED; transactions:apply and the named backward commands any status' }
        physicalDate: { type: string, format: date }
        financialDate: { type: [string, 'null'], format: date, description: 'Null until the transaction reaches a financial status (SOLD, PURCHASED): the value is recognised only there (FR-16.11)' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        costAmountPhysical: { type: string, description: Signed value in currency, rounded to its minor unit }
        costAmountPosted: { type: [string, 'null'], description: Null for a physical status }
        correctsTransactionId: { type: [string, 'null'], format: uuid, description: 'Transaction a reversal line negates (BR-16.12, FR-16.1 corrects_transaction_id); null otherwise' }
        statusChangeId: { type: [string, 'null'], format: uuid, description: 'Status-change audit row of a registration or status move through transactions:apply or a named backward command (Unpick, Unregister, CancelReservation); null for document postings' }
        previousStatus: { type: [string, 'null'], enum: [ON_ORDER, RESERVED_ORDERED, RESERVED_PHYSICAL, PICKED, DEDUCTED, SOLD, ORDERED, ARRIVED, REGISTERED, RECEIVED, PURCHASED, null], description: 'Status the transaction left on a status change; null when the event reports an insert' }
    OnhandChangedData:
      type: object
      required: [legalEntityId, productId, dimensionSet, availPhysical, availOrdered, physicalInvent, deltaBucket, deltaQty]
      properties:
        legalEntityId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensionSet: { type: object, additionalProperties: { type: string } }
        availPhysical: { type: string }
        availOrdered: { type: string }
        physicalInvent: { type: string }
        deltaBucket: { type: string, enum: [POSTED, ON_ORDER, RESERVED_ORDERED, RESERVED_PHYSICAL, PICKED, DEDUCTED, ORDERED, ARRIVED, REGISTERED, RECEIVED], description: 'Projection bucket the change moved: POSTED for journals, blocking and transfer legs, RESERVED_PHYSICAL for reservations, RECEIVED for vendor-owned consignment receipts, DEDUCTED for the vendor-owned leg of an ownership change; for a registration or status move (transactions:apply, named backward commands) the bucket of the status reached, POSTED for SOLD / PURCHASED' }
        deltaQty: { type: string, description: Net signed quantity change of that bucket }
    JournalPostedData:
      type: object
      required: [journalId, legalEntityId, journalType, postingDate, currency, lineCount, glLines, ledgerEntryId, reversesJournalId]
      properties:
        journalId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        journalType: { type: string, enum: [MOVEMENT, ADJUSTMENT, OPENING_BALANCE, COUNT, OWNERSHIP_CHANGE] }
        postingDate: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        lineCount: { type: integer }
        glLines:
          type: array
          items:
            type: object
            required: [account, debit, credit]
            properties:
              account: { type: string }
              debit: { type: string }
              credit: { type: string }
        ledgerEntryId: { type: [string, 'null'], format: uuid, description: Null until the wave 11 ledger Post exists }
        reversesJournalId: { type: [string, 'null'], format: uuid, description: 'The journal this one reverses (BR-16.12): same type, negated lines, each valued at the negated value of the transaction it corrects; null for other journals' }
    ReservationData:
      type: object
      required: [reservationId, legalEntityId, productId, dimensionSet, qty, demandType, demandId, demandSegment, policy, status]
      properties:
        reservationId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensionSet: { type: object, additionalProperties: { type: string }, description: Dimension set the allocation reserves }
        qty: { type: string, description: Reserved quantity of this allocation }
        demandType: { type: string, enum: [MANUAL, SALES_ORDER, PRODUCTION_ORDER, TRANSFER_ORDER] }
        demandId: { type: string }
        demandSegment: { type: string, description: 'Segment of the demand (SALES_ORDER:<ref> or PROJECT:<ref>); empty when unsegmented (FR-16.20)' }
        policy: { type: string, enum: [MANUAL, FIFO, FEFO, LIFO] }
        status: { type: string, enum: [ACTIVE, RELEASED, CONSUMED] }
    BlockingData:
      type: object
      required: [blockingId, legalEntityId, productId, dimensionSet, qty, targetStatus, reason, state, disposition]
      properties:
        blockingId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensionSet: { type: object, additionalProperties: { type: string }, description: Unrestricted source dimensions; blocked stock adds inventory_status = targetStatus }
        qty: { type: string }
        targetStatus: { type: string, enum: [BLOCKED, QUARANTINE] }
        reason: { type: string, enum: [QUALITY, DAMAGE, RECALL, LEGAL, OTHER] }
        state: { type: string, enum: [ACTIVE, RELEASED] }
        disposition: { type: [string, 'null'], enum: [RELEASE, SCRAP, RETURN, null] }
    ReconciliationDiffData:
      type: object
      required: [account, currency, diff, inventoryValue, ledgerBalance, ledgerSource, legalEntityId, negativeRows, runDate, runId]
      properties:
        runId: { type: string, format: uuid, description: The run row; one per legal entity, account, currency and run date }
        legalEntityId: { type: string, format: uuid }
        account: { type: string, description: Inventory posting account code }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        runDate: { type: string, format: date }
        inventoryValue: { type: string, description: Sum of on-hand posted value of the legal entity in the currency, rounded to the minor unit }
        ledgerBalance: { type: string, description: Net (debit minus credit) of the inventory account, rounded to the minor unit }
        diff: { type: string, description: Non-zero; inventoryValue minus ledgerBalance }
        ledgerSource: { type: string, enum: [GL_JOURNALS, LEDGER_OVERRIDE], description: GL_JOURNALS is the GL of the posted inventory journals; LEDGER_OVERRIDE a balance read from the wave 11 ledger }
        negativeRows: { type: integer, minimum: 0, description: On-hand rows of the legal entity with negative physical stock (FR-16.4) }
