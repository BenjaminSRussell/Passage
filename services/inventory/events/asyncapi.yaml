asyncapi: 3.0.0
info:
  title: Passage Inventory events
  version: 0.16.7
  description: |
    Published through the transactional outbox in the same database transaction as the
    posting, relayed by Debezium. CloudEvents 1.0 envelope (tenantid, correlationid,
    causationid, traceparent, actor, sequence, dataschema). Additive-only evolution.
defaultContentType: application/json
channels:
  transactionPosted:
    address: passage.inventory.transaction
    messages:
      transactionPosted:
        $ref: '#/components/messages/TransactionPosted'
  onhandChanged:
    address: passage.inventory.onhand
    messages:
      onhandChanged:
        $ref: '#/components/messages/OnhandChanged'
  journalPosted:
    address: passage.inventory.journal
    messages:
      journalPosted:
        $ref: '#/components/messages/JournalPosted'
  reservation:
    address: passage.inventory.reservation
    messages:
      reservationCreated:
        $ref: '#/components/messages/ReservationCreated'
      reservationReleased:
        $ref: '#/components/messages/ReservationReleased'
      reservationConverted:
        $ref: '#/components/messages/ReservationConverted'
  blocking:
    address: passage.inventory.blocking
    messages:
      blockingCreated:
        $ref: '#/components/messages/BlockingCreated'
      blockingReleased:
        $ref: '#/components/messages/BlockingReleased'
      blockingEscalated:
        $ref: '#/components/messages/BlockingEscalated'
  hold:
    address: passage.inventory.hold
    messages:
      holdPlaced:
        $ref: '#/components/messages/HoldPlaced'
      holdReleased:
        $ref: '#/components/messages/HoldReleased'
  transfer:
    address: passage.inventory.transfer
    messages:
      transferShipped:
        $ref: '#/components/messages/TransferShipped'
      transferReceived:
        $ref: '#/components/messages/TransferReceived'
      transferChanged:
        $ref: '#/components/messages/TransferChanged'
  ownershipChanged:
    address: passage.inventory.ownership
    messages:
      ownershipChanged:
        $ref: '#/components/messages/OwnershipChanged'
  consignmentClosed:
    address: passage.inventory.consignment
    messages:
      consignmentClosed:
        $ref: '#/components/messages/ConsignmentClosed'
  countSheet:
    address: passage.inventory.countsheet
    messages:
      countSheetChanged:
        $ref: '#/components/messages/CountSheetChanged'
  journalName:
    address: passage.inventory.journalname
    messages:
      journalNameCreated:
        $ref: '#/components/messages/JournalNameCreated'
      journalNameUpdated:
        $ref: '#/components/messages/JournalNameUpdated'
  reconciliationDiff:
    address: passage.inventory.reconciliation
    messages:
      reconciliationDiff:
        $ref: '#/components/messages/ReconciliationDiff'
  # Consumed by the postings consumer (#480, `inventory consume`, group and service principal inventory-postings,
  # dead-letter topic passage.inventory.postings.dlq). The payloads are the producers' (their asyncapi.yaml); the
  # shared fixtures in testdata/catchweight-flow are checked against both sides.
  receivingReceipt:
    address: passage.receiving.receipt
    messages:
      receiptPosted:
        $ref: '#/components/messages/ReceiptPostedConsumed'
      receiptCorrected:
        $ref: '#/components/messages/ReceiptCorrectedConsumed'
  salesOrderProgress:
    address: passage.sales.orderprogress
    messages:
      orderProgressRecorded:
        $ref: '#/components/messages/OrderProgressRecordedConsumed'
  fulfillmentPackingSlip:
    address: passage.fulfillment.packingslip
    messages:
      packingSlipCancelled:
        $ref: '#/components/messages/PackingSlipCancelledConsumed'
  serviceWorkOrderCompleted:
    address: passage.service.workorder.completed
    messages:
      workOrderCompleted:
        $ref: '#/components/messages/WorkOrderCompletedConsumed'
operations:
  receiveReceiptPosted:
    action: receive
    channel: { $ref: '#/channels/receivingReceipt' }
    messages:
      - $ref: '#/channels/receivingReceipt/messages/receiptPosted'
    summary: Book each receipt line at RECEIVED (origin RECEIPT_LINE), in the product's inventory unit
  receiveReceiptCorrected:
    action: receive
    channel: { $ref: '#/channels/receivingReceipt' }
    messages:
      - $ref: '#/channels/receivingReceipt/messages/receiptCorrected'
    summary: Offset the booked receipt line by the correction delta, or by what it holds on a cancellation
  receiveOrderProgressRecorded:
    action: receive
    channel: { $ref: '#/channels/salesOrderProgress' }
    messages:
      - $ref: '#/channels/salesOrderProgress/messages/orderProgressRecorded'
    summary: Issue each DELIVERED line at DEDUCTED (origin SALES_LINE) at the row's running average
  receivePackingSlipCancelled:
    action: receive
    channel: { $ref: '#/channels/fulfillmentPackingSlip' }
    messages:
      - $ref: '#/channels/fulfillmentPackingSlip/messages/packingSlipCancelled'
    summary: Book the exact mirror of each delivery line booked for the cancelled slip
  receiveWorkOrderCompleted:
    action: receive
    channel: { $ref: '#/channels/serviceWorkOrderCompleted' }
    messages:
      - $ref: '#/channels/serviceWorkOrderCompleted/messages/workOrderCompleted'
    summary: Issue each consumed PART line from the technician's truck at DEDUCTED (origin SERVICE_LINE), then draft a replenishment transfer order when the truck is below its minimum (BR-45.7)
  publishTransactionPosted:
    action: send
    channel: { $ref: '#/channels/transactionPosted' }
    summary: One inventory transaction inserted by a posting or registration, or moved to a new status (transactions:apply, Unpick, Unregister, CancelReservation)
  publishOnhandChanged:
    action: send
    channel: { $ref: '#/channels/onhandChanged' }
    summary: On-hand projection row changed by a posting, a reservation or a status change
  publishJournalPosted:
    action: send
    channel: { $ref: '#/channels/journalPosted' }
    summary: Journal reached POSTED with its balanced GL lines (a posted count sheet posts a COUNT journal)
  publishReservation:
    action: send
    channel: { $ref: '#/channels/reservation' }
    summary: One reservation allocation was created or released (FR-16.7)
  publishBlocking:
    action: send
    channel: { $ref: '#/channels/blocking' }
    summary: Stock was blocked or quarantined, a quarantine was moved to blocked, or a blocking was released or scrapped (FR-16.8)
  publishHold:
    action: send
    channel: { $ref: '#/channels/hold' }
    summary: Stock was held out of availability, or all or part of a hold was released
  publishTransfer:
    action: send
    channel: { $ref: '#/channels/transfer' }
    summary: A transfer order was shipped, received, edited before shipment or cancelled (FR-16.15)
  publishOwnershipChanged:
    action: send
    channel: { $ref: '#/channels/ownershipChanged' }
    summary: An OWNERSHIP_CHANGE journal posted, moving vendor-owned stock to the legal entity (FR-16.17); wave 18 settles it
  publishConsignmentClosed:
    action: send
    channel: { $ref: '#/channels/consignmentClosed' }
    summary: A vendor replenishment order was closed short or cancelled; it takes no further receipt (FR-16.17)
  publishCountSheetChanged:
    action: send
    channel: { $ref: '#/channels/countSheet' }
    summary: A count sheet was submitted for review, approved, had a recount requested (by a supervisor, or by a movement of a counted row on a plan without a freeze, BR-16.8), was cancelled or was posted (FR-16.9); POSTED and CANCELLED lift the stock freeze
  publishJournalName:
    action: send
    channel: { $ref: '#/channels/journalName' }
    summary: A journal name was created or changed (PRD 3.16.13); consumers refresh their copy of the approval rule
  publishReconciliationDiff:
    action: send
    channel: { $ref: '#/channels/reconciliationDiff' }
    summary: A daily inventory-to-ledger run found a non-zero difference (FR-16.12, AC-16.9); a matched run publishes nothing, a same-day re-run that still differs publishes again for the same run id
components:
  messages:
    ReceiptPostedConsumed:
      name: dev.passage.receiving.receipt.posted.v1
      title: Receipt posted (consumed)
      summary: >-
        Receiving posted a receipt. Read: receipt_id, receipt_number, legal_entity_id, posting_date, currency and per line
        line_no, product_id, unit, qty, serials, inventory_status, amount, unit_price, site_id, warehouse_id, cw_qty. A
        catch-weight line books qty (the weight) and cw_qty; a plain line's qty is converted into the product's inventory
        unit by the product service and valued at amount (INV-PST-001 no conversion, INV-PST-002 none configured).
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/ConsumedPayload' }
    ReceiptCorrectedConsumed:
      name: dev.passage.receiving.receipt.corrected.v1
      title: Receipt corrected (consumed)
      summary: >-
        Receiving corrected (CORRECTION) or cancelled (CANCELLATION) a posted receipt. Read: receipt_id, receipt_number,
        legal_entity_id, posting_date, kind, correction_seq and per line line_no, product_id, qty_delta, cw_qty_delta. The
        booked line gives product, dimensions, unit factor and cost (INV-PST-003 not booked, INV-PST-004 mismatch).
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/ConsumedPayload' }
    OrderProgressRecordedConsumed:
      name: dev.passage.sales.orderprogress.recorded.v1
      title: Order progress recorded (consumed)
      summary: >-
        Sales recorded a delivery or invoice report; only DELIVERED moves stock. Read: progress_id, order_id,
        legal_entity_id, kind, source_ref, currency and per line line_id, line_no, quantity, product_id, unit, site_id,
        warehouse_id, reported_weight.
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/ConsumedPayload' }
    PackingSlipCancelledConsumed:
      name: dev.passage.fulfillment.packingslip.cancelled.v1
      title: Packing slip cancelled (consumed)
      summary: >-
        Fulfillment cancelled a posted packing slip. Read: packing_slip_id, packing_slip_number, reversal_id, order_id,
        legal_entity_id, posting_date and per line order_line_id, qty. The delivery booked under the slip number gives
        quantity, cases and value; a delivery not booked yet is retried with back-off before the event is parked.
      contentType: application/json
      payload: { $ref: '#/components/schemas/ConsumedPayload' }
    WorkOrderCompletedConsumed:
      name: dev.passage.service.workorder.completed.v1
      title: Service work order completed (consumed)
      summary: >-
        Field service completed a work order. Read: workOrderId, number, legalEntityId, completedAt, currency, truck
        (siteId, warehouseId) and per line lineId, kind, consumedQty, productId, unit. A PART line with a product and a
        consumed quantity is issued from the truck; negative truck stock is refused (INV-NEG-001) unless
        INV_ALLOW_NEGATIVE_TRUCK is on, and a technician with no truck parks the event (INV-TRK-003).
      contentType: application/cloudevents+json
      payload: { $ref: '#/components/schemas/ConsumedPayload' }
    TransactionPosted:
      title: Inventory transaction posted
      summary: An inventory transaction was registered or moved to a new status; carries the dimension, quantity and posted value.
      name: dev.passage.inventory.transaction.posted.v1
      x-passage-type: dev.passage.inventory.transaction.posted.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TransactionPostedData'
    OnhandChanged:
      title: On-hand changed
      summary: The on-hand projection of one dimension combination changed.
      name: dev.passage.inventory.onhand.changed.v1
      x-passage-type: dev.passage.inventory.onhand.changed.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OnhandChangedData'
    JournalPosted:
      title: Inventory journal posted
      summary: An inventory journal was posted and its lines became ledger transactions.
      name: dev.passage.inventory.journal.posted.v1
      x-passage-type: dev.passage.inventory.journal.posted.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/JournalPostedData'
    ReservationCreated:
      title: Reservation created
      summary: Stock was reserved against a dimension combination.
      name: dev.passage.inventory.reservation.created.v1
      x-passage-type: dev.passage.inventory.reservation.created.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReservationData'
    ReservationReleased:
      title: Reservation released
      summary: A reservation was released and its quantity returned to available.
      name: dev.passage.inventory.reservation.released.v1
      x-passage-type: dev.passage.inventory.reservation.released.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReservationData'
    ReservationConverted:
      title: Reservation converted
      summary: A reservation against an expected receipt became a physical reservation because the receipt arrived.
      name: dev.passage.inventory.reservation.converted.v1
      x-passage-type: dev.passage.inventory.reservation.converted.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReservationData'
    BlockingCreated:
      title: Blocking created
      summary: A quantity was blocked or quarantined with a reason.
      name: dev.passage.inventory.blocking.created.v1
      x-passage-type: dev.passage.inventory.blocking.created.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BlockingData'
    BlockingReleased:
      title: Blocking released
      summary: A blocking was released back to a usable inventory status.
      name: dev.passage.inventory.blocking.released.v1
      x-passage-type: dev.passage.inventory.blocking.released.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BlockingData'
    BlockingEscalated:
      title: Quarantine moved to blocked
      summary: An active quarantine was moved to the BLOCKED inventory status (QUARANTINE to BLOCKED transition); targetStatus is BLOCKED.
      name: dev.passage.inventory.blocking.escalated.v1
      x-passage-type: dev.passage.inventory.blocking.escalated.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BlockingData'
    HoldPlaced:
      title: Hold placed
      summary: A quantity was held out of availability for a reason and a source document.
      name: dev.passage.inventory.hold.placed.v1
      x-passage-type: dev.passage.inventory.hold.placed.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/HoldData'
    HoldReleased:
      title: Hold released
      summary: All or part of a hold was released back to availability; state RELEASED when nothing remains held.
      name: dev.passage.inventory.hold.released.v1
      x-passage-type: dev.passage.inventory.hold.released.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/HoldData'
    JournalNameCreated:
      title: Journal name created
      summary: A journal name was created for a legal entity.
      name: dev.passage.inventory.journalname.created.v1
      x-passage-type: dev.passage.inventory.journalname.created.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/JournalNameData'
    JournalNameUpdated:
      title: Journal name updated
      summary: The description, approval rule, offset account or active flag of a journal name changed.
      name: dev.passage.inventory.journalname.updated.v1
      x-passage-type: dev.passage.inventory.journalname.updated.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/JournalNameData'
    TransferShipped:
      title: Transfer shipped
      summary: A transfer order shipped and stock moved into the in-transit warehouse.
      name: dev.passage.inventory.transfer.shipped.v1
      x-passage-type: dev.passage.inventory.transfer.shipped.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TransferData'
    TransferReceived:
      title: Transfer received
      summary: A transfer order was received at the destination warehouse.
      name: dev.passage.inventory.transfer.received.v1
      x-passage-type: dev.passage.inventory.transfer.received.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TransferData'
    TransferChanged:
      title: Transfer changed
      summary: A CREATED transfer order was edited, confirmed from a draft, deleted (status DELETED) or an order was cancelled.
      name: dev.passage.inventory.transfer.changed.v1
      x-passage-type: dev.passage.inventory.transfer.changed.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TransferData'
    OwnershipChanged:
      title: Ownership changed
      summary: Vendor-owned consignment stock became legal-entity owned.
      name: dev.passage.inventory.ownership.changed.v1
      x-passage-type: dev.passage.inventory.ownership.changed.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OwnershipChangedData'
    ConsignmentClosed:
      title: Consignment order closed
      summary: A vendor replenishment order was closed (partly received, open quantity given up) or cancelled (nothing received).
      name: dev.passage.inventory.consignment.closed.v1
      x-passage-type: dev.passage.inventory.consignment.closed.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ConsignmentClosedData'
    CountSheetChanged:
      title: Count sheet changed
      summary: A count sheet moved through its review steps; the action names which one.
      name: dev.passage.inventory.countsheet.changed.v1
      x-passage-type: dev.passage.inventory.countsheet.changed.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CountSheetChangedData'
    ReconciliationDiff:
      title: Reconciliation difference
      summary: A daily inventory-to-ledger run found a non-zero difference.
      name: dev.passage.inventory.reconciliation.diff.v1
      x-passage-type: dev.passage.inventory.reconciliation.diff.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReconciliationDiffData'
  schemas:
    ConsumedPayload:
      type: object
      description: >-
        An event another service publishes; its schema is the producer's (services/receiving, services/sales and
        services/fulfillment events/asyncapi.yaml). Members the postings consumer does not read are ignored.
      additionalProperties: true
    OwnershipChangedData:
      type: object
      required: [journalId, legalEntityId, vendorId, postingDate, currency, totalAmount, ledgerEntryId, lines]
      description: |
        Emitted in the posting transaction of an OWNERSHIP_CHANGE journal, after journal.posted. The
        journal's GL entry is Dr inventory / Cr consignment accrual for totalAmount. One vendor per
        journal; wave 18 (FR-18.16) creates the consignment settlement invoice from it.
      properties:
        journalId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        vendorId: { type: string, description: The vendor (owner) the stock was taken from }
        postingDate: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        totalAmount: { type: string, description: Sum of the line amounts }
        ledgerEntryId: { type: [string, 'null'], format: uuid, description: Null until the wave 11 ledger Post exists }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OwnershipLineData' }
    OwnershipLineData:
      type: object
      required: [journalLineId, productId, dimensionSet, qty, unit, consignmentPrice, amountAcct]
      properties:
        journalLineId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensionSet: { type: object, additionalProperties: { type: string }, description: The dimensions the stock now has (legal-entity owned; the owner key removed) }
        qty: { type: string }
        unit: { type: string }
        consignmentPrice: { type: string }
        amountAcct: { type: string, description: 'qty x consignmentPrice in currency, rounded to its minor unit' }
    ConsignmentClosedData:
      type: object
      required: [consignmentOrderId, legalEntityId, number, vendorId, disposition, reason, lines]
      description: |
        Emitted in the transaction that closes or cancels a replenishment order. The received
        vendor-owned stock is untouched; givenUpQty is what the order no longer expects.
      properties:
        consignmentOrderId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        number: { type: string, description: CRO- plus 12 hex digits }
        vendorId: { type: string }
        disposition: { type: string, enum: [CLOSED, CANCELLED], description: CLOSED for a partly received order, CANCELLED when nothing was received }
        reason: { type: string, description: Reason given by the user; empty when none }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ConsignmentClosedLine' }
    ConsignmentClosedLine:
      type: object
      required: [lineId, productId, unit, qty, receivedQty, givenUpQty]
      properties:
        lineId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        unit: { type: string }
        qty: { type: string, description: Ordered quantity }
        receivedQty: { type: string }
        givenUpQty: { type: string, description: Ordered minus received }
    TransferData:
      type: object
      required: [transferOrderId, legalEntityId, number, status, fromWarehouse, toWarehouse, transitWarehouse, shipDate, receiptDate, toSiteId, plannedReceiptDate, deliveryTerms, modeOfDelivery, lines]
      description: |
        Lines are the lines this event moved; qty is the quantity moved on the line by this event,
        shippedQty and receivedQty the line totals after it. Each movement is also a valued SOLD /
        PURCHASED transaction pair (sourceType TRANSFER_LINE) with no GL effect. On transfer.changed
        the lines are every line of the order after the change, qty is the ordered quantity and
        shippedQty, receivedQty are the line totals (zero for an order edited before shipment);
        shipDate is the planned ship date and receiptDate is null. transfer.changed is a full
        snapshot of the order: consumers upsert it by transferOrderId, and an order can be first
        seen on it. Creating a CREATED order publishes transfer.changed with status CREATED, so
        consumers see every order from its start. A DRAFT order is never announced; confirming it
        publishes transfer.changed with status CREATED. Status DELETED means the order no longer
        exists: drop it if known, ignore it otherwise. While an order is CREATED, SHIPPED or
        PARTIALLY_RECEIVED it holds supply and demand in the projection (each move is also an
        onhand.changed with deltaBucket ON_ORDER at the shipping dimension set for what has not
        shipped, and ORDERED at the receiving dimension set for what has not been received).
      properties:
        transferOrderId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        number: { type: string }
        status: { type: string, enum: [CREATED, SHIPPED, PARTIALLY_RECEIVED, RECEIVED, CANCELLED, DELETED], description: 'Order status after the event; DELETED on the transfer.changed of a deleted CREATED order, after which the order no longer exists' }
        fromWarehouse: { type: string }
        toWarehouse: { type: string }
        transitWarehouse: { type: [string, 'null'], description: Null for a one-step transfer }
        shipDate: { type: string, format: date, description: 'On transfer.shipped the date of this shipment; on transfer.received the order''s ship date (its first shipment)' }
        receiptDate: { type: [string, 'null'], format: date, description: Date of this receipt; the ship date of a one-step shipment; null on a two-step shipment }
        toSiteId: { type: [string, 'null'], description: Receiving site when it differs from the lines' site; null when not set }
        plannedReceiptDate: { type: [string, 'null'], format: date, description: Planned receipt date of the order; null when not set }
        deliveryTerms: { type: [string, 'null'], description: Delivery terms code of the order; null when not set }
        modeOfDelivery: { type: [string, 'null'], description: Mode of delivery code of the order; null when not set }
        lines:
          type: array
          items:
            type: object
            required: [lineId, productId, dimensionSet, unit, qty, shippedQty, receivedQty, closed]
            properties:
              lineId: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              dimensionSet: { type: object, additionalProperties: { type: string }, description: Source dimensions (shipping warehouse) }
              unit: { type: string }
              qty: { type: string }
              shippedQty: { type: string }
              receivedQty: { type: string }
              closed: { type: boolean }
    TransactionPostedData:
      type: object
      required: [transactionId, legalEntityId, sourceType, journalId, referenceId, originId, productId, dimensionSet, qty, issueStatus, receiptStatus, physicalDate, financialDate, currency, costAmountPhysical, costAmountPosted, correctsTransactionId, statusChangeId, previousStatus]
      properties:
        transactionId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        sourceType: { type: string, enum: [INVENT_JOURNAL_LINE, BLOCKING, TRANSFER_LINE, CONSIGNMENT_LINE, OWNERSHIP_CHANGE, TRANSFER_IN, PURCH_LINE, RECEIPT_LINE, SALES_LINE, PROD_LINE, SERVICE_LINE], description: 'Origin type of the transaction; OWNERSHIP_CHANGE is the receipt leg of an ownership-change line; TRANSFER_IN is the destination receipt leg of a TRANSFER journal line; SERVICE_LINE is the truck issue of a completed service work order line; PURCH_LINE, RECEIPT_LINE, SALES_LINE and PROD_LINE are registered by other services through transactions:apply' }
        journalId: { type: [string, 'null'], format: uuid, description: 'Inventory journal of a journal line (both legs of an ownership change or of a transfer journal line); null for other origins' }
        referenceId: { type: [string, 'null'], description: 'Source document of a non-journal origin: the blocking, transfer or replenishment order id, or the document reference a caller of transactions:apply gave; null for journal lines' }
        originId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensionSet: { type: object, additionalProperties: { type: string } }
        qty: { type: string, description: Signed quantity; negative for issues }
        cwQty: { type: integer, minimum: 1, description: Catch-weight count (cases); omitted when the item is not catch-weight }
        issueStatus: { type: [string, 'null'], enum: [ON_ORDER, RESERVED_ORDERED, RESERVED_PHYSICAL, PICKED, DEDUCTED, SOLD, null], description: 'Set for issues; journals, blocking and transfer legs post SOLD; the vendor-owned leg of an ownership change DEDUCTED; transactions:apply and the named backward commands any status' }
        receiptStatus: { type: [string, 'null'], enum: [ORDERED, ARRIVED, REGISTERED, RECEIVED, PURCHASED, null], description: 'Set for receipts; journals, blocking and transfer legs post PURCHASED; vendor-owned consignment receipts RECEIVED; transactions:apply and the named backward commands any status' }
        physicalDate: { type: string, format: date }
        financialDate: { type: [string, 'null'], format: date, description: 'Null until the transaction reaches a financial status (SOLD, PURCHASED): the value is recognised only there (FR-16.11)' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        costAmountPhysical: { type: string, description: Signed value in currency, rounded to its minor unit }
        costAmountPosted: { type: [string, 'null'], description: Null for a physical status }
        correctsTransactionId: { type: [string, 'null'], format: uuid, description: 'Transaction a reversal line negates (BR-16.12, FR-16.1 corrects_transaction_id); null otherwise' }
        statusChangeId: { type: [string, 'null'], format: uuid, description: 'Status-change audit row of a registration or status move through transactions:apply or a named backward command (Unpick, Unregister, CancelReservation); null for document postings' }
        previousStatus: { type: [string, 'null'], enum: [ON_ORDER, RESERVED_ORDERED, RESERVED_PHYSICAL, PICKED, DEDUCTED, SOLD, ORDERED, ARRIVED, REGISTERED, RECEIVED, PURCHASED, null], description: 'Status the transaction left on a status change; null when the event reports an insert' }
    OnhandChangedData:
      type: object
      required: [legalEntityId, productId, dimensionSet, availPhysical, availOrdered, physicalInvent, deltaBucket, deltaQty]
      properties:
        legalEntityId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensionSet: { type: object, additionalProperties: { type: string } }
        availPhysical: { type: string }
        availOrdered: { type: string }
        physicalInvent: { type: string }
        deltaBucket: { type: string, enum: [POSTED, ON_ORDER, RESERVED_ORDERED, RESERVED_PHYSICAL, HELD_PHYSICAL, PICKED, DEDUCTED, ORDERED, ARRIVED, REGISTERED, RECEIVED], description: 'Projection bucket the change moved: POSTED for journals, blocking and transfer legs, ON_ORDER and ORDERED for the demand and expected receipt a transfer order holds, RESERVED_PHYSICAL and RESERVED_ORDERED for reservations of stock on hand and of expected receipts, HELD_PHYSICAL for holds, RECEIVED for vendor-owned consignment receipts and vendor-owned count gains, DEDUCTED for the vendor-owned leg of an ownership change and vendor-owned count losses (quantity only); for a registration or status move (transactions:apply, named backward commands) the bucket of the status reached, POSTED for SOLD / PURCHASED' }
        deltaQty: { type: string, description: Net signed quantity change of that bucket }
    JournalPostedData:
      type: object
      required: [journalId, legalEntityId, journalType, postingDate, currency, lineCount, glLines, ledgerEntryId, reversesJournalId]
      properties:
        journalId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        journalType: { type: string, enum: [MOVEMENT, ADJUSTMENT, OPENING_BALANCE, COUNT, OWNERSHIP_CHANGE, TRANSFER] }
        postingDate: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        lineCount: { type: integer }
        glLines:
          type: array
          description: Balanced GL lines of the posting; empty for a TRANSFER journal, whose two legs stay on the inventory account
          items:
            type: object
            required: [account, debit, credit]
            properties:
              account: { type: string }
              debit: { type: string }
              credit: { type: string }
        ledgerEntryId: { type: [string, 'null'], format: uuid, description: Null until the wave 11 ledger Post exists }
        reversesJournalId: { type: [string, 'null'], format: uuid, description: 'The journal this one reverses (BR-16.12): same type, negated lines, each valued at the negated value of the transaction it corrects; null for other journals' }
    ReservationData:
      type: object
      required: [reservationId, legalEntityId, productId, dimensionSet, qty, demandType, demandId, demandSegment, policy, status, kind]
      properties:
        reservationId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensionSet: { type: object, additionalProperties: { type: string }, description: Dimension set the allocation reserves }
        qty: { type: string, description: Reserved quantity of this allocation }
        demandType: { type: string, enum: [MANUAL, SALES_ORDER, PRODUCTION_ORDER, TRANSFER_ORDER] }
        demandId: { type: string }
        demandSegment: { type: string, description: 'Segment of the demand (SALES_ORDER:<ref> or PROJECT:<ref>); empty when unsegmented (FR-16.20)' }
        policy: { type: string, enum: [MANUAL, FIFO, FEFO, LIFO] }
        status: { type: string, enum: [ACTIVE, RELEASED, CONSUMED] }
        kind: { type: string, enum: [PHYSICAL, ORDERED], description: 'PHYSICAL reserves stock on hand (RESERVED_PHYSICAL); ORDERED reserves part of the expected receipt of the dimension set (RESERVED_ORDERED)' }
        convertedFromReservationId: { type: string, format: uuid, description: 'Present on reservation.converted when only part of an ORDERED reservation arrived: the converted part is a new allocation (reservationId, kind PHYSICAL) split off the reservation named here, which stays ORDERED for the rest; absent when the whole reservation changed kind' }
        reason: { type: string, enum: [EXPIRED], description: 'Present on reservation.released when the expiry run released the allocation (time to live passed); absent for a release by a person or caller' }
    JournalNameData:
      type: object
      required: [active, code, description, journalNameId, journalType, legalEntityId, offsetAccountId, requiresApproval, version]
      properties:
        journalNameId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string }
        description: { type: string }
        journalType: { type: string, enum: [MOVEMENT, ADJUSTMENT, OPENING_BALANCE, OWNERSHIP_CHANGE, TRANSFER] }
        requiresApproval: { type: boolean }
        offsetAccountId: { type: [string, 'null'] }
        active: { type: boolean }
        version: { type: integer }
    BlockingData:
      type: object
      required: [blockingId, legalEntityId, productId, dimensionSet, qty, targetStatus, reason, state, disposition, expectedReleaseDate, scrapJournalId]
      properties:
        blockingId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensionSet: { type: object, additionalProperties: { type: string }, description: Unrestricted source dimensions; blocked stock adds inventory_status = targetStatus }
        qty: { type: string }
        targetStatus: { type: string, enum: [BLOCKED, QUARANTINE] }
        reason: { type: string, enum: [QUALITY, DAMAGE, RECALL, LEGAL, OTHER] }
        state: { type: string, enum: [ACTIVE, RELEASED] }
        disposition: { type: [string, 'null'], enum: [RELEASE, SCRAP, RETURN, null] }
        expectedReleaseDate: { type: [string, 'null'], format: date, description: When the hold is expected to end; null when not given }
        scrapJournalId: { type: [string, 'null'], format: uuid, description: The posted ADJUSTMENT journal that wrote the stock off; set only when disposition is SCRAP }
    HoldData:
      type: object
      required: [holdId, legalEntityId, productId, dimensionSet, qty, releasedQty, reason, sourceType, sourceRef, state]
      properties:
        holdId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dimensionSet: { type: object, additionalProperties: { type: string } }
        qty: { type: string, description: Quantity placed }
        releasedQty: { type: string, description: Cumulative quantity released }
        reason: { type: string, enum: [QUALITY, DAMAGE, RECALL, LEGAL, OTHER] }
        sourceType: { type: string }
        sourceRef: { type: string }
        state: { type: string, enum: [ACTIVE, RELEASED] }
    CountSheetChangedData:
      type: object
      required: [sheetId, legalEntityId, planId, number, action, status, lineCount, countedCount, recountLines, lineId, reason, recountSource]
      properties:
        sheetId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        number: { type: string, description: Count sheet number }
        action: { type: string, enum: [SUBMITTED, APPROVED, RECOUNT_REQUESTED, CANCELLED, POSTED] }
        status: { type: string, enum: [OPEN, COUNTED, APPROVED, POSTED, CANCELLED], description: Sheet status after the action }
        lineCount: { type: integer }
        countedCount: { type: integer }
        recountLines: { type: integer, description: Lines still flagged for recount after the action }
        lineId: { type: [string, 'null'], format: uuid, description: The line a supervisor requested a recount for; null for a movement flag, which may flag several lines }
        reason: { type: [string, 'null'], description: 'The recount reason: the supervisor''s, or the fixed text of a movement flag' }
        recountSource: { type: [string, 'null'], enum: [SUPERVISOR, MOVEMENT, null], description: 'RECOUNT_REQUESTED only: SUPERVISOR (the :recount action) or MOVEMENT (stock of a counted row moved on a plan without freezeStock, BR-16.8, raised in the movement''s transaction)' }
    ReconciliationDiffData:
      type: object
      required: [account, currency, diff, inventoryValue, ledgerBalance, ledgerSource, legalEntityId, negativeRows, runDate, runId]
      properties:
        runId: { type: string, format: uuid, description: The run row; one per legal entity, account, currency and run date }
        legalEntityId: { type: string, format: uuid }
        account: { type: string, description: Inventory posting account code }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        runDate: { type: string, format: date }
        inventoryValue: { type: string, description: Sum of on-hand posted value of the legal entity in the currency, rounded to the minor unit }
        ledgerBalance: { type: string, description: Net (debit minus credit) of the inventory account, rounded to the minor unit }
        diff: { type: string, description: Non-zero; inventoryValue minus ledgerBalance }
        ledgerSource: { type: string, enum: [GL_JOURNALS, LEDGER_OVERRIDE], description: GL_JOURNALS is the GL of the posted inventory journals; LEDGER_OVERRIDE a balance read from the wave 11 ledger }
        negativeRows: { type: integer, minimum: 0, description: On-hand rows of the legal entity with negative physical stock (FR-16.4) }
