image:
  repository: ghcr.io/benjaminsrussell/inventory
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: inventory-db
migrateOnStart: false
# Public keys of the services that call inventory with a signed service token
# (caller[:kid]=base64 Ed25519 public key, comma separated; not secret). receiving
# reads ownership-change journals this way (#305).
serviceIdentity:
  publicKeys: ""
  # Secret holding this service's own Ed25519 signing key (key "signing-key"), used to
  # sign its calls to the ledger (#477). Required when ledgerUrl is set.
  signingKeySecret: ""
  keyId: ""
# General ledger base URL. Optional: without it POST /v1/inventory/gl-postings answers
# 503 INV-GL-005 and journal entries stay in the subledger only.
ledgerUrl: ""
replicaCount: 3
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }
serviceMonitor:
  enabled: false
inventory:
  negativeDefault: forbid
  # service.allow-negative-truck (BR-45.7): let a technician's truck stock go negative when a completed work order consumes more than the truck holds.
  allowNegativeTruck: false
  reservationTTLHours: 0
  journalMaxLines: 10000
  reconCron: "0 2 * * *"
  # Posting-profile accounts (ledger account ids). Required: the service exits at
  # startup when any is empty. Per-legal-entity posting profiles arrive with wave 11.
  inventoryAccount: ""
  adjustmentAccount: ""
  openingClearingAccount: ""
  # Consignment accrual (posting profile consignment_accrual, FR-16.17). Optional:
  # OWNERSHIP_CHANGE journals are refused (INV-JNL-005) while it is empty.
  consignmentAccrualAccount: ""
# Product service base URL, used by the postings consumer to convert plain
# (not catch-weight) document quantities into the product's inventory unit
# (#480, duty product.uom.convert). Optional: without it plain lines are parked
# (INV-PST-002). With it serviceIdentity.signingKeySecret is required, and the
# product service must trust inventory's public key.
productUrl: ""
# The postings consumer (#480, args [consume]): books receiving's receipt.posted
# and receipt.corrected, sales' DELIVERED orderprogress.recorded and
# fulfillment's packingslip.cancelled as inventory transactions. It exits at
# start unless service:inventory-postings is seeded in the service principal
# table. Its KafkaUser, ACLs and dead-letter topic are
# deploy/kafka/inventory-consumer.yaml; off by default, like the other consumers
# in dev, until it is turned on per environment.
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: inventory-postings
    username: inventory-consumer
    secret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
