{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: inventory
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
  endpoints:
    - port: admin
      path: /metrics
{{- end }}
