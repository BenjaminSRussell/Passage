{{- if .Values.consumer.enabled }}
# The postings consumer (#480): books receiving's receipt.posted and
# receipt.corrected, sales' DELIVERED orderprogress.recorded and fulfillment's
# packingslip.cancelled as inventory transactions. It starts only while
# service:inventory-postings is seeded in the service principal table. Kafka
# user and ACLs: deploy/kafka/inventory-consumer.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-consumer
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: consumer
spec:
  replicas: {{ .Values.consumer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: consumer
    spec:
      volumes:
        - name: kafka
          secret:
            secretName: {{ required "consumer.kafka.secret is required" .Values.consumer.kafka.secret }}
            defaultMode: 0440
{{- if .Values.productUrl }}
        - name: service-identity
          secret:
            secretName: {{ required "serviceIdentity.signingKeySecret is required with productUrl" .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
{{- end }}
      containers:
        - name: {{ .Chart.Name }}-consumer
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [consume]
          ports:
            - name: admin
              containerPort: 9090
          env:
            - name: ADMIN_ADDR
              value: ":9090"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: INV_NEGATIVE_DEFAULT
              value: {{ .Values.inventory.negativeDefault | quote }}
            - name: INV_ALLOW_NEGATIVE_TRUCK
              value: {{ .Values.inventory.allowNegativeTruck | quote }}
            - name: INV_JOURNAL_MAX_LINES
              value: {{ .Values.inventory.journalMaxLines | quote }}
            # loadConfig checks the posting-profile accounts in every mode.
            - name: INV_INVENTORY_ACCOUNT
              value: {{ .Values.inventory.inventoryAccount | quote }}
            - name: INV_ADJUSTMENT_ACCOUNT
              value: {{ .Values.inventory.adjustmentAccount | quote }}
            - name: INV_OPENING_CLEARING_ACCOUNT
              value: {{ .Values.inventory.openingClearingAccount | quote }}
            - name: KAFKA_BROKERS
              value: {{ required "consumer.kafka.brokers is required" .Values.consumer.kafka.brokers | quote }}
            - name: KAFKA_GROUP
              value: {{ .Values.consumer.kafka.group | quote }}
            - name: KAFKA_USERNAME
              value: {{ .Values.consumer.kafka.username | quote }}
            - name: KAFKA_PASSWORD_FILE
              value: /var/run/passage/kafka/password
            - name: KAFKA_TLS_CA_FILE
              value: /var/run/passage/kafka/ca.crt
            - name: PASSAGE_SERVICE_NAME
              value: inventory
{{- if .Values.productUrl }}
            # Plain lines are converted into the product's inventory unit by the
            # product service, signed with product.uom.convert (#480).
            - { name: PRODUCT_URL, value: {{ .Values.productUrl | quote }} }
            - name: PASSAGE_SERVICE_SIGNING_KEY_FILE
              value: /var/run/passage/service-identity/signing-key
{{- if .Values.serviceIdentity.keyId }}
            - name: PASSAGE_SERVICE_KEY_ID
              value: {{ .Values.serviceIdentity.keyId | quote }}
{{- end }}
{{- end }}
          volumeMounts:
            - { name: kafka, mountPath: /var/run/passage/kafka, readOnly: true }
{{- if .Values.productUrl }}
            - { name: service-identity, mountPath: /var/run/passage/service-identity, readOnly: true }
{{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.consumer.resources | nindent 12 }}
{{- end }}
