apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: inventory
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
{{- if .Values.serviceIdentity.signingKeySecret }}
      volumes:
        - name: service-identity
          secret:
            secretName: {{ .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
{{- end }}
      containers:
        - name: inventory
          image: {{ include "inventory.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            {{- include "passage.cloudEnv" $ | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            - name: PASSAGE_SERVICE_NAME
              value: inventory
            {{- if .Values.serviceIdentity.publicKeys }}
            - name: PASSAGE_SERVICE_PUBLIC_KEYS
              value: {{ .Values.serviceIdentity.publicKeys | quote }}
            {{- end }}
            - name: INV_NEGATIVE_DEFAULT
              value: {{ .Values.inventory.negativeDefault | quote }}
            - name: INV_ALLOW_NEGATIVE_TRUCK
              value: {{ .Values.inventory.allowNegativeTruck | quote }}
            - name: INV_RESERVATION_TTL_HOURS
              value: {{ .Values.inventory.reservationTTLHours | quote }}
            - name: INV_JOURNAL_MAX_LINES
              value: {{ .Values.inventory.journalMaxLines | quote }}
            - name: INV_RECON_CRON
              value: {{ .Values.inventory.reconCron | quote }}
            - name: INV_INVENTORY_ACCOUNT
              value: {{ .Values.inventory.inventoryAccount | quote }}
            - name: INV_ADJUSTMENT_ACCOUNT
              value: {{ .Values.inventory.adjustmentAccount | quote }}
            - name: INV_OPENING_CLEARING_ACCOUNT
              value: {{ .Values.inventory.openingClearingAccount | quote }}
            - name: INV_CONSIGNMENT_ACCRUAL_ACCOUNT
              value: {{ .Values.inventory.consignmentAccrualAccount | quote }}
{{- if .Values.ledgerUrl }}
            - { name: LEDGER_URL, value: {{ .Values.ledgerUrl | quote }} }
{{- end }}
{{- if .Values.serviceIdentity.signingKeySecret }}
            - name: PASSAGE_SERVICE_SIGNING_KEY_FILE
              value: /var/run/passage/service-identity/signing-key
{{- if .Values.serviceIdentity.keyId }}
            - name: PASSAGE_SERVICE_KEY_ID
              value: {{ .Values.serviceIdentity.keyId | quote }}
{{- end }}
{{- end }}
{{- if .Values.serviceIdentity.signingKeySecret }}
          volumeMounts:
            - { name: service-identity, mountPath: /var/run/passage/service-identity, readOnly: true }
{{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
