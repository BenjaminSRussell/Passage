asyncapi: 3.0.0
info:
  title: numbering
  version: 0.1.0
channels:
  passage.numbering.sequence:
    address: passage.numbering.sequence
    messages:
      allocated:
        $ref: '#/components/messages/allocated'
operations:
  onAllocated:
    action: send
    channel:
      $ref: '#/channels/passage.numbering.sequence'
    messages:
      - $ref: '#/channels/passage.numbering.sequence/messages/allocated'
components:
  messages:
    allocated:
      name: allocated
      title: Sequence number allocated
      payload:
        type: object
        required: [sequence, value, formatted, legalEntityId]
        properties:
          sequence: { type: string }
          value: { type: integer }
          formatted: { type: string }
          legalEntityId: { type: string, format: uuid }
      x-passage-type: dev.passage.numbering.sequence.allocated.v1
