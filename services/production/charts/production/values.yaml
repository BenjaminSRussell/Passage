image: { repository: ghcr.io/benjaminsrussell/production, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: production-db
migrateOnStart: false
replicaCount: 3
# PRD 4.21.10: HPA on CPU 70%, never below the 3 replicas.
autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 10, targetCPUUtilizationPercentage: 70 }
# PRD 4.21.13 parameters read by the service.
config:
  rafTolerancePct: "0"
  overConsumptionPct: "10"
  autoStartOnFeedback: "true"
  estimateOnCreate: "false"
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }
serviceMonitor: { enabled: false }

ledgerUrl: ""
inventoryUrl: ""
# productUrl: the product service that releasedProductId reads order quantity rules from (FR-21.1); needs serviceIdentity.
productUrl: ""
serviceIdentity:
  signingKeySecret: ""
  keyId: ""
  publicKeys: ""

# The planned order consumer (slice 25). It exits at start until service:production-planning is
# seeded in the service principal table.
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: production-planning
    username: production-consumer
    secret: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

# The shop-floor job card consumer (#481): registration.posted and .corrected into job cards at the
# worker cost rate, as service:production-shopfloor.
shopfloorConsumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: production-shopfloor
    username: production-shopfloor-consumer
    secret: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
