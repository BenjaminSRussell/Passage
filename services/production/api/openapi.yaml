  /v1/production/orders:bulk-status:
    post:
      operationId: bulkProductionOrderStatus
      summary: Apply one status command to up to 500 orders (FR-21.12)
      description: |
        Each order runs in its own transaction at its current version (continue on error),
        in request order, with the same rules, posting effects and events as the single
        `:command`. The call answers 200 with a result per order; when some fail, `code` is
        PRODUCTION_BULK_PARTIAL (PROD-0022). The Idempotency-Key of order X is
        `<key>:<X>`, so a retried batch replays the orders it already moved and retries the
        rest. The route needs production.order.release and the command its own duty as well
        (end: production.order.end; estimate and schedule: production.order.write).
        report-finished and reset-status need per-order input and are not accepted.
      x-passage-duty: production.order.release
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkStatus' }
      responses:
        '200':
          description: Per-order results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '400': { description: 'No, too many, duplicate or malformed ids, a command not allowed in bulk, or Idempotency-Key missing (COM-0001)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'AUTH-0003: the route duty or the command''s duty is missing', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders:cancel-stale:
    post:
      operationId: cancelStaleProductionOrders
      summary: Cancel the orders left Created beyond their site's stale age (cancel-stale-created-orders)
      description: |
        Selects the legal entity's orders that are still Created (never estimated), older than the
        staleOrderDays of their site's parameters (the site's row, else the All row, else 90; 0 never
        cancels) and whose origin is not a planned order, oldest first, at most 500 per call, and
        cancels each through the ordinary `:cancel` command (status log, events, withdrawal of any
        subcontract request), each in its own transaction. `total` counts every qualifying order and
        `truncated` says a further call is needed. With `dryRun` the call lists the candidates and
        changes nothing; it then needs no Idempotency-Key. `orderIds` limits a run to the orders a
        dry run showed. Each order is cancelled at the version the scan saw, so one changed since
        (estimated, edited) is refused with conflict_version. The Idempotency-Key of order X is
        `<key>:<X>`; a retry with the same key replays the orders that run cancelled
        (`replayed`, Idempotent-Replayed) instead of scanning again, and a key used for another job,
        command or legal entity is refused. When some cancels fail, `code` is PRODUCTION_BULK_PARTIAL (PROD-0022). Needs
        production.order.release, the duty of `:cancel`.
      x-passage-duty: production.order.release
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: 'Required unless dryRun; order X uses <key>:<X>.', schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HousekeepingRequest' }
      responses:
        '200':
          description: The candidates and, unless dry run, the result per order. A replay carries Idempotent-Replayed.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HousekeepingResult' }
        '400': { description: 'Malformed or foreign legal entity, malformed or repeated orderIds, or Idempotency-Key missing on a run that is not a dry run (COM-0001)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'idempotency_key_reuse: the key was used for another job, command or legal entity', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'AUTH-0003: production.order.release is missing', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders:auto-end:
    post:
      operationId: autoEndProductionOrders
      summary: End the fully reported orders of the sites that opted in (auto-end-fully-reported)
      description: |
        Selects the legal entity's orders that are ReportedAsFinished with the whole order quantity
        reported, hold no draft journal and belong to a site whose autoEndEnabled parameter is on
        (the site's row, else the All row, else off), at most 500 per call, and ends each through
        the ordinary `:end` command (settlement, variances, `order.settled`), each in its own
        transaction, so the as-built requirement and every other End rule apply and a refusal is
        listed in the results. The zero-output duty is never used. `total` counts every qualifying
        order and `truncated` says a further call is needed. With `dryRun` the call lists the
        candidates and changes nothing; it then needs no Idempotency-Key. `orderIds` limits a run to
        the orders a dry run showed. Each order is ended at the version the scan saw, so one changed
        since is refused with conflict_version. The settlement postings go to the WIP subledger
        like any `:end`, and `gl-postings:run` books them in the general ledger. The
        Idempotency-Key of order X is `<key>:<X>`; a retry with the same key replays the orders
        that run ended (`replayed`, Idempotent-Replayed) instead of scanning again, and a key used
        for another job, command or legal entity is refused. When some ends fail, `code` is PRODUCTION_BULK_PARTIAL (PROD-0022).
      x-passage-duty: production.order.end
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: 'Required unless dryRun; order X uses <key>:<X>.', schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HousekeepingRequest' }
      responses:
        '200':
          description: The candidates and, unless dry run, the result per order. A replay carries Idempotent-Replayed.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HousekeepingResult' }
        '400': { description: 'Malformed or foreign legal entity, malformed or repeated orderIds, or Idempotency-Key missing on a run that is not a dry run (COM-0001)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'idempotency_key_reuse: the key was used for another job, command or legal entity', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'AUTH-0003: production.order.end is missing', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders:merge:
    post:
      operationId: mergeProductionOrders
      summary: Merge orders into the first one (FR-21.15)
      description: |
        The orders must be Created to Released and share legal entity, product, site,
        warehouse, currency, item group, rework reference and the BOM and route snapshot.
        The first order survives with the summed quantity, its lines and operations
        re-exploded and, once estimated, re-estimated; it emits
        dev.passage.production.order.updated.v1; a scheduled survivor is re-dated for the summed quantity
        (dev.passage.production.order.scheduled.v1, reason redate). Every other order becomes Cancelled
        with its jobs and dates removed, mergedIntoOrderId set, a `merge` status-log row and
        dev.passage.production.order.statuschanged.v1. Subcontracting (FR-21.10): the survivor's
        requested vendor POs change with the summed quantity
        (dev.passage.production.subcontract.pochanged.v1) and the requests of every order merged
        away are withdrawn (dev.passage.production.subcontract.pocancelled.v1, reason
        order-cancelled). Refused (422
        PRODUCTION_MERGE_REFUSED, PROD-0016) when any order has posted journals, an order
        to be cancelled has draft journals, or the orders differ (the declared co-products and
        by-products included: line, type, item and quantity per unit). The survivor's co-products
        are re-planned for the summed quantity (FR-21.14). The summed quantity must meet the minimum and
        multiple of the released product the orders were created with (FR-21.1): 422
        PRODUCTION_ORDER_QUANTITY otherwise; orders created with different released products are
        refused with PRODUCTION_MERGE_REFUSED, and an order made without one joins the one that has it.
        A replay of a merge that succeeded is answered without reading the product service.
      x-passage-duty: production.order.release
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeOrders' }
      responses:
        '200':
          description: The survivor and the merged order ids. Replays carry Idempotent-Replayed.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: 'An order version is stale (conflict_version)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PRODUCTION_MERGE_REFUSED (PROD-0016, or the orders declare different co-products or by-products, or were created with different released products), PRODUCTION_ORDER_QUANTITY (the summed quantity breaks the released product''s rules) or idempotency_key_reuse', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { description: 'PRODUCTION_PRODUCT_UNAVAILABLE: an order holds a released product and the product service is not configured or could not be read; nothing is written.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}:
    get:
      operationId: getProductionOrder
      summary: Read an order with its lines, operations and planned cost
      x-passage-duty: production.order.read
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: The order.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    patch:
      operationId: updateProductionOrder
      summary: Edit the header fields allowed for the current status
      description: |
        The quantity changes in Created and Estimated (re-exploding lines and operations), the
        delivery date until Released. When a subcontract operation's vendor PO was already
        requested (a released order reset below Released keeps it), a new process quantity or
        delivery date reaches purchasing as dev.passage.production.subcontract.pochanged.v1 in
        the same transaction (FR-21.10).
      x-passage-duty: production.order.write
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchOrder' }
      responses:
        '200':
          description: The order after the edit; emits dev.passage.production.order.updated.v1.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: The field cannot change in the current status (PRODUCTION_FIELD_NOT_EDITABLE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match does not match the current version (conflict_version, PROD-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: The new quantity breaks the order rules (PRODUCTION_ORDER_QUANTITY), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match missing (precondition_required), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { description: 'PRODUCTION_PRODUCT_UNAVAILABLE: releasedProductId was sent, or the order holds one and the quantity changes, and the product service is not configured or could not be read; nothing is written.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}/status-log:
    get:
      operationId: getProductionOrderStatusLog
      summary: The applied commands of an order with actor, time and trace id (FR-21.2)
      x-passage-duty: production.order.read
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: Oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string, format: uuid }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/StatusLogEntry' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/production/orders/{id}/end-check:
    get:
      operationId: getProductionOrderEndCheck
      summary: Whether :end would be accepted now, with its blockers and warnings (FR-21.8, PROD-0012, PROD-0020, PROD-0021)
      description: |
        Reads what `:end` reads, through the same guards and settlement plan, and changes nothing. Blockers
        are what would refuse the command, in the order it applies them: a status that cannot end, output
        not reported or zero output without the caller's `production.order.zero-output` duty, a missing
        as-built record where the site requires one (PROD-0021), unposted journals (PROD-0012), an end date
        before the last posting, and no posting profile (or account) for the settlement. Warnings are
        accepted: consumed serials of components that serial as-built records name but no finished serial
        holds (PROD-0020). PROD-0014 (subcontract operations with no vendor invoice) is not reported yet.
        The answer is a snapshot for this caller and is sent with `Cache-Control: no-store`.
      x-passage-duty: production.order.read
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: The readiness of the order to end.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EndCheck' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/production/orders/{id}/costs:
    get:
      operationId: getProductionOrderCosts
      summary: Planned against actual cost by cost group, the WIP balance and the variances (FR-21.11)
      x-passage-duty: production.cost.read
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: The cost view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostView' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/production/orders/{id}:{command}:
    post:
      operationId: commandProductionOrder
      summary: Apply a status command (custom method after the colon)
      description: |
        Duties by command: estimate and schedule need
        production.order.write; release, start, cancel and reset-status need
        production.order.release; report-finished needs production.journal.post; end needs
        production.order.end, and ending a Started order with zero output also needs
        production.order.zero-output. A command the state machine does not allow is 409
        PRODUCTION_ILLEGAL_TRANSITION (PROD-0001). Each applied command writes a status-log
        row; a status change (and every report-as-finished) emits
        dev.passage.production.order.statuschanged.v1.

        Order change management (FR-21.16): on an order before Started, every command but cancel
        first applies the order's pending changes detected under an automatic OCM profile (oldest
        first, through the order-edit rules, with order.bomedited and orderchange.applied), unless
        the order was edited by hand or the change is blocked; the order version then moves by more
        than one.

        Posting effects (BR-21.1), in the same transaction: start posts a picking list for
        the start-flushed lines; report-finished posts a report-as-finished journal (Dr
        finished goods at the planned unit cost / Cr WIP, finish-flushed lines consumed in
        proportion); end refuses unposted journals (409 PRODUCTION_UNPOSTED_JOURNALS) and
        settles: the WIP balance is cleared into the variance accounts and
        dev.passage.production.order.settled.v1 is emitted; reset-status reverses the
        report-as-finished journals when it leaves ReportedAsFinished, and every journal when
        it goes back before Started. Each posted journal emits
        dev.passage.production.journal.posted.v1. Postings need a posting profile (422
        PRODUCTION_POSTING_PROFILE_MISSING).

        Rework orders (originType Rework, FR-21.20): report as finished receives the
        reworked units at their existing cost (the planned cost of the order's line for its
        own product, zero without one); end posts the rest of the WIP balance as variances of
        type rework, one per cost group, to the profile's reworkVarianceAccount. A reset that
        reverses the reports as finished detaches the order's as-built records (BR-21.14).

        Scheduling (BR-21.1, infinite capacity): schedule dates the route. The operations run one
        after the other in route order on a continuous clock, each as queue-before, setup, process
        (run time × process quantity), queue-after and transport hours; there are no calendars or
        capacities until wave 23. The body picks the method (operations or jobs), the direction
        (forward or backward) and the instant (at). The order gets startDate and endDate, each
        operation its plannedStart and plannedEnd, and the jobs are written
        (dev.passage.production.order.scheduled.v1). A backward schedule without at needs a delivery
        date, and a route of more than 100000 hours is refused (422 PRODUCTION_SCHEDULE_INPUT); an
        order without operations is scheduled with no jobs at the instant. reset-status to Estimated
        or Created and cancel remove the jobs and the dates. Dates are UTC: startDate and endDate are
        the UTC dates of the first start and last finish, and the backward default is 23:59:59 UTC of
        the delivery date (production has no site time zone). These are the infinite-capacity dates
        of BR-21.1; finite scheduling (wave 23) is meant to replace them (see the AsyncAPI).

        Subcontracting (FR-21.10): release emits
        dev.passage.production.subcontract.porequested.v1 for each subcontract operation not
        requested before and stamps the operation's poRequestedAt, so a reset and second
        release requests nothing new. Cancelling the order withdraws its requests
        (dev.passage.production.subcontract.pocancelled.v1, reason order-cancelled).
      x-passage-duty: production.order.write | production.order.release | production.journal.post | production.order.end
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/Command' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandBody' }
      responses:
        '200':
          description: The order after the command. Replays return the current order with Idempotent-Replayed.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: Body, Idempotency-Key or If-Match malformed (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown order or command (PRODUCTION_ORDER_NOT_FOUND, PRODUCTION_UNKNOWN_ACTION), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PRODUCTION_ILLEGAL_TRANSITION (also a reset back before Started of an order that took part in a split transfer, BR-21.11); PRODUCTION_UNPOSTED_JOURNALS on end', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: conflict_version, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'Guard failed (PRODUCTION_END_REQUIRES_RAF, PRODUCTION_ZERO_OUTPUT_NOT_PERMITTED, PRODUCTION_RAF_EXCEEDS_REMAINING, PRODUCTION_INVALID_INPUT, PRODUCTION_SCHEDULE_INPUT, PRODUCTION_POSTING_PROFILE_MISSING, PRODUCTION_END_BEFORE_LAST_JOURNAL, PRODUCTION_POSTING_NOT_BALANCED, PRODUCTION_AS_BUILT_REQUIRED) or key reused (idempotency_key_reuse)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: precondition_required, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}:split:
    post:
      operationId: splitProductionOrder
      summary: Split a Created to Started order in two (FR-21.15)
      description: |
        The original keeps quantity − splitQty; the new order receives splitQty with the same
        header, BOM and route snapshot and status, a new number, originType Split, originId
        and splitFromOrderId set to the original (a rework order's split stays a rework order
        of the same reference). Both orders are re-exploded for their quantity (BR-21.2,
        BR-21.8; each keeps its setup) and, once estimated, re-estimated. Emits
        dev.passage.production.order.created.v1 for the new order and
        dev.passage.production.order.updated.v1 for the original, and writes a `split`
        status-log row on both. A scheduled original keeps its schedule start; both orders are
        re-dated from it for their quantities (dev.passage.production.order.scheduled.v1, reason redate). Subcontracting (FR-21.10): the original's requested vendor POs
        shrink (dev.passage.production.subcontract.pochanged.v1) and a Released or Started new
        order requests its own (…subcontract.porequested.v1). A Started order also moves its
        share of the posted consumption, route hours and WIP to the new order (BR-21.11): with r = splitQty ÷ order quantity,
        quantities move at round(x × r, 6), hours at round(x × r, 2) and amounts at round(x × r)
        in the currency's minor unit, the rounding residual stays on the original. The move is a
        pair of posted `split-transfer` journals (one per order, linked by counterpartOrderId)
        with balanced WIP postings, each announced by dev.passage.production.journal.posted.v1.
        `allocation` `keep-on-original` moves nothing. A Started order with reported output, draft
        journals or as-built records is refused (409 PRODUCTION_SPLIT_REFUSED). After a transfer,
        a reset of either order back before Started is refused (409 PRODUCTION_ILLEGAL_TRANSITION);
        leaving ReportedAsFinished still reverses the reports as finished. Co-products and
        by-products (FR-21.14): the original's are re-planned for its remaining quantity and the
        new order gets the same lines planned for splitQty with nothing received. An operation
        reported on job cards moves its jobs' share of the feedback too (the setup job its own
        share of hours, the process job the rest and the quantities), and the new order keeps the
        original's feedback mode per operation.
      x-passage-duty: production.order.release
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SplitOrder' }
      responses:
        '201':
          description: The original and the new order; ETag is the original's version, Location the new order.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SplitResult' }
        '200':
          description: Replay of an earlier split with the same Idempotency-Key and body.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SplitResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PRODUCTION_ILLEGAL_TRANSITION: the order is not Created to Started; PRODUCTION_SPLIT_REFUSED: a Started order has reported output or received co-products, draft journals or as-built records', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: conflict_version, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PRODUCTION_SPLIT_QUANTITY (PROD-0015) or idempotency_key_reuse', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: precondition_required, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { description: 'PRODUCTION_PRODUCT_UNAVAILABLE: releasedProductId was sent, or the order holds one and the quantity changes, and the product service is not configured or could not be read; nothing is written.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}:apply-finite-dates:
    post:
      operationId: applyProductionOrderFiniteDates
      summary: Replace a scheduled order's dates with the windows finite-capacity scheduling found (FR-23.10)
      description: |
        Wave 23 (services/scheduling) books each operation on resource calendars and finds a window
        for it; this command takes those windows. The order must be Scheduled, Released or Started
        (409 PRODUCTION_FINITE_STATE otherwise, also while it has no schedule). Each listed
        operation takes its window; the operation's jobs keep their order and share the window in
        proportion to their planned hours (equally when the operation has none), to the second, so
        queue and transit time stretch over the calendar gaps; the last job ends with the window.
        Planned hours are the work content and do not change. Operations not listed keep their dates.

        The windows, listed or kept, must follow the route: an operation may overlap the one before it
        (BR-23.5) but may not start or end before it (422 PRODUCTION_FINITE_INPUT, which also covers an
        operation the order does not have). A window shorter than its jobs' planned hours is applied
        (a resource efficiency above 100% explains it) and named in finiteCompressedOperations until
        the next infinite re-date. A last end after the delivery date is accepted (BR-23.2 lets
        scheduling place an order late); the order page flags it as for :schedule.

        The order's startDate and endDate become the first start and last end, scheduleBasis becomes
        `finite`, finiteRunId and finiteScheduledAt record the plan, the version moves and
        dev.passage.production.order.scheduled.v1 (reason finite) carries the whole job set with the
        ids the jobs keep. An operation that already has feedback (a route or job card) cannot move
        (409 PRODUCTION_FINITE_LOCKED).

        Concurrency and retries: a person must send If-Match with the order version (428 without it,
        412 when the order changed since), so a form filled against an older order cannot overwrite
        newer dates. A service caller (a verified service token, the scheduling consumer handoff) may
        omit If-Match and is checked when it sends one. Applying the dates the order already has
        changes nothing whatever the If-Match: 200 with Idempotent-Replayed true, no new version and no
        event, so a retry or a redelivered plan is safe and no Idempotency-Key is used. A later
        :schedule, order edit, split or merge re-dates the order with infinite capacity and sets
        scheduleBasis back to `infinite`; scheduling then plans it again. The service consumer of
        scheduling's events is a handoff (NOT-IMPLEMENTED).
      x-passage-duty: production.order.write
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - name: If-Match
          in: header
          required: false
          description: 'The order version from the ETag of the last read, quoted, for example "3". Required for a person (428 without it); optional for a service caller.'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiniteDates' }
      responses:
        '200':
          description: The order with its finite dates; Idempotent-Replayed is true when nothing changed.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: 'COM-0001 with the invalid fields (no windows, a window ending before it starts, a repeated operation) or a malformed If-Match', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: 'AUTH-0003: missing production.order.write', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PRODUCTION_FINITE_STATE: the order is not Scheduled to Started or has no schedule; PRODUCTION_FINITE_LOCKED: an operation in the request has feedback', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: 'conflict_version (PROD-0003): If-Match does not match the order version and the windows would change the order', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PRODUCTION_FINITE_INPUT: an operation the order does not have, or windows out of route order', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: 'precondition_required: a person sent no If-Match', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}/journals:
    get:
      operationId: listProductionJournals
      summary: The journals of an order, oldest first, with lines and postings (FR-21.11)
      x-passage-duty: production.order.read
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: Drafts, posted journals and reversals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string, format: uuid }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Journal' }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    post:
      operationId: createProductionJournal
      summary: Create a draft journal, proposed or with explicit lines (FR-21.5 to FR-21.7)
      description: |
        Picking lists and reports as finished need a Started or ReportedAsFinished order; a
        route card may also be created on a Released order, which its posting starts (FR-21.6,
        PRODUCTION_AUTOSTART_ON_FEEDBACK).
      x-passage-duty: production.journal.post
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJournal' }
      responses:
        '201':
          description: The draft.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '200':
          description: Replay of an earlier request with the same Idempotency-Key and body.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PRODUCTION_JOURNAL_NOT_ALLOWED (order status), PRODUCTION_OPERATION_FINISHED, PRODUCTION_ORDER_NOT_SCHEDULED (job card on an order without jobs), PRODUCTION_JOB_FINISHED, PRODUCTION_FEEDBACK_MODE_CONFLICT (a route card on an operation job cards report on, or the reverse)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PRODUCTION_INVALID_JOURNAL_LINE, PRODUCTION_INVALID_HOURS, PRODUCTION_JOURNAL_EMPTY (nothing to propose), idempotency_key_reuse', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/journals/{id}:
    get:
      operationId: getProductionJournal
      summary: Read a journal with its lines and postings
      x-passage-duty: production.order.read
      parameters:
        - { $ref: '#/components/parameters/JournalId' }
      responses:
        '200':
          description: The journal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '404': { description: PRODUCTION_JOURNAL_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    delete:
      operationId: deleteProductionJournal
      summary: Delete a draft journal (PROD-0012 "post or delete the journals")
      x-passage-duty: production.journal.post
      parameters:
        - { $ref: '#/components/parameters/JournalId' }
      responses:
        '204': { description: Deleted. }
        '404': { description: PRODUCTION_JOURNAL_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: PRODUCTION_JOURNAL_ALREADY_POSTED; reset the order status to reverse a posted journal, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/journals/{id}:post:
    post:
      operationId: postProductionJournal
      summary: Post a draft journal
      description: |
        One transaction under the order's row lock (BR-21.4): values each line (issues at their
        unit cost, hours at the operation's labor and overhead rates, the finished receipt at
        the planned unit cost), writes balanced WIP postings from the order's posting profile,
        books consumption, operation feedback and the reported quantities, and emits
        dev.passage.production.journal.posted.v1. A route card on a Released order starts it; a
        report as finished moves a Started order to ReportedAsFinished (both write the status
        log and emit dev.passage.production.order.statuschanged.v1). Consumption beyond the
        requirement plus PRODUCTION_OVERCONSUMPTION_PCT needs production.journal.over-consume.
        A route card then evaluates the trigger points of each operation it reports on, in
        ascending sequence (FR-21.17, BR-21.13), and returns them in triggerFirings, each
        emitting dev.passage.production.triggerpoint.fired.v1. A function that fails is
        recorded with its reason and never blocks the post (PROD-0019). A line with `finished`
        that finishes its operation also evaluates the operation's trigger points on the event
        operation-finished; those firings belong to the operation and are read with its trigger
        points, not returned here.
      x-passage-duty: production.journal.post
      parameters:
        - { $ref: '#/components/parameters/JournalId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: The posted journal. A replay with the same key returns it with Idempotent-Replayed.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '400': { description: COM-0001 (Idempotency-Key missing), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'PRODUCTION_JOURNAL_NOT_FOUND, PRODUCTION_UNKNOWN_ACTION', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PRODUCTION_JOURNAL_ALREADY_POSTED, PRODUCTION_JOURNAL_NOT_ALLOWED, PRODUCTION_OPERATION_FINISHED, PRODUCTION_JOB_FINISHED, PRODUCTION_FEEDBACK_MODE_CONFLICT', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PRODUCTION_OVER_CONSUMPTION (PROD-0007), PRODUCTION_RAF_EXCEEDS_REMAINING (PROD-0008), PRODUCTION_COPRODUCT_EXCEEDS_PLANNED (FR-21.14), PRODUCTION_POSTING_DATE_BEFORE_ORDER (BR-21.3), PRODUCTION_POSTING_PROFILE_MISSING, PRODUCTION_INVALID_JOURNAL_LINE, idempotency_key_reuse', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/posting-profiles:
    get:
      operationId: listProductionPostingProfiles
      summary: The posting profiles of a legal entity, and the one that resolves for an item group and site (FR-21.13)
      description: |
        Resolution order: item group × site, item group × All, All × site, All × All. With
        siteId (and optionally itemGroup) the response carries `resolved`, or 422
        PRODUCTION_POSTING_PROFILE_MISSING when none applies.
      x-passage-duty: production.setup.read
      parameters:
        - { name: legalEntityId, in: query, description: Defaults to the caller's legal entity., schema: { type: string, format: uuid } }
        - { name: itemGroup, in: query, schema: { type: string } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The profiles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  legalEntityId: { type: string, format: uuid }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PostingProfile' }
                  resolved: { $ref: '#/components/schemas/PostingProfileInput' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { description: PRODUCTION_POSTING_PROFILE_MISSING, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    put:
      operationId: saveProductionPostingProfile
      summary: Create or replace the profile of a legal entity × item group × site
      description: Creating takes no If-Match; replacing needs If-Match with the profile version.
      x-passage-duty: production.setup.write
      parameters:
        - { name: If-Match, in: header, required: false, description: 'The profile version, quoted; required to replace.', schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostingProfileInput' }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { description: 'The profile version, quoted.', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostingProfile' }
        '200':
          description: Replaced.
          headers:
            ETag: { description: 'The profile version, quoted.', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostingProfile' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '412': { description: 'conflict_version (stale If-Match, or If-Match on a profile that does not exist)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: precondition_required (replacing without If-Match), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}/as-built:
    get:
      operationId: listProductionOrderAsBuilt
      summary: The attached as-built records of an order (FR-21.19)
      x-passage-duty: production.order.read
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: Oldest first, at most 500.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string, format: uuid }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AsBuiltRecord' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND (malformed id), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    post:
      operationId: assignProductionAsBuilt
      summary: Assign a component serial or batch to a finished serial or batch (FR-21.19, BR-21.14)
      description: |
        Under the order's row lock: the order is Started or ReportedAsFinished (409
        PRODUCTION_AS_BUILT_ORDER_STATE), the component is on its BOM (422
        PRODUCTION_AS_BUILT_COMPONENT_NOT_ON_BOM), the quantity assigned of the component stays
        within what the order consumed of it (422 PRODUCTION_AS_BUILT_EXCEEDS_CONSUMED), the
        distinct finished serials or batches stay within the order quantity rounded up (422
        PRODUCTION_AS_BUILT_TOO_MANY_FINISHED), and a serialized component serial is attached
        to one finished serial only across the tenant (422 SERIAL_DUPLICATE, PROD-0009). Emits
        dev.passage.production.asbuilt.assigned.v1.
      x-passage-duty: production.journal.post
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignAsBuilt' }
      responses:
        '201':
          description: Assigned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsBuiltRecord' }
        '200':
          description: Replay of an earlier request with the same Idempotency-Key and body.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsBuiltRecord' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: PRODUCTION_AS_BUILT_ORDER_STATE, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PRODUCTION_AS_BUILT_COMPONENT_NOT_ON_BOM, PRODUCTION_AS_BUILT_EXCEEDS_CONSUMED, PRODUCTION_AS_BUILT_TOO_MANY_FINISHED, SERIAL_DUPLICATE, idempotency_key_reuse', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/as-built:
    get:
      operationId: queryProductionAsBuilt
      summary: As-built of a finished serial, or where-used of a component serial (4.21.14)
      description: |
        Attached records only, oldest first, at most 500. At least one of
        finishedSerialOrBatch, componentSerialOrBatch and orderId is required.
      x-passage-duty: production.order.read
      parameters:
        - { name: finishedSerialOrBatch, in: query, schema: { type: string, maxLength: 100 } }
        - { name: componentSerialOrBatch, in: query, schema: { type: string, maxLength: 100 } }
        - { name: componentItemId, in: query, schema: { type: string, format: uuid } }
        - { name: orderId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The matching records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AsBuiltRecord' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/production/as-built/{id}:detach:
    post:
      operationId: detachProductionAsBuilt
      summary: Detach an as-built record to correct a wrong assignment
      description: |
        Allowed while the order is Started or ReportedAsFinished (409
        PRODUCTION_AS_BUILT_ORDER_STATE). The record stays for the audit trail with detachedAt
        and detachedBy and frees its component serial; a detached record is returned as it is.
        A :reset-status that reverses the reports as finished detaches the order's records
        (BR-21.14). Emits dev.passage.production.asbuilt.detached.v1.
      x-passage-duty: production.journal.post
      parameters:
        - { $ref: '#/components/parameters/AsBuiltId' }
      responses:
        '200':
          description: The detached record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsBuiltRecord' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'PRODUCTION_AS_BUILT_NOT_FOUND, PRODUCTION_UNKNOWN_ACTION', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: PRODUCTION_AS_BUILT_ORDER_STATE, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}/bom:
    patch:
      operationId: editProductionOrderBOM
      summary: Edit the order's BOM lines and route operations (FR-21.18)
      description: |
        Order-specific edits after explosion and before Started: add, remove and change BOM
        lines (item, quantity per, series, scrap, round-up, unit cost, flushing) and route
        operations (resource, times, scrap, rates, subcontracting). Required quantities are
        re-exploded (BR-21.2), process quantities re-planned (BR-21.8) and, once the order is
        estimated, planned cost re-estimated. The order is flagged orderBomModified and each
        edit is kept with before and after images (GET …/bom-edits). A line or operation that
        has consumption, route feedback or journals keeps its item or resource and cannot be
        removed. A Released order also needs the duty production.order.bom-after-release
        (Maintain order BOM after release). Emits dev.passage.production.order.bomedited.v1.
        Subcontracting (FR-21.10): a requested operation whose process quantity or vendor price
        changed emits dev.passage.production.subcontract.pochanged.v1; one removed, turned off or
        moved to another vendor resource emits …subcontract.pocancelled.v1 (and, on a Released
        order, the new vendor is requested with …subcontract.porequested.v1).
        Scheduling (slice 18): an edit of a scheduled order (one with startDate) re-dates it forward
        from its schedule start with the changed route and emits
        dev.passage.production.order.scheduled.v1 with reason redate; operation queue and transit
        hours (queueBeforeH, queueAfterH, transitH) can be edited.
        Co-products (slice 28, FR-21.14): coProducts adds, changes and removes the order's declared
        co-products and by-products; their planned quantities follow the order quantity, and a line
        with receipts or journals keeps its item and type and cannot be removed.
      x-passage-duty: production.order.write
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderEdits' }
      responses:
        '200':
          description: The order after the edits.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: COM-0001 with the invalid fields, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: 'AUTH-0003: missing production.order.write, or production.order.bom-after-release on a Released order', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PRODUCTION_ORDER_EDIT_NOT_ALLOWED (Started or later), PRODUCTION_ORDER_EDIT_TARGET_EXISTS, PRODUCTION_ORDER_EDIT_TARGET_IN_USE', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match does not match the current version (conflict_version), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PRODUCTION_ORDER_EDIT_TARGET_NOT_FOUND, PRODUCTION_INVALID_INPUT (for example scrap 100 or no operation left)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match missing (precondition_required), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}/bom-edits:
    get:
      operationId: listProductionOrderBOMEdits
      summary: The audit trail of the order's BOM and route edits (FR-21.18)
      x-passage-duty: production.order.read
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: Oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string, format: uuid }
                  items: { type: array, items: { $ref: '#/components/schemas/OrderEditEntry' } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/production/wip-balances:
    get:
      operationId: getProductionWIPBalances
      summary: WIP balance by order (4.21.14)
      description: |
        From the WIP subledger: per order with WIP postings up to asOf (default today, UTC),
        the posted consumption, the value received by reports as finished, the WIP cleared at
        End and the balance, ordered by order id, with totals per currency over the whole
        filter. Status is the order's current status. The GL WIP account delta waits for the
        general ledger (wave 11).
      x-passage-duty: production.cost.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: One page and the totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WIPReport' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/production/gl-postings:run:
    post:
      operationId: runProductionGLPostings
      summary: Book the WIP subledger in the general ledger
      description: |
        Books every WIP subledger posting not yet in the general ledger: one balanced entry per
        posted journal (picking list, route card, report as finished, reversal, split transfer)
        and one per order settlement, keyed by the journal or order id so a retry returns the
        same entry. The entry id is stored as `journalEntryId` on the journal and on the
        settlement's variances. A group the ledger refuses (a closed period, for one) is listed
        under `failed` with the ledger's problem code and is retried by the next run; the rest
        are still booked. At most 200 groups are booked per run (`remaining` counts the others).
        The call signs only `ledger.entry.post` with the service key.
      x-passage-duty: production.journal.post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ledgerId]
              properties:
                legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity. }
                ledgerId: { type: string, format: uuid }
                orderId: { type: string, format: uuid, description: Book only this order. }
      responses:
        '200':
          description: What was booked and what the ledger refused.
          content:
            application/json:
              schema:
                type: object
                required: [booked, failed, remaining]
                properties:
                  booked:
                    type: array
                    items:
                      type: object
                      properties:
                        document: { type: string, description: The journal number, or the order number for a settlement. }
                        entryId: { type: string, format: uuid }
                        lines: { type: integer }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        document: { type: string }
                        code: { type: string, description: The ledger's problem code, or PRODUCTION_GL_FAILED. }
                  remaining: { type: integer }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { description: PRODUCTION_GL_UNAVAILABLE, the ledger is not configured, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/wip-reconciliation:
    get:
      operationId: getProductionWIPReconciliation
      summary: Reconcile the WIP subledger to the general ledger
      description: |
        Per WIP account used by the legal entity's orders in one currency (up to periodTo, YYYY-MM):
        the subledger net (debit minus credit over all orders), the part of it not yet booked, the
        general ledger's balance of the account and the difference (GL minus subledger). `reconciled`
        is true when every difference is zero; an unbooked posting shows as a difference until
        `gl-postings:run` books it.
      x-passage-duty: production.cost.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: ledgerId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: currency, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: periodTo, in: query, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: The reconciliation.
          content:
            application/json:
              schema:
                type: object
                required: [currency, reconciled, accounts]
                properties:
                  currency: { type: string }
                  periodTo: { type: string }
                  reconciled: { type: boolean }
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        account: { type: string }
                        subledger: { type: string }
                        unbooked: { type: string }
                        gl: { type: string }
                        difference: { type: string }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '502': { description: PRODUCTION_GL_UNAVAILABLE, the ledger refused the balance read, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { description: PRODUCTION_GL_UNAVAILABLE, the ledger is not configured, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/cost-snapshots:run:
    post:
      operationId: runProductionCostSnapshot
      summary: Snapshot the planned and actual cost of the open orders (order-cost-snapshot)
      description: |
        The on-demand form of the daily `order-cost-snapshot` job (PRD 4.21.16). For every order of
        the legal entity from Estimated to ReportedAsFinished it stores, for the day (default today,
        UTC; not in the future), the planned cost of the estimate, the actual cost of the posted
        issue and hours lines (reversals net out) and the WIP balance. A second run for the same day
        overwrites that day's row of each open order (upsert by order and date), so a repeat or a
        retry needs no Idempotency-Key; actual cost and WIP count the postings dated up to the day.
        The run is one transaction and emits one `costsnapshot.taken` event. It needs the cost read
        duty: it posts nothing and stores only figures the caller may already read.
      x-passage-duty: production.cost.read
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity. }
                date: { type: string, format: date, description: 'The snapshot day (YYYY-MM-DD); defaults to today.' }
      responses:
        '200':
          description: What the run wrote.
          content:
            application/json:
              schema:
                type: object
                required: [legalEntityId, snapshotDate, orders]
                properties:
                  legalEntityId: { type: string, format: uuid }
                  snapshotDate: { type: string, format: date }
                  orders: { type: integer, description: Open orders written for the day. }
        '400': { description: 'Malformed or foreign legal entity, malformed or future date (COM-0001)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'AUTH-0003: production.cost.read is missing', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/cost-snapshots:
    get:
      operationId: listProductionCostSnapshots
      summary: Order cost snapshots, newest day first
      description: |
        The stored daily snapshots of open orders for the order KPI trend: planned cost, actual cost,
        the variance to date (actual minus planned) and the WIP balance, to the currency's minor unit.
        Filter by order and by snapshot date (from and to, inclusive); `nextCursor` continues the list.
      x-passage-duty: production.cost.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: orderId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
      responses:
        '200':
          description: One page of snapshots.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  nextCursor: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      required: [orderId, orderNumber, snapshotDate, status, currency, plannedCost, actualCost, wipBalance, costVariance]
                      properties:
                        orderId: { type: string, format: uuid }
                        orderNumber: { type: string }
                        legalEntityId: { type: string, format: uuid }
                        siteId: { type: string, format: uuid }
                        snapshotDate: { type: string, format: date }
                        status: { type: string }
                        currency: { type: string }
                        qtyOrdered: { type: string }
                        qtyReported: { type: string }
                        plannedCost: { type: string }
                        actualCost: { type: string }
                        wipBalance: { type: string }
                        costVariance: { type: string }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/production/variances:
    get:
      operationId: getProductionVariances
      summary: Variance report (4.21.14)
      description: |
        The variances posted at End, ordered by posting, with the planned cost of the order's
        cost group and the variance as a percentage of it, totals per currency and type, and
        the net per currency. from and to bound the posting date (UTC).
      x-passage-duty: production.cost.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: itemGroup, in: query, schema: { type: string } }
        - { name: orderId, in: query, schema: { type: string, format: uuid } }
        - { name: varianceType, in: query, schema: { $ref: '#/components/schemas/VarianceType' } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: One page, the totals and the net.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VarianceReport' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/production/subcontract-operations:
    get:
      operationId: getProductionSubcontractOperations
      summary: Subcontract operations inquiry (4.21.14, FR-21.10)
      description: |
        Every subcontract operation of the caller's orders, ordered by order and operation, with
        the vendor resource, the process quantity and what route cards reported good, the vendor
        unit price, the planned amount (unit price × quantity, as the estimate plans it) and when
        release requested the vendor PO (dev.passage.production.subcontract.porequested.v1) or
        when that request was withdrawn (poCancelledAt, …subcontract.pocancelled.v1).
        status filters the operation's feedback status, orderStatus the order's; dueFrom and dueTo
        bound the due date, which is the order's delivery date until scheduling (wave 23). The
        PO line and its receipt status arrive with purchasing (wave 17). Totals are per currency
        over the whole filter.
      x-passage-duty: production.order.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: resourceId, in: query, description: The vendor resource., schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [open, started, finished] } }
        - { name: orderStatus, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: dueFrom, in: query, schema: { type: string, format: date } }
        - { name: dueTo, in: query, schema: { type: string, format: date } }
        - { name: cursor, in: query, description: 'The nextCursor of the previous page (order id:operation number).', schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: One page and the totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubcontractReport' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/production/operations:
    get:
      operationId: getProductionOperationsOverview
      summary: Operations overview across orders (4.21.14)
      description: |
        Every operation of the caller's orders, ordered by order and operation, with the resource,
        the process quantity, planned hours (setup + run × process quantity, the hours the estimate
        costs labor and overhead on; a subcontract operation is costed at its price, so its hours are
        the vendor's route time), the hours route cards reported, the good and error quantities and the operation's
        feedback status. status filters the operation, orderStatus the order; dueFrom and dueTo
        bound the due date, which is the order's delivery date until scheduling (wave 23).
        Totals cover the whole filter, not only the page.
      x-passage-duty: production.order.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: resourceId, in: query, schema: { type: string, format: uuid } }
        - { name: orderId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [open, started, finished] } }
        - { name: orderStatus, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: dueFrom, in: query, schema: { type: string, format: date } }
        - { name: dueTo, in: query, schema: { type: string, format: date } }
        - { name: cursor, in: query, description: 'The nextCursor of the previous page (order id:operation number).', schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: One page and the totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationsOverview' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/production/material-requirements:
    get:
      operationId: getProductionMaterialRequirements
      summary: Material requirements of open orders by BOM line (4.21.14)
      description: |
        The component demand of open orders (the material shortage inquiry of PRD 4.21.14 without
        on-hand, which comes with wave 16): per BOM line the quantity required, the quantity issued (the
        line's booked consumption: posted picking lists, backflush included, net of reversals and of
        the share a split moved to another order) and the quantity outstanding, ordered by order and
        line. Only lines with something left to issue are listed unless all is true. Totals cover the
        whole filter, not only the page.
      x-passage-duty: production.order.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: itemId, in: query, description: The component item., schema: { type: string, format: uuid } }
        - { name: orderId, in: query, schema: { type: string, format: uuid } }
        - { name: orderStatus, in: query, description: Without it only open orders count (not Ended, not Cancelled)., schema: { $ref: '#/components/schemas/Status' } }
        - { name: dueFrom, in: query, description: The order's delivery date from., schema: { type: string, format: date } }
        - { name: dueTo, in: query, description: The order's delivery date to., schema: { type: string, format: date } }
        - { name: all, in: query, description: 'true also lists lines and items that are fully issued.', schema: { type: boolean, default: false } }
        - { name: cursor, in: query, description: 'The nextCursor of the previous page (order id:line sequence).', schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: One page of lines and the totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaterialRequirements' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/production/material-requirements/by-item:
    get:
      operationId: getProductionMaterialRequirementsByItem
      summary: Material requirements of open orders by component item (4.21.14)
      description: |
        The same demand rolled up per component item, ordered by item id: the orders and lines that
        need it, the quantity required, issued and outstanding, and the earliest delivery date of the
        orders still waiting for it. Fully issued lines do not count unless all is true.
      x-passage-duty: production.order.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: itemId, in: query, description: The component item., schema: { type: string, format: uuid } }
        - { name: orderId, in: query, schema: { type: string, format: uuid } }
        - { name: orderStatus, in: query, description: Without it only open orders count (not Ended, not Cancelled)., schema: { $ref: '#/components/schemas/Status' } }
        - { name: dueFrom, in: query, description: The order's delivery date from., schema: { type: string, format: date } }
        - { name: dueTo, in: query, description: The order's delivery date to., schema: { type: string, format: date } }
        - { name: all, in: query, description: 'true also lists lines and items that are fully issued.', schema: { type: boolean, default: false } }
        - { name: cursor, in: query, description: The nextCursor of the previous page (an item id)., schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: One page of items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaterialItems' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/production/jobs:
    get:
      operationId: getProductionJobs
      summary: Dated jobs across orders
      description: |
        The jobs `:schedule` wrote (ProductionJob), ordered by planned start, with the order each
        belongs to. resourceId and the from/to window give the load of one resource; a job is
        in the window when it ends after from and starts before to. Total and plannedHours cover the
        whole filter, not only the page. Jobs are planned with infinite capacity until wave 23.
      x-passage-duty: production.order.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: resourceId, in: query, schema: { type: string, format: uuid } }
        - { name: orderId, in: query, schema: { type: string, format: uuid } }
        - { name: jobType, in: query, schema: { $ref: '#/components/schemas/JobType' } }
        - { name: orderStatus, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Must be after from., schema: { type: string, format: date-time } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: One page of jobs and the totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPage' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/production/orders/{id}/jobs:
    get:
      operationId: getProductionOrderJobs
      summary: Jobs of one order
      description: The dated jobs of the order in route order; empty while the order is unscheduled.
      x-passage-duty: production.order.read
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: The order's jobs and their planned hours.
          content:
            application/json:
              schema:
                type: object
                required: [orderId, items, plannedHours]
                properties:
                  orderId: { type: string, format: uuid }
                  items: { type: array, items: { $ref: '#/components/schemas/Job' } }
                  plannedHours: { $ref: '#/components/schemas/Decimal' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown order (PRODUCTION_ORDER_NOT_FOUND), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/journals:
    get:
      operationId: getProductionJournalInquiry
      summary: Production journal inquiry across orders (4.21.14)
      description: |
        Production journals of the caller's orders ordered by id: number, type, order, posting
        date, whether posted, good and error quantities, line count, the journal entry id once the
        ledger books it, and the values consumed (issue and hours lines) and received (receipt and
        co-product lines) in the order currency, rounded to its minor unit and negative on a
        reversal. Values are set when a journal posts. Filter by type, posted state, order (id, or
        the exact order number, which is unique per legal entity) and posting date range. `total` counts every journal the filter
        selects. The lines and postings of one journal are read with GET /v1/production/journals/{id}.
      x-passage-duty: production.order.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: orderId, in: query, schema: { type: string, format: uuid } }
        - { name: orderNumber, in: query, description: The exact order number., schema: { type: string, maxLength: 64 } }
        - { name: type, in: query, schema: { type: string, enum: [picking-list, route-card, job-card, report-as-finished, split-transfer] } }
        - { name: posted, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: from, in: query, description: First posting date., schema: { type: string, format: date } }
        - { name: to, in: query, description: Last posting date., schema: { type: string, format: date } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: One page and the count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalInquiry' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/production/kpi:
    get:
      operationId: getProductionOrderKpis
      summary: Production order KPIs (4.21.14)
      description: |
        Orders ended in a period, with the share finished on or before their delivery date
        (onTimePct, over the ended orders that have one), the mean days from the first Started
        entry of the status log to the finish (avgCycleDays), the scrap share of the reported
        quantities (scrapPct = error ÷ (finished + error)) and the orders still open, of which
        overdue are those whose delivery date is before asOf (default today, UTC). An order finished
        at its last ReportedAsFinished entry (its Ended entry when it has none): End is the cost
        close and may come later. from and to bound the UTC date of the Ended entry and do not apply
        to the open counts; open is the current status, and asOf only moves the overdue cut-off. Rates are null when there
        is nothing to measure. Groups by site or product are ordered by orders ended; totals cover all
        groups, not only the first `limit`. This is the service-side version of the order_kpi
        projection that the analytics wave (46) will replace.
      x-passage-duty: production.order.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, description: First date the orders ended., schema: { type: string, format: date } }
        - { name: to, in: query, description: Last date the orders ended., schema: { type: string, format: date } }
        - { name: asOf, in: query, description: The date open orders are compared with their delivery date., schema: { type: string, format: date } }
        - { name: groupBy, in: query, schema: { type: string, enum: [site, product] } }
        - { name: limit, in: query, description: At most this many groups., schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: The groups and the totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderKpis' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/production/orders/{id}/operations/{operNumber}:{command}:
    post:
      operationId: commandProductionOperation
      summary: Finish or reopen one operation of an order (FR-21.6)
      description: |
        `:finish` closes the operation to further route cards without posting one (a route card
        line with `finished` does the same with its feedback); `:reopen` opens a finished
        operation again, as started when it has feedback and open otherwise. Both apply while the
        order is Started or ReportedAsFinished, not to a subcontracted operation (409
        PRODUCTION_OPERATION_STATE). A change bumps the order version, writes an operation-log row
        and emits dev.passage.production.operation.statuschanged.v1 in the same transaction; a
        command already in effect returns the order unchanged and emits nothing.
      x-passage-duty: production.journal.post
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { name: operNumber, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
        - { name: command, in: path, required: true, schema: { type: string, enum: [finish, reopen] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: The order after the command. Replays return the current order with Idempotent-Replayed.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: A body, or Idempotency-Key or If-Match malformed (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'Unknown order, operation or command (PRODUCTION_ORDER_NOT_FOUND, PRODUCTION_OPERATION_NOT_FOUND, PRODUCTION_UNKNOWN_ACTION)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: The order takes no feedback or the operation is subcontracted (PRODUCTION_OPERATION_STATE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: conflict_version, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Key reused for another operation or command (idempotency_key_reuse), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: precondition_required, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}/trigger-points:
    get:
      operationId: listProductionTriggerPoints
      summary: Trigger points of an order with their firings (FR-21.17)
      x-passage-duty: production.order.read
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: By operation and sequence; each with its firings, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string, format: uuid }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TriggerPoint' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    post:
      operationId: createProductionTriggerPoint
      summary: Define a trigger point on an operation of the order (FR-21.17)
      description: |
        Under the order's row lock. The order is not Ended or Cancelled (409
        PRODUCTION_TRIGGER_ORDER_CLOSED), the operation is on its route (422
        PRODUCTION_TRIGGER_OPERATION_NOT_FOUND) and the sequence is free on the operation (409
        PRODUCTION_TRIGGER_POINT_EXISTS). The condition must parse (422
        PRODUCTION_TRIGGER_CONDITION_INVALID); release-next and start-workflow are refused (422
        PRODUCTION_TRIGGER_FUNCTION_UNSUPPORTED). A trigger point that creates rework orders also
        needs production.order.rework.

        When a route card reports on the operation and the condition holds on that line's
        hours, good and error quantity: insert-operations inserts its operations numbered
        operation + 5, + 6, ... (or right after the operation when that would reach the next
        one; operations on the route are never renumbered), each processing the error quantity
        or else the operation's process quantity; create-rework-order creates a Created rework
        order of the product for the error quantity with the trigger's operations as its route
        (10, 20, ...), referencing this order; notify only publishes the event. A trigger fires
        once per operation unless repeatable.
      x-passage-duty: production.setup.write
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTriggerPoint' }
      responses:
        '201':
          description: Defined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerPoint' }
        '200':
          description: Replay of an earlier request with the same Idempotency-Key and body.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerPoint' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: 'AUTH-0003: production.setup.write, and production.order.rework for create-rework-order', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PRODUCTION_TRIGGER_ORDER_CLOSED, PRODUCTION_TRIGGER_POINT_EXISTS', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PRODUCTION_TRIGGER_CONDITION_INVALID, PRODUCTION_TRIGGER_FUNCTION_UNSUPPORTED, PRODUCTION_TRIGGER_OPERATION_NOT_FOUND, PRODUCTION_INVALID_INPUT, idempotency_key_reuse', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/trigger-points/{id}:
    delete:
      operationId: deleteProductionTriggerPoint
      summary: Remove a trigger point that never fired
      description: A trigger point that fired is kept as the record of what it did (409 PRODUCTION_TRIGGER_POINT_FIRED).
      x-passage-duty: production.setup.write
      parameters:
        - { $ref: '#/components/parameters/TriggerPointId' }
      responses:
        '204': { description: Removed with its failed firings. }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PRODUCTION_TRIGGER_POINT_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: PRODUCTION_TRIGGER_POINT_FIRED, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/parameters:
    get:
      operationId: listProductionParameters
      summary: The production parameters of a legal entity, the service defaults, and the ones that apply to a site (PRD 4.21.13)
      description: |
        Parameters are stored per legal entity × site (a site UUID, or All for every site). A
        site's row wins over the All row; with neither stored, the service defaults apply
        (`defaults`, from the service environment). With siteId the response carries
        `resolved` and whether a stored row decided it.
      x-passage-duty: production.setup.read
      parameters:
        - { name: legalEntityId, in: query, description: Defaults to the caller's legal entity., schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The stored parameters, the defaults and, with siteId, the resolved parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  legalEntityId: { type: string, format: uuid }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductionParameters' }
                  defaults: { $ref: '#/components/schemas/ParameterValues' }
                  resolved:
                    allOf:
                      - $ref: '#/components/schemas/ParameterValues'
                      - type: object
                        properties:
                          stored: { type: boolean, description: True when a stored row decided the values. }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      operationId: saveProductionParameters
      summary: Create or replace the production parameters of a legal entity × site
      description: |
        Creating takes no If-Match; replacing needs If-Match with the row version. The settings
        before slice 17 are required, so a missing one is refused rather than switching a flag off;
        pickingListProposal, routeCardProposal, staleOrderDays, autoEndEnabled, endJobs and reworkCapitalize are optional: an
        omitted one keeps its stored value on a replace (so an older client cannot reset a site's
        stale-order age or auto-end opt-in) and takes remaining, remaining, 90 and off on a create (they set the journal proposal that a
        create request naming none uses, and the two housekeeping jobs). The tolerances
        apply to report as finished and picking (FR-21.5, FR-21.7), auto-start to route cards
        (FR-21.6), estimate on create to new orders, the split allocation to a split that names
        none (FR-21.15), trigger points enabled to route-card trigger evaluation (FR-21.17) and
        asBuiltRequired to `:end` (FR-21.19, PRODUCTION_AS_BUILT_REQUIRED) and endJobs to the report
        as finished that completes the order quantity (FR-21.7); reworkCapitalize makes `:end` of a
        rework order capitalize its cost into finished goods instead of posting a rework variance (FR-21.20).
      x-passage-duty: production.setup.write
      parameters:
        - { name: If-Match, in: header, required: false, description: 'The row version, quoted; required to replace.', schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionParametersInput' }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { description: 'The row version, quoted.', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionParameters' }
        '200':
          description: Replaced.
          headers:
            ETag: { description: 'The row version, quoted.', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionParameters' }
        '400': { description: COM-0001 (a missing or out-of-range setting), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '412': { description: 'conflict_version (stale If-Match, If-Match on parameters that do not exist, or a create that lost to a concurrent create of the same site)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: precondition_required (replacing without If-Match), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/ocm-profiles:
    get:
      operationId: listProductionOCMProfiles
      summary: The OCM profiles of a legal entity, and the one that resolves for an item group and site (FR-21.16)
      description: |
        Resolution order: item group × site, item group × All, All × site, All × All. With siteId
        (and optionally itemGroup) the response carries `resolved`; with no stored profile that is
        the default, mode manual and no surcharge.
      x-passage-duty: production.setup.read
      parameters:
        - { name: legalEntityId, in: query, description: Defaults to the caller's legal entity., schema: { type: string, format: uuid } }
        - { name: itemGroup, in: query, schema: { type: string } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The profiles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  legalEntityId: { type: string, format: uuid }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OCMProfile' }
                  resolved: { $ref: '#/components/schemas/OCMProfileInput' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      operationId: saveProductionOCMProfile
      summary: Create or replace the OCM profile of a legal entity × item group × site
      description: Creating takes no If-Match; replacing needs If-Match with the profile version.
      x-passage-duty: production.setup.write
      parameters:
        - { name: If-Match, in: header, required: false, description: 'The profile version, quoted; required to replace.', schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OCMProfileInput' }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { description: 'The profile version, quoted.', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OCMProfile' }
        '200':
          description: Replaced.
          headers:
            ETag: { description: 'The profile version, quoted.', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OCMProfile' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '412': { description: conflict_version (stale If-Match, or If-Match on a profile that does not exist), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: precondition_required (replacing without If-Match), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/planned-intake:
    get:
      operationId: listProductionPlannedIntake
      summary: List the firmed planned orders waiting for a production order
      description: |
        Planning's plannedorder.firmed.v1 for a production planned order (FR-22.10) lands here through the
        planning consumer. Newest first; status narrows to open, converted or dismissed.
      x-passage-duty: production.order.read
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, converted, dismissed] } }
        - { name: siteId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: A page of intake rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlannedIntakePage' }
        '400': { description: A filter is malformed (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/production/planned-intake/{id}:
    get:
      operationId: getProductionPlannedIntake
      summary: One planned order intake row
      x-passage-duty: production.order.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The row; the ETag is its version for If-Match.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlannedIntake' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PRODUCTION_INTAKE_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/planned-intake/{id}:{command}:
    post:
      operationId: commandProductionPlannedIntake
      summary: Convert a firmed planned order into a production order, or dismiss it
      description: |
        `:convert` creates the production order of an open row in one transaction (FR-22.10): the order
        takes the row's target id as its id, its legal entity, product, site, quantity and delivery date,
        originType PlannedOrder with the planned order as originId, the planned order's quotaArrangementId
        and quotaSourceId (FR-22.17), and the row's warehouse (the body supplies one when the row has none). The BOM and route snapshot and the currency come in the
        body, as on a manual create (wave 9 resolves them later); it needs an Idempotency-Key and
        answers like POST /v1/production/orders, so a replay returns the same order even after the row
        was converted by it. `:dismiss` sets an
        open row aside with a reason and needs If-Match. Both need production.order.write; a row that is
        already converted or dismissed, or whose planned order another order already names (one order per
        planned order), answers 409 PRODUCTION_INTAKE_NOT_OPEN.
      x-passage-duty: production.order.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: command, in: path, required: true, schema: { type: string, enum: [convert, dismiss] } }
        - { name: If-Match, in: header, required: false, description: 'The row version, quoted; required by :dismiss.', schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: false, description: 'Required by :convert; a replay returns the first order with Idempotent-Replayed.', schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/ConvertPlannedOrder' }
                - { $ref: '#/components/schemas/DismissPlannedOrder' }
      responses:
        '200':
          description: The dismissed row, or the replay of an earlier conversion with the same Idempotency-Key.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/PlannedIntake' }
                  - { $ref: '#/components/schemas/Order' }
        '201':
          description: Converted; emits dev.passage.production.order.created.v1 with originType PlannedOrder.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: "Body, Idempotency-Key or If-Match malformed, or legalEntityId other than the planned order's (COM-0001)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown row or command (PRODUCTION_INTAKE_NOT_FOUND, PRODUCTION_UNKNOWN_ACTION), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'The row is already converted or dismissed, or another order already names the planned order (PRODUCTION_INTAKE_NOT_OPEN)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: conflict_version, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Explosion or operation rule failed (PRODUCTION_INVALID_INPUT), the quantity breaks minimumQty, maximumQty or multiple (PRODUCTION_ORDER_QUANTITY), or the key was used with another body (idempotency_key_reuse), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: precondition_required, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/order-changes:detect:
    post:
      operationId: detectProductionOrderChanges
      summary: Record the open orders an ECO's new BOM and route supersede (FR-21.16)
      description: |
        For each open order (Created to Released) of the product, optionally of one site, whose
        OCM profile is not none and that differs from the new snapshot, writes an
        OrderChangeRecord with the delta and the change cost (BR-21.12) and emits
        dev.passage.production.orderchange.detected.v1, all in one transaction. An (order, ECO)
        pair is recorded once, so repeating the notice records nothing more; the same ecoId with
        another snapshot is 422 idempotency_key_reuse. An order edited by hand is recorded with
        needsReview. Started orders are not changed (their BOM and route are locked). Older pending
        changes of an order that this ECO covers (it replaces every part they replace) are
        dismissed with the note "superseded by <ecoId>" and orderchange.dismissed.
      x-passage-duty: production.order.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DetectChangesRequest' }
      responses:
        '200':
          description: The records created and the counts of orders already recorded or skipped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetectChangesResult' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { description: idempotency_key_reuse (the ECO was detected with another snapshot), PRODUCTION_INVALID_INPUT (a snapshot that does not explode), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/order-changes:
    get:
      operationId: listProductionOrderChanges
      summary: The order change management worklist, newest first (4.21.14)
      x-passage-duty: production.order.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, applied, dismissed] } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: orderId, in: query, schema: { type: string, format: uuid } }
        - { name: ecoId, in: query, schema: { type: string } }
        - { name: needsReview, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
      responses:
        '200':
          description: A page of change records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrderChange' }
                  nextCursor: { type: string }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/production/order-changes/{id}:
    get:
      operationId: getProductionOrderChange
      summary: One order change record
      x-passage-duty: production.order.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The record; the ETag is its version for If-Match.
          headers:
            ETag: { description: 'The change version, quoted.', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderChange' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PRODUCTION_ORDER_CHANGE_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/order-changes/{id}:{command}:
    post:
      operationId: commandProductionOrderChange
      summary: Preview, apply or dismiss an order change (FR-21.16)
      description: |
        `:preview` reads the order as it is now and answers the delta, the planned cost before and
        after, the change cost and the order edits that applying performs; `blocked` says why
        applying would be refused (PRODUCTION_ORDER_CHANGE_SUPERSEDED when a later ECO replaces the
        same BOM or route, PRODUCTION_ORDER_CHANGE_NOT_ELIGIBLE once the order started, or
        PRODUCTION_ORDER_EDIT_TARGET_IN_USE when a line to
        remove has consumption: lines already consumed are never removed, so the planner dismisses
        the change or finishes the order on its version). `:apply` takes the change's If-Match
        version and an Idempotency-Key and, under the order lock, re-explodes the order through the
        order-edit rules, re-estimates its planned cost, stores the before and after snapshot hashes
        and emits order.bomedited and orderchange.applied in one transaction; a Released order also
        needs production.order.bom-after-release. Applied orders are not flagged orderBomModified.
        `:dismiss` sets a pending change aside with an optional note. All three need
        production.order.apply-change.
      x-passage-duty: production.order.apply-change
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: command, in: path, required: true, schema: { type: string, enum: [preview, apply, dismiss] } }
        - { name: If-Match, in: header, required: false, description: 'The change version, quoted; required by :apply and :dismiss.', schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: false, description: 'Required by :apply; a replay returns the first result with Idempotent-Replayed.', schema: { type: string, maxLength: 255 } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DismissChange' }
      responses:
        '200':
          description: The preview, the applied change with its order, or the dismissed change.
          headers:
            ETag: { description: 'The change version, quoted.', schema: { type: string } }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ChangePreview' }
                  - { $ref: '#/components/schemas/AppliedChange' }
                  - { $ref: '#/components/schemas/OrderChange' }
        '400': { description: Body, Idempotency-Key or If-Match malformed (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown change or command (PRODUCTION_ORDER_CHANGE_NOT_FOUND, PRODUCTION_UNKNOWN_ACTION), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: The change was already applied or dismissed (PRODUCTION_ORDER_CHANGE_RESOLVED), the order is Started or later (PRODUCTION_ORDER_CHANGE_NOT_ELIGIBLE), a later ECO on the order replaces the same BOM or route (PRODUCTION_ORDER_CHANGE_SUPERSEDED), or a consumed line cannot be removed (PRODUCTION_ORDER_EDIT_TARGET_IN_USE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: conflict_version, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: The order already matches (PRODUCTION_ORDER_CHANGE_NO_DELTA), or the key was used for another change (idempotency_key_reuse), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: precondition_required, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
