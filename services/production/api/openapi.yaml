        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { description: 'PRODUCTION_ORIGIN_CONFLICT', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
