openapi: 3.1.0
info:
  title: Passage production orders
  version: 0.21.16
  description: |
    Wave 21 slices 1 to 4 of PSG-21. Creates production orders with BOM and route
    explosion, lists and reads them, edits the header, runs the status state machine
    (BR-21.1) and estimates planned cost. Slice 2 adds posting profiles (FR-21.13), picking
    lists, route cards and report-as-finished journals with their WIP postings (FR-21.5 to
    FR-21.7), the posting effects of :start, :report-finished, :end (settlement, FR-21.8) and
    :reset-status (reversal journals, FR-21.9), and the actual-cost read (FR-21.11). Job
    cards, subcontracting and the other FR-21 items are later slices (see NOT-IMPLEMENTED.md).
    Slice 3 adds rework orders (FR-21.20: originType Rework with a reworkReference, receipts
    at the reworked units' existing cost, End settles the rest as variances of type rework)
    and as-built genealogy (FR-21.19, BR-21.14: assign, detach, and the as-built / where-used
    inquiry).
    Slice 4 adds the bulk status update (FR-21.12: one command on up to 500 orders with
    per-order results), and split and merge of Created to Released orders (FR-21.15).
    Slice 5 adds order-specific BOM and route edits before Started (FR-21.18: add, remove and
    change lines and operations, re-explosion, re-estimate, orderBomModified and the audit
    trail) and the cross-order WIP balance and variance reports (4.21.14).
    Slice 6 adds trigger points (FR-21.17, BR-21.13): rules on an order's operations that
    route-card feedback evaluates, inserting rework operations, creating a rework order for
    the error quantity or publishing a notification; the firings come back on the post.
    Slice 7 adds the subcontract purchase requests and inquiry (FR-21.10).
    Slice 9 adds the item's minimum, maximum and multiple order quantity on create and on a
    quantity PATCH (FR-21.1), estimate on create (PRODUCTION_ESTIMATE_ON_CREATE, 4.21.13), and
    the operation commands :finish and :reopen (FR-21.6).
    Slice 10 adds order change management (FR-21.16, BR-21.12): OCM profiles, detection of the
    open orders an ECO's new BOM and route supersede, the worklist, the change preview with its
    change cost, and :apply and :dismiss.
    Slice 18 adds scheduling with infinite capacity (BR-21.1): :schedule dates the route and
    writes the order's jobs, which GET /v1/production/jobs and GET .../orders/{id}/jobs read.
    Problems are RFC 9457 with a stable `code` (see README). The gateway serves these paths
    under `/api`.
servers:
  - url: https://api.{env}.passage.dev/api
    variables:
      env: { default: dev }
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    JournalId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TriggerPointId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AsBuiltId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Command:
      name: command
      in: path
      required: true
      description: The custom method after the colon, for example `…/orders/0195d6a0-…:release`.
      schema: { $ref: '#/components/schemas/Command' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Replays with the same key and body return the first result; the same key with another body is 422 idempotency_key_reuse.
      schema: { type: string, minLength: 1, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The order version from the ETag of the last read, quoted, for example "3".
      schema: { type: string }
  headers:
    ETag:
      description: The order version, quoted.
      schema: { type: string }
    IdempotentReplayed:
      description: '"true" when the response replays an earlier request with the same Idempotency-Key.'
      schema: { type: string, enum: ['true'] }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Decimal:
      type: string
      description: Decimal number as a string (JSON numbers are accepted on input); never a float.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    Status:
      type: string
      enum: [Created, Estimated, Scheduled, Released, Started, ReportedAsFinished, Ended, Cancelled]
    Command:
      type: string
      enum: [estimate, schedule, release, start, report-finished, end, cancel, reset-status]
    CostGroup:
      type: string
      enum: [material, labor, overhead, subcontract]
    Flushing:
      type: string
      description: |
        When a BOM line's material is consumed (FR-21.5): manual and available-at-location
        lines by picking lists, start lines by :start, finish lines by report as finished.
      enum: [manual, start, finish, available-at-location]
    JournalType:
      type: string
      enum: [picking-list, route-card, job-card, report-as-finished]
    Proposal:
      type: string
      description: |
        remaining proposes what is left; proportional proposes the requirement × reported
        quantity ÷ order quantity, less what is booked; none proposes nothing.
      enum: [remaining, proportional, none]
    VarianceType:
      type: string
      description: The four of BR-21.6, and rework for a rework order (FR-21.20).
      enum: [lot-size, production-quantity, production-price, production-substitution, rework]
    ReworkReference:
      type: object
      additionalProperties: false
      required: [type, id]
      description: |
        The original a rework order reports against (FR-21.20). For type order, id is the
        original order's id; that order must exist, make the same product and have reported
        at least the rework quantity as finished (422 PRODUCTION_REWORK_REFERENCE_INVALID).
        For batch or serial, id is the number, kept as entered until tracking (wave 16).
      properties:
        type: { type: string, enum: [order, batch, serial] }
        id: { type: string, minLength: 1, maxLength: 100 }
    Tracking:
      type: string
      description: A serial component is consumed in quantity 1; a batch in any positive quantity.
      enum: [serial, batch]
    AssignAsBuilt:
      type: object
      additionalProperties: false
      required: [finishedSerialOrBatch, componentItemId, tracking, componentSerialOrBatch]
      properties:
        finishedSerialOrBatch: { type: string, minLength: 1, maxLength: 100 }
        componentItemId: { type: string, format: uuid, description: A component on the order's BOM. }
        tracking: { $ref: '#/components/schemas/Tracking' }
        componentSerialOrBatch: { type: string, minLength: 1, maxLength: 100 }
        qty: { $ref: '#/components/schemas/Decimal', description: 'Default 1; must be 1 for a serial.' }
    AsBuiltRecord:
      type: object
      description: |
        One component serial or batch consumed into one finished serial or batch of an order
        (PRD 4.21.4 AsBuiltRecord). journalId and rafJournalId stay null until tracking
        dimensions (wave 16) capture serials on picking and RAF lines.
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        finishedItemId: { type: string, format: uuid, description: The order's product. }
        finishedSerialOrBatch: { type: string }
        componentItemId: { type: string, format: uuid }
        tracking: { $ref: '#/components/schemas/Tracking' }
        componentSerialOrBatch: { type: string }
        qty: { $ref: '#/components/schemas/Decimal' }
        journalId: { type: string, format: uuid }
        rafJournalId: { type: string, format: uuid }
        assignedBy: { type: string }
        assignedAt: { type: string, format: date-time }
        detachedBy: { type: string }
        detachedAt: { type: string, format: date-time }
    BOMComponent:
      type: object
      description: |
        One line of the BOM version snapshot. A phantom line has no stock of its own; its
        children are exploded in place and numbered under it (30 → 30.1, 30.2). Top-level
        line numbers are required and unique; children's numbers are derived.
      required: [qtyPer]
      additionalProperties: false
      properties:
        lineNo: { type: string, maxLength: 20 }
        itemId: { type: string, format: uuid, description: Required on every non-phantom line. }
        qtyPer: { $ref: '#/components/schemas/Decimal' }
        seriesSize: { $ref: '#/components/schemas/Decimal', description: 'Default 1.' }
        scrapPct: { $ref: '#/components/schemas/Decimal', description: 'From 0 up to but excluding 100.' }
        roundUp: { type: boolean, description: Round the required quantity up to a whole unit (BR-21.2). }
        unitCost: { $ref: '#/components/schemas/Decimal', description: Unit cost from the active costing version (wave 20). }
        flushing: { $ref: '#/components/schemas/Flushing', description: 'Default manual; a phantom''s children inherit its principle.' }
        phantom: { type: boolean }
        children:
          type: array
          items: { $ref: '#/components/schemas/BOMComponent' }
    OperationInput:
      type: object
      required: [operNumber, resourceId]
      additionalProperties: false
      properties:
        operNumber: { type: integer, minimum: 1, description: Strictly increasing along the route. }
        resourceId: { type: string, format: uuid }
        setupTimeH: { $ref: '#/components/schemas/Decimal' }
        runTimeHPer: { $ref: '#/components/schemas/Decimal' }
        scrapPct: { $ref: '#/components/schemas/Decimal' }
        laborRate: { $ref: '#/components/schemas/Decimal' }
        overheadRate: { $ref: '#/components/schemas/Decimal' }
        subcontract: { type: boolean }
        subcontractPrice: { $ref: '#/components/schemas/Decimal', description: Vendor price per unit of the process quantity. }
        queueBeforeH: { $ref: '#/components/schemas/Decimal', description: 'Hours the order waits before the operation; a queue-before job when above 0 (default 0).' }
        queueAfterH: { $ref: '#/components/schemas/Decimal', description: 'Hours the order waits after the operation; a queue-after job when above 0 (default 0).' }
        transitH: { $ref: '#/components/schemas/Decimal', description: 'Hours to move the order to the next operation; a transport job when above 0 (default 0).' }
    Operation:
      allOf:
        - $ref: '#/components/schemas/OperationInput'
        - type: object
          properties:
            processQty: { $ref: '#/components/schemas/Decimal', description: 'Quantity to start at the operation (BR-21.8).' }
            hoursReported: { $ref: '#/components/schemas/Decimal', description: Hours posted by route cards. }
            qtyGood: { $ref: '#/components/schemas/Decimal' }
            qtyError: { $ref: '#/components/schemas/Decimal' }
            status: { type: string, enum: [open, started, finished] }
            plannedStart: { type: string, format: date-time, readOnly: true, description: 'Start of the operation''s window (its queue-before included) set by :schedule; absent while the order is unscheduled. Not accepted on a request.' }
            plannedEnd: { type: string, format: date-time, readOnly: true, description: 'End of the operation''s window (its transport included) set by :schedule.' }
            poRequestedAt: { type: string, format: date-time, readOnly: true, description: 'When release asked purchasing for the vendor PO of this subcontract operation (FR-21.10); absent before, and absent again once the request was withdrawn.' }
            poCancelledAt: { type: string, format: date-time, readOnly: true, description: 'When the request was withdrawn (subcontract.pocancelled): the order was cancelled or merged away, or an edit removed the operation, turned subcontracting off or changed the vendor. Cleared when a new request is raised.' }
    OrderLine:
      type: object
      properties:
        lineNo: { type: string }
        itemId: { type: string, format: uuid }
        qtyPer: { $ref: '#/components/schemas/Decimal' }
        seriesSize: { $ref: '#/components/schemas/Decimal' }
        scrapPct: { $ref: '#/components/schemas/Decimal' }
        roundUp: { type: boolean }
        qtyRequired: { $ref: '#/components/schemas/Decimal' }
        unitCost: { $ref: '#/components/schemas/Decimal' }
        flushing: { $ref: '#/components/schemas/Flushing' }
        qtyConsumed: { $ref: '#/components/schemas/Decimal', description: Issued by posted journals. }
    CostRow:
      type: object
      properties:
        group: { $ref: '#/components/schemas/CostGroup' }
        key: { type: string, description: Item id for material, resourceId@operNumber otherwise. }
        qty: { $ref: '#/components/schemas/Decimal' }
        amount: { $ref: '#/components/schemas/Decimal', description: 4 decimals (FR-21.3). }
        fixed: { $ref: '#/components/schemas/Decimal', description: The setup part of the amount. }
    CreateOrder:
      type: object
      required: [productId, siteId, warehouseId, currency, quantity, operations]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity and must equal it when the caller has one. }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        itemGroup: { type: string, maxLength: 40, description: 'The product''s item group, the posting-profile key with the site (FR-21.13). All is reserved.' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        quantity: { $ref: '#/components/schemas/Decimal' }
        deliveryDate: { type: [string, 'null'], format: date }
        originType:
          type: string
          enum: [PlannedOrder, SalesOrderLine, Manual, Kanban, Rework]
          default: Manual
          description: |
            PlannedOrder is refused here (400 on originType): only POST /v1/production/planned-intake/{id}:convert
            sets it, so a manual create cannot make a second order for a planned order.
            Rework makes a rework order (FR-21.20) and needs the duty production.order.rework.
            A rework order has no BOM explosion by default: list the components to add, and the
            product itself as a line to issue the reworked units into WIP at their cost.
            Defaults to Rework when reworkReference is set.
        originId: { type: [string, 'null'], format: uuid }
        configurationId: { type: [string, 'null'], format: uuid, description: 'Saved configuration the order is built to; only with originType SalesOrderLine.' }
        reworkReference: { $ref: '#/components/schemas/ReworkReference' }
        releasedProductId: { type: string, format: uuid, description: 'The released product (wave 8) whose site default for siteId supplies the minimum and multiple order quantity and, when quantity is omitted, the standard quantity (FR-21.1). The product''s minimum and multiple are always enforced; minimumQty, maximumQty and multiple sent here apply as well and can only tighten them (the product has no maximum). Unknown released product is 422 PRODUCTION_INVALID_INPUT; product service not configured or down is 503 PRODUCTION_PRODUCT_UNAVAILABLE; a product with no default for the site gives no rules.' }
        minimumQty: { $ref: '#/components/schemas/Decimal', description: 'The item''s minimum order quantity (FR-21.1); absent or 0 is no minimum. With releasedProductId the released product''s minimum also applies.' }
        maximumQty: { $ref: '#/components/schemas/Decimal', description: 'The item''s maximum order quantity; absent or 0 is no maximum. Below minimumQty is 422 PRODUCTION_INVALID_INPUT.' }
        multiple: { $ref: '#/components/schemas/Decimal', description: 'The quantity must be a whole multiple of it; absent or 0 is no rule.' }
        bom:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/BOMComponent' }
        operations:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/OperationInput' }
        coProducts:
          type: array
          maxItems: 50
          description: 'Co-products and by-products the order yields besides its product (FR-21.14). Not allowed on a rework order.'
          items: { $ref: '#/components/schemas/CoProductInput' }
    CoProductInput:
      type: object
      required: [lineNo, itemId, qtyPer]
      additionalProperties: false
      properties:
        lineNo: { type: string, maxLength: 20, description: 'Unique on the order.' }
        type: { type: string, enum: [co-product, by-product], default: co-product, description: 'A co-product takes its share of the order''s cost by quantity; a by-product carries no cost (BR-9.12) and is received at zero.' }
        itemId: { type: string, format: uuid, description: 'Not the order''s own product.' }
        qtyPer: { $ref: '#/components/schemas/Decimal', description: 'Planned quantity per unit of the order''s product, above zero.' }
    CoProduct:
      type: object
      properties:
        lineNo: { type: string }
        type: { type: string, enum: [co-product, by-product] }
        itemId: { type: string, format: uuid }
        qtyPer: { $ref: '#/components/schemas/Decimal' }
        qtyPlanned: { $ref: '#/components/schemas/Decimal', description: 'qtyPer times the order quantity, rounded up to 6 places; follows a quantity change.' }
        qtyReported: { $ref: '#/components/schemas/Decimal', description: 'Received so far by posted reports as finished, net of reversals.' }
    CoProductReport:
      type: object
      required: [lineNo, quantity]
      additionalProperties: false
      properties:
        lineNo: { type: string, maxLength: 20, description: 'A co-product line of the order, listed once.' }
        quantity: { $ref: '#/components/schemas/Decimal', description: 'Above zero; reported plus this may not exceed the planned quantity plus the RAF tolerance.' }
    PatchOrder:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Quantity while Created or Estimated (re-explodes and re-estimates); delivery date until Released.
        minimumQty, maximumQty and multiple are the item's order rules (FR-21.1) that the new
        quantity must meet; they are accepted only with a quantity. releasedProductId reads the
        minimum and multiple from the released product's site default for the order's site and
        enforces them alongside any rules sent here; it is accepted only with a quantity. An order
        created with a releasedProductId is always checked against that product, with or without the
        id in the body; naming another released product is refused (400, field releasedProductId).
      properties:
        quantity: { $ref: '#/components/schemas/Decimal' }
        deliveryDate: { type: [string, 'null'], format: date }
        releasedProductId: { type: string, format: uuid }
        minimumQty: { $ref: '#/components/schemas/Decimal' }
        maximumQty: { $ref: '#/components/schemas/Decimal' }
        multiple: { $ref: '#/components/schemas/Decimal' }
    CommandBody:
      type: object
      additionalProperties: false
      description: |
        Optional. `report-finished` requires `quantity` (good quantity, > 0) and accepts
        `errorQuantity`, and receipts the order's co-products and by-products in proportion
        to the good quantity (FR-21.14); `reset-status` accepts `status`, an earlier status to reset to
        (default: the previous one); `schedule` accepts `method`, `direction` and `at`. Other
        commands take no body.
      properties:
        quantity: { $ref: '#/components/schemas/Decimal' }
        errorQuantity: { $ref: '#/components/schemas/Decimal' }
        status: { $ref: '#/components/schemas/Status' }
        method: { type: string, enum: [operations, jobs], default: operations, description: ':schedule only. operations gives each operation one process job (setup and run together), jobs a setup job and a process job; queue and transport hours are their own jobs under both.' }
        direction: { type: string, enum: [forward, backward], default: forward, description: ':schedule only. Forward starts the first operation at `at`, backward ends the last one at `at`.' }
        at: { type: string, format: date-time, description: ':schedule only. The instant the plan starts at (forward, default now) or ends at (backward, default the end of the order''s delivery date, 23:59:59 UTC; a backward schedule without it needs a delivery date).' }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        orderNumber: { type: string, description: 'PO-000001, per legal entity.' }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        currency: { type: string }
        itemGroup: { type: string }
        quantity: { $ref: '#/components/schemas/Decimal' }
        qtyRaf: { $ref: '#/components/schemas/Decimal' }
        qtyError: { $ref: '#/components/schemas/Decimal' }
        status: { $ref: '#/components/schemas/Status' }
        deliveryDate: { type: string, format: date }
        startDate: { type: string, format: date, description: 'UTC date of the first start, set by :schedule; absent while the order is unscheduled.' }
        endDate: { type: string, format: date, description: 'UTC date of the last finish, set by :schedule.' }
        schedulingMethod: { type: string, enum: [operations, jobs], description: 'The method of the last :schedule; operations before one runs.' }
        scheduleBasis: { type: string, enum: [infinite, finite], description: 'infinite: the dates come from :schedule or a re-date (one operation after the other, no calendar); finite: scheduling''s windows were applied (:apply-finite-dates).' }
        finiteRunId: { type: string, description: 'The scheduling run the finite dates come from; present only when scheduleBasis is finite and the caller named one.' }
        finiteScheduledAt: { type: string, format: date-time, description: 'When the finite dates were applied; present only when scheduleBasis is finite.' }
        finiteCompressedOperations: { type: array, items: { type: integer }, description: 'Operations whose finite window is shorter than their jobs'' planned hours (applied, flagged); absent when none or when scheduleBasis is infinite.' }
        originType: { type: string }
        originId: { type: string, format: uuid }
        configurationId: { type: string, format: uuid }
        quotaArrangementId: { type: string, format: uuid, description: 'The quota arrangement planning allocated the converted planned order to (FR-22.17); absent on other orders.' }
        quotaSourceId: { type: string, format: uuid, description: 'The quota source within that arrangement; absent on other orders.' }
        releasedProductId: { type: string, format: uuid, description: 'The released product (wave 8) whose site default supplied the order quantity rules at creation (FR-21.1); a quantity change, split or merge is checked against it. Absent when the order was made without one.' }
        reworkReference: { $ref: '#/components/schemas/ReworkReference' }
        splitFromOrderId: { type: string, format: uuid, description: 'The order a split took this order''s quantity from (FR-21.15).' }
        mergedIntoOrderId: { type: string, format: uuid, description: 'Set on a Cancelled order that a merge moved into this order (FR-21.15).' }
        orderBomModified: { type: boolean, description: 'The BOM or route was edited after explosion (FR-21.18); a split copies it and a merge keeps it.' }
        version: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
        operations:
          type: array
          items: { $ref: '#/components/schemas/Operation' }
        coProducts:
          type: array
          description: 'Co-products and by-products of the order (FR-21.14); the planned cost is spread over the product and its co-products by quantity, by-products carry none.'
          items: { $ref: '#/components/schemas/CoProduct' }
        costs:
          type: array
          items: { $ref: '#/components/schemas/CostRow' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        orderNumber: { type: string }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        currency: { type: string }
        quantity: { $ref: '#/components/schemas/Decimal' }
        qtyRaf: { $ref: '#/components/schemas/Decimal' }
        qtyError: { $ref: '#/components/schemas/Decimal' }
        remaining: { $ref: '#/components/schemas/Decimal' }
        status: { $ref: '#/components/schemas/Status' }
        deliveryDate: { type: string, format: date }
        originType: { type: string }
        reworkReference: { $ref: '#/components/schemas/ReworkReference' }
        plannedCost: { $ref: '#/components/schemas/Decimal' }
        actualCost: { $ref: '#/components/schemas/Decimal', description: Material, labor and overhead posted to WIP. }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    EndFinding:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: 'The stable code the matching refusal or warning carries, for example PRODUCTION_UNPOSTED_JOURNALS.' }
        message: { type: string, description: 'The message `:end` refuses with, or the PRD warning, with its values filled in.' }
        count: { type: integer, description: 'Journals or serials the message speaks of; absent when it counts nothing.' }
    EndCheck:
      type: object
      required: [orderId, canEnd, blockers, warnings]
      properties:
        orderId: { type: string, format: uuid }
        canEnd: { type: boolean, description: True when there is no blocker. }
        blockers:
          type: array
          description: What would refuse `:end` now.
          items: { $ref: '#/components/schemas/EndFinding' }
        warnings:
          type: array
          description: What `:end` accepts with a warning.
          items: { $ref: '#/components/schemas/EndFinding' }
    StatusLogEntry:
      type: object
      properties:
        command: { type: string, enum: [estimate, schedule, release, start, report-finished, end, cancel, reset-status, split, merge], description: 'A status command, or split and merge (FR-21.15).' }
        from: { $ref: '#/components/schemas/Status' }
        to: { $ref: '#/components/schemas/Status' }
        actor: { type: string }
        traceId: { type: string }
        occurredAt: { type: string, format: date-time }
    Variance:
      type: object
      properties:
        type: { $ref: '#/components/schemas/VarianceType' }
        costGroup: { $ref: '#/components/schemas/CostGroup' }
        amount: { $ref: '#/components/schemas/Decimal', description: Positive is unfavourable (debit). }
    CostView:
      type: object
      description: |
        FR-21.11. Totals are per cost group and overall in the currency's minor unit; rows keep
        4 decimals. wipBalance is Σ debit − Σ credit on the order's WIP account; it is 0 once
        the order is Ended, when variances hold the settlement (BR-21.6).
      properties:
        orderId: { type: string, format: uuid }
        currency: { type: string }
        totals: { type: object, additionalProperties: { $ref: '#/components/schemas/Decimal' } }
        total: { $ref: '#/components/schemas/Decimal' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CostRow' }
        actualTotals: { type: object, additionalProperties: { $ref: '#/components/schemas/Decimal' } }
        actualTotal: { $ref: '#/components/schemas/Decimal' }
        actualRows:
          type: array
          items: { $ref: '#/components/schemas/CostRow' }
        wipBalance: { $ref: '#/components/schemas/Decimal' }
        variances:
          type: array
          items: { $ref: '#/components/schemas/Variance' }
        varianceTotal: { $ref: '#/components/schemas/Decimal' }
    IssueInput:
      type: object
      required: [lineNo, quantity]
      additionalProperties: false
      properties:
        lineNo: { type: string, maxLength: 20, description: A BOM line of the order, for example 30.1. }
        quantity: { $ref: '#/components/schemas/Decimal' }
        unitCost: { $ref: '#/components/schemas/Decimal', description: 'Actual unit cost; defaults to the line''s estimated cost until inventory (wave 16) supplies it.' }
    HoursInput:
      type: object
      additionalProperties: false
      description: |
        Hours (0.01 minimum, 2 decimals) or quantities, or finished, must be reported. A route card
        line names the operation (operNumber); a job card line names the setup or process job
        (jobId) of a scheduled order, and quantities go on the process job only.
      properties:
        operNumber: { type: integer, minimum: 1, description: The operation of a route card line; not allowed on a job card line. }
        jobId: { type: string, format: uuid, description: 'The setup or process job of a job card line (from the order''s jobs); not allowed on a route card line.' }
        hours: { $ref: '#/components/schemas/Decimal' }
        qtyGood: { $ref: '#/components/schemas/Decimal' }
        qtyError: { $ref: '#/components/schemas/Decimal' }
        finished: { type: boolean, description: Closes the operation (route card) or the job (job card) to further feedback; a job card closes the operation once its setup and process jobs are finished. }
    CreateJournal:
      type: object
      required: [type]
      additionalProperties: false
      description: |
        Without issues or hours the lines are proposed: a picking list over manual and
        available-at-location lines (default remaining), a route card over open in-house
        operations (default remaining), a job card over the open setup and process jobs of a
        scheduled order (default remaining; 409 PRODUCTION_ORDER_NOT_SCHEDULED without jobs), a report as finished over finish-flushed lines
        (default proportional). quantity (good, > 0) and errorQuantity belong to
        report-as-finished, which may also list issues for its finish-flushed lines.
      properties:
        type: { $ref: '#/components/schemas/JournalType' }
        postingDate: { type: string, format: date, description: Default today (UTC). }
        proposal: { $ref: '#/components/schemas/Proposal' }
        quantity: { $ref: '#/components/schemas/Decimal' }
        errorQuantity: { $ref: '#/components/schemas/Decimal' }
        issues:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/IssueInput' }
        hours:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/HoursInput' }
        coProducts:
          type: array
          maxItems: 50
          description: 'Co-product and by-product receipts of a report as finished (FR-21.14): a co-product is valued at the planned unit cost by quantity, a by-product at zero. Without them a journal receipts none; the `:report-finished` command reports every line in proportion.'
          items: { $ref: '#/components/schemas/CoProductReport' }
    JournalLine:
      type: object
      properties:
        kind: { type: string, enum: [issue, hours, receipt, coproduct] }
        lineNo: { type: string }
        coProductLineNo: { type: string, description: 'The order''s co-product line of a coproduct receipt.' }
        operNumber: { type: integer }
        jobType: { type: string, enum: [setup, process], description: 'The job of the operation a job-card hours line reported on.' }
        itemId: { type: string, format: uuid }
        qty: { $ref: '#/components/schemas/Decimal', description: 'Issued quantity, hours, or received good quantity; negative on a reversal.' }
        qtyGood: { $ref: '#/components/schemas/Decimal' }
        qtyError: { $ref: '#/components/schemas/Decimal' }
        finished: { type: boolean }
        unitCost: { $ref: '#/components/schemas/Decimal' }
        amount: { $ref: '#/components/schemas/Decimal', description: 'Material, labor or receipt value, set on posting.' }
        overheadAmount: { $ref: '#/components/schemas/Decimal' }
    Posting:
      type: object
      properties:
        postingType:
          type: string
          enum: [wip-material, inventory-issue, wip-labor, labor-absorption, wip-overhead, overhead-absorption, raf-receipt, wip-raf-offset, wip-settlement,
            variance-lot-size, variance-production-quantity, variance-production-price, variance-production-substitution, variance-rework, split-transfer]
          description: 'split-transfer is the counter row of a split transfer (BR-21.11), on the WIP account with wip false, so the pair nets to zero in the ledger.'
        account: { type: string }
        dr: { $ref: '#/components/schemas/Decimal' }
        cr: { $ref: '#/components/schemas/Decimal' }
        wip: { type: boolean, description: The line is on the order's WIP account. }
    Journal:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        type: { type: string, enum: [picking-list, route-card, job-card, report-as-finished, split-transfer], description: 'split-transfer is the system journal of a split of a Started order (BR-21.11); users create the other four.' }
        journalNumber: { type: string, description: 'PJ-000001, per legal entity.' }
        postingDate: { type: string, format: date }
        posted: { type: boolean }
        postedAt: { type: string, format: date-time }
        postedBy: { type: string }
        qtyGood: { $ref: '#/components/schemas/Decimal' }
        qtyError: { $ref: '#/components/schemas/Decimal' }
        reversalOf: { type: string, format: uuid, description: Set on a reversal journal written by a reset (FR-21.9). }
        reversedBy: { type: string, format: uuid }
        counterpartOrderId: { type: string, format: uuid, description: 'The other order of a split-transfer pair (BR-21.11).' }
        journalEntryId: { type: string, format: uuid, description: The general-ledger entry (wave 11); absent until the ledger books it. }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/JournalLine' }
        postings:
          type: array
          items: { $ref: '#/components/schemas/Posting' }
        triggerFirings:
          type: array
          description: On a posted route card, the trigger points its feedback made due (FR-21.17), in the order they acted.
          items: { $ref: '#/components/schemas/TriggerFiring' }
    TriggerEvent:
      type: string
      enum: [feedback, operation-finished]
      default: feedback
      description: |
        What evaluates a trigger point (FR-21.17). feedback: each route card or job card line of
        its operation, against the line. operation-finished: the operation becoming finished, by
        the :finish command or by a card that finishes it, against the hours and quantities posted
        on the operation in total. An operation the last report as finished closes fires nothing.
    TriggerFunction:
      type: string
      enum: [insert-operations, create-rework-order, release-next, start-workflow, notify]
      description: |
        insert-operations inserts the operations after the reporting one; create-rework-order
        creates a rework order (FR-21.20) for the reported error quantity; notify publishes
        dev.passage.production.triggerpoint.fired.v1 and nothing else. release-next (needs
        scheduled jobs, wave 23) and start-workflow (needs the workflow engine, wave 4) are
        refused with PRODUCTION_TRIGGER_FUNCTION_UNSUPPORTED.
    TriggerOperation:
      type: object
      required: [resourceId]
      additionalProperties: false
      description: An operation a trigger inserts or routes on its rework order; the number is assigned when it fires.
      properties:
        resourceId: { type: string, format: uuid }
        setupTimeH: { $ref: '#/components/schemas/Decimal' }
        runTimeHPer: { $ref: '#/components/schemas/Decimal' }
        scrapPct: { $ref: '#/components/schemas/Decimal' }
        laborRate: { $ref: '#/components/schemas/Decimal' }
        overheadRate: { $ref: '#/components/schemas/Decimal' }
    CreateTriggerPoint:
      type: object
      required: [operNumber, sequence, condition, function]
      additionalProperties: false
      properties:
        operNumber: { type: integer, minimum: 1, description: An operation on the order's route. }
        sequence: { type: integer, minimum: 1, maximum: 9999, description: Unique per operation; due triggers act in ascending sequence (BR-21.13). }
        condition:
          type: string
          maxLength: 200
          examples: ['qty_error > 0', 'hours >= 8', 'error_pct >= 5 and hours > 2']
          description: |
            Comparisons `<field> <op> <number>` joined by `and` / `or` (and binds tighter; at most 5
            comparisons) over the line of the operation (event feedback) or its totals (event
            operation-finished). Fields: qty_error, qty_good, qty_total (good + error), error_pct
            (error as a percentage of the total, 0 without one) and hours; op > >= < <= == !=; the number
            is a plain decimal such as 2 or 0.5 (no exponent).
        event: { $ref: '#/components/schemas/TriggerEvent' }
        function: { $ref: '#/components/schemas/TriggerFunction' }
        repeatable: { type: boolean, default: false, description: Without it the trigger fires once per operation (FR-21.17). }
        operations:
          type: array
          maxItems: 50
          description: Required for insert-operations and create-rework-order, refused for notify.
          items: { $ref: '#/components/schemas/TriggerOperation' }
    TriggerFeedback:
      type: object
      properties:
        hours: { $ref: '#/components/schemas/Decimal' }
        qtyGood: { $ref: '#/components/schemas/Decimal' }
        qtyError: { $ref: '#/components/schemas/Decimal' }
    TriggerFiring:
      type: object
      required: [id, triggerPointId, event, journalId, operNumber, function, status, feedback, insertedOperations, actor, firedAt]
      properties:
        id: { type: string, format: uuid }
        triggerPointId: { type: string, format: uuid }
        event: { $ref: '#/components/schemas/TriggerEvent' }
        journalId: { type: [string, 'null'], format: uuid, description: The card whose post evaluated the trigger; null for event operation-finished. }
        operNumber: { type: integer }
        function: { $ref: '#/components/schemas/TriggerFunction' }
        status: { type: string, enum: [fired, failed] }
        reason: { type: string, description: 'On a failed firing (PROD-0019, PRODUCTION_TRIGGER_FUNCTION_FAILED): why the function changed nothing.' }
        feedback: { $ref: '#/components/schemas/TriggerFeedback' }
        insertedOperations: { type: array, items: { type: integer } }
        reworkOrderId: { type: string, format: uuid }
        actor: { type: string }
        firedAt: { type: string, format: date-time }
    TriggerPoint:
      type: object
      required: [id, orderId, operNumber, sequence, condition, event, function, operations, repeatable, firedCount, createdBy, createdAt, firings]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        operNumber: { type: integer }
        sequence: { type: integer }
        condition: { type: string, description: In canonical form. }
        event: { $ref: '#/components/schemas/TriggerEvent' }
        function: { $ref: '#/components/schemas/TriggerFunction' }
        operations: { type: array, items: { $ref: '#/components/schemas/TriggerOperation' } }
        repeatable: { type: boolean }
        firedCount: { type: integer }
        lastFiredAt: { type: string, format: date-time }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        firings: { type: array, items: { $ref: '#/components/schemas/TriggerFiring' } }
    PostingProfileInput:
      type: object
      additionalProperties: false
      required: [wipAccount, inventoryAccount, finishedGoodsAccount, laborAbsorptionAccount, overheadAbsorptionAccount,
        lotSizeVarianceAccount, quantityVarianceAccount, priceVarianceAccount, substitutionVarianceAccount]
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity and must equal it when the caller has one. }
        itemGroup: { type: string, maxLength: 40, default: All }
        siteId: { type: string, description: 'A site UUID or All.', default: All }
        wipAccount: { type: string, maxLength: 64 }
        inventoryAccount: { type: string, maxLength: 64, description: Picking-list offset. }
        finishedGoodsAccount: { type: string, maxLength: 64, description: Report-as-finished receipt. }
        laborAbsorptionAccount: { type: string, maxLength: 64 }
        overheadAbsorptionAccount: { type: string, maxLength: 64 }
        lotSizeVarianceAccount: { type: string, maxLength: 64 }
        quantityVarianceAccount: { type: string, maxLength: 64 }
        priceVarianceAccount: { type: string, maxLength: 64 }
        substitutionVarianceAccount: { type: string, maxLength: 64 }
        reworkVarianceAccount: { type: string, maxLength: 64, description: 'Optional; ending a rework order with a rework cost needs it (422 PRODUCTION_POSTING_PROFILE_MISSING).' }
    PostingProfile:
      allOf:
        - $ref: '#/components/schemas/PostingProfileInput'
        - type: object
          properties:
            version: { type: integer }
            updatedBy: { type: string }
            updatedAt: { type: string, format: date-time }
    FiniteDates:
      type: object
      required: [operations]
      properties:
        runId: { type: string, maxLength: 64, description: The scheduling run the windows come from, kept on the order. }
        operations:
          type: array
          minItems: 1
          maxItems: 500
          description: One window per operation to move; an operation appears once.
          items:
            type: object
            required: [operNumber, start, end]
            properties:
              operNumber: { type: integer, minimum: 1 }
              start: { type: string, format: date-time }
              end: { type: string, format: date-time, description: Not before start. }
    SplitOrder:
      type: object
      required: [splitQty]
      additionalProperties: false
      properties:
        splitQty: { $ref: '#/components/schemas/Decimal', description: 'The quantity the new order receives; above zero and below the order quantity.' }
        releasedProductId: { type: string, format: uuid, description: 'Enforces the released product''s minimum and multiple (site default for the order''s site) on splitQty; minimumQty and multiple sent here can only tighten them.' }
        minimumQty: { $ref: '#/components/schemas/Decimal', description: 'The item''s minimum order quantity; 0 or absent: no minimum of its own (the released product''s still applies with releasedProductId).' }
        multiple: { $ref: '#/components/schemas/Decimal', description: 'The item''s order multiple; 0 or absent: no multiple of its own (the released product''s still applies with releasedProductId).' }
        allocation:
          type: string
          enum: [proportional, keep-on-original]
          default: proportional
          description: 'For a Started order: proportional moves the split''s share of the posted consumption, route hours and WIP to the new order (BR-21.11); keep-on-original leaves them on the original. Ignored before Started.'
    SplitResult:
      type: object
      properties:
        original: { $ref: '#/components/schemas/Order' }
        new: { $ref: '#/components/schemas/Order' }
    MergeOrders:
      type: object
      required: [orders]
      additionalProperties: false
      properties:
        orders:
          type: array
          minItems: 2
          maxItems: 500
          description: The first order survives; the others are cancelled into it.
          items:
            type: object
            required: [orderId, version]
            properties:
              orderId: { type: string, format: uuid }
              version: { type: integer, minimum: 1, description: The order version (ETag) the caller read. }
    MergeResult:
      type: object
      properties:
        survivor: { $ref: '#/components/schemas/Order' }
        merged: { type: array, items: { type: string, format: uuid } }
    BulkStatus:
      type: object
      required: [command, orderIds]
      additionalProperties: false
      properties:
        command: { type: string, enum: [estimate, schedule, release, start, end, cancel] }
        orderIds: { type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: { type: string, format: uuid } }
    BulkItem:
      type: object
      required: [orderId, ok]
      properties:
        orderId: { type: string, format: uuid }
        ok: { type: boolean }
        status: { $ref: '#/components/schemas/Status' }
        version: { type: integer }
        replayed: { type: boolean, description: The order was already moved by an earlier run of this batch. }
        code: { type: string, description: 'The problem code of a failed order, for example PRODUCTION_ILLEGAL_TRANSITION or PRODUCTION_ORDER_NOT_FOUND.' }
        detail: { type: string }
    BulkResult:
      type: object
      properties:
        command: { type: string }
        succeeded: { type: integer }
        failed: { type: integer }
        code: { type: string, description: 'PRODUCTION_BULK_PARTIAL (PROD-0022) when some orders failed.' }
        detail: { type: string }
        results: { type: array, items: { $ref: '#/components/schemas/BulkItem' } }
    HousekeepingRequest:
      type: object
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity. }
        dryRun: { type: boolean, description: List the candidates and change nothing. }
        orderIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
          description: 'Optional: only these orders (the candidates a dry run showed), so a run acts on no order the caller did not review; listed orders that no longer qualify are left out.'
    HousekeepingOrder:
      type: object
      required: [orderId, orderNumber, siteId, productId, status, quantity, qtyReportedFinished, version, createdAt, ageDays]
      properties:
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        siteId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/Status' }
        quantity: { $ref: '#/components/schemas/Decimal' }
        qtyReportedFinished: { $ref: '#/components/schemas/Decimal' }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        ageDays: { type: integer, description: Whole days since the order was created. }
    HousekeepingResult:
      type: object
      required: [job, legalEntityId, dryRun, replayed, total, truncated, candidates, succeeded, failed, results]
      properties:
        job: { type: string, enum: [cancel-stale-created-orders, auto-end-fully-reported] }
        legalEntityId: { type: string, format: uuid }
        dryRun: { type: boolean }
        replayed: { type: boolean, description: 'The Idempotency-Key was used before: the response replays the orders that run moved, and nothing is scanned again.' }
        total: { type: integer, description: Every order that qualifies, including the ones beyond this call's 500. }
        truncated: { type: boolean, description: More orders qualify than this call took; call again. }
        candidates: { type: array, items: { $ref: '#/components/schemas/HousekeepingOrder' } }
        succeeded: { type: integer }
        failed: { type: integer }
        code: { type: string, description: 'PRODUCTION_BULK_PARTIAL (PROD-0022) when some orders failed.' }
        detail: { type: string }
        results: { type: array, items: { $ref: '#/components/schemas/BulkItem' } }
    EditOp:
      type: string
      enum: [add, remove, change]
    LineEdit:
      type: object
      description: |
        One BOM line edit. add needs itemId and qtyPer (seriesSize 1, scrapPct 0, unitCost 0 and
        manual flushing by default); change sets only the fields it carries; remove carries lineNo only.
      required: [op, lineNo]
      additionalProperties: false
      properties:
        op: { $ref: '#/components/schemas/EditOp' }
        lineNo: { type: string, maxLength: 20 }
        itemId: { type: string, format: uuid }
        qtyPer: { $ref: '#/components/schemas/Decimal' }
        seriesSize: { $ref: '#/components/schemas/Decimal' }
        scrapPct: { $ref: '#/components/schemas/Decimal' }
        roundUp: { type: boolean }
        unitCost: { $ref: '#/components/schemas/Decimal' }
        flushing: { $ref: '#/components/schemas/Flushing' }
    OperationEdit:
      type: object
      description: One route operation edit. add needs resourceId; change sets only the fields it carries; remove carries operNumber only.
      required: [op, operNumber]
      additionalProperties: false
      properties:
        op: { $ref: '#/components/schemas/EditOp' }
        operNumber: { type: integer, minimum: 1 }
        resourceId: { type: string, format: uuid }
        setupTimeH: { $ref: '#/components/schemas/Decimal' }
        runTimeHPer: { $ref: '#/components/schemas/Decimal' }
        scrapPct: { $ref: '#/components/schemas/Decimal' }
        laborRate: { $ref: '#/components/schemas/Decimal' }
        overheadRate: { $ref: '#/components/schemas/Decimal' }
        subcontract: { type: boolean }
        subcontractPrice: { $ref: '#/components/schemas/Decimal' }
        queueBeforeH: { $ref: '#/components/schemas/Decimal' }
        queueAfterH: { $ref: '#/components/schemas/Decimal' }
        transitH: { $ref: '#/components/schemas/Decimal' }
    CoProductEdit:
      type: object
      description: |
        One co-product or by-product edit (FR-21.14). add needs itemId and qtyPer (type co-product by
        default); change sets only the fields it carries; remove carries lineNo only. The planned
        quantity follows the order quantity. A line with receipts or journals keeps its item and type,
        cannot be removed and cannot plan below what was received. As at creation, a line never yields
        the order's own product, an order declares at most 50 lines and a rework order takes none (422).
      required: [op, lineNo]
      additionalProperties: false
      properties:
        op: { $ref: '#/components/schemas/EditOp' }
        lineNo: { type: string, maxLength: 20 }
        type: { type: string, enum: [co-product, by-product] }
        itemId: { type: string, format: uuid }
        qtyPer: { $ref: '#/components/schemas/Decimal' }
    OrderEdits:
      type: object
      description: Line edits apply first, in order, then operation edits, then co-product edits; 1 to 200 edits in all.
      additionalProperties: false
      properties:
        lines: { type: array, items: { $ref: '#/components/schemas/LineEdit' } }
        operations: { type: array, items: { $ref: '#/components/schemas/OperationEdit' } }
        coProducts: { type: array, items: { $ref: '#/components/schemas/CoProductEdit' } }
    OrderEditEntry:
      type: object
      properties:
        orderVersion: { type: integer, description: The order version the edit produced. }
        seq: { type: integer, description: Position of the edit in its request. }
        target: { type: string, enum: [line, operation, coproduct] }
        op: { $ref: '#/components/schemas/EditOp' }
        key: { type: string, description: The line number, or the operation number as text. }
        before: { description: 'The line, operation or co-product before the edit; null for an add.', oneOf: [{ $ref: '#/components/schemas/OrderLine' }, { $ref: '#/components/schemas/Operation' }, { $ref: '#/components/schemas/CoProduct' }, { type: 'null' }] }
        after: { description: 'The line, operation or co-product after the edit; null for a remove.', oneOf: [{ $ref: '#/components/schemas/OrderLine' }, { $ref: '#/components/schemas/Operation' }, { $ref: '#/components/schemas/CoProduct' }, { type: 'null' }] }
        actor: { type: string }
        traceId: { type: string }
        occurredAt: { type: string, format: date-time }
    WIPRow:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        legalEntityId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/Status' }
        currency: { type: string }
        consumption: { $ref: '#/components/schemas/Decimal', description: 'Material, labor and overhead posted to WIP, net of reversals.' }
        rafValue: { $ref: '#/components/schemas/Decimal', description: Value received into finished goods by reports as finished. }
        settled: { $ref: '#/components/schemas/Decimal', description: WIP cleared into variances at End. }
        wipBalance: { $ref: '#/components/schemas/Decimal', description: 'consumption − rafValue − settled; 0 after End.' }
    WIPTotal:
      type: object
      properties:
        currency: { type: string }
        orders: { type: integer }
        consumption: { $ref: '#/components/schemas/Decimal' }
        rafValue: { $ref: '#/components/schemas/Decimal' }
        settled: { $ref: '#/components/schemas/Decimal' }
        wipBalance: { $ref: '#/components/schemas/Decimal' }
    WIPReport:
      type: object
      properties:
        asOf: { type: string, format: date }
        items: { type: array, items: { $ref: '#/components/schemas/WIPRow' } }
        totals: { type: array, items: { $ref: '#/components/schemas/WIPTotal' }, description: Per currency over every order the filter selects. }
        nextCursor: { type: string, format: uuid }
    VarianceReportRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        siteId: { type: string, format: uuid }
        itemGroup: { type: string }
        currency: { type: string }
        type: { $ref: '#/components/schemas/VarianceType' }
        costGroup: { $ref: '#/components/schemas/CostGroup' }
        amount: { $ref: '#/components/schemas/Decimal', description: Positive is unfavourable (debit). }
        planned: { $ref: '#/components/schemas/Decimal', description: The order's planned cost of the cost group. }
        pctOfPlanned: { type: [string, 'null'], description: 'amount / planned × 100 to 2 decimals; null when nothing was planned.' }
        postedOn: { type: string, format: date }
    VarianceReport:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VarianceReportRow' } }
        totals:
          type: array
          description: Per currency and variance type over the whole filter.
          items:
            type: object
            properties:
              currency: { type: string }
              type: { $ref: '#/components/schemas/VarianceType' }
              amount: { $ref: '#/components/schemas/Decimal' }
        net:
          type: array
          description: Net variance per currency; negative is favourable.
          items:
            type: object
            properties:
              currency: { type: string }
              amount: { $ref: '#/components/schemas/Decimal' }
        nextCursor: { type: string, format: uuid }
    SubcontractReportRow:
      type: object
      required: [orderId, orderNumber, orderStatus, legalEntityId, siteId, currency, dueDate, operNumber, resourceId, qty, qtyGood, unitPrice, amount, operStatus, poRequestedAt, poCancelledAt]
      properties:
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        orderStatus: { $ref: '#/components/schemas/Status' }
        legalEntityId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        currency: { type: string }
        dueDate: { type: [string, 'null'], format: date }
        operNumber: { type: integer }
        resourceId: { type: string, format: uuid, description: The vendor resource. }
        qty: { $ref: '#/components/schemas/Decimal', description: "The operation's process quantity (BR-21.8)." }
        qtyGood: { $ref: '#/components/schemas/Decimal' }
        unitPrice: { $ref: '#/components/schemas/Decimal', description: Vendor price per unit of the process quantity. }
        amount: { $ref: '#/components/schemas/Decimal', description: "Planned amount in the currency's minor unit." }
        operStatus: { type: string, enum: [open, started, finished] }
        poRequestedAt: { type: [string, 'null'], format: date-time }
        poCancelledAt: { type: [string, 'null'], format: date-time, description: 'When the vendor PO request was withdrawn; null while requested or never requested.' }
    SubcontractReport:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SubcontractReportRow' } }
        totals:
          type: array
          description: Per currency over the whole filter.
          items:
            type: object
            properties:
              currency: { type: string }
              operations: { type: integer }
              amount: { $ref: '#/components/schemas/Decimal' }
        nextCursor: { type: string }
    Job:
      type: object
      required: [id, orderId, orderNumber, orderStatus, legalEntityId, siteId, productId, operNumber, seq, jobType, resourceId, plannedStart, plannedEnd, plannedHours, hoursReported, qtyGood, qtyError, status]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        orderStatus: { $ref: '#/components/schemas/Status' }
        legalEntityId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        operNumber: { type: integer }
        seq: { type: integer, minimum: 1, description: 'Position of the job within its operation.' }
        jobType: { $ref: '#/components/schemas/JobType' }
        resourceId: { type: string, format: uuid }
        plannedStart: { type: string, format: date-time }
        plannedEnd: { type: string, format: date-time }
        plannedHours: { $ref: '#/components/schemas/Decimal' }
        hoursReported: { $ref: '#/components/schemas/Decimal', description: Hours the job cards reported on the job. }
        qtyGood: { $ref: '#/components/schemas/Decimal', description: Good quantity the job cards reported on the process job. }
        qtyError: { $ref: '#/components/schemas/Decimal', description: Error quantity the job cards reported on the process job. }
        status: { type: string, enum: [planned, started, finished], description: 'planned until a job card reports on the job, started after it, finished by a card that finishes it.' }
    JobType:
      type: string
      enum: [queue-before, setup, process, queue-after, transport]
    JobPage:
      type: object
      required: [items, total, plannedHours]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Job' } }
        total: { type: integer, description: Jobs over the whole filter. }
        plannedHours: { $ref: '#/components/schemas/Decimal', description: Planned hours over the whole filter. }
        nextCursor: { type: string, description: 'Id of the last job of the page; absent on the last page.' }
    OperationsOverviewRow:
      type: object
      required: [orderId, orderNumber, orderStatus, legalEntityId, siteId, productId, dueDate, operNumber, resourceId, subcontract, processQty, plannedHours, hoursReported, qtyGood, qtyError, operStatus]
      properties:
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        orderStatus: { $ref: '#/components/schemas/Status' }
        legalEntityId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dueDate: { type: [string, 'null'], format: date }
        operNumber: { type: integer }
        resourceId: { type: string, format: uuid }
        subcontract: { type: boolean }
        processQty: { $ref: '#/components/schemas/Decimal' }
        plannedHours: { $ref: '#/components/schemas/Decimal', description: Setup + run × process quantity, two places. }
        hoursReported: { $ref: '#/components/schemas/Decimal', description: Hours posted by route cards, two places. }
        qtyGood: { $ref: '#/components/schemas/Decimal' }
        qtyError: { $ref: '#/components/schemas/Decimal' }
        operStatus: { type: string, enum: [open, started, finished] }
    OperationsOverview:
      type: object
      required: [items, totals]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OperationsOverviewRow' } }
        totals:
          type: object
          description: Over the whole filter.
          properties:
            operations: { type: integer }
            open: { type: integer }
            started: { type: integer }
            finished: { type: integer }
            plannedHours: { $ref: '#/components/schemas/Decimal' }
            hoursReported: { $ref: '#/components/schemas/Decimal' }
            qtyGood: { $ref: '#/components/schemas/Decimal' }
            qtyError: { $ref: '#/components/schemas/Decimal' }
        nextCursor: { type: string }
    MaterialLine:
      type: object
      required: [orderId, orderNumber, orderStatus, legalEntityId, siteId, productId, dueDate, lineNumber, itemId, qtyRequired, qtyIssued, qtyOutstanding]
      properties:
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        orderStatus: { $ref: '#/components/schemas/Status' }
        legalEntityId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        dueDate: { type: string, format: date, nullable: true, description: The order's delivery date. }
        lineNumber: { type: string }
        itemId: { type: string, format: uuid }
        qtyRequired: { $ref: '#/components/schemas/Decimal' }
        qtyIssued: { $ref: '#/components/schemas/Decimal' }
        qtyOutstanding: { $ref: '#/components/schemas/Decimal' }
    MaterialRequirements:
      type: object
      required: [items, totals]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MaterialLine' } }
        totals:
          type: object
          description: Over the whole filter.
          properties:
            lines: { type: integer }
            items: { type: integer, description: Distinct component items. }
            orders: { type: integer }
        nextCursor: { type: string }
    MaterialItem:
      type: object
      required: [itemId, orders, lines, qtyRequired, qtyIssued, qtyOutstanding, earliestDue]
      properties:
        itemId: { type: string, format: uuid }
        orders: { type: integer }
        lines: { type: integer }
        qtyRequired: { $ref: '#/components/schemas/Decimal' }
        qtyIssued: { $ref: '#/components/schemas/Decimal' }
        qtyOutstanding: { $ref: '#/components/schemas/Decimal' }
        earliestDue: { type: string, format: date, nullable: true, description: The earliest delivery date of the orders that still wait for the item. }
    MaterialItems:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MaterialItem' } }
        nextCursor: { type: string, format: uuid }
    OrderKpiGroup:
      type: object
      required: [ended, dated, onTime, onTimePct, avgCycleDays, qtyFinished, qtyError, scrapPct, open, overdue]
      properties:
        key: { type: string, description: The site or product id of the group; absent on the totals and without groupBy. }
        ended: { type: integer, description: Orders that ended in the period. }
        dated: { type: integer, description: Of those, orders with a delivery date. }
        onTime: { type: integer, description: 'Of those, orders finished (last report as finished, or the end without one) on or before it.' }
        onTimePct: { type: string, nullable: true, description: 'onTime ÷ dated in percent, two places; null when dated is 0.' }
        avgCycleDays: { type: string, nullable: true, description: Mean days from the first start to the finish, two places; null when none of the ended orders was started. }
        qtyFinished: { $ref: '#/components/schemas/Decimal' }
        qtyError: { $ref: '#/components/schemas/Decimal' }
        scrapPct: { type: string, nullable: true, description: 'Error quantity as a percentage of finished plus error, two places; null when nothing was reported.' }
        open: { type: integer, description: 'Orders whose current status is not Ended or Cancelled (now, not as of asOf).' }
        overdue: { type: integer, description: Of those, with a delivery date before asOf. }
    OrderKpis:
      type: object
      required: [asOf, groups, groupsTotal, totals]
      properties:
        asOf: { type: string, format: date }
        groupBy: { type: string, enum: [site, product] }
        groups: { type: array, items: { $ref: '#/components/schemas/OrderKpiGroup' } }
        groupsTotal: { type: integer, description: Groups before the limit. }
        totals: { $ref: '#/components/schemas/OrderKpiGroup' }
    JournalInquiryRow:
      type: object
      required: [id, orderId, orderNumber, legalEntityId, type, journalNumber, postingDate, posted, postedAt, qtyGood, qtyError, reversalOf, journalEntryId, currency, lines, consumed, received]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        legalEntityId: { type: string, format: uuid }
        type: { type: string, enum: [picking-list, route-card, job-card, report-as-finished, split-transfer] }
        journalNumber: { type: string }
        postingDate: { type: string, format: date }
        posted: { type: boolean }
        postedAt: { type: [string, 'null'], format: date-time }
        qtyGood: { $ref: '#/components/schemas/Decimal' }
        qtyError: { $ref: '#/components/schemas/Decimal' }
        reversalOf: { type: [string, 'null'], format: uuid }
        journalEntryId: { type: [string, 'null'], format: uuid }
        currency: { type: string }
        lines: { type: integer }
        consumed: { $ref: '#/components/schemas/Decimal', description: "Issue and hours lines, rounded to the currency's minor unit." }
        received: { $ref: '#/components/schemas/Decimal', description: "Receipt and co-product lines, rounded to the currency's minor unit." }
    JournalInquiry:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JournalInquiryRow' } }
        total: { type: integer }
        nextCursor: { type: string, format: uuid }
    Problem:
      type: object
      description: RFC 9457 problem details, application/problem+json.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    OCMMode:
      type: string
      enum: [automatic, manual, none]
      description: automatic applies the change at the order's next status command (except cancel) unless the order was edited by hand or the change is blocked, and lists it until then; manual lists it for the planner to apply; none ignores superseded versions.
    ParameterValues:
      type: object
      properties:
        siteId: { type: string, description: 'A site UUID, or All.' }
        rafTolerancePct: { $ref: '#/components/schemas/Decimal', description: 'Over-delivery allowed on report as finished, 0 to 100, two decimals.' }
        overConsumptionPct: { $ref: '#/components/schemas/Decimal', description: 'Picking beyond the required quantity allowed without the over-consumption duty, 0 to 1000, two decimals.' }
        autoStartOnFeedback: { type: boolean, description: A route card on a Released order starts it. }
        estimateOnCreate: { type: boolean, description: A new order is estimated in its create transaction. }
        splitAllocation: { type: string, enum: [proportional, keep-on-original], description: Allocation of a split of a Started order that names none. }
        triggerPointsEnabled: { type: boolean, description: Route-card feedback evaluates the order's trigger points. }
        asBuiltRequired: { type: boolean, description: ':end is refused for an order that reported output without an as-built record.' }
        pickingListProposal: { type: string, enum: [remaining, proportional, none], description: The proposal of a picking-list journal that names none. }
        routeCardProposal: { type: string, enum: [remaining, proportional], description: The hours basis of a route-card journal that names none. }
        staleOrderDays: { type: integer, minimum: 0, maximum: 3650, description: 'Age in days after which cancel-stale-created-orders cancels an order still Created; 0 never cancels.' }
        autoEndEnabled: { type: boolean, description: 'Opts the site in to auto-end-fully-reported.' }
        endJobs: { type: boolean, description: 'The report as finished that brings the reported quantity up to the order quantity finishes every job of the order (End jobs on last RAF); a reversal below the quantity reopens them.' }
        reworkCapitalize: { type: boolean, description: 'Ending a rework order with output moves its remaining WIP (the rework cost) into finished goods instead of posting a rework variance (rework.capitalize, FR-21.20); a rework order ended without output still posts the variance. Off by default.' }
    ProductionParametersInput:
      type: object
      required: [rafTolerancePct, overConsumptionPct, autoStartOnFeedback, estimateOnCreate, splitAllocation, triggerPointsEnabled, asBuiltRequired]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity. }
        siteId: { type: string, description: 'A site UUID, or All (the default).' }
        rafTolerancePct: { $ref: '#/components/schemas/Decimal' }
        overConsumptionPct: { $ref: '#/components/schemas/Decimal' }
        autoStartOnFeedback: { type: boolean }
        estimateOnCreate: { type: boolean }
        splitAllocation: { type: string, enum: [proportional, keep-on-original] }
        triggerPointsEnabled: { type: boolean }
        asBuiltRequired: { type: boolean }
        pickingListProposal: { type: string, enum: [remaining, proportional, none], description: 'Optional: omitted, a replace keeps the stored value and a create takes remaining.' }
        routeCardProposal: { type: string, enum: [remaining, proportional], description: 'Optional: omitted, a replace keeps the stored value and a create takes remaining.' }
        staleOrderDays: { type: integer, minimum: 0, maximum: 3650, description: 'Optional: omitted, a replace keeps the stored value and a create takes 90.' }
        autoEndEnabled: { type: boolean, description: 'Optional: omitted, a replace keeps the stored value and a create takes off.' }
        endJobs: { type: boolean, description: 'Optional: omitted, a replace keeps the stored value and a create takes on (the PRD default).' }
        reworkCapitalize: { type: boolean, description: 'Optional: omitted, a replace keeps the stored value and a create takes off (the PRD default).' }
    ProductionParameters:
      allOf:
        - $ref: '#/components/schemas/ParameterValues'
        - type: object
          properties:
            legalEntityId: { type: string, format: uuid }
            version: { type: integer }
            updatedBy: { type: string }
            updatedAt: { type: string, format: date-time }
    OCMProfileInput:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity. }
        itemGroup: { type: string, maxLength: 40, description: 'Default All.' }
        siteId: { type: string, description: 'A site UUID, or All (the default).' }
        mode: { $ref: '#/components/schemas/OCMMode' }
        surchargeFixed: { $ref: '#/components/schemas/Decimal', description: 'Fixed change-cost surcharge, 0 or more, in the order currency (BR-21.12).' }
        surchargePct: { $ref: '#/components/schemas/Decimal', description: 'Percentage of a positive planned-cost delta added to the change cost, 0 to 1000.' }
    OCMProfile:
      allOf:
        - $ref: '#/components/schemas/OCMProfileInput'
        - type: object
          properties:
            version: { type: integer }
            updatedBy: { type: string }
            updatedAt: { type: string, format: date-time }
    ChangeDelta:
      type: object
      properties:
        linesAdded: { type: integer }
        linesRemoved: { type: integer }
        linesChanged: { type: integer }
        operationsAdded: { type: integer }
        operationsRemoved: { type: integer }
        operationsChanged: { type: integer }
    OrderChange:
      type: object
      description: An OrderChangeRecord (FR-21.16).
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        ecoId: { type: string }
        status: { type: string, enum: [pending, applied, dismissed] }
        profileMode: { type: string, enum: [automatic, manual], description: The profile mode that applied at detection. }
        needsReview: { type: boolean, description: 'The order was edited by hand (FR-21.18), before detection or since: never applied automatically, flagged for manual review.' }
        changesBom: { type: boolean }
        changesRoute: { type: boolean }
        delta: { $ref: '#/components/schemas/ChangeDelta' }
        deltaCount: { type: integer }
        currency: { type: string }
        changeCost: { $ref: '#/components/schemas/Decimal', description: 'New minus old planned cost plus the profile surcharge (BR-21.12), at detection and, once applied, as applied.' }
        beforeHash: { type: [string, 'null'], description: SHA-256 of the order's lines and operations before the change, set when applied. }
        afterHash: { type: [string, 'null'], description: SHA-256 after the change, set when applied. }
        note: { type: string }
        version: { type: integer, description: For If-Match on :apply and :dismiss. }
        detectedBy: { type: string }
        detectedAt: { type: string, format: date-time }
        resolvedBy: { type: [string, 'null'] }
        resolvedAt: { type: [string, 'null'], format: date-time }
    DetectChangesRequest:
      type: object
      required: [ecoId, productId]
      additionalProperties: false
      description: The ECO notice (wave 9 hands over the new version until the service reads it). At least one of bom and operations is required; a part left out is not changed on the orders.
      properties:
        ecoId: { type: string, maxLength: 100 }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid, description: Only orders of this site. }
        bom: { type: array, items: { $ref: '#/components/schemas/BOMComponent' }, description: The new BOM snapshot; replaces the lines of every open order of the product. }
        operations: { type: array, minItems: 1, items: { $ref: '#/components/schemas/OperationInput' }, description: The new route; replaces the operations of every open order of the product. }
    DetectChangesResult:
      type: object
      properties:
        ecoId: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/OrderChange' }, description: The records created by this call. }
        existing: { type: integer, description: Open orders already recorded for the ECO (a repeated notice). }
        skippedByProfile: { type: integer, description: Open orders whose OCM profile is none. }
        skippedNoDelta: { type: integer, description: Open orders that already match the new BOM and route. }
    ChangeCost:
      type: object
      properties:
        oldPlanned: { $ref: '#/components/schemas/Decimal' }
        newPlanned: { $ref: '#/components/schemas/Decimal' }
        delta: { $ref: '#/components/schemas/Decimal' }
        surcharge: { $ref: '#/components/schemas/Decimal' }
        total: { $ref: '#/components/schemas/Decimal', description: delta + surcharge. }
    ChangePreview:
      type: object
      properties:
        change: { $ref: '#/components/schemas/OrderChange' }
        delta: { $ref: '#/components/schemas/ChangeDelta' }
        cost: { $ref: '#/components/schemas/ChangeCost' }
        edits: { $ref: '#/components/schemas/OrderEdits', description: The order edits that applying performs. }
        blocked:
          description: Why applying would be refused now (null when it can be applied).
          oneOf:
            - type: 'null'
            - type: object
              properties:
                code: { type: string }
                detail: { type: string }
    AppliedChange:
      type: object
      properties:
        change: { $ref: '#/components/schemas/OrderChange' }
        order: { $ref: '#/components/schemas/Order' }
    DismissChange:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 500 }
    PlannedIntake:
      type: object
      description: A firmed production planned order waiting to become a production order (FR-22.10).
      required: [id, legalEntityId, plannedOrderId, planVersionId, batchId, targetId, productId, siteId, warehouseId, quantity, orderDate, deliveryDate, quotaArrangementId, quotaSourceId, status, orderId, dismissReason, version, receivedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: [string, 'null'], format: uuid, description: "The planned order's legal entity; the converted order takes it. Null while planning's event does not carry it: such a row is visible to all-entity callers only." }
        plannedOrderId: { type: string, format: uuid, description: The planned order in planning; the order made from it has this as originId. }
        planVersionId: { type: string, format: uuid }
        batchId: { type: string, format: uuid, description: The firming request. }
        targetId: { type: string, format: uuid, description: The id the production order takes when the row is converted. }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: [string, 'null'], format: uuid, description: 'The warehouse of a warehouse planning scope (FR-22.18) the order receives into; null for the site scope.' }
        quantity: { type: string, description: Decimal string in the inventory unit. }
        orderDate: { type: string, format: date }
        deliveryDate: { type: string, format: date }
        quotaArrangementId: { type: [string, 'null'], format: uuid }
        quotaSourceId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [open, converted, dismissed] }
        orderId: { type: [string, 'null'], format: uuid, description: The production order a converted row made. }
        dismissReason: { type: [string, 'null'] }
        version: { type: integer }
        receivedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlannedIntakePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PlannedIntake' } }
        nextCursor: { type: string, format: uuid, description: Pass as cursor for the next page; absent on the last page. }
    ConvertPlannedOrder:
      type: object
      description: |
        The create request minus what the planned order fixes. productId, siteId, quantity, deliveryDate,
        originType and originId come from the row and are ignored when sent; warehouseId is the row's, and is
        required here only when the row has none (a site scope order).
      required: [currency, operations]
      properties:
        legalEntityId: { type: string, format: uuid, description: "Optional: the row's legal entity is used, and another one is refused (COM-0001). Only a row without one takes this, or the caller's." }
        warehouseId: { type: string, format: uuid }
        itemGroup: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        bom: { type: array, items: { $ref: '#/components/schemas/BOMComponent' } }
        operations: { type: array, items: { $ref: '#/components/schemas/Operation' } }
        coProducts: { type: array, items: { $ref: '#/components/schemas/CoProductInput' } }
        minimumQty: { $ref: '#/components/schemas/Decimal' }
        maximumQty: { $ref: '#/components/schemas/Decimal' }
        multiple: { $ref: '#/components/schemas/Decimal' }
    DismissPlannedOrder:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
paths:
  /v1/production/orders:
    get:
      operationId: listProductionOrders
      summary: List orders, newest first, with keyset pagination
      x-passage-duty: production.order.read
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { name: originType, in: query, schema: { type: string, enum: [PlannedOrder, SalesOrderLine, Manual, Kanban, Rework, Split] } }
        - { name: reworkOf, in: query, description: 'An order id: only the rework orders that reference it (FR-21.20).', schema: { type: string, format: uuid } }
        - { name: cursor, in: query, description: nextCursor of the previous page, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: A page of orders visible in the caller's legal-entity scope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrderSummary' }
                  nextCursor: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createProductionOrder
      summary: Create a production order and explode its BOM and route
      x-passage-duty: production.order.write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrder' }
      responses:
        '201':
          description: |
            Created; emits dev.passage.production.order.created.v1. With PRODUCTION_ESTIMATE_ON_CREATE
            (4.21.13 "Estimate on create") the order is estimated in the same transaction: it is
            returned Estimated at version 2 with its planned cost, an `estimate` status-log row and
            dev.passage.production.order.statuschanged.v1 after order.created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '200':
          description: Replay of an earlier request with the same Idempotency-Key and body.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: 'Validation failed or Idempotency-Key missing (COM-0001)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'AUTH-0003: a missing route duty, or originType Rework without production.order.rework', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'Explosion or operation rule failed (PRODUCTION_INVALID_INPUT); the quantity breaks the minimumQty, maximumQty or multiple (PRODUCTION_ORDER_QUANTITY); the rework reference does not name an order of the same product with enough output (PRODUCTION_REWORK_REFERENCE_INVALID); key reused with another body (idempotency_key_reuse)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { description: 'PRODUCTION_PRODUCT_UNAVAILABLE: releasedProductId was sent and the product service is not configured or could not be read; nothing is written.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/sales-line-orders:
    post:
      operationId: createSalesLineProductionOrder
      summary: Create the production order of one configured sales order line
      description: |
        originType is SalesOrderLine, originId the sales order line and configurationId the saved
        configuration (required). BOM and route are optional: they are resolved from the
        configuration in wave 9. Idempotent per line: a repeat for the same line, product and
        configuration returns the stored order (200, Idempotent-Replayed); another product or
        configuration for the line, or a line already built in another legal entity, is 409
        PRODUCTION_ORIGIN_CONFLICT. Called by the sales service with a service token.
      x-passage-duty: production.order.create-from-sales
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
