openapi: 3.1.0
info:
  title: Passage production orders
  version: 0.21.5
  description: |
    Wave 21 slices 1 to 4 of PSG-21. Creates production orders with BOM and route
    explosion, lists and reads them, edits the header, runs the status state machine
    (BR-21.1) and estimates planned cost. Slice 2 adds posting profiles (FR-21.13), picking
    lists, route cards and report-as-finished journals with their WIP postings (FR-21.5 to
    FR-21.7), the posting effects of :start, :report-finished, :end (settlement, FR-21.8) and
    :reset-status (reversal journals, FR-21.9), and the actual-cost read (FR-21.11). Job
    cards, subcontracting and the other FR-21 items are later slices (see NOT-IMPLEMENTED.md).
    Slice 3 adds rework orders (FR-21.20: originType Rework with a reworkReference, receipts
    at the reworked units' existing cost, End settles the rest as variances of type rework)
    and as-built genealogy (FR-21.19, BR-21.14: assign, detach, and the as-built / where-used
    inquiry).
    Slice 4 adds the bulk status update (FR-21.12: one command on up to 500 orders with
    per-order results), and split and merge of Created to Released orders (FR-21.15).
    Slice 5 adds order-specific BOM and route edits before Started (FR-21.18: add, remove and
    change lines and operations, re-explosion, re-estimate, orderBomModified and the audit
    trail) and the cross-order WIP balance and variance reports (4.21.14).
    Problems are RFC 9457 with a stable `code` (see README). The gateway serves these paths
    under `/api`.
servers:
  - url: https://api.{env}.passage.dev/api
    variables:
      env: { default: dev }
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    JournalId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AsBuiltId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Command:
      name: command
      in: path
      required: true
      description: The custom method after the colon, for example `…/orders/0195d6a0-…:release`.
      schema: { $ref: '#/components/schemas/Command' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Replays with the same key and body return the first result; the same key with another body is 422 idempotency_key_reuse.
      schema: { type: string, minLength: 1, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The order version from the ETag of the last read, quoted, for example "3".
      schema: { type: string }
  headers:
    ETag:
      description: The order version, quoted.
      schema: { type: string }
    IdempotentReplayed:
      description: '"true" when the response replays an earlier request with the same Idempotency-Key.'
      schema: { type: string, enum: ['true'] }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Decimal:
      type: string
      description: Decimal number as a string (JSON numbers are accepted on input); never a float.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    Status:
      type: string
      enum: [Created, Estimated, Scheduled, Released, Started, ReportedAsFinished, Ended, Cancelled]
    Command:
      type: string
      enum: [estimate, schedule, release, start, report-finished, end, cancel, reset-status]
    CostGroup:
      type: string
      enum: [material, labor, overhead, subcontract]
    Flushing:
      type: string
      description: |
        When a BOM line's material is consumed (FR-21.5): manual and available-at-location
        lines by picking lists, start lines by :start, finish lines by report as finished.
      enum: [manual, start, finish, available-at-location]
    JournalType:
      type: string
      enum: [picking-list, route-card, report-as-finished]
    Proposal:
      type: string
      description: |
        remaining proposes what is left; proportional proposes the requirement × reported
        quantity ÷ order quantity, less what is booked; none proposes nothing.
      enum: [remaining, proportional, none]
    VarianceType:
      type: string
      description: The four of BR-21.6, and rework for a rework order (FR-21.20).
      enum: [lot-size, production-quantity, production-price, production-substitution, rework]
    ReworkReference:
      type: object
      additionalProperties: false
      required: [type, id]
      description: |
        The original a rework order reports against (FR-21.20). For type order, id is the
        original order's id; that order must exist, make the same product and have reported
        at least the rework quantity as finished (422 PRODUCTION_REWORK_REFERENCE_INVALID).
        For batch or serial, id is the number, kept as entered until tracking (wave 16).
      properties:
        type: { type: string, enum: [order, batch, serial] }
        id: { type: string, minLength: 1, maxLength: 100 }
    Tracking:
      type: string
      description: A serial component is consumed in quantity 1; a batch in any positive quantity.
      enum: [serial, batch]
    AssignAsBuilt:
      type: object
      additionalProperties: false
      required: [finishedSerialOrBatch, componentItemId, tracking, componentSerialOrBatch]
      properties:
        finishedSerialOrBatch: { type: string, minLength: 1, maxLength: 100 }
        componentItemId: { type: string, format: uuid, description: A component on the order's BOM. }
        tracking: { $ref: '#/components/schemas/Tracking' }
        componentSerialOrBatch: { type: string, minLength: 1, maxLength: 100 }
        qty: { $ref: '#/components/schemas/Decimal', description: 'Default 1; must be 1 for a serial.' }
    AsBuiltRecord:
      type: object
      description: |
        One component serial or batch consumed into one finished serial or batch of an order
        (PRD 4.21.4 AsBuiltRecord). journalId and rafJournalId stay null until tracking
        dimensions (wave 16) capture serials on picking and RAF lines.
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        finishedItemId: { type: string, format: uuid, description: The order's product. }
        finishedSerialOrBatch: { type: string }
        componentItemId: { type: string, format: uuid }
        tracking: { $ref: '#/components/schemas/Tracking' }
        componentSerialOrBatch: { type: string }
        qty: { $ref: '#/components/schemas/Decimal' }
        journalId: { type: string, format: uuid }
        rafJournalId: { type: string, format: uuid }
        assignedBy: { type: string }
        assignedAt: { type: string, format: date-time }
        detachedBy: { type: string }
        detachedAt: { type: string, format: date-time }
    BOMComponent:
      type: object
      description: |
        One line of the BOM version snapshot. A phantom line has no stock of its own; its
        children are exploded in place and numbered under it (30 → 30.1, 30.2). Top-level
        line numbers are required and unique; children's numbers are derived.
      required: [qtyPer]
      additionalProperties: false
      properties:
        lineNo: { type: string, maxLength: 20 }
        itemId: { type: string, format: uuid, description: Required on every non-phantom line. }
        qtyPer: { $ref: '#/components/schemas/Decimal' }
        seriesSize: { $ref: '#/components/schemas/Decimal', description: 'Default 1.' }
        scrapPct: { $ref: '#/components/schemas/Decimal', description: 'From 0 up to but excluding 100.' }
        roundUp: { type: boolean, description: Round the required quantity up to a whole unit (BR-21.2). }
        unitCost: { $ref: '#/components/schemas/Decimal', description: Unit cost from the active costing version (wave 20). }
        flushing: { $ref: '#/components/schemas/Flushing', description: 'Default manual; a phantom''s children inherit its principle.' }
        phantom: { type: boolean }
        children:
          type: array
          items: { $ref: '#/components/schemas/BOMComponent' }
    OperationInput:
      type: object
      required: [operNumber, resourceId]
      additionalProperties: false
      properties:
        operNumber: { type: integer, minimum: 1, description: Strictly increasing along the route. }
        resourceId: { type: string, format: uuid }
        setupTimeH: { $ref: '#/components/schemas/Decimal' }
        runTimeHPer: { $ref: '#/components/schemas/Decimal' }
        scrapPct: { $ref: '#/components/schemas/Decimal' }
        laborRate: { $ref: '#/components/schemas/Decimal' }
        overheadRate: { $ref: '#/components/schemas/Decimal' }
        subcontract: { type: boolean }
        subcontractPrice: { $ref: '#/components/schemas/Decimal', description: Vendor price per unit of the process quantity. }
    Operation:
      allOf:
        - $ref: '#/components/schemas/OperationInput'
        - type: object
          properties:
            processQty: { $ref: '#/components/schemas/Decimal', description: 'Quantity to start at the operation (BR-21.8).' }
            hoursReported: { $ref: '#/components/schemas/Decimal', description: Hours posted by route cards. }
            qtyGood: { $ref: '#/components/schemas/Decimal' }
            qtyError: { $ref: '#/components/schemas/Decimal' }
            status: { type: string, enum: [open, started, finished] }
    OrderLine:
      type: object
      properties:
        lineNo: { type: string }
        itemId: { type: string, format: uuid }
        qtyPer: { $ref: '#/components/schemas/Decimal' }
        seriesSize: { $ref: '#/components/schemas/Decimal' }
        scrapPct: { $ref: '#/components/schemas/Decimal' }
        roundUp: { type: boolean }
        qtyRequired: { $ref: '#/components/schemas/Decimal' }
        unitCost: { $ref: '#/components/schemas/Decimal' }
        flushing: { $ref: '#/components/schemas/Flushing' }
        qtyConsumed: { $ref: '#/components/schemas/Decimal', description: Issued by posted journals. }
    CostRow:
      type: object
      properties:
        group: { $ref: '#/components/schemas/CostGroup' }
        key: { type: string, description: Item id for material, resourceId@operNumber otherwise. }
        qty: { $ref: '#/components/schemas/Decimal' }
        amount: { $ref: '#/components/schemas/Decimal', description: 4 decimals (FR-21.3). }
        fixed: { $ref: '#/components/schemas/Decimal', description: The setup part of the amount. }
    CreateOrder:
      type: object
      required: [productId, siteId, warehouseId, currency, quantity, operations]
      additionalProperties: false
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity and must equal it when the caller has one. }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        itemGroup: { type: string, maxLength: 40, description: 'The product''s item group, the posting-profile key with the site (FR-21.13). All is reserved.' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        quantity: { $ref: '#/components/schemas/Decimal' }
        deliveryDate: { type: [string, 'null'], format: date }
        originType:
          type: string
          enum: [PlannedOrder, SalesOrderLine, Manual, Kanban, Rework]
          default: Manual
          description: |
            Rework makes a rework order (FR-21.20) and needs the duty production.order.rework.
            A rework order has no BOM explosion by default: list the components to add, and the
            product itself as a line to issue the reworked units into WIP at their cost.
            Defaults to Rework when reworkReference is set.
        originId: { type: [string, 'null'], format: uuid }
        reworkReference: { $ref: '#/components/schemas/ReworkReference' }
        bom:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/BOMComponent' }
        operations:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/OperationInput' }
    PatchOrder:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Quantity while Created or Estimated (re-explodes and re-estimates); delivery date until Released.
      properties:
        quantity: { $ref: '#/components/schemas/Decimal' }
        deliveryDate: { type: [string, 'null'], format: date }
    CommandBody:
      type: object
      additionalProperties: false
      description: |
        Optional. `report-finished` requires `quantity` (good quantity, > 0) and accepts
        `errorQuantity`; `reset-status` accepts `status`, an earlier status to reset to
        (default: the previous one). Other commands take no body.
      properties:
        quantity: { $ref: '#/components/schemas/Decimal' }
        errorQuantity: { $ref: '#/components/schemas/Decimal' }
        status: { $ref: '#/components/schemas/Status' }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        orderNumber: { type: string, description: 'PO-000001, per legal entity.' }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        currency: { type: string }
        itemGroup: { type: string }
        quantity: { $ref: '#/components/schemas/Decimal' }
        qtyRaf: { $ref: '#/components/schemas/Decimal' }
        qtyError: { $ref: '#/components/schemas/Decimal' }
        status: { $ref: '#/components/schemas/Status' }
        deliveryDate: { type: string, format: date }
        originType: { type: string }
        originId: { type: string, format: uuid }
        reworkReference: { $ref: '#/components/schemas/ReworkReference' }
        splitFromOrderId: { type: string, format: uuid, description: 'The order a split took this order''s quantity from (FR-21.15).' }
        mergedIntoOrderId: { type: string, format: uuid, description: 'Set on a Cancelled order that a merge moved into this order (FR-21.15).' }
        orderBomModified: { type: boolean, description: 'The BOM or route was edited after explosion (FR-21.18); a split copies it and a merge keeps it.' }
        version: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
        operations:
          type: array
          items: { $ref: '#/components/schemas/Operation' }
        costs:
          type: array
          items: { $ref: '#/components/schemas/CostRow' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        orderNumber: { type: string }
        productId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        currency: { type: string }
        quantity: { $ref: '#/components/schemas/Decimal' }
        qtyRaf: { $ref: '#/components/schemas/Decimal' }
        qtyError: { $ref: '#/components/schemas/Decimal' }
        remaining: { $ref: '#/components/schemas/Decimal' }
        status: { $ref: '#/components/schemas/Status' }
        deliveryDate: { type: string, format: date }
        originType: { type: string }
        reworkReference: { $ref: '#/components/schemas/ReworkReference' }
        plannedCost: { $ref: '#/components/schemas/Decimal' }
        actualCost: { $ref: '#/components/schemas/Decimal', description: Material, labor and overhead posted to WIP. }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    StatusLogEntry:
      type: object
      properties:
        command: { type: string, enum: [estimate, schedule, release, start, report-finished, end, cancel, reset-status, split, merge], description: 'A status command, or split and merge (FR-21.15).' }
        from: { $ref: '#/components/schemas/Status' }
        to: { $ref: '#/components/schemas/Status' }
        actor: { type: string }
        traceId: { type: string }
        occurredAt: { type: string, format: date-time }
    Variance:
      type: object
      properties:
        type: { $ref: '#/components/schemas/VarianceType' }
        costGroup: { $ref: '#/components/schemas/CostGroup' }
        amount: { $ref: '#/components/schemas/Decimal', description: Positive is unfavourable (debit). }
    CostView:
      type: object
      description: |
        FR-21.11. Totals are per cost group and overall in the currency's minor unit; rows keep
        4 decimals. wipBalance is Σ debit − Σ credit on the order's WIP account; it is 0 once
        the order is Ended, when variances hold the settlement (BR-21.6).
      properties:
        orderId: { type: string, format: uuid }
        currency: { type: string }
        totals: { type: object, additionalProperties: { $ref: '#/components/schemas/Decimal' } }
        total: { $ref: '#/components/schemas/Decimal' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CostRow' }
        actualTotals: { type: object, additionalProperties: { $ref: '#/components/schemas/Decimal' } }
        actualTotal: { $ref: '#/components/schemas/Decimal' }
        actualRows:
          type: array
          items: { $ref: '#/components/schemas/CostRow' }
        wipBalance: { $ref: '#/components/schemas/Decimal' }
        variances:
          type: array
          items: { $ref: '#/components/schemas/Variance' }
        varianceTotal: { $ref: '#/components/schemas/Decimal' }
    IssueInput:
      type: object
      required: [lineNo, quantity]
      additionalProperties: false
      properties:
        lineNo: { type: string, maxLength: 20, description: A BOM line of the order, for example 30.1. }
        quantity: { $ref: '#/components/schemas/Decimal' }
        unitCost: { $ref: '#/components/schemas/Decimal', description: 'Actual unit cost; defaults to the line''s estimated cost until inventory (wave 16) supplies it.' }
    HoursInput:
      type: object
      required: [operNumber]
      additionalProperties: false
      description: Hours (0.01 minimum, 2 decimals) or quantities, or finished, must be reported.
      properties:
        operNumber: { type: integer, minimum: 1 }
        hours: { $ref: '#/components/schemas/Decimal' }
        qtyGood: { $ref: '#/components/schemas/Decimal' }
        qtyError: { $ref: '#/components/schemas/Decimal' }
        finished: { type: boolean, description: Closes the operation to further feedback. }
    CreateJournal:
      type: object
      required: [type]
      additionalProperties: false
      description: |
        Without issues or hours the lines are proposed: a picking list over manual and
        available-at-location lines (default remaining), a route card over open in-house
        operations (default remaining), a report as finished over finish-flushed lines
        (default proportional). quantity (good, > 0) and errorQuantity belong to
        report-as-finished, which may also list issues for its finish-flushed lines.
      properties:
        type: { $ref: '#/components/schemas/JournalType' }
        postingDate: { type: string, format: date, description: Default today (UTC). }
        proposal: { $ref: '#/components/schemas/Proposal' }
        quantity: { $ref: '#/components/schemas/Decimal' }
        errorQuantity: { $ref: '#/components/schemas/Decimal' }
        issues:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/IssueInput' }
        hours:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/HoursInput' }
    JournalLine:
      type: object
      properties:
        kind: { type: string, enum: [issue, hours, receipt] }
        lineNo: { type: string }
        operNumber: { type: integer }
        itemId: { type: string, format: uuid }
        qty: { $ref: '#/components/schemas/Decimal', description: 'Issued quantity, hours, or received good quantity; negative on a reversal.' }
        qtyGood: { $ref: '#/components/schemas/Decimal' }
        qtyError: { $ref: '#/components/schemas/Decimal' }
        finished: { type: boolean }
        unitCost: { $ref: '#/components/schemas/Decimal' }
        amount: { $ref: '#/components/schemas/Decimal', description: 'Material, labor or receipt value, set on posting.' }
        overheadAmount: { $ref: '#/components/schemas/Decimal' }
    Posting:
      type: object
      properties:
        postingType:
          type: string
          enum: [wip-material, inventory-issue, wip-labor, labor-absorption, wip-overhead, overhead-absorption, raf-receipt, wip-raf-offset, wip-settlement,
            variance-lot-size, variance-production-quantity, variance-production-price, variance-production-substitution]
        account: { type: string }
        dr: { $ref: '#/components/schemas/Decimal' }
        cr: { $ref: '#/components/schemas/Decimal' }
        wip: { type: boolean, description: The line is on the order's WIP account. }
    Journal:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/JournalType' }
        journalNumber: { type: string, description: 'PJ-000001, per legal entity.' }
        postingDate: { type: string, format: date }
        posted: { type: boolean }
        postedAt: { type: string, format: date-time }
        postedBy: { type: string }
        qtyGood: { $ref: '#/components/schemas/Decimal' }
        qtyError: { $ref: '#/components/schemas/Decimal' }
        reversalOf: { type: string, format: uuid, description: Set on a reversal journal written by a reset (FR-21.9). }
        reversedBy: { type: string, format: uuid }
        journalEntryId: { type: string, format: uuid, description: The general-ledger entry (wave 11); absent until the ledger books it. }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/JournalLine' }
        postings:
          type: array
          items: { $ref: '#/components/schemas/Posting' }
    PostingProfileInput:
      type: object
      additionalProperties: false
      required: [wipAccount, inventoryAccount, finishedGoodsAccount, laborAbsorptionAccount, overheadAbsorptionAccount,
        lotSizeVarianceAccount, quantityVarianceAccount, priceVarianceAccount, substitutionVarianceAccount]
      properties:
        legalEntityId: { type: string, format: uuid, description: Defaults to the caller's legal entity and must equal it when the caller has one. }
        itemGroup: { type: string, maxLength: 40, default: All }
        siteId: { type: string, description: 'A site UUID or All.', default: All }
        wipAccount: { type: string, maxLength: 64 }
        inventoryAccount: { type: string, maxLength: 64, description: Picking-list offset. }
        finishedGoodsAccount: { type: string, maxLength: 64, description: Report-as-finished receipt. }
        laborAbsorptionAccount: { type: string, maxLength: 64 }
        overheadAbsorptionAccount: { type: string, maxLength: 64 }
        lotSizeVarianceAccount: { type: string, maxLength: 64 }
        quantityVarianceAccount: { type: string, maxLength: 64 }
        priceVarianceAccount: { type: string, maxLength: 64 }
        substitutionVarianceAccount: { type: string, maxLength: 64 }
        reworkVarianceAccount: { type: string, maxLength: 64, description: 'Optional; ending a rework order with a rework cost needs it (422 PRODUCTION_POSTING_PROFILE_MISSING).' }
    PostingProfile:
      allOf:
        - $ref: '#/components/schemas/PostingProfileInput'
        - type: object
          properties:
            version: { type: integer }
            updatedBy: { type: string }
            updatedAt: { type: string, format: date-time }
    SplitOrder:
      type: object
      required: [splitQty]
      additionalProperties: false
      properties:
        splitQty: { $ref: '#/components/schemas/Decimal', description: 'The quantity the new order receives; above zero and below the order quantity.' }
        minimumQty: { $ref: '#/components/schemas/Decimal', description: 'The item''s minimum order quantity (released-product settings, wave 8, are not read yet); 0 or absent: no minimum.' }
        multiple: { $ref: '#/components/schemas/Decimal', description: 'The item''s order multiple; 0 or absent: any quantity.' }
    SplitResult:
      type: object
      properties:
        original: { $ref: '#/components/schemas/Order' }
        new: { $ref: '#/components/schemas/Order' }
    MergeOrders:
      type: object
      required: [orders]
      additionalProperties: false
      properties:
        orders:
          type: array
          minItems: 2
          maxItems: 500
          description: The first order survives; the others are cancelled into it.
          items:
            type: object
            required: [orderId, version]
            properties:
              orderId: { type: string, format: uuid }
              version: { type: integer, minimum: 1, description: The order version (ETag) the caller read. }
    MergeResult:
      type: object
      properties:
        survivor: { $ref: '#/components/schemas/Order' }
        merged: { type: array, items: { type: string, format: uuid } }
    BulkStatus:
      type: object
      required: [command, orderIds]
      additionalProperties: false
      properties:
        command: { type: string, enum: [estimate, schedule, release, start, end, cancel] }
        orderIds: { type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: { type: string, format: uuid } }
    BulkItem:
      type: object
      required: [orderId, ok]
      properties:
        orderId: { type: string, format: uuid }
        ok: { type: boolean }
        status: { $ref: '#/components/schemas/Status' }
        version: { type: integer }
        replayed: { type: boolean, description: The order was already moved by an earlier run of this batch. }
        code: { type: string, description: 'The problem code of a failed order, for example PRODUCTION_ILLEGAL_TRANSITION or PRODUCTION_ORDER_NOT_FOUND.' }
        detail: { type: string }
    BulkResult:
      type: object
      properties:
        command: { type: string }
        succeeded: { type: integer }
        failed: { type: integer }
        code: { type: string, description: 'PRODUCTION_BULK_PARTIAL (PROD-0022) when some orders failed.' }
        detail: { type: string }
        results: { type: array, items: { $ref: '#/components/schemas/BulkItem' } }
    EditOp:
      type: string
      enum: [add, remove, change]
    LineEdit:
      type: object
      description: |
        One BOM line edit. add needs itemId and qtyPer (seriesSize 1, scrapPct 0, unitCost 0 and
        manual flushing by default); change sets only the fields it carries; remove carries lineNo only.
      required: [op, lineNo]
      additionalProperties: false
      properties:
        op: { $ref: '#/components/schemas/EditOp' }
        lineNo: { type: string, maxLength: 20 }
        itemId: { type: string, format: uuid }
        qtyPer: { $ref: '#/components/schemas/Decimal' }
        seriesSize: { $ref: '#/components/schemas/Decimal' }
        scrapPct: { $ref: '#/components/schemas/Decimal' }
        roundUp: { type: boolean }
        unitCost: { $ref: '#/components/schemas/Decimal' }
        flushing: { $ref: '#/components/schemas/Flushing' }
    OperationEdit:
      type: object
      description: One route operation edit. add needs resourceId; change sets only the fields it carries; remove carries operNumber only.
      required: [op, operNumber]
      additionalProperties: false
      properties:
        op: { $ref: '#/components/schemas/EditOp' }
        operNumber: { type: integer, minimum: 1 }
        resourceId: { type: string, format: uuid }
        setupTimeH: { $ref: '#/components/schemas/Decimal' }
        runTimeHPer: { $ref: '#/components/schemas/Decimal' }
        scrapPct: { $ref: '#/components/schemas/Decimal' }
        laborRate: { $ref: '#/components/schemas/Decimal' }
        overheadRate: { $ref: '#/components/schemas/Decimal' }
        subcontract: { type: boolean }
        subcontractPrice: { $ref: '#/components/schemas/Decimal' }
    OrderEdits:
      type: object
      description: Line edits apply first, in order, then operation edits; 1 to 200 edits in all.
      additionalProperties: false
      properties:
        lines: { type: array, items: { $ref: '#/components/schemas/LineEdit' } }
        operations: { type: array, items: { $ref: '#/components/schemas/OperationEdit' } }
    OrderEditEntry:
      type: object
      properties:
        orderVersion: { type: integer, description: The order version the edit produced. }
        seq: { type: integer, description: Position of the edit in its request. }
        target: { type: string, enum: [line, operation] }
        op: { $ref: '#/components/schemas/EditOp' }
        key: { type: string, description: The line number, or the operation number as text. }
        before: { description: 'The line or operation before the edit; null for an add.', oneOf: [{ $ref: '#/components/schemas/OrderLine' }, { $ref: '#/components/schemas/Operation' }, { type: 'null' }] }
        after: { description: 'The line or operation after the edit; null for a remove.', oneOf: [{ $ref: '#/components/schemas/OrderLine' }, { $ref: '#/components/schemas/Operation' }, { type: 'null' }] }
        actor: { type: string }
        traceId: { type: string }
        occurredAt: { type: string, format: date-time }
    WIPRow:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        legalEntityId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/Status' }
        currency: { type: string }
        consumption: { $ref: '#/components/schemas/Decimal', description: 'Material, labor and overhead posted to WIP, net of reversals.' }
        rafValue: { $ref: '#/components/schemas/Decimal', description: Value received into finished goods by reports as finished. }
        settled: { $ref: '#/components/schemas/Decimal', description: WIP cleared into variances at End. }
        wipBalance: { $ref: '#/components/schemas/Decimal', description: 'consumption − rafValue − settled; 0 after End.' }
    WIPTotal:
      type: object
      properties:
        currency: { type: string }
        orders: { type: integer }
        consumption: { $ref: '#/components/schemas/Decimal' }
        rafValue: { $ref: '#/components/schemas/Decimal' }
        settled: { $ref: '#/components/schemas/Decimal' }
        wipBalance: { $ref: '#/components/schemas/Decimal' }
    WIPReport:
      type: object
      properties:
        asOf: { type: string, format: date }
        items: { type: array, items: { $ref: '#/components/schemas/WIPRow' } }
        totals: { type: array, items: { $ref: '#/components/schemas/WIPTotal' }, description: Per currency over every order the filter selects. }
        nextCursor: { type: string, format: uuid }
    VarianceReportRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        siteId: { type: string, format: uuid }
        itemGroup: { type: string }
        currency: { type: string }
        type: { $ref: '#/components/schemas/VarianceType' }
        costGroup: { $ref: '#/components/schemas/CostGroup' }
        amount: { $ref: '#/components/schemas/Decimal', description: Positive is unfavourable (debit). }
        planned: { $ref: '#/components/schemas/Decimal', description: The order's planned cost of the cost group. }
        pctOfPlanned: { type: [string, 'null'], description: 'amount / planned × 100 to 2 decimals; null when nothing was planned.' }
        postedOn: { type: string, format: date }
    VarianceReport:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VarianceReportRow' } }
        totals:
          type: array
          description: Per currency and variance type over the whole filter.
          items:
            type: object
            properties:
              currency: { type: string }
              type: { $ref: '#/components/schemas/VarianceType' }
              amount: { $ref: '#/components/schemas/Decimal' }
        net:
          type: array
          description: Net variance per currency; negative is favourable.
          items:
            type: object
            properties:
              currency: { type: string }
              amount: { $ref: '#/components/schemas/Decimal' }
        nextCursor: { type: string, format: uuid }
    Problem:
      type: object
      description: RFC 9457 problem details, application/problem+json.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
paths:
  /v1/production/orders:
    get:
      operationId: listProductionOrders
      summary: List orders, newest first, with keyset pagination
      x-passage-duty: production.order.read
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { name: originType, in: query, schema: { type: string, enum: [PlannedOrder, SalesOrderLine, Manual, Kanban, Rework, Split] } }
        - { name: reworkOf, in: query, description: 'An order id: only the rework orders that reference it (FR-21.20).', schema: { type: string, format: uuid } }
        - { name: cursor, in: query, description: nextCursor of the previous page, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: A page of orders visible in the caller's legal-entity scope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrderSummary' }
                  nextCursor: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createProductionOrder
      summary: Create a production order and explode its BOM and route
      x-passage-duty: production.order.write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrder' }
      responses:
        '201':
          description: Created; emits dev.passage.production.order.created.v1.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '200':
          description: Replay of an earlier request with the same Idempotency-Key and body.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: 'Validation failed or Idempotency-Key missing (COM-0001)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'AUTH-0003: a missing route duty, or originType Rework without production.order.rework', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'Explosion or operation rule failed (PRODUCTION_INVALID_INPUT); the rework reference does not name an order of the same product with enough output (PRODUCTION_REWORK_REFERENCE_INVALID); key reused with another body (idempotency_key_reuse)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders:bulk-status:
    post:
      operationId: bulkProductionOrderStatus
      summary: Apply one status command to up to 500 orders (FR-21.12)
      description: |
        Each order runs in its own transaction at its current version (continue on error),
        in request order, with the same rules, posting effects and events as the single
        `:command`. The call answers 200 with a result per order; when some fail, `code` is
        PRODUCTION_BULK_PARTIAL (PROD-0022). The Idempotency-Key of order X is
        `<key>:<X>`, so a retried batch replays the orders it already moved and retries the
        rest. The route needs production.order.release and the command its own duty as well
        (end: production.order.end; estimate and schedule: production.order.write).
        report-finished and reset-status need per-order input and are not accepted.
      x-passage-duty: production.order.release
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkStatus' }
      responses:
        '200':
          description: Per-order results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '400': { description: 'No, too many, duplicate or malformed ids, a command not allowed in bulk, or Idempotency-Key missing (COM-0001)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'AUTH-0003: the route duty or the command''s duty is missing', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders:merge:
    post:
      operationId: mergeProductionOrders
      summary: Merge orders into the first one (FR-21.15)
      description: |
        The orders must be Created to Released and share legal entity, product, site,
        warehouse, currency, item group, rework reference and the BOM and route snapshot.
        The first order survives with the summed quantity, its lines and operations
        re-exploded and, once estimated, re-estimated; it emits
        dev.passage.production.order.updated.v1. Every other order becomes Cancelled with
        mergedIntoOrderId set, a `merge` status-log row and
        dev.passage.production.order.statuschanged.v1. Refused (422
        PRODUCTION_MERGE_REFUSED, PROD-0016) when any order has posted journals, an order
        to be cancelled has draft journals, or the orders differ.
      x-passage-duty: production.order.release
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeOrders' }
      responses:
        '200':
          description: The survivor and the merged order ids. Replays carry Idempotent-Replayed.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: 'An order version is stale (conflict_version)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PRODUCTION_MERGE_REFUSED (PROD-0016) or idempotency_key_reuse', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}:
    get:
      operationId: getProductionOrder
      summary: Read an order with its lines, operations and planned cost
      x-passage-duty: production.order.read
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: The order.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    patch:
      operationId: updateProductionOrder
      summary: Edit the header fields allowed for the current status
      x-passage-duty: production.order.write
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchOrder' }
      responses:
        '200':
          description: The order after the edit; emits dev.passage.production.order.updated.v1.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: The field cannot change in the current status (PRODUCTION_FIELD_NOT_EDITABLE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match does not match the current version (conflict_version, PROD-0003), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match missing (precondition_required), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}/status-log:
    get:
      operationId: getProductionOrderStatusLog
      summary: The applied commands of an order with actor, time and trace id (FR-21.2)
      x-passage-duty: production.order.read
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: Oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string, format: uuid }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/StatusLogEntry' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/production/orders/{id}/costs:
    get:
      operationId: getProductionOrderCosts
      summary: Planned against actual cost by cost group, the WIP balance and the variances (FR-21.11)
      x-passage-duty: production.cost.read
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: The cost view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostView' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/production/orders/{id}:{command}:
    post:
      operationId: commandProductionOrder
      summary: Apply a status command (custom method after the colon)
      description: |
        Duties by command: estimate and schedule need
        production.order.write; release, start, cancel and reset-status need
        production.order.release; report-finished needs production.journal.post; end needs
        production.order.end, and ending a Started order with zero output also needs
        production.order.zero-output. A command the state machine does not allow is 409
        PRODUCTION_ILLEGAL_TRANSITION (PROD-0001). Each applied command writes a status-log
        row; a status change (and every report-as-finished) emits
        dev.passage.production.order.statuschanged.v1.

        Posting effects (BR-21.1), in the same transaction: start posts a picking list for
        the start-flushed lines; report-finished posts a report-as-finished journal (Dr
        finished goods at the planned unit cost / Cr WIP, finish-flushed lines consumed in
        proportion); end refuses unposted journals (409 PRODUCTION_UNPOSTED_JOURNALS) and
        settles: the WIP balance is cleared into the variance accounts and
        dev.passage.production.order.settled.v1 is emitted; reset-status reverses the
        report-as-finished journals when it leaves ReportedAsFinished, and every journal when
        it goes back before Started. Each posted journal emits
        dev.passage.production.journal.posted.v1. Postings need a posting profile (422
        PRODUCTION_POSTING_PROFILE_MISSING).

        Rework orders (originType Rework, FR-21.20): report as finished receives the
        reworked units at their existing cost (the planned cost of the order's line for its
        own product, zero without one); end posts the rest of the WIP balance as variances of
        type rework, one per cost group, to the profile's reworkVarianceAccount. A reset that
        reverses the reports as finished detaches the order's as-built records (BR-21.14).
      x-passage-duty: production.order.write | production.order.release | production.journal.post | production.order.end
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/Command' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandBody' }
      responses:
        '200':
          description: The order after the command. Replays return the current order with Idempotent-Replayed.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: Body, Idempotency-Key or If-Match malformed (COM-0001), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown order or command (PRODUCTION_ORDER_NOT_FOUND, PRODUCTION_UNKNOWN_ACTION), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PRODUCTION_ILLEGAL_TRANSITION; PRODUCTION_UNPOSTED_JOURNALS on end', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: conflict_version, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'Guard failed (PRODUCTION_END_REQUIRES_RAF, PRODUCTION_ZERO_OUTPUT_NOT_PERMITTED, PRODUCTION_RAF_EXCEEDS_REMAINING, PRODUCTION_INVALID_INPUT, PRODUCTION_POSTING_PROFILE_MISSING, PRODUCTION_END_BEFORE_LAST_JOURNAL, PRODUCTION_POSTING_NOT_BALANCED) or key reused (idempotency_key_reuse)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: precondition_required, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}:split:
    post:
      operationId: splitProductionOrder
      summary: Split a Created to Released order in two (FR-21.15)
      description: |
        The original keeps quantity − splitQty; the new order receives splitQty with the same
        header, BOM and route snapshot and status, a new number, originType Split, originId
        and splitFromOrderId set to the original (a rework order's split stays a rework order
        of the same reference). Both orders are re-exploded for their quantity (BR-21.2,
        BR-21.8; each keeps its setup) and, once estimated, re-estimated. Emits
        dev.passage.production.order.created.v1 for the new order and
        dev.passage.production.order.updated.v1 for the original, and writes a `split`
        status-log row on both. Started orders (the WIP transfer of BR-21.11) are not split
        yet: 409 PRODUCTION_ILLEGAL_TRANSITION.
      x-passage-duty: production.order.release
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SplitOrder' }
      responses:
        '201':
          description: The original and the new order; ETag is the original's version, Location the new order.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SplitResult' }
        '200':
          description: Replay of an earlier split with the same Idempotency-Key and body.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SplitResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PRODUCTION_ILLEGAL_TRANSITION: the order is not Created to Released', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: conflict_version, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PRODUCTION_SPLIT_QUANTITY (PROD-0015) or idempotency_key_reuse', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: precondition_required, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}/journals:
    get:
      operationId: listProductionJournals
      summary: The journals of an order, oldest first, with lines and postings (FR-21.11)
      x-passage-duty: production.order.read
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: Drafts, posted journals and reversals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string, format: uuid }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Journal' }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    post:
      operationId: createProductionJournal
      summary: Create a draft journal, proposed or with explicit lines (FR-21.5 to FR-21.7)
      description: |
        Picking lists and reports as finished need a Started or ReportedAsFinished order; a
        route card may also be created on a Released order, which its posting starts (FR-21.6,
        PRODUCTION_AUTOSTART_ON_FEEDBACK).
      x-passage-duty: production.journal.post
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJournal' }
      responses:
        '201':
          description: The draft.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '200':
          description: Replay of an earlier request with the same Idempotency-Key and body.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PRODUCTION_JOURNAL_NOT_ALLOWED (order status), PRODUCTION_OPERATION_FINISHED', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PRODUCTION_INVALID_JOURNAL_LINE, PRODUCTION_INVALID_HOURS, PRODUCTION_JOURNAL_EMPTY (nothing to propose), idempotency_key_reuse', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/journals/{id}:
    get:
      operationId: getProductionJournal
      summary: Read a journal with its lines and postings
      x-passage-duty: production.order.read
      parameters:
        - { $ref: '#/components/parameters/JournalId' }
      responses:
        '200':
          description: The journal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '404': { description: PRODUCTION_JOURNAL_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    delete:
      operationId: deleteProductionJournal
      summary: Delete a draft journal (PROD-0012 "post or delete the journals")
      x-passage-duty: production.journal.post
      parameters:
        - { $ref: '#/components/parameters/JournalId' }
      responses:
        '204': { description: Deleted. }
        '404': { description: PRODUCTION_JOURNAL_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: PRODUCTION_JOURNAL_ALREADY_POSTED; reset the order status to reverse a posted journal, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/journals/{id}:post:
    post:
      operationId: postProductionJournal
      summary: Post a draft journal
      description: |
        One transaction under the order's row lock (BR-21.4): values each line (issues at their
        unit cost, hours at the operation's labor and overhead rates, the finished receipt at
        the planned unit cost), writes balanced WIP postings from the order's posting profile,
        books consumption, operation feedback and the reported quantities, and emits
        dev.passage.production.journal.posted.v1. A route card on a Released order starts it; a
        report as finished moves a Started order to ReportedAsFinished (both write the status
        log and emit dev.passage.production.order.statuschanged.v1). Consumption beyond the
        requirement plus PRODUCTION_OVERCONSUMPTION_PCT needs production.journal.over-consume.
      x-passage-duty: production.journal.post
      parameters:
        - { $ref: '#/components/parameters/JournalId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: The posted journal. A replay with the same key returns it with Idempotent-Replayed.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '400': { description: COM-0001 (Idempotency-Key missing), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'PRODUCTION_JOURNAL_NOT_FOUND, PRODUCTION_UNKNOWN_ACTION', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PRODUCTION_JOURNAL_ALREADY_POSTED, PRODUCTION_JOURNAL_NOT_ALLOWED, PRODUCTION_OPERATION_FINISHED', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PRODUCTION_OVER_CONSUMPTION (PROD-0007), PRODUCTION_RAF_EXCEEDS_REMAINING (PROD-0008), PRODUCTION_POSTING_DATE_BEFORE_ORDER (BR-21.3), PRODUCTION_POSTING_PROFILE_MISSING, PRODUCTION_INVALID_JOURNAL_LINE, idempotency_key_reuse', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/posting-profiles:
    get:
      operationId: listProductionPostingProfiles
      summary: The posting profiles of a legal entity, and the one that resolves for an item group and site (FR-21.13)
      description: |
        Resolution order: item group × site, item group × All, All × site, All × All. With
        siteId (and optionally itemGroup) the response carries `resolved`, or 422
        PRODUCTION_POSTING_PROFILE_MISSING when none applies.
      x-passage-duty: production.setup.read
      parameters:
        - { name: legalEntityId, in: query, description: Defaults to the caller's legal entity., schema: { type: string, format: uuid } }
        - { name: itemGroup, in: query, schema: { type: string } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The profiles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  legalEntityId: { type: string, format: uuid }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PostingProfile' }
                  resolved: { $ref: '#/components/schemas/PostingProfileInput' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { description: PRODUCTION_POSTING_PROFILE_MISSING, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    put:
      operationId: saveProductionPostingProfile
      summary: Create or replace the profile of a legal entity × item group × site
      description: Creating takes no If-Match; replacing needs If-Match with the profile version.
      x-passage-duty: production.setup.write
      parameters:
        - { name: If-Match, in: header, required: false, description: 'The profile version, quoted; required to replace.', schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostingProfileInput' }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { description: 'The profile version, quoted.', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostingProfile' }
        '200':
          description: Replaced.
          headers:
            ETag: { description: 'The profile version, quoted.', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostingProfile' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '412': { description: 'conflict_version (stale If-Match, or If-Match on a profile that does not exist)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: precondition_required (replacing without If-Match), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}/as-built:
    get:
      operationId: listProductionOrderAsBuilt
      summary: The attached as-built records of an order (FR-21.19)
      x-passage-duty: production.order.read
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: Oldest first, at most 500.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string, format: uuid }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AsBuiltRecord' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND (malformed id), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    post:
      operationId: assignProductionAsBuilt
      summary: Assign a component serial or batch to a finished serial or batch (FR-21.19, BR-21.14)
      description: |
        Under the order's row lock: the order is Started or ReportedAsFinished (409
        PRODUCTION_AS_BUILT_ORDER_STATE), the component is on its BOM (422
        PRODUCTION_AS_BUILT_COMPONENT_NOT_ON_BOM), the quantity assigned of the component stays
        within what the order consumed of it (422 PRODUCTION_AS_BUILT_EXCEEDS_CONSUMED), the
        distinct finished serials or batches stay within the order quantity rounded up (422
        PRODUCTION_AS_BUILT_TOO_MANY_FINISHED), and a serialized component serial is attached
        to one finished serial only across the tenant (422 SERIAL_DUPLICATE, PROD-0009). Emits
        dev.passage.production.asbuilt.assigned.v1.
      x-passage-duty: production.journal.post
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignAsBuilt' }
      responses:
        '201':
          description: Assigned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsBuiltRecord' }
        '200':
          description: Replay of an earlier request with the same Idempotency-Key and body.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsBuiltRecord' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: PRODUCTION_AS_BUILT_ORDER_STATE, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PRODUCTION_AS_BUILT_COMPONENT_NOT_ON_BOM, PRODUCTION_AS_BUILT_EXCEEDS_CONSUMED, PRODUCTION_AS_BUILT_TOO_MANY_FINISHED, SERIAL_DUPLICATE, idempotency_key_reuse', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/as-built:
    get:
      operationId: queryProductionAsBuilt
      summary: As-built of a finished serial, or where-used of a component serial (4.21.14)
      description: |
        Attached records only, oldest first, at most 500. At least one of
        finishedSerialOrBatch, componentSerialOrBatch and orderId is required.
      x-passage-duty: production.order.read
      parameters:
        - { name: finishedSerialOrBatch, in: query, schema: { type: string, maxLength: 100 } }
        - { name: componentSerialOrBatch, in: query, schema: { type: string, maxLength: 100 } }
        - { name: componentItemId, in: query, schema: { type: string, format: uuid } }
        - { name: orderId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The matching records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AsBuiltRecord' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/production/as-built/{id}:detach:
    post:
      operationId: detachProductionAsBuilt
      summary: Detach an as-built record to correct a wrong assignment
      description: |
        Allowed while the order is Started or ReportedAsFinished (409
        PRODUCTION_AS_BUILT_ORDER_STATE). The record stays for the audit trail with detachedAt
        and detachedBy and frees its component serial; a detached record is returned as it is.
        A :reset-status that reverses the reports as finished detaches the order's records
        (BR-21.14). Emits dev.passage.production.asbuilt.detached.v1.
      x-passage-duty: production.journal.post
      parameters:
        - { $ref: '#/components/parameters/AsBuiltId' }
      responses:
        '200':
          description: The detached record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsBuiltRecord' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'PRODUCTION_AS_BUILT_NOT_FOUND, PRODUCTION_UNKNOWN_ACTION', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: PRODUCTION_AS_BUILT_ORDER_STATE, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}/bom:
    patch:
      operationId: editProductionOrderBOM
      summary: Edit the order's BOM lines and route operations (FR-21.18)
      description: |
        Order-specific edits after explosion and before Started: add, remove and change BOM
        lines (item, quantity per, series, scrap, round-up, unit cost, flushing) and route
        operations (resource, times, scrap, rates, subcontracting). Required quantities are
        re-exploded (BR-21.2), process quantities re-planned (BR-21.8) and, once the order is
        estimated, planned cost re-estimated. The order is flagged orderBomModified and each
        edit is kept with before and after images (GET …/bom-edits). A line or operation that
        has consumption, route feedback or journals keeps its item or resource and cannot be
        removed. A Released order also needs the duty production.order.bom-after-release
        (Maintain order BOM after release). Emits dev.passage.production.order.bomedited.v1.
      x-passage-duty: production.order.write
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderEdits' }
      responses:
        '200':
          description: The order after the edits.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: COM-0001 with the invalid fields, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: 'AUTH-0003: missing production.order.write, or production.order.bom-after-release on a Released order', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: PRODUCTION_ORDER_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PRODUCTION_ORDER_EDIT_NOT_ALLOWED (Started or later), PRODUCTION_ORDER_EDIT_TARGET_EXISTS, PRODUCTION_ORDER_EDIT_TARGET_IN_USE', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { description: If-Match does not match the current version (conflict_version), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PRODUCTION_ORDER_EDIT_TARGET_NOT_FOUND, PRODUCTION_INVALID_INPUT (for example scrap 100 or no operation left)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: If-Match missing (precondition_required), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/production/orders/{id}/bom-edits:
    get:
      operationId: listProductionOrderBOMEdits
      summary: The audit trail of the order's BOM and route edits (FR-21.18)
      x-passage-duty: production.order.read
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: Oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string, format: uuid }
                  items: { type: array, items: { $ref: '#/components/schemas/OrderEditEntry' } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/production/wip-balances:
    get:
      operationId: getProductionWIPBalances
      summary: WIP balance by order (4.21.14)
      description: |
        From the WIP subledger: per order with WIP postings up to asOf (default today, UTC),
        the posted consumption, the value received by reports as finished, the WIP cleared at
        End and the balance, ordered by order id, with totals per currency over the whole
        filter. Status is the order's current status. The GL WIP account delta waits for the
        general ledger (wave 11).
      x-passage-duty: production.cost.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: One page and the totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WIPReport' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/production/variances:
    get:
      operationId: getProductionVariances
      summary: Variance report (4.21.14)
      description: |
        The variances posted at End, ordered by posting, with the planned cost of the order's
        cost group and the variance as a percentage of it, totals per currency and type, and
        the net per currency. from and to bound the posting date (UTC).
      x-passage-duty: production.cost.read
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: itemGroup, in: query, schema: { type: string } }
        - { name: orderId, in: query, schema: { type: string, format: uuid } }
        - { name: varianceType, in: query, schema: { $ref: '#/components/schemas/VarianceType' } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: One page, the totals and the net.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VarianceReport' }
        '400': { description: COM-0001, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
