asyncapi: 3.0.0
info:
  title: production
  version: 0.21.10
  description: |
    CloudEvents 1.0 envelope from platform/go/events; payloads below are the data member.
    Every event is written to the outbox in the same transaction as the change it reports and
    relayed by Debezium (wave 4); an idempotent replay emits nothing. The envelope's `actor`
    is the caller. Event types follow dev.passage.<context>.<entity>.<verb>.v<n>; the kernel
    rule allows no hyphen, so the PRD's passage.production.order.status-changed.v1 is
    order.statuschanged (see NOT-IMPLEMENTED.md). journal.posted and order.settled carry the
    balanced ledger lines for the general ledger (wave 11) to book. subcontract.porequested (the
    PRD's subcontract.po-requested) asks purchasing (wave 17) for the vendor PO of each subcontract
    operation once its order is released (FR-21.10). asbuilt.assigned and
    asbuilt.detached carry the as-built genealogy (FR-21.19) for the trace inquiry (wave 16)
    and nonconformance (wave 33). order.bomedited reports an order-specific BOM or route edit
    (FR-21.18) with the requirement lines planning needs. triggerpoint.fired reports each trigger
    point that route-card feedback made due (FR-21.17): what its function did, or why it failed.
    operation.statuschanged reports an operation finished or reopened by its command (FR-21.6).
    orderchange.detected, .applied and .dismissed report order change management (FR-21.16): an
    open order whose BOM or route an ECO superseded, and what the planner did with the change.
channels:
  passage.production.order:
    address: passage.production.order
    description: Keyed by order id, so the events of one order stay ordered.
    messages:
      created:
        $ref: '#/components/messages/orderCreated'
      updated:
        $ref: '#/components/messages/orderUpdated'
      statuschanged:
        $ref: '#/components/messages/orderStatusChanged'
      settled:
        $ref: '#/components/messages/orderSettled'
      bomedited:
        $ref: '#/components/messages/orderBOMEdited'
  passage.production.journal:
    address: passage.production.journal
    description: Keyed by order id (the outbox aggregate), so an order's journals stay ordered.
    messages:
      posted:
        $ref: '#/components/messages/journalPosted'
  passage.production.asbuilt:
    address: passage.production.asbuilt
    description: Keyed by order id (the outbox aggregate), so an order's genealogy stays ordered.
    messages:
      assigned:
        $ref: '#/components/messages/asBuiltAssigned'
      detached:
        $ref: '#/components/messages/asBuiltDetached'
  passage.production.triggerpoint:
    address: passage.production.triggerpoint
    description: Keyed by order id (the outbox aggregate), so an order's firings stay ordered.
    messages:
      fired:
        $ref: '#/components/messages/triggerPointFired'
  passage.production.subcontract:
    address: passage.production.subcontract
    description: Keyed by order id (the outbox aggregate), so an order's requests stay ordered.
    messages:
      porequested:
        $ref: '#/components/messages/subcontractPORequested'
  passage.production.operation:
    address: passage.production.operation
    description: Keyed by order id (the outbox aggregate), so an order's operation changes stay ordered.
    messages:
      statuschanged:
        $ref: '#/components/messages/operationStatusChanged'
  passage.production.orderchange:
    address: passage.production.orderchange
    description: Keyed by order id (the outbox aggregate), so an order's changes stay ordered with its other events.
    messages:
      detected:
        $ref: '#/components/messages/orderChangeDetected'
      applied:
        $ref: '#/components/messages/orderChangeApplied'
      dismissed:
        $ref: '#/components/messages/orderChangeDismissed'
operations:
  onOrderCreated:
    action: send
    channel: { $ref: '#/channels/passage.production.order' }
    messages: [{ $ref: '#/channels/passage.production.order/messages/created' }]
  onOrderUpdated:
    action: send
    channel: { $ref: '#/channels/passage.production.order' }
    messages: [{ $ref: '#/channels/passage.production.order/messages/updated' }]
  onOrderStatusChanged:
    action: send
    channel: { $ref: '#/channels/passage.production.order' }
    messages: [{ $ref: '#/channels/passage.production.order/messages/statuschanged' }]
  onOrderSettled:
    action: send
    channel: { $ref: '#/channels/passage.production.order' }
    messages: [{ $ref: '#/channels/passage.production.order/messages/settled' }]
  onOrderBOMEdited:
    action: send
    channel: { $ref: '#/channels/passage.production.order' }
    messages: [{ $ref: '#/channels/passage.production.order/messages/bomedited' }]
  onJournalPosted:
    action: send
    channel: { $ref: '#/channels/passage.production.journal' }
    messages: [{ $ref: '#/channels/passage.production.journal/messages/posted' }]
  onAsBuiltAssigned:
    action: send
    channel: { $ref: '#/channels/passage.production.asbuilt' }
    messages: [{ $ref: '#/channels/passage.production.asbuilt/messages/assigned' }]
  onAsBuiltDetached:
    action: send
    channel: { $ref: '#/channels/passage.production.asbuilt' }
    messages: [{ $ref: '#/channels/passage.production.asbuilt/messages/detached' }]
  onTriggerPointFired:
    action: send
    channel: { $ref: '#/channels/passage.production.triggerpoint' }
    messages: [{ $ref: '#/channels/passage.production.triggerpoint/messages/fired' }]
  onSubcontractPORequested:
    action: send
    channel: { $ref: '#/channels/passage.production.subcontract' }
    messages: [{ $ref: '#/channels/passage.production.subcontract/messages/porequested' }]
  onOperationStatusChanged:
    action: send
    channel: { $ref: '#/channels/passage.production.operation' }
    messages: [{ $ref: '#/channels/passage.production.operation/messages/statuschanged' }]
  onOrderChangeDetected:
    action: send
    channel: { $ref: '#/channels/passage.production.orderchange' }
    messages: [{ $ref: '#/channels/passage.production.orderchange/messages/detected' }]
  onOrderChangeApplied:
    action: send
    channel: { $ref: '#/channels/passage.production.orderchange' }
    messages: [{ $ref: '#/channels/passage.production.orderchange/messages/applied' }]
  onOrderChangeDismissed:
    action: send
    channel: { $ref: '#/channels/passage.production.orderchange' }
    messages: [{ $ref: '#/channels/passage.production.orderchange/messages/dismissed' }]
components:
  messages:
    orderCreated:
      name: created
      title: Production order created
      description: 'Emitted when an order is committed, and for the new order of a split (originType Split and originId the original, or a rework order of the same reference; FR-21.15) (consumers: planning, analytics).'
      payload:
        type: object
        required: [orderId, orderNumber, productId, quantity, siteId, deliveryDate, originType, originId, reworkReference]
        properties:
          orderId: { type: string, format: uuid }
          orderNumber: { type: string }
          productId: { type: string, format: uuid }
          quantity: { type: string }
          siteId: { type: string, format: uuid }
          deliveryDate: { type: [string, 'null'], format: date }
          originType: { type: string }
          originId: { type: [string, 'null'], format: uuid }
          reworkReference: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/reworkReference' }], description: 'Set on a rework order (originType Rework) that names its original order, batch or serial (FR-21.20).' }
      x-passage-type: dev.passage.production.order.created.v1
    orderUpdated:
      name: updated
      title: Production order header edited
      description: 'Emitted by PATCH (quantity or delivery date), by a split for the original and by a merge for the survivor (their quantity changes; FR-21.15), with the header after the change (consumers: planning).'
      payload:
        type: object
        required: [orderId, quantity, deliveryDate, status, version, actor]
        properties:
          orderId: { type: string, format: uuid }
          quantity: { type: string }
          deliveryDate: { type: [string, 'null'], format: date }
          status: { type: string }
          version: { type: integer }
          actor: { type: string }
      x-passage-type: dev.passage.production.order.updated.v1
    orderStatusChanged:
      name: statuschanged
      title: Production order status changed
      description: |
        Emitted by every command that changes the status, and by every report as finished
        (which changes the reported quantities), and for each order a merge cancels into
        another (FR-21.15). A re-estimate that keeps the status emits nothing (consumers:
        planning, scheduling, shop floor, lean). A bulk status update (FR-21.12) emits the
        same event per order it moves.
      payload:
        type: object
        required: [orderId, from, to, quantity, qtyRaf, qtyError, actor, occurredAt]
        properties:
          orderId: { type: string, format: uuid }
          from: { type: string }
          to: { type: string }
          quantity: { type: string }
          qtyRaf: { type: string }
          qtyError: { type: string }
          actor: { type: string }
          occurredAt: { type: string, format: date-time }
      x-passage-type: dev.passage.production.order.statuschanged.v1
    orderSettled:
      name: settled
      title: Production order settled at End
      description: |
        Emitted by :end in the same transaction as the settlement (FR-21.8, BR-21.6): planned
        and actual cost by group, the variances that cleared the WIP balance (positive is
        unfavourable), and the balanced settlement postings (consumers: ledger, costing, analytics).
      payload:
        type: object
        required: [orderId, currency, postingDate, qtyRaf, wipCleared, plannedCost, actualCost, variances, postings]
        properties:
          orderId: { type: string, format: uuid }
          currency: { type: string }
          postingDate: { type: string, format: date }
          qtyRaf: { type: string }
          wipCleared: { type: string, description: The WIP balance before settlement (debit positive). }
          plannedCost: { $ref: '#/components/schemas/costByGroup' }
          actualCost: { $ref: '#/components/schemas/costByGroup' }
          variances: { type: array, items: { $ref: '#/components/schemas/variance' } }
          postings: { type: array, items: { $ref: '#/components/schemas/posting' } }
      x-passage-type: dev.passage.production.order.settled.v1
    orderBOMEdited:
      name: bomedited
      title: Production order BOM or route edited
      description: |
        Emitted by PATCH /v1/production/orders/{id}/bom in the same transaction as the edit
        (FR-21.18): the edits applied, every requirement line after them, and the re-estimated
        planned cost, null while the order is not estimated. The order is flagged
        orderBomModified (consumers: planning, scheduling).
      payload:
        type: object
        required: [orderId, status, version, edits, lines, plannedCost, actor]
        properties:
          orderId: { type: string, format: uuid }
          status: { type: string, enum: [Created, Estimated, Scheduled, Released] }
          version: { type: integer }
          edits: { type: array, items: { $ref: '#/components/schemas/editApplied' } }
          lines: { type: array, items: { $ref: '#/components/schemas/requirementLine' } }
          plannedCost: { oneOf: [{ $ref: '#/components/schemas/costByGroup' }, { type: 'null' }] }
          actor: { type: string }
      x-passage-type: dev.passage.production.order.bomedited.v1
    journalPosted:
      name: posted
      title: Production journal posted
      description: |
        Emitted when a picking list, route card or report as finished is posted, including the
        journals posted by :start and :report-finished and the reversal journals of
        :reset-status (reversalOf set, negative quantities). journalEntryId stays null until the
        general ledger books the postings (consumers: inventory, ledger, planning).
        A split of a Started order (BR-21.11) emits one `split-transfer` journal on each order,
        linked by counterpartOrderId: negative lines and Cr WIP on the original, positive lines and
        Dr WIP on the new order. It moves consumption, hours and WIP between the two orders only:
        no stock moves (inventory must not book its issue lines) and its postings net to zero on
        the WIP account.
      payload:
        type: object
        required: [journalId, journalNumber, orderId, type, postingDate, currency, reversalOf, counterpartOrderId, lines, postings, journalEntryId]
        properties:
          journalId: { type: string, format: uuid }
          journalNumber: { type: string }
          orderId: { type: string, format: uuid }
          type: { type: string, enum: [picking-list, route-card, report-as-finished, split-transfer] }
          postingDate: { type: string, format: date }
          currency: { type: string }
          reversalOf: { type: [string, 'null'], format: uuid }
          counterpartOrderId: { type: [string, 'null'], format: uuid, description: 'The other order of a split-transfer journal; null for every other type.' }
          lines: { type: array, items: { $ref: '#/components/schemas/journalLine' } }
          postings: { type: array, items: { $ref: '#/components/schemas/posting' } }
          journalEntryId: { type: [string, 'null'], format: uuid }
      x-passage-type: dev.passage.production.journal.posted.v1
    asBuiltAssigned:
      name: assigned
      title: As-built record assigned
      description: |
        Emitted when a component serial or batch is recorded as consumed into a finished serial or
        batch of an order (FR-21.19); an idempotent replay emits nothing (consumers: inventory
        trace inquiry, quality nonconformance).
      payload:
        type: object
        required: [recordId, orderId, finishedItemId, finishedSerialOrBatch, componentItemId, tracking, componentSerialOrBatch, qty, assignedBy, assignedAt, detachedAt]
        properties:
          recordId: { type: string, format: uuid }
          orderId: { type: string, format: uuid }
          finishedItemId: { type: string, format: uuid }
          finishedSerialOrBatch: { type: string }
          componentItemId: { type: string, format: uuid }
          tracking: { type: string, enum: [serial, batch] }
          componentSerialOrBatch: { type: string }
          qty: { type: string, description: 1 for a serial component. }
          assignedBy: { type: string }
          assignedAt: { type: string, format: date-time }
          detachedAt: { type: [string, 'null'], format: date-time }
      x-passage-type: dev.passage.production.asbuilt.assigned.v1
    asBuiltDetached:
      name: detached
      title: As-built record detached
      description: Emitted when an as-built record is detached to correct a wrong assignment; detachedAt is set.
      payload:
        type: object
        required: [recordId, orderId, finishedItemId, finishedSerialOrBatch, componentItemId, tracking, componentSerialOrBatch, qty, assignedBy, assignedAt, detachedAt]
        properties:
          recordId: { type: string, format: uuid }
          orderId: { type: string, format: uuid }
          finishedItemId: { type: string, format: uuid }
          finishedSerialOrBatch: { type: string }
          componentItemId: { type: string, format: uuid }
          tracking: { type: string, enum: [serial, batch] }
          componentSerialOrBatch: { type: string }
          qty: { type: string, description: 1 for a serial component. }
          assignedBy: { type: string }
          assignedAt: { type: string, format: date-time }
          detachedAt: { type: [string, 'null'], format: date-time }
      x-passage-type: dev.passage.production.asbuilt.detached.v1
    triggerPointFired:
      name: fired
      title: Trigger point fired
      description: |
        Emitted in the same transaction as a route-card post, once per trigger point whose
        condition held on the feedback of its operation (FR-21.17), in ascending sequence
        (BR-21.13). status fired: insert-operations added insertedOperations after the
        operation, create-rework-order created reworkOrderId for the error quantity, notify did
        nothing else (consumers: notifications, scheduling, planning). status failed
        (PROD-0019, PRODUCTION_TRIGGER_FUNCTION_FAILED): the function changed nothing, reason
        says why, and the journal was posted anyway; the trigger stays due for the next feedback.
      payload:
        type: object
        required: [firingId, triggerPointId, orderId, journalId, operNumber, sequence, condition, function, status, reason, feedback, insertedOperations, reworkOrderId, actor]
        properties:
          firingId: { type: string, format: uuid }
          triggerPointId: { type: string, format: uuid }
          orderId: { type: string, format: uuid }
          journalId: { type: string, format: uuid, description: The route card whose post evaluated the trigger. }
          operNumber: { type: integer }
          sequence: { type: integer }
          condition: { type: string, examples: ['qty_error > 0'] }
          function: { type: string, enum: [insert-operations, create-rework-order, notify] }
          status: { type: string, enum: [fired, failed] }
          reason: { type: [string, 'null'] }
          feedback: { $ref: '#/components/schemas/triggerFeedback' }
          insertedOperations: { type: array, items: { type: integer } }
          reworkOrderId: { type: [string, 'null'], format: uuid }
          actor: { type: string }
      x-passage-type: dev.passage.production.triggerpoint.fired.v1
    subcontractPORequested:
      name: porequested
      title: Subcontract purchase order requested
      description: |
        Emitted in the transaction that releases an order (also by bulk status), once for each subcontract
        operation, and for a subcontract operation that an edit of the released order adds or a split of a
        released order creates. An operation is requested once: a reset and second release, a replay or a
        retry emit nothing more (FR-21.10). Consumer: purchasing (wave 17), which creates the vendor PO line.
      payload:
        type: object
        required: [orderId, orderNumber, legalEntityId, siteId, warehouseId, operNumber, resourceId, qty, unitPrice, amount, currency, dueDate, actor]
        properties:
          orderId: { type: string, format: uuid }
          orderNumber: { type: string }
          legalEntityId: { type: string, format: uuid }
          siteId: { type: string, format: uuid }
          warehouseId: { type: string, format: uuid }
          operNumber: { type: integer }
          resourceId: { type: string, format: uuid, description: 'The vendor resource of the operation (the PRD vendorId until the resource carries its vendor account).' }
          qty: { type: string, description: The operation's process quantity (BR-21.8). }
          unitPrice: { type: string, description: The vendor price per unit of process quantity. }
          amount: { type: string, description: 'unitPrice × qty at 4 places: the subcontract row of the estimate.' }
          currency: { type: string }
          dueDate: { type: [string, 'null'], format: date, description: The order's delivery date until scheduling (wave 23) dates the operation. }
          actor: { type: string }
      x-passage-type: dev.passage.production.subcontract.porequested.v1
    operationStatusChanged:
      name: statuschanged
      title: Operation finished or reopened
      description: |
        Emitted in the transaction of `POST /v1/production/orders/{id}/operations/{operNumber}:finish` or
        `:reopen` when the operation's status changes (FR-21.6); a command already in effect and an
        idempotent replay emit nothing. A route card's `finished` flag is reported by journal.posted.
        Consumers: scheduling (wave 23) and the shop floor (wave 25).
      payload:
        type: object
        required: [orderId, operNumber, action, from, to, orderVersion, actor, occurredAt]
        properties:
          orderId: { type: string, format: uuid }
          operNumber: { type: integer }
          action: { type: string, enum: [finish, reopen] }
          from: { type: string, enum: [open, started, finished] }
          to: { type: string, enum: [open, started, finished], description: 'Reopen gives started when the operation has feedback, open otherwise.' }
          orderVersion: { type: integer, description: The order version after the change. }
          actor: { type: string }
          occurredAt: { type: string, format: date-time }
      x-passage-type: dev.passage.production.operation.statuschanged.v1
    orderChangeDetected:
      name: detected
      title: Order change detected
      description: 'Emitted in the transaction of `POST /v1/production/order-changes:detect` for each open order whose BOM or route snapshot an ECO superseded and whose OCM profile is not none; a repeated ECO emits nothing for orders already recorded (FR-21.16). Consumers: the planner worklist, notifications.'
      payload:
        type: object
        required: [changeId, orderId, orderNumber, ecoId, status, profileMode, needsReview, deltaCount, changeCost, currency, orderVersion, actor, occurredAt]
        properties:
          changeId: { type: string, format: uuid }
          orderId: { type: string, format: uuid }
          orderNumber: { type: string }
          ecoId: { type: string, description: The engineering change order (wave 9) that superseded the order's BOM or route version. }
          status: { type: string, enum: [pending, applied, dismissed] }
          profileMode: { type: string, enum: [automatic, manual], description: The OCM profile mode that applied at detection. }
          needsReview: { type: boolean, description: 'True when the order was edited by hand (FR-21.18); such an order is never applied automatically.' }
          deltaCount: { type: integer, description: Lines and operations added, removed or changed. }
          changeCost: { type: string, description: 'New minus old planned cost plus the profile surcharge (BR-21.12), to the currency minor unit.' }
          currency: { type: string }
          orderVersion: { type: integer, description: The order version after the event. }
          actor: { type: string }
          occurredAt: { type: string, format: date-time }
      x-passage-type: dev.passage.production.orderchange.detected.v1
    orderChangeApplied:
      name: applied
      title: Order change applied
      description: 'Emitted in the transaction of `POST /v1/production/order-changes/{id}:apply`, or of the order status command that applies a change detected under an automatic OCM profile (note "applied automatically at :<command>"), after order.bomedited for the same re-explosion and re-estimate (FR-21.16). Consumers: planning, analytics.'
      payload:
        type: object
        required: [changeId, orderId, orderNumber, ecoId, status, profileMode, needsReview, deltaCount, changeCost, currency, orderVersion, actor, occurredAt]
        properties:
          changeId: { type: string, format: uuid }
          orderId: { type: string, format: uuid }
          orderNumber: { type: string }
          ecoId: { type: string, description: The engineering change order (wave 9) that superseded the order's BOM or route version. }
          status: { type: string, enum: [pending, applied, dismissed] }
          profileMode: { type: string, enum: [automatic, manual], description: The OCM profile mode that applied at detection. }
          needsReview: { type: boolean, description: 'True when the order was edited by hand (FR-21.18); such an order is never applied automatically.' }
          deltaCount: { type: integer, description: Lines and operations added, removed or changed. }
          changeCost: { type: string, description: 'New minus old planned cost plus the profile surcharge (BR-21.12), to the currency minor unit.' }
          currency: { type: string }
          orderVersion: { type: integer, description: The order version after the event. }
          actor: { type: string }
          occurredAt: { type: string, format: date-time }
      x-passage-type: dev.passage.production.orderchange.applied.v1
    orderChangeDismissed:
      name: dismissed
      title: Order change dismissed
      description: 'Emitted in the transaction of `POST /v1/production/order-changes/{id}:dismiss`, or of `POST /v1/production/order-changes:detect` when a later ECO covers an older pending change of the order (note "superseded by <ecoId>") (FR-21.16).'
      payload:
        type: object
        required: [changeId, orderId, orderNumber, ecoId, status, profileMode, needsReview, deltaCount, changeCost, currency, orderVersion, actor, occurredAt]
        properties:
          changeId: { type: string, format: uuid }
          orderId: { type: string, format: uuid }
          orderNumber: { type: string }
          ecoId: { type: string, description: The engineering change order (wave 9) that superseded the order's BOM or route version. }
          status: { type: string, enum: [pending, applied, dismissed] }
          profileMode: { type: string, enum: [automatic, manual], description: The OCM profile mode that applied at detection. }
          needsReview: { type: boolean, description: 'True when the order was edited by hand (FR-21.18); such an order is never applied automatically.' }
          deltaCount: { type: integer, description: Lines and operations added, removed or changed. }
          changeCost: { type: string, description: 'New minus old planned cost plus the profile surcharge (BR-21.12), to the currency minor unit.' }
          currency: { type: string }
          orderVersion: { type: integer, description: The order version after the event. }
          actor: { type: string }
          occurredAt: { type: string, format: date-time }
      x-passage-type: dev.passage.production.orderchange.dismissed.v1
  schemas:
    reworkReference:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [order, batch, serial] }
        id: { type: string, description: The order id for type order; the batch or serial number otherwise. }
    journalLine:
      type: object
      required: [kind, lineNo, operNumber, itemId, qty, unitCost, amount, hours]
      properties:
        kind: { type: string, enum: [issue, hours, receipt] }
        lineNo: { type: [string, 'null'] }
        operNumber: { type: [integer, 'null'] }
        itemId: { type: [string, 'null'], format: uuid }
        qty: { type: string }
        unitCost: { type: string }
        amount: { type: string, description: 'Material or receipt value, or labor plus overhead for hours.' }
        hours: { type: [string, 'null'] }
    variance:
      type: object
      required: [type, costGroup, amount]
      properties:
        type: { type: string, enum: [lot-size, production-quantity, production-price, production-substitution, rework] }
        costGroup: { type: string, enum: [material, labor, overhead, subcontract] }
        amount: { type: string }
    costByGroup:
      type: object
      required: [material, labor, overhead, subcontract]
      properties:
        material: { type: string }
        labor: { type: string }
        overhead: { type: string }
        subcontract: { type: string }
    posting:
      type: object
      required: [postingType, account, debit, credit]
      properties:
        postingType: { type: string }
        account: { type: string }
        debit: { type: string }
        credit: { type: string }
    editApplied:
      type: object
      required: [target, op, key]
      properties:
        target: { type: string, enum: [line, operation] }
        op: { type: string, enum: [add, remove, change] }
        key: { type: string, description: The line number, or the operation number as text. }
    triggerFeedback:
      type: object
      description: The route-card feedback on the trigger's operation that the condition was evaluated against.
