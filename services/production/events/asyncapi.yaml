  schemas:
    scheduledJob:
      type: object
      required: [jobId, operNumber, seq, jobType, resourceId, plannedStart, plannedEnd, plannedHours]
      properties:
        jobId: { type: string, format: uuid, description: The ProductionJob id (GET /v1/production/jobs); replaced at each re-date. }
        operNumber: { type: integer }
        seq: { type: integer }
        jobType: { type: string, enum: [queue-before, setup, process, queue-after, transport] }
        resourceId: { type: string, format: uuid }
        plannedStart: { type: string, format: date-time }
        plannedEnd: { type: string, format: date-time }
        plannedHours: { type: string }
    reworkReference:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [order, batch, serial] }
        id: { type: string, description: The order id for type order; the batch or serial number otherwise. }
    journalLine:
      type: object
      required: [kind, lineNo, operNumber, jobType, itemId, qty, unitCost, amount, hours]
      properties:
        kind: { type: string, enum: [issue, hours, receipt, coproduct] }
        lineNo: { type: [string, 'null'] }
        coProductLineNo: { type: [string, 'null'], description: 'The order''s co-product line of a coproduct receipt (FR-21.14); absent on other lines.' }
        operNumber: { type: [integer, 'null'] }
        jobType: { type: [string, 'null'], enum: [setup, process, null], description: 'The job of the operation a job-card hours line reported on; null on every other line.' }
        itemId: { type: [string, 'null'], format: uuid }
        qty: { type: string }
        unitCost: { type: string }
        amount: { type: string, description: 'Material or receipt value, or labor plus overhead for hours.' }
        hours: { type: [string, 'null'] }
    variance:
      type: object
      required: [type, costGroup, amount]
      properties:
        type: { type: string, enum: [lot-size, production-quantity, production-price, production-substitution, rework] }
        costGroup: { type: string, enum: [material, labor, overhead, subcontract] }
        amount: { type: string }
    costByGroup:
      type: object
      required: [material, labor, overhead, subcontract]
      properties:
        material: { type: string }
        labor: { type: string }
        overhead: { type: string }
        subcontract: { type: string }
    posting:
      type: object
      required: [postingType, account, debit, credit]
      properties:
        postingType: { type: string }
        account: { type: string }
        debit: { type: string }
        credit: { type: string }
    editApplied:
      type: object
      required: [target, op, key]
      properties:
        target: { type: string, enum: [line, operation] }
        op: { type: string, enum: [add, remove, change] }
        key: { type: string, description: The line number, or the operation number as text. }
    triggerFeedback:
      type: object
      description: The route-card feedback on the trigger's operation that the condition was evaluated against.
      required: [hours, qtyGood, qtyError]
      properties:
        hours: { type: string }
        qtyGood: { type: string }
        qtyError: { type: string }
    requirementLine:
      type: object
      required: [lineNo, itemId, qtyRequired, flushing]
      properties:
        lineNo: { type: string }
        itemId: { type: string, format: uuid }
        qtyRequired: { type: string }
        flushing: { type: string, enum: [manual, start, finish, available-at-location] }
