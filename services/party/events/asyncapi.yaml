asyncapi: 3.0.0
info:
  title: party
  version: 0.2.0
  description: CloudEvents 1.0 envelope from platform/go/events; payloads below are the data member. No payload carries dob, gender or a government id.
channels:
  passage.party.party:
    address: passage.party.party
    messages:
      created:
        $ref: '#/components/messages/partyCreated'
      updated:
        $ref: '#/components/messages/partyUpdated'
      merged:
        $ref: '#/components/messages/partyMerged'
  passage.party.customer:
    address: passage.party.customer
    messages:
      created:
        $ref: '#/components/messages/customerCreated'
      updated:
        $ref: '#/components/messages/customerUpdated'
  passage.party.change:
    address: passage.party.change
    messages:
      requested:
        $ref: '#/components/messages/changeRequested'
      approved:
        $ref: '#/components/messages/changeApproved'
      rejected:
        $ref: '#/components/messages/changeRejected'
  passage.party.protectedfields:
    address: passage.party.protectedfields
    messages:
      updated:
        $ref: '#/components/messages/protectedFieldsUpdated'
  passage.party.vendorbank:
    address: passage.party.vendorbank
    messages:
      revealed:
        $ref: '#/components/messages/vendorBankRevealed'
  passage.party.vendorgroup:
    address: passage.party.vendorgroup
    messages:
      created:
        $ref: '#/components/messages/vendorGroupCreated'
operations:
  onVendorGroupCreated:
    action: send
    channel: { $ref: '#/channels/passage.party.vendorgroup' }
    messages: [{ $ref: '#/channels/passage.party.vendorgroup/messages/created' }]
  onVendorBankRevealed:
    action: send
    channel: { $ref: '#/channels/passage.party.vendorbank' }
    messages: [{ $ref: '#/channels/passage.party.vendorbank/messages/revealed' }]
  onProtectedFieldsUpdated:
    action: send
    channel: { $ref: '#/channels/passage.party.protectedfields' }
    messages: [{ $ref: '#/channels/passage.party.protectedfields/messages/updated' }]
  onCustomerCreated:
    action: send
    channel: { $ref: '#/channels/passage.party.customer' }
    messages: [{ $ref: '#/channels/passage.party.customer/messages/created' }]
  onCustomerUpdated:
    action: send
    channel: { $ref: '#/channels/passage.party.customer' }
    messages: [{ $ref: '#/channels/passage.party.customer/messages/updated' }]
  onChangeRequested:
    action: send
    channel: { $ref: '#/channels/passage.party.change' }
    messages: [{ $ref: '#/channels/passage.party.change/messages/requested' }]
  onChangeApproved:
    action: send
    channel: { $ref: '#/channels/passage.party.change' }
    messages: [{ $ref: '#/channels/passage.party.change/messages/approved' }]
  onChangeRejected:
    action: send
    channel: { $ref: '#/channels/passage.party.change' }
    messages: [{ $ref: '#/channels/passage.party.change/messages/rejected' }]
  onPartyCreated:
    action: send
    channel: { $ref: '#/channels/passage.party.party' }
    messages: [{ $ref: '#/channels/passage.party.party/messages/created' }]
  onPartyUpdated:
    action: send
    channel: { $ref: '#/channels/passage.party.party' }
    messages: [{ $ref: '#/channels/passage.party.party/messages/updated' }]
  onPartyMerged:
    action: send
    channel: { $ref: '#/channels/passage.party.party' }
    messages: [{ $ref: '#/channels/passage.party.party/messages/merged' }]
components:
  messages:
    partyCreated:
      name: created
      title: Party created
      description: primary_address_id is omitted until wave-6 addresses are linked.
      payload:
        type: object
        required: [party_id, party_number, party_type, name]
        properties:
          party_id: { type: string, format: uuid }
          party_number: { type: string }
          party_type: { type: string, enum: [organization, person] }
          name: { type: string }
      x-passage-type: dev.passage.party.party.created.v1
    partyUpdated:
      name: updated
      title: Party updated
      description: changed_fields names the camelCase fields that changed, sorted. dob and gender are never named (BR-7.9); a change to only those bumps version with an empty list.
      payload:
        type: object
        required: [party_id, changed_fields, version]
        properties:
          party_id: { type: string, format: uuid }
          changed_fields: { type: array, items: { type: string } }
          version: { type: integer }
      x-passage-type: dev.passage.party.party.updated.v1
    partyMerged:
      name: merged
      title: Party merged
      payload:
        type: object
        required: [mergeId, survivorPartyId, mergedPartyIds, roleIdMap, mergedAt]
        properties:
          mergeId: { type: string, format: uuid }
          survivorPartyId: { type: string, format: uuid }
          mergedPartyIds: { type: array, items: { type: string, format: uuid } }
          roleIdMap:
            type: array
            items:
              type: object
              required: [role, fromId, toId]
              properties:
                role: { type: string }
                fromId: { type: string, format: uuid }
                toId: { type: string, format: uuid }
          mergedAt: { type: string, format: date-time }
      x-passage-type: dev.passage.party.party.merged.v1
    customerCreated:
      name: created
      title: Customer role created
      description: Emitted in the transaction that adds the customer role to a party, by POST /v1/party/parties/{id}/customer (people and the migration loader alike). An idempotent replay emits nothing.
      payload:
        type: object
        required: [customer_id, party_id, legal_entity_id, account_number, customer_group_id, currency_code, credit_limit, blocked]
        properties:
          customer_id: { type: string, format: uuid }
          party_id: { type: string, format: uuid }
          legal_entity_id: { type: string, format: uuid }
          account_number: { type: string }
          customer_group_id: { type: string, format: uuid }
          currency_code: { type: string }
          credit_limit: { type: string, nullable: true, description: "Decimal with at most 2 places; null when none was set." }
          blocked: { type: string, enum: [none, invoice, all] }
      x-passage-type: dev.passage.party.customer.created.v1
    customerUpdated:
      name: updated
      title: Customer updated
      description: Emitted when a credit limit decrease is applied immediately. An increase emits change.requested and only reaches this limit through change.approved.
      payload:
        type: object
        required: [customer_id, legal_entity_id, changed_fields, credit_limit]
        properties:
          customer_id: { type: string, format: uuid }
          legal_entity_id: { type: string, format: uuid }
          changed_fields: { type: array, items: { type: string } }
          credit_limit: { type: string, description: Decimal with at most 2 places. }
      x-passage-type: dev.passage.party.customer.updated.v1
    changeRequested:
      name: requested
      title: Change approval requested
      description: A protected-field change (credit limit increase) is held in pending_change and is not applied. The approval workflow starts from this event and decides through POST /v1/party/pending-changes/{id}:approve or :reject.
      payload: { $ref: '#/components/schemas/Change' }
      x-passage-type: dev.passage.party.change.requested.v1
    changeApproved:
      name: approved
      title: Change approved and applied
      payload: { $ref: '#/components/schemas/Change' }
      x-passage-type: dev.passage.party.change.approved.v1
    changeRejected:
      name: rejected
      title: Change rejected and discarded
      payload: { $ref: '#/components/schemas/Change' }
      x-passage-type: dev.passage.party.change.rejected.v1
    protectedFieldsUpdated:
      name: updated
      title: Protected fields updated
      description: Audit record of every change to a legal entity's protected field set.
      payload:
        type: object
        required: [legal_entity_id, before, after, actor_user_id, updated_at]
        properties:
          legal_entity_id: { type: string, format: uuid }
          before: { type: array, items: { type: string } }
          after: { type: array, items: { type: string } }
          actor_user_id: { type: string }
          updated_at: { type: string, format: date-time }
      x-passage-type: dev.passage.party.protectedfields.updated.v1
    vendorGroupCreated:
      name: created
      title: Vendor group created
      description: A vendor group was registered with its short code. The code is the VENDGRP ledger dimension value of the vendor-control credit.
      payload:
        type: object
        required: [vendor_group_id, code, name]
        properties:
          vendor_group_id: { type: string, format: uuid }
          code: { type: string, pattern: '^[A-Z0-9_-]{1,10}$' }
          name: { type: string }
      x-passage-type: dev.passage.party.vendorgroup.created.v1
    vendorBankRevealed:
      name: revealed
      title: Vendor bank details revealed
      description: Audit record written in the same transaction as every successful decryption of vendor bank numbers. Carries no account data.
      payload:
        type: object
        required: [vendor_id, legal_entity_id, actor_user_id, account_count, revealed_at]
        properties:
          vendor_id: { type: string, format: uuid }
          legal_entity_id: { type: string, format: uuid }
          actor_user_id: { type: string }
          actor_service: { type: string }
          account_count: { type: integer }
          revealed_at: { type: string, format: date-time }
      x-passage-type: dev.passage.party.vendorbank.revealed.v1
  schemas:
    Change:
      type: object
      required: [change_id, customer_id, legal_entity_id, field, current_value, requested_value, requested_by]
      properties:
        change_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        legal_entity_id: { type: string, format: uuid }
        field: { type: string, enum: [credit_limit] }
        current_value: { type: [string, 'null'] }
        requested_value: { type: string }
        requested_by: { type: string }
        decided_by: { type: string, description: Present on approved and rejected. }
        reason: { type: string, description: Optional decision reason on approved and rejected. }
