openapi: 3.1.0
info:
  title: party
  version: 0.2.0
  description: Global party and business partner service. Parties are created, read and updated here; search, roles and duplicate handling follow in later slices.
servers:
  - url: https://app.local.passage.dev
paths:
  /v1/party/tax-registrations:validate:
    post:
      operationId: validateTaxRegistration
      x-passage-duty: party.write
      description: Format-checks tax numbers. VAT is checked against VIES when PARTY_VIES_URL is set and returns validationStatus unverified otherwise or when VIES gives no verdict.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Accepted for custom-method uniformity; the operation is read-only and stores nothing.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateTaxRegistration' }
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxValidation' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/party/parties:
    post:
      operationId: createParty
      x-passage-duty: party.write
      x-passage-duty-alternatives: [party.import.write]
      description: Creates an organization or person. The party number comes from numbering sequence PARTY. A replay with the same Idempotency-Key and body returns the original party; the same key with another body is 409 idempotency_key_reuse. Emits dev.passage.party.party.created.v1. The optional body field `id` keeps a legacy-stable party id and needs duty party.import.write (403 AUTH-0003 without it; 409 PTY-PARTY-ID-TAKEN when the id exists). The caller must carry exactly one legal entity (X-Passage-Legal-Entity), because the party number is allocated for that entity; a caller with none or several gets 422 PTY-LEGAL-ENTITY-REQUIRED. A caller holding only party.import.write (no party.read or party.write) gets a PartyWriteReceipt (id, partyNumber, partyType, status, version) instead of the party, because that duty opens no read route.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateParty' }
      responses:
        '201':
          description: Created, or the original party on an idempotent replay; a PartyWriteReceipt for an import-only caller.
          headers:
            ETag: { description: 'The version, quoted.', schema: { type: string } }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Party' }
                  - { $ref: '#/components/schemas/PartyWriteReceipt' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { description: 'idempotency_key_reuse: the key was used with a different body.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PTY-PARTY-INVALID; errors names each failing field. PTY-LEGAL-ENTITY-REQUIRED: the caller has no legal entity or more than one.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { description: 'PTY-NUMBERING-UNAVAILABLE: the numbering service failed, timed out or NUMBERING_URL is empty. No party is written.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/party/parties/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getParty
      x-passage-duty: party.read
      x-passage-duty-alternatives: [party.import.read]
      description: A merged party answers with its survivor (at most 5 hops), requestedId and redirected true. dob is returned only to callers holding pii.read; others see "••••" when it is set.
      responses:
        '200':
          description: The party.
          headers:
            ETag: { description: 'The version, quoted.', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Party' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'PTY-PARTY-NOT-FOUND: unknown id, another tenant, or a malformed id.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '500': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateParty
      x-passage-duty: party.write
      x-passage-duty-alternatives: [party.import.write]
      description: Optimistic update. A PATCH that changes nothing returns 200 with the same version and emits no event. Emits dev.passage.party.party.updated.v1 otherwise; dob and gender are never named in its changed_fields. A caller holding only party.import.write (no party.read or party.write) gets a PartyWriteReceipt (id, partyNumber, partyType, status, version) instead of the party, because that duty opens no read route.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: 'The quoted version. Required unless the body carries version.'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchParty' }
      responses:
        '200':
          description: The updated party; a PartyWriteReceipt for an import-only caller.
          headers:
            ETag: { description: 'The version, quoted.', schema: { type: string } }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Party' }
                  - { $ref: '#/components/schemas/PartyWriteReceipt' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'PTY-PARTY-NOT-FOUND.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PTY-VERSION-CONFLICT (error class conflict_version): the version is stale.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PTY-PARTY-INVALID (bad field, partyType change) or PTY-STATUS-TRANSITION (status merged, unknown status, or the party is merged).', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '428': { description: 'PTY-VERSION-REQUIRED: no usable If-Match or body version.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/party/parties/{id}/vendor:
    parameters:
      - { name: id, in: path, required: true, description: Party id., schema: { type: string, format: uuid } }
    post:
      operationId: createVendorRole
      x-passage-duty: party.write
      x-passage-duty-alternatives: [party.import.write]
      description: Adds the vendor role to a party in the caller's single legal entity. A replay with the same Idempotency-Key and body (for the same party and legal entity) returns the original role; the same key with another body is 409 idempotency_key_reuse. 409 PTY-VENDOR-EXISTS when the party already has one there or the account number is taken; 409 PTY-PARTY-MERGED for a merged party; 422 PTY-LEGAL-ENTITY-REQUIRED without exactly one legal entity.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Makes a retry return the original role.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewVendor' }
      responses:
        '201': { description: 'The vendor role, or the original on an idempotent replay.', content: { application/json: { schema: { $ref: '#/components/schemas/Vendor' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PTY-PARTY-NOT-FOUND., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/party/parties/{id}/customer:
    parameters:
      - { name: id, in: path, required: true, description: Party id., schema: { type: string, format: uuid } }
    post:
      operationId: createCustomerRole
      summary: Add the customer role to a party in the caller's legal entity.
      x-passage-duty: party.write
      x-passage-duty-alternatives: [party.import.write]
      description: Adds the customer role to a party in the caller's single legal entity, with its group, payment term, posting profile, currency and optional credit fields. A replay with the same Idempotency-Key and body returns the original role and emits nothing; the same key with another body is 409 idempotency_key_reuse. 409 PTY-CUSTOMER-EXISTS when the party already has a customer role there or the account number is taken; 409 PTY-PARTY-MERGED for a merged party; 422 PTY-CUSTOMER-INVALID for a bad field, an unknown payment term, or a posting profile outside the legal entity; 422 PTY-LEGAL-ENTITY-REQUIRED without exactly one legal entity. The Idempotency-Key is scoped to the party and the legal entity. Initial creditLimit (FR-7.10) - a person (party.write) may set a positive limit only where credit_limit is not protected in the legal entity, under the same 24-hour rule as the credit-limit route, otherwise 422 PTY-CUSTOMER-INVALID on creditLimit (create without it, then use POST /v1/party/customers/{id}/credit-limit); the migration loader (party.import.write) loads the legacy limit as given, and the limit is carried on customer.created.v1. customerGroupId, deliveryTermId and deliveryModeId are not checked against a master yet (no tables). Emits dev.passage.party.customer.created.v1.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Makes a retry return the original role.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewCustomer' }
      responses:
        '201': { description: 'The customer role, or the original on an idempotent replay.', content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PTY-PARTY-NOT-FOUND., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/party/parties/{id}:merge:
    parameters:
      - { name: id, in: path, required: true, description: Surviving party id., schema: { type: string, format: uuid } }
      - { name: Idempotency-Key, in: header, required: false, description: A replay with the same key and body returns the original request with 202 and emits nothing; the same key with another body is 409 idempotency_key_reuse. Scoped to the surviving party., schema: { type: string } }
    post:
      operationId: requestPartyMerge
      summary: Request a merge of a duplicate party into the surviving party; nothing is merged until another user approves it.
      x-passage-duty: party.merge
      x-passage-gateway-duty: party.write
      description: >-
        Gateway (policies/authz) - the route is opened by party.write; party.merge is a flag duty the handler checks, from a
        tenant.administer caller with no legal-entity claim (403 AUTH-0003 otherwise). The call records a merge_request
        (status pending, requestedBy = the caller) and emits dev.passage.party.merge.requested.v1, which starts the workflow-ts merge
        approval. A user other than the requester, holding party.merge.approve and tenant.administer with no legal-entity claim and
        holding neither payment-proposal.approve nor payment-run.execute, decides it at POST /v1/workflows/party-merges/{id}:approve or
        :reject; workflow-ts then calls POST /v1/party/merge-requests/{id}:approve, which merges (customer and vendor roles and
        invoice-account references move to the survivor, the merged party becomes status merged, dev.passage.party.party.merged.v1).
        The parties are checked now and again on approval. Within the caller's tenant only; a party id from another tenant is 404.
        A malformed id or mergedPartyId, or an unknown survivorship field or rule (keepWinner, keepLoser, newest, nonEmpty), is 422
        PTY-PARTY-INVALID. The same party twice, different types, or an already-merged party is 409 PTY-MERGE-CONFLICT; both holding a
        role in the same legal entity is 409 PTY-MERGE-ROLE-CONFLICT; an open request for the same pair is 409 PTY-MERGE-PENDING
        (errors.mergeRequestId names it).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeRequest' }
      responses:
        '202':
          description: The pending merge request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeApproval' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PTY-PARTY-NOT-FOUND., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PTY-MERGE-CONFLICT, PTY-MERGE-ROLE-CONFLICT, PTY-MERGE-PENDING or idempotency_key_reuse.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PTY-PARTY-INVALID: malformed id, mergedPartyId or survivorship rule.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/party/merge-requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMergeRequest
      summary: "Get a party merge request and its approvals"
      x-passage-duty: party.read
      responses:
        '200': { description: The merge request., content: { application/json: { schema: { $ref: '#/components/schemas/MergeApproval' } } } }
        '401': { description: 'AUTH-0001: no principal or blank X-Passage-User.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'PTY-MERGE-REQUEST-NOT-FOUND.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/party/merge-requests/{id}:approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveMergeRequest
      x-passage-duty: party.merge.execute
      description: >-
        Executes the held merge in one transaction (see :merge) and records the approver; dev.passage.party.party.merged.v1 announces it. Only the workflow-ts merge approval calls it: a workflow-ts service token with the service-only duty
        party.merge.execute that names no legal entity, act = the approver workflow-ts authenticated. Any other caller, a person
        included, is 403 AUTH-0003. The approver may not be the requester (403 PTY-MERGE-SELF-APPROVAL; the table refuses it too).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: The decided request. The same approver repeating the same decision gets 200 with the stored request and nothing is merged twice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeApproval' }
        '401': { description: 'AUTH-0001: missing, invalid or replayed service token.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: 'AUTH-0003 (not the workflow-ts merge token) or PTY-MERGE-SELF-APPROVAL.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 'PTY-MERGE-REQUEST-NOT-FOUND.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PTY-MERGE-DECIDED: already decided differently or by someone else. PTY-MERGE-STALE: the parties changed since the request (merged, a role conflict, or gone); nothing is merged and the request stays pending for a rejection.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PTY-REASON-TOO-LONG: decision reason exceeds 500 Unicode characters.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/party/merge-requests/{id}:reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rejectMergeRequest
      x-passage-duty: party.merge.execute
      description: >-
        Closes the request without merging and emits dev.passage.party.merge.rejected.v1. Only the workflow-ts merge approval calls it: a workflow-ts service token with the service-only duty
        party.merge.execute that names no legal entity, act = the approver workflow-ts authenticated. Any other caller, a person
        included, is 403 AUTH-0003. The approver may not be the requester (403 PTY-MERGE-SELF-APPROVAL; the table refuses it too).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: The decided request. The same approver repeating the same decision gets 200 with the stored request and nothing is merged twice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeApproval' }
        '401': { description: 'AUTH-0001: missing, invalid or replayed service token.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: 'AUTH-0003 (not the workflow-ts merge token) or PTY-MERGE-SELF-APPROVAL.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 'PTY-MERGE-REQUEST-NOT-FOUND.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PTY-MERGE-DECIDED: already decided differently or by someone else.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PTY-REASON-TOO-LONG: decision reason exceeds 500 Unicode characters.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/party/parties/{id}/vendors:
    parameters:
      - { name: id, in: path, required: true, description: Party id., schema: { type: string, format: uuid } }
    get:
      operationId: listPartyVendors
      x-passage-duty: party.read
      description: The party's vendor roles visible to the caller's legal entities.
      responses:
        '200': { description: 'vendors.', content: { application/json: { schema: { type: object, required: [vendors], properties: { vendors: { type: array, items: { $ref: '#/components/schemas/Vendor' } } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PTY-PARTY-NOT-FOUND., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/party/vendor-groups:
    post:
      operationId: createVendorGroup
      summary: Register a vendor group with its short code
      x-passage-duty: party.write
      description: Registers a vendor group of the tenant. The code (uppercase A-Z, 0-9, dash, underscore, at most 10 characters) is unique per tenant and is posted as the VENDGRP ledger dimension value on the vendor-control credit; it cannot be changed afterwards. A replay with the same Idempotency-Key and body returns the original group and emits nothing; the same key with another body is 409 idempotency_key_reuse. 409 PTY-VENDOR-GROUP-EXISTS when the code (or the given id) is taken; 422 PTY-VENDOR-GROUP-INVALID for a bad field. Emits dev.passage.party.vendorgroup.created.v1. Vendor roles keep a plain vendorGroupId; a role whose group is not registered has no vendorGroupCode.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Makes a retry return the original group.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewVendorGroup' }
      responses:
        '201': { description: 'The vendor group, or the original on an idempotent replay.', content: { application/json: { schema: { $ref: '#/components/schemas/VendorGroup' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listVendorGroups
      summary: List the tenant's vendor groups
      x-passage-duty: party.read
      description: Every vendor group of the tenant, ordered by code.
      responses:
        '200': { description: 'vendorGroups.', content: { application/json: { schema: { type: object, required: [vendorGroups], properties: { vendorGroups: { type: array, items: { $ref: '#/components/schemas/VendorGroup' } } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/party/vendor-groups/{id}:
    parameters:
      - { name: id, in: path, required: true, description: Vendor group id., schema: { type: string, format: uuid } }
    get:
      operationId: getVendorGroup
      summary: Read one vendor group
      x-passage-duty: party.read
      description: The vendor group with its code.
      responses:
        '200': { description: The vendor group., content: { application/json: { schema: { $ref: '#/components/schemas/VendorGroup' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'PTY-VENDOR-GROUP-NOT-FOUND (unknown id or another tenant).', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/party/vendors/{id}:
    parameters:
      - { name: id, in: path, required: true, description: Vendor role id., schema: { type: string, format: uuid } }
    get:
      operationId: getVendor
      x-passage-duty: party.read
      x-passage-duty-alternatives: [party.import.read, party.vendor.lookup]
      description: The vendor role, including vendorGroupId.
      responses:
        '200': { description: The vendor role., content: { application/json: { schema: { $ref: '#/components/schemas/Vendor' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'PTY-VENDOR-NOT-FOUND (unknown id, another tenant or legal entity).', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/party/customers/{id}:
    parameters:
      - { name: id, in: path, required: true, description: Customer role id., schema: { type: string, format: uuid } }
    get:
      operationId: getCustomer
      x-passage-duty: party.read
      x-passage-duty-alternatives: [party.import.read]
      description: The customer role in the caller's legal entities, with its version as the ETag. The migration loader reads the roles it loaded through this route (service duty party.import.read) to reconcile a run.
      responses:
        '200': { description: The customer role., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'PTY-CUSTOMER-NOT-FOUND (unknown id, another tenant or legal entity).', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/party/vendors/{id}/bank-accounts:
    parameters:
      - { name: id, in: path, required: true, description: Vendor role id., schema: { type: string, format: uuid } }
    post:
      operationId: addVendorBankAccount
      x-passage-duty: party.vendor-bank.write
      description: Stores a bank account; account and routing numbers are encrypted per tenant and field. Needs X-Passage-User. 503 PTY-BANK-ENCRYPTION-UNAVAILABLE when no field encryption keys are configured.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewBankAccount' }
      responses:
        '201': { description: 'The account, masked.', content: { application/json: { schema: { $ref: '#/components/schemas/BankAccount' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PTY-VENDOR-NOT-FOUND., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: PTY-BANK-INVALID., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listVendorBankAccounts
      x-passage-duty: party.read
      description: Bank accounts with accountLast4 only.
      responses:
        '200': { description: 'bankAccounts, masked.', content: { application/json: { schema: { type: object, required: [bankAccounts], properties: { bankAccounts: { type: array, items: { $ref: '#/components/schemas/BankAccount' } } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PTY-VENDOR-NOT-FOUND., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/party/vendors/{id}/bank-accounts:reveal:
    parameters:
      - { name: id, in: path, required: true, description: Vendor role id., schema: { type: string, format: uuid } }
    get:
      operationId: revealVendorBankAccounts
      x-passage-duty: party.vendor-bank.reveal
      description: Bank accounts with accountNumber and routingNumber decrypted. Each call is logged with the user and vendor id.
      responses:
        '200': { description: 'bankAccounts, unmasked.', content: { application/json: { schema: { type: object, required: [bankAccounts], properties: { bankAccounts: { type: array, items: { $ref: '#/components/schemas/BankAccount' } } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: PTY-VENDOR-NOT-FOUND., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/party/customers/{id}/credit-limit:
    parameters:
      - { name: id, in: path, required: true, description: Customer role id., schema: { type: string, format: uuid } }
    post:
      operationId: setCustomerCreditLimit
      x-passage-duty: party.write
      description: A decrease (or any value not above the current limit) is applied at once and emits dev.passage.party.customer.updated.v1. An increase never changes the stored limit; it creates a pending_change, answers 202 and emits dev.passage.party.change.requested.v1 for the approval workflow. A limit equal to the current one is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCreditLimit' }
      responses:
        '200':
          description: Applied, or unchanged. creditLimit is the stored limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditLimitResult' }
        '202':
          description: Increase held for approval. creditLimit is still the old limit and pendingChange is the open request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditLimitResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'PTY-CUSTOMER-NOT-FOUND: unknown id, another tenant or legal entity, or a malformed id.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PTY-CHANGE-PENDING: a credit limit change is already awaiting approval; errors.pendingChangeId contains its id.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PTY-CREDIT-INVALID: creditLimit is not a non-negative amount with at most 2 decimals.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/party/legal-entities/{id}/protected-fields:
    parameters:
      - { name: id, in: path, required: true, description: Legal entity id., schema: { type: string, format: uuid } }
    get:
      operationId: getProtectedFields
      x-passage-duty: party.read
      description: Fields that need approval in this legal entity. Defaults to credit_limit when never configured.
      responses:
        '200':
          description: The protected field set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedFields' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'AUTH-0003 (missing duty) or PTY-LEGAL-ENTITY-OUT-OF-SCOPE.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PTY-PROTECTED-FIELDS-INVALID: malformed legal entity id.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '500': { $ref: '#/components/responses/Problem' }
    put:
      operationId: setProtectedFields
      x-passage-duty: party.approval-policy.write
      description: Replaces the set of fields that need approval in this legal entity. fields is required; [] is an explicit unprotect-all, and a missing or null fields is 422. Only credit_limit is protectable today; changes already pending stay decidable. Every change enqueues dev.passage.party.protectedfields.updated.v1 with before, after and the actor. A credit limit request by the user who last unprotected the field within 24 hours is still held for approval. The legal entity id is not validated against the org service (party keeps no legal entity table); a scoped caller can only address its own.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProtectedFields' }
      responses:
        '200':
          description: The stored set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedFields' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'AUTH-0003 (missing duty) or PTY-LEGAL-ENTITY-OUT-OF-SCOPE.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PTY-PROTECTED-FIELDS-INVALID: fields missing or null, unknown field, or malformed legal entity id.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/party/pending-changes:
    get:
      operationId: listPendingChanges
      x-passage-duty: party.read
      description: >-
        The changes still awaiting approval in the caller's tenant and legal entity scope, newest first. Also readable with
        party.inbox.read, the narrow duty the batch service's My work inbox signs; that duty reads this list and nothing else.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, required: false, description: The nextCursor of the previous page (opaque)., schema: { type: string } }
      responses:
        '200':
          description: One page; nextCursor is present when another page follows.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PendingChange' } }
                  nextCursor: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/party/pending-changes/{id}:
    parameters:
      - { name: id, in: path, required: true, description: Pending change id., schema: { type: string, format: uuid } }
    get:
      operationId: getPendingChange
      x-passage-duty: party.read
      description: Returns one pending change visible to the caller's tenant and legal entity scope.
      responses:
        '200':
          description: The pending change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingChange' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'PTY-CHANGE-NOT-FOUND.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/party/pending-changes/{id}:approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approvePendingChange
      x-passage-duty: party.approve
      description: Applies the held change to the customer and emits dev.passage.party.change.approved.v1. The requester cannot approve their own change.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: The approved change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingChange' }
        '401': { description: 'AUTH-0001: no principal or blank X-Passage-User.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: 'AUTH-0003 (missing duty) or PTY-PENDING-SELF-APPROVAL.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 'PTY-CHANGE-NOT-FOUND.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PTY-CHANGE-DECIDED: the change was already decided differently or by someone else (the same decider repeating the same decision gets 200 with the stored change). PTY-PENDING-STALE: the limit changed after the request; the change stays pending and can only be rejected.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PTY-REASON-TOO-LONG: decision reason exceeds 500 Unicode characters.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/party/pending-changes/{id}:reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rejectPendingChange
      x-passage-duty: party.approve
      description: Discards the held change; the stored limit is untouched. Emits dev.passage.party.change.rejected.v1.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: The rejected change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingChange' }
        '401': { description: 'AUTH-0001: no principal or blank X-Passage-User.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: 'AUTH-0003 (missing duty) or PTY-PENDING-SELF-APPROVAL.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 'PTY-CHANGE-NOT-FOUND.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'PTY-CHANGE-DECIDED: decided differently or by someone else; the same decider repeating the same decision gets 200.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'PTY-REASON-TOO-LONG: decision reason exceeds 500 Unicode characters.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/party/parties:search:
    get:
      operationId: searchParties
      summary: Search parties by name or number
      description: Read-only lookup for pickers. Case-insensitive match on the party name or number; % and _ match themselves. Merged parties are left out. Results are parties (id is the party id), ordered by name and paged by an opaque cursor.
      x-passage-duty: party.read
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of hits. Pass nextCursor as cursor for the next page.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, partyId, partyNumber, name]
                      properties:
                        id: { type: string, format: uuid }
                        partyId: { type: string, format: uuid }
                        partyNumber: { type: string }
                        name: { type: string }
                        accountNumber: { type: string }
                        blocked: { type: string }
                  nextCursor: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/party/vendors:search:
    get:
      operationId: searchVendors
      summary: Search vendors by name or number
      description: Read-only lookup for pickers. Case-insensitive match on the party name or number and the account number; % and _ match themselves. Merged parties are left out. Results are vendor roles in the caller's legal entities (narrowed to legalEntityId when given; each hit carries its legalEntityId) (id is the vendor role id; partyId the party), ordered by name and paged by an opaque cursor.
      x-passage-duty: party.read
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
        - { name: legalEntityId, in: query, description: 'Only vendor roles in this legal entity.', schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of hits. Pass nextCursor as cursor for the next page.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, partyId, partyNumber, name]
                      properties:
                        id: { type: string, format: uuid }
                        partyId: { type: string, format: uuid }
                        partyNumber: { type: string }
                        name: { type: string }
                        accountNumber: { type: string }
                        blocked: { type: string }
                        legalEntityId: { type: string, format: uuid }
                  nextCursor: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/party/customers:search:
    get:
      operationId: searchCustomers
      summary: Search customers by name or number
      description: Read-only lookup for pickers. Case-insensitive match on the party name or number and the account number; % and _ match themselves. Merged parties are left out. Results are customer roles in the caller's legal entities (narrowed to legalEntityId when given; each hit carries its legalEntityId) (id is the customer role id; partyId the party), ordered by name and paged by an opaque cursor.
      x-passage-duty: party.read
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
        - { name: legalEntityId, in: query, description: 'Only customer roles in this legal entity.', schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of hits. Pass nextCursor as cursor for the next page.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, partyId, partyNumber, name]
                      properties:
                        id: { type: string, format: uuid }
                        partyId: { type: string, format: uuid }
                        partyNumber: { type: string }
                        name: { type: string }
                        accountNumber: { type: string }
                        blocked: { type: string }
                        legalEntityId: { type: string, format: uuid }
                  nextCursor: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/party/vendor-portal/prospects:
    post:
      operationId: registerVendorProspect
      summary: "Record a supplier's own registration from the public portal page"
      x-passage-duty: party.vendor-portal.register
      description: >-
        Called only by the supplier portal BFF with a vendorless supplier-portal service token whose only duty is this one; any other
        caller is refused with PTY-SUP-SCOPE. The registration lands in vendor_prospect for a buyer to accept or reject. The answer is
        the same 202 whether or not the email already waits for review, so it never tells a stranger who has registered.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewVendorProspect' }
      responses:
        '202':
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [RECEIVED] }
        '400': { $ref: '#/components/responses/Problem', description: 'Malformed JSON, or a body over 16 KiB.' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003 or PTY-SUP-SCOPE: not the supplier portal acting for no vendor.' }
        '422': { $ref: '#/components/responses/Problem', description: 'PTY-SUP-INVALID with per-field errors.' }
        '429': { $ref: '#/components/responses/Problem', description: 'PTY-PROSPECT-LIMIT: too many registrations are waiting for review.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
  /v1/party/vendor-portal/invites:
    get:
      operationId: listVendorInvites
      summary: "List the calling vendor's user invitations"
      x-passage-duty: party.vendor-portal.admin
      description: The invitations of the vendor in the verified supplier-portal service token, newest first. Tokens are never returned.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: The invitations.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/VendorInvite' } }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003 or PTY-SUP-SCOPE: not a supplier account.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
    post:
      operationId: createVendorInvite
      summary: "Invite a user to the calling vendor's supplier portal account"
      x-passage-duty: party.vendor-portal.admin
      description: >-
        Stores the invitation with a hash of its token and an expiry and emits the created event without the token; a pending
        invitation of the same vendor for the same email is revoked. The token is in this answer only; nothing stores it. Only the vendor administrator's token carries the duty (the supplier-admin role); the portal signs it only for the invitation routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                displayName: { type: string, maxLength: 140 }
      responses:
        '201':
          description: Created; the token is shown once.
          content:
            application/json:
              schema:
                type: object
                required: [invite, token]
                properties:
                  invite: { $ref: '#/components/schemas/VendorInvite' }
                  token: { type: string }
        '400': { $ref: '#/components/responses/Problem', description: 'Malformed JSON.' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003 or PTY-SUP-SCOPE: not a supplier account.' }
        '422': { $ref: '#/components/responses/Problem', description: 'PTY-SUP-INVALID with per-field errors.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
  /v1/party/vendor-portal/invites/{id}:revoke:
    post:
      operationId: revokeVendorInvite
      summary: "Revoke an open invitation of the calling vendor"
      x-passage-duty: party.vendor-portal.admin
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorInvite' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003 or PTY-SUP-SCOPE: not a supplier account.' }
        '404': { $ref: '#/components/responses/Problem', description: 'PTY-SUP-NOT-FOUND: unknown, or another vendor''s.' }
        '409': { $ref: '#/components/responses/Problem', description: 'PTY-SUP-STATE: the invitation was already accepted.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
  /v1/party/vendor-portal/invites/{id}:verify:
    post:
      operationId: verifyVendorInvite
      summary: "Check an invitation token without using it"
      x-passage-duty: party.vendor-portal.invite-accept
      description: The token must name the invitation in the path and the vendor in the verified token, and its secret must match.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteToken' }
      responses:
        '200':
          description: Valid; who to create and for which vendor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorInviteDetails' }
        '400': { $ref: '#/components/responses/Problem', description: 'Malformed JSON, or a body over 2 KiB.' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003 or PTY-SUP-SCOPE.' }
        '404': { $ref: '#/components/responses/Problem', description: 'PTY-INVITE-INVALID: not valid, expired or already used.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
  /v1/party/vendor-portal/invites/{id}:accept:
    post:
      operationId: acceptVendorInvite
      summary: "Use an invitation token"
      x-passage-duty: party.vendor-portal.invite-accept
      description: As verify, then marks the invitation accepted (once) and emits the accepted event without the token.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteToken' }
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorInviteDetails' }
        '400': { $ref: '#/components/responses/Problem', description: 'Malformed JSON, or a body over 2 KiB.' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003 or PTY-SUP-SCOPE.' }
        '404': { $ref: '#/components/responses/Problem', description: 'PTY-INVITE-INVALID: not valid, expired or already used.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
  /v1/party/vendor-prospects:
    get:
      operationId: listVendorProspects
      summary: "List supplier registrations for review"
      x-passage-duty: party.read
      description: Registrations from the public portal page in the caller's tenant, newest first, optionally of one status.
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [NEW, ACCEPTED, REJECTED] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, required: false, description: The nextCursor of the previous page (opaque)., schema: { type: string } }
      responses:
        '200':
          description: One page of registrations; nextCursor is present when another page follows.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/VendorProspect' } }
                  nextCursor: { type: string }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003.' }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001: cursor is not a nextCursor of this list.' }
        '422': { $ref: '#/components/responses/Problem', description: 'PTY-SUP-INVALID: unknown status.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
  /v1/party/vendor-prospects/{id}:
    get:
      operationId: getVendorProspect
      summary: "Get one supplier registration"
      x-passage-duty: party.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorProspect' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003.' }
        '404': { $ref: '#/components/responses/Problem', description: 'PTY-PROSPECT-NOT-FOUND.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
  /v1/party/vendor-prospects/{id}:accept:
    post:
      operationId: acceptVendorProspect
      summary: "Accept a supplier registration as a vendor"
      x-passage-duty: party.write
      description: >-
        Claims the registration, then creates the party (organization, legal name and registration number from the registration), a
        vendor role blocked until the onboarding is approved by someone other than the accepting buyer, and the onboarding
        questionnaire request. Every step is idempotent on the registration id, so repeating a call that stopped part-way finishes it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountNumber, vendorGroupId, currencyCode, questionnaireId]
              properties:
                accountNumber: { type: string, pattern: '^[A-Za-z0-9._-]{1,20}$' }
                vendorGroupId: { type: string, format: uuid }
                paymentTermId: { type: string, format: uuid }
                currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
                questionnaireId: { type: string, format: uuid }
      responses:
        '200':
          description: Accepted, with the party, vendor and onboarding request ids.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorProspect' }
        '400': { $ref: '#/components/responses/Problem', description: 'Malformed JSON.' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003.' }
        '404': { $ref: '#/components/responses/Problem', description: 'PTY-PROSPECT-NOT-FOUND, or the questionnaire is unknown.' }
        '409': { $ref: '#/components/responses/Problem', description: 'PTY-PROSPECT-STATE: already rejected, or accepted into another party; PTY-VENDOR-EXISTS: the account number is taken.' }
        '422': { $ref: '#/components/responses/Problem', description: 'PTY-SUP-INVALID or PTY-PARTY-INVALID with per-field errors.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
  /v1/party/vendor-prospects/{id}:reject:
    post:
      operationId: rejectVendorProspect
      summary: "Reject a supplier registration with a note"
      x-passage-duty: party.vendor-request.decide
      description: Closes a NEW registration as REJECTED with the note; nothing is created.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorProspect' }
        '400': { $ref: '#/components/responses/Problem', description: 'Malformed JSON.' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003.' }
        '404': { $ref: '#/components/responses/Problem', description: 'PTY-PROSPECT-NOT-FOUND.' }
        '409': { $ref: '#/components/responses/Problem', description: 'PTY-PROSPECT-STATE: already decided.' }
        '422': { $ref: '#/components/responses/Problem', description: 'PTY-SUP-INVALID: the note is missing or too long.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
  /v1/party/payment-terms:
    get:
      operationId: listPaymentTerms
      summary: "List payment terms"
      x-passage-duty: party.read
      description: The tenant's payment terms by code, for a form to pick the term of a customer or vendor role by name.
      responses:
        '200':
          description: The payment terms.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PaymentTerm' } }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
  /v1/party/payment-terms/{id}:
    get:
      operationId: getPaymentTerm
      summary: "Get one payment term"
      x-passage-duty: party.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The payment term.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentTerm' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003.' }
        '404': { $ref: '#/components/responses/Problem', description: 'PTY-PAYMENT-TERM-NOT-FOUND.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
  /v1/party/posting-profiles:
    get:
      operationId: listPostingProfiles
      summary: "List customer posting profiles of the caller's legal entities"
      x-passage-duty: party.read
      description: Posting profiles by code in the caller's legal entities (row security), optionally of one of them.
      parameters:
        - { name: legalEntityId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The posting profiles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PostingProfile' } }
        '400': { $ref: '#/components/responses/Problem', description: 'COM-0001: legalEntityId is not a UUID.' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
  /v1/party/posting-profiles/{id}:
    get:
      operationId: getPostingProfile
      summary: "Get one posting profile"
      x-passage-duty: party.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The posting profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostingProfile' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003.' }
        '404': { $ref: '#/components/responses/Problem', description: 'PTY-POSTING-PROFILE-NOT-FOUND: unknown or outside the caller''s legal entities.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
  /v1/party/customer-groups:
    get:
      operationId: listCustomerGroups
      summary: "List customer groups"
      x-passage-duty: party.read
      responses:
        '200':
          description: The customer groups by code.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CustomerGroup' } }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
    post:
      operationId: createCustomerGroup
      summary: "Register a customer group"
      x-passage-duty: party.write
      description: >-
        A short code (1 to 10 of A-Z, 0-9, dash, underscore; upper-cased) and a name. An optional id registers a group id customer roles
        already carry. Also allowed with party.import.write. An Idempotency-Key replays the stored group.
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                id: { type: string, format: uuid }
                code: { type: string, pattern: '^[A-Za-z0-9_-]{1,10}$' }
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerGroup' }
        '400': { $ref: '#/components/responses/Problem', description: 'Malformed JSON.' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003.' }
        '409': { $ref: '#/components/responses/Problem', description: 'PTY-CUSTOMER-GROUP-EXISTS: the code or id is taken; idempotency_key_reuse: the key was used with another body.' }
        '422': { $ref: '#/components/responses/Problem', description: 'PTY-CUSTOMER-GROUP-INVALID with per-field errors.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
  /v1/party/customer-groups/{id}:
    get:
      operationId: getCustomerGroup
      summary: "Get one customer group"
      x-passage-duty: party.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The customer group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerGroup' }
        '401': { $ref: '#/components/responses/Problem', description: 'AUTH-0001.' }
        '403': { $ref: '#/components/responses/Problem', description: 'AUTH-0003.' }
        '404': { $ref: '#/components/responses/Problem', description: 'PTY-CUSTOMER-GROUP-NOT-FOUND.' }
        '500': { $ref: '#/components/responses/Problem', description: 'COM-0500.' }
  /healthz:
    get:
      operationId: liveness
      x-passage-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      x-passage-duty: public
      responses:
        '200': { description: Service is ready; the database answered a ping. }
        '503': { description: 'The database did not answer a ping within 500 ms. Body is {"status":"unavailable"}.' }
  /metrics:
    get:
      operationId: metrics
      x-passage-duty: public
      description: Served on the admin port (9090), never through the ingress.
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema: { type: string }
components:
  schemas:
    NewVendorGroup:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        id: { type: string, format: uuid, description: "Optional. Registers the code for a vendor group id that vendor roles already carry (roles loaded before groups existed, or a backfill skipped by migration 0011); omitted, a new id is assigned. An id already registered is 409 PTY-VENDOR-GROUP-EXISTS." }
        code: { type: string, pattern: '^[A-Z0-9_-]{1,10}$', description: "Unique per tenant; posted as the VENDGRP ledger dimension value." }
        name: { type: string, maxLength: 100 }
    VendorGroup:
      type: object
      required: [id, code, name, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9_-]{1,10}$' }
        name: { type: string }
        version: { type: integer }
    NewVendor:
      type: object
      additionalProperties: false
      required: [accountNumber, vendorGroupId, currencyCode]
      properties:
        accountNumber: { type: string, maxLength: 20 }
        vendorGroupId: { type: string, format: uuid }
        paymentTermId: { type: string, format: uuid, nullable: true }
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
    NewCustomer:
      type: object
      additionalProperties: false
      required: [accountNumber, customerGroupId, paymentTermId, postingProfileId, currencyCode]
      properties:
        accountNumber: { type: string, maxLength: 20 }
        customerGroupId: { type: string, format: uuid }
        paymentTermId: { type: string, format: uuid }
        deliveryTermId: { type: string, format: uuid, nullable: true }
        deliveryModeId: { type: string, format: uuid, nullable: true }
        postingProfileId: { type: string, format: uuid, description: "A posting profile of the caller's legal entity." }
        invoiceAccountPartyId: { type: string, format: uuid, nullable: true, description: "The party invoiced instead of this one." }
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        creditLimit: { type: string, nullable: true, description: "Decimal with at most 2 places, never a float." }
        creditCurrency: { type: string, minLength: 3, maxLength: 3, nullable: true, description: "Defaults to currencyCode when creditLimit is set." }
        creditRating: { type: string, maxLength: 20, nullable: true }
        creditHold: { type: boolean, default: false }
        blocked: { type: string, enum: [none, invoice, all], default: none }
    PartyWriteReceipt:
      type: object
      description: What an import-only caller gets back from a party write; no names or personal data.
      required: [id, partyNumber, partyType, status, version]
      properties:
        id: { type: string, format: uuid }
        partyNumber: { type: string }
        partyType: { type: string, enum: [organization, person] }
        status: { type: string }
        version: { type: integer }
    Customer:
      type: object
      required: [id, partyId, legalEntityId, accountNumber, customerGroupId, paymentTermId, postingProfileId, currencyCode, creditHold, blocked, version]
      properties:
        id: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        accountNumber: { type: string }
        customerGroupId: { type: string, format: uuid }
        paymentTermId: { type: string, format: uuid }
        deliveryTermId: { type: string, format: uuid }
        deliveryModeId: { type: string, format: uuid }
        postingProfileId: { type: string, format: uuid }
        invoiceAccountPartyId: { type: string, format: uuid }
        currencyCode: { type: string }
        creditLimit: { type: string }
        creditCurrency: { type: string }
        creditRating: { type: string }
        creditHold: { type: boolean }
        blocked: { type: string, enum: [none, invoice, all] }
        version: { type: integer }
    Vendor:
      type: object
      required: [id, partyId, legalEntityId, accountNumber, vendorGroupId, currencyCode, blocked, version]
      properties:
        id: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        accountNumber: { type: string }
        vendorGroupId: { type: string, format: uuid }
        vendorGroupCode: { type: string, description: "The short code of the vendor group; omitted when the group id is not a registered vendor group." }
        paymentTermId: { type: string, format: uuid }
        currencyCode: { type: string }
        blocked: { type: string, enum: [none, payment, all] }
        version: { type: integer }
    NewBankAccount:
      type: object
      additionalProperties: false
      required: [accountHolder, bankCountry, currencyCode, accountNumber]
      properties:
        accountHolder: { type: string, maxLength: 140 }
        bankCountry: { type: string, minLength: 2, maxLength: 2 }
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        accountNumber: { type: string, description: IBAN or account number; spaces and dashes are stripped. }
        routingNumber: { type: string }
    BankAccount:
      type: object
      required: [id, vendorId, accountHolder, bankCountry, currencyCode, accountLast4]
      properties:
        id: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        accountHolder: { type: string }
        bankCountry: { type: string }
        currencyCode: { type: string }
        accountLast4: { type: string }
        accountNumber: { type: string, description: Only on the reveal route. }
        routingNumber: { type: string, description: Only on the reveal route. }
    ValidateTaxRegistration:
      type: object
      additionalProperties: false
      required: [type, number]
      properties:
        type: { type: string, enum: [VAT, EIN, GSTIN] }
        country: { type: string, description: ISO 3166-1 alpha-2 code of an EU member state; required for VAT. }
        number: { type: string, minLength: 1 }
    TaxValidation:
      type: object
      required: [type, number, validationStatus]
      properties:
        type: { type: string, enum: [VAT, EIN, GSTIN] }
        country: { type: string }
        number: { type: string, description: Normalized number. }
        validationStatus: { type: string, enum: [valid, invalid, unverified, format_only] }
    PartyFields:
      type: object
      properties:
        legalName: { type: string, maxLength: 200, description: Organization only. }
        tradeName: { type: string, maxLength: 200, description: Organization only. }
        registrationNumber: { type: string, maxLength: 200, description: Organization only. }
        industryCode: { type: string, maxLength: 200, description: Organization only. }
        givenName: { type: string, maxLength: 200, description: Person only. }
        middleName: { type: string, maxLength: 200, description: Person only. }
        familyName: { type: string, maxLength: 200, description: Person only. }
        prefix: { type: string, maxLength: 200, description: Person only. }
        suffix: { type: string, maxLength: 200, description: Person only. }
        dob: { type: string, format: date, description: 'Person only. Masked to "••••" for callers without pii.read.' }
        gender: { type: string, maxLength: 200, description: Person only. }
        languageCode: { type: string }
        timeZone: { type: string }
        ownerUserId: { type: string, format: uuid }
        ownerTeamId: { type: string, format: uuid }
    CreateParty:
      allOf:
        - $ref: '#/components/schemas/PartyFields'
        - type: object
          required: [partyType]
          properties:
            partyType: { type: string, enum: [organization, person] }
            id: { type: string, format: uuid, description: 'Optional stable id for imports; needs duty party.import.write.' }
      unevaluatedProperties: false
      description: An organization requires legalName; a person requires givenName and familyName.
    PatchParty:
      allOf:
        - $ref: '#/components/schemas/PartyFields'
        - type: object
          properties:
            partyType: { type: string, enum: [organization, person], description: 'Must equal the current type.' }
            status: { type: string, enum: [active, inactive] }
            version: { type: integer, minimum: 1, description: 'Used when If-Match is absent.' }
      unevaluatedProperties: false
    Party:
      allOf:
        - $ref: '#/components/schemas/PartyFields'
        - type: object
          required: [id, partyNumber, partyType, name, searchName, status, version, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            partyNumber: { type: string }
            partyType: { type: string, enum: [organization, person] }
            name: { type: string }
            searchName: { type: string }
            status: { type: string, enum: [active, inactive, merged] }
            mergedIntoId: { type: string, format: uuid }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            requestedId: { type: string, description: Present with redirected when a merged party was requested. }
            redirected: { type: boolean }
    SetCreditLimit:
      type: object
      additionalProperties: false
      required: [creditLimit]
      properties:
        creditLimit: { type: string, pattern: '^[0-9]{1,16}(\.[0-9]{1,2})?$', description: Decimal string; JSON numbers are rejected. }
    ProtectedFields:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields: { type: array, items: { type: string, enum: [credit_limit] }, uniqueItems: true }
    MergeRequest:
      type: object
      additionalProperties: false
      required: [mergedPartyId]
      properties:
        mergedPartyId: { type: string, format: uuid, description: The duplicate to merge into the party in the path. }
        rules:
          type: object
          additionalProperties: { type: string, enum: [keepWinner, keepLoser, newest, nonEmpty] }
    MergeApproval:
      type: object
      required: [id, survivorPartyId, mergedPartyId, rules, status, requestedBy, decidedBy, reason, mergeId, requestedAt, decidedAt]
      properties:
        id: { type: string, format: uuid }
        survivorPartyId: { type: string, format: uuid }
        mergedPartyId: { type: string, format: uuid }
        rules: { type: object, additionalProperties: { type: string, enum: [keepWinner, keepLoser, newest, nonEmpty] } }
        status: { type: string, enum: [pending, approved, rejected] }
        requestedBy: { type: string }
        decidedBy: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        mergeId: { type: string, format: uuid, nullable: true, description: The party_merge record, set once approved. }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
    Decision:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }
    PendingChange:
      type: object
      required: [id, customerId, legalEntityId, field, currentValue, requestedValue, status, requestedBy, requestedAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        field: { type: string, enum: [credit_limit] }
        currentValue: { type: [string, 'null'] }
        requestedValue: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        requestedBy: { type: string }
        decidedBy: { type: string }
        reason: { type: string }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
    CreditLimitResult:
      type: object
      required: [creditLimit]
      properties:
        creditLimit: { type: [string, 'null'] }
        pendingChange: { $ref: '#/components/schemas/PendingChange' }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        serviceCode: { type: string }
        traceId: { type: string }
        errors: { type: object, additionalProperties: { type: string } }
    NewVendorProspect:
      type: object
      required: [companyName, contactName, email, country]
      properties:
        companyName: { type: string, minLength: 1, maxLength: 200 }
        contactName: { type: string, minLength: 1, maxLength: 140 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 40 }
        country: { type: string, pattern: '^[A-Za-z]{2}$' }
        taxId: { type: string, maxLength: 40 }
        website: { type: string, maxLength: 200 }
        message: { type: string, maxLength: 2000 }
    VendorProspect:
      type: object
      required: [id, companyName, contactName, email, country, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        companyName: { type: string }
        contactName: { type: string }
        email: { type: string }
        phone: { type: string }
        country: { type: string }
        taxId: { type: string }
        website: { type: string }
        message: { type: string }
        status: { type: string, enum: [NEW, ACCEPTED, REJECTED] }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        decisionNote: { type: string }
        partyId: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        requestId: { type: string, format: uuid, description: The onboarding questionnaire request. }
    VendorInvite:
      type: object
      required: [id, vendorId, email, role, status, expiresAt, invitedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        vendorId: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        role: { type: string }
        status: { type: string }
        expiresAt: { type: string, format: date-time }
        invitedBy: { type: string }
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time }
    VendorInviteDetails:
      allOf:
        - { $ref: '#/components/schemas/VendorInvite' }
        - type: object
          required: [legalEntityId, vendorName]
          properties:
            legalEntityId: { type: string, format: uuid }
            vendorName: { type: string }
    InviteToken:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 2048 }
    PaymentTerm:
      type: object
      required: [id, code, name, offsetMonths, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        netDays: { type: integer, description: Days after the invoice date; absent when dayOfMonth is set. }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31 }
        offsetMonths: { type: integer }
        version: { type: integer }
    PostingProfile:
      type: object
      required: [id, legalEntityId, code, name, version]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        version: { type: integer }
    CustomerGroup:
      type: object
      required: [id, code, name, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        version: { type: integer }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
