asyncapi: 3.0.0
info:
  title: Passage Transport events
  version: 0.4.0
  description: CloudEvents 1.0 envelope; amounts are decimal strings. Each event is written to the outbox in the transaction that makes the change; the Debezium outbox router sends it to the topic of its aggregate.
defaultContentType: application/cloudevents+json
channels:
  freightBillMatched:
    address: passage.tms.freightbill
    description: Topic for freight bill events (Debezium outbox router).
    messages:
      freightBillMatched:
        $ref: '#/components/messages/FreightBillMatched'
      freightBillApproved:
        $ref: '#/components/messages/FreightBillApproved'
  tender:
    address: passage.tms.tender
    description: Topic for tender outcomes (BR-34.3); subject is the tender id.
    messages:
      tenderAccepted:
        $ref: '#/components/messages/TenderAccepted'
      tenderDeclined:
        $ref: '#/components/messages/TenderDeclined'
      tenderExpired:
        $ref: '#/components/messages/TenderExpired'
  tracking:
    address: passage.tms.tracking
    description: Topic for shipment status reports (FR-34.6); subject is the load id, so per-load order is kept.
    messages:
      trackingEvent:
        $ref: '#/components/messages/TrackingEvent'
  landedCost:
    address: passage.tms.landedcost
    description: Topic for landed cost postings (FR-34.9); subject is the voyage id.
    messages:
      landedCostPosted:
        $ref: '#/components/messages/LandedCostPosted'
  gate:
    address: passage.tms.gate
    description: Topic for gate check-ins (FR-34.14); subject is the gate visit id. Payloads carry no driver PII.
    messages:
      gateCheckedIn:
        $ref: '#/components/messages/GateCheckedIn'
  goodsInTransit:
    address: passage.tms.goodsintransit
    description: Topic for goods-in-transit orders (FR-34.12, BR-34.11); subject is the order id.
    messages:
      goodsInTransitShipped:
        $ref: '#/components/messages/GoodsInTransitShipped'
operations:
  publishFreightBillMatched:
    action: send
    channel:
      $ref: '#/channels/freightBillMatched'
    summary: A carrier invoice was matched to a freight bill.
    messages:
      - $ref: '#/channels/freightBillMatched/messages/freightBillMatched'
  publishFreightBillApproved:
    action: send
    channel:
      $ref: '#/channels/freightBillMatched'
    summary: A freight bill was approved for payment (BR-34.4). Consumers AP (wave 19 vendor invoice for the invoiced amount) and the ledger (accrual reversal, variance to 5250).
    messages:
      - $ref: '#/channels/freightBillMatched/messages/freightBillApproved'
  publishTenderOutcome:
    action: send
    channel:
      $ref: '#/channels/tender'
    summary: A carrier accepted or declined a tender, or its attempt expired. Consumers wms, edi (204/990), analytics.
    messages:
      - $ref: '#/channels/tender/messages/tenderAccepted'
      - $ref: '#/channels/tender/messages/tenderDeclined'
      - $ref: '#/channels/tender/messages/tenderExpired'
  publishTrackingEvent:
    action: send
    channel:
      $ref: '#/channels/tracking'
    summary: A status report was stored (replays are not published). Consumers sales fulfilment, customer portal.
    messages:
      - $ref: '#/channels/tracking/messages/trackingEvent'
  publishLandedCostPosted:
    action: send
    channel:
      $ref: '#/channels/landedCost'
    summary: A voyage's landed cost was allocated and posted. Consumer costing (wave 20).
    messages:
      - $ref: '#/channels/landedCost/messages/landedCostPosted'
  publishGateCheckedIn:
    action: send
    channel:
      $ref: '#/channels/gate'
    summary: A driver and trailer checked in at the gate (replays are not published). Consumer wms (wave 31), which releases the door work.
    messages:
      - $ref: '#/channels/gate/messages/gateCheckedIn'
  publishGoodsInTransitShipped:
    action: send
    channel:
      $ref: '#/channels/goodsInTransit'
    summary: A goods-in-transit order shipped at the transfer event and ownership of its receipt lines moved to the in-transit warehouse (TMS-0121). A repeated ship is not published. Consumers inventory and costing (wave 20).
    messages:
      - $ref: '#/channels/goodsInTransit/messages/goodsInTransitShipped'
components:
  messages:
    FreightBillMatched:
      name: dev.passage.tms.freightbill.matched.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, specversion, tenantid, data]
        properties:
          specversion: { type: string, const: '1.0' }
          type: { type: string, const: dev.passage.tms.freightbill.matched.v1 }
          source: { type: string, const: /passage/tms/transport }
          id: { type: string }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: freight bill id }
          time: { type: string, format: date-time }
          datacontenttype: { type: string, const: application/json }
          dataschema: { type: string }
          data:
            type: object
            required: [freightBillId, carrierInvoiceId, matchStatus, variance, lines]
            properties:
              freightBillId: { type: string, format: uuid }
              carrierInvoiceId: { type: string, format: uuid }
              matchStatus: { type: string, enum: [MATCHED, VARIANCE], description: 'MATCHED when every charge is within tolerance (BR-34.4), otherwise VARIANCE' }
              variance: { type: string }
              lines:
                type: array
                items:
                  type: object
                  required: [chargeCode, expected, invoiced, variance, withinTolerance]
                  properties:
                    chargeCode: { type: string }
                    expected: { type: string }
                    invoiced: { type: string }
                    variance: { type: string, description: invoiced minus expected }
                    withinTolerance: { type: boolean }
    FreightBillApproved:
      name: dev.passage.tms.freightbill.approved.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, specversion, tenantid, data]
        properties:
          specversion: { type: string, const: '1.0' }
          type: { type: string, const: dev.passage.tms.freightbill.approved.v1 }
          source: { type: string, const: /passage/tms/transport }
          id: { type: string }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: freight bill id, the journal reference shared by accrual, reversal and AP invoice (BR-34.5) }
          time: { type: string, format: date-time }
          datacontenttype: { type: string, const: application/json }
          dataschema: { type: string }
          data:
            type: object
            required: [freightBillId, loadId, carrierId, carrierInvoiceId, currency, expectedTotal, invoicedTotal, variance, fromStatus, approvedBy, approvedAt]
            properties:
              freightBillId: { type: string, format: uuid }
              loadId: { type: string, format: uuid }
              carrierId: { type: string, format: uuid }
              carrierInvoiceId: { type: string, format: uuid }
              currency: { type: string }
              expectedTotal: { type: string, description: the accrued amount }
              invoicedTotal: { type: string, description: the amount AP invoices }
              variance: { type: string, description: invoicedTotal minus expectedTotal, posted to freight variance account 5250 }
              fromStatus: { type: string, enum: [MATCHED, VARIANCE, DISPUTED] }
              reason: { type: string, description: required when a variance or dispute is approved }
              approvedBy: { type: string }
              approvedAt: { type: string, format: date-time }
    TenderAccepted:
      name: dev.passage.tms.tender.accepted.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, specversion, tenantid, data]
        properties:
          specversion: { type: string, const: '1.0' }
          type: { type: string, const: dev.passage.tms.tender.accepted.v1 }
          source: { type: string, const: /passage/tms/transport }
          id: { type: string }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: tender id }
          time: { type: string, format: date-time }
          datacontenttype: { type: string, const: application/json }
          data:
            $ref: '#/components/schemas/TenderOutcome'
    TenderDeclined:
      name: dev.passage.tms.tender.declined.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, specversion, tenantid, data]
        properties:
          specversion: { type: string, const: '1.0' }
          type: { type: string, const: dev.passage.tms.tender.declined.v1 }
          source: { type: string, const: /passage/tms/transport }
          id: { type: string }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: tender id }
          time: { type: string, format: date-time }
          datacontenttype: { type: string, const: application/json }
          data:
            $ref: '#/components/schemas/TenderOutcome'
    TenderExpired:
      name: dev.passage.tms.tender.expired.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, specversion, tenantid, data]
        properties:
          specversion: { type: string, const: '1.0' }
          type: { type: string, const: dev.passage.tms.tender.expired.v1 }
          source: { type: string, const: /passage/tms/transport }
          id: { type: string }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: tender id }
          time: { type: string, format: date-time }
          datacontenttype: { type: string, const: application/json }
          data:
            $ref: '#/components/schemas/TenderOutcome'
    TrackingEvent:
      name: dev.passage.tms.tracking.event.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, specversion, tenantid, data]
        properties:
          specversion: { type: string, const: '1.0' }
          type: { type: string, const: dev.passage.tms.tracking.event.v1 }
          source: { type: string, const: /passage/tms/transport }
          id: { type: string }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: load id }
          time: { type: string, format: date-time }
          datacontenttype: { type: string, const: application/json }
          data:
            type: object
            required: [loadId, stopNo, code, occurredAt, source]
            properties:
              loadId: { type: string, format: uuid }
              stopNo: { type: integer }
              code: { type: string, enum: [X3, AF, X1, D1] }
              occurredAt: { type: string, format: date-time }
              location: { type: string }
              source: { type: string, enum: [EDI214, API, TELEMATICS, DRIVER] }
    LandedCostPosted:
      name: dev.passage.tms.landedcost.posted.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, specversion, tenantid, data]
        properties:
          specversion: { type: string, const: '1.0' }
          type: { type: string, const: dev.passage.tms.landedcost.posted.v1 }
          source: { type: string, const: /passage/tms/transport }
          id: { type: string }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: voyage id }
          time: { type: string, format: date-time }
          datacontenttype: { type: string, const: application/json }
          data:
            type: object
            required: [voyageId, reference, currency, total, receiptLines]
            properties:
              voyageId: { type: string, format: uuid }
              reference: { type: string }
              currency: { type: string }
              total: { type: string, description: Voyage cost total; equals the sum of receiptLines.amount to the cent }
              receiptLines:
                type: array
                items:
                  type: object
                  required: [line, amount]
                  properties:
                    line: { type: integer }
                    amount: { type: string }
    GateCheckedIn:
      name: dev.passage.tms.gate.checkedin.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, specversion, tenantid, data]
        properties:
          specversion: { type: string, const: '1.0' }
          type: { type: string, const: dev.passage.tms.gate.checkedin.v1 }
          source: { type: string, const: /passage/tms/transport }
          id: { type: string }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: gate visit id }
          time: { type: string, format: date-time }
          datacontenttype: { type: string, const: application/json }
          data:
            type: object
            required: [visitId, siteId, direction, carrierScac, trailerNo, arrivalDeltaMin, checkedInAt]
            properties:
              visitId: { type: string, format: uuid }
              siteId: { type: string, format: uuid }
              direction: { type: string, enum: [INBOUND, OUTBOUND] }
              loadId: { type: string, format: uuid }
              carrierScac: { type: string }
              trailerNo: { type: string }
              appointmentId: { type: string, format: uuid, description: Absent for a walk-in }
              arrivalStatus: { type: string, enum: [ON_TIME, EARLY, LATE], description: Absent for a walk-in (BR-34.14) }
              arrivalDeltaMin: { type: integer, description: Minutes after (positive) or before (negative) the appointment; 0 for a walk-in }
              checkedInAt: { type: string, format: date-time }
    GoodsInTransitShipped:
      name: dev.passage.tms.goodsintransit.shipped.v1
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [type, source, id, specversion, tenantid, data]
        properties:
          specversion: { type: string, const: '1.0' }
          type: { type: string, const: dev.passage.tms.goodsintransit.shipped.v1 }
          source: { type: string, const: /passage/tms/transport }
          id: { type: string }
          tenantid: { type: string, format: uuid }
          subject: { type: string, description: goods-in-transit order id }
          time: { type: string, format: date-time }
          datacontenttype: { type: string, const: application/json }
          data:
            type: object
            required: [orderId, voyageId, siteId, incoterm, transferEvent, inTransitWarehouse, currency, shippedAt, goodsValue, estimatedTotal, lines]
            properties:
              orderId: { type: string, format: uuid }
              voyageId: { type: string, format: uuid }
              siteId: { type: string, format: uuid }
              incoterm: { type: string, enum: [EXW, FCA, FAS, FOB, CFR, CIF, CPT, CIP] }
              transferEvent: { type: string, const: ORIGIN_SHIPMENT }
              inTransitWarehouse: { type: string, description: 'TRANSIT-{site} by default (in_transit_warehouse)' }
              currency: { type: string }
              shippedAt: { type: string, format: date-time }
              goodsValue: { type: string, description: Sum of lines.value }
              estimatedTotal: { type: string, description: Estimated landed cost; equals the sum of lines.estimated to the cent }
              lines:
                type: array
                items:
                  type: object
                  required: [line, value, quantity, estimated, costs]
                  properties:
                    line: { type: integer, description: Voyage receipt line }
                    value: { type: string }
                    quantity: { type: string }
                    estimated: { type: string, description: Sum of costs.amount }
                    costs:
                      type: array
                      items:
                        type: object
                        required: [costType, amount]
                        properties:
                          costType: { type: string }
                          amount: { type: string }
  schemas:
    TenderOutcome:
      type: object
      required: [tenderId, loadId, carrierId, rank, response]
      properties:
        tenderId: { type: string, format: uuid }
        loadId: { type: string, format: uuid }
        carrierId: { type: string, format: uuid }
        rank: { type: integer, description: Route-guide rank of the attempt }
        response: { type: string, enum: [ACCEPTED, DECLINED, EXPIRED] }
        rate: { type: string, description: Rate quoted to the carrier; absent when the tender named none }
        currency: { type: string }
