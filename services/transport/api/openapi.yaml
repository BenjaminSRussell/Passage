openapi: 3.1.0
info:
  title: Passage Transport (TMS) API
  version: 0.3.0
  description: |
    Wave 34 slices 1 to 3: rate cards, rate shopping, freight bills with their
    approval and dispute, carrier invoices, tenders, tracking events, landed-cost
    voyages, rule-based load building, dangerous-goods checks and
    trade-compliance screening. Errors are RFC 9457 problem details (application/problem+json)
    with a stable `code`; see README.md for the error code list. Browsers call
    /api/v1/transport/..., which the web BFF rewrites to these /v1/transport/...
    paths. Amounts are decimal strings, never floats. Identifiers are lower-case
    UUIDs.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/transport/rate-cards:
    post:
      operationId: createRateCard
      summary: Create an effective-dated rate card
      description: Rejected with TMS-0102 when it shares a day with a card of the same carrier, service and basis (BR-34.10).
      x-passage-duty: TMS_RATE_APPROVE
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateCardRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateCard' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listRateCards
      summary: List rate cards, optionally filtered by carrier and service
      x-passage-duty: TMS_RATE
      parameters:
        - name: carrierId
          in: query
          schema: { type: string, format: uuid }
        - name: serviceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Rate cards
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RateCard' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/shipments/{id}:rate:
    post:
      operationId: rateShipment
      summary: Rate a shipment across carrier services and rank the options
      description: |
        For each carrier service, the cards valid on the ship date are rated
        (BR-34.2); a service with no valid card yields one NO_VALID_RATE_CARD
        option (TMS-0101, BR-34.10). Deterministic for identical inputs; each
        option carries an explain trace. Results are not cached yet.
      x-passage-duty: TMS_RATE
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateRequest' }
      responses:
        '200':
          description: Ranked quotes; `chosen` is the first OK option
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/freight-bills:
    post:
      operationId: createFreightBill
      summary: Create a freight bill with expected charges for a load
      x-passage-duty: TMS_RECONCILE
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FreightBillRequest' }
      responses:
        '201':
          description: Created (or the replayed bill for a repeated Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreightBill' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listFreightBills
      summary: List freight bills, newest first (at most 500)
      x-passage-duty: TMS_VIEW
      parameters:
        - name: matchStatus
          in: query
          schema: { type: string, enum: [UNMATCHED, MATCHED, VARIANCE, DISPUTED, APPROVED, SETTLED] }
        - name: carrierId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Freight bills
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FreightBill' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/freight-bills/{id}:
    get:
      operationId: getFreightBill
      summary: Get a freight bill with its carrier invoice and line comparison
      x-passage-duty: TMS_VIEW
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Freight bill; `carrierInvoice` and `match` are present once an invoice is matched, `decisions` lists approvals and disputes. ETag is the version for If-Match.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreightBillDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/freight-bills/{id}:approve:
    post:
      operationId: approveFreightBill
      summary: Approve a freight bill for payment (BR-34.4)
      description: |
        MATCHED, VARIANCE and DISPUTED bills can be approved; approving a
        VARIANCE or DISPUTED bill needs a `reason`. The bill becomes APPROVED and
        `dev.passage.tms.freightbill.approved.v1` is published for AP (vendor
        invoice for the invoiced amount) and the ledger (accrual reversal,
        variance to 5250). Any other state is 422 TMS-0117. If-Match must carry
        the bill version (428 without it, 412 conflict_version when stale).
      x-passage-duty: TMS_RECONCILE_APPROVE
      parameters:
        - $ref: '#/components/parameters/BillId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: The approved bill (or, for a repeated Idempotency-Key, the bill as it is now); ETag is the new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreightBill' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/transport/freight-bills/{id}:dispute:
    post:
      operationId: disputeFreightBill
      summary: Dispute a freight bill's variance with the carrier (BR-34.4)
      description: |
        Only a VARIANCE bill can be disputed; it becomes DISPUTED and stays so
        until it is approved. A `reason` is required. Other states are 422
        TMS-0117. If-Match must carry the bill version.
      x-passage-duty: TMS_RECONCILE
      parameters:
        - $ref: '#/components/parameters/BillId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: The disputed bill; ETag is the new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreightBill' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/transport/carrier-invoices:
    post:
      operationId: registerCarrierInvoice
      summary: Register a carrier invoice and match it to its freight bill
      description: |
        The idempotency key is the carrier and invoice number: a repeated number
        for the carrier is rejected (TMS-0108). An invoice naming a bill is
        matched line by line with the default tolerance (BR-34.4); the bill must
        be the carrier's, in the same currency (TMS-0112), and not already
        invoiced (TMS-0111). An invoice with no freight bill is stored as
        UNEXPECTED_INVOICE (TMS-0109) and never auto-approved.
      x-passage-duty: TMS_RECONCILE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarrierInvoiceRequest' }
      responses:
        '201':
          description: Registered, and matched when it names a freight bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCarrierInvoices
      summary: List carrier invoices, newest first (at most 500)
      x-passage-duty: TMS_RECONCILE
      parameters:
        - name: matchStatus
          in: query
          description: UNEXPECTED_INVOICE lists the exception queue
          schema: { type: string, enum: [MATCHED, VARIANCE, UNEXPECTED_INVOICE] }
        - name: carrierId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Carrier invoices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CarrierInvoice' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/carrier-invoices/{id}:
    get:
      operationId: getCarrierInvoice
      summary: Get a carrier invoice
      x-passage-duty: TMS_RECONCILE
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Carrier invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarrierInvoice' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/loads:build:
    post:
      operationId: buildLoads
      summary: Build loads from shipments by rule (FR-34.1, BR-34.8)
      description: |
        Groups the shipments by ship-from site, ship-to region, mode and pickup
        date and packs each group first-fit decreasing by weight. No load
        exceeds the capacity in weight, volume or pallets; a shipment that does
        not fit opens another load. A shipment larger than an empty load is 422
        TMS-0115; a shipment already on a load is 409 TMS-0116.
      x-passage-duty: TMS_PLAN
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoadBuildRequest' }
      responses:
        '201':
          description: The loads built (or the loads of the first request for a repeated Idempotency-Key)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Load' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/transport/loads:
    get:
      operationId: listLoads
      summary: List loads, newest first (at most 500); loads by status
      x-passage-duty: TMS_VIEW
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [PLANNED, RATED, TENDERED, ACCEPTED, DISPATCHED, IN_TRANSIT, DELIVERED, CLOSED, CANCELLED] }
      responses:
        '200':
          description: Loads
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Load' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/loads/{id}:
    get:
      operationId: getLoad
      summary: Get a load with its DG checks, newest first
      x-passage-duty: TMS_VIEW
      parameters:
        - $ref: '#/components/parameters/LoadId'
      responses:
        '200':
          description: Load
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoadDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/loads/{id}:dg-check:
    post:
      operationId: checkLoadDangerousGoods
      summary: Run and store the dangerous-goods check of a load (FR-34.15, BR-34.15)
      description: |
        FAIL for a prohibited mixed load (TMS-0130, rule 49CFR-177.848 or
        ADR-7.5.2) or a regulated load without a 24-hour emergency phone; WARN
        for ADR 1.1.3.6 points above 1,000 (TMS-0131), transport category 0 and
        limited-quantity marking. Returns the DG shipping-paper lines.
      x-passage-duty: TMS_PLAN
      parameters:
        - $ref: '#/components/parameters/LoadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DGRequest' }
      responses:
        '200':
          description: The stored check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DGCheck' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/loads/{id}:screen:
    post:
      operationId: screenLoad
      summary: Screen the parties of a load for denied parties and sanctions (FR-34.19, BR-34.17)
      description: |
        Calls the ComplianceScreeningProvider per party (5 s timeout each). Any
        POTENTIAL_MATCH, BLOCKED or SCREENING_PENDING party makes the decision
        HOLD (TMS-0133). Without a provider a cross-border load is NOT_SCREENED
        and the decision is WARN (TMS-0134). A load is cross-border when the
        request says so or the parties name more than one country. The decision
        is not stored yet.
      x-passage-duty: TMS_PLAN
      parameters:
        - $ref: '#/components/parameters/LoadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScreenRequest' }
      responses:
        '200':
          description: Screening decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningDecision' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/transfer-rules/{incoterm}:
    get:
      operationId: getTransferRule
      summary: Default goods-in-transit transfer event for an Incoterms 2020 rule (BR-34.11)
      description: |
        EXW, FCA, FAS, FOB, CFR, CIF, CPT and CIP transfer at the origin shipment
        and open a goods-in-transit order (TMS-0121); DAP, DPU and DDP transfer at
        the destination receipt with no goods-in-transit order. Case is ignored.
        Any other rule is 400 COM-0001.
      x-passage-duty: TMS_VIEW
      parameters:
        - name: incoterm
          in: path
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        '200':
          description: Transfer rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferRule' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/loads/{id}:tender:
    post:
      operationId: startTender
      summary: Start a tender cascade for a load (FR-34.5, BR-34.3)
      description: |
        Sends the load to the first carrier in route-guide rank order; each
        carrier has `timeoutMin` (default 120, 5 to 1,440) to respond. A load
        with an ACCEPTED tender, or a PENDING tender still inside its deadline,
        is refused with TMS-0114; a PENDING tender past its deadline is
        cascaded first and no longer blocks once it has failed. A load whose
        latest dangerous-goods check is FAIL is refused with 422 TMS-0130 and no
        tender is sent (AC-34.13).
      x-passage-duty: TMS_TENDER
      parameters:
        - name: id
          in: path
          required: true
          description: Load id
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenderRequest' }
      responses:
        '201':
          description: Tender started (or the replayed tender for a repeated Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tender' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/transport/tenders:
    get:
      operationId: listTenders
      summary: List tenders, newest first (at most 500); the tender board
      x-passage-duty: TMS_TENDER
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, ACCEPTED, TENDER_FAILED] }
        - name: loadId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tenders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Tender' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/tenders:expire:
    post:
      operationId: expireTenders
      summary: Cascade every overdue tender of the tenant (expiry sweep)
      description: |
        Expires each pending attempt whose deadline has passed, offers the load
        to the next carrier or fails the tender with a planner task (TMS-0106)
        after the last one, and publishes one tender.expired event per expired
        attempt. At most 500 tenders per call. A Temporal TenderWorkflow timer
        will drive the same rule; until then a scheduler or the tender board calls this.
      x-passage-duty: TMS_TENDER
      responses:
        '200':
          description: The tenders the sweep advanced
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Tender' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/tenders/{id}:
    get:
      operationId: getTender
      summary: Get a tender with its cascade attempts
      x-passage-duty: TMS_TENDER
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tender as stored; `overdue` is true when the pending attempt is past its deadline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tender' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/tenders/{id}:respond:
    post:
      operationId: respondTender
      summary: Carrier accepts or declines a tender
      description: |
        Deadlines that have passed are cascaded first. A response after the
        carrier's deadline is 409 TMS-0105 (the cascade it uncovered is still
        saved); a carrier the tender is not waiting on is 409 TMS-0113. A
        decline offers the load to the next carrier. The same carrier repeating
        its last response gets the tender back unchanged (natural idempotency).
      x-passage-duty: TMS_CARRIER_RESPOND
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrierId, accept]
              properties:
                carrierId: { type: string, format: uuid }
                accept: { type: boolean, description: true to accept, false to decline }
      responses:
        '200':
          description: The tender after the response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tender' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/transport/tracking-events:
    post:
      operationId: ingestTrackingEvent
      summary: Ingest one shipment status report (EDI 214, carrier API, telematics, driver)
      description: |
        Source and ref are the idempotency key: the same report again is 200 with
        `Idempotent-Replayed: true`; a different report under the same source and
        ref is 422 idempotency_key_reuse. Supported codes: X3 arrived at pickup,
        AF departed with the freight, X1 arrived at delivery, D1 delivered.
      x-passage-duty: TMS_TRACK_INGEST
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackingEventRequest' }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingEvent' }
        '200':
          description: Replay of a stored report
          headers:
            Idempotent-Replayed: { schema: { type: string, const: 'true' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingEvent' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listTrackingEvents
      summary: Tracking events; with loadId that load's events in occurred_at order, else the newest 500 received
      x-passage-duty: TMS_VIEW
      parameters:
        - name: loadId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tracking events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TrackingEvent' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/loads/{id}/tracking:
    get:
      operationId: getLoadTracking
      summary: Tracking timeline of a load with the projected stop states (BR-34.9)
      x-passage-duty: TMS_VIEW
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Events in occurred_at order and one state per reported stop
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoadTracking' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/voyages:
    post:
      operationId: createVoyage
      summary: Create a landed-cost voyage with legs, containers, folios, cost lines and receipt lines
      description: |
        Container numbers are checked with the ISO 6346 check digit (BR-34.12);
        a failure is 422 TMS-0124 with the container in `errors`. The voyage
        starts ESTIMATED; status and allocations sent by the client are ignored.
      x-passage-duty: TMS_LANDED_COST
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoyageRequest' }
      responses:
        '201':
          description: Created (or the replayed voyage for a repeated Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voyage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listVoyages
      summary: List voyages, newest first (at most 500), without their documents
      x-passage-duty: TMS_LANDED_COST
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ESTIMATED, POSTED] }
      responses:
        '200':
          description: Voyages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/VoyageSummary' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/voyages/{id}:
    get:
      operationId: getVoyage
      summary: Get a voyage with its documents and, once posted, its allocations
      x-passage-duty: TMS_LANDED_COST
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Voyage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voyage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/landed-cost/voyages/{id}:allocate:
    post:
      operationId: allocateVoyage
      summary: Allocate the voyage's landed cost to its receipt lines and post it (FR-34.9, BR-34.6)
      description: |
        Each cost line is split by its method with shares rounded to cents and
        the residual on the highest-value receipt line (TMS-0110), so the
        allocations sum to the cost total exactly. Publishes
        dev.passage.tms.landedcost.posted.v1. A POSTED voyage is returned
        unchanged with 200, so a retry is safe.
      x-passage-duty: TMS_LANDED_COST
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The posted voyage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voyage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    BillId:
      name: id
      in: path
      required: true
      description: Freight bill id
      schema: { type: string, format: uuid }
    LoadId:
      name: id
      in: path
      required: true
      description: Load id
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version the client read, such as "2" (the ETag of the freight bill).
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Stored with the record the command creates, with a fingerprint of the
        method, path and body. A repeat with the same body returns that record;
        a repeat with a different body is 422 idempotency_key_reuse.
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Capacity:
      type: object
      required: [maxWeightKg, maxVolumeM3, maxPallets]
      properties:
        maxWeightKg: { type: string, description: Decimal string greater than zero }
        maxVolumeM3: { type: string, description: Decimal string greater than zero }
        maxPallets: { type: integer, minimum: 1 }
    LoadShipment:
      type: object
      required: [id, shipFromSiteId, shipToRegion, mode, pickupDate, weightKg, volumeM3, pallets]
      properties:
        id: { type: string, format: uuid, description: Shipment id }
        shipFromSiteId: { type: string, format: uuid }
        shipToRegion: { type: string, minLength: 1, maxLength: 20 }
        mode: { type: string, enum: [TL, LTL, PARCEL, INTERMODAL] }
        pickupDate: { type: string, format: date }
        weightKg: { type: string }
        volumeM3: { type: string }
        pallets: { type: integer, minimum: 0 }
    LoadBuildRequest:
      type: object
      required: [capacity, shipments]
      properties:
        capacity: { $ref: '#/components/schemas/Capacity' }
        shipments:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/LoadShipment' }
    Load:
      type: object
      required: [id, mode, status, shipFromSiteId, shipToRegion, pickupDate, totalWeightKg, totalVolumeM3, pallets, capacity, shipmentIds, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        mode: { type: string, enum: [TL, LTL, PARCEL, INTERMODAL] }
        status: { type: string, enum: [PLANNED, RATED, TENDERED, ACCEPTED, DISPATCHED, IN_TRANSIT, DELIVERED, CLOSED, CANCELLED] }
        shipFromSiteId: { type: string, format: uuid }
        shipToRegion: { type: string }
        pickupDate: { type: string, format: date }
        totalWeightKg: { type: string }
        totalVolumeM3: { type: string }
        pallets: { type: integer }
        capacity: { $ref: '#/components/schemas/Capacity' }
        shipmentIds: { type: array, items: { type: string, format: uuid } }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    LoadDetail:
      allOf:
        - $ref: '#/components/schemas/Load'
        - type: object
          required: [dgChecks]
          properties:
            dgChecks: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/DGCheck' } }
    DGLine:
      type: object
      required: [unNumber, properShippingName, class, quantity, transportCategory]
      properties:
        unNumber: { type: string, pattern: '^UN[0-9]{4}$' }
        properShippingName: { type: string, minLength: 1, maxLength: 200 }
        class: { type: string, description: Hazard class or division, with a compatibility group for class 1 (3, 2.1, 1.1D) }
        packingGroup: { type: string, enum: ['', I, II, III] }
        quantity: { type: string, description: Litres or kilograms as ADR 1.1.3.6 counts them; decimal string greater than zero }
        transportCategory: { type: integer, minimum: 0, maximum: 4, description: ADR transport category }
        limitedQuantity: { type: boolean }
    DGRequest:
      type: object
      required: [regulation, lines]
      properties:
        regulation: { type: string, enum: [ADR, 49CFR] }
        emergencyResponsePhone: { type: string, description: E.164 number; required before a regulated DG shipment }
        lines: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/DGLine' } }
    DGFinding:
      type: object
      required: [ruleId, severity, detail]
      properties:
        ruleId: { type: string, enum: [49CFR-177.848, ADR-7.5.2, ADR-1.1.3.6, ADR-1.1.3.6-CAT0, LQ-MARKING, DG-EMERGENCY-PHONE] }
        severity: { type: string, enum: [WARN, FAIL] }
        code: { type: string, enum: [TMS-0130, TMS-0131] }
        detail: { type: string }
    PaperLine:
      type: object
      required: [unNumber, properShippingName, class, quantity, limitedQuantity]
      properties:
        unNumber: { type: string }
        properShippingName: { type: string }
        class: { type: string }
        packingGroup: { type: string }
        quantity: { type: string }
        limitedQuantity: { type: boolean }
        emergencyResponsePhone: { type: string }
    DGCheck:
      type: object
      required: [id, loadId, regulation, result, adrPoints, findings, shippingPapers, checkedBy, checkedAt]
      properties:
        id: { type: string, format: uuid }
        loadId: { type: string, format: uuid }
        regulation: { type: string, enum: [ADR, 49CFR] }
        result: { type: string, enum: [PASS, WARN, FAIL] }
        adrPoints: { type: string, description: ADR 1.1.3.6 points; zero under 49CFR }
        findings: { type: array, items: { $ref: '#/components/schemas/DGFinding' } }
        shippingPapers: { type: array, items: { $ref: '#/components/schemas/PaperLine' } }
        checkedBy: { type: string }
        checkedAt: { type: string, format: date-time }
    ScreeningParty:
      type: object
      required: [role, name]
      properties:
        role: { type: string, enum: [SOLD_TO, SHIP_TO, CONSIGNEE, FORWARDER, CARRIER] }
        name: { type: string, minLength: 1, maxLength: 200 }
        country: { type: string, description: ISO 3166-1 alpha-2 }
    ScreenRequest:
      type: object
      required: [parties]
      properties:
        crossBorder: { type: boolean }
        parties: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/ScreeningParty' } }
    ScreeningDecision:
      type: object
      required: [loadId, crossBorder, decision, parties]
      properties:
        loadId: { type: string, format: uuid }
        crossBorder: { type: boolean }
        decision: { type: string, enum: [CLEAR, WARN, HOLD] }
        parties:
          type: array
          items:
            type: object
            required: [role, name, status]
            properties:
              role: { type: string }
              name: { type: string }
              status: { type: string, enum: [CLEAR, POTENTIAL_MATCH, BLOCKED, SCREENING_PENDING, NOT_SCREENED] }
              code: { type: string, enum: [TMS-0133, TMS-0134] }
    TransferRule:
      type: object
      required: [incoterm, event, goodsInTransit]
      properties:
        incoterm: { type: string, enum: [EXW, FCA, FAS, FOB, CFR, CIF, CPT, CIP, DAP, DPU, DDP] }
        event: { type: string, enum: [ORIGIN_SHIPMENT, DESTINATION_RECEIPT] }
        goodsInTransit: { type: boolean }
        code: { type: string, enum: [TMS-0121] }
    DecisionRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500, description: Required for a dispute and for approving a VARIANCE or DISPUTED bill }
    Decision:
      type: object
      required: [id, freightBillId, action, fromStatus, toStatus, decidedBy, decidedAt]
      properties:
        id: { type: string, format: uuid }
        freightBillId: { type: string, format: uuid }
        action: { type: string, enum: [APPROVE, DISPUTE] }
        fromStatus: { type: string, enum: [MATCHED, VARIANCE, DISPUTED] }
        toStatus: { type: string, enum: [DISPUTED, APPROVED] }
        reason: { type: string }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: Stable error code }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    Line:
      description: One charge; the amount is in the document currency.
      type: object
      required: [chargeCode, amount]
      additionalProperties: false
      properties:
        chargeCode: { type: string, maxLength: 20 }
        amount: { type: string, description: Decimal string, pattern: '^[0-9]+(\.[0-9]+)?$' }
    RateRow:
      type: object
      required: [origin, destination, breakFrom, rate, unit]
      properties:
        origin: { type: string, description: Zone or lane origin; * matches any }
        destination: { type: string, description: Zone or lane destination; * matches any }
        breakFrom: { type: string, description: Decimal lower bound of the break band }
        breakTo: { type: [string, 'null'], description: Decimal upper bound, exclusive }
        rate: { type: string, description: Decimal rate per unit }
        unit: { type: string, enum: [KG, PALLET, CONTAINER, SHIPMENT, KM, MILE], description: 'Quantity priced: chargeable kg, pallets, one container or shipment, or the shipment distance in km or miles' }
    Accessorial:
      type: object
      required: [code]
      properties:
        code: { type: string }
        flat: { type: string, description: Decimal flat amount }
        pct: { type: string, description: Percent of base charge; a non-zero pct wins over flat }
    RateCardRequest:
      type: object
      required: [carrierId, serviceId, basis, currency, validFrom, rows]
      properties:
        carrierId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        basis:
          type: string
          enum: [LANE, ZONE, DISTANCE, WEIGHT_BREAK, PER_PALLET, PER_CONTAINER, FLAT]
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
        minimumCharge: { type: string }
        dimDivisor: { type: integer, minimum: 1, description: 'Dimensional divisor in cm³ per kg; 0 or absent means 5000' }
        fuelPct: { type: string, description: Fuel surcharge percent of base }
        rows: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RateRow' } }
        accessorials: { type: array, items: { $ref: '#/components/schemas/Accessorial' } }
    RateCard:
      allOf:
        - $ref: '#/components/schemas/RateCardRequest'
        - type: object
          required: [id, minimumCharge, dimDivisor, fuelPct, accessorials]
          properties:
            id: { type: string, format: uuid }
    RateRequest:
      type: object
      required: [originZone, destinationZone, shipDate]
      properties:
        originZone: { type: string, maxLength: 20 }
        destinationZone: { type: string, maxLength: 20 }
        weightKg: { type: string }
        volumeM3: { type: string }
        pallets: { type: integer, minimum: 0 }
        distanceKm: { type: string, description: Decimal distance; prices KM and MILE rows }
        shipDate: { type: string, format: date }
        accessorialCodes: { type: array, items: { type: string, maxLength: 20 } }
    Quote:
      type: object
      required: [carrierId, serviceId, currency, status, total, charges, trace]
      properties:
        carrierId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { type: string, enum: [OK, NO_VALID_RATE_CARD, NO_LANE_RATE] }
        total: { type: string, description: Decimal sum of rounded charges }
        charges:
          type: array
          items:
            type: object
            required: [code, amount]
            properties:
              code: { type: string, description: 'BASE, ACC:<code> or FUEL' }
              amount: { type: string, description: Decimal rounded half-up to cents }
        trace:
          type: array
          description: Explain trace, one entry per rating step with its inputs
          items:
            type: object
            required: [step, input, amount]
            properties:
              step: { type: string }
              input: { type: string }
              amount: { type: string }
    RateResponse:
      type: object
      required: [shipmentId, options]
      properties:
        shipmentId: { type: string, format: uuid }
        options: { type: array, items: { $ref: '#/components/schemas/Quote' } }
        chosen: { $ref: '#/components/schemas/Quote' }
    FreightBillRequest:
      type: object
      required: [loadId, carrierId, currency, expectedLines]
      properties:
        loadId: { type: string, format: uuid }
        carrierId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        expectedLines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Line' }
    FreightBill:
      type: object
      required: [id, loadId, carrierId, currency, expectedLines, expectedTotal, matchStatus, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        loadId: { type: string, format: uuid }
        carrierId: { type: string, format: uuid }
        currency: { type: string }
        expectedLines: { type: array, items: { $ref: '#/components/schemas/Line' } }
        expectedTotal: { type: string }
        matchStatus:
          type: string
          enum: [UNMATCHED, MATCHED, VARIANCE, DISPUTED, APPROVED, SETTLED]
        carrierInvoiceId: { type: string, format: uuid }
        varianceTotal: { type: string, description: Invoiced minus expected, once matched }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    FreightBillDetail:
      allOf:
        - $ref: '#/components/schemas/FreightBill'
        - type: object
          properties:
            carrierInvoice: { $ref: '#/components/schemas/CarrierInvoice' }
            match: { $ref: '#/components/schemas/MatchResult' }
            decisions: { type: array, items: { $ref: '#/components/schemas/Decision' } }
    MatchResult:
      type: object
      required: [status, lines, varianceTotal]
      properties:
        status: { type: string, enum: [MATCHED, VARIANCE] }
        varianceTotal: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [chargeCode, expected, invoiced, variance, allowed, within]
            properties:
              chargeCode: { type: string }
              expected: { type: string }
              invoiced: { type: string }
              variance: { type: string, description: Invoiced minus expected }
              allowed: { type: string, description: 'The smaller of $5.00 and 2 % of the expected charge' }
              within: { type: boolean }
    CarrierInvoiceRequest:
      type: object
      required: [carrierId, invoiceNo, invoiceDate, source, currency, lines]
      properties:
        carrierId: { type: string, format: uuid }
        invoiceNo: { type: string, minLength: 1, maxLength: 40 }
        invoiceDate: { type: string, format: date }
        source: { type: string, enum: [EDI210, MANUAL, API] }
        freightBillId: { type: string, format: uuid, description: The bill to match; absent makes the invoice UNEXPECTED_INVOICE }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Line' }
    CarrierInvoice:
      allOf:
        - $ref: '#/components/schemas/CarrierInvoiceRequest'
        - type: object
          required: [id, total, matchStatus, createdAt]
          properties:
            id: { type: string, format: uuid }
            total: { type: string, description: Decimal sum of invoice lines }
            matchStatus: { type: string, enum: [MATCHED, VARIANCE, UNEXPECTED_INVOICE] }
            varianceTotal: { type: string }
            createdAt: { type: string, format: date-time }
    InvoiceResponse:
      type: object
      required: [invoice]
      properties:
        invoice: { $ref: '#/components/schemas/CarrierInvoice' }
        freightBill: { $ref: '#/components/schemas/FreightBill' }
    TenderRequest:
      type: object
      required: [carriers]
      properties:
        carriers:
          type: array
          minItems: 1
          maxItems: 20
          description: Route-guide carriers in rank order, each listed once
          items:
            type: object
            required: [carrierId]
            properties:
              carrierId: { type: string, format: uuid }
              rateQuoted: { type: string, description: 'Decimal rate offered, at most two decimals' }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Required with quoted rates, not allowed without }
        timeoutMin: { type: integer, minimum: 5, maximum: 1440, default: 120 }
    TenderAttempt:
      type: object
      required: [rank, carrierId, sentAt, expiresAt, response]
      properties:
        rank: { type: integer, minimum: 1 }
        carrierId: { type: string, format: uuid }
        sentAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        response: { type: string, enum: [PENDING, ACCEPTED, DECLINED, EXPIRED] }
        rateQuoted: { type: string }
    Tender:
      type: object
      required: [id, loadId, status, carriers, timeoutMin, attempts, plannerTask, overdue, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        loadId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACCEPTED, TENDER_FAILED] }
        carriers: { type: array, items: { type: string, format: uuid } }
        currency: { type: string }
        timeoutMin: { type: integer }
        attempts: { type: array, items: { $ref: '#/components/schemas/TenderAttempt' } }
        acceptedCarrierId: { type: string, format: uuid }
        plannerTask: { type: boolean, description: True once every carrier declined or timed out (TMS-0106) }
        pendingCarrierId: { type: string, format: uuid }
        pendingExpiresAt: { type: string, format: date-time }
        overdue: { type: boolean, description: The pending attempt is past its deadline and waits for the sweep }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    TrackingEventRequest:
      type: object
      required: [loadId, stopNo, code, occurredAt, source, ref]
      properties:
        loadId: { type: string, format: uuid }
        stopNo: { type: integer, minimum: 1, maximum: 999 }
        code: { type: string, enum: [X3, AF, X1, D1], description: EDI 214 shipment status code }
        occurredAt: { type: string, format: date-time, description: RFC 3339 with a zone; at most a day ahead }
        location: { type: string, maxLength: 100 }
        source: { type: string, enum: [EDI214, API, TELEMATICS, DRIVER] }
        ref: { type: string, minLength: 1, maxLength: 64, description: The sender's reference; with source the idempotency key }
    TrackingEvent:
      allOf:
        - $ref: '#/components/schemas/TrackingEventRequest'
        - type: object
          required: [id, receivedAt]
          properties:
            id: { type: string, format: uuid }
            receivedAt: { type: string, format: date-time }
    StopState:
      type: object
      required: [stopNo, status, pickupInferred]
      properties:
        stopNo: { type: integer }
        status: { type: string, enum: [PENDING, ARRIVED, PICKED_UP, DELIVERED] }
        arrivedAt: { type: string, format: date-time }
        pickedUpAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time }
        pickupInferred: { type: boolean, description: A delivery arrived with no earlier pickup; pickedUpAt is the delivery time (BR-34.9) }
    LoadTracking:
      type: object
      required: [loadId, events, stops]
      properties:
        loadId: { type: string, format: uuid }
        events: { type: array, items: { $ref: '#/components/schemas/TrackingEvent' } }
        stops: { type: array, items: { $ref: '#/components/schemas/StopState' } }
    VoyageRequest:
      type: object
      required: [reference, currency, legs, costLines, receiptLines]
      properties:
        reference: { type: string, minLength: 1, maxLength: 40 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        legs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [from, to, mode]
            properties:
              seq: { type: integer, description: Assigned by the server in the order given }
              from: { type: string, maxLength: 40 }
              to: { type: string, maxLength: 40 }
              mode: { type: string, enum: [OCEAN, AIR, ROAD, RAIL] }
        containers:
          type: array
          maxItems: 200
          items:
            type: object
            required: [number, type]
            properties:
              number: { type: string, description: ISO 6346 number with check digit, such as CSQU3054383 }
              type: { type: string, enum: [20GP, 40GP, 40HC, 45HC, REEFER] }
              seal: { type: string, maxLength: 40 }
        folios:
          type: array
          maxItems: 100
          items:
            type: object
            required: [folioNo, forwarder]
            properties:
              folioNo: { type: string, maxLength: 40 }
              forwarder: { type: string, maxLength: 40, description: Vendor or forwarder }
              containers: { type: array, items: { type: string }, description: Container numbers on this voyage }
        costLines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/VoyageCostLine' }
        receiptLines:
          type: array
          minItems: 1
          maxItems: 3000
          items:
            type: object
            required: [line]
            properties:
              line: { type: integer, minimum: 1 }
              value: { type: string, description: Decimal receipt value; decides the residual line }
              weight: { type: string }
              volume: { type: string }
              quantity: { type: string }
    VoyageCostLine:
      type: object
      required: [costType, amount, allocationMethod]
      properties:
        costType: { type: string, maxLength: 20, description: Such as FREIGHT, DUTY, BROKERAGE, INSURANCE }
        amount: { type: string, description: Decimal, at most two decimals }
        allocationMethod: { type: string, enum: [WEIGHT, VOLUME, VALUE, QUANTITY, EQUAL] }
    Allocation:
      type: object
      required: [line, amount]
      properties:
        line: { type: integer }
        amount: { type: string }
    Voyage:
      allOf:
        - $ref: '#/components/schemas/VoyageRequest'
        - type: object
          required: [id, status, costAllocations, allocations, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [ESTIMATED, POSTED] }
            costAllocations:
              type: array
              description: One entry per cost line once posted; shares sum to the amount to the cent
              items:
                type: object
                required: [costType, allocationMethod, amount, shares, residual, residualLine]
                properties:
                  costType: { type: string }
                  allocationMethod: { type: string }
                  amount: { type: string }
                  shares: { type: array, items: { $ref: '#/components/schemas/Allocation' } }
                  residual: { type: string, description: Rounding residual (TMS-0110) }
                  residualLine: { type: integer }
            allocations:
              type: array
              description: Landed cost per receipt line once posted; sums to the cost total
              items: { $ref: '#/components/schemas/Allocation' }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
            postedAt: { type: string, format: date-time }
    VoyageSummary:
      type: object
      required: [id, reference, currency, status, costTotal, containers, receiptLines, createdAt]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        currency: { type: string }
        status: { type: string, enum: [ESTIMATED, POSTED] }
        costTotal: { type: string }
        containers: { type: integer }
        receiptLines: { type: integer }
        createdAt: { type: string, format: date-time }
        postedAt: { type: string, format: date-time }
