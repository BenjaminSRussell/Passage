openapi: 3.1.0
info:
  title: Passage Transport (TMS) API
  version: 0.5.0
  description: |
    Wave 34 slices 1 to 5: rate cards, rate shopping with its cache, freight
    bills with their approval and dispute, carrier invoices, tenders, tracking
    events, landed-cost voyages and goods-in-transit orders, rule-based load
    building, dangerous-goods checks, trade-compliance screening with its holds,
    driver check-in and check-out with the gate log, route optimization and
    load-plan stacking. Errors are RFC 9457 problem details (application/problem+json)
    with a stable `code`; see README.md for the error code list. Browsers call
    /api/v1/transport/..., which the web BFF rewrites to these /v1/transport/...
    paths. Amounts are decimal strings, never floats. Identifiers are lower-case
    UUIDs.
servers:
  - url: https://api.{env}.passage.dev
    variables:
      env:
        default: dev
paths:
  /v1/transport/rate-cards:
    post:
      operationId: createRateCard
      summary: Create an effective-dated rate card
      description: Rejected with TMS-0102 when it shares a day with a card of the same carrier, service and basis (BR-34.10).
      x-passage-duty: transport.rate-card.approve
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateCardRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateCard' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listRateCards
      summary: List rate cards, optionally filtered by carrier and service
      x-passage-duty: transport.rate-card.maintain
      parameters:
        - name: carrierId
          in: query
          schema: { type: string, format: uuid }
        - name: serviceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Rate cards
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RateCard' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/shipments/{id}:rate:
    post:
      operationId: rateShipment
      summary: Rate a shipment across carrier services and rank the options
      description: |
        For each carrier service, the cards valid on the ship date are rated
        (BR-34.2); a service with no valid card yields one NO_VALID_RATE_CARD
        option (TMS-0101, BR-34.10). Deterministic for identical inputs; each
        option carries an explain trace. Results are cached per tenant and
        input (the shipment id is not part of the input) for
        `TMS_RATING_CACHE_MIN` minutes (rating_cache_min, default 10, 0 turns
        the cache off, FR-34.4); saving a rate card drops the tenant's cached
        results on the replica that saved it.
      x-passage-duty: transport.rate-card.maintain
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateRequest' }
      responses:
        '200':
          description: Ranked quotes; `chosen` is the first OK option
          headers:
            X-Passage-Cache:
              description: HIT when served from the rate-shop cache, else MISS
              schema: { type: string, enum: [HIT, MISS] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/freight-bills:
    post:
      operationId: createFreightBill
      summary: Create a freight bill with expected charges for a load
      x-passage-duty: transport.freight-bill.reconcile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FreightBillRequest' }
      responses:
        '201':
          description: Created (or the replayed bill for a repeated Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreightBill' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listFreightBills
      summary: List freight bills, newest first (at most 500)
      x-passage-duty: transport.view
      parameters:
        - name: matchStatus
          in: query
          schema: { type: string, enum: [UNMATCHED, MATCHED, VARIANCE, DISPUTED, APPROVED, SETTLED] }
        - name: carrierId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Freight bills
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FreightBill' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/freight-bills/{id}:
    get:
      operationId: getFreightBill
      summary: Get a freight bill with its carrier invoice and line comparison
      x-passage-duty: transport.view
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Freight bill; `carrierInvoice` and `match` are present once an invoice is matched, `decisions` lists approvals and disputes. ETag is the version for If-Match.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreightBillDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/freight-bills/{id}:approve:
    post:
      operationId: approveFreightBill
      summary: Approve a freight bill for payment (BR-34.4)
      description: |
        MATCHED, VARIANCE and DISPUTED bills can be approved; approving a
        VARIANCE or DISPUTED bill needs a `reason`. The bill becomes APPROVED and
        `dev.passage.tms.freightbill.approved.v1` is published for AP (vendor
        invoice for the invoiced amount) and the ledger (accrual reversal,
        variance to 5250). Any other state is 422 TMS-0117. If-Match must carry
        the bill version (428 without it, 412 conflict_version when stale).
      x-passage-duty: transport.freight-bill.approve
      parameters:
        - $ref: '#/components/parameters/BillId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: The approved bill (or, for a repeated Idempotency-Key, the bill as it is now); ETag is the new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreightBill' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/transport/freight-bills/{id}:dispute:
    post:
      operationId: disputeFreightBill
      summary: Dispute a freight bill's variance with the carrier (BR-34.4)
      description: |
        Only a VARIANCE bill can be disputed; it becomes DISPUTED and stays so
        until it is approved. A `reason` is required. Other states are 422
        TMS-0117. If-Match must carry the bill version.
      x-passage-duty: transport.freight-bill.reconcile
      parameters:
        - $ref: '#/components/parameters/BillId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: The disputed bill; ETag is the new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreightBill' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/transport/carrier-invoices:
    post:
      operationId: registerCarrierInvoice
      summary: Register a carrier invoice and match it to its freight bill
      description: |
        The idempotency key is the carrier and invoice number: a repeated number
        for the carrier is rejected (TMS-0108). An invoice naming a bill is
        matched line by line with the default tolerance (BR-34.4); the bill must
        be the carrier's, in the same currency (TMS-0112), and not already
        invoiced (TMS-0111). An invoice with no freight bill is stored as
        UNEXPECTED_INVOICE (TMS-0109) and never auto-approved.
      x-passage-duty: transport.freight-bill.reconcile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarrierInvoiceRequest' }
      responses:
        '201':
          description: Registered, and matched when it names a freight bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCarrierInvoices
      summary: List carrier invoices, newest first (at most 500)
      x-passage-duty: transport.freight-bill.reconcile
      parameters:
        - name: matchStatus
          in: query
          description: UNEXPECTED_INVOICE lists the exception queue
          schema: { type: string, enum: [MATCHED, VARIANCE, UNEXPECTED_INVOICE] }
        - name: carrierId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Carrier invoices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CarrierInvoice' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/carrier-invoices/{id}:
    get:
      operationId: getCarrierInvoice
      summary: Get a carrier invoice
      x-passage-duty: transport.freight-bill.reconcile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Carrier invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarrierInvoice' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/loads:build:
    post:
      operationId: buildLoads
      summary: Build loads from shipments by rule (FR-34.1, BR-34.8)
      description: |
        Groups the shipments by ship-from site, ship-to region, mode and pickup
        date and packs each group first-fit decreasing by weight. No load
        exceeds the capacity in weight, volume or pallets; a shipment that does
        not fit opens another load. A shipment larger than an empty load is 422
        TMS-0115; a shipment already on a load is 409 TMS-0116.
      x-passage-duty: transport.load.plan
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoadBuildRequest' }
      responses:
        '201':
          description: The loads built (or the loads of the first request for a repeated Idempotency-Key)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Load' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/transport/loads:
    get:
      operationId: listLoads
      summary: List loads, newest first (at most 500); loads by status
      x-passage-duty: transport.view
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [PLANNED, RATED, TENDERED, ACCEPTED, DISPATCHED, IN_TRANSIT, DELIVERED, CLOSED, CANCELLED] }
      responses:
        '200':
          description: Loads
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Load' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/loads/{id}:
    get:
      operationId: getLoad
      summary: Get a load with its DG checks, newest first
      x-passage-duty: transport.view
      parameters:
        - $ref: '#/components/parameters/LoadId'
      responses:
        '200':
          description: Load
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoadDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/loads/{id}:dg-check:
    post:
      operationId: checkLoadDangerousGoods
      summary: Run and store the dangerous-goods check of a load (FR-34.15, BR-34.15)
      description: |
        FAIL for a prohibited mixed load (TMS-0130, rule 49CFR-177.848 or
        ADR-7.5.2) or a regulated load without a 24-hour emergency phone; WARN
        for ADR 1.1.3.6 points above 1,000 (TMS-0131), transport category 0 and
        limited-quantity marking. Returns the DG shipping-paper lines.
      x-passage-duty: transport.load.plan
      parameters:
        - $ref: '#/components/parameters/LoadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DGRequest' }
      responses:
        '200':
          description: The stored check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DGCheck' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/loads/{id}:screen:
    post:
      operationId: screenLoad
      summary: Screen the parties of a load for denied parties and sanctions (FR-34.19, BR-34.17)
      description: |
        Calls the ComplianceScreeningProvider per party (5 s timeout each). Any
        POTENTIAL_MATCH, BLOCKED or SCREENING_PENDING party makes the decision
        HOLD (TMS-0133). Without a provider a cross-border load is NOT_SCREENED
        and the decision is WARN (TMS-0134). A load is cross-border when the
        request says so or the parties name more than one country. A HOLD
        stores a screening hold on the load (one OPEN hold per load; screening
        again while held refreshes its party results) and names it in
        `holdId`; the hold blocks tendering until it is released. CLEAR and
        WARN are not stored and never clear an open hold.
      x-passage-duty: transport.load.plan
      parameters:
        - $ref: '#/components/parameters/LoadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScreenRequest' }
      responses:
        '200':
          description: Screening decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningDecision' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/transfer-rules/{incoterm}:
    get:
      operationId: getTransferRule
      summary: Default goods-in-transit transfer event for an Incoterms 2020 rule (BR-34.11)
      description: |
        EXW, FCA, FAS, FOB, CFR, CIF, CPT and CIP transfer at the origin shipment
        and open a goods-in-transit order (TMS-0121); DAP, DPU and DDP transfer at
        the destination receipt with no goods-in-transit order. Case is ignored.
        Any other rule is 400 COM-0001.
      x-passage-duty: transport.view
      parameters:
        - name: incoterm
          in: path
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        '200':
          description: Transfer rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferRule' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/loads/{id}:release:
    post:
      operationId: releaseLoad
      summary: Release a load for tendering; workflow-ts starts the tender cascade (FR-34.5)
      description: |
        Takes the tender start's body and checks it the same way, then
        publishes `dev.passage.tms.load.released.v1`, from which workflow-ts
        starts `tenderWorkflow`; the cascade itself starts asynchronously
        (#426). Who released the load (`releasedBy`) and the legal entities it
        is released in (`legalEntityScope`) are the verified caller, never
        body fields: the workflow's scoped service token is minted from them.
        The caller needs an explicit legal-entity scope that lists the load's
        legal entity (a load outside it is 404 TMS-0100). The tender start's
        gates refuse the release and publish nothing: an ACCEPTED tender or a
        PENDING tender inside its deadline (409 TMS-0114), a FAILed DG check
        (422 TMS-0130), an OPEN screening hold (422 TMS-0133).
      x-passage-duty: transport.load.tender
      parameters:
        - name: id
          in: path
          required: true
          description: Load id
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenderRequest' }
      responses:
        '202':
          description: Load released (or the replayed release for a repeated Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoadRelease' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/transport/loads/{id}:tender:
    post:
      operationId: startTender
      summary: Start a tender cascade for a load (FR-34.5, BR-34.3)
      description: |
        Sends the load to the first carrier in route-guide rank order; each
        carrier has `timeoutMin` (default 120, 5 to 1,440) to respond. A load
        with an ACCEPTED tender, or a PENDING tender still inside its deadline,
        is refused with TMS-0114; a PENDING tender past its deadline is
        cascaded first and no longer blocks once it has failed. A load whose
        latest dangerous-goods check is FAIL is refused with 422 TMS-0130 and no
        tender is sent (AC-34.13); so is a load with an OPEN screening hold, with
        422 TMS-0133 (BR-34.17, AC-34.16).
      x-passage-duty: transport.load.tender
      parameters:
        - name: id
          in: path
          required: true
          description: Load id
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenderRequest' }
      responses:
        '201':
          description: Tender started (or the replayed tender for a repeated Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tender' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/transport/tenders:
    get:
      operationId: listTenders
      summary: List tenders, newest first (at most 500); the tender board
      x-passage-duty: transport.load.tender
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, ACCEPTED, TENDER_FAILED] }
        - name: loadId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tenders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Tender' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/tenders:expire:
    post:
      operationId: expireTenders
      summary: Cascade every overdue tender of the tenant (expiry sweep)
      description: |
        Expires each pending attempt whose deadline has passed, offers the load
        to the next carrier or fails the tender with a planner task (TMS-0106)
        after the last one, and publishes one tender.expired event per expired
        attempt. At most 500 tenders per call. Only tenders in the caller's legal
        entities expire, so the sweep must run as an all-entity principal. A Temporal TenderWorkflow timer
        will drive the same rule; until then a scheduler or the tender board calls this.
      x-passage-duty: transport.load.tender
      responses:
        '200':
          description: The tenders the sweep advanced
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Tender' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/tenders/{id}:
    get:
      operationId: getTender
      summary: Get a tender with its cascade attempts
      x-passage-duty: transport.load.tender
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tender as stored; `overdue` is true when the pending attempt is past its deadline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tender' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/tenders/{id}:respond:
    post:
      operationId: respondTender
      summary: Carrier accepts or declines a tender
      description: |
        Deadlines that have passed are cascaded first. A response after the
        carrier's deadline is 409 TMS-0105 (the cascade it uncovered is still
        saved); a carrier the tender is not waiting on is 409 TMS-0113. A
        decline offers the load to the next carrier. The same carrier repeating
        its last response gets the tender back unchanged (natural idempotency).
      x-passage-duty: transport.tender.respond
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrierId, accept]
              properties:
                carrierId: { type: string, format: uuid }
                accept: { type: boolean, description: true to accept, false to decline }
      responses:
        '200':
          description: The tender after the response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tender' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/transport/tracking-events:
    post:
      operationId: ingestTrackingEvent
      summary: Ingest one shipment status report (EDI 214, carrier API, telematics, driver)
      description: |
        Source and ref are the idempotency key: the same report again is 200 with
        `Idempotent-Replayed: true`; a different report under the same source and
        ref is 422 idempotency_key_reuse. Supported codes: X3 arrived at pickup,
        AF departed with the freight, X1 arrived at delivery, D1 delivered.
      x-passage-duty: transport.tracking-event.ingest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackingEventRequest' }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingEvent' }
        '200':
          description: Replay of a stored report
          headers:
            Idempotent-Replayed: { schema: { type: string, const: 'true' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingEvent' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listTrackingEvents
      summary: Tracking events; with loadId that load's events in occurred_at order, else the newest 500 received
      x-passage-duty: transport.view
      parameters:
        - name: loadId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tracking events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TrackingEvent' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/loads/{id}/tracking:
    get:
      operationId: getLoadTracking
      summary: Tracking timeline of a load with the projected stop states (BR-34.9)
      x-passage-duty: transport.view
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Events in occurred_at order and one state per reported stop
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoadTracking' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/voyages:
    post:
      operationId: createVoyage
      summary: Create a landed-cost voyage with legs, containers, folios, cost lines and receipt lines
      description: |
        Container numbers are checked with the ISO 6346 check digit (BR-34.12);
        a failure is 422 TMS-0124 with the container in `errors`. The voyage
        starts ESTIMATED; status and allocations sent by the client are ignored.
      x-passage-duty: transport.landed-cost.maintain
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoyageRequest' }
      responses:
        '201':
          description: Created (or the replayed voyage for a repeated Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voyage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listVoyages
      summary: List voyages, newest first (at most 500), without their documents
      x-passage-duty: transport.landed-cost.maintain
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ESTIMATED, POSTED] }
      responses:
        '200':
          description: Voyages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/VoyageSummary' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/voyages/{id}:
    get:
      operationId: getVoyage
      summary: Get a voyage with its documents and, once posted, its allocations
      x-passage-duty: transport.landed-cost.maintain
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Voyage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voyage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/landed-cost/voyages/{id}:allocate:
    post:
      operationId: allocateVoyage
      summary: Allocate the voyage's landed cost to its receipt lines and post it (FR-34.9, BR-34.6)
      description: |
        Each cost line is split by its method with shares rounded to cents and
        the residual on the highest-value receipt line (TMS-0110), so the
        allocations sum to the cost total exactly. Publishes
        dev.passage.tms.landedcost.posted.v1. A POSTED voyage is returned
        unchanged with 200, so a retry is safe.
      x-passage-duty: transport.landed-cost.maintain
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The posted voyage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voyage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/transport/goods-in-transit:
    post:
      operationId: createGoodsInTransit
      summary: Open a goods-in-transit order for receipt lines of a voyage (FR-34.12, BR-34.11)
      description: |
        Only the origin Incoterms 2020 rules (EXW, FCA, FAS, FOB, CFR, CIF, CPT,
        CIP) open an order; DAP, DPU and DDP transfer at destination receipt and
        are 422 TMS-0120. The voyage must be ESTIMATED (409 TMS-0119). An empty
        `receiptLines` takes every line of the voyage; a line that is not on
        the voyage is 422 TMS-0119 with `errors.receiptLines`, and a line
        already on another order is 409 TMS-0119. Each line carries its share
        of every voyage cost line as allocated under BR-34.6.
      x-passage-duty: transport.landed-cost.maintain
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoodsInTransitRequest' }
      responses:
        '201':
          description: Created PENDING (or the replayed order for a repeated Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsInTransit' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listGoodsInTransit
      summary: List goods-in-transit orders, newest first (at most 500)
      x-passage-duty: transport.landed-cost.maintain
      parameters:
        - name: voyageId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, IN_TRANSIT] }
      responses:
        '200':
          description: Goods-in-transit orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GoodsInTransit' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/goods-in-transit/{id}:
    get:
      operationId: getGoodsInTransit
      summary: Get a goods-in-transit order
      x-passage-duty: transport.landed-cost.maintain
      parameters:
        - $ref: '#/components/parameters/GoodsInTransitId'
      responses:
        '200':
          description: Goods-in-transit order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsInTransit' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/goods-in-transit/{id}:ship:
    post:
      operationId: shipGoodsInTransit
      summary: Post goods in transit at the transfer event (BR-34.11, TMS-0121)
      description: |
        Moves a PENDING order to IN_TRANSIT: ownership of its receipt lines
        moves to the in-transit warehouse and
        dev.passage.tms.goodsintransit.shipped.v1 is published with the goods
        value and the estimated landed cost. `shippedAt` is the departure the
        forwarder reported (default now; not in the future). An order already
        IN_TRANSIT is returned unchanged with 200 and nothing is published, so
        a retry is safe.
      x-passage-duty: transport.landed-cost.maintain
      parameters:
        - $ref: '#/components/parameters/GoodsInTransitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shippedAt: { type: string, format: date-time }
      responses:
        '200':
          description: The shipped order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsInTransit' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/gate/check-in:
    post:
      operationId: gateCheckIn
      summary: Check a driver and trailer in at the gate (FR-34.14, BR-34.14)
      description: |
        `appointmentId` and `scheduledAt` come together from the dock
        appointment; the arrival is ON_TIME within `toleranceMin` (default 60)
        either side, otherwise EARLY or LATE with TMS-0127. Without an
        appointment the visit is a walk-in (walk_in_allowed defaults to true;
        TMS-0128 when a site refuses walk-ins). `arrivedAt` defaults to now
        and may be earlier for a paper fallback entered later. A trailer
        already in the site's yard is 409 TMS-0118. Writes the CHECK_IN row of
        the gate log and publishes dev.passage.tms.gate.checkedin.v1.
      x-passage-duty: transport.gate.operate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GateCheckInRequest' }
      responses:
        '201':
          description: The visit, IN_YARD (or the replayed visit for a repeated Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateVisit' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/transport/gate/check-out:
    post:
      operationId: gateCheckOut
      summary: Check a visit out with seal verification and detention (BR-34.13, BR-34.14)
      description: |
        When a seal is recorded on the visit (at check-in or load
        confirmation) the declared `sealNo` must equal it; an OUTBOUND visit
        with no recorded seal has no confirmed load. Both are 422 TMS-0129 and
        the attempt is kept in the gate log as CHECK_OUT_BLOCKED (AC-34.12).
        Detention = ceil((dwell − free time) ÷ 60) × `hourlyRate`
        (TMS-0126 when it accrues, AC-34.11). A visit already checked out is
        409 TMS-0118, unless the request repeats the check-out's
        Idempotency-Key and body, which returns the visit.
      x-passage-duty: transport.gate.operate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitId]
              properties:
                visitId: { type: string, format: uuid }
                sealNo: { type: string, maxLength: 20, description: Seal the driver declares }
                checkOutAt: { type: string, format: date-time, description: Default now; not before check-in or in the future }
                hourlyRate: { type: string, description: The carrier's hourly detention rate; default 0 }
      responses:
        '200':
          description: The visit, CHECKED_OUT, with its detention
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateVisit' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/transport/gate/visits:
    get:
      operationId: listGateVisits
      summary: Gate log, newest check-in first (at most 500)
      x-passage-duty: transport.gate.operate
      parameters:
        - name: siteId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [IN_YARD, CHECKED_OUT] }
        - name: carrierScac
          in: query
          schema: { type: string }
        - name: date
          in: query
          description: UTC check-in day
          schema: { type: string, format: date }
      responses:
        '200':
          description: Gate visits
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GateVisit' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/gate/visits/{id}:
    get:
      operationId: getGateVisit
      summary: A gate visit with its append-only gate log
      x-passage-duty: transport.gate.operate
      parameters:
        - $ref: '#/components/parameters/VisitId'
      responses:
        '200':
          description: Visit and gate log in the order written
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GateVisit'
                  - type: object
                    required: [log]
                    properties:
                      log: { type: array, items: { $ref: '#/components/schemas/GateLogEntry' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/gate/visits/{id}:seal:
    post:
      operationId: recordGateSeal
      summary: Record the seal applied at load confirmation (BR-34.14)
      description: |
        Allowed while the visit is IN_YARD (409 TMS-0118 after check-out). A
        later seal replaces an earlier one; the gate log keeps each as SEALED.
      x-passage-duty: transport.gate.operate
      parameters:
        - $ref: '#/components/parameters/VisitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sealNo]
              properties:
                sealNo: { type: string, minLength: 1, maxLength: 20 }
      responses:
        '200':
          description: The visit with its recorded seal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateVisit' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/transport/screening-holds:
    get:
      operationId: listScreeningHolds
      summary: Screening holds inquiry, newest first (§6.34.14)
      x-passage-duty: transport.view
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, RELEASED] }
        - name: loadId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: At most 500 holds
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ScreeningHold' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/screening-holds/{id}:
    get:
      operationId: getScreeningHold
      summary: One screening hold with its party results and release
      x-passage-duty: transport.view
      parameters:
        - $ref: '#/components/parameters/HoldId'
      responses:
        '200':
          description: The hold
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningHold' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/screening-holds/{id}:release:
    post:
      operationId: releaseScreeningHold
      summary: Release a POTENTIAL_MATCH or SCREENING_PENDING hold (BR-34.17, AC-34.16)
      description: |
        The reason (1 to 500 characters) and the calling user are kept on the
        hold, which is the release log. A hold with a BLOCKED party stays until
        the screening list changes: 422 TMS-0133. A hold already released by
        another user or for another reason is 409 TMS-0122; the same release
        again returns the hold unchanged. Tendering proceeds once no hold is
        OPEN.
      x-passage-duty: transport.screening-hold.release
      parameters:
        - $ref: '#/components/parameters/HoldId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: The released hold
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningHold' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/transport/routes:optimize:
    post:
      operationId: optimizeRoutes
      summary: Plan multi-stop routes with the OR-Tools VRP (FR-34.2, BR-34.1)
      description: |
        Validates and normalizes the request, then calls the optimizer in
        services/routing-py. The SHA-256 of the normalized request is the
        idempotency key: the same request returns the stored plan with 200 and
        `replayed: true` instead of solving again. Infeasible stops are dropped
        and reported in `solution.dropped` with warning TMS-0104, never
        silently. An optimizer that is not configured, fails, or answers with a
        reply that loses a stop is 503 TMS-0123 and nothing is stored. The call
        is synchronous, so `timeLimitS` is 5 to 25 (default 20).
      x-passage-duty: transport.load.plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteRequest' }
      responses:
        '201':
          description: Solved and stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutePlan' }
        '200':
          description: The plan stored for the same request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutePlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/transport/routes:
    get:
      operationId: listRoutePlans
      summary: Route plans, newest first, without their request and routes
      x-passage-duty: transport.load.plan
      responses:
        '200':
          description: At most 500 plans
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RoutePlanSummary' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/transport/routes/{id}:
    get:
      operationId: getRoutePlan
      summary: One route plan with its request and routes
      x-passage-duty: transport.load.plan
      parameters:
        - name: id
          in: path
          required: true
          description: Route plan id
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutePlan' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/transport/load-plans:stack:
    post:
      operationId: stackLoadPlan
      summary: Layer-based load plan for a trailer or container (FR-34.18)
      description: |
        First-fit decreasing by footprint with layers in services/routing-py.
        No pallet is stacked on a non-stackable one (AC-34.18), a pallet for an
        earlier stop never sits under one for a later stop, later stops load
        first at the nose, and the plan reports the floor positions used and an
        axle-weight estimate. Pallets that do not fit are listed in `unplaced`.
        The plan is returned, not stored. A reply that loses a pallet or stacks
        on a non-stackable one is 503 TMS-0123.
      x-passage-duty: transport.load.plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoadPlanRequest' }
      responses:
        '200':
          description: The load plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoadPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    HoldId:
      name: id
      in: path
      required: true
      description: Screening hold id
      schema: { type: string, format: uuid }
    GoodsInTransitId:
      name: id
      in: path
      required: true
      description: Goods-in-transit order id
      schema: { type: string, format: uuid }
    VisitId:
      name: id
      in: path
      required: true
      description: Gate visit id
      schema: { type: string, format: uuid }
    BillId:
      name: id
      in: path
      required: true
      description: Freight bill id
      schema: { type: string, format: uuid }
    LoadId:
      name: id
      in: path
      required: true
      description: Load id
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version the client read, such as "2" (the ETag of the freight bill).
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Stored with the record the command creates, with a fingerprint of the
        method, path and body. A repeat with the same body returns that record;
        a repeat with a different body is 422 idempotency_key_reuse.
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Capacity:
      type: object
      required: [maxWeightKg, maxVolumeM3, maxPallets]
      properties:
        maxWeightKg: { type: string, description: Decimal string greater than zero }
        maxVolumeM3: { type: string, description: Decimal string greater than zero }
        maxPallets: { type: integer, minimum: 1 }
    LoadShipment:
      type: object
      required: [id, shipFromSiteId, shipToRegion, mode, pickupDate, weightKg, volumeM3, pallets]
      properties:
        id: { type: string, format: uuid, description: Shipment id }
        shipFromSiteId: { type: string, format: uuid }
        shipToRegion: { type: string, minLength: 1, maxLength: 20 }
        mode: { type: string, enum: [TL, LTL, PARCEL, INTERMODAL] }
        pickupDate: { type: string, format: date }
        weightKg: { type: string }
        volumeM3: { type: string }
        pallets: { type: integer, minimum: 0 }
    LoadBuildRequest:
      type: object
      required: [capacity, shipments]
      properties:
        legalEntityId: { type: string, format: uuid, description: "Owning legal entity of the loads. Defaults to the caller's single legal entity; required (422) for a caller scoped to several or to all legal entities; 403 outside the caller's scope." }
        capacity: { $ref: '#/components/schemas/Capacity' }
        shipments:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/LoadShipment' }
    Load:
      type: object
      required: [id, mode, status, shipFromSiteId, shipToRegion, pickupDate, totalWeightKg, totalVolumeM3, pallets, capacity, shipmentIds, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        mode: { type: string, enum: [TL, LTL, PARCEL, INTERMODAL] }
        status: { type: string, enum: [PLANNED, RATED, TENDERED, ACCEPTED, DISPATCHED, IN_TRANSIT, DELIVERED, CLOSED, CANCELLED] }
        shipFromSiteId: { type: string, format: uuid }
        shipToRegion: { type: string }
        pickupDate: { type: string, format: date }
        totalWeightKg: { type: string }
        totalVolumeM3: { type: string }
        pallets: { type: integer }
        capacity: { $ref: '#/components/schemas/Capacity' }
        shipmentIds: { type: array, items: { type: string, format: uuid } }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    LoadDetail:
      allOf:
        - $ref: '#/components/schemas/Load'
        - type: object
          required: [dgChecks]
          properties:
            dgChecks: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/DGCheck' } }
    DGLine:
      type: object
      required: [unNumber, properShippingName, class, quantity, transportCategory]
      properties:
        unNumber: { type: string, pattern: '^UN[0-9]{4}$' }
        properShippingName: { type: string, minLength: 1, maxLength: 200 }
        class: { type: string, description: Hazard class or division, with a compatibility group for class 1 (3, 2.1, 1.1D) }
        packingGroup: { type: string, enum: ['', I, II, III] }
        quantity: { type: string, description: Litres or kilograms as ADR 1.1.3.6 counts them; decimal string greater than zero }
        transportCategory: { type: integer, minimum: 0, maximum: 4, description: ADR transport category }
        limitedQuantity: { type: boolean }
    DGRequest:
      type: object
      required: [regulation, lines]
      properties:
        regulation: { type: string, enum: [ADR, 49CFR] }
        emergencyResponsePhone: { type: string, description: E.164 number; required before a regulated DG shipment }
        lines: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/DGLine' } }
    DGFinding:
      type: object
      required: [ruleId, severity, detail]
      properties:
        ruleId: { type: string, enum: [49CFR-177.848, ADR-7.5.2, ADR-1.1.3.6, ADR-1.1.3.6-CAT0, LQ-MARKING, DG-EMERGENCY-PHONE] }
        severity: { type: string, enum: [WARN, FAIL] }
        code: { type: string, enum: [TMS-0130, TMS-0131] }
        detail: { type: string }
    PaperLine:
      type: object
      required: [unNumber, properShippingName, class, quantity, limitedQuantity]
      properties:
        unNumber: { type: string }
        properShippingName: { type: string }
        class: { type: string }
        packingGroup: { type: string }
        quantity: { type: string }
        limitedQuantity: { type: boolean }
        emergencyResponsePhone: { type: string }
    DGCheck:
      type: object
      required: [id, loadId, regulation, result, adrPoints, findings, shippingPapers, checkedBy, checkedAt]
      properties:
        id: { type: string, format: uuid }
        loadId: { type: string, format: uuid }
        regulation: { type: string, enum: [ADR, 49CFR] }
        result: { type: string, enum: [PASS, WARN, FAIL] }
        adrPoints: { type: string, description: ADR 1.1.3.6 points; zero under 49CFR }
        findings: { type: array, items: { $ref: '#/components/schemas/DGFinding' } }
        shippingPapers: { type: array, items: { $ref: '#/components/schemas/PaperLine' } }
        checkedBy: { type: string }
        checkedAt: { type: string, format: date-time }
    ScreeningParty:
      type: object
      required: [role, name]
      properties:
        role: { type: string, enum: [SOLD_TO, SHIP_TO, CONSIGNEE, FORWARDER, CARRIER] }
        name: { type: string, minLength: 1, maxLength: 200 }
        country: { type: string, description: ISO 3166-1 alpha-2 }
    ScreenRequest:
      type: object
      required: [parties]
      properties:
        crossBorder: { type: boolean }
        parties: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/ScreeningParty' } }
    ScreeningDecision:
      type: object
      required: [loadId, crossBorder, decision, parties]
      properties:
        loadId: { type: string, format: uuid }
        crossBorder: { type: boolean }
        decision: { type: string, enum: [CLEAR, WARN, HOLD] }
        holdId: { type: string, format: uuid, description: The screening hold a HOLD decision opened or refreshed }
        parties:
          type: array
          items:
            type: object
            required: [role, name, status]
            properties:
              role: { type: string }
              name: { type: string }
              status: { type: string, enum: [CLEAR, POTENTIAL_MATCH, BLOCKED, SCREENING_PENDING, NOT_SCREENED] }
              code: { type: string, enum: [TMS-0133, TMS-0134] }
    TransferRule:
      type: object
      required: [incoterm, event, goodsInTransit]
      properties:
        incoterm: { type: string, enum: [EXW, FCA, FAS, FOB, CFR, CIF, CPT, CIP, DAP, DPU, DDP] }
        event: { type: string, enum: [ORIGIN_SHIPMENT, DESTINATION_RECEIPT] }
        goodsInTransit: { type: boolean }
        code: { type: string, enum: [TMS-0121] }
    DecisionRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500, description: Required for a dispute and for approving a VARIANCE or DISPUTED bill }
    Decision:
      type: object
      required: [id, freightBillId, action, fromStatus, toStatus, decidedBy, decidedAt]
      properties:
        id: { type: string, format: uuid }
        freightBillId: { type: string, format: uuid }
        action: { type: string, enum: [APPROVE, DISPUTE] }
        fromStatus: { type: string, enum: [MATCHED, VARIANCE, DISPUTED] }
        toStatus: { type: string, enum: [DISPUTED, APPROVED] }
        reason: { type: string }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: Stable error code }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    Line:
      description: One charge; the amount is in the document currency.
      type: object
      required: [chargeCode, amount]
      additionalProperties: false
      properties:
        chargeCode: { type: string, maxLength: 20 }
        amount: { type: string, description: Decimal string, pattern: '^[0-9]+(\.[0-9]+)?$' }
    RateRow:
      type: object
      required: [origin, destination, breakFrom, rate, unit]
      properties:
        origin: { type: string, description: Zone or lane origin; * matches any }
        destination: { type: string, description: Zone or lane destination; * matches any }
        breakFrom: { type: string, description: Decimal lower bound of the break band }
        breakTo: { type: [string, 'null'], description: Decimal upper bound, exclusive }
        rate: { type: string, description: Decimal rate per unit }
        unit: { type: string, enum: [KG, PALLET, CONTAINER, SHIPMENT, KM, MILE], description: 'Quantity priced: chargeable kg, pallets, one container or shipment, or the shipment distance in km or miles' }
    Accessorial:
      type: object
      required: [code]
      properties:
        code: { type: string }
        flat: { type: string, description: Decimal flat amount }
        pct: { type: string, description: Percent of base charge; a non-zero pct wins over flat }
    RateCardRequest:
      type: object
      required: [carrierId, serviceId, basis, currency, validFrom, rows]
      properties:
        carrierId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        basis:
          type: string
          enum: [LANE, ZONE, DISTANCE, WEIGHT_BREAK, PER_PALLET, PER_CONTAINER, FLAT]
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
        minimumCharge: { type: string }
        dimDivisor: { type: integer, minimum: 1, description: 'Dimensional divisor in cm³ per kg; 0 or absent means 5000' }
        fuelPct: { type: string, description: Fuel surcharge percent of base }
        rows: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RateRow' } }
        accessorials: { type: array, items: { $ref: '#/components/schemas/Accessorial' } }
    RateCard:
      allOf:
        - $ref: '#/components/schemas/RateCardRequest'
        - type: object
          required: [id, minimumCharge, dimDivisor, fuelPct, accessorials]
          properties:
            id: { type: string, format: uuid }
    RateRequest:
      type: object
      required: [originZone, destinationZone, shipDate]
      properties:
        originZone: { type: string, maxLength: 20 }
        destinationZone: { type: string, maxLength: 20 }
        weightKg: { type: string }
        volumeM3: { type: string }
        pallets: { type: integer, minimum: 0 }
        distanceKm: { type: string, description: Decimal distance; prices KM and MILE rows }
        shipDate: { type: string, format: date }
        accessorialCodes: { type: array, items: { type: string, maxLength: 20 } }
    Quote:
      type: object
      required: [carrierId, serviceId, currency, status, total, charges, trace]
      properties:
        carrierId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { type: string, enum: [OK, NO_VALID_RATE_CARD, NO_LANE_RATE] }
        total: { type: string, description: Decimal sum of rounded charges }
        charges:
          type: array
          items:
            type: object
            required: [code, amount]
            properties:
              code: { type: string, description: 'BASE, ACC:<code> or FUEL' }
              amount: { type: string, description: Decimal rounded half-up to cents }
        trace:
          type: array
          description: Explain trace, one entry per rating step with its inputs
          items:
            type: object
            required: [step, input, amount]
            properties:
              step: { type: string }
              input: { type: string }
              amount: { type: string }
    RateResponse:
      type: object
      required: [shipmentId, options]
      properties:
        shipmentId: { type: string, format: uuid }
        options: { type: array, items: { $ref: '#/components/schemas/Quote' } }
        chosen: { $ref: '#/components/schemas/Quote' }
    FreightBillRequest:
      type: object
      required: [loadId, carrierId, currency, expectedLines]
      properties:
        loadId: { type: string, format: uuid, description: The load the bill is for; it must be visible to the caller (404 otherwise) and the bill inherits its legal entity }
        legalEntityId: { type: string, format: uuid, description: "Assertion only: 422 when it differs from the load's legal entity." }
        carrierId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        expectedLines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Line' }
    FreightBill:
      type: object
      required: [id, loadId, carrierId, currency, expectedLines, expectedTotal, matchStatus, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        loadId: { type: string, format: uuid }
        carrierId: { type: string, format: uuid }
        currency: { type: string }
        expectedLines: { type: array, items: { $ref: '#/components/schemas/Line' } }
        expectedTotal: { type: string }
        matchStatus:
          type: string
          enum: [UNMATCHED, MATCHED, VARIANCE, DISPUTED, APPROVED, SETTLED]
        carrierInvoiceId: { type: string, format: uuid }
        varianceTotal: { type: string, description: Invoiced minus expected, once matched }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    FreightBillDetail:
      allOf:
        - $ref: '#/components/schemas/FreightBill'
        - type: object
          properties:
            carrierInvoice: { $ref: '#/components/schemas/CarrierInvoice' }
            match: { $ref: '#/components/schemas/MatchResult' }
            decisions: { type: array, items: { $ref: '#/components/schemas/Decision' } }
    MatchResult:
      type: object
      required: [status, lines, varianceTotal]
      properties:
        status: { type: string, enum: [MATCHED, VARIANCE] }
        varianceTotal: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [chargeCode, expected, invoiced, variance, allowed, within]
            properties:
              chargeCode: { type: string }
              expected: { type: string }
              invoiced: { type: string }
              variance: { type: string, description: Invoiced minus expected }
              allowed: { type: string, description: 'The smaller of $5.00 and 2 % of the expected charge' }
              within: { type: boolean }
    CarrierInvoiceRequest:
      type: object
      required: [carrierId, invoiceNo, invoiceDate, source, currency, lines]
      properties:
        carrierId: { type: string, format: uuid }
        invoiceNo: { type: string, minLength: 1, maxLength: 40 }
        invoiceDate: { type: string, format: date }
        source: { type: string, enum: [EDI210, MANUAL, API] }
        freightBillId: { type: string, format: uuid, description: The bill to match; absent makes the invoice UNEXPECTED_INVOICE. A matched invoice inherits the bill's legal entity }
        legalEntityId: { type: string, format: uuid, description: "Owning legal entity of an invoice without a bill; same rules as on a load build. Assertion only when freightBillId is present." }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Line' }
    CarrierInvoice:
      allOf:
        - $ref: '#/components/schemas/CarrierInvoiceRequest'
        - type: object
          required: [id, total, matchStatus, createdAt]
          properties:
            id: { type: string, format: uuid }
            total: { type: string, description: Decimal sum of invoice lines }
            matchStatus: { type: string, enum: [MATCHED, VARIANCE, UNEXPECTED_INVOICE] }
            varianceTotal: { type: string }
            createdAt: { type: string, format: date-time }
    InvoiceResponse:
      type: object
      required: [invoice]
      properties:
        invoice: { $ref: '#/components/schemas/CarrierInvoice' }
        freightBill: { $ref: '#/components/schemas/FreightBill' }
    TenderRequest:
      type: object
      required: [carriers]
      properties:
        carriers:
          type: array
          minItems: 1
          maxItems: 20
          description: Route-guide carriers in rank order, each listed once
          items:
            type: object
            required: [carrierId]
            properties:
              carrierId: { type: string, format: uuid }
              rateQuoted: { type: string, description: 'Decimal rate offered, at most two decimals' }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Required with quoted rates, not allowed without }
        timeoutMin: { type: integer, minimum: 5, maximum: 1440, default: 120 }
    LoadRelease:
      type: object
      required: [id, loadId, legalEntityId, carriers, timeoutMin, releasedBy, legalEntityScope, releasedAt]
      properties:
        id: { type: string, format: uuid }
        loadId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        carriers:
          type: array
          items:
            type: object
            required: [carrierId]
            properties:
              carrierId: { type: string, format: uuid }
              rateQuoted: { type: string, description: Two decimals; absent when none was quoted }
        currency: { type: string }
        timeoutMin: { type: integer }
        releasedBy: { type: string, description: The verified caller }
        legalEntityScope: { type: array, items: { type: string, format: uuid }, description: The verified caller's legal entities }
        releasedAt: { type: string, format: date-time }
    TenderAttempt:
      type: object
      required: [rank, carrierId, sentAt, expiresAt, response]
      properties:
        rank: { type: integer, minimum: 1 }
        carrierId: { type: string, format: uuid }
        sentAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        response: { type: string, enum: [PENDING, ACCEPTED, DECLINED, EXPIRED] }
        rateQuoted: { type: string }
    Tender:
      type: object
      required: [id, loadId, status, carriers, timeoutMin, attempts, plannerTask, overdue, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        loadId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACCEPTED, TENDER_FAILED] }
        carriers: { type: array, items: { type: string, format: uuid } }
        currency: { type: string }
        timeoutMin: { type: integer }
        attempts: { type: array, items: { $ref: '#/components/schemas/TenderAttempt' } }
        acceptedCarrierId: { type: string, format: uuid }
        plannerTask: { type: boolean, description: True once every carrier declined or timed out (TMS-0106) }
        pendingCarrierId: { type: string, format: uuid }
        pendingExpiresAt: { type: string, format: date-time }
        overdue: { type: boolean, description: The pending attempt is past its deadline and waits for the sweep }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    TrackingEventRequest:
      type: object
      required: [loadId, stopNo, code, occurredAt, source, ref]
      properties:
        loadId: { type: string, format: uuid }
        stopNo: { type: integer, minimum: 1, maximum: 999 }
        code: { type: string, enum: [X3, AF, X1, D1], description: EDI 214 shipment status code }
        occurredAt: { type: string, format: date-time, description: RFC 3339 with a zone; at most a day ahead }
        location: { type: string, maxLength: 100 }
        source: { type: string, enum: [EDI214, API, TELEMATICS, DRIVER] }
        ref: { type: string, minLength: 1, maxLength: 64, description: The sender's reference; with source the idempotency key }
    TrackingEvent:
      allOf:
        - $ref: '#/components/schemas/TrackingEventRequest'
        - type: object
          required: [id, receivedAt]
          properties:
            id: { type: string, format: uuid }
            receivedAt: { type: string, format: date-time }
    StopState:
      type: object
      required: [stopNo, status, pickupInferred]
      properties:
        stopNo: { type: integer }
        status: { type: string, enum: [PENDING, ARRIVED, PICKED_UP, DELIVERED] }
        arrivedAt: { type: string, format: date-time }
        pickedUpAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time }
        pickupInferred: { type: boolean, description: A delivery arrived with no earlier pickup; pickedUpAt is the delivery time (BR-34.9) }
    LoadTracking:
      type: object
      required: [loadId, events, stops]
      properties:
        loadId: { type: string, format: uuid }
        events: { type: array, items: { $ref: '#/components/schemas/TrackingEvent' } }
        stops: { type: array, items: { $ref: '#/components/schemas/StopState' } }
    VoyageRequest:
      type: object
      required: [reference, currency, legs, costLines, receiptLines]
      properties:
        legalEntityId: { type: string, format: uuid, description: "Owning legal entity of the voyage and its legs, containers, folios, cost lines and receipt lines. Defaults to the caller's single legal entity; required (422) for a caller scoped to several or to all legal entities; 403 outside the caller's scope." }
        reference: { type: string, minLength: 1, maxLength: 40 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        legs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [from, to, mode]
            properties:
              seq: { type: integer, description: Assigned by the server in the order given }
              from: { type: string, maxLength: 40 }
              to: { type: string, maxLength: 40 }
              mode: { type: string, enum: [OCEAN, AIR, ROAD, RAIL] }
        containers:
          type: array
          maxItems: 200
          items:
            type: object
            required: [number, type]
            properties:
              number: { type: string, description: ISO 6346 number with check digit, such as CSQU3054383 }
              type: { type: string, enum: [20GP, 40GP, 40HC, 45HC, REEFER] }
              seal: { type: string, maxLength: 40 }
        folios:
          type: array
          maxItems: 100
          items:
            type: object
            required: [folioNo, forwarder]
            properties:
              folioNo: { type: string, maxLength: 40 }
              forwarder: { type: string, maxLength: 40, description: Vendor or forwarder }
              containers: { type: array, items: { type: string }, description: Container numbers on this voyage }
        costLines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/VoyageCostLine' }
        receiptLines:
          type: array
          minItems: 1
          maxItems: 3000
          items:
            type: object
            required: [line]
            properties:
              line: { type: integer, minimum: 1 }
              value: { type: string, description: Decimal receipt value; decides the residual line }
              weight: { type: string }
              volume: { type: string }
              quantity: { type: string }
    VoyageCostLine:
      type: object
      required: [costType, amount, allocationMethod]
      properties:
        costType: { type: string, maxLength: 20, description: Such as FREIGHT, DUTY, BROKERAGE, INSURANCE }
        amount: { type: string, description: Decimal, at most two decimals }
        allocationMethod: { type: string, enum: [WEIGHT, VOLUME, VALUE, QUANTITY, EQUAL] }
    Allocation:
      type: object
      required: [line, amount]
      properties:
        line: { type: integer }
        amount: { type: string }
    Voyage:
      allOf:
        - $ref: '#/components/schemas/VoyageRequest'
        - type: object
          required: [id, status, costAllocations, allocations, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [ESTIMATED, POSTED] }
            costAllocations:
              type: array
              description: One entry per cost line once posted; shares sum to the amount to the cent
              items:
                type: object
                required: [costType, allocationMethod, amount, shares, residual, residualLine]
                properties:
                  costType: { type: string }
                  allocationMethod: { type: string }
                  amount: { type: string }
                  shares: { type: array, items: { $ref: '#/components/schemas/Allocation' } }
                  residual: { type: string, description: Rounding residual (TMS-0110) }
                  residualLine: { type: integer }
            allocations:
              type: array
              description: Landed cost per receipt line once posted; sums to the cost total
              items: { $ref: '#/components/schemas/Allocation' }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
            postedAt: { type: string, format: date-time }
    VoyageSummary:
      type: object
      required: [id, reference, currency, status, costTotal, containers, receiptLines, createdAt]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        currency: { type: string }
        status: { type: string, enum: [ESTIMATED, POSTED] }
        costTotal: { type: string }
        containers: { type: integer }
        receiptLines: { type: integer }
        createdAt: { type: string, format: date-time }
        postedAt: { type: string, format: date-time }
    GoodsInTransitRequest:
      type: object
      required: [voyageId, incoterm, siteId]
      properties:
        voyageId: { type: string, format: uuid }
        incoterm: { type: string, description: Incoterms 2020 rule; only EXW, FCA, FAS, FOB, CFR, CIF, CPT and CIP open an order }
        siteId: { type: string, format: uuid, description: 'Destination site; the in-transit warehouse is TRANSIT-{site}' }
        receiptLines: { type: array, items: { type: integer, minimum: 1 }, maxItems: 3000, description: Voyage receipt lines, each once; empty means every line }
        legalEntityId: { type: string, format: uuid, description: "Owning legal entity of the order; same rules as on a load build." }
    GoodsInTransit:
      type: object
      required: [id, voyageId, voyageReference, siteId, incoterm, transferEvent, inTransitWarehouse, currency, status, lines, goodsValue, estimatedTotal, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        voyageId: { type: string, format: uuid }
        voyageReference: { type: string }
        siteId: { type: string, format: uuid }
        incoterm: { type: string }
        transferEvent: { type: string, const: ORIGIN_SHIPMENT }
        inTransitWarehouse: { type: string }
        currency: { type: string }
        status: { type: string, enum: [PENDING, IN_TRANSIT] }
        lines:
          type: array
          items:
            type: object
            required: [line, value, quantity, costs, estimated]
            properties:
              line: { type: integer }
              value: { type: string }
              quantity: { type: string }
              costs:
                type: array
                items:
                  type: object
                  required: [costType, amount]
                  properties:
                    costType: { type: string }
                    amount: { type: string }
              estimated: { type: string, description: Sum of costs.amount }
        goodsValue: { type: string }
        estimatedTotal: { type: string, description: Sum of lines.estimated }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        shippedAt: { type: string, format: date-time }
        code: { type: string, description: TMS-0121 once ownership has moved }
    GateCheckInRequest:
      type: object
      required: [siteId, direction, carrierScac, trailerNo, driverName, driverLicenseId]
      properties:
        siteId: { type: string, format: uuid }
        direction: { type: string, enum: [INBOUND, OUTBOUND] }
        loadId: { type: string, format: uuid, description: When present the load must be visible to the caller (404 otherwise) and the visit inherits its legal entity }
        legalEntityId: { type: string, format: uuid, description: "Owning legal entity of a visit without a load; assertion only when loadId is present." }
        carrierScac: { type: string, pattern: '^[A-Za-z]{2,4}$' }
        trailerNo: { type: string, minLength: 1, maxLength: 20, description: Trailer or container number }
        sealNo: { type: string, maxLength: 20, description: Seal of an inbound sealed trailer }
        driverName: { type: string, minLength: 1, maxLength: 100, description: Personal data; pseudonymized after gate_pii_retention_days }
        driverLicenseId: { type: string, minLength: 1, maxLength: 32, description: Personal data; pseudonymized after gate_pii_retention_days }
        appointmentId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time, description: Appointment time; required with appointmentId }
        arrivedAt: { type: string, format: date-time, description: Default now; not in the future }
        freeTimeMin: { type: integer, minimum: 0, maximum: 1440, description: 'Carrier detention free time, default 120' }
        toleranceMin: { type: integer, minimum: 0, maximum: 480, description: 'Site gate tolerance, default 60' }
    GateVisit:
      type: object
      required: [id, siteId, direction, carrierScac, trailerNo, driverName, driverLicenseId, walkIn, checkedInAt, freeTimeMin, status, version]
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        direction: { type: string, enum: [INBOUND, OUTBOUND] }
        loadId: { type: string, format: uuid }
        carrierScac: { type: string }
        trailerNo: { type: string }
        sealNo: { type: string, description: Recorded seal }
        driverName: { type: string }
        driverLicenseId: { type: string }
        appointmentId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time }
        walkIn: { type: boolean }
        arrival:
          type: object
          required: [status, deltaMin]
          properties:
            status: { type: string, enum: [ON_TIME, EARLY, LATE] }
            deltaMin: { type: integer }
            code: { type: string, description: TMS-0127 when EARLY or LATE }
        checkedInAt: { type: string, format: date-time }
        checkedOutAt: { type: string, format: date-time }
        freeTimeMin: { type: integer }
        status: { type: string, enum: [IN_YARD, CHECKED_OUT] }
        detention:
          type: object
          required: [dwellMin, detentionMin, hours, charge]
          properties:
            dwellMin: { type: integer }
            detentionMin: { type: integer }
            hours: { type: integer, description: Detention minutes rounded up to whole hours }
            charge: { type: string, description: hours × hourlyRate, to the cent }
            code: { type: string, description: TMS-0126 when detention accrued }
        version: { type: integer }
    GateLogEntry:
      type: object
      required: [id, visitId, kind, occurredAt, recordedBy, detail]
      properties:
        id: { type: string, format: uuid }
        visitId: { type: string, format: uuid }
        kind: { type: string, enum: [CHECK_IN, SEALED, CHECK_OUT, CHECK_OUT_BLOCKED] }
        occurredAt: { type: string, format: date-time }
        recordedBy: { type: string }
        detail: { type: object, additionalProperties: { type: string }, description: No driver PII }
    ScreeningHold:
      type: object
      required: [id, loadId, status, parties, createdBy, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        loadId: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, RELEASED] }
        parties:
          type: array
          description: The latest screening result per party
          items:
            type: object
            required: [role, name, status]
            properties:
              role: { type: string }
              name: { type: string }
              status: { type: string, enum: [CLEAR, POTENTIAL_MATCH, BLOCKED, SCREENING_PENDING, NOT_SCREENED] }
              code: { type: string, enum: [TMS-0133, TMS-0134] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        releasedBy: { type: string }
        releaseReason: { type: string }
        releasedAt: { type: string, format: date-time }
        version: { type: integer }
    RoutePoint:
      type: object
      required: [x, y]
      description: Planar kilometres in a local projection
      properties:
        x: { type: number }
        y: { type: number }
    RouteRequest:
      type: object
      required: [depot, stops, vehicles]
      properties:
        legalEntityId: { type: string, format: uuid, description: "Owning legal entity of the plan; same rules as on a voyage. The request hash is the idempotency key within one legal entity, and the field is not part of the hash." }
        depot: { $ref: '#/components/schemas/RoutePoint' }
        stops:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [id, point, earliest, latest]
            properties:
              id: { type: string, minLength: 1, maxLength: 64 }
              point: { $ref: '#/components/schemas/RoutePoint' }
              earliest: { type: integer, minimum: 0, description: Minutes from route start }
              latest: { type: integer, minimum: 0, maximum: 10080 }
              serviceMin: { type: integer, minimum: 0 }
              weightKg: { type: integer, minimum: 0 }
              volumeL: { type: integer, minimum: 0 }
              pallets: { type: integer, minimum: 0 }
        vehicles:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [id]
            properties:
              id: { type: string, minLength: 1, maxLength: 64 }
              capacityKg: { type: integer, minimum: 0 }
              capacityL: { type: integer, minimum: 0 }
              pallets: { type: integer, minimum: 0 }
              fixedCost: { type: integer, minimum: 0, description: Solver cost weight in whole money units }
              maxRouteMin: { type: integer, minimum: 1, description: 'Default 660 (11 h driving)' }
        speedKmh: { type: number, exclusiveMinimum: 0, maximum: 200, description: Default 60 }
        latenessPerMin: { type: integer, minimum: 0, maximum: 10000, description: 'Soft lateness penalty per minute; default 50, 0 turns it off' }
        timeLimitS: { type: integer, minimum: 5, maximum: 25, description: Default 20 }
    RouteSolution:
      type: object
      required: [routes, dropped]
      properties:
        routes:
          type: array
          items:
            type: object
            required: [vehicleId, stops, distanceKm, endMin]
            properties:
              vehicleId: { type: string }
              stops:
                type: array
                items:
                  type: object
                  required: [stopId, arrivalMin, lateMin]
                  properties:
                    stopId: { type: string }
                    arrivalMin: { type: integer }
                    lateMin: { type: integer }
              distanceKm: { type: number }
              endMin: { type: integer }
        dropped: { type: array, items: { type: string }, description: Stops dropped as infeasible (TMS-0104) }
    RoutePlanSummary:
      type: object
      required: [id, requestHash, stopCount, vehicleCount, routeCount, droppedCount, totalDistanceKm, timeLimitS, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        requestHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        stopCount: { type: integer }
        vehicleCount: { type: integer }
        routeCount: { type: integer, description: Vehicles used }
        droppedCount: { type: integer }
        totalDistanceKm: { type: number }
        timeLimitS: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    RoutePlan:
      allOf:
        - $ref: '#/components/schemas/RoutePlanSummary'
        - type: object
          required: [request, solution, replayed, warnings]
          properties:
            request: { $ref: '#/components/schemas/RouteRequest' }
            solution: { $ref: '#/components/schemas/RouteSolution' }
            replayed: { type: boolean, description: True when the plan stored for the same request was returned }
            warnings:
              type: array
              items:
                type: object
                required: [code, severity, detail]
                properties:
                  code: { type: string, enum: [TMS-0104] }
                  severity: { type: string }
                  detail: { type: string }
    LoadPlanRequest:
      type: object
      required: [trailer, pallets]
      properties:
        trailer:
          type: object
          required: [lengthMm, widthMm, maxHeightMm, maxWeightKg]
          properties:
            lengthMm: { type: integer, minimum: 1 }
            widthMm: { type: integer, minimum: 1 }
            maxHeightMm: { type: integer, minimum: 1 }
            maxWeightKg: { type: integer, minimum: 1 }
            kingpinMm: { type: integer, minimum: 0, description: Front support of the axle estimate from the nose; default 0 }
            axleMm: { type: integer, minimum: 0, description: Rear axle group from the nose; default the trailer length }
        pallets:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [id, lengthMm, widthMm, heightMm, weightKg, stackable]
            properties:
              id: { type: string, minLength: 1, maxLength: 64 }
              lengthMm: { type: integer, minimum: 1 }
              widthMm: { type: integer, minimum: 1 }
              heightMm: { type: integer, minimum: 1 }
              weightKg: { type: integer, minimum: 0 }
              stackable: { type: boolean }
              stopSeq: { type: integer, minimum: 0, description: Stop position on the route; later stops load first }
              maxStackKg: { type: integer, minimum: 0, description: Maximum weight of a stack on this pallet }
    LoadPlan:
      type: object
      required: [placements, unplaced, floorPositionsUsed, lengthUsedMm, layers, totalWeightKg, loadSequence, axle]
      properties:
        placements:
          type: array
          items:
            type: object
            required: [palletIds, xMm, yMm, lengthMm, widthMm, heightMm, weightKg]
            properties:
              palletIds: { type: array, items: { type: string }, description: Bottom to top }
              xMm: { type: integer, description: Across the width from the left wall }
              yMm: { type: integer, description: Along the length from the nose }
              lengthMm: { type: integer }
              widthMm: { type: integer }
              heightMm: { type: integer }
              weightKg: { type: integer }
        unplaced: { type: array, items: { type: string } }
        floorPositionsUsed: { type: integer }
        lengthUsedMm: { type: integer }
        layers: { type: integer, description: Highest stack }
        totalWeightKg: { type: integer }
        loadSequence: { type: array, items: { type: string }, description: Order to load the pallets }
        axle:
          type: object
          required: [kingpinKg, axleKg]
          properties:
            kingpinKg: { type: integer }
            axleKg: { type: integer }
