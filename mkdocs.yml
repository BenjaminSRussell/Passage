# Docs site published to GitHub Pages by .github/workflows/pages.yml.
# Build locally: pip install -r docs/requirements.txt && mkdocs serve
site_name: Passage
site_description: An open-architecture ERP rebuilt from the ground up to replace Dynamics AX/D365 and SAP, in 50 waves.
site_url: https://benjaminsrussell.github.io/Passage/
repo_url: https://github.com/BenjaminSRussell/Passage
repo_name: BenjaminSRussell/Passage
edit_uri: edit/main/docs/
docs_dir: docs

# Tooling, generated inputs and the 50 MB PDF stay in the repo, not on the site.
# PRD-full.md is served as the pre-rendered PRD-full.html instead (4 MB of markdown is too heavy to render as one page).
exclude_docs: |
  ops/tools/
  __pycache__/
  *.py
  *.pyc
  *.json
  PRD-full.md
  PRD-full.pdf
  requirements.txt

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.superfences:
      custom_fences:
        - { name: mermaid, class: mermaid, format: !!python/name:pymdownx.superfences.fence_code_format }

# Many docs link to repo paths outside docs/ (roadmap/, services/, apps/). Those resolve on GitHub,
# not on the site, so report them quietly rather than failing the build.
validation:
  omitted_files: info
  absolute_links: info
  unrecognized_links: info
  links:
    not_found: info
    anchors: info

