apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: receiving-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: passage.receiving.receipt, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.receiving.receipt.dlq, patternType: literal}
        operations: [Write, Describe]
      - resource: {type: group, name: receiving-ers, patternType: literal}
        operations: [Read, Describe]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: passage-receiving-receipt-dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  topicName: passage.receiving.receipt.dlq
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000
