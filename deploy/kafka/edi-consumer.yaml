# The edi outbound consumer (#35, 35-1, `edi consume`, group edi-outbound) sends the 856 or DESADV of fulfillment's asn.issued and of
# the warehouse's shipment.shipped (a shipment that left without a packing slip), and the 810 or INVOIC of billing's invoice.posted to the partners that asked for them, and parks the events it cannot send on
# passage.edi.outbound.dlq. The chart's consumer.kafka.username names this user. Literal ACLs: the user reads only fulfillment's
# asn topic, the warehouse's shipment topic and billing's invoice topic (billing routes its outbox by aggregate, so invoices and credit notes share
# passage.billing.invoice; the consumer skips the other types) and writes only its dead-letter topic. The consumer stays off in
# dev until it is enabled in the edi chart.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: edi-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: passage.fulfillment.asn, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.wms.shipment, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.billing.invoice, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.edi.outbound.dlq, patternType: literal}
        operations: [Write, Describe]
      - resource: {type: group, name: edi-outbound, patternType: literal}
        operations: [Read, Describe]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: passage-edi-outbound-dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  topicName: passage.edi.outbound.dlq
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000
