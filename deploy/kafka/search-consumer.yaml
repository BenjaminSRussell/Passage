# The search index consumer (`search consume`, group search-index) keeps the record index current from the events of
# every searchable record type (services/search/internal/index) and parks what it cannot index on
# passage.search.index.dlq. The chart's consumer.kafka.username names this user. Literal ACLs: the user reads only the
# source topics it subscribes to and writes only its dead-letter topic. A topic added to the subscription needs an
# entry here, or the consumer fails authorization at start. The source topics are produced by the outbox connectors
# (deploy/kafka/connect.yaml); party, product, procurement, production and HR have none yet, so turn the consumer on
# per environment once those exist (services/search/NOT-IMPLEMENTED.md).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: search-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: passage.party.party, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.product.product, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.procurement.purchase_order, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.receiving.receipt, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.receiving.vendorinvoice, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.sales.order, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.fulfillment.shipment, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.billing.invoice, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.production.order, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.hr.worker, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.search.index.dlq, patternType: literal}
        operations: [Write, Describe]
      - resource: {type: group, name: search-index, patternType: literal}
        operations: [Read, Describe]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: passage-search-index-dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  topicName: passage.search.index.dlq
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000
