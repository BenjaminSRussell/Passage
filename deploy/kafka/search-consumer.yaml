# The search index consumer (`search consume`, group search-index) keeps the record index current from the party,
# product and purchase order events and parks what it cannot index on passage.search.index.dlq. The chart's
# consumer.kafka.username names this user. Literal ACLs: the user reads only its three source topics and writes only
# its dead-letter topic. The source topics are produced by outbox connectors for party, product and procurement
# (deploy/kafka/connect.yaml); turn the consumer on per environment once those exist.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: search-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: passage.party.party, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.product.product, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.procurement.po, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.search.index.dlq, patternType: literal}
        operations: [Write, Describe]
      - resource: {type: group, name: search-index, patternType: literal}
        operations: [Read, Describe]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: passage-search-index-dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  topicName: passage.search.index.dlq
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000
