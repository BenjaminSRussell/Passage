apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: debezium
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: passage.platform., patternType: prefix}
        operations: [Create, Describe, Write, DescribeConfigs]
      # Literal on purpose: a new metadata aggregate type routes to a new topic and needs its own ACL entry here.
      - resource: {type: topic, name: passage.metadata.entity, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.receiving.receipt, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.receiving.vendorinvoice, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.receiving.invoiceadjustment, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.receiving.settlement, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.receiving.ersvendor, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.receiving.auditpolicy, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.receiving.erspriceconfirmation, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.receiving.serviceentrysheet, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.eam.downtime, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.eam.workorder, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.eam.counter, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.eam.permit, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.eam.request, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage-connect-, patternType: prefix}
        operations: [Create, Describe, Read, Write, DescribeConfigs]
      - resource: {type: group, name: passage-connect, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: cluster}
        operations: [IdempotentWrite]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: passage-connect
  namespace: kafka
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 4.0.0
  replicas: 2
  bootstrapServers: passage-kafka-bootstrap:9093
  tls:
    trustedCertificates:
      - secretName: passage-cluster-ca-cert
        pattern: "*.crt"
  authentication:
    type: scram-sha-512
    username: debezium
    passwordSecret:
      secretName: debezium
      password: password
  config:
    group.id: passage-connect
    offset.storage.topic: passage-connect-offsets
    config.storage.topic: passage-connect-configs
    status.storage.topic: passage-connect-status
    offset.storage.replication.factor: 3
    config.storage.replication.factor: 3
    status.storage.replication.factor: 3
    config.providers: secrets
    config.providers.secrets.class: io.strimzi.kafka.KubernetesSecretConfigProvider
  # Built from deploy/kafka-connect/Dockerfile by the connect-image job in .github/workflows/ci.yml:
  # Strimzi 0.46.0 / Kafka 4.0.0 plus the Debezium Postgres 3.0.7.Final connector and the
  # passage-cloudevents-enricher SMT. The tag names both versions; bump it with either.
  image: ghcr.io/benjaminsrussell/passage-connect:debezium-3.0.7-enricher-0.1.0
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: outbox-batch
  namespace: kafka
  labels:
    strimzi.io/cluster: passage-connect
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    plugin.name: pgoutput
    database.hostname: postgres.batch.svc
    database.port: 5432
    database.user: ${secrets:kafka/debezium-cdc-batch:username}
    database.password: ${secrets:kafka/debezium-cdc-batch:password}
    database.dbname: passage_platform
    topic.prefix: passage.platform
    slot.name: passage_outbox_batch
    publication.name: passage_outbox_batch
    publication.autocreate.mode: disabled
    table.include.list: public.outbox
    snapshot.mode: initial
    tombstones.on.delete: false
    topic.creation.default.replication.factor: 3
    topic.creation.default.partitions: 12
    topic.creation.default.cleanup.policy: delete
    topic.creation.default.retention.ms: 604800000
    topic.creation.groups: machineevent
    topic.creation.machineevent.include: passage\.manufacturing\.machineevent
    topic.creation.machineevent.partitions: 48
    topic.creation.machineevent.replication.factor: 3
    topic.creation.machineevent.cleanup.policy: delete
    topic.creation.machineevent.retention.ms: 604800000
    transforms: outbox,enrich
    transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
    transforms.outbox.table.field.event.id: id
    transforms.outbox.table.field.event.key: aggregate_id
    transforms.outbox.table.field.event.payload: payload
    transforms.outbox.route.by.field: aggregate_type
    transforms.outbox.route.topic.replacement: passage.platform.${routedByValue}
    transforms.outbox.table.expand.json.payload: true
    transforms.outbox.table.fields.additional.placement: tenant_id:header:tenantid
    transforms.enrich.type: dev.passage.connect.cloudevents.CloudEventsEnricher
    transforms.enrich.source.default: passage
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: false
    producer.override.acks: all
    producer.override.enable.idempotence: true
---
# Topic naming: services/metadata writes aggregate_type "entity" and events.Topic
# maps dev.passage.metadata.entity.published.v1 to passage.metadata.entity, which
# is also the AsyncAPI channel; PRD FR-4.1 and AC-4.5 use the same name.
# Outbox payloads are complete CloudEvents (platform/go/outbox): table.expand.json.payload
# emits the JSON object, the enrich SMT (deploy/kafka-connect/enricher) fills tenantid
# from the tenantid header (outbox.tenant_id) and legalentityid from the payload when
# absent, rejects a non-conforming envelope, and adds content-type and ce_* headers;
# JsonConverter serializes it.
# Config keys: https://debezium.io/documentation/reference/stable/transformations/outbox-event-router.html
# The key is aggregate_id (FR-4.1): pgoutput on PG16 does not replicate generated
# columns such as batch's partition_key.
# snapshot.mode initial needs a CDC role that bypasses RLS on outbox.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: outbox-metadata
  namespace: kafka
  labels:
    strimzi.io/cluster: passage-connect
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    plugin.name: pgoutput
    database.hostname: postgres.metadata.svc
    database.port: 5432
    database.user: ${secrets:kafka/debezium-cdc-metadata:username}
    database.password: ${secrets:kafka/debezium-cdc-metadata:password}
    database.dbname: passage_metadata
    topic.prefix: passage.metadata
    slot.name: passage_outbox_metadata
    publication.name: passage_outbox_metadata
    publication.autocreate.mode: disabled
    table.include.list: public.outbox
    snapshot.mode: initial
    tombstones.on.delete: false
    topic.creation.default.replication.factor: 3
    topic.creation.default.partitions: 12
    topic.creation.default.cleanup.policy: delete
    topic.creation.default.retention.ms: 604800000
    transforms: outbox,enrich
    transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
    transforms.outbox.table.field.event.id: id
    transforms.outbox.table.field.event.key: aggregate_id
    transforms.outbox.table.field.event.payload: payload
    transforms.outbox.route.by.field: aggregate_type
    transforms.outbox.route.topic.replacement: passage.metadata.${routedByValue}
    transforms.outbox.table.expand.json.payload: true
    transforms.outbox.table.fields.additional.placement: tenant_id:header:tenantid
    transforms.enrich.type: dev.passage.connect.cloudevents.CloudEventsEnricher
    transforms.enrich.source.default: passage
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: false
    producer.override.acks: all
    producer.override.enable.idempotence: true
---
# Receiving writes aggregate_type "receipt" (and invoice, settlement, ...) to its outbox; events.Topic maps
# dev.passage.receiving.receipt.posted.v1 to passage.receiving.receipt, the topic the receipt.posted consumer reads.
# snapshot.mode no_data: pgoutput streaming ignores RLS, so the CDC role needs neither BYPASSRLS nor a snapshot read of the forced-RLS outbox.
# The debezium user's ACLs are literal per receiving aggregate_type (a new one needs an entry above) and never cover passage.receiving.receipt.dlq.
# debezium_cdc has REPLICATION, which can decode any database it may connect to; the dev Postgres init revokes CONNECT from PUBLIC so it reaches only passage_receiving.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: outbox-receiving
  namespace: kafka
  labels:
    strimzi.io/cluster: passage-connect
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    plugin.name: pgoutput
    database.hostname: postgres.hello-ledger.svc
    database.port: 5432
    database.user: ${secrets:kafka/debezium-cdc-receiving:username}
    database.password: ${secrets:kafka/debezium-cdc-receiving:password}
    database.dbname: passage_receiving
    topic.prefix: passage.receiving
    slot.name: passage_outbox_receiving
    publication.name: passage_outbox_receiving
    publication.autocreate.mode: disabled
    table.include.list: public.outbox
    snapshot.mode: no_data
    tombstones.on.delete: false
    topic.creation.default.replication.factor: 3
    topic.creation.default.partitions: 12
    topic.creation.default.cleanup.policy: delete
    topic.creation.default.retention.ms: 604800000
    transforms: outbox,enrich
    transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
    transforms.outbox.table.field.event.id: id
    transforms.outbox.table.field.event.key: aggregate_id
    transforms.outbox.table.field.event.payload: payload
    transforms.outbox.route.by.field: aggregate_type
    transforms.outbox.route.topic.replacement: passage.receiving.${routedByValue}
    transforms.outbox.table.expand.json.payload: true
    transforms.outbox.table.fields.additional.placement: tenant_id:header:tenantid
    transforms.enrich.type: dev.passage.connect.cloudevents.CloudEventsEnricher
    transforms.enrich.source.default: passage
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: false
    producer.override.acks: all
    producer.override.enable.idempotence: true
---
# EAM writes aggregate_type downtime, workorder, counter, permit and request to its outbox; the route below makes each one
# passage.eam.<aggregate_type>. dev.passage.eam.downtime.recorded.v1 is the only downtime aggregate event, so scheduling
# reads passage.eam.downtime alone. The ACLs above are literal per aggregate_type (a new one needs an entry) and never
# cover passage.eam.downtime.dlq.
# snapshot.mode no_data: pgoutput streaming ignores RLS, so the CDC role needs neither BYPASSRLS nor a snapshot read of the forced-RLS outbox.
# debezium_cdc_eam has REPLICATION; the dev Postgres init grants it CONNECT on passage_eam only and revokes CONNECT from PUBLIC there.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: outbox-eam
  namespace: kafka
  labels:
    strimzi.io/cluster: passage-connect
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    plugin.name: pgoutput
    database.hostname: postgres.hello-ledger.svc
    database.port: 5432
    database.user: ${secrets:kafka/debezium-cdc-eam:username}
    database.password: ${secrets:kafka/debezium-cdc-eam:password}
    database.dbname: passage_eam
    topic.prefix: passage.eam
    slot.name: passage_outbox_eam
    publication.name: passage_outbox_eam
    publication.autocreate.mode: disabled
    table.include.list: public.outbox
    snapshot.mode: no_data
    tombstones.on.delete: false
    topic.creation.default.replication.factor: 3
    topic.creation.default.partitions: 12
    topic.creation.default.cleanup.policy: delete
    topic.creation.default.retention.ms: 604800000
    transforms: outbox,enrich
    transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
    transforms.outbox.table.field.event.id: id
    transforms.outbox.table.field.event.key: aggregate_id
    transforms.outbox.table.field.event.payload: payload
    transforms.outbox.route.by.field: aggregate_type
    transforms.outbox.route.topic.replacement: passage.eam.${routedByValue}
    transforms.outbox.table.expand.json.payload: true
    transforms.outbox.table.fields.additional.placement: tenant_id:header:tenantid
    transforms.enrich.type: dev.passage.connect.cloudevents.CloudEventsEnricher
    transforms.enrich.source.default: passage
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: false
    producer.override.acks: all
    producer.override.enable.idempotence: true
