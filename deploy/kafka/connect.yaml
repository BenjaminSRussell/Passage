apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: debezium
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: passage.platform., patternType: prefix}
        operations: [Create, Describe, Write, DescribeConfigs]
      # Literal on purpose: a new metadata aggregate type routes to a new topic and needs its own ACL entry here.
      - resource: {type: topic, name: passage.metadata.entity, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.receiving.receipt, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.receiving.vendorinvoice, patternType: literal}
        operations: [Create, Describe, Write, DescribeConfigs]
      - resource: {type: topic, name: passage.receiving.invoiceadjustment, patternType: literal}
