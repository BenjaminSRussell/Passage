# Fulfillment routes by event type, as sales does: packing-slip, pick, container, ASN and tracking events are written
# under aggregate_type "shipment" and the settings under snake_case aggregate types (drop_ship, warehouse_setting, ...),
# while the AsyncAPI channels (services/fulfillment/events/asyncapi.yaml) and events.Topic use the type's entity.
# packingslip.posted and packingslip.cancelled land on passage.fulfillment.packingslip, read by the inventory postings
# consumer (deploy/kafka/inventory-consumer.yaml). The ACLs above are literal per AsyncAPI channel (a new entity
# needs an entry).
# snapshot.mode no_data: pgoutput streaming ignores RLS, so the CDC role needs neither BYPASSRLS nor a snapshot read of the forced-RLS outbox.
# debezium_cdc_fulfillment has REPLICATION; the dev Postgres init grants it CONNECT on passage_fulfillment only and revokes CONNECT from PUBLIC there.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: outbox-fulfillment
  namespace: kafka
  labels:
    strimzi.io/cluster: passage-connect
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    plugin.name: pgoutput
    database.hostname: postgres.hello-ledger.svc
    database.port: 5432
    database.user: ${secrets:kafka/debezium-cdc-fulfillment:username}
    database.password: ${secrets:kafka/debezium-cdc-fulfillment:password}
    database.dbname: passage_fulfillment
    topic.prefix: passage.fulfillment
    slot.name: passage_outbox_fulfillment
    publication.name: passage_outbox_fulfillment
    publication.autocreate.mode: disabled
    table.include.list: public.outbox
    snapshot.mode: no_data
    tombstones.on.delete: false
    topic.creation.default.replication.factor: 3
    topic.creation.default.partitions: 12
    topic.creation.default.cleanup.policy: delete
    topic.creation.default.retention.ms: 604800000
    transforms: outbox,enrich
    transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
    transforms.outbox.table.field.event.id: id
    transforms.outbox.table.field.event.key: aggregate_id
    transforms.outbox.table.field.event.payload: payload
    transforms.outbox.route.by.field: type
    transforms.outbox.route.topic.regex: 'dev\.passage\.fulfillment\.(?<routedByValue>[a-z][a-z0-9]*)\.[a-z][a-z0-9]*\.v[0-9]+'
    transforms.outbox.route.topic.replacement: passage.fulfillment.${routedByValue}
    transforms.outbox.table.expand.json.payload: true
    transforms.outbox.table.fields.additional.placement: tenant_id:header:tenantid
    transforms.enrich.type: dev.passage.connect.cloudevents.CloudEventsEnricher
    transforms.enrich.source.default: passage
    transforms.enrich.dataschema.template: https://schemas.passage.dev/{type}.json
    key.converter: org.apache.kafka.connect.storage.StringConverter
