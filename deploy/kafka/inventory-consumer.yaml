# The inventory postings consumer (#480, `inventory consume`, group inventory-postings) books receiving's
# receipt.posted / receipt.corrected, sales' orderprogress.recorded and fulfillment's packingslip.cancelled, and parks
# what it cannot book on passage.inventory.postings.dlq. The chart's consumer.kafka.username names this user.
# Literal ACLs: the user reads only its three source topics and writes only its dead-letter topic. The source topics
# are created by the outbox-receiving, outbox-sales and outbox-fulfillment connectors (deploy/kafka/connect.yaml).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: inventory-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: passage.receiving.receipt, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.sales.orderprogress, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.fulfillment.packingslip, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.inventory.postings.dlq, patternType: literal}
        operations: [Write, Describe]
      - resource: {type: group, name: inventory-postings, patternType: literal}
        operations: [Read, Describe]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: passage-inventory-postings-dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  topicName: passage.inventory.postings.dlq
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000
