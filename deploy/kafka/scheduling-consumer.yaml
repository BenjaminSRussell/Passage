apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: scheduling-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: passage.eam.downtime, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.eam.downtime.dlq, patternType: literal}
        operations: [Write, Describe]
      - resource: {type: group, name: scheduling-downtime, patternType: literal}
        operations: [Read, Describe]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: passage-eam-downtime-dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  topicName: passage.eam.downtime.dlq
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000
