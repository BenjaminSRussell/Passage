# workflow-ts consumes transport's load.released and tender outcomes to start and signal tenderWorkflow (#426), and
# budgeting's plan.submitted to start budgetPlanWorkflow (#38). The topics are created by the outbox-transport and
# outbox-budgeting connectors (deploy/kafka/connect.yaml); a refused event goes to the one dead-letter topic below.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: workflow-ts-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: passage.tms.load, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.tms.tender, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.budget.plan, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.workflow.tender.dlq, patternType: literal}
        operations: [Write, Describe]
      - resource: {type: group, name: workflow-ts-tender, patternType: literal}
        operations: [Read, Describe]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: passage-workflow-tender-dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  topicName: passage.workflow.tender.dlq
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000
