apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-sidecar-config
data:
  config.yaml: |
    services:
      identity:
        url: http://identity:8080
        credentials:
          bearer:
            token_path: /etc/passage/opa-bundle/token
    bundles:
      authz:
        service: identity
        resource: /v1/identity/policy/bundle
        persist: true
        polling:
          min_delay_seconds: 10
          max_delay_seconds: 20
        signing:
          keyid: identity-policy
    keys:
      identity-policy:
        algorithm: RS256
        key: /etc/passage/opa-bundle/public.pem
    decision_logs:
      console: true
