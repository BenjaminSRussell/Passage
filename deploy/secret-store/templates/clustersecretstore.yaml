{{- $g := .Values.global | default dict }}
{{- $kv := .Values.azureKeyVault }}
{{- $suffix := required "global.endpoints.keyVaultSuffix is required: render with deploy/cloud-profiles/values/<profile>.yaml" (($g.endpoints | default dict).keyVaultSuffix) }}
{{- $cloud := $g.cloudName | default .Values.cloudName }}
{{- $env := dict "AzurePublic" "PublicCloud" "AzureUSGovernment" "USGovernmentCloud" "AzureChinaCloud" "ChinaCloud" }}
{{- if not (hasKey $env $cloud) }}{{ fail (printf "unknown cloud %q" $cloud) }}{{ end }}
{{- if .Values.azureKeyVault.createServiceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $kv.serviceAccount }}
  namespace: {{ $kv.serviceAccountNamespace }}
  annotations:
    azure.workload.identity/client-id: {{ required "azureKeyVault.workloadIdentityClientId is required" $kv.workloadIdentityClientId | quote }}
  labels:
    azure.workload.identity/use: "true"
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
  labels:
    app.kubernetes.io/name: passage-secret-store
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ printf "https://%s.%s" (required "azureKeyVault.name is required" $kv.name) $suffix | quote }}
      tenantId: {{ required "azureKeyVault.tenantId is required" $kv.tenantId | quote }}
      environmentType: {{ get $env $cloud }}
      serviceAccountRef:
        name: {{ $kv.serviceAccount }}
        namespace: {{ $kv.serviceAccountNamespace }}
