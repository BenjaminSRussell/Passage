---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: passage-connect-read-debezium-cdc
  namespace: kafka
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [debezium-cdc-metadata, debezium-cdc-batch, debezium-cdc-receiving]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: passage-connect-read-debezium-cdc
  namespace: kafka
subjects:
  - kind: ServiceAccount
    name: passage-connect-connect
    namespace: kafka
roleRef:
  kind: Role
  name: passage-connect-read-debezium-cdc
  apiGroup: rbac.authorization.k8s.io
