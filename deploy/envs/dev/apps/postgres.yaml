apiVersion: v1
kind: Namespace
metadata:
  name: hello-ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: hello-ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  10-app-role.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<SQL
    CREATE ROLE passage_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD '$APP_PASSWORD';
    GRANT ALL ON SCHEMA public TO passage_app;
    SQL
  20-receiving-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<SQL
    SELECT 'CREATE DATABASE passage_receiving' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'passage_receiving')\gexec
    GRANT CONNECT, CREATE ON DATABASE passage_receiving TO passage_app;
    \c passage_receiving
    GRANT ALL ON SCHEMA public TO passage_app;
    SQL
  30-fx-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<SQL
    SELECT 'CREATE DATABASE passage_fx' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'passage_fx')\gexec
    GRANT CONNECT, CREATE ON DATABASE passage_fx TO passage_app;
    \c passage_fx
    GRANT ALL ON SCHEMA public TO passage_app;
    SQL
  40-org-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<SQL
    SELECT 'CREATE DATABASE passage_org' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'passage_org')\gexec
    GRANT CONNECT, CREATE ON DATABASE passage_org TO passage_app;
    \c passage_org
    GRANT ALL ON SCHEMA public TO passage_app;
    SQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: hello-ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
      annotations:
        # initdb scripts run only on an empty PGDATA; bump this whenever postgres-init changes so the pod restarts
        passage.dev/init-rev: "4"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - { name: POSTGRES_USER, value: passage }
            - { name: POSTGRES_DB, value: hello }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: hello-ledger-db, key: POSTGRES_PASSWORD }
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: hello-ledger-db, key: APP_PASSWORD }
          ports:
            - { name: pg, containerPort: 5432 }
          readinessProbe:
            exec:
              command: [pg_isready, -U, passage, -d, hello]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: postgres-init, defaultMode: 365 }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: hello-ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - { name: pg, port: 5432, targetPort: pg }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: hello-ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hello-ledger
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: receiving
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: org
      ports:
        - { protocol: TCP, port: 5432 }
