apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metadata-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/BenjaminSRussell/Passage.git
    targetRevision: main
    path: deploy/postgres
    helm:
      releaseName: metadata
      valuesObject:
        database: passage_metadata
        clientApps: [metadata]
        externalSecret:
          environment: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: metadata
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
---
