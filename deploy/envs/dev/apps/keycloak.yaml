apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/BenjaminSRussell/Passage.git
    targetRevision: main
    path: deploy/keycloak
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-ledger
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
