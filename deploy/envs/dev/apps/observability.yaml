apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/BenjaminSRussell/Passage.git
    targetRevision: main
    path: deploy/observability/charts/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # PrometheusRule / ServiceMonitor CRDs come from the cluster's monitoring stack.
      - SkipDryRunOnMissingResource=true
