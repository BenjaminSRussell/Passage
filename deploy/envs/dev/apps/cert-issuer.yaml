apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: passage-selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: passage-local-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  isCA: true
  commonName: passage-local-ca
  secretName: passage-local-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: passage-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: passage-local-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ca:
    secretName: passage-local-ca
