apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.8
          args: ["start", "--import-realm", "--http-enabled=true", "--proxy-headers=xforwarded"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - { name: KC_HTTP_PORT, value: "8080" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_HOSTNAME, value: "https://keycloak.passage.example.invalid" }
            - { name: KC_HOSTNAME_STRICT, value: "true" }
            - { name: KC_DB, value: postgres }
            - name: KC_DB_URL
              valueFrom: { secretKeyRef: { name: keycloak-db, key: url } }
            - name: KC_DB_USERNAME
              valueFrom: { secretKeyRef: { name: keycloak-db, key: username } }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-db, key: password } }
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
          startupProbe:
            httpGet: { path: /health/started, port: management }
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: management }
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "1", memory: 1536Mi }
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm-passage
