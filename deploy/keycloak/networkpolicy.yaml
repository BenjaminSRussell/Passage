apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: passage-api
              gateway.envoyproxy.io/owning-gateway-namespace: hello-ledger
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: identity
      ports:
        - { protocol: TCP, port: 8080 }
