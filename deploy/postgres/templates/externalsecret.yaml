{{- if .Values.externalSecret.enabled }}
{{- $prefix := replace "{env}" (required "externalSecret.environment is required" .Values.externalSecret.environment) .Values.externalSecret.pathPrefix }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "outbox-postgres.secretName" . }}
  labels:
    app.kubernetes.io/name: postgres
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: {{ include "outbox-postgres.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ include "passage.secretKey" (dict "root" $ "key" (printf "%s/%s-postgres/postgres-password" $prefix .Release.Name)) }}
        {{- include "passage.secretProperty" $ | nindent 8 }}
    - secretKey: APP_PASSWORD
      remoteRef:
        key: {{ include "passage.secretKey" (dict "root" $ "key" (printf "%s/%s-postgres/app-password" $prefix .Release.Name)) }}
        {{- include "passage.secretProperty" $ | nindent 8 }}
    {{- if .Values.cdc.enabled }}
    - secretKey: CDC_PASSWORD
      remoteRef:
        key: {{ include "passage.secretKey" (dict "root" $ "key" (printf "%s/%s-postgres/cdc-password" $prefix .Release.Name)) }}
        {{- include "passage.secretProperty" $ | nindent 8 }}
    {{- end }}
{{- end }}
