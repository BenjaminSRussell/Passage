{{- if .Values.externalSecret.enabled }}
{{- $prefix := replace "{env}" (required "externalSecret.environment is required" .Values.externalSecret.environment) .Values.externalSecret.pathPrefix }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "outbox-postgres.secretName" . }}
  labels:
    app.kubernetes.io/name: postgres
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: {{ include "outbox-postgres.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: {{ $prefix }}/{{ .Release.Name }}-postgres/postgres-password, property: value }
    - secretKey: APP_PASSWORD
      remoteRef: { key: {{ $prefix }}/{{ .Release.Name }}-postgres/app-password, property: value }
    - secretKey: CDC_PASSWORD
      remoteRef: { key: {{ $prefix }}/kafka/debezium-cdc/password, property: value }
{{- end }}
