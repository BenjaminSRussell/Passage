apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
  labels:
    app.kubernetes.io/name: postgres
data:
  10-roles.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<SQL
    CREATE ROLE passage_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD '$APP_PASSWORD';
    CREATE ROLE {{ .Values.cdc.role }} LOGIN NOSUPERUSER REPLICATION BYPASSRLS PASSWORD '$CDC_PASSWORD';
    GRANT ALL ON SCHEMA public TO passage_app;
    SQL
