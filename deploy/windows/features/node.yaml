# Installed to %ProgramData%\Passage\conf.d\node.yaml by the "TypeScript services" MSI feature. The server merges it into passage.yaml.
# {install} and {data} expand to the install and data directories, {port} and {adminPort} to the ports the supervisor gives the service.
# Each service is a Node process under the private runtime in the install directory (ADR-0004: no Node single executable applications).
# The bundles under runtime\node\apps\ are built by deploy/windows/scripts/Build-ServiceBundles.ps1 (windows-msi workflow), which also
# runs Test-ServiceBundles.ps1 against them: the paths below are the ones that script publishes and tests.
services:
  # The Temporal worker and its decision route. It reads HTTP_PORT, not HTTP_ADDR, and answers /readyz on that one port.
  # TEMPORAL_ADDRESS and TEMPORAL_NAMESPACE come from temporalHostPort and temporalNamespace in passage.yaml.
  - name: workflow-ts
    exe: "{install}/runtime/node/node.exe"
    args: ["{install}/runtime/node/apps/workflow-ts/dist/worker.js"]
    env:
      HTTP_PORT: "{port}"
    feature: node
    optional: true
    noDb: true
    singlePort: true
  # The agent runtime. It reads HTTP_ADDR and ADMIN_ADDR (admin /readyz) and needs its own database (agent runs, budgets, the
  # approval inbox and the outbox); `passage-server migrate` applies runtime\node\apps\agents-ts\migrations.
  - name: agents-ts
    exe: "{install}/runtime/node/node.exe"
    args: ["{install}/runtime/node/apps/agents-ts/dist/main.js"]
    feature: node
    optional: true
