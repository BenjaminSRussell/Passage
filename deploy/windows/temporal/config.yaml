# Default Temporal server configuration laid down by PassageTemporal.msi in %ProgramData%\PassageTemporal\config\passage.yaml.
# Edit the Postgres connection (a Temporal-owned database, not a Passage service database) before the first start, then
# create the schema with temporal-sql-tool (docs/ops/windows-install.md, Temporal). Never use "temporal server start-dev" in production.
log:
  stdout: false
  level: info
  outputFile: C:\ProgramData\PassageTemporal\logs\temporal.log
persistence:
  defaultStore: default
  visibilityStore: visibility
  numHistoryShards: 4
  datastores:
    default:
      sql:
        pluginName: postgres12
        databaseName: temporal
        connectAddr: 127.0.0.1:5432
        connectProtocol: tcp
        user: temporal
        password: CHANGE_ME
    visibility:
      sql:
        pluginName: postgres12
        databaseName: temporal_visibility
        connectAddr: 127.0.0.1:5432
        connectProtocol: tcp
        user: temporal
        password: CHANGE_ME
global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: 127.0.0.1
services:
  frontend:
    rpc: {grpcPort: 7233, membershipPort: 6933, bindOnLocalHost: true}
  matching:
    rpc: {grpcPort: 7235, membershipPort: 6935, bindOnLocalHost: true}
  history:
    rpc: {grpcPort: 7234, membershipPort: 6934, bindOnLocalHost: true}
  worker:
    rpc: {grpcPort: 7239, membershipPort: 6939, bindOnLocalHost: true}
clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: active
  currentClusterName: active
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: frontend
      rpcAddress: 127.0.0.1:7233
dcRedirectionPolicy:
  policy: noop
archival:
  history: {state: disabled}
  visibility: {state: disabled}
namespaceDefaults:
  archival:
    history: {state: disabled}
    visibility: {state: disabled}
