apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gatewayclass.yaml
  - gateway.yaml
  - jwks-configmap.yaml
  - httproutes.yaml
  - clienttrafficpolicy.yaml
  - securitypolicy.yaml
  - backendtrafficpolicy.yaml
  # AS2 edge for trading partners (#483): a Gateway of its own, outside the JWT SecurityPolicy.
  - as2-gateway.yaml
  - as2-certificate.yaml
  - as2-httproute.yaml
  - as2-clienttrafficpolicy.yaml
  - as2-backendtrafficpolicy.yaml
  # Plant edge for iot-edge connectors (#25): a Gateway of its own, mTLS with the edge CA, outside the JWT SecurityPolicy.
  - edge-gateway.yaml
  - edge-certificate.yaml
  - edge-httproute.yaml
  - edge-clienttrafficpolicy.yaml
