apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gatewayclass.yaml
  - gateway.yaml
  - jwks-configmap.yaml
  - httproutes.yaml
  - clienttrafficpolicy.yaml
  - securitypolicy.yaml
  - backendtrafficpolicy.yaml
  # AS2 edge for trading partners (#483): a Gateway of its own, outside the JWT SecurityPolicy.
  - as2-gateway.yaml
  - as2-certificate.yaml
  - as2-httproute.yaml
  - as2-clienttrafficpolicy.yaml
  - as2-backendtrafficpolicy.yaml
  # Region health edge (PSG-50, OPS-1703): GET /healthz/region without a JWT, a Gateway of its own.
  - region-gateway.yaml
