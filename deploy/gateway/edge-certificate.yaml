# TLS for the plant edge: the connectors' trust store is the CA of the shop floor service's chart (edgePki), so the server
# certificate may come from the local CA in dev and a public issuer in stage and prod. ECDSA: the connectors are Go.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: passage-edge-tls
  namespace: hello-ledger
spec:
  secretName: passage-edge-tls
  dnsNames:
    - edge.dev.passage.dev
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: passage-local-ca
