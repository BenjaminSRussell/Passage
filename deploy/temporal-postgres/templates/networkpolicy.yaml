apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - { protocol: TCP, port: 5432 }
