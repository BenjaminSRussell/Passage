{{- $prefix := replace "{env}" (required "externalSecret.environment is required" .Values.externalSecret.environment) .Values.externalSecret.pathPrefix }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-database
  labels:
    app.kubernetes.io/name: temporal-postgres
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: temporal-database
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ include "passage.secretKey" (dict "root" $ "key" (printf "%s/temporal-postgres/password" $prefix)) }}
        {{- include "passage.secretProperty" $ | nindent 8 }}
