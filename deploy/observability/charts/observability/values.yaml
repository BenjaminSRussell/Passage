grafana:
  dashboardFolder: passage-slo
tempo:
  endpoint: http://tempo.observability.svc:3200
loki:
  endpoint: http://loki.observability.svc:3100
prometheus:
  endpoint: http://prometheus.observability.svc:9090
pagerDuty:
  enabled: true
  # Events API endpoint. Rendered explicitly so the egress allowlist test sees it; cloud profiles without PagerDuty in
  # their allowlist (global.pagerDutyAllowed false) disable this receiver.
  url: https://events.pagerduty.com/v2/enqueue
  routingKeySecret: pagerduty
  routingKeyKey: routing-key
  severity: error
# Alert receiver inside the boundary (#602). Rendered instead of PagerDuty when the cloud profile has none in its egress
# allowlist (gcc, gcc-high, dod, china, and the eu-data-boundary and hipaa overlays), or when enabled here. Point url at a
# cluster-internal bridge or an in-boundary endpoint such as an Azure Monitor action group webhook; keep the bearer token
# in the Secret named by tokenSecret (file credentials, never the ConfigMap).
alertWebhook:
  enabled: false
  url: http://alert-bridge.observability.svc:8080/alerts
  tokenSecret: alert-webhook
  tokenKey: token
slo:
  availability: "99.9"
  latencyP95Ms: 50
  errorRate: "0.1"
