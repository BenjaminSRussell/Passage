apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-stack
  labels:
    app.kubernetes.io/name: observability
data:
  tempo.yaml: |-
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            http:
            grpc:
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
  loki.yaml: |-
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /var/loki
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
  prometheus.yaml: |-
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: passage-services
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: "(numbering|audit|org|party|identity)"
            action: keep
  endpoints.env: |-
    GRAFANA_TEMPO={{ .Values.tempo.endpoint }}
    GRAFANA_LOKI={{ .Values.loki.endpoint }}
    GRAFANA_PROM={{ .Values.prometheus.endpoint }}
