{{- if include "passage-mr.backsUp" . }}
# Continuous WAL archiving plus scheduled base backups to object storage through the
# CNPG barman-cloud plugin (PITR, RPO target failover.rpoTargetSeconds). A PASSIVE
# replica cluster does not archive; it starts after promotion, when the region is
# rendered as PRIMARY. Restore: tools/tenant-restore, docs/ops/runbooks/backup-drill-failure.md.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ include "passage-mr.backupStore" . }}
  namespace: {{ .Values.region.namespace }}
  labels:
    {{- include "passage-mr.labels" . | nindent 4 }}
spec:
  retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}
  configuration:
    {{- if include "passage-mr.azureBlob" . }}
    destinationPath: {{ default (include "passage-mr.azureDestination" .) .Values.backup.destinationPath | quote }}
    {{- if .Values.backup.azure.useWorkloadIdentity }}
    azureCredentials:
      inheritFromAzureAD: true
    {{- else }}
    azureCredentials:
      storageAccount:
        name: {{ .Values.backup.credentialsSecret }}
        key: AZURE_STORAGE_ACCOUNT
      storageKey:
        name: {{ .Values.backup.credentialsSecret }}
        key: AZURE_STORAGE_KEY
    {{- end }}
    {{- else }}
    destinationPath: {{ default (printf "s3://passage-pg-backups-%s/" .Values.region.id) .Values.backup.destinationPath | quote }}
    {{- with .Values.backup.endpointURL }}
    endpointURL: {{ . | quote }}
    {{- end }}
    s3Credentials:
      accessKeyId:
        name: {{ .Values.backup.credentialsSecret }}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ .Values.backup.credentialsSecret }}
        key: ACCESS_SECRET_KEY
    {{- end }}
    wal:
      compression: {{ .Values.backup.compression }}
    data:
      compression: {{ .Values.backup.compression }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.postgres.clusterName }}-daily
  namespace: {{ .Values.region.namespace }}
  labels:
    {{- include "passage-mr.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  backupOwnerReference: self
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: {{ .Values.postgres.clusterName }}
{{- end }}
