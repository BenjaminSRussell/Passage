# Region file: northeurope is PASSIVE (CNPG replica cluster and MirrorMaker 2 target) in the EU Azure pair. `passage-ops
# failover --to northeurope` sets role PRIMARY here, role FENCED in westeurope.yaml and swaps mm2.sourceAlias/targetAlias in
# both files (docs/ops/runbooks/failover.md). Its backup block is ready for the day it is promoted: the storage account
# is in this region, so a failover never moves backups out of the EU.
region:
  id: northeurope
  role: PASSIVE
  provider: aks
  namespace: passage-data

postgres:
  primary:
    host: passage-pg-rw.westeurope.passage.internal

backup:
  store: azure-blob
  azure:
    storageAccount: passagepgbkpnortheurope
    storageAccountRegion: northeurope
    container: pg-backups

objectStore:
  region: northeurope

kafka:
  localAlias: northeurope
  localBootstrap: passage-kafka-bootstrap.kafka.svc:9093
  remoteAlias: westeurope
  remoteBootstrap: passage-kafka-bootstrap.kafka.passage-westeurope.internal:9093

mm2:
  sourceAlias: westeurope
  targetAlias: northeurope
